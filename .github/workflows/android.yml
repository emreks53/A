name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          # Varsayılan "tools platform-tools"; yeni cmdline-tools'ta "tools" paketi yok ve kurulum düşüyor.
          # Derleme için gereken platform ve build-tools'u Gradle kendisi indirir.
          packages: platform-tools
      - run: npm ci
      - run: npm run build
      - run: node scripts/yerel-paket.mjs
      - run: npx cap sync android
      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kenz-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kenz-debug-apk
          path: kenz-debug.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kenz-debug.apk
