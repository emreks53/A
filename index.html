<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nur-u Hakikat</title>
    <meta name="description" content="Güneşten daha parlak ve cennet gibi güzel ve saadet-i ebediye gibi şirin hakikatler." />
    <meta name="theme-color" content="#5AA2EC" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nur-u Hakikat" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nur-u Hakikat" />
    <meta property="og:description" content="Güneşten daha parlak ve cennet gibi güzel ve saadet-i ebediye gibi şirin hakikatler." />
    <meta property="og:image" content="https://emreks53.github.io/A/og-image.png" />
    <link rel="icon" href="icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <div class="app" id="app">
      <picture class="bg" aria-hidden="true">
        <source
          media="(min-aspect-ratio: 4/5)"
          type="image/avif"
          srcset="/src/assets/bg/bg-wide-1280.avif 1280w, /src/assets/bg/bg-wide-2560.avif 2560w"
          sizes="max(100vw, 139vh)"
        />
        <source
          media="(min-aspect-ratio: 4/5)"
          type="image/webp"
          srcset="/src/assets/bg/bg-wide-1280.webp 1280w, /src/assets/bg/bg-wide-2560.webp 2560w"
          sizes="max(100vw, 139vh)"
        />
        <source
          media="(min-aspect-ratio: 4/5)"
          srcset="/src/assets/bg/bg-wide-1280.jpg 1280w, /src/assets/bg/bg-wide-2560.jpg 2560w"
          sizes="max(100vw, 139vh)"
        />
        <source
          type="image/avif"
          srcset="/src/assets/bg/bg-portrait-854.avif 854w, /src/assets/bg/bg-portrait-1708.avif 1708w"
          sizes="max(100vw, 46.4vh)"
        />
        <source
          type="image/webp"
          srcset="/src/assets/bg/bg-portrait-854.webp 854w, /src/assets/bg/bg-portrait-1708.webp 1708w"
          sizes="max(100vw, 46.4vh)"
        />
        <img
          class="bg__img"
          src="/src/assets/bg/bg-portrait-854.jpg"
          srcset="/src/assets/bg/bg-portrait-854.jpg 854w, /src/assets/bg/bg-portrait-1708.jpg 1708w"
          sizes="max(100vw, 46.4vh)"
          alt=""
          decoding="async"
          fetchpriority="high"
        />
      </picture>

      <main class="views">
        <section class="view view--ana" id="view-ana" data-view="ana" aria-label="Nur-u Hakikat">
          <h1 class="visually-hidden" tabindex="-1">Nur-u Hakikat</h1>
          <p class="quote">
            <span class="quote__line">Güneşten daha parlak</span>
            <span class="quote__line">ve cennet gibi güzel</span>
            <span class="quote__line">ve saadet-i ebediye gibi</span>
            <span class="quote__line">şirin hakikatler</span>
          </p>
        </section>

        <section class="view view--kenz" id="view-kenz" data-view="kenz" aria-labelledby="kenz-baslik" hidden>
          <div class="kenz" id="kenz-kaydirma"></div>
        </section>

        <section class="view view--oku" id="view-oku" data-view="oku" aria-label="Oku" hidden></section>

        <section class="view view--gunes" id="view-gunes" data-view="gunes" aria-label="Güneş" hidden>
          <div class="safak" aria-hidden="true"></div>
          <div class="gunes">
            <svg class="gunes__simge" viewBox="0 0 84 84" aria-hidden="true">
              <defs>
                <radialGradient id="gunes-disk" cx="0.42" cy="0.38" r="0.7">
                  <stop offset="0" stop-color="#FFE4B0" />
                  <stop offset="1" stop-color="#F3B866" />
                </radialGradient>
              </defs>
              <g stroke="#FFD99A" stroke-width="4.2" stroke-linecap="round" opacity=".95">
                <path d="M42 13.85V4.4M42 70.15v9.45M13.85 42H4.4M70.15 42h9.45M22.09 22.09l-6.68-6.68M61.91 22.09l6.68-6.68M22.09 61.91l-6.68 6.68M61.91 61.91l6.68 6.68" />
              </g>
              <circle cx="42" cy="42" r="21.4" fill="url(#gunes-disk)" />
            </svg>
            <p class="gunes__etiket">Yakında</p>
            <h1 class="gunes__ad" tabindex="-1">Güneş</h1>
            <span class="gunes__cizgi" aria-hidden="true"></span>
            <p class="gunes__alt">Bu bölüm özenle hazırlanıyor.</p>
          </div>
        </section>
      </main>

      <nav class="tabbar" aria-label="Ana menü">
        <span class="tabbar__pill" aria-hidden="true"></span>
        <a class="tab tab--oku" href="#/oku" data-tab="oku">
          <img class="tab__icon tab__icon--globe" src="/src/assets/icons/globe.webp" alt="" width="96" height="96" />
          <span class="tab__label">Oku</span>
        </a>
        <a class="tab tab--kenz" href="#/kenz" data-tab="kenz">
          <img class="tab__icon tab__icon--kenz" src="/src/assets/icons/kenz.svg" alt="" width="834" height="907" />
          <span class="tab__label">Kenz</span>
        </a>
        <a class="tab tab--gunes" href="#/gunes" data-tab="gunes">
          <img class="tab__icon tab__icon--sun" src="/src/assets/icons/sun.svg" alt="" width="84" height="84" />
          <span class="tab__label">Güneş</span>
        </a>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
