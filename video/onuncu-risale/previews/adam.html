<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script src="../lib/core.js"></script>
<script src="../lib/paint.js"></script>
<script src="../lib/post.js"></script>
<script src="../assets/fruits.js"></script>
<script src="../assets/adam.js"></script>
<script src="../assets/yiyecek.js"></script>
<script>const hasSpr = (n) => !!SPRITE_DEFS[n];</script>
<script>
const out = document.getElementById('out'); const ctx = out.getContext('2d');
function timed(name) { const t0 = performance.now(); const s = spr(name); console.log('bake', name, s.canvas.width + 'x' + s.canvas.height, 'k=' + (s.k || 1), Math.round(performance.now() - t0) + 'ms'); return s; }
function bg(col) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }
function label(t, x, y, col = '#333') { ctx.save(); ctx.font = '22px sans-serif'; ctx.fillStyle = col; ctx.fillText(t, x, y); ctx.restore(); }
function paintedBg(top, bottom, seed = 5) {
  const S = Paint.sprite(W, H, { seed });
  S.region(rectPath(0, 0, W, H), { ramp: [shade(top, -0.04), top, shade(top, 0.03), bottom, shade(bottom, 0.03)], shade: Paint.grad(0, 0, 0, H, 0, 1), dir: 0, dirJit: 0.08, len: [90, 200], wid: [12, 20], cover: 2.2, rim: false, jitter: 30, jitterFreq: 0.005, noise: 0.03 });
  return S.finish({ emboss: 0.4 });
}
let BG1 = null, BG2 = null;
const bg1 = () => { if (!BG1) BG1 = paintedBg('#EADFC6', '#D9C9A5'); ctx.drawImage(BG1, 0, 0); };
// sahnelerin kullandığı drawPart (çerçeve kökeni + ölçek; k'yı hesaba katar)
function drawPart(c, s, ox, oy, sc = 1, rot = 0, alpha = 1) { const k = s.k || 1; drawSpr(c, s, ox + (s.px * sc) / k, oy + (s.py * sc) / k, sc, rot, alpha); }
// "masa" (P2'deki sofra kenarının yerine): yakın planda dirseği örter
function table(y) { ctx.save(); ctx.fillStyle = '#9A5A33'; ctx.beginPath(); ctx.ellipse(560, y + 120, 620, 130, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#B9733F'; ctx.beginPath(); ctx.ellipse(560, y + 100, 600, 112, 0, 0, 7); ctx.fill(); ctx.restore(); }

window.show = async () => {
  ['adam-ayakta-bas', 'adam-ayakta-govde', 'adam-ayakta-kol'].forEach(timed);
  bg1();
  ADAM.draw(ctx, 'ayakta', 300, 1880, 1);
  ADAM.draw(ctx, 'ayakta', 760, 880, 0.62, { head: 0.2, arm: -0.35 });
  ADAM.draw(ctx, 'ayakta', 760, 1880, 0.62, { head: -0.2, arm: 0.25 });
  label('head +0.2 / arm -0.35', 600, 120); label('head -0.2 / arm +0.25', 600, 1120);
  Post.apply(ctx);
};
window.show2 = async () => {
  ['adam-ayakta-sema', 'organ-akciger', 'organ-kalp', 'organ-mide'].forEach(timed);
  bg('#1B2550');
  const S = Paint.sprite(W, H, { seed: 9 });
  S.region(rectPath(0, 0, W, H), { ramp: ['#18214A', '#1B2550', '#1E2A58'], shade: Paint.cst(0.5), dir: 0, dirJit: 0.08, len: [90, 200], wid: [12, 20], cover: 1.6, rim: false, jitter: 30, noise: 0.25 });
  ctx.drawImage(S.finish({ emboss: 0.4 }), 0, 0);
  const x = 300, y = 1880;
  drawSpr(ctx, spr('adam-ayakta-sema'), x, y, 1);
  for (const o of ['organ-akciger', 'organ-kalp', 'organ-mide']) drawSpr(ctx, spr(o), x, y, 1);
  ctx.fillStyle = '#FFE15A';
  for (const k of ['eye', 'ear', 'nose', 'mouth', 'fingertip', 'palm', 'heart', 'lungs', 'stomach', 'intestine', 'foot', 'hip', 'knee', 'neck', 'shoulder']) {
    const p = ADAM.pt('ayakta', k, x, y, 1); ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 7); ctx.fill(); label(k, p[0] + 8, p[1] - 6, '#FFE15A');
  }
  ctx.save(); ctx.beginPath(); ctx.rect(560, 520, 520, 840); ctx.clip();
  const zx = 820 + (290 - 262) * 2.2, zy = 940 + (1200 - 450) * 2.2;
  drawSpr(ctx, spr('adam-ayakta-sema'), zx, zy, 2.2);
  for (const o of ['organ-akciger', 'organ-kalp', 'organ-mide']) drawSpr(ctx, spr(o), zx, zy, 2.2);
  ctx.restore();
  // şema baş yakın
  ctx.save(); ctx.beginPath(); ctx.rect(560, 40, 520, 460); ctx.clip();
  drawSpr(ctx, spr('adam-ayakta-sema'), 820 + (290 - 300) * 2.6, 270 + (1200 - 170) * 2.6, 2.6);
  ctx.restore();
  Post.apply(ctx);
};
window.show3 = async () => {
  ['adam-oturan-bas', 'adam-oturan-govde'].forEach(timed);
  bg1();
  ctx.fillStyle = '#6FA84A'; ctx.fillRect(0, 700, W, 30); ctx.fillRect(0, 1350, W, 30);
  ADAM.draw(ctx, 'oturan', 330, 712, 1.1);
  ADAM.draw(ctx, 'oturan', 200, 1362, 0.9, { head: 0.2 });
  ADAM.draw(ctx, 'oturan', 700, 1362, 0.9, { head: -0.2 });
  label('head +0.2 (down, canvas cw)', 40, 830); label('head -0.2 (up)', 600, 830);
  // P1 ölçeği (1.75x): kalça-dirsek bölgesi
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1400, W, 520); ctx.clip();
  ctx.fillStyle = '#6FA84A'; ctx.fillRect(0, 1880, W, 40);
  ADAM.draw(ctx, 'oturan', 330, 1890 + (622 - 622) * 1.75 + 260, 1.75);
  ctx.restore();
  Post.apply(ctx);
};
window.show4 = async () => {
  ['adam-yakin-bas', 'adam-yakin-govde', 'adam-yakin-kol'].forEach(timed);
  bg1();
  ADAM.draw(ctx, 'yakin', 540, 1150, 1, { arm: 0 });
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1200, W, 720); ctx.clip(); bg1();
  ADAM.draw(ctx, 'yakin', 220, 1640, 0.5, { arm: 0.55, head: 0.2 });
  ADAM.draw(ctx, 'yakin', 700, 1640, 0.5, { arm: 0.3, head: -0.2 });
  ctx.restore();
  label('arm 0 (pinch at lips)', 40, 40);
  label('arm +0.55 / head +0.2', 40, 1900); label('arm +0.3 / head -0.2', 560, 1900);
  Post.apply(ctx);
};
window.show5 = async () => {
  bg1();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 960); ctx.clip();
  ADAM.draw(ctx, 'yakin', 540 - 1.6 * (610 - 450), 480 - 1.6 * (470 - 1100), 1.6, { arm: 0 });
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 960, W, 960); ctx.clip();
  ADAM.draw(ctx, 'ayakta', 540 - (300 - 290) * 4, 1440 - (150 - 1200) * 4, 4);
  ctx.restore();
  Post.apply(ctx);
};
window.show6 = async () => {
  bg1();
  ADAM.draw(ctx, 'ayakta', 170, 700, 0.5, { head: 0.25, arm: -0.6 });
  ADAM.draw(ctx, 'ayakta', 440, 700, 0.5, { head: -0.25, arm: 0.3 });
  ADAM.draw(ctx, 'oturan', 700, 700, 0.55, { head: 0.25 });
  ADAM.draw(ctx, 'oturan', 700, 1080, 0.55, { head: -0.25 });
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1120, W, 800); ctx.clip(); bg1();
  ADAM.draw(ctx, 'yakin', 230, 1700, 0.48, { head: 0.25, arm: 0.6 });
  ADAM.draw(ctx, 'yakin', 720, 1700, 0.48, { head: -0.25, arm: -0.1 });
  ctx.restore();
  label('ayakta h+.25 a-.6', 20, 60); label('ayakta h-.25 a+.3', 300, 60); label('oturan h±.25', 640, 60);
  label('yakin h+.25 a+.6', 40, 1160); label('yakin h-.25 a-.1', 560, 1160);
  Post.apply(ctx);
};
// sahnelerin sırası (gövde → baş → kol) ile, sahne dönüş değerlerinde: yaka üstüne ten taşmamalı
window.show7 = async () => {
  bg1();
  const A = ADAM.yakin, sy = 0.5;
  const ox = 20, oy = 40 - 300 * sy;
  drawPart(ctx, spr('adam-yakin-govde'), ox, oy, sy); drawPart(ctx, spr('adam-yakin-bas'), ox, oy, sy, -0.09); drawPart(ctx, spr('adam-yakin-kol'), ox, oy, sy, 0.32);
  const B = ADAM.oturan;
  for (const [i, r] of [[0, -0.16], [1, 0.14]]) {
    const sx = 130 + i * 330, sy2 = 1280, sc = 0.75;
    drawPart(ctx, spr('adam-oturan-govde'), sx - B.seat[0] * sc, sy2 - B.seat[1] * sc, sc);
    drawPart(ctx, spr('adam-oturan-bas'), sx - B.seat[0] * sc, sy2 - B.seat[1] * sc, sc, r);
  }
  const fx = 660, fy = 680;
  drawPart(ctx, spr('adam-ayakta-govde'), fx, fy, 1); drawPart(ctx, spr('adam-ayakta-bas'), fx, fy, 1, 0.02); drawPart(ctx, spr('adam-ayakta-kol'), fx, fy, 1, 0.012);
  // P1 ölçeğinde oturan boyun-yaka (1.75x, baş -0.16)
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1320, 640, 600); ctx.clip(); bg1();
  const sc3 = 1.75; drawPart(ctx, spr('adam-oturan-govde'), 300 - B.neck[0] * sc3, 1560 - B.neck[1] * sc3, sc3); drawPart(ctx, spr('adam-oturan-bas'), 300 - B.neck[0] * sc3, 1560 - B.neck[1] * sc3, sc3, -0.16);
  ctx.restore();
  label('wrong order body->head->arm (as the scenes draw)', 30, 30);
  Post.apply(ctx);
};
// P2 sahnesi gibi: masa dirseği örter, kamera z 1.0
window.show8 = async () => {
  if (!BG2) BG2 = paintedBg('#D9853F', '#B8562F', 8);
  ctx.drawImage(BG2, 0, 0);
  const A = ADAM.yakin, ox = 300 - A.neck[0], oy = 1112 - A.neck[1];
  drawPart(ctx, spr('adam-yakin-bas'), ox, oy, 1, 0); drawPart(ctx, spr('adam-yakin-govde'), ox, oy, 1); drawPart(ctx, spr('adam-yakin-kol'), ox, oy, 1, 0);
  table(1560);
  Post.apply(ctx);
};
// ---- hata ayıklama görünümleri (geçici)
window.dbgYkParts = async () => {
  bg1();
  const s = 0.6;
  drawPart(ctx, spr('adam-yakin-govde'), 0, 0, s);
  drawPart(ctx, spr('adam-yakin-kol'), 0, 0, s);
  drawPart(ctx, spr('adam-yakin-govde'), 360, 900, s);
  drawPart(ctx, spr('adam-yakin-kol'), 360 + 280, 0, s);
  Post.apply(ctx);
};
function sceneYk(ny, armRot, z = 1, cy = 960, cx = 540, bas = 'adam-yakin-kol') {
  if (!BG2) BG2 = paintedBg('#D9853F', '#B8562F', 8);
  ctx.drawImage(BG2, 0, 0);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);
  const A = ADAM.yakin, ox = 300 - A.neck[0], oy = ny - A.neck[1];
  drawPart(ctx, spr('adam-yakin-govde'), ox, oy, 1); drawPart(ctx, spr('adam-yakin-bas'), ox, oy, 1, 0); drawPart(ctx, spr(bas), ox, oy, 1, armRot);
  if (hasSpr('sofra')) drawSpr(ctx, spr('sofra'), 600, 1712, 1);
  ctx.restore();
}
window.dbgT0 = async () => { sceneYk(1112, 0); Post.apply(ctx); };
window.dbgT1 = async () => { sceneYk(window.NY || 966, 0); Post.apply(ctx); };
window.dbgT2 = async () => { sceneYk(window.NY || 966, 0.3); Post.apply(ctx); };
window.dbgT3 = async () => { sceneYk(window.NY || 966, 0.4); Post.apply(ctx); };
window.dbgT4 = async () => { sceneYk(window.NY || 966, 0.3, 1.12, 1240, 640); Post.apply(ctx); };
window.dbgSit = async () => {
  bg1();
  const B = ADAM.oturan, sc = 4.2;
  ctx.fillStyle = '#6FA84A';
  drawPart(ctx, spr('adam-oturan-govde'), 540 - B.knee[0] * sc, 760 - B.knee[1] * sc, sc);
  Post.apply(ctx);
};
window.meta = async () => {
  const r = (o) => JSON.stringify(o, (k, v) => (typeof v === 'number' ? Math.round(v * 10) / 10 : v));
  for (const p of ['ayakta', 'oturan', 'yakin']) console.log('META', p, r(ADAM[p]));
  for (const n of Object.keys(SPRITE_DEFS).filter((n) => n.startsWith('adam-') || n.startsWith('organ-'))) { const s = spr(n); console.log('SPR', n, s.canvas.width + 'x' + s.canvas.height, 'pivot', Math.round(s.px * 10) / 10, Math.round(s.py * 10) / 10, 'k', s.k); }
  bg('#000');
};
window.READY = true;
</script></body></html>
