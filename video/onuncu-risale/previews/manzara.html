<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script src="../lib/core.js"></script>
<script src="../lib/paint.js"></script>
<script src="../lib/post.js"></script>
<script src="../assets/manzara.js"></script>
<!-- yalnız kompozisyonu denetlemek için gerçek oturan adam (salt okunur) -->
<script src="../assets/adam.js"></script>
<script>
const out = document.getElementById('out'); const ctx = out.getContext('2d');
const T = {};
function bake(name) { const t0 = performance.now(); const s = spr(name); if (!T[name]) { T[name] = Math.round(performance.now() - t0); console.log('bake', name, s.canvas.width + 'x' + s.canvas.height, 'k=' + s.k, T[name] + ' ms'); } return s; }
function reset() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#D8562F'; ctx.fillRect(0, 0, 1080, 1920); }
// paralakslı kamera: scenes/ortak.js camPar ile birebir aynı (sahneler bu katman değerleriyle bunu kullanır)
function camPar(cam, p) { return { x: 540 + (cam.x - 540) * p, y: 960 + (cam.y - 960) * p, z: Math.exp(Math.log(cam.z) * p) }; }
function camApply(ctx, c) { ctx.translate(540, 960); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y); }
const HAS_ADAM = typeof ADAM !== 'undefined' && !!SPRITE_DEFS['adam-oturan-govde'];
function man(ctx) {
  const M = MANZARA; const [x, y] = M.man;
  if (HAS_ADAM) { // p1-dunya.js drawMan ile aynı yerleşim (baş kalkmış hâli)
    const A = ADAM.oturan; const ox = x - A.seat[0], oy = y - A.seat[1];
    const part = (s, rot) => { const jx = ox + s.px / (s.k || 1), jy = oy + s.py / (s.k || 1); drawSpr(ctx, s, jx, jy, 1, rot); };
    part(bake('adam-oturan-govde'), 0); part(bake('adam-oturan-bas'), 0.05); return;
  }
  ctx.save(); ctx.fillStyle = 'rgba(40,60,90,0.92)';
  ctx.beginPath(); ctx.ellipse(x + 50, y - 230, 70, 210, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 110, y - 480, 52, 64, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(40,60,90,0.92)'; ctx.lineWidth = 70;
  ctx.beginPath(); ctx.moveTo(x, y - 40); ctx.lineTo(x + 116, y - 259); ctx.lineTo(x + 245, y - 30); ctx.stroke();
  ctx.restore();
}
// dusk: 0 sabah, 1 akşam. duskClouds: akşam bulut sürümleri (bulut-*-aksam) kullanılsın mı
function world(cam, dusk = 0, o = {}) {
  const M = MANZARA;
  for (const L of M.layers) {
    const c = camPar(cam, L.parallax);
    ctx.save(); camApply(ctx, c);
    if (L.name === 'gok-sabah' && dusk) { drawSpr(ctx, bake('gok-aksam'), L.x, L.y); ctx.restore(); continue; }
    if (L.name === 'gunes' && dusk) { ctx.restore(); continue; }
    const nm = dusk && L.dusk && o.duskClouds !== false ? L.dusk : L.name;
    drawSpr(ctx, bake(nm), L.x, L.y);
    if (L.name === M.manLayer) man(ctx);
    ctx.restore();
  }
}
// p3-fani.js'nin akşam renk düşürmesi (sahnede nasıl görüneceğini görmek için)
function duskGrade() {
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.5;
  const g = ctx.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#6E5A8E'); g.addColorStop(0.55, '#B0807A'); g.addColorStop(1, '#5E4A6A');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = 0.35; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, 1080, 1920); ctx.restore();
}
window.show = async () => { reset(); world({ x: 540, y: 960, z: 1 }); Post.apply(ctx); };
window.show2 = async () => { // tek tek sprite'lar + akşam göğü küçük
  reset(); ctx.fillStyle = '#3B3F57'; ctx.fillRect(0, 0, 1080, 1920);
  const g = bake('gok-aksam'); ctx.drawImage(g.canvas, 0, 0, 1480, 1500, 20, 20, 1480 * 0.35, 1500 * 0.35);
  const g2 = bake('gok-sabah'); ctx.drawImage(g2.canvas, 0, 0, 1480, 1500, 550, 20, 1480 * 0.35, 1500 * 0.35);
  ctx.fillStyle = '#E8E4D8'; ctx.font = '22px sans-serif';
  const label = (t, x, y) => { ctx.fillText(t, x, y); };
  label('gok-aksam (0.35x)', 30, 560); label('gok-sabah (0.35x)', 560, 560);
  for (const [n, x, y, s] of SHOW2) { if (SPRITE_DEFS[n]) { drawSpr(ctx, bake(n), x, y, s || 1); label(n, x - 60, y + 30); } }
  Post.apply(ctx);
};
window.show3 = async () => { reset(); world({ x: 444, y: 1492, z: 1.62 }); Post.apply(ctx); };            // p1 0.0 sn
window.show4 = async () => { reset(); world({ x: 540, y: 960, z: 1 }, 1); duskGrade(); Post.apply(ctx); }; // geniş akşam (p3 renk düşürmesiyle)
window.show5 = async () => { reset(); world({ x: 448, y: 1478, z: 1.79 }); Post.apply(ctx); };            // p1 2.42 sn
window.show6 = async () => { reset(); world({ x: 514, y: 1225, z: 1.39 }); Post.apply(ctx); };            // p1 ~3.2 sn (geri çekilme ortası)
window.show7 = async () => { reset(); world({ x: 540, y: 860, z: 0.93 }, 1); duskGrade(); Post.apply(ctx); }; // p3 sonu
window.show8 = async () => { reset(); world({ x: 580, y: 972, z: 1.0 }); Post.apply(ctx); };              // p1 4.08 sn (fihriste)
window.show9 = async () => { reset(); world({ x: 540, y: 960, z: 1 }, 1); Post.apply(ctx); };             // geniş akşam, renk düşürmesiz
window.show10 = async () => { reset(); world({ x: 540, y: 1150, z: 1.45 }, 1); duskGrade(); Post.apply(ctx); }; // p3 başı
let SHOW2 = [
  ['gunes', 920, 1460, 0.6],
  ['bulut-1', 260, 760, 0.9], ['bulut-3', 760, 760, 0.9],
  ['bulut-2', 200, 940, 0.9], ['bulut-1-aksam', 560, 960, 0.6], ['bulut-3-aksam', 880, 960, 0.5],
  ['agac-kucuk-1', 190, 1280, 1], ['agac-kucuk-2', 540, 1280, 1], ['agac-kucuk-3', 890, 1280, 1],
  ['yaprak-1', 140, 1450, 1.4], ['yaprak-2', 340, 1450, 1.4], ['yaprak-3', 540, 1450, 1.4], ['yaprak-4', 740, 1450, 1.4],
  ['cicek-tane-1', 200, 1680, 2], ['cicek-tane-2', 440, 1680, 2], ['cicek-tane-3', 680, 1680, 2], ['bulut-2-aksam', 920, 1700, 0.8],
];
console.log("MANZARA", JSON.stringify({ riverBBox: MANZARA.riverBBox, spots: MANZARA.spots, sun: MANZARA.sun, canopy: MANZARA.canopy, layers: MANZARA.layers.map((l) => [l.name, l.x, l.y, l.parallax, l.dusk || ""]), sample: MANZARA.riverSample(0.5, 0).map((v) => +v.toFixed(2)), flow: MANZARA.riverFlow(700, 1300).map((v) => +v.toFixed(3)) }));
window.READY = true;
</script></body></html>
