<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script src="../lib/core.js"></script>
<script src="../lib/paint.js"></script>
<script src="../lib/post.js"></script>
<script src="../assets/cennet-ziyafet.js"></script>
<script>
const out = document.getElementById('out'); const ctx = out.getContext('2d');
const T = {};
function bake(name) { const t0 = performance.now(); const s = spr(name); if (!T[name]) { T[name] = Math.round(performance.now() - t0); console.log('bake', name, s.canvas.width + 'x' + s.canvas.height, 'k=' + s.k, T[name] + ' ms'); } return s; }
function reset(bg = '#D8562F') { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920); }
// paralakslı kamera (sahnelerdeki camPar ile aynı)
function camPar(cam, p) { return { x: 540 + (cam.x - 540) * p, y: 960 + (cam.y - 960) * p, z: Math.exp(Math.log(cam.z) * p) }; }
function camApply(ctx, c) { ctx.translate(540, 960); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y); }
// tam ziyafet kompozisyonu (scenes/p5-ahiret.js drawFeast ile aynı katman mantığı): lower 0..1 dalın alçalması
function world(cam, lower = 0, fruit = null) {
  const Z = ZIYAFET;
  for (const L of Z.layers) {
    if (!SPRITE_DEFS[L.name]) continue;
    const c = camPar(cam, L.parallax);
    ctx.save(); camApply(ctx, c);
    const rot = lerp(Z.branch.restRot, Z.branch.lowerRot, lower);
    if (L.name === 'z-sarkan-dal') { if (fruit) { bake('z-dal-bos'); bake('z-dal-nar'); Z.drawBranch(ctx, rot, fruit.s, fruit.a); } else drawSpr(ctx, bake(L.name), Z.branch.x, Z.branch.y, 1, rot); }
    else if (L.name === 'z-akvab') { for (const [x, y] of Z.cups) drawSpr(ctx, bake('z-akvab'), x, y); }
    else drawSpr(ctx, bake(L.name), L.x, L.y, L.scale || 1);
    ctx.restore();
  }
}
window.show = async () => { reset(); world({ x: 540, y: 960, z: 1 }); Post.apply(ctx); };
// sayfa 3: kamera itmesi sonu (z 1.12) + dal alçalmış + altyazı okunurluk denemesi
window.show3 = async () => {
  reset(); world({ x: 540, y: 1000, z: 1.12 }, 1); Post.apply(ctx);
  ctx.save(); ctx.font = '600 64px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; ctx.fillText('ebediyete lâyık sonsuzluğa', 540, 1405); ctx.restore();
};
// ölçüm için: show3 ve show5'in yazısız hâli (altyazı bandı parlaklık denetimi)
window.show3n = async () => { reset(); world({ x: 540, y: 1000, z: 1.12 }, 1); Post.apply(ctx); };
window.show5n = async () => { reset(); world({ x: 548, y: 990, z: 1.065 }, 1, { s: 0.55, a: 1 }); Post.apply(ctx); };
// sayfa 5: filmdeki kamera (feastCam sonu ≈ 548,990, z 1.065), dal alçalmış, meyve yeniden bitmekte (ölçek 0.55)
window.show5 = async () => {
  reset(); world({ x: 548, y: 990, z: 1.065 }, 1, { s: 0.55, a: 1 }); Post.apply(ctx);
  ctx.save(); ctx.font = '600 60px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; ctx.fillText('cismanî ziyafetler olacaktır.', 540, 1400); ctx.restore();
};
// sayfa 2: dal (dinlenme / alçalmış), meyvenin yeniden bitişi, kadeh ve ibrik büyük, tepsi büyük
window.show2 = async () => {
  reset('#2F4A48');
  ctx.fillStyle = '#1D3B35'; ctx.fillRect(0, 0, 1080, 700);
  const Z = ZIYAFET; const b = Z.branch; const sc = 0.98;
  // dal sprite'ı pivotun ~470 px solunda; iki kopya: dinlenme (sol) ve alçalmış (sağ)
  const piv = [[520, 130], [1066, 130]];
  ctx.save(); ctx.translate(piv[0][0], piv[0][1]); ctx.scale(sc, sc); drawSpr(ctx, bake('z-sarkan-dal'), 0, 0, 1, b.restRot); ctx.restore();
  ctx.save(); ctx.translate(piv[1][0], piv[1][1]); ctx.scale(sc, sc);
  ctx.globalAlpha = 0.28; drawSpr(ctx, bake('z-sarkan-dal'), 0, 0, 1, b.restRot); ctx.globalAlpha = 1;
  drawSpr(ctx, bake('z-sarkan-dal'), 0, 0, 1, b.lowerRot); ctx.restore();
  ctx.fillStyle = '#F1CB60'; for (const [x, y] of piv) { ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }
  // yeniden biten nar: z-dal-bos + z-dal-nar ölçek 0, 0.4, 0.75, 1 (alt şerit)
  ctx.fillStyle = '#18332E'; ctx.fillRect(0, 560, 1080, 140);
  [0.0, 0.4, 0.75, 1].forEach((s, i) => { const cx = 140 + i * 260; ctx.save(); ctx.beginPath(); ctx.rect(cx - 120, 560, 240, 140); ctx.clip(); ctx.translate(cx, 560); ctx.scale(0.8, 0.8); ctx.translate(-Z.fruitPos(0)[0] + 20, -400); bake('z-dal-bos'); bake('z-dal-nar'); Z.drawBranch(ctx, 0, s, 1); ctx.restore(); });
  ctx.fillStyle = '#5B4A6E'; ctx.fillRect(0, 700, 1080, 600);
  ctx.fillStyle = '#0F5A40'; ctx.fillRect(0, 1060, 1080, 240);
  drawSpr(ctx, bake('z-akvab'), 210, 1250, 5.6);
  drawSpr(ctx, bake('z-akvab'), 470, 1250, 1);
  drawSpr(ctx, bake('z-akvab'), 560, 1250, 2.4);
  drawSpr(ctx, bake('z-ibrik'), 860, 1270, 2.9);
  ctx.fillStyle = '#7A2034'; ctx.fillRect(0, 1300, 1080, 620);
  drawSpr(ctx, bake('z-tepsi'), 540, 1600, 2.3);
  Post.apply(ctx);
};
// sayfa 4: meta veri denetimi — ırmak yolu, akış yönü, kadeh noktaları, dal ekseni ve meyve çapası
window.show4 = async () => {
  reset(); world({ x: 540, y: 960, z: 1 }); Post.apply(ctx);
  const Z = ZIYAFET; ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#FF00CC'; ctx.fill(Z.streamPath()); ctx.restore();
  ctx.save(); ctx.strokeStyle = '#FFFF00'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(400, 1760); ctx.lineTo(400 + Z.streamDir[0] * 200, 1760 + Z.streamDir[1] * 200); ctx.stroke();
  ctx.fillStyle = '#FFFF00'; for (const [x, y] of Z.cups) { ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(Z.branch.x, Z.branch.y, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#00FFFF'; for (const r of [0, Z.branch.lowerRot]) { const [x, y] = Z.fruitPos(r); ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#00FF66'; ctx.lineWidth = 3; ctx.strokeRect(0, 1330, 1080, 110);
  ctx.restore();
};
window.READY = true;
</script></body></html>
