<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script src="../lib/core.js"></script>
<script src="../lib/paint.js"></script>
<script src="../lib/post.js"></script>
<script src="../assets/fruits.js"></script>
<script src="../assets/yiyecek.js"></script>
<script>
const out = document.getElementById('out'); const ctx = out.getContext('2d');
const T = {};
function bake(name) {
  const t0 = performance.now(); const s = spr(name);
  if (!T[name]) { T[name] = Math.round(performance.now() - t0); console.log('bake', name, s.canvas.width + 'x' + s.canvas.height, 'k=' + s.k, 'pivot=' + Math.round(s.px) + ',' + Math.round(s.py), T[name] + ' ms'); }
  return s;
}
function reset() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; }
// zemin bantları: sıcak duvar (p2), krem (p4), çivit (p4 şema), koyu yeşil (cennet)
const BG = { wall: '#C96E3E', cream: '#EAB066', indigo: '#1E2A5C', green: '#21423B', violet: '#5B4A6E', sky: '#8FB8C8' };
function band(y0, y1, col) { ctx.fillStyle = col; ctx.fillRect(0, y0, 1080, y1 - y0); }
function label(txt, x, y) { ctx.save(); ctx.font = '600 22px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillText(txt, x, y); ctx.restore(); }
function put(name, x, y, sc = 1, rot = 0) { if (!SPRITE_DEFS[name]) { label('? ' + name, x - 40, y); return; } drawSpr(ctx, bake(name), x, y, sc, rot); label(name, x - 50, y + 8 - 10 + (bake(name).canvas.height - bake(name).py) / bake(name).k * sc + 18); }
window.show = async () => {
  reset(); band(0, 640, BG.wall); band(640, 1280, BG.cream); band(1280, 1920, BG.indigo);
  put('nar', 290, 330, 1); put('nar-kuru', 800, 330, 1);
  put('nar-acik', 290, 960, 1); put('nar-acik-kuru', 800, 960, 1);
  put('nar', 160, 1600, 0.44); put('elma', 400, 1600, 0.44); put('incir', 650, 1600, 0.45); put('hurma', 900, 1600, 0.42);
  Post.apply(ctx);
};
window.show2 = async () => {
  reset(); band(0, 640, BG.wall); band(640, 1280, BG.cream); band(1280, 1920, BG.indigo);
  put('uzum', 200, 300, 1); put('uzum-kuru', 540, 300, 1); put('uzum-yesil', 880, 300, 1);
  put('elma', 200, 920, 1); put('incir', 540, 920, 1); put('hurma', 880, 920, 1);
  put('uzum-yatik', 290, 1450, 1); put('uzum-yatik-kuru', 800, 1450, 1);
  put('uzum', 120, 1760, 0.5); put('zeytin', 380, 1760, 0.5); put('gul', 640, 1740, 0.5); put('ekmek', 900, 1760, 0.5);
  Post.apply(ctx);
};
window.show3 = async () => {
  reset(); band(0, 640, BG.wall); band(640, 1280, BG.cream); band(1280, 1920, BG.indigo);
  put('zeytin', 280, 280, 1); put('gul', 800, 300, 1);
  put('ekmek', 280, 960, 1); put('bal', 800, 960, 1);
  put('sut', 200, 1600, 1); put('su-testi', 540, 1600, 1); put('su-bardak', 880, 1600, 1);
  Post.apply(ctx);
};
// sofra kompozisyonu: önerilen yerleşim (onTableSpots) + temas gölgeleri; altta solmuş hali
function table(cx, cy, sc, wither, mainOnly) {
  drawSpr(ctx, bake('sofra'), cx, cy, sc);
  const sp = YIYECEK.onTableSpots;
  const order = Object.keys(sp).filter((n) => !mainOnly || sp[n].main).sort((a, b) => sp[a].z - sp[b].z);
  for (const n of order) { const q = sp[n]; const nm = wither && q.wither ? q.wither : n; if (q.shadow) drawSpr(ctx, bake(q.shadow), cx + q.x * sc, cy + q.y * sc, q.s * sc); drawSpr(ctx, bake(nm), cx + q.x * sc, cy + q.y * sc, q.s * sc); }
}
window.show4 = async () => {
  reset(); ctx.fillStyle = '#B1543A'; ctx.fillRect(0, 0, 1080, 1920);
  put('tabak', 540, 150, 1);
  table(540, 620, 0.93, false, true);
  table(540, 1250, 0.93, false, false);
  table(540, 1760, 0.93, true, true);
  Post.apply(ctx);
};
window.show5 = async () => {
  reset(); band(0, 960, BG.green); band(960, 1920, BG.violet);
  put('altin-tepsi', 300, 200, 1); put('kadeh-gumus', 720, 200, 1); put('kadeh-billur', 930, 200, 1);
  put('tepsi-meyve', 330, 640, 1); put('ibrik', 860, 660, 1);
  put('kadeh-gumus', 190, 1150, 2); put('kadeh-billur', 520, 1150, 2); put('ibrik', 860, 1300, 1.6);
  put('tepsi-meyve', 440, 1700, 0.7);
  Post.apply(ctx);
};
// p2 açılışı benzetimi: kamera z = 2.6, yarım nara odaklı (öneri yerleşimiyle) — yakın planda yumuşama kontrolü
window.show6 = async () => {
  reset(); ctx.fillStyle = '#B1543A'; ctx.fillRect(0, 0, 1080, 1920);
  const sp = YIYECEK.onTableSpots; const q = sp['nar-acik']; const z = 2.6; const tcx = 600, tcy = 1712;
  ctx.save(); ctx.translate(540, 900); ctx.scale(z, z); ctx.translate(-(tcx + q.x), -(tcy + q.y));
  table(tcx, tcy, 1.0, false, true);
  ctx.restore();
  Post.apply(ctx);
};
// fânilik karşılaştırması: taze | solmuş yan yana (aynı pivot noktası işaretli), üst yarı düz ışık, alt yarı p2'deki
// akşam çarpma tonu (multiply, 0.55) altında — solmuş eşler kahve/siyah değil, tozlu ve sönük okunmalı
window.show7 = async () => {
  reset(); ctx.fillStyle = '#E9E2EC'; ctx.fillRect(0, 0, 1080, 1920);
  const pair = (y0) => {
    drawSpr(ctx, bake('nar-acik'), 280, y0 + 200, 1.05); drawSpr(ctx, bake('nar-acik-kuru'), 800, y0 + 200, 1.05);
    drawSpr(ctx, bake('uzum-yatik'), 290, y0 + 570, 1.05); drawSpr(ctx, bake('uzum-yatik-kuru'), 810, y0 + 570, 1.05);
    for (const x of [280, 800]) { ctx.fillStyle = '#1E2A5C'; ctx.fillRect(x - 6, y0 + 199, 12, 2); ctx.fillRect(x - 1, y0 + 194, 2, 12); } // pivot
    drawSpr(ctx, bake('uzum'), 150, y0 + 800, 0.62); drawSpr(ctx, bake('uzum-kuru'), 370, y0 + 800, 0.62); drawSpr(ctx, bake('nar'), 690, y0 + 800, 0.5); drawSpr(ctx, bake('nar-kuru'), 920, y0 + 800, 0.5);
  };
  pair(0); pair(960);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.55;
  const g = ctx.createLinearGradient(0, 960, 0, 1920); g.addColorStop(0, '#9A6A9A'); g.addColorStop(0.6, '#C98A6A'); g.addColorStop(1, '#7A5A7A');
  ctx.fillStyle = g; ctx.fillRect(0, 960, 1080, 960); ctx.restore();
  label('taze', 250, 30); label('solmuş', 750, 30); label('akşam tonu altında (p2, multiply 0.55)', 330, 990);
  Post.apply(ctx);
};
// solmuş eşlerin değer denetimi: opak piksellerde çok koyu (OKLab L < 0.22) ve koyu-kahve (L < 0.42, ton 35°–95°, renkli)
// oranı; taze eşle karşılaştırma için ortalama L ve renklilik. Konsola 'WITHER {...}'
window.witherCheck = async () => {
  const out = {};
  for (const n of ['nar-acik', 'nar-acik-kuru', 'uzum-yatik', 'uzum-yatik-kuru', 'uzum', 'uzum-kuru', 'nar', 'nar-kuru']) {
    const c = bake(n).canvas; const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let cnt = 0, dark = 0, brown = 0, sL = 0, sC = 0; const Ls = [];
    for (let i = 0; i < d.length; i += 16) {
      if (d[i + 3] < 250) continue;
      const [L, a, b] = rgb2oklab(d[i], d[i + 1], d[i + 2]); const C = Math.hypot(a, b); const h = (Math.atan2(b, a) * 180) / Math.PI;
      cnt++; sL += L; sC += C; Ls.push(L);
      if (L < 0.22) dark++;
      if (L < 0.42 && C > 0.025 && h > 35 && h < 95) brown++;
    }
    Ls.sort((x, y) => x - y);
    out[n] = { meanL: +(sL / cnt).toFixed(3), meanC: +(sC / cnt).toFixed(3), p2L: +Ls[Math.floor(Ls.length * 0.02)].toFixed(3), darkPct: +((dark / cnt) * 100).toFixed(2), brownPct: +((brown / cnt) * 100).toFixed(2) };
  }
  console.log('WITHER ' + JSON.stringify(out));
};
// ölçüm: her sprite'ın görünür (alfa) sınır kutusu, pivota göre ekran px (ölçek 1)
window.measure = async () => {
  const out = {};
  for (const n of YIYECEK.names) {
    const s = bake(n); const c = s.canvas; const x = c.getContext('2d'); const d = x.getImageData(0, 0, c.width, c.height).data;
    let a = 1e9, b = 1e9, cc = -1, dd = -1;
    for (let y = 0; y < c.height; y++) for (let i = 0; i < c.width; i++) if (d[(y * c.width + i) * 4 + 3] > 40) { if (i < a) a = i; if (i > cc) cc = i; if (y < b) b = y; if (y > dd) dd = y; }
    const k = s.k; out[n] = { canvas: [c.width, c.height], k, pivot: [Math.round(s.px), Math.round(s.py)], screen: [Math.round((cc - a) / k), Math.round((dd - b) / k)], box: [Math.round((a - s.px) / k), Math.round((b - s.py) / k), Math.round((cc - s.px) / k), Math.round((dd - s.py) / k)], ms: T[n] };
  }
  console.log('MEASURE ' + JSON.stringify(out));
};
// geliştirme: #bg=RRGGBB|ad,x,y,ölçek|ad,x,y,ölçek ...  (kontrol için tek tek büyük çizim)
window.dev = async () => {
  reset(); const parts = decodeURIComponent(location.hash.slice(1)).split('|').filter(Boolean);
  let bg = '#C96E3E'; const items = [];
  for (const p of parts) { if (p.startsWith('bg=')) bg = '#' + p.slice(3); else { const [n, x, y, s, r] = p.split(','); items.push([n, +x, +y, +(s || 1), +(r || 0)]); } }
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920);
  for (const [n, x, y, s, r] of items) { if (n.startsWith('@')) { const q = YIYECEK.shadow && YIYECEK.shadow[n.slice(1)]; if (q) drawSpr(ctx, bake(q.spr), x + q.dx * s, y + q.dy * s, s); continue; } drawSpr(ctx, bake(n), x, y, s, r); }
  Post.apply(ctx);
};
window.READY = true;
</script></body></html>
