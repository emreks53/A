<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Playfair Display';font-weight:700;src:url(assets/fonts/PlayfairDisplay-700.ttf)}
@font-face{font-family:'Playfair Display';font-weight:900;src:url(assets/fonts/PlayfairDisplay-900.ttf)}
@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url(assets/fonts/CormorantGaramond-700.ttf)}
@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url(assets/fonts/CormorantGaramond-600.ttf)}
@font-face{font-family:'Inter Display';font-weight:600;src:url(assets/fonts/InterDisplay-SemiBold.otf)}
@font-face{font-family:'Lora';font-weight:600;src:url(assets/fonts/Lora-600-normal.ttf)}
html,body{margin:0;background:transparent}
</style></head><body>
<script type="module">
// Elegant word-synced subtitles, rendered on a transparent 1080x1920 canvas.
// Style: refined serif, cream text with soft shadow; the word being spoken turns warm gold with a gentle glow and
// lift; upcoming words are softly dimmed; phrases glide in/out. A subtle cinematic scrim keeps text legible.
const P = new URLSearchParams(location.search);
const W = 1080, H = 1920;
const STYLE = P.get('style') || 'serif';
const S = {
  serif:  { family: 'Playfair Display', weight: 700, size: 64, track: 0.5, lh: 1.24 },
  garamond: { family: 'Cormorant Garamond', weight: 700, size: 76, track: 0.6, lh: 1.12 },
  sans:   { family: 'Inter Display', weight: 600, size: 60, track: -0.3, lh: 1.22 },
}[STYLE];
const BASE_Y = 1485;            // centre of the caption block (Shorts-safe, above the bottom UI)
const MAX_W = 860;
const CREAM = [255, 247, 232], GOLD_A = '#fff3c9', GOLD_B = '#f6c552', GOLD_C = '#e0a12e';
const c = document.createElement('canvas'); c.width = W; c.height = H; document.body.appendChild(c);
const X = c.getContext('2d');
const phrases = await (await fetch('data/phrases.json')).json();
// Background luminance under the caption band (0..1 per frame at 30 fps), measured from the caption-free video.
let LUMA = null; try { const r = await fetch('data/caption_luma.json'); if (r.ok) LUMA = await r.json(); } catch (e) {}
const lumaOverride = {}; window.setLuma = (t, v) => { lumaOverride[t.toFixed(3)] = v; };
const lumaAt = t => { const o = lumaOverride[t.toFixed(3)]; if (o !== undefined) return o; if (!LUMA) return 0.45; const i = Math.max(0, Math.min(LUMA.length - 1, Math.round(t * 30))); let s = 0, n = 0; for (let k = -6; k <= 6; k++) { const j = i + k; if (j >= 0 && j < LUMA.length) { s += LUMA[j]; n++; } } return s / n; };
await document.fonts.load(`${S.weight} ${S.size}px "${S.family}"`, 'ÇĞİÖŞÜçğıöşüâîû');
await document.fonts.ready;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// Pre-layout every phrase into lines with per-word x positions.
X.font = `${S.weight} ${S.size}px "${S.family}"`; if ('letterSpacing' in X) X.letterSpacing = S.track + 'px';
const space = X.measureText(' ').width;
const layouts = phrases.map(ph => {
  const ws = ph.map(w => ({ ...w, width: X.measureText(w.w).width }));
  const lines = []; let cur = [], cw = 0;
  for (const w of ws) { const add = (cur.length ? space : 0) + w.width; if (cur.length && cw + add > MAX_W) { lines.push(cur); cur = [w]; cw = w.width; } else { cur.push(w); cw += add; } }
  if (cur.length) lines.push(cur);
  // balance two lines
  if (lines.length === 2) { const all = [...lines[0], ...lines[1]]; let best = null; for (let k = 1; k < all.length; k++) { const a = all.slice(0, k), b = all.slice(k); const wa = a.reduce((s, w) => s + w.width, 0) + space * (a.length - 1), wb = b.reduce((s, w) => s + w.width, 0) + space * (b.length - 1); if (wa > MAX_W || wb > MAX_W) continue; const d = Math.abs(wa - wb) + (wb > wa ? 0 : 1); if (!best || d < best.d) best = { d, a, b }; } if (best) { lines[0] = best.a; lines[1] = best.b; } }
  const lh = S.size * S.lh; const top = BASE_Y - (lines.length * lh) / 2 + lh / 2;
  lines.forEach((ln, li) => { const lw = ln.reduce((s, w) => s + w.width, 0) + space * (ln.length - 1); let x = W / 2 - lw / 2; ln.forEach(w => { w.x = x; w.y = top + li * lh; x += w.width + space; }); });
  return { words: ws, lines, start: ph[0].s - 0.06, end: ph[ph.length - 1].e };
});
// Phrase hand-off is strictly sequential (never two phrases on screen at once): a phrase lingers 0.45 s after its
// last word, but if the next phrase comes sooner it fades out quickly so that it is gone exactly when the next begins.
const FI = 0.18;
layouts.forEach((L, i) => {
  const next = layouts[i + 1]; L.fo = 0.22;
  if (!next) { L.out = L.end + 0.8; return; }
  if (L.end + 0.45 + L.fo <= next.start) { L.out = L.end + 0.45; return; }
  L.fo = 0.09; L.out = Math.max(L.start + FI + 0.05, next.start - L.fo);
});

function scrim(alpha) {
  if (alpha <= 0) return;
  const g = X.createLinearGradient(0, 1230, 0, 1920);
  g.addColorStop(0, 'rgba(6,7,14,0)'); g.addColorStop(0.35, `rgba(6,7,14,${0.26 * alpha})`); g.addColorStop(0.65, `rgba(6,7,14,${0.30 * alpha})`); g.addColorStop(1, `rgba(6,7,14,${0.18 * alpha})`);
  X.fillStyle = g; X.fillRect(0, 1230, W, 690);
}

function drawWord(w, x, y, state, k, alpha, lift) {
  // state: 0 upcoming, 1 active, 2 spoken. k = active progress 0..1 (for glow/lift)
  X.save(); X.globalAlpha = alpha;
  X.font = `${S.weight} ${S.size}px "${S.family}"`; if ('letterSpacing' in X) X.letterSpacing = S.track + 'px';
  X.textBaseline = 'middle'; X.textAlign = 'left';
  const yy = y - lift;
  // legibility: soft dark halo + fine outline
  { const lum = lumaAt(window.__t ?? 0); X.shadowColor = `rgba(0,0,0,${(0.55 + 0.25 * clamp((lum - 0.45) / 0.35)).toFixed(3)})`; X.shadowBlur = 16 + 6 * clamp((lum - 0.45) / 0.35); X.shadowOffsetY = 3; }
  X.lineJoin = 'round'; X.lineWidth = 3.6; X.strokeStyle = 'rgba(12,10,8,0.6)'; X.strokeText(w.w, x, yy);
  X.shadowColor = 'transparent';
  if (state === 1) {
    // warm glow behind the active word
    X.save(); X.shadowColor = `rgba(255,190,80,${0.55 * k})`; X.shadowBlur = 28; X.fillStyle = 'rgba(255,200,90,0.01)'; X.fillText(w.w, x, yy); X.restore();
    const g = X.createLinearGradient(0, yy - S.size * 0.55, 0, yy + S.size * 0.45);
    g.addColorStop(0, GOLD_A); g.addColorStop(0.55, GOLD_B); g.addColorStop(1, GOLD_C);
    X.fillStyle = g;
  } else {
    const a = state === 0 ? 0.58 : 1.0;
    X.fillStyle = `rgba(${CREAM[0]},${CREAM[1]},${CREAM[2]},${a})`;
  }
  X.fillText(w.w, x, yy);
  X.restore();
}

const TL = await (await fetch('data/timeline.json')).json();
const END = TL.audioDuration; // the picture fades to black over the last 0.9 s; captions follow it
window.drawAt = (t) => {
  window.__t = t;
  X.clearRect(0, 0, W, H);
  const gfade = clamp((END - t) / 0.9); if (gfade <= 0) return;
  // scrim follows caption presence (smoothly)
  let pres = 0; for (const L of layouts) { const a = clamp((t - L.start + 0.2) / 0.3), b = clamp((L.out + L.fo + 0.35 - t) / 0.35); pres = Math.max(pres, Math.min(a, b)); }
  scrim(easeInOut(pres));
  for (const L of layouts) {
    if (t < L.start - 0.01 || t > L.out + L.fo + 0.01) continue;
    const pin = easeOut(clamp((t - L.start) / FI)), pout = 1 - easeInOut(clamp((t - L.out) / L.fo));
    const phraseA = pin * pout; if (phraseA <= 0.001) continue;
    const rise = (1 - pin) * 14 - (1 - pout) * 10;
    // soft elliptical shadow behind the phrase; darker when the background under it is bright
    { const lum = lumaAt(t); const k = 0.34 + 0.30 * clamp((lum - 0.30) / 0.40); // capped: a heavy dark oval reads as a smudge on bright frames
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      L.words.forEach(w => { x0 = Math.min(x0, w.x); x1 = Math.max(x1, w.x + w.width); y0 = Math.min(y0, w.y); y1 = Math.max(y1, w.y); });
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + rise, rx = (x1 - x0) / 2 + 120, ry = (y1 - y0) / 2 + S.size * 1.05;
      X.save(); X.globalAlpha = phraseA; X.translate(cx, cy); X.scale(1, ry / rx);
      const g = X.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, `rgba(8,7,12,${k})`); g.addColorStop(0.55, `rgba(8,7,12,${k * 0.72})`); g.addColorStop(1, 'rgba(8,7,12,0)');
      X.fillStyle = g; X.beginPath(); X.arc(0, 0, rx, 0, Math.PI * 2); X.fill(); X.restore(); }
    L.words.forEach((w, i) => {
      const stag = easeOut(clamp((t - L.start - i * 0.035) / 0.26));
      let state = 0, k = 0;
      if (t >= w.s - 0.04) state = (t < w.e + 0.02 || (i === L.words.length - 1 && t < L.out)) ? 1 : 2;
      if (state === 1) k = easeOut(clamp((t - w.s + 0.04) / 0.14));
      const nextW = L.words[i + 1]; if (state === 1 && nextW && t >= nextW.s - 0.04) state = 2;
      const lift = state === 1 ? 3 * k : 0;
      drawWord(w, w.x, w.y + rise + (1 - stag) * 10, state, k, phraseA * stag, lift);
    });
  }
  if (gfade < 1) { X.save(); X.globalCompositeOperation = 'destination-in'; X.fillStyle = `rgba(0,0,0,${gfade})`; X.fillRect(0, 0, W, H); X.restore(); }
};
window.grabPNG = async (t) => {
  window.drawAt(t);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const u = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
  return btoa(s);
};
window.READY = true;
</script></body></html>
