<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: italic; src: url(fonts/CormorantGaramondSemiBoldItalic.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url(fonts/CormorantGaramondMediumItalic.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: normal; src: url(fonts/CormorantGaramondSemiBold.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: normal; src: url(fonts/CormorantGaramondMedium.ttf); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal; src: url(fonts/EBGaramondRegular.ttf); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-style: normal; src: url(fonts/EBGaramondMedium.ttf); }
  @font-face { font-family: "EB Garamond"; font-weight: 600; font-style: normal; src: url(fonts/EBGaramondSemiBold.ttf); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: italic; src: url(fonts/EBGaramondItalic.ttf); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-style: italic; src: url(fonts/EBGaramondMediumItalic.ttf); }
  @font-face { font-family: "Caveat"; font-weight: 600; src: url(fonts/CaveatSemiBold.ttf); }
  @font-face { font-family: "Caveat"; font-weight: 500; src: url(fonts/CaveatMedium.ttf); }

  @font-face { font-family: "Amiri Quran"; font-weight: 400; src: url(fonts/AmiriQuran.ttf); }
  @font-face { font-family: "Amiri"; font-weight: 400; src: url(fonts/Amiri-Regular.ttf); }
  @font-face { font-family: "Amiri"; font-weight: 700; src: url(fonts/Amiri-Bold.ttf); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<script src="engine/core.js"></script>
<script src="data/words.js"></script>
<script src="data/plan.js"></script>
<script src="engine/paint.js"></script>
<script src="engine/man.js"></script>
<script src="engine/props-a.js"></script>
<script src="engine/props-b.js"></script>
<script src="engine/post.js"></script>
<script src="engine/gloss.js"></script>
<script src="engine/main.js"></script>
<script>
  // scene modules: missing files are skipped (placeholder frame is drawn instead)
  (function () {
    // #solo=<scene> renders that scene alone for the whole timeline (prop sheets, tests)
    const solo = (location.hash.match(/solo=([\w-]+)/) || [])[1];
    if (solo) {
      E.SHOTS = [{ id: solo, start: 0, end: E.TOTAL, dur: E.TOTAL, tail: 0, trans: null }];
    }
    const ids = E.SHOTS.map((s) => s.id).concat(['_test']);
    window.__scenesPending = ids.length;
    ids.forEach((id) => {
      const s = document.createElement('script');
      s.src = 'scenes/' + id + '.js';
      s.async = false;
      s.onload = s.onerror = () => { window.__scenesPending--; };
      document.body.appendChild(s);
    });
  })();
  window.E.ready = new Promise((res) => {
    const wait = () => (window.__scenesPending > 0 ? setTimeout(wait, 20) : E.init().then(res));
    window.addEventListener('load', wait);
  });
</script>
</body>
</html>
