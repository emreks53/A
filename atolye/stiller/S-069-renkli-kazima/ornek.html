<script>
// S-069 Renkli Kazıma — siyah yüzey kazınarak alttaki renk açığa çıkarılır. Gökte gökkuşağı kazıma kâğıdı
// (güneşten dışa sarı, turuncu, macenta, mor, mavi, turkuaz), yapıda ve bitkilerde beyaz kil üstüne
// sürülmüş renkli mürekkepler. Ton, kazıma çizgilerinin sıklığı ve kalınlığıyla kurulur: ışıklı yerde çizgiler
// kalınlaşıp birleşir, gölgede incelip kesik noktalara döner.
// Taramalar piksel başına "çizgiye uzaklık" alanından hesaplanır (her öğe kendi biçimini izleyen çizgi
// ailesiyle: kubbede meridyen + paralel, minarede ve kasnakta silindir çizgileri, gökte yatay dalgalı çizgiler,
// taç yapraklarda ışınsal çizgiler, yapraklarda damar yönünde balıksırtı); kontur ve vurgu kazımaları tuvale çizilir.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  const karR = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // SVG yolunu nokta dizilerine çevir (her alt yol ayrı)
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('style', 'position:absolute;left:-3000px;top:0;width:10px;height:10px');
  const yolEl = document.createElementNS(svgNS, 'path');
  svgEl.appendChild(yolEl); document.body.appendChild(svgEl);
  function yolNoktalari(d, adim) {

      const L = yolEl.getTotalLength(), n = Math.max(3, Math.ceil(L / (adim || 3))), out = [];

    g.setTransform(S, 0, 0, S, 0, 0);

  }
  const kume = (...adlar) => { const s = new Uint8Array(16); adlar.forEach((a) => (s[BI[a]] = 1)); return s; };
  // ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const PROF = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(1024), kubbeDr = new Float32Array(1024);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < PROF.length - 2 && PROF[j + 1].y > y) j++;

  }

  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');

  const BOL = bolgeDizisi(S);

  const Bt = SAHNE.bitki, Y = SAHNE.yollar();

  // ------------------------------------------------------------ yardımcı tuvaller: vurgu kazımaları, siyah boşluklar, bitki kimlikleri
  const yeni = () => { const c = SAHNE.yeniTuval(W2, W2), x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(S, 0, 0, S, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round'; return x; };
  const kG = yeni(), bG = yeni(), iG = yeni();
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const kazi = (d, w) => { kG.strokeStyle = '#fff'; kG.lineWidth = w; kG.stroke(P2(d)); };
  const bos = (d, w) => { bG.strokeStyle = '#fff'; bG.lineWidth = w; bG.stroke(P2(d)); };
  const bosDoldur = (d) => { bG.fillStyle = '#fff'; bG.fill(P2(d)); };
  const kaziSil = (d) => { kG.globalCompositeOperation = 'destination-out'; kG.fillStyle = '#000'; kG.fill(P2(d)); kG.globalCompositeOperation = 'source-over'; };
  const cz = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y1}`;
  // kademeli kalınlıkta kazıma (uçlara doğru incelir)
  function kaziInce(pts, w0, w1) {
    for (let i = 1; i < pts.length; i++) {
      const t = i / (pts.length - 1);
      kG.lineWidth = lerp(w0, w1, t); kG.strokeStyle = '#fff';
      kG.beginPath(); kG.moveTo(pts[i - 1][0], pts[i - 1][1]); kG.lineTo(pts[i][0], pts[i][1]); kG.stroke();
    }
  }

  // --- gök: güneş diski ve ışınları
  const GX = 880, GY = 140;
  {
    kG.fillStyle = '#fff'; kG.beginPath(); kG.arc(GX, GY, 44, 0, Math.PI * 2); kG.fill();
    for (const r of [14, 24, 34]) { bG.strokeStyle = '#fff'; bG.lineWidth = 1.1; bG.beginPath(); bG.arc(GX, GY, r, 0, Math.PI * 2); bG.stroke(); }
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2, uz = i % 4 === 0 ? 205 : i % 2 === 0 ? 150 : 112, r0 = 54;
      const pts = []; for (let t = 0; t <= 1.0001; t += 0.05) pts.push([GX + Math.cos(a) * lerp(r0, uz, t), GY + Math.sin(a) * lerp(r0, uz, t)]);
      kaziInce(pts, i % 4 === 0 ? 4.2 : i % 2 === 0 ? 3 : 2.1, 0.3);
    }
    for (const r of [50]) { kG.lineWidth = 2.4; kG.beginPath(); kG.arc(GX, GY, r, 0, Math.PI * 2); kG.stroke(); }
  }
  // --- yapı konturları: siyah boşluklar + ışıklı yanda ince vurgu kazıması
  {
    // pencereler: siyah kalır, kenarında ince kazınmış çerçeve
    const pencereler = [...SAHNE.kasnakPencereleri(0).map((p) => [p, 1]), ...SAHNE.kasnakPencereleri(1).map((p) => [p, 1.3]), ...SAHNE.kaide.pencereler.map((p) => [p, 1.6]), ...SAHNE.minarePencereleri.map((p) => [p, 1.3])];
    for (const [p, w] of pencereler) {
      const d = SAHNE.kemerYolu(p.x, p.y, p.w, p.h);
      bosDoldur(d);
      kazi(SAHNE.kemerYolu(p.x, p.y - 2.2 * w, p.w + 4.4 * w, p.h + 2.2 * w), 1.1 * w);
    }
    for (const p of SAHNE.kaide.pencereler) { bos(SAHNE.kemerYolu(p.x, p.y - 8, p.w + 18, p.h + 8), 1.6); kazi(SAHNE.kemerYolu(p.x, p.y - 11, p.w + 24, p.h + 11), 1.3); }
    // kubbe kaburgaları: siyah ince boşluk, sağında (ışıklı yan) parlak kazıma

      const pts = k.noktalar;
      bos(SAHNE.yol(pts), 1.6);
      kazi(SAHNE.yol(pts.map(([x, y]) => [x + 2.1 * Math.sqrt(Math.max(0.05, 1 - k.u * k.u)), y])), 0.9 + 0.6 * sstep(-0.6, 0.8, k.u));
    }
    kazi(SAHNE.kubbeYolu, 1.2);
    // kasnak ve kaide bantları
    for (const q of SAHNE.kasnak) { bos(cz(q.x1, q.y1, q.x2, q.y1), 2.2); kazi(cz(q.x1 + 2, q.y1 + 3, q.x2 - 2, q.y1 + 3), 1.4); }
    bos(cz(334, 692, 786, 692), 2.2);
    // korniş: yoğun kazınmış parlak şerit
    kG.fillStyle = '#fff'; kG.fillRect(292, 694, 538, 3.5); kG.globalAlpha = 0.7; kG.fillRect(292, 699, 538, 1.5); kG.globalAlpha = 1;
    bos(cz(290, 704, 830, 704), 2.4);
    // kaide taş derzleri (siyah)
    for (let y = 720, sira = 0; y < 800; y += 16, sira++) {
      bos(cz(300, y, 820, y), 1.3);
      for (let x = 300 + (sira % 2 ? 26 : 8); x < 820; x += 44) if (!SAHNE.kaide.pencereler.some((p) => Math.abs(x - p.x) < p.w / 2 + 14)) bos(cz(x, y, x, y + 16), 1.3);
    }
    // minare: şerefe kenarları, korkuluk kazımaları, zikzak
    const MP = SAHNE.minareParcalari();
    for (const p of MP) {
      if (p.tip === 'korkuluk') {
        bosDoldur(SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true));
        const adet = 10;

    // zemin: kazınmış ot vuruşları
    const rr = SAHNE.rng(77);

      const x = rr() * 1024, y = 803 + Math.pow(rr(), 0.9) * 225;

  // tam öklid uzaklık dönüşümü (Felzenszwalb): bant konturları bulutun dış çizgisini izlesin
  function edt1(f, n) {
