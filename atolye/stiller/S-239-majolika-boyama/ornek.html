<script src="../../sahne/sahne.js"></script>
<script>
// S-239 Majolika Boyama — hayalî bir ressamın eli. Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
// Kâğıt, lavi, maske ve yol yardımcıları atölyenin S-161 kitinden uyarlanmıştır; çizim bu dosyanın sonundadır.
(function () {
  'use strict';
  // ================================================================ ortak kit: kâğıt, lavi, yol, ışık
  const N = 1024, NN = N * N, N2 = 2048, NN2 = N2 * N2, PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karis(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(PI2 * r()); }

  /** Değer gürültüsü (0..1). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function hashF(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /** Kâğıt yükseklik alanı (2048 × 2048, 0..1). o: {tohum, ince:[ölçek,genlik], orta, iri, kum, dokuma(X,Y)} */
  function kagitYap(o) {
    const n1 = gurultu(o.tohum), n2 = gurultu(o.tohum + 1), n3 = gurultu(o.tohum + 2);
    const H = new Float32Array(NN2);
    const [s1, a1] = o.ince, [s2, a2] = o.orta, [s3, a3] = o.iri;
    const kum = o.kum || 0;
    let mn = 1e9, mx = -1e9;
    for (let Y = 0; Y < N2; Y++) {
      for (let X = 0; X < N2; X++) {
        let v = a1 * (0.62 * n1(X / s1, Y / s1) + 0.38 * n1(X / (s1 * 0.47) + 91.3, Y / (s1 * 0.47) + 13.7)) + a2 * n2(X / s2, Y / s2) + a3 * n3(X / s3, Y / s3);
        if (o.dokuma) v += o.dokuma(X, Y);
        if (kum) v += (hashF(X, Y, o.tohum) - 0.5) * kum;
        H[Y * N2 + X] = v;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
    }
    const k = 1 / (mx - mn || 1);
    for (let i = 0; i < NN2; i++) H[i] = (H[i] - mn) * k;
    return H;
  }
  /** 2048 alanı 1024'e indirir (2×2 ortalama). */
  function kucult(H) {
    const h = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = 2 * y * N2 + 2 * x;
      h[y * N + x] = (H[i] + H[i + 1] + H[i + N2] + H[i + N2 + 1]) * 0.25;
    }
    return h;
  }

  /** Kutu bulanıklığı (ayrık, gecis kez), yalnız bb içinde. */
  const _kb1 = new Float32Array(NN), _kb2 = new Float32Array(NN);
  function kutuBulanik(src, r, gecis, bb, hedef) {
    r = Math.max(1, Math.round(r));
    const x0 = bb ? bb.x0 : 0, x1 = bb ? bb.x1 : N - 1, y0 = bb ? bb.y0 : 0, y1 = bb ? bb.y1 : N - 1;
    const a = hedef || new Float32Array(NN);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) a[y * N + x] = src[y * N + x];
    const t = _kb1;
    const inv = 1 / (2 * r + 1);
    for (let g = 0; g < gecis; g++) {
      for (let y = y0; y <= y1; y++) {
        const row = y * N;
        let s = 0;
        for (let k = -r; k <= r; k++) s += a[row + clamp(x0 + k, x0, x1)];
        for (let x = x0; x <= x1; x++) {
          t[row + x] = s * inv;
          s += a[row + Math.min(x1, x + r + 1)] - a[row + Math.max(x0, x - r)];
        }
      }
      for (let x = x0; x <= x1; x++) {
        let s = 0;
        for (let k = -r; k <= r; k++) s += t[clamp(y0 + k, y0, y1) * N + x];
        for (let y = y0; y <= y1; y++) {
          a[y * N + x] = s * inv;
          s += t[Math.min(y1, y + r + 1) * N + x] - t[Math.max(y0, y - r) * N + x];
        }
      }
    }
    return a;
  }

  // ---------------------------------------------------------------- maskeler (1024)
  function sinirla(M) {
    let x0 = N, x1 = -1, y0 = N, y1 = -1;
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) if (M[row + x] > 0.002) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    M.bb = x1 < 0 ? null : { x0, x1, y0, y1 };
    return M;
  }
  const _mc = SAHNE.yeniTuval(N, N);
  const _mx = _mc.getContext('2d', { willReadFrequently: true });
  /** Yol çizen bir işlevden maske (beyaz dolgu/çizgi → 1). */
  function yolMaske(ciz) {
    _mx.setTransform(1, 0, 0, 1, 0, 0);
    _mx.globalCompositeOperation = 'source-over';
    _mx.clearRect(0, 0, N, N);
    _mx.fillStyle = '#fff';
    _mx.strokeStyle = '#fff';
    _mx.lineCap = 'round';
    _mx.lineJoin = 'round';
    ciz(_mx);
    const d = _mx.getImageData(0, 0, N, N).data;
    const M = new Float32Array(NN);
    for (let i = 0; i < NN; i++) M[i] = d[4 * i + 3] / 255;
    return sinirla(M);
  }
  function mIslem(A, B, f) { const M = new Float32Array(NN); for (let i = 0; i < NN; i++) M[i] = f(A[i], B ? B[i] : 0); return sinirla(M); }
  const mEksi = (A, B) => mIslem(A, B, (a, b) => a * (1 - b));
  const mCarp = (A, B) => mIslem(A, B, (a, b) => a * b);
  const mBirles = (A, B) => mIslem(A, B, (a, b) => Math.max(a, b));
  function mFonk(A, f) { const M = new Float32Array(NN); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; if (A[i] > 0) M[i] = A[i] * f(x, y); } return sinirla(M); }

  const BOLGE_AD = Object.keys(SAHNE.BOLGE);
  /** Bitkisiz bölge kimlikleri (yapı, gök, zemin). */
  function bolgeKimlik() {
    const c = SAHNE.yeniTuval(N, N);
    const x = c.getContext('2d', { willReadFrequently: true });
    SAHNE.ciz(x, { bolge: true, cicek: false });
    const d = x.getImageData(0, 0, N, N).data;
    const ids = new Uint8Array(NN);
    const bel = new Map();
    for (let i = 0; i < NN; i++) {
      const key = (d[4 * i] << 16) | (d[4 * i + 1] << 8) | d[4 * i + 2];
      let v = bel.get(key);
      if (v === undefined) { v = BOLGE_AD.indexOf(SAHNE.bolgeAdi(d[4 * i], d[4 * i + 1], d[4 * i + 2])); bel.set(key, v); }
      ids[i] = v;
    }
    return ids;
  }
  function bolgeMaske(ids, adlar, kosul) {
    const set = adlar.map((a) => BOLGE_AD.indexOf(a));
    const M = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (set.includes(ids[i]) && (!kosul || kosul(x, y))) M[i] = 1;
    }
    sinirla(M);
    if (!M.bb) return M;
    const bb = { x0: Math.max(0, M.bb.x0 - 2), x1: Math.min(N - 1, M.bb.x1 + 2), y0: Math.max(0, M.bb.y0 - 2), y1: Math.min(N - 1, M.bb.y1 + 2) };
    const R = kutuBulanik(M, 1, 1, bb);
    return sinirla(R);
  }

  // ---------------------------------------------------------------- lavi (saydam suluboya katmanı, 1024)
  function laviKur(H1, tohum) {
    const a = gurultu(tohum + 21), b = gurultu(tohum + 22), c = gurultu(tohum + 23);
    const dx = new Float32Array(NN), dy = new Float32Array(NN), ak = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      dx[i] = (a(x / 26, y / 26) - 0.5) * 1.3 + (a(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      dy[i] = (b(x / 26, y / 26) - 0.5) * 1.3 + (b(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      ak[i] = 0.6 * c(x / 70, y / 70) + 0.4 * c(x / 19 + 7, y / 19 + 3);
    }
    return { dx, dy, ak, H: H1, buf: new Float32Array(3 * NN).fill(1), say: 0 };
  }
  /** Aynalı sarma: gürültü haritası kaydırılınca dikiş çıkmasın. */
  const ayna = (v) => { v &= 2047; return v > 1023 ? 2047 - v : v; };
  const _md = new Float32Array(NN), _mb = new Float32Array(NN);
  /** Bir lavi katı: M maskesi, renk; o: guc, kenar (kenarda pigment birikmesi), tane, akis, oyna (kenar titremesi),
   *  kx/ky (kayma), yay (kenar bulanıklık yarıçapı), yumusak (0..1 ıslak kenar), f(x,y) yoğunluk çarpanı. */
  function lavi(L, M, renk, o) {
    o = Object.assign({ guc: 0.5, kenar: 0.5, tane: 0.25, akis: 0.25, oyna: 1.5, kx: 0, ky: 0, yay: 3, yumusak: 0, f: null }, o || {});
    if (!M.bb) return;
    L.say++;
    const ox = (L.say * 197) & 1023, oy = (L.say * 331) & 1023;
    const C = hex(renk).map((v) => 1 - v / 255);
    const pad = Math.ceil(o.oyna + Math.abs(o.kx) + Math.abs(o.ky) + o.yay * 3 + 3);
    const bb = { x0: Math.max(0, M.bb.x0 - pad), x1: Math.min(N - 1, M.bb.x1 + pad), y0: Math.max(0, M.bb.y0 - pad), y1: Math.min(N - 1, M.bb.y1 + pad) };
    const Md = _md;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const j = ayna(y + oy) * N + ayna(x + ox);
      const sx = clamp(x + L.dx[j] * o.oyna - o.kx, 0, N - 1.001), sy = clamp(y + L.dy[j] * o.oyna - o.ky, 0, N - 1.001);
      const ix = Math.floor(sx), iy = Math.floor(sy);
      let v = 0;
      {
        const fx = sx - ix, fy = sy - iy, k = iy * N + ix;
        const a = M[k] + (M[k + 1] - M[k]) * fx, b = M[k + N] + (M[k + N + 1] - M[k + N]) * fx;
        v = a + (b - a) * fy;
      }
      Md[y * N + x] = v;
    }
    const B = o.yay > 0 ? kutuBulanik(Md, o.yay, 2, bb, _mb) : Md;
    const buf = L.buf;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const i = y * N + x;
      const m = Md[i], bl = B[i];
      if (m < 0.002 && bl < 0.002) continue;
      const j = ayna(y + oy) * N + ayna(x + ox);
      const base = o.yumusak ? m + (bl - m) * o.yumusak : m;
      let e = m - bl;
      if (e < 0) e = 0;
      let d = base * o.guc * (1 + o.kenar * e * 2.5) * (1 + o.akis * (L.ak[j] - 0.5) * 2) * (1 + o.tane * (0.5 - L.H[i]) * 2);
      if (o.f) d *= o.f(x, y);
      if (d <= 0) continue;
      if (d > 1) d = 1;
      buf[3 * i] *= 1 - d * C[0];
      buf[3 * i + 1] *= 1 - d * C[1];
      buf[3 * i + 2] *= 1 - d * C[2];
    }
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) Md[y * N + x] = 0;
  }

  // ---------------------------------------------------------------- katmanlar ve birleştirme (2048)
  function katman() {
    const c = SAHNE.yeniTuval(N2, N2);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x };
  }
  /** Son birleştirme: kâğıt rengi × lavi × mürekkep katmanları, kâğıt dokusu kabartması.
   *  o: {ctx, kagit(X,Y,h)→[r,g,b] 0..1, H (2048), L (lavi), katmanlar:[{c, mod:'carp'|'ust', dis(X,Y,h,a)→a}], kabartma, cukur} */
  function birlestir(o) {
    const out = o.ctx.createImageData(N2, N2);
    const od = out.data;
    const H = o.H, buf = o.L ? o.L.buf : null;
    const kat = o.katmanlar.map((k) => ({ d: k.c.getContext('2d').getImageData(0, 0, N2, N2).data, mod: k.mod, dis: k.dis, renk: k.renk }));
    const kab = o.kabartma || 0, cuk = o.cukur || 0;
    for (let Y = 0; Y < N2; Y++) {
      const sy = Math.min(N - 1.001, Math.max(0, (Y + 0.5) / 2 - 0.5));
      const iy = Math.floor(sy), fy = sy - iy;
      for (let X = 0; X < N2; X++) {
        const I = Y * N2 + X;
        const h = H[I];
        let [r, g, b] = o.kagit(X, Y, h);
        if (buf) {
          const sx = Math.min(N - 1.001, Math.max(0, (X + 0.5) / 2 - 0.5));
          const ix = Math.floor(sx), fx = sx - ix;
          const k = iy * N + ix;
          const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
          r *= buf[3 * k] * w00 + buf[3 * k + 3] * w10 + buf[3 * (k + N)] * w01 + buf[3 * (k + N) + 3] * w11;
          g *= buf[3 * k + 1] * w00 + buf[3 * k + 4] * w10 + buf[3 * (k + N) + 1] * w01 + buf[3 * (k + N) + 4] * w11;
          b *= buf[3 * k + 2] * w00 + buf[3 * k + 5] * w10 + buf[3 * (k + N) + 2] * w01 + buf[3 * (k + N) + 5] * w11;
        }
        for (const K of kat) {
          let a = K.d[4 * I + 3] / 255;
          if (a <= 0) continue;
          if (K.dis) a = K.dis(X, Y, h, a, K.d[4 * I], K.d[4 * I + 1], K.d[4 * I + 2]);
          if (a <= 0) continue;
          let cr = K.d[4 * I] / 255, cg = K.d[4 * I + 1] / 255, cb = K.d[4 * I + 2] / 255;
          if (K.renk) { const c = K.renk(X, Y, h, cr, cg, cb); cr = c[0]; cg = c[1]; cb = c[2]; }
          if (K.mod === 'carp') { r *= 1 - a * (1 - cr); g *= 1 - a * (1 - cg); b *= 1 - a * (1 - cb); }
          else { r += (cr - r) * a; g += (cg - g) * a; b += (cb - b) * a; }
        }
        if (kab || cuk) {
          const X1 = X > 1 ? X - 2 : X, Y1 = Y > 1 ? Y - 2 : Y, X2 = X < N2 - 2 ? X + 2 : X, Y2 = Y < N2 - 2 ? Y + 2 : Y;
          const s = 1 + kab * (H[Y1 * N2 + X1] - H[Y2 * N2 + X2]) - cuk * (0.5 - h);
          r *= s; g *= s; b *= s;
        }
        od[4 * I] = r * 255;
        od[4 * I + 1] = g * 255;
        od[4 * I + 2] = b * 255;
        od[4 * I + 3] = 255;
      }
    }
    o.ctx.setTransform(1, 0, 0, 1, 0, 0);
    o.ctx.putImageData(out, 0, 0);
  }

  // ---------------------------------------------------------------- yollar
  /** SVG yolunu (M L C A Z, mutlak) nokta dizilerine çevirir; dizi.kapali bilgisi. */
  function duzlestir(d, adim) {
    adim = adim || 1.5;
    const tok = d.match(/[MLCAZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const cizgi = (x, y) => {
      const m = Math.max(1, Math.ceil(Math.hypot(x - cx, y - cy) / adim));
      for (let j = 1; j <= m; j++) cur.push([cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m]);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') { if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) cizgi(sx, sy); cur.kapali = true; } cx = sx; cy = sy; cur = null; continue; }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') cizgi(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          cur.push([u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const ddx = (cx - x) / 2, ddy = (cy - y) / 2;
        const x1p = cr * ddx + sr * ddy, y1p = -sr * ddx + cr * ddy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(6, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          cur.push([cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy]);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
  /** Eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1], q = out[out.length - 1];
    if (Math.hypot(s[0] - q[0], s[1] - q[1]) > adim * 0.3) out.push([s[0], s[1]]);
    return out;
  }
  /** Yay uzunluğu s0..s1 aralığındaki parça. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = s, b = s + L;
      if (b >= s0 && a <= s1) {
        if (!out.length) { const t = L ? clamp((s0 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); }
        if (b <= s1) out.push([p[i][0], p[i][1]]);
        else { const t = L ? clamp((s1 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); break; }
      }
      s = b;
    }
    return out;
  }
  /** Normal boyunca gürültüyle titretir (elin doğal titremesi). */
  function titret(p, gen, dalga, nf, faz) {
    const out = [];
    let s = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const d = gen * (nf(s / dalga + faz, faz * 1.7) - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }

  }
  /** Çizgiyi bir koşulun doğru olduğu parçalara böler. */
  function kirp(p, ic) {
    const out = [];
    let cur = null;
    for (const q of p) {
      if (ic(q[0], q[1])) { if (!cur) { cur = []; out.push(cur); } cur.push(q); }
      else cur = null;
    }
    return out.filter((c) => c.length > 1);
  }
  /** Değişken kalınlıklı şerit (normal yönünde), uçları yuvarlak. wf(t) → kalınlık. */
  function serit(x, p, wf) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const w = wf(i / (n - 1)) / 2;
      L.push([p[i][0] - ty * w, p[i][1] + tx * w]);
      R.push([p[i][0] + ty * w, p[i][1] - tx * w]);
    }
    x.beginPath();
    x.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) x.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath();
    x.fill();
    const w0 = wf(0) / 2, w1 = wf(1) / 2;
    x.beginPath(); x.arc(p[0][0], p[0][1], w0, 0, PI2); x.fill();
    x.beginPath(); x.arc(p[n - 1][0], p[n - 1][1], w1, 0, PI2); x.fill();

  function cizDizi(x, p) { x.beginPath(); x.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) x.lineTo(p[i][0], p[i][1]); }

  // ---------------------------------------------------------------- ışık (sağ üstten)
  const ISIK = (() => { const v = [0.62, 0.5, 0.6]; const l = Math.hypot(...v); return v.map((a) => a / l); })();
  const _kr = (() => {
    const p = SAHNE.kubbeProfili(600);
    const r = new Float32Array(256), dr = new Float32Array(256);
    for (let h = 0; h <= 255; h++) {
      const y = 555 - h;
      let rr = 0;
      for (let i = 0; i < p.length - 1; i++) if (y <= p[i].y && y >= p[i + 1].y) { const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1); rr = lerp(p[i].r, p[i + 1].r, t); break; }

    }
    for (let h = 0; h <= 255; h++) dr[h] = (r[Math.min(255, h + 1)] - r[Math.max(0, h - 1)]) / (h === 0 || h === 255 ? 1 : 2);

  })();
  function kubbeR(y) { const h = clamp(555 - y, 0, 255); const i = Math.floor(h), f = h - i; return lerp(_kr.r[i], _kr.r[Math.min(255, i + 1)], f); }
  /** Kubbe yüzey normali ve aydınlanma (0..1). */
  function kubbeIsik(x, y) {
    const h = clamp(555 - y, 0, 254.9), i = Math.floor(h);
    const r = Math.max(1, kubbeR(y));
    const u = clamp((x - 560) / r, -1, 1);
    const dr = _kr.dr[i];
    let nr = 1, nh = -dr;
    const l = Math.hypot(nr, nh);
    nr /= l; nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u, ny = nh, nz = nr * c;

  // ---------------------------------------------------------------- sahne biçimleri
  /** Taç yaprağı (ters yumurta, ucunda hafif çentik) nokta dizisi. c: çiçek, i: sıra. */
  function tacNoktalari(c, i, o) {
    o = o || {};
    const a = c.aci + (i * PI2) / 5 + (o.don || 0);
    const L = c.r * (o.boy || 1.0), W = c.r * (o.en || 1.1);
    const ca = Math.cos(a), sa = Math.sin(a);
    const n = o.n || 26, sol = [], sag = [];
    for (let k = 0; k <= n; k++) {
      const u = k / n;
      const w = (W / 2) * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.45)), 0.55) * (0.3 + 0.7 * Math.sqrt(u));
      sol.push([u, w]);

    return pts.map(([u, v]) => {
      const cen = (o.centik || 0) * Math.exp(-Math.pow(v / (W * 0.16), 2)) * sstep(0.8, 1, u);
      const uu = (u - cen) * L + c.r * (o.ic || 0.08);

  function noktaYolu(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); P.closePath(); return P; }
  function yapiCizgileri() {

  /** Alem parçalarının çizgileri: {p, tur:'yaka'|'cubuk'|'kure'|'hilal'} */
  function alemCizgileri(a) {
    const out = [];
    const el = (cx, cy, rx, ry) => { const p = []; for (let i = 0; i <= 64; i++) { const t = (i / 64) * PI2; p.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); } return p; };
    out.push({ p: el(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry), tur: 'yaka' });

    out.push({ p: [[a.cubuk.x2, a.cubuk.y2], [a.cubuk.x2, a.cubuk.y1]], tur: 'cubuk' });
    for (const k of a.kureler) out.push({ p: el(k.cx, k.cy, k.r, k.r), tur: 'kure', k });
    for (const q of duzlestir(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.7)) out.push({ p: q, tur: 'hilal' });

  }

  /** Bitkiler çizim sırasıyla: sap → yaprak → tomurcuk → çiçek. */
  function bitkiListesi(tacO) {
    const B = SAHNE.bitki;
    const out = [];
    B.saplar.forEach((s, i) => out.push({ tur: 'sap', p: ornekle(s, 2), i }));
    B.yapraklar.forEach((y, i) => out.push({ tur: 'yaprak', y, i, p: duzlestir(SAHNE.yaprakYolu(y), 1)[0], damar: SAHNE.yaprakDamari(y) }));
    B.tomurcuklar.forEach((t, i) => out.push({ tur: 'tomurcuk', t, i, p: duzlestir(SAHNE.tomurcukYolu(t), 0.8)[0] }));
    B.cicekler.forEach((c, i) => out.push({ tur: 'cicek', c, i, taclar: [0, 1, 2, 3, 4].map((k) => tacNoktalari(c, k, tacO)) }));

  /** Bitki maskeleri (1024): cicek, tomurcuk, yaprak, sap, hepsi; sapKalin: sap genişliği. */
  function bitkiMaskeleri(liste, sapKalin) {
    const cizTur = (tur) => yolMaske((x) => {
      for (const e of liste) {
        if (e.tur !== tur) continue;
        if (tur === 'sap') { x.lineWidth = sapKalin || 4; x.stroke(noktaYoluAcik(e.p)); }
        else if (tur === 'cicek') { for (const t of e.taclar) x.fill(noktaYolu(t)); x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.3, 0, PI2); x.fill(); }
        else x.fill(noktaYolu(e.p));
      }
    });
    const cicek = cizTur('cicek');
    const tom0 = cizTur('tomurcuk');
    const tomurcuk = mEksi(tom0, cicek);
    const ust = mBirles(cicek, tom0);
    const yap0 = cizTur('yaprak');
    const yaprak = mEksi(yap0, ust);
    const ust2 = mBirles(ust, yap0);
    const sap0 = cizTur('sap');
    const sap = mEksi(sap0, ust2);

  function noktaYoluAcik(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); return P; }
  /** Çiçek merkezine uzaklık / yarıçap haritası (çiçek maskesinde). */
  function cicekUzaklik(liste) {
    const D = new Float32Array(NN).fill(9);
    for (const e of liste) {
      if (e.tur !== 'cicek') continue;
      const c = e.c, R = c.r * 1.2;
      for (let y = Math.max(0, Math.floor(c.y - R)); y <= Math.min(N - 1, Math.ceil(c.y + R)); y++)
        for (let x = Math.max(0, Math.floor(c.x - R)); x <= Math.min(N - 1, Math.ceil(c.x + R)); x++) {
          const d = Math.hypot(x - c.x, y - c.y) / c.r;
          if (d < D[y * N + x]) D[y * N + x] = d;
        }
    }
    return D;
  }


  // ================================================================ j8 ekleri: bulut biçimi, kalem konturu, fırça vuruşu
  const ISIK2 = (() => { const v = [0.78, -0.63]; const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; })();

  /** Bulut: hafif dalgalı taban, üstte farklı boyda birkaç geniş tepe (daire yayı değil, toplanmış yumuşak eğri).
   *  b: {x, y (taban), w, h, tohum, n}. Döner: {pts (kapalı), ust (soldan sağa üst kenar), alt, x0, x1, taban, P} */
  function bulutSekli(b) {
    const r = SAHNE.rng(b.tohum || 1);
    const n = b.n || 4;
    const tepeler = [];
    const dd = 0.84 / n;
    for (let i = 0; i < n; i++) tepeler.push({ t: 0.08 + dd * (i + 0.5) + (r() - 0.5) * dd * 0.3, s: dd * (0.42 + r() * 0.14), h: (0.5 + r() * 0.5) * (0.75 + 0.5 * Math.sin(Math.PI * (i + 0.5) / n)) });
    const M = 120, ust = [], alt = [];
    const tepe = b.tepe == null ? 0.3 : b.tepe;
    for (let k = 0; k <= M; k++) {
      const t = k / M, th = Math.PI * (1 - t);
      let v = 0;
      for (const q of tepeler) v += q.h * Math.exp(-Math.pow((t - q.t) / q.s, 2));
      const rr = 1 - tepe + tepe * Math.min(1.25, v);
      ust.push([b.x + (b.w / 2) * Math.cos(th), b.y - b.h * Math.pow(Math.sin(th), 0.9) * rr]);
      alt.push([b.x + (b.w / 2) * Math.cos(th), b.y + b.h * 0.1 * Math.pow(Math.sin(th), 0.6) + b.h * 0.03 * Math.sin(t * 11 + (b.tohum || 0)) * Math.sin(th)]);
    }
    const pts = ust.concat(alt.slice(1, -1).reverse());
    return { pts, ust, alt, x0: b.x - b.w / 2, x1: b.x + b.w / 2, taban: b.y, P: noktaYolu(pts) };
  }

  /** Kapalı nokta dizisinin işaretli alanı (> 0: ekranda saat yönü). */
  function isaretliAlan(p) { let A = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; A += a[0] * b[1] - b[0] * a[1]; } return A / 2; }

  /** Dışa bakan normaller: kapalı dizide alan işaretinden, açık dizide o.yan ([nx,ny] yaklaşık dış yön) ile. */
  function disNormaller(p, kapali, yan) {
    const n = p.length, out = [];
    const sg = kapali ? (isaretliAlan(p) > 0 ? 1 : -1) : 1;
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      let nx = ty * sg, ny = -tx * sg;
      if (!kapali && yan && nx * yan[0] + ny * yan[1] < 0) { nx = -nx; ny = -ny; }
      out.push([nx, ny]);
    }
    return out;
  }

  /** Değişken kalınlıklı kapalı ya da açık şerit; w dizisi nokta başına kalınlık. Uçlar yuvarlak. */
  function seritW(x, p, w, kapali) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];

  // ---------------------------------------------------------------- sır: süt beyazı, pürüzsüz, kalınlığı çok hafif dalgalı
  const H = kagitYap({ tohum: 2394, ince: [3, 0.05], orta: [40, 0.25], iri: [260, 0.7], kum: 0.01 });
  const SIR = hex('#F7F6F0').map((v) => v / 255);
  const kagit = (X, Y, h) => {
    const k = 0.982 + 0.026 * h + 0.012 * Math.exp(-Math.pow((X * 0.6 - Y * 0.8 + 300) / 900, 2));
    return [SIR[0] * k, SIR[1] * k * 1.0, SIR[2] * k * (1.002 - 0.006 * h)];
  };

  // pigment katmanları (beyaz zemin üstüne çarpımsal)
  function pigment() { const k = katman(); k.x.fillStyle = '#fff'; k.x.fillRect(0, 0, N, N); k.x.globalCompositeOperation = 'multiply'; return k; }
  function bulanik(k, px) { const b = katman(); b.x.setTransform(1, 0, 0, 1, 0, 0); b.x.fillStyle = '#fff'; b.x.fillRect(0, 0, N2, N2); b.x.filter = `blur(${px}px)`; b.x.drawImage(k.c, 0, 0); b.x.filter = 'none'; return b; }
  const KOB = pigment(), YES = pigment(), SAR = pigment(), MAN = pigment();
  const bolgeA = (x, y) => bolgeAd(ids, x, y);
  const bitkide = (x, y) => (BM.hepsi[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)] || 0) > 0.3;
  const elA = (pts, gen) => titret(ornekle(pts, 1), gen == null ? 0.5 : gen, 40, nf3, rng() * 80);
  /** Fırça vuruşu (tek basış): yük başta dolu, sonda boya göllenir. */
  /** Basınç: fırça değince incecik, ortada dolgun, sonda biraz daralıp göllenir. */
  const nabiz = () => { const f = rng() * 50, g = 0.25 + rng() * 0.3; return (t) => (0.55 + 0.45 * Math.pow(Math.sin(Math.PI * Math.min(1, t * (1.1 + g))), 0.6)) * (1 + 0.16 * (nf2(t * 4 + f, f) - 0.5) * 2) * (t > 0.85 ? 1 - (t - 0.85) * 1.2 : 1); };
  const fv = (k, p, renk, o) => vurus(k.x, p, Object.assign({ renk, a0: 0.5, a1: 0.38, havuz: 0.22, kil: 3, kilA: 0.1, kilW: 0.1, rng }, o));

  // ---------------------------------------------------------------- bulutlar ve güneş (sır beyazı bırakılır)
  const BA = bulutAlani([
    { x: 172, y: 282, w: 250, h: 74, tohum: 31, tepe: 0.38 },
    { x: 508, y: 176, w: 182, h: 54, tohum: 32, tepe: 0.6 },
    { x: 784, y: 358, w: 242, h: 72, tohum: 33, tepe: 0.4 },
    { x: 952, y: 482, w: 138, h: 36, tohum: 34, tepe: 0.52, ek: 2 },
    { x: 84, y: 488, w: 148, h: 36, tohum: 35, tepe: 0.45, ek: 2 },
  ], { tohum: 2395 });
  const bulutKontur = BA.bulutlar.map((c) => esikKonturu(BA.F, 0.5, c.bb, 3));
  // fırça bulutun çevresinden dolaşır: biraz genişletilmiş siluet
  const bulutta = (x, y) => BA.F[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)] > 0.47;
  const gunesUz = (x, y) => Math.hypot(x - GX, y - GY);
  const gunesR = (a) => 37 + 2 * (nf4(Math.cos(a) + 3, Math.sin(a) + 3) - 0.5) * 2;
  const gokte = (x, y) => { const a = bolgeA(x, y); return (a === 'gok' || a === 'gunes' || gunesUz(x, y) < 96) && !bulutta(x, y) && !bitkide(x, y); };
  const gunesHalka = (a) => 47 + 3 * (nf4(Math.cos(a) * 1.2 + 11, Math.sin(a) * 1.2 + 11) - 0.5) * 2;
  const gunesDisi = (x, y) => gunesUz(x, y) > gunesHalka(Math.atan2(y - GY, x - GX));

  // ---------------------------------------------------------------- gök: kobalt yatay vuruşlar; tepede üst üste binen
  // geniş vuruşlar (binen yerler koyulaşır), aşağıda incelip seyrekleşen açık vuruşlar, ufukta neredeyse çıplak sır
  {
    const r = SAHNE.rng(23901);
    let y = 8;
    while (y < 735) {
      const t = clamp(y / 735, 0, 1);
      const w = lerp(34, 13, Math.pow(t, 0.75)) * (0.88 + 0.24 * r());
      const yuk = lerp(0.34, 0.17, Math.pow(t, 0.8));
      const acik = t > 0.58;
      let x = -40 - r() * 160;
      while (x < 1060) {
        const len = (t < 0.4 ? 260 : t < 0.65 ? 130 : 60) + r() * (t < 0.4 ? 320 : t < 0.65 ? 220 : 150);
        const egim = (r() - 0.5) * 0.04, kav = (r() - 0.5) * 11, dy = (r() - 0.5) * w * 0.4;
        const pts = [];
        for (let s = 0; s <= len; s += 2) pts.push([x + s, y + dy + egim * s + kav * Math.sin((Math.PI * s) / len)]);
        const pay = w * 0.3;
        for (const q of kirp(pts, (a, b) => gokte(a, b) && gokte(a, b - pay) && gokte(a, b + pay) && gunesDisi(a, b))) {
          if (q.length < 10) continue;
          const yy = yuk * (0.85 + 0.3 * r());
          fv(KOB, ornekle(q, 1), acik ? KOBALT_A : KOBALT, { w, a0: yy * (acik ? 1.6 : 1), a1: yy * 0.72 * (acik ? 1.6 : 1), havuz: 0.1 + 0.12 * (1 - t), bas: Math.min(26, w), son: 6, sekil: nabiz(), kil: 6, kilA: 0.06 + 0.06 * (1 - t), kilW: 0.06 });
        }
        // tepede vuruşlar birbirine biner, aşağıda aralarında sır görünür
        x += len + (t < 0.35 ? -26 + r() * 16 : t < 0.6 ? -14 + r() * 30 : 20 + r() * (50 + 260 * (t - 0.6)));
      }
      y += w * lerp(0.4, 2.0, Math.pow(t, 1.7)) * (0.8 + 0.4 * r());
    }
  }
  // güneşin çevresinde sır beyazı bir halka bırakılır (vuruş uçları halkada biter, taşan kenar temizlenir)
  { const k = KOB.x; k.save(); k.globalCompositeOperation = 'source-over'; k.fillStyle = '#fff'; k.beginPath(); for (let a = 0; a < PI2; a += 0.02) { const rr = gunesHalka(a) - 2; k.lineTo(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr); } k.closePath(); k.fill(); k.restore(); }
  // bulut: sır beyazı; açık kobalt konturu (gölge yanında dolgun, iki üç yerde fırça kalkar) ve tabana yakın iki kıvrık gölge vuruşu
  {
    const dis = (x, y) => { const a = bolgeA(x, y); return (a === 'gok' || a === 'gunes') && !bitkide(x, y); };
    for (const kl of bulutKontur) for (const k of kl) {
      if (k.length < 30) continue;
      let i0 = 0; for (let i = 1; i < k.length; i++) if (k[i][0] < k[i0][0]) i0 = i;
      let p = k.slice(i0).concat(k.slice(0, i0));
      if (isaretliAlan(p) < 0) p = [p[0]].concat(p.slice(1).reverse());
      p = titret(ornekle(p.concat([p[0]]), 1), 0.4, 40, nf3, rng() * 80);
      const n = p.length;
      const kes = [Math.floor(n * (0.22 + rng() * 0.1)), Math.floor(n * (0.55 + rng() * 0.1))];
      let s = 0;
      KOB.x.fillStyle = 'rgba(112,140,206,0.9)';
      for (const e of kes.concat([n])) {
        const q = p.slice(s, e);
        if (q.length > 8) fircaKalem(KOB.x, q, { w: 3.0, golge: 1.1, isik: 0.35, sg: 1, maxL: 160, bas: 8, son: 14, basinc: 0.3, rng, nf, goster: dis });
        s = e + 4 + Math.floor(rng() * 5);
      }
    }
    // tabanda, siluetin içinden giden tek, kıvrık açık kobalt gölge vuruşu
    for (const kl of bulutKontur) for (const k of kl) {
      if (k.length < 30) continue;
      let cx = 0, cy = 0; for (const q of k) { cx += q[0]; cy += q[1]; } cx /= k.length; cy /= k.length;
      let ymax = -1; for (const q of k) ymax = Math.max(ymax, q[1]);
      const alt = k.filter((q) => q[1] > cy + (ymax - cy) * 0.35).map((q) => [q[0] + (cx - q[0]) * 0.06, q[1] - 7]);
      alt.sort((a, b) => a[0] - b[0]);
      if (alt.length < 12) continue;
      const p = ornekle(alt.filter((q, i) => i % 3 === 0), 1);
      for (const q of kirp(p, (x, y) => BA.F[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)] > 0.62 && dis(x, y))) if (q.length > 10) fv(KOB, titret(q, 0.8, 30, nf3, rng() * 50), KOBALT_A, { w: 9, a0: 0.38, a1: 0.3, havuz: 0.12, bas: 10, son: 8, sekil: nabiz(), kil: 2, kilA: 0.05 });
    }
  }

  // güneş: antimon sarısı, kursu dolanan iki üç yuvarlak vuruş; ince okra kenar
  {
    SAR.x.save();
    SAR.x.beginPath(); for (let a = 0; a < PI2; a += 0.03) { const rr = gunesR(a); SAR.x.lineTo(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr); } SAR.x.closePath(); SAR.x.clip();
    for (const [dy, ww, a0, eg] of [[-14, 44, 0.5, 0.08], [15, 44, 0.46, -0.05]]) {
      const p = [];
      for (let s = -48; s <= 48; s += 2) p.push([GX + s, GY + dy + eg * s - 0.0035 * s * s * Math.sign(dy || 1)]);
      fv(SAR, ornekle(p, 1), ANTIMON, { w: ww, a0, a1: a0 * 0.85, havuz: 0.14, bas: 10, son: 6, kil: 3, kilA: 0.06 });
    }
    SAR.x.restore();
    const p = []; for (let a = 0.3; a < PI2 - 0.15; a += 0.02) { const rr = gunesR(a) + 0.5; p.push([GX + Math.cos(a) * rr, GY + Math.sin(a) * rr]); }
    fv(SAR, elA(p, 0.4), OKRA, { w: 2.6, a0: 0.5, a1: 0.42, havuz: 0.2, kil: 0, bas: 6, son: 10 });
  }

  // ---------------------------------------------------------------- kubbe: bakır yeşili, dilim boyunca tarama vuruşları
  const kab = (k) => -Math.PI / 2 + (Math.PI * k) / 16;
  for (let k = 0; k < 16; k++) {
    const b0 = kab(k), b1 = kab(k + 1);
    const bc = (b0 + b1) / 2;
    const isik = kubbeIsik(560 + Math.sin(bc) * 150, 430);
    const koyu = 1 - isik;
    const m = 3;
    const katSay = koyu > 0.5 ? 2 : 1;
    for (let kat = 0; kat < katSay; kat++) {
      for (let j = 0; j < m; j++) {
        const bj = b0 + ((j + 0.5 + (rng() - 0.5) * 0.3) / m) * (b1 - b0);
        const pts = [], ws = [];
        const yTop = 302 + rng() * 4 + kat * (60 + rng() * 30);
        for (let y = 553 - rng() * 2; y >= yTop; y -= 1) {
          const R = kubbeR(y);
          pts.push([560 + Math.sin(bj) * R, y]);
          ws.push(Math.max(1.0, ((Math.sin(b1) - Math.sin(b0)) * R) / m) * 1.5);
        }
        if (pts.length < 6) continue;
        const yuk = (0.3 + 0.42 * koyu) * (kat ? 0.75 : 1);
        fv(YES, pts, BAKIR, { w: 8, wDizi: ws, a0: yuk, a1: yuk * 0.6, havuz: 0, bas: 2, son: 24, kil: 2, kilA: 0.1 });
      }
    }
  }
  // kubbenin altında, kasnağa oturan koyu bir bant vuruşu
  { const p = []; for (let x = 364; x <= 756; x += 2) p.push([x, 546 + 2 * Math.sin(x / 40)]); fv(YES, elA(p, 0.5), BAKIR_K, { w: 12, a0: 0.3, a1: 0.24, havuz: 0.1, bas: 10, son: 10 }); }

  // ---------------------------------------------------------------- kasnak: silindiri izleyen dikey bakır yeşili vuruşlar
  const pencerede = (x, y) => bolgeA(x, y) === 'pencere';
  for (const [kat, y1, y2] of [[0, 556, 609], [1, 611, 691]]) {
    const q = SAHNE.kasnak[kat];
    const R = (q.x2 - q.x1) / 2, cx = (q.x1 + q.x2) / 2;
    const n = kat ? 46 : 42;
    for (let i = 0; i < n; i++) {
      const th = -Math.PI / 2 + (Math.PI * (i + 0.5 + (rng() - 0.5) * 0.3)) / n;
      const x = cx + Math.sin(th) * R;
      const ww = Math.max(4, ((Math.PI * R) / n) * Math.cos(th) * 1.5 + 3);
      const koyu = 1 - silindirIsik(Math.sin(th));
      const p = [];
      for (let y = y1 - 1 + rng() * 2; y <= y2 - rng() * 2; y += 1) p.push([x + 0.6 * Math.sin(y / 9 + i), y]);
      for (const s of kirp(p, (a, b) => a > q.x1 + 1 && a < q.x2 - 1 && !bitkide(a, b))) if (s.length > 5) fv(YES, s, BAKIR, { w: ww, a0: 0.4 + 0.32 * koyu, a1: 0.32 + 0.26 * koyu, havuz: 0.1, bas: 4, son: 6, kil: 2, kilA: 0.07 });
      if (koyu > 0.42) for (const s of kirp(p, (a, b) => a > q.x1 + 1 && a < q.x2 - 1 && !bitkide(a, b))) if (s.length > 5) fv(YES, s, BAKIR_K, { w: ww * 0.7, a0: 0.2 + 0.2 * koyu, a1: 0.16 + 0.15 * koyu, havuz: 0.06, bas: 4, son: 6, kil: 0 });
    }
    // üst ve alt kenarda kasnağı saran birer yatay vuruş
    for (const yy of [y1 + 3, y2 - 3]) fv(YES, elA([[q.x1 + 2, yy], [q.x2 - 2, yy]], 0.4), BAKIR_K, { w: 5, a0: 0.34, a1: 0.28, havuz: 0.1, bas: 10, son: 10, kil: 0 });
  }
  // pencereler sır beyazı bırakılır (yeşil üstlerine taşmaz), sonra kobaltla boyanır
  { const k = YES.x; k.save(); k.globalCompositeOperation = 'source-over'; k.fillStyle = '#fff'; for (const kk of [0, 1]) for (const w of SAHNE.kasnakPencereleri(kk)) k.fill(new Path2D(SAHNE.kemerYolu(w.x, w.y, w.w + 1.5, w.h + 1))); k.restore(); }
  // pencereler: kobalt, kemerin içinde
  const pencereBoya = (w, a0) => {
    const P = new Path2D(SAHNE.kemerYolu(w.x, w.y, w.w, w.h));
    KOB.x.save(); KOB.x.clip(P);
    const p = []; for (let y = w.y + w.h + 2; y > w.y - 2; y -= 1) p.push([w.x, y]);
    fv(KOB, p, KOBALT, { w: w.w * 1.3, a0, a1: a0 * 0.9, havuz: 0.12, bas: 1, son: 2, kil: 0 });
    KOB.x.restore();
  };
  for (const k of [0, 1]) for (const w of SAHNE.kasnakPencereleri(k)) pencereBoya(w, 0.66);

  // ---------------------------------------------------------------- minare ve kaide: sır beyazı; gölge yanında açık kobalt
  const minareGolge = [[266, 492, 800], [273, 318, 436], [281, 208, 272]];
  for (const [x0, y1, y2] of minareGolge) {
    for (let j = 0; j < 2; j++) {
      const x = x0 + 6 + j * 9;
      for (const p of kirp(ornekle([[x, y1 + 2], [x, y2 - 2]], 1), (a, b) => bolgeA(a, b) === 'minare' && !pencerede(a + 4, b) && !pencerede(a - 4, b) && !bitkide(a, b) && !(b > 520 && b < 585))) if (p.length > 6) fv(KOB, p, KOBALT_A, { w: 10 - j * 2, a0: 0.34 - j * 0.08, a1: 0.26, havuz: 0.1, bas: 3, son: 6 });
    }
  }
  for (const [x1, x2, y] of [[248, 352, 462], [257, 343, 295], [277, 323, 202]]) fv(KOB, elA([[x1 + 3, y], [x2 - 3, y]], 0.3), KOBALT_A, { w: 6, a0: 0.3, a1: 0.25, havuz: 0.1, bas: 3, son: 3, kil: 0 });
  for (const [x1, x2, y] of [[268, 332, 480], [276, 324, 310]]) fv(KOB, elA([[x1, y], [x2, y]], 0.3), KOBALT_A, { w: 10, a0: 0.3, a1: 0.25, havuz: 0.1, bas: 3, son: 3, kil: 0 });
  // kaide: korniş altı şerit ve sol uç
  fv(KOB, elA([[296, 709], [824, 709]], 0.6), KOBALT_A, { w: 9, a0: 0.34, a1: 0.26, havuz: 0.12, bas: 10, son: 10 });
  for (let x = 306; x < 336; x += 9) for (const p of kirp(ornekle([[x, 716], [x, 798]], 1), (a, b) => !bitkide(a, b))) if (p.length > 6) fv(KOB, p, KOBALT_A, { w: 9, a0: 0.28, a1: 0.22, havuz: 0.1, bas: 3, son: 5 });
  for (const w of SAHNE.kaide.pencereler.concat(SAHNE.minarePencereleri)) pencereBoya(w, 0.6);
  // zikzak bandı: kobalt
  for (const z of SAHNE.zikzakCizgileri()) { KOB.x.fillStyle = 'rgba(59,99,184,0.7)'; fircaKalem(KOB.x, elA(z, 0.3), { w: 2.6, golge: 0, isik: 0, maxL: 300, bas: 3, son: 4, rng, nf }); }

  // altın alemler: antimon sarısı, gölge yanı okra
  const alemBoya = (a) => {
    const kuc = a.kureler[0].r < 9 ? 0.62 : 1;
    for (const k of a.kureler) { const p = []; for (let t = -1; t <= 1; t += 0.05) p.push([k.cx + t * k.r * 0.2, k.cy - k.r * 0.75 + (t + 1) * k.r * 0.75]); fv(SAR, ornekle(p, 1), ANTIMON, { w: k.r * 1.7, a0: 0.65, a1: 0.6, havuz: 0.1, kil: 0, bas: 1, son: 2 }); fv(SAR, ornekle([[k.cx - k.r * 0.45, k.cy - k.r * 0.6], [k.cx - k.r * 0.5, k.cy + k.r * 0.6]], 1), OKRA, { w: k.r * 0.7, a0: 0.5, a1: 0.5, havuz: 0.1, kil: 0, bas: 1, son: 1 }); }
    fv(SAR, ornekle([[a.yaka.cx - a.yaka.rx * 0.9, a.yaka.cy], [a.yaka.cx + a.yaka.rx * 0.9, a.yaka.cy]], 1), ANTIMON, { w: a.yaka.ry * 1.8, a0: 0.65, a1: 0.6, havuz: 0.15, kil: 0, bas: 2, son: 3 });
    fv(SAR, ornekle([[a.cubuk.x1 + 2.6 * kuc, a.cubuk.y2], [a.cubuk.x1 + 2.6 * kuc, a.cubuk.y1]], 1), ANTIMON, { w: 5 * kuc, a0: 0.6, a1: 0.55, havuz: 0, kil: 0, bas: 1, son: 1 });
    const h = a.hilal; const p = []; for (let t = 0.15; t <= Math.PI - 0.15; t += 0.05) p.push([h.cx - Math.cos(t) * h.R * 0.92, h.cy + Math.sin(t) * h.R * 0.92 - h.R * 0.1]);
    fv(SAR, ornekle(p, 1), ANTIMON, { w: h.R * 0.32, a0: 0.7, a1: 0.65, havuz: 0.1, kil: 0, bas: 2, son: 2 });
  };
  alemBoya(SAHNE.alemParcalari(560, 300, 1));
  alemBoya(SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem);
  // minare topuzu ve bilezik: çok açık kobalt gölge
  fv(KOB, ornekle([[285, 196], [282, 178], [292, 160]], 1), KOBALT_A, { w: 9, a0: 0.3, a1: 0.24, havuz: 0.1, kil: 0, bas: 3, son: 5 });

  // ---------------------------------------------------------------- yer: ufukta açık antimon sarısı, önde bakır yeşili; vuruşlar
  // kaydırmalı, boyları ve kalınlıkları değişen, öne doğru sıklaşan yatay basışlar
  {
    let y = 806;
    while (y < 1034) {
      const t = (y - 800) / 224;
      const w = lerp(13, 24, t) * (0.85 + 0.3 * rng());
      let x = -30 - rng() * 140;
      while (x < 1054) {
        const len = 70 + rng() * 190;
        const pts = [];
        const dy = (rng() - 0.5) * w * 0.5, eg = (rng() - 0.5) * 0.03;
        for (let s = 0; s <= len; s += 2) pts.push([x + s, y + dy + eg * s + 2 * Math.sin(s / 50 + y)]);
        for (const p of kirp(pts, (a, b) => !bitkide(a, b) && !bitkide(a, b - 5) && !bitkide(a, b + 5) && bolgeA(a, b) === 'zemin')) {
          if (p.length < 6) continue;
          if (t < 0.13) fv(SAR, ornekle(p, 1), ANTIMON, { w, a0: 0.3, a1: 0.22, havuz: 0.1, bas: 14, son: 6, sekil: nabiz(), kil: 2, kilA: 0.05 });
          else fv(YES, ornekle(p, 1), BAKIR, { w, a0: 0.14 + 0.24 * t, a1: 0.1 + 0.18 * t, havuz: 0.1, bas: 14, son: 6, sekil: nabiz(), kil: 2, kilA: 0.05 });
        }
        x += len + (t < 0.4 ? 8 + rng() * 60 : -6 + rng() * 30);
      }
      y += w * lerp(1.45, 0.8, t) * (0.8 + 0.4 * rng());
    }
  }

  // ---------------------------------------------------------------- bitkiler: bakır yeşili yapraklar (tek basış), sarı göbekler
  const golgeYan = (e) => { const a = e.y.aci; return Math.sin(a) * 0.78 + Math.cos(a) * 0.62 < 0 ? 1 : 0; };
  // öndeki biçim arkadakileri örter: önce arkadaki boyalar bitki siluetinde silinir (sır beyazı geri gelir)
  const beyazla = (k, fn) => { k.x.save(); k.x.globalCompositeOperation = 'source-over'; k.x.fillStyle = '#fff'; k.x.strokeStyle = '#fff'; fn(k.x); k.x.restore(); };
  for (const k of [KOB, YES, SAR]) beyazla(k, (x) => { for (const e of liste) { if (e.tur === 'sap') { x.lineWidth = 3; x.stroke(noktaYoluAcik(e.p)); } else if (e.tur === 'cicek') { for (const t of e.taclar) x.fill(noktaYolu(t)); x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.3, 0, PI2); x.fill(); } else x.fill(noktaYolu(e.p)); } });
  for (const e of liste) {
    if (e.tur === 'sap') {
      fv(YES, ornekle(e.p.slice().reverse(), 1), BAKIR_K, { w: 4.2, a0: 0.62, a1: 0.5, havuz: 0.1, kil: 0, bas: 6, son: 8 });
    } else if (e.tur === 'yaprak') {
      for (const k of [YES]) beyazla(k, (x) => x.fill(noktaYolu(e.p)));
      const y = e.y, L0 = y.uzunluk, W0 = L0 * y.genislik;
      const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const p = [];
      for (let u = 0.04; u <= 0.97; u += 1 / L0) p.push([y.x + ca * u * L0, y.y + sa * u * L0]);
      const ws = p.map((q, i) => { const u = i / (p.length - 1); return W0 * 1.05 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.8); });
      fv(YES, p, BAKIR, { w: W0, wDizi: ws, a0: 0.62, a1: 0.5, havuz: 0.12, kil: 3, kilA: 0.12, bas: 1, son: 2 });
      // gölge yarısı: ikinci, ince vuruş
      const sgn = golgeYan(e) ? -1 : 1;
      const p2 = p.map((q, i) => { const u = i / (p.length - 1); const off = W0 * 0.22 * Math.sin(Math.PI * u) * sgn; return [q[0] - sa * off, q[1] + ca * off]; });
      fv(YES, p2, BAKIR_K, { w: W0 * 0.45, wDizi: ws.map((v) => v * 0.45), a0: 0.4, a1: 0.32, havuz: 0.1, kil: 0, bas: 1, son: 2 });
    } else if (e.tur === 'tomurcuk') {
      for (const k of [KOB, YES]) beyazla(k, (x) => x.fill(noktaYolu(e.p)));
      const t = e.t, ca = Math.cos(t.aci), sa = Math.sin(t.aci);
      fv(KOB, ornekle([[t.x - ca * t.r * 0.7, t.y - sa * t.r * 0.7], [t.x + ca * t.r * 1.3, t.y + sa * t.r * 1.3]], 1), KOBALT_A, { w: t.r * 1.5, a0: 0.55, a1: 0.5, havuz: 0.2, kil: 0, bas: 2, son: 4 });
      if (e.i >= 8) fv(YES, ornekle([[t.x - ca * t.r * 0.8, t.y - sa * t.r * 0.8], [t.x - ca * t.r * 2.6 + 1.5, t.y + t.r * 1.9]], 1), BAKIR_K, { w: 3.6, a0: 0.6, a1: 0.5, havuz: 0.1, kil: 0, bas: 2, son: 4 });
    } else if (e.tur === 'cicek') {
      const c = e.c;
      for (const k of [KOB, YES, SAR]) beyazla(k, (x) => { for (const t of e.taclar) x.fill(noktaYolu(t)); x.beginPath(); x.arc(c.x, c.y, c.r * 0.3, 0, PI2); x.fill(); });
      // göbek: antimon sarısı, kenarında okra noktalar
      const p = []; for (let a = 0; a < PI2 * 1.1; a += 0.08) p.push([c.x + Math.cos(a) * c.r * 0.1, c.y + Math.sin(a) * c.r * 0.1]);
      fv(SAR, ornekle(p, 1), ANTIMON, { w: c.r * 0.26, a0: 0.75, a1: 0.7, havuz: 0.1, kil: 0, bas: 2, son: 2 });
      // taç yaprağının dibinde çok açık kobalt gölge
      for (let i = 0; i < 5; i++) {
        const a = c.aci + (i * PI2) / 5 + 0.2;
        fv(KOB, ornekle([[c.x + Math.cos(a) * c.r * 0.28, c.y + Math.sin(a) * c.r * 0.28], [c.x + Math.cos(a + 0.12) * c.r * 0.55, c.y + Math.sin(a + 0.12) * c.r * 0.55]], 1), KOBALT_A, { w: c.r * 0.16, a0: 0.22, a1: 0.16, havuz: 0.05, kil: 0, bas: 2, son: 4 });
      }
    }
  }

  // ---------------------------------------------------------------- mangan konturu (önce çekilmiş gibi; sırda hafifçe dağılmış)
  MAN.x.fillStyle = 'rgba(106,74,90,0.82)';
  const dongu = (pts) => { const q = ornekle(pts.concat([pts[0]]), 1); if (q.length > 2 && Math.hypot(q[0][0] - q[q.length - 1][0], q[0][1] - q[q.length - 1][1]) < 0.6) q.pop(); return q; };
  const elD = (pts, gen) => titret(dongu(pts), gen == null ? 0.5 : gen, 40, nf3, rng() * 80);
  const kapaliYol = (d) => duzlestir(d, 1).map((q) => { const r = q.slice(); if (r.length > 2 && Math.hypot(r[0][0] - r[r.length - 1][0], r[0][1] - r[r.length - 1][1]) < 0.5) r.pop(); return r; });
  const ciz = (p, o) => fircaKalem(MAN.x, p, Object.assign({ w: 3.0, golge: 0.7, isik: 0.35, basinc: 0.25, rng, nf, maxL: 150, bas: 3, son: 9 }, o));
  const kaideOnu = (x, y) => !(x >= 289.5 && x <= 830.5 && y >= 691.5);
  const dik = (x1, y1, x2, y2, kenarlar, o) => {
    const S = { T: [[x1, y1], [x2, y1], [0, -1]], B: [[x1, y2], [x2, y2], [0, 1]], L: [[x1, y1], [x1, y2], [-1, 0]], R: [[x2, y1], [x2, y2], [1, 0]] };
    for (const k of kenarlar) { const [a, b, yan] = S[k]; ciz(elA([a, b], 0.5), Object.assign({ yan }, o)); }
  };
  const c0 = 300;
  dik(c0 - 34, 488, c0 + 34, 800, 'LR', { goster: kaideOnu });
  ciz(elD([[c0 - 34, 488], [c0 - 52, 468], [c0 + 52, 468], [c0 + 34, 488]]), { kapali: true, goster: (x, y) => y > 469 });
  dik(c0 - 54, 456, c0 + 54, 468, 'TRBL', { w: 2.6 });
  dik(c0 - 48, 436, c0 + 48, 456, 'TLR', { w: 2.2 });
  dik(c0 - 27, 316, c0 + 27, 436, 'LR');
  ciz(elD([[c0 - 27, 316], [c0 - 43, 300], [c0 + 43, 300], [c0 + 27, 316]]), { kapali: true, goster: (x, y) => y > 301 });
  dik(c0 - 45, 290, c0 + 45, 300, 'TRBL', { w: 2.5 });
  dik(c0 - 40, 272, c0 + 40, 290, 'TLR', { w: 2.1 });
  dik(c0 - 19, 206, c0 + 19, 272, 'LR');
  dik(c0 - 25, 198, c0 + 25, 206, 'TRBL', { w: 2.1 });
  const topuz = SAHNE.minareParcalari().find((p) => p.ad === 'topuz');
  ciz(elD(kapaliYol(topuz.yol)[0], 0.3), { kapali: true, goster: (x, y) => y < 198.5 });
  for (const [x1, x2, y1, y2, n] of [[c0 - 48, c0 + 48, 436, 456, 9], [c0 - 40, c0 + 40, 272, 290, 8]]) for (let i = 0; i < n; i++) { const x = x1 + 5 + ((x2 - x1 - 10) * (i + 0.5)) / n; ciz(elA([[x, y1 + 4], [x, y2 - 2.5]], 0.2), { w: 2.2, golge: 0, isik: 0, bas: 2, son: 4, maxL: 40 }); }
  for (const w of SAHNE.minarePencereleri) for (const q of kapaliYol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h))) ciz(elD(q, 0.25), { kapali: true, w: 2.0 });
  const K = SAHNE.kaide;
  dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2, 'TRBL', { w: 2.8, maxL: 180 });
  dik(K.x1, K.y1, K.x2, K.y2, 'LR', { w: 3.0 });
  for (const w of K.pencereler) for (const q of kapaliYol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h))) ciz(elD(q, 0.3), { kapali: true, w: 2.4 });
  for (const k of [1, 0]) {
    const q = SAHNE.kasnak[k];
    dik(q.x1, q.y1, q.x2, q.y2, 'TLR', { maxL: 180 });
    for (const w of SAHNE.kasnakPencereleri(k)) for (const p of kapaliYol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h))) ciz(elD(p, 0.2), { kapali: true, w: k ? 1.8 : 1.5, golge: 0.4, bas: 2, son: 4 });
  }
  ciz(elD(SAHNE.kubbeNoktalari(160), 0.5), { kapali: true, w: 3.3, golge: 0.9, goster: (x, y) => y < 553.5, maxL: 180 });
  for (const k of SAHNE.kaburgalar(16, 120)) {
    const p = k.noktalar.slice().reverse().filter((q) => q[1] > 314 + 18 * (1 - Math.abs(k.u)) && q[1] < 553);
    ciz(elA(p, 0.35), { w: k.u < -0.2 ? 1.9 : 1.5, golge: 0, isik: 0, bas: 30, son: 4, maxL: 400, basinc: 0.3 });
  }
  const alemCiz = (a) => {
    const kucuk = a.kureler[0].r < 9;
    const w = kucuk ? 1.4 : 1.9;
    for (const e of alemCizgileri(a)) {
      if (e.tur === 'cubuk') continue;
      const p = e.p.slice(); if (Math.hypot(p[0][0] - p[p.length - 1][0], p[0][1] - p[p.length - 1][1]) < 0.5) p.pop();
      ciz(elD(p, 0.15), { kapali: true, w, golge: 0.6, bas: 2, son: 3, maxL: 300 });
    }
  };
  alemCiz(SAHNE.alemParcalari(560, 300, 1));
  alemCiz(SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem);
  ciz(elA([[0, 800], [300, 800]], 0.6), { w: 2.2, golge: 0, isik: 0, maxL: 200 });
  ciz(elA([[300, 800], [820, 800]], 0.5), { w: 2.8, golge: 0, isik: 0, maxL: 200 });
  ciz(elA([[820, 800], [1024, 800]], 0.6), { w: 2.2, golge: 0, isik: 0, maxL: 200 });
  // bitki konturları (ressam sırasıyla, öndeki arkadakini örter)
  const silM = (fn) => { const k = MAN.x; k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#000'; k.strokeStyle = '#000'; fn(k); k.restore(); };
  // MAN katmanı beyaz zeminli ve çarpımsal; silmek için beyaz boyanır
  const beyazM = (fn) => { const k = MAN.x; k.save(); k.globalCompositeOperation = 'source-over'; k.fillStyle = '#fff'; k.strokeStyle = '#fff'; fn(k); k.restore(); };
  void silM;
  for (const e of liste) {
    if (e.tur === 'sap') {
      beyazM((k) => { k.lineWidth = 5.5; k.lineCap = 'round'; k.stroke(noktaYoluAcik(e.p)); });
      fv(YES, ornekle(e.p.slice().reverse(), 1), BAKIR_K, { w: 4.2, a0: 0.0, a1: 0.0, havuz: 0, kil: 0 });
      ciz(elA(e.p.slice().reverse(), 0.5), { w: 1.6, golge: 0.5, yan: [-1, 0], maxL: 200, bas: 8, son: 12 });
    } else if (e.tur === 'yaprak') {
      beyazM((k) => { const P = noktaYolu(e.p); k.fill(P); k.lineWidth = 3; k.stroke(P); });
      const p = e.p.slice(); if (Math.hypot(p[0][0] - p[p.length - 1][0], p[0][1] - p[p.length - 1][1]) < 0.5) p.pop();
      const m = Math.floor(p.length / 2);
      const sg = isaretliAlan(p) > 0 ? 1 : -1;
      ciz(elA(p.slice(0, m + 1), 0.3), { w: 1.7, golge: 0.7, sg, maxL: 400, bas: 3, son: 8 });
      ciz(elA(p.slice(m).concat([p[0]]).reverse(), 0.3), { w: 1.7, golge: 0.7, sg: -sg, maxL: 400, bas: 3, son: 8 });
    } else if (e.tur === 'tomurcuk') {
      beyazM((k) => { const P = noktaYolu(e.p); k.fill(P); k.lineWidth = 3; k.stroke(P); });
      const p = e.p.slice(); if (Math.hypot(p[0][0] - p[p.length - 1][0], p[0][1] - p[p.length - 1][1]) < 0.5) p.pop();
      ciz(elD(p, 0.2), { kapali: true, w: 1.6, golge: 0.6, maxL: 200, bas: 2, son: 5 });
    } else if (e.tur === 'cicek') {
      const c = e.c;
      for (const t of e.taclar) {
        beyazM((k) => { const P = noktaYolu(t); k.fill(P); k.lineWidth = 3; k.stroke(P); });
        const p = t.slice(); if (Math.hypot(p[0][0] - p[p.length - 1][0], p[0][1] - p[p.length - 1][1]) < 0.5) p.pop();
        ciz(elA(p.slice(2, p.length - 2), 0.3), { w: c.r > 40 ? 2.4 : 1.9, golge: 0.7, sg: isaretliAlan(p) > 0 ? 1 : -1, maxL: 400, bas: 4, son: 8 });
      }
      beyazM((k) => { k.beginPath(); k.arc(c.x, c.y, c.r * 0.2, 0, PI2); k.fill(); });
      const say = c.r > 40 ? 10 : 7;
      for (let i = 0; i < say; i++) {
        const a = (i / say) * PI2 + c.aci;
        const rr = c.r * 0.235;
        MAN.x.beginPath(); MAN.x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, c.r > 40 ? 1.8 : 1.3, 0, PI2); MAN.x.fill();
      }
    }
  }

  // ---------------------------------------------------------------- fırın: pigmentler sırda hafifçe dağılır, birleştir
  // sır boyayı yer yer farklı emer: ince, yatay (kobaltta) ya da yönsüz tane; boya yoğunluğu ±%15 oynar
  const ng1 = gurultu(23911), ng2 = gurultu(23912);
  const emilim = (yatay) => (X, Y, h, cr, cg, cb) => {
    const g = yatay ? 0.6 * ng1(X / 46, Y / 3.2) + 0.4 * ng2(X / 9, Y / 9) : 0.5 * ng1(X / 11, Y / 11) + 0.5 * ng2(X / 5, Y / 5);
    const k = 0.84 + 0.32 * g + 0.06 * (h - 0.5);
    return [1 - (1 - cr) * k, 1 - (1 - cg) * k, 1 - (1 - cb) * k];
  };
  const KOBb = bulanik(KOB, 1.7), YESb = bulanik(YES, 1.5), SARb = bulanik(SAR, 1.3), MANb = bulanik(MAN, 0.8);
  birlestir({
    ctx, H, L: null, kagit, kabartma: 0, cukur: 0,
    katmanlar: [
      { c: KOBb.c, mod: 'carp', renk: emilim(1) },
      { c: YESb.c, mod: 'carp', renk: emilim(0) },
      { c: SARb.c, mod: 'carp', renk: emilim(0) },
      { c: MANb.c, mod: 'carp' },
    ],
  });
  SAHNE.hazir();

})();
</script>
