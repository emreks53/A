<title>S-042 Akrilik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #1b2a4a; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-042 Akrilik — çağdaş akrilik resim: doygun, parlak renkler; düz uçlu fırçanın keskin kenarlı, kendinden emin
// darbeleri. Hızlı kuruyan boya karışmadan üst üste biner: ışık-gölge, keskin sınırlı düz ton katlarıyla kurulur.
// Turuncu-kırmızı astar biçimlerin arasındaki ince boşluklardan ve kuru fırça uçlarından görünür. Düz alanlarda
// darbe kenarlarının ince boya sırtları, tuval bezi dokusu ve akriliğe özgü hafif saten parlaklık.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const css = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Değer gürültüsü (0..1), 256'lık döşemeli tablo. */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32, w×h), yalnız [y0,y1] satır aralığında. */
  function kutu(src, w, h, r, y0, y1) {
    y0 = Math.max(0, y0 || 0); y1 = Math.min(h - 1, y1 === undefined ? h - 1 : y1);
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    const ya = Math.max(0, y0 - r), yb = Math.min(h - 1, y1 + r);
    for (let y = ya; y <= yb; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = y0 - r; y <= y0 + r; y++) acc += tmp[clamp(y, ya, yb) * w + x];
      for (let y = y0; y <= y1; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(yb, y + r + 1) * w + x] - tmp[Math.max(ya, y - r) * w + x]; }
    }
    return out;
  }
  function bulanik(src, w, h, r, gecis, y0, y1) {
    let a = src;
    for (let g = 0; g < (gecis || 3); g++) a = kutu(a, w, h, r, y0 === undefined ? 0 : y0 - r * 3, y1 === undefined ? h - 1 : y1 + r * 3);
    return a;
  }
  /** Tuvale çizilen biçimlerden kapsama maskesi (0..1). s: ölçek. Dönen: {m, y0, y1} (piksel satırları). */
  function maskeYap(s, ciz) {
    const n = W * s, c = SAHNE.yeniTuval(n, n), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(s, 0, 0, s, 0, 0);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    ciz(g);
    const d = g.getImageData(0, 0, n, n).data, m = new Float32Array(n * n);
    let y0 = n, y1 = -1;
    for (let y = 0; y < n; y++) {
      let var_ = false; const o = y * n;
      for (let x = 0; x < n; x++) { const a = d[(o + x) * 4 + 3]; if (a) { m[o + x] = a / 255; var_ = true; } }
      if (var_) { if (y < y0) y0 = y; y1 = y; }
    }
    return { m, y0, y1 };
  }
  // ------------------------------------------------------------ ışık modeli (ışık sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const KUBBE = (() => {
    const prof = SAHNE.kubbeProfili(800), adim = 4, R = new Float32Array(256 * adim + 1), D = new Float32Array(256 * adim + 1);
    for (let k = 0; k <= 255 * adim; k++) {
      const y = 300 + k / adim;
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
      R[k] = a.r + (b.r - a.r) * t;
    }
    for (let k = 1; k < 255 * adim; k++) D[k] = (R[k + 1] - R[k - 1]) * adim / 2;
    D[0] = D[1] * 1.4; D[255 * adim] = D[255 * adim - 1];
    const ix = (y) => clamp(Math.round((y - 300) * adim), 0, 255 * adim);
    return {
      r: (y) => R[ix(y)],
      u: (x, y) => clamp((x - 560) / Math.max(0.5, R[ix(y)]), -1, 1),
      normal(x, y) {
        const k = ix(y), u = clamp((x - 560) / Math.max(0.5, R[k]), -1, 1), c = Math.sqrt(1 - u * u), d = D[k], l = Math.hypot(u, d, c);
        return [u / l, -d / l, c / l];
      },
      isik(x, y) { const n = this.normal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); },
      /** kaburga fazı: boylamın 16 dilimdeki konumu (tam sayıya yakınsa kaburga çizgisi) */
      faz(x, y) { const u = this.u(x, y); return (Math.asin(u) + Math.PI / 2) / (Math.PI / 16); },
    };
  })();
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25;
    if (y >= 146) { const t = (200 - y) / 54; return Math.max(2, 24 * Math.sin(Math.min(1, t * 1.25) * Math.PI * 0.62 + 0.55) * (1 - t * 0.55)); }
    return 3;
  }
  const kasnakIsik = (x, y) => (y < 610 ? silindirIsik(x, 560, 208) : silindirIsik(x, 560, 226));

  const S = 2, WW = W * S, N = WW * WW;
  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, S);
  const Y = SAHNE.yollar();
  const P = (d) => new Path2D(d);
  const R = SAHNE.rng(4242);
  const nA = gurultu(51), nB = gurultu(52), nC = gurultu(53);

  // ------------------------------------------------------------ tamponlar
  const C = {
    astar: hex('#E2582E'),
    gok: ['#1A3E99', '#2160B8', '#2E86CE', '#4AAEDB', '#93D6DD', '#F6E4A4'].map(hex),
    hale: hex('#5FB4E4'), gunesH: hex('#FFDD3C'), gunes: hex('#FFF6D2'),
    bulut: hex('#FFFFFF'), bulutG: hex('#B3A9E2'),
    k: ['#073D33', '#0B5A40', '#12844F', '#2EAD56', '#9ED64A', '#E2F27A'].map(hex),
    ks: ['#05302A', '#09483A', '#0F6C4A', '#1F8F51'].map(hex), ksP: hex('#032420'), ksI: hex('#46B062'),
    tas: ['#7466B8', '#A196D6', '#E8DBCB', '#FFF3D8', '#FFFFFF'].map(hex),
    altin: ['#A4501A', '#E9981F', '#FFC93A', '#FFF1A0'].map(hex),
    pencere: hex('#3A2A6E'), zikzak: hex('#E0457E'),
    yer: ['#B04E2B', '#D9783C', '#EDA256', '#F6C47A'].map(hex),
    yap: ['#13553A', '#2B8A3C', '#8ACF46', '#C6EE78'].map(hex), sap: hex('#2B8A3C'),
    tom: hex('#E0368B'), tomI: hex('#FF9ACB'),
    cic: hex('#FFFFFF'), cicG: hex('#E9D9F2'), pembe: hex('#F07BB2'), orta: hex('#FFC21A'), ortaK: hex('#F0601C'), ortaI: hex('#FFF29A'),
  };
  const CR = new Float32Array(N).fill(C.astar[0]), CG = new Float32Array(N).fill(C.astar[1]), CB = new Float32Array(N).fill(C.astar[2]);
  const GN = new Float32Array(N), BEZ = new Float32Array(N);
  const per = 4.4 * S; // tuval bezi periyodu
  for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x, X = x / S, Yy = y / S;
    GN[i] = fbm(nA, X / 3, Yy / 3, 2);
    // bez: çözgü ve atkı iplikleri sırayla üstte
    const tx = x / per + (nB(X / 30, Yy / 30) - 0.5) * 0.3, ty = y / per + (nC(X / 30, Yy / 30) - 0.5) * 0.3;
    const fx = tx - Math.floor(tx), fy = ty - Math.floor(ty), par = (Math.floor(tx) + Math.floor(ty)) & 1;
    const cz = Math.sin(Math.PI * fx), at = Math.sin(Math.PI * fy);
    BEZ[i] = (par ? Math.max(cz * (0.6 + 0.4 * at), at * 0.4) : Math.max(at * (0.6 + 0.4 * cz), cz * 0.4)) * (0.8 + 0.4 * nA(X * 0.7, Yy * 0.7));
  }

  // ------------------------------------------------------------ darbe haritası: R = ton oynaması, G = boya kalınlığı, B = kuruluk
  const dc = SAHNE.yeniTuval(WW, WW), dg = dc.getContext('2d', { willReadFrequently: true });
  dg.setTransform(S, 0, 0, S, 0, 0); dg.fillStyle = 'rgb(128,40,0)'; dg.fillRect(0, 0, W, W);
  function govde(pts, w, son) {
    const L = pts.length, sol = [], sag = [];
    for (let i = 0; i <= son; i++) {
      const q = pts[Math.min(L - 1, i + 1)], pp = pts[Math.max(0, i - 1)], dx = q[0] - pp[0], dy = q[1] - pp[1], l = Math.hypot(dx, dy) || 1;
      sol.push([pts[i][0] - (dy / l) * w / 2, pts[i][1] + (dx / l) * w / 2]); sag.push([pts[i][0] + (dy / l) * w / 2, pts[i][1] - (dx / l) * w / 2]);
    }
    const p = new Path2D(); p.moveTo(sol[0][0], sol[0][1]); sol.forEach((q) => p.lineTo(q[0], q[1]));
    for (let i = sag.length - 1; i >= 0; i--) p.lineTo(sag[i][0], sag[i][1]);
    p.closePath(); return p;
  }
  /** Düz uçlu fırça: keskin gövde, kenarda boya sırtı, içte kıl oluğu, sonda kuru fırça kılları. */
  function duzFirca(g, pts, w, o) {
    o = o || {};
    const L = pts.length; if (L < 2) return;
    const v = o.v === undefined ? 128 + (R() - 0.5) * 60 : o.v, kal = o.kal === undefined ? 120 : o.kal;
    const son = Math.max(1, Math.floor((L - 1) * (o.govde || 0.8 + R() * 0.12)));
    const p = govde(pts, w, son);
    g.fillStyle = `rgb(${v | 0},${kal},0)`; g.fill(p);
    const nor = pts.map((q, i) => { const a = pts[Math.min(L - 1, i + 1)], b = pts[Math.max(0, i - 1)], dx = a[0] - b[0], dy = a[1] - b[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
    const nb = Math.max(3, Math.round(w / 1.6));
    g.lineCap = 'butt';
    for (let b = 0; b < nb; b++) {
      const off = ((b + 0.5) / nb - 0.5) * w * 0.94, bit = Math.min(L - 1, son + Math.floor(R() * (L - son)));
      g.lineWidth = (w / nb) * 0.55;
      g.strokeStyle = `rgb(${(v + (R() - 0.5) * 14) | 0},${(kal - 10 - R() * 30) | 0},0)`;
      g.beginPath(); for (let i = 0; i <= son; i++) { const x = pts[i][0] + nor[i][0] * off, y = pts[i][1] + nor[i][1] * off; if (i) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke();
      if (bit > son) {
        g.lineWidth = (w / nb) * 0.8; g.strokeStyle = `rgb(${v | 0},${kal - 30},255)`;
        g.beginPath(); for (let i = son; i <= bit; i++) { const x = pts[i][0] + nor[i][0] * off, y = pts[i][1] + nor[i][1] * off; if (i > son) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke();
      }
    }
    g.strokeStyle = `rgb(${v | 0},${Math.min(255, kal + 80)},0)`; g.lineWidth = 0.9; g.stroke(p);
  }
  const egri = (x0, y0, x1, y1, bk, n) => {
    const pts = []; n = n || 12;
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
    for (let k = 0; k <= n; k++) { const t = k / n, b = bk * Math.sin(Math.PI * t); pts.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]); }
    return pts;
  };
  // gök ve yer: geniş, uzun yatay darbeler
  for (let y = 0; y < 1040; y += 15) {
    let x = -120 - R() * 200;
    while (x < 1100) {
      const len = 160 + R() * 260, w = 30 + R() * 22, dgk = Math.hypot(x + len / 2 - 880, y - 140);
      if (dgk > 175) duzFirca(dg, egri(x, y + (R() - 0.5) * 10, x + len, y + (R() - 0.5) * 16, (R() - 0.5) * 12, 16), w);
      x += len * (0.45 + R() * 0.35);
    }
  }
  // güneş çevresi: dairesel darbeler
  for (let k = 0; k < 70; k++) {
    const r = 60 + R() * 130, a0 = R() * Math.PI * 2, sp = 0.5 + R() * 0.7, pts = [];
    for (let j = 0; j <= 16; j++) { const a = a0 + sp * (j / 16); pts.push([880 + Math.cos(a) * r, 140 + Math.sin(a) * r]); }
    duzFirca(dg, pts, 18 + R() * 16);
  }
  // kubbe: kaburga boyunca
  dg.save(); dg.clip(P(Y.kubbe));
  for (let k = 0; k < 300; k++) {
    const u = R() * 2.1 - 1.05, ya = 296 + R() * 240, yb = Math.min(560, ya + 60 + R() * 120), pts = [];
    for (let j = 0; j <= 14; j++) { const yy = yb + (ya - yb) * (j / 14); pts.push([560 + u * KUBBE.r(yy), yy]); }
    duzFirca(dg, pts, 14 + R() * 14);
  }
  dg.restore();
  // minare: dikey
  const minareP = new Path2D(); Y.minare.forEach((d) => minareP.addPath(P(d)));
  dg.save(); dg.clip(minareP);
  for (let k = 0; k < 120; k++) { const x = 246 + R() * 108, ya = 140 + R() * 660; duzFirca(dg, egri(x, ya + 70 + R() * 110, x, ya, 0, 8), 10 + R() * 8); }
  dg.restore();
  // kasnak ve kaide: yatay
  const yapiP = P(Y.kasnakUst); yapiP.addPath(P(Y.kasnakAlt)); yapiP.addPath(P(Y.kaide)); yapiP.addPath(P(Y.kornis));
  dg.save(); dg.clip(yapiP);
  for (let y = 552; y < 806; y += 9) { let x = 270 - R() * 60; while (x < 850) { const len = 70 + R() * 130; duzFirca(dg, egri(x, y, x + len, y + (R() - 0.5) * 3, 0, 8), 12 + R() * 8); x += len * 0.75; } }
  dg.restore();
  // bulutlar: kıvrımı izleyen kısa yay darbeler
  const BULUT = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
  const KUME = [[-80, 2, 28], [-42, -8, 40], [4, -22, 50], [50, -8, 40], [88, 2, 26]];
  function bulutCiz(g, kx, ky, olc) {
    for (const [bx, by, bs] of BULUT) {
      g.save(); g.beginPath(); g.rect(bx - 160 * bs, by - 130 * bs, 320 * bs, 148 * bs + ky); g.clip();
      for (const [dx, dy, r] of KUME) { g.beginPath(); g.arc(bx + dx * bs + kx, by + 18 * bs + dy * bs + ky, r * bs * olc, 0, Math.PI * 2); g.fill(); }
      g.beginPath(); g.ellipse(bx + kx, by + 12 * bs + ky, 116 * bs * olc, 12 * bs, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }
  for (const [bx, by, bs] of BULUT) for (const [dx, dy, r] of KUME) {
    const cx = bx + dx * bs, cy = by + 18 * bs + dy * bs, rr = r * bs;
    for (let q = 0; q < 4; q++) {
      const rq = rr * (0.35 + R() * 0.6), am = Math.PI * (1.1 + R() * 0.8), sp = 0.6 + R() * 0.6, pts = [];
      for (let j = 0; j <= 10; j++) { const a = am - sp / 2 + sp * (j / 10); pts.push([cx + Math.cos(a) * rq, cy + Math.sin(a) * rq]); }
      dg.save(); dg.beginPath(); dg.rect(bx - 160 * bs, by - 130 * bs, 320 * bs, 148 * bs); dg.clip();
      duzFirca(dg, pts, rr * 0.3 + 4);
      dg.restore();
    }
  }
  const DR = new Float32Array(N), DK = new Float32Array(N), DD = new Float32Array(N);
  function darbeOku() {
    const d = dg.getImageData(0, 0, WW, WW).data;
    for (let i = 0; i < N; i++) { DR[i] = (d[i * 4] - 128) / 30; DK[i] = d[i * 4 + 1] / 255; DD[i] = d[i * 4 + 2] / 255; }
  }
  darbeOku();

  // ------------------------------------------------------------ katman: keskin kenarlı, örtücü akrilik
  const maske = (f) => maskeYap(S, f);
  function katman(mk, renk, o) {
    o = o || {};
    const amp = o.amp === undefined ? 0.035 : o.amp, op = o.op === undefined ? 1 : o.op;
    if (mk.y1 < 0) return;
    const y0 = Math.max(0, mk.y0 - 6), y1 = Math.min(WW - 1, mk.y1 + 6);
    const mb = mk.m;
    const delik = o.delik ? o.delik : null;
    const fn = typeof renk === 'function';
    let c = renk;
    for (let y = y0; y <= y1; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x; let a = mb[i];
      if (a < 0.01) continue;
      a *= op;
      if (delik) { const t = 0.42 - 0.38 * GN[i]; a *= 1 - sstep(t - 0.04, t + 0.04, delik[i]); if (a <= 0.003) continue; }
      if (o.kuru && DD[i] > 0.5) a *= sstep(0.42, 0.62, BEZ[i] + (GN[i] - 0.5) * 0.4);
      if (fn) { c = renk(x / S, y / S, i); if (!c) continue; if (c.length > 3) a *= c[3]; }
      const k = 1 + amp * DR[i];
      CR[i] += (c[0] * k - CR[i]) * a; CG[i] += (c[1] * k - CG[i]) * a; CB[i] += (c[2] * k - CB[i]) * a;
    }
  }
  function kosul(temel, f) {
    const m = new Float32Array(N);
    for (let y = temel.y0; y <= temel.y1; y++) for (let x = 0; x < WW; x++) { const i = y * WW + x; if (temel.m[i] > 0) m[i] = temel.m[i] * f(x / S, y / S, i); }
    return { m, y0: temel.y0, y1: temel.y1 };
  }
  function satirYeri(mk) {
    const rel = new Float32Array(N);
    for (let y = mk.y0; y <= mk.y1; y++) {
      let x = 0; const o = y * WW;
      while (x < WW) { while (x < WW && mk.m[o + x] < 0.5) x++; const a = x; while (x < WW && mk.m[o + x] >= 0.5) x++; const b = x; for (let k = Math.max(0, a - 3); k < Math.min(WW, b + 3); k++) rel[o + k] = (k - a + 0.5) / Math.max(1, b - a); }
    }
    return rel;
  }
  const tumu = { m: new Float32Array(N).fill(1), y0: 0, y1: WW - 1 };

  // önde kalan biçimler: arkadaki boya bunların çevresinde, yer yer astarı gösteren ince bir boşluk bırakır
  const onM = maske((g) => { g.fill(minareP); g.fill(yapiP); g.fill(P(Y.kubbe)); Y.alem.forEach((d) => g.fill(P(d))); Y.minareAlem.forEach((d) => g.fill(P(d))); });
  const bulutM = maske((g) => bulutCiz(g, 0, 0, 1));
  const gunesM = maske((g) => g.fill(P(SAHNE.daireYolu(880, 140, 80))));
  const onB = bulanik(onM.m, WW, WW, 3, 2);
  const arkaDelik = new Float32Array(N);
  { const t = new Float32Array(N); for (let i = 0; i < N; i++) t[i] = Math.max(onM.m[i], bulutM.m[i], gunesM.m[i]); const b = bulanik(t, WW, WW, 3, 2); for (let i = 0; i < N; i++) arkaDelik[i] = b[i]; }

  // ------------------------------------------------------------ gök: basamaklı bantlar, sınırda darbeler birbirine geçer
  const SINIR = [0.2, 0.37, 0.53, 0.68, 0.83];
  katman(tumu, (x, y, i) => {
    if (y > 806) return null;
    const dgk = Math.hypot(x - 880, y - 140);
    const t = y / 800 + (fbm(nA, x / 260, y / 160, 2) - 0.5) * 0.07 + DR[i] * 0.018;
    let k = 0; while (k < 5 && t > SINIR[k]) k++;
    if (dgk < 196 + DR[i] * 6) return k < 2 ? C.hale : C.gok[Math.min(5, k + 1)];
    return C.gok[k];
  }, { delik: arkaDelik, kuru: true });
  // güneş
  katman(gunesM, C.gunesH, { amp: 0.03 });
  katman(maske((g) => g.fill(P(SAHNE.daireYolu(880, 140, 58)))), C.gunes, { amp: 0.02 });
  // bulutlar: önce lavanta gölge, üstüne sağ üste kaydırılmış beyaz
  katman(bulutM, C.bulutG, { amp: 0.03, delik: onB });
  katman(maske((g) => bulutCiz(g, 4, -6, 0.9)), C.bulut, { amp: 0.02, delik: onB });

  // ------------------------------------------------------------ yer
  const yerM = maske((g) => g.fillRect(0, 800, W, 224));
  katman(yerM, (x, y, i) => {
    const t = (y - 800) / 224 + (nB(x / 70, y / 40) - 0.5) * 0.2 + DR[i] * 0.03;
    if (y < 826 && x > 236 - (y - 800) * 2.2 && x < 812 - (y - 800) * 1.1) return C.yer[0];
    return t < 0.06 ? C.yer[3] : t < 0.3 ? C.yer[2] : t < 0.62 ? C.yer[1] : C.yer[0];
  }, { delik: onB, kuru: true });

  // ------------------------------------------------------------ minare
  const minareM = maske((g) => g.fill(minareP));
  const tasTon = (l) => (l < 0.25 ? 0 : l < 0.5 ? 1 : l < 0.7 ? 2 : l < 0.82 ? 3 : 4);
  katman(minareM, (x, y, i) => {
    const l = silindirIsik(x, 300, minareYari(y)) + DR[i] * 0.03;
    let k = tasTon(l);
    if ((y > 468 && y < 488) || (y > 300 && y < 316)) k = Math.max(0, Math.min(k, 2) - 1);
    return C.tas[k];
  });
  katman(maske((g) => { g.fillRect(246, 456, 108, 2.6); g.fillRect(255, 290, 90, 2.4); g.fillRect(275, 198, 50, 2); }), C.tas[4]);
  katman(maske((g) => { g.fillRect(246, 465.5, 108, 2.5); g.fillRect(255, 297.5, 90, 2.5); }), C.tas[0]);
  katman(maske((g) => { for (const [x1, x2, y1, y2] of [[252, 348, 436, 456], [260, 340, 272, 290]]) for (let k = 0; k < 9; k++) { const x = x1 + 5 + ((x2 - x1 - 10) * (k + 0.5)) / 9; g.fillRect(x - 1.8, y1 + 4, 3.6, y2 - y1 - 8); } }), C.tas[0]);
  katman(maske((g) => { g.lineWidth = 3; g.lineJoin = 'miter'; for (const z of SAHNE.zikzakCizgileri()) g.stroke(P(SAHNE.yol(z))); }), C.zikzak);
  katman(maske((g) => Y.minarePencereleri.forEach((d) => g.fill(P(d)))), C.pencere);

  // ------------------------------------------------------------ kaide
  katman(maske((g) => g.fill(P(Y.kaide))), (x, y, i) => {
    const v = x + DR[i] * 10;
    return y < 713 ? C.tas[1] : v < 360 ? C.tas[1] : v < 600 ? C.tas[2] : C.tas[3];
  });
  katman(maske((g) => g.fill(P(Y.kornis))), (x, y) => (y < 698 ? C.tas[4] : C.tas[2]));
  katman(maske((g) => Y.kaidePencereleri.forEach((d) => g.fill(P(d)))), C.pencere);

  // ------------------------------------------------------------ kasnak
  katman(maske((g) => { g.fill(P(Y.kasnakUst)); g.fill(P(Y.kasnakAlt)); }), (x, y, i) => {
    const l = kasnakIsik(x, y) * (y < 610 ? 0.92 : 1) + DR[i] * 0.03;
    return C.ks[l < 0.25 ? 0 : l < 0.5 ? 1 : l < 0.72 ? 2 : 3];
  });
  katman(maske((g) => { g.fillRect(352, 555, 416, 3.5); g.fillRect(334, 610, 452, 3.5); }), C.ksI);
  katman(maske((g) => { g.fillRect(352, 606, 416, 4); g.fillRect(334, 688, 452, 4); }), C.ksP, { op: 0.9 });
  katman(maske((g) => Y.kasnakPencereleri.forEach((d) => g.fill(P(d)))), C.ksP);
  katman(maske((g) => { g.lineWidth = 1.6; for (const k of [0, 1]) for (const p of SAHNE.kasnakPencereleri(k)) { if (Math.sin(p.aci) < -0.4) continue; const xr = p.x + p.w / 2 + 1.2; g.beginPath(); g.moveTo(xr, p.y + p.h); g.lineTo(xr, p.y + p.w * 0.62); g.stroke(); } }), C.ks[3]);

  // ------------------------------------------------------------ kubbe: koyudan açığa keskin sınırlı katlar
  const kubbeM = maske((g) => g.fill(P(Y.kubbe)));
  katman(kubbeM, C.k[0]);
  const ESIK = [0.2, 0.4, 0.6, 0.79, 0.9];
  ESIK.forEach((e, j) => katman(kosul(kubbeM, (x, y, i) => {
    let l = KUBBE.isik(x, y) + DR[i] * 0.045;
    if (j === 0 && y > 470 && KUBBE.u(x, y) < -0.6) l += 0.12; // gölgede yansıyan ışık
    return sstep(e - 0.012, e + 0.012, l);
  }), C.k[j + 1], { kuru: j >= 3 }));
  // kaburgalar
  const kab = SAHNE.kaburgalar(16, 60);
  katman(maske((g) => { for (const k of kab) for (let j = 0; j < k.noktalar.length - 1; j++) { const t = j / (k.noktalar.length - 1); g.lineWidth = 2.3 - 1.1 * t; g.beginPath(); g.moveTo(...k.noktalar[j]); g.lineTo(...k.noktalar[j + 1]); g.stroke(); } }), C.k[0], { op: 0.85 });
  katman(maske((g) => { for (const k of kab) { if (k.u < -0.35) continue; for (let j = 0; j < k.noktalar.length - 3; j++) { const t = j / (k.noktalar.length - 1); g.lineWidth = 1.5 - 0.7 * t; g.beginPath(); g.moveTo(k.noktalar[j][0] + 2.4 - t, k.noktalar[j][1]); g.lineTo(k.noktalar[j + 1][0] + 2.4 - t, k.noktalar[j + 1][1]); g.stroke(); } } }),
    (x, y) => (KUBBE.isik(x, y) > 0.6 ? C.k[5] : C.k[3]), { op: 0.8 });

  // ------------------------------------------------------------ alemler
  const alemM = maske((g) => { Y.alem.forEach((d) => g.fill(P(d))); Y.minareAlem.forEach((d) => g.fill(P(d))); });
  const alemYer = satirYeri(alemM);
  katman(alemM, (x, y, i) => { const r = alemYer[i]; return C.altin[r < 0.28 ? 0 : r < 0.55 ? 1 : r < 0.85 ? 2 : 1]; }, { amp: 0.02 });
  katman(kosul(alemM, (x, y, i) => (alemYer[i] > 0.6 && alemYer[i] < 0.78 ? 1 : 0)), C.altin[3]);

  // ------------------------------------------------------------ bitkiler: keskin, doygun, sivri darbeler (yükseklikleri de çizilir)
  function tuvalKatman(ciz) {
    const c = SAHNE.yeniTuval(WW, WW), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0); ciz(g);
    const d = g.getImageData(0, 0, WW, WW).data;
    for (let i = 0; i < N; i++) { const a = d[i * 4 + 3]; if (!a) continue; const al = a / 255; CR[i] += (d[i * 4] - CR[i]) * al; CG[i] += (d[i * 4 + 1] - CG[i]) * al; CB[i] += (d[i * 4 + 2] - CB[i]) * al; }
  }
  const B = SAHNE.bitki;
  const prof = (t) => Math.sin(Math.PI * Math.pow(clamp(t, 0, 1), 0.8));
  function sivri(pts, w) {
    const L = pts.length, sol = [], sag = [];
    for (let i = 0; i < L; i++) {
      const q = pts[Math.min(L - 1, i + 1)], pp = pts[Math.max(0, i - 1)], dx = q[0] - pp[0], dy = q[1] - pp[1], l = Math.hypot(dx, dy) || 1, hw = (w / 2) * prof(i / (L - 1));
      sol.push([pts[i][0] - (dy / l) * hw, pts[i][1] + (dx / l) * hw]); sag.push([pts[i][0] + (dy / l) * hw, pts[i][1] - (dx / l) * hw]);
    }
    const p = new Path2D(); p.moveTo(sol[0][0], sol[0][1]); sol.forEach((q) => p.lineTo(q[0], q[1])); for (let i = L - 1; i >= 0; i--) p.lineTo(sag[i][0], sag[i][1]); p.closePath();
    return p;
  }
  const isikTarafi = (y) => (Math.sin(y.aci) * 0.74 + Math.cos(y.aci) * 0.67 > 0 ? -1 : 1);
  const bitkiCiz = (g, renkli) => {
    // renkli: renk tuvali; değilse darbe haritası (yükseklik)
    const boya = (p, c) => { if (renkli) { g.fillStyle = css(c); g.fill(p); } else { g.fillStyle = 'rgb(128,150,0)'; g.fill(p); g.strokeStyle = 'rgb(128,230,0)'; g.lineWidth = 0.9; g.stroke(p); } };
    const cizgi = (p, c, lw) => { if (renkli) { g.strokeStyle = css(c); } else g.strokeStyle = 'rgb(128,200,0)'; g.lineWidth = lw; g.lineCap = 'round'; g.stroke(p); };
    for (const s of B.saplar) { const a = new Path2D(); s.forEach(([x, y], j) => (j ? a.lineTo(x, y) : a.moveTo(x, y))); cizgi(a, C.sap, 4.2); }
    const rr = SAHNE.rng(99);
    for (const y of B.yapraklar) {
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci), tr = isikTarafi(y), buyuk = L > 50;
      const eks = (off) => { const pts = []; for (let j = 0; j <= 14; j++) { const t = j / 14, v = off * prof(t); pts.push([y.x + t * L * ca - v * sa, y.y + t * L * sa + v * ca]); } return pts; };
      boya(sivri(eks(0), L * 0.48), buyuk ? C.yap[0] : C.yap[1]);
      boya(sivri(eks(tr * L * 0.12), L * 0.22), buyuk ? C.yap[1] : C.yap[2]);
      if (renkli) { g.save(); g.clip(sivri(eks(0), L * 0.48)); g.lineWidth = 1; for (let k = 0; k < 4; k++) { g.strokeStyle = css(buyuk ? C.yap[1] : C.yap[2], 0.5); const o = (rr() - 0.5) * L * 0.3; g.beginPath(); eks(o).forEach(([x, yy], j) => (j ? g.lineTo(x, yy) : g.moveTo(x, yy))); g.stroke(); } g.restore(); }
      const d = new Path2D(); d.moveTo(y.x, y.y); d.lineTo(y.x + L * 0.85 * ca, y.y + L * 0.85 * sa); cizgi(d, C.yap[3], 1.1);
    }
    for (const t of B.tomurcuklar) {
      boya(P(SAHNE.tomurcukYolu(t)), C.tom);
      const a = new Path2D(); a.moveTo(t.x + Math.cos(t.aci) * t.r * 0.1 + 1.5, t.y + Math.sin(t.aci) * t.r * 0.1 - 1); a.lineTo(t.x + Math.cos(t.aci) * t.r * 1.1 + 1.5, t.y + Math.sin(t.aci) * t.r * 1.1 - 1); cizgi(a, C.tomI, t.r * 0.4);
    }
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const a = e.aci, isik = Math.cos(a + 0.73) > -0.1, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
        const pe = P(SAHNE.elipsYolu(e));
        boya(pe, isik ? C.cic : C.cicG);
        if (renkli) {
          g.save(); g.clip(pe);
          const L = c.r * (isik ? 0.5 : 0.7), hw = e.ry * (isik ? 0.55 : 0.8);
          g.fillStyle = css(C.pembe, isik ? 0.85 : 1);
          g.beginPath(); g.moveTo(c.x - vx * 1.5, c.y - vy * 1.5); g.lineTo(c.x + ux * L + vx * hw, c.y + uy * L + vy * hw);
          g.quadraticCurveTo(c.x + ux * L * 1.18, c.y + uy * L * 1.18, c.x + ux * L - vx * hw, c.y + uy * L - vy * hw); g.closePath(); g.fill();
          g.restore();
          g.strokeStyle = css([196, 160, 222], 0.6); g.lineWidth = 0.8; g.stroke(pe);
        }
      }
      boya(P(SAHNE.daireYolu(c.x, c.y, c.r * 0.2)), C.orta);
      for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; boya(P(SAHNE.daireYolu(c.x + Math.cos(a) * c.r * 0.25, c.y + Math.sin(a) * c.r * 0.25, Math.max(1.3, c.r * 0.045))), C.ortaK); }
      boya(P(SAHNE.daireYolu(c.x + c.r * 0.05, c.y - c.r * 0.06, c.r * 0.07)), C.ortaI);
    }
  };
  tuvalKatman((g) => bitkiCiz(g, true));
  bitkiCiz(dg, false);
  darbeOku();

  // ------------------------------------------------------------ kabartı, tuval bezi ve saten ışık
  const H = new Float32Array(N);
  for (let i = 0; i < N; i++) H[i] = DK[i] * 1.6 + BEZ[i] * (1.1 - 0.75 * clamp(DK[i] * 1.8, 0, 1)) * 0.55;
  const Hb = bulanik(H, WW, WW, 1, 1), Hg = bulanik(H, WW, WW, 3, 2);
  const Hv = [LV[0], LV[1], LV[2] + 1]; { const l = Math.hypot(...Hv); Hv[0] /= l; Hv[1] /= l; Hv[2] /= l; }
  const img = ctx.createImageData(WW, WW), d = img.data;
  for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x;
    const xa = x > 0 ? i - 1 : i, xb = x < WW - 1 ? i + 1 : i, ya = y > 0 ? i - WW : i, yb = y < WW - 1 ? i + WW : i;
    const gx = (Hb[xb] - Hb[xa]) * 1.4, gy = (Hb[yb] - Hb[ya]) * 1.4, nl = Math.hypot(gx, gy, 1);
    const dif = (-gx * LV[0] - gy * LV[1] + LV[2]) / nl;
    const sx = (Hg[xb] - Hg[xa]) * 6, sy = (Hg[yb] - Hg[ya]) * 6, sl = Math.hypot(sx, sy, 1);
    const sat = Math.pow(Math.max(0, (-sx * Hv[0] - sy * Hv[1] + Hv[2]) / sl), 18);
    const ince = Math.pow(Math.max(0, (-gx * Hv[0] - gy * Hv[1] + Hv[2]) / nl), 40);
    const k = 1 + (dif - LV[2]) * 0.5, sp = sat * 26 + ince * 16;
    d[i * 4] = clamp(CR[i] * k + sp, 0, 255); d[i * 4 + 1] = clamp(CG[i] * k + sp, 0, 255); d[i * 4 + 2] = clamp(CB[i] * k + sp, 0, 255); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
