<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-198 Murakka Albüm Sayfası — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F1E7D6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ---------------------------------------------------------------- ortak el yardımcıları
  const S = SAHNE;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const N = 256;
    const tab = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * N + x0];
      const b = tab[y0 * N + x1];
      const c = tab[y1 * N + x0];
      const d = tab[y1 * N + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    const n = H.noise(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen bir şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.noise(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? 0 : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (taper > 0) {
          if (t < taper) w *= 0.3 + 0.7 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.3 + 0.7 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Kubbe yarıçapı r(y) ve eğimi; y 300–555. */
  H.kubbeP = S.kubbeProfili(200);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };

  /** Bölge haritası istenen ölçekte (ör. 2 → 2048²): kod dizisi + ad listesi. */
  H.BOLGE_ADLARI = Object.keys(S.BOLGE);
  H.bolgeHaritasi = function (olcek) {
    const N = 1024 * olcek;
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(olcek, 0, 0, olcek, 0, 0);
    S.ciz(g, { bolge: true });
    const v = g.getImageData(0, 0, N, N).data;
    const kod = new Uint8Array(N * N);
    const tablo = H.BOLGE_ADLARI.map((ad) => H.hex(S.BOLGE[ad]));
    const onbellek = new Map();
    for (let i = 0, j = 0; i < N * N; i++, j += 4) {
      const key = (v[j] << 16) | (v[j + 1] << 8) | v[j + 2];
      let k = onbellek.get(key);
      if (k === undefined) {
        let en = 1e9;
        k = 0;
        for (let m = 0; m < tablo.length; m++) {
          const dr = v[j] - tablo[m][0];
          const dg = v[j + 1] - tablo[m][1];
          const db = v[j + 2] - tablo[m][2];
          const dd = dr * dr + dg * dg + db * db;
          if (dd < en) {
            en = dd;
            k = m;
          }
        }
        onbellek.set(key, k);
      }
      kod[i] = k;
    }
    const K = {};
    H.BOLGE_ADLARI.forEach((ad, i) => (K[ad] = i));
    return { N, kod, K };
  };

  /**
   * Örtmeli kontur katmanı: sahne sırasıyla her nesne için önce kendi alanını siler (arkadakilerin
   * çizgileri onun altında kalır), sonra kendi çizgisini çizer. Sonunda ana tuvale bindirilir.
   */
  H.konturKatmani = function (olcek) {
    const c = S.yeniTuval(1024 * olcek, 1024 * olcek);
    const k = c.getContext('2d');
    k.setTransform(olcek, 0, 0, olcek, 0, 0);
    return {
      c,
      k,
      sil(d) {
        k.save();
        k.globalCompositeOperation = 'destination-out';
        k.fillStyle = '#000';
        for (const x of [].concat(d)) k.fill(typeof x === 'string' ? new Path2D(x) : x);
        k.restore();
      },
    };
  };

  // ---------------------------------------------------------------- S-198 Murakka Albüm Sayfası
  // Hayalî bir murakka ustasının eli: ortada parlak, ince fırçayla işlenmiş bir resim; resim katman katman
  // renkli kâğıt pervazlara (açık lacivert ve somon) ve altın, lacivert, kırmızı ince cetvellere oturtulur;
  // dışta geniş kenar suyu, açık pastel renkli ince battal ebru kâğıdıdır. Yazı kıtası yoktur.
  const N2 = 2048;
  const tuval = document.getElementById('tuval');
  tuval.width = N2;
  tuval.height = N2;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  const R = S.rng(198);
  const P = H.P;
  let tohum = 5;

  // sayfa düzeni: alt kenar suyu üsttekinden geniş
  const PANO = { x: 96, y: 80, w: 832 };
  const RESIM = { x: 134, y: 118, w: 756 };
  const SC = RESIM.w / 1024;
  const K = {
    altin: '#CFA64A',
    altinAcik: '#EDD38A',
    altinKoyu: '#8E6B26',
    lacivert: '#2C4C9E',
    pervaz1: '#9DB2DE',
    pervaz2: '#EDC3B0',
    surh: '#BF3F32',
    murekkep: '#2E241C',
  };

  // ------------------------------------------------ 1) kenar suyu: açık pastel battal ebru (damla matematiği)
  {
    const W = 1024;
    const rk = S.rng(3198);
    const renkler = ['#EDC6C0', '#BDD1EA', '#F0E2BC', '#FAF6EC', '#C9DCC6'].map(H.hex);
    const zemin = H.hex('#FBF7EE');
    const damlalar = [];
    // tekneye sırayla boya serpilir; her damla öncekileri iter
    // damlalar yalnız kenar suyu bölgesine (ve biraz içine) serpilir; yüzey tamamen dolar
    while (damlalar.length < 2700) {
      const x = rk() * W;
      const y = rk() * W;
      if (x > PANO.x + 34 && x < PANO.x + PANO.w - 34 && y > PANO.y + 34 && y < PANO.y + PANO.w - 34) continue;
      const t = rk();
      damlalar.push({ x, y, r: 8.5 + rk() * 8, c: t < 0.38 ? 0 : t < 0.76 ? 1 : t < 0.87 ? 2 : t < 0.97 ? 3 : 4 });
    }
    // ebruyu biraz eğmek için en sonda hafif bir gelgit dalgası
    const kenarda = (x, y) => !(x > PANO.x - 2 && x < PANO.x + PANO.w + 2 && y > PANO.y - 2 && y < PANO.y + PANO.w + 2);
    const img = ctx.getImageData(0, 0, N2, N2);
    const o = img.data;
    const nk = H.noise(14);
    for (let Y2 = 0; Y2 < N2; Y2++) {
      for (let X2 = 0; X2 < N2; X2++) {
        const x = (X2 + 0.5) / 2;
        const y = (Y2 + 0.5) / 2;
        if (!kenarda(x, y)) continue;
        // gelgit dalgasının tersi
        let px = x + 7 * Math.sin((2 * Math.PI * y) / 46);
        let py = y + 2 * Math.sin((2 * Math.PI * x) / 120);
        let renk = -1;
        let derin = 0;
        for (let k = damlalar.length - 1; k >= 0; k--) {
          const d = damlalar[k];
          const dx = px - d.x;
          const dy = py - d.y;
          const q = dx * dx + dy * dy;
          const r2 = d.r * d.r;
          if (q < r2) {
            renk = d.c;
            derin = Math.sqrt(q) / d.r;
            break;
          }
          if (q > 90 * r2) continue;
          const f = Math.sqrt(1 - r2 / q);
          px = d.x + dx * f;
          py = d.y + dy * f;
        }
        const c = renk < 0 ? zemin : renkler[renk];
        // taşın içi kenarına doğru çok hafif koyulaşır (boyanın toplanması), kâğıdın lifi
        const g = 1 - 0.06 * Math.pow(derin, 3) + 0.012 * nk(X2 / 7, Y2 / 7);
        const i = (Y2 * N2 + X2) * 4;
        o[i] = c[0] * g;
        o[i + 1] = c[1] * g;
        o[i + 2] = c[2] * g;
        o[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ------------------------------------------------ 2) katmanlı renkli kâğıt pervazlar ve cetveller
  {
    const kare = (o, renk, w) => {
      ctx.lineWidth = w;
      ctx.strokeStyle = renk;
      ctx.strokeRect(PANO.x + o, PANO.y + o, PANO.w - 2 * o, PANO.w - 2 * o);
    };
    const dolgu = (o1, o2, renk) => {
      const p = new Path2D();
      p.rect(PANO.x + o1, PANO.y + o1, PANO.w - 2 * o1, PANO.w - 2 * o1);
      p.rect(PANO.x + o2, PANO.y + o2, PANO.w - 2 * o2, PANO.w - 2 * o2);
      ctx.fillStyle = renk;
      ctx.fill(p, 'evenodd');
    };
    // kâğıdın ebru üstüne bindiği yerde çok hafif gölge
    ctx.save();
    ctx.shadowColor = 'rgba(90,70,50,0.25)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1.5;
    ctx.fillStyle = K.pervaz1;
    ctx.fillRect(PANO.x, PANO.y, PANO.w, PANO.w);
    ctx.restore();
    dolgu(0, 3.5, K.altin);
    kare(0.3, K.murekkep, 0.6);
    kare(3.4, K.murekkep, 0.6);
    // açık lacivert pervaz: ince altın halkâr noktaları
    const rr = S.rng(61);
    for (let i = 0; i < 520; i++) {
      const t = rr();
      const yan = (rr() * 4) | 0;
      const s = PANO.x + 6 + t * (PANO.w - 12);
      const u = 6 + rr() * 9;
      const [x, y] = yan === 0 ? [s, PANO.y + u] : yan === 1 ? [PANO.x + PANO.w - u, s - PANO.x + PANO.y] : yan === 2 ? [s, PANO.y + PANO.w - u] : [PANO.x + u, s - PANO.x + PANO.y];
      ctx.fillStyle = rr() < 0.6 ? 'rgba(238,214,140,0.9)' : 'rgba(255,250,236,0.7)';
      ctx.beginPath();
      ctx.arc(x, y, 0.5 + rr() * 0.8, 0, 6.28);
      ctx.fill();
    }
    dolgu(17.5, 20.5, K.altin);
    kare(17.4, K.murekkep, 0.5);
    kare(20.6, K.murekkep, 0.5);
    dolgu(20.8, 31, K.pervaz2);
    // somon pervazda ince lacivert çizgi
    kare(26, K.lacivert, 0.7);
    dolgu(31, 34.2, K.altin);
    kare(31, K.murekkep, 0.5);
    kare(34.2, K.murekkep, 0.5);
    kare(36, K.surh, 1.6);
    // köşelerde altın göbekli lacivert kareler
    for (const [x, y] of [[PANO.x + 3.5, PANO.y + 3.5], [PANO.x + PANO.w - 17.5, PANO.y + 3.5], [PANO.x + 3.5, PANO.y + PANO.w - 17.5], [PANO.x + PANO.w - 17.5, PANO.y + PANO.w - 17.5]]) {
      ctx.fillStyle = K.lacivert;
      ctx.fillRect(x, y, 14, 14);
      ctx.fillStyle = K.altinAcik;
      for (let k = 0; k < 4; k++) {
        const a = (k / 4) * 6.28 + 0.785;
        ctx.beginPath();
        ctx.ellipse(x + 7 + Math.cos(a) * 3, y + 7 + Math.sin(a) * 3, 2.6, 1.3, a, 0, 6.28);
        ctx.fill();
      }
      ctx.fillStyle = K.surh;
      ctx.beginPath();
      ctx.arc(x + 7, y + 7, 1.4, 0, 6.28);
      ctx.fill();
    }
  }

  function yaprakYolu(x, y, a, L, Wd, kiv) {
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const p = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
    const b = p(L, kiv * L * 0.25);
    const c1 = p(L * 0.3, -Wd);
    const c2 = p(L * 0.75, -Wd * 0.6 + kiv * L * 0.2);
    const c3 = p(L * 0.75, Wd * 0.6 + kiv * L * 0.2);
    const c4 = p(L * 0.3, Wd);
    return `M${x},${y} C${c1} ${c2} ${b} C${c3} ${c4} ${x},${y} Z`.replace(/(\d+\.\d{2})\d+/g, '$1');
  }

  // ------------------------------------------------ 4) ortadaki ince resim (sahne koordinatında)
  ctx.save();
  ctx.beginPath();
  ctx.rect(RESIM.x, RESIM.y, RESIM.w, RESIM.w);
  ctx.clip();
  ctx.translate(RESIM.x, RESIM.y);
  ctx.scale(SC, SC);
  const Y = S.yollar();
  const ince = (d, w, renk, amp) => H.pen(ctx, d, { w: w / SC * 0.85, color: renk, amp: amp === undefined ? 0.35 : amp, wl: 22, seed: tohum++, press: 0.4, taper: 0.12, step: 1.2 });
  const doldur = (d, f) => {
    ctx.fillStyle = f;
    ctx.fill(typeof d === 'string' ? P(d) : d);
  };
  const yatay = (x1, x2, dur) => {
    const g = ctx.createLinearGradient(x1, 0, x2, 0);
    dur.forEach(([t, c]) => g.addColorStop(t, c));
    return g;
  };
  // gök: üstte açık firuze-mavi, ufka doğru krem; ufukta pembe-altın ince bulut şeritleri
  {
    const g = ctx.createLinearGradient(0, 0, 0, 800);
    g.addColorStop(0, '#78B3E0');
    g.addColorStop(0.42, '#AED3EC');
    g.addColorStop(0.76, '#EEF0E6');
    g.addColorStop(0.9, '#F8E6D6');
    g.addColorStop(1, '#F6ECDB');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 1024);
    const gn = ctx.createRadialGradient(880, 140, 10, 880, 140, 230);
    gn.addColorStop(0, 'rgba(255,252,236,1)');
    gn.addColorStop(0.25, 'rgba(255,248,226,0.6)');
    gn.addColorStop(1, 'rgba(255,248,226,0)');
    ctx.fillStyle = gn;
    ctx.fillRect(0, 0, 1024, 800);
    doldur(S.daireYolu(880, 140, 24), yatay(856, 904, [[0, '#D9A947'], [0.6, '#F0CF70'], [1, '#F8E3A2']]));
    ince(S.daireYolu(880, 140, 24), 0.6, 'rgba(150,108,40,0.9)', 0.1);
    ince(S.daireYolu(880, 140, 31), 0.5, 'rgba(214,170,80,0.7)', 0.2);
    // uzun, ince bulut şeritleri: beyaz gövde, altta pembe, üstte ince mavi-gri kontur
    const serit = (bx, by, L, h, pembe) => {
      const x0 = bx - L / 2;
      const x1 = bx + L / 2;
      const d = `M${x0},${by} C${x0 + L * 0.2},${by - h * 1.2} ${x0 + L * 0.45},${by - h * 0.9} ${bx},${by - h} C${x1 - L * 0.35},${by - h * 1.1} ${x1 - L * 0.15},${by - h * 0.6} ${x1},${by} C${x1 - L * 0.3},${by + h * 0.35} ${x0 + L * 0.3},${by + h * 0.35} ${x0},${by} Z`;
      const gg = ctx.createLinearGradient(0, by - h, 0, by + h * 0.4);

  // ------------------------------------------------ 5) son: ortada ince fırça izi (guaşın yönlü dokusu), kenarda kâğıt
  {
    const BH = H.bolgeHaritasi(1);
    const KB = BH.K;
    const img = ctx.getImageData(0, 0, N2, N2);
    const o = img.data;
    const n = H.noise(808);
    const nf = H.noise(809);
    const x0 = RESIM.x * 2;
    const x1 = (RESIM.x + RESIM.w) * 2;
    for (let y = 0; y < N2; y++) {
      for (let x = 0; x < N2; x++) {
        const i = (y * N2 + x) * 4;
        let f;
        if (x >= x0 && x < x1 && y >= x0 && y < x1) {
          const sx = Math.min(1023, Math.max(0, ((x / 2 - RESIM.x) / SC) | 0));
          const sy = Math.min(1023, Math.max(0, ((y / 2 - RESIM.y) / SC) | 0));
          const b = BH.kod[sy * 1024 + sx];
          let a;
          if (b === KB.gok || b === KB.gunes || b === KB.zemin) a = 0.04 * nf(x / 300, y / 300);
          else if (b === KB.kubbe) {
            const r = H.kubbeR(sy) || 1;
            const u = (sx - 560) / r;
            const dr = (H.kubbeR(sy - 2) - H.kubbeR(sy + 2)) / 4;
            a = Math.atan2(-1, u * dr);
          } else if (b === KB.kasnak || b === KB.minare || b === KB.kaide) a = Math.PI / 2;
          else a = -0.8;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          const u2 = x * ca + y * sa;
          const v2 = -x * sa + y * ca;
          f = 1 + 0.03 * n(u2 / 26, v2 / 2.4) + 0.012 * n(x / 3, y / 3);
          if (b === KB.gok) f += 0.02 * nf(x / 220, y / 9);
        } else {
          f = 1 + 0.018 * n(x / 3.5, y / 3.5) + 0.01 * n(x / 40, y / 9);
        }
        o[i] *= f;
        o[i + 1] *= f;
        o[i + 2] *= f;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
