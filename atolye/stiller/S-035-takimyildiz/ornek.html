<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-035 Takımyıldız — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #050b1c; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-035 Takımyıldız — sahne gece mavisi bir gök haritasında takımyıldız olarak çizilir: biçimlerin yapısal
  // köşelerine yıldızlar konur, ince soluk çizgilerle bağlanır; yıldızın büyüklüğü önemini gösterir.
  (function () {
    const S = SAHNE;
    const W = 1024;
    const ctx = S.tuval(document.getElementById('tuval'), 2);
    const rnd = S.rng(35);
    const MX = 512; // harita merkezi
    const MY = 512;
    const RI = 487; // iç çember (harita alanı)
    const RD = 508; // dış çember

    const ALTIN = '#D8B45A';
    const CAMGOBEGI = 'rgba(176,232,244,';

    // ---------------------------------------------------------------- değer gürültüsü (bulutsu ve Samanyolu için)
    function hash(x, y, t) {
      let h = (x * 374761393 + y * 668265263 + t * 2147483647) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function gurultu(x, y, t) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const a = hash(xi, yi, t);
      const b = hash(xi + 1, yi, t);
      const c = hash(xi, yi + 1, t);
      const d = hash(xi + 1, yi + 1, t);
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    }
    function fbm(x, y, t, n) {
      let s = 0;
      let a = 0.5;
      let f = 1;
      for (let i = 0; i < (n || 5); i++) {
        s += a * gurultu(x * f, y * f, t + i * 17);
        f *= 2.03;
        a *= 0.5;
      }
      return s;
    }

    // ---------------------------------------------------------------- eğik stereografik izdüşüm (gök koordinatları)
    const D = Math.PI / 180;
    const d0 = 42 * D; // harita merkezinin dik açıklığı
    const a0 = 0;
    const OLC = RI / (2 * Math.tan((78 * D) / 2));
    function izdusum(a, d) {
      const k = 2 / (1 + Math.sin(d0) * Math.sin(d) + Math.cos(d0) * Math.cos(d) * Math.cos(a - a0));
      const x = k * Math.cos(d) * Math.sin(a - a0);
      const y = k * (Math.cos(d0) * Math.sin(d) - Math.sin(d0) * Math.cos(d) * Math.cos(a - a0));
      return [MX - x * OLC, MY - y * OLC]; // gök haritası: doğu solda
    }
    function tersIzdusum(X, Y) {
      const x = (MX - X) / OLC;
      const y = (MY - Y) / OLC;
      const ro = Math.hypot(x, y) || 1e-9;
      const c = 2 * Math.atan(ro / 2);
      const d = Math.asin(Math.cos(c) * Math.sin(d0) + (y * Math.sin(c) * Math.cos(d0)) / ro);
      const a = a0 + Math.atan2(x * Math.sin(c), ro * Math.cos(d0) * Math.cos(c) - y * Math.sin(d0) * Math.sin(c));
      return [a, d];
    }
    const birim = (a, d) => [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)];

    // ---------------------------------------------------------------- zemin: gece mavisi
    ctx.fillStyle = '#040918';
    ctx.fillRect(0, 0, W, W);
    let g = ctx.createRadialGradient(MX - 40, MY - 60, 40, MX, MY, RI);
    g.addColorStop(0, '#0F2552');
    g.addColorStop(0.6, '#0B1C44');
    g.addColorStop(1, '#081535');
    ctx.save();
    const harita = new Path2D();
    harita.arc(MX, MY, RI, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill(harita);
    ctx.restore();

    // ---------------------------------------------------------------- Samanyolu: ince toz bandı (piksel piksel)
    const t1 = tersIzdusum(330, 30);
    const t2 = tersIzdusum(1010, 760);
    const v1 = birim(t1[0], t1[1]);
    const v2 = birim(t2[0], t2[1]);
    let kut = [v1[1] * v2[2] - v1[2] * v2[1], v1[2] * v2[0] - v1[0] * v2[2], v1[0] * v2[1] - v1[1] * v2[0]];
    const kn = Math.hypot(...kut);
    kut = kut.map((q) => q / kn);
    const sy = SAHNE.yeniTuval(W, W);
    const sc = sy.getContext('2d');
    const simg = sc.createImageData(W, W);
    const sv = simg.data;
    const bant = new Float32Array(W * W);
    for (let Y = 0; Y < W; Y++) {
      for (let X = 0; X < W; X++) {
        const dx = X - MX;
        const dy = Y - MY;
        if (dx * dx + dy * dy > RI * RI) continue;
        const [a, d] = tersIzdusum(X, Y);
        const v = birim(a, d);
        const b = Math.asin(v[0] * kut[0] + v[1] * kut[1] + v[2] * kut[2]) / D; // galaktik enlem
        const yog = Math.exp(-(b * b) / (2 * 9 * 9));
        const n = fbm(X / 90, Y / 90, 3, 5);
        const toz = fbm(X / 40, Y / 40, 9, 4);
        let I = yog * (0.35 + 0.9 * n) * (1 - 0.75 * Math.max(0, toz - 0.48) * 3 * Math.exp(-(b * b) / (2 * 3.5 * 3.5)));
        I = Math.max(0, I);
        bant[Y * W + X] = I;
        const i = (Y * W + X) * 4;
        sv[i] = 150;
        sv[i + 1] = 170;
        sv[i + 2] = 235;
        sv[i + 3] = Math.min(255, I * 62);
      }
    }
    sc.putImageData(simg, 0, 0);
    ctx.save();
    ctx.filter = 'blur(2px)';
    ctx.drawImage(sy, 0, 0, W, W);
    ctx.restore();

    // ---------------------------------------------------------------- gök koordinat ızgarası (eğri sağ açıklık / dik açıklık çizgileri)
    ctx.save();
    ctx.clip(harita);
    ctx.lineWidth = 0.7;
    function egri(noktalar) {
      ctx.beginPath();
      let ilk = true;
      for (const [x, y] of noktalar) {
        if (!isFinite(x) || Math.hypot(x - MX, y - MY) > RI + 60) {
          ilk = true;
          continue;
        }
        if (ilk) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        ilk = false;
      }
      ctx.stroke();
    }
    for (let dd = -45; dd < 90; dd += 15) {
      const pts = [];
      for (let aa = 0; aa <= 360; aa += 2) pts.push(izdusum(aa * D, dd * D));
      ctx.strokeStyle = dd === 0 ? 'rgba(216,180,90,0.42)' : 'rgba(216,180,90,0.2)';
      ctx.lineWidth = dd === 0 ? 0.9 : 0.7;
      egri(pts);
    }
    for (let aa = 0; aa < 360; aa += 15) {
      const pts = [];
      for (let dd = -60; dd <= (aa % 90 === 0 ? 90 : 75); dd += 1.5) pts.push(izdusum(aa * D, dd * D));
      ctx.strokeStyle = 'rgba(216,180,90,0.2)';
      ctx.lineWidth = 0.7;
      egri(pts);
    }
    // tutulum (kesik çizgi)
    {
      const e = 23.44 * D;
      const pts = [];
      for (let l = 0; l <= 360; l += 2) {
        const L = l * D;
        const a = Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L));
        const d = Math.asin(Math.sin(e) * Math.sin(L));
        pts.push(izdusum(a, d));
      }
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(216,180,90,0.32)';
      egri(pts);
      ctx.setLineDash([]);
    }
    ctx.restore();

    // ---------------------------------------------------------------- yıldız çizimi
    function parilti(x, y, r, renk, a) {
      const gg = ctx.createRadialGradient(x, y, 0, x, y, r);
      gg.addColorStop(0, renk + a + ')');
      gg.addColorStop(0.35, renk + a * 0.35 + ')');
      gg.addColorStop(1, renk + '0)');
      ctx.fillStyle = gg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function yildiz(x, y, kadir, tur) {
      // kadir 0..1 (büyüklük); tur: 'yapi' (beyaz-camgöbeği), 'altin'
      const sicak = tur === 'altin';
      const hale = sicak ? 'rgba(255,214,130,' : 'rgba(190,230,255,';
      parilti(x, y, 2.5 + kadir * 11, hale, 0.32 + kadir * 0.45);
      if (kadir >= 0.8) {
        // dört kollu kırınım ışını
        const L = 9 + kadir * 20;
        ctx.save();
        ctx.lineCap = 'round';
        for (const [ux, uy, k] of [[1, 0, 1], [0, 1, 1], [0.7071, 0.7071, 0.45], [0.7071, -0.7071, 0.45]]) {
          const l = L * k;
          const gl = ctx.createLinearGradient(x - ux * l, y - uy * l, x + ux * l, y + uy * l);
          gl.addColorStop(0, hale + '0)');
          gl.addColorStop(0.5, hale + (k === 1 ? 0.95 : 0.5) + ')');
          gl.addColorStop(1, hale + '0)');
          ctx.strokeStyle = gl;
          ctx.lineWidth = k === 1 ? 1.1 : 0.7;
          ctx.beginPath();
          ctx.moveTo(x - ux * l, y - uy * l);
          ctx.lineTo(x + ux * l, y + uy * l);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.fillStyle = sicak ? '#FFF1CF' : '#F4FBFF';
      ctx.beginPath();
      ctx.arc(x, y, 0.55 + kadir * 1.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---------------------------------------------------------------- arka plan yıldızları (Samanyolunda yoğun)
    ctx.save();
    ctx.clip(harita);
    for (let i = 0; i < 5200; i++) {
      const x = MX + (rnd() * 2 - 1) * RI;
      const y = MY + (rnd() * 2 - 1) * RI;
      if (Math.hypot(x - MX, y - MY) > RI - 2) continue;
      const b = bant[(y | 0) * W + (x | 0)];
      if (rnd() > 0.1 + 0.9 * Math.min(1, b * 1.4)) continue;
      const m = Math.pow(rnd(), 3.2);
      ctx.fillStyle = `rgba(${200 + rnd() * 55 | 0},${215 + rnd() * 40 | 0},255,${0.25 + 0.6 * m})`;
      ctx.beginPath();
      ctx.arc(x, y, 0.35 + m * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    // birkaç belirgin arka plan yıldızı
    for (let i = 0; i < 46; i++) {
      const x = MX + (rnd() * 2 - 1) * RI;
      const y = MY + (rnd() * 2 - 1) * RI;
      if (Math.hypot(x - MX, y - MY) > RI - 14) continue;
      if (S.kubbedeMi(x, y) || (x > 230 && x < 850 && y > 280 && y < 1024) || (x > 240 && x < 360 && y > 60)) continue;
      parilti(x, y, 4 + rnd() * 5, 'rgba(200,225,255,', 0.25 + rnd() * 0.2);
      ctx.fillStyle = 'rgba(235,245,255,0.8)';
      ctx.beginPath();
      ctx.arc(x, y, 0.7 + rnd() * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ---------------------------------------------------------------- kubbe: soluk yeşil bulutsu
    {
      const bt = SAHNE.yeniTuval(W, W);
      const bc = bt.getContext('2d');
      const img = bc.createImageData(W, W);
      const v = img.data;
      for (let Y = 280; Y < 570; Y++) {
        for (let X = 340; X < 780; X++) {
          if (!S.kubbedeMi(X, Y)) continue;
          const n = fbm(X / 70, Y / 70, 21, 5);
          const n2 = fbm(X / 22, Y / 22, 33, 3);
          const yuk = (555 - Y) / 255;
          const I = Math.max(0, n - 0.28) * 1.5 * (0.7 + 0.5 * n2) * (0.75 + 0.35 * yuk);
          const i = (Y * W + X) * 4;
          v[i] = 60 + n2 * 50;
          v[i + 1] = 190 + n * 60;
          v[i + 2] = 95 + n2 * 50;
          v[i + 3] = Math.min(255, 18 + I * 105);
        }
      }
      bc.putImageData(img, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.filter = 'blur(9px)';
      ctx.globalAlpha = 0.85;
      ctx.drawImage(bt, 0, 0, W, W);
      ctx.filter = 'blur(3px)';
      ctx.globalAlpha = 0.35;
      ctx.drawImage(bt, 0, 0, W, W);
      ctx.restore();
    }

    // ---------------------------------------------------------------- takımyıldızlar
    const yildizlar = new Map();
    function y_(x, y, k, tur) {
      const anahtar = Math.round(x) + ',' + Math.round(y);
      const e = yildizlar.get(anahtar);
      if (!e || e.k < k) yildizlar.set(anahtar, { x, y, k, tur: tur || 'yapi' });
      return [x, y];
    }
    const cizgiler = []; // {noktalar, tur, kesik, kapali}
    function hat(noktalar, tur, o) {
      cizgiler.push(Object.assign({ noktalar, tur: tur || 'yapi' }, o || {}));
    }
    const K = S.kaide;

    // kubbe dış çizgisi
    const kn2 = S.kubbeNoktalari(6);
    const kubbeHat = kn2.map(([x, y], i) => {
      const uc = i === 0 || i === kn2.length - 1;
      const tepe = i === 6;
      return y_(x, y, tepe ? 1 : uc ? 0.62 : 0.3 + (i % 2) * 0.08);
    });
    hat(kubbeHat);
    // kaburgalar: kesik soluk meridyenler
    for (const kb of S.kaburgalar(8)) {
      const p = kb.noktalar;
      y_(p[0][0], p[0][1], 0.18);
      const orta = p[Math.floor(p.length * 0.45)];
      y_(orta[0], orta[1], 0.12);
      hat(p.filter((_, i) => i % 2 === 0).concat([p[p.length - 1]]), 'yapi', { kesik: true, soluk: true });
    }
    // kubbe alemi
    function alem(cx, taban, s, buyuk) {
      const a = S.alemParcalari(cx, taban, s);
      const yaka = y_(cx, taban, buyuk ? 0.5 : 0.35, 'altin');
      const kureler = a.kureler.map((k, i) => y_(k.cx, k.cy, (buyuk ? 0.46 : 0.32) - i * 0.06, 'altin'));
      const R = a.hilal.R;
      const hy = a.hilal.cy;
      const solUc = y_(cx - 0.837 * R, hy - 0.547 * R, 1, 'altin');
      const sagUc = y_(cx + 0.837 * R, hy - 0.547 * R, 1, 'altin');
      const alt = y_(cx, hy + R, buyuk ? 0.4 : 0.3, 'altin');
      const icAlt = y_(cx, hy + 0.45 * R, buyuk ? 0.2 : 0.14, 'altin');
      hat([yaka, ...kureler, alt], 'altin');
      // hilal: dış yay ve iç yay (yay boyunca ara noktalar, yıldız yalnız uçlarda ve dipte)
      const dis = [];
      const a1 = Math.atan2(-0.547, -0.837);
      const a2 = Math.atan2(-0.547, 0.837);
      for (let i = 0; i <= 14; i++) {
        const a = a1 - ((a1 + Math.PI * 2 - a2) * i) / 14;
        dis.push([cx + Math.cos(a) * R, hy + Math.sin(a) * R]);
      }
      hat(dis, 'altin', { parlak: true });
      const ic = [];
      const r2 = 0.85 * R;
      const icy = hy - 0.4 * R;
      const b1 = Math.atan2(hy - 0.547 * R - icy, 0.837 * R);
      const b2 = Math.atan2(hy - 0.547 * R - icy, -0.837 * R) + Math.PI * 2; // alttan dolaş
      for (let i = 0; i <= 10; i++) {
        const a = b1 + ((b2 - b1) * i) / 10;
        ic.push([cx + Math.cos(a) * r2, icy + Math.sin(a) * r2]);
      }
      hat(ic, 'altin', { soluk: true });
    }
    alem(560, 300, 1, true);

    // kasnak katları
    for (let k = 0; k < 2; k++) {
      const q = S.kasnak[k];
      const a = y_(q.x1, q.y1, 0.42);
      const b = y_(q.x2, q.y1, 0.42);
      const c = y_(q.x2, q.y2, 0.42);
      const d = y_(q.x1, q.y2, 0.42);
      hat([a, b, c, d, a]);
      for (const p of S.kasnakPencereleri(k)) {
        const sol = y_(p.x - p.w / 2, p.y + p.h, 0.07);
        const tepe = y_(p.x, p.y, 0.16);
        const sag = y_(p.x + p.w / 2, p.y + p.h, 0.07);
        hat([sol, [p.x - p.w / 2, p.y + p.w * 0.62], tepe, [p.x + p.w / 2, p.y + p.w * 0.62], sag], 'yapi', { soluk: true });
      }
    }
    // kaide ve korniş
    {
      const kk = K.kornis;
      const a = y_(kk.x1, kk.y1, 0.62);
      const b = y_(kk.x2, kk.y1, 0.62);
      const c = y_(kk.x2, kk.y2, 0.3);
      const d = y_(kk.x1, kk.y2, 0.3);
      hat([d, a, b, c]);
      const e = y_(K.x1, K.y1, 0.28);
      const f = y_(K.x2, K.y1, 0.28);
      const gg = y_(K.x2, K.y2, 0.5);
      const h = y_(K.x1, K.y2, 0.5);
      hat([d, e, h, gg, f, c]);
      hat([e, f], 'yapi', { soluk: true });
      for (const p of K.pencereler) {
        const sol = y_(p.x - p.w / 2, p.y + p.h, 0.12);
        const omz1 = y_(p.x - p.w / 2, p.y + p.w * 0.62, 0.1);
        const tepe = y_(p.x, p.y, 0.3);
        const omz2 = y_(p.x + p.w / 2, p.y + p.w * 0.62, 0.1);
        const sag = y_(p.x + p.w / 2, p.y + p.h, 0.12);
        hat([sol, omz1, [p.x - p.w * 0.4, p.y + p.w * 0.3], [p.x - p.w * 0.2, p.y + p.w * 0.1], tepe, [p.x + p.w * 0.2, p.y + p.w * 0.1], [p.x + p.w * 0.4, p.y + p.w * 0.3], omz2, sag]);
        hat([sol, sag], 'yapi', { soluk: true, kesik: true });
      }
    }
    // minare
    {
      const sol = [[266, 800, 0.4], [266, 488, 0.36], [246, 462, 0.95], [252, 436, 0.4], [273, 436, 0.18], [273, 316, 0.32], [255, 295, 0.9], [260, 272, 0.36], [281, 272, 0.16], [281, 206, 0.28], [276, 199, 0.22], [287, 168, 0.12], [300, 146, 0.55]];
      const solHat = sol.map(([x, y, k]) => y_(x, y, k));
      hat(solHat);
      const sag = [[334, 610, 0.2], [334, 488, 0.36], [354, 462, 0.95], [348, 436, 0.4], [327, 436, 0.18], [327, 316, 0.32], [345, 295, 0.9], [340, 272, 0.36], [319, 272, 0.16], [319, 206, 0.28], [324, 199, 0.22], [313, 168, 0.12], [300, 146, 0.55]];
      hat(sag.map(([x, y, k]) => y_(x, y, k)));
      // şerefe tabanları ve korkuluklar
      hat([[246, 462], [354, 462]]);
      hat([[252, 436], [348, 436]], 'yapi', { soluk: true });
      hat([[255, 295], [345, 295]]);
      hat([[260, 272], [340, 272]], 'yapi', { soluk: true });
      hat([[266, 488], [334, 488]], 'yapi', { soluk: true });
      for (let i = 0; i < 7; i++) {
        y_(258 + i * 14, 446, 0.06);
        y_(266 + i * 11.3, 281, 0.05);
      }
      // zikzak bandı: bir sıra zikzak yıldız zinciri
      const z = S.zikzakCizgileri()[1];
      hat(z.map(([x, yy], i) => y_(x, yy, i % 2 ? 0.1 : 0.14)));
      // pencereler
      for (const p of S.minarePencereleri) {
        const a = y_(p.x - p.w / 2, p.y + p.h, 0.06);
        const t = y_(p.x, p.y, 0.14);
        const b = y_(p.x + p.w / 2, p.y + p.h, 0.06);
        hat([a, t, b], 'yapi', { soluk: true });
      }
      alem(300, 146, 0.62, false);
    }

    // ---------------------------------------------------------------- bitkiler: altın takımyıldızlar
    const icinde = (x, y, pay) => Math.hypot(x - MX, y - MY) < RI - (pay || 0);
    // saplar
    for (const s of S.bitki.saplar) {
      const pts = s.filter((_, i) => i % 3 === 0);
      const kalan = pts.filter(([x, y]) => icinde(x, y, 6));
      kalan.forEach(([x, y], i) => y_(x, y, i === kalan.length - 1 ? 0.2 : 0.07, 'altin'));
      hat(kalan, 'altin', { soluk: true });
    }
    // yan dallardaki yapraklar (ilk 36) ve öndeki yaprakların bir kısmı
    S.bitki.yapraklar.forEach((yp, i) => {
      if (i >= 36 && i % 3 !== 0) return;
      const L = yp.uzunluk * (i >= 36 ? 0.8 : 1);
      const ca = Math.cos(yp.aci);
      const sa = Math.sin(yp.aci);
      const Wd = L * yp.genislik * 0.5;
      const p = (u, v) => [yp.x + u * ca - v * sa, yp.y + u * sa + v * ca];
      const noktalar = [p(0, 0), p(L * 0.45, -Wd), p(L, 0), p(L * 0.45, Wd)];
      if (!noktalar.every(([x, y]) => icinde(x, y, 4))) return;
      const [a, b, c, d] = noktalar;
      y_(c[0], c[1], 0.07, 'altin');
      hat([a, b, c, d, a], 'altin', { soluk: true, ince: true });
    });
    // tomurcuklar
    for (const t of S.bitki.tomurcuklar) {
      if (!icinde(t.x, t.y, 8)) continue;
      y_(t.x + Math.cos(t.aci) * t.r * 1.2, t.y + Math.sin(t.aci) * t.r * 1.2, 0.16, 'altin');
    }
    // çiçekler: beş taç yaprak ucu + merkez; harita çemberine sığacak biçimde öndekiler biraz içeri alınır
    const yeniYer = {
      4: { x: 252, y: 862, r: 44 },
      5: { x: 778, y: 858, r: 40 },
      6: { x: 386, y: 922, r: 40 },
      7: { x: 678, y: 914, r: 38 },
      8: { x: 532, y: 918, r: 54 },
    };
    S.bitki.cicekler.forEach((c0, i) => {
      const on = i - 4; // ilk dördü yan dallarda
      const c = Object.assign({}, c0, on >= 0 && yeniYer[on] ? yeniYer[on] : {});
      if (on === 3) Object.assign(c, { x: 706, y: 836, r: 27 }); // sağ öndeki küçük çiçek komşularından ayrılsın
      if (on === 0) Object.assign(c, { x: 320, y: 816, r: 28 }); // sol öndeki küçük çiçek
      const m = y_(c.x, c.y, 0.3 + c.r / 140, 'altin');
      for (let k = 0; k < 5; k++) {
        const a = c.aci + (k * Math.PI * 2) / 5;
        const uc = y_(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 0.14 + c.r / 300, 'altin');
        const y1 = [c.x + Math.cos(a - 0.5) * c.r * 0.62, c.y + Math.sin(a - 0.5) * c.r * 0.62];
        const y2 = [c.x + Math.cos(a + 0.5) * c.r * 0.62, c.y + Math.sin(a + 0.5) * c.r * 0.62];
        if (c.r > 30) {
          y_(y1[0], y1[1], 0.05, 'altin');
          y_(y2[0], y2[1], 0.05, 'altin');
        }
        hat([m, y1, uc, y2, m], 'altin');
      }
    });

    // yer çizgisi (ufuk): kesik altın çizgi
    ctx.save();
    ctx.clip(harita);
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(216,180,90,0.45)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, 800);
    ctx.lineTo(266, 800);
    ctx.moveTo(820, 800);
    ctx.lineTo(W, 800);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // çizgiler
    ctx.save();
    ctx.clip(harita);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const c of cizgiler) {
      const sicak = c.tur === 'altin';
      const a = c.soluk ? 0.36 : c.parlak ? 0.85 : 0.62;
      ctx.strokeStyle = sicak ? `rgba(226,190,104,${a})` : CAMGOBEGI + a + ')';
      ctx.lineWidth = c.ince ? 0.6 : c.soluk ? 0.7 : 0.95;
      ctx.setLineDash(c.kesik ? [2, 4] : []);
      ctx.beginPath();
      c.noktalar.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // yıldızlar (küçükten büyüğe)
    const liste = [...yildizlar.values()].sort((p, q) => p.k - q.k);
    for (const s of liste) yildiz(s.x, s.y, s.k, s.tur);
    ctx.restore();

    // ---------------------------------------------------------------- harita çerçevesi: çift çember, derece çentikleri
    ctx.save();
    ctx.strokeStyle = ALTIN;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(MX, MY, RI, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(MX, MY, RD, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(MX, MY, RI + 4, 0, Math.PI * 2);
    ctx.stroke();
    for (let d = 0; d < 360; d++) {
      const a = d * D - Math.PI / 2;
      const uz = d % 10 === 0 ? 9 : d % 5 === 0 ? 6 : 3;
      if (d % 30 === 0) continue;
      ctx.lineWidth = d % 10 === 0 ? 0.9 : 0.6;
      ctx.beginPath();
      ctx.moveTo(MX + Math.cos(a) * RD, MY + Math.sin(a) * RD);
      ctx.lineTo(MX + Math.cos(a) * (RD - uz), MY + Math.sin(a) * (RD - uz));
      ctx.stroke();
    }
    ctx.fillStyle = ALTIN;
    ctx.font = '9px "DejaVu Sans"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let d = 0; d < 360; d += 30) {
      const a = d * D - Math.PI / 2;
      const r = (RI + RD) / 2 + 1;
      ctx.save();
      ctx.translate(MX + Math.cos(a) * r, MY + Math.sin(a) * r);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillText(d + '°', 0, 0);
      ctx.restore();
    }
    // köşeler: ince altın çerçeve
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = 'rgba(216,180,90,0.7)';
    ctx.strokeRect(9, 9, W - 18, W - 18);
    ctx.strokeRect(13, 13, W - 26, W - 26);
    // köşelerde küçük dört kollu pusula yıldızları
    for (const [cx, cy] of [[52, 52], [W - 52, 52], [52, W - 52], [W - 52, W - 52]]) {
      ctx.fillStyle = 'rgba(216,180,90,0.75)';
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4 - Math.PI / 2;
        const r = k % 2 ? 3 : 13;
        ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    S.hazir();
  })();
</script>
