<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-117 El Boyaması Duvar Kâğıdı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #e6efee; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-117 El Boyaması Duvar Kâğıdı — ipek kâğıt üzerine guaj ve suluboyayla elle boyanmış dekoratif
// duvar kâğıdı (chinoiserie üslubu). İki yanda tırmanan çiçekli dallar, ince fırça kontürleri, soluk
// pastel zemin ve ipeğin hafif parıltısı. Mimari de aynı narin, süslemeci elle çizilir. Kuş ya da hayvan yok.
// Yöntem: 2048 iç çözünürlük; dallar değişken genişlikli fırça şeritleri, yapraklar ve taç yaprakları
// renk geçişli guaj dolguları + ince kontür ve damar çizgileri; en sonda ipek dokusu (atkı/çözgü
// iplikleri, düğümlü iplik) ve çapraz parıltı piksel düzeyinde eklenir.
(function () {
  const S = SAHNE;
  const K = 2;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const rnd = S.rng(117);
  const P = (d) => new Path2D(d);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const Y = S.yollar();

  function hash(ix, iy, s) {
    let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o, s) {
    let t = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 31); n += a; a *= 0.5; f *= 2.03; }
    return t / n;
  }

  // ------------------------------------------------------------ guaj lekeleri dokusu (yumuşak benekli)
  function lekeDokusu(tohum) {
    const n = 512;
    const c = S.yeniTuval(n, n);
    const x = c.getContext('2d');
    const im = x.createImageData(n, n);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      // döşenebilir: dört köşe karışımı
      const f = (a, b) => fbm(a / 64, b / 64, 4, tohum);
      const u = i / n, v = j / n;
      const val = f(i, j) * (1 - u) * (1 - v) + f(i - n, j) * u * (1 - v) + f(i, j - n) * (1 - u) * v + f(i - n, j - n) * u * v;
      const g = clamp(128 + (val - 0.5) * 300, 0, 255);
      const k = (j * n + i) * 4;
      im.data[k] = g; im.data[k + 1] = g; im.data[k + 2] = g; im.data[k + 3] = 255;
    }
    x.putImageData(im, 0, 0);
    return c;
  }
  const leke = ctx.createPattern(lekeDokusu(5), 'repeat');
  // bir yolun içine benekli guaj tonlaması (soft-light)
  function benek(yol, guc) {
    ctx.save();
    ctx.clip(yol);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = guc;
    ctx.fillStyle = leke;
    ctx.fill(yol);
    ctx.restore();
  }
  // kenarda biriken boya: yolun içine doğru bulanık koyu kenar
  function kenarBirikimi(yol, renk, gen, alfa) {
    ctx.save();
    ctx.clip(yol);
    ctx.filter = `blur(${gen * 0.6}px)`;
    ctx.strokeStyle = renk; ctx.globalAlpha = alfa; ctx.lineWidth = gen;
    ctx.stroke(yol);
    ctx.restore();
  }
  // ince fırça kontürü: hafif kalınlık değişimi için iki geçiş
  function kontur(yol, renk, w, alfa) {
    ctx.save();
    ctx.strokeStyle = renk;
    ctx.globalAlpha = alfa == null ? 0.8 : alfa;
    ctx.lineWidth = w;
    ctx.stroke(yol);
    ctx.globalAlpha *= 0.35;
    ctx.lineWidth = w * 1.9;
    ctx.setLineDash([18 + rnd() * 20, 10 + rnd() * 16]);
    ctx.lineDashOffset = rnd() * 40;
    ctx.stroke(yol);
    ctx.restore();
  }

  // Catmull-Rom → yoğun nokta dizisi
  function egri(noktalar, adim) {
    const out = [];
    const p = [noktalar[0], ...noktalar, noktalar[noktalar.length - 1]];
    for (let i = 1; i < p.length - 2; i++) {
      const [p0, p1, p2, p3] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
      const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const n = Math.max(2, Math.round(L / (adim || 3)));
      for (let k = 0; k < n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    out.push(noktalar[noktalar.length - 1]);
    return out;
  }
  // değişken genişlikli fırça şeridi: [sol kenar, sağ kenar] ve kapalı yol
  function serit(pts, w0, w1, dalga) {
    const sol = [], sag = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const t = i / (n - 1);
      let w = w0 + (w1 - w0) * Math.pow(t, 0.8);
      w *= 1 + (dalga || 0) * (vnoise(i * 0.08, w0, 9) - 0.5);
      sol.push([pts[i][0] - ty * w / 2, pts[i][1] + tx * w / 2]);
      sag.push([pts[i][0] + ty * w / 2, pts[i][1] - tx * w / 2]);
    }
    const yol = new Path2D();
    yol.moveTo(sol[0][0], sol[0][1]);
    for (const q of sol) yol.lineTo(q[0], q[1]);
    for (let i = sag.length - 1; i >= 0; i--) yol.lineTo(sag[i][0], sag[i][1]);
    yol.closePath();
    return { sol, sag, yol };
  }
  const cizgiYolu = (pts) => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); return p; };

  // ------------------------------------------------------------ renkler
  const R = {
    zeminUst: '#D3E6EC', zeminOrta: '#E4EFEC', zeminAlt: '#F2EEDF',
    bulut: '#FFFFFF', bulutCizgi: '#A9C1C9',
    gunes: '#F8E3B0', gunesKenar: '#D9B76A',
    kubbeAcik: '#A6D7AE', kubbe: '#76B98A', kubbeKoyu: '#4F946A', kaburga: '#3F7A57',
    kasnak: '#7FBF95', kasnakKoyu: '#5E9E77', pencere: '#4A8572',
    tas: '#F7F2E7', tasGolge: '#D9D6C8', tasCizgi: '#7C8576', pencereTas: '#9DB2AA',
    altin: '#CFAE5E', altinAcik: '#F2DE9C', altinKoyu: '#9C7C35',
    gul: '#E8A3AE', gulAcik: '#F8DCE0', gulKoyu: '#C97A8A',
    yaprak: '#8DB38E', yaprakKoyu: '#5F8F78', yaprakAcik: '#C3DCB8', damar: '#4F7A64',
    dal: '#9A8873', dalKoyu: '#6A5B4A', dalAcik: '#C9BBA6', yosun: '#9CB98C',
    toprak: '#D4E1C3', toprakKoyu: '#B5CBA6', kaya: '#BCCDD0', kayaKoyu: '#8EA6AE',
    ercik: '#E3B54A', kontur: '#6F7A68',
  };

  // ------------------------------------------------------------ 1. zemin: soluk pastel boya
  {
    const g = ctx.createLinearGradient(0, 0, 0, 1024);
    g.addColorStop(0, R.zeminUst); g.addColorStop(0.55, R.zeminOrta); g.addColorStop(1, R.zeminAlt);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
    // güneş tarafında sıcak ışık
    const gl = ctx.createRadialGradient(880, 140, 20, 880, 140, 520);
    gl.addColorStop(0, 'rgba(255,246,222,0.85)'); gl.addColorStop(0.4, 'rgba(255,244,222,0.35)'); gl.addColorStop(1, 'rgba(255,244,222,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, 1024, 1024);
    // geniş fırçayla sürülmüş zemin: çok hafif yatay boya kuşakları
    ctx.save();
    ctx.globalAlpha = 0.05;
    for (let k = 0; k < 70; k++) {
      const y = rnd() * 1024, h = 20 + rnd() * 60;
      ctx.fillStyle = rnd() < 0.5 ? '#ffffff' : '#b9cfcf';
      ctx.filter = 'blur(10px)';
      ctx.fillRect(-50, y, 1124, h);
    }
    ctx.restore();
    const tum = new Path2D(); tum.rect(0, 0, 1024, 1024);
    benek(tum, 0.25);
  }

  // ------------------------------------------------------------ 2. güneş ve süslemeci bulutlar
  {
    const gx = S.gunes.x, gy = S.gunes.y;
    const g = ctx.createRadialGradient(gx - 10, gy - 10, 4, gx, gy, 46);
    g.addColorStop(0, '#FFF6DA'); g.addColorStop(0.7, R.gunes); g.addColorStop(1, '#F1D18E');
    const d = new Path2D(); d.arc(gx, gy, 44, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill(d);
    kontur(d, R.gunesKenar, 1.3, 0.7);
    // ince altın ışın çizgileri
    ctx.save();
    ctx.strokeStyle = R.gunesKenar; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.45;
    for (let k = 0; k < 36; k++) {
      const a = (k / 36) * Math.PI * 2;
      const r1 = 54, r2 = k % 2 ? 72 : 86;
      ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1); ctx.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2); ctx.stroke();
    }
    ctx.restore();
  }
  function bulut(bx, by, s, tohum) {
    // ince, uzun, kat kat bulut şeritleri: beyaz guaj, altta soluk mavi gölge, üstte kıvrık ince kontür
    const r = S.rng(tohum);
    const parca = [];
    for (let k = 0; k < 6; k++) {
      parca.push({ x: bx + (k - 2.5) * 34 * s + (r() - 0.5) * 16 * s, y: by + (r() - 0.5) * 10 * s - Math.sin(k / 5 * Math.PI) * 10 * s, rx: (46 + r() * 30) * s, ry: (11 + r() * 6) * s });
    }
    const yol = new Path2D();
    for (const q of parca) { yol.moveTo(q.x + q.rx, q.y); yol.ellipse(q.x, q.y, q.rx, q.ry, 0, 0, Math.PI * 2); }
    ctx.save();
    ctx.globalAlpha = 0.95;
    const g = ctx.createLinearGradient(0, by - 30 * s, 0, by + 20 * s);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.55, '#FBFDFD'); g.addColorStop(1, '#C9DDE4');
    ctx.fillStyle = g; ctx.fill(yol, 'nonzero');
    ctx.restore();
    kenarBirikimi(yol, '#B9D0D8', 6, 0.45);
    // üst kenarda kıvrık ince çizgiler
    ctx.save(); ctx.strokeStyle = R.bulutCizgi; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.75;
    for (const q of parca) {
      ctx.beginPath(); ctx.ellipse(q.x, q.y, q.rx, q.ry, 0, Math.PI * 1.08, Math.PI * 1.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(q.x - q.rx * 0.55, q.y - q.ry * 0.2, q.ry * 0.55, Math.PI * 0.9, Math.PI * 1.9); ctx.stroke();
    }
    ctx.restore();
  }
  bulut(500, 150, 1.0, 1);
  bulut(740, 335, 0.9, 2);
  bulut(330, 250, 0.6, 3);
  bulut(980, 500, 0.5, 4);

  // ------------------------------------------------------------ 3. yer: yumuşak tümsek, ince otlar
  const yerYolu = new Path2D();
  {
    yerYolu.moveTo(0, 1024); yerYolu.lineTo(0, 790);
    for (let x = 0; x <= 1024; x += 16) yerYolu.lineTo(x, 792 + Math.sin(x * 0.012) * 6 + Math.sin(x * 0.031) * 3);
    yerYolu.lineTo(1024, 1024); yerYolu.closePath();
    const g = ctx.createLinearGradient(0, 790, 0, 1024);
    g.addColorStop(0, R.toprak); g.addColorStop(1, '#C6D8B3');
    ctx.fillStyle = g; ctx.fill(yerYolu);
    benek(yerYolu, 0.35);
    // uzakta ince yatay fırça çizgileri
    ctx.save();
    ctx.strokeStyle = R.toprakKoyu; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.6;
    for (let k = 0; k < 40; k++) {
      const x = rnd() * 1024, y = 800 + rnd() * 40, L = 20 + rnd() * 50;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + L / 2, y - 2, x + L, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ 4. minare (narin, fildişi)
  function altinBoya(d, x1, x2) {
    const g = ctx.createLinearGradient(x1, 0, x2, 0);
    g.addColorStop(0, R.altinKoyu); g.addColorStop(0.5, R.altin); g.addColorStop(0.8, R.altinAcik); g.addColorStop(1, R.altin);
    ctx.fillStyle = g; ctx.fill(P(d));
    kontur(P(d), R.altinKoyu, 0.8, 0.8);
  }
  function alemCiz(a) {
    const ys = [
      S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
      S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true),
      ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)),
      S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R),
    ];
    ys.forEach((d, i) => {
      let r = a.yaka.rx;
      if (i >= 2 && i <= 4) r = a.kureler[i - 2].r; else if (i === 5) r = a.hilal.R;
      altinBoya(d, a.yaka.cx - r, a.yaka.cx + r);
    });
  }
  {
    const c = S.minare.cx;
    for (const p of S.minareParcalari()) {
      if (p.tip === 'alem') { alemCiz(p.alem); continue; }
      let d, x1, x2;
      if (p.tip === 'poligon') { d = S.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
      else if (p.tip === 'topuz') { d = p.yol; x1 = c - 34; x2 = c + 34; }
      else { d = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true); x1 = p.x1; x2 = p.x2; }
      if (p.tip === 'bant') {
        // zikzak bant: gül ve altın ince şeritler
        S.zikzakCizgileri().forEach((z, k) => {
          ctx.save(); ctx.strokeStyle = k === 1 ? R.altin : R.gulKoyu; ctx.lineWidth = 2.4; ctx.globalAlpha = 0.85; ctx.lineJoin = 'miter';
          ctx.stroke(P(S.yol(z))); ctx.restore();
        });
        continue;
      }
      const g = ctx.createLinearGradient(x1, 0, x2, 0);
      g.addColorStop(0, R.tasGolge); g.addColorStop(0.45, R.tas); g.addColorStop(0.8, '#FFFDF6'); g.addColorStop(1, R.tas);
      ctx.fillStyle = g; ctx.fill(P(d));
      if (p.tip === 'korkuluk') {
        // narin korkuluk: ince kemerli parmaklık
        ctx.save(); ctx.strokeStyle = R.tasCizgi; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.75;
        const adet = 11;
        for (let k = 0; k < adet; k++) {
          const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (k + 0.5)) / adet;
          ctx.stroke(P(S.kemerYolu(x, p.y1 + 4, 5, p.y2 - p.y1 - 6)));
        }
        ctx.restore();
      }
      kontur(P(d), R.tasCizgi, 1.0, 0.75);
    }
    for (const w of S.minarePencereleri) {
      const d = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
      g.addColorStop(0, '#7E978F'); g.addColorStop(1, R.pencereTas);
      ctx.fillStyle = g; ctx.fill(d);
      kontur(d, R.tasCizgi, 0.9, 0.8);
    }
    // gövdenin gölge tarafında ince tarama
    ctx.save();
    ctx.strokeStyle = R.tasCizgi; ctx.lineWidth = 0.6; ctx.globalAlpha = 0.35;
    for (const [y1, y2, hw] of [[488, 800, 34], [316, 436, 27], [206, 272, 19]]) {
      for (let y = y1 + 4; y < y2; y += 5) { ctx.beginPath(); ctx.moveTo(c - hw + 1.5, y); ctx.lineTo(c - hw + 7, y - 2); ctx.stroke(); }
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ 5. kaide
  {
    const Kd = S.kaide;
    const d = P(Y.kaide);
    const g = ctx.createLinearGradient(Kd.x1, 0, Kd.x2, 0);
    g.addColorStop(0, R.tasGolge); g.addColorStop(0.35, R.tas); g.addColorStop(1, '#FFFCF4');
    ctx.fillStyle = g; ctx.fill(d);
    benek(d, 0.25);
    kontur(d, R.tasCizgi, 1.1, 0.75);
    const k = P(Y.kornis);
    ctx.fillStyle = '#FFFCF4'; ctx.fill(k);
    kontur(k, R.tasCizgi, 1.0, 0.75);
    // kornişin altında ince gül rengi şerit ve küçük altın benekler
    ctx.save();
    ctx.fillStyle = 'rgba(214,150,160,0.55)'; ctx.fillRect(Kd.x1, Kd.y1 + 2, Kd.x2 - Kd.x1, 2.4);
    ctx.fillStyle = R.altin;
    for (let x = Kd.x1 + 12; x < Kd.x2 - 6; x += 18) { ctx.beginPath(); ctx.arc(x, Kd.y1 + 10, 1.3, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    for (const w of Kd.pencereler) {
      const dd = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      const gg = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
      gg.addColorStop(0, '#7B958C'); gg.addColorStop(1, R.pencereTas);
      ctx.fillStyle = gg; ctx.fill(dd);
      kontur(dd, R.tasCizgi, 1.0, 0.8);
      // kemer çevresinde ince ikinci çizgi
      ctx.save(); ctx.globalAlpha = 0.45; ctx.strokeStyle = R.tasCizgi; ctx.lineWidth = 0.7;
      ctx.stroke(P(S.kemerYolu(w.x, w.y - 5, w.w + 10, w.h + 5))); ctx.restore();
    }
  }

  // ------------------------------------------------------------ 6. kasnak
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    const d = P(kat ? Y.kasnakAlt : Y.kasnakUst);
    const g = ctx.createLinearGradient(q.x1, 0, q.x2, 0);
    g.addColorStop(0, R.kasnakKoyu); g.addColorStop(0.5, R.kasnak); g.addColorStop(0.8, '#9BCFA6'); g.addColorStop(1, R.kasnak);
    ctx.fillStyle = g; ctx.fill(d);
    benek(d, 0.3);
    kenarBirikimi(d, R.kasnakKoyu, 5, 0.35);
    for (const w of S.kasnakPencereleri(kat)) {
      const dd = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      ctx.fillStyle = R.pencere; ctx.globalAlpha = 0.85; ctx.fill(dd); ctx.globalAlpha = 1;
      kontur(dd, '#2F5F4F', 0.7, 0.7);
    }
    kontur(d, R.kaburga, 1.0, 0.7);
    // üst kenarda ince altın silme
    ctx.save(); ctx.strokeStyle = R.altin; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(q.x1 + 2, q.y1 + 2); ctx.lineTo(q.x2 - 2, q.y1 + 2); ctx.stroke(); ctx.restore();
  }

  // ------------------------------------------------------------ 7. kubbe: yeşim yeşili, ince kaburgalar
  {
    const d = P(S.kubbeYolu);
    const g = ctx.createRadialGradient(650, 380, 10, 590, 430, 300);
    g.addColorStop(0, '#C8E8C8'); g.addColorStop(0.3, R.kubbeAcik); g.addColorStop(0.7, R.kubbe); g.addColorStop(1, R.kubbeKoyu);
    ctx.fillStyle = g; ctx.fill(d);
    benek(d, 0.35);
    kenarBirikimi(d, R.kubbeKoyu, 10, 0.35);
    ctx.save();
    ctx.clip(d);
    for (const k of S.kaburgalar(16)) {
      const pts = k.noktalar;
      ctx.strokeStyle = R.kaburga; ctx.lineWidth = 1.0; ctx.globalAlpha = 0.6;
      ctx.stroke(cizgiYolu(pts));
      // ışık tarafında ince beyaz guaj çizgi
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.25 + 0.35 * Math.max(0, k.u);
      ctx.stroke(cizgiYolu(pts.map(([x, y]) => [x + 2.2, y])));
    }
    ctx.restore();
    // tabanda narin altın dilim süsü (küçük kemercikler)
    ctx.save();
    ctx.strokeStyle = R.altin; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.85;
    for (let k = 0; k < 32; k++) {
      const p0 = -Math.PI / 2 + (k / 32) * Math.PI, p1 = -Math.PI / 2 + ((k + 1) / 32) * Math.PI;
      const x0 = 560 + Math.sin(p0) * 199, x1 = 560 + Math.sin(p1) * 199;
      ctx.beginPath(); ctx.moveTo(x0, 553); ctx.quadraticCurveTo((x0 + x1) / 2, 541, x1, 553); ctx.stroke();
    }
    ctx.restore();
    kontur(d, R.kaburga, 1.2, 0.75);
    alemCiz(S.alemParcalari(560, 300, 1));
  }

  // ------------------------------------------------------------ 8. bitki ressamı: yaprak, gül, erik çiçeği, tomurcuk
  function yaprak(x, y, L, aci, ton) {
    const W = L * 0.36;
    const ca = Math.cos(aci), sa = Math.sin(aci);
    const p = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
    const yol = new Path2D();
    const a = p(0, 0), b = p(L, 0);
    yol.moveTo(a[0], a[1]);
    let q1 = p(L * 0.3, -W * 0.95), q2 = p(L * 0.78, -W * 0.55);
    yol.bezierCurveTo(q1[0], q1[1], q2[0], q2[1], b[0], b[1]);
    q1 = p(L * 0.78, W * 0.5); q2 = p(L * 0.3, W * 0.9);
    yol.bezierCurveTo(q1[0], q1[1], q2[0], q2[1], a[0], a[1]);
    const g = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
    const koyu = ton ? '#6E9C8A' : R.yaprakKoyu, orta = ton ? '#9CC0A2' : R.yaprak;
    g.addColorStop(0, koyu); g.addColorStop(0.55, orta); g.addColorStop(1, R.yaprakAcik);
    ctx.fillStyle = g; ctx.fill(yol);
    // yaprağın bir yarısı biraz daha koyu (ışık sağ üstten)
    ctx.save(); ctx.clip(yol);
    ctx.translate(x, y); ctx.rotate(aci);
    ctx.fillStyle = 'rgba(60,100,80,0.16)';
    ctx.fillRect(0, (Math.sin(aci) > 0 ? -1 : 0) * W, L, W);
    ctx.restore();
    // damarlar
    ctx.save();
    ctx.strokeStyle = R.damar; ctx.globalAlpha = 0.55; ctx.lineWidth = 0.8;
    const m0 = p(L * 0.04, 0), m1 = p(L * 0.95, 0);
    ctx.beginPath(); ctx.moveTo(m0[0], m0[1]); ctx.quadraticCurveTo(...p(L * 0.5, W * 0.06), m1[0], m1[1]); ctx.stroke();
    ctx.lineWidth = 0.55; ctx.globalAlpha = 0.38;
    for (let k = 1; k <= 4; k++) {
      const u = L * (0.14 + k * 0.17);
      for (const s of [-1, 1]) {
        const s0 = p(u, 0), s1 = p(u + L * 0.14, s * W * 0.5);
        ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
      }
    }
    ctx.restore();
    kontur(yol, '#4E7462', 0.75, 0.7);
  }
  // şakayık: yuvarlak, hafif dalgalı taç yapraklar, dörtte üç görünüş (çanak)
  function sakayik(cx, cy, Rr, rot, beyaz, egik) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(egik || 0);
    ctx.scale(1, 0.86);
    const halkalar = [
      { n: 7, r0: 0.16, r1: 1.0, gen: 1.0, dy: 0, renk0: beyaz ? '#EFC9D0' : R.gul, renk1: beyaz ? '#FFFFFF' : R.gulAcik },
      { n: 6, r0: 0.1, r1: 0.76, gen: 1.05, dy: -0.08, renk0: beyaz ? '#E8B7C1' : R.gulKoyu, renk1: beyaz ? '#FFFDFB' : '#FBE6E9' },
      { n: 5, r0: 0.04, r1: 0.5, gen: 1.15, dy: -0.15, renk0: beyaz ? '#DFA2AF' : '#C26F80', renk1: beyaz ? '#FDF2F4' : R.gulAcik },
    ];
    halkalar.forEach((h, hi) => {
      const oy = Rr * h.dy;
      for (let k = 0; k < h.n; k++) {
        const a = rot + hi * 0.45 + (k / h.n) * Math.PI * 2 + (rnd() - 0.5) * 0.18;
        const yar = (Math.PI / h.n) * h.gen;
        const r1 = Rr * h.r1 * (0.9 + rnd() * 0.14);
        const bx = Math.cos(a) * Rr * h.r0, by = oy + Math.sin(a) * Rr * h.r0;
        const yol = new Path2D();
        yol.moveTo(bx, by);
        const adim = 18;
        let ilk = null, son = null;
        const ust = [];
        for (let i = 0; i <= adim; i++) {
          const t = i / adim, u = t * 2 - 1;
          const th = a + u * yar;
          const rr = r1 * (0.8 + 0.2 * Math.cos(u * Math.PI / 2)) * (1 + 0.028 * Math.sin(u * Math.PI * 2.5 + k * 1.7));
          ust.push([Math.cos(th) * rr, oy + Math.sin(th) * rr]);
        }
        ilk = ust[0]; son = ust[ust.length - 1];
        yol.quadraticCurveTo(Math.cos(a - yar * 0.9) * r1 * 0.45, oy + Math.sin(a - yar * 0.9) * r1 * 0.45, ilk[0], ilk[1]);
        for (const q of ust) yol.lineTo(q[0], q[1]);
        yol.quadraticCurveTo(Math.cos(a + yar * 0.9) * r1 * 0.45, oy + Math.sin(a + yar * 0.9) * r1 * 0.45, bx, by);
        yol.closePath();
        const g = ctx.createRadialGradient(0, oy, Rr * 0.04, 0, oy, r1);
        g.addColorStop(0, h.renk0); g.addColorStop(0.62, h.renk1); g.addColorStop(1, h.renk1);
        ctx.fillStyle = g; ctx.fill(yol);
        // ince taç yaprak çizgileri
        ctx.save(); ctx.clip(yol);
        ctx.strokeStyle = beyaz ? '#D8A9B3' : '#B66C7E'; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.22;
        for (let sI = -2; sI <= 2; sI++) {
          const th = a + sI * yar * 0.3;
          ctx.beginPath(); ctx.moveTo(Math.cos(th) * r1 * 0.22, oy + Math.sin(th) * r1 * 0.22);
          ctx.quadraticCurveTo(Math.cos(th + 0.05) * r1 * 0.5, oy + Math.sin(th + 0.05) * r1 * 0.5, Math.cos(th) * r1 * 0.74, oy + Math.sin(th) * r1 * 0.74); ctx.stroke();
        }
        ctx.restore();
        kontur(yol, beyaz ? '#C9A0A8' : '#A86677', 0.6, 0.5);
        // kenarda beyaz guaj vurgu
        ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.globalAlpha = 0.65; ctx.lineWidth = 1.0;
        ctx.beginPath();
        for (let i = 4; i <= 14; i++) { const q = ust[i]; const f = 0.94; if (i === 4) ctx.moveTo(q[0] * f, oy + (q[1] - oy) * f); else ctx.lineTo(q[0] * f, oy + (q[1] - oy) * f); }
        ctx.stroke(); ctx.restore();
      }
    });
    // ortada ercik kümesi
    const oy = -Rr * 0.17;
    ctx.fillStyle = '#C9D27A'; ctx.beginPath(); ctx.arc(0, oy, Rr * 0.09, 0, Math.PI * 2); ctx.fill();
    for (let k = 0; k < 18; k++) {
      const a = rnd() * Math.PI * 2, r = Rr * (0.08 + rnd() * 0.12);
      ctx.fillStyle = k % 3 ? R.ercik : '#C98F2E';
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, oy + Math.sin(a) * r, Math.max(0.8, Rr * 0.028), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function erik(cx, cy, r, rot) {
    for (let k = 0; k < 5; k++) {
      const a = rot + (k / 5) * Math.PI * 2;
      const px = cx + Math.cos(a) * r * 0.55, py = cy + Math.sin(a) * r * 0.55;
      const yol = new Path2D();
      yol.ellipse(px, py, r * 0.52, r * 0.46, a, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.05);
      g.addColorStop(0, '#F1C3CB'); g.addColorStop(0.55, '#FFFFFF'); g.addColorStop(1, '#FFFFFF');
      ctx.fillStyle = g; ctx.fill(yol);
      kontur(yol, '#C9A3AA', 0.6, 0.6);
    }
    ctx.save(); ctx.strokeStyle = '#C49A3A'; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.8;
    for (let k = 0; k < 9; k++) {
      const a = rot + (k / 9) * Math.PI * 2, L = r * (0.38 + 0.12 * ((k * 7) % 3) / 2);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L); ctx.stroke();
      ctx.fillStyle = R.ercik; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * L, cy + Math.sin(a) * L, Math.max(0.7, r * 0.06), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#B8C46A'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.13, 0, Math.PI * 2); ctx.fill();
  }
  function tomurcuk(x, y, r, aci, pembe) {
    const t = { x, y, r, aci };
    const d = P(S.tomurcukYolu(t));
    const g = ctx.createLinearGradient(x - Math.cos(aci) * r, y - Math.sin(aci) * r, x + Math.cos(aci) * r * 1.6, y + Math.sin(aci) * r * 1.6);
    g.addColorStop(0, pembe ? R.gulKoyu : '#E9C9CF'); g.addColorStop(1, pembe ? R.gulAcik : '#FFFFFF');
    ctx.fillStyle = g; ctx.fill(d);
    kontur(d, '#A86677', 0.6, 0.6);
    // çanak yapraklar
    ctx.save(); ctx.fillStyle = R.yaprakKoyu; ctx.globalAlpha = 0.9;
    for (const s of [-1, 1]) {
      const yol = new Path2D();
      const bx = x - Math.cos(aci) * r * 0.9, by = y - Math.sin(aci) * r * 0.9;
      yol.moveTo(bx, by);
      yol.quadraticCurveTo(bx + Math.cos(aci + s * 0.9) * r * 1.0, by + Math.sin(aci + s * 0.9) * r * 1.0, x + Math.cos(aci + s * 0.25) * r * 0.5, y + Math.sin(aci + s * 0.25) * r * 0.5);
      yol.closePath(); ctx.fill(yol);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------ 9. dal ressamı
  function dal(noktalar, w0, w1) {
    const pts = egri(noktalar, 3);
    const s = serit(pts, w0, w1, 0.35);
    const g = ctx.createLinearGradient(pts[0][0] - 30, pts[0][1], pts[0][0] + 30, pts[0][1] - 30);
    g.addColorStop(0, R.dalKoyu); g.addColorStop(0.5, R.dal); g.addColorStop(1, R.dalAcik);
    ctx.fillStyle = R.dal; ctx.fill(s.yol);
    // ışık tarafı (sağ üst) açık, öbür taraf koyu: kenarlara yumuşak şerit
    ctx.save(); ctx.clip(s.yol);
    const isikSol = (() => { const a = pts[0], b = pts[Math.min(pts.length - 1, 4)]; const nx = -(b[1] - a[1]), ny = b[0] - a[0]; return nx * 0.7 - ny * 0.7 > 0; })();
    ctx.filter = `blur(${Math.max(0.6, w0 * 0.12)}px)`;
    ctx.strokeStyle = R.dalKoyu; ctx.globalAlpha = 0.55; ctx.lineWidth = Math.max(1.2, w0 * 0.35);
    ctx.stroke(cizgiYolu(isikSol ? s.sag : s.sol));
    ctx.strokeStyle = R.dalAcik; ctx.globalAlpha = 0.7; ctx.lineWidth = Math.max(0.8, w0 * 0.22);
    ctx.stroke(cizgiYolu(isikSol ? s.sol : s.sag));
    ctx.filter = 'none';
    // kabuk: kısa kuru fırça çizgileri
    ctx.strokeStyle = R.dalKoyu; ctx.lineWidth = 0.6; ctx.globalAlpha = 0.45;
    for (let i = 2; i < pts.length - 2; i += 2) {
      if (rnd() > 0.45) continue;
      const t = i / (pts.length - 1), w = w0 + (w1 - w0) * t;
      if (w < 3) continue;
      const [x, y] = pts[i], [x2, y2] = pts[i + 2];
      const off = (rnd() - 0.5) * w * 0.6;
      const tx = x2 - x, ty = y2 - y, tl = Math.hypot(tx, ty) || 1;
      ctx.beginPath(); ctx.moveTo(x - ty / tl * off, y + tx / tl * off); ctx.lineTo(x2 - ty / tl * off + tx * 1.5, y2 + tx / tl * off + ty * 1.5); ctx.stroke();
    }
    ctx.restore();
    // ince kontür, yer yer kesik
    ctx.save(); ctx.strokeStyle = R.dalKoyu; ctx.lineWidth = 0.85; ctx.globalAlpha = 0.8;
    ctx.setLineDash([40 + rnd() * 60, 4 + rnd() * 8]);
    ctx.stroke(cizgiYolu(s.sol)); ctx.stroke(cizgiYolu(s.sag));
    ctx.restore();
    // yosun benekleri
    if (w0 > 6) {
      ctx.save();
      for (let i = 4; i < pts.length; i += 7) {
        if (rnd() > 0.5) continue;
        const t = i / (pts.length - 1), w = w0 + (w1 - w0) * t;
        const [x, y] = pts[i];
        for (let k = 0; k < 4; k++) {
          ctx.fillStyle = k % 2 ? R.yosun : '#6F9A72';
          ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.ellipse(x + (rnd() - 0.5) * w * 0.8, y + (rnd() - 0.5) * w * 0.8, 1.6, 1.0, rnd() * 3, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }
    return pts;
  }

  // ------------------------------------------------------------ 10. iki yanda tırmanan çiçekli dallar
  // gövde ve ana sürgünler elle yerleştirilir; ince dalcıklar bunlardan tohumlu rastgelelikle çıkar
  const solGovde = [[78, 1040], [52, 920], [86, 790], [138, 672], [118, 548], [78, 440], [90, 318], [136, 214], [186, 132], [232, 78]];
  const sagGovde = [[956, 1040], [982, 900], [936, 770], [884, 660], [906, 540], [952, 432], [936, 330], [890, 262], [846, 228]];
  const surgunler = [
    { n: [[138, 672], [182, 640], [222, 592], [246, 548]], w: [8, 1.6], sol: true },
    { n: [[118, 548], [70, 500], [40, 440], [30, 380]], w: [7, 1.5], sol: true },
    { n: [[90, 318], [140, 300], [190, 262], [236, 248]], w: [6.5, 1.5], sol: true },
    { n: [[186, 132], [150, 92], [122, 56], [108, 24]], w: [4.5, 1.2], sol: true },
    { n: [[52, 920], [110, 880], [170, 868], [214, 878]], w: [7, 1.6], sol: true },
    { n: [[86, 790], [40, 740], [22, 680], [26, 620]], w: [7, 1.5], sol: true },
    { n: [[884, 660], [842, 626], [806, 590], [794, 560]], w: [7.5, 1.6], sol: false },
    { n: [[906, 540], [956, 500], [988, 452], [1000, 404]], w: [7, 1.5], sol: false },
    { n: [[936, 330], [886, 316], [842, 306], [800, 286]], w: [6, 1.4], sol: false },
    { n: [[936, 330], [972, 270], [992, 210], [1002, 160]], w: [5.5, 1.3], sol: false },
    { n: [[982, 900], [920, 868], [870, 862], [834, 874]], w: [7, 1.6], sol: false },
    { n: [[936, 770], [986, 720], [1004, 660], [998, 600]], w: [6.5, 1.5], sol: false },
  ];
  const dalciklar = [];
  function dalcikCikar(noktalar, w0, w1, adet, Lt, sol) {
    const pts = egri(noktalar, 3);
    for (let k = 0; k < adet; k++) {
      const t = 0.18 + (0.8 * (k + 0.3 + rnd() * 0.5)) / adet;
      const i = Math.min(pts.length - 2, Math.floor(t * (pts.length - 1)));
      const [x, y] = pts[i], [x2, y2] = pts[i + 1];
      const ta = Math.atan2(y2 - y, x2 - x);
      let aci = ta + (k % 2 ? 1 : -1) * (0.55 + rnd() * 0.5);
      // yukarı doğru eğilim
      aci = aci * 0.8 + (-Math.PI / 2) * 0.2;
      let L = Lt * (0.6 + rnd() * 0.6) * (1 - t * 0.35);
      // mimariye taşmasın
      const sinir = (ex, ey) => (sol ? ex < 252 || ey < 160 : ex > 792 || ey < 200) && ex > 6 && ex < 1018 && ey > 8;
      let ex = x + Math.cos(aci) * L, ey = y + Math.sin(aci) * L;
      let deneme = 0;
      while (!sinir(ex, ey) && deneme < 6) { L *= 0.7; aci += sol ? -0.3 : 0.3; ex = x + Math.cos(aci) * L; ey = y + Math.sin(aci) * L; deneme++; }
      if (!sinir(ex, ey)) continue;
      const bk = (rnd() - 0.5) * L * 0.35;
      const mx = (x + ex) / 2 - Math.sin(aci) * bk, my = (y + ey) / 2 + Math.cos(aci) * bk;
      const w = w0 + (w1 - w0) * t;
      dalciklar.push({ n: [[x, y], [mx, my], [ex, ey]], w: Math.max(1.4, w * 0.45), aci, L, sol });
    }
  }
  for (const sg of surgunler) dalcikCikar(sg.n, sg.w[0], sg.w[1], 4, 46, sg.sol);
  dalcikCikar(solGovde.slice(2), 22, 4, 12, 62, true);
  dalcikCikar(sagGovde.slice(2), 22, 4, 11, 62, false);
  // çizim sırası: dalcıklar, sürgünler, gövde; sonra yapraklar; sonra çiçekler
  for (const dc of dalciklar) dal(dc.n, dc.w, 0.9);
  for (const sg of surgunler) dal(sg.n, sg.w[0], sg.w[1]);
  dal(solGovde, 30, 3.5);
  dal(sagGovde, 28, 3.2);
  // yapraklar
  function dalYapraklari(noktalar, adet, L0, bas) {
    const pts = egri(noktalar, 3);
    for (let k = 0; k < adet; k++) {
      const t = (bas == null ? 0.25 : bas) + (k / adet) * (1 - (bas == null ? 0.25 : bas));
      const i = Math.min(pts.length - 2, Math.floor(t * (pts.length - 1)));
      const [x, y] = pts[i], [x2, y2] = pts[i + 1];
      const ta = Math.atan2(y2 - y, x2 - x);
      const sI = k % 2 ? 1 : -1;
      yaprak(x, y, L0 * (0.75 + rnd() * 0.45), ta + sI * (0.6 + rnd() * 0.5), k % 3 === 0);
    }
  }
  for (const sg of surgunler) dalYapraklari(sg.n, 4, 32);
  dalYapraklari(solGovde.slice(3), 7, 36);
  dalYapraklari(sagGovde.slice(3), 6, 36);
  for (const dc of dalciklar) dalYapraklari(dc.n, 3, 26, 0.3);
  // çiçekler: sürgün uçlarında şakayık, dalcık uçlarında erik çiçeği kümeleri ve tomurcuklar
  const sakayiklar = [];
  surgunler.forEach((sg, k) => {
    const [x, y] = sg.n[sg.n.length - 1];
    const [px, py] = sg.n[sg.n.length - 2];
    const a = Math.atan2(y - py, x - px);
    if (k === 3 || k === 9) { tomurcuk(x, y, 6.5, a, true); erik(px, py, 10, rnd() * 6); return; }
    const Rr = 22 + rnd() * 12;
    sakayiklar.push([x - Math.cos(a) * Rr * 0.3, y - Math.sin(a) * Rr * 0.3, Rr, rnd() * 6, k % 3 !== 1, (rnd() - 0.5) * 0.8]);
  });
  dalciklar.forEach((dc, k) => {
    const [x, y] = dc.n[2];
    if (k % 3 === 0) tomurcuk(x, y, 5 + rnd() * 2, dc.aci, k % 2 === 0);
    else {
      erik(x, y, 9 + rnd() * 4, rnd() * 6);
      if (k % 2) { const [mx, my] = dc.n[1]; erik(mx + (rnd() - 0.5) * 10, my + (rnd() - 0.5) * 10, 7 + rnd() * 3, rnd() * 6); }
    }
  });
  // gövde üzerinde iri şakayıklar
  sakayiklar.push([96, 404, 30, 0.5, true, 0.2], [934, 404, 28, 1.2, false, -0.3], [176, 168, 22, 0.9, false, 0.4]);
  for (const [x, y, Rr, rot, b, eg] of sakayiklar) sakayik(x, y, Rr, rot, b, eg);

  // ------------------------------------------------------------ 11. ön bahçe: kat kat yumuşak tümsekler, süs kayaları, ot öbekleri, küçük çiçekler
  function otObegi(x, y, s) {
    ctx.save(); ctx.lineWidth = 0.8; ctx.globalAlpha = 0.85;
    const n = 5 + Math.floor(rnd() * 5);
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (k / (n - 1) - 0.5) * 1.5 + (rnd() - 0.5) * 0.2;
      const L = s * (0.6 + rnd() * 0.6) * (1 - Math.abs(k / (n - 1) - 0.5) * 0.7);
      ctx.strokeStyle = k % 2 ? '#7FA787' : '#5F8F78';
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + Math.cos(a) * L * 0.5, y + Math.sin(a) * L * 0.6, x + Math.cos(a + (a + Math.PI / 2) * 0.35) * L, y + Math.sin(a) * L);
      ctx.stroke();
    }
    ctx.restore();
  }
  function kucukCicek(x, y, r, renk) {
    ctx.save();
    ctx.strokeStyle = '#7FA787'; ctx.lineWidth = 0.7; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.moveTo(x, y + r * 4); ctx.quadraticCurveTo(x + r, y + r * 2, x, y); ctx.stroke();
    ctx.globalAlpha = 0.95;
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2 + x;
      ctx.fillStyle = renk;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.55, r * 0.38, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = R.ercik; ctx.beginPath(); ctx.arc(x, y, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function kaya(cx, cy, w, h, tohum) {
    const r = S.rng(tohum);
    const pts = [];
    const n = 14;
    for (let k = 0; k < n; k++) {
      const a = Math.PI + (k / (n - 1)) * Math.PI; // üst yarı
      const rr = 1 + (r() - 0.5) * 0.22;
      pts.push([cx + Math.cos(a) * w * rr, cy + Math.sin(a) * h * rr * (0.85 + 0.3 * Math.sin(k * 1.3))]);
    }
    const yol = new Path2D();
    yol.moveTo(cx - w, cy + h * 0.18);
    for (const q of pts) yol.lineTo(q[0], q[1]);
    yol.lineTo(cx + w, cy + h * 0.18);
    yol.quadraticCurveTo(cx, cy + h * 0.32, cx - w, cy + h * 0.18);
    yol.closePath();
    const g = ctx.createLinearGradient(cx + w * 0.6, cy - h, cx - w * 0.6, cy + h * 0.2);
    g.addColorStop(0, '#E4ECEC'); g.addColorStop(0.45, R.kaya); g.addColorStop(1, R.kayaKoyu);
    ctx.fillStyle = g; ctx.fill(yol);
    benek(yol, 0.3);
    kenarBirikimi(yol, '#7E97A0', 4, 0.35);
    // kıvrık kaya kırışıkları (ince fırça) ve oyuklar
    ctx.save(); ctx.clip(yol); ctx.strokeStyle = '#6F8790'; ctx.lineWidth = 0.7; ctx.globalAlpha = 0.6;
    for (let k = 0; k < 4; k++) {
      const x0 = cx - w * 0.7 + r() * w * 1.2, y0 = cy - h * (0.2 + r() * 0.6);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 + w * 0.2, y0 - h * 0.25, x0 + w * (0.25 + r() * 0.2), y0 + h * 0.15); ctx.stroke();
    }
    for (let k = 0; k < 2; k++) {
      const ox = cx + (r() - 0.5) * w * 0.9, oy = cy - h * (0.25 + r() * 0.35), orx = w * (0.08 + r() * 0.06);
      ctx.fillStyle = 'rgba(110,135,146,0.45)'; ctx.beginPath(); ctx.ellipse(ox, oy, orx, orx * 0.7, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#FFFFFF'; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.ellipse(ox + 0.6, oy - 0.6, orx, orx * 0.7, 0.3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.globalAlpha = 0.6;
    }
    ctx.restore();
    kontur(yol, '#6A7F86', 0.8, 0.75);
    // ışık yanında beyaz guaj
    ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.1;
    ctx.beginPath(); for (let k = 8; k < n - 1; k++) { const q = pts[k]; const xx = cx + (q[0] - cx) * 0.9, yy = cy + (q[1] - cy) * 0.88; k === 8 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); } ctx.stroke();
    ctx.restore();
    // dipte yosun benekleri ve ot
    for (let k = 0; k < 7; k++) { ctx.fillStyle = k % 2 ? R.yosun : '#6F9A72'; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.ellipse(cx - w + r() * 2 * w, cy + h * 0.12 + r() * 4, 1.7, 1.0, r() * 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    otObegi(cx - w * 0.85, cy + h * 0.2, 14); otObegi(cx + w * 0.9, cy + h * 0.2, 12);
  }
  {
    // tümsekler: arkadan öne üç sıra, her biri bir öncekini örter
    const siralar = [
      { yb: 818, h: [10, 18], w: [120, 190], ust: '#DCE8CC', alt: '#CBDDB9' },
      { yb: 872, h: [12, 22], w: [140, 220], ust: '#D3E3C0', alt: '#C2D7AE' },
      { yb: 940, h: [14, 26], w: [160, 240], ust: '#CCDFB8', alt: '#B9D1A4' },
    ];
    siralar.forEach((sr, si) => {
      let x = -60 - rnd() * 80;
      while (x < 1084) {
        const w = sr.w[0] + rnd() * (sr.w[1] - sr.w[0]), h = sr.h[0] + rnd() * (sr.h[1] - sr.h[0]);
        const cx = x + w, tepe = sr.yb - h;
        const yol = new Path2D();
        yol.moveTo(cx - w * 1.15, sr.yb + 12);
        yol.bezierCurveTo(cx - w * 0.6, sr.yb + 4, cx - w * 0.45, tepe, cx, tepe);
        yol.bezierCurveTo(cx + w * 0.45, tepe, cx + w * 0.6, sr.yb + 4, cx + w * 1.15, sr.yb + 12);
        yol.lineTo(cx + w * 1.15, 1030); yol.lineTo(cx - w * 1.15, 1030); yol.closePath();
        const g = ctx.createLinearGradient(0, tepe, 0, tepe + 70);
        g.addColorStop(0, sr.ust); g.addColorStop(1, sr.alt);
        ctx.fillStyle = g; ctx.fill(yol);
        benek(yol, 0.28);
        // sırt çizgisi: ince kontür ve altında hafif boya birikimi
        const sirt = new Path2D();
        sirt.moveTo(cx - w * 1.15, sr.yb + 12);
        sirt.bezierCurveTo(cx - w * 0.6, sr.yb + 4, cx - w * 0.45, tepe, cx, tepe);
        sirt.bezierCurveTo(cx + w * 0.45, tepe, cx + w * 0.6, sr.yb + 4, cx + w * 1.15, sr.yb + 12);
        ctx.save(); ctx.clip(yol); ctx.filter = 'blur(3px)'; ctx.strokeStyle = '#9DBE94'; ctx.globalAlpha = 0.35; ctx.lineWidth = 6; ctx.stroke(sirt); ctx.restore();
        kontur(sirt, '#86A98A', 0.8, 0.6);
        // sırtta ot öbekleri
        for (let k = 0; k < 3; k++) {
          const t = 0.2 + rnd() * 0.6, ox = cx - w + t * 2 * w;
          const u = (ox - cx) / w, oy = tepe + (sr.yb + 8 - tepe) * Math.min(1, u * u) + 2;
          otObegi(ox, oy, 10 + rnd() * 8);
        }
        x += w * (1.4 + rnd() * 0.5);
      }
      // her sıranın önüne birkaç küçük çiçek
      for (let k = 0; k < 9; k++) {
        const x2 = 20 + rnd() * 984, y2 = sr.yb + 18 + rnd() * 30;
        kucukCicek(x2, y2, 3 + rnd() * 1.8, k % 3 === 0 ? '#B9C6EA' : k % 3 === 1 ? '#FFFFFF' : '#E9C3D4');
      }
      if (si === 0) { kaya(412, 826, 26, 22, 31); kaya(598, 822, 30, 24, 32); }
      if (si === 1) { kaya(330, 888, 22, 18, 33); kaya(700, 884, 20, 16, 34); }
      if (si === 2) { kaya(612, 1002, 30, 24, 35); kaya(290, 1010, 24, 20, 36); }
    });
  }

  // ------------------------------------------------------------ 12. önde çiçekli çalılar
  {
    const B = S.bitki;
    // ince otlar
    ctx.save(); ctx.strokeStyle = '#7FA787'; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.7;
    for (let k = 0; k < 220; k++) {
      const x = rnd() * 1024, y = 812 + rnd() * 212, L = 14 + rnd() * 30, e = (rnd() - 0.5) * 16;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + e * 0.3, y - L * 0.6, x + e, y - L); ctx.stroke();
    }
    ctx.restore();
    // çalı sapları: her yaprak ve çiçeğe aşağıdan ince sap
    const onYapraklar = B.yapraklar.filter((y) => y.y > 820);
    const onCicekler = B.cicekler.filter((c) => c.y > 820);
    ctx.save(); ctx.strokeStyle = '#6F9677'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.85;
    const kokler = [120, 300, 460, 610, 760, 920];
    const sapCiz = (x, y) => {
      const kx = kokler.reduce((a, b) => (Math.abs(b - x) < Math.abs(a - x) ? b : a));
      ctx.beginPath(); ctx.moveTo(kx, 1040); ctx.bezierCurveTo(kx, 980, x + (kx - x) * 0.3, y + 50, x, y); ctx.stroke();
    };
    for (const y of onYapraklar) sapCiz(y.x, y.y);
    ctx.lineWidth = 2;
    for (const c of onCicekler) sapCiz(c.x, c.y);
    ctx.restore();
    for (const y of onYapraklar) yaprak(y.x, y.y, y.uzunluk * 0.95, y.aci, (y.x * 7) % 3 < 1);
    for (const t of B.tomurcuklar.filter((t) => t.y > 790)) tomurcuk(t.x, t.y, t.r * 0.9, t.aci, true);
    for (const c of onCicekler) {
      if (c.r > 40) sakayik(c.x, c.y, c.r * 1.0, c.aci, true, (c.x - 512) / 2400);
      else if (c.r > 28) sakayik(c.x, c.y, c.r * 0.95, c.aci, (c.x | 0) % 2 === 0, 0);
      else erik(c.x, c.y, c.r * 0.85, c.aci);
    }
  }

  // ------------------------------------------------------------ 13. ipek: atkı/çözgü iplikleri ve parıltı
  {
    const W = tuval.width, Hh = tuval.height;
    const im = ctx.getImageData(0, 0, W, Hh);
    const d = im.data;
    // atkı ipliklerinin parlaklığı (satır başına, yavaş değişen düğümlerle)
    for (let y = 0; y < Hh; y++) {
      const satir = y / 2.6;
      const iplik = Math.floor(satir);
      const faz = satir - iplik;
      const profil = Math.sin(faz * Math.PI); // ipliğin yuvarlak kesiti
      const iplikTon = (hash(iplik, 0, 77) - 0.5) * 0.03;
      for (let x = 0; x < W; x++) {
        const j = (y * W + x) * 4;
        const dugum = Math.max(0, vnoise(x * 0.012, iplik * 0.7, 78) - 0.82) * 0.25; // düğümlü iplik
        const cozgu = Math.sin(x / 2.2 * Math.PI) * 0.008;
        const xs = x / K, ys = y / K;
        // ipeğin çapraz parıltısı
        const bant = (xs * 0.62 + ys * 0.78);
        let parilti = 0.1 * Math.exp(-Math.pow((bant - 520) / 240, 2)) + 0.05 * Math.exp(-Math.pow((bant - 1120) / 150, 2)) - 0.02 * Math.exp(-Math.pow((bant - 820) / 120, 2));
        // ipek parıltısı iplik iplik kırılır: her atkı ipliği ışığı biraz farklı yansıtır (yatay ışıltı çizgileri)
        const isilti = 0.55 + 0.9 * hash(iplik, Math.floor(x / 90 + hash(iplik, 1, 79) * 3), 80);
        parilti *= isilti * (0.75 + 0.5 * profil);
        const f = 1 + iplikTon + (profil - 0.64) * 0.07 + dugum * 0.6 + cozgu;
        // parıltı ipekte hafif sıcak (altınsı) ton verir
        d[j] = clamp(d[j] * f + 255 * parilti, 0, 255);
        d[j + 1] = clamp(d[j + 1] * f + 250 * parilti, 0, 255);
        d[j + 2] = clamp(d[j + 2] * f + 236 * parilti, 0, 255);
      }
    }
    ctx.putImageData(im, 0, 0);
  }

  S.hazir();
})();
