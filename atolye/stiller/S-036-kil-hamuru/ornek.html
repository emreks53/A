<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-036 Kil Hamuru — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #cfe9f2; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-036 Kil Hamuru (Clay Render) — hamur/plastilin stop-motion görünümü.
// Her öğe ayrı bir "kil parçası" katmanıdır: maske → (hafif el titremesi) → uzaklık dönüşümü ile
// yuvarlatılmış, şişkin yükseklik → kil ayrıntısı (parmak izi, alet izi, topakçık, düzensizlik)
// → normal → yumuşak stüdyo ışığı (sarmalayan anahtar ışık, serin dolgu, gök/yer ortam ışığı,
// mat parlaklık) → temas gölgesi ile birleştirme. Arka fon ayrı çizilip alan derinliği için bulanıklaştırılır.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const zaman = () => {};
  const K = 2; // iç ölçek (2048 px iç çözünürlük)
  const N = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);
  const rnd = S.rng(36);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3601);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  // ------------------------------------------------------------------ ışık (ekran: x sağ, y aşağı, z izleyiciye)
  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }
  const L1 = nrm([0.66, -0.62, 0.45]); // anahtar: sağ üst, önden
  const L2 = nrm([-0.75, -0.1, 0.65]); // dolgu: sol
  const HV = nrm([L1[0], L1[1], L1[2] + 1]);
  const ANAHTAR = [1.0, 0.95, 0.88];
  const DOLGU = [0.62, 0.74, 0.95];
  const GOK = [0.78, 0.88, 1.0];
  const YER = [0.95, 0.82, 0.7];

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  // ------------------------------------------------------------------ kil katmanı
  const MAT = {
    kil: { ks: 0.1, g: 14, wrap: 0.15 },
    altin: { ks: 0.22, g: 26, wrap: 0.25 },
    fon: { ks: 0.03, g: 8, wrap: 0.45 },
  };
  function katman(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = o.pay != null ? o.pay : 8;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const md = mg.getImageData(0, 0, w, h).data;
    let A = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) A[i] = md[i * 4 + 3] / 255;
    // el titremesi: maske düşük frekanslı gürültüyle hafifçe kaydırılarak yeniden örneklenir
    const A0 = A;
    const dal = (o.dalga != null ? o.dalga : 0.7) * K;
    if (dal > 0) {
      const B = new Float32Array(w * h);
      const sx = rnd() * 100, sy = rnd() * 100;
      const fr = 1 / (14 * K);
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const gx = (X0 + x) * fr, gy = (Y0 + y) * fr;
          const px = x + dal * gurultu(gx + sx, gy), py = y + dal * gurultu(gx, gy + sy);
          const cx = Math.max(0, Math.min(w - 1.001, px)), cy = Math.max(0, Math.min(h - 1.001, py));
          const ix = Math.floor(cx), iy = Math.floor(cy);
          const fx = cx - ix, fy = cy - iy, i = iy * w + ix;
          B[y * w + x] = (A[i] * (1 - fx) + A[i + 1] * fx) * (1 - fy) + (A[i + w] * (1 - fx) + A[i + w + 1] * fx) * fy;
        }
      A = B;
    }
    const ic = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) ic[i] = A[i] > 0.5 ? 1 : 0;
    const D = edt(ic, w, h);

    // oyuklar (pencere, yuva): maske içinde basılmış çukurlar
    let AH = null, DH = null;
    if (o.oyuk) {
      const oc = tuvalYap(w, h);
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.setTransform(K, 0, 0, K, -X0, -Y0);
      og.fillStyle = '#fff';
      og.strokeStyle = '#fff';
      o.oyuk(og);
      const od = og.getImageData(0, 0, w, h).data;
      AH = new Float32Array(w * h);
      const ih = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        AH[i] = od[i * 4 + 3] / 255;
        ih[i] = AH[i] > 0.5 ? 1 : 0;
      }
      DH = edt(ih, w, h);
    }

    // dönel parçalar için satır satır yarıçap
    let RL = null, RR = null;
    if (o.tip === 'donel') {
      RL = new Float32Array(h);
      RR = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < w; x++)
          if (A0[y * w + x] > 0.5) {
            if (l < 0) l = x;
            r = x;
          }
        RL[y] = l;
        RR[y] = r;
      }
      const L2 = new Float32Array(h), R2 = new Float32Array(h);
      const yr = 3 * K;
      for (let y = 0; y < h; y++) {
        let sl = 0, sr = 0, n = 0;
        for (let k = -yr; k <= yr; k++) {
          const yy = y + k;
          if (yy < 0 || yy >= h || RL[yy] < 0) continue;
          sl += RL[yy];
          sr += RR[yy];
          n++;
        }
        L2[y] = n ? sl / n : RL[y];
        R2[y] = n ? sr / n : RR[y];
      }
      RL = L2;
      RR = R2;
    }

    // kil ayrıntısı: parmak izleri, alet izleri, topakçıklar (iç noktalardan seçilir)
    const kil = o.kil || {};
    function icNokta() {
      for (let t = 0; t < 60; t++) {
        const x = Math.floor(rnd() * w), y = Math.floor(rnd() * h);
        if (D[y * w + x] > 4 * K) return [(X0 + x) / K, (Y0 + y) / K];
      }
      return null;
    }
    const izler = [];
    for (let i = 0; i < (kil.parmak || 0); i++) {
      const p = icNokta();
      if (p) izler.push({ x: p[0], y: p[1], a: rnd() * Math.PI, R: (kil.parmakR || 13) * (0.8 + rnd() * 0.4), lam: 2.1 + rnd() * 0.4, amp: (kil.parmakA || 0.13) * (0.8 + rnd() * 0.4), s: rnd() * 50 });
    }
    const aletler = (o.cizikler || []).slice();
    for (let i = 0; i < (kil.alet || 0); i++) {
      const p = icNokta();
      if (!p) continue;
      const a = (kil.aletAci != null ? kil.aletAci : rnd() * Math.PI) + (rnd() - 0.5) * 0.6;
      const L = (kil.aletL || 18) * (0.6 + rnd() * 0.8);
      aletler.push({ x1: p[0], y1: p[1], x2: p[0] + Math.cos(a) * L, y2: p[1] + Math.sin(a) * L, w: (kil.aletW || 1) * (0.7 + rnd() * 0.8), d: (kil.aletD || 1) * (0.45 + rnd() * 0.4) });
    }
    const topaklar = (o.cukurlar || []).slice();
    const topakSay = Math.round((kil.topak || 0) * (w * h) / (K * K) / 1000);
    for (let i = 0; i < topakSay; i++) {
      const p = icNokta();
      if (p) topaklar.push({ x: p[0], y: p[1], r: 1.2 + rnd() * 2.2, d: -(0.25 + rnd() * 0.35) });
    }
    const puruz = kil.puruz != null ? kil.puruz : 0.45;
    const ince = kil.ince != null ? kil.ince : 0.3;
    const nS = rnd() * 200;
    const bevel = o.bevel || 6;
    const yuk = o.yuk != null ? o.yuk : 1;
    const zs = o.zs != null ? o.zs : 1;
    const H = new Float32Array(w * h);
    const KAV = new Float32Array(w * h); // ek boşluk gölgesi (0..1)
    const sabitRenk = typeof o.renk === 'string' ? hex(o.renk) : null;
    const SS = new Float32Array(w * h);
    const UU = RL ? new Float32Array(w * h) : null;
    const RW = RL ? new Float32Array(h) : null;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const d = Math.max(0, D[i] / K - 0.5 + A[i] * 0.5);
        const t = Math.min(1, d / bevel);
        const s = Math.sqrt(1 - (1 - t) * (1 - t));
        SS[i] = s;
        if (RL) {
          const l = RL[y], r = RR[y];
          const rr = (r - l + 1) / 2;
          const c = (l + r) / 2;
          const u = rr > 0 ? (x - c) / rr : 0;
          UU[i] = u;
          RW[y] = rr / K;
          H[i] = (Math.sqrt(Math.max(0, 1 - u * u)) * rr / K) * zs * s;
        } else H[i] = bevel * yuk * s;
        if (AH && AH[i] > 0.002) {
          const dh = DH[i] / K;
          const th = Math.min(1, dh / (o.oyukDuvar || 2.2));
          H[i] -= (o.oyukDerin || 6) * Math.sqrt(1 - (1 - th) * (1 - th)) * AH[i];
        }
      }
    }
    yumusat(H, w, h, K);
    for (let y = 0; y < h; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const s = SS[i];
        let hh = H[i];
        const u = UU ? UU[i] : 0, rr = RW ? RW[y] : 0;
        // pürüz: düşük frekanslı topaklı yüzey
        if (puruz > 0) hh += s * puruz * (fbm(ux / 20 + nS, uy / 20, 3) + ince * gurultu(ux / 4.5, uy / 4.5 + nS));
        let kav = 0;
        for (let k = 0; k < izler.length; k++) {
          const p = izler[k];
          const dx = ux - p.x, dy = uy - p.y;
          if (dx * dx + dy * dy > p.R * p.R * 2.2) continue;
          const ca = Math.cos(p.a), sa = Math.sin(p.a);
          const a1 = dx * ca + dy * sa, b1 = (-dx * sa + dy * ca) * 1.35;
          const q = Math.sqrt(a1 * a1 + b1 * b1);
          if (q >= p.R) continue;
          const ff = 1 - (q / p.R) * (q / p.R);
          const wv = gurultu(ux * 0.18 + p.s, uy * 0.18) * 1.3;
          hh += p.amp * ff * ff * Math.sin(((q + wv) * Math.PI * 2) / p.lam) * s;
        }
        for (let k = 0; k < aletler.length; k++) {
          const g = aletler[k];
          const vx = g.x2 - g.x1, vy = g.y2 - g.y1;
          const L2 = vx * vx + vy * vy || 1;
          let tt = ((ux - g.x1) * vx + (uy - g.y1) * vy) / L2;
          const tc = Math.max(0, Math.min(1, tt));
          const ex = ux - (g.x1 + vx * tc), ey = uy - (g.y1 + vy * tc);
          const dd = Math.sqrt(ex * ex + ey * ey);
          if (dd > g.w * 4) continue;
          const uc = tt < 0 ? Math.exp(-(tt * tt) * 400) : tt > 1 ? Math.exp(-((tt - 1) * (tt - 1)) * 400) : 1;
          const oluk = Math.exp(-(dd * dd) / (g.w * g.w)) * uc;
          const dudak = Math.exp(-((dd - g.w * 1.7) * (dd - g.w * 1.7)) / (g.w * g.w * 0.5)) * uc;
          hh += (-g.d * oluk + g.d * 0.3 * dudak) * s;
          kav += oluk * 0.3 * Math.min(1, (g.d * 1.6) / g.w);
        }
        for (let k = 0; k < topaklar.length; k++) {
          const g = topaklar[k];
          const dx = ux - g.x, dy = uy - g.y;
          const q = dx * dx + dy * dy;
          if (q > g.r * g.r * 6) continue;
          const e = Math.exp(-q / (g.r * g.r));
          hh -= g.d * e * s;
          if (g.d > 0) kav += e * 0.45;
        }
        if (o.ek) {
          const e = o.ek(ux, uy, u, rr, s);
          hh += e[0];
          kav += e[1];
        }
        H[i] = hh;
        KAV[i] = kav;
      }
    }
    // gölgeleme
    const img = new ImageData(w, h);
    const P = img.data;
    const mat = o.mat || MAT.kil;
    const wrap = mat.wrap;
    const oyukRenk = o.oyukRenk ? hex(o.oyukRenk) : null;
    const rv = o.renkOyna != null ? o.renkOyna : 0.06;
    for (let y = 1; y < h - 1; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const gx = (H[i + 1] - H[i - 1]) * K * 0.5;
        const gy = (H[i + w] - H[i - w]) * K * 0.5;
        let nx = -gx, ny = -gy, nz = 1;
        const nl = Math.sqrt(nx * nx + ny * ny + 1);
        nx /= nl; ny /= nl; nz /= nl;
        let base = sabitRenk || o.renk(ux, uy);
        if (oyukRenk && AH && AH[i] > 0.002) {
          const t = Math.min(1, AH[i] * Math.min(1, DH[i] / K / 1.2 + 0.3));
          base = [base[0] + (oyukRenk[0] - base[0]) * t, base[1] + (oyukRenk[1] - base[1]) * t, base[2] + (oyukRenk[2] - base[2]) * t];
        }
        const v = 1 + rv * gurultu(ux / 38 + nS, uy / 38 - nS);
        const kd = nx * L1[0] + ny * L1[1] + nz * L1[2];
        const diff = Math.max(0, (kd + wrap) / (1 + wrap));
        const kf = Math.max(0, nx * L2[0] + ny * L2[1] + nz * L2[2]);
        const gk = 0.5 - 0.5 * ny;
        let ao = 1 - Math.min(0.75, KAV[i]);
        if (AH && AH[i] > 0.002) ao *= 1 - 0.55 * AH[i] * Math.max(0, 1 - DH[i] / K / 5);
        const nh = Math.max(0, nx * HV[0] + ny * HV[1] + nz * HV[2]);
        const sp = mat.ks * Math.pow(nh, mat.g) + mat.ks * 0.5 * Math.pow(nh, mat.g * 4);
        // ışığın gerisinde kalan bölgede kilin doygunluğu artar (yüzey altı saçılma izlenimi)
        const sss = (1 - diff) * diff * 0.9;
        const out = [0, 0, 0];
        for (let c = 0; c < 3; c++) {
          const bc = base[c] * v;
          const isik = ANAHTAR[c] * diff * 1.32 + DOLGU[c] * kf * 0.15 + (GOK[c] * gk + YER[c] * (1 - gk)) * 0.24 * ao;
          out[c] = bc * isik * (0.82 + 0.18 * ao) + Math.pow(bc, 1.6) * sss * 0.5 + sp * ANAHTAR[c] * ao;
        }
        const j = i * 4;
        P[j] = enc(out[0]);
        P[j + 1] = enc(out[1]);
        P[j + 2] = enc(out[2]);
        P[j + 3] = Math.round(Math.min(1, A[i]) * 255);
      }
    }
    const kc = tuvalYap(w, h);
    kc.getContext('2d').putImageData(img, 0, 0);
    const hedef = o.hedef || ana;
    const gl = o.golge === undefined ? { dx: -2.5, dy: 3, blur: 3, alfa: 0.4 } : o.golge;
    if (gl) {
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(kc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#3a2a3a';
      sx.fillRect(0, 0, w, h);
      const bulanik = (br) => {
        const pad = Math.ceil(br * K * 2.5) + 2;
        const bc = tuvalYap(w + 2 * pad, h + 2 * pad);
        const bx = bc.getContext('2d');
        bx.filter = `blur(${br * K}px)`;
        bx.drawImage(sc, pad, pad);
        return [bc, pad];
      };
      hedef.save();
      const [b1, p1] = bulanik(gl.blur);
      hedef.globalAlpha = gl.alfa;
      hedef.drawImage(b1, X0 + gl.dx * K - p1, Y0 + gl.dy * K - p1);
      if (gl.temas !== false) {
        const [b2, p2] = bulanik(1.2);
        hedef.globalAlpha = gl.alfa * 0.6;
        hedef.drawImage(b2, X0 + gl.dx * 0.25 * K - p2, Y0 + gl.dy * 0.35 * K - p2);
      }
      hedef.restore();
    }
    hedef.drawImage(kc, X0, Y0);
  }

  // ------------------------------------------------------------------ biçim yardımcıları
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dolYol = (d) => (g) => g.fill(P2(d));
  function yuvarlakDik(g, x1, y1, x2, y2, r) {
    g.beginPath();
    g.roundRect(x1, y1, x2 - x1, y2 - y1, r);
    g.fill();
  }

  // ================================================================== 1. arka fon (alan derinliği için bulanık)
  const arka = tuvalYap(N, N);
  const ag = arka.getContext('2d');
  katman({
    hedef: ag,
    ciz: (g) => g.fillRect(-60, -60, 1144, 1144),
    renk: (x, y) => {
      const t = Math.min(1, Math.max(0, y / 800));
      const a = hex('#8FCDEB'), b = hex('#C4E7EE'), c = hex('#F7DCCB');
      const m = t < 0.62 ? t / 0.62 : 1;
      const k = t < 0.62 ? 0 : (t - 0.62) / 0.38;
      const r = [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * m);
      return [0, 1, 2].map((i) => r[i] + (c[i] - r[i]) * k * k);
    },
    bevel: 30,
    mat: MAT.fon,
    kil: { puruz: 1.6, ince: 0, parmak: 0, alet: 22, aletL: 70, aletW: 5, aletD: 1.2, topak: 0 },
    dalga: 0,
    golge: null,
    renkOyna: 0.04,
  });
  // güneş: yumuşak ışıltı + kil disk
  ag.save();
  const gp = ag.createRadialGradient(880 * K, 140 * K, 30 * K, 880 * K, 140 * K, 330 * K);
  gp.addColorStop(0, 'rgba(255,246,214,0.85)');
  gp.addColorStop(0.35, 'rgba(255,236,200,0.35)');
  gp.addColorStop(1, 'rgba(255,236,200,0)');
  ag.fillStyle = gp;
  ag.fillRect(0, 0, N, N);
  ag.restore();
  katman({ hedef: ag, ciz: (g) => { g.beginPath(); g.arc(880, 140, 50, 0, 7); g.fill(); }, renk: '#FFE58C', bevel: 22, kil: { parmak: 2, parmakR: 18, topak: 0.6 }, golge: { dx: -5, dy: 6, blur: 10, alfa: 0.25 } });
  // bulutlar: yassı kil topakları
  const bulutlar = [
    [150, 250, 1.0],
    [470, 150, 0.85],
    [760, 330, 1.05],
    [955, 470, 0.7],
    [70, 470, 0.75],
  ];
  for (const [bx, by, bs] of bulutlar) {
    const r = S.rng(Math.round(bx * 7 + by));
    const daireler = [];
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      daireler.push([bx + (t - 0.5) * 170 * bs, by + (r() - 0.6) * 10 * bs - Math.sin(t * Math.PI) * 18 * bs, (18 + Math.sin(t * Math.PI) * 22 + r() * 8) * bs]);
    }
    katman({
      hedef: ag,
      ciz: (g) => {
        for (const [x, y, rr] of daireler) {
          g.beginPath();
          g.arc(x, y, rr, 0, 7);
          g.fill();
        }
        yuvarlakDik(g, bx - 95 * bs, by - 6 * bs, bx + 95 * bs, by + 18 * bs, 12 * bs);
      },
      renk: '#FFFDF8',
      bevel: 16 * bs,
      kil: { parmak: 2, parmakR: 16, alet: 1, topak: 0.4 },
      golge: { dx: -6, dy: 8, blur: 10, alfa: 0.22, renk: '#5a6a90' },
    });
  }
  // uzak tepeler (lavanta ve nane yeşili)
  const tepe = (y0, amp, f, ph) => (g) => {
    g.beginPath();
    g.moveTo(-20, 1040);
    for (let x = -20; x <= 1044; x += 8) g.lineTo(x, y0 - amp * (0.6 * Math.sin(x * f + ph) + 0.4 * Math.sin(x * f * 2.3 + ph * 1.7)));
    g.lineTo(1044, 1040);
    g.closePath();
    g.fill();
  };
  katman({ hedef: ag, ciz: tepe(705, 34, 0.007, 1.3), renk: '#C8B6E6', bevel: 26, kil: { alet: 8, aletL: 40, parmak: 3 }, golge: { dx: -4, dy: 6, blur: 12, alfa: 0.25 } });
  katman({ hedef: ag, ciz: tepe(752, 26, 0.0105, 4.1), renk: '#A6DDBE', bevel: 22, kil: { alet: 8, aletL: 40, parmak: 3 }, golge: { dx: -4, dy: 6, blur: 12, alfa: 0.28 } });
  // bulanık fonu ana tuvale
  ana.save();
  ana.filter = `blur(${5.5 * K}px)`;
  ana.drawImage(arka, 0, 0);
  ana.restore();

  zaman('2.');
  // ================================================================== 2. zemin (kil tabla)
  katman({
    ciz: (g) => {
      g.beginPath();
      g.moveTo(-20, 1050);
      g.lineTo(-20, 790);
      g.bezierCurveTo(300, 784, 700, 786, 1044, 792);
      g.lineTo(1044, 1050);
      g.closePath();
      g.fill();
    },
    renk: (x, y) => {
      const t = Math.min(1, Math.max(0, (y - 790) / 230));
      const a = hex('#F3D7B4'), b = hex('#E7BE93');
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    },
    bevel: 14,
    kil: { alet: 26, aletL: 34, aletAci: 0.05, aletW: 2.6, aletD: 0.7, parmak: 5, parmakR: 16, topak: 0.6, puruz: 0.8 },
    golge: { dx: 0, dy: -3, blur: 8, alfa: 0.3 },
  });

  zaman('3.');
  // ================================================================== 3. minare
  const TAS = '#F6E8D2';
  const TASK = '#E9D3B3';
  const ALTIN = '#F4C24E';
  const parcalar = S.minareParcalari();
  const minPen = S.minarePencereleri;
  const penIcinde = (y1, y2) => minPen.filter((p) => p.y >= y1 && p.y + p.h <= y2);
  function alemKatmanlari(a, olcek, hedef) {
    const gl = { dx: -2 * olcek, dy: 2.5 * olcek, blur: 2.5, alfa: 0.35 };
    katman({ hedef, ciz: (g) => yuvarlakDik(g, a.cubuk.x1 - 0.6, a.cubuk.y1, a.cubuk.x2 + 0.6, a.cubuk.y2, 2), renk: ALTIN, mat: MAT.altin, tip: 'donel', zs: 1, bevel: 2, dalga: 0.3 * olcek, kil: { puruz: 0.1 }, golge: gl });
    katman({ hedef, ciz: (g) => { g.beginPath(); g.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, 7); g.fill(); }, renk: ALTIN, mat: MAT.altin, bevel: 5 * olcek, dalga: 0.4 * olcek, kil: { puruz: 0.15, parmak: olcek > 0.8 ? 1 : 0, parmakR: 8 }, golge: gl });
    for (const k of a.kureler) katman({ hedef, ciz: (g) => { g.beginPath(); g.arc(k.cx, k.cy, k.r, 0, 7); g.fill(); }, renk: ALTIN, mat: MAT.altin, bevel: k.r * 0.95, dalga: 0.35 * olcek, kil: { puruz: 0.12, topak: 1.5 }, golge: gl });
    const hl = a.hilal;
    katman({ hedef, ciz: dolYol(S.hilalYolu(hl.cx, hl.cy, hl.R)), renk: ALTIN, mat: MAT.altin, bevel: 3.2 * olcek, dalga: 0.35 * olcek, kil: { puruz: 0.1 }, golge: gl });
  }
  for (const p of parcalar) {
    if (p.tip === 'alem') {
      alemKatmanlari(p.alem, 0.62);
      continue;
    }
    if (p.tip === 'bant') {
      // zikzak: gövdeye yapıştırılmış ince yuvarlanmış kil şeritler
      for (const z of S.zikzakCizgileri())
        katman({
          ciz: (g) => {
            g.lineWidth = 3.6;
            g.lineJoin = 'round';
            g.lineCap = 'round';
            g.stroke(P2(S.yol(z)));
          },
          renk: '#E6B9A6',
          bevel: 2,
          dalga: 0.5,
          kil: { puruz: 0.12 },
          golge: { dx: -1.4, dy: 1.8, blur: 1.4, alfa: 0.45 },
        });
      continue;
    }
    let d, y1, y2;
    if (p.tip === 'poligon') {
      d = S.yol(p.noktalar, true);
      y1 = Math.min(...p.noktalar.map((q) => q[1]));
      y2 = Math.max(...p.noktalar.map((q) => q[1]));
    } else if (p.tip === 'topuz') {
      d = p.yol;
      y1 = 146;
      y2 = 200;
    } else {
      d = dik(p.x1, p.y1, p.x2, p.y2);
      y1 = p.y1;
      y2 = p.y2;
    }
    const pen = p.ad.startsWith('gövde') ? penIcinde(y1, y2) : [];
    const korkuluk = p.tip === 'korkuluk';
    katman({
      ciz: dolYol(d),
      tip: 'donel',
      zs: 1.0,
      renk: p.ad.startsWith('şerefe') || p.ad === 'bilezik' ? TASK : TAS,
      bevel: korkuluk ? 3 : p.ad.startsWith('gövde') ? 4 : 3.5,
      dalga: 0.6,
      kil: { parmak: p.ad === 'gövde-alt' ? 2 : p.ad.startsWith('gövde') ? 1 : 0, alet: p.ad.startsWith('gövde') ? 2 : 0, aletAci: Math.PI / 2, topak: 0.5, puruz: 0.35 },
      oyuk: pen.length || korkuluk
        ? (g) => {
            for (const q of pen) g.fill(P2(S.kemerYolu(q.x, q.y, q.w, q.h)));
            if (korkuluk) {
              const adet = 8;
              for (let i = 0; i < adet; i++) {
                const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * (i + 0.5)) / adet;
                yuvarlakDik(g, x - 2.6, p.y1 + 4, x + 2.6, p.y2 - 3.5, 2.4);
              }
            }
          }
        : null,
      oyukRenk: korkuluk ? '#8E7A86' : '#86707C',
      oyukDerin: korkuluk ? 4 : 5,
      oyukDuvar: 1.6,
      golge: { dx: -2, dy: 3.2, blur: 2.6, alfa: 0.35 },
    });
  }

  zaman('4.');
  // ================================================================== 4. kaide ve korniş
  const KD = S.kaide;
  // yapının zemine oturduğu yerde yumuşak temas gölgesi
  ana.save();
  ana.filter = `blur(${7 * K}px)`;
  ana.fillStyle = 'rgba(90,55,60,0.45)';
  ana.beginPath();
  ana.ellipse(548 * K, 803 * K, 290 * K, 11 * K, 0, 0, 7);
  ana.fill();
  ana.restore();
  katman({
    ciz: dolYol(dik(KD.x1, KD.y1, KD.x2, KD.y2 + 4)),
    renk: TAS,
    bevel: 20,
    yuk: 0.55,
    kil: { parmak: 4, parmakR: 15, alet: 4, aletL: 30, aletAci: 0.1, aletW: 2.2, aletD: 0.6, topak: 0.5, puruz: 0.5 },
    oyuk: (g) => {
      for (const p of KD.pencereler) g.fill(P2(S.kemerYolu(p.x, p.y, p.w, p.h)));
    },
    oyukRenk: '#8C7480',
    oyukDerin: 7,
    oyukDuvar: 2.6,
    golge: { dx: -5, dy: 3, blur: 5, alfa: 0.35 },
  });
  katman({
    ciz: (g) => yuvarlakDik(g, KD.kornis.x1, KD.kornis.y1 - 1, KD.kornis.x2, KD.kornis.y2 + 1, 5),
    renk: '#FBF2E4',
    bevel: 4,
    dalga: 0.6,
    kil: { alet: 2, aletAci: 0, topak: 0.6, puruz: 0.3 },
    golge: { dx: -1.5, dy: 4, blur: 3.5, alfa: 0.4 },
  });

  // ================================================================== 5. kasnak (iki kat)
  const KUBBE = '#5BBE76';
  const KASNAK = '#4FAF6B';
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    katman({
      ciz: (g) => yuvarlakDik(g, q.x1, q.y1 - (k === 0 ? 4 : 0), q.x2, q.y2 + 2, 4),
      tip: 'donel',
      zs: 0.85,
      renk: KASNAK,
      bevel: 5,
      kil: { parmak: 2, parmakR: 14, alet: 3, aletAci: Math.PI / 2, aletL: 14, topak: 0.6, puruz: 0.4 },
      oyuk: (g) => {
        for (const p of S.kasnakPencereleri(k)) g.fill(P2(S.kemerYolu(p.x, p.y, p.w + 1, p.h)));
      },
      oyukRenk: '#1E5A3A',
      oyukDerin: 6,
      oyukDuvar: 1.8,
      golge: { dx: -4, dy: 4, blur: 4, alfa: 0.4 },
    });
  }

  zaman('6.');
  // ================================================================== 6. kubbe: dilim dilim şişkin kil
  const DILIM = 16;
  const dilimTon = [];
  for (let i = 0; i < DILIM; i++) dilimTon.push(0.96 + rnd() * 0.08);
  const kubbeTaban = hex(KUBBE);
  katman({
    ciz: dolYol('M358,557 C356,430 440,318 560,300 C680,318 764,430 762,557 Z'),
    tip: 'donel',
    zs: 1.0,
    renk: (x, y) => {
      const u = Math.max(-1, Math.min(1, (x - 560) / 200));
      const i = Math.max(0, Math.min(DILIM - 1, Math.floor(((Math.asin(u) + Math.PI / 2) / Math.PI) * DILIM)));
      const t = dilimTon[i];
      return [kubbeTaban[0] * t, kubbeTaban[1] * t, kubbeTaban[2] * t];
    },
    bevel: 4,
    dalga: 0.7,
    kil: { parmak: 5, parmakR: 15, alet: 2, aletL: 22, aletW: 2.4, aletD: 0.5, topak: 0.5, puruz: 0.55 },
    ek: (x, y, u, r, s) => {
      const fi = Math.asin(Math.max(-1, Math.min(1, u)));
      const f = ((fi + Math.PI / 2) / Math.PI) * DILIM;
      const fr = f - Math.floor(f);
      const sk = Math.pow(Math.sin(Math.PI * fr), 0.55);
      const nz = Math.sqrt(Math.max(0, 1 - u * u));
      const yuk = Math.min(1, (555 - y) / 30 + 0.2) * Math.min(1, r / 40);
      const kav = Math.pow(1 - sk, 4) * 0.5 * yuk;
      return [4.6 * sk * nz * yuk * s, kav];
    },
    golge: { dx: -5, dy: 7, blur: 6, alfa: 0.55 },
  });
  alemKatmanlari(S.alemParcalari(560, 300, 1), 1);

  zaman('7.');
  // ================================================================== 7. bitkiler: yuvarlanmış saplar, bastırılmış yaprak ve taç yaprakları
  const B = S.bitki;
  const YAPRAK = ['#86C97C', '#72BC70', '#97D08A'];
  for (const s of B.saplar)
    katman({
      ciz: (g) => {
        g.lineWidth = 6;
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.stroke(P2(S.yol(s)));
      },
      renk: '#79B96B',
      bevel: 3.2,
      dalga: 0.8,
      kil: { puruz: 0.2, topak: 0.6 },
      golge: { dx: -3, dy: 3, blur: 3, alfa: 0.3 },
    });
  function yaprakKatmani(y, i) {
    const [a, b] = S.yaprakDamari(y);
    const cz = [{ x1: a[0] + (b[0] - a[0]) * 0.12, y1: a[1] + (b[1] - a[1]) * 0.12, x2: a[0] + (b[0] - a[0]) * 0.86, y2: a[1] + (b[1] - a[1]) * 0.86, w: 0.9, d: 0.8 }];
    const ux = Math.cos(y.aci), uy = Math.sin(y.aci);
    for (let k = 0; k < 3; k++) {
      const t = 0.3 + k * 0.2;
      const px = y.x + ux * y.uzunluk * t, py = y.y + uy * y.uzunluk * t;
      const L = y.uzunluk * y.genislik * (0.55 - k * 0.08);
      for (const sgn of [-1, 1]) {
        const ax = Math.cos(y.aci + sgn * 0.75), ay = Math.sin(y.aci + sgn * 0.75);
        cz.push({ x1: px, y1: py, x2: px + ax * L, y2: py + ay * L, w: 0.55, d: 0.4 });
      }
    }
    katman({
      ciz: dolYol(S.yaprakYolu(y)),
      renk: YAPRAK[i % 3],
      bevel: Math.min(5, y.uzunluk * 0.09),
      yuk: 0.9,
      dalga: 0.6,
      cizikler: cz,
      kil: { puruz: 0.25, parmak: y.uzunluk > 60 && i % 3 === 0 ? 1 : 0, parmakR: 9, topak: 0.4 },
      golge: { dx: -2.5, dy: 3.2, blur: 3, alfa: 0.38 },
    });
  }
  B.yapraklar.forEach(yaprakKatmani);
  for (const t of B.tomurcuklar) {
    katman({
      ciz: dolYol(S.tomurcukYolu(t)),
      renk: '#F49AB5',
      bevel: t.r * 0.8,
      dalga: 0.4,
      cizikler: [{ x1: t.x - Math.cos(t.aci) * t.r * 0.4, y1: t.y - Math.sin(t.aci) * t.r * 0.4, x2: t.x + Math.cos(t.aci) * t.r * 1.2, y2: t.y + Math.sin(t.aci) * t.r * 1.2, w: 0.6, d: 0.5 }],
      kil: { puruz: 0.12 },
      golge: { dx: -2, dy: 2.5, blur: 2.5, alfa: 0.35 },
    });
    // yeşil çanak
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    katman({
      ciz: (g) => {
        g.beginPath();
        g.ellipse(t.x - ca * t.r * 0.7, t.y - sa * t.r * 0.7, t.r * 0.75, t.r * 0.45, t.aci, 0, 7);
        g.fill();
      },
      renk: '#6FB36A',
      bevel: t.r * 0.35,
      dalga: 0.3,
      kil: { puruz: 0.1 },
      golge: { dx: -1, dy: 1.5, blur: 1.5, alfa: 0.35 },
    });
  }
  const TAC = [
    ['#F7A9BF', '#F28FAE'],
    ['#FFF0E3', '#F9CFD6'],
    ['#FBB79F', '#F59C85'],
    ['#D2B7F0', '#BE9EE8'],
    ['#FAC4D3', '#F4A6BE'],
  ];
  function tacYolu(c, a, L, W) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = (u, v) => [c.x + u * ca - v * sa, c.y + u * sa + v * ca];
    const q = (u, v) => p(u, v).map((n) => n.toFixed(2)).join(',');
    return `M${q(L * 0.08, 0)} C${q(L * 0.25, -W * 0.55)} ${q(L * 0.82, -W * 0.95)} ${q(L * 1.0, -W * 0.22)} C${q(L * 1.04, 0)} ${q(L * 1.04, 0)} ${q(L * 1.0, W * 0.22)} C${q(L * 0.82, W * 0.95)} ${q(L * 0.25, W * 0.55)} ${q(L * 0.08, 0)} Z`;
  }
  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);
  for (const { c, i } of sirali) {
    const [r1, r2] = TAC[i % TAC.length];
    const tc1 = hex(r1), tc2 = hex(r2);
    const L = c.r * 1.08, W = c.r * 0.78;
    for (let k = 0; k < 5; k++) {
      const a = c.aci + (k * Math.PI * 2) / 5;
      const ca = Math.cos(a), sa = Math.sin(a);
      const cz = [{ x1: c.x + ca * L * 0.3, y1: c.y + sa * L * 0.3, x2: c.x + ca * L * 0.78, y2: c.y + sa * L * 0.78, w: Math.max(0.6, c.r * 0.025), d: Math.min(1, c.r * 0.02) }];
      for (const sg2 of [-1, 1]) {
        const b2 = a + sg2 * 0.28;
        cz.push({ x1: c.x + Math.cos(b2) * L * 0.48, y1: c.y + Math.sin(b2) * L * 0.48, x2: c.x + Math.cos(b2 + sg2 * 0.06) * L * 0.7, y2: c.y + Math.sin(b2 + sg2 * 0.06) * L * 0.7, w: Math.max(0.5, c.r * 0.016), d: Math.min(0.45, c.r * 0.009) });
      }
      katman({
        ciz: dolYol(tacYolu(c, a, L, W)),
        renk: (x, y) => {
          const t = Math.min(1, Math.hypot(x - c.x, y - c.y) / L);
          const m = t < 0.4 ? 1 - t / 0.4 : 0;
          return [tc1[0] + (tc2[0] - tc1[0]) * m, tc1[1] + (tc2[1] - tc1[1]) * m, tc1[2] + (tc2[2] - tc1[2]) * m];
        },
        bevel: Math.max(2.2, c.r * 0.16),
        yuk: 0.75,
        dalga: Math.max(0.5, c.r * 0.02),
        cizikler: cz,
        kil: { puruz: 0.22, parmak: c.r > 45 && k % 2 === 0 ? 1 : 0, parmakR: c.r * 0.28, parmakA: 0.1, topak: 0.3 },
        golge: { dx: -1.8, dy: 2.6, blur: Math.max(2, c.r * 0.06), alfa: 0.42 },
      });
    }
    // göbek: delik delik bastırılmış sarı kil top
    const R = c.r * 0.22;
    const cuk = [];
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2 + c.aci;
      cuk.push({ x: c.x + Math.cos(a) * R * 0.58, y: c.y + Math.sin(a) * R * 0.58, r: Math.max(0.8, R * 0.13), d: Math.min(1.2, R * 0.12) });
    }
    cuk.push({ x: c.x, y: c.y, r: Math.max(0.8, R * 0.14), d: Math.min(1.2, R * 0.1) });
    katman({
      ciz: (g) => {
        g.beginPath();
        g.arc(c.x, c.y, R, 0, 7);
        g.fill();
      },
      renk: '#F8C94A',
      bevel: R * 0.9,
      dalga: 0.4,
      cukurlar: cuk,
      kil: { puruz: 0.1 },
      golge: { dx: -1.5, dy: 2, blur: 2, alfa: 0.45 },
    });
  }

  zaman('8.');
  // ================================================================== 8. son: hafif sıcak ton ve yumuşak kenar kararması
  ana.save();
  const vg = ana.createRadialGradient(560 * K, 520 * K, 300 * K, 512 * K, 512 * K, 760 * K);
  vg.addColorStop(0, 'rgba(60,40,60,0)');
  vg.addColorStop(1, 'rgba(60,40,60,0.22)');
  ana.fillStyle = vg;
  ana.fillRect(0, 0, N, N);
  ana.restore();

  S.hazir();
}, 0);
</script>
