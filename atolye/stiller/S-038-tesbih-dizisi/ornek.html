<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-038 Tesbih Dizisi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #ece4d4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-038 Tesbih Dizisi — resim, ince iplere dizilmiş tanelerden oluşur. İpler biçimi izler: kubbede meridyenler,
// kasnak ve kaidede yatay sıralar, minarede halkalar, gökte hafif dalgalı yataylar, çiçeklerde merkez çevresinde
// sarmal. Her tane gölgeli küçük bir küredir; ipin bittiği yerde uzun "imame" tanesi vardır. Zemin keten bezidir.
(function () {
  const OL = 2;
  const W = 1024;
  const cv = document.getElementById('tuval');
  const ctx = SAHNE.tuval(cv, OL);
  const r = SAHNE.rng(38);

  // ------------------------------------------------------------ gürültü, renk
  function hash2(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s, o) {
    let t = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2; }
    return t / n;
  }
  const sinir = (v, a, b) => Math.max(a, Math.min(b, v));
  const kis = (v) => Math.max(0, Math.min(255, Math.round(v)));
  const rgb = (c) => `rgb(${kis(c[0])},${kis(c[1])},${kis(c[2])})`;
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const doygun = (c, k) => {
    const m = (c[0] + c[1] + c[2]) / 3;
    return [m + (c[0] - m) * k, m + (c[1] - m) * k, m + (c[2] - m) * k];
  };
  const oynat = (c, a) => {
    const d = (r() - 0.5) * a;
    return [c[0] + d + (r() - 0.5) * a * 0.4, c[1] + d + (r() - 0.5) * a * 0.4, c[2] + d + (r() - 0.5) * a * 0.4];
  };

  // ------------------------------------------------------------ haritalar (çiçeksiz: yapı ve gök çiçeklerin ardında da tam dolsun)
  const RH = SAHNE.renkHaritasi({ cicek: false });
  const bc = SAHNE.yeniTuval();
  const bctx = bc.getContext('2d', { willReadFrequently: true });
  SAHNE.ciz(bctx, { bolge: true, cicek: false });
  const bveri = bctx.getImageData(0, 0, W, W).data;
  const bolge = (x, y) => {
    x = Math.max(0, Math.min(W - 1, Math.round(x)));
    y = Math.max(0, Math.min(W - 1, Math.round(y)));
    const i = (y * W + x) * 4;
    return SAHNE.bolgeAdi(bveri[i], bveri[i + 1], bveri[i + 2]);
  };
  const GUNES_R = 56;
  const gokMu = (x, y) => {
    const b = bolge(x, y);
    if (Math.hypot(x - SAHNE.gunes.x, y - SAHNE.gunes.y) < GUNES_R) return false;
    return b === 'gok' || b === 'gunes' || (b === 'altin' && y < 300);
  };

  // ------------------------------------------------------------ tane kalıpları
  const SP = 128;
  const KURE = SAHNE.yeniTuval(SP, SP); // küre gölgelendirmesi: ışık sağ üstten
  (function () {
    const g = KURE.getContext('2d');
    const c = SP / 2;
    g.beginPath();
    g.arc(c, c, c, 0, Math.PI * 2);
    g.clip();
    let gr = g.createRadialGradient(c + c * 0.32, c - c * 0.34, c * 0.05, c + c * 0.12, c - c * 0.12, c * 1.18);
    gr.addColorStop(0, 'rgba(255,255,255,0.32)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.04)');
    gr.addColorStop(0.62, 'rgba(0,0,0,0.12)');
    gr.addColorStop(0.9, 'rgba(0,0,0,0.48)');
    gr.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = gr;
    g.fillRect(0, 0, SP, SP);
    // sol altta yansıyan ışık
    gr = g.createRadialGradient(c - c * 0.55, c + c * 0.6, 0, c - c * 0.55, c + c * 0.6, c * 0.55);
    gr.addColorStop(0, 'rgba(255,245,230,0.16)');
    gr.addColorStop(1, 'rgba(255,245,230,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, SP, SP);
    // parlak nokta
    gr = g.createRadialGradient(c + c * 0.36, c - c * 0.4, 0, c + c * 0.36, c - c * 0.4, c * 0.3);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)');
    gr.addColorStop(0.4, 'rgba(255,255,255,0.5)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, SP, SP);
  })();
  const GOLGE = SAHNE.yeniTuval(SP, SP); // yumuşak temas gölgesi
  (function () {
    const g = GOLGE.getContext('2d');
    const c = SP / 2;
    const gr = g.createRadialGradient(c, c, 0, c, c, c);
    gr.addColorStop(0, 'rgba(40,28,16,0.75)');
    gr.addColorStop(0.55, 'rgba(40,28,16,0.38)');
    gr.addColorStop(1, 'rgba(40,28,16,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, SP, SP);
  })();

  const sifirla = () => ctx.setTransform(OL, 0, 0, OL, 0, 0);
  let taneSayisi = 0;
  // Bir dizi: ip (nokta dizisi) + taneler [{x,y,d,c}] + uçlarda imame
  function golgeCiz(liste) {
    for (const t of liste) {
      const d = t.d * 1.25;
      ctx.drawImage(GOLGE, t.x - d / 2 - t.d * 0.2, t.y - d / 2 + t.d * 0.26, d, d);
    }
  }
  function ipCiz(noktalar, renk, kal) {
    if (noktalar.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(noktalar[0][0], noktalar[0][1]);
    for (let i = 1; i < noktalar.length; i++) ctx.lineTo(noktalar[i][0], noktalar[i][1]);
    ctx.strokeStyle = renk || 'rgba(96,62,40,0.9)';
    ctx.lineWidth = kal || 0.9;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function tane(t) {
    ctx.fillStyle = typeof t.c === 'string' ? t.c : rgb(t.c);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.d / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.drawImage(KURE, t.x - t.d / 2, t.y - t.d / 2, t.d, t.d);
    taneSayisi++;
  }
  // imame: ip yönünde uzamış tane (a: ipin dışarı doğru yönü)
  function imame(x, y, a, boy, en, c) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const mx = x + ca * boy * 0.5, my = y + sa * boy * 0.5;
    // gölge
    ctx.save();
    ctx.translate(mx - en * 0.25, my + en * 0.32);
    ctx.rotate(a);
    ctx.fillStyle = 'rgba(40,28,16,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 0, boy * 0.55, en * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // gövde: dipte boğumlu, uca doğru incelen uzun tane
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(a);
    const p = new Path2D();
    p.moveTo(-boy * 0.5, 0);
    p.bezierCurveTo(-boy * 0.5, -en * 0.42, -boy * 0.32, -en * 0.5, -boy * 0.12, -en * 0.5);
    p.bezierCurveTo(boy * 0.22, -en * 0.5, boy * 0.5, -en * 0.22, boy * 0.5, 0);
    p.bezierCurveTo(boy * 0.5, en * 0.22, boy * 0.22, en * 0.5, -boy * 0.12, en * 0.5);
    p.bezierCurveTo(-boy * 0.32, en * 0.5, -boy * 0.5, en * 0.42, -boy * 0.5, 0);
    ctx.fillStyle = rgb(c);
    ctx.fill(p);
    ctx.restore();
    // gölgelendirme: ekran yönünde (ışık hep sağ üstten)
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(a);
    ctx.clip(p);
    ctx.rotate(-a);
    const R = Math.max(boy, en) * 0.55;
    ctx.drawImage(KURE, -R, -R, 2 * R, 2 * R);
    ctx.restore();
    // boğum halkası
    ctx.save();
    ctx.translate(x + ca * boy * 0.14, y + sa * boy * 0.14);
    ctx.rotate(a);
    ctx.strokeStyle = 'rgba(30,20,10,0.35)';
    ctx.lineWidth = Math.max(0.6, en * 0.1);
    ctx.beginPath();
    ctx.moveTo(0, -en * 0.45);
    ctx.lineTo(0, en * 0.45);
    ctx.stroke();
    ctx.restore();
  }
  // nokta dizisi boyunca aralıklı taneler: boyFn(t) tane çapı, renkFn(x,y,t)
  function boyunca(noktalar, aralik, boyFn, renkFn) {
    const uz = [0];
    for (let i = 1; i < noktalar.length; i++) uz.push(uz[i - 1] + Math.hypot(noktalar[i][0] - noktalar[i - 1][0], noktalar[i][1] - noktalar[i - 1][1]));
    const top = uz[uz.length - 1];
    const out = [];
    let s = 0;
    let j = 0;
    while (s <= top) {
      while (j < uz.length - 2 && uz[j + 1] < s) j++;
      const t0 = (s - uz[j]) / Math.max(1e-6, uz[j + 1] - uz[j]);
      const x = noktalar[j][0] + (noktalar[j + 1][0] - noktalar[j][0]) * t0;
      const y = noktalar[j][1] + (noktalar[j + 1][1] - noktalar[j][1]) * t0;
      const d = boyFn(s / Math.max(1, top), x, y);
      out.push({ x, y, d, c: renkFn(x, y, s / Math.max(1, top)) });
      s += typeof aralik === 'function' ? aralik(d) : aralik;
    }
    return { taneler: out, top };
  }
  const yonu = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);

  // ------------------------------------------------------------ keten zemin
  (function () {
    const k = SAHNE.yeniTuval();
    const g = k.getContext('2d');
    const im = g.createImageData(W, W);
    const d = im.data;
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        const cozgu = 0.5 + 0.5 * Math.sin(x * 2.2 + vnoise(x / 30, y / 2.5, 3) * 3);
        const atki = 0.5 + 0.5 * Math.sin(y * 2.2 + vnoise(x / 2.5, y / 30, 4) * 3);
        const dama = ((x >> 1) + (y >> 1)) & 1;
        const dok = dama ? cozgu : atki;
        const bogum = (vnoise(x / 1.5, y / 22, 5) - 0.5) * 0.6 + (vnoise(x / 22, y / 1.5, 6) - 0.5) * 0.6;
        const genel = fbm(x / 160, y / 160, 7, 3) - 0.5;
        const v = 0.92 + dok * 0.08 + bogum * 0.08 + genel * 0.1;
        const i = (y * W + x) * 4;
        d[i] = 238 * v;
        d[i + 1] = 229 * v;
        d[i + 2] = 211 * v;
        d[i + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
    sifirla();
    ctx.drawImage(k, 0, 0, W, W);
  })();

  // ------------------------------------------------------------ gök: hafif dalgalı yatay ipler
  const BULUT = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
  const gokRengi = (x, y) => {
    const t = sinir(y / 800, 0, 1);
    // ufka doğru açılan mavi; en altta bile keten renginden ayrılacak kadar mavi kalır
    let c = t < 0.6 ? karis([96, 152, 216], [148, 194, 230], t / 0.6) : karis([148, 194, 230], [190, 218, 234], (t - 0.6) / 0.4);
    const ds = Math.hypot(x - SAHNE.gunes.x, y - SAHNE.gunes.y);
    c = karis(c, [252, 240, 206], 0.8 * Math.exp(-(ds / 190) * (ds / 190)));
    let b = 0;
    for (const [bx, by, bs] of BULUT) {
      const dx = (x - bx) / (150 * bs), dy = (y - by) / (32 * bs);
      b += Math.exp(-(dx * dx + dy * dy) * 1.5);
    }
    return karis(c, [255, 255, 255], 0.7 * Math.min(1, b));
  };
  const HILALLER = [SAHNE.alemParcalari(560, 300, 1).hilal, SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem.hilal];
  (function () {
    const D = 10.4;
    const satirlar = [];
    for (let y0 = 6; y0 < 806; y0 += D + 1.2) {
      const dalga = (x) => y0 + 3.2 * Math.sin(x / 130 + y0 * 0.045) + 1.4 * Math.sin(x / 47 + y0 * 0.13);
      // ipi gök içindeki parçalara böl
      let parca = null;
      const parcalar = [];
      for (let x = -12; x <= W + 12; x += 2) {
        const y = dalga(x);
        const xs = Math.max(0, Math.min(W - 1, x));
        const icinde = y < 800 && gokMu(xs, y) && gokMu(xs, y - 4) && gokMu(xs, y + 4);
        if (icinde) {
          if (!parca) { parca = []; parcalar.push(parca); }
          parca.push([x, y]);
        } else parca = null;
      }
      satirlar.push(...parcalar.filter((p) => p.length > 3));
    }
    const tumu = [];
    for (const p of satirlar) {
      const bas = p[0][0] > -10, son = p[p.length - 1][0] < W + 10; // yapıya ya da güneşe değen uçlar
      const ic = p.slice();
      // imame için uçlardan pay bırak
      const pay = 12;
      const kes = (arr, s0, s1) => arr.filter((q) => q[0] >= s0 && q[0] <= s1);
      const x0 = p[0][0] + (bas ? pay : 0), x1 = p[p.length - 1][0] - (son ? pay : 0);
      const govde = kes(ic, x0, x1);
      if (govde.length < 2) continue;
      const { taneler: ham } = boyunca(govde, D + 1.15, () => D, (x, y) => oynat(doygun(gokRengi(x, y), 1.12), 8));
      // alemlerin çevresi boş keten kalsın: hilal ve küreler gök tanelerine karışmasın
      const altinYakin = (x, y) => [[0, 0], [7, 0], [-7, 0], [0, 7], [0, -7], [5, 5], [-5, 5], [5, -5], [-5, -5]].some(([dx, dy]) => bolge(x + dx, y + dy) === 'altin');
      const hilalYakin = (x, y) => HILALLER.some((h) => Math.hypot(x - h.cx, y - (h.cy - h.R * 0.1)) < h.R * 1.12 + D * 0.5);
      const taneler = ham.filter((t) => !altinYakin(t.x, t.y) && !hilalYakin(t.x, t.y));
      tumu.push({ p, govde, taneler, bas, son });
    }
    for (const s of tumu) golgeCiz(s.taneler);
    for (const s of tumu) {
      ipCiz(s.p, 'rgba(92,70,58,0.75)', 0.8);
      for (const t of s.taneler) tane(t);
      const g = s.govde;
      if (s.bas) imame(g[0][0] - 1, g[0][1], Math.PI + yonu(g[0], g[1]), 11, 6.6, oynat(doygun(gokRengi(g[0][0], g[0][1]), 1.1), 4));
      if (s.son) imame(g[g.length - 1][0] + 1, g[g.length - 1][1], yonu(g[g.length - 2], g[g.length - 1]), 11, 6.6, oynat(doygun(gokRengi(g[g.length - 1][0], g[g.length - 1][1]), 1.1), 4));
    }
  })();

  // ------------------------------------------------------------ güneş: iç içe tesbih halkaları
  (function () {
    const G = SAHNE.gunes;
    const halkalar = [[0, 11, [255, 252, 240]], [13, 8.6, [255, 248, 226]], [24, 8.8, [253, 240, 204]], [35.5, 9, [248, 226, 176]], [47, 9.2, [240, 210, 150]]];
    const hepsi = [];
    for (const [R, d, c] of halkalar) {
      if (!R) { hepsi.push({ ip: null, taneler: [{ x: G.x, y: G.y, d, c }] }); continue; }
      const n = Math.round((2 * Math.PI * R) / (d * 1.1));
      const taneler = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + R;
        taneler.push({ x: G.x + Math.cos(a) * R, y: G.y + Math.sin(a) * R, d, c: oynat(c, 6) });
      }
      hepsi.push({ R, taneler });
    }
    for (const h of hepsi) golgeCiz(h.taneler);
    for (const h of hepsi) {
      if (h.R) {
        ctx.beginPath();
        ctx.arc(G.x, G.y, h.R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(150,110,60,0.8)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      for (const t of h.taneler) tane(t);
    }
  })();

  // ------------------------------------------------------------ minare: halka ipler
  const tasRenk = (x, x1, x2) => {
    const t = sinir((x - x1) / (x2 - x1), 0, 1);
    return t < 0.55 ? karis([168, 152, 122], [238, 230, 211], t / 0.55) : t < 0.85 ? karis([238, 230, 211], [251, 246, 234], (t - 0.55) / 0.3) : karis([251, 246, 234], [203, 190, 158], (t - 0.85) / 0.15);
  };
  const GOZ = 640; // göz hizası: halkalar bunun üstünde ∩, altında ∪ kıvrılır
  function halka(cx, R, y, d, renkFn, secenek) {
    secenek = secenek || {};
    const e = R * 0.22 * sinir((y - GOZ) / 460, -1, 1);
    const n = Math.max(3, Math.round((Math.PI * R) / (d * 1.12)));
    const taneler = [];
    const ip = [];
    for (let i = 0; i <= 40; i++) {
      const th = -Math.PI / 2 + (Math.PI * i) / 40;
      ip.push([cx + R * Math.sin(th), y + e * Math.cos(th)]);
    }
    for (let j = 0; j < n; j++) {
      const th = -Math.PI / 2 + (Math.PI * (j + 0.5)) / n;
      const x = cx + R * Math.sin(th), yy = y + e * Math.cos(th);
      taneler.push({ x, y: yy, d: d * (0.72 + 0.28 * Math.cos(th)), c: renkFn(x, yy, th), th });
    }
    // kenardakiler arkada: önce kenarlar, sonra orta
    taneler.sort((a, b) => Math.cos(a.th) - Math.cos(b.th));
    return { ip, taneler, secenek };
  }
  function halkalariCiz(liste) {
    for (const h of liste) golgeCiz(h.taneler);
    for (const h of liste) {
      ipCiz(h.ip, 'rgba(96,66,44,0.85)', 0.8);
      for (const t of h.taneler) {
        if (h.secenek.uzun) imame(t.x, t.y + h.secenek.uzun / 2, -Math.PI / 2, h.secenek.uzun, t.d, t.c);
        else tane(t);
      }
    }
  }
  const M = SAHNE.minareParcalari();
  const parca = (ad) => M.find((p) => p.ad === ad);
  const zikzakKoyu = (x, y) => {
    let en = 1e9;
    for (const z of SAHNE.zikzakCizgileri()) {
      for (let i = 0; i < z.length - 1; i++) {
        const [ax, ay] = z[i], [bx, by] = z[i + 1];
        const t = sinir(((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2), 0, 1);
        en = Math.min(en, Math.hypot(x - ax - (bx - ax) * t, y - ay - (by - ay) * t));
      }
    }
    return en < 3.4;
  };
  (function () {
    const liste = [];
    const govdeRenk = (x1, x2) => (x, y) => {
      const b = bolge(x, y);
      let c = tasRenk(x, x1, x2);
      if (b === 'pencere') c = [128, 112, 90];
      else if (y > 520 && y < 584 && zikzakKoyu(x, y)) c = [150, 128, 98];
      return oynat(c, 8);
    };
    for (let y = 798; y > 488; y -= 7.8) if (y < 519 || y > 586) liste.push(halka(300, 34, y, 7.4, govdeRenk(266, 334)));
    // çıkma-1 (konsol) ve şerefe-1
    for (const [y, R] of [[485, 38], [478, 43], [471, 48]]) liste.push(halka(300, R, y, 6.6, (x) => oynat(tasRenk(x, 300 - R, 300 + R), 8)));
    liste.push(halka(300, 54, 462, 9, (x) => oynat(karis(tasRenk(x, 246, 354), [255, 255, 255], 0.15), 6)));
    halkalariCiz(liste);
    liste.length = 0;
    // zikzak bandı: zikzak çizgisini izleyen ipler (koyu ve açık taneler sırayla)
    (function () {
      const zz = SAHNE.zikzakCizgileri();
      const diz = [];
      for (let k = 0; k < zz.length; k++) {
        for (const [ofs, koyu] of [[-6.4, false], [0, true], [6.4, false]]) {
          const nok = zz[k].map(([x, y]) => [x, y + ofs]);
          const { taneler } = boyunca(nok, 6.1, () => 5.6, (x) => oynat(koyu ? [150, 124, 92] : tasRenk(x, 266, 334), 8));
          diz.push({ nok, taneler: taneler.filter((t) => t.x > 268 && t.x < 332) });
        }
      }
      for (const z of diz) golgeCiz(z.taneler);
      for (const z of diz) {
        ipCiz(z.nok, 'rgba(96,66,44,0.85)', 0.75);
        for (const t of z.taneler) tane(t);
      }
    })();
    // korkuluk-1: dikey uzun taneler (parmaklık) ve üst küpeşte
    liste.push(halka(300, 48, 451, 6.2, (x) => oynat(tasRenk(x, 252, 348), 8), { uzun: 15 }));
    halkalariCiz(liste);
    liste.length = 0;
    liste.push(halka(300, 49, 437, 6, (x) => oynat(tasRenk(x, 251, 349), 6)));
    for (let y = 431; y > 316; y -= 7.6) liste.push(halka(300, 27, y, 7, govdeRenk(273, 327)));
    for (const [y, R] of [[313, 31], [306, 36], [300, 41]]) liste.push(halka(300, R, y, 6.2, (x) => oynat(tasRenk(x, 300 - R, 300 + R), 8)));
    liste.push(halka(300, 45, 295, 8.4, (x) => oynat(karis(tasRenk(x, 255, 345), [255, 255, 255], 0.15), 6)));
    halkalariCiz(liste);
    liste.length = 0;
    liste.push(halka(300, 40, 283, 5.8, (x) => oynat(tasRenk(x, 260, 340), 8), { uzun: 13 }));
    halkalariCiz(liste);
    liste.length = 0;
    liste.push(halka(300, 41, 271, 5.6, (x) => oynat(tasRenk(x, 259, 341), 6)));
    for (let y = 266; y > 206; y -= 7) liste.push(halka(300, 19, y, 6.6, govdeRenk(281, 319)));
    liste.push(halka(300, 25, 202, 6.4, (x) => oynat(tasRenk(x, 275, 325), 6)));
    // topuz: soğan profili
    for (let y = 196; y > 150; y -= 5.6) {
      const t = (200 - y) / 54;
      const R = Math.max(3, 22 + Math.sin(Math.min(1, t * 1.6) * Math.PI) * 9 - t * t * 22);
      liste.push(halka(300, R, y, 5.4, (x) => oynat(tasRenk(x, 300 - R, 300 + R), 8)));
    }
    halkalariCiz(liste);
  })();

  // ------------------------------------------------------------ altın alem: dikey ip üstünde altın taneler
  const altin = (t) => oynat(karis([150, 110, 30], [236, 196, 84], t), 6);
  function alem(a) {
    const C = a.cubuk;
    const cx = (C.x1 + C.x2) / 2;
    const H = a.hilal;
    ipCiz([[cx, a.yaka.cy], [cx, H.cy + H.R * 0.4]], 'rgba(110,80,30,0.9)', 0.9);
    // aradaki küçük taneler
    const ks = a.kureler;
    const ara = [];
    for (let i = 0; i < ks.length; i++) {
      const alt = i === 0 ? a.yaka.cy - a.yaka.ry * 0.3 : ks[i - 1].cy - ks[i - 1].r;
      const ust = ks[i].cy + ks[i].r;
      const d = Math.max(2.2, (C.x2 - C.x1) * 1.05);
      for (let y = alt - d / 2; y > ust + d * 0.3; y -= d * 1.1) ara.push({ x: cx, y, d, c: altin(0.6) });
    }
    const ustSon = ks[ks.length - 1].cy - ks[ks.length - 1].r;
    const d0 = Math.max(2.2, (C.x2 - C.x1) * 1.05);
    for (let y = ustSon - d0 / 2; y > H.cy + H.R * 0.55; y -= d0 * 1.1) ara.push({ x: cx, y, d: d0, c: altin(0.6) });
    golgeCiz(ara);
    for (const t of ara) tane(t);
    // yaka: yassı geniş tane
    ctx.save();
    ctx.translate(a.yaka.cx, a.yaka.cy);
    ctx.scale(a.yaka.rx / a.yaka.ry, 1);
    golgeCiz([{ x: 0, y: 0, d: a.yaka.ry * 2 }]);
    tane({ x: 0, y: 0, d: a.yaka.ry * 2, c: altin(0.55) });
    ctx.restore();
    for (const k of ks) {
      golgeCiz([{ x: k.cx, y: k.cy, d: k.r * 2 }]);
      tane({ x: k.cx, y: k.cy, d: k.r * 2, c: altin(0.7) });
    }
    // hilal: dolgun bir hilal gövdesi. Dış kenar boyunca bir ip; gövde kalınlaştıkça iç kenarda ve ortada
    // ikinci, üçüncü ip başlar; hepsine minik altın taneler sık dizilir, boynuz uçlarında minik imameler.
    const R = H.R;
    const ic = (ph) => {
      const cp = Math.cos(ph);
      return (-0.8 * R * cp + Math.sqrt(0.64 * R * R * cp * cp + 4 * 0.5625 * R * R)) / 2;
    };
    const db = Math.max(2.1, R * 0.215);
    const yayNok = (rf, esik) => {
      const pts = [];
      for (let ph = -2.3; ph <= 2.3001; ph += 0.025) {
        const sI = ic(ph);
        if (R - sI < esik) continue;
        const rr = rf(sI);
        pts.push([H.cx + Math.sin(ph) * rr, H.cy + Math.cos(ph) * rr, ph]);
      }
      return pts;
    };
    const ipler = [
      yayNok(() => R - db * 0.55, db * 0.85),
      yayNok((sI) => sI + db * 0.55, db * 1.85),
      yayNok((sI) => (R + sI) / 2, db * 2.8),
    ].filter((q) => q.length > 2);
    const hTaneler = [];
    for (const q of ipler) {
      const { taneler } = boyunca(q.map((u) => [u[0], u[1]]), db * 1.02, () => db, (x) => altin(sinir(0.42 + ((x - H.cx) / R) * 0.38, 0.1, 0.95)));
      hTaneler.push({ q, taneler });
    }
    for (const h of hTaneler) golgeCiz(h.taneler);
    for (const h of hTaneler) ipCiz(h.q.map((u) => [u[0], u[1]]), 'rgba(110,80,30,0.9)', 0.6);
    for (const h of hTaneler) for (const t of h.taneler) tane(t);
    const dis = ipler[0];
    const u0 = dis[0], u1 = dis[dis.length - 1];
    imame(u0[0], u0[1], yonu(dis[4], dis[0]), db * 2.1, db * 0.95, altin(0.3));
    imame(u1[0], u1[1], yonu(dis[dis.length - 5], dis[dis.length - 1]), db * 2.1, db * 0.95, altin(0.8));
  }
  alem(parca('alem').alem);

  // ------------------------------------------------------------ kaide: yatay ipler
  const K = SAHNE.kaide;
  function yatayIp(x1, x2, y, d, renkFn, imameRenk) {
    const p = [[x1, y], [x2, y]];
    const icx1 = x1 + d * 1.1, icx2 = x2 - d * 1.1;
    const n = Math.max(1, Math.round((icx2 - icx1) / (d * 1.12)));
    const taneler = [];
    for (let i = 0; i <= n; i++) {
      const x = icx1 + ((icx2 - icx1) * i) / n;
      taneler.push({ x, y, d, c: renkFn(x, y) });
    }
    return { p, taneler, uc: [x1, x2, y, d], imameRenk };
  }
  function yatayCiz(liste) {
    for (const s of liste) golgeCiz(s.taneler);
    for (const s of liste) {
      ipCiz(s.p, 'rgba(96,66,44,0.85)', 0.85);
      for (const t of s.taneler) tane(t);
      const [x1, x2, y, d] = s.uc;
      imame(x1 + d * 0.62, y, Math.PI, d * 1.25, d * 0.72, s.imameRenk || s.taneler[0].c);
      imame(x2 - d * 0.62, y, 0, d * 1.25, d * 0.72, s.imameRenk || s.taneler[s.taneler.length - 1].c);
    }
  }
  (function () {
    const liste = [];
    const renk = (x, y) => {
      let c = RH.renk(x, y);
      if (bolge(x, y) === 'pencere') c = [112, 100, 80];
      return oynat(doygun(c, 1.1), 8);
    };
    for (let y = K.y1 + 5; y < K.y2; y += 8.6) liste.push(yatayIp(K.x1 - 2, K.x2 + 2, y, 8.2, renk));
    liste.push(yatayIp(K.kornis.x1 - 3, K.kornis.x2 + 3, (K.kornis.y1 + K.kornis.y2) / 2, 10, (x) => oynat(karis(RH.renk(x, 698), [255, 255, 255], 0.2), 6)));
    yatayCiz(liste);
  })();

  // ------------------------------------------------------------ kasnak: silindir boyunca yatay ipler
  (function () {
    const liste = [];
    for (let k = 1; k >= 0; k--) {
      const q = SAHNE.kasnak[k];
      const R = (q.x2 - q.x1) / 2;
      const d = 7.2;
      for (let y = q.y1 + d * 0.62; y < q.y2 - 1; y += d * 1.08) {
        const ip = [[q.x1 - 1, y], [q.x2 + 1, y]];
        const n = Math.round((Math.PI * R) / (d * 1.12));
        const taneler = [];
        for (let j = 1; j < n; j++) {
          const th = -Math.PI / 2 + (Math.PI * j) / n;
          const x = 560 + R * Math.sin(th);
          let c = RH.renk(x, y);
          if (bolge(x, y) === 'pencere') c = [16, 44, 22];
          taneler.push({ x, y, d: d * (0.62 + 0.38 * Math.cos(th)), c: oynat(doygun(c, 1.15), 9), th });
        }
        // kenarda çok sıkışan taneleri seyrelt
        const secili = [];
        let sonX = -1e9;
        for (const t of taneler) if (Math.abs(t.x - sonX) > t.d * 0.62 || Math.cos(t.th) > 0.5) { secili.push(t); sonX = t.x; }
        const ters = [];
        sonX = 1e9;
        for (let i = secili.length - 1; i >= 0; i--) { const t = secili[i]; if (t.x > 560 || Math.abs(sonX - t.x) > t.d * 0.62 || Math.cos(t.th) > 0.5) { ters.push(t); sonX = t.x; } }
        const son = ters.filter((t) => t.x <= 560).concat(secili.filter((t) => t.x > 560));
        son.sort((a, b) => Math.cos(a.th) - Math.cos(b.th));
        liste.push({ ip, taneler: son, R, y, d });
      }
    }
    for (const s of liste) golgeCiz(s.taneler);
    for (const s of liste) {
      ipCiz(s.ip, 'rgba(70,50,34,0.85)', 0.8);
      for (const t of s.taneler) tane(t);
      const c0 = oynat(doygun(RH.renk(560 - s.R + 4, s.y), 1.1), 6), c1 = oynat(doygun(RH.renk(560 + s.R - 4, s.y), 1.1), 6);
      imame(560 - s.R + 2, s.y, Math.PI, 9, 5.4, c0);
      imame(560 + s.R - 2, s.y, 0, 9, 5.4, c1);
    }
  })();

  // ------------------------------------------------------------ kubbe: meridyen ipleri (tepeye doğru seyrelir, biten ipte imame)
  (function () {
    const bez = (p0, p1, p2, p3, t) => {
      const u = 1 - t;
      return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
    };
    const Yf = (t) => bez(555, 430, 318, 300, t);
    const Rf = (t) => 560 - bez(360, 358, 440, 560, t);
    const Mn = 40;
    const dl = Math.PI / Mn;
    const D = 9.4;
    const Ld = [0.5, -0.55, 0.67];
    const yesil = (v) => (v < 0.55 ? karis([22, 72, 34], [46, 128, 60], v / 0.55) : karis([46, 128, 60], [128, 196, 120], (v - 0.55) / 0.45));
    const ipler = [];
    for (let j = 0; j <= Mn; j++) {
      const lam = -Math.PI / 2 + j * dl;
      const sl = Math.sin(lam), cl = Math.cos(lam);
      if (cl < 0.12) continue;
      // bu ipin seviyesi: j'nin 2'ye bölünebilirliği → daha yükseğe çıkar
      const kk = Math.abs(j - Mn / 2);
      let sev = 0;
      while (sev < 5 && kk % (2 << sev) === 0) sev++;
      const aralik3B = dl * (1 << sev); // 3B'de komşu ipe uzaklık / R
      const noktalar = [];
      let bitti = false;
      for (let i = 0; i <= 300; i++) {
        const t = i / 300;
        const R = Rf(t);
        if (j !== Mn / 2 && R * aralik3B < D * 1.08) { bitti = true; break; }
        noktalar.push([560 + R * sl, Yf(t), t]);
      }
      ipler.push({ lam, sl, cl, noktalar, bitti, orta: j === Mn / 2 });
    }
    // arkadan öne: kenar ipleri önce
    ipler.sort((a, b) => a.cl - b.cl);
    const hepsi = [];
    for (const ip of ipler) {
      const nok = ip.noktalar.map((q) => [q[0], q[1]]);
      const dd = D * (0.6 + 0.4 * ip.cl);
      const bas = 6; // dipte imame payı
      const govdeNok = [];
      let s = 0;
      for (let i = 0; i < nok.length; i++) {
        if (i) s += Math.hypot(nok[i][0] - nok[i - 1][0], nok[i][1] - nok[i - 1][1]);
        if (s > bas + dd * 0.4) govdeNok.push(nok[i]);
      }
      const ustBosluk = ip.orta ? 12 : ip.bitti ? 10 : 0;
      let toplam = 0;
      for (let i = 1; i < govdeNok.length; i++) toplam += Math.hypot(govdeNok[i][0] - govdeNok[i - 1][0], govdeNok[i][1] - govdeNok[i - 1][1]);
      const { taneler } = boyunca(govdeNok, dd * 1.12, () => dd, (x, y) => {
        const p = SAHNE.kubbeProfili(30);
        let phi = 0;
        for (let i = 0; i < p.length - 1; i++) if (y <= p[i].y && y >= p[i + 1].y) { phi = Math.atan2(p[i].r - p[i + 1].r, p[i].y - p[i + 1].y); break; }
        const nx = ip.sl * Math.cos(phi), ny = -Math.sin(phi), nz = ip.cl * Math.cos(phi);
        const v = 0.08 + 0.95 * Math.max(0, nx * Ld[0] + ny * Ld[1] + nz * Ld[2]);
        return oynat(doygun(yesil(v), 1.1), 9);
      });
      const kes = taneler;
      // üst uçtan imame payı
      let birikim = 0;
      const son = [];
      for (let i = 0; i < kes.length; i++) {
        if (i) birikim += Math.hypot(kes[i].x - kes[i - 1].x, kes[i].y - kes[i - 1].y);
        if (birikim < toplam - ustBosluk) son.push(kes[i]);
      }
      hepsi.push({ ip, nok, taneler: son, dd });
    }
    for (const h of hepsi) golgeCiz(h.taneler);
    for (const h of hepsi) {
      ipCiz(h.nok, 'rgba(40,40,26,0.8)', 0.75);
      for (const t of h.taneler) tane(t);
      const c = h.taneler.length ? h.taneler[0].c : [40, 110, 50];
      // dipte imame (aşağı bakar)
      const n0 = h.nok[0], n1 = h.nok[2] || h.nok[1];
      imame(n0[0], n0[1] + 1, yonu(n1, n0), 8, h.dd * 0.62, c);
      // biten ipte üstte imame
      if (h.ip.bitti && h.taneler.length) {
        const e = h.nok[h.nok.length - 1], e0 = h.nok[Math.max(0, h.nok.length - 4)];
        imame(e[0] - Math.cos(yonu(e0, e)) * 8, e[1] - Math.sin(yonu(e0, e)) * 8, yonu(e0, e), 9, h.dd * 0.66, h.taneler[h.taneler.length - 1].c);
      }
    }
  })();
  alem(SAHNE.alemParcalari(560, 300, 1));

  // ------------------------------------------------------------ zemin: yatay ipler
  (function () {
    const liste = [];
    const D = 10;
    for (let y0 = 806; y0 < W + 6; y0 += D + 1) {
      const p = [];
      for (let x = -12; x <= W + 12; x += 4) p.push([x, y0 + 2 * Math.sin(x / 90 + y0 * 0.1)]);
      const { taneler } = boyunca(p, D * 1.12, () => D, (x, y) => oynat(doygun(karis([216, 196, 160], [190, 166, 126], (y - 800) / 224), 1.2), 12));
      liste.push({ p, taneler });
    }
    for (const s of liste) golgeCiz(s.taneler);
    for (const s of liste) {
      ipCiz(s.p, 'rgba(96,66,44,0.75)', 0.8);
      for (const t of s.taneler) tane(t);
    }
  })();

  // ------------------------------------------------------------ bitkiler
  const B = SAHNE.bitki;
  // saplar: yeşil küçük taneler, uçta tomurcuk (pembe imame)
  for (const s of B.saplar) {
    const { taneler } = boyunca(s, 6.2, () => 5.6, (x, y) => oynat([88, 124, 70], 10));
    golgeCiz(taneler);
    ipCiz(s, 'rgba(60,70,40,0.9)', 0.9);
    for (const t of taneler) tane(t);
  }
  // yapraklar: damar yönünde, uca doğru birleşen birkaç ip
  for (const y of B.yapraklar) {
    const L = y.uzunluk, Wd = L * y.genislik;
    const k = Math.max(2, Math.round(Wd / 7.5));
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const P = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const koyu = L > 50;
    const taban = koyu ? [70, 104, 58] : [104, 142, 84];
    const ipler = [];
    for (let i = 0; i < k; i++) {
      const f = k === 1 ? 0 : i / (k - 1) - 0.5;
      const nok = [];
      for (let q = 0; q <= 20; q++) {
        const u = 0.06 + (0.86 * q) / 20;
        const gen = Math.pow(Math.sin(Math.PI * Math.min(1, u / 0.98)), 0.85) * Wd * 0.4;
        nok.push(P(u * L, f * 2 * gen));
      }
      ipler.push(nok);
    }
    const tumT = [];
    ipler.forEach((nok, i) => {
      const f = k === 1 ? 0 : i / (k - 1) - 0.5;
      const isik = 0.5 - f * 0.6; // ışık sağ üstten: yaprağın bir yanı açık
      const dmax = Math.min(7.5, (Wd * 0.8) / k);
      const { taneler } = boyunca(nok, (d) => d * 1.1, (t) => Math.max(2.6, dmax * (0.55 + 0.45 * Math.sin(Math.PI * t))), () => oynat(karis(taban, [150, 186, 120], sinir(isik * 0.5, 0, 0.5)), 12));
      tumT.push({ nok, taneler });
    });
    for (const s of tumT) golgeCiz(s.taneler);
    for (const s of tumT) {
      ipCiz(s.nok, 'rgba(50,60,34,0.9)', 0.8);
      for (const t of s.taneler) tane(t);
    }
    const uc = P(L * 0.94, 0);
    imame(uc[0] - ca * 2, uc[1] - sa * 2, y.aci, Math.min(10, L * 0.16), Math.min(5, L * 0.08), karis(taban, [140, 176, 110], 0.4));
  }
  // tomurcuklar: sapın ucundaki pembe imameler
  for (const t of B.tomurcuklar) {
    imame(t.x - Math.cos(t.aci) * t.r * 0.9, t.y - Math.sin(t.aci) * t.r * 0.9, t.aci, t.r * 2.5, t.r * 1.5, oynat([236, 168, 184], 8));
  }
  // çiçekler: merkezden dışa beş loblu sarmal ip
  for (const c of B.cicekler) {
    const nok = [];
    const kucuk = c.r < 35; // yan dallardaki küçük çiçekler: daha az tur, iri tane, belirgin beş lob
    const tur = kucuk ? 2.5 : Math.max(3, c.r / 7.2);
    const lob = kucuk ? 0.44 : 0.26;
    const N = Math.round(tur * 60);
    for (let i = 0; i <= N; i++) {
      const th = (i / N) * tur * Math.PI * 2;
      const f = i / N;
      const zarf = 1 - lob + lob * Math.pow(Math.abs(Math.cos(((th - c.aci) * 5) / 2)), 1.6);
      const rr = c.r * (0.05 + 0.95 * f) * (f < 0.2 ? 1 : 1 + (zarf - 1) * Math.min(1, (f - 0.2) / 0.5));
      nok.push([c.x + Math.cos(th + c.aci) * rr, c.y + Math.sin(th + c.aci) * rr, f]);
    }
    const p2 = nok.map((q) => [q[0], q[1]]);
    const dmax = kucuk ? c.r / 4.3 : Math.max(4, Math.min(8.5, c.r / 7));
    const { taneler } = boyunca(p2, (d) => d * 1.06, (t) => Math.max(2.4, dmax * (0.45 + 0.55 * Math.min(1, t * 1.6))), (x, y, t) => {
      const rr = Math.hypot(x - c.x, y - c.y) / c.r;
      if (rr < 0.2) return oynat(karis([232, 185, 63], [201, 143, 34], rr / 0.2), 10);
      return oynat(karis(kucuk ? [226, 138, 166] : [236, 176, 192], [255, 252, 250], sinir((rr - (kucuk ? 0.3 : 0.22)) / 0.45, 0, 1)), 6);
    });
    golgeCiz(taneler);
    ipCiz(p2, 'rgba(150,110,96,0.8)', 0.75);
    // dıştan içe değil: içten dışa çiz, dıştakiler üstte kalsın
    for (const t of taneler.slice(0, -1)) tane(t);
    const e = p2[p2.length - 1], e0 = p2[p2.length - 6];
    imame(e[0], e[1], yonu(e0, e), dmax * 1.7, dmax * 0.9, [246, 222, 228]);
  }

  SAHNE.hazir();
})();
