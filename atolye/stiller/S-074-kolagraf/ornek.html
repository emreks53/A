<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-074 Kolagraf — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #efe8da; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-074 Kolagraf — dokulu malzemelerin yapıştırılmasıyla kurulmuş levhadan çukur baskı. Gökte kumaş örgüsü,
// bulutlarda yırtık ipek kâğıdı, kubbede soyulmuş oluklu karton ve gölge yanında karborundum, kasnakta
// zımpara, kaidede fırçalanmış macun, gerçek yapraklardan damar izleri, ip saplar, tutkal çizgileri;
// keskin kesim kenarlarında biriken mürekkep, derin kabartma gölgeleri ve kalın levhanın izi.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

'use strict';
// ------------------------------------------------------------------ ortak yardımcılar
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const P2 = (d) => new Path2D(d);

/** Tohumlu değer gürültüsü: (x, y) → [0,1]. */
function gurultuFn(tohum) {
  const r = SAHNE.rng(tohum);
  const v = new Float32Array(256);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { v[i] = r(); p[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = v[p[p[X] + Y]], b = v[p[p[X + 1] + Y]], c = v[p[p[X] + Y + 1]], d = v[p[p[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
/** Fraktal gürültü (fbm): ölçek = en kaba hücre boyu (1024 koordinatında). */
function fbmFn(tohum, oktav, olcek, kazanc) {
  kazanc = kazanc || 0.5;
  const g = [];
  for (let i = 0; i < oktav; i++) g.push(gurultuFn(tohum * 31 + i * 7 + 1));
  let top = 0, a = 1;
  for (let i = 0; i < oktav; i++) { top += a; a *= kazanc; }
  return function (x, y) {
    let s = 0, a = 1, f = 1 / olcek;
    for (let i = 0; i < oktav; i++) { s += a * g[i](x * f + i * 17.3, y * f - i * 9.1); a *= kazanc; f *= 2.03; }
    return s / top;
  };
}

/** Çalışma çözünürlüğünde ekran dışı katman (koordinatlar 1024'te). */
function yeniKatman() {
  const c = SAHNE.yeniTuval(N, N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(O, 0, 0, O, 0, 0);
  return [c, x];
}
function okuKanal(c, kanal) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
  const out = new Float32Array(N * N);
  for (let i = 0, j = kanal; i < N * N; i++, j += 4) out[i] = d[j] / 255;
  return out;
}
/** Çizim fonksiyonundan alfa maskesi (Float32Array, 0–1). */
function maske(ciz, bulaniklik) {
  const [c, x] = yeniKatman();
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  ciz(x);
  if (bulaniklik) return okuKanal(bulanikTuval(c, bulaniklik), 3);
  return okuKanal(c, 3);
}
/** Tuvali bulanıklaştırılmış kopyası (bulaniklik 1024 px cinsinden). */
function bulanikTuval(c, b) {
  const k = SAHNE.yeniTuval(N, N);
  const x = k.getContext('2d', { willReadFrequently: true });
  x.filter = `blur(${b * O}px)`;
  x.drawImage(c, 0, 0);
  return k;
}
/** Float32Array kutu bulanıklığı (3 geçiş ≈ Gauss), r çalışma pikseli. */
function bulanikDizi(a, r) {
  r = Math.max(1, Math.round(r));
  const t = new Float32Array(N * N);
  const gecis = (src, dst, yatay) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < N; j++) {
      let s = 0;
      const idx = (k) => (yatay ? j * N + k : k * N + j);
      for (let k = -r; k <= r; k++) s += src[idx(Math.min(N - 1, Math.max(0, k)))];
      for (let k = 0; k < N; k++) {
        dst[idx(k)] = s * inv;
        s += src[idx(Math.min(N - 1, k + r + 1))] - src[idx(Math.max(0, k - r))];
      }
    }
  };
  for (let p = 0; p < 3; p++) { gecis(a, t, true); gecis(t, a, false); }
  return a;
}
/** Kabartma (gömme) ışığı: yükseklik haritası → gölge/ışık çarpanı. Işık sağ üstten. */
function kabartma(H, guc) {
  const out = new Float32Array(N * N);
  const lx = 0.62, ly = -0.62;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const hx = (H[i + 1] - H[i - 1]) * 0.5, hy = (H[i + N] - H[i - N]) * 0.5;
      out[i] = (-hx * lx - hy * ly) * guc;
    }
  }
  return out;
}

/** SVG yolunu nokta dizilerine çevirir (M, L, C, Z). */
function yolNoktalari(d, adim) {
  adim = adim || 3;
  const t = d.match(/[MLCZA]|-?\d*\.?\d+(?:e-?\d+)?/g);
  const alt = []; let cur = null, i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]);
  while (i < t.length) {
    if (/[MLCZA]/.test(t[i])) cmd = t[i++];
    if (cmd === 'M') { x = num(); y = num(); sx = x; sy = y; cur = []; alt.push(cur); cur.push([x, y]); cmd = 'L'; }
    else if (cmd === 'L') { x = num(); y = num(); cur.push([x, y]); }
    else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(2, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const s = k / n, u = 1 - s;
        cur.push([u * u * u * x + 3 * u * u * s * x1 + 3 * u * s * s * x2 + s * s * s * x3, u * u * u * y + 3 * u * u * s * y1 + 3 * u * s * s * y2 + s * s * s * y3]);
      }
      x = x3; y = y3;
    } else if (cmd === 'Z') { if (Math.hypot(x - sx, y - sy) > 0.01) cur.push([sx, sy]); x = sx; y = sy; cmd = ''; }
    else if (cmd === 'A') { for (let k = 0; k < 5; k++) num(); x = num(); y = num(); cur.push([x, y]); }
    else i++;
  }
  return alt;
}
/** Kâğıt lifi dokusu: ince gürültü + uzun lifler (0–1 civarı, ortalama ~0.5). */
function kagitDokusu(tohum) {
  const g1 = fbmFn(tohum, 3, 2.2), g2 = fbmFn(tohum + 5, 3, 24);
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const X = x / O, Y = y / O;
      out[y * N + x] = 0.6 * g1(X, Y) + 0.4 * g2(X * 1.8, Y * 0.6);
    }
  }
  return out;
}
/** Worley (hücre) gürültüsü: (x, y) → [F1, F2-F1] hücre boyuna göre. */
function worleyFn(tohum, hucre) {
  const r = SAHNE.rng(tohum);
  const ox = new Float32Array(65536), oy = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) { ox[i] = r(); oy[i] = r(); }
  const out = [0, 0];
  return function (x, y) {
    x /= hucre; y /= hucre;
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy, k = ((cy & 255) << 8) | (cx & 255);
        const ex = cx + ox[k] - x, ey = cy + oy[k] - y, d = ex * ex + ey * ey;
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
    }
    out[0] = Math.sqrt(f1); out[1] = Math.sqrt(f2) - out[0];
    return out;
  };
}


// ------------------------------------------------------------------ kurulum
const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
tuval.width = N; tuval.height = N;
const ctx = tuval.getContext('2d');
const Y = SAHNE.yollar();
const BT = SAHNE.bitki;
const rnd = SAHNE.rng(7404);
const PL = { x1: 54, y1: 48, x2: 970, y2: 976, r: 9 };
const IMAX = 2.6, HMAX = 2.6;

// malzeme maskeleri: 3 tuvalin R, G, B kanallarında 9 yuva (öndeki biçim arkadakileri siler)
const MAL = ['kumas', 'kum', 'ipek', 'karton', 'oyuk', 'oluk', 'zimpara', 'yaprak', 'macun'];
const MT = [0, 1, 2].map(() => { const [c, x] = yeniKatman(); x.fillStyle = '#000'; x.fillRect(0, 0, 1024, 1024); return { c, x }; });
const [renkC, RX] = yeniKatman(); // mürekkep rengi (tampon)
const [ihC, IH] = yeniKatman(); // R: mürekkep miktarı, G: levha yüksekliği
const [tutC, TX] = yeniKatman(); // tutkal / ip (eklenen yükseklik)
RX.fillStyle = '#6E6A60'; RX.fillRect(0, 0, 1024, 1024);
IH.fillStyle = '#000'; IH.fillRect(0, 0, 1024, 1024);
TX.globalCompositeOperation = 'lighter'; TX.lineCap = 'round'; TX.lineJoin = 'round';
const KAN = ['rgb(255,0,0)', 'rgb(0,255,0)', 'rgb(0,0,255)'];
const SIL = ['rgb(0,255,255)', 'rgb(255,0,255)', 'rgb(255,255,0)'];
const ihRenk = (ink, h) => `rgb(${Math.round(clamp(ink / IMAX) * 255)},${Math.round(clamp(h / HMAX) * 255)},0)`;
/** Levhaya bir parça yapıştırır: malzeme, renk, mürekkep (sayı ya da [x0,y0,x1,y1,i0,i1] doğrusal geçiş), yükseklik. */
function parca(yol, mal, renk, ink, h) {
  const p = typeof yol === 'string' ? P2(yol) : yol;
  const k = MAL.indexOf(mal), ti = (k / 3) | 0, ch = k % 3;
  for (const m of MT) { m.x.save(); m.x.globalCompositeOperation = 'multiply'; m.x.fillStyle = '#000'; m.x.fill(p); m.x.restore(); }
  MT[ti].x.save(); MT[ti].x.globalCompositeOperation = 'lighter'; MT[ti].x.fillStyle = KAN[ch]; MT[ti].x.fill(p); MT[ti].x.restore();
  if (renk) { RX.fillStyle = renk; RX.fill(p); }
  if (typeof ink === 'number') IH.fillStyle = ihRenk(ink, h);
  else {
    const g = ink.length === 6 ? IH.createLinearGradient(ink[0], ink[1], ink[2], ink[3]) : IH.createRadialGradient(ink[0], ink[1], ink[2], ink[3], ink[4], ink[5]);
    const d = ink.length === 6 ? [[0, ink[4]], [1, ink[5]]] : ink[6];
    d.forEach(([t, v]) => g.addColorStop(t, ihRenk(v, h)));
    IH.fillStyle = g;
  }
  IH.fill(p);
  TX.save(); TX.globalCompositeOperation = 'destination-out'; TX.fillStyle = '#fff'; TX.fill(p); TX.restore();
}
/** Tutkal çizgisi ya da ip: yükseklik ekler, üstü silinir. */
function tutkal(yol, w, a) { TX.lineWidth = w; TX.strokeStyle = `rgba(255,255,255,${a || 0.9})`; TX.stroke(typeof yol === 'string' ? P2(yol) : yol); }
const poly = (pts, k) => P2(SAHNE.yol(pts, k));
for (const x of [...MT.map((m) => m.x), RX, IH, TX]) { x.save(); x.beginPath(); x.rect(PL.x1, PL.y1, PL.x2 - PL.x1, PL.y2 - PL.y1); x.clip(); }

// ------------------------------------------------------------------ gök: kumaş (çuval bezi), güneş: kesik karton + tutkal halkaları
{
  const gok = 'M0,0 H1024 V800 H0 Z';
  parca(gok, 'kumas', null, [0, 40, 0, 800, 1.35, 0.55], 0.7);
  const g = RX.createLinearGradient(0, 40, 0, 800);
  g.addColorStop(0, '#2B5A97'); g.addColorStop(0.5, '#4F83BA'); g.addColorStop(0.85, '#87A9C4'); g.addColorStop(1, '#B5B7A6');
  RX.fillStyle = g; RX.fill(P2(gok));
  // güneş yöresi tamponla açılır ve ılık sarıya döner
  const gr = RX.createRadialGradient(880, 140, 30, 880, 140, 250);
  gr.addColorStop(0, 'rgba(222,168,70,1)'); gr.addColorStop(0.35, 'rgba(210,172,108,0.6)'); gr.addColorStop(1, 'rgba(206,170,110,0)');
  RX.fillStyle = gr; RX.fill(P2(gok));
  const gi = IH.createRadialGradient(880, 140, 40, 880, 140, 280);
  gi.addColorStop(0, 'rgba(0,0,0,0.7)'); gi.addColorStop(1, 'rgba(0,0,0,0)');
  IH.save(); IH.globalCompositeOperation = 'source-over'; IH.fillStyle = gi;
  // yalnız R kanalını azaltmak için çarpma
  IH.globalCompositeOperation = 'multiply';
  const gm = IH.createRadialGradient(880, 140, 40, 880, 140, 280);
  gm.addColorStop(0, 'rgb(90,255,255)'); gm.addColorStop(1, 'rgb(255,255,255)');
  IH.fillStyle = gm; IH.fill(P2(gok)); IH.restore();
  parca(SAHNE.daireYolu(880, 140, 46), 'karton', '#E2AE3A', 0.42, 1.55);
  for (const r of [58, 71, 85]) tutkal(SAHNE.daireYolu(880, 140, r), 3.4, 0.9);
}
// zemin: tutkala serpilmiş kum; üst kenarı düzensiz, birkaç tane kenarın dışına sıçramış
const ZEMIN = (() => {
  const rz = SAHNE.rng(7470), dz = fbmFn(7471, 3, 60), p = new Path2D();
  p.moveTo(0, 1024); p.lineTo(0, 796);
  for (let x = 0; x <= 1024; x += 3) {
    const y = 799 - 7 * dz(x, 3) - 3.2 * Math.pow(rz(), 3) - 2 * Math.max(0, Math.sin(x * 0.045 + 1.3)) * dz(x * 3, 9);
    p.lineTo(x, y);
  }
  p.lineTo(1024, 1024); p.closePath();
  for (let i = 0; i < 70; i++) { const x = rz() * 1024, y = 784 + rz() * 12, r = 0.7 + rz() * 1.3; p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU); }
  return p;
})();
parca(ZEMIN, 'kum', null, [0, 790, 0, 1024, 0.62, 1.05], 0.5);
{ const g = RX.createLinearGradient(0, 785, 0, 1024); g.addColorStop(0, '#B88E58'); g.addColorStop(1, '#996740'); RX.fillStyle = g; RX.fill(ZEMIN); }
// yapının sola düşen gölgesi: zeminde daha yoğun mürekkep
{ IH.save(); IH.globalCompositeOperation = 'lighter'; const g = IH.createLinearGradient(0, 800, 0, 846); g.addColorStop(0, 'rgb(70,0,0)'); g.addColorStop(1, 'rgb(0,0,0)'); IH.fillStyle = g; IH.fill(P2('M300,800 L110,828 L300,846 L820,846 L820,800 Z')); IH.restore(); }
// bulutlar: yırtık ipek kâğıdı
{
  const rb = SAHNE.rng(31);
  const BULUT = [[170, 250, 1.05], [505, 150, 0.85], [760, 335, 1.15], [945, 470, 0.75], [95, 470, 0.75]];
  for (const [bx, by, bs] of BULUT) {
    const pts = [];
    const n = 140;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const ust = Math.sin(a) < 0;
      const rx = 118 * bs, ry = (ust ? 34 : 16) * bs;
      const dal = ust ? 1 + 0.22 * Math.sin(a * 5 + bx) + 0.1 * Math.sin(a * 11) : 1;
      const yir = 1 + (rb() - 0.5) * 0.12 + 0.05 * Math.sin(a * 23 + bx);
      pts.push([bx + Math.cos(a) * rx * yir, by + Math.sin(a) * ry * dal * yir]);
    }
    parca(poly(pts, true), 'ipek', '#A7B9CB', 0.42, 0.95);
  }
}
// ------------------------------------------------------------------ minare: karton parçaları, tutkal zikzak ve korkuluk
{
  let say = 0;
  for (const p of SAHNE.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'bant') { for (const z of SAHNE.zikzakCizgileri()) tutkal(poly(z), 2.6, 0.95); continue; }
    let d, x1, x2;
    if (p.tip === 'poligon') { d = SAHNE.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
    else if (p.tip === 'topuz') { d = p.yol; x1 = 266; x2 = 334; }
    else { d = SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true); x1 = p.x1; x2 = p.x2; }
    const cik = p.ad.startsWith('çıkma');
    parca(d, cik || p.tip === 'korkuluk' ? 'karton' : 'ipek', cik ? '#8E8272' : '#A69A86', [x1, 0, x2, 0, cik ? 1.0 : 0.55, cik ? 0.55 : 0.16], (say++ % 2 ? 1.05 : 1.25) + (p.ad.startsWith('şerefe') ? 0.25 : 0));
    if (p.tip === 'korkuluk') for (let i = 0; i < 9; i++) { const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / 9; tutkal(`M${x},${p.y1 + 4} L${x},${p.y2 - 4}`, 2.4, 0.9); }
  }
  for (const p of SAHNE.minarePencereleri) parca(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 'oyuk', '#3A3028', 1.6, 0.1);
}
// ------------------------------------------------------------------ kaide: fırçalanmış macun, korniş şeridi, kesik pencereler
parca(Y.kaide, 'macun', '#ADA088', [300, 0, 820, 0, 0.72, 0.26], 1.1);
parca('M300,704 H820 V714 H300 Z', 'macun', '#7E7466', 0.9, 1.0);
parca(Y.kornis, 'karton', '#B6AA94', 0.3, 1.6);
for (const p of SAHNE.kaide.pencereler) parca(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 'oyuk', '#46302A', 1.6, 0.1);
// ------------------------------------------------------------------ kasnak: zımpara, kesik pencereler
for (let k = 1; k >= 0; k--) {
  const q = SAHNE.kasnak[k];
  parca(k ? Y.kasnakAlt : Y.kasnakUst, 'zimpara', '#2D6C43', [q.x1, 0, q.x2, 0, 1.45, 0.75], k ? 1.25 : 1.45);
  for (const p of SAHNE.kasnakPencereleri(k)) parca(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 'oyuk', '#183424', 1.75, 0.15);
}
// ------------------------------------------------------------------ kubbe: oluklu karton dilimleri, gölge yanında karborundum
{
  parca(Y.kubbe, 'oluk', '#2F8751', [655, 380, 10, 600, 430, 300, [[0, 0.55], [0.5, 0.9], [1, 1.3]]], 1.6);
}
// alemler: karton, tutkal kontur
for (const [axx, taban, s] of [[560, 300, 1], [300, 146, 0.62]]) {
  const a = SAHNE.alemParcalari(axx, taban, s);
  const ys = [SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), SAHNE.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true), ...a.kureler.map((k) => SAHNE.daireYolu(k.cx, k.cy, k.r)), SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
  for (const d of ys) parca(d, 'karton', '#C08C2C', [axx - 20 * s, 0, axx + 20 * s, 0, 1.2, 0.5], 1.75);
}
// ------------------------------------------------------------------ bitkiler: ip saplar, gerçek yapraklar, karton taç yaprakları
{
  for (const s of BT.saplar) {
    const p = poly(s);
    RX.save(); RX.lineWidth = 7; RX.strokeStyle = '#4A6E35'; RX.stroke(p); RX.restore();
    IH.save(); IH.lineWidth = 5; IH.strokeStyle = ihRenk(1.3, 0.7); IH.stroke(p); IH.restore();
    tutkal(p, 4.4, 0.9);
  }
  const YRENK = ['#4D7C3A', '#6A903C', '#3C6537', '#587F2E'];
  BT.yapraklar.forEach((yp, i) => {
    const d = SAHNE.yaprakYolu(yp);
    const ton = YRENK[i % 4];
    const koyu = yp.uzunluk > 50;
    parca(d, 'yaprak', ton, koyu ? 1.35 : 1.1, 1.0 + (i % 3) * 0.1);
    // damarlar: kabarık (yüksek, silinmiş) çizgiler
    const ca = Math.cos(yp.aci), sa = Math.sin(yp.aci), L = yp.uzunluk, W = L * yp.genislik;
    const P = (u, v) => [yp.x + u * ca - v * sa, yp.y + u * sa + v * ca];
    IH.save(); IH.clip(P2(d));
    IH.strokeStyle = ihRenk(0.45, 1.35 + (i % 3) * 0.1); IH.lineWidth = Math.max(1.2, L * 0.035); IH.lineCap = 'round';
    IH.beginPath(); IH.moveTo(...P(0, 0)); IH.lineTo(...P(L * 0.95, 0)); IH.stroke();
    IH.lineWidth = Math.max(0.8, L * 0.018);
    for (let k = 1; k <= 5; k++) {
      const u0 = (L * k) / 6.5;
      for (const sgn of [-1, 1]) {
        IH.beginPath(); IH.moveTo(...P(u0, 0));
        IH.quadraticCurveTo(...P(u0 + L * 0.1, sgn * W * 0.25), ...P(u0 + L * 0.2, sgn * W * 0.52));
        IH.stroke();
      }
    }
    IH.restore();
  });
  for (const t of BT.tomurcuklar) parca(SAHNE.tomurcukYolu(t), 'karton', '#C2607A', 1.0, 1.35);
  BT.cicekler.forEach((c) => {
    SAHNE.tacYapraklari(c).forEach((e, j) => {
      parca(SAHNE.elipsYolu(e), 'karton', '#D27C8C', [c.x, c.y, c.r * 0.1, c.x, c.y, c.r * 1.05, [[0, 0.62], [0.3, 0.2], [0.6, 0.05], [1, 0.02]]], 1.3 + (j % 2) * 0.28);
    });
    parca(SAHNE.daireYolu(c.x, c.y, c.r * 0.22), 'kum', '#D29C30', 1.15, 1.75);
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * TAU + c.aci;
      parca(SAHNE.daireYolu(c.x + Math.cos(a) * c.r * 0.28, c.y + Math.sin(a) * c.r * 0.28, Math.max(1.4, c.r * 0.045)), 'kum', '#8A4A28', 1.6, 1.85);
    }
  });
}
for (const x of [...MT.map((m) => m.x), RX, IH, TX]) x.restore();

// ------------------------------------------------------------------ oku
const okuHam = (c) => c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
const M3 = MT.map((m) => okuHam(m.c));
const RN = okuHam(renkC);
const IHd = okuHam(ihC);
const TUT = okuKanal(bulanikTuval(tutC, 0.5), 3);

// ------------------------------------------------------------------ dokular
const wA = fbmFn(101, 2, 11), wB = fbmFn(102, 2, 11), kesA = fbmFn(105, 3, 14), kesB = fbmFn(106, 3, 14);
const silF = fbmFn(171, 4, 110), silS = fbmFn(172, 3, 22), tonF = fbmFn(173, 3, 50);
const ipN = gurultuFn(103);
const kumA = gurultuFn(111), kumB = worleyFn(112, 2.5 * O), kumC = fbmFn(113, 3, 30);
const ipekA = fbmFn(121, 3, 18), ipekL = fbmFn(122, 2, 3);
const kartM = fbmFn(131, 3, 40), kartI = fbmFn(132, 2, 5);
const zimA = gurultuFn(141), zimB = worleyFn(142, 2.4 * O);
const retW = worleyFn(151, 3.4 * O), retB = fbmFn(152, 2, 12);
const macA = fbmFn(161, 3, 6), macB = fbmFn(162, 3, 60);
const prof = SAHNE.kubbeProfili(400);
const kubbeR = (y) => { if (y < 300 || y > 555) return 0; let lo = 0, hi = prof.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (prof[m].y > y) lo = m; else hi = m; } const t = (prof[lo].y - y) / (prof[lo].y - prof[hi].y || 1); return lerp(prof[lo].r, prof[hi].r, t); };
const KR = new Float32Array(1024); for (let y = 0; y < 1024; y++) KR[y] = kubbeR(y);
// her dilim ayrı kesilmiş bir oluklu karton parçası: oluk evresi, sıklığı, eğimi ve soyulmamış astar parçaları farklı
const DIL = []; { const r = SAHNE.rng(7444); for (let i = 0; i < 17; i++) DIL.push({ ph: r() * TAU, fm: 0.9 + r() * 0.2, eg: (r() - 0.5) * 0.5, soy: r() < 0.7 ? 1 : 0, ox: r() * 300 }); }
const lifF = fbmFn(181, 2, 2.2), astF = fbmFn(182, 4, 26);

const H = new Float32Array(N * N), LT = new Float32Array(N * N);
const TR = new Float32Array(N * N), TG = new Float32Array(N * N), TB = new Float32Array(N * N);
const m = new Float32Array(9);
for (let y = 0; y < N; y++) {
  const Yc = y / O;
  for (let x = 0; x < N; x++) {
    const X = x / O, i = y * N + x;
    const sx = Math.min(N - 1, Math.max(0, Math.round(x + (kesA(X, Yc) - 0.5) * 3.2 * O))), sy = Math.min(N - 1, Math.max(0, Math.round(y + (kesB(X, Yc) - 0.5) * 3.2 * O)));
    const j = sy * N + sx, i4 = j * 4;
    for (let t = 0; t < 3; t++) { m[t * 3] = M3[t][i4] / 255; m[t * 3 + 1] = M3[t][i4 + 1] / 255; m[t * 3 + 2] = M3[t][i4 + 2] / 255; }
    const ink0 = (IHd[i4] / 255) * IMAX, h0 = (IHd[i4 + 1] / 255) * HMAX;
    let d = 0, h = 0, top = 0;
    // kumaş (çuval bezi örgüsü)
    if (m[0] > 0.004) {
      const p = 7.4;
      const u = X / p + (wA(X, Yc) - 0.5) * 1.1, v = Yc / p + (wB(X, Yc) - 0.5) * 1.1;
      const iu = Math.floor(u + 0.5), iv = Math.floor(v + 0.5);
      const kal = 0.55 + 0.9 * ipN(iu * 3.1, Yc * 0.02), kal2 = 0.55 + 0.9 * ipN(X * 0.02, iv * 3.1);
      const hw = Math.pow(Math.max(0, Math.cos(Math.PI * (u - iu) / (0.5 + 0.18 * kal))), 0.6);
      const hf = Math.pow(Math.max(0, Math.cos(Math.PI * (v - iv) / (0.5 + 0.18 * kal2))), 0.6);
      const ust = (iu + iv) & 1;
      const ww = ust ? Math.max(hw, hf * 0.75) : Math.max(hw * 0.75, hf);
      const lif = ipN(X * 1.7, Yc * 1.7);
      const delik = 1 - smooth(0.12, 0.6, ww);
      d += m[0] * ink0 * (0.3 + 0.55 * (1 - ww) + 0.7 * delik + 0.15 * lif);
      h += m[0] * (h0 + 0.55 * ww);
    }
    // kum / karborundum: kadifemsi koyu, iri taneli
    if (m[1] > 0.004) {
      const w = kumB(x, y);
      const tane = smooth(0.12, 0.6, w[0]) * (0.5 + 0.5 * kumA(x / 1.2, y / 1.2));
      d += m[1] * ink0 * (0.45 + 0.8 * tane + 0.45 * (kumC(X, Yc) - 0.5));
      h += m[1] * (h0 + 0.3 * (1 - tane));
    }
    // ipek kâğıdı: lifli, açık
    if (m[2] > 0.004) {
      const f = ipekA(X, Yc), l = ipekL(X * 2.5, Yc * 0.5);
      const kr = Math.pow(1 - Math.abs(2 * ipekA(X * 1.7 + 40, Yc * 1.7) - 1), 6);
      d += m[2] * ink0 * (0.55 + 0.6 * f + 0.4 * (l - 0.5) + 0.9 * kr);
      h += m[2] * (h0 + 0.1 * f + 0.25 * kr);
    }
    // düz karton (vernikli): silinmiş, hafif lekeli
    if (m[3] > 0.004) {
      const ki = kartI(X * 2, Yc * 2);
      d += m[3] * (ink0 * (0.6 + 0.8 * kartM(X, Yc) + 0.3 * (ki - 0.5)) + 0.08 * ki);
      h += m[3] * (h0 + 0.06 * ki);
    }
    // oyuk (kesilip çıkarılmış): koyu, dolu
    if (m[4] > 0.004) { d += m[4] * ink0 * (0.92 + 0.12 * kartI(X, Yc)); h += m[4] * h0; }
    // oluklu karton: kubbe meridyenleri boyunca oluklar, dilim sınırlarında yarık
    if (m[5] > 0.004) {
      const r = KR[Math.min(1023, Yc | 0)] || 1;
      const uu = clamp((X - 560) / r, -1, 1);
      const fi = Math.asin(uu);
      const dilim = (fi + Math.PI / 2) / (Math.PI / 16);
      const yarik = 1 - smooth(0.0, 0.12, Math.abs(dilim - Math.round(dilim)));
      const egik = Math.sqrt(Math.max(0.05, 1 - uu * uu));
      const sD = DIL[Math.max(0, Math.min(16, Math.floor(dilim)))];
      // elle kesilmiş kartonun olukları: hafif dalgalı, yer yer ezik; lifler oluk boyunca
      const wob = (kartM(X * 0.35 + sD.ox, Yc * 0.14) - 0.5) * 1.6;
      const q = fi * 52 * sD.fm + sD.ph + wob + sD.eg * (Yc - 430) / 50;
      const lifO = lifF(X * 1.6, Yc * 0.22);
      const ezik = smooth(0.62, 0.8, kartI(X * 0.6 + sD.ox, Yc * 0.25));
      const oluk = Math.pow(0.5 + 0.5 * Math.cos(q), 0.65) * (1 - 0.45 * ezik) + (lifO - 0.5) * 0.28;
      // soyulmamış astar kâğıdı parçaları: düz, açık; yırtık kenarları mürekkep tutar
      const ap = astF(X + sD.ox, Yc) + (lifO - 0.5) * 0.08;
      const astar = sD.soy * smooth(0.6, 0.625, ap);
      const yirtik = sD.soy * smooth(0.575, 0.6, ap) * (1 - smooth(0.625, 0.65, ap));
      // gölge yanına fırçayla sürülmüş karborundum: oluklar dolar, taneler sağa doğru seyrelir
      const kb = smooth(-0.12, -0.62, uu + (kumC(X * 1.6, Yc * 1.6) - 0.5) * 0.35);
      const w = kumB(x, y)[0];
      const tane = smooth(0.1, 0.6, w) * (0.5 + 0.5 * kumA(x / 1.2, y / 1.2));
      const seyrek = kb > 0 ? smooth(1 - kb, 1 - kb + 0.25, kumA(x / 2.3 + 50, y / 2.3)) : 0;
      const gr = Math.max(kb * kb, seyrek * 0.85);
      const dOluk0 = 0.36 + 0.95 * clamp(1 - oluk) * egik * (0.55 + 0.9 * lifO) + 0.25 * (kartM(X, Yc) - 0.5);
      const dOluk = lerp(dOluk0, 0.5 + 0.35 * lifO, astar) + 0.85 * yirtik + 0.6 * yarik;
      d += m[5] * ink0 * lerp(dOluk, 1.15 + 0.9 * tane, Math.min(0.9, gr));
      h += m[5] * (h0 + lerp(lerp(0.26 * oluk * egik, 0.34 + 0.05 * lifO, astar) - 0.45 * yarik, 0.3 * (1 - tane), Math.min(0.9, gr)));
    }
    // zımpara: ince taneli
    if (m[6] > 0.004) {
      const z = zimB(x, y)[0];
      const t = smooth(0.1, 0.5, z) * (0.6 + 0.4 * zimA(x / 1.1, y / 1.1));
      d += m[6] * ink0 * (0.7 + 0.45 * t);
      h += m[6] * (h0 + 0.18 * (1 - t));
    }
    // gerçek yaprak: ince ağsı damarlar
    if (m[7] > 0.004) {
      const w = retW(x + retB(X, Yc) * 6, y);
      const ag = 1 - smooth(0.0, 0.1, w[1]);
      d += m[7] * ink0 * (0.85 - 0.35 * ag + 0.25 * (retB(X * 3, Yc * 3) - 0.5));
      h += m[7] * (h0 + 0.18 * ag);
    }
    // fırçalanmış macun: yatay fırça izleri
    if (m[8] > 0.004) {
      const a = macA(X * 0.25, Yc * 2.2), b = macB(X, Yc);
      d += m[8] * ink0 * (0.6 + 0.8 * (1 - a) + 0.2 * (b - 0.5));
      h += m[8] * (h0 + 0.3 * a);
    }
    for (let k = 0; k < 9; k++) top += m[k];
    // tutkal ve ip: kabarık, üstü silinmiş
    const tu = TUT[j];
    if (tu > 0.004) { h += tu * 1.15; d *= 1 - 0.7 * tu; }
    H[i] = h;
    // tarlatanla elle silme: geniş dalgalanma ve çapraz silme izleri
    const sil = 0.74 + 0.5 * silF(X, Yc) + 0.16 * (silS(X * 0.6 + Yc * 0.4, Yc * 0.9 - X * 0.3) - 0.5);
    d *= sil;
    // levha tonu: düz yüzeylerde bile kalan ince nötr zar
    LT[i] = 0.1 + 0.16 * tonF(X, Yc) * Math.min(1, top);
    const cr = RN[i4] / 255, cg = RN[i4 + 1] / 255, cb = RN[i4 + 2] / 255;
    TR[i] = Math.exp(-d * -Math.log(Math.max(0.03, cr)));
    TG[i] = Math.exp(-d * -Math.log(Math.max(0.03, cg)));
    TB[i] = Math.exp(-d * -Math.log(Math.max(0.03, cb)));
  }
}

// ------------------------------------------------------------------ kenarda biriken mürekkep ve kâğıt kabartması
const sdLevha = (X, Yc) => {
  const cx = (PL.x1 + PL.x2) / 2, cy = (PL.y1 + PL.y2) / 2, hx = (PL.x2 - PL.x1) / 2 - PL.r, hy = (PL.y2 - PL.y1) / 2 - PL.r;
  const qx = Math.abs(X - cx) - hx, qy = Math.abs(Yc - cy) - hy;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - PL.r;
};
const Hb = new Float32Array(H);
bulanikDizi(Hb, 0.6 * O);
// kâğıt yüksekliği: kenar boşluğu basılmamış (en yüksek), levha üstünde yüksek parçalar kâğıdı daha çok bastırır
const P = new Float32Array(N * N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; const s = sdLevha(x / O, y / O); const ic = smooth(1.2, -1.2, s); P[i] = lerp(3.4, 2.1 - Hb[i] * 0.85, ic); }
bulanikDizi(P, 0.5 * O);
const EMB = kabartma(P, 0.85 * O);
const kagit = kagitDokusu(7414);
const KAGIT = hex('#F2EDE2');
const NOTR = hex('#5A5248').map((v) => -Math.log(v));
const img = ctx.createImageData(N, N);
const px = img.data;
for (let y = 1; y < N - 1; y++) {
  for (let x = 1; x < N - 1; x++) {
    const i = y * N + x, X = x / O, Yc = y / O;
    const s = sdLevha(X, Yc);
    const ic = smooth(0.6, -0.6, s);
    const gx = (Hb[i + 1] - Hb[i - 1]) * 0.5 * O, gy = (Hb[i + N] - Hb[i - N]) * 0.5 * O;
    let kenar = smooth(0.08, 0.6, Math.hypot(gx, gy)) * ic;
    // levhanın kesik kenarı mürekkep tutar
    kenar = Math.max(kenar, smooth(-6, -1, s) * ic * 0.8);
    const lif = (kagit[i] - 0.5) * 0.05;
    let r = KAGIT[0] + lif, g = KAGIT[1] + lif, b = KAGIT[2] + lif;
    if (ic > 0) {
      const p = 1 + kenar * 2.0;
      const lt = LT[i] + kenar * 0.75;
      const tr = Math.pow(TR[i], p) * Math.exp(-lt * NOTR[0]);
      const tg = Math.pow(TG[i], p) * Math.exp(-lt * NOTR[1]);
      const tb = Math.pow(TB[i], p) * Math.exp(-lt * NOTR[2]);
      r = lerp(r, r * tr, ic); g = lerp(g, g * tg, ic); b = lerp(b, b * tb, ic);
    }
    const e = 1 + EMB[i];
    px[i * 4] = clamp(r * e) * 255;
    px[i * 4 + 1] = clamp(g * e) * 255;
    px[i * 4 + 2] = clamp(b * e) * 255;
    px[i * 4 + 3] = 255;
  }
}
// kenar satır/sütunları kâğıt rengi
for (let k = 0; k < N; k++) for (const i of [k, (N - 1) * N + k, k * N, k * N + N - 1]) { px[i * 4] = KAGIT[0] * 255; px[i * 4 + 1] = KAGIT[1] * 255; px[i * 4 + 2] = KAGIT[2] * 255; px[i * 4 + 3] = 255; }
ctx.putImageData(img, 0, 0);
SAHNE.hazir();
</script>
