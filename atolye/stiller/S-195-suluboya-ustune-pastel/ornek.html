<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-195 Suluboya Üstüne Pastel — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fffdf8; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-195 Suluboya Üstüne Pastel — hayalî bir ressamın karışık teknik eli.
// Pürüzlü (rough) beyaz suluboya kâğıdına önce saydam, sıcak ışıklı suluboya lavileri; kuruyunca
// seçili yerlere yumuşak pastel: güneşin çevresinde halka halka sürülüp parmakla yedirilmiş
// sarı-beyaz parıltı, bulutların ışıklı tepeleri, kubbenin aydınlık yanında kaburga yönünde
// açık yeşil vuruşlar, taşın ışık alan yüzleri ve taç yapraklar. Pastel yalnız kâğıt dişinin
// tepelerine tutunur; çukurlarda alttaki saydam lavi görünür. Çizgi (kontur) yoktur.
(function () {
  'use strict';
  try {
  // ================================================================ h7 ortak çekirdek
  // Sahne modeli (öğe kimlik haritası), ışık hesabı, form koordinatları ve malzeme yardımcıları.
  // 2048 iç çözünürlük; koordinatlar 1024 sahne biriminde düşünülür (px = birim * K).
  const K = 2, WW = 1024 * K, NN = WW * WW;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { let t = (v - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

  // tamsayı karması → [0,1)
  function h2(i, j, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  // değer gürültüsü (256 tablolu, yumuşak ara değerli)
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  // ayrılabilir kutu bulanıklığı (Float32, w×h)
  function bulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => bulanik(bulanik(bulanik(src, w, h, r), w, h, r), w, h, r); // ≈ Gauss

  // renk rampası: [[t,'#hex'],...] → hızlı değerlendirme (sonuç cr, cg, cb'ye)
  let cr = 0, cg = 0, cb = 0;
  function rampa(dizi) { return { t: dizi.map((d) => d[0]), c: dizi.map((d) => hex(d[1])) }; }
  function rmp(R, t) {
    const T = R.t, C = R.c, n = T.length;
    if (t <= T[0]) { cr = C[0][0]; cg = C[0][1]; cb = C[0][2]; return; }
    for (let i = 1; i < n; i++) {
      if (t <= T[i]) {
        const k = (t - T[i - 1]) / (T[i] - T[i - 1]), a = C[i - 1], b = C[i];
        cr = a[0] + (b[0] - a[0]) * k; cg = a[1] + (b[1] - a[1]) * k; cb = a[2] + (b[2] - a[2]) * k; return;
      }
    }
    cr = C[n - 1][0]; cg = C[n - 1][1]; cb = C[n - 1][2];
  }

  // ışık: sağ üstten, hafif önden
  const LX = 0.55, LY = -0.55, LZ = 0.63, LN = Math.hypot(LX, LY, LZ);
  const Lx = LX / LN, Ly = LY / LN, Lz = LZ / LN;
  const Hx0 = Lx, Hy0 = Ly, Hz0 = Lz + 1, HN = Math.hypot(Hx0, Hy0, Hz0);
  const Hx = Hx0 / HN, Hy = Hy0 / HN, Hz = Hz0 / HN;

  // öğe tipleri
  const T_GOK = 1, T_ZEMIN = 2, T_MGOVDE = 3, T_MCIKMA = 4, T_MSEREFE = 5, T_MKORK = 6, T_MTOPUZ = 7, T_ALTIN = 8, T_HILAL = 9,
    T_MPENC = 10, T_ZIKZAK = 11, T_KAIDE = 12, T_KORNIS = 13, T_KPENC = 14, T_KASNAK = 15, T_KASPENC = 16, T_KUBBE = 17,
    T_SAP = 18, T_YAPRAK = 19, T_TOMURCUK = 20, T_TAC = 21, T_COBEK = 22, T_ERKEK = 23;
  const DONEL = new Set([T_MGOVDE, T_MCIKMA, T_MSEREFE, T_MKORK, T_MTOPUZ, T_ALTIN]);
  const YAPI = new Set([T_MGOVDE, T_MCIKMA, T_MSEREFE, T_MKORK, T_MTOPUZ, T_ALTIN, T_HILAL, T_MPENC, T_ZIKZAK, T_KAIDE, T_KORNIS, T_KPENC, T_KASNAK, T_KASPENC, T_KUBBE]);
  const BITKI = new Set([T_SAP, T_YAPRAK, T_TOMURCUK, T_TAC, T_COBEK, T_ERKEK]);

  // ---------------------------------------------------------------- kimlik haritası
  // Her öğe ayrı kimlik rengiyle çizilir; kenar yumuşatması karışımları sağlama ile ayıklanır.
  function kimlikHaritasi() {
    const cv = SAHNE.yeniTuval(WW, WW), c = cv.getContext('2d', { willReadFrequently: true });
    c.setTransform(K, 0, 0, K, 0, 0);
    const EL = [null];
    const yeni = (tip, veri) => { EL.push(Object.assign({ tip }, veri || {})); return EL.length - 1; };
    const sag = (id) => (Math.imul(id, 2654435761) >>> 24) & 255;
    const renk = (id) => `rgb(${(id & 63) * 4 + 2},${((id >> 6) & 63) * 4 + 2},${sag(id)})`;
    const dol = (d, id) => { c.fillStyle = renk(id); c.fill(typeof d === 'string' ? new Path2D(d) : d); };
    const dik = (x1, y1, x2, y2) => SAHNE.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
    // gök ve yer
    let id = yeni(T_GOK); c.fillStyle = renk(id); c.fillRect(0, 0, 1024, 1024);
    id = yeni(T_ZEMIN); c.fillStyle = renk(id); c.fillRect(0, 800, 1024, 224);
    // minare
    const alemCiz = (a) => {
      dol(SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), yeni(T_ALTIN, { parca: 'yaka' }));
      dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), yeni(T_ALTIN, { parca: 'cubuk' }));
      for (const k of a.kureler) dol(SAHNE.daireYolu(k.cx, k.cy, k.r), yeni(T_ALTIN, { parca: 'kure', k }));
      dol(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), yeni(T_HILAL, { h: a.hilal }));
    };
    for (const p of SAHNE.minareParcalari()) {
      if (p.tip === 'bant') continue;
      if (p.tip === 'alem') { alemCiz(p.alem); continue; }
      let tip = T_MGOVDE;
      if (p.ad.startsWith('çıkma')) tip = T_MCIKMA;
      else if (p.ad.startsWith('şerefe')) tip = T_MSEREFE;
      else if (p.tip === 'korkuluk') tip = T_MKORK;
      else if (p.tip === 'topuz') tip = T_MTOPUZ;
      const d = p.tip === 'poligon' ? SAHNE.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : dik(p.x1, p.y1, p.x2, p.y2);
      dol(d, yeni(tip, { ad: p.ad, p }));
    }
    { // zikzak şeritleri
      const zid = yeni(T_ZIKZAK);
      c.strokeStyle = renk(zid); c.lineWidth = 3.4; c.lineJoin = 'miter';
      for (const z of SAHNE.zikzakCizgileri()) c.stroke(new Path2D(SAHNE.yol(z)));
    }
    for (const w of SAHNE.minarePencereleri) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_MPENC, { w }));
    // kaide
    const KD = SAHNE.kaide;
    dol(dik(KD.x1, KD.y1, KD.x2, KD.y2), yeni(T_KAIDE));
    dol(dik(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2, KD.kornis.y2), yeni(T_KORNIS));
    for (const w of KD.pencereler) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_KPENC, { w }));
    // kasnak (alttan üste)
    for (let k = 1; k >= 0; k--) {
      const q = SAHNE.kasnak[k];
      dol(dik(q.x1, q.y1, q.x2, q.y2), yeni(T_KASNAK, { kat: k, q, R: (q.x2 - q.x1) / 2 }));
      for (const w of SAHNE.kasnakPencereleri(k)) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_KASPENC, { w, kat: k }));
    }
    // kubbe ve alemi
    dol(SAHNE.kubbeYolu, yeni(T_KUBBE));
    alemCiz(SAHNE.alemParcalari(560, 300, 1));
    // bitkiler
    const B = SAHNE.bitki;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4.2;
    for (const s of B.saplar) { c.strokeStyle = renk(yeni(T_SAP, { s })); c.stroke(new Path2D(SAHNE.yol(s))); }
    for (const y of B.yapraklar) dol(SAHNE.yaprakYolu(y), yeni(T_YAPRAK, { y }));
    for (const t of B.tomurcuklar) dol(SAHNE.tomurcukYolu(t), yeni(T_TOMURCUK, { t }));
    B.cicekler.forEach((cc, ci) => {
      const taclar = SAHNE.tacYapraklari(cc);
      const ids = [];
      taclar.forEach((e, i) => { const tid = yeni(T_TAC, { e, c: cc, i, ci }); ids.push(tid); dol(SAHNE.elipsYolu(e), tid); });
      taclar.forEach((e, i) => { EL[ids[i]].ust = taclar.slice(i + 1); });
      dol(SAHNE.daireYolu(cc.x, cc.y, cc.r * 0.18), yeni(T_COBEK, { c: cc }));
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2 + cc.aci;
        const sx = cc.x + Math.cos(a) * cc.r * 0.27, sy = cc.y + Math.sin(a) * cc.r * 0.27, sr = Math.max(1.3, cc.r * 0.04);
        dol(SAHNE.daireYolu(sx, sy, sr), yeni(T_ERKEK, { c: cc, sx, sy, sr }));
      }
    });
    // çözümle
    const v = c.getImageData(0, 0, WW, WW).data;
    const ID = new Uint16Array(NN), YOK = 65535, nE = EL.length;
    for (let i = 0; i < NN; i++) {
      const r = v[i * 4], g = v[i * 4 + 1], b = v[i * 4 + 2];
      if ((r & 3) !== 2 || (g & 3) !== 2) { ID[i] = YOK; continue; }
      const k = (r >> 2) | ((g >> 2) << 6);
      ID[i] = k > 0 && k < nE && sag(k) === b ? k : YOK;
    }
    // tek başına kalan (komşularının hiçbirine uymayan) pikseller de şüpheli
    for (let y = 1; y < WW - 1; y++) for (let x = 1; x < WW - 1; x++) {
      const i = y * WW + x, k = ID[i];
      if (k === YOK) continue;
      if (ID[i - 1] !== k && ID[i + 1] !== k && ID[i - WW] !== k && ID[i + WW] !== k) ID[i] = YOK;
    }
    for (let gec = 0; gec < 4; gec++) {
      let kalan = 0;
      for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
        const i = y * WW + x;
        if (ID[i] !== YOK) continue;
        let best = YOK;
        const aday = [x > 0 ? ID[i - 1] : YOK, x < WW - 1 ? ID[i + 1] : YOK, y > 0 ? ID[i - WW] : YOK, y < WW - 1 ? ID[i + WW] : YOK];
        for (const a of aday) if (a !== YOK && (best === YOK || a > best)) best = a;
        if (best !== YOK) ID[i] = best; else kalan++;
      }
      if (!kalan) break;
    }
    for (let i = 0; i < NN; i++) if (ID[i] === YOK) ID[i] = 1;
    // dönel öğeler için satır başına yatay uçlar
    const UC = new Map();
    for (let y = 0; y < WW; y++) {
      const o = y * WW;
      for (let x = 0; x < WW; x++) {
        const k = ID[o + x];
        if (!DONEL.has(EL[k].tip)) continue;
        let u = UC.get(k);
        if (!u) { u = { a: new Int16Array(WW).fill(32767), b: new Int16Array(WW).fill(-1), y0: y, y1: y }; UC.set(k, u); }
        if (x < u.a[y]) u.a[y] = x;
        if (x > u.b[y]) u.b[y] = x;
        if (y > u.y1) u.y1 = y;
      }
    }
    return { ID, EL, UC, TIP: Uint8Array.from(EL.map((e) => (e ? e.tip : 0))) };
  }

  // kimlik haritasını hafifçe titreterek okuma (el çizgisi gibi kenarlar)
  function titrekKimlik(H, genlik, olcek, tohum) {
    const n1 = gurultu(tohum), n2 = gurultu(tohum + 1), out = new Uint16Array(NN), A = genlik * K, s = 1 / (olcek * K);
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const dx = (n1(x * s, y * s) - 0.5) * 2 * A + (n1(x * s * 3.1 + 40, y * s * 3.1) - 0.5) * 0.6 * A;
      const dy = (n2(x * s, y * s) - 0.5) * 2 * A + (n2(x * s * 3.1, y * s * 3.1 + 40) - 0.5) * 0.6 * A;
      const xx = clamp(Math.round(x + dx), 0, WW - 1), yy = clamp(Math.round(y + dy), 0, WW - 1);
      out[y * WW + x] = H.ID[yy * WW + xx];
    }
    return out;
  }

  // ---------------------------------------------------------------- bulut yoğunluğu (1024)
  function bulutAlani(tohum, yerler) {
    const r = SAHNE.rng(tohum), F = new Float32Array(1024 * 1024), TAB = new Float32Array(1024 * 1024).fill(-1);
    yerler = yerler || [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
    const kabarcik = (x, y, rr, taban) => {
      const x0 = Math.max(0, Math.floor(x - rr * 1.7)), x1 = Math.min(1023, Math.ceil(x + rr * 1.7));
      const y0 = Math.max(0, Math.floor(y - rr * 1.7)), y1 = Math.min(1023, Math.ceil(y + rr * 1.7));
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
        const d = Math.hypot((xx - x) / 1.06, yy - y) / rr;
        const v = Math.exp(-d * d * 1.7);
        const j = yy * 1024 + xx;
        F[j] += v;
        if (v > 0.05 && (TAB[j] < 0 || taban < TAB[j])) TAB[j] = taban;
      }
    };
    for (const [bx, by, bs] of yerler) {
      const taban = by + 22 * bs;
      // taban sırası
      const n1 = 6 + Math.floor(r() * 3);
      for (let i = 0; i < n1; i++) {
        const t = i / (n1 - 1) - 0.5, rr = (18 + 8 * r()) * bs * (1 - Math.abs(t) * 0.3);
        kabarcik(bx + t * 175 * bs + (r() - 0.5) * 10 * bs, taban - rr * 0.65, rr, taban);
      }
      // orta kat
      const n2 = 3 + Math.floor(r() * 2);
      for (let i = 0; i < n2; i++) {
        const t = (i / (n2 - 1) - 0.5) * 0.62 + (r() - 0.5) * 0.08, rr = (25 + 9 * r()) * bs;
        kabarcik(bx + t * 200 * bs, taban - 26 * bs - rr * 0.45, rr, taban);
      }
      // tepe
      const n3 = 1 + Math.floor(r() * 2);
      for (let i = 0; i < n3; i++) {
        const rr = (21 + 8 * r()) * bs;
        kabarcik(bx + (r() - 0.45) * 60 * bs, taban - 52 * bs - rr * 0.35, rr, taban);
      }
    }
    // düz tabanlar
    for (let j = 0; j < 1024 * 1024; j++) {
      F[j] = 1 - Math.exp(-1.25 * F[j]);
      if (TAB[j] > 0) { const y = (j / 1024) | 0; F[j] *= sstep(TAB[j] + 4, TAB[j] - 9, y); }
    }
    return { F, TAB };
  }

  // ---------------------------------------------------------------- gölgelendirme (deferred)
  // P: palet (rampalar). Çıktı: R,G,B (hedef renk), LT (ışık 0..1), FU/FV (form koordinatı, px).
  function golgele(H, IDW, P, o) {
    o = o || {};
    const { EL, UC, TIP } = H;
    const R = new Float32Array(NN), G = new Float32Array(NN), Bc = new Float32Array(NN);
    const LT = new Float32Array(NN), FU = new Float32Array(NN), FV = new Float32Array(NN);
    const nz = gurultu(77), nz2 = gurultu(78);
    // kubbe profili satır tablosu
    const prof = SAHNE.kubbeProfili(800);
    const kr = new Float32Array(WW), kd = new Float32Array(WW);
    for (let row = 0; row < WW; row++) {
      const y = (row + 0.5) / K;
      if (y < 300 || y > 556) continue;
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = clamp((a.y - y) / (a.y - b.y || 1), 0, 1);
      kr[row] = Math.max(0.5, a.r + (b.r - a.r) * t);
      kd[row] = (a.r - b.r) / Math.max(1e-3, a.y - b.y); // dr/dy (aşağı doğru artar)
    }
    const bulut = o.bulut || bulutAlani(31);
    const BF = bulut.F;
    const bF = (x, y) => BF[clamp(y | 0, 0, 1023) * 1024 + clamp(x | 0, 0, 1023)];
    const gx = SAHNE.gunes.x, gy = SAHNE.gunes.y;
    const PI = Math.PI;
    // bitkilerin kuma düşen gölgesi (sola-aşağı)
    let GOL = null;
    if (P.zeminGolge) {
      const m = new Float32Array(1024 * 1024);
      for (let yy = 0; yy < 1024; yy++) for (let xx = 0; xx < 1024; xx++) {
        const sx = xx + 9, sy = yy - 7;
        if (sx < 0 || sx > 1023 || sy < 0 || sy > 1023) continue;
        const t = TIP[H.ID[(sy * K) * WW + sx * K]];
        if (BITKI.has(t)) m[yy * 1024 + xx] = 1;
      }
      GOL = bulanik3(m, 1024, 1024, 3);
    }
    for (let py = 0; py < WW; py++) {
      const y = (py + 0.5) / K;
      for (let px = 0; px < WW; px++) {
        const x = (px + 0.5) / K, i = py * WW + px, id = IDW[i], el = EL[id], tip = TIP[id];
        let lt = 0.6, fu = py, fv = px;
        switch (tip) {
          case T_GOK: {
            rmp(P.gok, y / 800);
            let r0 = cr, g0 = cg, b0 = cb;
            const d = Math.hypot(x - gx, y - gy);
            const parilti = Math.exp(-(d * d) / (2 * P.gunesR * P.gunesR)) * P.gunesG;
            const [sr, sg, sb] = P.gunes;
            r0 += (sr - r0) * parilti; g0 += (sg - g0) * parilti; b0 += (sb - b0) * parilti;
            if (P.gunesIc) {
              const pi = Math.exp(-(d * d) / (2 * P.gunesIcR * P.gunesIcR)) * P.gunesIcG;
              const [ir, ig, ib] = P.gunesIc;
              r0 += (ir - r0) * pi; g0 += (ig - g0) * pi; b0 += (ib - b0) * pi;
            }

          }

  // ---------------------------------------------------------------- tarama (prosedürel kalem/pastel vuruşu)
  // u: vuruşlara dik koordinat, v: vuruş boyunca (px). aralik: şerit aralığı, boy: vuruş boyu.

    const k = sstep(1 - p - 0.13, 1 - p + 0.13, 0.55 * DP[i] + 0.45 * D[i]);
    PA[i] = k; PR[i] = cr0; PG[i] = cg0; PB[i] = cb0;
  }
  // güneş parıltısında pastel tozu parmakla yedirilir (yumuşak, çukurlara da işler)
  {
    const yum = new Float32Array(NN);
    for (let i = 0; i < NN; i++) yum[i] = PA[i];
    const yb = bulanik3(yum, WW, WW, 10);
    for (let i = 0; i < NN; i++) {
      const tip = H.TIP[IDW[i]];
      if (tip !== T_GOK) continue;
      const x = i % WW, y = (i / WW) | 0;
      const rr = Math.hypot(x - gx, y - gy) / K;
      const w = sstep(340, 50, rr) * 0.92;
      if (w <= 0) continue;
      const v = Math.min(1, yb[i] * 1.5 + 0.55 * sstep(150, 20, rr) * (0.7 + 0.3 * D[i]));
      if (v > PA[i]) {
        const nk = PA[i] + (v - PA[i]) * w;
        if (PA[i] < 0.01) { const t = sstep(80, 230, rr); PR[i] = lerp(sar[0], beyaz[0], t * 0.5); PG[i] = lerp(sar[1], beyaz[1], t * 0.5); PB[i] = lerp(sar[2], beyaz[2], t * 0.5); }
        PA[i] = nk;
      }
    }
  }
  for (let i = 0; i < NN; i++) {
    const k = PA[i];
    if (k <= 0.002) continue;
    OR[i] += (PR[i] - OR[i]) * k; OG[i] += (PG[i] - OG[i]) * k; OB[i] += (PB[i] - OB[i]) * k;
  }
  bas(OR, OG, OB);
  } finally {
    SAHNE.hazir();
  }
})();
