<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-017 Puantilizm — resmin tamamı küçük, ayrı, saf renk noktalarından oluşur (Seurat, Signac).
// Noktalar Poisson diski ile dağıtılır; her noktada hedef renk, on iki saf boyadan oluşan sınırlı bir
// paletin olasılıklı karışımına ayrıştırılır (doğrusal ışıkta optik karışım) ve o karışımdan tek bir saf
// renk seçilir. Kontur boyunca ışınım (irradiation) halesi, aralarda astarlı bez, kenarda tamamlayıcı
// renklerle noktalanmış bir çerçeve.
(function () {
  'use strict';
  const W = 1024, N = W * W, S2 = 2, W2 = W * S2;
  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, S2);
  const R = SAHNE.rng(1886);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const nA = gurultu(41), nB = gurultu(42);

  // ------------------------------------------------------------ bölgeler ve ışık
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(1, kubbeR[clamp(Math.round(y), 300, 555)]), -1, 1);
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), u = kubbeU(x, y), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / Math.hypot(u, dr, c));
  }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));

  // ------------------------------------------------------------ hedef: parlak, renkli gölgeli tablo
  const RAMPA = {
    kubbe: [[0, [34, 92, 104]], [0.3, [40, 120, 92]], [0.55, [58, 156, 82]], [0.78, [130, 196, 84]], [0.92, [206, 222, 112]], [1, [244, 236, 160]]],
    kasnak: [[0, [30, 76, 96]], [0.35, [38, 108, 90]], [0.65, [54, 144, 80]], [1, [124, 186, 84]]],
    tas: [[0, [150, 136, 196]], [0.35, [192, 174, 206]], [0.6, [232, 214, 196]], [0.82, [250, 236, 206]], [1, [255, 248, 226]]],
    altin: [[0, [200, 100, 50]], [0.5, [240, 180, 60]], [1, [252, 232, 130]]],
  };
  const hc0 = SAHNE.yeniTuval(W, W), h0 = hc0.getContext('2d', { willReadFrequently: true });
  {
    const img = h0.createImageData(W, W), d = img.data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, b = ADLAR[BOL[i]];
      let c;
      if (b === 'kubbe') c = rampa(RAMPA.kubbe, kubbeIsik(x, y));
      else if (b === 'kasnak') { const ust = y < 610; let l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.9 : 1); if (ust && y < 568) l *= 0.55; if (!ust && y < 618) l *= 0.65; c = rampa(RAMPA.kasnak, l); }
      else if (b === 'kaide') { let l = 0.45 + 0.5 * clamp((x - 300) / 520, 0, 1); if (y < 704) l = 0.97; else if (y < 714) l *= 0.45; if (y > 788) l *= 0.75; c = rampa(RAMPA.tas, l); }
      else if (b === 'minare') { let l = silindirIsik(x, 300, minareYari(y)); if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) l *= 0.4; l *= 1 - 0.55 * minareGolge(x, y); c = rampa(RAMPA.tas, l); }
      else if (b === 'altin') { const cx = x > 430 ? 560 : 300; c = rampa(RAMPA.altin, clamp(0.5 + (x - cx) / 12, 0, 1)); }
      else if (b === 'pencere') { const kas = y > 555 && y < 692 && x > 330 && x < 790; c = kas ? [26, 56, 96] : [92, 70, 140]; }
      else if (y < 800) {
        const t = y / 800;
        c = rampa([[0, [96, 146, 220]], [0.4, [138, 182, 232]], [0.72, [190, 214, 236]], [0.9, [242, 228, 214]], [1, [250, 222, 178]]], t + (nA(x / 200, y / 140) - 0.5) * 0.08);
        const dd = Math.hypot(x - 880, y - 140);
        const hale = Math.exp(-(dd * dd) / (2 * 170 * 170));
        c = mixc(c, [248, 244, 236], 0.8 * hale);
        c = mixc(c, [255, 236, 168], 0.75 * hale * hale);
        c = mixc(c, [255, 252, 236], sstep(60, 38, dd));
      } else {
        const yer = 826 + (fbm(nB, x / 60, 3, 3) - 0.5) * 50;
        if (y < yer) c = [232, 196, 128];
        else { const t = fbm(nA, x / 40, y / 40, 3); c = rampa([[0, [30, 76, 84]], [0.45, [44, 120, 80]], [0.75, [96, 166, 72]], [1, [170, 200, 92]]], t * 1.3 - 0.1); }
      }
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    h0.putImageData(img, 0, 0);
    const rb = SAHNE.rng(3);
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]]) {
      for (let i = 0; i < 14; i++) {
        const x = bx + (rb() - 0.5) * 150 * bs, y = by + (rb() - 0.5) * 30 * bs, r = (22 + rb() * 26) * bs;
        const g = h0.createRadialGradient(x, y - r * 0.3, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,252,240,0.55)'); g.addColorStop(0.65, 'rgba(240,226,240,0.3)'); g.addColorStop(1, 'rgba(210,196,236,0)');
        h0.fillStyle = g; h0.beginPath(); h0.arc(x, y, r, 0, Math.PI * 2); h0.fill();
      }
    }
    // ince yapı ayrıntıları
    h0.strokeStyle = 'rgb(150,120,190)'; h0.lineWidth = 3;
    for (const z of SAHNE.zikzakCizgileri()) { h0.beginPath(); z.forEach(([x, y], i) => (i ? h0.lineTo(x, y) : h0.moveTo(x, y))); h0.stroke(); }
    for (const [x1, x2, y1, y2] of [[252, 348, 436, 456], [260, 340, 272, 290]]) {
      for (let k = 0; k < 10; k++) { const x = x1 + 5 + ((x2 - x1 - 10) * (k + 0.5)) / 10; h0.fillStyle = 'rgba(120,96,170,0.8)'; h0.fillRect(x - 2, y1 + 4, 4, y2 - y1 - 8); }
    }
    for (const k of SAHNE.kaburgalar(16, 60)) {
      h0.strokeStyle = 'rgba(20,70,90,0.45)'; h0.lineWidth = 2;
      h0.beginPath(); k.noktalar.forEach(([x, y], i) => (i ? h0.lineTo(x, y) : h0.moveTo(x, y))); h0.stroke();
    }
    // bitkiler
    const B = SAHNE.bitki;
    h0.lineCap = 'round';
    for (const s of B.saplar) { h0.strokeStyle = 'rgb(70,130,70)'; h0.lineWidth = 5; h0.stroke(new Path2D(SAHNE.yol(s))); }
    for (const yp of B.yapraklar) {
      const p = new Path2D(SAHNE.yaprakYolu(yp));
      const nx = -Math.sin(yp.aci), ny = Math.cos(yp.aci), isikli = nx * 0.74 + ny * -0.67 > 0 ? 1 : -1, w2 = yp.uzunluk * yp.genislik * 0.5;
      const g = h0.createLinearGradient(yp.x - nx * w2 * isikli, yp.y - ny * w2 * isikli, yp.x + nx * w2 * isikli, yp.y + ny * w2 * isikli);
      const k = yp.uzunluk > 50 ? 0.85 : 1;
      g.addColorStop(0, `rgb(${30 * k},${84 * k},${94 * k})`); g.addColorStop(0.5, `rgb(${50 * k},${136 * k},${76 * k})`); g.addColorStop(1, `rgb(${160 * k},${204 * k},${90 * k})`);
      h0.fillStyle = g; h0.fill(p);
    }
    for (const t of B.tomurcuklar) { h0.fillStyle = 'rgb(236,130,160)'; h0.fill(new Path2D(SAHNE.tomurcukYolu(t))); }
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const p = new Path2D(SAHNE.elipsYolu(e));
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
        const g = h0.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        g.addColorStop(0, 'rgb(244,176,196)'); g.addColorStop(0.4, 'rgb(255,250,242)'); g.addColorStop(1, 'rgb(255,252,246)');
        h0.fillStyle = g; h0.fill(p);
        h0.fillStyle = `rgba(170,160,226,${clamp(-yon * 0.6 + 0.1, 0, 0.7)})`; h0.fill(p);
      }
      h0.fillStyle = 'rgb(246,180,50)'; h0.beginPath(); h0.arc(c.x, c.y, c.r * 0.22, 0, Math.PI * 2); h0.fill();
      h0.fillStyle = 'rgb(220,110,40)'; h0.beginPath(); h0.arc(c.x - c.r * 0.05, c.y + c.r * 0.05, c.r * 0.1, 0, Math.PI * 2); h0.fill();
    }
  }
  // ışınım (irradiation): kontur boyunca açık yan daha açık, koyu yan daha koyu
  const T = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
  {
    const v = h0.getImageData(0, 0, W, W).data;
    for (let i = 0; i < N; i++) for (let k = 0; k < 3; k++) T[k][i] = v[i * 4 + k];
    // gökteki yumuşak geçişlerde (güneş halesi) hale istenmez: yalnız yapı ve bitki konturlarında
    const ag = new Float32Array(N);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, b = BOL[i];
      ag[i] = b === BI.gok || b === BI.gunes ? sstep(170, 300, Math.hypot(x - 880, y - 140)) : 1;
    }
    const agB = kutuBulanik(ag, W, W, 4);
    for (let k = 0; k < 3; k++) {
      const B1 = kutuBulanik(kutuBulanik(kutuBulanik(T[k], W, W, 6), W, W, 6), W, W, 6);
      for (let i = 0; i < N; i++) T[k][i] = clamp(T[k][i] + 0.95 * agB[i] * (T[k][i] - B1[i]), 0, 255);
    }
  }
  const hedef = (x, y) => { const i = clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1); return [T[0][i], T[1][i], T[2][i]]; };

  // ------------------------------------------------------------ palet ve ayrıştırma (doğrusal ışıkta optik karışım)
  const PALET = [
    [250, 248, 240], // beyaz
    [250, 226, 64],  // limon sarısı
    [244, 150, 40],  // turuncu
    [224, 58, 44],   // vermilyon
    [206, 66, 120],  // kırmızı gül
    [126, 74, 176],  // mor
    [48, 60, 172],   // ultramarin
    [62, 118, 210],  // kobalt
    [104, 182, 226], // seruleum
    [34, 150, 92],   // zümrüt
    [150, 198, 58],  // sarı-yeşil
    [22, 92, 86],    // koyu viridyen
    [250, 238, 182], // açık sarı (beyazla kırılmış)
    [196, 222, 244], // açık mavi
    [244, 200, 212], // açık gül
  ];
  const lin = (v) => Math.pow(v / 255, 2.2);
  const PL = PALET.map((c) => c.map(lin));
  const PD = PL.map((c) => Math.sqrt(c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11)); // her boyanın değeri
  const TAMAMLAYICI = [5, 5, 6, 9, 10, 1, 2, 2, 3, 4, 5, 3, 13, 12, 13]; // her rengin karşıtı (titreşim kıvılcımı)
  const LUT = new Map();
  function ayristir(c) {
    const q = 12;
    const key = (Math.round(c[0] / q) << 10) | (Math.round(c[1] / q) << 5) | Math.round(c[2] / q);
    let r = LUT.get(key);
    if (r) return r;
    const t = [lin(Math.round(c[0] / q) * q), lin(Math.round(c[1] / q) * q), lin(Math.round(c[2] / q) * q)].map((v) => Math.min(1, v));
    let en = 1e9, best = null;
    const n = PL.length, st = 0.1;
    const td = Math.sqrt(t[0] * 0.3 + t[1] * 0.59 + t[2] * 0.11);
    for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let d = b + 1; d < n; d++) {
      const A = PL[a], B = PL[b], D = PL[d];
      for (let wa = 0; wa <= 1.0001; wa += st) for (let wb = 0; wb <= 1.0001 - wa; wb += st) {
        const wd = 1 - wa - wb;
        const m0 = A[0] * wa + B[0] * wb + D[0] * wd, m1 = A[1] * wa + B[1] * wb + D[1] * wd, m2 = A[2] * wa + B[2] * wb + D[2] * wd;
        // algısal (kök) uzayda hata + çeşitlilik ödülü (tek renge yığılmasın)
        const e0 = Math.sqrt(m0) - Math.sqrt(t[0]), e1 = Math.sqrt(m1) - Math.sqrt(t[1]), e2 = Math.sqrt(m2) - Math.sqrt(t[2]);
        const enb = Math.max(wa, wb, wd);

        const e = e0 * e0 * 0.9 + e1 * e1 * 1.2 + e2 * e2 * 0.8 + 0.006 * enb * enb + 0.012 * deger * deger;
        if (e < en) { en = e; best = [[a, wa], [b, wb], [d, wd]]; }

    }

    LUT.set(key, r);
    return r;
  }
  function noktaRengi(x, y) {
    const c = hedef(x, y);
    const k = ayristir(c);
    let r = R(), tot = 0; for (const p of k) tot += p[1];
    r *= tot;
    let sec = k[0][0];
    for (const p of k) { r -= p[1]; if (r <= 0) { sec = p[0]; break; } }
    // tamamlayıcı titreşim: ara sıra karşıt renkte bir nokta

  }

  // ------------------------------------------------------------ Poisson diski (Bridson)
  function poisson(rmin, x0, y0, x1, y1) {
    const hc = rmin / Math.SQRT2, gw = Math.ceil((x1 - x0) / hc), gh = Math.ceil((y1 - y0) / hc);
    const grid = new Int32Array(gw * gh).fill(-1), pts = [], aktif = [];
    const ekle = (x, y) => { pts.push([x, y]); aktif.push(pts.length - 1); grid[Math.floor((y - y0) / hc) * gw + Math.floor((x - x0) / hc)] = pts.length - 1; };
    ekle(x0 + R() * (x1 - x0), y0 + R() * (y1 - y0));
    while (aktif.length) {
      const ai = Math.floor(R() * aktif.length), [px, py] = pts[aktif[ai]];
      let bulundu = false;
      for (let k = 0; k < 20; k++) {
        const a = R() * Math.PI * 2, d = rmin * (1 + R());
        const x = px + Math.cos(a) * d, y = py + Math.sin(a) * d;
        if (x < x0 || y < y0 || x >= x1 || y >= y1) continue;
        const gx = Math.floor((x - x0) / hc), gy = Math.floor((y - y0) / hc);
        let ok = true;
        for (let j = Math.max(0, gy - 2); j <= Math.min(gh - 1, gy + 2) && ok; j++) for (let i = Math.max(0, gx - 2); i <= Math.min(gw - 1, gx + 2); i++) {
          const q = grid[j * gw + i];
          if (q >= 0) { const dx = pts[q][0] - x, dy = pts[q][1] - y; if (dx * dx + dy * dy < rmin * rmin) { ok = false; break; } }
        }
        if (ok) { ekle(x, y); bulundu = true; break; }
      }
      if (!bulundu) { aktif[ai] = aktif[aktif.length - 1]; aktif.pop(); }
    }
    return pts;
  }

  // ------------------------------------------------------------ astarlı bez
  ctx.fillStyle = '#e2d8c3'; ctx.fillRect(0, 0, W, W);
  const hc = SAHNE.yeniTuval(W2, W2), hctx = hc.getContext('2d', { willReadFrequently: true });
  hctx.setTransform(S2, 0, 0, S2, 0, 0); hctx.fillStyle = '#000'; hctx.fillRect(0, 0, W, W);
  hctx.globalCompositeOperation = 'lighter'; hctx.fillStyle = '#fff';
  const rgb = (c, j) => `rgb(${clamp(Math.round(c[0] * j), 0, 255)},${clamp(Math.round(c[1] * j), 0, 255)},${clamp(Math.round(c[2] * j), 0, 255)})`;
  function nokta(x, y, rr, c) {
    // biraz düzensiz, yuvarlak bir fırça ucu dokunuşu
    const a = R() * Math.PI, e = 0.8 + R() * 0.3;
    ctx.fillStyle = rgb(c, 0.96 + R() * 0.08);
    ctx.beginPath(); ctx.ellipse(x, y, rr, rr * e, a, 0, Math.PI * 2); ctx.fill();
    hctx.globalAlpha = 0.16 + R() * 0.08;
    hctx.beginPath(); hctx.ellipse(x, y, rr * 0.85, rr * 0.85 * e, a, 0, Math.PI * 2); hctx.fill();
    hctx.beginPath(); hctx.ellipse(x + rr * 0.15, y - rr * 0.1, rr * 0.5, rr * 0.45 * e, a, 0, Math.PI * 2); hctx.fill();
  }

  // ------------------------------------------------------------ noktalar: bir alt kat (seyrek) + ana kat
  const CERCEVE = 22;
  const alt = poisson(6.4, 0, 0, W, W);
  for (const [x, y] of alt) nokta(x, y, 2.5, noktaRengi(x, y));
  const ana = poisson(4.3, 0, 0, W, W);
  for (const [x, y] of ana) nokta(x + (R() - 0.5) * 0.6, y + (R() - 0.5) * 0.6, 2.3 + R() * 0.35, noktaRengi(x, y));
  // ayrıntı katı: kontur ve küçük öğelerde daha küçük noktalar
  {
    const KEN = new Uint8Array(N);
    const lum = new Float32Array(N);
    for (let i = 0; i < N; i++) lum[i] = T[0][i] * 0.3 + T[1][i] * 0.59 + T[2][i] * 0.11;
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, g = Math.abs(lum[i + 1] - lum[i - 1]) + Math.abs(lum[i + W] - lum[i - W]);
      const b = ADLAR[BOL[i]];
      if (g > 34 || b === 'altin' || b === 'pencere' || b === 'cicekOrta' || (b === 'minare' && (y < 320 || (y > 430 && y < 490)))) KEN[i] = 1;
    }
    const ince = poisson(2.9, 0, 0, W, W);
    for (const [x, y] of ince) if (KEN[Math.round(y) * W + Math.round(x)] || KEN[Math.round(y) * W + Math.round(x) + 2] || KEN[Math.round(y) * W + Math.round(x) - 2]) nokta(x, y, 1.6, noktaRengi(x, y));
    const altin = poisson(2.1, 520, 170, 600, 312).concat(poisson(2.1, 276, 70, 324, 150));
    for (const [x, y] of altin) if (BOL[Math.round(y) * W + Math.round(x)] === BI.altin) nokta(x, y, 1.25, noktaRengi(x, y));
  }

  // ------------------------------------------------------------ boyalı çerçeve: komşu rengin tamamlayıcısıyla noktalanmış
  {
    // önce bezi kapat, sonra çerçeve noktaları
    ctx.fillStyle = '#e2d8c3';
    ctx.fillRect(0, 0, W, CERCEVE); ctx.fillRect(0, W - CERCEVE, W, CERCEVE); ctx.fillRect(0, 0, CERCEVE, W); ctx.fillRect(W - CERCEVE, 0, CERCEVE, W);
    hctx.globalCompositeOperation = 'source-over'; hctx.globalAlpha = 1; hctx.fillStyle = '#000';
    hctx.fillRect(0, 0, W, CERCEVE); hctx.fillRect(0, W - CERCEVE, W, CERCEVE); hctx.fillRect(0, 0, CERCEVE, W); hctx.fillRect(W - CERCEVE, 0, CERCEVE, W);
    hctx.globalCompositeOperation = 'lighter'; hctx.fillStyle = '#fff';
    const cer = poisson(4.6, 0, 0, W, W).filter(([x, y]) => Math.min(x, y, W - x, W - y) < CERCEVE - 3);
    for (const [x, y] of cer) {
      // çerçeveye en yakın resim noktasının ortalama rengi → tamamlayıcısı, biraz koyultulmuş
      const ix = clamp(x, CERCEVE + 26, W - CERCEVE - 26), iy = clamp(y, CERCEVE + 26, W - CERCEVE - 26);
      let m = [0, 0, 0];
      for (let k = 0; k < 5; k++) { const c = hedef(ix + (R() - 0.5) * 50, iy + (R() - 0.5) * 50); m = [m[0] + c[0] / 5, m[1] + c[1] / 5, m[2] + c[2] / 5]; }
      const mx = Math.max(...m), mn = Math.min(...m);
      let comp = [mx + mn - m[0], mx + mn - m[1], mx + mn - m[2]];
      comp = mixc(comp, [40, 40, 120], 0.55);
      const k = ayristir(comp);
      let r = R(), tot = 0; for (const p of k) tot += p[1];
      r *= tot; let sec = k[0][0];
      for (const p of k) { r -= p[1]; if (r <= 0) { sec = p[0]; break; } }
      nokta(x, y, 2.2 + R() * 0.3, PALET[sec]);
    }
    // resimle çerçeve arasında ince koyu çizgi (noktalarla)
    for (let t = CERCEVE; t <= W - CERCEVE; t += 3.2) {
      for (const [x, y] of [[t, CERCEVE - 1], [t, W - CERCEVE + 1], [CERCEVE - 1, t], [W - CERCEVE + 1, t]]) nokta(x, y, 1.5, R() < 0.6 ? PALET[6] : PALET[5]);
    }
  }

  // ------------------------------------------------------------ boyanın hafif kabartısı ve bez dokusu
  {
    const pv = ctx.getImageData(0, 0, W2, W2), p = pv.data;
    const hv = hctx.getImageData(0, 0, W2, W2).data;
    let H = new Float32Array(W2 * W2);
    for (let i = 0; i < W2 * W2; i++) H[i] = hv[i * 4] / 255;
    H = kutuBulanik(H, W2, W2, 1);
    const ll = Math.hypot(0.6, -0.62, 0.5), Lx = 0.6 / ll, Ly = -0.62 / ll, Lz = 0.5 / ll;
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x;
      const pr = 5.2, cx = Math.floor(x / pr), cy = Math.floor(y / pr);
      const wx = 0.5 + 0.5 * Math.cos((2 * Math.PI * x) / pr), wy = 0.5 + 0.5 * Math.cos((2 * Math.PI * y) / pr);
      const dok = (cx + cy) & 1 ? wy * 0.7 + wx * 0.3 : wx * 0.7 + wy * 0.3;
      const gx = (H[y * W2 + Math.min(W2 - 1, x + 1)] - H[y * W2 + Math.max(0, x - 1)]) * 5;
      const gy = (H[Math.min(W2 - 1, y + 1) * W2 + x] - H[Math.max(0, y - 1) * W2 + x]) * 5;
      const nl = Math.hypot(gx, gy, 1);
      const dif = (-gx * Lx - gy * Ly + Lz) / nl;
      const sh = clamp(1 + (dif - Lz) * 0.8, 0.85, 1.15) * (1 - 0.06 * (1 - dok) * (H[i] < 0.05 ? 1 : 0.3));
      const j = i * 4;
      p[j] = clamp(p[j] * sh, 0, 255); p[j + 1] = clamp(p[j + 1] * sh, 0, 255); p[j + 2] = clamp(p[j + 2] * sh, 0, 255);
    }
    ctx.putImageData(pv, 0, 0);
  }
  SAHNE.hazir();
})();
