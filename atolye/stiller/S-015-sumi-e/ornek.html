<!doctype html>
<html lang="tr">

<meta charset="utf-8">
<title>S-015 Sumi-e (Mürekkep Lavi) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f3eee1; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
'use strict';
// S-015 Sumi-e (Mürekkep Lavi). Az ve kendinden emin vuruş: kubbenin gölge yanı tek bir yan fırça vuruşudur
// (fırçanın ucunda koyu, topuğunda soluk mürekkep), kaburgalar birkaç hızlı, solan çizgi; kasnak farklı
// yoğunlukta fırça noktalarından bir bant. Kaide ve minarenin alt yanı sise karışır; kâğıdın çoğu boş (ma).
// Önde, sol alt köşeden giren yaşlı bir erik dalı: kuru fırçalı (kasure) gövde, dik filizler, kümeler hâlinde
// çiçek ve tomurcuk. Renk çok az: kubbede soluk yeşil, alemlerde okra; yazısız, geometrik kırmızı mühür.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
SAHNE.tuval(tuval, O);
const anaCtx = tuval.getContext('2d');
const R = SAHNE.rng(1515);

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

// ------------------------------------------------------------------ gürültü
const NT = new Float32Array(8192);
{ const r = SAHNE.rng(4242); for (let i = 0; i < NT.length; i++) NT[i] = r(); }
function n1(x) { x += 40960; const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f); return NT[i & 8191] * (1 - s) + NT[(i + 1) & 8191] * s; }
function f1(x) { return n1(x) * 0.55 + n1(x * 2.13 + 31.7) * 0.3 + n1(x * 4.71 + 77.3) * 0.15; }

/** 2B değer gürültüsü (rastgele ızgara büyütülüp bulanıklaştırılır), ortalama 0.5, yayılım ~0.18'e çekilir. */
function gurultu(w, h, hucre, tohum, bulanik, en) {
  en = en || 1;
  const gw = Math.ceil(w / (hucre * en)) + 3, gh = Math.ceil(h / hucre) + 3;
  const k = SAHNE.yeniTuval(gw, gh), kc = k.getContext('2d');
  const id = kc.createImageData(gw, gh), r = SAHNE.rng(tohum);
  for (let i = 0; i < gw * gh; i++) { const v = (r() * 255) | 0; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  kc.putImageData(id, 0, 0);
  const c = SAHNE.yeniTuval(w, h), cc = c.getContext('2d', { willReadFrequently: true });
  cc.imageSmoothingEnabled = true; cc.imageSmoothingQuality = 'high';
  if (bulanik) cc.filter = `blur(${bulanik}px)`;
  cc.drawImage(k, 0, 0, gw, gh, -hucre * en, -hucre, gw * hucre * en, gh * hucre);
  const d = cc.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
  let s = 0, s2 = 0;
  for (let i = 0; i < w * h; i++) { const v = d[i * 4] / 255; out[i] = v; s += v; s2 += v * v; }
  const m = s / (w * h), sd = Math.sqrt(Math.max(1e-6, s2 / (w * h) - m * m));
  for (let i = 0; i < w * h; i++) out[i] = clamp(0.5 + ((out[i] - m) / sd) * 0.18);
  return out;
}
const GR = gurultu(N, N, 1.7, 11, 0.7);        // kâğıdın ince tanesi (kuru fırça bunun tepelerine değer)
const MO = gurultu(1024, 1024, 24, 12, 6);     // lavın bulut gibi düzensizliği
const MH = gurultu(1024, 1024, 7, 13, 1.6);    // lav kenarı ve çiçeklenme tırtığı
const FN = gurultu(N, N, 2.2, 14, 0.9, 6);     // uzamış lifler: mürekkebin yayılma yönü

// ------------------------------------------------------------------ eğri yardımcıları
function ornekle(p, adim) {
  const out = [p[0].slice()];
  let kalan = adim;
  for (let i = 1; i < p.length; i++) {
    let [ax, ay] = p[i - 1];
    const [bx, by] = p[i];
    let L = Math.hypot(bx - ax, by - ay);
    while (L >= kalan) {
      const t = kalan / L;
      ax += (bx - ax) * t; ay += (by - ay) * t;
      out.push([ax, ay]);
      L -= kalan; kalan = adim;
    }
    kalan -= L;
  }
  const son = p[p.length - 1], o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.3) out.push(son.slice());
  return out;
}
/** Catmull-Rom: kontrol noktalarından geçen yumuşak eğri. */
function egri(pts) {
  if (pts.length < 3) return pts.map((p) => p.slice());
  const P = [pts[0], ...pts, pts[pts.length - 1]], out = [];
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    const m = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 3));
    for (let j = 0; j < m; j++) {
      const t = j / m, t2 = t * t, t3 = t2 * t;
      const c = (a, b, cc, d) => 0.5 * (2 * b + (-a + cc) * t + (2 * a - 5 * b + 4 * cc - d) * t2 + (-a + 3 * b - 3 * cc + d) * t3);
      out.push([c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
/** Çoklu çizgiyi kendi normali boyunca d(t) kadar kaydırır (+: hareket yönünün solu). */
function kaydir(pts, d) {
  const n = pts.length;
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1;
    const k = typeof d === 'function' ? d(i / (n - 1)) : d;
    return [p[0] - (ty / m) * k, p[1] + (tx / m) * k];
  });
}
function parca(pts, t0, t1) { const n = pts.length - 1; return pts.slice(Math.round(t0 * n), Math.round(t1 * n) + 1); }

// ------------------------------------------------------------------ sis (ma): kaide ve minarenin alt yanı kâğıda karışır
const SIS = new Float32Array(1024 * 1024);
for (let y = 0; y < 1024; y++) {
  for (let x = 0; x < 1024; x++) {
    const i = y * 1024 + x;
    const n = (MO[i] - 0.5) * 95 + (MH[i] - 0.5) * 26;
    const m = x < 340 ? 1 : x < 372 ? 1 - (x - 340) / 32 : 0;
    const y0 = lerp(700 + (x - 560) * 0.05, 520, m), span = lerp(62, 120, m);
    SIS[i] = 1 - smooth(y0, y0 + span, y + n);
  }
}

// ------------------------------------------------------------------ mürekkep alanları
const DRY = new Float32Array(N * N);   // kuru mürekkep (yayılmaz)
const WET = new Float32Array(N * N);   // ıslak mürekkep (liflere yayılır)
const TD = new Float32Array(N * N), TW = new Float32Array(N * N); // bir vuruşun geçici tamponu (üst üste binme yok)
const YESIL = new Float32Array(1024 * 1024), OKRA = new Float32Array(1024 * 1024);
let bx0, by0, bx1, by1;
const kutuSifirla = () => { bx0 = N; by0 = N; bx1 = -1; by1 = -1; };
function isle() {
  for (let y = Math.max(0, by0); y <= Math.min(N - 1, by1); y++) {
    let i = y * N + Math.max(0, bx0);
    for (let x = Math.max(0, bx0); x <= Math.min(N - 1, bx1); x++, i++) {
      const v = TD[i];
      if (v > 0) { WET[i] += TW[i]; DRY[i] += v - TW[i]; TD[i] = 0; TW[i] = 0; }
    }
  }
}

/**
 * Fırça vuruşu. pts: omurga (1024 koordinatı). Fırça K kıldan oluşur; her kılın kendi mürekkep yükü vardır,
 * vuruş ilerledikçe kuruyan kıl kesilir ve kâğıdın yalnız tanelerine değer (kasure). Islak kısım liflere yayılır.
 * o: w (en geniş, px), prof(t), ink, kuru, kuruBas, islak, K, kenar (px), yanTon [u=-1, u=+1], yanUs, pool, basKoyu, yapi (sis)
 */
function vurus(pts, o) {
  const p = ornekle(pts.map(([x, y]) => [x * O, y * O]), 0.5), n = p.length;
  if (n < 3) return;
  const ink = o.ink == null ? 1 : o.ink, kuru = o.kuru == null ? 0.3 : o.kuru, islak = o.islak == null ? 0.4 : o.islak;
  const kb = o.kuruBas == null ? 0.25 : o.kuruBas;
  const prof = o.prof || P.yaprak;
  const K = o.K || Math.max(5, Math.min(72, Math.round(o.w * 2)));
  const kenarPx = (o.kenar == null ? 0.7 : o.kenar) * O;
  const pool = o.pool || 0, yt = o.yanTon, yus = o.yanUs || 1.4, basK = o.basKoyu == null ? 0.25 : o.basKoyu;
  const X = new Float32Array(n), Y = new Float32Array(n), NX = new Float32Array(n), NY = new Float32Array(n), S = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    X[i] = p[i][0]; Y[i] = p[i][1];
    const a = p[Math.max(0, i - 3)], b = p[Math.min(n - 1, i + 3)];
    const tx = b[0] - a[0], ty = b[1] - a[1], m = Math.hypot(tx, ty) || 1;
    NX[i] = -ty / m; NY[i] = tx / m;
    if (i) S[i] = S[i - 1] + Math.hypot(X[i] - X[i - 1], Y[i] - Y[i - 1]);
  }
  const ph = R() * 500, offL = R() * 500, offR = R() * 500;
  const titre = o.titre == null ? 0.05 : o.titre;
  const HW = new Float32Array(n), KG = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    HW[i] = O * o.w * 0.5 * Math.max(0, prof(t)) * (1 + titre * (f1(S[i] / 60 + ph) - 0.5) * 2);
    KG[i] = Math.pow(Math.max(0, (t - kb) / (1 - kb)), 1.25) * 1.7 * kuru; // kuruma
  }
  // yuvarlak baş / son: fırça kâğıda bastırılıp kalkar (mutlak uzunlukla)
  if (o.bas || o.son) {
    const c0 = HW[Math.min(n - 1, 4)] * 1.1 + 1, c1 = HW[Math.max(0, n - 5)] * 1.1 + 1, L = S[n - 1];
    for (let i = 0; i < n; i++) {
      if (o.bas && S[i] < c0) HW[i] *= Math.sqrt(Math.max(0.02, 1 - (1 - S[i] / c0) ** 2));
      if (o.son && L - S[i] < c1) HW[i] *= Math.sqrt(Math.max(0.02, 1 - (1 - (L - S[i]) / c1) ** 2));
    }
  }
  // kıllar
  const QK = new Float32Array(K), WK = new Float32Array(K), TK = new Float32Array(K), A = new Float32Array(K * n);
  for (let k = 0; k < K; k++) {
    QK[k] = k + (R() - 0.5) * 0.5;
    WK[k] = 0.55 + 0.9 * R();
    TK[k] = 0.86 + 0.28 * R();
    const uk = ((k + 0.5) / K) * 2 - 1;
    const yuk = 1.0 + (R() - 0.5) * 0.3, hiz = (0.7 + 0.6 * R()) * (1 + 0.9 * uk * uk);
    const sc = (18 + R() * 70) * O, off = R() * 900, amp = 0.35 + 0.4 * R();
    for (let i = 0; i < n; i++) {
      const res = yuk - hiz * KG[i] + amp * (f1(S[i] / sc + off) - 0.5) * (0.4 + KG[i]);
      A[k * n + i] = smooth(-0.02, 0.32, res);
    }
  }
  kutuSifirla();
  for (let i = 0; i < n; i++) {
    const hw = HW[i];
    if (hw < 0.3) continue;
    const du = 0.42 / hw, aa = 0.8 / hw;
    const eL = 1 + (kenarPx / hw) * (f1(S[i] / (7 * O) + offL) - 0.5) * 2;
    const eR = 1 + (kenarPx / hw) * (f1(S[i] / (7 * O) + offR) - 0.5) * 2;
    const kg = Math.min(1, KG[i]);
    const wetI = islak * (1 - kg);
    const sp = lerp(0.9, 0.42, kg);
    const boost = ink * (1 + basK * Math.exp(-S[i] / (hw * 1.5 + 4)));
    const xi = X[i], yi = Y[i], nx = NX[i], ny = NY[i];
    for (let u = -1.3; u <= 1.3; u += du) {
      const au = u < 0 ? -u : u, e = u < 0 ? eL : eR;
      if (au > e + aa) continue;
      const em = au < e - aa ? 1 : (e + aa - au) / (2 * aa);
      const px = Math.round(xi + nx * u * hw), py = Math.round(yi + ny * u * hw);
      if (px < 0 || py < 0 || px >= N || py >= N) continue;
      const q = (clamp(u, -1, 1) * 0.5 + 0.5) * K - 0.5;
      const k0 = Math.floor(q);
      let c = 0, tk = 1;
      for (let k = Math.max(0, k0 - 1); k <= Math.min(K - 1, k0 + 2); k++) {
        const d = Math.abs(q - QK[k]), s0 = sp * WK[k];
        const cv = A[k * n + i] * (1 - smooth(s0 - 0.2, s0 + 0.12, d));
        if (cv > c) { c = cv; tk = TK[k]; }
      }
      if (c < 0.004) continue;
      const idx = py * N + px;
      const gg = 0.17 + 0.66 * GR[idx];
      let v = boost * tk * smooth(gg - 0.16, gg + 0.16, c) * em;
      if (yt) v *= lerp(yt[0], yt[1], Math.pow(clamp(u * 0.5 + 0.5), yus));
      if (pool) v *= 1 + pool * Math.exp(-(((au - 0.86) / 0.11) ** 2));
      if (o.yapi) v *= SIS[(py >> 1) * 1024 + (px >> 1)];
      if (v > TD[idx]) {
        TD[idx] = v; TW[idx] = v * wetI;
        if (px < bx0) bx0 = px; if (px > bx1) bx1 = px; if (py < by0) by0 = py; if (py > by1) by1 = py;
      }
    }
  }
  isle();
}
const P = {
  yaprak: (t) => Math.pow(Math.sin(Math.PI * Math.pow(clamp(t), 0.85)), 0.7),
  esit: (t) => Math.min(1, 0.5 + t / 0.05) * Math.min(1, 0.35 + (1 - t) / 0.06),
  kalinInce: (t) => (1 - 0.85 * Math.pow(t, 1.1)) * Math.min(1, 0.55 + t / 0.04),
  inceKalin: (t) => (0.25 + 0.75 * Math.pow(t, 0.7)) * Math.min(1, 0.3 + (1 - t) / 0.05),
  dal: (t) => (1 - 0.3 * t) * Math.min(1, 0.72 + t / 0.03) * Math.min(1, 0.55 + (1 - t) / 0.05),
  filiz: (t) => Math.min(1, 0.6 + t / 0.04) * (0.06 + 0.94 * Math.pow(1 - t, 0.8)),
};

/** Fırça noktası: kenarı tırtıklı, ıslakken kenarda mürekkep birikir. */
function leke(cx, cy, rx, ry, aci, o) {
  const ink = o.ink == null ? 1 : o.ink, islak = o.islak == null ? 0.6 : o.islak, pool = o.pool == null ? 0.25 : o.pool;
  const kenar = o.kenar == null ? 0.12 : o.kenar, ic = o.ic || 0;
  const ca = Math.cos(aci), sa = Math.sin(aci), off = R() * 900;
  const X = cx * O, Yc = cy * O, RX = rx * O, RY = ry * O, M = Math.max(RX, RY) * (1 + kenar) + 2;
  kutuSifirla();
  for (let py = Math.floor(Yc - M); py <= Math.ceil(Yc + M); py++) {
    for (let px = Math.floor(X - M); px <= Math.ceil(X + M); px++) {
      if (px < 0 || py < 0 || px >= N || py >= N) continue;
      const dx = px - X, dy = py - Yc;
      const lx = (dx * ca + dy * sa) / RX, ly = (-dx * sa + dy * ca) / RY;
      const d = Math.hypot(lx, ly);
      const th = Math.atan2(ly, lx);
      const e = 1 + kenar * (f1(th * 1.6 + off) - 0.5) * 2.2 + kenar * (f1(th * 5 + off * 1.3) - 0.5) * 0.8;
      const aa = 1.0 / Math.min(RX, RY);
      if (d > e + aa) continue;
      const em = d < e - aa ? 1 : (e + aa - d) / (2 * aa);
      const idx = py * N + px;
      let v = ink * em * (1 + pool * Math.exp(-(((d / e - 0.88) / 0.12) ** 2))) * (1 - ic * Math.pow(1 - clamp(d / e), 1.5));
      v *= 0.9 + 0.2 * GR[idx];
      if (o.yapi) v *= SIS[(py >> 1) * 1024 + (px >> 1)];
      if (v > TD[idx]) {
        TD[idx] = v; TW[idx] = v * islak;
        if (px < bx0) bx0 = px; if (px > bx1) bx1 = px; if (py < by0) by0 = py; if (py > by1) by1 = py;
      }
    }
  }
  isle();
}

/**
 * Lav: maske çizilir ve bulanıklaştırılır; eşiği gürültüyle tırtıklanır, kuruyan kenarda mürekkep birikir,
 * içte tanelenir; isteğe bağlı çiçeklenme (geri akma) lekeleri. hedef: 'D' kuru mürekkep, 'W' ıslak, 'G' yeşil, 'K' okra.
 */
function lav(ciz, o) {
  const tint = o.hedef === 'G' || o.hedef === 'K';
  const s = tint ? 1 : O, W = 1024 * s;
  const c = SAHNE.yeniTuval(W, W), x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(s, 0, 0, s, 0, 0);
  if (o.bul) x.filter = `blur(${o.bul * s}px)`;
  x.fillStyle = '#000'; x.strokeStyle = '#000';
  ciz(x);
  const k = o.kutu || [0, 0, 1024, 1024], pad = (o.bul || 0) * 3;
  const kx = Math.max(0, Math.floor((k[0] - pad) * s)), ky = Math.max(0, Math.floor((k[1] - pad) * s));
  const kw = Math.min(W, Math.ceil((k[2] + pad) * s)) - kx, kh = Math.min(W, Math.ceil((k[3] + pad) * s)) - ky;
  const d = x.getImageData(kx, ky, kw, kh).data;
  const esik = o.esik == null ? 0.15 : o.esik, yum = o.yum == null ? 0.05 : o.yum, kenar = o.kenar == null ? 0.4 : o.kenar;
  const tirtik = o.tirtik == null ? 1 : o.tirtik, gr = o.gr == null ? 0.25 : o.gr, gam = o.gam == null ? 0.8 : o.gam;
  const cic = o.cicek || [];
  const hedef = o.hedef === 'G' ? YESIL : o.hedef === 'K' ? OKRA : o.hedef === 'W' ? WET : DRY;
  for (let li = 0; li < kw * kh; li++) {
    const m = d[li * 4 + 3] / 255;
    if (m < 0.004) continue;
    const px = kx + (li % kw), py = ky + ((li / kw) | 0);
    const fx = px / s, fy = py / s, q = (fy | 0) * 1024 + (fx | 0);
    const e = m + ((MO[q] - 0.5) * 0.32 + (MH[q] - 0.5) * 0.14) * tirtik;
    const ici = smooth(esik - yum, esik + yum, e);
    if (ici <= 0) continue;
    const rim = Math.exp(-(((e - esik - yum * 0.6) / 0.045) ** 2));
    const g = tint ? 0.5 : GR[py * N + px];
    let v = o.ton * (ici * Math.pow(m, gam) * (0.8 + 0.4 * MO[q]) * (1 + gr * (g - 0.5) * 2) + kenar * rim * ici);
    for (const b of cic) {
      const dd = Math.hypot(fx - b.x, (fy - b.y) * (b.sy || 1)) / b.r + (MH[q] - 0.5) * 0.55 + (MO[q] - 0.5) * 0.3;
      const bi = smooth(1.03, 0.94, dd), br = Math.exp(-(((dd - 1) / 0.05) ** 2));
      v = v * (1 - (b.ac || 0.6) * bi) + o.ton * (b.koyu || 0.7) * br * (v > 0.002 ? 1 : 0);
    }
    if (o.maske) v *= o.maske(fx, fy);
    if (o.yapi) v *= SIS[q];
    if (tint) hedef[q] = 1 - (1 - hedef[q]) * (1 - clamp(v));
    else hedef[py * N + px] += v;
  }
}

// ------------------------------------------------------------------ geometri
const KR = (() => {
  const p = SAHNE.kubbeProfili(2000), out = new Float32Array(1030);
  let j = 0;
  for (let k = out.length - 1; k >= 0; k--) {
    const y = 300 + k / 4;
    if (y >= 555) { out[k] = p[0].r; continue; }
    while (j < p.length - 2 && p[j + 1].y > y) j++;
    const a = p[j], b = p[j + 1];
    out[k] = lerp(a.r, b.r, clamp((a.y - y) / (a.y - b.y || 1)));
  }
  return out;
})();
const kubbeR = (y) => { if (y < 300 || y > 555) return 0; const i = (y - 300) * 4, i0 = Math.floor(i); return lerp(KR[i0], KR[Math.min(i0 + 1, KR.length - 1)], i - i0); };
const L3 = (() => { const v = [0.62, 0.55, 0.56], m = Math.hypot(...v); return v.map((a) => a / m); })();
function kubbeIsik(x, y) {
  const r = kubbeR(y);
  if (r < 0.5) return 0.8;
  const phi = Math.asin(clamp((x - 560) / r, -1, 1));
  const y0 = Math.max(300, y - 1), y1 = Math.min(555, y + 1);
  const qq = -(kubbeR(y1) - kubbeR(y0)) / (y1 - y0 || 1);
  const nr = 1 / Math.sqrt(1 + qq * qq), nh = -qq * nr;
  return L3[0] * nr * Math.sin(phi) + L3[1] * nh + L3[2] * nr * Math.cos(phi);
}

  for (const [x, y, r] of [[30, 1000, 4], [56, 978, 3], [94, 960, 3.6], [84, 930, 2.4], [150, 898, 2.6], [186, 856, 3.6], [200, 800, 2.8], [213, 742, 2.4], [232, 925, 3], [314, 893, 2.6], [380, 866, 2.2], [975, 777, 3.4], [1012, 758, 2.6], [930, 793, 2.8], [870, 784, 2.2]]) {
    leke(x, y, r * 1.25, r, R() * 3, { ink: 1.95, islak: 0.7, kenar: 0.22 });
  }
  // çiçekler (x, y, r, tip, açı)
  cicekler.push(
    [126, 930, 30, 'tam', 0.3], [182, 868, 21, 'yan', -0.6], [99, 766, 20, 'tam', 1.1], [128, 846, 12, 'tomurcukA', -2.4],
    [213, 742, 22, 'tam', 0.8], [240, 638, 15, 'yan', -0.2], [232, 598, 5.5, 'tomurcuk', -1.4], [247, 556, 4.6, 'tomurcuk', -1.6],
    [266, 698, 18, 'tam', 2.0], [268, 804, 21, 'tam', 0.1], [306, 899, 32, 'tam', 1.5], [354, 846, 15, 'yan', -0.3],
    [426, 752, 17, 'tam', 0.6], [412, 800, 5.5, 'tomurcuk', -2.6], [452, 869, 25, 'tam', 2.4], [503, 855, 13, 'yan', -1.2],
    [555, 849, 5, 'tomurcuk', -0.3], [80, 799, 7, 'tomurcukA', -2.8], [56, 892, 19, 'lav', 0.5], [226, 964, 21, 'lav', 1.0],
    [910, 795, 25, 'tam', 0.9], [866, 786, 16, 'yan', -0.4], [806, 741, 19, 'tam', 1.7], [846, 688, 12, 'tomurcukA', -1.5],
    [934, 650, 17, 'tam', 0.4], [929, 592, 13, 'yan', 0.2], [931, 536, 4.8, 'tomurcuk', -1.5], [937, 702, 5.5, 'tomurcuk', 0.1],
    [986, 742, 17, 'lav', 0.2], [1001, 720, 5.5, 'tomurcuk', -1.2], [766, 760, 13, 'lav', 1.3]
  );
}

/** Önde duran çiçeğin arkasındaki dalı siler (ressam çiçeğin yerini boş bırakır). */
function ayir(cx, cy, r) {
  const X = cx * O, Yc = cy * O, M = r * O * 1.05;
  for (let py = Math.floor(Yc - M); py <= Math.ceil(Yc + M); py++) {
    for (let px = Math.floor(X - M); px <= Math.ceil(X + M); px++) {
      if (px < 0 || py < 0 || px >= N || py >= N) continue;
      const d = Math.hypot(px - X, py - Yc) / M;
      const k = smooth(1, 0.82, d);
      if (k > 0) { const i = py * N + px; DRY[i] *= 1 - k; WET[i] *= 1 - k; }
    }
  }
}
/** Çiçeğin yerel düzleminden kâğıda: döndür, bir eksende bas (perspektif), merkeze taşı. */
function donustur(x, y, aci, sy) {
  const ca = Math.cos(aci), sa = Math.sin(aci);
  return (lx, ly) => { const u = lx * ca + ly * sa, v = (-lx * sa + ly * ca) * sy; return [x + u * ca - v * sa, y + u * sa + v * ca]; };
}
/** Taç yaprağı: iki kısa, ince kavis (sol, sağ) dışta buluşur; arada bazen boşluk kalır. */
function tacYaprak(cx, cy, th, pr, ink, T) {
  const yay = (a0, a1) => { const out = []; for (let j = 0; j <= 16; j++) { const a = lerp(a0, a1, j / 16); const rr = pr * (1 + 0.05 * Math.sin(j * 0.7)); out.push(T(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr)); } return out; };
  const w = Math.max(1.3, pr * 0.14);
  vurus(yay(th - 1.8 + (R() - 0.5) * 0.3, th + 0.06 - R() * 0.15), { w, prof: P.yaprak, ink: ink * (0.8 + 0.35 * R()), kuru: 0.4, islak: 0.55, K: 5, kenar: 0.3 });
  if (R() < 0.85) vurus(yay(th + 1.8 + (R() - 0.5) * 0.3, th + 0.14 + R() * 0.12), { w: w * 0.85, prof: P.yaprak, ink: ink * (0.7 + 0.35 * R()), kuru: 0.5, islak: 0.55, K: 5, kenar: 0.3 });
}
/** Ercikler: hafif kavisli ince kıllar, uçlarında koyu noktalar; arada serbest polen noktaları. */
function ercik(T, r, a0, a1, adet) {
  for (let i = 0; i < adet; i++) {
    const a = lerp(a0, a1, (i + 0.5) / adet) + (R() - 0.5) * 0.5, L = r * (0.4 + 0.32 * R());
    const bk = (R() - 0.5) * 0.4;
    const e = T(Math.cos(a) * L, Math.sin(a) * L);
    vurus(egri([T(Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1), T(Math.cos(a + bk) * L * 0.55, Math.sin(a + bk) * L * 0.55), e]), { w: 0.95, prof: P.esit, ink: 1.15, kuru: 0.3, K: 3, kenar: 0.1 });
    leke(e[0], e[1], Math.max(1.4, r * 0.075), Math.max(1.1, r * 0.06), a, { ink: 1.95, islak: 0.45, kenar: 0.18 });
  }
  for (let i = 0; i < Math.round(adet / 3); i++) {
    const a = lerp(a0, a1, R()), L = r * (0.3 + 0.35 * R()), e = T(Math.cos(a) * L, Math.sin(a) * L);
    leke(e[0], e[1], 1.1, 0.9, a, { ink: 1.7, islak: 0.4 });
  }
}
function cicekCiz([x, y, r, tip, a]) {
  if (tip === 'tam') {
    // tam açmış çiçek; her biri başka bir açıdan görülür (bir eksende basık)
    const sy = 0.62 + 0.38 * R(), T = donustur(x, y, R() * Math.PI, sy);
    ayir(x, y, r * 1.02);
    const atla = (R() * 9) | 0;
    for (let k = 0; k < 5; k++) {
      const th = a + (k * TAU) / 5 + (R() - 0.5) * 0.25, d = r * 0.5 * (0.9 + 0.2 * R());
      tacYaprak(Math.cos(th) * d, Math.sin(th) * d, th, r * 0.45 * (0.88 + 0.24 * R()), k === atla ? 0.42 : 0.66, T);
    }
    const ea = R() * TAU;
    ercik(T, r, ea, ea + TAU * (0.75 + 0.25 * R()), r > 20 ? 9 : 7);
    leke(x, y, r * 0.08, r * 0.07, 0, { ink: 1.2, islak: 0.4 });
  } else if (tip === 'yan') {
    // yandan görünen çiçek: üç taç yaprak, altta koyu çanak, üstte yelpaze gibi ercikler
    const T = donustur(x, y, 0, 1);
    ayir(x, y, r * 0.95);
    for (const da of [-0.95, 0, 0.95]) {
      const th = a + da, d = r * 0.42;
      tacYaprak(Math.cos(th) * d, Math.sin(th) * d, th, r * 0.44 * (0.9 + 0.2 * R()), 0.66, T);
    }
    const bx = x - Math.cos(a) * r * 0.32, by = y - Math.sin(a) * r * 0.32;
    for (const da of [-0.7, 0, 0.7]) leke(bx + Math.cos(a + Math.PI + da) * r * 0.16, by + Math.sin(a + Math.PI + da) * r * 0.16, r * 0.17, r * 0.11, a + da, { ink: 1.9, islak: 0.6, kenar: 0.2 });
    ercik(donustur(x + Math.cos(a) * r * 0.1, y + Math.sin(a) * r * 0.1, 0, 1), r * 1.25, a - 0.75, a + 0.75, 6);
  } else if (tip === 'tomurcukA') {
    // açık tomurcuk: yuvarlak çizgi ve iki koyu çanak noktası
    ayir(x, y, r * 0.8);
    const yay = []; for (let j = 0; j <= 20; j++) { const t = a + 1.2 + (j / 20) * (TAU - 0.6); yay.push([x + Math.cos(t) * r * 0.62, y + Math.sin(t) * r * 0.62]); }
    vurus(yay, { w: Math.max(1.4, r * 0.14), prof: P.yaprak, ink: 0.8, kuru: 0.35, K: 5, kenar: 0.3 });
    for (const da of [-0.5, 0.5]) leke(x - Math.cos(a + da) * r * 0.62, y - Math.sin(a + da) * r * 0.62, r * 0.22, r * 0.15, a + da, { ink: 1.9, islak: 0.6 });
  } else if (tip === 'tomurcuk') {
    leke(x, y, r * 1.0, r * 0.82, a, { ink: 1.85, islak: 0.65, pool: 0.3, kenar: 0.15 });
  } else if (tip === 'lav') {
    // kemiksiz (mogu): beş soluk lav noktası, kenarı hafifçe koyulaşır
    const T = donustur(x, y, R() * Math.PI, 0.7 + 0.3 * R());
    for (let k = 0; k < 5; k++) {
      const th = a + (k * TAU) / 5 + (R() - 0.5) * 0.2, d = r * 0.5, c = T(Math.cos(th) * d, Math.sin(th) * d);
      leke(c[0], c[1], r * 0.48, r * 0.42, th, { ink: 0.16 + 0.06 * R(), islak: 0.9, pool: 0.55, kenar: 0.14 });
    }
    ercik(T, r * 0.9, a, a + TAU, 6);
  }
}
for (const c of cicekler.filter((c) => c[3] === 'lav')) cicekCiz(c);
for (const c of cicekler.filter((c) => c[3] !== 'lav')) cicekCiz(c);

// ================================================================== MÜHÜR (kırmızı, yazısız: geometrik desen)
function muhur(x0, y0, s) {
  const c = SAHNE.yeniTuval(N, N), m = c.getContext('2d', { willReadFrequently: true });
  m.setTransform(O, 0, 0, O, 0, 0);
  m.fillStyle = '#000';
  m.beginPath(); m.moveTo(x0 + 1, y0); m.lineTo(x0 + s - 0.5, y0 + 1); m.lineTo(x0 + s, y0 + s - 1); m.lineTo(x0 + 0.5, y0 + s); m.closePath(); m.fill();
  m.globalCompositeOperation = 'destination-out';
  m.lineJoin = 'miter'; m.lineWidth = s * 0.055;
  m.strokeRect(x0 + s * 0.12, y0 + s * 0.12, s * 0.76, s * 0.76);
  const cx = x0 + s / 2, cy = y0 + s / 2, r = s * 0.27;
  for (const d of [0, Math.PI / 4]) {
    m.beginPath();
    for (let i = 0; i < 4; i++) { const a = d + (i * Math.PI) / 2 + Math.PI / 4; const px = cx + Math.cos(a) * r * 1.06, py = cy + Math.sin(a) * r * 1.06; i ? m.lineTo(px, py) : m.moveTo(px, py); }
    m.closePath(); m.stroke();
  }
  m.lineWidth = s * 0.045;
  m.strokeRect(cx - s * 0.06, cy - s * 0.06, s * 0.12, s * 0.12);
  const x1 = Math.floor(x0 * O) - 2, y1 = Math.floor(y0 * O) - 2, w = Math.ceil(s * O) + 4;
  return { x1, y1, w, d: m.getImageData(x1, y1, w, w).data };
}

// ================================================================== BİRLEŞTİRME
(() => {
  // ıslak mürekkebin liflere yayılması: kutu bulanıklığı (3 geçiş) ile hale
  function bulanik(src, r) {
    const a = new Float32Array(src), b = new Float32Array(N * N);
    for (let pass = 0; pass < 3; pass++) {
      for (let y = 0; y < N; y++) {
        const o = y * N; let s = 0;
        for (let x = -r; x <= r; x++) s += a[o + clamp(x, 0, N - 1)];
        for (let x = 0; x < N; x++) { b[o + x] = s / (2 * r + 1); s += a[o + Math.min(N - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < N; x++) {
        let s = 0;
        for (let y = -r; y <= r; y++) s += b[clamp(y, 0, N - 1) * N + x];
        for (let y = 0; y < N; y++) { a[y * N + x] = s / (2 * r + 1); s += b[Math.min(N - 1, y + r + 1) * N + x] - b[Math.max(0, y - r) * N + x]; }
      }
    }
    return a;
  }
  const B1 = bulanik(WET, 1), B2 = bulanik(WET, 4);
  const mh = muhur(904, 868, 36);
  const muhurDoku = gurultu(N / 2, N / 2, 2, 157, 0.6);
  // kâğıda gömülü kıvrık uzun lifler
  const LIFC = (() => {
    const c = SAHNE.yeniTuval(N, N), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(O, 0, 0, O, 0, 0); x.lineCap = 'round';
    const r = SAHNE.rng(158);
    for (let i = 0; i < 1400; i++) {
      let px = r() * 1024, py = r() * 1024, a = r() * TAU;
      x.lineWidth = 0.35 + r() * 0.4;
      x.strokeStyle = `rgba(0,0,0,${(0.2 + r() * 0.5).toFixed(2)})`;
      x.beginPath(); x.moveTo(px, py);
      const L = 8 + r() * 46;
      for (let k = 0; k < L; k += 2) { a += (r() - 0.5) * 0.45; px += Math.cos(a) * 2; py += Math.sin(a) * 2; x.lineTo(px, py); }
      x.stroke();
    }
    const d = x.getImageData(0, 0, N, N).data, out = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) out[i] = d[i * 4 + 3] / 255;
    return out;
  })();
  const out = anaCtx.createImageData(N, N), o = out.data;
  const kagit = [243, 237, 224], yesil = [146, 186, 132], okra = [210, 156, 64], dip = [17, 17, 19];
  const kab = [1.42, 1.45, 1.5];
  const H2 = N >> 1;
  for (let y = 0; y < N; y++) {
    const yy = y >> 1;
    for (let x = 0; x < N; x++) {
      const i = y * N + x, j = i * 4, q = yy * 1024 + (x >> 1);
      const fn = FN[i], mo = MO[q];
      // kâğıt: sıcak beyaz, hafif bulutlanma, lifler; kenarlara doğru çok hafif kararır
      const ex = Math.min(x, y, N - 1 - x, N - 1 - y) / N;
      let kt = 1 - 0.02 * (mo - 0.5) * 2 - 0.035 * LIFC[i] + 0.012 * smooth(0.6, 0.85, fn) - 0.025 * (1 - smooth(0, 0.12, ex));
      let r = kagit[0] * kt, g = kagit[1] * kt, b = kagit[2] * kt;
      const ye = YESIL[q] * 0.62, ok = OKRA[q] * 0.85;
      r *= lerp(1, yesil[0] / 255, ye); g *= lerp(1, yesil[1] / 255, ye); b *= lerp(1, yesil[2] / 255, ye);
      r *= lerp(1, okra[0] / 255, ok); g *= lerp(1, okra[1] / 255, ok); b *= lerp(1, okra[2] / 255, ok);
      // mürekkep: kuru + ıslak + liflere yayılan hale
      const w = WET[i];
      const yay = smooth(0.32, 0.72, fn);
      let D = DRY[i] + w + Math.max(0, B1[i] - w) * 0.55 + Math.max(0, B2[i] - w) * 0.5 * yay;
      D *= 0.93 + 0.14 * fn - 0.08 * LIFC[i];
      if (D > 0.0005) {
        r = dip[0] + (r - dip[0]) * Math.exp(-kab[0] * D);
        g = dip[1] + (g - dip[1]) * Math.exp(-kab[1] * D);
        b = dip[2] + (b - dip[2]) * Math.exp(-kab[2] * D);
      }
      // mühür
      const mx = x - mh.x1, my = y - mh.y1;
      if (mx >= 0 && my >= 0 && mx < mh.w && my < mh.w) {
        const ma = mh.d[(my * mh.w + mx) * 4 + 3] / 255;
        if (ma > 0) {
          const md = muhurDoku[(yy * H2) + (x >> 1)];
          const kap = ma * (0.8 + 0.2 * mo) * (1 - 0.85 * smooth(0.7, 0.86, md));
          r = lerp(r, (r * 192) / 255, kap); g = lerp(g, (g * 50) / 255, kap); b = lerp(b, (b * 40) / 255, kap);
        }
      }
      o[j] = r; o[j + 1] = g; o[j + 2] = b; o[j + 3] = 255;
    }
  }
  anaCtx.setTransform(1, 0, 0, 1, 0, 0);
  anaCtx.putImageData(out, 0, 0);
})();

SAHNE.hazir();
