<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-019 Art Deco — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f2e8cf; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-019 Art Deco — 1920-30'lar seyahat afişi, aydınlık öğle vakti: geometrik bakışım, kubbenin ardında
// güneş patlaması, basamaklı (zigurat) krem çerçeve, gök mavisinden beyaza şeritli gök, ışınlı soluk sarı
// güneş, metalik altın çizgiler, yelpaze ve pul motifleri, hız çizgileri; krem, yeşim, gök mavisi ve altın.
(function () {
  const S = SAHNE;
  const K = 2;
  const ctx = S.tuval(document.getElementById('tuval'), K);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

  const C = {
    siyah: '#173f48', zumrutKoyu: '#11604a', zumrut: '#1a8462', zumrut2: '#22916a', yesim: '#4fb08a', yesimAcik: '#9fd6bc',
    krem: '#f4e9cc', kremGolge: '#dccb9c', kremAcik: '#fdf8e8', mavi: '#2f86c4', maviAcik: '#8cc8ea',
    cerceve: '#f2e8cf', lacivert: '#1f5f96',
  };
  // metalik altın: tuval boyunca parlayıp sönen degrade
  const ALTIN = ctx.createLinearGradient(0, 0, 1024, 1024);
  [[0, '#8a6418'], [0.12, '#e9cb72'], [0.24, '#b98c2c'], [0.38, '#f6e09a'], [0.5, '#a97c22'], [0.63, '#eac867'], [0.76, '#9c7320'], [0.88, '#f1d685'], [1, '#b8892b']].forEach(([t, c]) => ALTIN.addColorStop(t, c));
  const altinCizgi = (p, w) => { ctx.strokeStyle = ALTIN; ctx.lineWidth = w; ctx.lineJoin = 'miter'; ctx.stroke(typeof p === 'string' ? P2(p) : p); };
  const doldur = (p, f) => { ctx.fillStyle = f; ctx.fill(typeof p === 'string' ? P2(p) : p); };

  // ------------------------------------------------------------ çerçeve: basamaklı (zigurat) tepe
  const IC = [[30, 1000], [30, 74], [246, 74], [246, 54], [368, 54], [368, 34], [656, 34], [656, 54], [778, 54], [778, 74], [994, 74], [994, 1000]];
  const icYol = P2(S.yol(IC, true));
  ctx.fillStyle = C.cerceve;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.save();
  ctx.clip(icYol);
  // ------------------------------------------------------------ 1. şeritli gök (seyahat afişi)
  const SERIT = [
    [34, 136, '#3f92d2', '#4b9bd8'], [136, 222, '#56a4dc', '#63ade1'], [222, 300, '#6fb6e5', '#7dbfe9'],
    [300, 372, '#8bc8ec', '#98cfee'], [372, 438, '#a5d6f0', '#b0dcf1'], [438, 498, '#bbe1f2', '#c5e6f3'],
    [498, 552, '#cfeaf3', '#d7eef3'], [552, 604, '#ddf0f2', '#e2f2f1'], [604, 652, '#e5f3f0', '#e8f4ef'],
    [652, 700, '#eaf4ee', '#ecf5ee'], [700, 752, '#edf5ed', '#eef5ec'], [752, 800, '#eff5eb', '#f0f5ea'],
  ];
  for (const [y1, y2, c1, c2] of SERIT) {
    const g = ctx.createLinearGradient(0, y1, 0, y2);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.fillRect(0, y1, 1024, y2 - y1 + 0.6);
  }
  for (const [y1] of SERIT.slice(1)) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(0, y1 - 0.6, 1024, 1.2); }

  // ------------------------------------------------------------ 2. güneş patlaması (kubbenin ardında)
  const GM = { x: 560, y: 560 };
  {
    const n = 40;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI + (i / n) * Math.PI, a1 = Math.PI + ((i + 1) / n) * Math.PI;
      const p = new Path2D();
      p.moveTo(GM.x, GM.y);
      p.lineTo(GM.x + Math.cos(a0) * 1400, GM.y + Math.sin(a0) * 1400);
      p.lineTo(GM.x + Math.cos(a1) * 1400, GM.y + Math.sin(a1) * 1400);
      p.closePath();
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.16)' : 'rgba(20,80,130,0.05)';
      ctx.fill(p);
    }
    ctx.globalAlpha = 0.55;
    for (let i = 0; i <= n; i += 2) {
      const a = Math.PI + (i / n) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(GM.x + Math.cos(a) * 300, GM.y + Math.sin(a) * 300);
      ctx.lineTo(GM.x + Math.cos(a) * 1400, GM.y + Math.sin(a) * 1400);
      ctx.strokeStyle = ALTIN; ctx.lineWidth = 0.9; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // eş merkezli yaylar: solda minarenin ardından çıkar, sağda hız çizgilerinin üst çizgisine (y 500)
    // iner ve baklava uçlukla biter
    const YB = 500, YL = 440;
    const ucA = (r) => [Math.PI + Math.asin((GM.y - YL) / r), TAU - Math.asin((GM.y - YB) / r)];
    for (const r of [298, 314]) { const [a0, a1] = ucA(r); ctx.beginPath(); ctx.arc(GM.x, GM.y, r, a0, a1); ctx.strokeStyle = ALTIN; ctx.lineWidth = r === 298 ? 2 : 1.1; ctx.stroke(); }
    const [b0, b1] = ucA(306);
    {
      ctx.save(); ctx.translate(GM.x + 306 * Math.cos(b1), YB); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = ALTIN; ctx.fillRect(-6, -6, 12, 12);
      ctx.strokeStyle = C.lacivert; ctx.lineWidth = 1; ctx.strokeRect(-6, -6, 12, 12);
      ctx.fillStyle = C.maviAcik; ctx.fillRect(-2.4, -2.4, 4.8, 4.8);
      ctx.restore();
    }
    // iki yay arasında altın boncuk dizisi
    for (let i = 0; i <= 52; i++) {
      const a = b0 + ((i + 0.5) / 54) * (b1 - b0);
      ctx.beginPath(); ctx.arc(GM.x + Math.cos(a) * 306, GM.y + Math.sin(a) * 306, i % 5 === 0 ? 3.2 : 1.8, 0, TAU);
      ctx.fillStyle = i % 5 === 0 ? C.maviAcik : ALTIN; ctx.fill();
    }
  }

  // ------------------------------------------------------------ 3. güneş: yüksekte, ışın taçlı soluk sarı disk
  {
    // ışın tacı zigurat çerçevenin altında kesilmeden sığsın diye disk biraz küçük ve 14 px aşağıda
    const x = S.gunes.x, y = S.gunes.y + 14;
    // basamaklı ışın tacı: uzun ve kısa üçgen ışınlar dönüşümlü
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU + TAU / 48, w = 0.085, r1 = 53, r2 = i % 2 ? 64 : 74;
      const p = new Path2D();
      p.moveTo(x + Math.cos(a - w) * r1, y + Math.sin(a - w) * r1);
      p.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
      p.lineTo(x + Math.cos(a + w) * r1, y + Math.sin(a + w) * r1);
      p.closePath();
      doldur(p, i % 2 ? '#fdf6d2' : '#fbeeb0');
      altinCizgi(p, 0.8);
    }
    const d = P2(S.daireYolu(x, y, 46));
    const g = ctx.createRadialGradient(x - 13, y - 13, 4, x, y, 48);
    g.addColorStop(0, '#fffdf2'); g.addColorStop(0.6, '#fdf4c8'); g.addColorStop(1, '#f8e7a0');
    doldur(d, g);
    // eş merkezli ince halkalar (Deco güneşi)
    for (const r of [20, 33]) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.strokeStyle = 'rgba(214,176,80,0.55)'; ctx.lineWidth = 0.9; ctx.stroke(); }
    altinCizgi(d, 1.6);
    ctx.beginPath(); ctx.arc(x, y, 53, 0, TAU); ctx.strokeStyle = ALTIN; ctx.lineWidth = 0.8; ctx.stroke();
  }

  // ------------------------------------------------------------ 4. akış çizgili bulutlar ve hız çizgileri
  function bulut(x, y, ayna) {
    const satir = [[0, 0, 150, 13], [26, 17, 128, 13], [-14, 34, 112, 11]];
    for (const [dx, dy, w, h] of satir) {
      const xx = ayna ? x - dx - w : x + dx;
      const p = new Path2D();
      p.roundRect(xx, y + dy, w, h, h / 2);
      doldur(p, 'rgba(255,255,255,0.94)');
      altinCizgi(p, 1);
    }
  }
  bulut(70, 392, false);
  bulut(960, 232, true);
  const hiz = (x1, x2, y, n) => { for (let i = 0; i < n; i++) { ctx.fillStyle = ALTIN; ctx.fillRect(x1, y + i * 8, x2 - x1, 1.3); } };
  hiz(30, 258, 330, 3);
  hiz(770, 994, 500, 3);
  hiz(560, 994, 302, 2);

  // ------------------------------------------------------------ 5. minare (akış çizgili, basamaklı)
  const parcalar = S.minareParcalari();
  {
    const golge = (yol, x1, x2) => {
      ctx.save(); ctx.clip(yol);
      ctx.fillStyle = C.kremGolge; ctx.fillRect(x1 - 1, 0, (x2 - x1) * 0.34 + 1, 1024);
      ctx.fillStyle = C.kremAcik; ctx.fillRect(x1 + (x2 - x1) * 0.66, 0, (x2 - x1) * 0.12, 1024);
      ctx.restore();
    };
    for (const p of parcalar) {
      if (p.tip === 'bant' || p.tip === 'alem') continue;
      const c = S.minare.cx;
      if (p.ad.startsWith('çıkma')) { // basamaklı konsol
        const [[ax, ay], [bx, by]] = [p.noktalar[0], p.noktalar[1]];
        const w0 = c - ax, w1 = c - bx, h = ay - by;
        for (let k = 0; k < 3; k++) {
          const w = w0 + ((w1 - w0) * (k + 1)) / 3, ya = ay - (h * k) / 3, yb = ay - (h * (k + 1)) / 3;
          const r = P2(dik(c - w, yb, c + w, ya));
          doldur(r, k % 2 ? C.krem : C.kremGolge); golge(r, c - w, c + w); altinCizgi(r, 1);
        }
        continue;
      }
      let d, x1, x2;
      if (p.tip === 'poligon') { d = S.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
      else if (p.tip === 'topuz') { d = p.yol; x1 = 266; x2 = 334; }
      else { d = dik(p.x1, p.y1, p.x2, p.y2); x1 = p.x1; x2 = p.x2; }
      const yol = P2(d);
      if (p.tip === 'korkuluk') {
        doldur(yol, C.siyah);
        ctx.save(); ctx.clip(yol);
        ctx.fillStyle = ALTIN;
        for (let i = 0; i < 11; i++) { const xx = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / 11; ctx.fillRect(xx - 0.9, p.y1, 1.8, p.y2 - p.y1); }
        ctx.restore();
        altinCizgi(yol, 1.4);
        continue;
      }
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') { doldur(yol, ALTIN); altinCizgi(yol, 0.8); continue; }
      doldur(yol, C.krem);
      golge(yol, x1, x2);
      if (p.tip === 'topuz') {
        ctx.save(); ctx.clip(yol);
        ctx.strokeStyle = ALTIN; ctx.lineWidth = 1.2;
        for (const dx of [-12, 0, 12]) { ctx.beginPath(); ctx.moveTo(300 + dx * 0.4, 146); ctx.quadraticCurveTo(300 + dx * 1.5, 176, 300 + dx, 200); ctx.stroke(); }
        ctx.restore();
      }
      if (p.ad === 'gövde-alt') {
        const bant = P2(dik(266, 522, 334, 582));
        doldur(bant, C.zumrut);
        ctx.save(); ctx.clip(bant);
        ctx.strokeStyle = ALTIN; ctx.lineWidth = 2.2; ctx.lineJoin = 'miter';
        for (const z of S.zikzakCizgileri()) ctx.stroke(P2(S.yol(z)));
        ctx.restore();
        altinCizgi(bant, 1.4);
      }
      altinCizgi(yol, 1.3);
    }
    for (const p of S.minarePencereleri) { const y = P2(S.kemerYolu(p.x, p.y, p.w, p.h)); doldur(y, C.siyah); altinCizgi(y, 1); }
    alemCiz(parcalar.find((p) => p.tip === 'alem').alem);
  }
  function alemCiz(a) {
    const parca = [S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)), S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
    for (const d of parca) { doldur(d, ALTIN); ctx.strokeStyle = 'rgba(60,40,10,0.7)'; ctx.lineWidth = 0.7; ctx.stroke(P2(d)); }
  }

  // ------------------------------------------------------------ 6. kaide: krem gövde, şevron friz, basamaklı pencere çerçeveleri
  {
    const Kd = S.kaide;
    const g = P2(dik(Kd.x1, Kd.y1, Kd.x2, Kd.y2));
    doldur(g, C.krem);
    ctx.save(); ctx.clip(g);
    ctx.fillStyle = C.kremGolge; ctx.fillRect(Kd.x1, Kd.y1, 130, 100);
    ctx.fillStyle = C.kremAcik; ctx.fillRect(700, Kd.y1, 60, 100);
    // şevron friz
    const fz = P2(dik(Kd.x1, Kd.y1, Kd.x2, Kd.y1 + 14));
    doldur(fz, C.siyah);
    ctx.beginPath();
    for (let x = Kd.x1, i = 0; x <= Kd.x2; x += 10, i++) (i ? ctx.lineTo(x, Kd.y1 + (i % 2 ? 3 : 11)) : ctx.moveTo(x, Kd.y1 + 11));
    ctx.strokeStyle = ALTIN; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    altinCizgi(g, 1.6);
    const k = P2(dik(Kd.kornis.x1, Kd.kornis.y1, Kd.kornis.x2, Kd.kornis.y2));
    doldur(k, ALTIN);
    for (const p of Kd.pencereler) {
      // basamaklı (zigurat) çerçeve
      for (let s = 3; s >= 1; s--) {
        const w = p.w + s * 10, top = p.y - s * 6 + 2;
        const st = P2(S.yol([[p.x - w / 2, p.y + p.h], [p.x - w / 2, top + 12], [p.x - w / 2 + 5, top + 12], [p.x - w / 2 + 5, top], [p.x + w / 2 - 5, top], [p.x + w / 2 - 5, top + 12], [p.x + w / 2, top + 12], [p.x + w / 2, p.y + p.h]], true));
        doldur(st, s % 2 ? C.krem : C.kremGolge);
        altinCizgi(st, 1);
      }
      const y = P2(S.kemerYolu(p.x, p.y, p.w, p.h));
      doldur(y, C.siyah); altinCizgi(y, 1.2);
    }
  }

  // ------------------------------------------------------------ 7. kasnak
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    const g = P2(dik(q.x1, q.y1, q.x2, q.y2));
    doldur(g, kat ? '#14785a' : C.zumrut);
    ctx.save(); ctx.clip(g);
    ctx.fillStyle = C.zumrutKoyu; ctx.fillRect(q.x1, q.y1, (q.x2 - q.x1) * 0.2, q.y2 - q.y1);
    ctx.fillStyle = 'rgba(170,226,196,0.4)'; ctx.fillRect(q.x1 + (q.x2 - q.x1) * 0.64, q.y1, (q.x2 - q.x1) * 0.1, q.y2 - q.y1);
    ctx.restore();
    for (const p of S.kasnakPencereleri(kat)) { const y = P2(S.kemerYolu(p.x, p.y, p.w, p.h)); doldur(y, C.siyah); altinCizgi(y, 0.9); }
    if (kat === 1) { // alt kasnağın üstünde şevron friz
      const fz = P2(dik(q.x1, q.y1, q.x2, q.y1 + 12));
      doldur(fz, C.siyah);
      ctx.save(); ctx.clip(fz);
      ctx.beginPath();
      for (let x = q.x1, i = 0; x <= q.x2 + 8; x += 8, i++) (i ? ctx.lineTo(x, q.y1 + (i % 2 ? 2.5 : 9.5)) : ctx.moveTo(x, q.y1 + 9.5));
      ctx.strokeStyle = ALTIN; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.restore();
    }
    altinCizgi(g, 1.6);
  }

  // ------------------------------------------------------------ 8. kubbe: basamaklı akış gölgesi, altın kaburgalar
  {
    const kp = P2(S.kubbeYolu);
    const prof = S.kubbeProfili(60);
    const kab = (u) => prof.map((q) => [560 + u * q.r, q.y]);
    const tonlar = ['#11604a', '#16735a', '#1d8a64', '#2b9e74', '#4fb48a', '#82cca8'];
    const L = [0.62, -0.5, 0.6];
    for (let i = 0; i < 16; i++) {
      const u0 = Math.sin(-Math.PI / 2 + (Math.PI * i) / 16), u1 = Math.sin(-Math.PI / 2 + (Math.PI * (i + 1)) / 16);
      const um = (u0 + u1) / 2;
      const isik = clamp(0.25 + 0.85 * (um * L[0] + Math.sqrt(1 - um * um) * L[2]), 0, 1);
      const pol = kab(u0).concat(kab(u1).reverse());
      doldur(P2(S.yol(pol, true)), tonlar[Math.round(isik * (tonlar.length - 1))]);
    }
    ctx.save(); ctx.clip(kp);
    // yatay basamak bantları (tepeye doğru açılan)
    for (const [y, a] of [[505, 0.13], [455, 0.09], [400, 0.06]]) { ctx.fillStyle = `rgba(0,40,30,${a})`; ctx.fillRect(340, y, 440, 555 - y); }
    ctx.strokeStyle = ALTIN; ctx.lineWidth = 1;
    for (const k of S.kaburgalar(16)) ctx.stroke(P2(S.yol(k.noktalar)));
    ctx.restore();
    altinCizgi(kp, 2.2);
    alemCiz(S.alemParcalari(560, 300, 1));
  }

  // ------------------------------------------------------------ 9. zemin: pul (yelpaze) deseni
  {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 800, 1024, 224); ctx.clip();
    ctx.fillStyle = '#1b7a5a'; ctx.fillRect(0, 800, 1024, 224);
    const r = 24;
    for (let j = 0; j < 12; j++) {
      const y = 812 + j * 15;
      for (let i = -1; i < 24; i++) {
        const x = i * 48 + (j % 2) * 24;
        const p = new Path2D();
        p.arc(x, y + r, r, Math.PI, TAU);
        p.closePath();
        doldur(p, j % 2 ? '#2a9670' : '#36a37b');
        ctx.beginPath(); ctx.arc(x, y + r, r, Math.PI, TAU); ctx.strokeStyle = ALTIN; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y + r, r * 0.55, Math.PI, TAU); ctx.strokeStyle = 'rgba(232,206,120,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
      }
    }
    ctx.restore();
    ctx.fillStyle = ALTIN; ctx.fillRect(0, 798, 1024, 3);
  }

  // ------------------------------------------------------------ 10. bitkiler: geometrik yelpaze çiçekler, şevron yapraklar
  function yelpaze(cx, cy, r, n, aci) {
    const yay = Math.PI * 1.0, a0 = (aci || -Math.PI / 2) - yay / 2;
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / n) * yay, b = a0 + ((i + 1) / n) * yay;
      const p = new Path2D();
      p.moveTo(cx, cy);
      p.arc(cx, cy, r, a, b);
      p.closePath();
      doldur(p, i % 2 ? C.maviAcik : C.krem);
      ctx.save(); ctx.clip(p);
      doldur(P2(S.daireYolu(cx, cy, r * 0.55)), i % 2 ? C.mavi : C.kremGolge);
      ctx.restore();
      ctx.strokeStyle = ALTIN; ctx.lineWidth = 1.1; ctx.stroke(p);
      // dış kenarda pul
      const am = (a + b) / 2, rr = r * Math.sin((b - a) / 2) * 0.95;
      const pul = new Path2D();
      pul.arc(cx + Math.cos(am) * r * 0.98, cy + Math.sin(am) * r * 0.98, rr, am - Math.PI / 2, am + Math.PI / 2);
      pul.closePath();
      doldur(pul, i % 2 ? C.mavi : C.kremAcik);
      ctx.stroke(pul);
    }
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, a0, a0 + yay); ctx.strokeStyle = ALTIN; ctx.lineWidth = 1; ctx.stroke();
    const t = new Path2D();
    t.arc(cx, cy, r * 0.2, a0, a0 + yay);
    t.closePath();
    doldur(t, ALTIN);
  }
  function yaprak(x, y, L, a, ton) {
    const ca = Math.cos(a), sa = Math.sin(a), W = L * 0.24;
    const pt = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
    const p = new Path2D();
    p.moveTo(...pt(0, 0));
    p.quadraticCurveTo(...pt(L * 0.5, -W * 1.6), ...pt(L, 0));
    p.quadraticCurveTo(...pt(L * 0.5, W * 1.6), ...pt(0, 0));
    doldur(p, ton);
    ctx.save(); ctx.clip(p); ctx.fillStyle = 'rgba(0,20,14,0.35)'; ctx.beginPath(); ctx.moveTo(...pt(0, 0)); ctx.lineTo(...pt(L, 0)); ctx.lineTo(...pt(L, W * 2)); ctx.lineTo(...pt(0, W * 2)); ctx.fill(); ctx.restore();
    ctx.strokeStyle = ALTIN; ctx.lineWidth = 1;
    ctx.stroke(p);
    ctx.beginPath(); ctx.moveTo(...pt(0, 0)); ctx.lineTo(...pt(L * 0.92, 0)); ctx.stroke();
  }
  function sap(x, y1, y2, w) { ctx.fillStyle = ALTIN; ctx.fillRect(x - w / 2, y2, w, y1 - y2); }
  ctx.restore(); // gök kırpması
  ctx.save();
  ctx.clip(icYol);
  {
    // yan dallar: düz saplar, şevron yaprak çiftleri, tepede yelpaze
    const dallar = [[118, 560, 36, 1], [250, 652, 28, 1], [774, 652, 28, -1], [906, 560, 36, -1]];
    for (const [x, ust, r] of dallar) {
      sap(x, 1000, ust, 2.6);
      for (let y = ust + 60; y < 960; y += 58) {
        const L = 30 + (y - ust) * 0.035;
        yaprak(x, y, L, -Math.PI / 2 - 0.75, C.yesim);
        yaprak(x, y, L, -Math.PI / 2 + 0.75, C.zumrut2);
      }
      for (const dy of [26, 42]) { const t = P2(S.yol([[x, ust + dy - 9], [x + 5, ust + dy], [x, ust + dy + 9], [x - 5, ust + dy]], true)); doldur(t, C.mavi); altinCizgi(t, 0.8); }
      yelpaze(x, ust, r, 7);
    }
    // ön yelpazeler (bakışımlı dizilim)
    const on = S.bitki.cicekler.slice(4);
    for (const c of on) {
      const R = c.r * 1.12, by = c.y + c.r * 0.35;
      sap(c.x, 1000, by, 2.4);
      yaprak(c.x, by + R * 0.55, R * 0.9, -Math.PI / 2 - 1.0, C.yesim);
      yaprak(c.x, by + R * 0.55, R * 0.9, -Math.PI / 2 + 1.0, C.zumrut2);
    }
    for (const c of on) yelpaze(c.x, c.y + c.r * 0.35, c.r * 1.12, c.r > 40 ? 9 : 7);
  }
  ctx.restore();

  // ------------------------------------------------------------ 11. çerçeve çizgileri ve köşe yelpazeleri
  {
    altinCizgi(icYol, 2.4);
    const dis = IC.map(([x, y]) => [x + (x < 512 ? -7 : 7), y === 1000 ? 1007 : y - 7]);
    altinCizgi(P2(S.yol(dis, true)), 1);
    ctx.strokeStyle = ALTIN; ctx.lineWidth = 1; ctx.strokeRect(10, 10, 1004, 1004);
    // üst köşelerde yarım güneş yelpazeleri
    for (const cx of [138, 886]) {
      const cy = 66;
      for (let i = 0; i < 9; i++) {
        const a0 = Math.PI + (i / 9) * Math.PI, a1 = Math.PI + ((i + 1) / 9) * Math.PI;
        const p = new Path2D();
        p.moveTo(cx, cy); p.arc(cx, cy, 44, a0, a1); p.closePath();
        doldur(p, i % 2 ? C.yesim : C.zumrut2);
        ctx.strokeStyle = ALTIN; ctx.lineWidth = 0.9; ctx.stroke(p);
      }
      for (const r of [44, 30, 14]) { ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, TAU); ctx.strokeStyle = ALTIN; ctx.lineWidth = r === 44 ? 1.6 : 1; ctx.stroke(); }
      // basamaklar
      for (let s = 0; s < 3; s++) { ctx.fillStyle = ALTIN; ctx.fillRect(cx - 70 + s * 6, cy + 2 - s * 0, 140 - s * 12, 1.2); }
    }
    // tepe ortasında küçük basamaklı süs
    for (let s = 0; s < 4; s++) { ctx.fillStyle = ALTIN; ctx.fillRect(512 - 60 + s * 15, 26 - s * 4, 120 - s * 30, 1.6); }
  }

  // ------------------------------------------------------------ 12. ince baskı dokusu
  {
    const T = S.yeniTuval(512, 512), x = T.getContext('2d');
    const im = x.createImageData(512, 512);
    const r = S.rng(19);
    for (let i = 0; i < 512 * 512; i++) { const v = 240 + r() * 15; im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v - 3; im.data[i * 4 + 3] = 255; }
    x.putImageData(im, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.6; ctx.drawImage(T, 0, 0, 1024, 1024); ctx.restore();
  }

  SAHNE.hazir();
})();
