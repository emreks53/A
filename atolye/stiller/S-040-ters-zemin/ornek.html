<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-040 Ters Zemin — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #1b2c58; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-040 Ters Zemin — mimari hiçbir zaman figür olarak çizilmez: kubbe, kasnak, kaide, minare ve alemler,
// her yeri dolduran yoğun bir süs bahçesinden (hatayi, rumi, lale, karanfil, sarmal dal, gonca) oyulmuş
// boş fildişi kâğıt siluetler olarak görünür. Boşlukların içinde yalnızca çok ince soluk altın kıl çizgiler vardır.
(function () {
  const OL = 2;
  const W = 1024;
  const S2 = W * OL;
  const cv = document.getElementById('tuval');
  const ctx = SAHNE.tuval(cv, OL);
  const r = SAHNE.rng(40);

  // ------------------------------------------------------------ gürültü
  function hash2(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s, o) {
    let t = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2; }
    return t / n;
  }

  // ------------------------------------------------------------ palet
  const P = {
    zemin: '#1A2B57',
    zeminKoyu: '#13204A',
    kontur: '#101A3A',
    altin: '#C99A3C',
    altinAcik: '#EBCB7C',
    altinKoyu: '#7E5A1C',
    gul: '#C24C66',
    gulAcik: '#EBA2AE',
    gulKoyu: '#86284A',
    yesil: '#1F6248',
    yesilAcik: '#4A9A68',
    firuze: '#3AA7A3',
    firuzeAcik: '#93D6CB',
    lacivert: '#4E70BC',
    lacivertAcik: '#9DB4E4',
    kagit: '#F3EAD6',
    kil: 'rgba(190,150,72,0.95)',
  };

  // ------------------------------------------------------------ mimari boşluklar (yalnız siluet)
  const Yo = SAHNE.yollar();
  const bosluklar = [Yo.kubbe, Yo.kasnakUst, Yo.kasnakAlt, Yo.kornis, Yo.kaide, ...Yo.minare, ...Yo.alem, ...Yo.minareAlem].map((d) => new Path2D(d));
  // 1024'lük maske + uzaklık dönüşümü (boşluğa en yakın uzaklık)
  const mc = SAHNE.yeniTuval(W, W);
  const mg = mc.getContext('2d', { willReadFrequently: true });
  mg.fillStyle = '#fff';
  for (const p of bosluklar) mg.fill(p);
  const mv = mg.getImageData(0, 0, W, W).data;
  const UZ = new Float32Array(W * W);
  (function () {
    const INF = 1e9;
    for (let i = 0; i < W * W; i++) UZ[i] = mv[i * 4] > 127 ? 0 : INF;
    const a = 1, b = Math.SQRT2;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let v = UZ[i];
      if (x > 0) v = Math.min(v, UZ[i - 1] + a);
      if (y > 0) {
        v = Math.min(v, UZ[i - W] + a);
        if (x > 0) v = Math.min(v, UZ[i - W - 1] + b);
        if (x < W - 1) v = Math.min(v, UZ[i - W + 1] + b);
      }
      UZ[i] = v;
    }
    for (let y = W - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x;
      let v = UZ[i];
      if (x < W - 1) v = Math.min(v, UZ[i + 1] + a);
      if (y < W - 1) {
        v = Math.min(v, UZ[i + W] + a);
        if (x < W - 1) v = Math.min(v, UZ[i + W + 1] + b);
        if (x > 0) v = Math.min(v, UZ[i + W - 1] + b);
      }
      UZ[i] = v;
    }
  })();
  const uzak = (x, y) => {
    if (x < 0 || y < 0 || x >= W || y >= W) return 400;
    return UZ[(Math.round(y) | 0) * W + (Math.round(x) | 0)] || 0;
  };
  const HALE = 5; // süs ile boşluk arasında kalan zemin şeridi

  // ------------------------------------------------------------ doluluk ızgarası (öğeler birbirine binmesin)
  const HC = 4, HN = W / HC;
  const dolu = new Uint8Array(HN * HN);
  const bosMu = (x, y, rr) => {
    if (uzak(x, y) < rr + HALE) return false;
    const x0 = Math.floor((x - rr) / HC), x1 = Math.floor((x + rr) / HC), y0 = Math.floor((y - rr) / HC), y1 = Math.floor((y + rr) / HC);
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      if (i < 0 || j < 0 || i >= HN || j >= HN) continue;
      const cx = (i + 0.5) * HC, cy = (j + 0.5) * HC;
      if ((cx - x) ** 2 + (cy - y) ** 2 > (rr + 1) ** 2) continue;
      if (dolu[j * HN + i]) return false;
    }
    return true;
  };
  const isaretle = (x, y, rr) => {
    const x0 = Math.floor((x - rr) / HC), x1 = Math.floor((x + rr) / HC), y0 = Math.floor((y - rr) / HC), y1 = Math.floor((y + rr) / HC);
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      if (i < 0 || j < 0 || i >= HN || j >= HN) continue;
      const cx = (i + 0.5) * HC, cy = (j + 0.5) * HC;
      if ((cx - x) ** 2 + (cy - y) ** 2 <= rr * rr) dolu[j * HN + i] = 1;
    }
  };

  // ------------------------------------------------------------ süs öğeleri (yerel koordinatta çizilir)
  const sus = SAHNE.yeniTuval(S2, S2);
  const g = sus.getContext('2d');
  g.setTransform(OL, 0, 0, OL, 0, 0);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  function yerel(x, y, a, s, fn) {
    g.save();
    g.translate(x, y);
    g.rotate(a);
    g.scale(s, s);
    fn();
    g.restore();
  }
  function boya(p, dolgu, kontur, kal) {
    g.fillStyle = dolgu;
    g.fill(p);
    if (kontur) {
      g.strokeStyle = kontur;
      g.lineWidth = kal || 0.9;
      g.stroke(p);
    }
  }
  // kalp uçlu taç yaprağı: dip (0,0), uç (L,0), genişlik w
  function tacYol(L, w, centik) {
    const p = new Path2D();
    const c = centik === undefined ? 0.1 : centik;
    p.moveTo(0, 0);
    p.bezierCurveTo(L * 0.18, -w * 0.62, L * 0.6, -w * 1.02, L * 0.9, -w * 0.62);
    p.bezierCurveTo(L * 1.02, -w * 0.42, L * 1.0, -w * 0.08, L * (1 - c), 0);
    p.bezierCurveTo(L * 1.0, w * 0.08, L * 1.02, w * 0.42, L * 0.9, w * 0.62);
    p.bezierCurveTo(L * 0.6, w * 1.02, L * 0.18, w * 0.62, 0, 0);
    p.closePath();
    return p;
  }
  // sivri yaprak (badem)
  function bademYol(L, w) {
    const p = new Path2D();
    p.moveTo(0, 0);
    p.bezierCurveTo(L * 0.3, -w * 0.75, L * 0.75, -w * 0.5, L, 0);
    p.bezierCurveTo(L * 0.75, w * 0.5, L * 0.3, w * 0.75, 0, 0);
    p.closePath();
    return p;
  }
  // hatayi (önden): iki sıra kalp uçlu yaprak, altın göbek
  function hatayi(x, y, R, a, tur) {
    const dis = tur === 1 ? P.lacivert : P.gul;
    const ic = tur === 1 ? P.lacivertAcik : P.gulAcik;
    yerel(x, y, a, 1, () => {
      const n = tur === 2 ? 6 : 8;
      for (let i = 0; i < n; i++) {
        g.save();
        g.rotate((i / n) * Math.PI * 2);
        const p = tacYol(R, R * (n === 6 ? 0.52 : 0.4), 0.12);
        boya(p, dis, P.kontur, 0.8);
        g.strokeStyle = tur === 1 ? 'rgba(220,232,255,0.55)' : 'rgba(255,214,222,0.6)';
        g.lineWidth = 0.6;
        g.beginPath();
        g.moveTo(R * 0.3, 0);
        g.lineTo(R * 0.78, 0);
        g.stroke();
        g.restore();
      }
      for (let i = 0; i < n; i++) {
        g.save();
        g.rotate(((i + 0.5) / n) * Math.PI * 2);
        boya(tacYol(R * 0.66, R * 0.3, 0.14), ic, P.kontur, 0.7);
        g.restore();
      }
      const gb = new Path2D();
      gb.arc(0, 0, R * 0.27, 0, Math.PI * 2);
      boya(gb, P.altin, P.kontur, 0.8);
      const gi = new Path2D();
      gi.arc(0, 0, R * 0.14, 0, Math.PI * 2);
      boya(gi, tur === 1 ? P.gul : P.firuze, null);
      g.fillStyle = P.altinAcik;
      for (let i = 0; i < 8; i++) {
        const t = (i / 8) * Math.PI * 2;
        g.beginPath();
        g.arc(Math.cos(t) * R * 0.205, Math.sin(t) * R * 0.205, Math.max(0.5, R * 0.025), 0, Math.PI * 2);
        g.fill();
      }
    });
  }
  // yandan hatayi: çanak, yelpaze taç yaprakları, ortada gonca (yukarı = -y)
  function hatayiYan(x, y, s, a) {
    yerel(x, y, a, s / 40, () => {
      const canak = new Path2D('M0,0 C-14,-2 -20,-10 -18,-16 C-10,-12 -4,-12 0,-8 C4,-12 10,-12 18,-16 C20,-10 14,-2 0,0 Z');
      boya(canak, P.yesil, P.kontur, 1);
      const yap = [[-0.95, P.gulKoyu], [0.95, P.gulKoyu], [-0.55, P.gul], [0.55, P.gul], [0, P.gulAcik]];
      for (const [aa, c] of yap) {
        g.save();
        g.translate(0, -10);
        g.rotate(-Math.PI / 2 + aa * 0.9);
        boya(tacYol(34 - Math.abs(aa) * 6, 11, 0.16), c, P.kontur, 1);
        g.restore();
      }
      const gon = new Path2D('M0,-14 C-8,-18 -8,-30 0,-38 C8,-30 8,-18 0,-14 Z');
      boya(gon, P.altin, P.kontur, 1);
      g.strokeStyle = P.altinAcik;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(0, -18);
      g.lineTo(0, -32);
      g.stroke();
    });
  }
  // lale: üç sivri yapraklı Osmanlı lalesi (yukarı = -y)
  function lale(x, y, s, a, renk) {
    const ana = renk || P.gul;
    yerel(x, y, a, s / 40, () => {
      const yanS = new Path2D('M0,-6 C-12,-8 -18,-20 -16,-34 C-14,-40 -18,-46 -22,-50 C-12,-48 -6,-40 -4,-30 C-3,-20 -2,-12 0,-6 Z');
      const yanD = new Path2D('M0,-6 C12,-8 18,-20 16,-34 C14,-40 18,-46 22,-50 C12,-48 6,-40 4,-30 C3,-20 2,-12 0,-6 Z');
      const orta = new Path2D('M0,-4 C-10,-12 -10,-34 0,-52 C10,-34 10,-12 0,-4 Z');
      boya(yanS, P.gulKoyu, P.kontur, 1);
      boya(yanD, P.gulKoyu, P.kontur, 1);
      boya(orta, ana, P.kontur, 1);
      g.strokeStyle = 'rgba(255,226,230,0.75)';
      g.lineWidth = 1.1;
      g.beginPath();
      g.moveTo(0, -12);
      g.quadraticCurveTo(-2, -30, 0, -44);
      g.stroke();
      const canak = new Path2D('M0,2 C-7,0 -9,-6 -6,-9 C-3,-6 3,-6 6,-9 C9,-6 7,0 0,2 Z');
      boya(canak, P.yesilAcik, P.kontur, 0.9);
    });
  }
  // karanfil: çanak tüp üstünde dişli yelpaze (yukarı = -y)
  function karanfil(x, y, s, a) {
    yerel(x, y, a, s / 40, () => {
      const tup = new Path2D('M-5,0 L-6,-16 C-6,-20 6,-20 6,-16 L5,0 Z');
      boya(tup, P.yesil, P.kontur, 1);
      const yel = (R, c) => {
        const p = new Path2D();
        p.moveTo(0, -16);
        const n = 11;
        for (let i = 0; i <= n * 2; i++) {
          const t = -Math.PI * 0.92 + (Math.PI * 0.84 * i) / (n * 2);
          const rr = i % 2 ? R * 0.86 : R;
          p.lineTo(Math.cos(t) * rr, -16 + Math.sin(t) * rr);
        }
        p.closePath();
        boya(p, c, P.kontur, 1);
      };
      yel(34, P.gul);
      yel(25, P.gulAcik);
      yel(15, P.gul);
      g.strokeStyle = 'rgba(134,40,74,0.6)';
      g.lineWidth = 0.9;
      for (let i = -3; i <= 3; i++) {
        const t = -Math.PI / 2 + i * 0.32;
        g.beginPath();
        g.moveTo(Math.cos(t) * 6, -16 + Math.sin(t) * 6);
        g.lineTo(Math.cos(t) * 30, -16 + Math.sin(t) * 30);
        g.stroke();
      }
    });
  }
  // rumi: kıvrık, ucu çatallı yaprak (dip (0,0), ileri +x)
  function rumi(x, y, L, a, ayna, renk) {
    yerel(x, y, a, 1, () => {
      if (ayna) g.scale(1, -1);
      const p = new Path2D();
      p.moveTo(0, 0);
      p.bezierCurveTo(L * 0.18, -L * 0.42, L * 0.7, -L * 0.46, L * 1.02, -L * 0.12);
      p.bezierCurveTo(L * 0.86, -L * 0.2, L * 0.76, -L * 0.16, L * 0.7, -L * 0.08);
      p.bezierCurveTo(L * 0.8, -L * 0.04, L * 0.88, L * 0.04, L * 0.9, L * 0.12);
      p.bezierCurveTo(L * 0.7, L * 0.0, L * 0.42, -L * 0.02, L * 0.26, L * 0.08);
      p.bezierCurveTo(L * 0.16, L * 0.14, L * 0.06, L * 0.1, 0, 0);
      p.closePath();
      boya(p, renk || P.firuze, P.kontur, 0.9);
      g.strokeStyle = renk === P.altin ? 'rgba(255,236,170,0.75)' : 'rgba(210,246,238,0.7)';
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(L * 0.14, -L * 0.04);
      g.bezierCurveTo(L * 0.3, -L * 0.26, L * 0.62, -L * 0.3, L * 0.86, -L * 0.13);
      g.stroke();
    });
  }
  // saz yaprağı: uzun, kıvrık, kenarı dişli; içinde açık şerit
  function saz(x, y, L, a, ayna) {
    yerel(x, y, a, 1, () => {
      if (ayna) g.scale(1, -1);
      const w = L * 0.17;
      const ust = [], alt = [];
      for (let i = 0; i <= 18; i++) {
        const t = i / 18;
        const cx = L * t, cy = -Math.sin(t * Math.PI * 0.9) * L * 0.14;
        const gen = Math.sin(Math.PI * Math.min(1, t * 1.05)) * w * (t < 0.15 ? 0.6 + t * 2.6 : 1);
        const dis = i % 2 && t > 0.15 && t < 0.92 ? 1.18 : 1;
        ust.push([cx, cy - gen * dis]);
        alt.push([cx, cy + gen * 0.8]);
      }
      const p = new Path2D();
      p.moveTo(0, 0);
      for (const q of ust) p.lineTo(q[0], q[1]);
      for (let i = alt.length - 1; i >= 0; i--) p.lineTo(alt[i][0], alt[i][1]);
      p.closePath();
      boya(p, P.yesil, P.kontur, 0.9);
      const ic = new Path2D();
      ic.moveTo(L * 0.1, 0);
      for (let i = 2; i <= 16; i++) {
        const t = i / 18;
        ic.lineTo(L * t, -Math.sin(t * Math.PI * 0.9) * L * 0.14 - Math.sin(Math.PI * t) * w * 0.42);
      }
      for (let i = 16; i >= 2; i--) {
        const t = i / 18;
        ic.lineTo(L * t, -Math.sin(t * Math.PI * 0.9) * L * 0.14 + Math.sin(Math.PI * t) * w * 0.12);
      }
      ic.closePath();
      boya(ic, P.yesilAcik, null);
      g.strokeStyle = 'rgba(200,240,210,0.6)';
      g.lineWidth = 0.6;
      g.beginPath();
      for (let i = 1; i <= 17; i++) {
        const t = i / 18;
        const yy = -Math.sin(t * Math.PI * 0.9) * L * 0.14;
        if (i === 1) g.moveTo(L * t, yy); else g.lineTo(L * t, yy);
      }
      g.stroke();
    });
  }
  function kucukYaprak(x, y, L, a, renk) {
    yerel(x, y, a, 1, () => {
      boya(bademYol(L, L * 0.42), renk || P.yesilAcik, P.kontur, 0.75);
      g.strokeStyle = 'rgba(220,250,230,0.5)';
      g.lineWidth = 0.5;
      g.beginPath();
      g.moveTo(L * 0.12, 0);
      g.lineTo(L * 0.8, 0);
      g.stroke();
    });
  }
  function gonca(x, y, s, a) {
    yerel(x, y, a, s / 20, () => {
      const p = new Path2D('M0,0 C-7,-4 -8,-14 0,-22 C8,-14 7,-4 0,0 Z');
      boya(p, P.gul, P.kontur, 0.9);
      g.strokeStyle = 'rgba(255,214,222,0.7)';
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(0, -5);
      g.lineTo(0, -17);
      g.stroke();
      boya(new Path2D('M0,1 C-6,0 -8,-6 -7,-10 C-4,-6 -2,-5 0,-4 C2,-5 4,-6 7,-10 C8,-6 6,0 0,1 Z'), P.yesilAcik, P.kontur, 0.8);
    });
  }
  function penc(x, y, R, renk, orta) {
    yerel(x, y, r() * 6, 1, () => {
      for (let i = 0; i < 5; i++) {
        g.save();
        g.rotate((i / 5) * Math.PI * 2);
        boya(tacYol(R, R * 0.62, 0.16), renk, P.kontur, 0.6);
        g.restore();
      }
      g.fillStyle = orta || P.altin;
      g.beginPath();
      g.arc(0, 0, R * 0.26, 0, Math.PI * 2);
      g.fill();
    });
  }
  function noktalar(x, y, s, a) {
    g.fillStyle = P.altinAcik;
    for (let i = 0; i < 3; i++) {
      const t = a + (i / 3) * Math.PI * 2;
      g.beginPath();
      g.arc(x + Math.cos(t) * s, y + Math.sin(t) * s, Math.max(0.8, s * 0.55), 0, Math.PI * 2);
      g.fill();
    }
  }
  // dal: koyu kenarlı altın çizgi
  function dalCiz(nok, kal) {
    const p = new Path2D();
    p.moveTo(nok[0][0], nok[0][1]);
    for (let i = 1; i < nok.length; i++) p.lineTo(nok[i][0], nok[i][1]);
    g.strokeStyle = P.kontur;
    g.lineWidth = (kal || 1.8) + 1.4;
    g.stroke(p);
    g.strokeStyle = P.altin;
    g.lineWidth = kal || 1.8;
    g.stroke(p);
  }

  // ------------------------------------------------------------ 1) sabit çapalar: güneş şemsesi ve öndeki büyük çiçekler
  const capalar = [];
  capalar.push({ x: SAHNE.gunes.x, y: SAHNE.gunes.y, R: 54, tip: 'gunes' });
  const turlar = ['hatayi', 'lale', 'karanfil', 'hatayiYan'];
  SAHNE.bitki.cicekler.forEach((c, i) => {
    const R = Math.min(c.r * 0.98, Math.max(10, uzak(c.x, c.y) - HALE - 2));
    const tip = c.r > 40 ? 'hatayi' : turlar[i % 4];
    capalar.push({ x: c.x, y: c.y, R, tip, aci: c.aci, tur: i % 3 === 1 ? 1 : 0, sabit: 1 });
  });
  for (const c of capalar) isaretle(c.x, c.y, c.R + 2);

  const dallar = []; // {nok, kal}
  const yapraklar = [];
  const filizler = [];
  const dalIsaretle = (nok, rr) => { for (const [x, y] of nok) isaretle(x, y, rr); };
  const serbestMi = (x, y, rr) => bosMu(x, y, rr);

  // dal boyunca yan öğeler: yapraklar, kısa saplı lale/karanfil/gonca, sarmal filiz
  function susle(nok, sik, iceri) {
    let taraf = r() < 0.5 ? 1 : -1;
    for (let i = 4; i < nok.length - 3; i += sik + Math.floor(r() * 3)) {
      const [x, y] = nok[i];
      const [x2, y2] = nok[Math.min(nok.length - 1, i + 1)];
      const yon = Math.atan2(y2 - y, x2 - x);
      const a = yon + taraf * (0.7 + r() * 0.4);
      const k = r();
      if (k < 0.18) {
        // kısa saplı çiçek
        const L = 16 + r() * 8;
        const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
        const R = 11 + r() * 5;
        const fx = ex + Math.cos(a) * R * 0.9, fy = ey + Math.sin(a) * R * 0.9;
        if (serbestMi(fx, fy, R + 1) && uzak(ex, ey) > HALE + 3) {
          const sap = [[x, y], [x + Math.cos(a + taraf * 0.3) * L * 0.5, y + Math.sin(a + taraf * 0.3) * L * 0.5], [ex, ey]];
          dallar.push({ nok: sap, kal: 1.1 });
          isaretle(fx, fy, R + 1);
          const tip = ['lale', 'karanfil', 'gonca', 'hatayiYan'][Math.floor(r() * 4)];
          yapraklar.push({ t: 'cicek', tip, x: ex, y: ey, R, a: a + Math.PI / 2 });
          taraf = -taraf;
          continue;
        }
      }
      const L = k < 0.55 ? 30 + r() * 18 : k < 0.85 ? 22 + r() * 10 : 13 + r() * 5;
      const cx = x + Math.cos(a) * L * 0.6, cy = y + Math.sin(a) * L * 0.6;
      const rr = L * 0.34;
      if (serbestMi(cx, cy, rr)) {
        isaretle(cx, cy, rr);
        if (k < 0.55) yapraklar.push({ t: (iceri ? taraf < 0 : taraf > 0) ? 'saz' : 'rumi', x, y, L, a, ayna: taraf < 0, renk: r() < 0.65 ? P.firuze : P.altin });
        else if (k < 0.85) yapraklar.push({ t: 'rumi', x, y, L, a, ayna: taraf < 0, renk: r() < 0.5 ? P.firuze : P.altin });
        else yapraklar.push({ t: 'kucuk', x, y, L, a });
      } else if (r() < 0.7) {
        const R0 = 6 + r() * 5;
        const fx = x + Math.cos(a) * R0 * 1.4, fy = y + Math.sin(a) * R0 * 1.4;
        if (serbestMi(fx, fy, R0 + 1)) {
          isaretle(fx, fy, R0);
          filizler.push({ x, y, a, R0, taraf });
        }
      }
      taraf = -taraf;
    }
  }

  // ------------------------------------------------------------ 2) öndeki çiçeklerin sapları ve yan dallar (SAHNE.bitki)
  for (const s of SAHNE.bitki.saplar) {
    const nok = [];
    for (const [x, y] of s) {
      if (uzak(x, y) < HALE + 3) break;
      nok.push([x, y]);
    }
    if (nok.length > 3) {
      // pürüzsüzleştir
      const ince = [];
      for (let i = 0; i < nok.length - 1; i++) for (let k = 0; k < 4; k++) ince.push([nok[i][0] + ((nok[i + 1][0] - nok[i][0]) * k) / 4, nok[i][1] + ((nok[i + 1][1] - nok[i][1]) * k) / 4]);
      dallar.push({ nok: ince, kal: 2.3 });
      dalIsaretle(ince, 1.8);
    }
  }
  for (const c of capalar) {
    if (!c.sabit || c.y < 780) continue;
    // çiçekten aşağı inen kavisli sap
    const nok = [];
    const yon = c.x < 512 ? 1 : -1;
    for (let i = 0; i <= 30; i++) {
      const t = i / 30;
      nok.push([c.x + yon * Math.sin(t * Math.PI) * 26, c.y + c.R * 0.9 + t * (W + 20 - c.y - c.R)]);
    }
    dallar.push({ nok, kal: 2.1 });
    dalIsaretle(nok, 1.8);
  }
  for (const t of SAHNE.bitki.tomurcuklar) {
    if (uzak(t.x, t.y) < 16 || !serbestMi(t.x, t.y, 9)) continue;
    isaretle(t.x, t.y, 10);
    yapraklar.push({ t: 'cicek', tip: 'lale', x: t.x - Math.cos(t.aci) * 8, y: t.y - Math.sin(t.aci) * 8, R: 12, a: t.aci + Math.PI / 2 });
  }

  // ------------------------------------------------------------ 3) sarmal dallar (helezon): her birinin ortasında bir çiçek
  const merkezler = [];
  (function () {
    for (let k = 0; k < 3000; k++) {
      const x = r() * W, y = r() * W;
      if (uzak(x, y) < 34) continue;
      let uygun = true;
      for (const m of merkezler) if (Math.hypot(m.x - x, m.y - y) < 132) { uygun = false; break; }
      if (uygun) for (const c of capalar) if (Math.hypot(c.x - x, c.y - y) < c.R + 64) { uygun = false; break; }
      if (uygun) merkezler.push({ x, y });
    }
  })();
  merkezler.forEach((m, idx) => {
    const yonu = ((Math.floor(m.x / 140) + Math.floor(m.y / 140)) % 2 ? 1 : -1);
    const Rs = 62 + r() * 16;
    const th0 = r() * Math.PI * 2;
    const tur = 1.35 * Math.PI * 2;
    const R = Math.min(19 + r() * 7, uzak(m.x, m.y) - HALE - 2);
    // dışarıdan içe; engelde kes
    const ham = [];
    for (let i = 0; i <= 120; i++) {
      const t = i / 120;
      const th = th0 + yonu * t * tur;
      const rr = Rs * (1 - 0.8 * t);
      ham.push([m.x + Math.cos(th) * rr, m.y + Math.sin(th) * rr, rr]);
    }
    const nok = [];
    for (const q of ham) {
      if (q[2] < R * 0.95) break;
      const ok = uzak(q[0], q[1]) > HALE + 3 && q[0] > -30 && q[0] < W + 30 && q[1] > -30 && q[1] < W + 30;
      const cakisma = !bosMu(q[0], q[1], 1.5) && q[2] > R + 6;
      if (!ok || cakisma) { if (nok.length < 12) { nok.length = 0; continue; } else break; }
      nok.push([q[0], q[1]]);
    }
    const tamam = nok.length > 0 && Math.hypot(nok[nok.length - 1][0] - m.x, nok[nok.length - 1][1] - m.y) < R * 1.3;
    if (R > 9 && bosMu(m.x, m.y, R)) {
      isaretle(m.x, m.y, R + 1.5);
      capalar.push({ x: m.x, y: m.y, R, tip: ['hatayi', 'hatayi', 'penc', 'hatayi'][idx % 4], aci: r() * 6.28, tur: idx % 3 === 0 ? 1 : idx % 3 === 1 ? 2 : 0 });
    }
    if (nok.length > 10) {
      dallar.push({ nok, kal: 2.1 });
      dalIsaretle(nok, 1.6);
      m.nok = nok;
      m.tamam = tamam;
    }
  });
  // sarmalların süsleri (dallar işaretlendikten sonra)
  for (const m of merkezler) if (m.nok) susle(m.nok, 5, true);
  for (const d of dallar.slice()) if (d.kal >= 2) susle(d.nok, 6, false);

  // ------------------------------------------------------------ 4) seyrek dolgu: küçük yaprak, gonca, beşli çiçek; altın nokta üçlüleri
  const dolgu = [];
  for (let gec = 0; gec < 3; gec++) {
    const adim = [24, 16, 11][gec];
    for (let y = adim / 2; y < W; y += adim) {
      for (let x = adim / 2; x < W; x += adim) {
        const px = x + (r() - 0.5) * adim * 0.8, py = y + (r() - 0.5) * adim * 0.8;
        const R = [9.5, 6, 3][gec] * (0.85 + r() * 0.3);
        if (!bosMu(px, py, R + 2)) continue;
        if (r() < [0.35, 0.5, 0.72][gec]) continue;
        isaretle(px, py, R + 1.5);
        const k = r();
        if (gec === 0) dolgu.push(k < 0.28 ? { t: 'penc', x: px, y: py, R, renk: r() < 0.5 ? P.gulAcik : P.firuzeAcik } : k < 0.45 ? { t: 'rumi', x: px - R, y: py, L: R * 2.2, a: r() * 6.28, ayna: r() < 0.5, renk: r() < 0.5 ? P.firuze : P.altin } : k < 0.75 ? { t: 'kucuk', x: px - R, y: py, L: R * 2.2, a: r() * 6.28 } : { t: 'gonca', x: px, y: py + R * 0.8, L: R * 1.9, a: r() * 6.28 });
        else if (gec === 1) dolgu.push(k < 0.15 ? { t: 'penc', x: px, y: py, R: R * 0.9, renk: [P.gulAcik, P.firuzeAcik, P.lacivertAcik][Math.floor(r() * 3)] } : k < 0.45 ? { t: 'kucuk', x: px - R, y: py, L: R * 2.1, a: r() * 6.28, renk: r() < 0.6 ? P.yesilAcik : P.firuze } : { t: 'nokta', x: px, y: py, R });
        else dolgu.push({ t: 'nokta', x: px, y: py, R: R * 0.9 });
      }
    }
  }

  // ------------------------------------------------------------ 5) çiz: dallar → filizler → yapraklar → çiçekler → dolgu
  for (const d of dallar) dalCiz(d.nok, d.kal);
  for (const f of filizler) {
    const nok = [];
    const cx = f.x + Math.cos(f.a) * f.R0 * 1.4, cy = f.y + Math.sin(f.a) * f.R0 * 1.4;
    for (let i = 0; i <= 30; i++) {
      const t = i / 30;
      const th = f.a + f.taraf * t * Math.PI * 1.8;
      const rr = f.R0 * (1 - t * 0.75);
      nok.push([cx - Math.cos(th) * rr, cy - Math.sin(th) * rr]);
    }
    nok.unshift([f.x, f.y]);
    dalCiz(nok, 1.0);
  }
  const cicekCiz = (tip, x, y, R, a, tur) => {
    if (tip === 'hatayi') hatayi(x, y, R, a || 0, tur);
    else if (tip === 'lale') lale(x, y, R * 1.45, a);
    else if (tip === 'karanfil') karanfil(x, y, R * 1.3, a);
    else if (tip === 'hatayiYan') hatayiYan(x, y, R * 1.4, a);
    else if (tip === 'gonca') gonca(x, y, R * 1.5, a);
    else penc(x, y, R, P.gulAcik, P.altin);
  };
  for (const y of yapraklar) {
    if (y.t === 'saz') saz(y.x, y.y, y.L, y.a, y.ayna);
    else if (y.t === 'rumi') rumi(y.x, y.y, y.L, y.a, y.ayna, y.renk);
    else if (y.t === 'cicek') cicekCiz(y.tip, y.x, y.y, y.R, y.a);
    else kucukYaprak(y.x, y.y, y.L, y.a);
  }
  for (const c of capalar) {
    if (c.tip === 'gunes') {
      yerel(c.x, c.y, 0, 1, () => {
        for (let i = 0; i < 16; i++) {
          g.save();
          g.rotate((i / 16) * Math.PI * 2);
          boya(bademYol(c.R * 1.25, c.R * 0.22), i % 2 ? P.altin : P.altinAcik, P.kontur, 0.8);
          g.restore();
        }
      });
      hatayi(c.x, c.y, c.R * 0.86, Math.PI / 8, 0);
      continue;
    }
    if (c.tip === 'hatayi' || c.tip === 'penc') cicekCiz(c.tip, c.x, c.y, c.R, c.aci, c.tur);
    else cicekCiz(c.tip, c.x, c.y + c.R * 0.7, c.R, (c.aci || 0) * 0.3 - 0.15, c.tur);
  }
  for (const d of dolgu) {
    if (d.t === 'penc') penc(d.x, d.y, d.R, d.renk);
    else if (d.t === 'kucuk') kucukYaprak(d.x, d.y, d.L, d.a, d.renk);
    else if (d.t === 'rumi') rumi(d.x, d.y, d.L, d.a, d.ayna, d.renk);
    else if (d.t === 'gonca') gonca(d.x, d.y, d.L, d.a);
    else noktalar(d.x, d.y, d.R * 0.55, r() * 6);
  }

  // ------------------------------------------------------------ 6) zemin, süs katmanı, boşluklar
  // lacivert zemin: hafif guaj dokusu
  (function () {
    const k = SAHNE.yeniTuval(W, W);
    const kg = k.getContext('2d');
    const im = kg.createImageData(W, W);
    const d = im.data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const n = fbm(x / 80, y / 80, 51, 4) - 0.5;
      const t = hash2(x, y, 52) - 0.5;
      const o = (y * W + x) * 4;
      d[o] = 26 + n * 14 + t * 5;
      d[o + 1] = 43 + n * 16 + t * 5;
      d[o + 2] = 87 + n * 20 + t * 6;
      d[o + 3] = 255;
    }
    kg.putImageData(im, 0, 0);
    ctx.drawImage(k, 0, 0, W, W);
  })();
  // süslerin boşluk kenarına yaklaşan kısımlarını sil (zemin şeridi kalsın)
  (function () {
    g.save();
    g.globalCompositeOperation = 'destination-out';
    g.lineWidth = HALE * 2 - 1;
    g.strokeStyle = '#000';
    g.fillStyle = '#000';
    for (const p of bosluklar) {
      g.fill(p);
      g.stroke(p);
    }
    g.restore();
  })();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // süslerin zemine düşen çok hafif gölgesi
  ctx.filter = 'blur(1.5px)';
  ctx.globalAlpha = 0.45;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(sus, -1, 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.drawImage(sus, 0, 0);
  ctx.setTransform(OL, 0, 0, OL, 0, 0);
  // boşluklar: fildişi kâğıt
  const kagit = SAHNE.yeniTuval(W, W);
  (function () {
    const kg = kagit.getContext('2d');
    const im = kg.createImageData(W, W);
    const d = im.data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const n = fbm(x / 60, y / 60, 61, 4) - 0.5;
      const lif = vnoise(x / 1.8, y / 20, 62) - 0.5;
      const o = (y * W + x) * 4;
      d[o] = 243 + n * 10 + lif * 5;
      d[o + 1] = 234 + n * 10 + lif * 5;
      d[o + 2] = 214 + n * 10 + lif * 5;
      d[o + 3] = 255;
    }
    kg.putImageData(im, 0, 0);
  })();
  ctx.save();
  const birlesik = new Path2D();
  for (const p of bosluklar) birlesik.addPath(p);
  ctx.beginPath();
  for (const p of bosluklar) {
    ctx.save();
    ctx.clip(p);
    ctx.drawImage(kagit, 0, 0, W, W);
    ctx.restore();
  }
  ctx.restore();

  // ------------------------------------------------------------ 7) boşluk içinde yalnız soluk altın kıl çizgiler
  ctx.strokeStyle = P.kil;
  ctx.lineWidth = 0.6;
  const kil = (d) => ctx.stroke(typeof d === 'string' ? new Path2D(d) : d);
  const cizgi = (x1, y1, x2, y2) => {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  };
  ctx.save();
  ctx.clip(new Path2D(Yo.kubbe));
  for (const k of Yo.kaburgalar) kil(k);
  ctx.restore();
  cizgi(362, 553.5, 758, 553.5);
  // kasnak
  for (const p of Yo.kasnakPencereleri) kil(p);
  cizgi(354, 557.5, 766, 557.5);
  cizgi(354, 608, 766, 608);
  cizgi(336, 612.5, 784, 612.5);
  cizgi(336, 689.5, 784, 689.5);
  // korniş ve kaide
  cizgi(292, 694.5, 828, 694.5);
  cizgi(292, 701.5, 828, 701.5);
  cizgi(302, 707, 818, 707);
  for (const p of Yo.kaidePencereleri) kil(p);
  // minare: şerefeler, korkuluklar, bilezik, pencereler, zikzak
  const M = SAHNE.minareParcalari();
  const parca = (ad) => M.find((p) => p.ad === ad);
  for (const ad of ['şerefe-1', 'şerefe-2', 'bilezik']) {
    const p = parca(ad);
    const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
    const x1 = Math.min(...xs) + 1.5, x2 = Math.max(...xs) - 1.5;
    cizgi(x1, Math.min(...ys) + 1.5, x2, Math.min(...ys) + 1.5);
    cizgi(x1, Math.max(...ys) - 1.5, x2, Math.max(...ys) - 1.5);
  }
  for (const ad of ['çıkma-1', 'çıkma-2']) {
    const p = parca(ad);
    const [a, b, c, d] = p.noktalar;
    cizgi(a[0] + 2, a[1] - 1.5, d[0] - 2, d[1] - 1.5);
    for (let k = 1; k < 4; k++) {
      const t = k / 4;
      cizgi(a[0] + (b[0] - a[0]) * t + 1.5, a[1] + (b[1] - a[1]) * t, d[0] + (c[0] - d[0]) * t - 1.5, d[1] + (c[1] - d[1]) * t);
    }
  }
  for (const ad of ['korkuluk-1', 'korkuluk-2']) {
    const p = parca(ad);
    cizgi(p.x1 + 1.5, p.y1 + 2, p.x2 - 1.5, p.y1 + 2);
    const n = 9;
    for (let i = 0; i < n; i++) {
      const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / n;
      cizgi(x - 1.6, p.y1 + 4, x - 1.6, p.y2 - 2);
      cizgi(x + 1.6, p.y1 + 4, x + 1.6, p.y2 - 2);
    }
  }
  cizgi(268, 489.5, 332, 489.5);
  cizgi(275, 317.5, 325, 317.5);
  for (const p of Yo.minarePencereleri) kil(p);
  for (const z of Yo.zikzak) kil(z);
  cizgi(268, 520.5, 332, 520.5);
  cizgi(268, 583.5, 332, 583.5);
  // topuz ortası ve alemlerde tek ince eksen çizgisi
  cizgi(300, 196, 300, 154);

  SAHNE.hazir();
})();
</script>
