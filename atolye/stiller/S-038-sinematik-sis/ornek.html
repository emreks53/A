<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-038 Sinematik Sis — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #3a5560; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-038 Sinematik Sis (Cinematic Haze) — dijital mat boyama (matte painting) görünümü.
// Altın saat gökyüzü ve güneşe göre ışıklanan hacimli bulutlar; hava perspektifiyle uzak tepeler ve pus katmanları;
// yapı ve çiçekler yükseklik alanından normal alınarak gerçekçi ışıkla (sıcak güneş, camgöbeği gök ışığı,
// sıcak kenar ışığı, arkadan geçen ışık) boyanır; yere uzun gölge düşer. Güneşe doğru radyal örneklemeyle
// hacimsel ışık huzmeleri; ardından alttaki resimden renk alan dokulu fırça vuruşları; en sonda sinematik renk
// düzeltme (sıcak açık tonlar, camgöbeği gölgeler), ışıltı, film greni ve vinyet.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const zaman = () => {};
  const K = 2;
  const N = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);
  const rnd = S.rng(38);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3803);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  // ------------------------------------------------------------------ ışık kurgusu: altın saat, güneş sağ üstte ve biraz arkada
  const LS = nrm([0.8, -0.5, -0.1]); // güneşe doğru
  const HS = nrm([LS[0], LS[1], LS[2] + 1]);
  const GUNES = [1.0, 0.74, 0.46];
  const GOKA = [0.16, 0.32, 0.4];
  const SEKME = [0.5, 0.32, 0.18];
  const ss = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  // ------------------------------------------------------------------ kabartma katmanı (yükseklik → normal → sinematik ışık)
  function katman(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = o.pay != null ? o.pay : 6;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const md = mg.getImageData(0, 0, w, h).data;
    const A = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) A[i] = md[i * 4 + 3] / 255;
    const ic = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) ic[i] = A[i] > 0.5 ? 1 : 0;
    const D = edt(ic, w, h);
    let AH = null, DH = null;
    if (o.oyuk) {
      const oc = tuvalYap(w, h);
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.setTransform(K, 0, 0, K, -X0, -Y0);
      og.fillStyle = '#fff';
      o.oyuk(og);
      const od = og.getImageData(0, 0, w, h).data;
      AH = new Float32Array(w * h);
      const ih = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        AH[i] = od[i * 4 + 3] / 255;
        ih[i] = AH[i] > 0.5 ? 1 : 0;
      }
      DH = edt(ih, w, h);
    }
    let RL = null, RR = null;
    if (o.tip === 'donel') {
      RL = new Float32Array(h);
      RR = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < w; x++)
          if (A[y * w + x] > 0.5) {
            if (l < 0) l = x;
            r = x;
          }
        RL[y] = l;
        RR[y] = r;
      }
      const L2 = new Float32Array(h), R2 = new Float32Array(h);
      const yr = 3 * K;
      for (let y = 0; y < h; y++) {
        let sl = 0, sr = 0, n = 0;
        for (let k = -yr; k <= yr; k++) {
          const yy = y + k;
          if (yy < 0 || yy >= h || RL[yy] < 0) continue;
          sl += RL[yy];
          sr += RR[yy];
          n++;
        }
        L2[y] = n ? sl / n : RL[y];
        R2[y] = n ? sr / n : RR[y];
      }
      RL = L2;
      RR = R2;
    }
    const bevel = o.bevel || 3;
    const yuk = o.yuk != null ? o.yuk : 1;
    const zs = o.zs != null ? o.zs : 1;
    const yastik = o.yastik || 0;
    let BA = null;
    if (yastik > 0) {
      const bc = tuvalYap(w, h);
      const bx = bc.getContext('2d', { willReadFrequently: true });
      bx.filter = `blur(${(o.yastikR || 20) * K * 0.5}px)`;
      bx.drawImage(mc, 0, 0);
      const bd = bx.getImageData(0, 0, w, h).data;
      BA = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) BA[i] = Math.pow(Math.max(0, Math.min(1, (bd[i * 4 + 3] / 255 - 0.5) * 2)), 0.6);
    }
    const H = new Float32Array(w * h);
    const UU = RL ? new Float32Array(w * h) : null;
    const RW = RL ? new Float32Array(h) : null;
    const SS = new Float32Array(w * h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const d = Math.max(0, D[i] / K - 0.5 + A[i] * 0.5);
        const t = Math.min(1, d / bevel);
        const s = Math.sqrt(1 - (1 - t) * (1 - t));
        SS[i] = s;
        let hh;
        if (RL) {
          const rr = (RR[y] - RL[y] + 1) / 2;
          const c = (RL[y] + RR[y]) / 2;
          const u = rr > 0 ? (x - c) / rr : 0;
          UU[i] = u;
          RW[y] = rr / K;
          hh = (Math.sqrt(Math.max(0, 1 - u * u)) * rr / K) * zs * s;
        } else hh = bevel * yuk * s + (BA ? yastik * BA[i] : 0);
        if (AH && AH[i] > 0.002) {
          const th = Math.min(1, DH[i] / K / (o.oyukDuvar || 1.5));
          hh -= (o.oyukDerin || 5) * Math.sqrt(1 - (1 - th) * (1 - th)) * AH[i];
        }
        H[i] = hh;
      }
    yumusat(H, w, h, K);
    const KAV = new Float32Array(w * h);
    if (o.ek)
      for (let y = 0; y < h; y++) {
        const uy = (Y0 + y) / K;
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (A[i] <= 0.002) continue;
          const e = o.ek((X0 + x) / K, uy, UU ? UU[i] : 0, RW ? RW[y] : 0, SS[i]);
          H[i] += e[0];
          KAV[i] = e[1];
        }
      }
    const img = new ImageData(w, h);
    const P = img.data;
    const m = o.mat;
    const oyukRenk = o.oyukRenk ? hex(o.oyukRenk) : [0.02, 0.03, 0.03];
    const sabit = typeof m.renk === 'string' ? hex(m.renk) : null;
    for (let y = 1; y < h - 1; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const gx = (H[i + 1] - H[i - 1]) * K * 0.5;
        const gy = (H[i + w] - H[i - w]) * K * 0.5;
        const nl = Math.sqrt(gx * gx + gy * gy + 1);
        const nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
        let base = sabit || m.renk(ux, uy);
        if (m.leke !== 0) {
          // boyanmış yüzey: geniş, yumuşak ton lekeleri (eskime ve boya katmanı izlenimi)
          const lv = 1 + (m.leke || 0.07) * fbm(ux / 26 + 11, uy / 26, 3);
          base = [base[0] * lv, base[1] * lv, base[2] * lv];
        }
        let ao = 1 - KAV[i];
        if (AH && AH[i] > 0.002) {
          const q = Math.min(1, AH[i] * Math.min(1, DH[i] / K / 1.3 + 0.2));
          base = [base[0] + (oyukRenk[0] - base[0]) * q, base[1] + (oyukRenk[1] - base[1]) * q, base[2] + (oyukRenk[2] - base[2]) * q];
          ao *= 1 - 0.6 * q;
        }
        const kd = nx * LS[0] + ny * LS[1] + nz * LS[2];
        const w0 = m.wrap || 0.04;
        let diff = Math.max(0, (kd + w0) / (1 + w0));
        if (o.golgede) diff *= o.golgede(ux, uy);
        const gk = 0.4 - 0.7 * ny;
        const sk = Math.max(0, ny) * 0.5 + 0.12;
        const rim = Math.pow(1 - nz, 2.2) * Math.max(0, nx * 0.85 - ny * 0.45) * (m.rim || 1.6) * 2.3;
        const sp = (m.ks || 0) * Math.pow(Math.max(0, nx * HS[0] + ny * HS[1] + nz * HS[2]), m.g || 30);
        let yan = 0;
        if (m.yansima) {
          const rx = 2 * nz * nx, ry = 2 * nz * ny;
          const yu = Math.max(0, -ry);
          const gun = Math.max(0, rx * LS[0] + ry * LS[1]);
          yan = m.yansima * (0.25 + 0.75 * (1 - nz) * (1 - nz)) * yu;
          yan *= 1 + 2.5 * Math.pow(gun, 6);
        }
        const gec = m.gecir ? m.gecir * (0.3 + 1.6 * (1 - nz)) * (o.golgede ? o.golgede(ux, uy) * 0.6 + 0.4 : 1) : 0; // ince taç yapraklarda arkadan geçen ışık
        const out = [0, 0, 0];
        for (let c = 0; c < 3; c++) {
          const L = GUNES[c] * 3.0 * diff + GOKA[c] * gk * 1.45 * (m.amb || 1) * ao + SEKME[c] * sk * 0.5 * ao;
          out[c] = base[c] * L + (GOKA[c] * 1.6 + GUNES[c] * 0.4) * yan + base[c] * GUNES[c] * gec + GUNES[c] * (rim * (0.35 + base[c]) + sp) * (o.golgede ? o.golgede(ux, uy) * 0.7 + 0.3 : 1);
          out[c] = out[c] / (1 + out[c] * 0.25) * 1.25;
        }
        const j = i * 4;
        P[j] = enc(out[0]);
        P[j + 1] = enc(out[1]);
        P[j + 2] = enc(out[2]);
        P[j + 3] = Math.round(A[i] * 255);
      }
    }
    const kc = tuvalYap(w, h);
    kc.getContext('2d').putImageData(img, 0, 0);
    const hedef = o.hedef || ana;
    const gl = o.golge;
    if (gl) {
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(kc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#0a1418';
      sx.fillRect(0, 0, w, h);
      const pad = Math.ceil(gl.blur * K * 2.5) + 2;
      const bc = tuvalYap(w + 2 * pad, h + 2 * pad);
      const bx = bc.getContext('2d');
      bx.filter = `blur(${gl.blur * K}px)`;
      bx.drawImage(sc, pad, pad);
      hedef.save();
      hedef.globalAlpha = gl.alfa;
      hedef.drawImage(bc, X0 + gl.dx * K - pad, Y0 + gl.dy * K - pad);
      hedef.restore();
    }
    hedef.drawImage(kc, X0, Y0);
  }

  // ------------------------------------------------------------------ biçim yardımcıları
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dolYol = (d) => (g) => g.fill(P2(d));

  // ================================================================== 1. gök: altın saat, hacimli bulutlar
  const GW = 1024; // gök çözünürlüğü (yumuşak; sonra fırça geçişi)
  const gokT = tuvalYap(GW, GW);
  const gokX = gokT.getContext('2d');
  const gokVeri = gokX.createImageData(GW, GW);
  const BULUT = new Float32Array(GW * GW); // ışın hesabında örtü
  {
    const q = GW / 1024;
    const yogun = (x, y) => {
      // tasarlanmış bulut kütleleri: sol üstte kümülüs, güneşin önünden geçen kırık şeritler, ufukta alçak bant
      const wx = fbm(x / 300 + 4.1, y / 140, 3) * 80, wy = fbm(x / 300, y / 140 + 7.3, 3) * 30;
      const X = x + wx, Y = y + wy;
      const n = fbm(X / 210, Y / 80, 6);
      const ns = fbm(X / 380, Y / 30, 4);
      const a = Math.exp(-(((X - 210) / 380) ** 2 + ((Y - 215) / 110) ** 2));
      const b = Math.exp(-(((Y - 250) / 62) ** 2)) * ss(120, 560, X);
      const c = Math.exp(-(((X - 840) / 330) ** 2 + ((Y - 485) / 52) ** 2));
      const e = Math.exp(-(((X - 120) / 300) ** 2 + ((Y - 470) / 45) ** 2));
      const t = Math.exp(-(((Y - 55) / 50) ** 2)) * 0.8 * (1 - 0.8 * Math.exp(-((x - 880) ** 2 + (y - 140) ** 2) / (2 * 70 * 70)));
      const kum = ss(0.0, 0.42, n + a * 0.8 - 0.42) * Math.min(1, a * 1.7);
      const ser = ss(-0.02, 0.36, ns + b * 0.62 - 0.44) * b;
      const alc = ss(0.0, 0.42, n + Math.max(c, e) * 0.75 - 0.42) * Math.min(1, Math.max(c, e) * 1.7);
      const ust = ss(0.0, 0.4, ns + t * 0.5 - 0.36) * t;
      return Math.min(1, Math.max(kum, ser, alc, ust));
    };
    const ux = -LS[0], uy = -LS[1];
    const gs = hex('#10283A'), gm = hex('#2F5C6C'), ga = hex('#C99566'), gu = hex('#FFD49A');
    const bg = hex('#222C3E'), bl = hex('#FFCF8E');
    for (let j = 0; j < GW; j++) {
      const y = j / q;
      for (let i = 0; i < GW; i++) {
        const x = i / q;
        // gök degradesi + güneş ışıltısı
        const t = y / 800;
        const c0 = t < 0.55 ? 0 : 1;
        const a = t < 0.55 ? t / 0.55 : (t - 0.55) / 0.45;
        const A1 = c0 ? gm : gs, A2 = c0 ? ga : gm;
        const e = a * a * (3 - 2 * a);
        let r = A1[0] + (A2[0] - A1[0]) * e, g = A1[1] + (A2[1] - A1[1]) * e, b = A1[2] + (A2[2] - A1[2]) * e;
        const dx = x - 880, dy = y - 140;
        const dd = Math.sqrt(dx * dx + dy * dy);
        const parla = Math.exp(-dd / 90) * 2.4 + Math.exp(-dd / 330) * 0.7;
        const sol = 1 - Math.min(1, x / 1024);
        r += gu[0] * parla * 0.75;
        g += gu[1] * parla * 0.72;
        b += gu[2] * parla * 0.6;
        // güneş diski
        const disk = ss(30, 24, dd);
        r += disk * 3;
        g += disk * 2.6;
        b += disk * 2;
        // bulut
        const d = yogun(x, y);
        if (d > 0.001) {
          const ilk = yogun(x + ux * -14, y + uy * -14); // güneşe doğru
          const isik = Math.max(0, Math.min(1, 0.45 + (d - ilk) * 3.2));
          const yakin = Math.exp(-dd / 260);
          const kr = bg[0] * (1 + sol * 0.15) + (bl[0] - bg[0]) * isik * (0.35 + 0.65 * yakin);
          const kg = bg[1] + (bl[1] - bg[1]) * isik * (0.35 + 0.65 * yakin);
          const kb = bg[2] * (1 - yakin * 0.3) + (bl[2] - bg[2]) * isik * (0.3 + 0.6 * yakin);
          // güneşe yakın ince kenarlar parlar (gümüş astar)
          const kenar = Math.pow(1 - d, 3) * yakin * 3.2;
          const dk = Math.min(1, d * 1.15);
          r = r * (1 - dk) + (kr + kenar * 1.0) * dk + kenar * 0.5 * (1 - dk);
          g = g * (1 - dk) + (kg + kenar * 0.8) * dk + kenar * 0.4 * (1 - dk);
          b = b * (1 - dk) + (kb + kenar * 0.5) * dk + kenar * 0.25 * (1 - dk);
        }
        BULUT[j * GW + i] = d;
        const p = (j * GW + i) * 4;
        gokVeri.data[p] = enc(r / (1 + r * 0.3) * 1.3);
        gokVeri.data[p + 1] = enc(g / (1 + g * 0.3) * 1.3);
        gokVeri.data[p + 2] = enc(b / (1 + b * 0.3) * 1.3);
        gokVeri.data[p + 3] = 255;
      }
    }
    gokX.putImageData(gokVeri, 0, 0);
    ana.save();
    ana.imageSmoothingQuality = 'high';
    ana.filter = `blur(${1.2 * K}px)`;
    ana.drawImage(gokT, 0, 0, N, N);
    ana.restore();
    // güneş: bulut kenarını aşan parlak çekirdek ve geniş hale
    ana.save();
    ana.globalCompositeOperation = 'screen';
    const gh = ana.createRadialGradient(880 * K, 140 * K, 0, 880 * K, 140 * K, 260 * K);
    gh.addColorStop(0, 'rgba(255,248,226,1)');
    gh.addColorStop(0.09, 'rgba(255,236,190,0.9)');
    gh.addColorStop(0.22, 'rgba(255,206,140,0.38)');
    gh.addColorStop(0.55, 'rgba(240,170,110,0.12)');
    gh.addColorStop(1, 'rgba(240,170,110,0)');
    ana.fillStyle = gh;
    ana.fillRect(0, 0, N, N);
    ana.restore();
  }
  zaman('gok');

  // ================================================================== 2. uzak tepeler (hava perspektifi) ve yer
  function sirt(y0, amp, f, ph, oct) {
    const pts = [];
    for (let x = -20; x <= 1044; x += 4) pts.push([x, y0 - amp * (0.5 + 0.5 * fbm(x * f + ph, ph * 3.1, oct))]);
    return pts;
  }
  function tepeCiz(pts, renkUst, renkAlt, y2) {
    const g = ana;
    g.save();
    g.setTransform(K, 0, 0, K, 0, 0);
    g.beginPath();
    g.moveTo(-20, y2);
    for (const [x, y] of pts) g.lineTo(x, y);
    g.lineTo(1044, y2);
    g.closePath();
    const gr = g.createLinearGradient(0, Math.min(...pts.map((p) => p[1])), 0, y2);
    gr.addColorStop(0, renkUst);
    gr.addColorStop(1, renkAlt);
    g.fillStyle = gr;
    g.fill();
    g.restore();
  }
  tepeCiz(sirt(690, 120, 0.004, 2.0, 4), '#7D8A8C', '#B79A78', 820);
  tepeCiz(sirt(735, 80, 0.006, 7.3, 4), '#56666A', '#9C8264', 820);
  // ufuk pusu
  {
    const g = ana;
    const pg = g.createLinearGradient(0, 600 * K, 0, 830 * K);
    pg.addColorStop(0, 'rgba(214,170,120,0)');
    pg.addColorStop(0.6, 'rgba(222,178,126,0.5)');
    pg.addColorStop(1, 'rgba(226,184,132,0.7)');

    yg2.addColorStop(0.25, '#8A6A4C');
    yg2.addColorStop(1, '#2A2522');
    g.fillStyle = yg2;
    g.fillRect(0, 798 * K, N, N - 798 * K);
  }
  zaman('tepe');

  // ================================================================== 3. yapı (ayrı tuvalde: gölge ve ışın örtüsü için)
  const yapi = tuvalYap(N, N);
  const yg = yapi.getContext('2d');
  const TAS = { renk: '#E4D3B6', ks: 0.06, g: 20, rim: 1.4 };
  const TASK = { renk: '#D3C0A0', ks: 0.05, g: 20, rim: 1.4 };
  const ALTIN = { renk: '#D6A643', ks: 1.1, g: 70, rim: 2.2, yansima: 0.5 };
  const KUBBE = { renk: '#2A8A49', ks: 0.55, g: 34, rim: 2.4, yansima: 0.1, amb: 0.5 };
  const KASNAK = { renk: '#267C43', ks: 0.25, g: 36, rim: 2, yansima: 0.06, amb: 0.75 };
  const parcalar = S.minareParcalari();
  const minPen = S.minarePencereleri;
  const penIcinde = (y1, y2) => minPen.filter((p) => p.y >= y1 && p.y + p.h <= y2);
  function alem(a, olcek) {
    const gl = { dx: -1.5 * olcek, dy: 1.5 * olcek, blur: 1.5, alfa: 0.4 };
    katman({ hedef: yg, ciz: (g) => g.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1), mat: ALTIN, tip: 'donel', bevel: 1.2, golge: gl });
    katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, 7); g.fill(); }, mat: ALTIN, tip: 'donel', zs: 0.5, bevel: 3 * olcek, golge: gl });
    for (const k of a.kureler) katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.arc(k.cx, k.cy, k.r, 0, 7); g.fill(); }, mat: ALTIN, bevel: k.r, golge: gl });
    const hl = a.hilal;
    katman({ hedef: yg, ciz: dolYol(S.hilalYolu(hl.cx, hl.cy, hl.R)), mat: ALTIN, bevel: 2 * olcek, golge: gl });
  }
  for (const p of parcalar) {
    if (p.tip === 'alem') {
      alem(p.alem, 0.62);
      continue;
    }
    if (p.tip === 'bant') continue;
    let d, y1, y2;
    if (p.tip === 'poligon') {
      d = S.yol(p.noktalar, true);
      y1 = Math.min(...p.noktalar.map((q) => q[1]));

    } else if (p.tip === 'topuz') {

    } else {
      d = dik(p.x1, p.y1, p.x2, p.y2);
      y1 = p.y1;
      y2 = p.y2;
    }
    const pen = p.ad.startsWith('gövde') ? penIcinde(y1, y2) : [];
    const korkuluk = p.tip === 'korkuluk';
    const zz = p.ad === 'gövde-alt' ? S.zikzakCizgileri() : null;
    katman({
      hedef: yg,
      ciz: dolYol(d),
      tip: 'donel',
      mat: p.ad.startsWith('şerefe') || p.ad === 'bilezik' ? TASK : TAS,
      bevel: 1.8,
      oyuk: pen.length || korkuluk
        ? (g) => {
            for (const q of pen) g.fill(P2(S.kemerYolu(q.x, q.y, q.w, q.h)));
            if (korkuluk) {
              const adet = 9;
              for (let i = 0; i < adet; i++) {
                const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / adet;
                g.fillRect(x - 1.8, p.y1 + 4, 3.6, p.y2 - p.y1 - 7);
              }
            }
          }
        : null,
      oyukRenk: '#2A221C',
      oyukDerin: 4,
      oyukDuvar: 1.1,
      ek: zz
        ? (x, y) => {
            // zikzak bandı: oyma çizgiler
            let best = 99;
            for (const z of zz)
              for (let k = 0; k < z.length - 1; k++) {
                const [ax, ay] = z[k], [bx, by] = z[k + 1];
                if (x < Math.min(ax, bx) - 3 || x > Math.max(ax, bx) + 3) continue;
                const vx = bx - ax, vy = by - ay;
                const t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)));
                const dd = Math.hypot(x - ax - vx * t, y - ay - vy * t);
                if (dd < best) best = dd;
              }
            const o = Math.exp(-(best * best) / 1.6);
            return [-1.4 * o, o * 0.45];
          }
        : null,
      golge: { dx: -1.5, dy: 2, blur: 2, alfa: 0.45 },
    });
  }
  const KD = S.kaide;
  katman({
    hedef: yg,
    ciz: dolYol(dik(KD.x1, KD.y1, KD.x2, KD.y2)),
    mat: { renk: (x, y) => { const t = (y - 704) / 96; const a = hex('#E4D3B6'); return [a[0] * (1 - t * 0.12), a[1] * (1 - t * 0.14), a[2] * (1 - t * 0.16)]; }, ks: 0.05, g: 20, rim: 1.2 },
    bevel: 3,

    oyukDerin: 6,

  katman({ hedef: yg, ciz: (g) => g.fillRect(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2 - KD.kornis.x1, KD.kornis.y2 - KD.kornis.y1), mat: { renk: '#EDE0C8', ks: 0.05, g: 20, rim: 1.5 }, tip: 'donel', zs: 0.05, bevel: 2.5, golge: { dx: -1, dy: 4, blur: 3, alfa: 0.55 } });
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    katman({
      hedef: yg,
      ciz: (g) => g.fillRect(q.x1, q.y1 - (k === 0 ? 3 : 0), q.x2 - q.x1, q.y2 - q.y1 + (k === 0 ? 3 : 1)),
      tip: 'donel',
      zs: 0.9,
      mat: KASNAK,
      bevel: 2.2,
      oyuk: (g) => {
        for (const p of S.kasnakPencereleri(k)) g.fill(P2(S.kemerYolu(p.x, p.y, p.w, p.h)));
      },
      oyukRenk: '#0B1A10',
      oyukDerin: 5,
      oyukDuvar: 1.3,
      golge: { dx: -3, dy: 3, blur: 3, alfa: 0.55 },

  }
  const DILIM = 16;
  katman({
    hedef: yg,
    ciz: dolYol('M359,556 C357,430 440,318 560,300 C680,318 763,430 761,556 Z'),
    tip: 'donel',
    zs: 1,
    mat: KUBBE,
    bevel: 2.5,
    ek: (x, y, u, r, s) => {
      const fi = Math.asin(Math.max(-1, Math.min(1, u)));
      const f = ((fi + Math.PI / 2) / Math.PI) * DILIM;
      const fr = f - Math.floor(f);
      const dd = Math.min(fr, 1 - fr);
      const nz = Math.sqrt(Math.max(0, 1 - u * u));
      const gen = (0.07 / Math.max(0.25, nz)) * Math.min(1, 40 / Math.max(8, r)) * 2;
      const kab = Math.exp(-(dd * dd) / (gen * gen * 0.25));
      const yk = Math.min(1, (556 - y) / 12) * Math.min(1, r / 30);
      return [(1.6 * kab + 0.8 * Math.sin(Math.PI * fr)) * nz * yk * s, 0];
    },
    golge: { dx: -4, dy: 6, blur: 5, alfa: 0.6 },
  });
  alem(S.alemParcalari(560, 300, 1), 1);
  zaman('yapi');

  // yerde uzun gölge: yapının silueti güneşin tersine (sola ve öne) izdüşürülür
  {
    const sil = tuvalYap(N, N);
    const sx = sil.getContext('2d');
    sx.drawImage(yapi, 0, 0);
    sx.globalCompositeOperation = 'source-in';
    sx.fillStyle = '#1b2a30';
    sx.fillRect(0, 0, N, N);
    const gg = tuvalYap(N, N);
    const gx = gg.getContext('2d');

  // yapıya hava perspektifi: gölgeleri camgöbeği-gri pusla kaldır
  {
    const pc = tuvalYap(N, N);
    const px = pc.getContext('2d');
    px.drawImage(yapi, 0, 0);
    px.globalCompositeOperation = 'source-atop';
    const hg = px.createLinearGradient(0, 80 * K, 0, 800 * K);

    hg.addColorStop(1, 'rgba(150,150,140,0.1)');

  // yapının dibinde yer pusu
  {
    const pg = ana.createLinearGradient(0, 750 * K, 0, 850 * K);
    pg.addColorStop(0, 'rgba(214,176,132,0)');
    pg.addColorStop(0.55, 'rgba(220,182,136,0.3)');

  // ================================================================== 4. bitkiler: arkadan ışık alan yarı saydam taç yapraklar
  const bitki = tuvalYap(N, N);
  const bg2 = bitki.getContext('2d');
  const B = S.bitki;
  const onGolge = (x, y) => 1 - 0.6 * ss(800, 1000, y);
  const YAPRAK = { renk: '#2E5530', ks: 0.25, g: 24, rim: 2.2, gecir: 0.3, wrap: 0.2 };
  const SAP = { renk: '#3C5A30', ks: 0.1, g: 20, rim: 2, gecir: 0.15 };
  for (const s of B.saplar)
    katman({ hedef: bg2, ciz: (g) => { g.lineWidth = 4.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(P2(S.yol(s))); }, mat: SAP, bevel: 2.2, golgede: onGolge, golge: { dx: -2, dy: 2, blur: 2, alfa: 0.35 } });
  B.yapraklar.forEach((y) => {
    const [a, b] = S.yaprakDamari(y);
    katman({
      hedef: bg2,

        const t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (yy - a[1]) * vy) / (vx * vx + vy * vy)));
        const d = Math.hypot(x - a[0] - vx * t, yy - a[1] - vy * t);
        return [-0.8 * Math.exp(-(d * d) / 0.8), 0];
      },
      golge: { dx: -2, dy: 2.5, blur: 2.5, alfa: 0.4 },
    });
  });
  for (const t of B.tomurcuklar) katman({ hedef: bg2, ciz: dolYol(S.tomurcukYolu(t)), mat: { renk: '#E7B3BE', ks: 0.2, g: 30, rim: 2, gecir: 0.35 }, bevel: t.r * 0.9, golgede: onGolge, golge: { dx: -1.5, dy: 2, blur: 2, alfa: 0.35 } });
  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);
  for (const { c } of sirali) {
    const tc = hex('#D6C8BE'), tk = hex('#B87A8A');
    for (const e of S.tacYapraklari(c)) {
      katman({
        hedef: bg2,
        ciz: (g) => {
          g.beginPath();
          g.ellipse(e.cx, e.cy, e.rx * 1.02, e.ry * 1.05, e.aci, 0, 7);
          g.fill();
        },
        mat: {
          renk: (x, y) => {
            const t = Math.min(1, Math.hypot(x - c.x, y - c.y) / (c.r * 0.55));
            const m = 1 - ss(0, 1, t);
            return [tc[0] + (tk[0] - tc[0]) * m, tc[1] + (tk[1] - tc[1]) * m, tc[2] + (tk[2] - tc[2]) * m];
          },
          ks: 0.12,
          g: 20,
          rim: 2.4,
          gecir: 0.7,
          wrap: 0.05,
        },
        bevel: Math.max(1.2, c.r * 0.06),
        yuk: 0.6,
        yastik: c.r * 0.05,
        yastikR: c.r * 0.3,
        ek: (x, y) => {
          // ince damarlar: çiçek merkezinden yayılan sığ oluklar
          const a = Math.atan2(y - c.y, x - c.x), d = Math.hypot(x - c.x, y - c.y) / c.r;
          const v = Math.pow(Math.abs(Math.sin(a * 13 + d * 1.5)), 6);
          return [-0.25 * v * ss(0.15, 0.4, d) * c.r * 0.02, v * 0.08 * ss(0.15, 0.4, d)];
        },
        golgede: onGolge,
        golge: { dx: -1.5, dy: 2, blur: Math.max(1.5, c.r * 0.05), alfa: 0.4 },
      });
    }
    katman({ hedef: bg2, ciz: (g) => { g.beginPath(); g.arc(c.x, c.y, c.r * 0.19, 0, 7); g.fill(); }, mat: { renk: '#D9A23A', ks: 0.3, g: 30, rim: 2 }, bevel: c.r * 0.17, golgede: onGolge, golge: { dx: -1, dy: 1.5, blur: 1.5, alfa: 0.4 } });
  }
  zaman('bitki');

  // ================================================================== 5. hacimsel ışık huzmeleri (güneşe doğru radyal örnekleme)
  {
    const RW2 = 512, q = RW2 / 1024;
    // örtü: yapı + bitki alfa
    const oc = tuvalYap(RW2, RW2);
    const ox = oc.getContext('2d', { willReadFrequently: true });
    ox.drawImage(yapi, 0, 0, RW2, RW2);
    ox.drawImage(bitki, 0, 0, RW2, RW2);
    const od = ox.getImageData(0, 0, RW2, RW2).data;
    // örtü haritası: yoğun bulut + yapı + bitki (0..1)
    const ORT = new Float32Array(RW2 * RW2);
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const bi = Math.min(GW - 1, Math.round(i * (GW / RW2))) + Math.min(GW - 1, Math.round(j * (GW / RW2))) * GW;
        ORT[j * RW2 + i] = Math.max(ss(0.35, 0.95, BULUT[bi]) * 0.7, od[(j * RW2 + i) * 4 + 3] / 255);
      }
    // her pikselden güneşe doğru yürüyüp örtüden geçen ışığın payı (ekran uzayında gölge)
    const sx = 880 * q, sy = 140 * q;
    const ADIM = 90;
    const OUT = new Float32Array(RW2 * RW2);
    const KOY = new Float32Array(RW2 * RW2);
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const dx = (sx - i) / ADIM, dy = (sy - j) / ADIM;
        let x = i + dx, y = j + dy, gec = 0;
        for (let k = 1; k < ADIM; k++) {
          const xi = x | 0, yi = y | 0;
          if (xi >= 0 && yi >= 0 && xi < RW2 && yi < RW2) gec += ORT[yi * RW2 + xi];
          x += dx;
          y += dy;
        }
        const vis = Math.exp(-gec * 0.05);
        const X = i / q - 880, Y = j / q - 140;
        const dd = Math.hypot(X, Y);
        const an = Math.atan2(Y, X);
        // geniş, yumuşak demetler: açıya bağlı düşük frekanslı profil, güneşin sol altındaki yelpazede
        const pr = ss(0.12, 0.62, 0.5 + 0.5 * Math.sin(an * 11 + 1.3) * 0.6 + fbm(an * 3.2 + 7, 1.7, 3) * 0.9);
        const yel = ss(1.15, 1.95, an) * ss(3.45, 2.75, an);
        const yakin = ss(40, 160, dd);
        const obj = od[(j * RW2 + i) * 4 + 3] / 255;
        OUT[j * RW2 + i] = vis * (1.15 * pr * yel * yakin * Math.exp(-dd / 900) + 0.4 * Math.exp(-dd / 140)) * (1 - 0.72 * obj);
        // demetlerin arasında ve örtünün gölgesinde pus koyulaşır (hacimsel gölge)
        KOY[j * RW2 + i] = (1 - obj) * yel * ss(60, 260, dd) * (0.55 * (1 - pr) * vis + 0.45 * (1 - vis)) * 0.4;
      }
    const rc = tuvalYap(RW2, RW2);
    const rx = rc.getContext('2d');
    const rd = rx.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      const v = Math.min(1, OUT[i]);
      rd.data[i * 4] = 255;
      rd.data[i * 4 + 1] = 214;
      rd.data[i * 4 + 2] = 158;
      rd.data[i * 4 + 3] = Math.round(v * 255);
    }
    rx.putImageData(rd, 0, 0);
    const kc2 = tuvalYap(RW2, RW2);
    const kx2 = kc2.getContext('2d');
    const kd2 = kx2.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      kd2.data[i * 4] = 24;
      kd2.data[i * 4 + 1] = 52;
      kd2.data[i * 4 + 2] = 66;
      kd2.data[i * 4 + 3] = Math.round(Math.min(1, KOY[i]) * 255);
    }
    kx2.putImageData(kd2, 0, 0);
    ana.save();
    ana.filter = `blur(${4 * K}px)`;
    ana.drawImage(kc2, 0, 0, N, N);
    ana.restore();
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 0.95;
    ana.filter = `blur(${3 * K}px)`;
    ana.drawImage(rc, 0, 0, N, N);
    ana.restore();
    // bitkiler ışığın önünde; üstlerinde yalnız hafif hava pusu
    ana.drawImage(bitki, 0, 0);
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 0.18;
    ana.filter = `blur(${3 * K}px)`;
    ana.drawImage(rc, 0, 0, N, N);
    ana.restore();
  }
  zaman('isin');

  // ================================================================== 6. dijital fırça geçişi (alttaki resimden renk alan dokulu vuruşlar)
  {
    const kc = tuvalYap(1024, 1024);
    const kx = kc.getContext('2d', { willReadFrequently: true });
    kx.drawImage(tuval, 0, 0, 1024, 1024);
    const kd = kx.getImageData(0, 0, 1024, 1024).data;
    const lum = new Float32Array(1024 * 1024);
    for (let i = 0; i < 1024 * 1024; i++) lum[i] = 0.3 * kd[i * 4] + 0.59 * kd[i * 4 + 1] + 0.11 * kd[i * 4 + 2];
    const L = (x, y) => lum[Math.max(0, Math.min(1023, y)) * 1024 + Math.max(0, Math.min(1023, x))];
    const bol = S.bolgeHaritasi();
    const rr = S.rng(3838);
    const TIP = {
      gok: { L: [16, 38], W: [5, 11], a: 0.42, p: 0.12, aci: -0.12 },
      gunes: { L: [10, 20], W: [4, 7], a: 0.25, p: 0.12, aci: 0 },
      zemin: { L: [9, 18], W: [3, 5], a: 0.38, p: 0.22, aci: 0.02 },
      yapi: { L: [4.5, 10], W: [1.8, 3.2], a: 0.52, p: 0.5, aci: Math.PI / 2 },
      bitki: { L: [6, 14], W: [2.4, 4.4], a: 0.6, p: 0.5, aci: -1.2 },
    };
    const sinif = (b) => (b === 'gok' || b === 'gunes' || b === 'zemin' ? b : b === 'yaprak' || b === 'sap' || b === 'cicek' || b === 'cicekOrta' ? 'bitki' : 'yapi');
    const g = ana;
    g.save();
    g.setTransform(K, 0, 0, K, 0, 0);
    g.lineCap = 'round';
    const renk = (x, y) => {
      const i = (Math.max(0, Math.min(1023, Math.round(y))) * 1024 + Math.max(0, Math.min(1023, Math.round(x)))) * 4;
      return [kd[i], kd[i + 1], kd[i + 2]];
    };
    const fark = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
    for (let n = 0; n < 230000; n++) {
      const x = rr() * 1024, y = rr() * 1024;
      const t = TIP[sinif(bol.bolge(x, y))];
      if (rr() > t.p) continue;
      const xi = x | 0, yi = y | 0;
      const gx = L(xi + 1, yi) - L(xi - 1, yi), gy = L(xi, yi + 1) - L(xi, yi - 1);
      const mg = Math.hypot(gx, gy);
      let a = mg > 6 ? Math.atan2(gy, gx) + Math.PI / 2 : t.aci + (fbm(x / 120, y / 120, 2)) * 0.8;
      let uz = t.L[0] + rr() * (t.L[1] - t.L[0]);
      const en = t.W[0] + rr() * (t.W[1] - t.W[0]);
      const c = renk(x, y);
      const ca = Math.cos(a), sa = Math.sin(a);
      let e1 = renk(x - ca * uz * 0.5, y - sa * uz * 0.5), e2 = renk(x + ca * uz * 0.5, y + sa * uz * 0.5);
      if (fark(c, e1) > 54 || fark(c, e2) > 54) {
        uz *= 0.4;
        e1 = renk(x - ca * uz * 0.5, y - sa * uz * 0.5);
        e2 = renk(x + ca * uz * 0.5, y + sa * uz * 0.5);
        if (fark(c, e1) > 54 || fark(c, e2) > 54) continue;
      }
      const kv = rr() * 0.4 - 0.2; // vuruşun hafif kavsi
      for (let k = -1; k <= 1; k++) {
        const j = (rr() - 0.5) * 14;
        const ox = -sa * en * 0.32 * k, oy = ca * en * 0.32 * k;
        g.strokeStyle = `rgba(${Math.round(c[0] + j)},${Math.round(c[1] + j)},${Math.round(c[2] + j)},${t.a * (0.65 + rr() * 0.35)})`;
        g.lineWidth = en * (0.42 + rr() * 0.2);
        const x1 = x - ca * uz * 0.5 + ox, y1 = y - sa * uz * 0.5 + oy;
        const x2 = x + ca * uz * 0.5 + ox, y2 = y + sa * uz * 0.5 + oy;
        g.beginPath();
        g.moveTo(x1, y1);
        g.quadraticCurveTo(x - sa * uz * kv + ox, y + ca * uz * kv + oy, x2, y2);
        g.stroke();
      }
    }
    g.restore();
  }
  zaman('firca');

  // ================================================================== 7. sinematik renk düzeltme: ışıltı, sıcak açık / camgöbeği koyu, gren, vinyet
  {
    const bc = tuvalYap(512, 512);
    const bx = bc.getContext('2d');
    bx.filter = 'brightness(0.75) contrast(3.2) blur(10px)';
    bx.drawImage(tuval, 0, 0, 512, 512);
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 0.22;
    ana.drawImage(bc, 0, 0, N, N);
    ana.restore();
    const id = ana.getImageData(0, 0, N, N);
    const d = id.data;
    const rr = S.rng(3839);
    for (let y = 0; y < N; y++) {
      const vy = (y / N - 0.5) * 2;
      for (let x = 0; x < N; x++) {
        const i = (y * N + x) * 4;
        let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        // S eğrisi
        const sl = l * l * (3 - 2 * l);
        const k = (l > 0.001 ? (l + (sl - l) * 0.5) / l : 1);
        r *= k; g *= k; b *= k;
        // bölünmüş tonlama
        const ko = (1 - l) * (1 - l), ac = l * l;
        r += -0.05 * ko + 0.08 * ac;
        g += 0.035 * ko + 0.025 * ac;
        b += 0.07 * ko - 0.06 * ac;
        // vinyet
        const vx = (x / N - 0.5) * 2;
        const vd = Math.sqrt(vx * vx * 0.9 + vy * vy);
        const vf = 1 - 0.5 * ss(0.5, 1.35, vd);
        // film greni
        const gr = (rr() + rr() - 1) * 0.035;
        d[i] = Math.max(0, Math.min(255, (r * vf + gr) * 255));
        d[i + 1] = Math.max(0, Math.min(255, (g * vf + gr) * 255));
        d[i + 2] = Math.max(0, Math.min(255, (b * vf + gr) * 255));
      }
    }
    ana.putImageData(id, 0, 0);
  }

  zaman('son');
  S.hazir();
}, 0);
</script>
