<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-038 Sinematik Sis — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #cfe0ea; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-038 Sinematik Sis (Cinematic Haze) — film konsept sanatı / dijital mat boyama (matte painting) tarifi.
// İki aşama: (1) "alt boya": sahne, sanatçının değer ve renk kararlarıyla kurulur — puslu, aydınlık bir kuşluk-öğle
// göğü (üstte gök mavisi, ufukta beyaz sis) ve güneşin önden aydınlattığı beyaz kümülüsler, hava perspektifiyle sise
// gömülen mavi-gri uzak tepeler, yükseklik alanından normal alınıp beş tonlu biçim boyamasıyla (ışık, yarı ton, çekirdek
// gölge, yansıyan ışık, düşen gölge) ışıklanan yapı, aydınlık ön plan çiçekleri, güneşe doğru radyal örneklemeyle
// açık renkli, yumuşak hacimsel ışık huzmeleri. (2) "boya geçişi": alt boyadan renk alan, büyükten küçüğe katman
// katman eğri fırça vuruşları (kaba fırça gökte ve arka planda, ince fırça yalnız odak yapıda: kayıp ve bulunmuş
// kenarlar). En sonda vurgu parıltıları, sis ışıltısı, hafif renk düzeltme ve ince gren.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const K = 2;
  const N = 1024 * K;
  const DBG = new URLSearchParams(location.search).get('dbg') || '';
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3803);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  const ss = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // ------------------------------------------------------------------ ışık kurgusu: aydınlık kuşluk-öğle, güneş sağ üstte yüksekte
  // Işık sağdan, yukarıdan ve önden: kubbenin büyük kısmı güneşte, sol kenarı gök mavisi yansımalı açık gölgede.
  const LS = nrm([0.66, -0.55, 0.45]);
  const HV = nrm([LS[0], LS[1], LS[2] + 1]);
  const KENAR = [0.92, 0.9, 0.84]; // beyaza yakın kenar ışığı
  const GOKYAN = [0.12, 0.2, 0.32]; // gölgede yukarı bakan yüzeylere gök yansıması (mavi)
  const PARLA = [1.0, 0.97, 0.9];

  /** Malzeme: beş tonlu boya paleti (ışık L, yarı ton M, gölge D, çekirdek gölge C, yansıyan ışık R). */
  function malz(o) {
    return Object.assign({}, o, { L: hex(o.L), M: hex(o.M), D: hex(o.D), C: hex(o.C), R: hex(o.R) });
  }

  // ------------------------------------------------------------------ kabartma katmanı (yükseklik → normal → biçim boyaması)
  function katman(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = o.pay != null ? o.pay : 6;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const md = mg.getImageData(0, 0, w, h).data;
    const A = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) A[i] = md[i * 4 + 3] / 255;
    const ic = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) ic[i] = A[i] > 0.5 ? 1 : 0;
    const D = edt(ic, w, h);
    let AH = null, DH = null;
    if (o.oyuk) {
      const oc = tuvalYap(w, h);
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.setTransform(K, 0, 0, K, -X0, -Y0);
      og.fillStyle = '#fff';
      o.oyuk(og);
      const od = og.getImageData(0, 0, w, h).data;
      AH = new Float32Array(w * h);
      const ih = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        AH[i] = od[i * 4 + 3] / 255;
        ih[i] = AH[i] > 0.5 ? 1 : 0;
      }
      DH = edt(ih, w, h);
    }
    let RL = null, RR = null;
    if (o.tip === 'donel') {
      RL = new Float32Array(h);
      RR = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < w; x++)
          if (A[y * w + x] > 0.5) {
            if (l < 0) l = x;
            r = x;
          }
        RL[y] = l;
        RR[y] = r;
      }
      const L2 = new Float32Array(h), R2 = new Float32Array(h);
      const yr = 3 * K;
      for (let y = 0; y < h; y++) {
        let sl = 0, sr = 0, n = 0;
        for (let k = -yr; k <= yr; k++) {
          const yy = y + k;
          if (yy < 0 || yy >= h || RL[yy] < 0) continue;
          sl += RL[yy];
          sr += RR[yy];
          n++;
        }
        L2[y] = n ? sl / n : RL[y];
        R2[y] = n ? sr / n : RR[y];
      }
      RL = L2;
      RR = R2;
    }
    const bevel = o.bevel || 3;
    const yuk = o.yuk != null ? o.yuk : 1;
    const zs = o.zs != null ? o.zs : 1;
    const yastik = o.yastik || 0;
    let BA = null;
    if (yastik > 0) {
      const bc = tuvalYap(w, h);
      const bx = bc.getContext('2d', { willReadFrequently: true });
      bx.filter = `blur(${(o.yastikR || 20) * K * 0.5}px)`;
      bx.drawImage(mc, 0, 0);
      const bd = bx.getImageData(0, 0, w, h).data;
      BA = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) BA[i] = Math.pow(Math.max(0, Math.min(1, (bd[i * 4 + 3] / 255 - 0.5) * 2)), 0.6);
    }
    const H = new Float32Array(w * h);
    const UU = RL ? new Float32Array(w * h) : null;
    const RW = RL ? new Float32Array(h) : null;
    const SS = new Float32Array(w * h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const d = Math.max(0, D[i] / K - 0.5 + A[i] * 0.5);
        const t = Math.min(1, d / bevel);
        const s = Math.sqrt(1 - (1 - t) * (1 - t));
        SS[i] = s;
        let hh;
        if (RL) {
          const rr = (RR[y] - RL[y] + 1) / 2;
          const c = (RL[y] + RR[y]) / 2;
          const u = rr > 0 ? (x - c) / rr : 0;
          UU[i] = u;
          RW[y] = rr / K;
          hh = (Math.sqrt(Math.max(0, 1 - u * u)) * rr / K) * zs * s;
        } else hh = bevel * yuk * s + (BA ? yastik * BA[i] : 0);
        if (AH && AH[i] > 0.002) {
          const th = Math.min(1, DH[i] / K / (o.oyukDuvar || 1.5));
          hh -= (o.oyukDerin || 5) * Math.sqrt(1 - (1 - th) * (1 - th)) * AH[i];
        }
        H[i] = hh;
      }
    yumusat(H, w, h, K);
    const KAV = new Float32Array(w * h);
    if (o.ek)
      for (let y = 0; y < h; y++) {
        const uy = (Y0 + y) / K;
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (A[i] <= 0.002) continue;
          const e = o.ek((X0 + x) / K, uy, UU ? UU[i] : 0, RW ? RW[y] : 0, SS[i]);
          H[i] += e[0];
          KAV[i] = e[1];
        }
      }
    const img = new ImageData(w, h);
    const P = img.data;
    const m = o.mat;
    const oyukRenk = o.oyukRenk ? hex(o.oyukRenk) : [0.02, 0.03, 0.03];
    const t0 = m.t0 != null ? m.t0 : -0.04, t1 = m.t1 != null ? m.t1 : 0.16;
    const col = [0, 0, 0];
    for (let y = 1; y < h - 1; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const gx = (H[i + 1] - H[i - 1]) * K * 0.5;
        const gy = (H[i + w] - H[i - w]) * K * 0.5;
        const nl = Math.sqrt(gx * gx + gy * gy + 1);
        const nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
        const kd = nx * LS[0] + ny * LS[1] + nz * LS[2];
        const cast = o.golgede ? o.golgede(ux, uy) : 1;
        // beş tonlu biçim boyaması: ışık ailesi ile gölge ailesi net ayrılır (ressamın değer gruplaması)
        const yuz = ss(t0, t1, kd);
        const isik = yuz * cast;
        const yari = ss(m.y0 != null ? m.y0 : 0.12, m.y1 != null ? m.y1 : 0.85, kd);
        const cekirdek = ss(-0.5, -0.03, kd) * (1 - yuz);
        const sekme = Math.min(1, Math.max(0, ny) * 0.9 + Math.max(0, -nx) * 0.4) * (1 - cekirdek * 0.65) * (m.rb != null ? m.rb : 0.7);
        const gokr = Math.max(0, -ny) * (m.sk != null ? m.sk : 0.6);
        let ao = 1 - KAV[i];
        let oy = 0;
        if (AH && AH[i] > 0.002) {
          oy = Math.min(1, AH[i] * Math.min(1, DH[i] / K / 1.3 + 0.2));
          ao *= 1 - 0.55 * oy;
        }
        const lv = 1 + (m.leke != null ? m.leke : 0.06) * fbm(ux / 22 + 11, uy / 22, 3);
        const carp = o.carp ? o.carp(ux, uy) : null;
        const rim = Math.pow(1 - nz, 2.4) * Math.max(0, nx * 0.85 - ny * 0.5) * (m.rim || 1) * (m.arka ? 0.75 + 0.25 * cast : 0.25 + 0.75 * cast);
        const sp = (m.ks || 0) * Math.pow(Math.max(0, nx * HV[0] + ny * HV[1] + nz * HV[2]), m.g || 30) * isik;
        const gec = m.gecir ? m.gecir * (0.2 + 1.5 * (1 - nz)) * (0.35 + 0.65 * cast) : 0;
        // arkadan ışık alan ince kenar: güneşe bakan sınırda parlayan ışık şeridi (taç yaprak, yaprak)
        let kn = 0;
        if (o.kenar) {
          const dgx = D[i + 1] - D[i - 1], dgy = D[i + w] - D[i - w];
          const dm = Math.hypot(dgx, dgy);
          if (dm > 0.01) kn = o.kenar * Math.exp(-D[i] / K / (o.kenarW || 2)) * Math.max(0, (-dgx / dm) * 0.8 + (dgy / dm) * 0.6) * (0.55 + 0.45 * cast);
        }
        for (let c = 0; c < 3; c++) {
          let g = m.D[c] + (m.C[c] - m.D[c]) * cekirdek;
          g += (m.R[c] - g) * sekme;
          g += GOKYAN[c] * gokr;
          const l = m.M[c] + (m.L[c] - m.M[c]) * yari;
          let v = (g + (l - g) * isik) * lv * ao;
          if (carp) v *= carp[c];
          if (oy > 0) v += (oyukRenk[c] - v) * oy;
          v += KENAR[c] * rim * (0.3 + m.M[c]) + PARLA[c] * sp + m.L[c] * gec + KENAR[c] * kn;
          col[c] = v / (1 + v * 0.18) * 1.18;
        }
        const j = i * 4;
        P[j] = enc(col[0]);
        P[j + 1] = enc(col[1]);
        P[j + 2] = enc(col[2]);
        P[j + 3] = Math.round(A[i] * 255);
      }
    }
    const kc = tuvalYap(w, h);
    kc.getContext('2d').putImageData(img, 0, 0);
    const hedef = o.hedef;
    const gl = o.golge;
    if (gl) {
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(kc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#0c1a1e';
      sx.fillRect(0, 0, w, h);
      const pad = Math.ceil(gl.blur * K * 2.5) + 2;
      const bc = tuvalYap(w + 2 * pad, h + 2 * pad);
      const bx = bc.getContext('2d');
      bx.filter = `blur(${gl.blur * K}px)`;
      bx.drawImage(sc, pad, pad);
      hedef.save();
      hedef.globalAlpha = gl.alfa;
      hedef.drawImage(bc, X0 + gl.dx * K - pad, Y0 + gl.dy * K - pad);
      hedef.restore();
    }
    hedef.drawImage(kc, X0, Y0);
  }

  // ------------------------------------------------------------------ biçim yardımcıları
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dolYol = (d) => (g) => g.fill(P2(d));

  // ================================================================== ALT BOYA
  const alt = tuvalYap(N, N);
  const ag = alt.getContext('2d', { willReadFrequently: true });

  // ------------------------------------------------------------------ 1. gök: aydınlık kuşluk-öğle, tasarlanmış bulut kütleleri
  const GW = 1024;
  const gokT = tuvalYap(GW, GW);
  const gokX = gokT.getContext('2d');
  const gokVeri = gokX.createImageData(GW, GW);
  const BULUT = new Float32Array(GW * GW); // ışın hesabında örtü
  const GX0 = 880, GY0 = 140; // güneş
  {
    // kümülüs kütleleri: tasarlanmış kabarcık (billow) kümeleri, düz tabanlı; kenarları gürültüyle aşınır
    const br = S.rng(3811);
    const KAB = [];
    const kume = (x0, x1, taban, tepe, rmin, rmax, adet, tepeT) => {
      for (let i = 0; i < adet; i++) {
        const t = (i + br() * 0.8) / adet;
        const x = x0 + (x1 - x0) * t;
        const prof = Math.max(0, 1 - Math.abs(t - tepeT) / Math.max(tepeT, 1 - tepeT));
        const r = (rmin + (rmax - rmin) * (0.35 + 0.65 * prof)) * (0.75 + 0.35 * br());
        const y = taban - r * 0.75 - tepe * prof * (0.55 + 0.45 * br());
        KAB.push({ x, y, r, taban });
      }
    };
    kume(-70, 470, 300, 120, 30, 92, 30, 0.38);
    kume(735, 1090, 505, 30, 14, 38, 18, 0.45);
    kume(-60, 280, 518, 26, 14, 34, 14, 0.4);
    // kabarcıklar yumuşak birleşimle (log-toplam-üs) tek bir yükseklik alanına dönüşür; normal bu alandan alınır
    const CH = new Float32Array(GW * GW), CU = new Float32Array(GW * GW);
    const KK = 9;
    for (let y = 0; y < 560; y++)
      for (let x = 0; x < GW; x++) {
        const qx = x + fbm(x / 90, y / 90 + 3, 2) * 12, qy = y + fbm(x / 90 + 5, y / 90, 2) * 7;
        let u = 0, se = 0;
        for (const k of KAB) {
          const dx = qx - k.x, dy = qy - k.y;
          if (dx > k.r || dx < -k.r || dy > k.r || dy < -k.r) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 >= k.r * k.r) continue;
          const v = ss(k.r, k.r * 0.45, Math.sqrt(d2));
          if (v > u) u = v;
          se += Math.exp((Math.sqrt(k.r * k.r - d2) + (k.taban - k.y) * 0.35) / KK);
        }
        if (se > 0) {
          const i = y * GW + x;
          CH[i] = KK * Math.log(se) + fbm(x / 34, y / 34, 3) * 4 * u;
          CU[i] = u;
        }
      }
    // kümülüslerin düz tabanı
    for (let y = 0; y < 560; y++)
      for (let x = 0; x < GW; x++) {
        let tb = 0;
        for (const k of KAB) if (Math.abs(x - k.x) < k.r * 1.1 && y < k.taban + 30) tb = Math.max(tb, ss(k.taban + 8, k.taban - 16, y));
        CU[y * GW + x] *= tb;
      }
    const kabarcik = (x, y) => CU[Math.min(GW - 1, y) * GW + x];
    let KN = [0, 0, 1];
    const kabNormal = (x, y) => {
      const i = y * GW + x;
      const gx = (CH[Math.min(i + 2, GW * GW - 1)] - CH[Math.max(0, i - 2)]) / 4;
      const gy = (CH[Math.min(i + 2 * GW, GW * GW - 1)] - CH[Math.max(0, i - 2 * GW)]) / 4;
      KN = nrm([-gx, -gy, 0.9]);
    };
    const serit = (x, y) => {
      const wx = fbm(x / 260 + 4.1, y / 160, 3) * 60;
      const X = x + wx;
      const ns = fbm(X / 420, y / 22, 4);
      const bb = Math.exp(-(((y - 236) / 46) ** 2)) * ss(430, 650, X);
      const b2 = Math.exp(-(((y - 92) / 30) ** 2)) * ss(540, 790, X);
      const ser = ss(-0.02, 0.28, ns + bb * 0.62 - 0.42) * bb * 0.95;
      const ser2 = ss(0.0, 0.28, ns + b2 * 0.58 - 0.4) * b2 * 0.8;
      return Math.max(ser, ser2);
    };
    const LC = nrm([0.55, -0.6, 0.55]); // bulutlar sağ üstten ve önden ışık alır (öğle)
    const g0 = hex('#3C88CC'), g1 = hex('#7FB8E2'), g2 = hex('#DCEAF2'), g3 = hex('#EEF4F6');
    const sA = hex('#FFFCF0'), sB = hex('#CFE4F3');
    const sic = hex('#FFF6DE');
    const bS = hex('#9DB2C6'), bO = hex('#C2D0DD'), bI = hex('#F3F6F9'), bK = hex('#FFFFFF'), bU = hex('#A9C6DE');
    for (let j = 0; j < GW; j++) {
      const y = j;
      for (let i = 0; i < GW; i++) {
        const x = i;
        // gök iki degradenin karışımı: dikey degrade (sol üstte gök mavisi → ufukta beyaz sis) ve güneşin
        // çevresinde ışınsal beyaz-sarı ışık halesi (→ açık mavi); ikisi de açık değerde buluşur
        const t = Math.max(0, Math.min(1, (y + (1024 - x) * 0.08) / 830));
        let s;
        if (t < 0.5) s = karis(g0, g1, ss(0, 0.5, t));
        else s = karis(g1, g2, ss(0.5, 1, t));
        const dx = x - GX0, dy = y - GY0;
        const dd = Math.sqrt(dx * dx + dy * dy);
        const sicak = karis(sA, sB, ss(80, 560, dd));
        s = karis(s, sicak, ss(400, 40, dd) * 0.6);
        if (y > 520) s = karis(s, g3, ss(520, 800, y) * 0.7);
        // güneş ışıltısı eklenerek (karıştırılmadan) verilir: gök ışıldar
        const parla = Math.exp(-dd / 24) * 1.1 + Math.exp(-dd / 110) * 0.14;
        let r = s[0] + sic[0] * parla, g = s[1] + sic[1] * parla * 0.98, b = s[2] + sic[2] * parla * 0.92;
        const disk = ss(27, 21, dd);
        r += disk * 3;
        g += disk * 2.95;
        b += disk * 2.7;
        const yakin = Math.exp(-dd / 300);
        // kümülüs: hacimli, arkadan ışıklı kabarcıklar
        const u = y < 560 ? kabarcik(x, y) : 0;
        let ku = 0;
        if (u > 0) {
          ku = ss(0.18, 0.66, u + fbm(x / 36, y / 36, 4) * 0.4 * (1.1 - u));
          if (ku > 0.001) {
            kabNormal(x, y);
            const n = KN;
            const lam = n[0] * LC[0] + n[1] * LC[1] + n[2] * LC[2];
            let cc = karis(bS, bO, ss(-0.5, -0.05, lam));
            cc = karis(cc, bI, ss(-0.12, 0.42, lam) * (0.7 + 0.3 * yakin));
            cc = karis(cc, bK, ss(0.35, 0.8, lam) * yakin);
            // gölgedeki alt yüzler gökten mavi yansıma alır; ince kenarlar ışığı geçirir
            cc = karis(cc, bU, Math.max(0, n[1]) * 0.3 * (1 - ss(0.0, 0.5, lam)));
            // güneşe yakın bulutlar ışıkla dolar: gövdeleri de beyazlaşır
            const yakin2 = Math.exp(-dd / 520);
            cc = karis(cc, bI, ss(0.25, 0.7, yakin2) * 0.5 * (0.4 + 0.6 * ss(-0.3, 0.3, lam)));
            const gec = (1 - ku) * (0.35 + yakin);
            r = r * (1 - ku) + (cc[0] + sic[0] * gec * 0.5) * ku;
            g = g * (1 - ku) + (cc[1] + sic[1] * gec * 0.5) * ku;
            b = b * (1 - ku) + (cc[2] + sic[2] * gec * 0.48) * ku;
          }
        }
        // ince şerit bulutlar: güneşe yakın olanlar ışık geçirir, uzaktakiler koyulaşır
        const sd = serit(x, y);
        if (sd > 0.001) {
          const ilk = serit(x + 0.8 * 10, y - 0.55 * 10);
          const isik = Math.max(0, Math.min(1, 0.45 + (sd - ilk) * 3.0));
          let cc = karis(bS, bO, 0.3 + 0.7 * yakin);
          cc = karis(cc, bI, ss(0.4, 0.9, isik) * (0.4 + 0.6 * yakin));
          cc = karis(cc, bK, yakin * yakin * isik);
          const kenar = Math.pow(1 - sd, 3) * yakin * 2.4;
          const dk = ss(0.0, 0.6, sd) * 0.92;
          r = r * (1 - dk) + (cc[0] + kenar) * dk;
          g = g * (1 - dk) + (cc[1] + kenar * 0.97) * dk;
          b = b * (1 - dk) + (cc[2] + kenar * 0.9) * dk;
        }
        BULUT[j * GW + i] = Math.max(ku, sd);
        const p = (j * GW + i) * 4;
        gokVeri.data[p] = enc(r / (1 + r * 0.25) * 1.25);
        gokVeri.data[p + 1] = enc(g / (1 + g * 0.25) * 1.25);
        gokVeri.data[p + 2] = enc(b / (1 + b * 0.25) * 1.25);
        gokVeri.data[p + 3] = 255;
      }
    }
    gokX.putImageData(gokVeri, 0, 0);
    ag.save();
    ag.imageSmoothingQuality = 'high';
    ag.filter = `blur(${0.8 * K}px)`;
    ag.drawImage(gokT, 0, 0, N, N);
    ag.restore();
  }

  // ------------------------------------------------------------------ 2. uzak tepeler (hava perspektifi), yer
  function sirt(y0, amp, f, ph, oct) {
    const pts = [];
    for (let x = -20; x <= 1044; x += 4) pts.push([x, y0 - amp * (0.5 + 0.5 * fbm(x * f + ph, ph * 3.1, oct))]);
    return pts;

  function tepeCiz(pts, renkUst, renkAlt, y2) {

    gr.addColorStop(0, renkUst);
    gr.addColorStop(1, renkAlt);
    ag.fillStyle = gr;
    ag.fill();
    ag.restore();
  }

  tepeCiz(sirt(705, 95, 0.005, 7.3, 4), '#9CB3C2', '#CCDAE0', 820);

      ag.fillStyle = hg;

      ag.arc(0, 0, 1, 0, 7);
      ag.fill();
      ag.restore();
    }
    ag.restore();
  }

  // ------------------------------------------------------------------ 3. yapı (ayrı tuvalde: gölge ve ışın örtüsü için)
  const yapi = tuvalYap(N, N);
  const yg = yapi.getContext('2d');
  const TAS = malz({ L: '#FFFAF0', M: '#EAE4D8', D: '#A3B4C2', C: '#8293A2', R: '#CAC4BA', ks: 0.08, g: 20, rim: 1.3 });
  const TASK = malz({ L: '#F6F1E6', M: '#DFD8CA', D: '#96A8B6', C: '#76889A', R: '#BCB6AC', ks: 0.06, g: 20, rim: 1.3 });
  const ALTIN = malz({ L: '#FFF0B0', M: '#E8B24A', D: '#7A5220', C: '#40290E', R: '#B0782E', ks: 2.6, g: 80, rim: 2.2, t0: -0.15, t1: 0.3, sk: 1.4 });
  const KUBBE = malz({ L: '#7CCB68', M: '#2F9655', D: '#286A5C', C: '#1C5246', R: '#3A7E5E', ks: 0.12, g: 60, y0: 0.3, y1: 1.05, rim: 1.8, leke: 0.05 });
  const KASNAK = malz({ L: '#70C062', M: '#2A8E50', D: '#256458', C: '#1A4C42', R: '#36785A', ks: 0.1, g: 50, y0: 0.25, y1: 1.0, rim: 1.6 });
  const parcalar = S.minareParcalari();
  const minPen = S.minarePencereleri;
  const penIcinde = (y1, y2) => minPen.filter((p) => p.y >= y1 && p.y + p.h <= y2);
  function alem(a, olcek) {
    const gl = { dx: -1.5 * olcek, dy: 1.5 * olcek, blur: 1.5, alfa: 0.4 };
    katman({ hedef: yg, ciz: (g) => g.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1), mat: ALTIN, tip: 'donel', bevel: 1.2, golge: gl });
    katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, 7); g.fill(); }, mat: ALTIN, tip: 'donel', zs: 0.5, bevel: 3 * olcek, golge: gl });
    for (const k of a.kureler) katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.arc(k.cx, k.cy, k.r, 0, 7); g.fill(); }, mat: ALTIN, bevel: k.r, golge: gl });
    const hl = a.hilal;

  }
  for (const p of parcalar) {
    if (p.tip === 'alem') {

    }
    if (p.tip === 'bant') continue;

    if (p.tip === 'poligon') {

    const korkuluk = p.tip === 'korkuluk';
    const zz = p.ad === 'gövde-alt' ? S.zikzakCizgileri() : null;
    katman({
      hedef: yg,
      ciz: dolYol(d),
      tip: 'donel',
      mat: p.ad.startsWith('şerefe') || p.ad === 'bilezik' ? TASK : TAS,
      bevel: 1.8,
      oyuk: pen.length || korkuluk
        ? (g) => {
            for (const q of pen) g.fill(P2(S.kemerYolu(q.x, q.y, q.w, q.h)));
            if (korkuluk) {

              for (let i = 0; i < adet; i++) {

      oyukDerin: 4,
      oyukDuvar: 1.1,
      ek: zz
        ? (x, y) => {
            let best = 99;
            for (const z of zz)
              for (let k = 0; k < z.length - 1; k++) {
                const [ax, ay] = z[k], [bx, by] = z[k + 1];
                if (x < Math.min(ax, bx) - 3 || x > Math.max(ax, bx) + 3) continue;
                const vx = bx - ax, vy = by - ay;
                const t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)));
                const dd = Math.hypot(x - ax - vx * t, y - ay - vy * t);
                if (dd < best) best = dd;
              }
            const o = Math.exp(-(best * best) / 2.2);
            return [-1.6 * o, o * 0.5];
          }
        : null,
      golge: { dx: -1.5, dy: 2.5, blur: 2, alfa: 0.5 },
    });
  }
  // minare kubbenin arkasında: biraz daha pus (derinlik)
  {

  const KD = S.kaide;

  for (let k = 1; k >= 0; k--) {

  const DILIM = 16;
  katman({
    hedef: yg,

      const dd = Math.min(fr, 1 - fr);

  // arka plan (gök, tepeler, yer ve yer gölgesi): boya geçişinde yapı ve bitkilerden ayrı boyanır
  const arka = tuvalYap(N, N);
  arka.getContext('2d').drawImage(alt, 0, 0);
  ag.drawImage(yapi, 0, 0);
  // yapının dibinde yer pusu
  const yerPusu = (g) => {

    pg.addColorStop(0, 'rgba(236,243,247,0)');
    pg.addColorStop(0.55, 'rgba(238,244,248,0.42)');
    pg.addColorStop(1, 'rgba(232,240,244,0)');
    g.fillStyle = pg;
    g.fillRect(0, 735 * K, N, 115 * K);
  };
  yerPusu(ag);

  // ------------------------------------------------------------------ 4. bitkiler: güneşte aydınlık ön plan, kenarı ışıldayan taç yapraklar
  const bitki = tuvalYap(N, N);
  const bg2 = bitki.getContext('2d');
  const B = S.bitki;
  // ön plan güneşte; en önde yer yer kadraj dışındaki bir ağacın hafif, açık gölgesi düşer (derinlik)
  const onGolge = (x, y) => {
    const leke = ss(0.18, 0.42, fbm(x / 140 + 3, y / 110 + 1, 3));
    const derin = ss(820, 980, y);
    return (1 - derin) * (0.78 + 0.22 * leke) + derin * (0.55 + 0.4 * leke);
  };
  const YAPRAK = malz({ L: '#B6D46E', M: '#5E9C48', D: '#3C6A52', C: '#2C5442', R: '#4E7C5E', ks: 0.3, g: 26, rim: 3.0, arka: true, gecir: 0.12, t0: -0.1, t1: 0.25 });
  const SAP = malz({ L: '#A6C462', M: '#5A8E42', D: '#3C6450', C: '#2C4E3E', R: '#4E7458', ks: 0.1, g: 20, rim: 1.8 });
  const TACY = malz({ L: '#FFFDF8', M: '#EFEDE8', D: '#A8B4C8', C: '#8C98AE', R: '#C6C8D0', ks: 0.15, g: 22, rim: 5.5, arka: true, gecir: 0.22, t0: -0.12, t1: 0.22, leke: 0.03 });
  const TOMUR = malz({ L: '#FFD6DA', M: '#ECAAB8', D: '#BE96A6', C: '#A48092', R: '#D0A4B0', ks: 0.2, g: 30, rim: 2, gecir: 0.25 });
  const ORTA = malz({ L: '#FFE08A', M: '#DCA23C', D: '#6E5022', C: '#4A3414', R: '#A07432', ks: 0.4, g: 30, rim: 1.6 });
  for (const s of B.saplar)
    katman({ hedef: bg2, ciz: (g) => { g.lineWidth = 4.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(P2(S.yol(s))); }, mat: SAP, bevel: 2.2, golgede: onGolge, golge: { dx: -2, dy: 2, blur: 2, alfa: 0.35 } });
  B.yapraklar.forEach((y) => {
    const [a, b] = S.yaprakDamari(y);
    katman({
      hedef: bg2,
      ciz: dolYol(S.yaprakYolu(y)),
      mat: YAPRAK,
      kenar: 1.0,
      kenarW: 1.6,
      bevel: Math.min(3, y.uzunluk * 0.06),
      yuk: 0.8,
      yastik: y.uzunluk * 0.07,
      yastikR: y.uzunluk * 0.25,
      golgede: onGolge,
      ek: (x, yy) => {
        const vx = b[0] - a[0], vy = b[1] - a[1];
        const t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (yy - a[1]) * vy) / (vx * vx + vy * vy)));
        const d = Math.hypot(x - a[0] - vx * t, yy - a[1] - vy * t);
        return [-0.9 * Math.exp(-(d * d) / 0.8), 0];
      },
      golge: { dx: -2, dy: 2.5, blur: 2.5, alfa: 0.45 },
    });
  });
  for (const t of B.tomurcuklar) katman({ hedef: bg2, ciz: dolYol(S.tomurcukYolu(t)), mat: TOMUR, bevel: t.r * 0.9, golgede: onGolge, golge: { dx: -1.5, dy: 2, blur: 2, alfa: 0.35 } });
  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);
  for (const { c } of sirali) {
    for (const e of S.tacYapraklari(c)) {
      katman({
        hedef: bg2,
        ciz: (g) => {
          g.beginPath();
          g.ellipse(e.cx, e.cy, e.rx * 1.02, e.ry * 1.05, e.aci, 0, 7);
          g.fill();
        },
        mat: TACY,
        carp: (x, y) => {
          // taç yaprağın dibinde hafif pembe
          const t = Math.min(1, Math.hypot(x - c.x, y - c.y) / (c.r * 0.6));
          const m = 1 - ss(0, 1, t);
          return [1 - 0.04 * m, 1 - 0.3 * m, 1 - 0.22 * m];
        },
        bevel: Math.max(1.2, c.r * 0.06),
        kenar: 2.4,
        kenarW: Math.max(1.6, c.r * 0.09),
        yuk: 0.6,
        yastik: c.r * 0.06,
        yastikR: c.r * 0.3,
        ek: (x, y) => {
          const a = Math.atan2(y - c.y, x - c.x), d = Math.hypot(x - c.x, y - c.y) / c.r;
          const v = Math.pow(Math.abs(Math.sin(a * 13 + d * 1.5)), 6);
          return [-0.25 * v * ss(0.15, 0.4, d) * c.r * 0.02, v * 0.08 * ss(0.15, 0.4, d)];
        },
        golgede: onGolge,
        golge: { dx: -1.5, dy: 2.5, blur: Math.max(1.5, c.r * 0.06), alfa: 0.45 },
      });
    }
    katman({ hedef: bg2, ciz: (g) => { g.beginPath(); g.arc(c.x, c.y, c.r * 0.19, 0, 7); g.fill(); }, mat: ORTA, bevel: c.r * 0.17, golgede: onGolge, golge: { dx: -1, dy: 1.5, blur: 1.5, alfa: 0.4 } });
  }

  // ------------------------------------------------------------------ 5. hacimsel ışık huzmeleri (güneşe doğru radyal örnekleme)
  // Huzmeler boya geçişinden sonra, ayrı bir ışık katmanı olarak eklenir (ressamın son 'screen' katmanı).
  const ISIN = {};
  {
    const RW2 = 512, q = RW2 / 1024;
    const oc = tuvalYap(RW2, RW2);
    const ox = oc.getContext('2d', { willReadFrequently: true });
    ox.drawImage(bitki, 0, 0, RW2, RW2);
    const bd = ox.getImageData(0, 0, RW2, RW2).data;
    ox.drawImage(yapi, 0, 0, RW2, RW2);
    const od = ox.getImageData(0, 0, RW2, RW2).data;
    // ışık kaynağı görüntüsü: güneş ve çevresindeki parlak gök, bulut ve nesnelerle örtülür
    const KAY = new Float32Array(RW2 * RW2);
    const ORT = new Float32Array(RW2 * RW2);
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const X = i / q, Y = j / q;
        const bi = Math.min(GW - 1, Math.round(X)) + Math.min(GW - 1, Math.round(Y)) * GW;
        const dd = Math.hypot(X - GX0, Y - GY0);
        const kaynak = Math.exp(-dd / 38) + Math.exp(-dd / 110) * 0.25;
        const ort = Math.max(ss(0.25, 0.85, BULUT[bi]) * 0.92, od[(j * RW2 + i) * 4 + 3] / 255);
        KAY[j * RW2 + i] = kaynak * (1 - ort);
        ORT[j * RW2 + i] = Math.max(ss(0.3, 0.9, BULUT[bi]) * 0.6, od[(j * RW2 + i) * 4 + 3] / 255);
      }
    const sx = GX0 * q, sy = GY0 * q;
    const ADIM = 96;
    const OUT = new Float32Array(RW2 * RW2);
    const KOY = new Float32Array(RW2 * RW2);
    // sanat yönetimiyle seçilmiş demetler (güneşten açı, genişlik, güç): kubbenin üstünden, minare ile kubbe
    // arasından, sağ kenardan meydana inen ışık şeritleri
    const DEMET = [[1.7, 0.06, 0.6], [1.98, 0.045, 0.5], [2.3, 0.075, 0.45], [2.6, 0.09, 0.75], [2.85, 0.055, 0.9], [3.03, 0.07, 0.6]];
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const dx = (sx - i) / ADIM, dy = (sy - j) / ADIM;
        let x = i, y = j, top = 0, zay = 1, ort = 0, ortY = 0;
        for (let k = 0; k < ADIM; k++) {
          const xi = x | 0, yi = y | 0;
          if (xi >= 0 && yi >= 0 && xi < RW2 && yi < RW2) {
            const ii = yi * RW2 + xi;
            top += KAY[ii] * zay;
            ort += ORT[ii];
            ortY += od[ii * 4 + 3] / 255;
          }
          zay *= 0.985;
          x += dx;
          y += dy;
        }
        const vis = Math.exp(-ort * 0.07);
        const visY = Math.exp(-ortY * 0.12) * (0.6 + 0.4 * vis);
        const X = i / q - GX0, Y = j / q - GY0;
        const dd = Math.hypot(X, Y);
        const an = Math.atan2(Y, X);
        let dm = 0;
        for (const [a0, w0, g0] of DEMET) dm += g0 * Math.exp(-(((an - a0) / w0) ** 2));
        dm *= 0.75 + 0.25 * fbm(an * 9 + 3, dd / 300, 2);
        const uz = ss(60, 300, dd) * Math.exp(-dd / 1500);
        const v = (top / ADIM) * 4.0 * (0.3 + 0.7 * Math.exp(-dd / 380));
        const obj = od[(j * RW2 + i) * 4 + 3] / 255;
        const bit = bd[(j * RW2 + i) * 4 + 3] / 255;
        OUT[j * RW2 + i] = Math.min(1.2, v * (0.12 + 0.88 * ss(40, 260, dd)) + dm * visY * uz * 1.15) * (1 - 0.88 * obj) * (1 - 0.75 * bit);
        // demet aralarında ve örtülerin gölgesinde pus koyulaşır: hacimsel gölge
        const yel = ss(1.5, 1.9, an) * ss(3.3, 2.9, an);
        KOY[j * RW2 + i] = (1 - obj) * yel * ss(120, 360, dd) * (0.7 * (1 - visY) + 0.25 * (1 - Math.min(1, dm))) * 0.8;
      }
    const rc = tuvalYap(RW2, RW2);
    const rx = rc.getContext('2d');
    const rd = rx.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      rd.data[i * 4] = 255;
      rd.data[i * 4 + 1] = 252;
      rd.data[i * 4 + 2] = 240;
      rd.data[i * 4 + 3] = Math.round(Math.min(1, OUT[i]) * 0.8 * 255);
    }
    rx.putImageData(rd, 0, 0);
    const kc2 = tuvalYap(RW2, RW2);
    const kx2 = kc2.getContext('2d');
    const kd2 = kx2.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      kd2.data[i * 4] = 120;
      kd2.data[i * 4 + 1] = 150;
      kd2.data[i * 4 + 2] = 176;
      kd2.data[i * 4 + 3] = Math.round(Math.min(0.16, KOY[i] * 0.4) * 255);
    }
    kx2.putImageData(kd2, 0, 0);
    ISIN.rc = rc;
    ISIN.kc2 = kc2;
    ag.drawImage(bitki, 0, 0);
  }
  // ön planın en altı: hafif serin ton (derinlik; karartma yok)
  const onKoyu = (g) => {
    const pg = g.createLinearGradient(0, 860 * K, 0, N);
    pg.addColorStop(0, 'rgba(70,100,120,0)');
    pg.addColorStop(1, 'rgba(70,100,120,0.12)');
    g.fillStyle = pg;
    g.fillRect(0, 830 * K, N, N - 830 * K);
  };
  onKoyu(ag);

  // ================================================================== BOYA GEÇİŞİ
  if (DBG === 'isin') {
    ana.fillStyle = '#000';
    ana.fillRect(0, 0, N, N);
    ana.drawImage(ISIN.rc, 0, 0, N, N);
    S.hazir();
    return;
  }
  if (DBG === 'alt') {
    ana.drawImage(alt, 0, 0);
    S.hazir();
    return;
  }
  const W = 1024;
  const tmp = tuvalYap(W, W);
  const tx = tmp.getContext('2d', { willReadFrequently: true });
  const oku = (src, blur) => {
    tx.save();
    tx.setTransform(1, 0, 0, 1, 0, 0);
    tx.clearRect(0, 0, W, W);
    tx.filter = blur > 0.3 ? `blur(${blur}px)` : 'none';
    tx.drawImage(src, 0, 0, W, W);
    tx.restore();
    return tx.getImageData(0, 0, W, W).data;
  };
  const rr = S.rng(3838);
  const ixf = (x, y) => (Math.max(0, Math.min(W - 1, Math.round(y))) * W + Math.max(0, Math.min(W - 1, Math.round(x)))) * 4;
  const farkC = (a, i, c) => Math.abs(a[i] - c[0]) + Math.abs(a[i + 1] - c[1]) + Math.abs(a[i + 2] - c[2]);
  const icinde = (yol, x, y) => tx.isPointInPath(yol, x, y);

  /** Vuruş: yuvarlak uçlu gövde + içinde açık/koyu kıl izleri (yassı dijital fırça). */
  function vurus(g, p, c, R, a, kil) {
    const n = p.length;
    if (n < 2) return;
    const jv = (rr() - 0.5) * 2, jt = (rr() - 0.5) * 2;
    const cr = c[0] + jv * 6 + jt * 5, cg = c[1] + jv * 6, cb = c[2] + jv * 6 - jt * 5;
    const yol = (o, a0, a1) => {
      const i0 = Math.floor(a0 * (n - 1)), i1 = Math.max(i0 + 1, Math.ceil(a1 * (n - 1)));
      const q = [];
      for (let i = i0; i <= Math.min(n - 1, i1); i++) {
        const pa = p[Math.max(0, i - 1)], pb = p[Math.min(n - 1, i + 1)];
        const tx2 = pb[0] - pa[0], ty2 = pb[1] - pa[1];
        const m = Math.hypot(tx2, ty2) || 1;
        q.push([p[i][0] - (ty2 / m) * o, p[i][1] + (tx2 / m) * o]);
      }
      g.beginPath();
      g.moveTo(q[0][0], q[0][1]);
      if (q.length <= 2) g.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
      else {
        for (let i = 1; i < q.length - 1; i++) g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
        g.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
      }
    };
    g.lineCap = 'round';
    g.lineWidth = 2 * R;
    g.strokeStyle = `rgba(${cr | 0},${cg | 0},${cb | 0},${a})`;
    yol(0, 0, 1);
    g.stroke();
    const nb = R >= 8 ? 6 : R >= 4 ? 4 : R >= 1.6 ? 3 : 0;
    if (kil > 0 && nb) {
      g.lineCap = 'butt';
      g.lineWidth = ((2 * R) / nb) * 0.7;
      for (let b = 0; b < nb; b++) {
        const o = ((b + 0.5) / nb - 0.5) * 2 * R * 0.85;
        const tv = (rr() - 0.5) * 26;
        g.strokeStyle = `rgba(${(cr + tv) | 0},${(cg + tv) | 0},${(cb + tv) | 0},${kil})`;
        yol(o, rr() * 0.25, 0.7 + rr() * 0.3);
        g.stroke();
      }
    }
  }

  /** Kenarda duran iz: (x,y)'den yön alanı boyunca iki yana yürür; renk sıçramasında ya da bölge dışında durur. */
  function iz(x, y, yon, R, boy, ref, yol, esik) {
    const i0 = ixf(x, y);
    const c = [ref[i0], ref[i0 + 1], ref[i0 + 2]];
    const adim = Math.max(1, R * 0.9);
    const sonuc = [[x, y]];
    for (const sg of [1, -1]) {
      let px = x, py = y;
      for (let k = adim; k <= boy / 2; k += adim) {
        const [dx, dy] = yon(px, py);
        const nx = px + sg * dx * adim, ny = py + sg * dy * adim;
        if (yol && !icinde(yol, nx, ny)) break;
        if (farkC(ref, ixf(nx, ny), c) > esik) break;
        px = nx;
        py = ny;
        if (sg > 0) sonuc.push([px, py]);
        else sonuc.unshift([px, py]);
      }
    }
    return { p: sonuc, c };
  }

  /** Bir bölgeyi yön alanına uyan vuruşlarla boyar; vuruşlar bölgeye kırpılır (bulunmuş kenar). */
  function bolgeBoya(o) {
    const [x0, y0, x1, y1] = o.kutu;
    ana.save();
    ana.setTransform(K, 0, 0, K, 0, 0);
    if (o.yol) ana.clip(o.yol);
    ana.lineJoin = 'round';
    for (let n = 0; n < o.adet; n++) {
      const x = x0 + rr() * (x1 - x0), y = y0 + rr() * (y1 - y0);
      if (o.yol && !icinde(o.yol, x, y)) continue;
      const R = o.R[0] + rr() * (o.R[1] - o.R[0]);
      const boy = o.boy[0] + rr() * (o.boy[1] - o.boy[0]);
      const s = iz(x, y, o.yon, R, boy, o.ref, o.yol, o.esik || 46);
      if (s.p.length < 2) {
        const [dx, dy] = o.yon(x, y);
        s.p = [[x - dx * R * 0.5, y - dy * R * 0.5], [x + dx * R * 0.5, y + dy * R * 0.5]];
      }
      vurus(ana, s.p, s.c, R, o.a, o.kil);
    }
    ana.restore();
  }

  // ------------------------------------------------------------------ 1. arka plan: gök, tepeler ve yer — geniş, sakin vuruşlar
  ana.drawImage(arka, 0, 0);
  {
    const yatay = (yogunluk) => (x, y) => {
      const a = fbm(x / 220 + 2, y / 160, 2) * 0.35 * yogunluk;
      return [Math.cos(a), Math.sin(a)];
    };
    for (const [R, adim, a, boy, esik] of [[18, 22, 0.32, [60, 140], 40], [9, 11, 0.36, [40, 90], 34], [4.5, 6, 0.42, [20, 46], 26]]) {
      const ref = oku(arka, R * 0.5);
      const LUM = (x, y) => {
        const i = ixf(x, y);
        return 0.3 * ref[i] + 0.59 * ref[i + 1] + 0.11 * ref[i + 2];
      };
      // ince fırça yalnız ayrıntı olan yerlerde (bulut kenarları, tepe sırtları)
      const isoYon = (x, y) => {
        const gx = LUM(x + R, y) - LUM(x - R, y), gy = LUM(x, y + R) - LUM(x, y - R);
        const m = Math.hypot(gx, gy);
        if (m < 2) return yatay(1)(x, y);
        let dx = -gy / m, dy = gx / m;
        if (dx < 0) {
          dx = -dx;
          dy = -dy;
        }
        // yataya yatkın
        dx = dx * 0.5 + 0.5;
        dy *= 0.5;
        const k = Math.hypot(dx, dy);
        return [dx / k, dy / k];
      };
      ana.save();
      ana.setTransform(K, 0, 0, K, 0, 0);
      for (let gy = 0; gy < W; gy += adim)
        for (let gx = 0; gx < W; gx += adim) {
          const x = gx + rr() * adim, y = gy + rr() * adim;
          if (R < 6) {
            const gxx = LUM(x + 3, y) - LUM(x - 3, y), gyy = LUM(x, y + 3) - LUM(x, y - 3);
            if (Math.hypot(gxx, gyy) < 6) continue;
          }
          const s = iz(x, y, isoYon, R, boy[0] + rr() * (boy[1] - boy[0]), ref, null, esik);
          vurus(ana, s.p.length > 1 ? s.p : [[x - R, y], [x + R, y]], s.c, R, a, 0.12);
        }
      ana.restore();
    }
  }

  // ------------------------------------------------------------------ 2. yapı: keskin siluet, içinde biçime uyan vuruşlar
  ana.drawImage(yapi, 0, 0);
  const refY = oku(yapi, 0.8);
  const PROF = S.kubbeProfili(120);
  const prof = (t) => {
    const f = Math.max(0, Math.min(1, t)) * (PROF.length - 1);
    const i = Math.min(PROF.length - 2, Math.floor(f)), u = f - i;
    return { y: PROF[i].y + (PROF[i + 1].y - PROF[i].y) * u, r: PROF[i].r + (PROF[i + 1].r - PROF[i].r) * u };
  };
  const kubbeYol = new Path2D('M359,556 C357,430 440,318 560,300 C680,318 763,430 761,556 Z');
  {
    // kubbe: meridyenler boyunca kendinden emin vuruşlar
    ana.save();
    ana.setTransform(K, 0, 0, K, 0, 0);
    ana.clip(kubbeYol);
    ana.lineJoin = 'round';
    for (let n = 0; n < 3200; n++) {
      const fi = (rr() - 0.5) * Math.PI * 0.99;
      const u = Math.sin(fi);
      const t0 = rr() * 0.93, boy = 0.05 + rr() * 0.14;
      const pts = [];
      for (let s = 0; s <= 6; s++) {
        const q = prof(Math.min(0.98, t0 + (boy * s) / 6));
        pts.push([560 + u * q.r, q.y]);
      }
      const orta = pts[3];
      const i = ixf(orta[0], orta[1]);
      const c = [refY[i], refY[i + 1], refY[i + 2]];
      const R = (1.2 + rr() * 1.6) * (0.4 + 0.6 * Math.cos(fi));
      vurus(ana, pts, c, R, 0.7, 0.42);
    }
    ana.restore();
  }
  // kasnak katları: yatay vuruşlar; pencerelerde durur
  for (const q of S.kasnak) {
    const yol = new Path2D();
    yol.rect(q.x1, q.y1, q.x2 - q.x1, q.y2 - q.y1);
    bolgeBoya({ yol, kutu: [q.x1, q.y1, q.x2, q.y2], adet: 900, R: [0.9, 1.8], boy: [8, 22], yon: () => [1, 0], ref: refY, a: 0.7, kil: 0.35, esik: 40 });
  }
  {
    const KD = S.kaide;
    const yol = new Path2D();
    yol.rect(KD.x1, KD.y1, KD.x2 - KD.x1, KD.y2 - KD.y1);
    bolgeBoya({ yol, kutu: [KD.x1, KD.y1, KD.x2, KD.y2], adet: 1500, R: [1.2, 2.6], boy: [12, 34], yon: () => [1, 0.03], ref: refY, a: 0.6, kil: 0.3, esik: 36 });
    // minare gövdeleri: dikey vuruşlar
    for (const p of S.minareParcalari()) {
      if (!p.ad.startsWith('gövde') && p.ad !== 'topuz') continue;
      const yol = p.tip === 'topuz' ? new Path2D(p.yol) : new Path2D(S.yol(p.noktalar, true));
      const xs = p.tip === 'topuz' ? [270, 330] : [Math.min(...p.noktalar.map((v) => v[0])), Math.max(...p.noktalar.map((v) => v[0]))];
      const ys = p.tip === 'topuz' ? [146, 200] : [Math.min(...p.noktalar.map((v) => v[1])), Math.max(...p.noktalar.map((v) => v[1]))];
      const alan = (xs[1] - xs[0]) * (ys[1] - ys[0]);
      bolgeBoya({ yol, kutu: [xs[0], ys[0], xs[1], ys[1]], adet: Math.round(alan / 14), R: [0.9, 1.8], boy: [10, 26], yon: () => [0, 1], ref: refY, a: 0.62, kil: 0.3, esik: 34 });
    }
  }
  // kaburgalar: ışık tarafında parlak, gölge tarafında koyu, kesintisiz uzun iki çizgi
  {
    ana.save();
    ana.setTransform(K, 0, 0, K, 0, 0);
    ana.clip(kubbeYol);
    ana.lineCap = 'round';
    for (const kb of S.kaburgalar(16)) {
      const u = kb.u;
      const cfi = Math.sqrt(1 - u * u);
      const isikta = ss(-0.45, 0.15, u);
      for (const [ofs, tip] of [[0.95, 1], [-0.75, -1]]) {
        const t1 = 0.93 + rr() * 0.04;
        const pts = [];
        for (let s = 0; s <= 30; s++) {
          const q = prof(0.01 + ((t1 - 0.01) * s) / 30);
          pts.push([560 + u * q.r + ofs * cfi * (0.5 + 0.5 * (1 - s / 30)), q.y]);
        }
        for (let s = 0; s < 30; s += 3) {
          const m = pts[s + 1];
          const i = ixf(m[0] - ofs * 3, m[1]);
          let c = [refY[i], refY[i + 1], refY[i + 2]];
          if (tip > 0) c = [c[0] * 1.15 + 30, c[1] * 1.1 + 26, c[2] * 1.05 + 10];
          else c = [c[0] * 0.6, c[1] * 0.64, c[2] * 0.66];
          const sonluk = 1 - s / 30;
          ana.lineWidth = (tip > 0 ? 1.25 : 1.1) * (0.45 + 0.55 * cfi) * (0.55 + 0.45 * sonluk);
          const a = (tip > 0 ? 0.2 + 0.55 * isikta : 0.25 + 0.3 * (1 - isikta)) * (0.55 + 0.45 * sonluk);
          ana.strokeStyle = `rgba(${Math.min(255, c[0]) | 0},${Math.min(255, c[1]) | 0},${Math.min(255, c[2]) | 0},${a})`;
          ana.beginPath();
          ana.moveTo(pts[s][0], pts[s][1]);
          for (let k = s + 1; k <= Math.min(30, s + 3); k++) ana.lineTo(pts[k][0], pts[k][1]);
          ana.stroke();
        }
      }
    }
    ana.restore();
  }
  // kayıp kenarlar: gölgede kalan sol siluetler arka plandaki pusa karışır
  {
    const yA = oku(yapi, 1.5);
    const refA = oku(arka, 2);
    ana.save();
    ana.setTransform(K, 0, 0, K, 0, 0);
    ana.lineCap = 'round';
    for (let y = 150; y < 800; y += 2)
      for (let x = 230; x < 600; x++) {
        const i = (y * W + x) * 4;
        const a = yA[i + 3] / 255;
        if (a < 0.35 || a > 0.65) continue;
        const ax = (yA[i + 7] - yA[i - 1]) / 255, ay = (yA[i + 3 + W * 4] - yA[i + 3 - W * 4]) / 255;
        if (ax < 0.12) continue; // yalnız soldan bakan kenarlar
        const l = (0.3 * refY[i + 4] + 0.59 * refY[i + 5] + 0.11 * refY[i + 6]) / 255;
        if (l > 0.5 || rr() > 0.6) continue;
        const m = Math.hypot(ax, ay) || 1;
        const tx2 = -ay / m, ty2 = ax / m;
        const j = ixf(x - 5, y);
        const k = ixf(x + 3, y);
        const c = [refA[j] * 0.35 + refY[k] * 0.65, refA[j + 1] * 0.35 + refY[k + 1] * 0.65, refA[j + 2] * 0.35 + refY[k + 2] * 0.65];
        const L = 6 + rr() * 10;
        ana.lineWidth = 2 + rr() * 2.5;
        ana.strokeStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${0.28 + rr() * 0.22})`;
        ana.beginPath();
        ana.moveTo(x - tx2 * L * 0.5, y - ty2 * L * 0.5);
        ana.lineTo(x + tx2 * L * 0.5, y + ty2 * L * 0.5);
        ana.stroke();
      }
    ana.restore();
  }
  yerPusu(ana);

  // ------------------------------------------------------------------ 3. bitkiler: yaprak boyunca ve taç yaprakta merkezden dışa vuruşlar
  ana.drawImage(bitki, 0, 0);
  {
    const refB = oku(bitki, 0.8);
    const B = S.bitki;
    for (const y of B.yapraklar) {
      const yol = new Path2D(S.yaprakYolu(y));
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const xs = [y.x, y.x + ca * L], ys = [y.y, y.y + sa * L];
      const pad = L * y.genislik * 0.6;
      bolgeBoya({ yol, kutu: [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad], adet: Math.round(L * 1.4), R: [0.9, 2.0], boy: [L * 0.2, L * 0.55], yon: () => [ca, sa], ref: refB, a: 0.75, kil: 0.38, esik: 40 });
    }
    const sirali = B.cicekler.slice().sort((a, b) => a.y - b.y);
    for (const c of sirali) {
      // her taç yaprak kendi sırasıyla ve kendine kırpılarak: yapraklar arası kenarlar korunur
      for (const e of S.tacYapraklari(c)) {
        const yol = new Path2D();
        yol.ellipse(e.cx, e.cy, e.rx * 1.02, e.ry * 1.05, e.aci, 0, 7);
        bolgeBoya({
          yol,
          kutu: [e.cx - e.rx * 1.05, e.cy - e.rx * 1.05, e.cx + e.rx * 1.05, e.cy + e.rx * 1.05],
          adet: Math.round(c.r * 2.4),
          R: [Math.max(0.7, c.r * 0.03), Math.max(1.3, c.r * 0.06)],
          boy: [c.r * 0.2, c.r * 0.5],
          yon: (x, y) => {
            const dx = x - c.x, dy = y - c.y, m = Math.hypot(dx, dy) || 1;
            return [dx / m, dy / m];
          },
          ref: refB,
          a: 0.7,
          kil: 0.4,
          esik: 34,
        });
      }
      // çiçek göbeği keskin kalır
      ana.save();
      ana.setTransform(K, 0, 0, K, 0, 0);
      ana.beginPath();
      ana.arc(c.x, c.y, c.r * 0.21, 0, 7);
      ana.clip();
      ana.setTransform(1, 0, 0, 1, 0, 0);
      ana.drawImage(bitki, 0, 0);
      ana.restore();
    }
  }
  onKoyu(ana);

  // ------------------------------------------------------------------ 4. altın alemler: metal gibi parlayan, keskin kenarlı
  {
    const g = ana;
    const altin = (a) => {
      // çubuk ve yaka: yatay metal degradesi (koyu yansıma bandı + sıcak ışık + beyaz parlama)
      const metal = (x1, x2) => {
        const lg = g.createLinearGradient(x1, 0, x2, 0);
        lg.addColorStop(0, '#4A2E0E');
        lg.addColorStop(0.3, '#A8701E');
        lg.addColorStop(0.55, '#F2C25A');
        lg.addColorStop(0.7, '#FFF4CC');
        lg.addColorStop(0.82, '#E8AE42');
        lg.addColorStop(1, '#7A4C16');
        return lg;
      };
      g.fillStyle = metal(a.cubuk.x1, a.cubuk.x2);
      g.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1);
      g.fillStyle = metal(a.yaka.cx - a.yaka.rx, a.yaka.cx + a.yaka.rx);
      g.beginPath();
      g.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, 7);
      g.fill();
      g.fillStyle = 'rgba(255,240,190,0.55)';
      g.beginPath();
      g.ellipse(a.yaka.cx + a.yaka.rx * 0.15, a.yaka.cy - a.yaka.ry * 0.45, a.yaka.rx * 0.7, a.yaka.ry * 0.28, 0, 0, 7);
      g.fill();
      // küreler: güneş tarafında sıcak parlama, karşı kenarda yansıyan ışık
      for (const k of a.kureler) {
        const rg2 = g.createRadialGradient(k.cx + k.r * 0.38, k.cy - k.r * 0.38, 0, k.cx, k.cy, k.r);
        rg2.addColorStop(0, '#FFFBEA');
        rg2.addColorStop(0.16, '#FFE596');
        rg2.addColorStop(0.45, '#D99A34');
        rg2.addColorStop(0.82, '#5E3A10');
        rg2.addColorStop(1, '#B07A2C');
        g.fillStyle = rg2;
        g.beginPath();
        g.arc(k.cx, k.cy, k.r, 0, 7);
        g.fill();
      }
      const h = a.hilal;
      const lg = g.createLinearGradient(h.cx - h.R, h.cy + h.R, h.cx + h.R, h.cy - h.R);
      lg.addColorStop(0, '#5A3810');
      lg.addColorStop(0.45, '#D69A36');
      lg.addColorStop(0.75, '#FFE9A6');
      lg.addColorStop(1, '#FFF8E2');
      g.fillStyle = lg;
      g.fill(new Path2D(S.hilalYolu(h.cx, h.cy, h.R)));
    };
    g.save();
    g.setTransform(K, 0, 0, K, 0, 0);
    // alemin gölge tarafında koyu bir hat (siluet ayrımı)
    altin(S.alemParcalari(560, 300, 1));
    altin(S.alemParcalari(300, 146, 0.62));
    g.restore();
    const parilti = (x, y, r, a) => {
      g.save();
      g.setTransform(K, 0, 0, K, 0, 0);
      g.globalCompositeOperation = 'lighter';
      const hg = g.createRadialGradient(x, y, 0, x, y, r * 2.4);
      hg.addColorStop(0, `rgba(255,246,214,${0.9 * a})`);
      hg.addColorStop(0.25, `rgba(255,236,180,${0.35 * a})`);
      hg.addColorStop(1, 'rgba(255,236,180,0)');
      g.fillStyle = hg;
      g.fillRect(x - r * 2.5, y - r * 2.5, r * 5, r * 5);
      for (const [dx, dy, l] of [[1, 0, 1], [0, 1, 0.8], [0.7, -0.7, 0.35], [0.7, 0.7, 0.35]]) {
        const L = r * l * 3;
        const lg = g.createLinearGradient(x - dx * L, y - dy * L, x + dx * L, y + dy * L);
        lg.addColorStop(0, 'rgba(255,236,190,0)');
        lg.addColorStop(0.5, `rgba(255,248,226,${0.9 * a})`);
        lg.addColorStop(1, 'rgba(255,236,190,0)');
        g.strokeStyle = lg;
        g.lineWidth = 0.9;
        g.beginPath();
        g.moveTo(x - dx * L, y - dy * L);
        g.lineTo(x + dx * L, y + dy * L);
        g.stroke();
      }
      g.restore();
    };
    const A1 = S.alemParcalari(560, 300, 1), A2 = S.alemParcalari(300, 146, 0.62);
    const k0 = A1.kureler[0];
    parilti(k0.cx + k0.r * 0.38, k0.cy - k0.r * 0.38, 6, 1);
    parilti(A1.hilal.cx + A1.hilal.R * 0.72, A1.hilal.cy - A1.hilal.R * 0.25, 3.5, 0.75);
    const m0 = A2.kureler[0];
    parilti(m0.cx + m0.r * 0.38, m0.cy - m0.r * 0.38, 3, 0.6);
  }

  // ================================================================== IŞIK KATMANI: huzmeler ve hacimsel gölge
  {
    ana.save();
    ana.filter = `blur(${4 * K}px)`;
    ana.drawImage(ISIN.kc2, 0, 0, N, N);
    ana.restore();
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 1;
    ana.filter = `blur(${2 * K}px)`;
    ana.drawImage(ISIN.rc, 0, 0, N, N);
    ana.restore();
    // güneş çekirdeği: yüksekte, ince bulutların arasından görünen beyaz-sarı disk
    ana.save();
    ana.setTransform(K, 0, 0, K, 0, 0);
    ana.globalCompositeOperation = 'lighter';
    const sg = ana.createRadialGradient(GX0, GY0, 0, GX0, GY0, 70);
    sg.addColorStop(0, 'rgba(255,252,240,0.95)');
    sg.addColorStop(0.3, 'rgba(255,248,222,0.85)');
    sg.addColorStop(0.36, 'rgba(255,250,228,0.12)');
    sg.addColorStop(1, 'rgba(255,248,226,0)');
    ana.fillStyle = sg;
    ana.fillRect(GX0 - 70, GY0 - 70, 140, 140);
    ana.restore();
  }

  // ================================================================== SON: sis ışıltısı, hafif renk düzeltme, gren
  {
    const bc = tuvalYap(512, 512);
    const bx = bc.getContext('2d');
    bx.filter = 'brightness(0.55) contrast(4) blur(12px)';
    bx.drawImage(tuval, 0, 0, 512, 512);
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 0.18;
    ana.drawImage(bc, 0, 0, N, N);
    ana.restore();
    const id = ana.getImageData(0, 0, N, N);
    const d = id.data;
    const rg = S.rng(3839);
    for (let y = 0; y < N; y++) {
      const vy = (y / N - 0.5) * 2;
      for (let x = 0; x < N; x++) {
        const i = (y * N + x) * 4;
        let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const sl = l * l * (3 - 2 * l);
        const k = l > 0.001 ? (l + (sl - l) * 0.25) / l : 1;
        r *= k;
        g *= k;
        b *= k;
        // canlılık: doygunluğu düşük renkleri biraz canlandır (çamurlaşmayı önler)
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const cv = 1 + 0.22 * (1 - Math.min(1, (mx - mn) * 2.5));
        r = l + (r - l) * cv;
        g = l + (g - l) * cv;
        b = l + (b - l) * cv;
        const ko = (1 - l) * (1 - l), ac = l * l;
        // hafif bölünmüş tonlama: gölgeler serin mavi, ışıklar nötr
        r += -0.03 * ko + 0.012 * ac;
        g += 0.005 * ko + 0.01 * ac;
        b += 0.04 * ko + 0.004 * ac;
        const vx = (x / N - 0.5) * 2;
        const vd = Math.sqrt(vx * vx * 0.9 + vy * vy);
        const vf = 1 - 0.04 * ss(0.8, 1.4, vd); // vinyet yok denecek kadar hafif
        const gr = (rg() + rg() - 1) * 0.026;
        d[i] = Math.max(0, Math.min(255, (r * vf + gr) * 255));
        d[i + 1] = Math.max(0, Math.min(255, (g * vf + gr) * 255));
        d[i + 2] = Math.max(0, Math.min(255, (b * vf + gr) * 255));
      }
    }
    ana.putImageData(id, 0, 0);
  }

  S.hazir();
}, 0);
</script>
