<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-038 Sinematik Sis — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #3a5560; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-038 Sinematik Sis (Cinematic Haze) — film konsept sanatı / dijital mat boyama (matte painting) tarifi.
// İki aşama: (1) "alt boya": sahne, sanatçının değer ve renk kararlarıyla kurulur — altın saat göğü ve tasarlanmış
// bulut kütleleri, hava perspektifiyle puslu uzak tepeler, yükseklik alanından normal alınıp beş tonlu biçim
// boyamasıyla (ışık, yarı ton, çekirdek gölge, yansıyan ışık, düşen gölge) ışıklanan yapı, koyu ön plan çiçekleri,
// güneşe doğru radyal örneklemeyle hacimsel ışık huzmeleri. (2) "boya geçişi": alt boyadan renk alan, büyükten
// küçüğe katman katman eğri fırça vuruşları (kaba fırça gökte ve arka planda, ince fırça yalnız odak yapıda: kayıp
// ve bulunmuş kenarlar). En sonda vurgu parıltıları, ışıltı, sıcak/camgöbeği renk düzeltme, gren ve vinyet.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const K = 2;
  const N = 1024 * K;
  const DBG = new URLSearchParams(location.search).get('dbg') || '';
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3803);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  const ss = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // ------------------------------------------------------------------ ışık kurgusu: altın saat, güneş sağ üstte
  // Işık sağdan ve yukarıdan, kameraya hafif dönük: kubbenin sağ üçte ikisi güneşte, sol kenarı camgöbeği gölgede.
  const LS = nrm([0.78, -0.48, 0.2]);
  const HV = nrm([LS[0], LS[1], LS[2] + 1]);
  const KENAR = [1.0, 0.66, 0.36]; // sıcak kenar ışığı
  const GOKYAN = [0.05, 0.11, 0.15]; // gölgede yukarı bakan yüzeylere gök yansıması (camgöbeği)
  const PARLA = [1.0, 0.86, 0.62];

  /** Malzeme: beş tonlu boya paleti (ışık L, yarı ton M, gölge D, çekirdek gölge C, yansıyan ışık R). */
  function malz(o) {
    return Object.assign({}, o, { L: hex(o.L), M: hex(o.M), D: hex(o.D), C: hex(o.C), R: hex(o.R) });
  }

  // ------------------------------------------------------------------ kabartma katmanı (yükseklik → normal → biçim boyaması)
  function katman(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = o.pay != null ? o.pay : 6;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const md = mg.getImageData(0, 0, w, h).data;
    const A = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) A[i] = md[i * 4 + 3] / 255;
    const ic = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) ic[i] = A[i] > 0.5 ? 1 : 0;
    const D = edt(ic, w, h);
    let AH = null, DH = null;
    if (o.oyuk) {
      const oc = tuvalYap(w, h);
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.setTransform(K, 0, 0, K, -X0, -Y0);
      og.fillStyle = '#fff';
      o.oyuk(og);
      const od = og.getImageData(0, 0, w, h).data;
      AH = new Float32Array(w * h);
      const ih = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        AH[i] = od[i * 4 + 3] / 255;
        ih[i] = AH[i] > 0.5 ? 1 : 0;
      }
      DH = edt(ih, w, h);
    }
    let RL = null, RR = null;
    if (o.tip === 'donel') {
      RL = new Float32Array(h);
      RR = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < w; x++)
          if (A[y * w + x] > 0.5) {
            if (l < 0) l = x;
            r = x;
          }
        RL[y] = l;
        RR[y] = r;
      }
      const L2 = new Float32Array(h), R2 = new Float32Array(h);
      const yr = 3 * K;
      for (let y = 0; y < h; y++) {
        let sl = 0, sr = 0, n = 0;
        for (let k = -yr; k <= yr; k++) {
          const yy = y + k;
          if (yy < 0 || yy >= h || RL[yy] < 0) continue;
          sl += RL[yy];
          sr += RR[yy];
          n++;
        }
        L2[y] = n ? sl / n : RL[y];
        R2[y] = n ? sr / n : RR[y];
      }
      RL = L2;
      RR = R2;
    }
    const bevel = o.bevel || 3;
    const yuk = o.yuk != null ? o.yuk : 1;
    const zs = o.zs != null ? o.zs : 1;
    const yastik = o.yastik || 0;
    let BA = null;
    if (yastik > 0) {
      const bc = tuvalYap(w, h);
      const bx = bc.getContext('2d', { willReadFrequently: true });
      bx.filter = `blur(${(o.yastikR || 20) * K * 0.5}px)`;
      bx.drawImage(mc, 0, 0);
      const bd = bx.getImageData(0, 0, w, h).data;
      BA = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) BA[i] = Math.pow(Math.max(0, Math.min(1, (bd[i * 4 + 3] / 255 - 0.5) * 2)), 0.6);
    }
    const H = new Float32Array(w * h);
    const UU = RL ? new Float32Array(w * h) : null;
    const RW = RL ? new Float32Array(h) : null;
    const SS = new Float32Array(w * h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const d = Math.max(0, D[i] / K - 0.5 + A[i] * 0.5);
        const t = Math.min(1, d / bevel);
        const s = Math.sqrt(1 - (1 - t) * (1 - t));
        SS[i] = s;
        let hh;
        if (RL) {
          const rr = (RR[y] - RL[y] + 1) / 2;
          const c = (RL[y] + RR[y]) / 2;
          const u = rr > 0 ? (x - c) / rr : 0;
          UU[i] = u;
          RW[y] = rr / K;
          hh = (Math.sqrt(Math.max(0, 1 - u * u)) * rr / K) * zs * s;
        } else hh = bevel * yuk * s + (BA ? yastik * BA[i] : 0);
        if (AH && AH[i] > 0.002) {
          const th = Math.min(1, DH[i] / K / (o.oyukDuvar || 1.5));
          hh -= (o.oyukDerin || 5) * Math.sqrt(1 - (1 - th) * (1 - th)) * AH[i];
        }
        H[i] = hh;
      }
    yumusat(H, w, h, K);
    const KAV = new Float32Array(w * h);
    if (o.ek)
      for (let y = 0; y < h; y++) {
        const uy = (Y0 + y) / K;
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (A[i] <= 0.002) continue;
          const e = o.ek((X0 + x) / K, uy, UU ? UU[i] : 0, RW ? RW[y] : 0, SS[i]);
          H[i] += e[0];
          KAV[i] = e[1];
        }
      }
    const img = new ImageData(w, h);
    const P = img.data;
    const m = o.mat;
    const oyukRenk = o.oyukRenk ? hex(o.oyukRenk) : [0.02, 0.03, 0.03];
    const t0 = m.t0 != null ? m.t0 : -0.04, t1 = m.t1 != null ? m.t1 : 0.16;
    const col = [0, 0, 0];
    for (let y = 1; y < h - 1; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const gx = (H[i + 1] - H[i - 1]) * K * 0.5;
        const gy = (H[i + w] - H[i - w]) * K * 0.5;
        const nl = Math.sqrt(gx * gx + gy * gy + 1);
        const nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
        const kd = nx * LS[0] + ny * LS[1] + nz * LS[2];
        const cast = o.golgede ? o.golgede(ux, uy) : 1;
        // beş tonlu biçim boyaması: ışık ailesi ile gölge ailesi net ayrılır (ressamın değer gruplaması)
        const yuz = ss(t0, t1, kd);
        const isik = yuz * cast;
        const yari = ss(0.12, 0.85, kd);
        const cekirdek = ss(-0.5, -0.03, kd) * (1 - yuz);
        const sekme = Math.min(1, Math.max(0, ny) * 0.9 + Math.max(0, -nx) * 0.4) * (1 - cekirdek * 0.65) * (m.rb != null ? m.rb : 0.7);
        const gokr = Math.max(0, -ny) * (m.sk != null ? m.sk : 0.6);
        let ao = 1 - KAV[i];
        let oy = 0;
        if (AH && AH[i] > 0.002) {
          oy = Math.min(1, AH[i] * Math.min(1, DH[i] / K / 1.3 + 0.2));
          ao *= 1 - 0.55 * oy;
        }
        const lv = 1 + (m.leke != null ? m.leke : 0.06) * fbm(ux / 22 + 11, uy / 22, 3);
        const carp = o.carp ? o.carp(ux, uy) : null;
        const rim = Math.pow(1 - nz, 2.4) * Math.max(0, nx * 0.85 - ny * 0.5) * (m.rim || 1) * (0.25 + 0.75 * cast);
        const sp = (m.ks || 0) * Math.pow(Math.max(0, nx * HV[0] + ny * HV[1] + nz * HV[2]), m.g || 30) * isik;
        const gec = m.gecir ? m.gecir * (0.2 + 1.5 * (1 - nz)) * (0.35 + 0.65 * cast) : 0;
        for (let c = 0; c < 3; c++) {
          let g = m.D[c] + (m.C[c] - m.D[c]) * cekirdek;
          g += (m.R[c] - g) * sekme;
          g += GOKYAN[c] * gokr;
          const l = m.M[c] + (m.L[c] - m.M[c]) * yari;
          let v = (g + (l - g) * isik) * lv * ao;
          if (carp) v *= carp[c];
          if (oy > 0) v += (oyukRenk[c] - v) * oy;
          v += KENAR[c] * rim * (0.3 + m.M[c]) + PARLA[c] * sp + m.L[c] * gec;
          col[c] = v / (1 + v * 0.18) * 1.18;
        }
        const j = i * 4;
        P[j] = enc(col[0]);
        P[j + 1] = enc(col[1]);
        P[j + 2] = enc(col[2]);
        P[j + 3] = Math.round(A[i] * 255);
      }
    }
    const kc = tuvalYap(w, h);
    kc.getContext('2d').putImageData(img, 0, 0);
    const hedef = o.hedef;
    const gl = o.golge;
    if (gl) {
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(kc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#0c1a1e';
      sx.fillRect(0, 0, w, h);
      const pad = Math.ceil(gl.blur * K * 2.5) + 2;
      const bc = tuvalYap(w + 2 * pad, h + 2 * pad);
      const bx = bc.getContext('2d');
      bx.filter = `blur(${gl.blur * K}px)`;
      bx.drawImage(sc, pad, pad);
      hedef.save();
      hedef.globalAlpha = gl.alfa;
      hedef.drawImage(bc, X0 + gl.dx * K - pad, Y0 + gl.dy * K - pad);
      hedef.restore();
    }
    hedef.drawImage(kc, X0, Y0);
  }

  // ------------------------------------------------------------------ biçim yardımcıları
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dolYol = (d) => (g) => g.fill(P2(d));

  // ================================================================== ALT BOYA
  const alt = tuvalYap(N, N);
  const ag = alt.getContext('2d', { willReadFrequently: true });

  // ------------------------------------------------------------------ 1. gök: altın saat, tasarlanmış bulut kütleleri
  const GW = 1024;
  const gokT = tuvalYap(GW, GW);
  const gokX = gokT.getContext('2d');
  const gokVeri = gokX.createImageData(GW, GW);
  const BULUT = new Float32Array(GW * GW); // ışın hesabında örtü
  const GX0 = 880, GY0 = 140; // güneş
  {
    // kümülüs kütleleri: tasarlanmış kabarcık (billow) kümeleri, düz tabanlı; kenarları gürültüyle aşınır
    const br = S.rng(3811);
    const KAB = [];
    const kume = (x0, x1, taban, tepe, rmin, rmax, adet, tepeT) => {
      for (let i = 0; i < adet; i++) {
        const t = (i + br() * 0.8) / adet;
        const x = x0 + (x1 - x0) * t;
        const prof = Math.max(0, 1 - Math.abs(t - tepeT) / Math.max(tepeT, 1 - tepeT));
        const r = (rmin + (rmax - rmin) * (0.35 + 0.65 * prof)) * (0.75 + 0.35 * br());
        const y = taban - r * 0.75 - tepe * prof * (0.55 + 0.45 * br());
        KAB.push({ x, y, r, taban });
      }
    };
    kume(-70, 470, 300, 120, 30, 92, 30, 0.38);
    kume(735, 1090, 505, 34, 16, 42, 18, 0.45);
    kume(-60, 280, 518, 26, 14, 34, 14, 0.4);
    // her kabarcık bir yarım küre: en yüksek olanın normali bulutun hacmini verir
    let KN = [0, 0, 1];
    const kabarcik = (x, y) => {
      let u = 0, hb = -1;
      for (const k of KAB) {
        const dx = x - k.x, dy = y - k.y;
        if (dx > k.r || dx < -k.r || dy > k.r || dy < -k.r) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= k.r * k.r) continue;
        const v = ss(k.r, k.r * 0.45, Math.sqrt(d2)) * ss(k.taban + 8, k.taban - 16, y);
        if (v > u) u = v;
        const h = Math.sqrt(k.r * k.r - d2) + (k.taban - k.y) * 0.3;
        if (h > hb) {
          hb = h;
          KN = [dx / k.r, dy / k.r, Math.sqrt(Math.max(0, 1 - d2 / (k.r * k.r)))];
        }
      }
      return u;
    };
    const serit = (x, y) => {
      const wx = fbm(x / 260 + 4.1, y / 160, 3) * 60;
      const X = x + wx;
      const ns = fbm(X / 420, y / 22, 4);
      const bb = Math.exp(-(((y - 236) / 46) ** 2)) * ss(430, 650, X);
      const b2 = Math.exp(-(((y - 92) / 30) ** 2)) * ss(540, 790, X);
      const ser = ss(-0.02, 0.3, ns + bb * 0.6 - 0.43) * bb * 0.85;
      const ser2 = ss(0.0, 0.3, ns + b2 * 0.55 - 0.41) * b2 * 0.65;
      return Math.max(ser, ser2);
    };
    const LC = nrm([0.62, -0.45, -0.3]); // bulutlar arkadan ışık alır
    const g0 = hex('#14334E'), g1 = hex('#5E8C9C'), g2 = hex('#EBCB98'), g3 = hex('#EFAE7C');
    const sic = hex('#FFCF90');
    const bS = hex('#3A4560'), bO = hex('#8E7488'), bI = hex('#F7BF84'), bK = hex('#FFF1D4'), bU = hex('#6C8CA6');
    for (let j = 0; j < GW; j++) {
      const y = j;
      for (let i = 0; i < GW; i++) {
        const x = i;
        // gök degradesi: sol üst derin mavi → camgöbeği-gri → soluk altın → ufukta şeftali
        const t = Math.max(0, Math.min(1, (y + (1024 - x) * 0.05) / 830));
        let s;
        if (t < 0.45) s = karis(g0, g1, ss(0, 0.45, t));
        else if (t < 0.8) s = karis(g1, g2, ss(0.45, 0.8, t));
        else s = karis(g2, g3, ss(0.8, 1, t));
        const dx = x - GX0, dy = y - GY0;
        const dd = Math.sqrt(dx * dx + dy * dy);
        // güneş ışıltısı eklenerek (karıştırılmadan) verilir: gök çamurlaşmaz, ışıldar
        const parla = Math.exp(-dd / 60) * 2.0 + Math.exp(-dd / 190) * 0.6 + Math.exp(-dd / 480) * 0.2;
        let r = s[0] + sic[0] * parla, g = s[1] + sic[1] * parla * 0.94, b = s[2] + sic[2] * parla * 0.78;
        const disk = ss(27, 21, dd);
        r += disk * 3;
        g += disk * 2.7;
        b += disk * 2.2;
        const yakin = Math.exp(-dd / 300);
        // kümülüs: hacimli, arkadan ışıklı kabarcıklar
        const ex = fbm(x / 90, y / 90 + 3, 2) * 10, ey = fbm(x / 90 + 5, y / 90, 2) * 6;
        const u = kabarcik(x + ex, y + ey);
        let ku = 0;
        if (u > 0) {
          ku = ss(0.18, 0.66, u + fbm(x / 36, y / 36, 4) * 0.4 * (1.1 - u));
          if (ku > 0.001) {
            const tx = fbm(x / 22 + 9, y / 22, 3) * 0.35;
            const n = nrm([KN[0] + tx, KN[1] + tx * 0.6, KN[2] + 0.15]);
            const lam = n[0] * LC[0] + n[1] * LC[1] + n[2] * LC[2];
            let cc = karis(bS, bO, ss(-0.45, 0.05, lam));
            cc = karis(cc, bI, ss(0.0, 0.55, lam) * (0.55 + 0.45 * yakin));
            cc = karis(cc, bK, ss(0.35, 0.8, lam) * yakin);
            // üste bakan yüzler gökten mavi ışık alır; ince kenarlar ışığı geçirir
            cc = karis(cc, bU, Math.max(0, -n[1]) * 0.25 * (1 - ss(0.0, 0.5, lam)));
            const gec = (1 - ku) * (0.35 + yakin);
            r = r * (1 - ku) + (cc[0] + sic[0] * gec * 0.5) * ku;
            g = g * (1 - ku) + (cc[1] + sic[1] * gec * 0.45) * ku;
            b = b * (1 - ku) + (cc[2] + sic[2] * gec * 0.3) * ku;
          }
        }
        // ince şerit bulutlar: güneşe yakın olanlar ışık geçirir, uzaktakiler koyulaşır
        const sd = serit(x, y);
        if (sd > 0.001) {
          const ilk = serit(x + 0.8 * 10, y - 0.55 * 10);
          const isik = Math.max(0, Math.min(1, 0.45 + (sd - ilk) * 3.0));
          let cc = karis(bS, bO, 0.3 + 0.7 * yakin);
          cc = karis(cc, bI, ss(0.4, 0.9, isik) * (0.4 + 0.6 * yakin));
          cc = karis(cc, bK, yakin * yakin * isik);
          const kenar = Math.pow(1 - sd, 3) * yakin * 2.4;
          const dk = ss(0.0, 0.6, sd) * 0.92;
          r = r * (1 - dk) + (cc[0] + kenar) * dk;
          g = g * (1 - dk) + (cc[1] + kenar * 0.82) * dk;
          b = b * (1 - dk) + (cc[2] + kenar * 0.55) * dk;
        }
        BULUT[j * GW + i] = Math.max(ku, sd);
        const p = (j * GW + i) * 4;
        gokVeri.data[p] = enc(r / (1 + r * 0.25) * 1.25);
        gokVeri.data[p + 1] = enc(g / (1 + g * 0.25) * 1.25);
        gokVeri.data[p + 2] = enc(b / (1 + b * 0.25) * 1.25);
        gokVeri.data[p + 3] = 255;
      }
    }
    gokX.putImageData(gokVeri, 0, 0);
    ag.save();
    ag.imageSmoothingQuality = 'high';
    ag.filter = `blur(${0.8 * K}px)`;
    ag.drawImage(gokT, 0, 0, N, N);
    ag.restore();
  }

  // ------------------------------------------------------------------ 2. uzak tepeler (hava perspektifi), yer
  function sirt(y0, amp, f, ph, oct) {
    const pts = [];
    for (let x = -20; x <= 1044; x += 4) pts.push([x, y0 - amp * (0.5 + 0.5 * fbm(x * f + ph, ph * 3.1, oct))]);
    return pts;

  function tepeCiz(pts, renkUst, renkAlt, y2) {

    ag.fill();

  // ------------------------------------------------------------------ 3. yapı (ayrı tuvalde: gölge ve ışın örtüsü için)

  const TASK = malz({ L: '#F6DDB2', M: '#DDC198', D: '#6F8489', C: '#4A5A60', R: '#A08A78', ks: 0.06, g: 20, rim: 1.3 });
  const ALTIN = malz({ L: '#FFF0B0', M: '#E8B24A', D: '#7A5220', C: '#40290E', R: '#B0782E', ks: 2.6, g: 80, rim: 2.2, t0: -0.15, t1: 0.3, sk: 1.4 });
  const KUBBE = malz({ L: '#8ECF6C', M: '#2E9254', D: '#1A574C', C: '#0F3A32', R: '#2C6B4C', ks: 0.3, g: 22, rim: 1.8, leke: 0.05 });
  const KASNAK = malz({ L: '#78C064', M: '#2A8A4C', D: '#174E43', C: '#0D322A', R: '#25613F', ks: 0.25, g: 40, rim: 1.6 });
  const parcalar = S.minareParcalari();

  function alem(a, olcek) {

            for (const z of zz)

                const [ax, ay] = z[k], [bx, by] = z[k + 1];
                if (x < Math.min(ax, bx) - 3 || x > Math.max(ax, bx) + 3) continue;
                const vx = bx - ax, vy = by - ay;

                const dd = Math.hypot(x - ax - vx * t, y - ay - vy * t);
                if (dd < best) best = dd;
              }
            const o = Math.exp(-(best * best) / 2.2);
            return [-1.6 * o, o * 0.5];

      golge: { dx: -1.5, dy: 2.5, blur: 2, alfa: 0.5 },

  // minare kubbenin arkasında: biraz daha pus (derinlik)
  {

  const DILIM = 16;
  katman({

  const YAPRAK = malz({ L: '#A8B65C', M: '#58803E', D: '#1E3B34', C: '#11251F', R: '#30483A', ks: 0.3, g: 26, rim: 2.0, gecir: 0.12, t0: -0.1, t1: 0.25 });

  const TOMUR = malz({ L: '#FFD2D6', M: '#E8A6B4', D: '#7E6C86', C: '#5A4C66', R: '#B08690', ks: 0.2, g: 30, rim: 2, gecir: 0.25 });
  const ORTA = malz({ L: '#FFE08A', M: '#DCA23C', D: '#6E5022', C: '#4A3414', R: '#A07432', ks: 0.4, g: 30, rim: 1.6 });
  for (const s of B.saplar)

  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);

        hedef: bg2,
        ciz: (g) => {
          g.beginPath();
          g.ellipse(e.cx, e.cy, e.rx * 1.02, e.ry * 1.05, e.aci, 0, 7);
          g.fill();
        },
        mat: TACY,
        carp: (x, y) => {
          // taç yaprağın dibinde hafif pembe
          const t = Math.min(1, Math.hypot(x - c.x, y - c.y) / (c.r * 0.6));
          const m = 1 - ss(0, 1, t);
          return [1 - 0.04 * m, 1 - 0.3 * m, 1 - 0.22 * m];
        },
        bevel: Math.max(1.2, c.r * 0.06),
        yuk: 0.6,
        yastik: c.r * 0.06,
        yastikR: c.r * 0.3,
        ek: (x, y) => {
          const a = Math.atan2(y - c.y, x - c.x), d = Math.hypot(x - c.x, y - c.y) / c.r;
          const v = Math.pow(Math.abs(Math.sin(a * 13 + d * 1.5)), 6);
          return [-0.25 * v * ss(0.15, 0.4, d) * c.r * 0.02, v * 0.08 * ss(0.15, 0.4, d)];
        },
        golgede: onGolge,
        golge: { dx: -1.5, dy: 2.5, blur: Math.max(1.5, c.r * 0.06), alfa: 0.45 },
      });
    }
    katman({ hedef: bg2, ciz: (g) => { g.beginPath(); g.arc(c.x, c.y, c.r * 0.19, 0, 7); g.fill(); }, mat: ORTA, bevel: c.r * 0.17, golgede: onGolge, golge: { dx: -1, dy: 1.5, blur: 1.5, alfa: 0.4 } });
  }

  // ------------------------------------------------------------------ 5. hacimsel ışık huzmeleri (güneşe doğru radyal örnekleme)
  {
    const RW2 = 512, q = RW2 / 1024;
    const oc = tuvalYap(RW2, RW2);
    const ox = oc.getContext('2d', { willReadFrequently: true });
    ox.drawImage(yapi, 0, 0, RW2, RW2);
    ox.drawImage(bitki, 0, 0, RW2, RW2);
    const od = ox.getImageData(0, 0, RW2, RW2).data;
    // ışık kaynağı görüntüsü: güneş ve çevresindeki parlak gök, bulut ve nesnelerle örtülür
    const KAY = new Float32Array(RW2 * RW2);
    const ORT = new Float32Array(RW2 * RW2);
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const X = i / q, Y = j / q;
        const bi = Math.min(GW - 1, Math.round(X)) + Math.min(GW - 1, Math.round(Y)) * GW;
        const dd = Math.hypot(X - GX0, Y - GY0);
        const kaynak = Math.exp(-dd / 38) + Math.exp(-dd / 110) * 0.25;
        const ort = Math.max(ss(0.25, 0.85, BULUT[bi]) * 0.92, od[(j * RW2 + i) * 4 + 3] / 255);
        KAY[j * RW2 + i] = kaynak * (1 - ort);
        ORT[j * RW2 + i] = Math.max(ss(0.3, 0.9, BULUT[bi]) * 0.6, od[(j * RW2 + i) * 4 + 3] / 255);
      }
    const sx = GX0 * q, sy = GY0 * q;
    const ADIM = 96;
    const OUT = new Float32Array(RW2 * RW2);
    const KOY = new Float32Array(RW2 * RW2);
    // sanat yönetimiyle seçilmiş demetler (güneşten açı, genişlik, güç): kubbenin üstünden, minare ile kubbe
    // arasından, sağ kenardan meydana inen ışık şeritleri
    const DEMET = [[1.66, 0.05, 0.8], [1.92, 0.035, 0.7], [2.18, 0.045, 0.6], [2.5, 0.06, 0.9], [2.74, 0.04, 1.0], [2.96, 0.05, 0.7]];
    for (let j = 0; j < RW2; j++)
      for (let i = 0; i < RW2; i++) {
        const dx = (sx - i) / ADIM, dy = (sy - j) / ADIM;
        let x = i, y = j, top = 0, zay = 1, ort = 0;
        for (let k = 0; k < ADIM; k++) {
          const xi = x | 0, yi = y | 0;
          if (xi >= 0 && yi >= 0 && xi < RW2 && yi < RW2) {
            const ii = yi * RW2 + xi;
            top += KAY[ii] * zay;
            ort += ORT[ii];
          }
          zay *= 0.985;
          x += dx;
          y += dy;
        }
        const vis = Math.exp(-ort * 0.07);
        const X = i / q - GX0, Y = j / q - GY0;
        const dd = Math.hypot(X, Y);
        const an = Math.atan2(Y, X);
        let dm = 0;
        for (const [a0, w0, g0] of DEMET) dm += g0 * Math.exp(-(((an - a0) / w0) ** 2));
        dm *= 0.75 + 0.25 * fbm(an * 9 + 3, dd / 300, 2);
        const uz = ss(50, 240, dd) * Math.exp(-dd / 1300);
        const v = (top / ADIM) * 7.0;
        const obj = od[(j * RW2 + i) * 4 + 3] / 255;
        OUT[j * RW2 + i] = Math.min(1.2, v + dm * vis * uz * 0.5) * (1 - 0.65 * obj);
        // demet aralarında ve örtülerin gölgesinde pus koyulaşır: hacimsel gölge
        const yel = ss(1.5, 1.9, an) * ss(3.3, 2.9, an);
        KOY[j * RW2 + i] = (1 - obj) * yel * ss(120, 360, dd) * (0.55 * (1 - vis) + 0.25 * (1 - Math.min(1, dm))) * 0.8;
      }
    const rc = tuvalYap(RW2, RW2);
    const rx = rc.getContext('2d');
    const rd = rx.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      rd.data[i * 4] = 255;
      rd.data[i * 4 + 1] = 210;
      rd.data[i * 4 + 2] = 150;
      rd.data[i * 4 + 3] = Math.round(Math.min(1, OUT[i]) * 255);
    }
    rx.putImageData(rd, 0, 0);
    const kc2 = tuvalYap(RW2, RW2);
    const kx2 = kc2.getContext('2d');
    const kd2 = kx2.createImageData(RW2, RW2);
    for (let i = 0; i < RW2 * RW2; i++) {
      kd2.data[i * 4] = 22;
      kd2.data[i * 4 + 1] = 46;
      kd2.data[i * 4 + 2] = 60;
      kd2.data[i * 4 + 3] = Math.round(Math.min(0.5, KOY[i]) * 255);
    }
    kx2.putImageData(kd2, 0, 0);
    if (DBG === 'isin') {
      ag.fillStyle = '#000';
      ag.fillRect(0, 0, N, N);
    }
    if (DBG !== 'isinsiz') {
    ag.save();
    ag.filter = `blur(${4 * K}px)`;
    ag.drawImage(kc2, 0, 0, N, N);
    ag.restore();
    ag.save();
    ag.globalCompositeOperation = 'screen';
    ag.globalAlpha = 0.9;
    ag.filter = `blur(${2 * K}px)`;
    ag.drawImage(rc, 0, 0, N, N);
    ag.restore();
    }
    ag.drawImage(bitki, 0, 0);
    ag.save();
    ag.globalCompositeOperation = 'screen';
    ag.globalAlpha = 0.14;
    ag.filter = `blur(${3 * K}px)`;
    ag.drawImage(rc, 0, 0, N, N);
    ag.restore();
  }
  // ön planın en altı: kadraj dışı gölge (koyu çerçeve)
  {
    const pg = ag.createLinearGradient(0, 860 * K, 0, N);
    pg.addColorStop(0, 'rgba(12,22,26,0)');
    pg.addColorStop(1, 'rgba(12,22,26,0.45)');
    ag.fillStyle = pg;
    ag.fillRect(0, 860 * K, N, N - 860 * K);
  }

  // ================================================================== BOYA GEÇİŞİ: büyükten küçüğe eğri fırça vuruşları
  if (DBG) {
    ana.drawImage(alt, 0, 0);
    S.hazir();
    return;
  }
  {
    const W = 1024;
    const tmp = tuvalYap(W, W);
    const tx = tmp.getContext('2d', { willReadFrequently: true });
    const oku = (src, blur) => {
      tx.save();
      tx.setTransform(1, 0, 0, 1, 0, 0);
      tx.clearRect(0, 0, W, W);
      tx.filter = blur > 0.3 ? `blur(${blur}px)` : 'none';
      tx.drawImage(src, 0, 0, W, W);
      tx.restore();
      return tx.getImageData(0, 0, W, W).data;
    };
    // her bölgede izin verilen en ince fırça: gök ve uzak plan kaba, odak yapı ince (ayrıntı hiyerarşisi)
    const bol = S.bolgeHaritasi();
    const ENK = { gok: 7, gunes: 7, zemin: 4.5, kubbe: 1.4, kasnak: 1.4, kaide: 1.4, minare: 1.4, pencere: 1.4, altin: 1, yaprak: 2.6, sap: 2.2, cicek: 1.8, cicekOrta: 1.8 };
    const MINR = new Float32Array(W * W);
    const yA = oku(yapi, 2.5);
    const ref0 = oku(alt, 0);
    for (let y = 0; y < W; y++)
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        let m = ENK[bol.bolge(x, y)] || 4;
        // kayıp kenar: yapı siluetinin gölgede kalan kenarlarında ince fırça yok, kenar pusa karışır
        const a = yA[i * 4 + 3] / 255;
        if (a > 0.03 && a < 0.97) {
          const l = (0.3 * ref0[i * 4] + 0.59 * ref0[i * 4 + 1] + 0.11 * ref0[i * 4 + 2]) / 255;
          if (l < 0.42 && x < 600) m = Math.max(m, 3.2);
        }
        MINR[i] = m;
      }
    // tonlu zemin: alt boyanın çok bulanık hâli
    ana.save();
    ana.filter = `blur(${14 * K}px)`;
    ana.drawImage(alt, 0, 0);
    ana.restore();

    const rr = S.rng(3838);
    const KATLAR = [
      { R: 20, T: 0, uz: 9 },
      { R: 10, T: 24, uz: 9 },
      { R: 5, T: 22, uz: 8 },
      { R: 2.6, T: 22, uz: 7 },
      { R: 1.4, T: 22, uz: 6 },
      { R: 1.0, T: 26, uz: 4 },
    ];
    const fark = (a, i, b, j) => Math.abs(a[i] - b[j]) + Math.abs(a[i + 1] - b[j + 1]) + Math.abs(a[i + 2] - b[j + 2]);
    const farkC = (a, i, c) => Math.abs(a[i] - c[0]) + Math.abs(a[i + 1] - c[1]) + Math.abs(a[i + 2] - c[2]);
    for (const kat of KATLAR) {
      const R = kat.R;
      const ref = R >= 1.4 ? oku(alt, R * 0.45) : ref0;
      const cur = oku(tuval, 0);
      const LUM = new Float32Array(W * W);
      for (let i = 0; i < W * W; i++) LUM[i] = 0.3 * ref[i * 4] + 0.59 * ref[i * 4 + 1] + 0.11 * ref[i * 4 + 2];
      const Lp = (x, y) => LUM[Math.max(0, Math.min(W - 1, y | 0)) * W + Math.max(0, Math.min(W - 1, x | 0))];
      const ix = (x, y) => (Math.max(0, Math.min(W - 1, Math.round(y))) * W + Math.max(0, Math.min(W - 1, Math.round(x)))) * 4;
      const adim = Math.max(1, Math.round(R));
      const gs = Math.max(1, Math.round(R * 0.5));
      const vuruslar = [];
      for (let gy = 0; gy < W; gy += adim)
        for (let gx = 0; gx < W; gx += adim) {
          const cx = Math.min(W - 1, gx + (adim >> 1)), cy = Math.min(W - 1, gy + (adim >> 1));
          if (MINR[cy * W + cx] > R * 1.01) continue;
          let top = 0, say = 0, en = -1, ex = cx, ey = cy;
          const st = adim > 8 ? 2 : 1;
          for (let y = gy; y < Math.min(W, gy + adim); y += st)
            for (let x = gx; x < Math.min(W, gx + adim); x += st) {
              const i = (y * W + x) * 4;
              const d = fark(ref, i, cur, i);
              top += d;
              say++;
              if (d > en) {
                en = d;
                ex = x;
                ey = y;
              }
            }
          if (top / say < kat.T) continue;
          // eğri vuruş: renk başlangıç noktasından; yön, ton degradesine dik (eş-ton çizgileri boyunca)
          const i0 = ix(ex, ey);
          const c = [ref[i0], ref[i0 + 1], ref[i0 + 2]];
          const pts = [[ex + 0.5, ey + 0.5]];
          let x = ex + 0.5, y = ey + 0.5, dxp = 0, dyp = 0;
          for (let k = 1; k <= kat.uz; k++) {
            let gxx = Lp(x + gs, y) - Lp(x - gs, y), gyy = Lp(x, y + gs) - Lp(x, y - gs);
            let m = Math.hypot(gxx, gyy);
            let dx, dy;
            if (m < 1.5) {
              if (k === 1) {
                const a = fbm(x / 150 + 2, y / 150, 2) * 0.9 - 0.08;
                dx = Math.cos(a);
                dy = Math.sin(a);
              } else {
                dx = dxp;
                dy = dyp;
              }
            } else {
              dx = -gyy / m;
              dy = gxx / m;
            }
            if (k > 1 && dx * dxp + dy * dyp < 0) {
              dx = -dx;
              dy = -dy;
            }
            if (k > 1) {
              dx = 0.7 * dx + 0.3 * dxp;
              dy = 0.7 * dy + 0.3 * dyp;
              m = Math.hypot(dx, dy) || 1;
              dx /= m;
              dy /= m;
            }
            const nx = x + dx * R, ny = y + dy * R;
            if (nx < -R || ny < -R || nx > W + R || ny > W + R) break;
            const j = ix(nx, ny);
            const dc = farkC(ref, j, c);
            if (dc > 70) break;
            if (k > 2 && fark(ref, j, cur, j) < dc) break;
            x = nx;
            y = ny;
            pts.push([x, y]);
            dxp = dx;
            dyp = dy;
          }
          if (pts.length === 1) {
            // tek dokunuş: kısa bir lekeye dönüştür
            let gxx = Lp(ex + gs, ey) - Lp(ex - gs, ey), gyy = Lp(ex, ey + gs) - Lp(ex, ey - gs);
            const m = Math.hypot(gxx, gyy);
            const dx = m > 1.5 ? -gyy / m : 1, dy = m > 1.5 ? gxx / m : 0;
            pts[0] = [ex + 0.5 - dx * R * 0.4, ey + 0.5 - dy * R * 0.4];
            pts.push([ex + 0.5 + dx * R * 0.4, ey + 0.5 + dy * R * 0.4]);
          }
          vuruslar.push({ pts, c });
        }
      // karıştır
      for (let i = vuruslar.length - 1; i > 0; i--) {
        const j = Math.floor(rr() * (i + 1));
        const t = vuruslar[i];
        vuruslar[i] = vuruslar[j];
        vuruslar[j] = t;
      }
      const g = ana;
      g.save();
      g.setTransform(K, 0, 0, K, 0, 0);
      g.lineJoin = 'round';
      const nb = R >= 8 ? 6 : R >= 4 ? 4 : R >= 2 ? 3 : 0;
      for (const v of vuruslar) {
        const p = v.pts, n = p.length;
        const jv = (rr() - 0.5) * 2, jt = (rr() - 0.5) * 2;
        const cr = v.c[0] + jv * 6 + jt * 5, cg = v.c[1] + jv * 6, cb = v.c[2] + jv * 6 - jt * 5;
        const yol = (o, a0, a1) => {
          // o: dik kaydırma; a0..a1: kesir aralığı
          const i0 = Math.floor(a0 * (n - 1)), i1 = Math.ceil(a1 * (n - 1));
          const q = [];
          for (let i = i0; i <= i1; i++) {
            const pa = p[Math.max(0, i - 1)], pb = p[Math.min(n - 1, i + 1)];
            let tx2 = pb[0] - pa[0], ty2 = pb[1] - pa[1];
            const m = Math.hypot(tx2, ty2) || 1;
            q.push([p[i][0] - (ty2 / m) * o, p[i][1] + (tx2 / m) * o]);
          }
          g.beginPath();
          g.moveTo(q[0][0], q[0][1]);
          if (q.length === 2) g.lineTo(q[1][0], q[1][1]);
          else {
            for (let i = 1; i < q.length - 1; i++) g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
            g.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
          }
        };
        // gövde
        g.lineCap = 'round';
        g.lineWidth = 2 * R;
        g.strokeStyle = `rgba(${cr | 0},${cg | 0},${cb | 0},${R >= 2 ? 0.9 : 0.95})`;
        yol(0, 0, 1);
        g.stroke();
        // kıl izleri: vuruşun içinde ince açık/koyu çizgiler (yassı dijital fırça dokusu)
        if (nb && n > 1) {
          g.lineCap = 'butt';
          g.lineWidth = ((2 * R) / nb) * 0.75;
          for (let b = 0; b < nb; b++) {
            const o = ((b + 0.5) / nb - 0.5) * 2 * R * 0.85;
            const tv = (rr() - 0.5) * 22;
            g.strokeStyle = `rgba(${(cr + tv) | 0},${(cg + tv) | 0},${(cb + tv) | 0},0.38)`;
            yol(o, rr() * 0.25, 0.7 + rr() * 0.3);
            g.stroke();
          }
        }
      }
      g.restore();
    }
  }

  // ================================================================== SON: ışıltı, renk düzeltme, gren, vinyet
  {
    // parlak noktaların ışıltısı (güneş, altın alem, kenar ışıkları)
    const bc = tuvalYap(512, 512);
    const bx = bc.getContext('2d');
    bx.filter = 'brightness(0.72) contrast(3.4) blur(9px)';
    bx.drawImage(tuval, 0, 0, 512, 512);
    ana.save();
    ana.globalCompositeOperation = 'screen';
    ana.globalAlpha = 0.24;
    ana.drawImage(bc, 0, 0, N, N);
    ana.restore();
    const id = ana.getImageData(0, 0, N, N);
    const d = id.data;
    const rr = S.rng(3839);
    for (let y = 0; y < N; y++) {
      const vy = (y / N - 0.5) * 2;
      for (let x = 0; x < N; x++) {
        const i = (y * N + x) * 4;
        let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        // S eğrisi
        const sl = l * l * (3 - 2 * l);
        const k = l > 0.001 ? (l + (sl - l) * 0.45) / l : 1;
        r *= k;
        g *= k;
        b *= k;
        // bölünmüş tonlama: camgöbeği koyular, sıcak açıklar
        const ko = (1 - l) * (1 - l), ac = l * l;
        r += -0.045 * ko + 0.07 * ac;
        g += 0.02 * ko + 0.02 * ac;
        b += 0.06 * ko - 0.06 * ac;
        // vinyet
        const vx = (x / N - 0.5) * 2;
        const vd = Math.sqrt(vx * vx * 0.9 + vy * vy);
        const vf = 1 - 0.45 * ss(0.55, 1.4, vd);
        const gr = (rr() + rr() - 1) * 0.03;
        d[i] = Math.max(0, Math.min(255, (r * vf + gr) * 255));
        d[i + 1] = Math.max(0, Math.min(255, (g * vf + gr) * 255));
        d[i + 2] = Math.max(0, Math.min(255, (b * vf + gr) * 255));
      }
    }
    ana.putImageData(id, 0, 0);
  }

  S.hazir();
}, 0);
</script>
