<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-210 Kuzey Gün Işığı Yağlıboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-210 Kuzey Gün Işığı Yağlıboya: kodla çizilmiş örnek görsel (hayalî bir ressamın eli).
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md. Bütün yardımcılar bu dosyanın içindedir.
// ===================================================================== j2 ortak çekirdek
// Ressamın eli için yardımcılar: gürültü, yol düzleştirme, fırça darbesi (kıl izleri, kuru uç,
// yükseklik haritası), bölge boyama, boya kabartısı ışığı, zemin dokusu ve el titremesi.
const S = SAHNE;
const K = {};
K.N = 2048; // iç çözünürlük
K.kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
K.karis = (a, b, t) => a + (b - a) * t;
K.yum = (e0, e1, x) => {
  const t = K.kenet((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
K.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
K.rk = (c, a) => `rgba(${K.kenet(c[0] | 0, 0, 255)},${K.kenet(c[1] | 0, 0, 255)},${K.kenet(c[2] | 0, 0, 255)},${a === undefined ? 1 : a})`;
K.rkar = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
K.kay = (c, d) => [c[0] + d, c[1] + d, c[2] + d];
/** Çok duraklı renk rampası: dur = [[t, [r,g,b]], ...] */
K.rampa = (dur) => (t) => {
  if (t <= dur[0][0]) return dur[0][1].slice();
  for (let i = 1; i < dur.length; i++) {
    if (t <= dur[i][0]) {
      const u = (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]);
      return K.rkar(dur[i - 1][1], dur[i][1], u);
    }
  }
  return dur[dur.length - 1][1].slice();
};

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
K.gurultu = function (tohum) {
  const r = S.rng(tohum);
  const P = new Uint16Array(512);
  const V = new Float32Array(256);
  const p = [];
  for (let i = 0; i < 256; i++) {
    p.push(i);
    V[i] = r();
  }
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = p[i];
    p[i] = p[j];
    p[j] = t;
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const n = (x, y) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = P[(xi & 255) + P[yi & 255]];
    const b = P[((xi + 1) & 255) + P[yi & 255]];
    const c = P[(xi & 255) + P[(yi + 1) & 255]];
    const d = P[((xi + 1) & 255) + P[(yi + 1) & 255]];
    return (V[a] * (1 - u) + V[b] * u) * (1 - v) + (V[c] * (1 - u) + V[d] * u) * v;
  };
  n.fbm = (x, y, o) => {
    o = o || 4;
    let s = 0;
    let a = 0.5;
    let t = 0;
    for (let i = 0; i < o; i++) {
      s += n(x, y) * a;
      t += a;
      x = x * 2.03 + 17.1;
      y = y * 2.03 + 9.7;
      a *= 0.5;
    }
    return s / t;
  };
  return n;
};

// --------------------------------------------------------------- SVG yolunu düzleştirme (M L C A Z)
K.duz = function (d, adim) {
  adim = adim || 2;
  const tok = d.match(/[MLCAZ]|-?\d*\.?\d+(?:e[-+]?\d+)?/g);
  const out = [];
  let cur = null;
  let i = 0;
  let x = 0;
  let y = 0;
  let cmd = 'M';
  const num = () => parseFloat(tok[i++]);
  while (i < tok.length) {
    if (/[MLCAZ]/.test(tok[i])) cmd = tok[i++];
    if (cmd === 'M') {
      x = num();
      y = num();
      cur = [[x, y]];
      out.push(cur);
      cmd = 'L';
    } else if (cmd === 'L') {
      x = num();
      y = num();
      cur.push([x, y]);
    } else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(3, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const t = k / n;
        const u = 1 - t;
        cur.push([u * u * u * x + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3]);
      }
      x = x3;
      y = y3;
    } else if (cmd === 'A') {
      const rx = num(), ry = num(), phi = (num() * Math.PI) / 180, fa = num(), fs = num(), x2 = num(), y2 = num();
      K.yay(x, y, rx, ry, phi, fa, fs, x2, y2, cur, adim);
      x = x2;
      y = y2;
    } else if (cmd === 'Z') {
      cmd = 'M';
      if (i < tok.length && !/[MLCAZ]/.test(tok[i])) i++;
    }
  }
  return out;
};
K.yay = function (x1, y1, rx, ry, phi, fa, fs, x2, y2, out, adim) {
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
  const x1p = cp * dx + sp * dy, y1p = -sp * dx + cp * dy;
  rx = Math.abs(rx);
  ry = Math.abs(ry);
  const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
  if (lam > 1) {
    const s = Math.sqrt(lam);
    rx *= s;
    ry *= s;
  }
  const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
  const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
  let co = Math.sqrt(Math.max(0, num / den));
  if (fa === fs) co = -co;
  const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
  const cx = cp * cxp - sp * cyp + (x1 + x2) / 2, cy = sp * cxp + cp * cyp + (y1 + y2) / 2;
  const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
  const t1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
  let dt = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
  if (!fs && dt > 0) dt -= 2 * Math.PI;
  else if (fs && dt < 0) dt += 2 * Math.PI;
  const n = Math.max(6, Math.ceil((Math.abs(dt) * Math.max(rx, ry)) / adim));
  for (let i = 1; i <= n; i++) {
    const t = t1 + (dt * i) / n;
    const ex = rx * Math.cos(t), ey = ry * Math.sin(t);
    out.push([cp * ex - sp * ey + cx, sp * ex + cp * ey + cy]);
  }
};
/** Çokgen(ler) → Path2D */
K.p2d = function (polys) {
  const p = new Path2D();
  for (const q of polys) {
    q.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    p.closePath();
  }
  return p;
};
K.dik = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** El çizgisiyle titreyen çokgen: noktalar arası sıklaştırılır, yerinden hafifçe oynatılır. */
K.elCokgen = function (poly, genlik, olcek, tohum, kapali) {
  const n = K.gurultu(tohum || 5);
  const yo = [];
  const m = poly.length;
  const son = kapali === false ? m - 1 : m;
  for (let i = 0; i < son; i++) {
    const a = poly[i], b = poly[(i + 1) % m];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const k = Math.max(1, Math.ceil(L / 4));
    for (let j = 0; j < k; j++) yo.push([a[0] + ((b[0] - a[0]) * j) / k, a[1] + ((b[1] - a[1]) * j) / k]);
  }
  if (kapali === false) yo.push(poly[m - 1]);
  return yo.map(([x, y]) => [x + (n.fbm(x / olcek, y / olcek, 2) - 0.5) * 2 * genlik, y + (n.fbm(x / olcek + 31, y / olcek + 57, 2) - 0.5) * 2 * genlik]);
};

// --------------------------------------------------------------- tuvaller
K.tuval2 = function () {
  const c = S.yeniTuval(K.N, K.N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  return [c, x];
};
K.tuval1 = function () {
  const c = S.yeniTuval(1024, 1024);
  return [c, c.getContext('2d', { willReadFrequently: true })];
};
/** Path2D ya da çizim işlevinden 1024² maske (Uint8Array, 0/1). */
K.maske = function (yol, ek) {
  const [c, x] = K.tuval1();
  x.fillStyle = '#fff';
  if (typeof yol === 'function') yol(x);
  else x.fill(yol, ek || 'nonzero');
  const d = x.getImageData(0, 0, 1024, 1024).data;
  const m = new Uint8Array(1024 * 1024);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  m.ic = (px, py) => {
    const xi = px | 0, yi = py | 0;
    return xi >= 0 && yi >= 0 && xi < 1024 && yi < 1024 && m[yi * 1024 + xi] === 1;
  };
  return m;
};
/** 1024² tuvalden renk örnekleyici. */
K.ornek = function (tuval) {
  const W = tuval.width;
  const sc = W / 1024;
  const d = tuval.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, W).data;
  return (x, y) => {
    const xi = K.kenet(Math.round(x * sc), 0, W - 1), yi = K.kenet(Math.round(y * sc), 0, W - 1);
    const i = (yi * W + xi) * 4;
    return [d[i], d[i + 1], d[i + 2]];
  };
};

// --------------------------------------------------------------- fırça darbesi
/**
 * pts: orta çizgi; o: {w, renk, a, kil, kilA, jit, kuru, bas, son, uc, dalga, r, h, hv, ha, sirt, oluk, dolgu}
 *  kil: kıl izi sayısı; kuru: uçta kıl kopması (0..1); bas/son: baş ve son incelme payı; uc: uçtaki en oranı
 *  h: yükseklik bağlamı (boya kalınlığı), hv: kalınlık (0..1), sirt: kenar sırtı, oluk: kıl oluğu derinliği
 */
K.firca = function (c, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const R = o.r;
  const L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[n - 1] || 1;
  const nx = new Array(n), ny = new Array(n), wa = new Array(n);
  const bas = o.bas === undefined ? 0.12 : o.bas;
  const son = o.son === undefined ? 0.3 : o.son;
  const uc = o.uc === undefined ? 0.35 : o.uc;
  const dal = o.dalga || 0;
  const ph = R() * 6.28;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / m;
    ny[i] = dx / m;
    const t = L[i] / tot;
    let p = 1;
    if (bas > 0 && t < bas) p = 0.5 + 0.5 * Math.sqrt(t / bas);
    if (son > 0 && t > 1 - son) p *= uc + (1 - uc) * Math.sqrt((1 - t) / son);
    if (dal) p *= 1 + dal * Math.sin(ph + t * 5.5);
    wa[i] = o.w * p;
  }
  const kenar = (path) => {
    path.beginPath();
    for (let i = 0; i < n; i++) path.lineTo(pts[i][0] + (nx[i] * wa[i]) / 2, pts[i][1] + (ny[i] * wa[i]) / 2);
    for (let i = n - 1; i >= 0; i--) path.lineTo(pts[i][0] - (nx[i] * wa[i]) / 2, pts[i][1] - (ny[i] * wa[i]) / 2);
    path.closePath();
  };
  const a = o.a === undefined ? 1 : o.a;
  if (o.dolgu !== false) {
    kenar(c);
    c.fillStyle = K.rk(o.renk, a);
    c.fill();
  }
  const k = o.kil || 0;
  const kilYol = [];
  if (k > 0) {
    c.lineCap = 'round';
    const jit = o.jit === undefined ? 10 : o.jit;
    const kilA = o.kilA === undefined ? 0.5 : o.kilA;
    const kuru = o.kuru || 0;
    for (let b = 0; b < k; b++) {
      const v = ((b + 0.5) / k - 0.5) * 0.9 + ((R() - 0.5) * 0.25) / k;
      const d = (R() - 0.5) * 2 * jit;
      const col = [o.renk[0] + d + (R() - 0.5) * jit * 0.3, o.renk[1] + d + (R() - 0.5) * jit * 0.3, o.renk[2] + d + (R() - 0.5) * jit * 0.3];
      const t0 = R() * 0.08;
      const t1 = 1 - kuru * Math.pow(R(), 1.5) * 0.7 - R() * 0.05;
      c.beginPath();
      let ilk = true;
      const yol = [];
      for (let i = 0; i < n; i++) {
        const t = L[i] / tot;
        if (t < t0 || t > t1) continue;
        const X = pts[i][0] + nx[i] * v * wa[i], Y = pts[i][1] + ny[i] * v * wa[i];
        yol.push([X, Y]);
        if (ilk) {
          c.moveTo(X, Y);
          ilk = false;
        } else c.lineTo(X, Y);
      }
      const lw = Math.max(0.35, (o.w / k) * (0.45 + R() * 0.6));
      c.lineWidth = lw;
      c.strokeStyle = K.rk(col, a * kilA);
      c.stroke();
      kilYol.push([yol, lw, d]);
    }
  }
  if (o.h) {
    const h = o.h;
    const hv = o.hv === undefined ? 0.5 : o.hv;
    if (o.dolgu !== false) {
      kenar(h);
      const g = Math.round(K.kenet(hv, 0, 1) * 255);
      h.fillStyle = `rgba(${g},${g},${g},${o.ha === undefined ? 0.9 : o.ha})`;
      h.fill();
      if (o.sirt) {
        const g2 = Math.round(K.kenet(hv + o.sirt, 0, 1) * 255);
        h.strokeStyle = `rgb(${g2},${g2},${g2})`;
        h.lineWidth = o.sirtEn || 1.2;
        h.stroke();
      }
    }
    const ol = o.oluk === undefined ? 0.12 : o.oluk;
    if (ol && kilYol.length) {
      h.lineCap = 'round';
      for (const [yol, lw, d] of kilYol) {
        if (yol.length < 2) continue;
        const g = Math.round(K.kenet(hv + (d > 0 ? ol : -ol), 0, 1) * 255);
        h.strokeStyle = `rgb(${g},${g},${g})`;
        h.lineWidth = lw * 0.8;
        h.beginPath();
        yol.forEach(([X, Y], i) => (i ? h.lineTo(X, Y) : h.moveTo(X, Y)));
        h.stroke();
      }
    }
  }
};

/** Yön alanını izleyen orta çizgi: (x,y) merkezli, boy uzunluğunda. */
K.cizgiKur = function (x, y, boy, yon, egri, adim) {
  adim = adim || Math.max(2, boy / 8);
  const yari = boy / 2;
  if (!egri) {
    const a = yon(x, y);
    const ca = Math.cos(a), sa = Math.sin(a);
    const m = Math.max(2, Math.ceil(boy / adim));
    const out = [];
    for (let i = 0; i <= m; i++) {
      const s = -yari + (boy * i) / m;
      out.push([x + ca * s, y + sa * s]);
    }
    return out;
  }
  const ileri = [], geri = [];
  let cx = x, cy = y;
  const m = Math.max(1, Math.ceil(yari / adim));
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx += Math.cos(a) * adim;
    cy += Math.sin(a) * adim;
    ileri.push([cx, cy]);
  }
  cx = x;
  cy = y;
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx -= Math.cos(a) * adim;
    cy -= Math.sin(a) * adim;
    geri.push([cx, cy]);
  }
  return geri.reverse().concat([[x, y]], ileri);
};

/**
 * Bölge boyama: titreşimli ızgaradan başlayan darbeler, renk örneklenir.
 * o: {kutu, aralik, maske, klip, boy:[a,b], en:[a,b], yon(x,y), renk(x,y,r), egri, a:[a,b], firca:{...}, h, tohum, karistir}
 */
K.bolgeBoya = function (c, o) {
  const r = S.rng(o.tohum || 1);
  const [x1, y1, x2, y2] = o.kutu;
  const s = o.aralik;
  const nok = [];
  for (let y = y1; y < y2; y += s) {
    for (let x = x1; x < x2; x += s) {
      const px = x + r() * s, py = y + r() * s;
      if (o.maske && !o.maske.ic(px, py)) continue;
      if (o.icinde && !o.icinde(px, py)) continue;
      nok.push([px, py, r()]);
    }
  }
  if (o.karistir !== false) nok.sort((p, q) => p[2] - q[2]);
  c.save();
  if (o.h) o.h.save();
  if (o.klip) {
    c.clip(o.klip);
    if (o.h) o.h.clip(o.klip);
  }
  const fo = o.firca || {};
  for (const [px, py] of nok) {
    const boy = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
    const w = o.en[0] + r() * (o.en[1] - o.en[0]);
    const pts = K.cizgiKur(px, py, boy, o.yon, o.egri, o.adim);
    const renk = o.renk(px, py, r);
    if (!renk) continue;
    const a = o.a ? o.a[0] + r() * (o.a[1] - o.a[0]) : 1;
    const hv = o.hv ? (typeof o.hv === 'function' ? o.hv(px, py, r) : o.hv[0] + r() * (o.hv[1] - o.hv[0])) : 0.5;
    (o.fn || K.firca)(c, pts, Object.assign({}, fo, { w, renk, a, r, h: o.h, hv }));
  }
  if (o.h) o.h.restore();
  c.restore();
};

// --------------------------------------------------------------- boya kabartısı ışığı, zemin dokusu, titreme
/**
 * Yükseklik haritasından sağ üst ışıkla gölgeleme.
 * o: {guc, bulanik, parilti, parEsik, doku(x,y)->delta (iç piksel), dokuGuc}
 */
K.isikla = function (ctx, hc, o) {
  const N = K.N;
  const t = S.yeniTuval(N, N);
  const tx = t.getContext('2d', { willReadFrequently: true });
  tx.filter = `blur(${o.bulanik === undefined ? 1 : o.bulanik}px)`;
  tx.drawImage(hc, 0, 0);
  tx.filter = 'none';
  const H = tx.getImageData(0, 0, N, N).data;
  const im = ctx.getImageData(0, 0, N, N);
  const d = im.data;
  const g = o.guc === undefined ? 0.006 : o.guc;
  const par = o.parilti || 0;
  const pe = o.parEsik === undefined ? 0.12 : o.parEsik;
  const doku = o.doku;
  const W4 = N * 4;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = (y * N + x) * 4;
      const dx = H[i + 4] - H[i - 4];
      const dy = H[i + W4] - H[i - W4];
      // ışık sağ üstten: sağa yükselen yüzey karanlık, yukarı bakan yüzey aydınlık
      let s = (-dx * 0.7 + dy * 0.7) * g;
      if (doku) s += doku(x, y);
      let m = 1 + s;
      d[i] = d[i] * m;
      d[i + 1] = d[i + 1] * m;
      d[i + 2] = d[i + 2] * m;
      if (par && s > pe) {
        const p = (s - pe) * par * 255;
        d[i] += p;
        d[i + 1] += p;
        d[i + 2] += p * 0.95;
      }
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

/** Düzensiz tuval bezi dokusu (iç piksel koordinatı): ince keten, iplik kalınlığı değişken. */
K.bezDokusu = function (aralik, guc, tohum) {
  const n = K.gurultu(tohum || 11);
  const N = K.N;
  const sx = new Float32Array(N), sy = new Float32Array(N), kx = new Float32Array(N), ky = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    sx[i] = n(i / 23, 3.3) * 6.28;
    sy[i] = n(7.7, i / 23) * 6.28;
    kx[i] = 0.6 + n(i / 9, 13.1) * 0.8;
    ky[i] = 0.6 + n(21.4, i / 9) * 0.8;
  }
  const w = (2 * Math.PI) / aralik;
  return (x, y) => {
    const a = Math.sin(x * w + sy[y]) * kx[x];
    const b = Math.sin(y * w + sx[x]) * ky[y];
    const ust = ((Math.floor(x / aralik) + Math.floor(y / aralik)) & 1) === 0;
    return (ust ? a * 0.65 + b * 0.35 : b * 0.65 + a * 0.35) * guc;
  };
};

/** Düşük frekanslı yer değiştirme: el titremesi (iç piksel cinsinden genlik). */
K.titret = function (ctx, genlik, olcek, tohum) {
  const N = K.N;
  const im = ctx.getImageData(0, 0, N, N);
  const src = new Uint8ClampedArray(im.data);
  const d = im.data;
  const nz = K.gurultu(tohum || 99);
  const G = 128, gs = N / G;
  const DX = new Float32Array((G + 1) * (G + 1)), DY = new Float32Array((G + 1) * (G + 1));
  for (let j = 0; j <= G; j++)
    for (let i = 0; i <= G; i++) {
      DX[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek, (j * gs) / olcek, 3) - 0.5) * 2 * genlik;
      DY[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek + 50, (j * gs) / olcek + 70, 3) - 0.5) * 2 * genlik;
    }
  for (let y = 0; y < N; y++) {
    const gy = y / gs, j0 = Math.min(G - 1, Math.floor(gy)), fy = gy - j0;
    for (let x = 0; x < N; x++) {
      const gx = x / gs, i0 = Math.min(G - 1, Math.floor(gx)), fx = gx - i0;
      const a = j0 * (G + 1) + i0;
      const dx = (DX[a] * (1 - fx) + DX[a + 1] * fx) * (1 - fy) + (DX[a + G + 1] * (1 - fx) + DX[a + G + 2] * fx) * fy;
      const dy = (DY[a] * (1 - fx) + DY[a + 1] * fx) * (1 - fy) + (DY[a + G + 1] * (1 - fx) + DY[a + G + 2] * fx) * fy;
      let sx = x + dx, sy = y + dy;
      if (sx < 0) sx = 0;
      else if (sx > N - 1.001) sx = N - 1.001;
      if (sy < 0) sy = 0;
      else if (sy > N - 1.001) sy = N - 1.001;
      const xi = sx | 0, yi = sy | 0, ux = sx - xi, uy = sy - yi;
      const p = (yi * N + xi) * 4, q = p + N * 4;
      const o = (y * N + x) * 4;
      for (let c = 0; c < 3; c++) d[o + c] = (src[p + c] * (1 - ux) + src[p + 4 + c] * ux) * (1 - uy) + (src[q + c] * (1 - ux) + src[q + 4 + c] * ux) * uy;
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

// --------------------------------------------------------------- sahne geometrisi (çokgen olarak)
K.geo = function () {
  const G = {};
  G.kubbe = S.kubbeNoktalari(90);
  G.kubbeYol = K.p2d([G.kubbe]);
  // kubbe yarıçapı tablosu (y tamsayı)
  const pr = S.kubbeProfili(400);
  G.kr = new Float32Array(1024);
  for (let y = 0; y < 1024; y++) {
    if (y < 300 || y > 555) {
      G.kr[y] = 0;
      continue;
    }
    for (let i = 0; i < pr.length - 1; i++) {
      if (y <= pr[i].y && y >= pr[i + 1].y) {
        const t = (pr[i].y - y) / (pr[i].y - pr[i + 1].y || 1);
        G.kr[y] = pr[i].r + (pr[i + 1].r - pr[i].r) * t;
        break;
      }
    }
  }
  G.kubbeR = (y) => {
    if (y < 300 || y > 555) return 0;
    const yi = Math.floor(y), f = y - yi;
    return G.kr[yi] * (1 - f) + G.kr[Math.min(1023, yi + 1)] * f;
  };
  G.kaburga = S.kaburgalar(16, 80);
  G.kasnak = S.kasnak.map((k) => K.dik(k.x1, k.y1, k.x2, k.y2));
  G.kasnakPen = [0, 1].map((k) => S.kasnakPencereleri(k).map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p)));
  const KD = S.kaide;
  G.kaide = K.dik(KD.x1, KD.y1, KD.x2, KD.y2);
  G.kornis = K.dik(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2, KD.kornis.y2);
  G.kaidePen = KD.pencereler.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.minare = S.minareParcalari().map((p) => {
    const q = Object.assign({}, p);
    if (p.tip === 'poligon') q.poly = p.noktalar;
    else if (p.tip === 'bant' || p.tip === 'korkuluk') q.poly = K.dik(p.x1, p.y1, p.x2, p.y2);
    else if (p.tip === 'topuz') q.poly = K.duz(p.yol, 1)[0];
    return q;
  });
  G.minareGovde = G.minare.filter((p) => p.poly && p.tip !== 'bant');
  G.minareYol = K.p2d(G.minareGovde.map((p) => p.poly));
  G.minarePen = S.minarePencereleri.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.zikzak = S.zikzakCizgileri();
  G.alemK = S.alemParcalari(560, 300, 1);
  G.alemM = S.minareParcalari().find((p) => p.tip === 'alem').alem;
  G.hilal = (a) => K.duz(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.5)[0];
  G.binaYol = (() => {
    const p = new Path2D();
    p.addPath(G.kubbeYol);
    p.addPath(K.p2d(G.kasnak));
    p.addPath(K.p2d([G.kaide, G.kornis]));
    p.addPath(G.minareYol);
    return p;
  })();
  return G;
};

/** Kubbe yüzey normali (dönel yüzey + 16 dilim). Işık L için: {n:[x,yukarı,bakan], phi, k, f} */
K.kubbeNormal = function (G, x, y, oluk) {
  const r = G.kubbeR(y);
  if (r <= 0.5) return null;
  const u = (x - 560) / r;
  if (u < -1 || u > 1) return null;
  const phi = Math.asin(u);
  const r1 = G.kubbeR(Math.min(555, y + 1)), r0 = G.kubbeR(Math.max(300, y - 1));
  const drdy = (r1 - r0) / 2;
  const m = Math.sqrt(1 + drdy * drdy);
  const nr = 1 / m, nup = drdy / m;
  const dil = Math.PI / 16;
  const gk = (phi + Math.PI / 2) / dil;
  const k = Math.floor(gk), f = gk - k;
  const ph = phi + (f - 0.5) * (oluk === undefined ? 0.45 : oluk);
  return { n: [nr * Math.sin(ph), nup, nr * Math.cos(ph)], phi, k, f, u };
};
K.nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
K.birim = (v) => {
  const m = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / m, v[1] / m, v[2] / m];
};

/** Taç yaprağı: ters yumurta biçimi, uçta yuvarlak ve çok hafif çentikli. (cx,cy) dip, aci yönünde uzanır. */
K.tacYaprak = function (cx, cy, aci, boy, en, centik) {
  const ca = Math.cos(aci), sa = Math.sin(aci);
  const p = (u, v) => [cx + u * ca - v * sa, cy + u * sa + v * ca];
  const W = en / 2, L = boy, c = centik === undefined ? 0.04 : centik;
  const bz = (a, b, cc, d, t) => {
    const u = 1 - t;
    return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * cc + t * t * t * d;
  };
  const yan = [];
  const seg = [
    [[0, 0], [0.22 * L, 0.3 * W], [0.42 * L, 0.98 * W], [0.7 * L, W]],
    [[0.7 * L, W], [0.92 * L, 1.0 * W], [1.0 * L, 0.55 * W], [(1 - c) * L + c * L, 0.12 * W]],
  ];
  for (const [a, b, cc, d] of seg) for (let k = 1; k <= 14; k++) yan.push([bz(a[0], b[0], cc[0], d[0], k / 14), bz(a[1], b[1], cc[1], d[1], k / 14)]);
  const out = [p(0, 0)];
  for (const [u, v] of yan) out.push(p(u, v));
  out.push(p((1 - c) * L, 0));
  for (let k = yan.length - 1; k >= 0; k--) out.push(p(yan[k][0], -yan[k][1]));
  return out;
};
/** Altın küre: dolgu + gölge ve ışık hilalleri (ince fırça darbeleriyle). */
K.kure = function (c, cx, cy, r, ramp, R, h) {
  const pol = [];
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * 6.283;
    pol.push([cx + Math.cos(a) * r * (1 + (R() - 0.5) * 0.04), cy + Math.sin(a) * r * (1 + (R() - 0.5) * 0.04)]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(ramp(0.45));
  c.fill(yol);
  c.save();
  c.clip(yol);
  const yay = (a0, a1, q, w, renk, al) => {
    const pts = [];
    for (let k = 0; k <= 10; k++) {
      const a = a0 + ((a1 - a0) * k) / 10;
      pts.push([cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q]);
    }
    K.firca(c, pts, { w, renk, a: al, r: R, kil: 0, bas: 0.3, son: 0.35, uc: 0.2 });
  };
  yay(1.2, 3.6, 0.72, r * 0.62, ramp(0.12), 0.85); // sol alt gölge
  yay(2.2, 3.1, 0.95, r * 0.22, ramp(0.55), 0.6); // yansıyan ışık
  yay(-1.9, 0.3, 0.42, r * 0.55, ramp(0.85), 0.9); // sağ üst ışık
  c.restore();
  if (h) {
    h.fillStyle = 'rgb(150,150,150)';
    h.fill(yol);
  }
  return yol;
};

/**
 * Kümülüs bulut alanı: küre yığını yükseklik alanı (karnabahar biçimi), düz taban, gürültüyle bükülen kenar.
 * kutleler: [{x1,x2,taban,kuleler:[{x,ust,en}]}]; o: {tohum, bukum, isik:[x,yukarı,bakan]}
 * Döner: {e (kenar örtüsü 0..1), lit (0..1), aci (izohips teğeti), ag (yön ağırlığı)} — hepsi 1024².
 */
K.bulutAlani = function (kutleler, o) {
  o = o || {};
  const N = 1024;
  const r = S.rng(o.tohum || 31);
  const nz = K.gurultu((o.tohum || 31) + 7);
  const Hf = new Float32Array(N * N);
  const TB = new Float32Array(N * N);
  const UST = new Float32Array(N * N);
  const puf = [];
  for (const k of kutleler) {
    const enK = k.enKat || 1;
    k.ustMin = Math.min(...k.kuleler.map((q) => q.ust));
    for (let x = k.x1 + 16; x <= k.x2 - 10; x += 20 + r() * 14) puf.push({ x, y: k.taban - 14 - r() * 10, r: (20 + r() * 18) * enK, z: 0, k });
    for (const t of k.kuleler) {
      const H = k.taban - t.ust;
      const n = Math.max(2, Math.ceil(H / 17));
      for (let j = 0; j <= n; j++) {
        const f = j / n;
        const y = k.taban - 22 - f * (H - 22 - t.en * 0.24);
        const rr = t.en * (0.52 - 0.24 * f) * (0.7 + r() * 0.5);
        puf.push({ x: t.x + (r() - 0.5) * t.en * 0.5 * (1 - f * 0.5), y, r: rr, z: f * 12, k });
        const ns = 1 + Math.floor(r() * 3);
        for (let s = 0; s < ns; s++) {
          const yan = r() < 0.5 ? -1 : 1;
          puf.push({ x: t.x + yan * t.en * (0.28 + r() * 0.32), y: y + r() * 16 - 4, r: rr * (0.32 + r() * 0.36), z: f * 12 - 3, k });
        }
      }
    }
  }
  for (const p of puf) {
    const x0 = Math.max(0, Math.floor(p.x - p.r)), x1 = Math.min(N - 1, Math.ceil(p.x + p.r));
    const y0 = Math.max(0, Math.floor(p.y - p.r)), y1 = Math.min(N - 1, Math.ceil(Math.min(p.y + p.r, p.k.taban + 2)));
    const r2 = p.r * p.r;
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        const d2 = (x - p.x) * (x - p.x) + (y - p.y) * (y - p.y);
        if (d2 >= r2) continue;
        const hh = Math.sqrt(r2 - d2) + p.z + 1;
        const i = y * N + x;
        if (hh > Hf[i]) {
          Hf[i] = hh;
          TB[i] = p.k.taban;
          UST[i] = p.k.ustMin;
        }
      }
  }
  // yumuşatılmış yükseklik (küre dikişleri kaybolsun)
  const yum = (A, rad) => {
    const T = new Float32Array(N * N), O = new Float32Array(N * N);
    for (let y = 0; y < N; y++) {
      let s = 0;
      for (let x = -rad; x <= rad; x++) s += A[y * N + K.kenet(x, 0, N - 1)];
      for (let x = 0; x < N; x++) {
        T[y * N + x] = s / (2 * rad + 1);
        s += A[y * N + Math.min(N - 1, x + rad + 1)] - A[y * N + Math.max(0, x - rad)];
      }
    }
    for (let x = 0; x < N; x++) {
      let s = 0;
      for (let y = -rad; y <= rad; y++) s += T[K.kenet(y, 0, N - 1) * N + x];
      for (let y = 0; y < N; y++) {
        O[y * N + x] = s / (2 * rad + 1);
        s += T[Math.min(N - 1, y + rad + 1) * N + x] - T[Math.max(0, y - rad) * N + x];
      }
    }
    return O;
  };
  const Hs = yum(Hf, o.yumR || 3);
  const Hb = yum(Hf, 14);
  const L = K.birim(o.isik || [0.55, 0.62, 0.56]);
  const e = new Float32Array(N * N), lit = new Float32Array(N * N), aci = new Float32Array(N * N), ag = new Float32Array(N * N);
  const bk = o.bukum === undefined ? 9 : o.bukum;
  for (let y = 1; y < N - 1; y++)
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const wx = (nz.fbm(x / 34, y / 34, 3) - 0.5) * 2 * bk, wy = (nz.fbm(x / 34 + 40, y / 34 + 13, 3) - 0.5) * 2 * bk;
      const sx = K.kenet(Math.round(x + wx), 0, N - 1), sy = K.kenet(Math.round(y + wy), 0, N - 1);
      const j = sy * N + sx;
      const hv = Hs[j];
      e[i] = K.yum(0.5, 3.5, hv);
      if (hv > 0.05) {
        const zx0 = (Hs[j + 1] - Hs[j - 1]) / 2, zy0 = (Hs[j + N] - Hs[j - N]) / 2;
        const l0 = (-zx0 * L[0] + zy0 * L[1] + L[2]) / Math.sqrt(zx0 * zx0 + zy0 * zy0 + 1);
        if (o.kayip) e[i] = K.yum(0.5, 3.5 + o.kayip * K.kenet(0.6 - l0, 0, 1), hv);
        const zx = (Hs[j + 1] - Hs[j - 1]) / 2, zy = (Hs[j + N] - Hs[j - N]) / 2;
        let l = (-zx * L[0] + zy * L[1] + L[2]) / Math.sqrt(zx * zx + zy * zy + 1);
        const tb = TB[j], us = UST[j];
        const alt = K.yum(tb - 46, tb - 2, sy); // taban gölgesi
        const dik = K.kenet((sy - us) / Math.max(40, tb - us), 0, 1); // aşağıda daha gölgeli
        l = l * (1 - (o.altGolge === undefined ? 0.35 : o.altGolge) * alt) - (o.dikGolge === undefined ? 0.18 : o.dikGolge) * dik + 0.12;
        lit[i] = K.kenet(l, 0, 1);
      }
      const bx = (Hb[i + 1] - Hb[i - 1]) / 2, by = (Hb[i + N] - Hb[i - N]) / 2;
      const gm = Math.hypot(bx, by);
      aci[i] = Math.atan2(by, bx) + Math.PI / 2;
      ag[i] = K.yum(0.05, 0.6, gm);
    }
  return { e, lit, aci, ag, Hf };
};

/** Ayrı bir katmanda boyar, sonra 1024² örtü dizisiyle (0..1) maskeleyip ana tuvale basar. */
K.maskeliKatman = function (ctx, ortu, ciz) {
  const [kc, kx] = K.tuval2();
  ciz(kx);
  const mc = S.yeniTuval(1024, 1024);
  const mx = mc.getContext('2d');
  const im = mx.createImageData(1024, 1024);
  for (let i = 0; i < 1024 * 1024; i++) {
    im.data[i * 4] = 255;
    im.data[i * 4 + 1] = 255;
    im.data[i * 4 + 2] = 255;
    im.data[i * 4 + 3] = Math.round(K.kenet(ortu[i], 0, 1) * 255);
  }
  mx.putImageData(im, 0, 0);
  kx.save();
  kx.setTransform(1, 0, 0, 1, 0, 0);
  kx.globalCompositeOperation = 'destination-in';
  kx.imageSmoothingEnabled = true;
  kx.drawImage(mc, 0, 0, K.N, K.N);
  kx.restore();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(kc, 0, 0);
  ctx.restore();
};

/** Mat çiçek göbeği: düz disk, sol altta koyu bir darbe, sağ üstte birkaç açık lekecik, çevrede erkek organ noktaları. */
K.cicekOrta = function (c, cx, cy, r, renk, R, o) {
  o = o || {};
  const pol = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * 6.283;
    const q = r * (0.9 + R() * 0.18);
    pol.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(renk.orta);
  c.fill(yol);
  c.save();
  c.clip(yol);
  K.firca(c, [[cx - r * 0.9, cy + r * 0.1], [cx - r * 0.2, cy + r * 0.75], [cx + r * 0.6, cy + r * 0.85]], { w: r * 0.75, renk: renk.koyu, a: 0.85, r: R, kil: 3, jit: 8, bas: 0.3, son: 0.4, uc: 0.2 });
  const n = o.lek || 5;
  for (let i = 0; i < n; i++) {
    const a = -0.9 + (R() - 0.5) * 1.4, q = r * (0.15 + R() * 0.4);
    const x = cx + Math.cos(a) * q, y = cy + Math.sin(a) * q;
    K.firca(c, [[x - r * 0.18, y + r * 0.08], [x + r * 0.18, y - r * 0.08]], { w: r * 0.28, renk: renk.acik, a: 0.9, r: R, kil: 0, bas: 0.3, son: 0.4, uc: 0.3 });
  }
  c.restore();
  if (renk.nokta) {
    const m = o.nokta || 11;
    for (let i = 0; i < m; i++) {
      const a = (i / m) * 6.283 + R() * 0.3;
      const q = r * (1.15 + R() * 0.25);
      c.fillStyle = K.rk(renk.nokta, 0.9);
      c.beginPath();
      c.arc(cx + Math.cos(a) * q, cy + Math.sin(a) * q, Math.max(0.7, r * 0.11) * (0.8 + R() * 0.4), 0, 6.283);
      c.fill();
    }
  }
};

// ===================================================================== S-210 Kuzey Gün Işığı Yağlıboya
// Hayalî, sessiz bir açık hava ressamı: inci grisi astarlı ince tuval, serin ve temiz kuzey gün ışığı,
// çok berrak hava. Gök ince yatay darbelerle; mimari keskin kenarlı, serin yansıyan ışıklı; kubbe her
// dilimde yumuşak ve kesin geçişli berrak yeşil. Küçük, kaynaşmış ama yakından seçilen darbeler; az kontrast.
(function () {
  const G = K.geo();
  const tv = document.getElementById('tuval');
  tv.width = K.N;
  tv.height = K.N;
  const ctx = tv.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  const [hc, h] = K.tuval2();
  h.fillStyle = 'rgb(30,30,30)';
  h.fillRect(0, 0, 1024, 1024);
  const nz = K.gurultu(210);
  const R = S.rng(2100);

  const P = {
    gokUst: K.hex('#8DB8DE'),
    gok: K.hex('#9EC3E3'),
    inci: K.hex('#E9EEF0'),
    tasIsik: K.hex('#F4F2EC'),
    tas: K.hex('#E6E4DE'),
    tasGolge: K.hex('#AEB8C4'),
    tasDerin: K.hex('#97A3B1'),
    yansima: K.hex('#C3D3E2'),
    yesil: K.hex('#4F9C78'),
    altin: K.hex('#CDB262'),
    altinIsik: K.hex('#EFE2AE'),
    altinKoyu: K.hex('#94803F'),
    zemin: K.hex('#CDD3C6'),
    cayir: K.hex('#BAC4B1'),
  };
  const Lv = K.birim([0.6, 0.62, 0.5]);

  /**
   * Küçük yassı/yuvarlak fırça darbesi: kıl şeritlerinden kurulur. Şeritler birlikte başlar (kare, dolu başlangıç), her biri kendi
   * boya yüküyle hafifçe farklı tonda akar ve farklı uzunlukta biter: uç şerit şerit kurur, aralarından alttaki renk
   * görünür. Kenarlar hafifçe titrer; yükseklik tuvaline şerit sırtları ve oluklar çizilir.
   * o: {w, renk, a, jit, kuru (0..1), ucBoy, h, hv, ha, serit}
   */
  const yassi = (c, pts0, o) => {
    if (pts0.length < 2) return;
    const pts = [pts0[0]];
    for (let i = 1; i < pts0.length; i++) {
      const a = pts0[i - 1], b = pts0[i];
      const m = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
      for (let k = 1; k <= m; k++) pts.push([a[0] + ((b[0] - a[0]) * k) / m, a[1] + ((b[1] - a[1]) * k) / m]);
    }
    const n = pts.length;
    const L = [0];
    for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const tot = L[n - 1] || 1;
    const nx = [], ny = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const m = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      nx.push(-(b[1] - a[1]) / m);
      ny.push((b[0] - a[0]) / m);
    }
    const w = o.w;
    const ns = Math.max(4, Math.round(w / (o.serit || 2.6)));
    const kuru = o.kuru === undefined ? 0.8 : o.kuru;
    const ucBoy = o.ucBoy === undefined ? 0.38 : o.ucBoy;
    const jit = o.jit === undefined ? 9 : o.jit;
    const al = o.a === undefined ? 0.95 : o.a;
    const ph = R() * 6.28;
    c.lineCap = 'butt';
    c.lineJoin = 'round';
    if (o.h) {
      o.h.lineCap = 'butt';
      o.h.lineJoin = 'round';
    }
    for (let b = 0; b < ns; b++) {
      const v0 = ((b + 0.5) / ns - 0.5) * w;
      const kenar = Math.abs(v0) / (w / 2);
      const lw = (w / ns) * (1.3 + R() * 0.35);
      const t0 = R() * 0.025 * (1 + kenar);
      const t1 = 1 - kuru * Math.pow(R(), 1.3) * ucBoy - (kenar > 0.8 ? R() * 0.06 : 0);
      const d = (R() - 0.5) * 2 * jit;
      const col = [o.renk[0] + d, o.renk[1] + d, o.renk[2] + d * 0.9];
      const yol = (ctx2, ta, tb) => {
        ctx2.beginPath();
        let ilk = true;
        for (let i = 0; i < n; i++) {
          const t = L[i] / tot;
          if (t < ta || t > tb) continue;
          const v = v0 + Math.sin(ph + b * 1.7 + t * 9) * 0.35 * kenar;
          const X = pts[i][0] + nx[i] * v, Y = pts[i][1] + ny[i] * v;
          if (ilk) {
            ctx2.moveTo(X, Y);
            ilk = false;
          } else ctx2.lineTo(X, Y);
        }
      };
      // gövde ve kuruyan kuyruk (son %12'si daha ince ve saydam)
      const tk = t0 + (t1 - t0) * 0.88;
      yol(c, t0, tk);
      c.lineWidth = lw;
      c.strokeStyle = K.rk(col, al);
      c.stroke();
      yol(c, tk - 0.01, t1);
      c.lineWidth = lw * 0.6;
      c.strokeStyle = K.rk(col, al * 0.6);
      c.stroke();
      if (o.h) {
        const g = Math.round(K.kenet((o.hv === undefined ? 0.5 : o.hv) + d / 400 + (b % 2 ? 0.035 : -0.035), 0, 1) * 255);
        yol(o.h, t0, tk);
        o.h.lineWidth = lw * 0.9;
        o.h.strokeStyle = `rgba(${g},${g},${g},${o.ha === undefined ? 0.8 : o.ha})`;
        o.h.stroke();
      }
    }
  };

  // ----------------------------------------------------------------- 0) inci grisi astar
  ctx.fillStyle = '#DCDDD8';
  ctx.fillRect(0, 0, 1024, 1024);

  // ----------------------------------------------------------------- 1) model
  const [mc, m] = K.tuval1();
  const gokRamp = K.rampa([
    [0, P.gokUst],
    [0.35, P.gok],
    [0.75, K.hex('#CBDDEB')],
    [1, P.inci],
  ]);
  const bulutRamp = K.rampa([
    [0, K.hex('#AFBCCA')],
    [0.45, K.hex('#D6DDE4')],
    [1, K.hex('#F7F6F1')],
  ]);
  {
    const im = m.createImageData(1024, 1024);
    const d = im.data;
    for (let y = 0; y < 1024; y++)
      for (let x = 0; x < 1024; x++) {
        const i = y * 1024 + x;
        let c = gokRamp(K.kenet(y / 800, 0, 1) + (nz.fbm(x / 300, y / 90, 2) - 0.5) * 0.05);
        const ds = Math.hypot(x - 880, y - 140);
        c = K.rkar(c, K.hex('#F1F4F2'), Math.exp(-((ds / 95) ** 2)) * 0.45);
        if (y >= 800) c = K.rkar(P.zemin, P.cayir, K.kenet((y - 800) / 224, 0, 1));
        const o = i * 4;
        d[o] = c[0];
        d[o + 1] = c[1];
        d[o + 2] = c[2];
        d[o + 3] = 255;
      }
    m.putImageData(im, 0, 0);
  }
  const gokModel = K.ornek(mc);
  const yalinGok = (x, y) => {
    let c = gokRamp(K.kenet(y / 800, 0, 1) + (nz.fbm(x / 300, y / 90, 2) - 0.5) * 0.05);
    const ds = Math.hypot(x - 880, y - 140);
    c = K.rkar(c, K.hex('#EEF2F1'), Math.exp(-((ds / 80) ** 2)) * 0.3);
    if (y >= 800) c = K.rkar(P.zemin, P.cayir, K.kenet((y - 800) / 224, 0, 1));
    return c;
  };
  const silindir = (x1, x2, ramp, ref) => {
    const g = m.createLinearGradient(x1, 0, x2, 0);
    for (let k = 0; k <= 16; k++) {
      const t = k / 16;
      const ph = Math.asin(K.kenet(t * 2 - 1, -1, 1));
      const n = [Math.sin(ph), 0, Math.cos(ph)];
      const v = K.kenet(K.nokta(n, Lv) * 1.05, 0, 1);
      let c = ramp(v);
      // serin yansıyan ışık: gölge yanının en kenarında
      const yk = K.yum(0.22, 0.0, t) * (ref === undefined ? 0.5 : ref);
      c = K.rkar(c, P.yansima, yk);
      g.addColorStop(t, K.rk(c));
    }
    return g;
  };
  const tasRamp = K.rampa([
    [0, P.tasDerin],
    [0.32, P.tasGolge],
    [0.62, P.tas],
    [1, P.tasIsik],
  ]);
  for (const p of G.minare) {
    if (!p.poly || p.tip === 'bant') continue;
    const xs = p.poly.map((q) => q[0]);
    m.fillStyle = silindir(Math.min(...xs), Math.max(...xs), tasRamp);
    m.fill(K.p2d([p.poly]));
    if (p.ad.startsWith('çıkma')) {
      m.fillStyle = 'rgba(150,165,182,0.55)';
      m.fill(K.p2d([p.poly]));
    }
  }
  {
    const g = m.createLinearGradient(300, 0, 820, 0);
    g.addColorStop(0, K.rk(K.hex('#DEDFDD')));
    g.addColorStop(0.55, K.rk(P.tas));
    g.addColorStop(1, K.rk(P.tasIsik));
    m.fillStyle = g;
    m.fill(K.p2d([G.kaide]));
    m.fillStyle = K.rk(P.tasIsik);
    m.fill(K.p2d([G.kornis]));
    const g2 = m.createLinearGradient(0, 704, 0, 713);
    g2.addColorStop(0, 'rgba(150,163,180,0.7)');
    g2.addColorStop(1, 'rgba(150,163,180,0)');
    m.fillStyle = g2;
    m.fillRect(300, 704, 520, 9);
  }
  const yesilRamp = K.rampa([
    [0, K.hex('#33705A')],
    [0.3, K.hex('#3F8768')],
    [0.58, P.yesil],
    [0.82, K.hex('#76B697')],
    [1, K.hex('#ADD6C1')],
  ]);
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    m.fillStyle = silindir(q.x1, q.x2, (v) => yesilRamp(v * 0.9), 0.35);
    m.fill(K.p2d([G.kasnak[k]]));
  }
  {
    const imk = m.getImageData(0, 0, 1024, 1024);
    const dk = imk.data;
    for (let y = 300; y <= 555; y++)
      for (let x = 355; x <= 765; x++) {
        const kn = K.kubbeNormal(G, x, y, 0.85);
        if (!kn) continue;
        let v = K.kenet(K.nokta(kn.n, Lv), 0, 1) * 0.9 + 0.06;
        let c = yesilRamp(v);
        c = K.rkar(c, K.hex('#8FB4C6'), Math.max(0, -kn.n[0]) * 0.3); // gökten serin yansıma
        const o = (y * 1024 + x) * 4;
        dk[o] = c[0];
        dk[o + 1] = c[1];
        dk[o + 2] = c[2];
      }
    m.putImageData(imk, 0, 0);
  }
  const model = K.ornek(mc);
  const jit = (sd, mdl) => (x, y, r) => {
    const c = (mdl || model)(x, y);
    const j = (r() - 0.5) * sd;
    return [c[0] + j + (r() - 0.5) * sd * 0.3, c[1] + j + (r() - 0.5) * sd * 0.3, c[2] + j + (r() - 0.5) * sd * 0.25];
  };

  // darbe başına değer basamağı (yaklaşık 5–8 L*): sessiz ama küçük görselde de seçilen dokunuş
  const kademe = [-1, -0.5, 0, 0.5, 1];
  const basamak = (sd, mdl) => (x, y, r) => {
    const c = (mdl || model)(x, y);
    const j = kademe[(r() * 5) | 0] * sd + (r() - 0.5) * 3;
    return [c[0] + j, c[1] + j, c[2] + j * 0.92];
  };
  const fn = (c2, pts, o) => yassi(c2, R() < 0.5 ? pts : pts.slice().reverse(), o);

  // ----------------------------------------------------------------- 2) gök: geniş, kaynaşmış yatay darbeler
  // 18–28 px'lik yatay darbeler, darbeden darbeye 5–7 L*'lik sessiz basamaklar, kuru biten uçlar
  const fGok = { jit: 4, kuru: 0.85, ucBoy: 0.35, serit: 2.6, ha: 0.7 };
  const yatay = (x, y) => (nz(x / 200, y / 80) - 0.5) * 0.05 + (nz(x / 37 + 50, y / 23) - 0.5) * 0.03;
  const gokMaske = K.maske((x) => x.fillRect(0, 0, 1024, 806));
  K.bolgeBoya(ctx, { kutu: [-60, -10, 1084, 806], aralik: 11, maske: gokMaske, boy: [80, 170], en: [18, 28], yon: yatay, renk: basamak(9, yalinGok), a: [0.88, 0.96], firca: fGok, fn, h, hv: [0.24, 0.3], tohum: 1 });
  K.bolgeBoya(ctx, { kutu: [-60, -10, 1084, 806], aralik: 34, maske: gokMaske, boy: [60, 130], en: [16, 22], yon: yatay, renk: basamak(10, yalinGok), a: [0.8, 0.9], firca: fGok, fn, h, hv: [0.25, 0.3], tohum: 2 });
  // tek küçük, ince, düz tabanlı bulut: yatay, kaynaşmış birkaç darbe; tabanda serin gri, tepede beyaz
  {
    const rb = S.rng(2101);
    // sıralar sık ve birbirine binerek dizilir; uçları düzensiz kaydırılır ki siluet basamaklı değil, yassı bir mercek olsun
    const renkler = [K.hex('#C9D2DB'), K.hex('#D6DDE3'), K.hex('#DFE4E8'), K.hex('#E8EBEB'), K.hex('#EEF0EE'), K.hex('#F3F3EF'), K.hex('#F7F6F1')];
    const sira = renkler.map((c, i) => {
      const t = i / (renkler.length - 1);
      const yari = 96 * Math.pow(1 - t * 0.78, 0.55);
      const cx = 146 + t * 6;
      return { y: 447 - i * 5.2, x0: cx - yari * (1 - t * 0.12), x1: cx + yari, w: 11 - t * 2, c };
    });
    for (const q of sira) {
      for (let k = 0; k < 2; k++) {
        const o0 = (rb() - 0.5) * 22, o1 = (rb() - 0.5) * 22;
        const pts = [[q.x0 + o0 + k * 10, q.y + (rb() - 0.5) * 2], [(q.x0 + q.x1) / 2, q.y - 1 + (rb() - 0.5) * 2], [q.x1 + o1 - k * 12, q.y + (rb() - 0.5) * 2]];
        fn(ctx, pts, { w: q.w * (k ? 0.75 : 1), renk: K.kay(q.c, (rb() - 0.5) * 6), a: 0.9, jit: 3, kuru: 0.95, ucBoy: 0.42, h, hv: 0.34, ha: 0.7 });
      }
    }
  }
  // güneş: soluk, küçük; elle çevrilmiş, kenarı hafifçe düzensiz bir leke ve üstünde birkaç kısa yatay darbe
  {
    const rs = S.rng(2102);
    const gx = 880, gy = 140, gr = 24;
    const disk = [];
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * 6.283;
      const rr = gr * (1 + (rs() - 0.5) * 0.06);
      disk.push([gx + Math.cos(a) * rr, gy + Math.sin(a) * rr]);
    }
    ctx.fillStyle = K.rk(K.hex('#FCF9EC'));
    ctx.fill(K.p2d([K.elCokgen(disk, 1.1, 8, 7)]));
    ctx.save();
    ctx.lineCap = 'round';
    for (const [dy, w] of [[-12, 10], [-1, 12], [10, 10], [18, 6]]) {
      const yari = Math.max(2, Math.sqrt(Math.max(0, gr * gr - dy * dy)) - w / 2 - 1) * (0.8 + rs() * 0.25);
      const k = (rs() - 0.5) * 4;
      const renk = K.kay(K.rkar(K.hex('#FFFEF8'), K.hex('#FAF5E2'), (dy + 12) / 30), (rs() - 0.5) * 3);
      ctx.strokeStyle = K.rk(renk, 0.95);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(gx - yari + k, gy + dy + 0.5);
      ctx.lineTo(gx + yari + k * 0.4, gy + dy - 0.5);
      ctx.stroke();
      for (let b = 0; b < 3; b++) {
        const v = (b / 2 - 0.5) * w * 0.6;
        ctx.strokeStyle = K.rk(K.kay(renk, (rs() - 0.5) * 8), 0.4);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gx - yari * (0.6 + rs() * 0.4) + k, gy + dy + v);
        ctx.lineTo(gx + yari * (0.6 + rs() * 0.4) + k, gy + dy + v);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  // ----------------------------------------------------------------- 3) yer: dar, adaçayı-gri çayır
  K.bolgeBoya(ctx, { kutu: [-60, 798, 1084, 1034], aralik: 11, boy: [50, 110], en: [13, 19], yon: () => (R() - 0.5) * 0.06, renk: basamak(12, gokModel), a: [0.88, 0.97], firca: fGok, fn, h, hv: [0.25, 0.35], tohum: 4 });

  // ----------------------------------------------------------------- 4) mimari: küçük, kaynaşmış, seçilen darbeler
  const fMim = { jit: 4, kuru: 0.6, ucBoy: 0.25, serit: 2.2, ha: 0.7 };
  G.minare.forEach((p, i) => {
    if (!p.poly || p.tip === 'bant' || p.tip === 'topuz') return;
    const yol = K.p2d([p.poly]);
    const xs = p.poly.map((q) => q[0]), ys = p.poly.map((q) => q[1]);
    const yat = p.ad.startsWith('çıkma') || p.ad.startsWith('şerefe') || p.ad === 'bilezik';
    const hgt = Math.max(...ys) - Math.min(...ys);
    K.bolgeBoya(ctx, { kutu: [Math.min(...xs) - 2, Math.min(...ys) - 2, Math.max(...xs) + 2, Math.max(...ys) + 2], aralik: 5, maske: K.maske(yol), klip: yol, boy: yat ? [16, 30] : [Math.min(14, hgt), Math.min(40, hgt + 6)], en: [7, 10], yon: () => (yat ? 0 : Math.PI / 2) + (R() - 0.5) * 0.05, renk: basamak(10), a: [0.88, 0.96], firca: fMim, fn, h, hv: [0.3, 0.4], tohum: 60 + i });
  });
  const kaideYol = K.p2d([G.kaide, G.kornis]);
  K.bolgeBoya(ctx, { kutu: [288, 690, 832, 800], aralik: 7, maske: K.maske(kaideYol), klip: kaideYol, boy: [40, 80], en: [10, 13], yon: () => (R() - 0.5) * 0.04, renk: basamak(9), a: [0.88, 0.96], firca: fMim, fn, h, hv: [0.3, 0.4], tohum: 7 });
  const kasnakYol = K.p2d(G.kasnak);
  K.bolgeBoya(ctx, { kutu: [330, 552, 790, 694], aralik: 5.5, maske: K.maske(kasnakYol), klip: kasnakYol, boy: [22, 44], en: [8, 11], yon: () => (R() - 0.5) * 0.04, renk: (x, y, r) => basamak(10)(x, Math.min(y, 688), r), a: [0.88, 0.96], firca: fMim, fn, h, hv: [0.3, 0.4], tohum: 8 });
  const meridyen = (x, y) => {
    const r = G.kubbeR(K.kenet(y, 301, 555));
    const u = K.kenet((x - 560) / (r || 1), -1, 1);
    const drdy = (G.kubbeR(K.kenet(y + 1, 301, 555)) - G.kubbeR(K.kenet(y - 1, 301, 555))) / 2;
    return Math.atan2(1, u * drdy);
  };
  // kubbe: her dilimde iki üç kaynaşmış ama seçilen meridyen darbesi
  K.bolgeBoya(ctx, { kutu: [356, 298, 764, 556], aralik: 6.5, maske: K.maske(G.kubbeYol), klip: G.kubbeYol, boy: [44, 86], en: [10, 14], yon: meridyen, egri: true, adim: 8, renk: basamak(12), a: [0.88, 0.96], firca: fMim, fn, h, hv: [0.3, 0.42], tohum: 9 });

  // ----------------------------------------------------------------- 5) ayrıntılar: ince ve kesin
  const ince = (pts, w, renk, a, hv, o) => K.firca(ctx, pts, Object.assign({ w, renk, a, r: R, kil: 0, bas: 0.06, son: 0.15, uc: 0.6, dalga: 0.08, h, hv: hv === undefined ? 0.38 : hv, ha: 0.6 }, o || {}));
  const el = (pts, amp) => pts.map(([x, y]) => [x + (nz.fbm(x / 30, y / 30, 2) - 0.5) * 2 * (amp || 0.5), y + (nz.fbm(x / 30 + 9, y / 30 + 4, 2) - 0.5) * 2 * (amp || 0.5)]);
  // kaburgalar: çok ince, yumuşak
  ctx.save();
  ctx.clip(G.kubbeYol);
  for (const kb of G.kaburga) {
    const pts = el(kb.noktalar.slice(1), 0.4);
    ince(pts, 1.5 - Math.abs(kb.u) * 0.4, K.hex('#2F6852'), 0.4);
    if (kb.u > -0.3) ince(pts.map(([x, y]) => [x + 1.3 - kb.u * 0.4, y]), 1.1, K.hex('#B9DCCB'), 0.35 + kb.u * 0.15);
  }
  ctx.restore();
  for (let k = 0; k < 2; k++) {
    const q = S.kasnak[k];
    ince(el([[q.x1, q.y1 + 1.2], [q.x2, q.y1 + 1.2]]), 2, K.hex('#A3CDB8'), 0.6);
    ince(el([[q.x1, q.y2 - 1.2], [q.x2, q.y2 - 1.2]]), 2, K.hex('#2F6852'), 0.45);
    for (const p of G.kasnakPen[k]) {
      const yol = K.p2d([el(p.poly, 0.3)]);
      ctx.fillStyle = K.rk(K.hex('#2C5C4A'));
      ctx.fill(yol);
      ctx.save();
      ctx.clip(yol);
      for (let q2 = 0; q2 < 3; q2++) ince([[p.x - p.w * 0.3 + q2 * p.w * 0.3, p.y + p.h + 2], [p.x - p.w * 0.3 + q2 * p.w * 0.3, p.y - 2]], p.w * 0.42, K.kay(K.hex('#2E604D'), (R() - 0.5) * 10), 0.7, 0.35, { kil: 3, jit: 6 });
      if (p.aci > -0.9) ince([[p.x - p.w / 2 + 1, p.y + p.w * 0.5], [p.x - p.w / 2 + 1, p.y + p.h]], Math.max(1.1, p.w * 0.2), K.hex('#6BA58A'), 0.7);
      ctx.restore();
    }
  }
  ince(el([[290, 692.4], [830, 692.4]], 0.3), 2.2, P.tasIsik, 0.95);
  ince(el([[300, 705], [820, 705]], 0.3), 2.2, K.hex('#B3BDC8'), 0.55);
  for (const p of G.kaidePen) {
    const yol = K.p2d([el(p.poly, 0.3)]);
    ctx.fillStyle = K.rk(K.hex('#7A8592'));
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    for (let q = 0; q < 4; q++) ince([[p.x - p.w * 0.36 + q * p.w * 0.24, p.y + p.h + 2], [p.x - p.w * 0.36 + q * p.w * 0.24, p.y - 2]], p.w * 0.3, K.kay(K.hex('#7C8794'), (R() - 0.5) * 12), 0.8, 0.35, { kil: 3, jit: 6 });
    ince([[p.x - p.w / 2 + 2, p.y + 6], [p.x - p.w / 2 + 2, p.y + p.h]], 3, K.hex('#B4BDC7'), 0.8);
    ctx.restore();
    ince(el([[p.x - p.w / 2 - 3, p.y + p.h + 1.2], [p.x + p.w / 2 + 3, p.y + p.h + 1.2]]), 2.2, P.tasIsik, 0.9);
  }
  // kaidenin dibinde kısa serin gölge
  for (let k = 0; k < 22; k++) {
    const x = 292 + k * 25 + R() * 6;
    ince([[x, 801.5], [x + 30 + R() * 8, 801.5]], 3.5, K.hex('#B8BDC0'), 0.7, 0.3);
  }
  const c = 300;
  for (const p of G.minare) {
    if (p.ad.startsWith('şerefe')) {
      const [x1, y1] = p.poly[0], [x2, y2] = p.poly[2];
      ince(el([[x1, y1 + 1], [x2, y1 + 1]], 0.3), 1.8, P.tasIsik, 0.95);
      ince(el([[x1, y2 - 1], [x2, y2 - 1]], 0.3), 1.8, K.hex('#A4AFBC'), 0.65);
    }
    if (p.ad.startsWith('çıkma')) {
      const [a, b, cc, dd] = p.poly;
      for (let k = 1; k < 8; k++) {
        const t = k / 8;
        const xa = a[0] + (dd[0] - a[0]) * t, xb = b[0] + (cc[0] - b[0]) * t;
        ince([[xb, b[1] + 1.5], [xa, a[1] - 2]], 1.1, t > 0.5 ? K.hex('#D3D8DE') : K.hex('#93A0AE'), 0.55, 0.35, { dalga: 0 });
      }
    }
    if (p.tip === 'korkuluk') {
      ctx.fillStyle = K.rk(K.hex('#B5BFCA'), 0.85);
      ctx.fillRect(p.x1, p.y1 + 3, p.x2 - p.x1, p.y2 - p.y1 - 5);
      ince(el([[p.x1, p.y1 + 1.5], [p.x2, p.y1 + 1.5]], 0.3), 2.6, P.tasIsik, 0.95);
      const n = 9;
      for (let i = 0; i < n; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / n;
        const lit = (x - c) / (p.x2 - c);
        ince([[x, p.y1 + 4], [x, p.y2 - 2]], 2.8, K.rkar(P.tasGolge, P.tasIsik, K.kenet(0.45 + lit * 0.55, 0, 1)), 0.95, 0.4, { dalga: 0 });
      }
    }
    if (p.ad === 'bilezik') {
      ince(el([[p.poly[0][0], 199], [p.poly[1][0], 199]], 0.2), 2, P.tasIsik, 0.9);
      ince(el([[p.poly[0][0], 205], [p.poly[1][0], 205]], 0.2), 1.8, K.hex('#A4AFBC'), 0.65);
    }
    if (p.tip === 'topuz') {
      const ty = K.p2d([p.poly]);
      ctx.save();
      ctx.clip(ty);
      ctx.fillStyle = K.rk(P.tas);
      ctx.fill(ty);
      for (let k = 0; k < 18; k++) {
        const t = k / 17;
        const x0 = c - 23 + 46 * t;
        let col = tasRamp(K.kenet(0.15 + t * 0.95 - (t > 0.86 ? (t - 0.86) * 2.4 : 0), 0, 1));
        if (t < 0.12) col = K.rkar(col, P.yansima, 0.4);
        ince([[x0 + (c - x0) * 0.1, 200], [x0 + (x0 - c) * 0.35, 180], [c + (x0 - c) * 0.3, 158], [c, 146]], 4, col, 0.85, 0.35, { son: 0.5, uc: 0.2 });
      }
      ctx.restore();
    }
  }
  for (const z of G.zikzak) ince(el(z, 0.3), 2, K.hex('#9AA6B3'), 0.8, 0.38, { son: 0.04, bas: 0.04, dalga: 0 });
  for (const p of G.minarePen) {
    const yol = K.p2d([el(p.poly, 0.3)]);
    ctx.fillStyle = K.rk(K.hex('#7A8592'));
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    ince([[p.x - p.w / 2 + 1.5, p.y + 5], [p.x - p.w / 2 + 1.5, p.y + p.h]], 2, K.hex('#B4BDC7'), 0.8);
    ctx.restore();
    ince(el([[p.x - p.w / 2 - 2, p.y + p.h + 1], [p.x + p.w / 2 + 2, p.y + p.h + 1]]), 1.8, P.tasIsik, 0.9);
  }
  // altın alemler: küçük ve kesin ışıklar
  const altinR = K.rampa([
    [0, P.altinKoyu],
    [0.45, P.altin],
    [0.8, P.altinIsik],
    [1, K.hex('#FBF4DA')],
  ]);
  const alem = (a) => {
    const cw = a.cubuk.x2 - a.cubuk.x1;
    ince([[a.cubuk.x1 + cw * 0.5, a.cubuk.y2 + 2], [a.cubuk.x1 + cw * 0.5, a.cubuk.y1]], cw * 1.05, P.altin, 0.95, 0.4, { dalga: 0, son: 0.05, bas: 0.02 });
    ince([[a.cubuk.x1 + cw * 0.25, a.cubuk.y2], [a.cubuk.x1 + cw * 0.25, a.cubuk.y1]], cw * 0.45, P.altinKoyu, 0.85, 0.4, { dalga: 0, son: 0.05 });
    ince([[a.cubuk.x2 - cw * 0.2, a.cubuk.y2], [a.cubuk.x2 - cw * 0.2, a.cubuk.y1]], cw * 0.35, P.altinIsik, 0.9, 0.4, { dalga: 0, son: 0.05 });
    const y = a.yaka;
    const ep = [];
    for (let i = 0; i < 28; i++) ep.push([y.cx + Math.cos((i / 28) * 6.283) * y.rx, y.cy + Math.sin((i / 28) * 6.283) * y.ry]);
    const ey = K.p2d([ep]);
    ctx.fillStyle = K.rk(P.altin);
    ctx.fill(ey);
    ctx.save();
    ctx.clip(ey);
    ince([[y.cx - y.rx, y.cy + y.ry * 0.5], [y.cx, y.cy + y.ry * 0.9], [y.cx + y.rx, y.cy + y.ry * 0.5]], y.ry, P.altinKoyu, 0.8, 0.4, { dalga: 0 });
    ince([[y.cx - y.rx * 0.2, y.cy - y.ry * 0.55], [y.cx + y.rx * 0.8, y.cy - y.ry * 0.3]], y.ry * 0.6, P.altinIsik, 0.9, 0.4, { dalga: 0 });
    ctx.restore();
    for (const k of a.kureler) K.kure(ctx, k.cx, k.cy, k.r, altinR, R, null);
    const hp = G.hilal(a);
    const hy = K.p2d([hp]);
    ctx.fillStyle = K.rk(P.altin);
    ctx.fill(hy);
    ctx.save();
    ctx.clip(hy);
    const H = a.hilal;
    const yay = (a0, a1, q, w, renk, al) => {
      const pts = [];
      for (let k = 0; k <= 12; k++) {
        const an = a0 + ((a1 - a0) * k) / 12;
        pts.push([H.cx + Math.cos(an) * H.R * q, H.cy + Math.sin(an) * H.R * q]);
      }
      ince(pts, w, renk, al, 0.4, { dalga: 0, bas: 0.25, son: 0.3, uc: 0.2 });
    };
    yay(1.9, 3.5, 0.9, H.R * 0.4, P.altinKoyu, 0.8);
    yay(-0.4, 1.3, 0.9, H.R * 0.35, P.altinIsik, 0.9);
    ctx.restore();
  };
  alem(G.alemK);
  alem(G.alemM);

  // ----------------------------------------------------------------- 6) bitkiler: narin, kesin kenarlı
  const yesilR = K.rampa([
    [0, K.hex('#3D6B5A')],
    [0.4, K.hex('#4F8370')],
    [0.7, K.hex('#6E9E88')],
    [1, K.hex('#A9C8B8')],
  ]);
  for (const s of S.bitki.saplar) {
    const pts = el(s, 0.6);
    ince(pts, 3.4, K.hex('#4F7F6A'), 0.95, 0.38, { son: 0.15, uc: 0.6 });
    ince(pts.map(([x, y]) => [x + 1, y - 0.4]), 1.2, K.hex('#A3C6B4'), 0.7);
  }
  S.bitki.tomurcuklar.forEach((t, i) => {
    if (i < 8) return;
    const pts = [];
    for (let k = 0; k <= 6; k++) pts.push([t.x - Math.cos(t.aci) * (t.r * 0.6 + k * 4.5) + Math.sin(k * 0.7) * 1.2, t.y - Math.sin(t.aci) * (t.r * 0.6 + k * 4.5)]);
    ince(pts, 2.6, K.hex('#4F7F6A'), 0.95);
  });
  for (const y0 of S.bitki.yapraklar) {
    const y = Object.assign({}, y0, { genislik: 0.36, uzunluk: y0.uzunluk * 1.04 });
    const poly = K.duz(S.yaprakYolu(y), 1.5)[0];
    const yol = K.p2d([el(poly, 0.4)]);
    h.save();
    h.clip(yol);
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const vLit = -sa * 0.7 + ca * -0.7 > 0 ? 1 : -1;
    const ton = y.uzunluk > 50 ? 0.42 + R() * 0.15 : 0.52 + R() * 0.2;
    ctx.save();
    ctx.clip(yol);
    ctx.fillStyle = K.rk(yesilR(ton - 0.05));
    ctx.fill(yol);
    const W = y.uzunluk * y.genislik;
    // her yarıya bir iki darbe: dipten uca, uçta incelen; ışık yarısı açık, gölge yarısı koyu
    for (const yan of [-1, 1]) {
      const isik = yan * vLit > 0;
      for (let k = 0; k < 2; k++) {
        const v = yan * W * (k ? 0.3 : 0.2);
        const boy = k ? 0.8 : 1.06;
        const pts = [];
        for (let s2 = 0; s2 <= 8; s2++) {
          const u = (s2 / 8) * y.uzunluk * boy - 2;
          const vv = v * Math.sin(((s2 / 8) * 0.88 + 0.1) * Math.PI);
          pts.push([y.x + u * ca - vv * sa, y.y + u * sa + vv * ca]);
        }
        const t = K.kenet(ton + (isik ? 0.24 : -0.08) + (k ? (isik ? 0.13 : -0.1) : 0), 0, 1);
        K.firca(ctx, pts, { w: W * (k ? 0.3 : 0.56), renk: K.kay(yesilR(t), (R() - 0.5) * 4), a: 0.95, r: R, kil: 6, jit: 12, kilA: 0.6, kuru: 0.6, bas: 0.1, son: 0.55, uc: 0.08, h, hv: 0.38, oluk: 0.06 });
      }
    }
    const [a, b] = S.yaprakDamari(y);
    ince([a, b], 1, yesilR(K.kenet(ton + 0.4, 0, 1)), 0.55);
    ctx.restore();
    h.restore();
  }
  for (const t of S.bitki.tomurcuklar) {
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const P2 = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const yol = K.p2d([el(K.duz(S.tomurcukYolu(t), 1)[0], 0.3)]);
    const isikV = -sa * 0.7 - ca * 0.7 > 0 ? 1 : -1;
    ctx.save();
    ctx.clip(yol);
    ctx.fillStyle = K.rk(K.hex('#E6E9E8'));
    ctx.fill(yol);
    for (let k = 0; k < 3; k++) {
      const v = (k - 1) * t.r * 0.62;
      const col = v * isikV > 0 ? K.hex('#FAF9F4') : v === 0 ? K.hex('#EEEFEC') : K.hex('#BCC5CF');
      ince([P2(-t.r * 0.9, v * 0.8), P2(t.r * 0.4, v), P2(t.r * 1.5, v * 0.25)], t.r * 0.8, col, 0.95, 0.38, { son: 0.4, uc: 0.2 });
    }
    ctx.restore();
    for (const yan of [-1, 1]) ince([P2(-t.r * 1.0, yan * t.r * 0.25), P2(-t.r * 0.3, yan * t.r * 0.95), P2(t.r * 0.45, yan * t.r * 0.55)], t.r * 0.5, yan * isikV > 0 ? K.hex('#7FA693') : K.hex('#4F7F6A'), 0.95, 0.38, { bas: 0.2, son: 0.6, uc: 0.1 });
    ince([P2(-t.r * 1.15, 0), P2(-t.r * 0.55, 0)], t.r * 0.85, K.hex('#5A8A74'), 0.95, 0.38, { son: 0.5, uc: 0.4 });
  }
  const beyazR = K.rampa([
    [0, K.hex('#B1BAC5')],
    [0.4, K.hex('#D2D8DE')],
    [0.72, K.hex('#EEEFEC')],
    [1, K.hex('#FCFBF7')],
  ]);
  // narin, altı taç yapraklı beyaz çiçekler (anemon gibi): ince yapraklar, serin gri gölge, kesin kenar
  const cs = S.bitki.cicekler.slice().sort((a, b) => a.r - b.r);
  for (const cc of cs) {
    const n = 6;
    const sira = [...Array(n).keys()].sort((i, j) => Math.sin(cc.aci + (j * 6.283) / n) - Math.sin(cc.aci + (i * 6.283) / n));
    for (const i of sira) {
      const a = cc.aci + (i * Math.PI * 2) / n;
      const poly = K.tacYaprak(cc.x + Math.cos(a) * cc.r * 0.1, cc.y + Math.sin(a) * cc.r * 0.1, a, cc.r * 0.98, cc.r * 0.62, 0.04);
      const yol = K.p2d([el(poly, 0.25)]);
      const yuz = Math.cos(a) * 0.7 - Math.sin(a) * 0.7;
      ctx.save();
      ctx.clip(yol);
      h.save();
      h.clip(yol);
      ctx.fillStyle = K.rk(beyazR(0.5 + yuz * 0.22));
      ctx.fill(yol);
      // iki darbe: merkezden uca, uçta incelen; ışıktan uzak yarı bir basamak koyu
      for (let k = 0; k < 2; k++) {
        const v = (k ? 1 : -1) * cc.r * 0.13;
        const yan = Math.sign(-Math.sin(a) * 0.7 - Math.cos(a) * 0.7) * Math.sign(v);
        const t0 = K.kenet(0.62 + yuz * 0.24 + yan * 0.13, 0, 1);
        const pts = [];
        for (let s2 = 0; s2 <= 6; s2++) {
          const u = (s2 / 6) * cc.r * 1.08;
          const vv = v * (0.35 + 0.65 * Math.sin((s2 / 6) * 1.7));
          pts.push([cc.x + u * Math.cos(a) - vv * Math.sin(a), cc.y + u * Math.sin(a) + vv * Math.cos(a)]);
        }
        K.firca(ctx, pts, { w: cc.r * 0.34, renk: beyazR(t0), a: 0.95, r: R, kil: 5, jit: 6, kilA: 0.4, kuru: 0.4, bas: 0.12, son: 0.5, uc: 0.12, h, hv: 0.36, oluk: 0.04 });
      }
      // dipte serin gri gölge ve ince orta damar
      ince([[cc.x, cc.y], [cc.x + Math.cos(a) * cc.r * 0.45, cc.y + Math.sin(a) * cc.r * 0.45]], cc.r * 0.26, K.hex('#BAC3CE'), 0.55, 0.36, { son: 0.6, uc: 0.1 });
      ince([[cc.x + Math.cos(a) * cc.r * 0.3, cc.y + Math.sin(a) * cc.r * 0.3], [cc.x + Math.cos(a) * cc.r * 0.85, cc.y + Math.sin(a) * cc.r * 0.85]], 0.8, K.hex('#C6CDD6'), 0.6, 0.36);
      h.restore();
      ctx.restore();
      if (yuz < 0.25) {
        const kn = poly.slice(2, Math.floor(poly.length / 2) - 1);
        ince(el(kn, 0.3), 1.1, K.hex('#A3AEBB'), 0.5, 0.36, { bas: 0.3, son: 0.4, uc: 0.1 });
      }
    }
    // orta: küçük yeşilimsi göbek ve ince erkek organlar
    const rr = cc.r * 0.15;
    for (let k = 0; k < 16; k++) {
      const an = (k / 16) * 6.283 + R() * 0.2;
      const q = rr * (1.4 + R() * 0.5);
      ince([[cc.x + Math.cos(an) * rr * 0.7, cc.y + Math.sin(an) * rr * 0.7], [cc.x + Math.cos(an) * q, cc.y + Math.sin(an) * q]], Math.max(0.7, cc.r * 0.025), K.hex('#B59C4A'), 0.85);
    }
    K.cicekOrta(ctx, cc.x, cc.y, rr, { orta: K.hex('#A9B266'), koyu: K.hex('#6F8456'), acik: K.hex('#D9DCA0') }, R, { lek: 3 });
  }

  // ----------------------------------------------------------------- 7) ince boya, bez dokusu, el
  const bez = K.bezDokusu(4.6, 0.022, 19);
  K.isikla(ctx, hc, { guc: 0.0032, bulanik: 0.9, doku: bez });
  K.titret(ctx, 1.2, 100, 29);
  S.hazir();
})();

</script>
