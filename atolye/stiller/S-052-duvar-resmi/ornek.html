<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-052 Duvar Resmi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #8a8278; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-052 Duvar Resmi — tuğla duvara dış cephe akriliğiyle boyanmış büyük bir kent duvar resmi: uzaktan okunan
// sade, iri biçimler ve doygun renkler, kalın koyu kontur, elle çekilmiş hafif pürüzlü kenarlar; boyanın
// altından tuğla dokusu ve derz çizgileri görünür; hafif güneş solması, yağmur izi, kenarlarda boya atması.
// Altta boyanmamış iki sıra tuğla ve kaldırım, resmin bir duvar olduğunu gösterir.
(function () {
  'use strict';
  const S = SAHNE;
  const W = 1024;
  const tuval = document.getElementById('tuval');
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  tuval.width = W;
  tuval.height = W;
  const R = S.rng(5252);
  const P = (d) => new Path2D(d);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function hash(x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function gurultu(tohum) {
    const r = S.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 13.1; y = ny + 7.7; a *= 0.5; }
    return s / t;
  }
  const nA = gurultu(21), nB = gurultu(22), nC = gurultu(23), nD = gurultu(24);

  // ============================================================ 1. DUVAR RESMİ (ekran dışı tuvalde düz renkli boya)
  const RES_ALT = 936; // boyalı alanın alt sınırı (tuğla sırası çizgisi)
  const ZEMIN = 966; // kaldırımın başladığı yer
  const resim = S.yeniTuval();
  const g = resim.getContext('2d', { willReadFrequently: true });
  // sahne boyalı alana sığacak biçimde biraz küçültülür; en alttaki çiçeklerin alt ucu (y ≈ 1023)
  // tuğla sırasının hemen üstüne denk gelecek kadar yukarı kaydırılır, böylece konu gökte küçük kalmaz
  const s = 0.95;
  g.setTransform(s, 0, 0, s, (W / 2) * (1 - s), RES_ALT - 1023 * s);
  const KONTUR = '#1C2340';
  g.lineJoin = 'round';
  g.lineCap = 'round';
  const dolKon = (d, renk, kalin, kon) => {
    const p = typeof d === 'string' ? P(d) : d;
    g.fillStyle = renk;
    g.fill(p);
    if (kalin) {
      g.strokeStyle = kon || KONTUR;
      g.lineWidth = kalin;
      g.stroke(p);
    }
  };

  // --- gök: el ile çekilmiş dalgalı bantlar, geçişlerde birbirine giren kuru fırça dilleri
  const bantlar = ['#1B3C8C', '#2459AE', '#3479C6', '#55A2D6', '#8CCBDD', '#C9E5CF', '#F4E3A2'];
  const sinirlar = [130, 255, 370, 480, 590, 700];
  const bantY = (k, x) => sinirlar[k] + Math.sin(x * 0.011 + k * 1.9) * 7 + Math.sin(x * 0.027 + k) * 3;
  g.fillStyle = bantlar[bantlar.length - 1];
  g.fillRect(-120, -10, 1270, 830);
  for (let k = bantlar.length - 2; k >= 0; k--) {
    g.fillStyle = bantlar[k];
    g.beginPath();
    g.moveTo(-120, -10);
    for (let x = -120; x <= 1150; x += 10) g.lineTo(x, bantY(k, x));
    g.lineTo(1150, -10);
    g.closePath();
    g.fill();
  }
  // geçiş dilleri: üst bandın rengi alttakine, alttakinin rengi üsttekine sivri fırça darbeleriyle girer
  for (let k = 0; k < sinirlar.length; k++) {
    const r = S.rng(300 + k);
    for (let x = -110; x < 1150; x += 4 + r() * 5) {
      const y = bantY(k, x) + (r() - 0.5) * 4;
      const asagi = r() < 0.5;
      const boy = 6 + r() * 12, gen = 1.8 + r() * 2.4;
      g.fillStyle = asagi ? bantlar[k] : bantlar[k + 1];
      const yon = asagi ? 1 : -1;
      g.beginPath();
      g.moveTo(x - gen, y - yon * 2);
      g.quadraticCurveTo(x - gen * 0.3, y + yon * boy * 0.6, x + (r() - 0.5) * 4, y + yon * boy);
      g.quadraticCurveTo(x + gen * 0.3, y + yon * boy * 0.6, x + gen, y - yon * 2);
      g.closePath();
      g.fill();
    }
  }

  // --- güneş: soluk sarı disk, turuncu halka; konturu olmayan ince uzun ışın kamaları
  {
    const gx = 880, gy = 140;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2 + 0.05;
      const uzun = i % 2 === 0;
      const r1 = 84, r2 = uzun ? 190 : 140, w = uzun ? 0.07 : 0.05;
      g.beginPath();
      g.moveTo(gx + Math.cos(a - w) * r1, gy + Math.sin(a - w) * r1);
      g.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2);
      g.lineTo(gx + Math.cos(a + w) * r1, gy + Math.sin(a + w) * r1);
      g.closePath();
      g.fillStyle = uzun ? '#FFE07A' : '#FFC65A';
      g.fill();
    }
    dolKon(S.daireYolu(gx, gy, 76), '#F7A13C', 0);
    dolKon(S.daireYolu(gx, gy, 64), '#FFD95A', 0);
    dolKon(S.daireYolu(gx, gy, 52), '#FFEFA6', 0);
    g.strokeStyle = '#C4642A';
    g.lineWidth = 3;
    g.stroke(P(S.daireYolu(gx, gy, 76)));
  }

  // --- bulutlar: dalgalı tepeli beyaz biçim, altında leylak gölge bandı, koyu kontur
  const bulut = (cx, cy, k) => {
    // üst üste binen, yuvarlak uçlu yatay şeritler: sade, ağırbaşlı duvar resmi bulutu
    const seritler = [[-70, 0, 190, 26], [-40, -20, 120, 24], [10, -38, 70, 22]];
    const p = new Path2D();
    for (const [dx, dy, w, h] of seritler) {
      const x = cx + dx * k, y = cy + dy * k, ww = w * k, hh = h * k, rr = hh / 2;
      p.moveTo(x + rr, y);
      p.lineTo(x + ww - rr, y);
      p.arc(x + ww - rr, y + rr, rr, -Math.PI / 2, Math.PI / 2);
      p.lineTo(x + rr, y + hh);
      p.arc(x + rr, y + rr, rr, Math.PI / 2, (Math.PI * 3) / 2);
      p.closePath();
    }
    g.save();
    g.strokeStyle = KONTUR;
    g.lineWidth = 6;
    g.stroke(p);
    g.fillStyle = '#FFFFFF';
    g.fill(p);
    g.save();
    g.clip(p);
    g.fillStyle = '#BFD0EE';
    for (const [dx, dy, w, h] of seritler) g.fillRect(cx + dx * k, cy + (dy + h * 0.62) * k, w * k, h * 0.5 * k);
    g.restore();
    g.restore();
  };
  bulut(95, 252, 1.3);
  bulut(430, 152, 1.05);
  bulut(660, 334, 1.35);
  bulut(880, 474, 0.85);
  bulut(26, 474, 0.9);

  // --- uzak tepeler ve zemin bantları
  {
    g.fillStyle = '#7FA65A';
    g.beginPath();
    g.moveTo(-120, 812);
    for (let x = -120; x <= 1150; x += 10) g.lineTo(x, 748 + Math.sin(x * 0.0085 + 1.2) * 18 + Math.sin(x * 0.021) * 7);
    g.lineTo(1150, 812);
    g.closePath();
    g.fill();
    g.strokeStyle = KONTUR;
    g.lineWidth = 4;
    g.stroke();
    g.fillStyle = '#5C8A46';
    g.beginPath();
    g.moveTo(-120, 812);
    for (let x = -120; x <= 1150; x += 10) g.lineTo(x, 778 + Math.sin(x * 0.012 + 3.1) * 10);
    g.lineTo(1150, 812);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#F3DDA4';
    g.fillRect(-120, 800, 1270, 240);
    g.fillStyle = '#E2BD78';
    g.beginPath();
    g.moveTo(-120, 1040);
    for (let x = -120; x <= 1150; x += 10) g.lineTo(x, 880 + Math.sin(x * 0.01) * 6);
    g.lineTo(1150, 1040);
    g.closePath();
    g.fill();
    g.strokeStyle = KONTUR;
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(-120, 800);
    g.lineTo(1150, 800);
    g.stroke();
  }

  // --- minare: iki tonlu düz boya (sağ ışıkta krem, sol gölgede kum), kalın kontur
  const KREM = '#F6ECD6', KUM = '#D9C29A', KUM2 = '#B99A6C', PEN = '#1E4D5C', ALTIN = '#F2B33D', ALTIN2 = '#C47F1E', ALTIN3 = '#FFE48A';
  const parcalar = S.minareParcalari();
  const ikiTon = (yol, x1, x2, oran, acik, koyu) => {
    const p = P(yol);
    g.fillStyle = acik;
    g.fill(p);
    g.save();
    g.clip(p);
    g.fillStyle = koyu;
    g.fillRect(x1 - 2, 0, (x2 - x1) * oran + 2, 1024);
    g.restore();
    return p;
  };
  const konturler = [];
  for (const pr of parcalar) {
    if (pr.tip === 'poligon') {
      const xs = pr.noktalar.map((q) => q[0]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs);
      const d = S.yol(pr.noktalar, true);
      if (pr.ad.startsWith('çıkma')) {
        ikiTon(d, x1, x2, 0.35, KUM, KUM2);
      } else {
        ikiTon(d, x1, x2, 0.3, KREM, KUM);
      }
      konturler.push(d);
    } else if (pr.tip === 'korkuluk') {
      const d = S.yol([[pr.x1, pr.y1], [pr.x2, pr.y1], [pr.x2, pr.y2], [pr.x1, pr.y2]], true);
      ikiTon(d, pr.x1, pr.x2, 0.3, KREM, KUM);
      g.strokeStyle = KONTUR;
      g.lineWidth = 3;
      for (let i = 1; i < 7; i++) {
        const x = pr.x1 + ((pr.x2 - pr.x1) * i) / 7;
        g.beginPath();
        g.moveTo(x, pr.y1 + 4);
        g.lineTo(x, pr.y2);
        g.stroke();
      }
      konturler.push(d);
    } else if (pr.tip === 'bant') {
      g.strokeStyle = '#C8553D';
      g.lineWidth = 5;
      g.lineJoin = 'miter';
      for (const z of S.zikzakCizgileri()) g.stroke(P(S.yol(z)));
      g.lineJoin = 'round';
    } else if (pr.tip === 'topuz') {
      ikiTon(pr.yol, 266, 334, 0.36, KREM, KUM);
      konturler.push(pr.yol);
    }
  }
  for (const pc of S.minarePencereleri) dolKon(S.kemerYolu(pc.x, pc.y, pc.w, pc.h), PEN, 0);
  g.strokeStyle = KONTUR;
  g.lineWidth = 4;
  for (const d of konturler) g.stroke(P(d));
  // minare gövdesi alttan kaideye kadar tek kontur
  // alemler
  const alemCiz = (a, k) => {
    const c = a.cubuk;
    g.strokeStyle = KONTUR;
    g.lineWidth = 3;
    g.fillStyle = ALTIN2;
    g.fillRect(c.x1 - 1, c.y1, c.x2 - c.x1 + 2, c.y2 - c.y1);
    g.strokeRect(c.x1 - 1, c.y1, c.x2 - c.x1 + 2, c.y2 - c.y1);
    const yk = a.yaka;
    dolKon(S.elipsYolu({ cx: yk.cx, cy: yk.cy, rx: yk.rx, ry: yk.ry, aci: 0 }), ALTIN, 3.5);
    for (const q of a.kureler) {
      dolKon(S.daireYolu(q.cx, q.cy, q.r), ALTIN, 3.5);
      g.fillStyle = ALTIN3;
      g.beginPath();
      g.arc(q.cx + q.r * 0.3, q.cy - q.r * 0.3, q.r * 0.35, 0, Math.PI * 2);
      g.fill();
    }
    dolKon(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R * 1.15), ALTIN, 3.5);
  };
  alemCiz(parcalar.find((p) => p.tip === 'alem').alem, 0.62);

  // --- kaide
  {
    const K = S.kaide;
    const d = S.yol([[K.x1, K.y1], [K.x2, K.y1], [K.x2, K.y2], [K.x1, K.y2]], true);
    const p = P(d);
    g.fillStyle = KREM;
    g.fill(p);
    g.save();
    g.clip(p);
    g.fillStyle = KUM;
    g.fillRect(K.x1, K.y1, 70, K.y2 - K.y1);
    g.fillStyle = '#E8D7B4';
    g.fillRect(K.x1, K.y1, K.x2 - K.x1, 14);
    g.restore();
    g.strokeStyle = KONTUR;
    g.lineWidth = 4;
    g.stroke(p);
    for (const w of K.pencereler) {
      const wd = S.kemerYolu(w.x, w.y, w.w + 4, w.h + 2);
      dolKon(wd, PEN, 3.5);
      g.save();
      g.clip(P(wd));
      g.fillStyle = '#5E97A0';
      g.fillRect(w.x - w.w / 2 - 3, w.y, w.w * 0.28, w.h + 4);
      g.restore();
    }
    const k = K.kornis;
    dolKon(S.yol([[k.x1, k.y1], [k.x2, k.y1], [k.x2, k.y2], [k.x1, k.y2]], true), '#FFF7E6', 4);
  }

  // --- kasnak: iki kat, her biri gölge / orta / ışık üç düz tonda
  const kasnakCiz = (kat, koyu, orta, acik, pen) => {
    const q = S.kasnak[kat];
    const d = S.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true);
    const p = P(d);
    const w = q.x2 - q.x1;
    g.fillStyle = orta;
    g.fill(p);
    g.save();
    g.clip(p);
    g.fillStyle = koyu;
    g.fillRect(q.x1, q.y1, w * 0.2, q.y2 - q.y1);
    g.fillStyle = acik;
    g.fillRect(q.x1 + w * 0.6, q.y1, w * 0.26, q.y2 - q.y1);
    g.restore();
    for (const pc of S.kasnakPencereleri(kat)) dolKon(S.kemerYolu(pc.x, pc.y, pc.w + 1.5, pc.h), pen, 0);
    g.strokeStyle = KONTUR;
    g.lineWidth = 4;
    g.stroke(p);
  };
  kasnakCiz(1, '#145A2B', '#1F7A3A', '#3DA155', '#0B2E1A');
  kasnakCiz(0, '#18602F', '#2B8A45', '#4DB466', '#0B2E1A');

  // --- kubbe: 16 dilim, sağ üstten ışığa göre kademeli düz tonlar (posterize), kalın kaburgalar
  {
    const prof = S.kubbeProfili(60);
    const tonlar = ['#0D4A25', '#14612F', '#1C7A3A', '#2A9447', '#45AE57', '#6BC86A'];
    for (let k = 0; k < 16; k++) {
      const u1 = Math.sin(-Math.PI / 2 + (Math.PI * k) / 16), u2 = Math.sin(-Math.PI / 2 + (Math.PI * (k + 1)) / 16);
      const ph = -Math.PI / 2 + (Math.PI * (k + 0.5)) / 16;
      const isik = Math.max(0, Math.sin(ph) * 0.62 + Math.cos(ph) * 0.78);
      const ti = clamp(Math.round(isik * 5.4) - (k === 15 ? 1 : 0), 0, 5);
      const pts = prof.map((q) => [560 + u1 * q.r, q.y]).concat(prof.slice().reverse().map((q) => [560 + u2 * q.r, q.y]));
      g.fillStyle = tonlar[ti];
      g.fill(P(S.yol(pts, true)));
      // kaburganın gölge tarafında ince koyu şerit
      const pts2 = prof.map((q) => [560 + u1 * q.r, q.y]).concat(prof.slice().reverse().map((q) => [560 + (u1 + (u2 - u1) * 0.22) * q.r, q.y]));
      g.fillStyle = 'rgba(8,40,20,0.28)';
      g.fill(P(S.yol(pts2, true)));
    }
    // kubbenin alt bölümünde gölge bandı
    g.save();
    g.clip(P(S.kubbeYolu));
    g.fillStyle = 'rgba(6,40,22,0.3)';
    g.beginPath();
    g.moveTo(340, 560);
    for (let x = 340; x <= 780; x += 10) g.lineTo(x, 528 - Math.sin(((x - 360) / 400) * Math.PI) * 8);
    g.lineTo(780, 560);
    g.closePath();
    g.fill();
    // ışık lekeleri: sağ üstte iri, düz açık yeşil parlamalar
    g.fillStyle = '#A6E58F';
    for (const [x, y, rx, ry, a] of [[640, 372, 9, 34, -0.42], [668, 400, 7, 26, -0.32], [618, 352, 5, 16, -0.55]]) {
      g.beginPath();
      g.ellipse(x, y, rx, ry, a, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
    g.strokeStyle = '#0A3A1C';
    g.lineWidth = 3;
    for (const kb of S.kaburgalar(16)) g.stroke(P(S.yol(kb.noktalar)));
    g.strokeStyle = KONTUR;
    g.lineWidth = 5;
    g.stroke(P(S.kubbeYolu));
    alemCiz(S.alemParcalari(560, 300, 1), 1);
  }

  // --- bitkiler: iri, sade, iki tonlu yapraklar; beyaz ve mercan çiçekler
  {
    g.strokeStyle = KONTUR;
    g.lineWidth = 9;
    for (const sp of S.bitki.saplar) g.stroke(P(S.yol(sp)));
    g.strokeStyle = '#3E8E3A';
    g.lineWidth = 5;
    for (const sp of S.bitki.saplar) g.stroke(P(S.yol(sp)));
    const yaprakCiz = (yp, buyut) => {
      const y2 = { ...yp, uzunluk: yp.uzunluk * buyut, genislik: 0.5 };
      const p = P(S.yaprakYolu(y2));
      g.fillStyle = '#6DBE45';
      g.fill(p);
      // damarın bir yanı koyu ton
      g.save();
      g.clip(p);
      const ca = Math.cos(y2.aci), sa = Math.sin(y2.aci);
      const nx = -sa, ny = ca;
      const isikta = nx * 0.7 - ny * 0.7 > 0 ? -1 : 1;
      g.fillStyle = '#2E7D3A';
      g.beginPath();
      g.moveTo(y2.x, y2.y);
      g.lineTo(y2.x + ca * y2.uzunluk * 1.1, y2.y + sa * y2.uzunluk * 1.1);
      g.lineTo(y2.x + ca * y2.uzunluk * 1.1 + nx * isikta * 60, y2.y + sa * y2.uzunluk * 1.1 + ny * isikta * 60);
      g.lineTo(y2.x + nx * isikta * 60, y2.y + ny * isikta * 60);
      g.closePath();
      g.fill();
      g.restore();
      g.strokeStyle = KONTUR;
      g.lineWidth = 3.5;
      g.stroke(p);
      const [a, b] = S.yaprakDamari(y2);
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0], b[1]);
      g.stroke();
    };
    for (const yp of S.bitki.yapraklar) yaprakCiz(yp, 1.08);
    for (const t of S.bitki.tomurcuklar) dolKon(S.tomurcukYolu({ ...t, r: t.r * 1.2 }), '#EF5B8C', 3.5);
    const mercan = new Set([1, 3, 6, 10, 12]);
    S.bitki.cicekler.forEach((c, i) => {
      const m = mercan.has(i);
      const tac = m ? '#F26A5A' : '#FFFFFF';
      const tacG = m ? '#C9443F' : '#F5B7C8';
      const c2 = { ...c, r: c.r * 1.06 };
      const taclar = S.tacYapraklari(c2);
      const birlesik = new Path2D();
      for (const e of taclar) birlesik.addPath(P(S.elipsYolu(e)));
      g.strokeStyle = KONTUR;
      g.lineWidth = 7;
      g.stroke(birlesik);
      for (const e of taclar) {
        const p = P(S.elipsYolu(e));
        g.fillStyle = tac;
        g.fill(p);
        // her taç yaprağın göbeğe yakın yarısı gölge tonu
        g.save();
        g.clip(p);
        g.fillStyle = tacG;
        g.beginPath();
        g.arc(c2.x, c2.y, c2.r * 0.5, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
      g.strokeStyle = KONTUR;
      g.lineWidth = 2.5;
      for (const e of taclar) g.stroke(P(S.elipsYolu(e)));
      dolKon(S.daireYolu(c2.x, c2.y, c2.r * 0.24), '#F08A24', 3);
      dolKon(S.daireYolu(c2.x, c2.y, c2.r * 0.14), '#FFD23F', 0);
    });
  }

  // ============================================================ 2. TUĞLA DUVAR + BOYA (piksel piksel)
  const resimVeri = g.getImageData(0, 0, W, W).data;
  const CH = 24, BL = 72, MT = 3.6; // sıra yüksekliği, tuğla boyu, derz kalınlığı
  const N = W * W;
  const H = new Float32Array(N); // yükseklik: tuğla yüzü 1, derz 0
  const tugla = new Int32Array(N); // tuğla kimliği
  for (let y = 0; y < W; y++) {
    const sira = Math.floor(y / CH);
    const fy = y - sira * CH;
    const kay = (sira % 2) * (BL / 2) + (hash(sira, 3, 9) - 0.5) * 6;
    for (let x = 0; x < W; x++) {
      const bx = x + kay + 200;
      const sut = Math.floor(bx / BL);
      const fx = bx - sut * BL;
      const kenarG = (nA(x * 0.45, y * 0.45) - 0.5) * 1.6 + (hash(x, y, 4) - 0.5) * 0.5;
      const dmin = Math.min(fy - MT * 0.5, CH - MT * 0.5 - fy, fx - MT * 0.5, BL - MT * 0.5 - fx) + kenarG;
      let h = sstep(0, 2.2, dmin);
      h += (nB(x * 0.35, y * 0.35) - 0.5) * 0.2 + (hash(x, y, 5) - 0.5) * 0.08;
      // tuğla yüzündeki küçük oyuklar (boyanın altından da görünür)
      const oyuk = nC(x * 0.7 + 11, y * 0.7 + 5);
      if (oyuk > 0.8) h -= (oyuk - 0.8) * 2.2;
      const i = y * W + x;
      H[i] = h;
      tugla[i] = sira * 4096 + sut;
    }
  }
  const cikti = ctx.createImageData(W, W);
  const d = cikti.data;
  const TUGLALAR = [hex('#9E4B33'), hex('#B35C3C'), hex('#8A3F2C'), hex('#A8573A'), hex('#94503A'), hex('#BC6A48')];
  const HARC = hex('#B5AEA2');
  // boya atmasının görüldüğü birkaç yer (konudan uzak: köşeler, kenarlar, dip)
  const ATMA = [[40, 60, 70], [990, 610, 60], [150, 900, 50], [990, 880, 70], [12, 420, 36]];
  const ASTAR = hex('#ECE6D8');
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const h = H[i];
      const hx = H[y * W + Math.min(W - 1, x + 1)] - H[y * W + Math.max(0, x - 1)];
      const hy = H[Math.min(W - 1, y + 1) * W + x] - H[Math.max(0, y - 1) * W + x];
      // ışık sağ üstten: yukarı ve sağa bakan eğimler aydınlanır
      let golge = (1 + (-hx * 0.55 + hy * 0.6) * 0.5) * (0.95 + 0.07 * (x / W) * (1 - y / W) + 0.03 * (1 - y / W));
      golge *= 0.86 + 0.14 * clamp(h, 0, 1);
      const tid = tugla[i];
      const th = hash(tid, 11, 3);
      const derz = h < 0.35;
      // boyanın sınırı (alttaki boyanmamış sıralar), hafif pürüzlü
      const resimSinir = RES_ALT + (nC(x * 0.2, 3) - 0.5) * 3 + (hash(x, 1, 8) - 0.5) * 1.5;
      let renk;
      if (y < resimSinir) {
        // kenarları elle çekilmiş gibi pürüzlü: örnekleme noktası ince gürültüyle kaydırılır
        const ox = (nD(x * 0.16, y * 0.16) - 0.5) * 3.4 + (nA(x * 0.6, y * 0.6) - 0.5) * 1.0;
        const oy = (nD(x * 0.16 + 40, y * 0.16 + 40) - 0.5) * 3.4 + (nA(x * 0.6 + 9, y * 0.6 + 9) - 0.5) * 1.0;
        const sx = clamp(Math.round(x + ox), 0, W - 1), sy = clamp(Math.round(y + oy), 0, W - 1);
        const k = (sy * W + sx) * 4;
        let boya = [resimVeri[k], resimVeri[k + 1], resimVeri[k + 2]];
        // tuğladan tuğlaya boyanın emilimi farklı: hafif ton oynaması; rulo izi
        const ton = 1 + (th - 0.5) * 0.05 + (nB(x * 0.02, y * 0.06) - 0.5) * 0.05;
        boya = [boya[0] * ton, boya[1] * ton, boya[2] * ton];
        // güneş solması: üstte daha fazla, hafif beyazlaşma ve doygunluk kaybı
        const sol = 0.06 + 0.08 * (1 - y / W) + (fbm(nA, x * 0.006, y * 0.006, 3) - 0.5) * 0.12;
        const gri = (boya[0] + boya[1] + boya[2]) / 3;
        boya = mix(boya, [gri + 18, gri + 18, gri + 14], clamp(sol, 0, 0.3));
        // derzde boya her yere girmez: harç rengi yer yer görünür
        let ort = derz ? 0.9 + nA(x * 0.9, y * 0.9) * 0.2 : 1;
        // boya atması (hafif): yalnız birkaç bölgede, tuğla kenarlarında ve dipte küçük kopuklar
        let bolge = sstep(890, 936, y) * 0.75;
        for (const [bx, by, br] of ATMA) { const dx = x - bx, dy = y - by; bolge += Math.exp(-(dx * dx + dy * dy) / (br * br)); }
        bolge = Math.min(1, bolge) * sstep(0.35, 0.6, fbm(nC, x * 0.02 + 3, y * 0.02, 3));
        const kop = bolge * (fbm(nD, x * 0.07, y * 0.07, 3) + (1 - h) * 0.1 + (hash(x >> 1, y >> 1, 17) - 0.5) * 0.04);
        let alt = derz ? HARC : TUGLALAR[(th * 6) | 0];
        if (kop > 0.62) { ort = 0; }
        else if (kop > 0.58) { ort = Math.min(ort, 0.2); alt = ASTAR; }
        renk = mix(alt, boya, clamp(ort, 0, 1));
      } else {
        renk = derz ? HARC : mix(TUGLALAR[(th * 6) | 0], [70, 40, 30], (hash(x, y, 21) - 0.5) * 0.2 + nB(x * 0.3, y * 0.3) * 0.12);
      }
      // yağmur izleri: üstten inen ince, soluk dikey lekeler
      const iz = sstep(0.62, 0.9, nA(x * 0.09, 50.5)) * (0.5 + 0.5 * nB(x * 0.09, y * 0.004)) * (1 - y / 1300);
      renk = mix(renk, [96, 90, 84], iz * 0.12);
      // dipte nem ve sıçrayan toz
      const nem = sstep(880 + nC(x * 0.03, 9) * 40, 966, y);
      renk = mix(renk, [88, 74, 62], nem * 0.28);
      // derzlerde beyaz çiçeklenme (kireç)
      if (derz && y > 900) renk = mix(renk, [236, 232, 220], 0.25 * hash(x >> 2, y >> 2, 31));
      const tane = (hash(x, y, 41) - 0.5) * 10;
      const o = i * 4;
      d[o] = clamp(renk[0] * golge + tane, 0, 255);
      d[o + 1] = clamp(renk[1] * golge + tane, 0, 255);
      d[o + 2] = clamp(renk[2] * golge + tane, 0, 255);
      d[o + 3] = 255;
    }
  }
  ctx.putImageData(cikti, 0, 0);

  // ============================================================ 3. KALDIRIM
  {
    // duvar dibinde temas gölgesi
    const gg = ctx.createLinearGradient(0, ZEMIN - 6, 0, ZEMIN + 6);
    gg.addColorStop(0, 'rgba(30,24,20,0)');
    gg.addColorStop(1, 'rgba(30,24,20,0.4)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, ZEMIN - 6, W, 6);
    const z = ctx.createLinearGradient(0, ZEMIN, 0, W);
    z.addColorStop(0, '#8E887E');
    z.addColorStop(0.18, '#ABA59A');
    z.addColorStop(1, '#C3BDB1');
    ctx.fillStyle = z;
    ctx.fillRect(0, ZEMIN, W, W - ZEMIN);
    // bordür kenarı (duvara paralel), plak derzleri (perspektifte ufka kaçan)
    ctx.strokeStyle = 'rgba(70,64,58,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, ZEMIN + 18);
    ctx.lineTo(W, ZEMIN + 18);
    ctx.stroke();
    const kx = 512, ky = 760;
    for (let i = -6; i <= 6; i++) {
      const xb = 512 + i * 170;
      const t0 = (ZEMIN + 18 - ky) / (W - ky);
      ctx.beginPath();
      ctx.moveTo(kx + (xb - kx) * t0, ZEMIN + 18);
      ctx.lineTo(xb, W);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, ZEMIN + 19.5);
    ctx.lineTo(W, ZEMIN + 19.5);
    ctx.stroke();
    // beton dokusu
    const id = ctx.getImageData(0, ZEMIN, W, W - ZEMIN), dd = id.data;
    for (let y = 0; y < W - ZEMIN; y++) {
      for (let x = 0; x < W; x++) {
        const o = (y * W + x) * 4;
        const n = (hash(x, y + ZEMIN, 51) - 0.5) * 18 + (fbm(nB, x * 0.04, (y + ZEMIN) * 0.12, 3) - 0.5) * 22;
        dd[o] = clamp(dd[o] + n, 0, 255);
        dd[o + 1] = clamp(dd[o + 1] + n, 0, 255);
        dd[o + 2] = clamp(dd[o + 2] + n * 0.9, 0, 255);
      }
    }
    ctx.putImageData(id, 0, ZEMIN);
    // duvar dibinde birkaç ot tutamı
    const r = S.rng(88);
    for (const tx of [96, 418, 744, 958]) {
      for (let k = 0; k < 9; k++) {
        const a = -Math.PI / 2 + (r() - 0.5) * 1.3;
        const L2 = 8 + r() * 12;
        const x0 = tx + (r() - 0.5) * 14;
        ctx.strokeStyle = r() < 0.5 ? '#5F7A3A' : '#7C9446';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x0, ZEMIN + 2);
        ctx.quadraticCurveTo(x0 + Math.cos(a) * L2 * 0.5, ZEMIN + 2 + Math.sin(a) * L2 * 0.6, x0 + Math.cos(a) * L2, ZEMIN + 2 + Math.sin(a) * L2);
        ctx.stroke();
      }
    }
  }
  S.hazir();
})();
</script>
