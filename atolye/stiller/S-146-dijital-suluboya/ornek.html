<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-146 Dijital Suluboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas, svg { display: block; }
  #tuval { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // ---------------------------------------------------------------- ortak yardımcılar (bu örneğin içinde)
  const G = {};
  G.PI = Math.PI;
  G.kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.ara = (a, b, t) => a + (b - a) * t;
  G.yumusak = (a, b, x) => {
    let t = (x - a) / (b - a);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return t * t * (3 - 2 * t);
  };
  G.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  G.karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  G.css = (c, a) =>
    a == null
      ? `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`
      : `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  G.norm = (v) => {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  };
  G.nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  /** Ekran dışı tuval ve bağlamı. */
  G.tuval = (w, h) => {
    const c = SAHNE.yeniTuval(w, h);
    return [c, c.getContext('2d', { willReadFrequently: true })];
  };
  /** 2048 iç çözünürlüklü, 1024 koordinatlı ekran dışı katman. */
  G.katman = () => {
    const c = SAHNE.yeniTuval(2048, 2048);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    return [c, x];
  };
  G.yol = (d) => new Path2D(d);
  G.dikd = (x1, y1, x2, y2) => SAHNE.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Tohumlu Perlin gürültüsü: n(x,y) ≈ [-0.7, 0.7], fbm(x,y,oktav) ≈ [-0.5, 0.5]. */
  G.perlin = function (tohum) {
    const r = SAHNE.rng(tohum);
    const p = new Uint8Array(512);
    const perm = [];
    for (let i = 0; i < 256; i++) perm.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = perm[i];
      perm[i] = perm[j];
      perm[j] = t;
    }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const gx = new Float32Array(256);
    const gy = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const a = r() * Math.PI * 2;
      gx[i] = Math.cos(a);
      gy[i] = Math.sin(a);
    }
    function n(x, y) {
      const X = Math.floor(x);
      const Y = Math.floor(y);
      const xf = x - X;
      const yf = y - Y;
      const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
      const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
      const X0 = X & 255;
      const X1 = (X + 1) & 255;
      const Y0 = Y & 255;
      const Y1 = (Y + 1) & 255;
      const aa = p[p[X0] + Y0];
      const ba = p[p[X1] + Y0];
      const ab = p[p[X0] + Y1];
      const bb = p[p[X1] + Y1];
      const d1 = gx[aa] * xf + gy[aa] * yf;
      const d2 = gx[ba] * (xf - 1) + gy[ba] * yf;
      const d3 = gx[ab] * xf + gy[ab] * (yf - 1);
      const d4 = gx[bb] * (xf - 1) + gy[bb] * (yf - 1);
      const x1 = d1 + (d2 - d1) * u;
      const x2 = d3 + (d4 - d3) * u;
      return x1 + (x2 - x1) * v;
    }
    function fbm(x, y, o) {
      let s = 0;
      let a = 0.5;
      let f = 1;
      let t = 0;
      for (let i = 0; i < o; i++) {
        s += a * n(x * f + i * 17.3, y * f - i * 9.1);
        t += a;
        a *= 0.5;
        f *= 2.03;
      }
      return s / t;
    }
    return { n, fbm };
  };

  // ---------------------------------------------------------------- kubbe geometrisi (yükseklik → yarıçap, eğim)
  G.kubbe = (function () {
    const p = SAHNE.kubbeProfili(900);
    const ADIM = 8;
    const N = (555 - 300) * ADIM + 1;
    const R = new Float32Array(N);
    const D = new Float32Array(N);
    let j = p.length - 1;
    for (let i = 0; i < N; i++) {
      const y = 300 + i / ADIM;
      while (j > 1 && p[j - 1].y < y) j--;
      const a = p[j];
      const b = p[j - 1];
      const dy = b.y - a.y;
      const t = dy > 1e-6 ? G.kenet((y - a.y) / dy, 0, 1) : 0;
      R[i] = a.r + (b.r - a.r) * t;
      D[i] = dy > 1e-6 ? (b.r - a.r) / dy : 0;
    }
    const idx = (y) => G.kenet(Math.round((y - 300) * ADIM), 0, N - 1);
    return { r: (y) => R[idx(y)], s: (y) => D[idx(y)] };
  })();

  /**
   * Kubbeyi piksel piksel gölgeler. o.renk(g) → [r,g,b] (0–255), g: {X, Y, n:[x,y,z], u, phi, f, kaburga, oluk, h}
   * Kaburga: dilim sınırında yükselen yuvarlak sırt; oluk: sırtın dibindeki gölge payı; h: 0 taban → 1 tepe.
   */
  G.kubbeGolgele = function (ctx, o) {
    const s = o.olcek || 2;
    const x0 = 356;
    const x1 = 764;
    const y0 = 296;
    const y1 = 558;
    const W = Math.round((x1 - x0) * s);
    const H = Math.round((y1 - y0) * s);
    const [c, cx] = G.tuval(W, H);
    const im = cx.createImageData(W, H);
    const d = im.data;
    const DL = Math.PI / 16;
    const kg = o.kaburgaGen || 1.6;
    const og = o.olukGen || 3;
    const sis = o.siskinlik == null ? 0.5 : o.siskinlik;
    const g = { n: [0, 0, 1] };
    for (let j = 0; j < H; j++) {
      const Y = y0 + (j + 0.5) / s;
      if (Y < 299) continue;
      const Yc = Math.min(Y, 555);
      const r = G.kubbe.r(Yc);
      const sl = G.kubbe.s(Yc);
      const nr = 1 / Math.sqrt(1 + sl * sl);
      const ny = -sl * nr;
      for (let i = 0; i < W; i++) {
        const X = x0 + (i + 0.5) / s;
        const dx = X - 560;
        const kenar = r - Math.abs(dx);
        if (kenar < -1 / s) continue;
        let a = G.kenet(kenar * s + 0.5, 0, 1);
        if (Y < 300.5) a *= G.kenet((Y - 299.5) * s, 0, 1);
        const u = G.kenet(dx / Math.max(r, 0.001), -1, 1);
        const phi = Math.asin(u);
        const k = (phi + Math.PI / 2) / DL;
        const kk = Math.floor(k);
        const f = k - kk - 0.5;
        const dAng = (0.5 - Math.abs(f)) * DL;
        const px = dAng * r * Math.max(Math.cos(phi), 0.04);
        const bi = f > 0 ? kk + 1 : kk;
        let phin;
        let kab = 0;
        let oluk = 0;
        // tepeye yaklaşınca dilimler daralır: sırt genişliği de daralır
        const kgY = kg * G.kenet(r / 60, 0.35, 1);
        if (bi > 0 && bi < 16 && px < kgY) {
          const t = (f > 0 ? -px : px) / kgY;
          phin = -Math.PI / 2 + bi * DL + Math.asin(G.kenet(t, -1, 1)) * 1.15;
          kab = 1 - Math.abs(t);
        } else {
          phin = phi + sis * f * 2 * DL * 2.2;
          if (bi > 0 && bi < 16) oluk = Math.exp(-((px - kgY) * (px - kgY)) / (og * og));
        }
        g.X = X;
        g.Y = Y;
        g.n[0] = nr * Math.sin(phin);
        g.n[1] = ny;
        g.n[2] = nr * Math.cos(phin);
        g.u = u;
        g.phi = phi;
        g.f = f;
        g.kaburga = kab;
        g.oluk = oluk;
        g.h = (555 - Yc) / 255;
        g.r = r;
        const col = o.renk(g);
        const q = (j * W + i) * 4;
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * a;
      }
    }
    cx.putImageData(im, 0, 0);
    ctx.drawImage(c, x0, y0, x1 - x0, y1 - y0);
    return c;
  };

  /** Dikey eksenli silindir için yatay degrade: renk(n) → [r,g,b]; n = (sinφ, 0, cosφ) */
  G.silindirDegrade = function (ctx, x1, x2, renk, ek) {
    const gr = ctx.createLinearGradient(x1, 0, x2, 0);
    const N = 28;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const u = G.kenet(t * 2 - 1, -0.999, 0.999) * (ek == null ? 1 : ek);
      const phi = Math.asin(u);
      gr.addColorStop(t, G.css(renk([Math.sin(phi), 0, Math.cos(phi)], u)));
    }
    return gr;
  };

  /** Basit aydınlatma: taban rengi × (ortam + yayınık) + parlama. */
  G.aydinlat = function (taban, n, L, o) {
    const nl = G.nokta(n, L);
    const sar = o.sarma == null ? 0.25 : o.sarma;
    const dif = Math.max(0, (nl + sar) / (1 + sar));
    const gok = o.gok || [1, 1, 1];
    const isik = o.isik || [1, 1, 1];
    const ort = o.ortam == null ? 0.45 : o.ortam;
    const yuk = 0.5 - 0.5 * n[1];
    const k = o.yayinik == null ? 0.75 : o.yayinik;
    const out = [0, 0, 0];
    for (let i = 0; i < 3; i++) out[i] = taban[i] * (ort * (0.65 + 0.35 * yuk) * gok[i] + k * dif * isik[i]);
    if (o.parlama) {
      const H = G.norm([L[0], L[1], L[2] + 1]);
      const sp = Math.pow(Math.max(0, G.nokta(n, H)), o.us || 30) * o.parlama;
      for (let i = 0; i < 3; i++) out[i] += 255 * sp * isik[i];
    }
    return out;
  };

  /** Sahnenin mimari silueti (minare + kaide + kasnak + kubbe), maske için. */
  G.mimariSiluet = function (ctx, renk, minareDahil) {
    ctx.fillStyle = renk || '#000';
    const Y = SAHNE.yollar();
    if (minareDahil !== false) {
      for (const d of Y.minare) ctx.fill(G.yol(d));
      for (const d of Y.minareAlem) ctx.fill(G.yol(d));
    }
    ctx.fill(G.yol(Y.kaide));
    ctx.fill(G.yol(Y.kornis));
    ctx.fill(G.yol(Y.kasnakUst));
    ctx.fill(G.yol(Y.kasnakAlt));
    ctx.fill(G.yol(Y.kubbe));
    for (const d of Y.alem) ctx.fill(G.yol(d));
  };

  /**
   * Kemerli girinti (pencere): iç koyu, sol iç yanak ışıklı (ışık sağ üstten), üstte gölge.
   * o: {koyu, ic, yanak, kenar, yanakGen}
   */
  G.girinti = function (ctx, x, y, w, h, o) {
    const p = G.yol(SAHNE.kemerYolu(x, y, w, h));
    ctx.save();
    ctx.fillStyle = G.css(o.koyu);
    ctx.fill(p);
    ctx.clip(p);
    // iç yüz: aşağıya doğru biraz açılır
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, G.css(o.koyu));
    g.addColorStop(1, G.css(o.ic));
    ctx.fillStyle = g;
    ctx.fill(p);
    // ışıklı sol yanak
    const yg = (o.yanakGen || 0.22) * w;
    ctx.fillStyle = G.css(o.yanak, o.yanakA == null ? 0.9 : o.yanakA);
    ctx.beginPath();
    ctx.rect(x - w / 2 - 1, y + Math.min(h, w * 0.62) * 0.7, yg + 1, h);
    ctx.fill();
    // üst kemerin düşürdüğü gölge
    const g2 = ctx.createLinearGradient(0, y, 0, y + Math.min(h * 0.55, w * 1.1));
    g2.addColorStop(0, G.css(o.koyu, 0.9));
    g2.addColorStop(1, G.css(o.koyu, 0));
    ctx.fillStyle = g2;
    ctx.fill(p);
    ctx.restore();
    if (o.kenar) {
      ctx.save();
      ctx.strokeStyle = G.css(o.kenar, o.kenarA == null ? 0.7 : o.kenarA);
      ctx.lineWidth = o.kenarGen || 1;
      ctx.stroke(p);
      ctx.restore();
    }
  };

  /** Altın alem: küreler, çubuk, yaka, hilal; renk(n) ile metal gölgesi. */
  G.alem = function (ctx, a, renk, parilti) {
    const kure = (cx, cy, r) => {
      const g = ctx.createRadialGradient(cx + r * 0.35, cy - r * 0.4, r * 0.05, cx, cy, r * 1.02);
      const N = 10;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        g.addColorStop(t, G.css(renk(t)));
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    };
    const yatay = (x1, x2) => {
      const g = ctx.createLinearGradient(x1, 0, x2, 0);
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const u = t * 2 - 1;
        // sağa yakın parlak: yüzey normali ile ışık
        const v = G.kenet(0.5 - 0.5 * (Math.sin(Math.asin(G.kenet(u, -0.99, 0.99))) * 0.8 + 0.25), 0, 1);
        g.addColorStop(t, G.css(renk(v)));
      }
      return g;
    };
    // çubuk
    ctx.fillStyle = yatay(a.cubuk.x1, a.cubuk.x2);
    ctx.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1);
    // yaka
    ctx.save();
    ctx.fillStyle = yatay(a.yaka.cx - a.yaka.rx, a.yaka.cx + a.yaka.rx);
    ctx.beginPath();
    ctx.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    const gy = ctx.createLinearGradient(0, a.yaka.cy - a.yaka.ry, 0, a.yaka.cy + a.yaka.ry);
    gy.addColorStop(0, 'rgba(255,250,220,0.55)');
    gy.addColorStop(0.45, 'rgba(255,250,220,0)');
    gy.addColorStop(1, 'rgba(60,40,10,0.35)');
    ctx.fillStyle = gy;
    ctx.fill();
    ctx.restore();
    for (const k of a.kureler) kure(k.cx, k.cy, k.r);
    // hilal
    const h = a.hilal;
    ctx.fillStyle = yatay(h.cx - h.R, h.cx + h.R);
    ctx.fill(G.yol(SAHNE.hilalYolu(h.cx, h.cy, h.R)));
    if (parilti) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const k of a.kureler) {
        const g = ctx.createRadialGradient(k.cx + k.r * 0.35, k.cy - k.r * 0.4, 0, k.cx + k.r * 0.35, k.cy - k.r * 0.4, k.r * 0.5);
        g.addColorStop(0, `rgba(255,250,225,${0.75 * parilti})`);
        g.addColorStop(1, 'rgba(255,250,225,0)');
        ctx.fillStyle = g;
        ctx.fillRect(k.cx - k.r, k.cy - k.r, k.r * 2, k.r * 2);
      }
      ctx.restore();
    }
  };

  /** Bir tuvalin piksellerine işlem uygular (2048 iç çözünürlükte). */
  G.pikselIsle = function (tuval, fn) {
    const c = tuval.getContext('2d', { willReadFrequently: true });
    const im = c.getImageData(0, 0, tuval.width, tuval.height);
    fn(im.data, tuval.width, tuval.height);
    c.putImageData(im, 0, 0);
  };

  /**
   * Mimariyi (minare, kaide, kasnak) boyar; kubbe ayrıca G.kubbeGolgele ile.
   * P: {golge(taban, n) → rgb, tas, tasKoyu, yesil, pencereYesil{koyu,ic,yanak}, pencereTas{...}, altin(t) → rgb,
   *     zikzak, golgeRenk (cast shadow rgb), kenarCizgi (opsiyonel ince kontur rgb)}
   */
  G.mimariBoya = function (ctx, P) {
    const golge = P.golge;
    const tas = P.tas;
    const sil = (x1, x2, alb, ek) => G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, n), ek);
    const asagiBakan = (x1, x2, alb, egim) =>
      G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, G.norm([n[0] * Math.cos(egim), Math.sin(egim), n[2] * Math.cos(egim)])));
    const yukariBakan = (x1, x2, alb, egim) =>
      G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, G.norm([n[0] * Math.cos(egim), -Math.sin(egim), n[2] * Math.cos(egim)])));
    const parcalar = SAHNE.minareParcalari();
    const bul = (ad) => parcalar.find((p) => p.ad === ad);
    const kutu = (p) => {
      const xs = p.noktalar.map((q) => q[0]);
      const ys = p.noktalar.map((q) => q[1]);
      return { x1: Math.min(...xs), x2: Math.max(...xs), y1: Math.min(...ys), y2: Math.max(...ys) };
    };
    const golgeRenk = P.golgeRenk || [60, 70, 90];

    // ---- minare
    ctx.save();
    // gövdeler (korkuluk arkasına kadar uzatılmış)
    const govde = (ad, y1u, y2u) => {
      const b = kutu(bul(ad));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, y1u == null ? b.y1 : y1u, b.x2 - b.x1, (y2u == null ? b.y2 : y2u) - (y1u == null ? b.y1 : y1u));
      return b;
    };
    const gAlt = govde('gövde-alt');
    const gOrta = govde('gövde-orta', 316, 457);
    const gUst = govde('gövde-üst', 206, 291);
    // şerefelerin gövdeye düşürdüğü gölge (ışık sağ üstten → altında yumuşak gölge)
    const golgeBant = (x1, x2, y, boy, a) => {
      const g = ctx.createLinearGradient(0, y, 0, y + boy);
      g.addColorStop(0, G.css(golgeRenk, a));
      g.addColorStop(1, G.css(golgeRenk, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x1, y, x2 - x1, boy);
    };
    golgeBant(gAlt.x1, gAlt.x2, 488, 34, 0.32);
    golgeBant(gOrta.x1, gOrta.x2, 316, 26, 0.3);
    golgeBant(gUst.x1, gUst.x2, 206, 16, 0.28);
    // korkuluk arkası: balkon gölgesi
    golgeBant(gOrta.x1, gOrta.x2, 436, 20, 0.0);
    ctx.fillStyle = G.css(golgeRenk, 0.22);
    ctx.fillRect(gOrta.x1, 436, gOrta.x2 - gOrta.x1, 20);
    ctx.fillRect(gUst.x1, 272, gUst.x2 - gUst.x1, 18);

    // zikzak bant: oyma çizgiler (koyu oluk + altında ışık)
    if (P.zikzak !== false) {
      ctx.lineJoin = 'miter';
      for (const z of SAHNE.zikzakCizgileri()) {
        const d = G.yol(SAHNE.yol(z));
        ctx.save();
        ctx.translate(0.6, 1.1);
        ctx.strokeStyle = G.css(P.zikzakIsik || [255, 255, 255], 0.55);
        ctx.lineWidth = 2.2;
        ctx.stroke(d);
        ctx.restore();
        ctx.strokeStyle = G.css(P.zikzakRenk || P.tasKoyu, 0.85);
        ctx.lineWidth = 2.4;
        ctx.stroke(d);
      }
      // zikzak bandına silindir gölgesi (kenarlarda koyulaşma)
      ctx.fillStyle = sil(gAlt.x1, gAlt.x2, [255, 255, 255]);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.0;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // çıkmalar (aşağı bakan, gölgede) + küçük mukarnas yivleri
    for (const ad of ['çıkma-1', 'çıkma-2']) {
      const p = bul(ad);
      const b = kutu(p);
      ctx.fillStyle = asagiBakan(b.x1, b.x2, tas, 0.85);
      ctx.fill(G.yol(SAHNE.yol(p.noktalar, true)));
      ctx.save();
      ctx.clip(G.yol(SAHNE.yol(p.noktalar, true)));
      const adet = ad === 'çıkma-1' ? 9 : 7;
      const cx = 300;
      const Rb = (b.x2 - b.x1) / 2;
      for (let i = 0; i < adet; i++) {
        const u = -1 + (2 * (i + 0.5)) / adet;
        const x = cx + u * Rb * 0.92;
        const w = ((b.x2 - b.x1) / adet) * 0.42 * Math.sqrt(1 - u * u * 0.7);
        ctx.fillStyle = G.css(golgeRenk, 0.22);
        ctx.fill(G.yol(SAHNE.kemerYolu(x, b.y1 + 2, w, (b.y2 - b.y1) * 0.8)));
      }
      ctx.restore();
    }
    // şerefe döşemeleri
    for (const ad of ['şerefe-1', 'şerefe-2']) {
      const b = kutu(bul(ad));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
      ctx.fillStyle = G.css(P.isikRenk || [255, 252, 240], 0.55);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, 1.4);
      ctx.fillStyle = G.css(golgeRenk, 0.3);
      ctx.fillRect(b.x1, b.y2 - 2, b.x2 - b.x1, 2);
    }
    // korkuluklar: tırabzan babaları arası açık (arkası gövde ya da gök)
    for (const ad of ['korkuluk-1', 'korkuluk-2']) {
      const p = bul(ad);
      const R = (p.x2 - p.x1) / 2;
      const cx = (p.x1 + p.x2) / 2;
      const ray = 3.2;
      ctx.fillStyle = sil(p.x1, p.x2, tas);
      ctx.fillRect(p.x1, p.y1, p.x2 - p.x1, ray);
      ctx.fillRect(p.x1, p.y2 - ray, p.x2 - p.x1, ray);
      ctx.fillStyle = G.css(P.isikRenk || [255, 252, 240], 0.6);
      ctx.fillRect(p.x1, p.y1, p.x2 - p.x1, 1);
      const adet = ad === 'korkuluk-1' ? 13 : 11;
      for (let i = 0; i < adet; i++) {
        const u = -1 + (2 * (i + 0.5)) / adet;
        const phi = Math.asin(u * 0.96);
        const x = cx + Math.sin(phi) * R * 0.96;
        const w = 3.6 * Math.max(0.45, Math.cos(phi));
        ctx.fillStyle = sil(x - w / 2, x + w / 2, tas, 0.9);
        ctx.fillRect(x - w / 2, p.y1 + ray, w, p.y2 - p.y1 - 2 * ray);
        // babanın sağ tarafı daha aydınlık; tümüne silindir konumuna göre ton
        const n = [Math.sin(phi), 0, Math.cos(phi)];
        const t = golge(tas, n);
        ctx.fillStyle = G.css(t, 0.45);
        ctx.fillRect(x - w / 2, p.y1 + ray, w, p.y2 - p.y1 - 2 * ray);
      }
    }
    // bilezik
    {
      const b = kutu(bul('bilezik'));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
      ctx.fillStyle = G.css(golgeRenk, 0.25);
      ctx.fillRect(b.x1, b.y2 - 1.5, b.x2 - b.x1, 1.5);
    }
    // topuz (soğan): yatay silindir tonu + üstten gök ışığı
    {
      const p = bul('topuz');
      const d = G.yol(p.yol);
      ctx.fillStyle = sil(266, 334, tas);
      ctx.fill(d);
      ctx.save();
      ctx.clip(d);
      const g = ctx.createRadialGradient(312, 160, 2, 300, 178, 36);
      g.addColorStop(0, G.css(P.isikRenk || [255, 252, 240], 0.55));
      g.addColorStop(1, G.css(P.isikRenk || [255, 252, 240], 0));
      ctx.fillStyle = g;
      ctx.fillRect(260, 140, 80, 62);
      const g2 = ctx.createLinearGradient(0, 184, 0, 200);
      g2.addColorStop(0, G.css(golgeRenk, 0));
      g2.addColorStop(1, G.css(golgeRenk, 0.25));
      ctx.fillStyle = g2;
      ctx.fillRect(260, 184, 80, 16);
      ctx.restore();
    }
    // minare pencereleri
    for (const w of SAHNE.minarePencereleri) G.girinti(ctx, w.x, w.y, w.w, w.h, P.pencereTas);
    // minare alemi
    G.alem(ctx, bul('alem').alem, P.altin, P.alemParilti);
    ctx.restore();

    // ---- kaide
    const K = SAHNE.kaide;
    const duzDuvar = (x1, x2, alb) => G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, n), 0.38);
    ctx.fillStyle = duzDuvar(K.x1, K.x2, tas);
    ctx.fillRect(K.x1, K.y1, K.x2 - K.x1, K.y2 - K.y1);
    // zemine yakın ortam gölgesi
    {
      const g = ctx.createLinearGradient(0, K.y2 - 22, 0, K.y2);
      g.addColorStop(0, G.css(golgeRenk, 0));
      g.addColorStop(1, G.css(golgeRenk, 0.18));
      ctx.fillStyle = g;
      ctx.fillRect(K.x1, K.y2 - 22, K.x2 - K.x1, 22);
    }
    // korniş altı gölge
    golgeBant(K.x1, K.x2, K.y1, 16, 0.3);
    // korniş: üst yüz parlak, ön yüz, alt kenar koyu
    {
      const k = K.kornis;
      ctx.fillStyle = duzDuvar(k.x1, k.x2, tas);
      ctx.fillRect(k.x1, k.y1, k.x2 - k.x1, k.y2 - k.y1);
      ctx.fillStyle = yukariBakan(k.x1, k.x2, tas, 1.0);
      ctx.fillRect(k.x1, k.y1, k.x2 - k.x1, 3);
      ctx.fillStyle = G.css(golgeRenk, 0.28);
      ctx.fillRect(k.x1, k.y2 - 2, k.x2 - k.x1, 2);
      // korniş uçları
      ctx.fillStyle = G.css(golgeRenk, 0.15);
      ctx.fillRect(k.x1, k.y1, 2, k.y2 - k.y1);
    }
    for (const w of K.pencereler) {
      // taş söve
      ctx.save();
      ctx.strokeStyle = G.css(golge(tas, G.norm([0.15, -0.2, 1])), 0.9);
      ctx.lineWidth = 5;
      ctx.stroke(G.yol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h)));
      ctx.restore();
      G.girinti(ctx, w.x, w.y, w.w, w.h, P.pencereTas);
      // denizlik
      ctx.fillStyle = yukariBakan(w.x - w.w / 2 - 5, w.x + w.w / 2 + 5, tas, 0.6);
      ctx.fillRect(w.x - w.w / 2 - 5, w.y + w.h - 1, w.w + 10, 4);
      ctx.fillStyle = G.css(golgeRenk, 0.25);
      ctx.fillRect(w.x - w.w / 2 - 4, w.y + w.h + 3, w.w + 8, 3);
    }

    // ---- kasnak (alt kat, sonra üst kat)
    for (let kat = 1; kat >= 0; kat--) {
      const q = SAHNE.kasnak[kat];
      ctx.fillStyle = sil(q.x1, q.x2, P.yesil);
      ctx.fillRect(q.x1, q.y1, q.x2 - q.x1, q.y2 - q.y1);
      // üst kenar ışık şeridi (silme), alt kenar gölge
      ctx.fillStyle = yukariBakan(q.x1, q.x2, P.yesil, 1.1);
      ctx.fillRect(q.x1, q.y1, q.x2 - q.x1, 3.5);
      ctx.fillStyle = G.css(P.yesilKoyu || [10, 50, 25], 0.35);
      ctx.fillRect(q.x1, q.y1 + 3.5, q.x2 - q.x1, 1.4);
      const g = ctx.createLinearGradient(0, q.y2 - 8, 0, q.y2);
      g.addColorStop(0, G.css(P.yesilKoyu || [10, 50, 25], 0));
      g.addColorStop(1, G.css(P.yesilKoyu || [10, 50, 25], 0.35));
      ctx.fillStyle = g;
      ctx.fillRect(q.x1, q.y2 - 8, q.x2 - q.x1, 8);
      for (const w of SAHNE.kasnakPencereleri(kat)) {
        const pw = Object.assign({}, P.pencereYesil);
        pw.yanakGen = 0.18 + 0.2 * Math.max(0, -Math.sin(w.aci));
        G.girinti(ctx, w.x, w.y, w.w, w.h, pw);
      }
    }
  };

  /**
   * Hacimli bulut katmanı: puflardan yoğunluk alanı, ışığa doğru örneklenmiş örtme → aydınlık.
   * puflar: [{x,y,r,a}] (1024 koordinat). o: {x0,y0,w,h, olcek, gur (perlin), gurAmp, gurFrek, isik, golge, alt,
   *   kenar:[a,b], emilim, adimlar, adimBoy, tabanY (opsiyonel: bulut tabanı düz kesilir), parlakKenar}
   */
  G.bulut = function (puflar, o) {
    const s = o.olcek || 1;
    const W = Math.ceil(o.w * s);
    const H = Math.ceil(o.h * s);
    const [c, cx] = G.tuval(W, H);
    cx.setTransform(s, 0, 0, s, -o.x0 * s, -o.y0 * s);
    cx.globalCompositeOperation = 'lighter';
    for (const p of puflar) {
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      const a = p.a == null ? 0.5 : p.a;
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(0.55, `rgba(255,255,255,${a * 0.75})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = g;
      cx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    const im = cx.getImageData(0, 0, W, H);
    const d = im.data;
    const D = new Float32Array(W * H);
    const gur = o.gur;
    const ga = o.gurAmp || 0;
    const gf = o.gurFrek || 0.02;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        let v = d[k * 4] / 255;
        if (ga && v > 0.01) {
          const X = o.x0 + i / s;
          const Y = o.y0 + j / s;
          const ic = o.icKoru ? 1 - G.yumusak(o.icKoru[0], o.icKoru[1], v) : 1;
          v += ga * gur.fbm(X * gf, Y * gf, o.oktav || 4) * Math.min(1, v * 3) * ic;
        }
        if (o.tabanY != null) {
          const Y = o.y0 + j / s;
          const tb = typeof o.tabanY === 'function' ? o.tabanY(o.x0 + i / s) : o.tabanY;
          v *= G.yumusak(tb + (o.tabanYum || 6), tb - (o.tabanYum || 6), Y);
        }
        D[k] = v;
      }
    }
    let N1 = null;
    let N2 = null;
    if (o.normalMod) {
      N1 = G.bulanik(D, W, H, Math.max(1, Math.round((o.r1 || 5) * s)));
      N2 = G.bulanik(D, W, H, Math.max(1, Math.round((o.r2 || 16) * s)));
    }
    const L3 = G.norm(o.isik3 || [0.62, -0.62, 0.48]);
    const Lx = o.isikYon ? o.isikYon[0] : 0.7;
    const Ly = o.isikYon ? o.isikYon[1] : -0.7;
    const adim = o.adimlar || 6;
    const boy = (o.adimBoy || 6) * s;
    const em = o.emilim || 1.2;
    const k0 = o.kenar ? o.kenar[0] : 0.15;
    const k1 = o.kenar ? o.kenar[1] : 0.45;
    const IS = o.isik;
    const GO = o.golge;
    const AL = o.alt || o.golge;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        const v = D[k];
        const q = k * 4;
        if (v <= k0) {
          d[q + 3] = 0;
          continue;
        }
        let oc = 0;
        for (let t = 1; t <= adim; t++) {
          const xi = Math.round(i + Lx * boy * t);
          const yi = Math.round(j + Ly * boy * t);
          if (xi < 0 || yi < 0 || xi >= W || yi >= H) continue;
          oc += D[yi * W + xi];
        }
        let ay = Math.exp(-oc * em / adim * 2.2);
        if (N1) {
          const il = Math.max(1, Math.min(W - 2, i));
          const jl = Math.max(1, Math.min(H - 2, j));
          const k1 = jl * W + il;
          const g1x = N1[k1 + 1] - N1[k1 - 1];
          const g1y = N1[k1 + W] - N1[k1 - W];
          const g2x = N2[k1 + 1] - N2[k1 - 1];
          const g2y = N2[k1 + W] - N2[k1 - W];
          const sk = (o.normalGuc || 14) * s;
          const nx = -(g1x * 0.6 + g2x * 1.4) * sk;
          const ny = -(g1y * 0.6 + g2y * 1.4) * sk;
          const nl = Math.hypot(nx, ny, 1);
          const ndl = (nx * L3[0] + ny * L3[1] + L3[2]) / nl;
          const lam = G.kenet(0.5 + 0.62 * ndl, 0, 1);
          ay = lam * (1 - (o.ortulme || 0.35)) + ay * (o.ortulme || 0.35);
        }
        if (o.dikey) {
          const Yd = o.y0 + j / s;
          ay *= 1 - o.dikey[2] * G.yumusak(o.dikey[0], o.dikey[1], Yd);
        }
        if (o.bant) ay = o.bant(ay);
        // alt kısım: aşağıdan bakan, gölgeli taban
        let alt = 0;
        const yi2 = Math.min(H - 1, j + Math.round(8 * s));
        alt = G.kenet((v - D[yi2 * W + i]) * 1.6, 0, 1);
        let col = G.karis(GO, IS, ay);
        col = G.karis(col, AL, alt * (o.altGuc == null ? 0.5 : o.altGuc) * (1 - ay));
        if (o.parlakKenar) {
          const e = 1 - G.yumusak(k0, k1 + 0.15, v);
          col = G.karis(col, o.parlakKenar, e * ay * 0.8);
        }
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * G.yumusak(k0, k1, v) * (o.opaklik == null ? 1 : o.opaklik);
      }
    }
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.globalCompositeOperation = 'source-over';
    cx.putImageData(im, 0, 0);
    return c;
  };

  /** Float32 alanı için ayrılabilir kutu bulanıklığı (iki geçiş ≈ Gauss). */
  G.bulanik = function (A, W, H, r) {
    let a = Float32Array.from(A);
    let b = new Float32Array(W * H);
    for (let gec = 0; gec < 2; gec++) {
      for (let j = 0; j < H; j++) {
        let t = 0;
        const o = j * W;
        for (let i = -r; i <= r; i++) t += a[o + G.kenet(i, 0, W - 1)];
        for (let i = 0; i < W; i++) {
          b[o + i] = t / (2 * r + 1);
          t += a[o + Math.min(W - 1, i + r + 1)] - a[o + Math.max(0, i - r)];
        }
      }
      for (let i = 0; i < W; i++) {
        let t = 0;
        for (let j = -r; j <= r; j++) t += b[G.kenet(j, 0, H - 1) * W + i];
        for (let j = 0; j < H; j++) {
          a[j * W + i] = t / (2 * r + 1);
          t += b[Math.min(H - 1, j + r + 1) * W + i] - b[Math.max(0, j - r) * W + i];
        }
      }
    }
    return a;
  };

  /** Bir kümelenmiş bulut için puf listesi üretir (düz tabanlı kümülüs). */
  G.kumulus = function (rr, cx, cy, gen, yuk, adet, rMin, rMax) {
    const out = [];
    for (let i = 0; i < adet; i++) {
      const t = rr();
      const x = cx + (t - 0.5) * gen;
      // ortada daha yüksek
      const h = Math.cos((t - 0.5) * Math.PI) * yuk;
      const y = cy - rr() * h;
      const r = rMin + (rMax - rMin) * rr() * (0.6 + 0.4 * Math.cos((t - 0.5) * Math.PI));
      out.push({ x, y, r, a: 0.42 + rr() * 0.2 });
    }
    return out;
  };

  /**
   * Yükseklik alanlı kümülüs: her puf bir yarım küre (yükseklik = z + r·√(1−t²)), alan pufların en yükseğidir;
   * yüzey normali bu alandan, ışık sağ üst-önden. Loblar arasındaki kıvrımlar kendiliğinden gölgelenir.
   * o: {x0,y0,w,h,olcek, L3, renk(ay, ao, yer) → [r,g,b], tabanY, tabanYum, gur, gurAmp, gurFrek, yumusat}
   */
  G.bulutH = function (puflar, o) {
    const s = o.olcek || 1;
    const W = Math.ceil(o.w * s);
    const H = Math.ceil(o.h * s);
    const Hf = new Float32Array(W * H).fill(-1);
    for (const p of puflar) {
      const z = p.z || 0;
      const xa = Math.max(0, Math.floor((p.x - p.r - o.x0) * s));
      const xb = Math.min(W - 1, Math.ceil((p.x + p.r - o.x0) * s));
      const ya = Math.max(0, Math.floor((p.y - p.r - o.y0) * s));
      const yb = Math.min(H - 1, Math.ceil((p.y + p.r - o.y0) * s));
      const rr = p.r * s;
      const cx = (p.x - o.x0) * s;
      const cy = (p.y - o.y0) * s;
      for (let j = ya; j <= yb; j++) {
        for (let i = xa; i <= xb; i++) {
          const dx = i + 0.5 - cx;
          const dy = j + 0.5 - cy;
          const t2 = (dx * dx + dy * dy) / (rr * rr);
          if (t2 >= 1) continue;
          const h = z * s + rr * Math.sqrt(1 - t2);
          const k = j * W + i;
          if (h > Hf[k]) Hf[k] = h;
        }
      }
    }
    // kapsama (alfa) ve gürültüyle kenar ayrıntısı
    const A = new Float32Array(W * H);
    const gur = o.gur;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        if (Hf[k] < 0) {
          Hf[k] = 0;
          continue;
        }
        A[k] = 1;
        if (gur && o.gurAmp) Hf[k] += o.gurAmp * s * gur.fbm((o.x0 + i / s) * o.gurFrek, (o.y0 + j / s) * o.gurFrek, 4);
      }
    }
    const Hs = G.bulanik(Hf, W, H, Math.max(1, Math.round((o.yumusat || 2) * s)));
    const Hb = G.bulanik(Hf, W, H, Math.max(2, Math.round((o.genis || 22) * s)));
    const Ab = G.bulanik(A, W, H, Math.max(1, Math.round(0.8 * s)));
    const [c, cx] = G.tuval(W, H);
    const im = cx.createImageData(W, H);
    const d = im.data;
    const L3 = G.norm(o.L3 || [0.55, -0.6, 0.58]);
    for (let j = 1; j < H - 1; j++) {
      for (let i = 1; i < W - 1; i++) {
        const k = j * W + i;
        let a = Ab[k];
        if (o.tabanY != null) {
          const Y = o.y0 + j / s;
          a *= G.yumusak(o.tabanY + (o.tabanYum || 4), o.tabanY - (o.tabanYum || 4), Y);
        }
        if (a <= 0.003) continue;
        const gx = (Hs[k + 1] - Hs[k - 1]) * 0.5;
        const gy = (Hs[k + W] - Hs[k - W]) * 0.5;
        const nl = Math.hypot(gx, gy, 1);
        const ndl = (-gx * L3[0] - gy * L3[1] + L3[2]) / nl;
        const ao = G.kenet((Hb[k] - Hs[k]) / (o.aoOlcek || 18) / s, 0, 1);
        const yer = { x: o.x0 + i / s, y: o.y0 + j / s, h: Hs[k] / s };
        const col = o.renk(ndl, ao, yer);
        const q = k * 4;
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * a;
      }
    }
    cx.putImageData(im, 0, 0);
    return c;
  };

</script>
<script>
  // S-146 Dijital Suluboya — kontrollü dijital suluboya illüstrasyonu: dokulu kâğıt üzerinde saydam, temiz lavi katmanları,
  // kenarda hafif pigment birikimi, gökte granülasyon dokusu; kaburgalı zarif kubbe; önde şakayık, gül ve okaliptüs.
  // Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, 2);
  const PN = G.perlin(1461);
  const PA = G.perlin(1462);
  const PK = G.perlin(1463);
  const L = G.norm([0.55, -0.6, 0.6]);
  const N = 1024;

  // ---------------------------------------------------------------- kâğıt (soğuk preslenmiş, ince lifli)
  const KAGIT = new Float32Array(N * N);
  {
    const rg = SAHNE.rng(46);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const v = 0.5 + PA.fbm(x / 7, y / 7, 3) * 0.85 + PA.fbm(x / 26 + 9, y / 26, 2) * 0.35 + (rg() - 0.5) * 0.05;
        KAGIT[y * N + x] = G.kenet(v, 0, 1);
      }
    }
  }
  ctx.fillStyle = '#FBF8F1';
  ctx.fillRect(0, 0, N, N);

  // ---------------------------------------------------------------- saklama maskeleri (beyaz bırakılan yerler)
  const REZ_CICEK = new Float32Array(N * N);
  const REZ_BINA = new Float32Array(N * N);
  function maskeyeCiz(M, ciz, kutu, birlesim) {
    const x0 = Math.max(0, Math.floor(kutu[0]));
    const y0 = Math.max(0, Math.floor(kutu[1]));
    const x1 = Math.min(N, Math.ceil(kutu[2]));
    const y1 = Math.min(N, Math.ceil(kutu[3]));
    const W = x1 - x0;
    const H = y1 - y0;
    if (W <= 0 || H <= 0) return;
    const [c, cx] = G.tuval(W, H);
    cx.translate(-x0, -y0);
    cx.fillStyle = '#fff';
    cx.strokeStyle = '#fff';
    ciz(cx);
    const d = cx.getImageData(0, 0, W, H).data;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const v = d[(j * W + i) * 4 + 3] / 255;
        const k = (y0 + j) * N + x0 + i;
        if (v > M[k]) M[k] = v;
      }
    }
  }

  /**
   * Bir lavi (yıkama) katmanı: biçim maskesi → kenar yumuşatma ve gürültüyle titreşen kenar → kenarda pigment birikimi,
   * kâğıt çukurlarında granülasyon, akış lekesiz renk dalgalanması → 'multiply' ile saydam sırlama.
   * o: {ciz(cx), kutu:[x0,y0,x1,y1], renk:[r,g,b] | fn(X,Y), op, yumusak, esik, kenarGur, kenarR, kenarKoyu, gran, akis, yog(X,Y), rez:[maskeler], islak}
   */
  function yika(o) {
    const pad = Math.ceil((o.yumusak || 1.5) * 3 + (o.kenarR || 4) * 2 + 6);
    const x0 = Math.max(0, Math.floor(o.kutu[0] - pad));
    const y0 = Math.max(0, Math.floor(o.kutu[1] - pad));
    const x1 = Math.min(N, Math.ceil(o.kutu[2] + pad));
    const y1 = Math.min(N, Math.ceil(o.kutu[3] + pad));
    const W = x1 - x0;
    const H = y1 - y0;
    if (W <= 2 || H <= 2) return;
    const [c, cx] = G.tuval(W, H);
    cx.translate(-x0, -y0);
    cx.fillStyle = '#fff';
    cx.strokeStyle = '#fff';
    cx.lineCap = 'round';
    cx.lineJoin = 'round';
    o.ciz(cx);
    const src = cx.getImageData(0, 0, W, H).data;
    const M = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) M[i] = src[i * 4 + 3] / 255;
    const yr = Math.max(1, Math.round(o.yumusak || 1.5));
    const Mb = G.bulanik(M, W, H, yr);
    const ins = new Float32Array(W * H);
    const kg = o.kenarGur == null ? 0.18 : o.kenarGur;
    const es = o.esik == null ? 0.16 : o.esik;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        let v = Mb[k];
        if (o.islak) {
          ins[k] = v;
          continue;
        }
        if (v < 0.01) continue;
        if (v < 0.99 && kg) v += kg * PK.fbm((x0 + i) * 0.045, (y0 + j) * 0.045, 3);
        ins[k] = G.yumusak(0.5 - es, 0.5 + es, v);
      }
    }
    const Eb = G.bulanik(ins, W, H, Math.max(1, Math.round(o.kenarR || 4)));
    const im = cx.createImageData(W, H);
    const d = im.data;
    const op = o.op == null ? 0.6 : o.op;
    const kk = o.kenarKoyu == null ? 0.6 : o.kenarKoyu;
    const gr = o.gran == null ? 0.35 : o.gran;
    const ak = o.akis == null ? 0.15 : o.akis;
    const fr = typeof o.renk === 'function';
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        const a = ins[k];
        if (a < 0.004) continue;
        const X = x0 + i;
        const Y = y0 + j;
        const gk = Y * N + X;
        const e = Math.max(0, a - Eb[k]);
        let dd = op * a * (1 + kk * e * 2.4);
        dd *= 1 + gr * (0.5 - KAGIT[gk]) * 1.8;
        if (ak) dd *= 1 + ak * PN.fbm(X * (o.akisFrek || 0.011), Y * (o.akisFrek || 0.011), 3) * 2.2;
        if (o.yog) dd *= o.yog(X, Y);
        if (o.rez) for (const R of o.rez) dd *= 1 - R[gk];
        if (dd <= 0) continue;
        const col = fr ? o.renk(X, Y) : o.renk;
        const q = k * 4;
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * G.kenet(dd, 0, 1);
      }
    }
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.putImageData(im, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(c, x0, y0, W, H);
    ctx.restore();
  }
  const kutuYol = (pts, m) => {
    let a = 1e9;
    let b = 1e9;
    let cc = -1e9;
    let dd = -1e9;
    for (const [x, y] of pts) {
      a = Math.min(a, x);
      b = Math.min(b, y);
      cc = Math.max(cc, x);
      dd = Math.max(dd, y);
    }
    m = m || 0;
    return [a - m, b - m, cc + m, dd + m];
  };

  // ---------------------------------------------------------------- 1. çiçekler (önden arkaya; her biri arkasındakileri saklar)
  const B = SAHNE.bitki;
  const rr = SAHNE.rng(146);
  const RENK = {
    beyaz: { yap: [244, 216, 210], koyu: [228, 164, 172], orta: [240, 206, 138] },
    allik: { yap: [244, 172, 178], koyu: [222, 100, 126], orta: [236, 178, 112] },
    seftali: { yap: [250, 188, 152], koyu: [232, 124, 100], orta: [238, 182, 96] },
  };
  function tacYol(R, a, w, dalga, rrr, u0) {
    // yuvarlak, dalgalı uçlu taç yaprağı; yerel eksende merkezden dışa (u0: kökün merkeze uzaklığı)
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const p = (u, v) => [u * ca - v * sa, u * sa + v * ca];
    const pts = [p(u0, 0)];
    const n = 22;
    const lob = 3 + Math.floor(rrr() * 2);
    const faz = rrr() * 6;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const ang = -Math.PI / 2 + t * Math.PI;
      const dl = 1 + dalga * (0.5 * Math.sin(t * Math.PI * lob + faz) - 0.25) * Math.cos(ang) ;
      const u = u0 + (R - u0) * (0.5 + 0.5 * Math.cos(ang)) * dl;
      const v = w * Math.sin(ang) * (0.75 + 0.25 * Math.cos(ang));
      pts.push(p(u, v));
    }
    return pts;
  }
  function egriYol(cx, pts) {
    cx.beginPath();
    cx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      cx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    cx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    cx.closePath();
  }
  // Halkalar önden arkaya boyanır; her halka bitince yerel saklama maskesine yazılır, arkadaki halka onun altından
  // geçer gibi yalnız dışında kalır. Böylece taç yaprakları çamurlaşmadan, net pigment kenarlarıyla katmanlanır.
  const HALKALAR = {
    sakayik: [
      { n: 6, R: 0.8, w: 0.56, op: 0.34, dl: 0.16, ton: 0.55 },
      { n: 7, R: 1.0, w: 0.6, op: 0.27, dl: 0.24, ton: 0.15 },
    ],
    gul: [
      { n: 5, R: 0.78, w: 0.6, op: 0.36, dl: 0.06, ton: 0.55 },
      { n: 6, R: 1.0, w: 0.62, op: 0.28, dl: 0.08, ton: 0.15 },
    ],
  };
  const REZ_YEREL = new Float32Array(N * N);
  function cicekSu(c, tur, tip) {
    const R = c.r * (tip === 'sakayik' ? 1.32 : 1.18);
    const P = RENK[tur];
    const sq = 0.82 + rr() * 0.12;
    const ea = (rr() - 0.5) * 0.7;
    const cE = Math.cos(ea);
    const sE = Math.sin(ea);
    const kutuC = [c.x - R * 1.35, c.y - R * 1.35, c.x + R * 1.35, c.y + R * 1.35];
    // çiçek düzleminden ekrana: hafif yan bakış (basık elips)
    const T = ([u, v]) => {
      const x = u * cE + v * sE;
      const y = (-u * sE + v * cE) * sq;
      return [c.x + x * cE - y * sE, c.y - R * 0.04 + x * sE + y * cE];
    };
    const REZ = [REZ_CICEK, REZ_YEREL];
    const yerelSakla = (sekiller) =>
      maskeyeCiz(REZ_YEREL, (cx) => {
        for (const pts of sekiller) {
          egriYol(cx, pts);
          cx.fill();
        }
      }, kutuC);
    // ılık göbek (ıslak içine ıslak): önce, bütün taç yapraklarının altına
    yika({
      ciz: (cx) => {
        cx.beginPath();
        cx.ellipse(c.x, c.y - R * 0.06, R * 0.2, R * 0.2 * sq, 0, 0, Math.PI * 2);
        cx.fill();
      },
      kutu: [c.x - R * 0.35, c.y - R * 0.35, c.x + R * 0.35, c.y + R * 0.35], renk: P.orta, op: 0.55, yumusak: 4, islak: true, kenarKoyu: 0, gran: 0.3, rez: [REZ_CICEK],
    });
    // 1) orta çanak, önde: kâse biçimli (gülümseme) taç yaprakları — ışık alan, açık
    const cy0 = -R * 0.05;
    const kase = tip === 'sakayik' ? { arka: 4, on: 3, gen: 0.8, boy: 0.5 } : { arka: 3, on: 2, gen: 0.64, boy: 0.42 };
    const onSekil = [];
    for (let i = 0; i < kase.on; i++) {
      const t = i / Math.max(1, kase.on - 1);
      const w = R * kase.gen * (1 - t * 0.45);
      const yy = cy0 + R * (0.34 - t * 0.26);
      const h = R * (0.3 - t * 0.12);
      const kal = h * 0.55;
      const xo = (rr() - 0.5) * R * 0.3;
      const don = (rr() - 0.5) * 0.5;
      const loc = [];
      for (let k = 0; k <= 16; k++) {
        const u = k / 16;
        loc.push([xo - w / 2 + w * u, yy - h * 0.6 + h * Math.sin(Math.PI * u) * 1.0]);
      }
      for (let k = 16; k >= 0; k--) {
        const u = k / 16;
        loc.push([xo - w / 2 + w * u, yy - h * 0.6 + (h - kal) * Math.sin(Math.PI * u) - h * 0.12 * Math.sin(Math.PI * u * 3) * (rr() * 0.3)]);
      }
      const cd = Math.cos(don);
      const sd = Math.sin(don);
      const pts = loc.map(([u, v]) => T([xo + (u - xo) * cd - (v - yy) * sd, yy + (u - xo) * sd + (v - yy) * cd]));
      yika({
        ciz: (cx) => {
          cx.beginPath();
          pts.forEach(([x, y], k) => (k ? cx.lineTo(x, y) : cx.moveTo(x, y)));
          cx.closePath();
          cx.fill();
        },
        kutu: kutuYol(pts), renk: G.karis(P.yap, P.koyu, 0.3 + t * 0.3), op: tur === 'beyaz' ? 0.3 + t * 0.08 : 0.4 + t * 0.1, yumusak: 1.1, esik: 0.2, kenarR: 2.5, kenarKoyu: 1.1, gran: 0.2, akis: 0.1,
        yog: (X, Y) => 0.45 + 0.8 * G.kenet((Y - c.y) / (R * 0.4) + 0.5, 0, 1),
        rez: REZ,
      });
      onSekil.push(pts);
      yerelSakla([pts]);
    }
    // 2) çanağın arkasında yukarı bakan iç yapraklar: içi gölgede, derin renk
    const arkaSekil = [];
    for (let i = 0; i < kase.arka; i++) {
      const a = -Math.PI / 2 + ((i + 0.5) / kase.arka - 0.5) * 2.2 + (rr() - 0.5) * 0.35;
      const Ri = R * kase.boy * (0.8 + rr() * 0.35);
      const pts = tacYol(Ri, a, Ri * (0.8 + rr() * 0.2), 0.28, rr, 0).map(([u, v]) => T([u, v + cy0]));
      arkaSekil.push(pts);
      yika({
        ciz: (cx) => {
          egriYol(cx, pts);
          cx.fill();
        },
        kutu: kutuYol(pts), renk: G.karis(P.yap, P.koyu, 0.7), op: tur === 'beyaz' ? 0.36 : 0.5, yumusak: 1.1, esik: 0.2, kenarR: 3, kenarKoyu: 1.2, gran: 0.2, akis: 0.1,
        yog: (X, Y) => 0.4 + 0.9 * G.kenet((Y - (c.y - R * 0.5)) / (R * 0.5), 0, 1), rez: REZ,
      });
    }
    yerelSakla(arkaSekil);
    // 3) iç ve dış halka: önce iç, sonra arkadaki dış halka
    const dis = [];
    HALKALAR[tip].forEach((h, hi) => {
      const ofs = hi * 0.47 + rr() * 0.3;
      const sekiller = [];
      for (let i = 0; i < h.n; i++) {
        const a = c.aci + ofs + (i / h.n) * Math.PI * 2 + (rr() - 0.5) * 0.25;
        const Ri = R * h.R * (0.9 + rr() * 0.18);
        const pts = tacYol(Ri, a, Ri * h.w, h.dl, rr, Ri * 0.18).map(T);
        sekiller.push(pts);
        if (hi === HALKALAR[tip].length - 1) dis.push(pts);
        // ışığa bakan (sağ üst) yapraklar daha açık, ters yöndekiler daha dolgun
        const isik = Math.cos(a) * 0.6 - Math.sin(a) * 0.8;
        const renk = G.karis(P.yap, P.koyu, h.ton + 0.15 * (1 - isik) * 0.5);
        yika({
          ciz: (cx) => {
            egriYol(cx, pts);
            cx.fill();
          },
          kutu: kutuYol(pts), renk, op: h.op * (tur === 'beyaz' ? 1.12 : 1.25) * (1 - 0.18 * isik), yumusak: 1.2, esik: 0.2, kenarR: 3, kenarKoyu: 1.4, gran: 0.22, akis: 0.12,
          yog: (X, Y) => {
            const d = Math.hypot(X - c.x, Y - c.y);
            const t2 = Math.max(0, 1 - d / Ri);
            return (0.3 + 1.25 * t2 * t2) * (0.4 + 0.6 * G.yumusak(R * 0.05, R * 0.3, d));
          },
          rez: REZ,
        });
      }
      yerelSakla(sekiller);
    });
    // birkaç ercik noktası (gülde göbekte, şakayıkta kâse ağzında)
    if (tip === 'gul' || tur !== 'beyaz') {
      yika({
        ciz: (cx) => {
          for (let k = 0; k < 9; k++) {
            const a = rr() * Math.PI * 2;
            const d = R * (0.04 + rr() * 0.1);
            cx.beginPath();
            cx.arc(c.x + Math.cos(a) * d, c.y - R * 0.1 + Math.sin(a) * d * sq, Math.max(0.9, R * 0.022), 0, Math.PI * 2);
            cx.fill();
          }
        },
        kutu: [c.x - R * 0.3, c.y - R * 0.35, c.x + R * 0.3, c.y + R * 0.2], renk: [214, 150, 60], op: 0.7, yumusak: 0.6, esik: 0.3, kenarR: 1, kenarKoyu: 0.3, gran: 0.1, rez: [REZ_CICEK],
      });
    }
    // gölge tarafı: çiçeğin sol altına ılık-serin, ince bir sır
    yika({
      ciz: (cx) => {
        for (const pts of dis) {
          egriYol(cx, pts);
          cx.fill();
        }
      },
      kutu: kutuC, renk: [212, 186, 206], op: 0.26, islak: true, yumusak: 2, kenarKoyu: 0, gran: 0.25,
      yog: (X, Y) => G.kenet(((c.x - X) * 0.6 + (Y - c.y) * 0.8) / R, 0, 1), rez: [REZ_CICEK],
    });
    maskeyeCiz(REZ_CICEK, (cx) => {
      for (const pts of dis) {
        egriYol(cx, pts);
        cx.fill();
      }
      cx.beginPath();
      cx.ellipse(c.x, c.y - R * 0.04, R * 0.5, R * 0.5 * sq, 0, 0, Math.PI * 2);
      cx.fill();
    }, kutuC);
    // yerel maskeyi temizle
    const x0 = Math.max(0, Math.floor(kutuC[0]));
    const x1 = Math.min(N, Math.ceil(kutuC[2]));
    const y0 = Math.max(0, Math.floor(kutuC[1]));
    const y1 = Math.min(N, Math.ceil(kutuC[3]));
    for (let y = y0; y < y1; y++) REZ_YEREL.fill(0, y * N + x0, y * N + x1);
  }
  function tomurcukSu(t, tur) {
    const P = RENK[tur];
    const p = SAHNE.tomurcukYolu(t);
    const r = t.r * 1.8;
    yika({
      ciz: (cx) => cx.fill(G.yol(p)),
      kutu: [t.x - r, t.y - r, t.x + r, t.y + r], renk: P.koyu, op: 0.45, yumusak: 1, esik: 0.2, kenarR: 2, kenarKoyu: 1, gran: 0.2, rez: [REZ_CICEK],
    });
    // yeşil çanak
    const ca = Math.cos(t.aci);
    const sa = Math.sin(t.aci);
    const bx = t.x - ca * t.r * 0.7;
    const by = t.y - sa * t.r * 0.7;
    yika({
      ciz: (cx) => {
        cx.beginPath();
        cx.ellipse(bx, by, t.r * 0.75, t.r * 0.45, t.aci + Math.PI / 2, 0, Math.PI * 2);
        cx.fill();
      },
      kutu: [bx - r, by - r, bx + r, by + r], renk: [110, 150, 120], op: 0.6, yumusak: 1, kenarR: 2, kenarKoyu: 0.8, rez: [REZ_CICEK],
    });
    maskeyeCiz(REZ_CICEK, (cx) => cx.fill(G.yol(p)), [t.x - r, t.y - r, t.x + r, t.y + r]);
  }

  {
    // önden arkaya: büyük ön çiçekler önce
    const cs = B.cicekler.slice().sort((a, b) => b.y + b.r - (a.y + a.r));
    let i = 0;
    for (const c of cs) {
      if (c.r >= 44) cicekSu(c, ['beyaz', 'allik', 'beyaz', 'seftali', 'beyaz'][i++ % 5], 'sakayik');
      else cicekSu(c, ['seftali', 'beyaz', 'allik', 'beyaz'][i++ % 4], 'gul');
    }
    // ek küçük güller ve tomurcuklar (gür çiçek bandı)
    const ek = [
      { x: 70, y: 985, r: 40 }, { x: 965, y: 985, r: 42 }, { x: 625, y: 1012, r: 30 }, { x: 445, y: 1014, r: 28 },
      { x: 290, y: 1008, r: 30 }, { x: 790, y: 1010, r: 30 }, { x: 100, y: 870, r: 28 }, { x: 935, y: 868, r: 28 },
      { x: 365, y: 880, r: 22 }, { x: 700, y: 888, r: 22 }, { x: 175, y: 1010, r: 26 }, { x: 870, y: 1012, r: 26 },
      { x: 30, y: 920, r: 24 }, { x: 1000, y: 925, r: 24 },
    ];
    for (const c of ek) cicekSu({ x: c.x, y: c.y, r: c.r, aci: rr() * 6 }, ['beyaz', 'allik', 'seftali'][Math.floor(rr() * 3)], 'gul');
    for (const t of B.tomurcuklar) tomurcukSu(t, rr() < 0.5 ? 'allik' : 'seftali');
  }

  // ---------------------------------------------------------------- 2. okaliptüs ve yapraklar (çiçeklerin arkasında)
  function okaliptusDal(pts, yon, olc) {
    // ince mor-yeşil sap
    yika({
      ciz: (cx) => {
        cx.lineWidth = 2.6 * olc;
        cx.stroke(G.yol(SAHNE.yol(pts)));
      },
      kutu: kutuYol(pts, 4), renk: [128, 120, 130], op: 0.6, yumusak: 0.8, esik: 0.25, kenarR: 1.5, kenarKoyu: 0.5, gran: 0.2, akis: 0, rez: [REZ_CICEK],
    });
    // yuvarlak "gümüş dolar" yaprakları, uca doğru küçülür
    for (let i = 2; i < pts.length; i += 2) {
      const t = i / pts.length;
      const [x, y] = pts[i];
      const [xp, yp] = pts[i - 1];
      const a = Math.atan2(y - yp, x - xp);
      for (const sg of [-1, 1]) {
        if (rr() < 0.15) continue;
        const r = (15 + rr() * 8) * (1 - t * 0.5) * olc;
        const aa = a + sg * (1.2 + rr() * 0.3);
        const cx0 = x + Math.cos(aa) * r * 0.8;
        const cy0 = y + Math.sin(aa) * r * 0.8;
        const renk = G.karis([118, 160, 150], [150, 176, 150], rr());
        yika({
          ciz: (cx) => {
            cx.beginPath();
            cx.ellipse(cx0, cy0, r, r * (0.82 + rr() * 0.12), aa, 0, Math.PI * 2);
            cx.fill();
          },
          kutu: [cx0 - r, cy0 - r, cx0 + r, cy0 + r], renk, op: 0.5 + rr() * 0.2, yumusak: 1.2, esik: 0.18, kenarR: 3, kenarKoyu: 1.0, gran: 0.4, akis: 0.25,
          yog: (X, Y) => 0.75 + 0.5 * G.kenet(((X - cx0) * -0.7 + (Y - cy0) * 0.7) / r, -0.6, 1), rez: [REZ_CICEK],
        });
      }
    }
  }
  function yaprakSu(y, renk, op) {
    const W = y.uzunluk * 0.5 * 0.46;
    const ca = Math.cos(y.aci);

      for (let x = 1; x < N - 1; x++) {
        const k = y * N + x;
        const g = (KAGIT[k - N - 1] - KAGIT[k + N + 1]) * 0.5;
        const v = 128 + g * 120;
        const q = k * 4;
        im.data[q] = im.data[q + 1] = im.data[q + 2] = v;
        im.data[q + 3] = 255;
      }
    }
    kx.putImageData(im, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.3;
    ctx.drawImage(kc, 0, 0, N, N);
    ctx.restore();
  }

  SAHNE.hazir();

</script>
