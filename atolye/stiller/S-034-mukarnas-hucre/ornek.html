<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-034 Mukarnas Hücre — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #e9e0cb; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-034 Mukarnas Hücre — bütün yüzey kademeli sıralar hâlinde küçük sivri kemerli niş hücrelerine bölünür
  // (mukarnas kovuğundan ilhamla). Her hücre içbükey bir niştir: kendi gölgeli kovuğu, sağ üstten ışık alan
  // kenarı vardır; rengi sahneden alınır. Ayrıntı gereken yerde hücreler iç içe küçülür.
  (function () {
    const S = SAHNE;
    const W = 1024;
    const IC = 2048;
    const tuval = document.getElementById('tuval');
    tuval.width = IC;
    tuval.height = IC;
    const ctx = tuval.getContext('2d');

    // ---------------------------------------------------------------- başvuru: bölge ve renk
    const ADLAR = Object.keys(S.BOLGE);
    const NO = Object.fromEntries(ADLAR.map((a, i) => [a, i]));
    const bh = S.bolgeHaritasi();
    const bolge = new Uint8Array(W * W);
    for (let i = 0; i < W * W; i++) {
      const v = bh.veri;
      bolge[i] = NO[S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])];
    }
    const rh = S.renkHaritasi();
    const ref = rh.veri;
    const bolgeAt = (x, y) => bolge[Math.max(0, Math.min(W - 1, y | 0)) * W + Math.max(0, Math.min(W - 1, x | 0))];

    // ---------------------------------------------------------------- hücre ızgarası (seviye L: genişlik 48 / 2^L)
    const SEV = 4;
    const GW = [];
    const GH = [];
    const GA = [];
    for (let L = 0; L < SEV; L++) {
      GW.push(48 / Math.pow(2, L));
      GH.push((48 / Math.pow(2, L)) * 0.8);
      GA.push((48 / Math.pow(2, L)) * 0.4);
    }
    const OX = -3;
    const OY = -14;
    // sivri kemer profili: s = 0 tepe, 1 üzengi; eşkenar kemerden
    const kemer = (s) => Math.sqrt(Math.max(0, 1 - ((s + 1) / 2) * ((s + 1) / 2))) / 0.8660254;
    const kemerEgim = (s) => {
      const q = (s + 1) / 2;
      const kok = Math.sqrt(Math.max(1e-4, 1 - q * q));
      return -q / (2 * kok * 0.8660254);
    };
    const H = { r: 0, c: 0, xc: 0, yr: 0, d: 0 };
    function hucre(x, y, L) {
      const w = GW[L];
      const h = GH[L];
      const a = GA[L];
      let r = Math.floor((y - OY) / h);
      let off = r & 1 ? w / 2 : 0;
      let c = Math.floor((x - OX - off) / w);
      let xc = OX + off + (c + 0.5) * w;
      let yr = OY + r * h;
      let s = Math.abs(x - xc) / (w / 2);
      if (y < yr + a * (1 - kemer(s))) {
        r -= 1;
        off = r & 1 ? w / 2 : 0;
        c = Math.floor((x - OX - off) / w);
        xc = OX + off + (c + 0.5) * w;
        yr = OY + r * h;
        s = Math.abs(x - xc) / (w / 2);
      }
      // sınıra uzaklık (yaklaşık dik uzaklık); kenarlar ayrı ayrı, sonra yumuşak en küçük
      const ux = x - xc;
      const dSol = w / 2 + ux;
      const dSag = w / 2 - ux;
      const eT = (a * kemerEgim(s) * 2) / w;
      const dUst = (y - (yr + a * (1 - kemer(s)))) / Math.sqrt(1 + Math.min(eT * eT, 3));
      // alt kenar: alttaki iki hücrenin kemerleri (sol alt ve sağ alt)
      const sR = Math.min(1, Math.abs(x - (xc + w / 2)) / (w / 2));
      const sL = Math.min(1, Math.abs(x - (xc - w / 2)) / (w / 2));
      const eR = (a * kemerEgim(sR) * 2) / w;
      const eL = (a * kemerEgim(sL) * 2) / w;
      const dAltR = (yr + h + a * (1 - kemer(sR)) - y) / Math.sqrt(1 + Math.min(eR * eR, 3));
      const dAltL = (yr + h + a * (1 - kemer(sL)) - y) / Math.sqrt(1 + Math.min(eL * eL, 3));
      const dAlt = ux >= 0 ? Math.min(dAltR, dAltL + w) : Math.min(dAltL, dAltR + w);
      const sert = Math.max(0, Math.min(dSol, dSag, dUst, dAlt));
      const k = 0.1 * w;
      const yum = -k * Math.log(Math.exp(-dSol / k) + Math.exp(-dSag / k) + Math.exp(-dUst / k) + Math.exp(-dAltR / k) + Math.exp(-dAltL / k));
      H.r = r;
      H.c = c;
      H.xc = xc;
      H.yr = yr;
      H.d = sert; // keskin kenar çizgisi için
      // hücre merkezinden dışa doğru yön (kenar sırtının ışık alıp almadığı)
      const my = yr + (h + a) * 0.5;
      const ol = Math.hypot(ux, y - my) || 1;
      H.ox = ux / ol;
      H.oy = (y - my) / ol;
      H.dy = Math.max(0, yum + 0.35 * k); // kase biçimi için (iç kıvrımlarda kırışık yok)
      return H;
    }
    const DERIN = [0.27, 0.23, 0.17, 0.13]; // küçük hücreler daha sığ: renk okunur kalsın
    const anahtar = (L, r, c) => (L * 1024 + (r + 100)) * 1024 + (c + 100);

    // ---------------------------------------------------------------- ayrıntı ihtiyacı: hücre küçülsün mü?
    const bolunme = new Map();
    function bolunsunMu(L, r, c, xc, yr) {
      if (L >= SEV - 1) return false;
      const k = anahtar(L, r, c);
      let v = bolunme.get(k);
      if (v !== undefined) return v;
      const w = GW[L];
      const top = GH[L] + GA[L];
      const say = new Uint16Array(ADLAR.length);
      let lumT = 0;
      let lumK = 0;
      let n = 0;
      for (let j = 0; j < 7; j++) {
        for (let i = 0; i < 7; i++) {
          const x = xc - w / 2 + ((i + 0.5) / 7) * w;
          const y = yr + ((j + 0.5) / 7) * top;
          if (x < 0 || y < 0 || x >= W || y >= W) continue;
          say[bolgeAt(x, y)]++;
          const q = ((y | 0) * W + (x | 0)) * 4;
          const lum = (ref[q] * 0.3 + ref[q + 1] * 0.59 + ref[q + 2] * 0.11) / 255;
          lumT += lum;
          lumK += lum * lum;
          n++;
        }
      }
      let farkli = 0;
      for (let i = 0; i < say.length; i++) if (say[i]) farkli++;
      const varyans = n ? lumK / n - (lumT / n) * (lumT / n) : 0;
      let gerek = 0;
      if (farkli >= 2) gerek = 1;
      if (say[NO.minare] && (farkli >= 2 || varyans > 0.004)) gerek = 2;
      if (say[NO.pencere] || say[NO.cicekOrta]) gerek = 2;
      if (say[NO.cicek] && farkli >= 2) gerek = Math.max(gerek, 2);
      if (say[NO.altin]) gerek = 3;
      if (varyans > 0.01) gerek = Math.max(gerek, L + 1);
      v = gerek > L;
      bolunme.set(k, v);
      return v;
    }

    // bir noktanın hücre zinciri: en içteki hücre, parça anahtarı, derinlik
    const Z = { L: 0, parca: 0, z: 0, dIc: 0, wIc: 48 };
    function zincir(x, y) {
      let L = 0;
      let z = 0;
      let ust = 0;
      let parca = 0;
      for (;;) {
        const h = hucre(x, y, L);
        const w = GW[L];
        const t = Math.min(1, h.dy / (0.4 * w));
        const kase = 1 - (1 - t) * (1 - t);
        // niş başlığı: üst kısım daha derin
        const v = (y - h.yr) / (GH[L] + GA[L]);
        const derin = DERIN[L] * w * kase * (1.25 - 0.55 * Math.min(1, Math.max(0, v)));
        const k = anahtar(L, h.r, h.c);
        const bol = bolunsunMu(L, h.r, h.c, h.xc, h.yr);
        if (bol) {
          z -= derin * 0.45;
          ust = k;
          L++;
          continue;
        }
        z -= derin;
        parca = k * 2097152 + (ust % 2097152);
        Z.L = L;
        Z.parca = parca;
        Z.z = z;
        Z.dIc = h.d;
        Z.wIc = w;
        Z.yon = Math.max(0, H.ox * 0.7071 - H.oy * 0.7071); // sağ üst kenar = 1
        return Z;
      }
    }

    // ---------------------------------------------------------------- 1. geçiş: her parçanın rengi (baskın bölgenin ortalaması)
    const parcalar = new Map();
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        const zz = zincir(x + 0.5, y + 0.5);
        let p = parcalar.get(zz.parca);
        if (!p) {
          p = { say: new Uint32Array(ADLAR.length), r: new Float64Array(ADLAR.length), g: new Float64Array(ADLAR.length), b: new Float64Array(ADLAR.length) };
          parcalar.set(zz.parca, p);
        }
        const i = y * W + x;
        const bb = bolge[i];
        p.say[bb]++;
        p.r[bb] += ref[i * 4];
        p.g[bb] += ref[i * 4 + 1];
        p.b[bb] += ref[i * 4 + 2];
      }
    }
    // alçı krem ile boyalı renk
    const KREM = [238, 228, 206];
    const rnd = S.rng(34);
    for (const p of parcalar.values()) {
      let en = 0;
      for (let i = 1; i < ADLAR.length; i++) if (p.say[i] > p.say[en]) en = i;
      const n = p.say[en] || 1;
      let r = p.r[en] / n;
      let g = p.g[en] / n;
      let b = p.b[en] / n;
      const ad = ADLAR[en];
      p.bolge = ad;
      // boya: biraz doygunluk, alçı kremine karışım; bölgeye göre ince ayar
      let karisim = ad === 'kaide' || ad === 'minare' ? 0.22 : 0.1;
      if (ad === 'gok' || ad === 'gunes') {
        // gök: lâcivert-turkuaz boyalı alçı (yukarıda koyu, ufukta açık)
        const t = Math.min(1, Math.max(0, (p.r[en] / n - 140) / 110));
        r = 70 + 150 * t; g = 128 + 105 * t; b = 196 + 30 * t;
        karisim = 0.04 + 0.1 * t;
        if (ad === 'gunes') { r = 246; g = 226; b = 170; }
      }
      if (ad === 'kubbe' || ad === 'kasnak') {
        // yeşil sırlı boya: biraz daha derin
        r *= 0.86;
        g *= 0.98;
        b *= 0.88;
      }
      if (ad === 'pencere') { r *= 0.42; g *= 0.48; b *= 0.42; }
      if (ad === 'zemin') { r *= 0.92; g *= 0.85; b *= 0.72; }
      if (ad === 'yaprak' || ad === 'sap') { r *= 0.85; g *= 0.9; b *= 0.8; }
      if (ad === 'minare' || ad === 'kaide') { r *= 1.0; g *= 0.98; b *= 0.93; }
      const ton = 1 + (rnd() - 0.5) * 0.07;
      p.c = [(r * (1 - karisim) + KREM[0] * karisim) * ton, (g * (1 - karisim) + KREM[1] * karisim) * ton, (b * (1 - karisim) + KREM[2] * karisim) * ton];
      p.altin = ad === 'altin';
      p.yaldiz = ad === 'kubbe' || ad === 'altin' || ad === 'cicekOrta' || ad === 'gunes';
    }

    // ---------------------------------------------------------------- 2. geçiş: 2048'de derinlik alanı
    const N = IC * IC;
    const zA = new Float32Array(N);
    const pA = new Float64Array(N);
    const dA = new Float32Array(N);
    const wA = new Float32Array(N);
    const yA = new Float32Array(N);
    for (let Y = 0; Y < IC; Y++) {
      for (let X = 0; X < IC; X++) {
        const zz = zincir((X + 0.5) / 2, (Y + 0.5) / 2);
        const i = Y * IC + X;
        zA[i] = zz.z * 2; // iç piksel biriminde
        pA[i] = zz.parca;
        dA[i] = zz.dIc;
        wA[i] = zz.wIc;
        yA[i] = zz.yon;
      }
    }

    // ---------------------------------------------------------------- 3. geçiş: ışık (sağ üstten), gölge, alçı dokusu
    const img = ctx.createImageData(IC, IC);
    const o = img.data;
    let Lx = 0.55;
    let Ly = 0.6; // yukarı
    let Lz = 0.58;
    const ln = Math.hypot(Lx, Ly, Lz);
    Lx /= ln; Ly /= ln; Lz /= ln;
    const Hx = Lx;
    const Hy = Ly;
    const Hz = Lz + 1;
    const hn = Math.hypot(Hx, Hy, Hz);
    // ekran üzerinde ışığa doğru adım (sağ üst) ve yükselme eğimi
    const adx = 0.7071;
    const ady = -0.7071;
    const egim = 0.62; // her piksel ilerlemede ışın yüksekliği
    function hashp(x, y) {
      let h = (x * 374761393 + y * 668265263) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    let sonParca = -1;
    let P = null;
    for (let Y = 1; Y < IC - 1; Y++) {
      for (let X = 1; X < IC - 1; X++) {
        const i = Y * IC + X;
        const z = zA[i];
        // normal (merkezî fark)
        const gx = (zA[i + 1] - zA[i - 1]) * 0.5;
        const gy = (zA[i + IC] - zA[i - IC]) * 0.5; // ekran aşağı
        let nx = -gx;
        let ny = gy; // yukarı eksen
        let nz = 1;
        const nn = Math.hypot(nx, ny, nz);
        nx /= nn; ny /= nn; nz /= nn;
        let dif = nx * Lx + ny * Ly + nz * Lz;
        if (dif < 0) dif = 0;
        // atılan gölge: ışığa doğru yükseklik alanında yürü
        let golge = 0;
        for (let k = 1; k <= 14; k++) {
          const xx = (X + adx * k) | 0;
          const yy = (Y + ady * k + 0.5) | 0;
          if (xx >= IC || yy < 0) break;
          const fark = zA[yy * IC + xx] - (z + k * egim);
          if (fark > 0) {
            golge = Math.max(golge, Math.min(1, fark / 1.6));
            if (golge >= 1) break;
          }
        }
        const pk = pA[i];
        if (pk !== sonParca) {
          P = parcalar.get(pk);
          sonParca = pk;
        }
        let r;
        let g;
        let b;
        if (P) {
          r = P.c[0]; g = P.c[1]; b = P.c[2];
        } else {
          const q = (((Y / 2) | 0) * W + ((X / 2) | 0)) * 4;
          r = ref[q]; g = ref[q + 1]; b = ref[q + 2];
        }
        const w = wA[i];
        const derinlik = Math.min(1, -z / (0.25 * w * 2 * 1.4));
        const ao = 1 - 0.22 * derinlik;
        let isik = (0.38 + 0.86 * dif * (1 - 0.66 * golge)) * ao;
        // alçı dokusu: ince tane
        const tane = (hashp(X, Y) - 0.5) * 0.06 + (hashp(X >> 3, Y >> 3) - 0.5) * 0.035;
        isik *= 1 + tane;
        r *= isik; g *= isik; b *= isik;
        // kenar sırtı: ince açık çizgi (alçının kenarı ışık yakalar)
        const d = dA[i];
        if (P && P.altin) {
          // altın hücre: metal parlaklık
          const sp = Math.pow(Math.max(0, (nx * Hx + ny * Hy + nz * Hz) / hn), 18);
          r = r * 1.05 + 255 * sp * 0.6;
          g = g * 1.0 + 230 * sp * 0.6;
          b = b * 0.85 + 160 * sp * 0.5;
        }
        if (d < 0.75) {
          const e = 1 - d / 0.75;
          if (P && P.yaldiz) {
            // ince altın kenar
            const gl = 0.55 + 0.6 * dif;
            r = r * (1 - e) + 214 * gl * e;
            g = g * (1 - e) + 172 * gl * e;
            b = b * (1 - e) + 82 * gl * e;
          } else {
            // sağ üst kenar ışık alır, sol alt kenar gölgede
            const yon = yA[i];
            const ac = e * (0.1 + 0.55 * yon);
            r += (255 - r) * ac;
            g += (250 - g) * ac;
            b += (236 - b) * ac;
          }
        }
        o[i * 4] = r > 255 ? 255 : r;
        o[i * 4 + 1] = g > 255 ? 255 : g;
        o[i * 4 + 2] = b > 255 ? 255 : b;
        o[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    S.hazir();
  })();
</script>
</body>
</html>
