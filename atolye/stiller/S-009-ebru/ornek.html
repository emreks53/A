<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-009 Ebru — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F2EBDA; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-009 Ebru — gerçek ebru matematiğiyle (Aubrey Jaffer'in mürekkep damlası ve tarak/iğne dönüşümleri)
  // hesaplanan kâğıt: gökte lacivert battal + gelgit, güneşte iç içe damlalar, yeşil kubbede meridyen
  // boyunca taranmış battal, akkâse (şablon) ile çıkan beyaz mermerli bina, taraklı zemin ve iğneyle
  // çekilmiş lale, karanfil, sümbül, papatya. Her piksel, işlemlerin tersi uygulanarak hangi damlaya ait
  // olduğu bulunarak boyanır; damla sınırları ince damar olarak çizilir.
  const S = SAHNE;
  const K = 2; // iç çözünürlük çarpanı
  const W = 1024 * K;
  const tuval = document.getElementById('tuval');
  tuval.width = W;
  tuval.height = W;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const KAGIT = hex('#F2EBDA');
  const T0 = performance.now();
  const zaman = (ad) => console.warn('zaman ' + ad + ' ' + Math.round(performance.now() - T0));

  // ------------------------------------------------------------ ebru motoru
  // İşlemler sırayla kaydedilir; boyarken her piksel için tersten geri gidilir:
  //  damla (c, r):   ileri p' = c + (p-c)·sqrt(1 + r²/|p-c|²)  → geri p = c + (p'-c)·sqrt(1 - r²/|p'-c|²); |p'-c| < r ise piksel o damlanın
  //  tarak dişi:      ileri p' = p + α·λ/(d+λ)·M  (d: çizgiye uzaklık; d değişmez) → geri p = p' - α·λ/(d+λ)·M
  //  iğne adımı:      ileri p' = p + v·exp(-|p-s|²/σ²) → geri: sabit nokta yinelemesi
  const ADIM = 12; // işlem kaydının uzunluğu (Float64Array içinde)
  function Tabaka() {
    this.F = new Float64Array(ADIM * 256);
    this.n = 0;
    this.renk = [];
  }
  Tabaka.prototype.yeni = function () {
    if ((this.n + 1) * ADIM > this.F.length) {
      const G = new Float64Array(this.F.length * 2);
      G.set(this.F);
      this.F = G;
    }
    return this.n++ * ADIM;
  };
  // damla: [0, x, y, r²]
  Tabaka.prototype.damla = function (x, y, r, renk) {
    const b = this.yeni();
    const F = this.F;
    F[b] = 0;
    F[b + 1] = x;
    F[b + 2] = y;
    F[b + 3] = r * r;
    this.renk[b / ADIM] = hex(renk);
  };
  // tarak dişi (sonsuz çizgi): [1, px, py, mx, my, nx, ny, α, λ]
  Tabaka.prototype.dis = function (px, py, aci, alfa, lam) {
    const b = this.yeni();
    const F = this.F;
    const mx = Math.cos(aci);
    const my = Math.sin(aci);
    F[b] = 1;
    F[b + 1] = px;
    F[b + 2] = py;
    F[b + 3] = mx;
    F[b + 4] = my;
    F[b + 5] = -my;
    F[b + 6] = mx;
    F[b + 7] = alfa;
    F[b + 8] = lam;
  };
  // tarak (eşit aralıklı, paralel dişler): [3, px, py, mx, my, nx, ny, α, λ, aralık, gelgit]
  // Her nokta en yakın dişin Jaffer dönüşümüyle kayar; gelgit=1 ise komşu dişler ters yönde çeker (bir sağa bir sola).
  Tabaka.prototype.tarak = function (px, py, aci, aralik, alfa, lam, gelgit) {
    const b = this.yeni();
    const F = this.F;
    const mx = Math.cos(aci);
    const my = Math.sin(aci);
    F[b] = 3;
    F[b + 1] = px;
    F[b + 2] = py;
    F[b + 3] = mx;
    F[b + 4] = my;
    F[b + 5] = -my;
    F[b + 6] = mx;
    F[b + 7] = alfa;
    F[b + 8] = lam;
    F[b + 9] = aralik;
    F[b + 10] = gelgit ? 1 : 0;
  };
  // iğne adımı: [2, sx, sy, vx, vy, 1/σ², sınır²]
  Tabaka.prototype.igne = function (x0, y0, x1, y1, sigma, guc) {
    const L = Math.hypot(x1 - x0, y1 - y0);
    const n = Math.max(2, Math.ceil(L / Math.max(0.5, sigma * 0.55)));
    for (let i = 1; i <= n; i++) {
      const ax = x0 + ((x1 - x0) * (i - 1)) / n;
      const ay = y0 + ((y1 - y0) * (i - 1)) / n;
      const bx = x0 + ((x1 - x0) * i) / n;
      const by = y0 + ((y1 - y0) * i) / n;
      const b = this.yeni();
      const F = this.F;
      F[b] = 2;
      F[b + 1] = bx;
      F[b + 2] = by;
      F[b + 3] = (bx - ax) * guc;
      F[b + 4] = (by - ay) * guc;
      F[b + 5] = 1 / (sigma * sigma);
      F[b + 6] = 10 * sigma * sigma + 4;
    }
  };
  Tabaka.prototype.yol = function (pts, sigma, guc) {
    for (let i = 1; i < pts.length; i++) this.igne(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], sigma, guc);
  };
  // Geri iz: noktayı işlemlerin tersinden geçirip hangi damlaya düştüğünü bul.
  //  damla (c, r):  ileri p' = c + (p-c)·sqrt(1 + r²/|p-c|²)   geri p = c + (p'-c)·sqrt(1 - r²/|p'-c|²);  |p'-c| < r → o damla
  //  tarak dişi:    ileri p' = p + α·λ/(d+λ)·M  (d çizgiye uzaklık, değişmez)   geri p = p' - α·λ/(d+λ)·M
  //  iğne adımı:    ileri p' = p + v·exp(-|p-s|²/σ²)   geri: sabit nokta yinelemesi
  const IZ = { k: -1, rho: 0, x: 0, y: 0 };
  function geriIz(F, n, x, y) {
    for (let k = n - 1; k >= 0; k--) {
      const b = k * ADIM;
      const t = F[b];
      if (t === 0) {
        const dx = x - F[b + 1];
        const dy = y - F[b + 2];
        const m2 = dx * dx + dy * dy;
        const r2 = F[b + 3];
        if (m2 < r2) {
          IZ.k = k;
          IZ.rho = Math.sqrt(m2 / r2);
          IZ.x = x;
          IZ.y = y;
          return IZ;
        }
        const f = Math.sqrt(1 - r2 / m2);
        x = F[b + 1] + dx * f;
        y = F[b + 2] + dy * f;
      } else if (t === 1) {
        const d = Math.abs((x - F[b + 1]) * F[b + 5] + (y - F[b + 2]) * F[b + 6]);
        const f = (F[b + 7] * F[b + 8]) / (d + F[b + 8]);
        x -= f * F[b + 3];
        y -= f * F[b + 4];
      } else if (t === 3) {
        // iki komşu dişin katkısı (alt ve üst diş): alan boyunca sürekli kayma
        const d = (x - F[b + 1]) * F[b + 5] + (y - F[b + 2]) * F[b + 6];
        const ar = F[b + 9];
        const lam = F[b + 8];
        const al = F[b + 7];
        const k0 = Math.floor(d / ar);
        const d0 = d - k0 * ar;
        const d1 = ar - d0;
        let f0 = (al * lam) / (d0 + lam);
        let f1 = (al * lam) / (d1 + lam);
        if (F[b + 10]) {
          if (k0 & 1) f0 = -f0;
          else f1 = -f1;
        }
        const f = f0 + f1;
        x -= f * F[b + 3];
        y -= f * F[b + 4];
      } else {
        const sx = F[b + 1];
        const sy = F[b + 2];
        const dx = x - sx;
        const dy = y - sy;
        if (dx * dx + dy * dy > F[b + 6]) continue;
        const vx = F[b + 3];
        const vy = F[b + 4];
        const is2 = F[b + 5];
        let X = x;
        let Y = y;
        for (let it = 0; it < 4; it++) {
          const ex = X - sx;
          const ey = Y - sy;
          const g = Math.exp(-(ex * ex + ey * ey) * is2);
          X = x - vx * g;
          Y = y - vy * g;
        }
        x = X;
        y = Y;
      }
    }
    IZ.k = -1;
    IZ.x = x;
    IZ.y = y;
    return IZ;
  }

  // Bir kutu için damla kimliği, kenar oranı ve ilk konumu hesapla (uyarlamalı örnekleme: önce 2 pikselde bir,
  // dört köşesi aynı damlaya düşen pikseller aradeğerlenir, sınır pikselleri tam hesaplanır).
  // secici(i,j) iç-çözünürlük pikseli seçili mi; eslem(x,y,P) dünya → tabaka koordinatı; on(x,y) hızlı eleme
  function hesapla(T, bx0, by0, bw, bh, secici, eslem, on) {
    const F = T.F;
    const n = T.n;
    const N = bw * bh;
    const KM = new Int32Array(N).fill(-2);
    const RH = new Float32Array(N);
    const QX = new Float32Array(N);
    const QY = new Float32Array(N);
    const P = [0, 0];
    const tek = (i, j) => {
      const p = j * bw + i;
      const gi = bx0 + i;
      const gj = by0 + j;
      if (secici && !secici(gi, gj)) return;
      let x = (gi + 0.5) / K;
      let y = (gj + 0.5) / K;
      if (on && !on(x, y)) {
        KM[p] = -1;
        return;
      }
      if (eslem) {
        eslem(x, y, P);
        x = P[0];
        y = P[1];
      }
      const s = geriIz(F, n, x, y);
      KM[p] = s.k;
      RH[p] = s.rho;
      QX[p] = s.x;
      QY[p] = s.y;
    };
    for (let j = 0; j < bh; j += 2) for (let i = 0; i < bw; i += 2) tek(i, j);
    for (let j = 0; j < bh; j++) {
      for (let i = 0; i < bw; i++) {
        if (!(i & 1) && !(j & 1)) continue;
        const i0 = i & ~1;
        const j0 = j & ~1;
        const i1 = i0 + 2;
        const j1 = j0 + 2;
        if (i1 < bw && j1 < bh) {
          const a = KM[j0 * bw + i0];
          if (a >= 0 && KM[j0 * bw + i1] === a && KM[j1 * bw + i0] === a && KM[j1 * bw + i1] === a && (!secici || secici(bx0 + i, by0 + j))) {
            const fx = (i - i0) / 2;
            const fy = (j - j0) / 2;
            const p00 = j0 * bw + i0;
            const p10 = j0 * bw + i1;
            const p01 = j1 * bw + i0;
            const p11 = j1 * bw + i1;
            const ara = (A) => (A[p00] * (1 - fx) + A[p10] * fx) * (1 - fy) + (A[p01] * (1 - fx) + A[p11] * fx) * fy;
            const p = j * bw + i;
            KM[p] = a;
            RH[p] = ara(RH);
            QX[p] = ara(QX);
            QY[p] = ara(QY);
            continue;
          }
        }
        tek(i, j);
      }
    }
    return { KM, RH, QX, QY };
  }

  // Hesaplanan kutuyu görüntüye boya; damla sınırlarına ince damar
  function boyaKutuya(T, img, iw, ox, oy, bx0, by0, bw, bh, h, saydam, kenar, kenarGuc, zemin) {
    const Z = zemin || KAGIT;
    const d = img.data;
    const { KM, RH, QX, QY } = h;
    for (let j = 0; j < bh; j++) {
      for (let i = 0; i < bw; i++) {
        const p = j * bw + i;
        const k = KM[p];
        if (k === -2) continue;
        const q = ((by0 + j - oy) * iw + (bx0 + i - ox)) * 4;
        if (k < 0) {
          if (saydam) continue;
          d[q] = Z[0];
          d[q + 1] = Z[1];
          d[q + 2] = Z[2];
          d[q + 3] = 255;
          continue;
        }
        const c = T.renk[k];
        // taş kenarında koyulaşan boya + akışla gerilen ince doku
        const kenarK = Math.pow(Math.max(0, (RH[p] - 0.68) / 0.32), 1.6);
        const f = 1 - (kenarGuc || 0.17) * kenarK + 0.07 * (DOKU(QX[p] * 3, QY[p] * 3) - 0.5) + 0.05 * (DOKU2(QX[p], QY[p]) - 0.5);
        d[q] = Math.min(255, c[0] * f);
        d[q + 1] = Math.min(255, c[1] * f);
        d[q + 2] = Math.min(255, c[2] * f);
        d[q + 3] = 255;
      }
    }
    for (let j = 0; j < bh - 1; j++) {
      for (let i = 0; i < bw - 1; i++) {
        const p = j * bw + i;
        const a = KM[p];
        if (a === -2 || (saydam && a < 0)) continue;
        const b = KM[p + 1];
        const c = KM[p + bw];
        if ((b !== -2 && b !== a) || (c !== -2 && c !== a)) {
          const q = ((by0 + j - oy) * iw + (bx0 + i - ox)) * 4;
          d[q] *= kenar;
          d[q + 1] *= kenar;
          d[q + 2] *= kenar * 1.02;
        }
      }
    }
  }

  // değer gürültüsü: boyanın kendi dokusu (damlanın ilk konumunda ölçülür, akışla birlikte gerilir)
  function gurultu(tohum, hucre) {
    const r = S.rng(tohum);
    const G = 256;
    const g = new Float32Array(G * G);
    for (let i = 0; i < G * G; i++) g[i] = r();
    return (x, y) => {
      x /= hucre;
      y /= hucre;
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const v = (i, j) => g[((j & 255) << 8) | (i & 255)];
      const a = v(xi, yi) + (v(xi + 1, yi) - v(xi, yi)) * sx;
      const b = v(xi, yi + 1) + (v(xi + 1, yi + 1) - v(xi, yi + 1)) * sx;
      return a + (b - a) * sy;
    };
  }
  const DOKU = gurultu(17, 2.2);
  const DOKU2 = gurultu(18, 7);

  // Arka plan tabakası: tüm görüntü üzerinde, seçili piksellere
  function boya(T, hedef, Wh, bx0, by0, bx1, by1, secici, eslem, saydam, kenar, zemin) {
    const h = hesapla(T, bx0, by0, bx1 - bx0, by1 - by0, secici, eslem, null);
    boyaKutuya(T, hedef, Wh, 0, 0, bx0, by0, bx1 - bx0, by1 - by0, h, saydam, kenar === undefined ? 0.7 : kenar, 0.17, zemin ? hex(zemin) : null);
  }

  // ------------------------------------------------------------ bölge haritası (iç çözünürlükte, çiçeksiz)
  const KOD = { gok: 1, gunes: 1, zemin: 2, minare: 3, kaide: 3, kasnak: 4, kubbe: 5, pencere: 6, altin: 7 };
  const etiket = new Uint8Array(W * W);
  {
    const c = S.yeniTuval(W, W);
    const b = c.getContext('2d', { willReadFrequently: true });
    b.setTransform(K, 0, 0, K, 0, 0);
    S.ciz(b, { bolge: true, cicek: false });
    const v = b.getImageData(0, 0, W, W).data;
    const secenek = Object.keys(KOD).map((ad) => [KOD[ad], ...hex(S.BOLGE[ad])]);
    for (let i = 0; i < W * W; i++) {
      const r = v[i * 4];
      const g = v[i * 4 + 1];
      const bb = v[i * 4 + 2];
      let en = 1;
      let enU = 1e9;
      for (const [kod, R, G, B] of secenek) {
        const dd = (r - R) * (r - R) + (g - G) * (g - G) + (bb - B) * (bb - B);
        if (dd < enU) {
          enU = dd;
          en = kod;
        }
      }
      etiket[i] = en;
    }
  }
  zaman('bolge');
  const hedef = ctx.createImageData(W, W);
  const et = (kodlar) => (i, j) => kodlar.includes(etiket[j * W + i]);

  // ------------------------------------------------------------ 1) gök: lacivert battal + yatay gelgit + güneş
  {
    const T = new Tabaka();
    const r = S.rng(901);
    const renk = ['#22305E', '#2C4A8A', '#3D5E9E', '#1B2550', '#567BB4', '#2A3F78', '#8CA6CE', '#33528F'];
    for (let i = 0; i < 330; i++) T.damla(-60 + r() * 1144, -60 + r() * 900, 28 + r() * 36, renk[Math.floor(r() * renk.length)]);
    // birkaç açık (beyaz) damla: battalda damar ağı oluşturur
    for (let i = 0; i < 40; i++) T.damla(-40 + r() * 1100, -40 + r() * 860, 6 + r() * 10, '#DCE2EA');
    // gelgit: iğne bir sağa bir sola, yatay sıralar
    T.tarak(0, 6, 0, 36, 14, 24, true); // gelgit
    // güneş: aynı yere iç içe dökülen damlalar
    const renkG = ['#B8792E', '#D9A441', '#EBC56A', '#F4DFA2', '#FBF1D6', '#E2B04C', '#F7E7BC'];
    [64, 52, 41, 31, 22, 14, 7].forEach((rr, i) => T.damla(880, 140, rr, renkG[i]));
    boya(T, hedef, W, 0, 0, W, 812 * K, et([1]), null, false, 0.72);
  }

  zaman('gok');
  // ------------------------------------------------------------ 2) zemin: açık battal + taraklı
  {
    const T = new Tabaka();
    const r = S.rng(902);
    const renk = ['#E3CFA0', '#D2B27A', '#C29A5E', '#EDE2C6', '#B88A52', '#9E8656', '#E8D9B4'];
    for (let i = 0; i < 300; i++) T.damla(-30 + r() * 1084, 770 + r() * 270, 18 + r() * 18, renk[Math.floor(r() * renk.length)]);
    T.tarak(0, 790, 0, 12, 18, 9, true); // yatay gelgit
    T.tarak(4, 0, Math.PI / 2, 15, 14, 8, true); // dikey gelgit
    T.tarak(2, 0, Math.PI / 2, 9.5, 9, 4.5, false); // tarak: tek yönde
    boya(T, hedef, W, 0, 790 * K, W, W, et([2]), null, false, 0.82);
  }

  zaman('zemin');
  // ------------------------------------------------------------ 3) kubbe: yeşil battal, kaburga meridyenleri boyunca taranmış
  {
    const T = new Tabaka();
    const r = S.rng(903);
    const renk = ['#2E6B3E', '#3E8350', '#24563A', '#5C9C62', '#1D4A2D', '#4A8E58', '#8DBB7E'];
    for (let i = 0; i < 520; i++) T.damla(-40 + r() * 480, -40 + r() * 380, 10 + r() * 13, renk[Math.floor(r() * renk.length)]);
    // her dilimin ortasında yukarı çekilen dişler: sivri kemerli dilim deseni
    T.tarak(12.5, 0, -Math.PI / 2, 25, 24, 7, false);
    // kaburgalarda aşağı ince çekiş
    T.tarak(0, 0, Math.PI / 2, 25, 9, 2.5, false);
    const pr = S.kubbeProfili(120);
    const yariCap = (y) => {
      for (let i = 0; i < pr.length - 1; i++) if (y <= pr[i].y && y >= pr[i + 1].y) return pr[i].r + ((pr[i + 1].r - pr[i].r) * (pr[i].y - y)) / (pr[i].y - pr[i + 1].y || 1);
      return 1;
    };
    const eslem = (x, y, P) => {
      const rr = Math.max(1, yariCap(y));
      const s = Math.max(-1, Math.min(1, (x - 560) / rr));
      P[0] = (Math.asin(s) / (Math.PI / 2) + 1) * 200;
      P[1] = y - 300;
    };
    boya(T, hedef, W, 350 * K, 290 * K, 770 * K, 560 * K, et([5]), eslem, false, 0.7);
  }

  zaman('kubbe');
  // ------------------------------------------------------------ 4) kasnak: koyu yeşil, yatay gelgit
  {
    const T = new Tabaka();
    const r = S.rng(904);
    const renk = ['#245A36', '#1B4529', '#336E45', '#2B6440', '#4C8455'];
    for (let i = 0; i < 420; i++) T.damla(310 + r() * 500, 530 + r() * 190, 8 + r() * 10, renk[Math.floor(r() * renk.length)]);
    T.tarak(0, 552, 0, 12, 10, 12, true);
    boya(T, hedef, W, 330 * K, 550 * K, 790 * K, 696 * K, et([4]), null, false, 0.72, '#7FAF78');
  }

  // ------------------------------------------------------------ 5) bina (kaide + minare): beyaz mermer battal
  {
    const T = new Tabaka();
    const r = S.rng(905);
    const renk = ['#EFE8D6', '#E2D6BC', '#F6F1E5', '#D6C6A4', '#E9DFC8', '#C9B48C'];
    for (let i = 0; i < 560; i++) T.damla(200 + r() * 660, 60 + r() * 760, 11 + r() * 15, renk[Math.floor(r() * renk.length)]);
    T.tarak(0, 80, 0.35, 55, 16, 18, true);
    boya(T, hedef, W, 240 * K, 70 * K, 840 * K, 802 * K, et([3]), null, false, 0.78);
  }

  zaman('bina');
  // ------------------------------------------------------------ 5b) pencereler: şablon delikleri, koyu çivit battal
  {
    const T = new Tabaka();
    const r = S.rng(907);
    const renk = ['#1A2146', '#232D5C', '#141A38', '#2E3A70'];
    const pencereler = [
      ...[0, 1].flatMap((kat) => S.kasnakPencereleri(kat)),
      ...S.kaide.pencereler,
      ...S.minarePencereleri,
    ];
    for (const p of pencereler) {
      for (let i = 0; i < 9; i++) T.damla(p.x + (r() - 0.5) * p.w * 0.6, p.y + p.h * (0.15 + 0.75 * r()), Math.max(p.w, 6) * (0.35 + r() * 0.3), renk[Math.floor(r() * renk.length)]);
    }
    boya(T, hedef, W, 280 * K, 200 * K, 830 * K, 790 * K, et([6]), null, false, 0.8, '#1C2348');
  }

  // ------------------------------------------------------------ 6) alemler: sarı toprak
  {
    const T = new Tabaka();
    const r = S.rng(906);
    for (let i = 0; i < 90; i++) T.damla(250 + r() * 360, 70 + r() * 250, 3 + r() * 6, ['#D7A53E', '#E8C268', '#B9862C'][Math.floor(r() * 3)]);
    boya(T, hedef, W, 260 * K, 76 * K, 600 * K, 312 * K, et([7]), null, false, 0.8);
  }

  // ------------------------------------------------------------ 7) şablon kenarları: akkâse şablonunun bıraktığı ince kâğıt çizgisi
  {
    const d = hedef.data;
    const kenar = new Uint8Array(W * W);
    for (let j = 1; j < W - 1; j++) {
      for (let i = 1; i < W - 1; i++) {
        const p = j * W + i;
        const a = etiket[p];
        if (a !== etiket[p + 1] || a !== etiket[p + W]) {
          kenar[p] = 1;
          kenar[p + 1] = 1;
        }
      }
    }
    for (let p = 0; p < W * W; p++) {
      if (!kenar[p]) continue;
      d[p * 4] = 240;
      d[p * 4 + 1] = 233;
      d[p * 4 + 2] = 214;
      d[p * 4 + 3] = 255;
    }
  }
  ctx.putImageData(hedef, 0, 0);

  // ------------------------------------------------------------ 8) şablon ayrıntıları (kesik çizgiler)
  ctx.save();
  ctx.setTransform(K, 0, 0, K, 0, 0);
  {
    const krem = '#F0E9D6';
    const lac = 'rgba(30,40,80,0.9)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // minare bölümleri
    for (const p of S.minareParcalari()) {
      if (p.tip === 'bant') {
        for (const z of S.zikzakCizgileri()) {
          ctx.beginPath();
          z.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
          ctx.strokeStyle = lac;
          ctx.lineWidth = 2.4;
          ctx.stroke();
        }
      } else if (p.tip === 'korkuluk') {
        const adet = Math.round((p.x2 - p.x1) / 9);
        const w = (p.x2 - p.x1) / adet;
        for (let i = 0; i < adet; i++) {
          ctx.fillStyle = lac;
          ctx.fill(new Path2D(S.kemerYolu(p.x1 + w * (i + 0.5), p.y1 + 4, w * 0.5, p.y2 - p.y1 - 8)));
        }
        ctx.strokeStyle = krem;
        ctx.lineWidth = 1.4;
        ctx.strokeRect(p.x1, p.y1, p.x2 - p.x1, p.y2 - p.y1);
      } else if (p.tip === 'poligon' && (p.ad.startsWith('şerefe') || p.ad.startsWith('çıkma') || p.ad === 'bilezik')) {
        const pp = new Path2D(S.yol(p.noktalar, true));
        ctx.strokeStyle = krem;
        ctx.lineWidth = 1.4;
        ctx.stroke(pp);
      } else if (p.tip === 'topuz') {
        ctx.strokeStyle = krem;
        ctx.lineWidth = 1.4;
        ctx.stroke(new Path2D(p.yol));
      }
    }
    // kasnak katları ve korniş arası
    ctx.strokeStyle = krem;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(334, 610);
    ctx.lineTo(786, 610);
    ctx.moveTo(300, 704);
    ctx.lineTo(820, 704);
    ctx.stroke();
  }
  ctx.restore();

  // ------------------------------------------------------------ 9) çiçekli ebru: damlalar ve iğne çekişleri
  const CIZ = []; // {T, kutu:[x0,y0,x1,y1]} ön → arka sıralı çizilecek
  function cerceve(cx, cy, s, aci) {
    const c = Math.cos(aci);
    const si = Math.sin(aci);
    return (u, v) => [cx + (u * c - v * si) * s, cy + (u * si + v * c) * s];
  }
  function yardimci(T, f, s) {
    return {
      D: (u, v, r, c) => {
        const [x, y] = f(u, v);
        T.damla(x, y, r * s, c);
      },
      I: (u0, v0, u1, v1, sg, g) => {
        const [a, b] = f(u0, v0);
        const [c, d] = f(u1, v1);
        T.igne(a, b, c, d, sg * s, g || 1);
      },
    };
  }
  function ekle(T, x0, y0, x1, y1) {
    CIZ.push({ T, kutu: [Math.max(0, Math.floor(x0)), Math.max(0, Math.floor(y0)), Math.min(1024, Math.ceil(x1)), Math.min(1024, Math.ceil(y1))] });
  }
  const KIRMIZI = ['#B3352A', '#D8644A', '#F1D8A6', '#8E2620'];
  const GUL = ['#9E2B3A', '#D45563', '#F5E3CB', '#7A1F2C'];
  function lale(cx, cy, s, aci, renk) {
    const T = new Tabaka();
    const { D, I } = yardimci(T, cerceve(cx, cy, s, aci || 0), s);
    D(0, 0, 17, renk[0]);
    D(0, 3, 11, renk[1]);
    D(0, 5, 6, renk[2]);
    D(0, 6, 2.6, renk[1]);
    I(0, 9, 0, -34, 4.5);
    I(-8, 4, -17, -30, 4);
    I(8, 4, 17, -30, 4);
    I(0, 8, 0, 30, 5);
    const R = 40 * s;
    ekle(T, cx - R, cy - R, cx + R, cy + R);
  }
  function karanfil(cx, cy, s, aci, renk) {
    const T = new Tabaka();
    const { D, I } = yardimci(T, cerceve(cx, cy, s, aci || 0), s);
    D(0, 0, 16, renk[0]);
    D(0, 1, 11, '#F4EDE0');
    D(0, 2, 6, renk[0]);
    for (let k = 0; k < 11; k++) {
      const a = Math.PI * (1.08 + (0.84 * k) / 10);
      I(Math.cos(a) * 6, Math.sin(a) * 6, Math.cos(a) * 25, Math.sin(a) * 25, 2.2);
    }
    I(0, 6, 0, 24, 5);
    D(0, 21, 6, '#4E7A3E');
    I(0, 17, 0, 32, 3.5);
    const R = 40 * s;
    ekle(T, cx - R, cy - R, cx + R, cy + R);
  }
  function sumbul(cx, cy, s, renk) {
    const T = new Tabaka();
    const { D, I } = yardimci(T, cerceve(cx, cy, s, 0), s);
    for (let i = 0; i < 11; i++) {
      const v = -36 + i * 6.6;
      const u = (i % 2 ? 1 : -1) * (4.6 - i * 0.12);
      D(u, v, 4.4, renk[i % 3 === 0 ? 1 : 0]);
      D(u, v + 0.6, 1.5, '#EEE9F4');
    }
    for (let i = 0; i < 11; i++) {
      const v = -36 + i * 6.6;
      const u = (i % 2 ? 1 : -1) * (4.6 - i * 0.12);
      I(u * 0.4, v - 2, u * 1.9, v + 5.5, 2.1);
    }
    const R = 44 * s;
    ekle(T, cx - R * 0.6, cy - R, cx + R * 0.6, cy + R * 0.9);
  }
  function papatya(cx, cy, s) {
    const T = new Tabaka();
    const { D, I } = yardimci(T, cerceve(cx, cy, s, 0), s);
    D(0, 0, 15, '#F6F1E4');
    D(0, 0, 5.5, '#D9A33A');
    D(0, 0, 2.2, '#9A5A24');
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2 + 0.13;
      I(Math.cos(a) * 24, Math.sin(a) * 24, Math.cos(a) * 7, Math.sin(a) * 7, 1.6);
    }
    const R = 22 * s;
    ekle(T, cx - R, cy - R, cx + R, cy + R);
  }
  // Yaprak: damla uç taraftan sapa doğru iğneyle sürüklenir; geride kalan boya sivri ucu oluşturur.
  function yaprak(x, y, L, aci, renk, dolgun) {
    const T = new Tabaka();
    const ux = x + Math.cos(aci) * L;
    const uy = y + Math.sin(aci) * L;
    const { D, I } = yardimci(T, cerceve(ux, uy, 1, aci + Math.PI), 1);
    const g = dolgun ? 1.15 : 1;
    D(L * 0.35, 0, L * 0.19 * g, renk[0]);
    D(L * 0.35, 0, L * 0.08 * g, renk[1]);
    I(L * 0.3, 0, L * 1.0, 0, L * 0.22 * g);
    I(L * 0.4, 0, 0, 0, L * 0.12);
    const R = L * 1.2;
    ekle(T, x - R, y - R, x + R, y + R);
  }
  function sap(pts, kalin) {
    const T = new Tabaka();
    let birikim = 0;
    T.damla(pts[0][0], pts[0][1], kalin, '#3F6B38');
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      const L = Math.hypot(x1 - x0, y1 - y0);
      for (let t = 0; t < L; t += 1) {
        birikim += 1;
        if (birikim >= kalin * 1.3) {
          birikim = 0;
          T.damla(x0 + ((x1 - x0) * t) / L, y0 + ((y1 - y0) * t) / L, kalin, i % 7 ? '#3F6B38' : '#56854A');
        }
      }
    }
    T.yol(pts, kalin * 1.2, 0.5);
    const xs = pts.map((p) => p[0]);
    const ys = pts.map((p) => p[1]);
    ekle(T, Math.min(...xs) - 12, Math.min(...ys) - 12, Math.max(...xs) + 12, Math.max(...ys) + 12);
  }
  const YESIL = [['#3E6E3A', '#6E9A55'], ['#4A7A3C', '#8AB06A'], ['#355F35', '#5E8C4C']];

  // yan dallar (SAHNE.bitki.saplar) ve yaprakları
  const B = S.bitki;
  B.saplar.forEach((s) => sap(s.slice(0, 25).map(([x, y]) => [x, Math.min(y, 1020)]), 2.6));
  B.yapraklar.slice(0, 36).forEach((y, i) => yaprak(y.x, y.y, y.uzunluk * 1.15, y.aci, YESIL[i % 3]));
  // dal uçlarında lale, yan tomurcuklarda gonca
  B.tomurcuklar.slice(0, 8).forEach((t, i) => {
    if (i % 2 === 0) lale(t.x, t.y - 8, 1.25, t.aci + Math.PI / 2, i % 4 === 0 ? KIRMIZI : GUL);
    else lale(t.x, t.y, 0.62, t.aci + Math.PI / 2, KIRMIZI);
  });
  B.cicekler.slice(0, 4).forEach((c) => papatya(c.x, c.y, 1.45));

  // ön plan: yaprak yelpazesi, saplar, çiçekler
  const on = B.cicekler.slice(4);
  B.yapraklar.slice(36).forEach((y, i) => {
    if (i % 2) return;
    yaprak(y.x, y.y, y.uzunluk * 1.05, y.aci, YESIL[i % 3], true);
  });
  const turler = [
    { tur: 'sumbul', s: 1.3 },
    { tur: 'papatya', s: 1.6 },
    { tur: 'lale', s: 1.15 },
    { tur: 'sumbul', s: 1.35 },
    { tur: 'karanfil', s: 2.2 },
    { tur: 'lale', s: 2.3 },
    { tur: 'papatya', s: 2.6 },
    { tur: 'karanfil', s: 1.9 },
    { tur: 'lale', s: 2.6 },
  ];
  on.forEach((c, i) => {
    const s = turler[i].s;
    sap([[c.x, c.y + 14 * s], [c.x + (i % 2 ? 6 : -6), (c.y + 1024) / 2 + 20], [c.x + (i % 2 ? 2 : -2), 1030]], 2.8);
  });
  on.forEach((c, i) => {
    const { tur, s } = turler[i];
    if (tur === 'lale') lale(c.x, c.y - 6, s, 0, i === 5 ? GUL : KIRMIZI);
    else if (tur === 'karanfil') karanfil(c.x, c.y, s, 0, ['#B8342A']);
    else if (tur === 'papatya') papatya(c.x, c.y, s);
    else sumbul(c.x, c.y, s, ['#4A4E98', '#7D86C8']);
  });
  B.tomurcuklar.slice(8).forEach((t, i) => (i % 2 ? sumbul(t.x, t.y - 6, 0.75, ['#5A4A96', '#8A82C4']) : lale(t.x, t.y, 0.6, 0, KIRMIZI)));

  zaman('cicek-once');
  // çiçek tabakalarını çiz (kendi kutularında, saydam zeminle)
  for (const { T, kutu } of CIZ) {
    const [x0, y0, x1, y1] = kutu;
    if (x1 <= x0 || y1 <= y0) continue;
    const bx0 = x0 * K;
    const by0 = y0 * K;
    const bw = (x1 - x0) * K;
    const bh = (y1 - y0) * K;
    // etki ızgarası: damla ve iğne izlerinden uzak noktalar hiç hesaplanmaz
    const H = 4;
    const gw = Math.ceil((x1 - x0) / H) + 1;
    const gh = Math.ceil((y1 - y0) / H) + 1;
    const izgara = new Uint8Array(gw * gh);
    const isaretle = (x, y, R) => {
      const i0 = Math.max(0, Math.floor((x - R - x0) / H));
      const i1 = Math.min(gw - 1, Math.floor((x + R - x0) / H));
      const j0 = Math.max(0, Math.floor((y - R - y0) / H));
      const j1 = Math.min(gh - 1, Math.floor((y + R - y0) / H));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) izgara[j * gw + i] = 1;
    };
    for (let k = 0; k < T.n; k++) {
      const b = k * ADIM;
      if (T.F[b] === 0) isaretle(T.F[b + 1], T.F[b + 2], Math.sqrt(T.F[b + 3]) * 1.6 + 3);
      else if (T.F[b] === 2) isaretle(T.F[b + 1], T.F[b + 2], Math.sqrt(1 / T.F[b + 5]) * 1.8 + 3);
    }
    const on = (x, y) => izgara[Math.floor((y - y0) / H) * gw + Math.floor((x - x0) / H)] === 1;
    const img = ctx.getImageData(bx0, by0, bw, bh);
    const h = hesapla(T, bx0, by0, bw, bh, null, null, on);
    boyaKutuya(T, img, bw, bx0, by0, bx0, by0, bw, bh, h, true, 0.74, 0.15);
    ctx.putImageData(img, bx0, by0);
  }

  // ------------------------------------------------------------ 10) kâğıt: hafif lif dokusu
  {
    const c = S.yeniTuval(1024, 1024);
    const k = c.getContext('2d');
    const id = k.createImageData(1024, 1024);
    const g = gurultu(5, 1.5);
    const g2 = gurultu(6, 40);
    for (let i = 0; i < 1024 * 1024; i++) {
      const x = i % 1024;
      const y = (i / 1024) | 0;
      const v = 0.6 * g(x * 0.6, y * 2.2) + 0.4 * g2(x, y);
      id.data[i * 4] = 90;
      id.data[i * 4 + 1] = 70;
      id.data[i * 4 + 2] = 40;
      id.data[i * 4 + 3] = Math.round(v * 18);
    }
    k.putImageData(id, 0, 0);
    ctx.drawImage(c, 0, 0, W, W);
  }

  SAHNE.hazir();
</script>
