<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-224 Osmanlı Natüralist Çiçek Resmi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #FAF6EC; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ================================================================ ortak el yardımcıları (j5)
  const S = SAHNE;
  const N = 2048; // iç çözünürlük (koordinatlar 1024'te kalır)
  const NN = N * N;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);
  H.kutu = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const M = 256;
    const tab = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * M + x0];
      const b = tab[y0 * M + x1];
      const c = tab[y1 * M + x0];
      const d = tab[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  /** Vuruşlar için ortak gürültü havuzu: her vuruşta yeni tablo kurmamak için tohuma göre kaydırılmış paylaşılan tablolar. */
  H._havuz = [];
  H.nz = function (seed) {
    const j = Math.abs(seed | 0) % 8;
    if (!H._havuz[j]) H._havuz[j] = H.noise(9001 + j * 31);
    const f = H._havuz[j];
    const ox = ((seed * 37.17) % 256 + 256) % 256;
    const oy = ((seed * 91.73) % 256 + 256) % 256;
    return (x, y) => f(x + ox, y + oy);
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed, L}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Nokta dizisini eşit aralıklı yeniden örnekler. */
  H.resample = function (pts, step) {
    const out = [pts[0]];
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      let seg = Math.hypot(x1 - x0, y1 - y0);
      while (acc + seg >= step) {
        const t = (step - acc) / seg;
        x0 = x0 + (x1 - x0) * t;
        y0 = y0 + (y1 - y0) * t;
        out.push([x0, y0]);
        seg = Math.hypot(x1 - x0, y1 - y0);
        acc = 0;
      }
      acc += seg;
    }
    const last = pts[pts.length - 1];
    const lo = out[out.length - 1];
    if (Math.hypot(last[0] - lo[0], last[1] - lo[1]) > step * 0.3) out.push(last);
    return out;
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    if (!amp) return pts;
    const n = H.nz(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step, plen
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.nz(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? (o.ctaper || 0) : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      const wf = o.wf;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (wf) w *= wf(t, pts[i]);
        if (taper > 0) {
          if (t < taper) w *= 0.25 + 0.75 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.25 + 0.75 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Elle doldurma sınırı: yol titrek bir çokgene çevrilir (boya çizgiye tam oturmaz). */
  H.elYolu = function (d, amp, seed, wl) {
    const p = new Path2D();
    let k = 0;
    for (const sp of H.flatten(d, 1.5)) {
      const pts = sp.closed ? sp.pts.concat([sp.pts[0]]) : sp.pts;
      const w = H.wobble(pts, amp, wl || 18, (seed || 5) + k++ * 11);
      w.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      p.closePath();
    }
    return p;
  };

  /** Ekran dışı katman (2048, koordinat 1024). */
  H.katman = function () {
    const c = S.yeniTuval(N, N);
    const k = c.getContext('2d', { willReadFrequently: true });
    k.setTransform(2, 0, 0, 2, 0, 0);
    k.lineCap = 'round';
    k.lineJoin = 'round';
    return { c, k };
  };
  /** Katmanın bulanık alfa kopyası (Uint8ClampedArray, 2048²·4). */
  H.bulanik = function (c, px) {
    const b = S.yeniTuval(N, N);
    const k = b.getContext('2d', { willReadFrequently: true });
    k.filter = `blur(${px}px)`;
    k.drawImage(c, 0, 0);
    return k.getImageData(0, 0, N, N).data;
  };

  // ---------------------------------------------------------------- kubbe ve silindir ışığı
  H.kubbeP = S.kubbeProfili(400);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };
  H.ISIK = (() => {
    const v = [0.62, -0.5, 0.6]; // sağ, yukarı (ekranda -y), öne
    const l = Math.hypot(v[0], v[1], v[2]);
    return v.map((q) => q / l);
  })();
  /** Kubbe yüzeyinde (x, y) noktasının aydınlanması 0..1 ve normali. */
  H.kubbeIsik = function (x, y) {
    const r = Math.max(1, H.kubbeR(y));
    const u = H.clamp((x - 560) / r, -1, 1);
    const dy = 1.5;
    const dr = (H.kubbeR(y - dy) - H.kubbeR(y + dy)) / (2 * dy); // yükseldikçe yarıçap değişimi (negatif)
    let nr = 1;
    let nh = -dr; // yukarı bileşen
    const l = Math.hypot(nr, nh);
    nr /= l;
    nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u;
    const ny = -nh; // ekran y aşağı
    const nz = nr * c;
    return H.clamp(nx * H.ISIK[0] + ny * H.ISIK[1] + nz * H.ISIK[2], 0, 1);
  };
  /** Dikey silindir aydınlanması (u: -1 sol kenar, 1 sağ kenar). */
  H.silindirIsik = function (u) {
    u = H.clamp(u, -1, 1);
    const l = Math.hypot(H.ISIK[0], H.ISIK[2]);
    return H.clamp((u * H.ISIK[0] + Math.sqrt(1 - u * u) * H.ISIK[2]) / l, 0, 1);
  };

  // ---------------------------------------------------------------- fırça izleri
  /**
   * Fırça vuruşu: pts boyunca şerit; başta basınçla açılır, sonda incelir.
   * o: w, color (css), bas (0–0.5), uc (0–0.5), jit (genişlik oynaması), seed, amp, wl
   */
  H.firca = function (ctx, pts, o) {
    if (pts.length < 2) return;
    const seed = o.seed || 1;
    const p2 = o.amp ? H.wobble(pts, o.amp, o.wl || 40, seed) : pts;
    const nz = H.nz(seed * 3 + 7);
    const bas = o.bas === undefined ? 0.12 : o.bas;
    const uc = o.uc === undefined ? 0.3 : o.uc;
    const jit = o.jit === undefined ? 0.2 : o.jit;
    if (o.color) ctx.fillStyle = o.color;
    H.ribbon(ctx, p2, (t, i) => {
      let w = o.w * (1 - jit * 0.5 + jit * 0.5 * nz(i * 0.09, 3.3));
      if (bas > 0 && t < bas) w *= 0.45 + 0.55 * Math.sin(((t / bas) * Math.PI) / 2);
      if (uc > 0 && t > 1 - uc) w *= Math.pow(Math.max(0, (1 - t) / uc), 0.7);
      return Math.max(0.05, w);
    });
  };
  /** Yön alanını izleyen vuruş noktaları: aci(x, y) radyan. */
  H.akis = function (x, y, len, aci, step, yonIsareti) {
    step = step || 3;
    const pts = [[x, y]];
    let px = x;
    let py = y;
    let pa = aci(x, y);
    const sg = yonIsareti || 1;
    for (let s = 0; s < len; s += step) {
      let a = aci(px, py);
      // yön sıçramasın (çizgi alanları için π belirsizliği)
      if (Math.cos(a - pa) < 0) a += Math.PI;
      px += Math.cos(a) * step * sg;
      py += Math.sin(a) * step * sg;
      pa = a;
      pts.push([px, py]);
    }
    return pts;
  };
  /**
   * Bir alanı fırça vuruşlarıyla doldurur.
   * o: box [x0,y0,x1,y1], ara (vuruş merkezleri arası), uzun [a,b], gen [a,b], aci(x,y), renk(x,y,r) → css,
   *    alfa [a,b] (renk css içinde değilse globalAlpha), seed, bas, uc, jit, amp, kirp (Path2D), yogun(x,y) 0..1
   */
  H.vurusDoldur = function (ctx, o) {
    const r = S.rng(o.seed || 11);
    const [x0, y0, x1, y1] = o.box;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    const ara = o.ara;
    const liste = [];
    for (let y = y0 - ara; y < y1 + ara; y += ara * (0.8 + r() * 0.4)) {
      for (let x = x0 - ara + r() * ara; x < x1 + ara; x += ara * (0.7 + r() * 0.6)) {
        liste.push([x + (r() - 0.5) * ara, y + (r() - 0.5) * ara, r()]);
      }
    }
    // karıştır: vuruş sırası rastgele
    for (let i = liste.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = liste[i];
      liste[i] = liste[j];
      liste[j] = t;
    }
    let k = 0;
    for (const [x, y, q] of liste) {
      if (o.yogun && r() > o.yogun(x, y)) continue;
      const L = o.uzun[0] + r() * (o.uzun[1] - o.uzun[0]);
      const W = o.gen[0] + r() * (o.gen[1] - o.gen[0]);
      const ters = r() < 0.5 ? 1 : -1;
      // vuruş merkezden başlasın: geriye yarım boy
      const geri = H.akis(x, y, L / 2, o.aci, 3, -ters);
      const ileri = H.akis(x, y, L / 2, o.aci, 3, ters);
      const pts = geri.reverse().concat(ileri.slice(1));
      ctx.globalAlpha = o.alfa ? o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]) : 1;
      H.firca(ctx, pts, { w: W, color: o.renk(x, y, q, r), bas: o.bas, uc: o.uc, jit: o.jit, seed: (o.seed || 11) * 1000 + k, amp: o.amp, wl: o.wl });
      k++;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return k;
  };

  /**
   * Tarama (hatching): açı aci ile paralel çizgiler; f(x, y) ≥ eşik olan yerlerde çizgi parçası çizilir.
   * Her çizginin kendi eşiği vardır: yoğunluk f ile artar. o: box, ara, aci (sabit ya da fonksiyon değil), f, w, color,
   * kirp (Path2D), seed, amp, egri (çizgi bükümü), minL, taper
   */
  H.tara = function (ctx, o) {
    const [x0, y0, x1, y1] = o.box;
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    const R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
    const ca = Math.cos(o.aci);
    const sa = Math.sin(o.aci);
    const r = S.rng(o.seed || 3);
    const adim = 1.5;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    ctx.fillStyle = o.color;
    let i = 0;
    for (let v = -R; v <= R; v += o.ara * (0.85 + r() * 0.3), i++) {
      const esik = ((i * 0.6180339) % 1) * (o.esikMax || 0.92) + 0.04;
      let seg = [];
      const bitir = () => {
        if (seg.length * adim >= (o.minL || 4)) {
          const pts = o.amp ? H.wobble(seg, o.amp, 30, (o.seed || 3) * 100 + i) : seg;
          H.pen(ctx, [{ pts, closed: false }], { w: o.w * (0.8 + r() * 0.4), amp: 0, press: 0.3, taper: o.taper === undefined ? 0.3 : o.taper, seed: i + 1 });
        }
        seg = [];
      };
      for (let u = -R; u <= R; u += adim) {
        const bend = o.egri ? o.egri * Math.sin((u / R) * Math.PI * 0.5) : 0;
        const x = cx + u * ca - (v + bend) * sa;
        const y = cy + u * sa + (v + bend) * ca;
        if (x < x0 - 2 || x > x1 + 2 || y < y0 - 2 || y > y1 + 2) {
          bitir();
          continue;
        }
        if (o.f(x, y) >= esik) seg.push([x, y]);
        else bitir();
      }
      bitir();
    }
    ctx.restore();
  };

  /** Kâğıt dokusu yüksekliği (2048², 0..1): ince lif + orta benek. */
  H.kagitDoku = function (seed, ince, orta) {
    const n1 = H.noise(seed);
    const n2 = H.noise(seed + 1);
    const n3 = H.noise(seed + 2);
    const out = new Float32Array(NN);
    ince = ince || 3.2;
    orta = orta || 40;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        // lifler: yatay uzatılmış ince gürültü + orta benek
        const v = 0.45 * n1(x / ince, y / (ince * 0.55)) + 0.3 * n1(x / (ince * 2.3) + 50, y / (ince * 1.1) + 20) + 0.25 * n2(x / orta, y / orta) + 0.12 * n3(x / 1.4, y / 1.4);
        out[y * N + x] = 0.5 + 0.5 * v;
      }
    }
    return out;
  };

  /** Yaprak biçimi (sivri uçlu, kenarı kavisli): sap (x,y), yön aci, boy L, en W. Nokta dizisi döner. */
  H.yaprakNoktalari = function (x, y, aci, L, W, egri, n) {
    n = n || 18;
    egri = egri || 0;
    const ca = Math.cos(aci);
    const sa = Math.sin(aci);
    const sol = [];
    const sag = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const w = W * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * 0.5;
      const b = egri * L * Math.sin(Math.PI * t) * 0.18;
      const u = t * L;
      sol.push([x + u * ca - (b - w) * sa, y + u * sa + (b - w) * ca]);
      sag.push([x + u * ca - (b + w) * sa, y + u * sa + (b + w) * ca]);
    }
    return sol.concat(sag.reverse().slice(1));
  };
  /** Bir sapı ya da çizgiyi sabit adımla nokta dizisi olarak bükerek uzatır. */
  H.kavis = function (x0, y0, x1, y1, bukum, n) {
    n = n || 24;
    const dx = x1 - x0;
    const dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L;
    const ny = dx / L;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const b = bukum * Math.sin(Math.PI * t);
      pts.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]);
    }
    return pts;
  };

  // ================================================================ S-224 Osmanlı Natüralist Çiçek Resmi
  // Hayalî bir 18. yüzyıl Osmanlı çiçek ressamının eli: perdahlı kâğıt üstüne guaş; ince fırçayla
  // "pardaz": her taç yaprağı ve yaprak, yönünü izleyen sayısız ince vuruşla, koyudan açığa modellenir.
  // Çiçekler (allı güller, alacalı laleler, mavi sümbüller, beyaz güller, karanfiller) resmin yıldızıdır;
  // mimari daha sade, yumuşak gölgeli düzlemler hâlinde ve yine ince vuruşlarla boyanır.
  const tuval = document.getElementById('tuval');
  tuval.width = N;
  tuval.height = N;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let tohum = 900;
  const T = () => tohum++;
  const hx = H.hex;
  const rgb = (c, v) => H.rgba(c.map((q) => H.clamp(q * (1 + (v || 0)), 0, 255)));
  const elYol = (d, amp) => (typeof d === 'string' ? H.elYolu(d, amp === undefined ? 0.5 : amp, T(), 14) : d);
  const doldur = (d, renk, amp) => {
    const p = elYol(d, amp);
    ctx.fillStyle = renk;
    ctx.fill(p);
    return p;
  };
  const cizgi = (d, w, renk, o) => {
    o = o || {};
    H.pen(ctx, typeof d === 'string' ? d : [{ pts: d, closed: !!o.kapali }], {
      w,
      color: renk,
      amp: o.amp === undefined ? 0.3 : o.amp,
      wl: 20,
      seed: T(),
      press: o.press === undefined ? 0.45 : o.press,
      taper: o.taper === undefined ? 0.15 : o.taper,
      ctaper: 0,
      step: 1,
    });
  };
  /** ince vuruşlarla alan boyama (pardaz) */
  function pardaz(kirp, box, o) {
    return H.vurusDoldur(ctx, {
      box,
      ara: o.ara || 5,
      uzun: o.uzun || [20, 50],
      gen: o.gen || [2.6, 4.2],
      aci: o.aci || (() => 0),
      renk: (x, y, q, r) => rgb(o.renk(x, y, r), (r() - 0.5) * (o.oyna === undefined ? 0.08 : o.oyna)),
      alfa: o.alfa || [0.55, 0.85],
      kirp,
      seed: T(),
      bas: 0.2,
      uc: 0.5,
      jit: 0.3,
      amp: o.amp === undefined ? 0.4 : o.amp,
      wl: 30,
      yogun: o.yogun,
    });
  }

  /**
   * Bükümlü "loft" biçim: omurga S(t), genişlik w(t). Taç yaprağı ve yaprakların ortak iskeleti.
   * spine: [[x,y]...] (taban → uç), wf(t) yarı genişlik. Döner: {L, R, kont, S, n}
   */
  function loft(spine, wf) {
    const n = spine.length;
    const L = [];
    const R = [];
    const Nn = [];
    for (let i = 0; i < n; i++) {
      const a = spine[Math.max(0, i - 1)];
      const b = spine[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wf(i / (n - 1));
      Nn.push([-ty, tx]);
      L.push([spine[i][0] - ty * w, spine[i][1] + tx * w]);
      R.push([spine[i][0] + ty * w, spine[i][1] - tx * w]);
    }
    return { L, R, kont: L.concat(R.slice().reverse()), S: spine, Nn, wf };
  }
  const egriOmurga = (x, y, aci, L, buk, n) => {
    n = n || 20;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const a = aci + buk * t;
      // eğri: yön boyunca bükülen yay
      if (i === 0) pts.push([x, y]);
      else {
        const p = pts[i - 1];
        pts.push([p[0] + Math.cos(a) * (L / n), p[1] + Math.sin(a) * (L / n)]);
      }
    }
    return pts;
  };
  /**
   * Loft biçimini pardazla boyar: v ∈ [-1,1] boyunca omurgaya paralel ince vuruşlar.
   * renk(t, v, r) → [r,g,b]; o: adet, w, alfa, t0
   */
  function loftBoya(lf, taban, renk, o) {
    o = o || {};
    const yol = H.polyPath(H.wobble(lf.kont.concat([lf.kont[0]]), o.amp === undefined ? 0.25 : o.amp, 10, T()), true);
    ctx.fillStyle = rgb(taban);
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    const rr = S.rng(T());
    const n = lf.S.length;
    const adet = o.adet || 18;
    for (let k = 0; k < adet * 2; k++) {
      const v = -1 + 2 * rr();
      const t0 = (o.t0 || 0) + rr() * 0.25;
      const t1 = Math.min(1, t0 + 0.45 + rr() * 0.55);
      const pts = [];
      for (let i = Math.floor(t0 * (n - 1)); i <= Math.ceil(t1 * (n - 1)); i++) {
        const t = i / (n - 1);
        const w = lf.wf(t) * v * 0.98;
        pts.push([lf.S[i][0] + lf.Nn[i][0] * w, lf.S[i][1] + lf.Nn[i][1] * w]);
      }
      if (pts.length < 2) continue;
      const tm = (t0 + t1) / 2;
      ctx.globalAlpha = (o.alfa || 0.6) * (0.7 + 0.5 * rr());
      H.firca(ctx, pts, { w: (o.w || 1.8) * (0.7 + 0.6 * rr()), color: rgb(renk(tm, v, rr), (rr() - 0.5) * 0.06), bas: 0.2, uc: 0.5, jit: 0.3, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    return yol;
  }

  // ================================================================ GÖK: açık gün mavisi, ince yatay vuruşlar; ufka doğru açılır
  const GOK_UST = hx('#8DBDE6');
  const GOK_ALT = hx('#E2EEF5');
  const gokRenk = (y) => H.mix(GOK_UST, GOK_ALT, H.smooth(80, 800, y) * 0.92);
  {
    for (let y = 0; y < 820; y += 30) {
      ctx.fillStyle = rgb(gokRenk(y + 15));
      ctx.fillRect(-5, y, 1034, 32);
    }
    const ny = H.noise(2244);
    // ressam göğü kısa, yönlü vuruşlarla döşer: vuruşlar 8–14 px, fırçadan fırçaya bir ton açık ya da koyu;
    // küçük öbekler hâlinde hafifçe eğilir; ufka doğru açılır
    pardaz(null, [0, 0, 1024, 812], {
      ara: 8,
      uzun: [60, 115],
      gen: [9, 13],
      aci: (x, y) => -0.2 + 0.12 * ny(x / 160, y / 160),
      renk: (x, y) => gokRenk(y).map((q) => q * (1 + 0.04 * ny(x / 60 + 30, y / 30 + 11))),
      alfa: [0.65, 0.92],
      oyna: 0.17,
      amp: 0.5,
    });
  }
  // ---- güneş: soluk sarı-beyaz teker; kenarı elle, içi dairesel kısa vuruşlarla
  {
    const gx = 880;
    const gy = 140;
    const rr = S.rng(2241);
    // elle çizilmiş kenar: tam daire değil, hafifçe düzensiz kapalı eğri (dikişsiz, periyodik sapma)
    const gPts = [];
    for (let i = 0; i < 96; i++) {
      const th = (i / 96) * Math.PI * 2;
      const r = 27 + 0.7 * Math.sin(2 * th + 0.7) + 0.55 * Math.sin(3 * th + 2.1) + 0.35 * Math.sin(5 * th + 4.0);
      gPts.push([gx + r * Math.cos(th), gy + r * Math.sin(th)]);
    }
    const gyol = H.polyPath(gPts, true);
    ctx.fillStyle = '#FBF2D2';
    ctx.fill(gyol);
    ctx.save();
    ctx.clip(gyol);
    // kısa, hafif kavisli, örtücü vuruşlar; yönleri göğün fırça yönüne yakın ama birbirinden farklı;
    // ortası ve sağ üstü daha beyaz, kenarı soluk sarı (bantlaşma ya da girdap olmasın)
    for (let i = 0; i < 44; i++) {
      const rad = Math.sqrt(rr()) * 24;
      const th = rr() * Math.PI * 2;
      const px = gx + rad * Math.cos(th);
      const py = gy + rad * Math.sin(th);
      const a = -0.35 + (rr() - 0.5) * 0.9;
      const L = 8 + rr() * 9;
      const bk = (rr() - 0.5) * 2.5;
      const pts = [[px - (Math.cos(a) * L) / 2, py - (Math.sin(a) * L) / 2], [px - Math.sin(a) * bk, py + Math.cos(a) * bk], [px + (Math.cos(a) * L) / 2, py + (Math.sin(a) * L) / 2]];
      const ust = (Math.cos(th) * 0.6 - Math.sin(th) * 0.8) * (rad / 24);
      const q = rr() + rad / 60 - ust * 0.25;
      const c = q < 0.45 ? '#FFFDF2' : q < 0.8 ? '#FDF5D9' : '#F7EAC0';
      ctx.globalAlpha = 0.6 + rr() * 0.35;
      H.firca(ctx, pts, { w: 3 + rr() * 2.4, color: c, bas: 0.3, uc: 0.5, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    cizgi(gPts, 0.9, 'rgba(214,186,112,0.55)', { amp: 0.6, taper: 0, kapali: true, press: 0.6 });
  }
  // ---- bulutlar: birkaç yuvarlak öbekten kurulan, örtücü beyaz vuruş kümeleri; kenarları vuruş uçlarıyla
  // tüylenir; tabanı daha düz ve serin gri-mavi gölgeli (kesik değil, yatay vuruşlarla biter)
  function bulut(cx, cy, L, s) {
    const rr = S.rng(Math.floor(cx * 7 + cy));
    const nl = 5 + Math.floor(rr() * 3);
    const lob = [];
    for (let i = 0; i < nl; i++) {
      const u = -0.86 + (1.72 * i) / (nl - 1) + (rr() - 0.5) * 0.16;
      const rx = L * (0.11 + 0.08 * rr()) * (1 - 0.3 * Math.abs(u));
      lob.push({ x: cx + u * L * 0.42, y: cy - s * (3 + 12 * (1 - u * u) * (0.5 + 0.7 * rr())), r: rx * (0.85 + 0.35 * (1 - Math.abs(u))) });
    }
    const tny = H.nz(Math.floor(cx * 3 + 11));
    const tabanF = (x) => cy + s * 7 + s * 4 * tny(x / 28, 3.3) - s * 6 * Math.pow((x - cx) / (L * 0.7), 2);
    const taban = cy + s * 7;
    const yog = (x, y) => {
      let m = 0;
      for (const b of lob) {
        const dx = (x - b.x) / b.r;
        const dy = (y - b.y) / (b.r * 0.66);
        m = Math.max(m, 1 - (dx * dx + dy * dy));
      }
      const tb = tabanF(x);
      return m * H.smooth(tb + 5 * s, tb - 8 * s, y);
    };
    const ny = H.nz(Math.floor(cx + cy));
    const x0 = cx - L * 0.75;
    const x1 = cx + L * 0.75;
    const y0 = cy - s * 60;
    const y1 = taban + 10;
    const liste = [];
    for (let y = y0; y < y1; y += 6) {
      for (let x = x0 + rr() * 6; x < x1; x += 7 + rr() * 4) {
        const d = yog(x, y);
        if (d <= 0.03) continue;
        if (rr() > H.smooth(0.03, 0.28, d)) continue;
        liste.push([x + (rr() - 0.5) * 5, y + (rr() - 0.5) * 4, d]);
      }
    }
    // önce gölgeli (alt, sol) vuruşlar, sonra ışıklı beyazlar üstüne; tonlar sürekli değil, ressamın
    // karıştırdığı dört basamaktan seçilir, böylece örtücü vuruşlar birbirinden ayrılır
    const tonu = (x, y, d) => {
      const alt = H.smooth(taban - 26 * s, taban - 2 * s, y);
      const sol = H.clamp((cx - x) / L, -0.5, 0.5);
      // öbeklerin hacmi: dışa bakan yüzü sağ üste dönük kenarlar ışıkta, sol alta dönükler gölgede
      const e = 2;
      const gx = yog(x + e, y) - yog(x - e, y);
      const gy = yog(x, y + e) - yog(x, y - e);
      const gl = Math.hypot(gx, gy) || 1;
      const isik = (-gx / gl) * 0.55 + (gy / gl) * 0.83;
      return H.clamp(0.2 + alt * 0.85 + sol * 0.35 - isik * 0.35 * (1 - d) - d * 0.25 + 0.16 * ny(x / 24, y / 18), 0, 1);
    };
    const TON = [hx('#FFFFFF'), hx('#EEF3F7'), hx('#D6E1EC'), hx('#BCCCDF')];
    const sec = liste.map(([x, y, d]) => {
      const f = tonu(x, y, d) * 3.3 + (rr() - 0.5) * 0.9;
      return [x, y, d, H.clamp(Math.round(f), 0, 3)];
    });
    sec.sort((p, q) => q[3] - p[3]);
    for (const [x, y, d, ti] of sec) {
      const c = TON[ti];
      // yön: altta yataya yakın; üstte öbeğin yuvarlağını izler
      const e = 1.5;
      const gx = yog(x + e, y) - yog(x - e, y);
      const gy = yog(x, y + e) - yog(x, y - e);
      const tan = Math.atan2(gx, -gy);
      const altY = H.smooth(taban - 18 * s, taban - 4 * s, y);
      let a = d < 0.4 && altY < 0.5 ? tan + (rr() - 0.5) * 0.3 : -0.1 + 0.25 * ny(x / 40, y / 40) + (rr() - 0.5) * 0.2;
      if (Math.cos(a) < 0) a += Math.PI;
      const kenar = d < 0.25;
      const L2 = (kenar ? 12 : 20) + rr() * (kenar ? 10 : 22);
      const bk = (rr() - 0.5) * 3;
      ctx.globalAlpha = (0.8 + 0.2 * rr()) * (kenar ? 0.85 : 1);
      H.firca(ctx, [[x - (Math.cos(a) * L2) / 2, y - (Math.sin(a) * L2) / 2], [x - Math.sin(a) * bk, y + Math.cos(a) * bk], [x + (Math.cos(a) * L2) / 2, y + (Math.sin(a) * L2) / 2]], { w: (kenar ? 5 : 7.5) + rr() * 4, color: rgb(c, (rr() - 0.5) * 0.02), bas: 0.4, uc: 0.6, jit: 0.35, seed: T() });
    }
    ctx.globalAlpha = 1;
  }
  bulut(180, 248, 230, 1.15);
  bulut(512, 140, 190, 1.0);
  bulut(790, 320, 220, 1.15);
  bulut(942, 468, 120, 0.8);

  // ================================================================ YER: açık çayır; dipten yukarı çekilmiş, ucu incelen çimen vuruşları
  {
    const yer = H.kutu(-5, 799, 1029, 1029);
    doldur(yer, '#E4E4C4', 0.4);
    const ng = H.noise(2245);
    // geniş, yumuşak alt boya lekeleri: yer yer daha yeşil, yer yer daha açık (düz bir zemin olmasın)
    pardaz(null, [0, 798, 1024, 1024], {
      ara: 14,
      uzun: [40, 80],
      gen: [12, 18],
      aci: () => -0.08,
      renk: (x, y) => H.mix(hx('#E6E6C3'), hx('#B9CB90'), H.clamp(0.3 + 0.75 * ng(x / 80, y / 45) + H.smooth(820, 1010, y) * 0.35, 0, 1)),
      alfa: [0.5, 0.75],
      oyna: 0.06,
      amp: 0.8,
    });
    // çimen: her vuruş dipten yukarı çekilir (basınçla başlar, ucu incelir); tonlar açık krem, orta ve
    // serin yeşil arasında belirgin değişir
    const rr = S.rng(2246);
    const liste = [];
    for (let y = 800; y < 1036; y += 5.2) {
      for (let x = -6 + rr() * 6; x < 1030; x += 5.5 + rr() * 4) liste.push([x + (rr() - 0.5) * 4, y + (rr() - 0.5) * 4]);
    }
    for (let i = liste.length - 1; i > 0; i--) {
      const j = Math.floor(rr() * (i + 1));
      const t = liste[i];
      liste[i] = liste[j];
      liste[j] = t;
    }
    const KREM = hx('#EFECCB');
    const ACIK = hx('#D3DAA5');
    const ORTA = hx('#B3C88D');
    const SERIN = hx('#8FB27C');
    for (const [x, y] of liste) {
      const derinlik = H.smooth(805, 1010, y);
      const q = rr();
      const g = 0.5 + 0.5 * ng(x / 70 + 20, y / 40 + 7);
      let c;
      if (q < 0.2 - derinlik * 0.08) c = KREM;
      else if (q < 0.55) c = H.mix(ACIK, ORTA, g * 0.6);
      else if (q < 0.88) c = H.mix(ORTA, SERIN, derinlik * 0.6 + g * 0.3);
      else c = H.mix(SERIN, hx('#6F9A66'), derinlik * 0.7);
      const L = (14 + rr() * 22) * (0.75 + derinlik * 0.5);
      const a = -Math.PI / 2 + 0.28 * ng(x / 50, y / 30) + (rr() - 0.5) * 0.35;
      const bk = (rr() - 0.5) * 0.5;
      const pts = [];
      for (let k = 0; k <= 6; k++) {
        const t = k / 6;
        const aa = a + bk * t;
        pts.push([x + Math.cos(aa) * L * t, y + Math.sin(aa) * L * t]);
      }
      ctx.globalAlpha = 0.62 + rr() * 0.33;
      H.firca(ctx, pts, { w: (3.2 + rr() * 2.6) * (0.85 + derinlik * 0.35), color: rgb(c, (rr() - 0.5) * 0.08), bas: 0.04, uc: 0.75, jit: 0.25, seed: T() });
    }
    ctx.globalAlpha = 1;
  }

  // ================================================================ YAPI: sade, yumuşak gölgeli düzlemler, ince vuruşlar
  const MP = S.minareParcalari();
  const TAS = hx('#F4EFE3');
  const TAS_ACIK = hx('#FCFAF3');
  const TAS_GOLGE = hx('#C6CBCF');
  const silRenk = (u, acik, orta, golge) => {
    const l = H.silindirIsik(u);
    return l > 0.75 ? H.mix(orta, acik, H.smooth(0.75, 0.95, l)) : H.mix(golge, orta, H.smooth(0.2, 0.75, l));
  };
  const kont = 'rgba(110,96,80,0.7)';
  {
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      let d;
      let x1;
      let x2;
      let y1;
      let y2;
      if (p.tip === 'poligon') {
        d = S.yol(p.noktalar, true);
        const xs = p.noktalar.map((q) => q[0]);
        const ys = p.noktalar.map((q) => q[1]);
        x1 = Math.min(...xs);
        x2 = Math.max(...xs);
        y1 = Math.min(...ys);
        y2 = Math.max(...ys);
      } else if (p.tip === 'korkuluk') {
        d = H.kutu(p.x1, p.y1, p.x2, p.y2);
        x1 = p.x1;
        x2 = p.x2;
        y1 = p.y1;
        y2 = p.y2;
      } else {
        d = p.yol;
        x1 = 266;
        x2 = 334;
        y1 = 146;
        y2 = 200;
      }
      const yol = doldur(d, rgb(TAS), 0.3);
      const yatay = p.ad.startsWith('şerefe') || p.ad.startsWith('çıkma') || p.ad === 'bilezik';
      pardaz(yol, [x1, y1, x2, y2], {
        ara: 3.8,
        uzun: yatay ? [16, 34] : [22, 50],
        gen: [3.6, 5.4],
        aci: () => (yatay ? 0 : Math.PI / 2),
        renk: (x) => silRenk(((x - x1) / (x2 - x1)) * 2 - 1, TAS_ACIK, TAS, TAS_GOLGE),
        alfa: [0.6, 0.9],
        oyna: 0.12,
        amp: 0.2,
      });
    }
    // zikzak: soluk mavi ve gül
    S.zikzakCizgileri().forEach((z, i) => {
      const alt = z.map(([x, y]) => [x, y + 5.5]);
      ctx.fillStyle = i === 1 ? 'rgba(120,150,200,0.8)' : 'rgba(200,120,130,0.8)';
      ctx.fill(H.polyPath(z.concat(alt.slice().reverse()), true));
    });
    for (const ad of ['korkuluk-1', 'korkuluk-2']) {
      const p = MP.find((q) => q.ad === ad);
      const adet = ad === 'korkuluk-1' ? 11 : 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + ((p.x2 - p.x1) * (i + 0.5)) / adet;
        H.firca(ctx, [[x, p.y1 + 4], [x, p.y2 - 2]], { w: 2.2, color: 'rgba(160,148,132,0.8)', bas: 0.1, uc: 0.2, seed: T() });
      }
    }
    for (const w of S.minarePencereleri) {
      const d = S.kemerYolu(w.x, w.y, w.w, w.h);
      doldur(d, '#7B858C', 0.3);
      cizgi(d, 0.7, kont, { taper: 0 });
    }
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      if (p.tip === 'poligon') cizgi(S.yol(p.noktalar, true), 0.9, kont, { taper: 0 });
      else if (p.tip === 'korkuluk') cizgi(H.kutu(p.x1, p.y1, p.x2, p.y2), 0.8, kont, { taper: 0 });
      else cizgi(p.yol, 0.9, kont, { taper: 0 });
    }
  }
  {
    const K = S.kaide;
    const govde = H.kutu(K.x1, K.y1, K.x2, K.y2);
    const yol = doldur(govde, rgb(TAS), 0.3);
    // beyaz duvar: yatay, örtücü vuruşlar; üç karışık tondan (ışık, orta, serin gölge) seçilir; kornişin altında
    // ve sol yanda serin gölge, sağa doğru ışık

  /**

   * ve en içte sarmal tomurcuk. Her taç düz bir taban renkle örtülür; sonra dipten uca uzanan ince pardaz
   * vuruşları (ışığa, derinliğe ve kenara göre koyu–orta–açık) üst üste sürülür; öndeki taç arkadakine
   * gölge düşürür; uç kenarı ince koyu bir çizgi, içinde açık bir ışık çizgisi alır.
   * pal [gölge, orta, açık, kalp?]

  const V3 = {
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: (a) => {
      const l = Math.hypot(a[0], a[1], a[2]) || 1;

  };
  const GUL_ISIK = V3.norm([0.55, 0.6, 0.6]); // sağ, öne, yukarı

    const D = H.mix(KAL, K, 0.42);
    const W = H.mix(A, [255, 255, 255], 0.65);
    const el = ((o.egim || 58) * Math.PI) / 180;
    const sE = Math.sin(el);
    const cE = Math.cos(el);
    const Vw = [0, cE, sE];
    const yb = y + r * (o.yk === undefined ? 0.04 : o.yk);
    const nzp = H.nz(Math.floor(x + y * 7));
    const tit = Math.min(0.6, r * 0.007);
    const yat = o.yatik || 0; // çiçek ekseninin hafif yana eğilişi
    const cy0 = Math.cos(yat);
    const sy0 = Math.sin(yat);
    const pr = (P) => {
      const dx = P[0] * r;
      const dy = (P[1] * sE - P[2] * cE) * r;
      const X = x + dx * cy0 - dy * sy0;
      const Y = yb + dx * sy0 + dy * cy0;
      return [X + tit * nzp(X / 9, Y / 9), Y + tit * nzp(X / 9 + 40, Y / 9 + 40)];
    };
    const renkV = (v) =>
      v < 0.32 ? H.mix(D, K, H.clamp(v / 0.32, 0, 1)) : v < 0.6 ? H.mix(K, Om, (v - 0.32) / 0.28) : v < 0.88 ? H.mix(Om, A, (v - 0.6) / 0.28) : H.mix(A, W, H.clamp((v - 0.88) / 0.25, 0, 1));
    const P3 = (p, s, t, duz) => {
      const tm = duz ? 1 : 1 - p.yuv * s * s - 0.04 * Math.exp(-s * s * 28);
      const tt = H.clamp(t, 0, 1) * tm;
      const th = p.phi + s * p.hw * p.wt(tt);
      const lip = p.lip ? p.lip * Math.pow(H.clamp((tt - 0.82) / 0.18, 0, 1), 2) : 0;
      // geriye kıvrılan uç: kenarlarda daha güçlü (taç ucu sivrilir)
      const ku = p.kiv ? H.clamp((tt - p.kivT) / (1 - p.kivT), 0, 1) : 0;
      const kv = ku ? p.kiv * (0.5 + 0.5 * s * s) : 0;
      const rho = p.rho(tt) + (p.cupR || 0) * tt * s * s + lip + kv * 0.35 * ku;
      const z = p.z(tt) + (p.cupZ || 0) * tt * s * s - lip * 0.5 - kv * ku * ku;
      return [rho * Math.cos(th), rho * Math.sin(th), z];
    };
    const ton = (p, s, t) => {
      const e = 0.02;
      // normal, uç yuvarlaması olmayan düz yüzeyden alınır (ton dalgalanmasın)
      const Ps = V3.sub(P3(p, s + e, t, true), P3(p, s - e, t, true));
      const Pt = V3.sub(P3(p, s, t + e, true), P3(p, s, t - e, true));
      const n = V3.norm(V3.cross(Pt, Ps));
      // iç yüz ile dış yüz tonu, yüzeyin bize döndüğü yön boyunca yumuşakça birleşir (kenardan görülen
      // yerlerde ton sıçramasın)
      const w = H.smooth(-0.18, 0.18, V3.dot(n, Vw));
      const lamI = H.clamp((V3.dot(n, GUL_ISIK) + 0.3) / 1.3, 0, 1);
      const lamO = H.clamp((-V3.dot(n, GUL_ISIK) + 0.3) / 1.3, 0, 1);
      const vi = (0.24 + 0.76 * lamI) * (p.icAO ? H.lerp(0.4, 1, H.smooth(0, 0.85, t)) : H.lerp(0.6, 1, H.smooth(0, 0.55, t)));
      const vo = (0.24 + 0.76 * lamO) * H.lerp(0.75, 1, H.smooth(0, 0.45, t)) * 0.9 + 0.1;
      let v = H.lerp(vo, vi, w);
      // çiçeğin bütün hacmi: sol alt yan gölgede, sağ üst yan ışıkta
      const P0 = P3(p, s, t);
      const g = V3.dot(V3.norm([P0[0], P0[1], P0[2] - 0.3]), GUL_ISIK);
      v *= 0.84 + (0.22 * (g + 1)) / 2;
      v += (p.icAO ? 0.05 : 0.12) * H.smooth(0.8, 1, t);
      return v;
    };
    const derin = (P) => P[1] * cE + P[2] * sE;
    const BASAMAK = 0.13;
    const NS = r > 40 ? 18 : 12;
    const NT = r > 40 ? 22 : 14;
    const birlesik = new Path2D();
    let ilk = true;
    const kontRenk = H.mix(K, [55, 25, 30], 0.4);
    const wB = Math.max(0.8, r * 0.027);
    const tacCiz = (p) => {
      const G = [];
      for (let j = 0; j <= NT; j++) {
        const row = [];
        for (let i = 0; i <= NS; i++) row.push(pr(P3(p, -1 + (2 * i) / NS, j / NT)));
        G.push(row);
      }
      const yol = new Path2D();
      const dortgen = [];
      for (let j = 0; j < NT; j++) {
        for (let i = 0; i < NS; i++) {
          const q = [G[j][i], G[j][i + 1], G[j + 1][i + 1], G[j + 1][i]];
          let a = 0;
          for (let m = 0; m < 4; m++) {
            const u = q[m];
            const v = q[(m + 1) % 4];
            a += u[0] * v[1] - v[0] * u[1];
          }
          if (Math.abs(a) < 1e-3) continue;
          if (a < 0) q.reverse();
          yol.moveTo(q[0][0], q[0][1]);
          for (let m = 1; m < 4; m++) yol.lineTo(q[m][0], q[m][1]);
          yol.closePath();
          const sc = -1 + (2 * (i + 0.5)) / NS;
          const tc = (j + 0.5) / NT;
          dortgen.push({ q, i, j, alan: Math.abs(a) / 2, d: derin(P3(p, sc, tc)), v: ton(p, sc, tc) });
        }
      }
      // taç yaprağının kendi kıvrımıyla örttüğü yerler: küçük bir derinlik tamponu
      let bx0 = 1e9;
      let by0 = 1e9;
      let bx1 = -1e9;
      let by1 = -1e9;
      for (const g of dortgen) {
        for (const [qx, qy] of g.q) {
          if (qx < bx0) bx0 = qx;
          if (qy < by0) by0 = qy;
          if (qx > bx1) bx1 = qx;
          if (qy > by1) by1 = qy;
        }
      }
      const zw = Math.max(1, Math.ceil(bx1 - bx0) + 2);
      const zh = Math.max(1, Math.ceil(by1 - by0) + 2);
      const zb = new Float32Array(zw * zh).fill(-1e9);
      for (const g of dortgen) {
        for (const [A1, B1, C1] of [[g.q[0], g.q[1], g.q[2]], [g.q[0], g.q[2], g.q[3]]]) {
          const ax = Math.max(0, Math.floor(Math.min(A1[0], B1[0], C1[0]) - bx0));
          const bxx = Math.min(zw - 1, Math.ceil(Math.max(A1[0], B1[0], C1[0]) - bx0));
          const ay = Math.max(0, Math.floor(Math.min(A1[1], B1[1], C1[1]) - by0));
          const byy = Math.min(zh - 1, Math.ceil(Math.max(A1[1], B1[1], C1[1]) - by0));
          const den = (B1[1] - C1[1]) * (A1[0] - C1[0]) + (C1[0] - B1[0]) * (A1[1] - C1[1]);
          if (Math.abs(den) < 1e-6) continue;
          for (let iy = ay; iy <= byy; iy++) {
            for (let ix = ax; ix <= bxx; ix++) {
              const px = ix + bx0 + 0.5;
              const py = iy + by0 + 0.5;
              const l1 = ((B1[1] - C1[1]) * (px - C1[0]) + (C1[0] - B1[0]) * (py - C1[1])) / den;
              const l2 = ((C1[1] - A1[1]) * (px - C1[0]) + (A1[0] - C1[0]) * (py - C1[1])) / den;
              if (l1 < -0.05 || l2 < -0.05 || l1 + l2 > 1.05) continue;
              const k = iy * zw + ix;
              if (g.d > zb[k]) zb[k] = g.d;
            }
          }
        }
      }
      const gorunur = (P2, d) => {
        const ix = Math.floor(P2[0] - bx0);
        const iy = Math.floor(P2[1] - by0);
        if (ix < 0 || iy < 0 || ix >= zw || iy >= zh) return true;
        return d >= zb[iy * zw + ix] - 0.05;
      };
      // öndeki taç, arkadakilerin üstüne yumuşak bir gölge düşürür (ışık sağ üstten)
      if (!ilk) {
        ctx.save();
        ctx.clip(birlesik);
        ctx.translate(-0.045 * r, 0.035 * r);
        ctx.globalAlpha = p.golgeA === undefined ? 0.2 : p.golgeA;
        ctx.fillStyle = rgb(D);
        ctx.fill(yol);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      ilk = false;
      // alt boya: taç yaprağı önce düze yakın tek bir orta tonla örtülür (ışık-gölge ancak hafifçe sezilir);
      // modellemeyi asıl pardaz vuruşları yapar
      ctx.save();
      ctx.clip(yol);
      const vOrt = ton(p, 0, 0.55);
      dortgen.sort((a, b) => a.d - b.d);
      ctx.lineWidth = 0.8;
      for (const g of dortgen) {
        const c = rgb(renkV(H.lerp(g.v, vOrt, 0.6)));
        ctx.fillStyle = c;
        ctx.strokeStyle = c;
        ctx.beginPath();
        ctx.moveTo(g.q[0][0], g.q[0][1]);
        for (let m = 1; m < 4; m++) ctx.lineTo(g.q[m][0], g.q[m][1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      // pardaz: ekranda eşit sıklıkta, dipten uca (ya da kısalmış bantlarda enine) ince vuruşlar
      const sik = (p.yog || 2.4) / (wB * r * 0.22);
      const vur = [];
      for (const g of dortgen) {
        let nq = g.alan * sik;
        nq = Math.floor(nq) + (rr() < nq - Math.floor(nq) ? 1 : 0);
        for (let k = 0; k < nq; k++) {
          const s0 = H.clamp(-1 + (2 * (g.i + rr())) / NS, -0.99, 0.99);
          const tc = (g.j + rr()) / NT;
          const dt = p.icAO ? 0.07 + rr() * 0.1 : 0.14 + rr() * 0.24;
          const t0 = tc - dt * (0.3 + rr() * 0.4);
          const t1 = Math.min(1, t0 + dt);
          const ds = (rr() - 0.5) * 0.08;
          const tm = (t0 + t1) / 2;
          const q1 = pr(P3(p, s0, tm - 0.05));
          const q2 = pr(P3(p, s0, tm + 0.05));
          const q3 = pr(P3(p, s0 - 0.05, tm));
          const q4 = pr(P3(p, s0 + 0.05, tm));
          const Lt = Math.hypot(q2[0] - q1[0], q2[1] - q1[1]) * 10;
          const Ls = Math.hypot(q4[0] - q3[0], q4[1] - q3[1]) * 10;
          const pts = [];
          if (Lt < 0.55 * Ls) {
            const len = (14 + rr() * 14) / Math.max(1, Ls);
            const dtt = (rr() - 0.5) * 0.06;
            for (let m = 0; m <= 5; m++) pts.push(pr(P3(p, H.clamp(s0 - len / 2 + (len * m) / 5, -1, 1), H.clamp(tc, 0, 1) + (dtt * m) / 5)));
          } else {
            for (let m = 0; m <= 5; m++) pts.push(pr(P3(p, s0 + (ds * m) / 5, t0 + ((t1 - t0) * m) / 5)));
          }
          const Pm = P3(p, s0, tc);
          const dm = derin(Pm);
          if (!gorunur(pr(Pm), dm)) continue;
          const v0 = ton(p, s0, tc);
          // ressamın paletinde karışık birkaç ton vardır: vuruşun tonu sürekli değil, en yakın basamağa oturur
          // (titreşimle iki komşu basamak arasında seçilir), böylece komşu vuruşlar birbirinden ayrılır
          const vj = v0 + (rr() - 0.5) * (p.icAO ? 0.2 : 0.26);
          const vq = Math.round(vj / BASAMAK) * BASAMAK + (rr() - 0.5) * 0.03;
          vur.push({ d: dm, pts, v: vq });
        }
      }
      vur.sort((a, b) => a.d - b.d);
      for (const q of vur) {
        ctx.globalAlpha = 0.62 + rr() * 0.33;
        H.firca(ctx, q.pts, { w: wB * (0.75 + rr() * 0.6), color: rgb(renkV(q.v)), bas: 0.2, uc: 0.5, jit: 0.3, seed: T() });
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      // kenarlar: uçta ince koyu kontur, yanlarda daha silik; ışık alan uç kenarın içinde açık çizgi
      const uc = G[NT].slice(1, NS);
      cizgi(uc, 0.4 + r * 0.007, H.rgba(kontRenk, 0.5), { taper: 0.12, amp: 0.12 });
      for (const sk of [0, NS]) {
        let run = [];
        const bitir = () => {
          if (run.length > 2) cizgi(run, 0.3 + r * 0.005, H.rgba(kontRenk, 0.32), { taper: 0.35, amp: 0.12 });
          run = [];
        };
        for (let j = 3; j <= NT; j++) {
          const P = P3(p, -1 + (2 * sk) / NS, j / NT);
          if (gorunur(G[j][sk], derin(P) + 0.02)) run.push(G[j][sk]);
          else bitir();
        }
        bitir();
      }
      // kıvrık ucun kat yeri: iç yüzün bittiği, dış yüzün başladığı çizgi
      if (p.kiv) {
        let run = [];
        const bitir = () => {
          if (run.length > 3) {
            cizgi(run, 0.35 + r * 0.006, H.rgba(kontRenk, 0.45), { taper: 0.3, amp: 0.1 });
            cizgi(run.map(([px, py]) => [px + 0.6, py + 1.1]), 0.4 + r * 0.007, H.rgba(W, 0.42), { taper: 0.4, amp: 0.1 });
          }
          run = [];
        };
        for (let i = 1; i < NS; i++) {
          const s0 = -1 + (2 * i) / NS;
          let onceki = null;
          let bulundu = null;
          for (let t = 0.5; t <= 1.0001; t += 0.02) {
            const e = 0.02;
            const n = V3.cross(V3.sub(P3(p, s0, t + e), P3(p, s0, t - e)), V3.sub(P3(p, s0 + e, t), P3(p, s0 - e, t)));
            const f = V3.dot(n, Vw) >= 0;
            if (onceki !== null && f !== onceki) {
              bulundu = pr(P3(p, s0, t));
              break;
            }
            onceki = f;
          }
          if (bulundu) run.push(bulundu);
          else bitir();
        }
        bitir();
      }
      // ışık alan uç kenar: sürekli bir parlak çizgi değil, kenardan içeri çekilmiş kısa, açık pardaz vuruşları
      if (p.isikCizgi !== false && ton(p, 0, 0.97) > 0.5) {
        ctx.save();
        ctx.clip(yol);
        const nH = Math.round(NS * (r > 40 ? 2.2 : 1.4));
        for (let i = 0; i < nH; i++) {
          const s0 = -0.92 + (1.84 * (i + rr())) / nH;
          const tv = ton(p, s0, 0.96);
          if (tv < 0.5 || rr() < 0.25) continue;
          const t0 = 0.995;
          const t1 = 0.86 - rr() * 0.12;
          const ds = (rr() - 0.5) * 0.05;
          const pts = [];
          for (let m = 0; m <= 4; m++) pts.push(pr(P3(p, s0 + (ds * m) / 4, t0 + ((t1 - t0) * m) / 4)));
          if (!gorunur(pts[1], derin(P3(p, s0, 0.96)) + 0.02)) continue;
          ctx.globalAlpha = 0.45 + rr() * 0.35;
          H.firca(ctx, pts, { w: wB * (0.6 + rr() * 0.4), color: rgb(H.mix(A, W, 0.5 + rr() * 0.5)), bas: 0.1, uc: 0.6, jit: 0.3, seed: T() });
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      birlesik.addPath(yol);
    };
    const faz = (aci || 0) * 0.9 + rr() * 0.6;
    const kat0 = [];
    const kat1 = [];
    const kat2 = [];
    if (!o.gonca) {
      // A: dış taçlar — açık, uçları sarkık; öndekilerin kenarı geriye kıvrık
      const nd = o.dis || 5;
      const adimD = (Math.PI * 2) / nd;
      const acik = o.acik || 1;
      for (let k = 0; k < nd; k++) {
        const phi = faz + k * adimD + (rr() - 0.5) * 0.3;
        const S0 = (0.94 + rr() * 0.14) * acik;
        const on = Math.sin(phi) > 0.25;
        kat0.push({
          phi,
          hw: (0.74 + rr() * 0.08) * (5 / nd) ** 0.8,
          yuv: 0.22,
          wt: (t) => 0.5 + 0.5 * Math.sin((Math.min(1, t * 1.3) * Math.PI) / 2),
          rho: (t) => 0.16 + (S0 - 0.16) * t,
          z: (t) => 0.05 + 0.18 * Math.sin(Math.PI * t * 0.9) - 0.2 * t * t * t,
          cupZ: on ? -0.1 : 0.06,
          kiv: on ? 0.3 + rr() * 0.08 : 0.14,
          kivT: 0.72 + rr() * 0.06,
          icAO: false,
        });
      }
      // B: ikinci sıra — yarı açık, aradan
      for (let k = 0; k < nd; k++) {
        const phi = faz + adimD / 2 + k * adimD + (rr() - 0.5) * 0.3;
        const S0 = (0.72 + rr() * 0.1) * (1 + (acik - 1) * 0.6);
        kat1.push({
          phi,
          hw: (0.64 + rr() * 0.08) * (5 / nd) ** 0.8,
          yuv: 0.2,
          wt: (t) => 0.5 + 0.5 * Math.sin((Math.min(1, t * 1.3) * Math.PI) / 2),
          rho: (t) => 0.15 + (S0 - 0.15) * Math.sin(Math.PI * t * 0.5),
          z: (t) => 0.08 + 0.36 * Math.sin(Math.PI * t * 0.6) - 0.06 * t * t,
          cupZ: 0.07,
          cupR: -0.03,
          kiv: rr() < 0.6 ? 0.1 : 0,
          kivT: 0.78,
          icAO: false,
        });
      }
      // C: kâseyi saran şişkin taçlar
      for (let k = 0; k < 5; k++) {
        const phi = faz + 0.3 + k * 1.2566 + (rr() - 0.5) * 0.4;
        const ro = 0.9 + rr() * 0.2;
        const zo = 0.92 + rr() * 0.16;
        kat2.push({ rb: 0.5 * ro, phi, hw: 0.68 + rr() * 0.08, yuv: 0.12, wt: (t) => 0.72 + 0.28 * t, rho: (t) => (0.13 + 0.38 * Math.sin(Math.PI * t * 0.78)) * ro, z: (t) => (0.1 + 0.52 * t) * zo, cupR: -0.05, lip: 0.06, icAO: true });
      }
      // D: iç kâse
      for (let k = 0; k < 4; k++) {
        const phi = faz + 1.0 + k * 1.5708 + (rr() - 0.5) * 0.2;
        kat2.push({ rb: 0.32, phi, hw: 0.78, yuv: 0.1, wt: (t) => 0.8 + 0.2 * t, rho: (t) => 0.08 + 0.26 * Math.sin(Math.PI * t * 0.8), z: (t) => 0.18 + 0.48 * t, cupR: -0.04, lip: 0.035, icAO: true, golgeA: 0.14 });
      }
      // E: ortada sıkı sarılmış sarmal tomurcuk
      for (let k = 0; k < 3; k++) {
        const phi = faz + 2.0 + k * 2.094 + (rr() - 0.5) * 0.2;
        const zk = k * 0.04;
        const rk = 1 - k * 0.2;
        kat2.push({ rb: 0.15 * rk, phi, hw: 1.0, yuv: 0.08, wt: () => 1, rho: (t) => (0.03 + 0.15 * Math.sin(Math.PI * t * 0.8)) * rk, z: (t) => 0.3 + 0.38 * t + zk, cupR: -0.02, icAO: true, golgeA: 0.12, isikCizgi: k === 0 });
      }
    } else {
      // gonca: yandan görülen kapalı kâse, dipte yeşil çanak yaprakları
      for (let k = 0; k < 3; k++) {
        const phi = faz + k * 2.094;
        kat2.push({ rb: 0.4, phi, hw: 1.15, yuv: 0.15, wt: (t) => 0.85 + 0.15 * t, rho: (t) => 0.12 + 0.3 * Math.sin(Math.PI * t * 0.82), z: (t) => 1.05 * t, cupR: -0.04, lip: 0.05, icAO: true });
      }
      for (let k = 0; k < 2; k++) {
        const phi = faz + 1.2 + k * 3.14;
        kat2.push({ rb: 0.25, phi, hw: 1.3, yuv: 0.1, wt: () => 1, rho: (t) => 0.06 + 0.2 * Math.sin(Math.PI * t * 0.85), z: (t) => 0.12 + 1.0 * t, icAO: true });
      }
    }
    kat0.sort((a, b) => Math.sin(a.phi) - Math.sin(b.phi));
    kat1.sort((a, b) => Math.sin(a.phi) - Math.sin(b.phi));
    kat2.sort((a, b) => Math.sin(a.phi) * a.rb - Math.sin(b.phi) * b.rb);
    // dipteki koyu gölge (aralardan yaprak zemini görünmesin)
    if (!o.gonca) {
      const c0 = pr([0, 0, 0.12]);
      ctx.fillStyle = rgb(H.mix(D, K, 0.3));
      ctx.beginPath();
      ctx.ellipse(c0[0], c0[1], r * 0.42, r * 0.42 * sE, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const p of kat0) tacCiz(p);
    for (const p of kat1) tacCiz(p);
    if (!o.gonca) {
      const hc = pr([0, 0, 0.24]);
      ctx.fillStyle = rgb(D);
      ctx.beginPath();
      ctx.ellipse(hc[0], hc[1], r * 0.3, r * 0.3 * sE, 0, 0, Math.PI * 2);
      ctx.fill();
      birlesik.addPath(new Path2D(S.elipsYolu({ cx: hc[0], cy: hc[1], rx: r * 0.3, ry: r * 0.3 * sE, aci: 0 })));
    }
    for (const p of kat2) tacCiz(p);
    return { pr, sE, cE };
  }
  /** alacalı lale: sivri, bademi taç yaprakları; kırmızı üstüne krem alevler */

    gul(C[5].x, C[5].y - 2, 64, ['#C97A88', '#EFB2BC', '#FDEDEF'], 2.3, { yatik: 0.1, egim: 64, acik: 1.06 });
    gul(C[8].x, C[8].y - 2, 72, beyaz, 0.6, { yatik: 0.05 });
  }

  // ================================================================ BİLEŞİM: perdahlı kâğıt; guaşın hafif tanesi
  {
    const img = ctx.getImageData(0, 0, N, N);
    const o = img.data;
    const doku = H.kagitDoku(2242, 2.4, 34);
    const n1 = H.noise(2243);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const p = y * N + x;
        const i = p * 4;
        const s = 1 + 0.03 * (doku[p] - 0.5) + 0.008 * n1(x / 200, y / 200);
        o[i] *= s;
        o[i + 1] *= s;
        o[i + 2] *= s;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
