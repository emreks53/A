<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-001 Suluboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fbf8f0; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-001 Suluboya — saydam katman katman yıkamalar (çarpımsal karışım), ıslak üstüne ıslak açılmalar,
// kuruyan yıkamaların koyu kenarları, pigment çökelmesi (granülasyon), kâğıdın beyazı, kurşun kalem
// altlığı ve kâğıda doğru eriyen, bitmemiş kenarlar. Bütün boya, piksel başına optik yoğunluk olarak
// biriktirilir: renk = kâğıt × exp(−Σ yoğunluk × pigment soğurması).
(function () {
  'use strict';
  const W = 1024, N = W * W;
  const tuval = document.getElementById('tuval');
  tuval.width = W; tuval.height = W;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(20241);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; // döndür + 2× ölçek
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // SVG yolunu nokta dizilerine çevir (her alt yol ayrı)
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('style', 'position:absolute;left:-3000px;top:0;width:10px;height:10px');
  const yolEl = document.createElementNS(svgNS, 'path');
  svgEl.appendChild(yolEl); document.body.appendChild(svgEl);
  function yolNoktalari(d, adim) {
    const parca = d.split(/(?=M)/).filter((s) => s.trim());
    return parca.map((p) => {
      yolEl.setAttribute('d', p);
      const L = yolEl.getTotalLength(), n = Math.max(3, Math.ceil(L / (adim || 3))), out = [];
      for (let i = 0; i <= n; i++) { const q = yolEl.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }

  // ------------------------------------------------------------ bölge haritası
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onbellek = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onbellek.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onbellek.set(key, b); }
      BOL[i] = b;
    } }
  const kume = (...adlar) => { const s = new Uint8Array(16); adlar.forEach((a) => (s[BI[a]] = 1)); return s; };

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), r = Math.max(1, kubbeR[yi]);
    const u = clamp((x - 560) / r, -1, 1), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    const l = Math.hypot(u, dr, c);
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / l);
  }
  function silindirIsik(x, cx, yr) {
    const u = clamp((x - cx) / yr, -1, 1), c = Math.sqrt(1 - u * u);
    return Math.max(0, u * LV[0] + c * LV[2]);
  }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }

  // ------------------------------------------------------------ kâğıt, titreme ve kenar alanları
  const nA = gurultu(3), nB = gurultu(4), nC = gurultu(5), nD = gurultu(6), nE = gurultu(8), nF = gurultu(9);
  const KAGIT = new Float32Array(N), GRAN = new Float32Array(N), DX = new Float32Array(N), DY = new Float32Array(N), FV = new Float32Array(N);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const h = 0.62 * fbm(nA, x / 5.2, y / 5.2, 3) + 0.38 * nB(x / 1.7, y / 1.7);
    KAGIT[i] = h;
    GRAN[i] = 0.55 * (1 - h) + 0.45 * nC(x / 2.3 + 40, y / 2.3);
    DX[i] = (fbm(nD, x / 46, y / 46, 3) - 0.5) * 5.5 + (nE(x / 7, y / 7) - 0.5) * 1.2;
    DY[i] = (fbm(nD, x / 46 + 50, y / 46 + 20, 3) - 0.5) * 5.5 + (nE(x / 7 + 30, y / 7) - 0.5) * 1.2;
    // kâğıda doğru eriyen kenar: kare-daire metriği + gürültü
    const dx = Math.abs(x - 515) / 512, dy = Math.abs(y - 530) / 525;
    const f = Math.pow(Math.pow(dx, 3.6) + Math.pow(dy, 3.6), 1 / 3.6);
    FV[i] = f + (fbm(nF, x / 90, y / 90, 4) - 0.5) * 0.2 - 0.05 * Math.exp(-((x - 880) * (x - 880) + (y - 140) * (y - 140)) / (2 * 160 * 160));
  }
  // kenar: o.vinKay ile her yıkama farklı yerde durur
  function vinyet(i, kay) { return sstep(0.93 + kay, 0.87 + kay, FV[i]); }

  // ------------------------------------------------------------ gevşek kenar (kaybolan ve bulunan kenarlar)
  // Ressam kalem çizgisini tam izlemez: maske bulanıklaştırılıp gürültülü bir eşikle kesilir, böylece boya kimi
  // yerde çizginin dışına taşar, kimi yerde geride kalıp kâğıt beyazı bir sızıntı bırakır. Kenarın yumuşaklığı da
  // gürültüyle değişir: sert, koyu kuruyan (bulunan) kenarlar ile ıslakta kâğıda eriyen (kaybolan) kenarlar yan yana.
  const nG = gurultu(12), nH = gurultu(13);
  function gevsekMaske(kutu, M, o) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, h = y1 - y0;
    const r = o.r || 5, Mb = bulanik(M, w, h, r), Mw = bulanik(M, w, h, r * 2.6);
    const A = new Float32Array(w * h);
    const tas = o.tasma == null ? 0.3 : o.tasma, ol = o.olcek || 28, kp = o.kayip || 0, sx = (o.tohum || 1) * 13.1;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const j = (y - y0) * w + x - x0;
      const nk = fbm(nH, x / (ol * 1.7) + sx, y / (ol * 1.7) - sx, 2);
      const s = clamp(sstep(0.6 - kp * 0.28, 0.66 - kp * 0.28, nk) + (o.kayipF ? o.kayipF(x, y) : 0), 0, 1);
      const m = Mb[j] + (Mw[j] - Mb[j]) * s;
      if (m <= 0.002) continue;
      if (m >= 0.998) { A[j] = 1; continue; }
      const thr = clamp(0.5 + (fbm(nG, x / ol + sx, y / ol, 3) - 0.5) * 2.6 * tas + (o.kay || 0), 0.05, 0.95);
      const gen = 0.035 + s * 0.45;
      A[j] = sstep(thr - gen, thr + gen, m);
    }
    return A;
  }
  function maskeBolge(kutu, set, sart) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, M = new Float32Array(w * (y1 - y0));
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      if (set[BOL[y * W + x]] && (!sart || sart(x, y))) M[(y - y0) * w + x - x0] = 1;
    }
    return M;
  }
  const gevsek = (kutu, set, o, sart) => gevsekMaske(kutu, maskeBolge(kutu, set, sart), o);

  // ------------------------------------------------------------ pigmentler (soğurma vektörleri)
  const pig = (hex) => [1, 3, 5].map((k) => -Math.log(Math.max(4, parseInt(hex.substr(k, 2), 16)) / 255));
  const P = {
    sap: pig('#6A9030'), vir: pig('#2F7E6C'), ult: pig('#4352AC'), cer: pig('#4B9ACB'),
    sie: pig('#C98C42'), ros: pig('#D24A7E'), gam: pig('#E2B33C'),
  };
  const karis = (...a) => { const k = [0, 0, 0]; for (let i = 0; i < a.length; i += 2) for (let c = 0; c < 3; c++) k[c] += a[i][c] * a[i + 1]; return k; };
  const lerpK = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const AR = new Float32Array(N), AG = new Float32Array(N), AB = new Float32Array(N);

  // ------------------------------------------------------------ kapsama alanları
  const oc = SAHNE.yeniTuval(W, W), octx = oc.getContext('2d', { willReadFrequently: true });
  function kutuDuz(k) { return [clamp(Math.floor(k[0]), 0, W), clamp(Math.floor(k[1]), 0, W), clamp(Math.ceil(k[2]), 0, W), clamp(Math.ceil(k[3]), 0, W)]; }
  function kapsamCiz(kutu, ciz) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, h = y1 - y0;
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, w + 2, h + 2);
    octx.setTransform(1, 0, 0, 1, -x0, -y0);
    octx.fillStyle = '#fff'; octx.strokeStyle = '#fff';
    ciz(octx);
    const v = octx.getImageData(0, 0, w, h).data, A = new Float32Array(w * h);
    for (let j = 0; j < w * h; j++) A[j] = v[j * 4 + 3] / 255;
    return A;
  }
  function kapsamBolge(kutu, set, gen, sart) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, h = y1 - y0, A = new Float32Array(w * h);
    gen = gen == null ? 1 : gen;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = y * W + x;
      const sx = clamp(Math.round(x + DX[i] * gen), 0, W - 1), sy = clamp(Math.round(y + DY[i] * gen), 0, W - 1);
      if (set[BOL[sy * W + sx]] && (!sart || sart(x, y))) A[(y - y0) * w + x - x0] = 1;
    }
    return bulanik(A, w, h, 1);
  }
  function kapsamAlan(kutu, fn) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, A = new Float32Array(w * (y1 - y0));
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) A[(y - y0) * w + x - x0] = fn(x, y);
    return A;
  }
  // Tyler Hobbs usulü: çokgeni yinelemeli boz, çok sayıda saydam katman olarak doldur
  function boz(pts, derinlik, oran, r) {
    let out = pts.map((p) => [p[0], p[1], p[2] == null ? 1 : p[2]]);
    for (let d = 0; d < derinlik; d++) {
      const yeni = [];
      for (let i = 0; i < out.length; i++) {
        const a = out[i], b = out[(i + 1) % out.length];
        yeni.push(a);
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]) * oran * a[2];
        yeni.push([(a[0] + b[0]) / 2 + gauss(r) * L * 0.5, (a[1] + b[1]) / 2 + gauss(r) * L * 0.5, a[2] * (0.75 + r() * 0.5)]);
      }
      out = yeni;
    }
    return out;
  }
  function damla(cx, cy, rx, ry, aci, kenarSayisi, r) {
    const pts = [];
    for (let i = 0; i < kenarSayisi; i++) {
      const a = (i / kenarSayisi) * Math.PI * 2, rr = 1 + (r() - 0.5) * 0.3;
      const ex = Math.cos(a) * rx * rr, ey = Math.sin(a) * ry * rr;
      pts.push([cx + ex * Math.cos(aci) - ey * Math.sin(aci), cy + ex * Math.sin(aci) + ey * Math.cos(aci), 0.6 + r() * 0.9]);
    }
    return pts;
  }
  function hobbsCiz(c, taban, katman, alfa, r, oran) {
    const b = boz(taban, 2, oran || 0.55, r);
    c.globalAlpha = alfa;
    for (let k = 0; k < katman; k++) {
      const p = boz(b, 4, (oran || 0.55) * 0.9, r);
      c.beginPath(); p.forEach((q, i) => (i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]))); c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
  }
  function titrekCokgen(c, pts, gen) {
    c.beginPath();
    pts.forEach(([x, y], i) => {
      const ii = clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1);
      const px = x + DX[ii] * gen, py = y + DY[ii] * gen;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    });
    c.closePath();
  }

  // ------------------------------------------------------------ yıkama (wash)
  //  kapsam: kutu içinde 0..1 alan. pig: soğurma vektörü ya da (x,y)→vektör. yog: sayı ya da (x,y)→sayı
  //  kenar: kuruyan kenarda pigment birikimi, gran: çökelme, dalga: akış dalgalanması,
  //  acilma: [{x,y,r}] karnabahar açılmaları (backrun), vin: kâğıda eriyen kenar kayması (false = yok)
  function yikama(kutu, A, o) {
    const [x0, y0, x1, y1] = kutu, w = x1 - x0, h = y1 - y0;
    if (w <= 0 || h <= 0) return;
    if (o.yumusak) A = bulanik(A, w, h, o.yumusak);
    if (o.vin !== false) {
      const kay = o.vin || 0;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) A[(y - y0) * w + x - x0] *= vinyet(y * W + x, kay);
    }
    const kenar = o.kenar == null ? 0.9 : o.kenar;
    const B = kenar ? bulanik(A, w, h, o.kenarR || 2.6) : null;
    let Bm = null, Bs = null;
    if (o.acilma && o.acilma.length) {
      const r = SAHNE.rng(o.tohum || 77);
      Bm = kapsamCiz(kutu, (c) => { for (const a of o.acilma) hobbsCiz(c, damla(a.x, a.y, a.r, a.r * (a.e || 0.85), r() * 6, 9, r), 22, 0.09, r, 0.7); });
      for (let j = 0; j < Bm.length; j++) Bm[j] = sstep(0.25, 0.75, Bm[j]);
      Bs = bulanik(Bm, w, h, 3.2);
    }
    const gran = o.gran == null ? 0.35 : o.gran, dalga = o.dalga == null ? 0.4 : o.dalga;
    const pf = typeof o.pig === 'function' ? o.pig : null, pk = pf ? null : o.pig;
    const yf = typeof o.yog === 'function' ? o.yog : null, yk = yf ? 0 : o.yog;
    const ox = (o.tohum || 1) * 37.7, oy = (o.tohum || 1) * 21.3, ds = o.dalgaOlcek || 38;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const j = (y - y0) * w + x - x0, a = A[j];
      if (a < 0.004) continue;
      const i = y * W + x;
      let d = a;
      if (B) { const e = a - B[j]; if (e > 0) d *= 1 + kenar * Math.min(1, e * 3.2) * 1.4; }
      if (Bm) { const bm = Bm[j]; d *= 1 - (o.acilmaKaldir || 0.38) * bm + (o.acilmaKenar || 2.0) * Math.max(0, Bs[j] - bm); }
      d *= 1 + dalga * (fbm(nF, x / ds + ox, y / ds + oy, 3) - 0.5) * 2;
      d *= 1 + gran * (GRAN[i] - 0.5) * 2.2;
      d *= yf ? yf(x, y) : yk;
      if (d <= 0) continue;
      if (o.kaldir) { const f = 1 - Math.min(0.92, d); AR[i] *= f; AG[i] *= f; AB[i] *= f; continue; }
      const k = pf ? pf(x, y) : pk;
      AR[i] += d * k[0]; AG[i] += d * k[1]; AB[i] += d * k[2];
    }
  }

  // ============================================================ ÇİÇEK REZERVİ (kâğıt beyazı bırakılan yerler)
  // Taç yapraklar kalem elipslerini birebir izlemez: her biri biraz büyük ya da küçük, hafif dönük, ucunda
  // küçük bir çentik, kenarı Hobbs usulü bozulmuş serbest bir biçimdir. Yeşiller bu biçimin etrafından dolaşır.
  const B = SAHNE.bitki;
  const isikYon = [0.74, -0.67];
  const CICEKLER = (() => {
    const r = SAHNE.rng(88);
    return B.cicekler.map((c) => {
      const yap = SAHNE.tacYapraklari(c).map((e) => {
        const s = 0.9 + r() * 0.22, a = e.aci + (r() - 0.5) * 0.24, ph1 = r() * 6.3, ph2 = r() * 6.3;
        const centik = r() < 0.65 ? 0.07 + r() * 0.1 : 0;
        const cx = c.x + Math.cos(a) * c.r * 0.53 * s, cy = c.y + Math.sin(a) * c.r * 0.53 * s;
        const rx = e.rx * s * (1 + r() * 0.08), ry = e.ry * s * (1.02 + r() * 0.16);
        const ca = Math.cos(a), sa = Math.sin(a), pts = [];
        for (let i = 0; i < 14; i++) {
          const th = (i / 14) * Math.PI * 2, dth = Math.min(th, Math.PI * 2 - th);
          let rr = 1 + 0.07 * Math.sin(2 * th + ph1) + 0.05 * Math.sin(3 * th + ph2) - centik * Math.exp(-(dth * dth) / 0.03);
          const ex = rx * Math.cos(th) * rr, ey = ry * Math.sin(th) * rr * (0.78 + 0.3 * (Math.cos(th) + 1) / 2);
          pts.push([cx + ex * ca - ey * sa, cy + ex * sa + ey * ca, 1]);
        }
        return { cx, cy, a, rx, ry, pts: boz(pts, 3, 0.16, r) };
      });
      return { c, yap };
    });
  })();
  const CICEKR = new Float32Array(N);
  {

  const CICEKB = bulanik(CICEK, W, W, 1);
  // öndeki yaprak kütlesi: ıslakta yeşil-siena, çiçeklerin etrafından
  const kOn = [0, 760, W, W];
  {
    const r = SAHNE.rng(51);
    const kutle = kapsamCiz(kOn, (c) => {
      hobbsCiz(c, [[-20, 900], [120, 812], [300, 828], [520, 806], [760, 820], [930, 800], [1050, 880], [1050, 1040], [-20, 1040]].map((p) => [p[0], p[1], 1]), 24, 0.075, r, 0.35);
    });
    for (let j = 0; j < kutle.length; j++) { const i = kOn[1] * W + j; kutle[j] *= (1 - CICEKB[i]) * (yapiSet[BOL[i]] ? 0.0 : 1) * (BOL[i] === BI.zemin ? sstep(790, 840, Math.floor(i / W)) : 1); }
    yikama(kOn, kutle, {
      pig: (x, y) => { const t = fbm(nC, x / 90, y / 90, 3); return karis(P.sap, 0.7 - 0.3 * t, P.vir, 0.25 + 0.4 * t, P.sie, 0.25 * (1 - t), P.ult, 0.1 * t); },
      yog: (x, y) => 0.5 * (0.55 + 0.9 * fbm(nE, x / 70, y / 60, 3)) * (0.7 + 0.5 * sstep(800, 960, y)),
      kenar: 1.0, gran: 0.4, dalga: 0.5, vin: 0.02, tohum: 52,
      acilma: [{ x: 120, y: 975, r: 30 }, { x: 640, y: 1000, r: 26 }, { x: 960, y: 860, r: 22 }],
    });
  }
  // zemin: siena, yatay
  yikama([0, 780, W, 860], kapsamAlan([0, 780, W, 860], (x, y) => {
    const i = y * W + x; return (BOL[i] === BI.zemin ? 1 : 0) * sstep(862, 800, y + (nA(x / 40, 7) - 0.5) * 20);
  }), { pig: karis(P.sie, 0.8, P.ros, 0.1, P.ult, 0.06), yog: 0.17, kenar: 0.7, gran: 0.6, vin: 0.0, tohum: 53 });
  // saplar
  {
    const r = SAHNE.rng(54);
    const A = kapsamCiz([0, 500, W, W], (c) => {
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (const s of B.saplar) {
        c.lineWidth = 3.4; c.globalAlpha = 0.9;
        c.beginPath(); s.forEach(([x, y], i) => { const ii = Math.round(y) * W + Math.round(clamp(x, 0, W - 1)); const px = x + DX[Math.min(N - 1, ii)] * 0.6; i ? c.lineTo(px, y) : c.moveTo(px, y); }); c.stroke();
        c.lineWidth = 1.2; c.globalAlpha = 0.6; c.stroke();
      }
      c.globalAlpha = 1;
    });
    for (let j = 0; j < A.length; j++) A[j] *= 1 - CICEKB[500 * W + j];
    yikama([0, 500, W, W], A, { pig: karis(P.sap, 0.8, P.vir, 0.3, P.sie, 0.15), yog: 0.95, kenar: 0.6, kenarR: 1.5, gran: 0.3, vin: 0.03, tohum: 55 });
  }
  // yapraklar: her biri ayrı yıkama; üst üste binen yerler koyulaşır
  {
    const r = SAHNE.rng(56);
    B.yapraklar.forEach((yp, n) => {
      if (r() < 0.07) return; // bir kaçını kalemde bırak
      const L = yp.uzunluk;
      const kutu = kutuDuz([yp.x - L - 6, yp.y - L - 6, yp.x + L + 6, yp.y + L + 6]);
      const pts = yolNoktalari(SAHNE.yaprakYolu(yp), 3)[0];
      const A = kapsamCiz(kutu, (c) => { titrekCokgen(c, pts, 0.5); c.fill(); });
      const w = kutu[2] - kutu[0];
      // orta damar: boya kaldırılarak açılmış ince çizgi
      const [d0, d1] = SAHNE.yaprakDamari(yp);
      const ca = Math.cos(yp.aci), sa = Math.sin(yp.aci);
      for (let j = 0; j < A.length; j++) {
        const x = kutu[0] + (j % w), y = kutu[1] + Math.floor(j / w), i = y * W + x;
        const t = (x - d0[0]) * ca + (y - d0[1]) * sa, v = -(x - d0[0]) * sa + (y - d0[1]) * ca;
        const damar = t > 2 && t < L * 0.85 ? Math.exp(-(v * v) / 1.6) * 0.55 : 0;
        A[j] *= (1 - CICEKB[i]) * (1 - damar);
      }
      const t0 = r(), koyu = L > 50 ? 1 : 0.8;
      const ucPig = karis(P.vir, 0.65, P.ult, 0.3, P.sap, 0.2), dipPig = karis(P.sap, 0.9, P.sie, 0.2 + 0.2 * t0, P.vir, 0.1);
      yikama(kutu, A, {
        pig: (x, y) => { const t = clamp(((x - yp.x) * ca + (y - yp.y) * sa) / L, 0, 1); return lerpK(dipPig, ucPig, clamp(t * (0.6 + t0) + (t0 - 0.5) * 0.4, 0, 1)); },
        yog: (x, y) => koyu * (0.5 + 0.5 * fbm(nB, x / 25 + n, y / 25, 2)) * (0.85 + 0.5 * t0),
        kenar: 1.1, kenarR: 2, gran: 0.35, dalga: 0.35, dalgaOlcek: 18, vin: 0.03, tohum: 60 + n,
      });
    });
  }
  // tomurcuklar: kinakridon gül
  B.tomurcuklar.forEach((t, n) => {
    const kutu = kutuDuz([t.x - 22, t.y - 22, t.x + 22, t.y + 22]);
    const pts = yolNoktalari(SAHNE.tomurcukYolu(t), 2)[0];
    const A = kapsamCiz(kutu, (c) => { titrekCokgen(c, pts, 0.3); c.fill(); });
    yikama(kutu, A, {
      pig: (x, y) => lerpK(P.ros, karis(P.ros, 0.6, P.ult, 0.3), clamp((t.x - x) / 10 + 0.3, 0, 1)),
      yog: (x, y) => 0.32 + 0.3 * clamp((t.x - x + t.y - y) / 16 + 0.5, 0, 1), kenar: 1.0, kenarR: 1.5, gran: 0.2, dalgaOlcek: 10, vin: 0.03, tohum: 200 + n,
    });
  });
  // çiçekler: taç yapraklar kâğıt beyazı; yalnız gölgeli yanlarda soluk sır, göbek siena
  const isikYon = [0.74, -0.67];
  B.cicekler.forEach((c, n) => {
    const kutu = kutuDuz([c.x - c.r * 1.2, c.y - c.r * 1.2, c.x + c.r * 1.2, c.y + c.r * 1.2]);
    // taç yaprakların hepsi: çok soluk, kenarları kuruyup ince gri çizgi bırakan bir sır
    SAHNE.tacYapraklari(c).forEach((e, k) => {
      const yon = Math.cos(e.aci) * isikYon[0] + Math.sin(e.aci) * isikYon[1];
      const pts = yolNoktalari(SAHNE.elipsYolu(e), 2)[0];
      const A = kapsamCiz(kutu, (cc) => { titrekCokgen(cc, pts, 0.25); cc.fill(); });
      yikama(kutu, A, {
        pig: karis(P.ult, 0.6, P.ros, 0.25, P.sie, 0.25),
        yog: (x, y) => 0.012 + 0.13 * clamp(-yon * 0.9 - 0.05, 0, 1) * sstep(0.2, 0.9, Math.hypot(x - c.x, y - c.y) / c.r),
        kenar: 2.2, kenarR: 1.5, gran: 0.25, dalga: 0.6, dalgaOlcek: 14, vin: 0.04, tohum: 300 + n * 7 + k,
      });
    });
    // göbeğe doğru pembe kızarma (ıslakta)
    {
      const kb = kutuDuz([c.x - c.r * 0.7, c.y - c.r * 0.7, c.x + c.r * 0.7, c.y + c.r * 0.7]);
      const A = kapsamAlan(kb, (x, y) => CICEK[y * W + x] * sstep(0.65, 0.2, Math.hypot(x - c.x, y - c.y) / c.r));
      yikama(kb, A, { pig: karis(P.ros, 0.8, P.sie, 0.2), yog: 0.07, yumusak: 2, kenar: 0, gran: 0.2, vin: 0.04, tohum: 700 + n });
    }
    // göbek
    const kg = kutuDuz([c.x - c.r * 0.4, c.y - c.r * 0.4, c.x + c.r * 0.4, c.y + c.r * 0.4]);
    const rr = SAHNE.rng(400 + n);
    const A = kapsamCiz(kg, (cc) => {
      cc.beginPath(); cc.arc(c.x + 0.5, c.y + 0.5, c.r * 0.19, 0, Math.PI * 2); cc.fill();
    });
    yikama(kg, A, { pig: karis(P.sie, 0.9, P.sap, 0.25), yog: 0.75, kenar: 1.0, kenarR: 1.2, gran: 0.5, dalgaOlcek: 8, vin: 0.05, tohum: 500 + n });
    const A2 = kapsamCiz(kg, (cc) => {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + rr() * 0.3;
        cc.beginPath(); cc.arc(c.x + Math.cos(a) * c.r * 0.27, c.y + Math.sin(a) * c.r * 0.27, Math.max(1.1, c.r * 0.04), 0, Math.PI * 2); cc.fill();
      }
    });
    yikama(kg, A2, { pig: karis(P.sie, 0.8, P.ros, 0.4, P.ult, 0.15), yog: 1.0, kenar: 0.5, kenarR: 1, gran: 0.2, vin: 0.05, tohum: 600 + n });
  });
  // sıçratma damlaları
  {
    const r = SAHNE.rng(77);
    const kutu = [0, 600, W, W];
    const A = kapsamCiz(kutu, (c) => {
      for (let i = 0; i < 70; i++) {
        const x = 60 + r() * 900, y = 780 + r() * 220, rad = 0.6 + Math.pow(r(), 3) * 3.2;
        c.globalAlpha = 0.6 + r() * 0.4; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
    });
    for (let j = 0; j < A.length; j++) A[j] *= 1 - CICEKB[600 * W + j] * 0.8;
    yikama(kutu, A, { pig: (x) => (x < 512 ? karis(P.sap, 0.7, P.vir, 0.4) : karis(P.vir, 0.5, P.ros, 0.35, P.ult, 0.2)), yog: 0.8, kenar: 0.8, kenarR: 1, gran: 0.2, vin: 0.06, tohum: 78 });
  }

  // ============================================================ KURŞUN KALEM ALTLIĞI
  const kalem = SAHNE.yeniTuval(W, W), kc = kalem.getContext('2d', { willReadFrequently: true });
  {
    const r = SAHNE.rng(91);
    kc.lineCap = 'round'; kc.lineJoin = 'round'; kc.strokeStyle = '#000';
    const cizgi = (pts, alfa, kopuk) => {
      // kesik kesik, hafif titrek, bazen iki kez geçilmiş kalem çizgisi
      let i = 0;
      while (i < pts.length - 1) {
        const uz = kopuk ? 3 + Math.floor(r() * 20) : pts.length;
        const ox = (r() - 0.5) * 0.8, oy = (r() - 0.5) * 0.8;
        kc.beginPath();
        for (let s = i; s < Math.min(pts.length, i + uz + 1); s++) {
          const x = pts[s][0] + ox + (r() - 0.5) * 0.5, y = pts[s][1] + oy + (r() - 0.5) * 0.5;
          s === i ? kc.moveTo(x, y) : kc.lineTo(x, y);
        }
        kc.globalAlpha = Math.min(1, alfa * 1.7 * (0.55 + r() * 0.45)); kc.lineWidth = 0.75 + r() * 0.45;
        kc.stroke();
        i += uz + (kopuk && r() < 0.5 ? 1 + Math.floor(r() * 3) : 0);
      }
    };
    const Y = SAHNE.yollar();
    const yolCiz = (d, alfa, kopuk, adim) => yolNoktalari(d, adim || 3).forEach((p) => cizgi(p, alfa, kopuk));
    yolCiz(Y.kubbe, 0.5, true);
    Y.kaburgalar.forEach((d, k) => { if (k % 2 === 0) yolCiz(d, 0.32, true); });
    [Y.kasnakUst, Y.kasnakAlt, Y.kaide, Y.kornis].forEach((d) => yolCiz(d, 0.45, true));
    Y.kasnakPencereleri.forEach((d) => yolCiz(d, 0.35, false, 2));
    Y.kaidePencereleri.forEach((d) => yolCiz(d, 0.45, true, 2));
    Y.minare.forEach((d) => yolCiz(d, 0.5, true));
    Y.minarePencereleri.forEach((d) => yolCiz(d, 0.4, false, 2));
    Y.zikzak.forEach((d) => yolCiz(d, 0.25, true, 2));
    Y.alem.concat(Y.minareAlem).forEach((d) => yolCiz(d, 0.45, false, 1.5));
    Y.cicekler.forEach((d) => yolCiz(d, 0.42, true, 2));
    Y.tomurcuklar.forEach((d) => yolCiz(d, 0.4, false, 2));
    Y.yapraklar.forEach((d, k) => { if (k % 2 === 0 || k > 60) yolCiz(d, 0.3, true, 3); });
    Y.saplar.forEach((d) => yolCiz(d, 0.3, true, 4));
    // yapı çizgileri: köşelerden taşan yardımcı çizgiler, eksen
    const duz = (x1, y1, x2, y2, a) => cizgi([[x1, y1], [(x1 + x2) / 2, (y1 + y2) / 2], [x2, y2]], a, false);
    duz(560, 175, 560, 330, 0.18); duz(300, 70, 300, 210, 0.16);
    duz(318, 555.5, 800, 555, 0.22); duz(300, 692.5, 852, 692, 0.25); duz(268, 800.5, 860, 800, 0.3);
    duz(275, 704, 845, 704.5, 0.18); duz(330, 609.5, 808, 610, 0.2);
    duz(360, 520, 359, 590, 0.18); duz(760, 520, 761, 590, 0.18);
    // sağ ve sol kenarda bitmemiş, yalnız kalemle duran gök çizgisi
    duz(40, 806, 250, 802, 0.15); duz(860, 802, 1000, 806, 0.15);
  }
  {
    const v = kc.getImageData(0, 0, W, W).data;
    for (let i = 0; i < N; i++) {
      const a = v[i * 4 + 3] / 255;
      if (!a) continue;
      // grafit kâğıdın tepelerinde tutunur
      const d = a * 0.55 * (0.55 + 0.9 * KAGIT[i]);
      AR[i] += d * 1.05; AG[i] += d * 1.02; AB[i] += d * 0.95;
    }
  }

  // ============================================================ SON: kâğıt × exp(−yoğunluk) + kâğıt dokusu
  const img = ctx.createImageData(W, W), o = img.data;
  const kag = [251, 248, 240];
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const hx = KAGIT[y * W + Math.min(W - 1, x + 1)] - KAGIT[y * W + Math.max(0, x - 1)];
    const hy = KAGIT[Math.min(W - 1, y + 1) * W + x] - KAGIT[Math.max(0, y - 1) * W + x];
    const golge = 1 + (hx * 0.5 - hy * 0.5) * 0.11 - (1 - KAGIT[i]) * 0.035;
    o[i * 4] = clamp(kag[0] * Math.exp(-AR[i]) * golge, 0, 255);
    o[i * 4 + 1] = clamp(kag[1] * Math.exp(-AG[i]) * golge, 0, 255);
    o[i * 4 + 2] = clamp(kag[2] * Math.exp(-AB[i]) * golge, 0, 255);
    o[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
</script>
