<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-061 Kalem ve Lavi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fbf8f1; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-061 Kalem ve Lavi (Pen and Wash) — kendinden emin, kalınlığı değişen dolma kalem / ince uçlu kalem
// çizgisi (köşelerde taşan çizgiler, arayan ikinci çizgiler, tarama ve karalama gölgeler) üstte; altında
// çizgiye tam uymayan, kaymış, gevşek, saydam suluboya lavileri. Kâğıdın beyazı bol bırakılır.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
(function () {
  'use strict';
  // ================================================================ ortak araçlar (kalem ailesi kiti)
  const OL = 2; // iç çözünürlük çarpanı (2048 piksel; koordinatlar 1024'te)
  const PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(PI2 * r()); }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karisim(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }

  /** Ekran dışı katman: 2048 piksel, 1024 koordinat. */
  function katman(olcek, okunur) {
    olcek = olcek || OL;
    const c = SAHNE.yeniTuval(1024 * olcek, 1024 * olcek);
    const x = c.getContext('2d', { willReadFrequently: !!okunur });
    x.setTransform(olcek, 0, 0, olcek, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x, o: olcek };
  }

  /** Değer gürültüsü (0..1), yumuşak ara değerli. */
  function gurultuUret(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function fbmUret(tohum, okt) {
    const n = gurultuUret(tohum);
    okt = okt || 4;
    return (x, y) => {
      let s = 0, a = 1, t = 0, f = 1;
      for (let k = 0; k < okt; k++) { s += n(x * f + k * 17.3, y * f - k * 9.1) * a; t += a; a *= 0.5; f *= 2.03; }
      return s / t;
    };
  }

  /** SVG yol dizgisini (M L C A Z, mutlak) nokta dizilerine çevirir. Her dizi .kapali bilgisi taşır. */
  function duzlestir(d, adim) {
    adim = adim || 2;
    const tok = d.match(/[MLCAZmlcaz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const ekle = (x, y) => cur.push([x, y]);
    const cizgi = (x, y) => {
      const L = Math.hypot(x - cx, y - cy);
      const m = Math.max(1, Math.ceil(L / adim));
      for (let j = 1; j <= m; j++) ekle(cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') {
        if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) cizgi(sx, sy); cur.kapali = true; }
        cx = sx; cy = sy; cur = null;
        continue;
      }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') cizgi(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          ekle(u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const dx = (cx - x) / 2, dy = (cy - y) / 2;
        const x1p = cr * dx + sr * dy, y1p = -sr * dx + cr * dy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(6, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          ekle(cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }

  /** Nokta dizisini eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1];
    const o = out[out.length - 1];
    if (Math.hypot(s[0] - o[0], s[1] - o[1]) > adim * 0.25) out.push([s[0], s[1]]);
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }

  /** Çizgiyi normali boyunca gürültüyle titretir (el titremesi). */
  function titret(p, gen, dalga, nf, faz) {
    const out = [];
    let s = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const d = gen * (nf(s / dalga + faz, faz * 1.7) - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }
    return out;
  }

  /** Uçları teğet yönünde uzatır (a: başta, b: sonda; eksi değer kısaltır). */
  function uzat(p, a, b) {
    if (p.length < 2) return p.slice();
    const q = p.slice();
    const t0 = yon(p, 0, 1), t1 = yon(p, p.length - 1, -1);
    if (a > 0) q.unshift([p[0][0] - t0[0] * a, p[0][1] - t0[1] * a]);
    if (b > 0) q.push([p[p.length - 1][0] + t1[0] * b, p[p.length - 1][1] + t1[1] * b]);
    let r = q;
    if (a < 0) r = kes(r, -a, 0);
    if (b < 0) r = kes(r, 0, -b);
    return r;
  }
  function yon(p, i, s) {
    // i noktasından s yönündeki birkaç noktaya bakarak birim teğet (dizinin içine doğru değil, dışına doğru)
    const j = clamp(i + s * Math.min(4, p.length - 1), 0, p.length - 1);
    let tx = p[i][0] - p[j][0], ty = p[i][1] - p[j][1];
    const l = Math.hypot(tx, ty) || 1;
    return [tx / l, ty / l];
  }
  /** Dizinin başından a, sonundan b uzunluk keser. */
  function kes(p, a, b) {
    const L = uzunluk(p);
    return parca(p, a, L - b);
  }
  /** Dizinin s0..s1 yay uzunluğu aralığındaki parçası. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const e = s + L;
      if (e >= s0 && s <= s1) {
        const ta = clamp((s0 - s) / (L || 1), 0, 1), tb = clamp((s1 - s) / (L || 1), 0, 1);
        const A = [lerp(p[i - 1][0], p[i][0], ta), lerp(p[i - 1][1], p[i][1], ta)];
        const B = [lerp(p[i - 1][0], p[i][0], tb), lerp(p[i - 1][1], p[i][1], tb)];
        if (!out.length) out.push(A);
        out.push(B);
      }
      s = e;
    }
    return out;
  }

  /** Keskin köşelerden böler (kalem köşede kalkar). */
  function koseBol(p, esik) {
    esik = esik || 0.7;
    const out = [];
    let cur = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      cur.push(p[i]);
      const a1 = Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0]);
      const a2 = Math.atan2(p[i + 1][1] - p[i][1], p[i + 1][0] - p[i][0]);
      let d = a2 - a1;
      while (d > Math.PI) d -= PI2;
      while (d < -Math.PI) d += PI2;
      if (Math.abs(d) > esik) { out.push(cur); cur = [p[i]]; }
    }
    cur.push(p[p.length - 1]);
    out.push(cur);
    return out.filter((q) => q.length > 1 && uzunluk(q) > 0.8);
  }

  /** Değişken kalınlıklı şerit: wf(i, t, aci) → kalınlık. uc: uçlara yuvarlak başlık. */
  function serit(x, p, wf, uc) {
    const n = p.length;
    if (n < 2) return;
    const L = new Array(n), R = new Array(n), W = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const w = Math.max(0, wf(i, i / (n - 1), Math.atan2(ty, tx))) / 2;
      W[i] = w;
      L[i] = [p[i][0] - ty * w, p[i][1] + tx * w];
      R[i] = [p[i][0] + ty * w, p[i][1] - tx * w];
    }
    x.beginPath();
    x.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) x.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath();
    if (uc) {
      x.moveTo(p[0][0] + W[0], p[0][1]);
      x.arc(p[0][0], p[0][1], W[0], 0, PI2);
      x.moveTo(p[n - 1][0] + W[n - 1], p[n - 1][1]);
      x.arc(p[n - 1][0], p[n - 1][1], W[n - 1], 0, PI2);
    }
    x.fill('nonzero');
  }

  /** Hobbs usulü çokgen bozma (suluboya lekeleri, kenar düzensizliği). */
  function boz(p, derinlik, varyans, r) {
    let q = p;
    let v = varyans;
    for (let d = 0; d < derinlik; d++) {
      const yeni = [];
      for (let i = 0; i < q.length; i++) {
        const a = q[i], b = q[(i + 1) % q.length];
        yeni.push(a);
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const nx = -(b[1] - a[1]) / (L || 1), ny = (b[0] - a[0]) / (L || 1);
        const g = gauss(r) * L * v, t = 0.5 + gauss(r) * 0.12;
        yeni.push([lerp(a[0], b[0], t) + nx * g + gauss(r) * L * v * 0.3, lerp(a[1], b[1], t) + ny * g + gauss(r) * L * v * 0.3]);
      }
      q = yeni;
      v *= 0.72;
    }
    return q;
  }
  function cokgenYolu(p) {
    const P = new Path2D();
    P.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]);
    P.closePath();
    return P;
  }
  const kutuNok = (p, e) => { e = e || 0; let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of p) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); d = Math.max(d, q[1]); } return [a - e, b - e, c + e, d + e]; };
  function merkez(p) { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; }
  function donustur(p, dx, dy, s, cx, cy) {
    if (cx === undefined) [cx, cy] = merkez(p);
    return p.map((q) => [cx + (q[0] - cx) * s + dx, cy + (q[1] - cy) * s + dy]);
  }

  /** Çizgiyi bir koşula göre parçalara ayırır (koşul tutan bölümler döner). */
  function kosulluParcalar(p, kosul) {
    const out = [];
    let cur = null;
    for (const q of p) {
      if (kosul(q[0], q[1])) { if (!cur) { cur = []; out.push(cur); } cur.push(q); }
      else cur = null;
    }
    return out.filter((c) => c.length > 1);
  }

  /** Sahnenin bölge haritası (OL ölçekte): bolgeNo dizisi + ad listesi. */
  function bolgeHaritasiOl() {
    const c = SAHNE.yeniTuval(1024 * OL, 1024 * OL);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(OL, 0, 0, OL, 0, 0);
    SAHNE.ciz(x, { bolge: true });
    const v = x.getImageData(0, 0, c.width, c.height).data;
    const adlar = Object.keys(SAHNE.BOLGE);
    const no = {};
    adlar.forEach((a, i) => (no[a] = i));
    const harita = new Uint8Array(c.width * c.height);
    const onbellek = new Map();
    for (let i = 0, j = 0; i < harita.length; i++, j += 4) {
      const anahtar = (v[j] << 16) | (v[j + 1] << 8) | v[j + 2];
      let b = onbellek.get(anahtar);
      if (b === undefined) { b = no[SAHNE.bolgeAdi(v[j], v[j + 1], v[j + 2])]; onbellek.set(anahtar, b); }
      harita[i] = b;
    }
    return { harita, no, adlar, w: c.width, bolge: (x1, y1) => adlar[harita[clamp(Math.round(y1 * OL), 0, c.height - 1) * c.width + clamp(Math.round(x1 * OL), 0, c.width - 1)]] };
  }

  // ---------------------------------------------------------------- sahne geometrisi (çizgi stilleri için)
  const Y = SAHNE.yollar();
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]];
  const MP = SAHNE.minareParcalari();
  const mp = (ad) => MP.find((p) => p.ad === ad);
  function parcaNoktalari(p) {
    if (p.tip === 'poligon') return p.noktalar.concat([p.noktalar[0]]);
    if (p.tip === 'korkuluk' || p.tip === 'bant') return dikd(p.x1, p.y1, p.x2, p.y2);
    if (p.tip === 'topuz') return duzlestir(p.yol, 1.5)[0];
    return null;
  }
  /** Minarenin silueti (Path2D) */
  function minareSiluet() {
    const P = new Path2D();
    for (const d of Y.minare) P.addPath(new Path2D(d));
    for (const d of Y.minareAlem) P.addPath(new Path2D(d));
    return P;
  }
  function birlesik(dizi) { const P = new Path2D(); for (const d of dizi) P.addPath(typeof d === 'string' ? new Path2D(d) : d); return P; }
  const K = SAHNE.kaide;
  const KS = SAHNE.kasnak;
  const KP = [SAHNE.kasnakPencereleri(0), SAHNE.kasnakPencereleri(1)];
  const BIT = SAHNE.bitki;
  /** Kubbe yüzeyinde ışık (0..1): dönel yüzey normali · ışık yönü (sağ üst, öne) */
  const PROF = SAHNE.kubbeProfili(120);
  function kubbeR(y) {
    for (let i = 0; i < PROF.length - 1; i++) {
      if (y <= PROF[i].y && y >= PROF[i + 1].y) {
        const t = (PROF[i].y - y) / (PROF[i].y - PROF[i + 1].y || 1);
        return { r: lerp(PROF[i].r, PROF[i + 1].r, t), egim: Math.atan2(PROF[i].r - PROF[i + 1].r, PROF[i].y - PROF[i + 1].y) };
      }
    }
    return { r: 0, egim: 0 };
  }
  const ISIK = (() => { const v = [0.62, -0.55, 0.56]; const l = Math.hypot(...v); return v.map((a) => a / l); })();
  function kubbeIsik(x, y) {
    const { r, egim } = kubbeR(y);
    if (r <= 0) return 0.7;
    const u = clamp((x - 560) / r, -1, 1);
    // yüzey normali: yatay bileşen dışa doğru, düşey bileşen profil eğiminden
    const yukari = Math.sin(egim); // eğim ~0 (dik duvar) → yukarı bileşen 0; tepe → 1
    const yatay = Math.cos(egim);
    const nx = u * yatay, nz = Math.sqrt(Math.max(0, 1 - u * u)) * yatay, ny = -yukari;
    return clamp(nx * ISIK[0] + ny * ISIK[1] + nz * ISIK[2], 0, 1);
  }
  function silindirIsik(x, cx, R) {
    const u = clamp((x - cx) / R, -1, 1);
    return clamp(u * ISIK[0] + Math.sqrt(1 - u * u) * ISIK[2] + 0.05, 0, 1);
  }

  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, OL);
  const R = SAHNE.rng(6101);
  const NF = gurultuUret(611);
  const KAGIT = '#fbf8f1';
  const MUREKKEP = '#211913';

  // kâğıt yüksekliği (1024 koordinatında): lavi granülasyonu ve kâğıt kabartması aynı dokuyu paylaşır
  const HF = fbmUret(612, 3), HN = gurultuUret(613);
  const kagitH = (x, y) => HF(x / 4.2, y / 4.2) * 0.65 + HN(x * 0.8 + 50, y * 0.8) * 0.35;

  // ================================================================ 1. LAVİ (suluboya) — 1024 çözünürlük
  const W1 = 1024, N1 = W1 * W1;
  const SOG = [new Float32Array(N1), new Float32Array(N1), new Float32Array(N1)];
  const kap = SAHNE.yeniTuval(W1, W1), kx = kap.getContext('2d', { willReadFrequently: true });

        for (let j = 0; j < adet; j++) {
          const s1 = j === adet - 1 ? QL : ((j + 1) * QL) / adet + (R() - 0.5) * 20;
          kalem(parca(q, s0, s1), o);
          s0 = s1 + (R() < 0.5 ? -3 - R() * 4 : 1 + R() * 3); // bindirme ya da küçük boşluk
        }
      } else kalem(q, o);
      if (L > 18 && R() < (o.hayalet === undefined ? 0.22 : o.hayalet)) {
        const dx = (R() - 0.5) * 3.2, dy = (R() - 0.5) * 3.2;
        kalem(q.map((v) => [v[0] + dx, v[1] + dy]), Object.assign({}, o, { w: (o.w || 1.3) * 0.5, alfa: 0.55 }));
      }
    }
  }

  /** Örtme: önde duran biçimin silueti mürekkep katmanından silinir (arkadaki çizgiler görünmez). */
  function ort(yol, cizgi, dolguYok) {
    ix.save();
    ix.globalCompositeOperation = 'destination-out';
    ix.fillStyle = '#000';
    if (!dolguYok) ix.fill(yol);
    if (cizgi) { ix.lineWidth = cizgi; ix.strokeStyle = '#000'; ix.stroke(yol); }
    ix.restore();
  }

  /**
   * Tarama: aci yönünde paralel çizgiler; kosul(x,y) tutan yerlerde, uçları düzensiz kısa darbeler.
   * kirp: Path2D (çizgiler biçimde kalır).
   */
  function tara(kirp, x1, y1, x2, y2, o) {
    const ca = Math.cos(o.aci), sa = Math.sin(o.aci);
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    const yar = Math.hypot(x2 - x1, y2 - y1) / 2 + 4;
    ix.save();
    if (kirp) ix.clip(kirp);
    const ara = o.aralik || 3.2;
    for (let t = -yar; t <= yar; t += ara * (0.85 + R() * 0.3)) {
      const pts = [];
      for (let s = -yar; s <= yar; s += 1.5) pts.push([cx + ca * s - sa * t, cy + sa * s + ca * t]);
      const esikG = (R() - 0.5) * (o.titrek || 0.06);
      const parcalar = kosulluParcalar(pts, (x, y) => x >= x1 - 2 && x <= x2 + 2 && y >= y1 - 2 && y <= y2 + 2 && o.kosul(x, y, esikG));
      for (const pc of parcalar) {
        // uzun parçalar kısa darbelere bölünür
        const L = uzunluk(pc);
        const mx = o.darbe || 46;
        let s0 = R() * 2;
        while (s0 < L - 2) {
          const s1 = Math.min(L, s0 + mx * (0.6 + R() * 0.6));
          kalem(parca(pc, s0 + R() * 1.5, s1 - R() * 2.5), { w: o.w || 0.55, tit: 0.25, dalga: 20, bas: 1.5, son: 5, alfa: o.alfa || 0.85 });
          s0 = s1 + (R() < 0.3 ? 1 + R() * 2 : -0.5);
        }
      }
    }
    ix.restore();
  }

  /** Pencere içini sık, zikzak karalamayla koyultur. */
  function karala(yol, x1, y1, x2, y2, adim, w) {
    ix.save();
    ix.clip(yol);
    const pts = [];
    const gen = x2 - x1;
    let y = y1 - gen - 2, sag = true;
    while (y < y2 + 3) {
      pts.push(sag ? [x1 - 2, y + gen * 0.6] : [x2 + 2, y]);
      y += adim * (0.6 + R() * 0.5);
      sag = !sag;
    }
    kalem(pts, { w: w || 1.1, tit: 0.35, dalga: 10, bas: 0.5, son: 0.5, alfa: 0.92 });
    kalem(pts.map((q) => [q[0] + 0.7, q[1] + adim * 0.45]), { w: (w || 1.1) * 0.7, tit: 0.35, dalga: 10, bas: 0.5, son: 0.5, alfa: 0.8 });
    ix.restore();
  }

  // --- güneş: tek hamlede çekilmiş, kapanmayan bir halka ve üstüne binen kısa ikinci darbe
  const yay = (cx, cy, r, a0, a1) => { const p = []; for (let a = a0; a <= a1; a += 0.05) p.push([cx + Math.cos(a) * r * (1 + 0.02 * Math.sin(a * 3)), cy + Math.sin(a) * r]); return p; };
  kalem(yay(880, 141, 36, -2.3, 3.6), { w: 1.05, tit: 1.1, dalga: 30, bas: 4, son: 22 });
  kalem(yay(878, 139, 40, 3.2, 4.9), { w: 0.6, alfa: 0.6, tit: 0.9, son: 12 });
  // --- yer çizgisi: gevşek yatay darbeler
  kalem([[20, 801], [240, 799]], { w: 1.1, tit: 0.8 });
  kalem([[330, 800], [700, 802]], { w: 1.0, tit: 0.8 });
  kalem([[760, 801], [1004, 799]], { w: 1.1, tit: 0.8 });
  kalem([[60, 812], [190, 811]], { w: 0.6, alfa: 0.6 });
  kalem([[840, 813], [990, 811]], { w: 0.6, alfa: 0.6 });

  // --- yardımcı çizgiler: ince, uzun, yapının ötesine taşan inşa çizgileri (eskiz izi)
  for (const [p, w, al] of [
    [[[150, 555.5], [880, 554.5]], 0.45, 0.32], [[[230, 692.5], [930, 691]], 0.45, 0.3], [[[300.5, 60], [299.5, 470]], 0.42, 0.28],
    [[[560, 170], [560.5, 300]], 0.42, 0.25], [[[60, 610.5], [330, 610]], 0.4, 0.22], [[[790, 610], [960, 611]], 0.4, 0.22],
  ]) kalem(p, { w, alfa: al, tit: 0.6, bas: 6, son: 10 });

  // --- minare
  const minYol = minareSiluet();
  ort(minYol);
  for (const p of MP) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'bant') {
      hat([[p.x1, p.y1], [p.x2, p.y1]], { w: 0.9, tas: 0.4 });
      hat([[p.x1, p.y2], [p.x2, p.y2]], { w: 0.9, tas: 0.4 });
      for (const z of SAHNE.zikzakCizgileri()) kalem(z.map((q) => [q[0], q[1] + 1]), { w: 1.15, tit: 0.35, dalga: 14 });
      continue;
    }
    const pts = parcaNoktalari(p);
    const solK = (x) => (x < 300 ? 1.25 : 0.85);
    hat(pts, { w: p.tip === 'topuz' ? 1.35 : 1.25, wk: (x) => solK(x), tas: p.tip === 'topuz' ? 0.2 : 0.7, kose: p.tip === 'topuz' ? 1.2 : 0.55 });
    if (p.tip === 'korkuluk') {
      const adet = 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / adet;
        kalem([[x + (R() - 0.5), p.y1 + 4], [x + (R() - 0.5), p.y2 - 2]], { w: 1.6, tit: 0.2, bas: 1, son: 2 });
      }
      kalem([[p.x1 + 2, p.y1 + 3.5], [p.x2 - 2, p.y1 + 3.5]], { w: 0.6, alfa: 0.7 });
    }
  }
  // minare gölgeleri: sol yan dikey tarama, şerefe altı koyu şerit
  const govdeler = [['gövde-alt', 300, 34], ['gövde-orta', 300, 27], ['gövde-üst', 300, 19]];
  for (const [ad, cx, Rr] of govdeler) {
    const p = mp(ad);
    const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
    tara(new Path2D(SAHNE.yol(p.noktalar, true)), Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), {
      aci: Math.PI / 2 + 0.05, aralik: 2.6, w: 0.55, darbe: 60,
      kosul: (x, y, g) => silindirIsik(x, cx, Rr) < 0.5 + g && !(ad === 'gövde-alt' && y > 520 && y < 584),
    });
  }
  for (const [y1, y2, x1, x2] of [[488, 500, 266, 334], [316, 325, 273, 327], [206, 212, 281, 319]]) {
    tara(new Path2D(SAHNE.yol(dikd(x1, y1, x2, y2), true)), x1, y1, x2, y2, { aci: -0.9, aralik: 1.9, w: 0.6, kosul: () => true });
  }
  tara(new Path2D(mp('topuz').yol), 266, 146, 334, 200, { aci: -0.95, aralik: 2.6, w: 0.5, kosul: (x, y, g) => x < 296 + (y - 146) * 0.05 + g * 20 });
  for (const p of SAHNE.minarePencereleri) {
    const yol = new Path2D(SAHNE.kemerYolu(p.x, p.y, p.w, p.h));
    karala(yol, p.x - p.w / 2, p.y, p.x + p.w / 2, p.y + p.h, 1.6, 1.0);
    hat(duzlestir(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1)[0], { w: 0.9, tas: 0.2, kose: 1.0 });
  }
  // minare alemi
  function alemCiz(a, s) {
    hat(duzlestir(SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), 1)[0], { w: 1.0 * s, tas: 0, kose: 2 });
    kalem([[a.cubuk.x1 + 1, a.cubuk.y2], [a.cubuk.x1 + 1, a.cubuk.y1 + 6]], { w: 0.9 * s });
    kalem([[a.cubuk.x2 - 0.5, a.cubuk.y2], [a.cubuk.x2 - 0.5, a.cubuk.y1 + 8]], { w: 0.6 * s, alfa: 0.7 });
    for (const k of a.kureler) {
      hat(duzlestir(SAHNE.daireYolu(k.cx, k.cy, k.r), 1)[0], { w: 1.1 * s, tas: 0, kose: 2, bolUz: 1000 });
      tara(new Path2D(SAHNE.daireYolu(k.cx, k.cy, k.r)), k.cx - k.r, k.cy - k.r, k.cx + k.r, k.cy + k.r, { aci: -0.9, aralik: 1.8, w: 0.45, kosul: (x, y) => (x - k.cx) * 0.7 + (y - k.cy) * 0.5 < -k.r * 0.25 });
    }
    hat(duzlestir(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.8)[0], { w: 1.1 * s, tas: 0, kose: 1.2 });
  }
  const minAlem = mp('alem').alem;
  ort(birlesik(Y.minareAlem));
  alemCiz(minAlem, 0.8);

  // --- kaide ve korniş
  const kaideYol = birlesik([Y.kaide, Y.kornis]);
  ort(kaideYol);
  hat([[K.kornis.x1, K.kornis.y1], [K.kornis.x2, K.kornis.y1]], { w: 1.4, tas: 1.6 });
  hat([[K.kornis.x1, K.kornis.y2], [K.kornis.x2, K.kornis.y2]], { w: 1.0, tas: 0.8 });
  hat([[K.kornis.x1, K.kornis.y1], [K.kornis.x1, K.kornis.y2]], { w: 1.2, tas: 0.3 });
  hat([[K.kornis.x2, K.kornis.y1], [K.kornis.x2, K.kornis.y2]], { w: 1.0, tas: 0.3 });
  hat([[K.x1, K.y1], [K.x1, K.y2]], { w: 1.6, tas: 1.2 });
  hat([[K.x2, K.y1], [K.x2, K.y2]], { w: 1.0, tas: 1.2 });
  tara(new Path2D(SAHNE.yol(dikd(K.x1, K.y1, K.x2, K.y1 + 12), true)), K.x1, K.y1, K.x2, K.y1 + 12, { aci: -1.0, aralik: 2.4, w: 0.55, kosul: (x, y, g) => y < K.y1 + 7 + 5 * NF(x / 30, 1) });
  tara(new Path2D(Y.kaide), K.x1, K.y1, 380, K.y2, { aci: -1.0, aralik: 3.4, w: 0.5, kosul: (x, y, g) => x < 300 + 70 * NF(y / 40, 2) + g * 30 });
  // taş derzi ipuçları
  const rd = SAHNE.rng(64);
  for (let i = 0; i < 26; i++) {
    const y = 724 + Math.floor(rd() * 7) * 11;
    const x = 310 + rd() * 500;
    if (K.pencereler.some((p) => Math.abs(x - p.x) < p.w && y > p.y - 6)) continue;
    const L = 14 + rd() * 26;
    kalem([[x, y], [x + L, y + (rd() - 0.5) * 1.2]], { w: 0.55, alfa: 0.55 });
    if (rd() < 0.5) kalem([[x + L * rd(), y], [x + L * 0.5, y + 10]], { w: 0.45, alfa: 0.45 });
  }
  for (const p of K.pencereler) {
    const yol = new Path2D(SAHNE.kemerYolu(p.x, p.y, p.w, p.h));
    karala(yol, p.x - p.w / 2, p.y, p.x + p.w / 2, p.y + p.h, 2.0, 1.2);
    hat(duzlestir(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1)[0], { w: 1.15, tas: 0.4, kose: 1.0 });
    kalem([[p.x - p.w / 2 - 4, p.y + p.h + 2], [p.x + p.w / 2 + 5, p.y + p.h + 2]], { w: 0.9 });
  }

  // --- kasnak (alt sonra üst)
  for (const k of [1, 0]) {
    const q = KS[k];
    ort(new Path2D(SAHNE.yol(dikd(q.x1, q.y1, q.x2, q.y2), true)));
    hat([[q.x1, q.y1], [q.x2, q.y1]], { w: k ? 1.3 : 1.2, tas: 1.4, hayalet: 0.6 });
    hat([[q.x1, q.y2], [q.x2, q.y2]], { w: 1.2, tas: 1.0 });
    hat([[q.x1, q.y1], [q.x1, q.y2]], { w: 1.7, tas: 0.6 });
    hat([[q.x2, q.y1], [q.x2, q.y2]], { w: 1.0, tas: 0.6 });
    kalem([[q.x1 + 4, q.y1 + 4], [q.x2 - 30 - R() * 40, q.y1 + 4.5]], { w: 0.55, alfa: 0.6 });
    const cx = (q.x1 + q.x2) / 2, Rr = (q.x2 - q.x1) / 2;
    tara(new Path2D(SAHNE.yol(dikd(q.x1, q.y1, q.x2, q.y2), true)), q.x1, q.y1, q.x2, q.y2, {
      aci: Math.PI / 2 - 0.06, aralik: 3.0, w: 0.5, darbe: 80,
      kosul: (x, y, g) => silindirIsik(x, cx, Rr) < 0.42 + g,
    });
    tara(new Path2D(SAHNE.yol(dikd(q.x1, q.y1, q.x2, q.y2), true)), q.x1, q.y1, q.x2, q.y2, {
      aci: -0.85, aralik: 3.4, w: 0.45,
      kosul: (x, y, g) => silindirIsik(x, cx, Rr) < 0.22 + g,
    });
    for (const p of KP[k]) {
      const yol = new Path2D(SAHNE.kemerYolu(p.x, p.y, p.w, p.h));
      if (p.w < 7) {
        kalem([[p.x, p.y + 2], [p.x, p.y + p.h]], { w: Math.max(1.3, p.w * 0.8), tit: 0.2, bas: 1, son: 2 });
        continue;
      }
      karala(yol, p.x - p.w / 2, p.y, p.x + p.w / 2, p.y + p.h, k ? 1.7 : 1.4, 1.0);
      hat(duzlestir(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1)[0], { w: 0.95, tas: 0.3, kose: 1.0 });
    }
  }

  // --- kubbe
  ort(new Path2D(Y.kubbe));
  // kaburgalar: tepeye yaklaşınca seyrelir; ışıklı yanda kesik ve ince
  const kab = SAHNE.kaburgalar(16, 80);
  for (const kb of kab) {
    const u = kb.u;
    let pts = kb.noktalar.filter((q) => q[1] > 300);
    // tepede komşuya 4 px'ten yakınsa kes
    const bitis = pts.findIndex((q) => kubbeR(q[1]).r * (Math.PI / 16) * Math.sqrt(Math.max(0.05, 1 - u * u)) < 4.2);
    if (bitis > 0) pts = pts.slice(0, bitis + Math.floor(R() * 3));
    pts = pts.slice(1);
    const w = u < -0.3 ? 0.95 : u < 0.3 ? 0.8 : 0.6;
    if (u > 0.25 && u < 0.7) {
      const L = uzunluk(pts);
      const a = L * (0.25 + R() * 0.25), b = a + L * (0.15 + R() * 0.2);
      kalem(parca(pts, 0, a), { w, alfa: 0.85 });
      kalem(parca(pts, b, L), { w: w * 0.8, alfa: 0.7 });
    } else kalem(pts, { w, alfa: 0.92, son: 14 });
  }
  // gölge yanında kaburgaya koşut kontur taraması, en koyuda çapraz tarama
  for (let k = -0.985; k < 0.4; k += 0.027) {
    const pts = PROF.map((q) => [560 + k * q.r, q.y]).filter((q) => q[1] > 305);
    const parcalar = kosulluParcalar(pts, (x, y) => kubbeIsik(x, y) < 0.44 + (NF(x / 9, y / 31) - 0.5) * 0.12);
    for (const pc of parcalar) {
      const L = uzunluk(pc);
      if (L < 5) continue;
      kalem(pc, { w: 0.55, tit: 0.3, dalga: 24, bas: 2, son: 7, alfa: 0.85 });
    }
  }
  tara(new Path2D(Y.kubbe), 360, 300, 760, 556, { aci: -0.78, aralik: 3.0, w: 0.5, kosul: (x, y, g) => kubbeIsik(x, y) < 0.3 + g });
  tara(new Path2D(Y.kubbe), 360, 300, 760, 556, { aci: 0.35, aralik: 3.6, w: 0.45, kosul: (x, y, g) => kubbeIsik(x, y) < 0.1 + g });
  // dış çizgi: solda kalın, sağda ince; ışıklı yanda küçük bir boşluk (kaybolan kenar)
  const dis = SAHNE.kubbeNoktalari(100);
  const tepeI = dis.findIndex((q) => q[0] >= 560);
  const solYay = dis.slice(0, tepeI + 1);
  const sagYay = dis.slice(tepeI);
  kalem(uzat(solYay, 4, 2), { w: 1.9, wk: (x) => lerp(1.25, 0.8, (x - 360) / 200), son: 6, damla: 1 });
  const sagL = uzunluk(sagYay);
  kalem(parca(sagYay, -2, sagL * 0.36), { w: 1.25, son: 12 });
  kalem(parca(sagYay, sagL * 0.42, sagL + 6), { w: 1.35, bas: 10, wk: (x, y) => lerp(0.7, 1.15, (y - 380) / 170) });
  kalem(solYay.map((q) => [q[0] + 1.6, q[1] + 1]).slice(4, -18), { w: 0.6, alfa: 0.5 });
  ort(new Path2D(SAHNE.yol(dikd(352, 554, 768, 556), true)));
  hat([[352, 555], [768, 555]], { w: 1.5, tas: 1.6 });

  // --- kubbe alemi
  ort(birlesik(Y.alem));
  alemCiz(SAHNE.alemParcalari(560, 300, 1), 1);

  // ================================================================ 3. BİTKİLER (önde)
  for (const s of BIT.saplar) {
    const yol = new Path2D(SAHNE.yol(s));
    ort(yol, 4, true);
    kalem(s, { w: 1.35, tit: 0.8, dalga: 60, son: 20 });
    kalem(s.map((q) => [q[0] + 2.2, q[1]]).slice(2, -4), { w: 0.55, alfa: 0.6 });
  }
  BIT.yapraklar.forEach((y, i) => {
    const d = SAHNE.yaprakYolu(y);
    const yol = new Path2D(d);
    ort(yol);
    const ana = duzlestir(d, 1.2)[0];
    // iki darbe: biri uca kadar, diğeri uçta kısa kalıp ya da taşarak
    const yarim = Math.floor(ana.length / 2);
    const w = y.uzunluk > 55 ? 1.25 : 1.05;
    kalem(uzat(ana.slice(0, yarim + 1), 1, R() * 3), { w, son: 5 });
    kalem(uzat(ana.slice(yarim), R() * 2, 2 + R() * 3), { w: w * 0.9, bas: 2, son: 6 });
    const [a, b] = SAHNE.yaprakDamari(y);
    kalem([a, [lerp(a[0], b[0], 0.5) + Math.sin(y.aci) * 1.5, lerp(a[1], b[1], 0.5) - Math.cos(y.aci) * 1.5], b], { w: 0.6, alfa: 0.8, son: 10 });
    // gölge yarısında birkaç kısa tarama
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const taraf = Math.sin(y.aci) > 0 ? 1 : -1;
    const adet = 3 + Math.floor(y.uzunluk / 14);
    for (let k = 1; k < adet; k++) {
      const u = (y.uzunluk * (k + 0.2)) / (adet + 0.6);
      const gen = y.uzunluk * y.genislik * 0.36 * Math.sin((Math.PI * u) / y.uzunluk);
      const px = y.x + ca * u, py = y.y + sa * u;
      const nx = -sa * taraf, ny = ca * taraf;
      kalem([[px + nx * 1.5, py + ny * 1.5], [px + nx * gen + ca * gen * 0.5, py + ny * gen + sa * gen * 0.5]], { w: 0.45, alfa: 0.75, bas: 1, son: 3, tit: 0.1 });
    }
  });
  for (const t of BIT.tomurcuklar) {
    const d = SAHNE.tomurcukYolu(t);
    ort(new Path2D(d));
    hat(duzlestir(d, 1)[0], { w: 1.0, tas: 0.4, kose: 1.0 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const bx0 = t.x - ca * t.r * 0.7, by0 = t.y - sa * t.r * 0.7;
    kalem([[bx0, by0], [bx0 + ca * t.r * 0.9 - sa * t.r * 0.6, by0 + sa * t.r * 0.9 + ca * t.r * 0.6]], { w: 0.6 });
    kalem([[bx0, by0], [bx0 + ca * t.r * 0.9 + sa * t.r * 0.6, by0 + sa * t.r * 0.9 - ca * t.r * 0.6]], { w: 0.6 });
  }
  // çiçekler: uçları hafif çentikli taç yaprakları, damar çizgileri, noktalı ercikler
  for (const c of BIT.cicekler) {
    const taclar = SAHNE.tacYapraklari(c);
    const sira = [0, 2, 4, 1, 3].map((i) => taclar[i]);
    for (const e of sira) {
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const f = (i / 40) * PI2;
        const centik = 1 - 0.1 * Math.exp(-((f > Math.PI ? f - PI2 : f) ** 2) / 0.03);
        const rx = e.rx * 1.02 * centik, ry = e.ry * 1.05;
        const u = Math.cos(f) * rx, v = Math.sin(f) * ry * (0.75 + 0.25 * Math.cos(f));
        pts.push([e.cx + u * Math.cos(e.aci) - v * Math.sin(e.aci), e.cy + u * Math.sin(e.aci) + v * Math.cos(e.aci)]);
      }
      const yol = cokgenYolu(pts);
      ort(yol);
      // iç taraf (merkeze bakan kısım) çizilmez: dış kenar tek darbe
      const disKenar = pts.slice(28).concat(pts.slice(1, 13));
      const w = c.r > 40 ? 1.25 : 1.0;
      kalem(uzat(disKenar, 1, 2), { w, son: 8, wk: (x, y) => ((x - c.x) * 0.6 - (y - c.y) * 0.6 < 0 ? 1.2 : 0.8) });
      kalem(pts.slice(12, 21), { w: w * 0.8, son: 4 });
      kalem(pts.slice(20, 29), { w: w * 0.8, bas: 2 });
      for (const dv of [-0.18, 0.2]) {
        const a = e.aci + dv;
        kalem([[c.x + Math.cos(a) * c.r * 0.32, c.y + Math.sin(a) * c.r * 0.32], [c.x + Math.cos(a) * c.r * (0.62 + R() * 0.15), c.y + Math.sin(a) * c.r * (0.62 + R() * 0.15)]], { w: 0.45, alfa: 0.6, son: 6 });
      }
    }
    ix.fillStyle = MUREKKEP;
    const n = c.r > 40 ? 13 : 9;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * PI2 + R() * 0.2;
      const rr = c.r * (0.22 + R() * 0.1);
      ix.beginPath();
      ix.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(0.9, c.r * 0.028), 0, PI2);
      ix.fill();
    }
    hat(duzlestir(SAHNE.daireYolu(c.x, c.y, c.r * 0.13), 1)[0], { w: 0.8, tas: 0, kose: 3, bolUz: 999 });
  }

  // mürekkep katmanını kâğıda bas
  ctx.drawImage(I.c, 0, 0, 1024, 1024);

  // ================================================================ 4. KÂĞIT DOKUSU (soğuk preslenmiş)
  const T = ctx.canvas;
  const im = ctx.getImageData(0, 0, T.width, T.height);
  const v = im.data;
  const WW = T.width;
  const H = new Float32Array(WW * WW);
  for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) H[y * WW + x] = kagitH(x / OL, y / OL);
  for (let y = 1; y < WW - 1; y++) {
    for (let x = 1; x < WW - 1; x++) {
      const i = y * WW + x;
      const kab = (H[i - WW - 1] - H[i + WW + 1]) * 1.1;
      const f = 1 + kab * 0.22 - (0.5 - H[i]) * 0.035;
      const j = i * 4;
      v[j] = v[j] * f;
      v[j + 1] = v[j + 1] * f;
      v[j + 2] = v[j + 2] * f;
    }
  }
  ctx.putImageData(im, 0, 0);

  SAHNE.hazir();
})();
