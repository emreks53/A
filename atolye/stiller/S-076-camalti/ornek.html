<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-076 Camaltı Resmi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #2a1a10; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-076 Camaltı Resmi — camın arkasına boyanmış halk resmi: önce koyu kontur, sonra düz parlak renkler,
// saydam bırakılan yerlerin arkasında buruşuk kalay / altın yaldız folyo; önde parlak cam yüzeyi,
// yansıma çizgileri ve ahşap çerçeve.
// Yöntem: üç katman (boya, folyo maskesi, kontur) ressamın sırasıyla doldurulur; kontur bulanıklaştırılıp
// gürültülü eşikle fırça kalınlığı kazanır; folyo, Voronoi yüzeyli buruşuk metal olarak piksel piksel
// ışıklandırılır; cam parıltısı ve çerçeve en üste çizilir.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024 * K, H = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  const rnd = S.rng(7676);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(11), n2 = gurultu(23), n3 = gurultu(37), n4 = gurultu(41);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.3 * n(x * 2.03, y * 2.03) + 0.2 * n(x * 4.1, y * 4.1);
  const P2 = (d) => new Path2D(d);

  // ------------------------------------------------------------ yerleşim
  const CER = 48;            // ahşap çerçeve genişliği
  const BOR = 20;            // camın kenarındaki boyalı bordür
  const IC = CER + BOR;      // resim alanının başladığı yer
  const sc = (1024 - 2 * IC) / 1024; // sahne bu ölçekle resim alanına sığar

  // katmanlar: boya (renk), folyo (maske), kontur (koyu çizgi)
  function katman() { const c = S.yeniTuval(W, H); const x = c.getContext('2d', { willReadFrequently: true }); x.lineJoin = 'round'; x.lineCap = 'round'; return [c, x]; }
  const [cB, B] = katman();
  const [cF, F] = katman();
  const [cC, C] = katman();
  const sahneKoord = () => { for (const x of [B, F, C]) x.setTransform(K * sc, 0, 0, K * sc, K * IC, K * IC); };
  const ekranKoord = () => { for (const x of [B, F, C]) x.setTransform(K, 0, 0, K, 0, 0); };

  // Bir biçim: boyaya dolgu, folyo maskesine ekle ya da sil, altındaki konturu sil ve kendi konturunu çiz.
  function nesne(yol, renk, o) {
    o = o || {};
    const p = typeof yol === 'string' ? P2(yol) : yol;
    const kural = o.kural || 'nonzero';
    B.fillStyle = renk; B.fill(p, kural);
    F.globalCompositeOperation = o.folyo ? 'source-over' : 'destination-out';
    F.fillStyle = o.folyo === 'altin' ? '#ff78ff' : '#fff'; F.fill(p, kural);
    F.globalCompositeOperation = 'source-over';
    C.globalCompositeOperation = 'destination-out';
    C.fill(p, kural);
    C.globalCompositeOperation = 'source-over';
    if (o.cizgi !== 0) { C.strokeStyle = '#000'; C.lineWidth = o.cizgi || 2.6; C.stroke(p); }
  }
  function cizgi(yol, w) { C.strokeStyle = '#000'; C.lineWidth = w || 1.6; C.stroke(typeof yol === 'string' ? P2(yol) : yol); }
  function boyaCizgi(yol, renk, w) { B.strokeStyle = renk; B.lineWidth = w; B.stroke(typeof yol === 'string' ? P2(yol) : yol); }
  function boyaDolgu(yol, renk) { B.fillStyle = renk; B.fill(typeof yol === 'string' ? P2(yol) : yol); }
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  function dogrusal(x1, y1, x2, y2, duraklar) { const g = B.createLinearGradient(x1, y1, x2, y2); duraklar.forEach(([t, c]) => g.addColorStop(t, c)); return g; }

  // ------------------------------------------------------------ renkler (halk camaltı paleti)
  const R = {
    gokUst: '#13246B', gokOrta: '#1F4597', gokAlt: '#5F9BD3',
    bulut: '#FBF8F0', bulutGolge: '#B9CBE6',
    kirmizi: '#C8281F', kirmiziKoyu: '#861418', sari: '#F2C230', turuncu: '#E98A23',
    beyaz: '#F7F2E6', beyazGolge: '#C9CCD6', mavi: '#1C2E78',
    yesil: '#1D7F3A', yesilAcik: '#38A54F', yesilKoyu: '#0F5527', yaprak: '#24823A', yaprakAcik: '#6CC05A',
    zemin: '#141E16', pembe: '#EE8FA6', pembeKoyu: '#C24A6A',
    altinTon: '#E7B23C', kubbeTonSol: '#0C6A2C', kubbeTonSag: '#3CC060',
  };

  sahneKoord();

  // ------------------------------------------------------------ gök: koyu laciverten açık maviye, fırça yönlü
  B.fillStyle = dogrusal(0, 0, 0, 800, [[0, R.gokUst], [0.45, R.gokOrta], [1, R.gokAlt]]);
  B.fillRect(-20, -20, 1064, 840);

  // güneş: yaldız disk ve kırmızı-sarı alev ışınları
  const GX = 880, GY = 136;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.1;
    const r1 = 56, r2 = i % 2 ? 98 : 116, gen = 0.2;
    const p = new Path2D();
    const pt = (r, aa) => [GX + Math.cos(aa) * r, GY + Math.sin(aa) * r];
    const [ax, ay] = pt(r1, a - gen), [bx, by] = pt(r1, a + gen), [tx, ty] = pt(r2, a + 0.06);
    const [k1x, k1y] = pt((r1 + r2) / 2, a - gen * 0.2), [k2x, k2y] = pt((r1 + r2) / 2, a + gen * 1.1);
    p.moveTo(ax, ay); p.quadraticCurveTo(k1x, k1y, tx, ty); p.quadraticCurveTo(k2x, k2y, bx, by); p.closePath();
    nesne(p, i % 2 ? R.turuncu : R.kirmizi, { cizgi: 2 });
  }
  nesne(S.daireYolu(GX, GY, 60), R.altinTon, { folyo: 'altin', cizgi: 2.8 });
  // güneş yüzünde ince boyalı halka ve noktalar (saf halk süslemesi)
  cizgi(S.daireYolu(GX, GY, 46), 1.4);
  for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; nesne(S.daireYolu(GX + Math.cos(a) * 53, GY + Math.sin(a) * 53, 2.6), R.kirmizi, { cizgi: 0 }); }

  // bulutlar: düz tabanlı, kabarık tepeli, iki tonlu
  function bulutYolu(cx, cy, w, h, n) {
    const x0 = cx - w / 2;
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + w * t, cy - h * Math.pow(Math.sin(Math.PI * t), 0.8)]); }
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
      let nx = dy / L, ny = -dx / L; // dışa doğru normal (yukarı)
      if (ny > 0) { nx = -nx; ny = -ny; }
      const b = L * 0.62;
      p.bezierCurveTo(ax + nx * b + dx * 0.02, ay + ny * b + dy * 0.02, bx + nx * b - dx * 0.02, by + ny * b - dy * 0.02, bx, by);
    }
    p.bezierCurveTo(cx + w * 0.3, cy + h * 0.16, cx - w * 0.3, cy + h * 0.16, pts[0][0], pts[0][1]);
    p.closePath();
    return p;
  }
  for (const [bx, by, bw, bh, bn] of [[160, 262, 200, 46, 5], [470, 150, 170, 40, 4], [748, 352, 150, 34, 4], [112, 480, 120, 28, 3], [946, 470, 110, 26, 3]]) {
    const p = bulutYolu(bx, by, bw, bh, bn);
    nesne(p, dogrusal(0, by - bh * 1.3, 0, by + bh * 0.2, [[0, R.bulut], [0.62, R.bulut], [0.64, R.bulutGolge], [1, R.bulutGolge]]), { cizgi: 2.4 });
  }

  // ------------------------------------------------------------ zemin
  B.fillStyle = R.zemin; B.fillRect(-20, 800, 1064, 260);
  C.globalCompositeOperation = 'destination-out'; C.fillRect(-20, 800, 1064, 260); C.globalCompositeOperation = 'source-over';
  F.globalCompositeOperation = 'destination-out'; F.fillRect(-20, 800, 1064, 260); F.globalCompositeOperation = 'source-over';
  cizgi('M-20,800 L1044,800', 2.6);

  // ------------------------------------------------------------ minare
  const mc = 300;
  const golgeli = (x1, x2) => dogrusal(x1, 0, x2, 0, [[0, R.beyazGolge], [0.32, R.beyazGolge], [0.34, R.beyaz], [1, R.beyaz]]);
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs);
      let renk = golgeli(x1, x2);
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') renk = R.kirmizi;
      nesne(S.yol(p.noktalar, true), renk, { cizgi: 2.4 });
      if (p.ad.startsWith('şerefe')) {
        // şerefe altında beyaz nokta dizisi
        const y = (p.noktalar[0][1] + p.noktalar[2][1]) / 2;
        for (let x = x1 + 7; x < x2 - 4; x += 9) nesne(S.daireYolu(x, y, 1.7), R.beyaz, { cizgi: 0 });
      }
    } else if (p.tip === 'korkuluk') {
      nesne(dik(p.x1, p.y1, p.x2, p.y2), golgeli(p.x1, p.x2), { cizgi: 2.2 });
      const adet = 8;
      for (let i = 0; i <= adet; i++) {
        const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * i) / adet;
        cizgi(`M${x},${p.y1 + 3} L${x},${p.y2 - 2}`, 1.7);
      }
      cizgi(`M${p.x1},${p.y1 + 4} L${p.x2},${p.y1 + 4}`, 1.3);
    } else if (p.tip === 'bant') {
      nesne(dik(p.x1, p.y1, p.x2, p.y2), R.beyaz, { cizgi: 2.2 });
      B.save(); B.beginPath(); B.rect(p.x1, p.y1, p.x2 - p.x1, p.y2 - p.y1); B.clip();
      S.zikzakCizgileri().forEach((z, i) => { boyaCizgi(S.yol(z), i === 1 ? R.mavi : R.kirmizi, 5); });
      B.restore();
      S.zikzakCizgileri().forEach((z) => cizgi(S.yol(z), 1));
    } else if (p.tip === 'topuz') {
      nesne(p.yol, dogrusal(mc - 24, 0, mc + 24, 0, [[0, R.beyazGolge], [0.36, R.beyazGolge], [0.38, R.beyaz], [1, R.beyaz]]), { cizgi: 2.4 });
      // topuzda kırmızı yaprak süsü
      nesne(`M${mc - 13},199 Q${mc - 7},184 ${mc},170 Q${mc + 7},184 ${mc + 13},199 Z`, R.kirmizi, { cizgi: 1.6 });
    }
  }
  for (const p of S.minarePencereleri) nesne(S.kemerYolu(p.x, p.y, p.w, p.h), R.mavi, { cizgi: 2 });
  // minare alemi: altın yaldız
  function alem(a) {
    nesne(S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true), R.altinTon, { folyo: 'altin', cizgi: 1.6 });
    nesne(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), R.altinTon, { folyo: 'altin', cizgi: 2 });
    for (const k of a.kureler) nesne(S.daireYolu(k.cx, k.cy, k.r), R.altinTon, { folyo: 'altin', cizgi: 1.8 });
    nesne(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), R.altinTon, { folyo: 'altin', cizgi: 1.8 });
  }
  alem(S.alemParcalari(mc, 146, 0.62));

  // ------------------------------------------------------------ kaide
  const KA = S.kaide;
  nesne(dik(KA.x1, KA.y1, KA.x2, KA.y2), dogrusal(KA.x1, 0, KA.x2, 0, [[0, R.beyazGolge], [0.12, R.beyazGolge], [0.125, R.beyaz], [1, R.beyaz]]), { cizgi: 2.6 });
  // kaidede kırmızı çift çizgi ve küçük çiçek motifleri (halk süsü)
  boyaCizgi(`M${KA.x1 + 6},${KA.y2 - 10} L${KA.x2 - 6},${KA.y2 - 10}`, R.kirmizi, 3);
  for (const x of [365, 495, 625, 755]) {
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; nesne(S.elipsYolu({ cx: x + Math.cos(a) * 6, cy: 750 + Math.sin(a) * 6, rx: 6, ry: 3.6, aci: a }), R.kirmizi, { cizgi: 1.2 }); }
    nesne(S.daireYolu(x, 750, 2.8), R.altinTon, { folyo: 'altin', cizgi: 1 });
  }
  nesne(dik(KA.kornis.x1, KA.kornis.y1, KA.kornis.x2, KA.kornis.y2), R.kirmizi, { cizgi: 2.4 });
  for (let x = KA.kornis.x1 + 8; x < KA.kornis.x2 - 4; x += 12) nesne(S.daireYolu(x, 698, 2), R.beyaz, { cizgi: 0 });
  for (const p of KA.pencereler) {
    nesne(S.kemerYolu(p.x, p.y, p.w + 8, p.h + 6), R.kirmizi, { cizgi: 2 });
    nesne(S.kemerYolu(p.x, p.y + 5, p.w, p.h + 1), R.mavi, { cizgi: 2 });
  }

  // ------------------------------------------------------------ kasnak
  const KS = S.kasnak;
  nesne(dik(KS[1].x1, KS[1].y1, KS[1].x2, KS[1].y2), dogrusal(KS[1].x1, 0, KS[1].x2, 0, [[0, R.yesilKoyu], [0.14, R.yesilKoyu], [0.145, R.yesil], [1, R.yesil]]), { cizgi: 2.6 });
  for (const p of S.kasnakPencereleri(1)) nesne(S.kemerYolu(p.x, p.y, p.w, p.h), '#0B1A10', { cizgi: 1.8 });
  boyaCizgi(`M${KS[1].x1 + 4},${KS[1].y2 - 6} L${KS[1].x2 - 4},${KS[1].y2 - 6}`, R.sari, 2.6);
  nesne(dik(KS[0].x1, KS[0].y1, KS[0].x2, KS[0].y2), dogrusal(KS[0].x1, 0, KS[0].x2, 0, [[0, R.yesil], [0.14, R.yesil], [0.145, R.yesilAcik], [1, R.yesilAcik]]), { cizgi: 2.6 });
  for (const p of S.kasnakPencereleri(0)) nesne(S.kemerYolu(p.x, p.y, p.w, p.h), '#0B1A10', { cizgi: 1.6 });
  boyaCizgi(`M${KS[0].x1 + 4},${KS[0].y2 - 5} L${KS[0].x2 - 4},${KS[0].y2 - 5}`, R.sari, 2.2);
  // kasnak üstünde kırmızı-beyaz dişli şerit
  for (let x = KS[0].x1 + 3; x < KS[0].x2 - 6; x += 10) nesne(`M${x},557 L${x + 5},563 L${x + 10},557 Z`, R.kirmizi, { cizgi: 0 });

  // ------------------------------------------------------------ kubbe: saydam yeşil, arkasında folyo
  nesne(S.kubbeYolu, dogrusal(360, 0, 760, 0, [[0, R.kubbeTonSol], [0.5, '#1E9442'], [1, R.kubbeTonSag]]), { folyo: true, cizgi: 3 });
  B.save(); B.clip(P2(S.kubbeYolu));
  C.save(); C.clip(P2(S.kubbeYolu));
  for (const k of S.kaburgalar(16)) cizgi(S.yol(k.noktalar), 1.5);
  C.restore(); B.restore();
  // kubbe eteğinde boyalı kırmızı-beyaz kemer dizisi (halk süsü)
  B.save(); B.clip(P2(S.kubbeYolu));
  C.save(); C.clip(P2(S.kubbeYolu));
  F.save(); F.clip(P2(S.kubbeYolu));
  for (const k of S.kaburgalar(16)) {
    const u = k.u, x = 560 + u * 196, w = 22 * Math.sqrt(1 - u * u) + 3;
    nesne(`M${x - w / 2},556 Q${x},${528} ${x + w / 2},556 Z`, R.kirmizi, { cizgi: 1.3 });
  }
  F.restore(); C.restore(); B.restore();
  alem(S.alemParcalari(560, 300, 1));

  // ------------------------------------------------------------ bitkiler
  const bit = S.bitki;
  // saplar: koyu çerçeveli yeşil
  for (const s of bit.saplar) {
    const p = P2(S.yol(s));
    B.strokeStyle = '#0a0a08'; B.lineWidth = 7.5; B.stroke(p);
    B.strokeStyle = R.yaprak; B.lineWidth = 4; B.stroke(p);
  }
  function yaprakYarim(y) {
    const L = y.uzunluk, Wd = L * y.genislik, ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const a = p(0, 0), b = p(L, 0), c3 = p(L * 0.8, Wd * 0.45), c4 = p(L * 0.35, Wd * 0.75);
    return `M${b[0]},${b[1]} C${c3[0]},${c3[1]} ${c4[0]},${c4[1]} ${a[0]},${a[1]} Z`;
  }
  bit.yapraklar.forEach((y, i) => {
    const koyu = i % 3 === 0;
    nesne(S.yaprakYolu(y), koyu ? '#17672C' : R.yaprak, { cizgi: 2.2 });
    boyaDolgu(yaprakYarim(y), koyu ? '#2E9A3E' : R.yaprakAcik);
    const [a, b] = S.yaprakDamari(y);
    cizgi(`M${a[0]},${a[1]} L${b[0]},${b[1]}`, 1.2);
  });
  // tomurcuklar: lale goncası
  for (const t of bit.tomurcuklar) {
    nesne(S.tomurcukYolu(t), R.kirmizi, { cizgi: 1.8 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const u = t.r * 0.4;
    cizgi(`M${t.x - ca * t.r * 0.5},${t.y - sa * t.r * 0.5} Q${t.x + ca * u - sa * t.r * 0.5},${t.y + sa * u + ca * t.r * 0.5} ${t.x + ca * t.r * 1.4},${t.y + sa * t.r * 1.4}`, 1.1);
  }
  // çiçekler: büyükler kırmızı gül, ortancalar beyaz beş yapraklı, dallardakiler pembe
  function tacYaprak(cx, cy, a, L, Wd, bas) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = (u, v) => [cx + u * ca - v * sa, cy + u * sa + v * ca];
    const b0 = p(bas, 0), c1 = p(L * 0.25, -Wd), c2 = p(L * 1.02, -Wd * 0.95), t = p(L * 1.04, 0), c3 = p(L * 1.02, Wd * 0.95), c4 = p(L * 0.25, Wd);
    return `M${b0[0]},${b0[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${t[0]},${t[1]} C${c3[0]},${c3[1]} ${c4[0]},${c4[1]} ${b0[0]},${b0[1]} Z`;
  }
  function gul(c) {
    const R0 = c.r * 1.0, x = c.x, y = c.y;
    // yeşil çanak yaprakları
    for (let i = 0; i < 5; i++) { const a = c.aci + 0.3 + (i / 5) * Math.PI * 2; nesne(tacYaprak(x, y, a, R0 * 1.12, R0 * 0.2, R0 * 0.3), '#1E7A34', { cizgi: 1.8 }); }
    // dış sıra
    for (let i = 0; i < 6; i++) { const a = c.aci + (i / 6) * Math.PI * 2; nesne(tacYaprak(x, y, a, R0 * 0.95, R0 * 0.42, 0), i % 2 ? '#D4352B' : '#C42A24', { cizgi: 2.2 }); }
    // ikinci sıra
    for (let i = 0; i < 5; i++) { const a = c.aci + 0.5 + (i / 5) * Math.PI * 2; nesne(tacYaprak(x, y, a, R0 * 0.72, R0 * 0.36, 0), '#A81B20', { cizgi: 2 }); }
    // çanak (gülün içi)
    nesne(S.daireYolu(x, y - R0 * 0.04, R0 * 0.46), R.kirmiziKoyu, { cizgi: 2 });
    // ön dudaklar: iki hilal taç yaprak
    for (const [rr, dy, renk] of [[0.46, 0.02, '#D9402F'], [0.32, -0.04, '#C42A24']]) {
      const r1 = R0 * rr, cy0 = y + R0 * dy;
      const p = new Path2D();
      p.arc(x, cy0 - R0 * 0.04, r1, 0.05 * Math.PI, 0.95 * Math.PI, false);
      p.quadraticCurveTo(x, cy0 + r1 * 0.5, x + Math.cos(0.05 * Math.PI) * r1, cy0 - R0 * 0.04 + Math.sin(0.05 * Math.PI) * r1);
      p.closePath();
      nesne(p, renk, { cizgi: 1.8 });
    }
    // göbekte sarmal gonca
    const sp = new Path2D();
    for (let k = 0; k <= 40; k++) { const t = k / 40, a = c.aci * 3 + t * Math.PI * 3.2, rr = R0 * (0.04 + 0.16 * t); const px = x + Math.cos(a) * rr, py = y - R0 * 0.12 + Math.sin(a) * rr * 0.8; k ? sp.lineTo(px, py) : sp.moveTo(px, py); }
    cizgi(sp, 1.6);
    // beyaz fırça vurguları: ışık sağ üstten
    for (let i = 0; i < 4; i++) {
      const a = -1.35 + i * 0.42, rr = R0 * 0.7;
      boyaCizgi(`M${x + Math.cos(a - 0.22) * rr},${y + Math.sin(a - 0.22) * rr} Q${x + Math.cos(a) * rr * 1.07},${y + Math.sin(a) * rr * 1.07} ${x + Math.cos(a + 0.22) * rr},${y + Math.sin(a + 0.22) * rr}`, 'rgba(255,238,226,0.95)', R0 * 0.06);
    }
    boyaCizgi(`M${x + R0 * 0.12},${y - R0 * 0.36} Q${x + R0 * 0.3},${y - R0 * 0.3} ${x + R0 * 0.36},${y - R0 * 0.12}`, 'rgba(255,238,226,0.9)', R0 * 0.05);
  }
  function besYaprak(c, renk, ic) {
    for (const e of S.tacYapraklari(c)) {
      const yol = S.elipsYolu(e);
      nesne(yol, renk, { cizgi: 2 });
      // yaprağın içine doğru renk geçişi yerine halk tarzı iki tonlu leke
      boyaDolgu(S.elipsYolu({ cx: e.cx - Math.cos(e.aci) * e.rx * 0.35, cy: e.cy - Math.sin(e.aci) * e.rx * 0.35, rx: e.rx * 0.55, ry: e.ry * 0.55, aci: e.aci }), ic);
      const ux = Math.cos(e.aci), uy = Math.sin(e.aci);
      cizgi(`M${c.x + ux * c.r * 0.25},${c.y + uy * c.r * 0.25} L${c.x + ux * c.r * 0.62},${c.y + uy * c.r * 0.62}`, 1);
    }
    nesne(S.daireYolu(c.x, c.y, c.r * 0.24), R.altinTon, { folyo: 'altin', cizgi: 1.8 });
    for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2; nesne(S.daireYolu(c.x + Math.cos(a) * c.r * 0.13, c.y + Math.sin(a) * c.r * 0.13, Math.max(1.1, c.r * 0.035)), '#3a1c08', { cizgi: 0 }); }
  }
  bit.cicekler.forEach((c, i) => {
    if (i < 4) besYaprak(c, R.pembe, R.pembeKoyu);
    else if (c.r >= 46) gul(c);
    else besYaprak(c, R.beyaz, '#F3B9C6');
  });

  // ------------------------------------------------------------ bordür (camın kenarı, ekran koordinatı)
  ekranKoord();
  {
    const p = new Path2D();
    p.rect(CER, CER, 1024 - 2 * CER, 1024 - 2 * CER);
    p.rect(IC, IC, 1024 - 2 * IC, 1024 - 2 * IC);
    nesne(p, '#0E0B0A', { kural: 'evenodd', cizgi: 0 });
    const q = new Path2D();
    q.rect(CER + 6, CER + 6, 1024 - 2 * CER - 12, 1024 - 2 * CER - 12);
    q.rect(CER + 11, CER + 11, 1024 - 2 * CER - 22, 1024 - 2 * CER - 22);
    nesne(q, R.altinTon, { kural: 'evenodd', folyo: true, cizgi: 0 });
    cizgi(dik(IC, IC, 1024 - IC, 1024 - IC), 2.4);
  }

  // ------------------------------------------------------------ piksel geçişi: kontur, folyo, boya dokusu
  // kontur: bulanıklaştır, sonra gürültülü eşikle fırça kalınlığı
  const cC2 = S.yeniTuval(W, H);
  const C2 = cC2.getContext('2d', { willReadFrequently: true });
  C2.filter = 'blur(1.6px)';
  C2.drawImage(cC, 0, 0);
  const kd = C2.getImageData(0, 0, W, H).data;
  const bimg = B.getImageData(0, 0, W, H);
  const bd = bimg.data;
  const fd = F.getImageData(0, 0, W, H).data;

  // buruşuk folyo: rastgele kırışık çizgileri (kısa doğru parçaları) yüzeyi düz yüzeylere böler;
  // her kırışık iki yanını ters yöne eğer, normal birikir; metal, çevre yansımasıyla ışıklanır.
  const kirisik = [];
  {
    const rk = S.rng(4242);
    // folyo alanlarının sınır kutusu
    let x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) if (fd[(y * W + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const alan = (x1 - x0 + 200) * (y1 - y0 + 200);
    const adet = Math.round(alan / 900);
    for (let k = 0; k < adet; k++) {
      const px = x0 - 100 + rk() * (x1 - x0 + 200), py = y0 - 100 + rk() * (y1 - y0 + 200);
      const a = rk() * Math.PI;
      const L = 30 + rk() * rk() * 220;
      kirisik.push({ px, py, dx: Math.cos(a), dy: Math.sin(a), L, e: (rk() < 0.5 ? -1 : 1) * (0.16 + rk() * 0.34) });
    }
  }
  const KG = 64, KGW = Math.ceil(W / KG), KGH = Math.ceil(H / KG);
  const kova = Array.from({ length: KGW * KGH }, () => []);
  for (const k of kirisik) {
    const r = k.L / 2 + 2;
    const gx0 = Math.max(0, Math.floor((k.px - r) / KG)), gx1 = Math.min(KGW - 1, Math.floor((k.px + r) / KG));
    const gy0 = Math.max(0, Math.floor((k.py - r) / KG)), gy1 = Math.min(KGH - 1, Math.floor((k.py + r) / KG));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) kova[gy * KGW + gx].push(k);
  }
  // ışık: sağ üstteki pencere (parlak, dar), üstten gelen gök ışığı (geniş)
  const Lw = [0.42, -0.55, 0.72]; { const l = Math.hypot(...Lw); Lw[0] /= l; Lw[1] /= l; Lw[2] /= l; }
  function folyo(x, y) {
    let nx = 0.12 * (n2(x * 0.004, y * 0.004) - 0.5), ny = 0.12 * (n3(x * 0.004, y * 0.004) - 0.5);
    const liste = kova[Math.floor(y / KG) * KGW + Math.floor(x / KG)];
    for (let i = 0; i < liste.length; i++) {
      const k = liste[i];
      const rx = x - k.px, ry = y - k.py;
      const t = rx * k.dx + ry * k.dy;
      const h = k.L / 2;
      if (t > h || t < -h) continue;
      const s = rx * k.dy - ry * k.dx; // çizgiye dik işaretli uzaklık
      const as = Math.abs(s);
      if (as > h) continue;
      const w = (1 - Math.pow(Math.abs(t) / h, 3)) * (1 - (as / h) * (as / h));
      const sg = s > 0.9 ? 1 : s < -0.9 ? -1 : s / 0.9;
      nx += k.e * w * sg * k.dy; ny -= k.e * w * sg * k.dx;
    }
    // ince buruşukluk
    nx += 0.07 * (n1(x * 0.09, y * 0.09) - 0.5); ny += 0.07 * (n4(x * 0.09, y * 0.09) - 0.5);
    const nz = 1, l = Math.sqrt(nx * nx + ny * ny + 1);
    const Nx = nx / l, Ny = ny / l, Nz = nz / l;
    // yansıma vektörü (bakış önden)
    const Rx = 2 * Nz * Nx, Ry = 2 * Nz * Ny, Rz = 2 * Nz * Nz - 1;
    const dw = Math.max(0, Rx * Lw[0] + Ry * Lw[1] + Rz * Lw[2]);
    let b = 0.22 + 0.6 * clamp(-Ry * 1.1 + 0.3, 0, 1) + 0.55 * Math.pow(dw, 5) + 1.7 * Math.pow(dw, 50);
    return b;
  }

  const koyu = hex('#140F0C');
  for (let y = 0; y < H; y++) {
    const yy = y / K;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const xx = x / K;
      let r = bd[i], g = bd[i + 1], b = bd[i + 2];
      // boya dokusu: camın ardından görülen fırça yönü ve yoğunluk farkı
      const t = 1 + 0.085 * (fbm(n1, xx * 0.006, yy * 0.07) - 0.5) + 0.03 * (n2(xx * 0.05, yy * 0.05) - 0.5);
      r *= t; g *= t; b *= t;
      const fm = fd[i + 3] / 255;
      if (fm > 0.01) {
        const br = folyo(x, y) + (fd[i + 1] < 200 ? 0.3 : 0);
        const k = 0.12 + 1.05 * Math.min(br, 1.05);
        const parla = Math.max(0, br - 0.85) * 255 * 0.9;
        const fr = r * k + parla, fg = g * k + parla * 0.97, fb = b * k + parla * 0.88;
        r = r + (fr - r) * fm; g = g + (fg - g) * fm; b = b + (fb - b) * fm;
      }
      // kontur
      const ka = kd[i + 3] / 255;
      if (ka > 0.02) {
        const esik = 0.3 + 0.28 * n4(xx * 0.035, yy * 0.035);
        const m = sstep(esik - 0.1, esik + 0.1, ka);
        r += (koyu[0] - r) * m; g += (koyu[1] - g) * m; b += (koyu[2] - b) * m;
      }
      bd[i] = r; bd[i + 1] = g; bd[i + 2] = b; bd[i + 3] = 255;
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(bimg, 0, 0);
  ctx.restore();

  // ------------------------------------------------------------ cam yüzeyi: yansıma bantları, parıltı
  ctx.save();
  ctx.beginPath(); ctx.rect(CER, CER, 1024 - 2 * CER, 1024 - 2 * CER); ctx.clip();
  // çerçevenin cama düşen gölgesi (ışık sağ üstten → sol ve üst kenarda)
  let g = ctx.createLinearGradient(CER, 0, CER + 26, 0);
  g.addColorStop(0, 'rgba(10,5,0,0.55)'); g.addColorStop(1, 'rgba(10,5,0,0)');
  ctx.fillStyle = g; ctx.fillRect(CER, CER, 26, 1024 - 2 * CER);
  g = ctx.createLinearGradient(0, CER, 0, CER + 22);
  g.addColorStop(0, 'rgba(10,5,0,0.5)'); g.addColorStop(1, 'rgba(10,5,0,0)');
  ctx.fillStyle = g; ctx.fillRect(CER, CER, 1024 - 2 * CER, 22);
  // geniş, yumuşak çapraz yansıma ve ince parlak çizgiler
  ctx.globalCompositeOperation = 'screen';
  const bant = (u0, gen, alfa) => {
    // u = x + y doğrultusunda bant (sol alttan sağ üste çapraz)
    const gg = ctx.createLinearGradient(u0 / 2 - gen, u0 / 2 - gen, u0 / 2 + gen, u0 / 2 + gen);
    gg.addColorStop(0, 'rgba(255,255,255,0)');
    gg.addColorStop(0.5, `rgba(240,246,255,${alfa})`);
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, 1024, 1024);
  };
  bant(660, 120, 0.13);
  bant(780, 16, 0.2);
  bant(822, 6, 0.26);
  bant(1260, 60, 0.08);
  bant(1330, 8, 0.16);
  // sağ üstte pencere ışığının sert yansıması
  g = ctx.createRadialGradient(830, 190, 10, 830, 190, 300);
  g.addColorStop(0, 'rgba(255,250,235,0.16)'); g.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  ctx.restore();
  // camın kenarındaki ince parlak çizgi (sağ ve üst)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(CER + 2, CER + 1.5); ctx.lineTo(1024 - CER - 1.5, CER + 1.5); ctx.lineTo(1024 - CER - 1.5, 1024 - CER - 2); ctx.stroke();
  ctx.restore();

  // ------------------------------------------------------------ ahşap çerçeve
  const tw = 2048, th2 = CER * K;
  const ahs = S.yeniTuval(tw, th2);
  const ax = ahs.getContext('2d', { willReadFrequently: true });
  const aimg = ax.createImageData(tw, th2);
  const ad = aimg.data;
  const ac1 = hex('#3B2010'), ac2 = hex('#7A4824'), ac3 = hex('#5A321A');
  for (let y = 0; y < th2; y++) for (let x = 0; x < tw; x++) {
    const i = (y * tw + x) * 4;
    const u = x / tw, v = y / th2;
    const w = (y + 26 * fbm(n1, x * 0.0025, y * 0.03)) * 0.42;
    let f = 0.5 + 0.5 * Math.sin(w + 3 * n2(x * 0.004, y * 0.02));
    f = Math.pow(f, 2.2);
    const lif = n3(x * 0.6, y * 0.04);
    let c = [0, 1, 2].map((k) => ac2[k] + (ac1[k] - ac2[k]) * f);
    c = c.map((cc, k) => cc + (ac3[k] - cc) * 0.35 * lif);
    const gl = 1 + 0.08 * (n4(x * 0.01, y * 0.2) - 0.5);
    ad[i] = c[0] * gl; ad[i + 1] = c[1] * gl; ad[i + 2] = c[2] * gl; ad[i + 3] = 255;
  }
  ax.putImageData(aimg, 0, 0);
  // dört kenar: gönyeli trapezler; her birine kesitin ışığını ver
  const kenarlar = [
    { ad: 'üst', poly: [[0, 0], [1024, 0], [1024 - CER, CER], [CER, CER]], isik: 1.12 },
    { ad: 'sağ', poly: [[1024, 0], [1024, 1024], [1024 - CER, 1024 - CER], [1024 - CER, CER]], isik: 1.05 },
    { ad: 'alt', poly: [[1024, 1024], [0, 1024], [CER, 1024 - CER], [1024 - CER, 1024 - CER]], isik: 0.72 },
    { ad: 'sol', poly: [[0, 1024], [0, 0], [CER, CER], [CER, 1024 - CER]], isik: 0.8 },
  ];
  kenarlar.forEach((k, idx) => {
    ctx.save();
    ctx.beginPath(); k.poly.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.clip();
    // dış kenardan içe doğru kesit: (0) dış kenar → (1) iç kenar
    const [o1, o2] = [k.poly[0], k.poly[1]];
    const ex = o2[0] - o1[0], ey = o2[1] - o1[1], L = Math.hypot(ex, ey);
    const ux = ex / L, uy = ey / L;          // kenar boyunca
    const nx = -uy, ny = ux;                 // içe doğru
    ctx.save();
    ctx.setTransform(K * ux, K * uy, K * nx, K * ny, K * o1[0], K * o1[1]);
    ctx.drawImage(ahs, 0, 0, tw, th2, 0, 0, 1024, CER);
    // kesit ışığı: dış pah, oyuk, iç boncuk
    const gr = ctx.createLinearGradient(0, 0, 0, CER);
    const a = k.isik;
    const L1 = (v) => `rgba(255,236,200,${clamp(v * a - 0.35, 0, 0.6)})`;
    const D1 = (v) => `rgba(20,8,0,${clamp(v / a, 0, 0.8)})`;
    gr.addColorStop(0, D1(0.55));
    gr.addColorStop(0.06, L1(0.75));
    gr.addColorStop(0.16, L1(0.5));
    gr.addColorStop(0.3, D1(0.1));
    gr.addColorStop(0.5, D1(0.35));
    gr.addColorStop(0.66, D1(0.12));
    gr.addColorStop(0.74, L1(0.72));
    gr.addColorStop(0.82, D1(0.25));
    gr.addColorStop(0.86, 'rgba(232,190,90,0.0)');
    gr.addColorStop(0.87, 'rgba(214,168,72,0.95)');
    gr.addColorStop(0.92, a > 1 ? 'rgba(255,226,140,1)' : 'rgba(170,122,44,1)');
    gr.addColorStop(0.97, 'rgba(120,80,26,1)');
    gr.addColorStop(1, 'rgba(30,14,4,1)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, 1024, CER);
    ctx.restore();
    // genel ışık düzeyi
    ctx.fillStyle = a > 1 ? `rgba(255,220,170,${(a - 1) * 0.6})` : `rgba(0,0,0,${(1 - a) * 0.8})`;
    ctx.fillRect(0, 0, 1024, 1024);
    ctx.restore();
  });
  // gönye çizgileri
  ctx.save();
  ctx.strokeStyle = 'rgba(25,10,2,0.6)'; ctx.lineWidth = 1;
  for (const [a, b] of [[[0, 0], [CER, CER]], [[1024, 0], [1024 - CER, CER]], [[0, 1024], [CER, 1024 - CER]], [[1024, 1024], [1024 - CER, 1024 - CER]]]) {
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.restore();

  S.hazir();
})();
</script>
