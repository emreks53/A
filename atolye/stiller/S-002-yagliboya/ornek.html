<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-002 Yağlıboya (Empasto) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #7a4e32; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-002 Yağlıboya (Empasto) — kalın, örtücü, kıl izli fırça darbeleri biçimi izler (kubbede kaburga boyunca,
// kasnakta yatay, gökte geniş süpürmeler). Boya kaba → ince dört katta sürülür; her darbe, rengi hafifçe
// değişen paralel kıl çizgilerinden oluşan bir demettir. Darbeler aynı anda bir yükseklik haritasında
// birikir; sağ üstten kabartma ışığı verilerek boya sırtları parlatılır, ince yerlerde tuval dokusu görünür.
(function () {
  'use strict';
  const W = 1024, N = W * W, S2 = 2, W2 = W * S2;
  const tuval = document.getElementById('tuval');
  tuval.getContext('2d', { willReadFrequently: true }); // katlar arasında tuval tekrar tekrar okunur
  const ctx = SAHNE.tuval(tuval, S2);
  const R = SAHNE.rng(5150);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  const nA = gurultu(11), nB = gurultu(12), nC = gurultu(13);
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }

  // ------------------------------------------------------------ bölgeler
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  // bölge sınıfı: darbeler sınıf değişince durur (ince katlarda)
  const SINIF = new Uint8Array(16);
  [['gok', 1], ['gunes', 1], ['kubbe', 2], ['kasnak', 3], ['kaide', 4], ['minare', 5], ['pencere', 6], ['altin', 7], ['yaprak', 8], ['sap', 8], ['cicek', 9], ['cicekOrta', 10], ['zemin', 11]].forEach(([a, s]) => (SINIF[BI[a]] = s));
  const bolge = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];

  // ------------------------------------------------------------ ışık modeli
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(1, kubbeR[clamp(Math.round(y), 300, 555)]), -1, 1);
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), u = kubbeU(x, y), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / Math.hypot(u, dr, c));
  }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));

  // ------------------------------------------------------------ hedef görüntü (ressamın kafasındaki tablo)
  const RAMPA = {
    kubbe: [[0, [8, 30, 26]], [0.22, [14, 54, 38]], [0.48, [28, 96, 50]], [0.7, [64, 140, 56]], [0.88, [140, 188, 82]], [1, [214, 228, 150]]],
    kasnak: [[0, [9, 36, 26]], [0.3, [18, 62, 38]], [0.6, [34, 100, 50]], [0.85, [72, 140, 60]], [1, [120, 172, 80]]],
    tas: [[0, [72, 66, 92]], [0.3, [126, 112, 120]], [0.55, [190, 168, 140]], [0.8, [236, 216, 178]], [1, [252, 244, 222]]],
    altin: [[0, [96, 58, 16]], [0.45, [190, 132, 34]], [0.8, [244, 206, 96]], [1, [255, 244, 190]]],
  };
  const hc0 = SAHNE.yeniTuval(W, W), h0 = hc0.getContext('2d', { willReadFrequently: true });
  {
    const img = h0.createImageData(W, W), d = img.data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, b = ADLAR[BOL[i]];
      let c;
      if (b === 'gok' || b === 'gunes' || b === 'yaprak' || b === 'sap' || b === 'cicek' || b === 'cicekOrta' || b === 'zemin') {
        if (y < 800) {
          const t = y / 800;
          c = rampa([[0, [30, 72, 150]], [0.35, [58, 118, 190]], [0.7, [128, 170, 205]], [0.9, [214, 206, 182]], [1, [240, 206, 150]]], t + (nA(x / 200, y / 120) - 0.5) * 0.12);
          c = mixc(c, [24, 50, 120], 0.25 * sstep(400, 0, x) * sstep(500, 0, y));
          const dd = Math.hypot(x - 880, y - 140);
          c = mixc(c, [255, 226, 150], 0.9 * Math.exp(-(dd * dd) / (2 * 190 * 190)));
          c = mixc(c, [255, 250, 226], sstep(70, 40, dd));
        } else {
          const yer = 826 + (fbm(nB, x / 60, 3, 3) - 0.5) * 60;
          if (y < yer) c = rampa([[0, [200, 162, 98]], [1, [150, 112, 64]]], (y - 800) / 40);
          else {
            const t = fbm(nA, x / 38, y / 38, 3);
            c = rampa([[0, [12, 28, 22]], [0.4, [26, 56, 34]], [0.65, [52, 88, 44]], [1, [118, 128, 62]]], clamp(t * 1.25 - 0.1 + 0.15 * sstep(840, 800, y), 0, 1));
            c = mixc(c, [96, 62, 34], 0.55 * sstep(0.58, 0.72, fbm(nC, x / 70, y / 50, 3)));
          }
        }
      } else if (b === 'kubbe') {
        let l = kubbeIsik(x, y);
        const u = kubbeU(x, y);
        // kaburga çizgileri
        const r = Math.max(1, kubbeR[clamp(y, 300, 555)]);
        const faz = ((Math.asin(u) + Math.PI / 2) / (Math.PI / 16));
        const fr = faz - Math.round(faz), px = Math.abs(fr) * (Math.PI / 16) * r * Math.sqrt(1 - u * u);
        let k = 1;
        if (px < 1.3) k = 0.72; else if (fr > 0 && px < 3.2) k = 1.08;
        // tabanda sıcak yansıyan ışık
        l = l * k + 0.08 * sstep(500, 555, y) * sstep(0.2, -0.6, u);
        c = rampa(RAMPA.kubbe, clamp(l, 0, 1));
      } else if (b === 'kasnak') {
        const ust = y < 610;
        let l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.88 : 1);
        if (ust && y < 568) l *= 0.55 + 0.45 * sstep(555, 568, y);
        if (!ust && y < 618) l *= 0.6 + 0.4 * sstep(610, 618, y);
        c = rampa(RAMPA.kasnak, l);
      } else if (b === 'kaide') {
        let l = 0.5 + 0.42 * clamp((x - 300) / 520, 0, 1);
        if (y < 704) l = 0.95; else if (y < 714) l *= 0.6 + 0.4 * sstep(704, 714, y);
        if (y > 786) l *= 0.85;
        c = rampa(RAMPA.tas, l);
      } else if (b === 'minare') {
        let l = silindirIsik(x, 300, minareYari(y));
        if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) l *= 0.55;
        l *= 1 - 0.55 * minareGolge(x, y);
        c = rampa(RAMPA.tas, l * 0.95);
      } else if (b === 'altin') {
        const cx = x > 430 ? 560 : 300;
        c = rampa(RAMPA.altin, clamp(0.55 + (x - cx) / 14, 0, 1));
      } else if (b === 'pencere') {
        const kasnakta = y > 555 && y < 692 && x > 330 && x < 790;
        c = kasnakta ? mixc([8, 24, 18], [26, 46, 30], silindirIsik(x, 560, 226)) : [70, 54, 52];
      } else c = [128, 128, 128];
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    h0.putImageData(img, 0, 0);
    // bulutlar: sıcak beyaz tepeler, mor-gri altlar
    const rb = SAHNE.rng(3);
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]]) {
      for (let i = 0; i < 16; i++) {
        const x = bx + (rb() - 0.5) * 150 * bs, y = by + (rb() - 0.5) * 30 * bs, r = (22 + rb() * 26) * bs;
        const g = h0.createRadialGradient(x, y - r * 0.3, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,248,232,0.5)'); g.addColorStop(0.6, 'rgba(236,226,226,0.3)'); g.addColorStop(1, 'rgba(200,196,220,0)');
        h0.fillStyle = g; h0.beginPath(); h0.arc(x, y, r, 0, Math.PI * 2); h0.fill();
      }
    }
    // yapı ayrıntıları: zikzak, korkuluk, korniş
    h0.save();
    h0.strokeStyle = 'rgb(96,80,74)'; h0.lineWidth = 3; h0.lineJoin = 'miter';
    for (const z of SAHNE.zikzakCizgileri()) { h0.beginPath(); z.forEach(([x, y], i) => (i ? h0.lineTo(x, y) : h0.moveTo(x, y))); h0.stroke(); }
    for (const [x1, x2, y1, y2] of [[252, 348, 436, 456], [260, 340, 272, 290]]) {
      for (let k = 0; k < 10; k++) { const x = x1 + 5 + ((x2 - x1 - 10) * (k + 0.5)) / 10; h0.fillStyle = 'rgba(70,58,60,0.75)'; h0.fillRect(x - 2, y1 + 4, 4, y2 - y1 - 8); }
    }
    h0.fillStyle = 'rgba(252,244,224,0.9)'; h0.fillRect(290, 692, 540, 5);
    h0.restore();
  }
  // bitkiler: hedef görüntüye renk + yön haritasına doğrultu
  const yc = SAHNE.yeniTuval(W, W), y0 = yc.getContext('2d', { willReadFrequently: true });
  {
    const B = SAHNE.bitki, rb = SAHNE.rng(17);
    const yonRenk = (a) => `rgb(${Math.round((Math.cos(2 * a) + 1) * 127.5)},${Math.round((Math.sin(2 * a) + 1) * 127.5)},255)`;
    h0.lineCap = 'round'; y0.lineCap = 'round';
    for (const s of B.saplar) {
      h0.strokeStyle = 'rgb(62,96,46)'; h0.lineWidth = 4.5;
      const p = new Path2D(SAHNE.yol(s)); h0.stroke(p);
      for (let i = 0; i < s.length - 1; i++) { y0.strokeStyle = yonRenk(Math.atan2(s[i + 1][1] - s[i][1], s[i + 1][0] - s[i][0])); y0.lineWidth = 6; y0.beginPath(); y0.moveTo(...s[i]); y0.lineTo(...s[i + 1]); y0.stroke(); }
    }
    for (const yp of B.yapraklar) {
      const p = new Path2D(SAHNE.yaprakYolu(yp));
      const nx = -Math.sin(yp.aci), ny = Math.cos(yp.aci);
      const isikli = nx * 0.74 + ny * -0.67 > 0 ? 1 : -1;
      const W2_ = yp.uzunluk * yp.genislik * 0.5;
      const g = h0.createLinearGradient(yp.x - nx * W2_ * isikli, yp.y - ny * W2_ * isikli, yp.x + nx * W2_ * isikli, yp.y + ny * W2_ * isikli);
      const koyu = yp.uzunluk > 50 ? 0.8 : 1, t = rb();
      g.addColorStop(0, `rgb(${18 * koyu},${50 * koyu},${34 * koyu})`);
      g.addColorStop(0.5, `rgb(${(46 + t * 20) * koyu},${(92 + t * 20) * koyu},${44 * koyu})`);
      g.addColorStop(1, `rgb(${(120 + t * 30) * koyu},${(158 + t * 16) * koyu},${66 * koyu})`);
      h0.fillStyle = g; h0.fill(p);
      y0.fillStyle = yonRenk(yp.aci); y0.fill(p);
    }
    for (const t of B.tomurcuklar) {
      const p = new Path2D(SAHNE.tomurcukYolu(t));
      const g = h0.createLinearGradient(t.x - 8, t.y - 8, t.x + 8, t.y + 8);
      g.addColorStop(0, 'rgb(250,190,206)'); g.addColorStop(1, 'rgb(176,64,104)');
      h0.fillStyle = g; h0.fill(p); y0.fillStyle = yonRenk(t.aci); y0.fill(p);
    }
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const p = new Path2D(SAHNE.elipsYolu(e));
        const g = h0.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 1.05);
        g.addColorStop(0, 'rgb(226,150,170)'); g.addColorStop(0.35, 'rgb(250,240,236)'); g.addColorStop(1, 'rgb(255,250,240)');
        h0.fillStyle = g; h0.fill(p);
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
        h0.fillStyle = `rgba(120,112,170,${clamp(-yon * 0.55 + 0.12, 0, 0.6)})`; h0.fill(p);
        h0.strokeStyle = 'rgba(110,100,140,0.45)'; h0.lineWidth = 1.4; h0.stroke(p);
        y0.fillStyle = yonRenk(e.aci); y0.fill(p);
      }
      h0.fillStyle = 'rgb(232,170,40)'; h0.beginPath(); h0.arc(c.x, c.y, c.r * 0.2, 0, Math.PI * 2); h0.fill();
      h0.fillStyle = 'rgb(150,90,20)';
      for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; h0.beginPath(); h0.arc(c.x + Math.cos(a) * c.r * 0.26, c.y + Math.sin(a) * c.r * 0.26, Math.max(1.4, c.r * 0.04), 0, Math.PI * 2); h0.fill(); }
      y0.fillStyle = yonRenk(rb() * 3); y0.beginPath(); y0.arc(c.x, c.y, c.r * 0.22, 0, Math.PI * 2); y0.fill();
    }
  }
  const HV = h0.getImageData(0, 0, W, W).data;
  const YV = y0.getImageData(0, 0, W, W).data;
  const hedef = (x, y) => { const i = (clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)) * 4; return [HV[i], HV[i + 1], HV[i + 2]]; };

  // ------------------------------------------------------------ doğrultu alanı: darbeler biçimi izler
  function yon(x, y) {
    const xi = clamp(Math.round(x), 0, W - 1), yi = clamp(Math.round(y), 0, W - 1), i = yi * W + xi;
    if (YV[i * 4 + 2] > 200) return Math.atan2(YV[i * 4 + 1] / 127.5 - 1, YV[i * 4] / 127.5 - 1) / 2;
    const b = ADLAR[BOL[i]];
    switch (b) {
      case 'kubbe': { const u = kubbeU(x, y); return Math.atan2(1, u * kubbeDr[clamp(yi, 300, 555)]); }
      case 'kasnak': return 0.06 * clamp((x - 560) / 220, -1, 1) * (y < 610 ? -1 : 1) + (nB(x / 40, y / 40) - 0.5) * 0.1;
      case 'kaide': return y < 706 ? 0 : (nB(x / 60, y / 30) - 0.5) * 0.25;
      case 'minare': {
        if ((y > 436 && y < 490) || (y > 270 && y < 318) || (y > 196 && y < 208) || (y > 520 && y < 584)) return (nB(x / 20, y / 20) - 0.5) * 0.2;
        return Math.PI / 2 + (nB(x / 30, y / 30) - 0.5) * 0.25;
      }
      case 'pencere': case 'altin': return Math.PI / 2;
      case 'zemin': return (nB(x / 50, y / 50) - 0.5) * 0.4;
      default: {
        // gök: geniş, eğik süpürmeler; güneşin çevresinde hafif dönen
        const dx = x - 880, dy = y - 140, d = Math.hypot(dx, dy);
        const tan = Math.atan2(dy, dx) + Math.PI / 2;
        const sup = -0.32 + (fbm(nC, x / 260, y / 260, 2) - 0.5) * 1.1;
        const w = 0.8 * Math.exp(-d / 120);
        return Math.atan2(Math.sin(tan) * w + Math.sin(sup) * (1 - w), Math.cos(tan) * w + Math.cos(sup) * (1 - w));
      }
    }
  }

  // ------------------------------------------------------------ tuval: astar (imprimatura) + bez dokusu
  const hc = SAHNE.yeniTuval(W2, W2), hctx = hc.getContext('2d', { willReadFrequently: true });
  hctx.setTransform(S2, 0, 0, S2, 0, 0);
  hctx.fillStyle = '#000'; hctx.fillRect(0, 0, W, W);
  ctx.fillStyle = '#b07a4a'; ctx.fillRect(0, 0, W, W);
  // astar fırça izleri (ince, geniş, şeffaf)
  for (let i = 0; i < 260; i++) {
    const x = R() * W, y = R() * W, a = R() * 0.6 - 0.3;
    ctx.strokeStyle = `rgba(${170 + R() * 40},${110 + R() * 30},${64 + R() * 20},0.2)`; ctx.lineWidth = 30 + R() * 50;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 200, y + Math.sin(a) * 200); ctx.stroke();
  }

  // ------------------------------------------------------------ fırça darbesi: kıl demeti
  function rgb(c) { return `rgb(${clamp(Math.round(c[0]), 0, 255)},${clamp(Math.round(c[1]), 0, 255)},${clamp(Math.round(c[2]), 0, 255)})`; }
  function darbe(pts, Rb, renk, o) {
    o = o || {};
    const n = pts.length;
    if (n < 2) return;
    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const Lt = cum[n - 1];
    if (Lt < 0.5) return;

      const nl = Math.hypot(gx, gy, 1), nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
      const dif = nx * Lx + ny * Ly + nz * Lz;
      const tab = Lz; // düz yüzeyin aydınlığı
      const sh = clamp(1 + (dif - tab) * 1.1, 0.76, 1.28);
      const sp = Math.pow(Math.max(0, nx * Hx + ny * Hy + nz * Hz), 50) * 0.24;
      const j = i * 4;
      const dk = 1 + (DOK[i] - 0.25) * 0.16; // ince boyada bez iplikleri
      p[j] = clamp(p[j] * sh * dk + sp * 255, 0, 255);
      p[j + 1] = clamp(p[j + 1] * sh * dk + sp * 250, 0, 255);
      p[j + 2] = clamp(p[j + 2] * sh * dk + sp * 235, 0, 255);
    }
    ctx.putImageData(pv, 0, 0);
  }
  SAHNE.hazir();
})();
</script>
