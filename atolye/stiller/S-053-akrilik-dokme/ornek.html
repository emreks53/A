<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-053 Akrilik Dökme — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #8cc8ee; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-053 Akrilik Dökme — temiz akışkan akrilik dökme (silikonsuz flip cup / swipe): her bölge ayrı bir
// kontrollü dökmeyle kurulur; renkler birbirine karışmadan ince ve kalın, pürüzsüz şeritler hâlinde akar,
// girdaplar çizerek kıvrılır; sınırlar keskin ve zarif. Hücre, kabarcık, dantel yok. Kalın, parlak boya ve
// reçine kaplama: şerit sırtlarında ince parlamalar, geniş cam gibi yansıma.
(function () {
  'use strict';
  const S = SAHNE;
  // hesap 2048 iç çözünürlükte yapılır (K2 = 2), sonunda 2×2 ortalamayla 1024'e indirilir: keskin ama yumuşatılmış sınırlar
  const K2 = 2, W = 1024 * K2, N = W * W, W1 = 1024;
  const tuval = document.getElementById('tuval');
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  tuval.width = W1;
  tuval.height = W1;

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function hash(x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function gurultu(tohum) {
    const r = S.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 13.1; y = ny + 7.7; a *= 0.5; }
    return s / t;
  }
  const nA = gurultu(531), nB = gurultu(532), nC = gurultu(533), nD = gurultu(534), nE = gurultu(535);

  // ------------------------------------------------------------ bölgeler
  const AD = ['gok', 'gunes', 'zemin', 'minare', 'kaide', 'kasnak', 'kubbe', 'pencere', 'altin', 'sap', 'yaprak', 'cicek', 'cicekOrta'];
  const IX = {};
  AD.forEach((a, i) => (IX[a] = i));
  const bol0 = new Uint8Array(N);
  {
    const hc = S.yeniTuval(W, W);
    const hg = hc.getContext('2d', { willReadFrequently: true });
    hg.setTransform(K2, 0, 0, K2, 0, 0);
    S.ciz(hg, { bolge: true });
    const v = hg.getImageData(0, 0, W, W).data;
    // kenar yumuşatma pikselleri (iki bölge renginin karışımı) yanlış bir üçüncü bölgeye düşmesin: önce tam renkli
    // pikseller sınıflanır, karışık pikseller en yakın renkli tam komşunun bölgesini alır
    const BR = Object.entries(S.BOLGE).map(([ad, h]) => [IX[ad], parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
    const tam = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      const r = v[i * 4], g = v[i * 4 + 1], b = v[i * 4 + 2];
      let en = 0, ed = 1e9;
      for (const [k, R, G, B] of BR) { const dd = (r - R) * (r - R) + (g - G) * (g - G) + (b - B) * (b - B); if (dd < ed) { ed = dd; en = k; } }
      bol0[i] = en;
      tam[i] = ed < 300 ? 1 : 0;
    }
    for (let Y = 1; Y < W - 1; Y++) for (let X = 1; X < W - 1; X++) {
      const i = Y * W + X;
      if (tam[i]) continue;
      const r = v[i * 4], g = v[i * 4 + 1], b = v[i * 4 + 2];
      let en = -1, ed = 1e9;
      for (const j of [i - 1, i + 1, i - W, i + W, i - W - 1, i - W + 1, i + W - 1, i + W + 1]) {
        if (!tam[j]) continue;
        const dd = (r - v[j * 4]) ** 2 + (g - v[j * 4 + 1]) ** 2 + (b - v[j * 4 + 2]) ** 2;
        if (dd < ed) { ed = dd; en = bol0[j]; }
      }
      if (en >= 0) bol0[i] = en;
    }
    // güneş diskinin kenarındaki yumuşatma pikselleri başka bölge sanılmasın (halkada koyu benek bırakır)
    for (let Y = 0; Y < 280 * K2; Y++) for (let X = 740 * K2; X < W; X++) {
      const i = Y * W + X;
      if (Math.hypot(X / K2 - 880, Y / K2 - 140) < 130 && bol0[i] !== IX.gok) bol0[i] = IX.gunes;
    }
  }
  // akışkan sınır: bölge, düşük frekanslı, yumuşak gürültüyle kaydırılmış noktadan okunur (yapıda az, gök/zeminde çok)
  const bol = new Uint8Array(N);
  const kay = new Int32Array(N); // kaydırılmış örnek noktası (ayrıntı katmanı da aynı akışla okunur)
  for (let Y = 0; Y < W; Y++) {
    for (let X = 0; X < W; X++) {
      const x = X / K2, y = Y / K2;
      const b0 = bol0[Y * W + X];
      const yapi = b0 !== IX.gok && b0 !== IX.zemin;
      const gen = yapi ? 1.1 : 1.4;
      const ox = (nA(x * 0.04, y * 0.04) - 0.5) * 2 * gen;
      const oy = (nA(x * 0.04 + 50, y * 0.04 + 50) - 0.5) * 2 * gen;
      const sx = clamp(Math.round((x + ox) * K2), 0, W - 1), sy = clamp(Math.round((y + oy) * K2), 0, W - 1);
      bol[Y * W + X] = bol0[sy * W + sx];
      kay[Y * W + X] = sy * W + sx;
    }
  }

  // ------------------------------------------------------------ ayrıntı katmanı: ince dökülmüş çizgiler
  // (korkuluk boşlukları, şerefe altı gölgesi, zikzak, korniş ve kasnak kenarları) — renk = boya, alfa = örtme
  const detay = S.yeniTuval(W, W);
  {
    const g = detay.getContext('2d');
    g.setTransform(K2, 0, 0, K2, 0, 0);
    const KOYU = 'rgba(44,92,132,0.85)', ALT = 'rgba(222,170,60,0.95)', GOLGE = 'rgba(132,160,196,0.5)';
    for (const p of S.minareParcalari()) {
      if (p.ad.startsWith('çıkma')) { g.fillStyle = GOLGE; g.fill(new Path2D(S.yol(p.noktalar, true))); }
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
        const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
        const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
        g.fillStyle = ALT; g.fillRect(x1, y1, x2 - x1, 2);
        g.fillStyle = KOYU; g.fillRect(x1, y2 - 2, x2 - x1, 2);
      }
      if (p.tip === 'korkuluk') {
        const adet = 8;
        g.fillStyle = KOYU;
        for (let i = 0; i < adet; i++) {
          const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * (i + 0.5)) / adet;
          g.fillRect(x - 2.6, p.y1 + 4, 5.2, p.y2 - p.y1 - 4);
        }
        g.fillStyle = ALT; g.fillRect(p.x1, p.y1, p.x2 - p.x1, 2);
      }
      if (p.ad.startsWith('gövde')) {
        const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
        const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys);
        const gr = g.createLinearGradient(0, y1, 0, y1 + 26);
        gr.addColorStop(0, 'rgba(126,152,190,0.5)');
        gr.addColorStop(1, 'rgba(126,152,190,0)');
        g.fillStyle = gr; g.fillRect(x1, y1, x2 - x1, 26);
      }
    }
    g.strokeStyle = ALT; g.lineWidth = 2.6; g.lineJoin = 'miter';
    for (const z of S.zikzakCizgileri()) g.stroke(new Path2D(S.yol(z)));
    const K = S.kaide;
    g.fillStyle = ALT; g.fillRect(K.kornis.x1, K.kornis.y1, K.kornis.x2 - K.kornis.x1, 2.5);
    g.fillStyle = KOYU; g.fillRect(K.kornis.x1, K.kornis.y2 - 1, K.kornis.x2 - K.kornis.x1, 2.5);
    g.fillStyle = GOLGE; g.fillRect(K.x1, K.y1 + 1, K.x2 - K.x1, 10);
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(30,128,70,0.95)';
    g.lineWidth = 5;
    for (const sp of S.bitki.saplar) g.stroke(new Path2D(S.yol(sp)));
    g.strokeStyle = 'rgba(150,215,90,0.9)';
    g.lineWidth = 1.4;
    for (const sp of S.bitki.saplar) { g.save(); g.translate(1, -0.5); g.stroke(new Path2D(S.yol(sp))); g.restore(); }
    for (const q of S.kasnak) { g.fillStyle = ALT; g.fillRect(q.x1, q.y1, q.x2 - q.x1, 2); g.fillStyle = KOYU; g.fillRect(q.x1, q.y2 - 2, q.x2 - q.x1, 2); }
  }
  const detayV = detay.getContext('2d').getImageData(0, 0, W, W).data;

  // ------------------------------------------------------------ şerit tabloları (dökülen boya katmanları)
  // tablo: [{a, b, c, h}] — s aralığı, renk, kalınlık (yükseklik)
  function tablo(tohum, s0, s1, secici) {
    const r = S.rng(tohum);
    const out = [];
    let s = s0;
    while (s < s1) {
      const t = (s - s0) / (s1 - s0);
      const e = secici(t, r);
      const w = e.w[0] + r() * (e.w[1] - e.w[0]);
      out.push({ a: s, b: s + w, c: e.c, h: e.h === undefined ? r() * 0.5 : e.h });
      s += w;
    }
    return out;
  }
  function bul(tab, s) {
    let lo = 0, hi = tab.length - 1;
    if (s <= tab[0].a) return 0;
    if (s >= tab[hi].b) return hi;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (tab[m].b <= s) lo = m + 1;
      else hi = m;
    }
    return lo;
  }
  const secAgirlik = (r, liste) => {
    let top = 0;
    for (const e of liste) top += e.p;
    let u = r() * top;
    for (const e of liste) { u -= e.p; if (u <= 0) return e; }
    return liste[liste.length - 1];
  };
  // renkler: aydınlık, taze dökme paleti (lacivert ve koyu tonlar yok; koyu yalnız ince vurgu)
  const C = {
    kobalt: hex('#2C6FC9'), gokmavi: hex('#3E97DE'), seruleum: hex('#5CB2EA'), turkuaz: hex('#3CC2D2'), aqua: hex('#86DCE4'),
    acikmavi: hex('#B4DDF5'), buz: hex('#DCEFFA'),
    beyaz: hex('#FBFCFA'), inci: hex('#EEF2F4'), krem: hex('#FCF3DE'), fildisi: hex('#F4EDDD'), bej: hex('#E8D8B8'), griAcik: hex('#DCDCD8'),
    zumrut: hex('#1C9A57'), yesil: hex('#2FB061'), fistik: hex('#86D257'), cagla: hex('#C2E886'), nane: hex('#9FE0B4'), petrol: hex('#178078'), cimen: hex('#48B54E'),
    koyuYesil: hex('#126B3E'),
    altin: hex('#E0AE40'), altinAcik: hex('#F8DD8C'), bronz: hex('#B07A2A'), seftali: hex('#F7C9A0'), kum: hex('#EDD3A0'), terrakota: hex('#DC9A68'),
    pembe: hex('#F4A9C4'), gul: hex('#E57FA6'), gulAcik: hex('#FCE3EC'), limon: hex('#FBEFA8'),
    pencere: hex('#1E5560'), pencereAcik: hex('#2F7D86'),
  };
  // GÖK: yukarıda gök mavisi ve seruleum, ortada turkuaz ve aqua, ufka doğru açık mavi, buz mavisi ve krem;
  // aralarda ince beyaz, açık altın ve kobalt damarlar (keskin, zarif sınırlar)
  const tGok = tablo(11, -260, 1100, (t, r) => {
    if (r() < 0.34) return secAgirlik(r, [{ p: 3.2, c: C.beyaz, w: [1.4, 4.5], h: 0.7 }, { p: 1.1, c: C.altinAcik, w: [1, 2.6], h: 0.8 }, { p: 0.9, c: C.kobalt, w: [1, 2.4], h: 0.3 }, { p: 1, c: C.turkuaz, w: [1.2, 3], h: 0.5 }]);
    if (t < 0.3) return secAgirlik(r, [{ p: 3, c: C.gokmavi, w: [12, 34] }, { p: 2.2, c: C.seruleum, w: [10, 30] }, { p: 1, c: C.turkuaz, w: [5, 14] }, { p: 0.7, c: C.kobalt, w: [4, 10], h: 0.2 }, { p: 0.9, c: C.beyaz, w: [5, 14], h: 0.7 }]);
    if (t < 0.55) return secAgirlik(r, [{ p: 2, c: C.seruleum, w: [10, 28] }, { p: 2, c: C.acikmavi, w: [12, 32] }, { p: 1.3, c: C.turkuaz, w: [5, 14] }, { p: 1.1, c: C.aqua, w: [6, 16] }, { p: 1.2, c: C.beyaz, w: [6, 18], h: 0.7 }, { p: 0.5, c: C.gokmavi, w: [4, 10] }]);
    return secAgirlik(r, [{ p: 2.4, c: C.acikmavi, w: [10, 28] }, { p: 1.6, c: C.beyaz, w: [8, 22], h: 0.7 }, { p: 1.2, c: C.buz, w: [8, 20] }, { p: 0.9, c: C.aqua, w: [5, 12] }, { p: 0.8, c: C.krem, w: [6, 16], h: 0.6 }, { p: 0.5, c: C.seruleum, w: [4, 10] }]);
  });
  // güneş çevresi: beyaz-krem halka dökmesi (puddle), ince altın halkalarla
  const tGunes = tablo(12, 0, 220, (t, r) => {
    if (t < 0.09) return { c: C.limon, w: [22, 22], h: 0.6 };
    if (t < 0.19) return { c: C.krem, w: [22, 22], h: 0.6 };
    if (t < 0.215) return { c: C.altinAcik, w: [3, 3.5], h: 0.9 };
    if (t < 0.36) return secAgirlik(r, [{ p: 3, c: C.krem, w: [4, 8], h: 0.6 }, { p: 2, c: C.beyaz, w: [3, 7], h: 0.7 }, { p: 1, c: C.altin, w: [1.2, 2.2], h: 0.9 }, { p: 1, c: C.limon, w: [3, 6], h: 0.6 }]);
    if (t < 0.46) return secAgirlik(r, [{ p: 2, c: C.beyaz, w: [4, 8], h: 0.7 }, { p: 1.4, c: C.buz, w: [3, 7], h: 0.5 }, { p: 1, c: C.altinAcik, w: [1.5, 3], h: 0.9 }]);
    return secAgirlik(r, [{ p: 2, c: C.beyaz, w: [4, 9], h: 0.7 }, { p: 1, c: C.altin, w: [1.2, 2.4], h: 0.9 }, { p: 1.4, c: C.acikmavi, w: [3, 7], h: 0.5 }]);
  });
  // ZEMİN: kum, şeftali, krem, açık terrakota; ince beyaz ve altın damarlar
  const tZemin = tablo(13, 700, 1150, (t, r) => secAgirlik(r, [{ p: 3, c: C.kum, w: [6, 20] }, { p: 1.6, c: C.seftali, w: [4, 12] }, { p: 0.9, c: C.terrakota, w: [2, 7] }, { p: 1.3, c: C.beyaz, w: [1.5, 5], h: 0.7 }, { p: 0.7, c: C.altin, w: [1.2, 3.5], h: 0.8 }, { p: 1.6, c: C.krem, w: [4, 12], h: 0.6 }]));
  // TAŞ (kaide, minare): fildişi, beyaz, inci grisi, bej ve ince altın damar
  const tTas = tablo(14, -100, 1200, (t, r) => secAgirlik(r, [{ p: 3, c: C.fildisi, w: [6, 18] }, { p: 2.6, c: C.beyaz, w: [5, 14], h: 0.6 }, { p: 1.2, c: C.inci, w: [3, 8] }, { p: 0.8, c: C.griAcik, w: [1.5, 4] }, { p: 0.7, c: C.bej, w: [2, 6] }, { p: 0.5, c: C.altin, w: [0.8, 2], h: 0.9 }]));
  // KASNAK: yatay yeşil akıntılar
  const tKasnak = tablo(15, 500, 720, (t, r) => secAgirlik(r, [{ p: 3, c: C.zumrut, w: [3, 9] }, { p: 2, c: C.yesil, w: [3, 8] }, { p: 1.1, c: C.koyuYesil, w: [2, 5] }, { p: 1, c: C.petrol, w: [1.5, 4] }, { p: 1, c: C.fistik, w: [1.5, 5] }, { p: 0.5, c: C.beyaz, w: [0.8, 2], h: 0.7 }, { p: 0.4, c: C.altin, w: [0.8, 1.6], h: 0.9 }]));
  // KUBBE: her dilim kendi şerit dizisi; kaburga yanında koyu yeşil ve ince altın/beyaz çizgi,
  // dilim ortasında zümrüt, yeşil, fıstık, çağla ve nane şeritleri
  const tDilim = [];
  for (let k = 0; k < 16; k++) {
    const r = S.rng(200 + k);
    const yarim = [];
    let s = 0;
    yarim.push({ w: 0.035 + r() * 0.02, c: C.koyuYesil, h: 0.15 });
    yarim.push({ w: 0.012 + r() * 0.008, c: r() < 0.55 ? C.altin : C.beyaz, h: 0.9 });
    while (s < 0.5) {
      const e = secAgirlik(r, [{ p: 3, c: C.zumrut, w: [0.05, 0.12] }, { p: 2.2, c: C.yesil, w: [0.05, 0.11] }, { p: 1, c: C.petrol, w: [0.015, 0.04] }, { p: 1.8, c: C.fistik, w: [0.03, 0.08] }, { p: 0.9, c: C.cagla, w: [0.02, 0.05], h: 0.6 }, { p: 0.6, c: C.nane, w: [0.015, 0.04], h: 0.6 }, { p: 0.6, c: C.beyaz, w: [0.006, 0.014], h: 0.8 }]);
      const w = e.w[0] + r() * (e.w[1] - e.w[0]);
      yarim.push({ w, c: e.c, h: e.h === undefined ? r() * 0.5 : e.h });
      s += w;
    }
    // dilim: sol yarı + aynalanmış sağ yarı
    const dizi = [];
    let a = 0;
    const tum = yarim.concat(yarim.slice().reverse());
    let top = 0;
    for (const e of tum) top += e.w;
    for (const e of tum) { const w = e.w / top; dizi.push({ a, b: a + w, c: e.c, h: e.h }); a += w; }
    tDilim.push(dizi);
  }
  // ALTIN
  const tAltin = tablo(16, -200, 2400, (t, r) => secAgirlik(r, [{ p: 3, c: C.altin, w: [3, 8], h: 0.5 }, { p: 2.2, c: C.altinAcik, w: [2, 6], h: 0.8 }, { p: 1, c: C.bronz, w: [1, 3], h: 0.2 }, { p: 0.6, c: C.beyaz, w: [0.8, 2], h: 1.0 }, { p: 0.8, c: C.limon, w: [1, 3], h: 0.6 }]));
  // YAPRAK: malakit gibi çizgili, taze yeşiller
  const tYaprak = tablo(17, -400, 2400, (t, r) => secAgirlik(r, [{ p: 3, c: C.cimen, w: [3, 9] }, { p: 2.4, c: C.zumrut, w: [3, 9] }, { p: 1.1, c: C.koyuYesil, w: [1.5, 4] }, { p: 1.4, c: C.fistik, w: [2, 6] }, { p: 0.7, c: C.cagla, w: [1, 3], h: 0.8 }, { p: 0.5, c: C.nane, w: [1, 3], h: 0.6 }]));
  // ÇİÇEK: merkezden dışa halkalar; beyaz taç yaprak, ortada limon-krem, içte ince açık pembe ve altın
  // halka, kenarda ince gül pembesi çizgi
  const tCicek = [
    { a: -1, b: 0.2, c: C.limon, h: 0.6 },
    { a: 0.2, b: 0.225, c: C.altinAcik, h: 0.8 },
    { a: 0.225, b: 0.3, c: C.krem, h: 0.6 },
    { a: 0.3, b: 0.5, c: C.beyaz, h: 0.7 },
    { a: 0.5, b: 0.525, c: C.gulAcik, h: 0.5 },
    { a: 0.525, b: 0.84, c: C.beyaz, h: 0.7 },
    { a: 0.84, b: 0.9, c: C.gulAcik, h: 0.5 },
    { a: 0.9, b: 0.95, c: C.pembe, h: 0.4 },
    { a: 0.95, b: 2, c: C.gul, h: 0.3 },
  ];

  // ------------------------------------------------------------ s alanı (akış koordinatı)
  const prof = S.kubbeProfili(400);
  const rTab = new Float32Array(560);
  for (let y = 0; y < 560; y++) {
    if (y >= 555) { rTab[y] = 201; continue; }
    if (y <= 300) { rTab[y] = 0.5; continue; }
    for (let i = 0; i < prof.length - 1; i++) {
      if (y <= prof[i].y && y >= prof[i + 1].y) {
        const t = (prof[i].y - y) / (prof[i].y - prof[i + 1].y || 1);
        rTab[y] = prof[i].r + (prof[i + 1].r - prof[i].r) * t;
        break;
      }
    }
  }
  const cicekler = S.bitki.cicekler;
  function enYakinCicek(x, y) {
    let en = 0, ed = 1e9;
    for (let k = 0; k < cicekler.length; k++) {
      const c = cicekler[k];
      const d = Math.hypot(x - c.x, y - c.y) / c.r;
      if (d < ed) { ed = d; en = k; }
    }
    return [en, ed];
  }
  const sA = new Float32Array(N);
  const tabIx = new Uint8Array(N); // hangi tablo
  // tablo kimlikleri: 0 gök, 1 güneş, 2 zemin, 3 taş, 4 kasnak, 5–20 kubbe dilimleri, 21 altın, 22 yaprak, 23 çiçek, 24 düz
  const TABLOLAR = [tGok, tGunes, tZemin, tTas, tKasnak];
  for (let k = 0; k < 16; k++) TABLOLAR.push(tDilim[k]);
  TABLOLAR.push(tAltin, tYaprak, tCicek);
  const DILIM = Math.PI / 16;
  // girdaplar: dökülen boyanın tuval eğilirken çizdiği zarif kıvrımlar (gökte ve zeminde)
  const GIRDAP = [
    { x: 150, y: 300, R: 150, k: 3.4 },
    { x: 520, y: 128, R: 120, k: -2.6 },
    { x: 940, y: 400, R: 120, k: 2.8 },
    { x: 60, y: 560, R: 110, k: -1.8 },
    { x: 690, y: 210, R: 70, k: 1.6 },
  ];
  const GIRDAP_Z = [
    { x: 330, y: 960, R: 120, k: -1.6 },
    { x: 760, y: 1000, R: 140, k: 1.8 },
  ];
  function girdap(x, y, liste) {
    for (const g of liste) {
      const dx = x - g.x, dy = y - g.y;
      const a = g.k * Math.exp(-(dx * dx + dy * dy) / (g.R * g.R));
      if (Math.abs(a) < 1e-3) continue;
      const ca = Math.cos(a), sa = Math.sin(a);
      x = g.x + dx * ca - dy * sa;
      y = g.y + dx * sa + dy * ca;
    }
    return [x, y];
  }
  function sHesap(x, y, b) {
    switch (b) {
      case IX.gok: case IX.gunes: {
        const dx = x - 880, dy = y - 140, d = Math.hypot(dx, dy);
        const dg = d + (fbm(nE, x * 0.008, y * 0.008, 2) - 0.5) * 8 + Math.sin(Math.atan2(dy, dx) * 3 + 1) * 3;
        if (dg < 118) return [dg, 1];
        const [px, py] = girdap(x, y, GIRDAP);
        const q1 = fbm(nC, px * 0.0024, py * 0.003, 2), q2 = fbm(nD, px * 0.0024 + 5, py * 0.003 + 5, 2);
        const w = fbm(nA, px * 0.003 + 1.8 * q1, py * 0.0042 + 1.8 * q2, 3) - 0.5;
        return [py + w * 240, 0];
      }
      case IX.zemin: {
        const [px, py] = girdap(x, y, GIRDAP_Z);
        return [py + (fbm(nA, px * 0.005, py * 0.016, 3) - 0.5) * 80 + Math.sin(px * 0.01) * 10, 2];
      }
      case IX.kaide:
        return [y * 1.4 + (fbm(nB, x * 0.008, y * 0.03, 4) - 0.5) * 70, 3];
      case IX.minare:
        return [x * 2 + y * 0.12 + (fbm(nC, x * 0.03, y * 0.006, 4) - 0.5) * 80, 3];
      case IX.kasnak:
        return [y + (fbm(nD, x * 0.01, y * 0.05, 3) - 0.5) * 22, 4];
      case IX.kubbe: {
        const yc = clamp(Math.round(y), 301, 554);
        const r = Math.max(1, rTab[yc]);
        const u = clamp((x - 560) / r, -0.9995, 0.9995);
        const ph = Math.asin(u);
        const g = (ph + Math.PI / 2) / DILIM;
        const k = clamp(Math.floor(g), 0, 15);
        let t = g - k + (fbm(nE, x * 0.012, y * 0.02, 3) - 0.5) * 0.22 * Math.sin(Math.PI * (g - k));
        return [clamp(t, 0.0005, 0.9995), 5 + k];
      }
      case IX.altin: case IX.cicekOrta:
        return [y * 2.2 + x * 0.6 + (fbm(nA, x * 0.05, y * 0.05, 3) - 0.5) * 30, 21];
      case IX.yaprak: case IX.sap:
        return [x * 0.7 + y * 0.9 + (fbm(nB, x * 0.012, y * 0.012, 4) - 0.5) * 140, 22];
      case IX.cicek: {
        const [k, d] = enYakinCicek(x, y);
        const c = cicekler[k];
        // çiçek, ortasına dökülmüş halkalarla (ring pour): s = merkeze uzaklık; taç yaprak kenarına
        // yaklaştıkça (en yakın elipsin kenar koordinatı) s 1'e çıkar, böylece kenar boyunca ince pembe şerit kalır
        let en = 9;
        for (const e of S.tacYapraklari(c)) {
          const dx = x - e.cx, dy = y - e.cy, ca = Math.cos(e.aci), sa = Math.sin(e.aci);
          const u = (dx * ca + dy * sa) / e.rx, v = (-dx * sa + dy * ca) / e.ry;
          const q = Math.sqrt(u * u + v * v);
          if (q < en) en = q;
        }
        const kenarlik = Math.min(en, 1.05) * sstep(0.3, 0.62, d);
        const sv = Math.max(d * 0.8, kenarlik * kenarlik * (3 - 2 * Math.min(1, kenarlik)));
        return [sv + (fbm(nC, x * 0.04, y * 0.04, 2) - 0.5) * 0.06, 23];
      }
      default:
        return [0, 24];
    }
  }
  for (let Y = 0; Y < W; Y++) {
    for (let X = 0; X < W; X++) {
      const i = Y * W + X;
      const [s, t] = sHesap((X + 0.5) / K2, (Y + 0.5) / K2, bol[i]);
      sA[i] = s;
      tabIx[i] = t;
    }
  }

  // ------------------------------------------------------------ renk + kalınlık
  const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), H = new Float32Array(N);
  for (let Y = 0; Y < W; Y++) {
    for (let X = 0; X < W; X++) {
      const i = Y * W + X;
      const x = (X + 0.5) / K2, y = (Y + 0.5) / K2;
      const b = bol[i];
      const ti = tabIx[i];
      if (ti === 24) {
        // pencere: koyu petrol yeşili, derin parlak havuz (küçük koyu vurgu)
        const c = b === IX.pencere ? mix(C.pencere, C.pencereAcik, 0.45 * nA(x * 0.06, y * 0.03)) : C.zumrut;
        R[i] = c[0]; G[i] = c[1]; B[i] = c[2]; H[i] = -0.2; continue;
      }
      const tab = TABLOLAR[ti];
      const s = sA[i];
      // gradyan büyüklüğü (aynı tabloda komşu): kenar yumuşatma için
      const iR = X < W - 1 && tabIx[i + 1] === ti ? i + 1 : i;
      const iL = X > 0 && tabIx[i - 1] === ti ? i - 1 : i;
      const iD = Y < W - 1 && tabIx[i + W] === ti ? i + W : i;
      const iU = Y > 0 && tabIx[i - W] === ti ? i - W : i;
      const gx = (sA[iR] - sA[iL]) / Math.max(1, (iR - iL)), gy = (sA[iD] - sA[iU]) / Math.max(1, (iD - iU) / W);
      const gm = Math.max(1e-4, Math.hypot(gx, gy));
      const k = bul(tab, s);
      const e = tab[k];
      const da = (s - e.a) / gm, db = (e.b - s) / gm; // piksel cinsinden kenar uzaklığı
      let c = e.c;
      let h = e.h;
      if (da < db && k > 0 && da < 0.7) {
        const t = 0.5 - da / 1.4;
        c = mix(c, tab[k - 1].c, t);
        h = h + (tab[k - 1].h - h) * t;
      } else if (db <= da && k < tab.length - 1 && db < 0.7) {
        const t = 0.5 - db / 1.4;
        c = mix(c, tab[k + 1].c, t);
        h = h + (tab[k + 1].h - h) * t;
      }
      // şerit kenarında hafif sırt (boya kalınlığı)
      const kenar = Math.min(da, db);
      h += 0.36 * Math.exp(-kenar * kenar / 2.2);
      // kubbe hacmi: sola doğru koyulaşan, sağ üstte açılan ton
      if (b === IX.kubbe) {
        const yc = clamp(Math.round(y), 301, 554);
        const u = clamp((x - 560) / Math.max(1, rTab[yc]), -1, 1);
        const ph = Math.asin(u);
        const isik = Math.max(0, Math.sin(ph) * 0.6 + Math.cos(ph) * 0.8);
        const v = (555 - y) / 255;
        const f = 0.74 + 0.36 * isik + 0.06 * v;
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.kasnak) {
        const u = clamp((x - 560) / 226, -1, 1);
        const ph = Math.asin(u);
        const f = 0.76 + 0.32 * Math.max(0, Math.sin(ph) * 0.6 + Math.cos(ph) * 0.8);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.minare) {
        const u = clamp((x - 300) / 34, -1, 1);
        const f = 0.86 + 0.16 * Math.max(0, u * 0.6 + Math.sqrt(1 - u * u) * 0.8);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.kaide) {
        const f = 0.9 + 0.1 * ((x - 300) / 520);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.sap) {
        c = mix(c, C.koyuYesil, 0.4);
      } else if (b === IX.cicekOrta) {
        c = mix(c, C.altin, 0.3);
      }
      const dk = kay[i] * 4, da2 = b === IX.cicek || b === IX.cicekOrta || b === IX.yaprak ? 0 : detayV[dk + 3] / 255;
      if (da2 > 0.02) { c = mix(c, [detayV[dk], detayV[dk + 1], detayV[dk + 2]], da2); h += 0.4 * da2; }
      R[i] = c[0]; G[i] = c[1]; B[i] = c[2]; H[i] = h;
    }
  }

  // bölge sınırlarında ince, keskin birleşme çizgisi (iki dökme buluşuyor)
  for (let y = 1; y < W - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, b = bol[i];
      const gk = (q) => (q === IX.gunes ? IX.gok : q);
      const bb = gk(b);
      if (gk(bol[i + 1]) !== bb || gk(bol[i - 1]) !== bb || gk(bol[i + W]) !== bb || gk(bol[i - W]) !== bb) {
        const f = b === IX.gok || b === IX.zemin ? 0.9 : 0.8;
        R[i] *= f; G[i] *= f; B[i] *= f;
        H[i] += 0.25;
      }
    }
  }

  // ------------------------------------------------------------ parlak reçine ışığı
  const Hs = new Float32Array(N);
  // hafif yumuşatma (kalın boya kenarları yuvarlanır)
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let s = H[i] * 4, n = 4;
      if (x > 0) { s += H[i - 1]; n++; }
      if (x < W - 1) { s += H[i + 1]; n++; }
      if (y > 0) { s += H[i - W]; n++; }
      if (y < W - 1) { s += H[i + W]; n++; }
      Hs[i] = s / n;
    }
  }
  const Lx = 0.5, Ly = -0.55, Lz = 0.67;
  const hm = Math.hypot(Lx, Ly, Lz + 1);
  const Hx = Lx / hm, Hy = Ly / hm, Hz = (Lz + 1) / hm;
  const RO = new Float32Array(N), GO = new Float32Array(N), BO = new Float32Array(N);
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const hx = (Hs[y * W + Math.min(W - 1, x + 1)] - Hs[y * W + Math.max(0, x - 1)]) * 0.5;
      const hy = (Hs[Math.min(W - 1, y + 1) * W + x] - Hs[Math.max(0, y - 1) * W + x]) * 0.5;
      // büyük ölçekli dalgalanma (boya yüzeyi tam düz değil)
      const ux = (fbm(nD, x * 0.004, y * 0.004, 2) - 0.5) * 0.3, uy = (fbm(nD, x * 0.004 + 30, y * 0.004 + 30, 2) - 0.5) * 0.3;
      let nx = -hx * 1.6 + ux, ny = -hy * 1.6 + uy, nz = 1;
      const m = Math.hypot(nx, ny, nz);
      nx /= m; ny /= m; nz /= m;
      const dif = nx * Lx + ny * Ly + nz * Lz;
      const ndh = Math.max(0, nx * Hx + ny * Hy + nz * Hz);
      const sp = Math.pow(ndh, 70) * 0.9 + Math.pow(ndh, 18) * 0.1;
      const golge = 0.86 + 0.2 * (dif - Lz) / (1 - Lz + 1e-6) * 0.5 + 0.14;
      RO[i] = clamp(R[i] * golge + sp * 255, 0, 255);
      GO[i] = clamp(G[i] * golge + sp * 255, 0, 255);
      BO[i] = clamp(B[i] * golge + sp * 255, 0, 255);
    }
  }
  // 2×2 ortalamayla 1024'e indir
  const id = ctx.createImageData(W1, W1), d = id.data;
  for (let y = 0; y < W1; y++) {
    for (let x = 0; x < W1; x++) {
      const i = 2 * y * W + 2 * x, o = (y * W1 + x) * 4;
      d[o] = (RO[i] + RO[i + 1] + RO[i + W] + RO[i + W + 1]) * 0.25;
      d[o + 1] = (GO[i] + GO[i + 1] + GO[i + W] + GO[i + W + 1]) * 0.25;
      d[o + 2] = (BO[i] + BO[i + 1] + BO[i + W] + BO[i + W + 1]) * 0.25;
      d[o + 3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  // reçine kaplamada geniş, yumuşak bir pencere yansıması (sol üst köşe)
  {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(30px)';
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.moveTo(-60, -60);
    ctx.lineTo(330, -60);
    ctx.lineTo(-60, 330);
    ctx.closePath();
    ctx.fill();
    // ince, uzun bir pencere yansıması (reçine kaplamanın parlaklığı)
    ctx.filter = 'blur(9px)';
    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath();
    ctx.moveTo(40, 300);
    ctx.lineTo(300, 40);
    ctx.lineTo(328, 52);
    ctx.lineTo(62, 318);
    ctx.closePath();
    ctx.fill();
    ctx.filter = 'none';
    ctx.restore();
  }
  S.hazir();
})();
</script>
