<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-053 Akrilik Dökme — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #10204f; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-053 Akrilik Dökme — akışkan akrilik dökme (fluid art): her bölge ayrı bir kontrollü dökmeyle kurulur;
// renkler birbirine karışmadan ince ve kalın akıntı şeritleri hâlinde kıvrılır, silikonun açtığı hücreler
// (cells) alttaki rengi gösterir, sık hücreler arasında dantel (lacing) ağı kalır. Kalın, parlak boya ve
// reçine kaplama: şerit sırtlarında ve hücre kenarlarında keskin parlamalar.
(function () {
  'use strict';
  const S = SAHNE;
  const W = 1024, N = W * W;
  const tuval = document.getElementById('tuval');
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  tuval.width = W;
  tuval.height = W;

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function hash(x, y, s) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function gurultu(tohum) {
    const r = S.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 13.1; y = ny + 7.7; a *= 0.5; }
    return s / t;
  }
  const nA = gurultu(531), nB = gurultu(532), nC = gurultu(533), nD = gurultu(534), nE = gurultu(535);

  // ------------------------------------------------------------ bölgeler
  const AD = ['gok', 'gunes', 'zemin', 'minare', 'kaide', 'kasnak', 'kubbe', 'pencere', 'altin', 'sap', 'yaprak', 'cicek', 'cicekOrta'];
  const IX = {};
  AD.forEach((a, i) => (IX[a] = i));
  const harita = S.bolgeHaritasi();
  const bol0 = new Uint8Array(N);
  {
    const v = harita.veri;
    for (let i = 0; i < N; i++) bol0[i] = IX[S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])];
    // güneş diskinin kenarındaki yumuşatma pikselleri başka bölge sanılmasın (halkada koyu benek bırakır)
    for (let y = 0; y < 280; y++) for (let x = 740; x < W; x++) {
      const i = y * W + x;
      if (Math.hypot(x - 880, y - 140) < 130 && bol0[i] !== IX.gok) bol0[i] = IX.gunes;
    }
  }
  // akışkan sınır: bölge, düşük frekanslı gürültüyle kaydırılmış noktadan okunur (yapıda az, gök/zeminde çok)
  const bol = new Uint8Array(N);
  const kay = new Int32Array(N); // kaydırılmış örnek noktası (ayrıntı katmanı da aynı akışla okunur)
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const b0 = bol0[y * W + x];
      const yapi = b0 !== IX.gok && b0 !== IX.zemin;
      const gen = yapi ? 2.2 : 3.5;
      const ox = (nA(x * 0.05, y * 0.05) - 0.5) * 2 * gen + (nB(x * 0.15, y * 0.15) - 0.5) * 1.2;
      const oy = (nA(x * 0.05 + 50, y * 0.05 + 50) - 0.5) * 2 * gen + (nB(x * 0.15 + 9, y * 0.15 + 9) - 0.5) * 1.2;
      const sx = clamp(Math.round(x + ox), 0, W - 1), sy = clamp(Math.round(y + oy), 0, W - 1);
      bol[y * W + x] = bol0[sy * W + sx];
      kay[y * W + x] = sy * W + sx;
    }
  }

  // ------------------------------------------------------------ ayrıntı katmanı: ince dökülmüş çizgiler
  // (korkuluk boşlukları, şerefe altı gölgesi, zikzak, korniş ve kasnak kenarları) — renk = boya, alfa = örtme
  const detay = S.yeniTuval();
  {
    const g = detay.getContext('2d');
    const KOYU = 'rgba(30,44,86,0.9)', ALT = 'rgba(214,160,52,0.95)', GOLGE = 'rgba(120,136,170,0.55)';
    for (const p of S.minareParcalari()) {
      if (p.ad.startsWith('çıkma')) { g.fillStyle = GOLGE; g.fill(new Path2D(S.yol(p.noktalar, true))); }
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
        const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
        const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
        g.fillStyle = ALT; g.fillRect(x1, y1, x2 - x1, 2);
        g.fillStyle = KOYU; g.fillRect(x1, y2 - 2, x2 - x1, 2);
      }
      if (p.tip === 'korkuluk') {
        const adet = 8;
        g.fillStyle = KOYU;
        for (let i = 0; i < adet; i++) {
          const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * (i + 0.5)) / adet;
          g.fillRect(x - 2.6, p.y1 + 4, 5.2, p.y2 - p.y1 - 4);
        }
        g.fillStyle = ALT; g.fillRect(p.x1, p.y1, p.x2 - p.x1, 2);
      }
      if (p.ad.startsWith('gövde')) {
        const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
        const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys);
        const gr = g.createLinearGradient(0, y1, 0, y1 + 26);
        gr.addColorStop(0, 'rgba(110,126,166,0.6)');
        gr.addColorStop(1, 'rgba(110,126,166,0)');
        g.fillStyle = gr; g.fillRect(x1, y1, x2 - x1, 26);
      }
    }
    g.strokeStyle = ALT; g.lineWidth = 2.6; g.lineJoin = 'miter';
    for (const z of S.zikzakCizgileri()) g.stroke(new Path2D(S.yol(z)));
    const K = S.kaide;
    g.fillStyle = ALT; g.fillRect(K.kornis.x1, K.kornis.y1, K.kornis.x2 - K.kornis.x1, 2.5);
    g.fillStyle = KOYU; g.fillRect(K.kornis.x1, K.kornis.y2 - 1, K.kornis.x2 - K.kornis.x1, 2.5);
    g.fillStyle = GOLGE; g.fillRect(K.x1, K.y1 + 1, K.x2 - K.x1, 10);
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(24,110,60,0.95)';
    g.lineWidth = 5;
    for (const sp of S.bitki.saplar) g.stroke(new Path2D(S.yol(sp)));
    g.strokeStyle = 'rgba(150,215,90,0.9)';
    g.lineWidth = 1.4;
    for (const sp of S.bitki.saplar) { g.save(); g.translate(1, -0.5); g.stroke(new Path2D(S.yol(sp))); g.restore(); }
    for (const q of S.kasnak) { g.fillStyle = ALT; g.fillRect(q.x1, q.y1, q.x2 - q.x1, 2); g.fillStyle = KOYU; g.fillRect(q.x1, q.y2 - 2, q.x2 - q.x1, 2); }
  }
  const detayV = detay.getContext('2d').getImageData(0, 0, W, W).data;

  // ------------------------------------------------------------ şerit tabloları (dökülen boya katmanları)
  // tablo: [{a, b, c, h, hc}] — s aralığı, renk, kalınlık (yükseklik), hücre yoğunluğu
  function tablo(tohum, s0, s1, secici) {
    const r = S.rng(tohum);
    const out = [];
    let s = s0;
    while (s < s1) {
      const t = (s - s0) / (s1 - s0);
      const e = secici(t, r);
      const w = e.w[0] + r() * (e.w[1] - e.w[0]);
      out.push({ a: s, b: s + w, c: e.c, h: e.h === undefined ? r() * 0.5 : e.h, hc: e.hc || 0, ic: e.ic, kenar: e.kenar });
      s += w;
    }
    return out;
  }
  function bul(tab, s) {
    let lo = 0, hi = tab.length - 1;
    if (s <= tab[0].a) return 0;
    if (s >= tab[hi].b) return hi;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (tab[m].b <= s) lo = m + 1;
      else hi = m;
    }
    return lo;
  }
  const secAgirlik = (r, liste) => {
    let top = 0;
    for (const e of liste) top += e.p;
    let u = r() * top;
    for (const e of liste) { u -= e.p; if (u <= 0) return e; }
    return liste[liste.length - 1];
  };
  // renkler
  const C = {
    lacivert: hex('#0F1E56'), kobalt: hex('#1E4CAA'), gokmavi: hex('#2F86D0'), turkuaz: hex('#36B7CF'), acikmavi: hex('#A9D8F2'),
    beyaz: hex('#F7F8F6'), gumus: hex('#BCC6D2'), krem: hex('#FBF1DC'), fildisi: hex('#F2EAD8'), bej: hex('#E2D0AE'), griAcik: hex('#D3D2CF'),
    zumrut: hex('#14834A'), koyuYesil: hex('#0A4A2E'), fistik: hex('#7FCB4E'), cagla: hex('#B9E37A'), petrol: hex('#11606A'), cimen: hex('#3FA64A'),
    altin: hex('#D9A63A'), altinAcik: hex('#F7DA86'), bronz: hex('#8E5A1E'), bakir: hex('#C0703A'), kum: hex('#E3C48C'), toprak: hex('#8A5634'),
    pembe: hex('#F29BB8'), macenta: hex('#C2286E'), gulAcik: hex('#FBD9E4'), siyahMavi: hex('#081826'),
  };
  // GÖK: yukarıdan aşağı lacivert → kobalt → gök mavisi → açık mavi/beyaz; ince beyaz ve gümüş damarlar
  const tGok = tablo(11, -260, 1100, (t, r) => {
    if (r() < 0.36) return secAgirlik(r, [{ p: 3, c: C.beyaz, w: [1.2, 4], h: 0.7 }, { p: 1.2, c: C.gumus, w: [1, 2.5], h: 0.4 }, { p: 1.4, c: C.lacivert, w: [1, 3], h: 0.2 }, { p: 1, c: C.turkuaz, w: [1, 3], h: 0.5 }]);
    if (t < 0.3) return secAgirlik(r, [{ p: 3, c: C.lacivert, w: [14, 40], h: 0.1 }, { p: 2, c: C.kobalt, w: [10, 30] }, { p: 0.6, c: C.turkuaz, w: [4, 10], hc: 0.3, ic: C.lacivert }]);
    if (t < 0.55) return secAgirlik(r, [{ p: 2, c: C.kobalt, w: [10, 28] }, { p: 3, c: C.gokmavi, w: [12, 36] }, { p: 1, c: C.turkuaz, w: [5, 14], hc: 0.4, ic: C.kobalt }, { p: 0.7, c: C.lacivert, w: [4, 10] }]);
    return secAgirlik(r, [{ p: 2.2, c: C.gokmavi, w: [8, 24] }, { p: 2.5, c: C.acikmavi, w: [10, 30], hc: 0.22, ic: C.gokmavi }, { p: 1, c: C.turkuaz, w: [5, 14], hc: 0.3, ic: C.kobalt }, { p: 1.4, c: C.beyaz, w: [6, 18], hc: 0.8, ic: C.gokmavi, h: 0.7 }]);
  });
  // güneş çevresi: beyaz-krem halka dökmesi (puddle)
  const tGunes = tablo(12, 0, 220, (t, r) => {
    if (t < 0.2) return { c: C.beyaz, w: [44, 44], h: 0.6 };
    if (t < 0.215) return { c: C.altinAcik, w: [3, 3.5], h: 0.9 };
    if (t < 0.36) return secAgirlik(r, [{ p: 3, c: C.krem, w: [4, 8], h: 0.6 }, { p: 2, c: C.beyaz, w: [3, 7], h: 0.7 }, { p: 1, c: C.altin, w: [1.2, 2.2], h: 0.9 }]);
    if (t < 0.46) return secAgirlik(r, [{ p: 2, c: C.beyaz, w: [4, 8], h: 0.7, hc: 0.3, ic: C.altin }, { p: 1.4, c: C.acikmavi, w: [3, 7], h: 0.5 }, { p: 1, c: C.altinAcik, w: [1.5, 3], h: 0.9 }]);
    return secAgirlik(r, [{ p: 2, c: C.beyaz, w: [4, 9], h: 0.7, hc: 0.75, ic: C.gokmavi }, { p: 1, c: C.altin, w: [1.2, 2.4], h: 0.9 }, { p: 1.4, c: C.turkuaz, w: [3, 7], h: 0.5, hc: 0.3, ic: C.kobalt }]);
  });
  // ZEMİN: kum, bakır, toprak, beyaz damarlar
  const tZemin = tablo(13, 700, 1150, (t, r) => secAgirlik(r, [{ p: 3, c: C.kum, w: [6, 20], hc: 0.5, ic: C.bakir }, { p: 1.5, c: C.bakir, w: [4, 12] }, { p: 1, c: C.toprak, w: [3, 10] }, { p: 1.2, c: C.beyaz, w: [1.5, 5], hc: 0.9, ic: C.toprak, h: 0.7 }, { p: 0.6, c: C.altin, w: [1.5, 4], h: 0.8 }, { p: 1.5, c: C.krem, w: [4, 12], hc: 0.7, ic: C.bakir }]));
  // TAŞ (kaide, minare): fildişi, beyaz, gri, bej ve ince altın damar
  const tTas = tablo(14, -100, 1200, (t, r) => secAgirlik(r, [{ p: 3, c: C.fildisi, w: [6, 18], hc: 0.4, ic: C.bej }, { p: 2.4, c: C.beyaz, w: [5, 14], hc: 0.5, ic: C.griAcik, h: 0.6 }, { p: 1.2, c: C.griAcik, w: [2, 6] }, { p: 0.7, c: C.bej, w: [2, 7], hc: 0.3, ic: C.bronz }, { p: 0.5, c: C.altin, w: [1, 2.5], h: 0.9 }, { p: 0.5, c: C.gumus, w: [1, 3] }]));
  // KASNAK: yatay yeşil akıntılar
  const tKasnak = tablo(15, 500, 720, (t, r) => secAgirlik(r, [{ p: 3, c: C.zumrut, w: [3, 9] }, { p: 2, c: C.koyuYesil, w: [3, 8] }, { p: 1.2, c: C.petrol, w: [2, 5] }, { p: 1, c: C.cimen, w: [2, 6], hc: 0.6, ic: C.koyuYesil }, { p: 0.5, c: C.beyaz, w: [0.8, 2], h: 0.7 }, { p: 0.4, c: C.altin, w: [0.8, 1.6], h: 0.9 }]));
  // KUBBE: her dilim kendi şerit dizisi; kaburga yanında koyu yeşil, ortada fıstık/çağla ve hücreler
  const tDilim = [];
  for (let k = 0; k < 16; k++) {
    const r = S.rng(200 + k);
    const yarim = [];
    let s = 0;
    yarim.push({ w: 0.05 + r() * 0.03, c: C.koyuYesil, h: 0.1 });
    yarim.push({ w: 0.012 + r() * 0.01, c: r() < 0.5 ? C.altin : C.beyaz, h: 0.9 });
    while (s < 0.5) {
      const e = secAgirlik(r, [{ p: 3, c: C.zumrut, w: [0.05, 0.12] }, { p: 1.4, c: C.petrol, w: [0.02, 0.06] }, { p: 2, c: C.fistik, w: [0.04, 0.1], hc: 0.9, ic: C.koyuYesil }, { p: 1, c: C.cagla, w: [0.03, 0.07], hc: 1.0, ic: C.petrol }, { p: 0.7, c: C.beyaz, w: [0.008, 0.02], h: 0.8 }, { p: 1.2, c: C.cimen, w: [0.03, 0.08], hc: 0.4, ic: C.koyuYesil }]);
      const w = e.w[0] + r() * (e.w[1] - e.w[0]);
      yarim.push({ w, c: e.c, h: e.h === undefined ? r() * 0.5 : e.h, hc: e.hc || 0, ic: e.ic });
      s += w;
    }
    // dilim: sol yarı + (hafif farklı) aynalanmış sağ yarı
    const dizi = [];
    let a = 0;
    const tum = yarim.concat(yarim.slice().reverse());
    let top = 0;
    for (const e of tum) top += e.w;
    for (const e of tum) { const w = e.w / top; dizi.push({ a, b: a + w, c: e.c, h: e.h, hc: e.hc || 0, ic: e.ic }); a += w; }
    tDilim.push(dizi);
  }
  // ALTIN
  const tAltin = tablo(16, -200, 2400, (t, r) => secAgirlik(r, [{ p: 3, c: C.altin, w: [3, 8], h: 0.5 }, { p: 2, c: C.altinAcik, w: [2, 6], h: 0.8 }, { p: 1.2, c: C.bronz, w: [1, 4], h: 0.2 }, { p: 0.6, c: C.beyaz, w: [0.8, 2], h: 1.0 }, { p: 1, c: C.bakir, w: [1, 3], h: 0.3 }]));
  // YAPRAK
  const tYaprak = tablo(17, -400, 2400, (t, r) => secAgirlik(r, [{ p: 3, c: C.cimen, w: [3, 9] }, { p: 2.5, c: C.zumrut, w: [3, 9] }, { p: 1.5, c: C.koyuYesil, w: [2, 6] }, { p: 1.2, c: C.fistik, w: [2, 6], hc: 0.6, ic: C.koyuYesil }, { p: 0.5, c: C.cagla, w: [1, 3], h: 0.8 }, { p: 0.4, c: C.petrol, w: [1, 3] }]));
  // ÇİÇEK: merkezden dışa halkalar (üfleme çiçek tekniği)
  // taç yaprak: ortası beyaz-krem, dışa doğru dantelli beyaz ve açık pembe, kenarda pembe ve ince macenta
  const tCicek = [
    { a: -1, b: 0.3, c: C.beyaz, h: 0.7, hc: 0.3, ic: C.gulAcik },
    { a: 0.3, b: 0.38, c: C.gulAcik, h: 0.3, hc: 0 },
    { a: 0.38, b: 0.6, c: C.beyaz, h: 0.7, hc: 1.0, ic: C.pembe },
    { a: 0.6, b: 0.66, c: C.altinAcik, h: 0.9, hc: 0 },
    { a: 0.66, b: 0.8, c: C.gulAcik, h: 0.4, hc: 0.8, ic: C.macenta },
    { a: 0.8, b: 0.92, c: C.pembe, h: 0.3, hc: 0 },
    { a: 0.92, b: 2, c: C.macenta, h: 0.2, hc: 0 },
  ];

  // ------------------------------------------------------------ s alanı (akış koordinatı)
  const prof = S.kubbeProfili(400);
  const rTab = new Float32Array(560);
  for (let y = 0; y < 560; y++) {
    if (y >= 555) { rTab[y] = 201; continue; }
    if (y <= 300) { rTab[y] = 0.5; continue; }
    for (let i = 0; i < prof.length - 1; i++) {
      if (y <= prof[i].y && y >= prof[i + 1].y) {
        const t = (prof[i].y - y) / (prof[i].y - prof[i + 1].y || 1);
        rTab[y] = prof[i].r + (prof[i + 1].r - prof[i].r) * t;
        break;
      }
    }
  }
  const cicekler = S.bitki.cicekler;
  function enYakinCicek(x, y) {
    let en = 0, ed = 1e9;
    for (let k = 0; k < cicekler.length; k++) {
      const c = cicekler[k];
      const d = Math.hypot(x - c.x, y - c.y) / c.r;
      if (d < ed) { ed = d; en = k; }
    }
    return [en, ed];
  }
  const sA = new Float32Array(N);
  const tabIx = new Uint8Array(N); // hangi tablo
  // tablo kimlikleri: 0 gök, 1 güneş, 2 zemin, 3 taş, 4 kasnak, 5–20 kubbe dilimleri, 21 altın, 22 yaprak, 23 çiçek, 24 düz
  const TABLOLAR = [tGok, tGunes, tZemin, tTas, tKasnak];
  for (let k = 0; k < 16; k++) TABLOLAR.push(tDilim[k]);
  TABLOLAR.push(tAltin, tYaprak, tCicek);
  const DILIM = Math.PI / 16;
  function sHesap(x, y, b) {
    switch (b) {
      case IX.gok: case IX.gunes: {
        const dx = x - 880, dy = y - 140, d = Math.hypot(dx, dy);
        const q1 = fbm(nC, x * 0.0028, y * 0.0035, 3), q2 = fbm(nD, x * 0.0028 + 5, y * 0.0035 + 5, 3);
        const w = fbm(nA, x * 0.0035 + 2.2 * q1, y * 0.005 + 2.2 * q2, 4) - 0.5;
        const dg = d + (fbm(nE, x * 0.012, y * 0.012, 3) - 0.5) * 12 + Math.sin(Math.atan2(dy, dx) * 3 + 1) * 3;
        if (dg < 118) return [dg, 1];
        return [y + w * 260 + (fbm(nB, x * 0.006, y * 0.008, 2) - 0.5) * 14, 0];
      }
      case IX.zemin:
        return [y + (fbm(nA, x * 0.006, y * 0.02, 4) - 0.5) * 90 + Math.sin(x * 0.01) * 10, 2];
      case IX.kaide:
        return [y * 1.4 + (fbm(nB, x * 0.008, y * 0.03, 4) - 0.5) * 70, 3];
      case IX.minare:
        return [x * 2 + y * 0.12 + (fbm(nC, x * 0.03, y * 0.006, 4) - 0.5) * 80, 3];
      case IX.kasnak:
        return [y + (fbm(nD, x * 0.01, y * 0.05, 3) - 0.5) * 22, 4];
      case IX.kubbe: {
        const yc = clamp(Math.round(y), 301, 554);
        const r = Math.max(1, rTab[yc]);
        const u = clamp((x - 560) / r, -0.9995, 0.9995);
        const ph = Math.asin(u);
        const g = (ph + Math.PI / 2) / DILIM;
        const k = clamp(Math.floor(g), 0, 15);
        let t = g - k + (fbm(nE, x * 0.012, y * 0.02, 3) - 0.5) * 0.22 * Math.sin(Math.PI * (g - k));
        return [clamp(t, 0.0005, 0.9995), 5 + k];
      }
      case IX.altin: case IX.cicekOrta:
        return [y * 2.2 + x * 0.6 + (fbm(nA, x * 0.05, y * 0.05, 3) - 0.5) * 30, 21];
      case IX.yaprak: case IX.sap:
        return [x * 0.7 + y * 0.9 + (fbm(nB, x * 0.012, y * 0.012, 4) - 0.5) * 140, 22];
      case IX.cicek: {
        const [k, d] = enYakinCicek(x, y);
        const c = cicekler[k];
        // en yakın taç yaprağın elips koordinatı: 0 yaprak ortası, 1 yaprak kenarı
        let en = 9;
        for (const e of S.tacYapraklari(c)) {
          const dx = x - e.cx, dy = y - e.cy, ca = Math.cos(e.aci), sa = Math.sin(e.aci);
          const u = (dx * ca + dy * sa) / e.rx, v = (-dx * sa + dy * ca) / e.ry;
          const q = Math.sqrt(u * u + v * v) + 0.35 * Math.max(0, -u) * 0;
          if (q < en) en = q;
        }
        return [Math.min(en, 1.1) + (fbm(nC, x * 0.05, y * 0.05, 3) - 0.5) * 0.12, 23];
      }
      default:
        return [0, 24];
    }
  }
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const [s, t] = sHesap(x, y, bol[i]);
      sA[i] = s;
      tabIx[i] = t;
    }
  }

  // ------------------------------------------------------------ renk + kalınlık
  const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), H = new Float32Array(N);
  const HC = new Float32Array(N); // hücre yoğunluğu (şerit özelliği)
  const pencereRenk = C.siyahMavi;
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const b = bol[i];
      const ti = tabIx[i];
      if (ti === 24) {
        // pencere: koyu, derin parlak havuz
        const c = b === IX.pencere ? mix(pencereRenk, C.petrol, 0.25 * nA(x * 0.08, y * 0.08)) : C.zumrut;
        R[i] = c[0]; G[i] = c[1]; B[i] = c[2]; H[i] = -0.2; continue;
      }
      const tab = TABLOLAR[ti];
      const s = sA[i];
      // gradyan büyüklüğü (aynı tabloda komşu): kenar yumuşatma için
      const iR = x < W - 1 && tabIx[i + 1] === ti ? i + 1 : i;
      const iL = x > 0 && tabIx[i - 1] === ti ? i - 1 : i;
      const iD = y < W - 1 && tabIx[i + W] === ti ? i + W : i;
      const iU = y > 0 && tabIx[i - W] === ti ? i - W : i;
      const gx = (sA[iR] - sA[iL]) / Math.max(1, (iR - iL)), gy = (sA[iD] - sA[iU]) / Math.max(1, (iD - iU) / W);
      const gm = Math.max(1e-4, Math.hypot(gx, gy));
      const k = bul(tab, s);
      const e = tab[k];
      const da = (s - e.a) / gm, db = (e.b - s) / gm; // piksel cinsinden kenar uzaklığı
      let c = e.c;
      let h = e.h;
      if (da < db && k > 0 && da < 0.7) {
        const t = 0.5 - da / 1.4;
        c = mix(c, tab[k - 1].c, t);
        h = h + (tab[k - 1].h - h) * t;
      } else if (db <= da && k < tab.length - 1 && db < 0.7) {
        const t = 0.5 - db / 1.4;
        c = mix(c, tab[k + 1].c, t);
        h = h + (tab[k + 1].h - h) * t;
      }
      // şerit kenarında hafif sırt (boya kalınlığı)
      const kenar = Math.min(da, db);
      h += 0.35 * Math.exp(-kenar * kenar / 1.4);
      // kubbe hacmi: sola doğru koyulaşan, sağ üstte açılan ton
      if (b === IX.kubbe) {
        const yc = clamp(y, 301, 554);
        const u = clamp((x - 560) / Math.max(1, rTab[yc]), -1, 1);
        const ph = Math.asin(u);
        const isik = Math.max(0, Math.sin(ph) * 0.6 + Math.cos(ph) * 0.8);
        const v = (555 - y) / 255;
        const f = 0.62 + 0.48 * isik + 0.08 * v;
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.kasnak) {
        const u = clamp((x - 560) / 226, -1, 1);
        const ph = Math.asin(u);
        const f = 0.66 + 0.42 * Math.max(0, Math.sin(ph) * 0.6 + Math.cos(ph) * 0.8);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.minare) {
        const u = clamp((x - 300) / 34, -1, 1);
        const f = 0.8 + 0.22 * Math.max(0, u * 0.6 + Math.sqrt(1 - u * u) * 0.8);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.kaide) {
        const f = 0.86 + 0.14 * ((x - 300) / 520);
        c = [c[0] * f, c[1] * f, c[2] * f];
      } else if (b === IX.sap) {
        c = mix(c, C.koyuYesil, 0.4);
      } else if (b === IX.cicekOrta) {
        c = mix(c, C.altin, 0.3);
      }
      const dk = kay[i] * 4, da2 = b === IX.cicek || b === IX.cicekOrta || b === IX.yaprak ? 0 : detayV[dk + 3] / 255;
      if (da2 > 0.02) { c = mix(c, [detayV[dk], detayV[dk + 1], detayV[dk + 2]], da2); h += 0.4 * da2; }
      R[i] = c[0]; G[i] = c[1]; B[i] = c[2]; H[i] = h;
      HC[i] = da2 > 0.3 ? 0 : e.hc;
    }
  }

  // ------------------------------------------------------------ hücreler (silikon cells) ve dantel
  const KOVA = 32, KW = W / KOVA;
  const kovalar = Array.from({ length: KW * KW }, () => []);
  const hucreler = [];
  const BOLGE_HUCRE = { [IX.gok]: 0.6, [IX.gunes]: 0.7, [IX.zemin]: 0.45, [IX.kubbe]: 1.0, [IX.kaide]: 0.18, [IX.minare]: 0.15, [IX.kasnak]: 0.35, [IX.yaprak]: 0.4, [IX.cicek]: 0.55, [IX.altin]: 0.2 };
  const BOLGE_RMAX = { [IX.gok]: 10, [IX.gunes]: 5, [IX.zemin]: 7, [IX.kubbe]: 9, [IX.kaide]: 6, [IX.minare]: 4.5, [IX.kasnak]: 3.5, [IX.yaprak]: 5, [IX.cicek]: 7, [IX.altin]: 2.5 };
  {
    const r = S.rng(77);
    const ARA = 4;
    for (let gy = 0; gy < W; gy += ARA) {
      for (let gx = 0; gx < W; gx += ARA) {
        const x = gx + r() * ARA, y = gy + r() * ARA;
        const i = (y | 0) * W + (x | 0);
        const b = bol[i];
        const bh = BOLGE_HUCRE[b];
        if (!bh) continue;
        const hc = HC[i];
        if (hc <= 0) continue;
        const kume = sstep(0.35, 0.75, fbm(nE, x * 0.01, y * 0.01, 3));
        const p = 0.55 * hc * bh * (0.15 + 0.85 * kume);
        if (r() > p) continue;
        // akış yönü: s'nin gradyanına dik
        const ti = tabIx[i];
        const iR = Math.min(N - 1, i + 1), iD = Math.min(N - 1, i + W);
        let gxs = tabIx[iR] === ti ? sA[iR] - sA[i] : 0, gys = tabIx[iD] === ti ? sA[iD] - sA[i] : 0;
        const gm = Math.hypot(gxs, gys);
        if (gm < 1e-6) { gxs = 0; gys = 1; } else { gxs /= gm; gys /= gm; }
        const rmax = BOLGE_RMAX[b];
        const u = r();
        const rr = 1.1 + (rmax - 1.1) * Math.pow(u, 3.2) * (0.5 + 0.5 * kume);
        const uzama = 1.15 + r() * 1.0;
        // alttaki boyanın rengi: şeridin "ic" rengi
        const k = bul(TABLOLAR[ti], sA[i]);
        const e = TABLOLAR[ti][k];
        const ic = e.ic || C.lacivert;
        const ekle = (hx, hy, hr, hz) => {
          const hc2 = { x: hx, y: hy, r: hr, ux: -gys, uy: gxs, uz: hz, ic, kenar: e.c, ic2: r() < 0.3, ak: b === IX.kubbe || b === IX.yaprak ? 0.32 : b === IX.gok ? 0.6 : 0.5 };
          hucreler.push(hc2);
          const ext = hr * hz + 3;
          for (let ky = Math.max(0, Math.floor((hy - ext) / KOVA)); ky <= Math.min(KW - 1, Math.floor((hy + ext) / KOVA)); ky++)
            for (let kx = Math.max(0, Math.floor((hx - ext) / KOVA)); kx <= Math.min(KW - 1, Math.floor((hx + ext) / KOVA)); kx++) kovalar[ky * KW + kx].push(hc2);
        };
        ekle(x, y, rr, uzama);
        // büyük hücrenin çevresinde küçük uydu hücreler
        if (rr > 4) {
          const n = 3 + ((r() * 5) | 0);
          for (let j = 0; j < n; j++) {
            const a = r() * Math.PI * 2, dd = rr * (1.25 + r() * 0.9);
            const hx = x + Math.cos(a) * dd * uzama * Math.abs(-gys) + Math.cos(a) * dd * 0.3, hy = y + Math.sin(a) * dd;
            const ii = (clamp(hy, 0, W - 1) | 0) * W + (clamp(hx, 0, W - 1) | 0);
            if (bol[ii] !== b) continue;
            ekle(hx, hy, 0.9 + r() * rr * 0.32, 1 + r() * 0.5);
          }
        }
        // dantel alanı: çok sık, çok küçük hücreler
        if (hc >= 0.9 && kume > 0.55 && r() < 0.5) {
          for (let j = 0; j < 4; j++) {
            const hx = x + (r() - 0.5) * 7, hy = y + (r() - 0.5) * 7;
            const ii = (clamp(hy, 0, W - 1) | 0) * W + (clamp(hx, 0, W - 1) | 0);
            if (bol[ii] !== b) continue;
            ekle(hx, hy, 0.9 + r() * 1.3, 1 + r() * 0.4);
          }
        }
      }
    }
  }
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const kova = kovalar[(y >> 5) * KW + (x >> 5)];
      if (!kova.length) continue;
      const i = y * W + x;
      let en = null, ed = 9, en2 = null, ed2 = 9;
      for (const h of kova) {
        const dx = x + 0.5 - h.x, dy = y + 0.5 - h.y;
        const a = (dx * h.ux + dy * h.uy) / h.uz, b = -dx * h.uy + dy * h.ux;
        const d = Math.sqrt(a * a + b * b) / h.r;
        if (d < ed) { ed2 = ed; en2 = en; ed = d; en = h; }
        else if (d < ed2) { ed2 = d; en2 = h; }
      }
      if (!en || ed > 1.35) continue;
      // iki hücre birbirine dayanıyorsa aralarında dantel duvarı (Voronoi benzeri ağ)
      if (en2 && ed2 < 1 && Math.min(en.r, en2.r) > 2.6 && (ed2 - ed) * Math.min(en.r, en2.r) < 0.75) {
        const c = mix(en.kenar, C.beyaz, en.ak);
        R[i] = c[0]; G[i] = c[1]; B[i] = c[2];
        H[i] = H[i] + 0.6;
        continue;
      }
      const rimW = Math.max(0.2, 1.3 / en.r); // dantel halkası en az ~1,3 piksel
      if (ed < 1 - rimW) {
        // hücrenin içi: alttaki renk; ortası açık, halkaya doğru koyulaşır (çukur)
        const t = ed / (1 - rimW);
        const koyu = [en.ic[0] * 0.62, en.ic[1] * 0.62, en.ic[2] * 0.62];
        let c = mix(mix(en.ic, C.beyaz, 0.22), koyu, Math.pow(t, 1.6));
        if (en.ic2 && t < 0.38 && en.r > 4) c = mix(c, mix(en.kenar, C.beyaz, 0.3), 0.75); // hücre içinde hücre
        R[i] = c[0]; G[i] = c[1]; B[i] = c[2];
        H[i] = H[i] - 0.6 * (1 - t * t);
      } else if (ed < 1) {
        // dantel: hücreyi saran parlak açık halka
        const c = mix(en.kenar, C.beyaz, en.ak);
        R[i] = c[0]; G[i] = c[1]; B[i] = c[2];
        H[i] = H[i] + 0.6;
      } else if (ed < 1 + Math.max(0.12, 0.9 / en.r)) {
        // halkanın hemen dışında ince koyu çizgi (üst katın inceldiği yer)
        R[i] *= 0.72; G[i] *= 0.72; B[i] *= 0.72;
        H[i] = H[i] + 0.2;
      } else {
        H[i] = H[i] + 0.2 * (1 - (ed - 1) / 0.35);
      }
    }
  }

  // bölge sınırlarında ince koyu birleşme çizgisi (iki dökme buluşuyor)
  for (let y = 1; y < W - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, b = bol[i];
      const gk = (q) => (q === IX.gunes ? IX.gok : q);
      const bb = gk(b);
      if (gk(bol[i + 1]) !== bb || gk(bol[i - 1]) !== bb || gk(bol[i + W]) !== bb || gk(bol[i - W]) !== bb) {
        const f = b === IX.gok || b === IX.zemin ? 0.82 : 0.7;
        R[i] *= f; G[i] *= f; B[i] *= f;
        H[i] += 0.25;
      }
    }
  }

  // ------------------------------------------------------------ parlak reçine ışığı
  const Hs = new Float32Array(N);
  // hafif yumuşatma (kalın boya kenarları yuvarlanır)
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let s = H[i] * 4, n = 4;
      if (x > 0) { s += H[i - 1]; n++; }
      if (x < W - 1) { s += H[i + 1]; n++; }
      if (y > 0) { s += H[i - W]; n++; }
      if (y < W - 1) { s += H[i + W]; n++; }
      Hs[i] = s / n + (fbm(nB, x * 0.004, y * 0.004, 3) - 0.5) * 0.0;
    }
  }
  const Lx = 0.5, Ly = -0.55, Lz = 0.67;
  const hm = Math.hypot(Lx, Ly, Lz + 1);
  const Hx = Lx / hm, Hy = Ly / hm, Hz = (Lz + 1) / hm;
  const id = ctx.createImageData(W, W), d = id.data;
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const hx = (Hs[y * W + Math.min(W - 1, x + 1)] - Hs[y * W + Math.max(0, x - 1)]) * 0.5;
      const hy = (Hs[Math.min(W - 1, y + 1) * W + x] - Hs[Math.max(0, y - 1) * W + x]) * 0.5;
      // büyük ölçekli dalgalanma (boya yüzeyi tam düz değil)
      const ux = (nD(x * 0.012, y * 0.012) - 0.5) * 0.12, uy = (nD(x * 0.012 + 30, y * 0.012 + 30) - 0.5) * 0.12;
      let nx = -hx * 1.6 + ux, ny = -hy * 1.6 + uy, nz = 1;
      const m = Math.hypot(nx, ny, nz);
      nx /= m; ny /= m; nz /= m;
      const dif = nx * Lx + ny * Ly + nz * Lz;
      const ndh = Math.max(0, nx * Hx + ny * Hy + nz * Hz);
      const sp = Math.pow(ndh, 90) * 0.95 + Math.pow(ndh, 14) * 0.08;
      const golge = 0.86 + 0.2 * (dif - Lz) / (1 - Lz + 1e-6) * 0.5 + 0.14;
      const o = i * 4;
      d[o] = clamp(R[i] * golge + sp * 255, 0, 255);
      d[o + 1] = clamp(G[i] * golge + sp * 255, 0, 255);
      d[o + 2] = clamp(B[i] * golge + sp * 255, 0, 255);
      d[o + 3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  // reçine kaplamada geniş, yumuşak bir pencere yansıması (sol üst köşe)
  {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(30px)';
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.moveTo(-60, -60);
    ctx.lineTo(330, -60);
    ctx.lineTo(-60, 330);
    ctx.closePath();
    ctx.fill();
    // ince, uzun bir pencere yansıması (reçine kaplamanın parlaklığı)
    ctx.filter = 'blur(9px)';
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(40, 300);
    ctx.lineTo(300, 40);
    ctx.lineTo(328, 52);
    ctx.lineTo(62, 318);
    ctx.closePath();
    ctx.fill();
    ctx.filter = 'none';
    ctx.restore();
  }
  S.hazir();
})();
</script>
