<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-101 Serigrafi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fbf8f0; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-101 Serigrafi (elle çekilmiş ipek baskı) — her renk ayrı bir elekten rakleyle basılır: düz, örtücü
// mürekkep katmanları, keskin şablon kenarları, hafif mürekkep filmi dokusu ve rakle dalgalanması,
// elek ağının kenarda bıraktığı ince diş, renkler arasında küçük kayıklıklar (kâğıt aralıkları ve
// bindirmeler), göğün iki mürekkebin aynı elekte harmanlandığı "split fountain" geçişi. Yarım ton yok.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
'use strict';
const W = 1024, H = 1024, N = W * H;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const P2 = (d) => new Path2D(d);

// ------------------------------------------------------------------ gürültü
function gurultuFn(tohum) {
  const r = SAHNE.rng(tohum);
  const v = new Float32Array(256);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { v[i] = r(); p[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = v[p[p[X] + Y]], b = v[p[p[X + 1] + Y]], c = v[p[p[X] + Y + 1]], d = v[p[p[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
function fbmFn(tohum, oktav, olcek, kazanc) {
  kazanc = kazanc || 0.5;
  const g = [];
  for (let i = 0; i < oktav; i++) g.push(gurultuFn(tohum * 31 + i * 7 + 1));
  let top = 0, a = 1;
  for (let i = 0; i < oktav; i++) { top += a; a *= kazanc; }
  return function (x, y) {
    let s = 0, a = 1, f = 1 / olcek;
    for (let i = 0; i < oktav; i++) { s += a * g[i](x * f + i * 17.3, y * f - i * 9.1); a *= kazanc; f *= 2.03; }
    return s / top;
  };
}
function alan(fn) {
  const a = new Float32Array(N);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) a[i] = fn(x, y);
  return a;
}

// ------------------------------------------------------------------ maske yardımcıları
function tuvalMaske(ciz, kanal) {
  const c = SAHNE.yeniTuval(W, H);
  const g = c.getContext('2d', { willReadFrequently: true });
  ciz(g);
  const d = g.getImageData(0, 0, W, H).data;
  const m = new Float32Array(N);
  for (let i = 0, j = kanal; i < N; i++, j += 4) m[i] = d[j] / 255;
  return m;
}
/** Ayrılabilir kutu bulanıklığı (yarıçap r, iki geçiş). */
function bulanik(m, r) {
  const t = new Float32Array(N), o = new Float32Array(N);
  const k = 1 / (2 * r + 1);
  for (let gecis = 0; gecis < 2; gecis++) {
    const kaynak = gecis ? o : m;
    for (let y = 0; y < H; y++) {
      let s = 0;
      const b = y * W;
      for (let x = -r; x <= r; x++) s += kaynak[b + clamp(x, 0, W - 1)];
      for (let x = 0; x < W; x++) {
        t[b + x] = s * k;
        s += kaynak[b + Math.min(W - 1, x + r + 1)] - kaynak[b + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < W; x++) {
      let s = 0;
      for (let y = -r; y <= r; y++) s += t[clamp(y, 0, H - 1) * W + x];
      for (let y = 0; y < H; y++) {
        o[y * W + x] = s * k;
        s += t[Math.min(H - 1, y + r + 1) * W + x] - t[Math.max(0, y - r) * W + x];
      }
    }
  }
  return o;
}

// ------------------------------------------------------------------ mürekkepler (her biri ayrı elek)
const MUREKKEP = {
  sari:   { c: [255, 228, 150], kayma: [0, 0],       yay: 1.2, tohum: 11 }, // açık sarı: güneş halesi, zemin
  gok:    { c: [80, 178, 226],  kayma: [-1.0, 0.8],  yay: 0,   tohum: 12 }, // gök mavisi (harmanlı elek)
  gri:    { c: [186, 208, 230], kayma: [1.5, -0.8],  yay: 0.8, tohum: 13 }, // mavi-gri ton: bulut altı, taş gölgesi
  hardal: { c: [240, 172, 58],  kayma: [0.8, 1.5],   yay: 1.0, tohum: 14 }, // hardal-altın
  mercan: { c: [242, 112, 92],  kayma: [-1.5, -1.0], yay: 0.8, tohum: 15 }, // mercan
  acik:   { c: [150, 214, 112], kayma: [1.7, 0.6],   yay: 1.0, tohum: 16 }, // açık yeşil
  yesil:  { c: [22, 150, 96],   kayma: [-0.8, -1.3], yay: 0.6, tohum: 17 }, // zümrüt
  koyu:   { c: [24, 78, 96],    kayma: [2.0, 2.2],   yay: 0,   tohum: 18 }, // koyu petrol: pencere, ayrıntı
};
const SIRA = ['sari', 'gok', 'gri', 'hardal', 'mercan', 'acik', 'yesil', 'koyu'];
const KENAR = 24; // baskı alanının kâğıt payı

// ------------------------------------------------------------------ geometri
const B = SAHNE.bitki;
const L = (() => { const v = [0.58, 0.5, 0.64]; const n = Math.hypot(...v); return v.map((a) => a / n); })();
const PROF = SAHNE.kubbeProfili(90);
// profil normali: radyal ve yukarı bileşen
const PNORM = PROF.map((q, i) => {
  const a = PROF[Math.max(0, i - 1)], b = PROF[Math.min(PROF.length - 1, i + 1)];
  const dr = b.r - a.r, dyu = -(b.y - a.y);
  const n = Math.hypot(dyu, dr) || 1;
  return { rad: dyu / n, up: -dr / n };
});
function isik(phi, i) {
  const n = PNORM[i];
  return n.rad * Math.sin(phi) * L[0] + n.up * L[1] + n.rad * Math.cos(phi) * L[2];
}
/** Kubbenin piksel başına aydınlığı (profil normali + boylam). Kubbe dışında NaN. */
const KUBBE_SATIR = (() => {
  const t = [];
  for (let y = 300; y <= 555; y++) {
    let i = 0;
    while (i < PROF.length - 2 && PROF[i + 1].y > y) i++;
    const a = PROF[i], b = PROF[i + 1];
    const f = clamp((a.y - y) / ((a.y - b.y) || 1));
    t.push({ r: lerp(a.r, b.r, f), rad: lerp(PNORM[i].rad, PNORM[i + 1].rad, f), up: lerp(PNORM[i].up, PNORM[i + 1].up, f) });
  }
  return t;
})();
function kubbeIsik(x, y) {
  if (y < 300 || y > 555) return NaN;
  const s = KUBBE_SATIR[Math.min(255, Math.max(0, Math.round(y - 300)))];
  const u = (x - 560) / Math.max(0.5, s.r);
  if (u < -1 || u > 1) return NaN;
  const phi = Math.asin(u);
  return s.rad * Math.sin(phi) * L[0] + s.up * L[1] + s.rad * Math.cos(phi) * L[2];
}
/** Posterleştirilmiş kubbe tonları: 3×3 örneklemeyle keskin ama yumuşatılmış eşik maskeleri. */
function kubbeTonMaskesi(kosul) {
  const m = new Float32Array(N);
  for (let y = 296; y <= 558; y++) for (let x = 356; x <= 764; x++) {
    let say = 0;
    for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
      const I = kubbeIsik(x + (a - 1) / 3, y + (b - 1) / 3);
      if (I === I && kosul(I)) say++;
    }
    m[y * W + x] = say / 9;
  }
  return m;
}
const TON_ISIK = kubbeTonMaskesi((I) => I > 0.8);
const TON_GOLGE = kubbeTonMaskesi((I) => I < 0.42);
const KABURGA = tuvalMaske((g) => {
  g.save(); g.clip(P2(SAHNE.kubbeYolu));
  g.strokeStyle = '#fff'; g.lineWidth = 2.6; g.lineCap = 'round';
  for (const k of SAHNE.kaburgalar(16)) g.stroke(P2(SAHNE.yol(k.noktalar)));
  g.restore();
}, 3);
/** Float maskeyi, tasarımda drawImage ile kullanılacak beyaz ve siyah tuvallere çevirir. */
function maskeTuvali(m) {
  const out = {};
  for (const [ad, v] of [['beyaz', 255], ['siyah', 0]]) {
    const c = SAHNE.yeniTuval(W, H);
    const g = c.getContext('2d');
    const im = g.createImageData(W, H);
    for (let i = 0, j = 0; i < N; i++, j += 4) { im.data[j] = im.data[j + 1] = im.data[j + 2] = v; im.data[j + 3] = m[i] * 255; }
    g.putImageData(im, 0, 0);
    out[ad] = c;
  }
  return out;
}
const ISIK_TUVAL = maskeTuvali(TON_ISIK.map((v, i) => v * (1 - KABURGA[i])));

/** Kasnak katında, verilen u değerine en yakın iki pencere arası (payanda ortası) x'i. */
function payandaX(k, u) {
  const q = SAHNE.kasnak[k];
  const cx = (q.x1 + q.x2) / 2, Rk = ((q.x2 - q.x1) / 2) * 0.92;
  const adet = q.pencere.adet;
  let en = cx + u * Rk, enU = Infinity;
  for (let j = 0; j <= adet; j++) {
    const th = -Math.PI / 2 + (Math.PI * j) / adet;
    const x = cx + Rk * Math.sin(th);
    if (Math.abs(Math.sin(th) - u) < enU) { enU = Math.abs(Math.sin(th) - u); en = x; }
  }
  return en;
}
function bulutYolu(cx, cy, s) {
  const p = new Path2D();
  const loblar = [[-62, 4, 24], [-34, -12, 31], [2, -24, 38], [38, -12, 31], [66, 2, 23]];
  for (const [dx, dy, r] of loblar) { p.moveTo(cx + (dx + r) * s, cy + dy * s); p.arc(cx + dx * s, cy + dy * s, r * s, 0, TAU); }
  p.rect(cx - 70 * s, cy - 6 * s, 140 * s, 26 * s);
  return p;
}
const BULUTLAR = [[168, 246, 1.0], [505, 150, 0.82], [770, 332, 1.08], [946, 470, 0.66], [86, 468, 0.68]];

// ------------------------------------------------------------------ tasarım: her öğe bir mürekkebe ayrılır
// Ressam sırasıyla çizilir; hedef mürekkep beyaz, öteki her şey siyah → elek maskesi (öndeki biçim arkadakini keser).
function tasarim(g, hedef) {
  // koyu petrol (anahtar renk) alttakileri kesmez, üstlerine basılır: pencere ve ayrıntılarda kâğıt aralığı kalmaz
  const boya = (m) => {
    const sec = m === hedef ? '#fff' : m === 'koyu' ? 'rgba(0,0,0,0)' : '#000';
    g.fillStyle = g.strokeStyle = sec;
  };
  const doldur = (m, d) => { boya(m); g.fill(typeof d === 'string' ? P2(d) : d); };
  const dikd = (m, x, y, w, h) => { boya(m); g.fillRect(x, y, w, h); };
  const kirp = (d, fn) => { g.save(); g.clip(typeof d === 'string' ? P2(d) : d); fn(); g.restore(); };

  // gök (harmanlı elek), güneş, bulutlar
  dikd('gok', 0, 0, W, 800);
  const gx = SAHNE.gunes.x, gy = SAHNE.gunes.y;
  // afiş ışınları: güneşten yayılan, ayrı bir elekten açık sarı kamalar
  boya('sari');
  for (let i = 0; i < 22; i++) {
    const a0 = Math.PI * 0.42 + (i / 22) * Math.PI * 1.25, da = 0.052 + 0.012 * Math.sin(i * 2.3);
    g.beginPath(); g.moveTo(gx, gy);
    g.lineTo(gx + Math.cos(a0) * 1600, gy + Math.sin(a0) * 1600);
    g.lineTo(gx + Math.cos(a0 + da) * 1600, gy + Math.sin(a0 + da) * 1600);
    g.closePath(); g.fill();
  }
  boya('gok');
  doldur('sari', SAHNE.daireYolu(gx, gy, 98));
  doldur(null, SAHNE.daireYolu(gx, gy, 76));
  doldur('sari', SAHNE.daireYolu(gx, gy, 70));
  doldur('hardal', SAHNE.daireYolu(gx, gy, 54));
  for (const [x, y, s] of BULUTLAR) {
    const b = bulutYolu(x, y, s);
    doldur('gri', b);
    kirp(b, () => { g.translate(-3 * s, -11 * s); doldur(null, bulutYolu(x, y, s)); });
  }
  // zemin
  dikd('sari', 0, 800, W, H - 800);
  dikd('hardal', 0, 800, W, 9);
  boya('gri');
  g.beginPath(); g.moveTo(300, 800); g.lineTo(150, 818); g.lineTo(170, 809); g.lineTo(300, 809); g.closePath(); g.fill();

  // minare
  const yol = SAHNE.yollar();
  for (const p of SAHNE.minareParcalari()) {
    if (p.tip === 'alem') { alem(p.alem); continue; }
    if (p.tip === 'bant') continue;
    if (p.tip === 'topuz') {
      doldur(null, p.yol);
      kirp(p.yol, () => dikd('gri', 250, 140, 44, 70));
      continue;
    }
    if (p.tip === 'korkuluk') {
      dikd(null, p.x1, p.y1, p.x2 - p.x1, p.y2 - p.y1);
      const adet = 10;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * (i + 0.5)) / adet;
        dikd('koyu', x - 1.8, p.y1 + 4, 3.6, p.y2 - p.y1 - 6);
      }
      dikd('gri', p.x1, p.y1, 10, p.y2 - p.y1);
      continue;
    }
    const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
    const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
    const d = SAHNE.yol(p.noktalar, true);
    if (p.ad.startsWith('çıkma')) { doldur('gri', d); kirp(d, () => dikd(null, 300, y1, 60, y2 - y1)); continue; }
    doldur(null, d);
    if (p.ad.startsWith('gövde')) kirp(d, () => dikd('gri', x1, y1, (x2 - x1) * 0.3, y2 - y1));
    if (p.ad.startsWith('şerefe')) dikd('gri', x1, y2 - 3, x2 - x1, 3);
    if (p.ad === 'bilezik') dikd('koyu', x1, y2 - 2, x2 - x1, 2);
  }
  boya('mercan');
  g.lineWidth = 3.4; g.lineJoin = 'miter';
  for (const z of yol.zikzak) g.stroke(P2(z));
  for (const d of yol.minarePencereleri) doldur('koyu', d);

  // kaide
  const K = SAHNE.kaide;
  dikd(null, K.x1, K.y1, K.x2 - K.x1, K.y2 - K.y1);
  dikd('gri', K.x1, K.y1, K.x2 - K.x1, 9);
  dikd('gri', K.x1, K.y1, 16, K.y2 - K.y1);
  dikd(null, K.kornis.x1, K.kornis.y1, K.kornis.x2 - K.kornis.x1, K.kornis.y2 - K.kornis.y1);
  dikd('gri', K.kornis.x1, K.kornis.y2 - 3, K.kornis.x2 - K.kornis.x1, 3);
  for (const p of K.pencereler) {
    doldur('gri', SAHNE.kemerYolu(p.x, p.y - 3, p.w + 8, p.h + 3));
    doldur('koyu', SAHNE.kemerYolu(p.x, p.y, p.w, p.h));
  }

  // kasnak: zümrüt gövde, sağda payandalara oturan açık yeşil ışık bandı, üst dudak
  for (let k = 1; k >= 0; k--) {
    const q = SAHNE.kasnak[k];
    dikd('yesil', q.x1, q.y1, q.x2 - q.x1, q.y2 - q.y1);
    dikd('acik', q.x1, q.y1, q.x2 - q.x1, 5);
    dikd('acik', q.x1, q.y2 - 4, q.x2 - q.x1, 2.5);
    // ışık sağdan: sağ yarıdaki pencerelerin sağ söveleri açık yeşil
    const cx = (q.x1 + q.x2) / 2;
    for (const p of SAHNE.kasnakPencereleri(k)) {
      if (p.x > cx - 20) {
        const s = clamp((p.x - cx + 20) / 120);
        doldur('acik', SAHNE.kemerYolu(p.x + p.w * (0.18 + 0.12 * s), p.y - 3, p.w + 4 + 4 * s, p.h + 3));
      }
      doldur('koyu', SAHNE.kemerYolu(p.x, p.y, p.w, p.h));
    }
  }

  // kubbe: zümrüt; ışıklı dilimlerin üst kısmı açık yeşil (kaburgalar aralarda zümrüt çizgi kalır)
  doldur('yesil', SAHNE.kubbeYolu);
  g.drawImage(hedef === 'acik' ? ISIK_TUVAL.beyaz : ISIK_TUVAL.siyah, 0, 0);
  alem(SAHNE.alemParcalari(560, 300, 1));

  // bitkiler
  boya('yesil');
  g.lineCap = 'round'; g.lineWidth = 4.6;
  for (const s of yol.saplar) g.stroke(P2(s));
  B.yapraklar.forEach((y, i) => {
    const d = P2(SAHNE.yaprakYolu(y));
    const on = y.uzunluk > 50;
    const ana = on ? 'yesil' : (i % 3 === 0 ? 'yesil' : 'acik');
    const ikinci = ana === 'yesil' ? 'acik' : 'yesil';
    doldur(ana, d);
    // yarım yaprak: damarın bir yanı ikinci renk, damar boşluk olarak kalır
    kirp(d, () => {
      g.translate(y.x, y.y); g.rotate(y.aci);
      dikd(ikinci, -5, 1.4, y.uzunluk + 10, y.uzunluk);
    });
  });
  for (const t of B.tomurcuklar) doldur('mercan', SAHNE.tomurcukYolu(t));
  for (const c of B.cicekler) {
    for (const e of SAHNE.tacYapraklari(c)) {
      const d = SAHNE.elipsYolu(e);
      doldur(null, d);
      kirp(d, () => {
        doldur('gri', d);
        g.translate(c.r * 0.14, -c.r * 0.12);
        doldur(null, SAHNE.elipsYolu({ ...e, rx: e.rx * 1.02, ry: e.ry * 1.02 }));
      });
    }
    doldur('hardal', SAHNE.daireYolu(c.x, c.y, c.r * 0.2));
    boya('mercan');
    for (let i = 0; i < 8; i++) {
      const a = c.aci + (i / 8) * TAU;
      g.beginPath();
      g.arc(c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3, Math.max(1.3, c.r * 0.04), 0, TAU);
      g.fill();
    }
  }

  function alem(a) {
    doldur('hardal', SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }));
    dikd('hardal', a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1);
    for (const k of a.kureler) {
      const d = SAHNE.daireYolu(k.cx, k.cy, k.r);
      doldur('hardal', d);
      kirp(d, () => doldur('sari', SAHNE.daireYolu(k.cx + k.r * 0.45, k.cy - k.r * 0.4, k.r * 0.45)));
    }
    doldur('hardal', SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R));
  }
}

/** Saydam üst baskı (koyu petrol + saydam taban): kubbenin gölge yanı (kaburgalar zümrüt kalır), orta tonda
 *  ince kaburga çizgileri, kasnakların gölge ucu. Maske kendi kaymasıyla kurulur. */
function ustBaskiMaskesi(dx, dy) {
  const kasnak = tuvalMaske((g) => {
    g.translate(dx, dy);
    g.fillStyle = '#fff';
    for (let k = 1; k >= 0; k--) {
      const q = SAHNE.kasnak[k];
      g.fillRect(q.x1, q.y1 + 5, payandaX(k, -0.66) - q.x1, q.y2 - q.y1 - 9);
    }
  }, 3);
  const m = new Float32Array(N);
  const ox = Math.round(dx), oy = Math.round(dy);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const sx = x - ox, sy = y - oy;
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
    const j = sy * W + sx, i = y * W + x;
    const gol = TON_GOLGE[j], kab = KABURGA[j], isk = TON_ISIK[j];
    m[i] = Math.max(kasnak[i], gol * (1 - kab), kab * (1 - gol) * (1 - isk) * 0.6);
  }
  return m;
}

// ------------------------------------------------------------------ baskı
const tuval = document.getElementById('tuval');
tuval.width = W; tuval.height = H;
const ctx = tuval.getContext('2d');

const lif = alan(fbmFn(3, 3, 3.2));                 // kâğıt lifi
const lifKaba = alan(fbmFn(4, 4, 60));              // kâğıdın hafif bulutlanması
const ag = alan(gurultuFn(5));                      // elek ağı (piksel ölçeği)
const R = new Float32Array(N), G = new Float32Array(N), Bm = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const t = (lif[i] - 0.5) * 7 + (lifKaba[i] - 0.5) * 5;
  R[i] = 251 + t; G[i] = 248 + t; Bm[i] = 239 + t * 1.1;
}

function elekMaskesi(ad) {
  const [dx, dy] = MUREKKEP[ad].kayma;
  const yay = MUREKKEP[ad].yay;
  const m = tuvalMaske((g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.translate(dx, dy);
    // her elek bantla ayrı sınırlanır: baskı alanının kenarında katmanlar birkaç piksel taşar ya da geri kalır
    const r = SAHNE.rng(MUREKKEP[ad].tohum * 3);
    const e = () => (r() - 0.5) * 5;
    g.beginPath(); g.rect(KENAR + e(), KENAR + e(), W - 2 * KENAR + e(), H - 2 * KENAR + e()); g.clip();
    tasarim(g, ad);
  }, 0);
  if (!yay) return m;
  // tuzak (trap): açık renk komşusunun altına biraz taşar, kayıklık kâğıt aralığı yerine bindirme olarak görünür
  const b = bulanik(m, 1);
  for (let i = 0; i < N; i++) m[i] = Math.max(m[i], clamp(b[i] * (1 + 1.6 * yay)));
  return m;
}

function bas(ad, m, saydam) {
  const mk = MUREKKEP[ad];
  const n1 = gurultuFn(mk.tohum), n2 = fbmFn(mk.tohum + 40, 3, 140);
  const bl = bulanik(m, 2);
  // rakle: çekiş yönünde (dikey) ince şeritler + çekiş boyunca yavaş basınç değişimi
  // büyük alanlı elekler (gök, zemin) yatay çekilir: şeritler yatay
  const yatay = ad === 'gok' || ad === 'sari';
  const serit = new Float32Array(W);
  for (let x = 0; x < W; x++) serit[x] = 1 - 0.05 * n1(x / 70, 0.5) - 0.03 * n1(x / 8, 7.5);
  for (let y = 0, i = 0; y < H; y++) {
    const basinc = 1 - 0.035 * n1(3.3, y / 260);
    for (let x = 0; x < W; x++, i++) {
      const sr = yatay ? serit[y] * (1 - 0.03 * n1(x / 300, 2.2)) : serit[x] * basinc;
      let a = m[i];
      if (a <= 0.002) continue;
      // elek ağının kenardaki dişi
      a = clamp((a - 0.5) * 1.6 + 0.5 + (ag[i] - 0.5) * 0.5);
      if (a <= 0) continue;
      const kenar = clamp((m[i] - bl[i]) * 3);
      let d = (saydam ? saydam : 0.965) * sr * (1 - 0.06 * (lif[i] - 0.4)) * (0.955 + 0.09 * n2(x, y));
      d = clamp(d + 0.05 * kenar);
      const k = a * d;
      let cr = mk.c[0], cg = mk.c[1], cb = mk.c[2];
      if (ad === 'gok') { // harmanlı elek (split fountain): üç mürekkep rakle yönünde çizgi çizgi karışır
        const t = clamp((y - 40 + 34 * (n1(x / 240, y / 4.5) - 0.5) + 18 * (n1(x / 520 + 9, y / 1.7) - 0.5)) / 760);
        if (t < 0.55) { const u = smooth(0, 0.55, t); cr = lerp(62, 150, u); cg = lerp(164, 212, u); cb = lerp(222, 236, u); }
        else { const u = smooth(0.55, 1, t); cr = lerp(150, 253, u); cg = lerp(212, 226, u); cb = lerp(236, 200, u); }
      }
      cr *= 1 - 0.05 * kenar; cg *= 1 - 0.05 * kenar; cb *= 1 - 0.05 * kenar;
      if (saydam) { // saydam üst baskı: çarpım
        R[i] *= 1 - k + k * cr / 255; G[i] *= 1 - k + k * cg / 255; Bm[i] *= 1 - k + k * cb / 255;
      } else { // örtücü mürekkep; bindirmede alttaki renk hafifçe sezilir
        const er = cr * (0.84 + 0.16 * R[i] / 255), eg = cg * (0.84 + 0.16 * G[i] / 255), eb = cb * (0.84 + 0.16 * Bm[i] / 255);
        R[i] += (er - R[i]) * k; G[i] += (eg - G[i]) * k; Bm[i] += (eb - Bm[i]) * k;
      }
    }
  }
}

for (const ad of SIRA) bas(ad, elekMaskesi(ad));
// saydam koyu üst baskı (bitkiler önde kalır)
{
  const [dx, dy] = [2.0, 2.2];
  bas('koyu', ustBaskiMaskesi(dx, dy), 0.42);
}

const img = ctx.createImageData(W, H);
for (let i = 0, j = 0; i < N; i++, j += 4) {
  img.data[j] = R[i]; img.data[j + 1] = G[i]; img.data[j + 2] = Bm[i]; img.data[j + 3] = 255;
}
ctx.putImageData(img, 0, 0);
SAHNE.hazir();
</script>
