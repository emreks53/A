<title>S-184 El Boyamalı Ağaç Oyma Baskı — Atölye örnek görseli</title>
<style>

  canvas { display: block; width: 1024px; height: 1024px; }

<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
/*
 * S-184 El Boyamalı Ağaç Oyma Baskı — hayalî bir eski bitki kitabı (herbaryum) ustasının eli: kalıba bıçakla
 oyulmuş kalın, temiz, uçları sivrilen siyah-kahve çizgiler ve sade paralel taramalar dökme kâğıda basılır;
 ardından elle, çizgiden hafifçe taşan saydam boyalarla (yeşil, altın, gül, gök mavisi) renklendirilir.
 * Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
 */
(function () {
  'use strict';
  // ================================================================ el araçları (h5 kiti)
  const OL = 2; // iç çözünürlük çarpanı: 2048 piksel, koordinatlar 1024
  const DW = 1024 * OL, DH = 1024 * OL;
  const PI2 = Math.PI * 2;
  let TANE = null; // kâğıt tanesi (kagitUret doldurur)
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karis(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }

  /** Ekran dışı katman (2048 piksel, 1024 koordinat). */
  function katman(okunur) {
    const c = SAHNE.yeniTuval(DW, DH);
    const x = c.getContext('2d', { willReadFrequently: !!okunur });
    x.setTransform(OL, 0, 0, OL, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x };
  }
  function temizle(x) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, DW, DH); x.restore(); }

  /** Değer gürültüsü (0..1). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function fbm(tohum, okt) {
    const n = gurultu(tohum);
    okt = okt || 4;
    return (x, y) => {
      let s = 0, a = 1, t = 0, f = 1;
      for (let k = 0; k < okt; k++) { s += n(x * f + k * 31.7, y * f - k * 17.3) * a; t += a; a *= 0.5; f *= 2.03; }
      return s / t;
    };
  }

  // ---------------------------------------------------------------- yol geometrisi
  /** SVG yolunu (M L C A Z, mutlak) nokta dizilerine çevirir; her dizi .kapali bilgisi taşır. */
  function duzlestir(d, adim) {
    adim = adim || 1.5;
    const tok = d.match(/[MLCAZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const ekle = (x, y) => cur.push([x, y]);
    const dogru = (x, y) => {
      const m = Math.max(1, Math.ceil(Math.hypot(x - cx, y - cy) / adim));
      for (let j = 1; j <= m; j++) ekle(cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') {
        if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) dogru(sx, sy); else cur[cur.length - 1] = [sx, sy]; cur.kapali = true; }
        cx = sx; cy = sy; cur = null;
        continue;
      }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') dogru(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          ekle(u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const dx = (cx - x) / 2, dy = (cy - y) / 2;
        const x1p = cr * dx + sr * dy, y1p = -sr * dx + cr * dy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(8, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          ekle(cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
  /** Eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1], o = out[out.length - 1];
    if (Math.hypot(s[0] - o[0], s[1] - o[1]) > adim * 0.3) out.push([s[0], s[1]]);
    else out[out.length - 1] = [s[0], s[1]];
    return out;
  }
  /** Dizinin s0..s1 yay uzunluğu aralığındaki parçası. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1], b = p[i];
      const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (s + l >= s0 && s <= s1) {
        const t0 = clamp((s0 - s) / (l || 1), 0, 1), t1 = clamp((s1 - s) / (l || 1), 0, 1);
        if (!out.length) out.push([lerp(a[0], b[0], t0), lerp(a[1], b[1], t0)]);
        out.push([lerp(a[0], b[0], t1), lerp(a[1], b[1], t1)]);
      }
      s += l;
    }
    return out;
  }
  /** Keskin köşelerden böler (kalem köşede kalkar). */
  function koseBol(p, esik) {
    esik = esik === undefined ? 0.75 : esik;
    const out = [];
    let cur = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      cur.push(p[i]);
      const a = Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0]);
      const b = Math.atan2(p[i + 1][1] - p[i][1], p[i + 1][0] - p[i][0]);
      let d = Math.abs(b - a);
      if (d > Math.PI) d = PI2 - d;
      if (d > esik) { out.push(cur); cur = [p[i]]; }
    }
    cur.push(p[p.length - 1]);
    out.push(cur);
    return out.filter((q) => q.length > 1);
  }
  /** Normal boyunca gürültüyle titretir (el titremesi). kapali → dikişsiz. */
  function titret(p, gen, dalga, nf, faz, kapali) {
    const L = uzunluk(p) || 1;
    const out = [];
    let s = 0;
    const R = L / (PI2 * dalga);
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      let v;
      if (kapali) { const th = (PI2 * s) / L; v = nf(faz + R * Math.cos(th), faz * 0.7 + R * Math.sin(th)); }
      else v = nf(s / dalga + faz, faz * 1.3);
      const d = gen * (v - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }
    return out;
  }
  function yolCiz(x, p, kapali) {
    x.beginPath();
    p.forEach((q, i) => (i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])));
    if (kapali) x.closePath();
  }
  function p2d(p, kapali) {
    const P = new Path2D();
    p.forEach((q, i) => (i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1])));
    if (kapali) P.closePath();
    return P;
  }
  /** SVG yolunu titretilmiş Path2D'ye çevirir (elle çizilmiş kenar). */
  function elYolu(d, gen, dalga, nf, faz) {
    const P = new Path2D();
    for (const p of duzlestir(d, 1.2)) {
      const q = titret(ornekle(p, 1.2), gen, dalga, nf, faz, p.kapali);
      q.forEach((v, i) => (i ? P.lineTo(v[0], v[1]) : P.moveTo(v[0], v[1])));
      if (p.kapali) P.closePath();
    }
    return P;
  }
  function kutuBul(diziler, pay) {
    pay = pay || 0;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of diziler) for (const [x, y] of p) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    return [x0 - pay, y0 - pay, x1 + pay, y1 + pay];
  }

  // ---------------------------------------------------------------- değişken kalınlıklı çizgi (kalem/fırça)
  /**
   * p: nokta dizisi; gen(t, aci, s) → o noktadaki tam kalınlık (1024 birim). Uçlar yuvarlak.
   */
  function cizgi(x, p, gen, renk, uclar) {
    const n = p.length;
    if (n < 2) return;
    const L = uzunluk(p);
    const sol = [], sag = [], wl = [];
    let s = 0;
    for (let i = 0; i < n; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      const aci = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const w = Math.max(0, gen(L ? s / L : 0, aci, s, L)) / 2;
      wl.push(w);
      const nx = -Math.sin(aci), ny = Math.cos(aci);
      sol.push([p[i][0] + nx * w, p[i][1] + ny * w]);
      sag.push([p[i][0] - nx * w, p[i][1] - ny * w]);
    }
    x.fillStyle = renk;
    x.beginPath();
    sol.forEach((q, i) => (i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])));
    for (let i = n - 1; i >= 0; i--) x.lineTo(sag[i][0], sag[i][1]);
    x.closePath();
    x.fill();
    if (uclar !== false) {
      if (wl[0] > 0.15) { x.beginPath(); x.arc(p[0][0], p[0][1], wl[0], 0, PI2); x.fill(); }
      if (wl[n - 1] > 0.15) { x.beginPath(); x.arc(p[n - 1][0], p[n - 1][1], wl[n - 1], 0, PI2); x.fill(); }
    }
  }

  // ---------------------------------------------------------------- kâğıt
  /** Kâğıt dokusu: TANE (Float32, 0..1, cihaz pikseli) ve boyanmış kâğıt tuvali. */
  function kagitUret(o) {
    o = Object.assign({ renk: '#FBF7EC', tohum: 11, dis: 0.5, iri: 0.5, lif: 0.0, guc: 9, laid: 0 }, o);
    // ince diş: rastgele piksel → hafif bulanık; iri: düşük çözünürlüklü gürültü büyütülmüş
    const r = SAHNE.rng(o.tohum);
    const a = SAHNE.yeniTuval(DW, DH);
    const ax = a.getContext('2d', { willReadFrequently: true });
    const id = ax.createImageData(DW, DH);
    for (let i = 0; i < DW * DH; i++) { const v = (r() * 255) | 0; id.data[i * 4] = v; id.data[i * 4 + 3] = 255; }
    ax.putImageData(id, 0, 0);
    const b = SAHNE.yeniTuval(DW, DH);
    const bx = b.getContext('2d', { willReadFrequently: true });
    bx.filter = 'blur(1.1px)';
    bx.drawImage(a, 0, 0);
    bx.filter = 'none';
    const ince = bx.getImageData(0, 0, DW, DH).data;
    // iri: 160² rastgele → büyüt (yumuşak)
    const k = 160;
    const s = SAHNE.yeniTuval(k, k);
    const sx = s.getContext('2d');
    const sd = sx.createImageData(k, k);
    for (let i = 0; i < k * k; i++) { sd.data[i * 4] = (r() * 255) | 0; sd.data[i * 4 + 3] = 255; }
    sx.putImageData(sd, 0, 0);
    bx.imageSmoothingEnabled = true;
    bx.imageSmoothingQuality = 'high';
    bx.filter = 'blur(6px)';
    bx.drawImage(s, -20, -20, DW + 40, DH + 40);
    bx.filter = 'none';
    const iri = bx.getImageData(0, 0, DW, DH).data;
    const T2 = new Float32Array(DW * DH);
    let mn = 1e9, mx = -1e9;
    for (let i = 0; i < DW * DH; i++) {
      const v = o.dis * (ince[i * 4] / 255) + o.iri * (iri[i * 4] / 255);
      T2[i] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    // kontrast genişlet (ortalama ~0.5)
    let ort = 0;
    for (let i = 0; i < DW * DH; i += 97) ort += T2[i];
    ort /= Math.ceil((DW * DH) / 97);
    const yay = Math.max(ort - mn, mx - ort) * 0.55;
    for (let i = 0; i < DW * DH; i++) T2[i] = clamp(0.5 + (T2[i] - ort) / (2 * yay), 0, 1);
    if (o.laid) {
      // dökme kâğıdın ince yatay çizgileri ve seyrek zincir çizgileri (kâğıdın yapısı)
      for (let y = 0; y < DH; y++) {
        const v = 0.5 + 0.5 * Math.sin((y / OL) * PI2 / 2.2);
        for (let xx = 0; xx < DW; xx++) T2[y * DW + xx] = clamp(T2[y * DW + xx] + (v - 0.5) * o.laid, 0, 1);
      }
      for (let xx = 0; xx < DW; xx++) {
        const d = Math.abs((((xx / OL) + 40) % 92) - 46) ;
        const v = Math.exp(-(46 - d) * (46 - d) / 3) ;
        if (v > 0.01) for (let y = 0; y < DH; y++) T2[y * DW + xx] = clamp(T2[y * DW + xx] + v * o.laid * 0.8, 0, 1);
      }
    }
    // boyanmış kâğıt
    const c = SAHNE.yeniTuval(DW, DH);
    const cx = c.getContext('2d', { willReadFrequently: true });
    const pd = cx.createImageData(DW, DH);
    const [R, G, B] = hex(o.renk);
    for (let i = 0; i < DW * DH; i++) {
      const v = (T2[i] - 0.5) * o.guc;
      pd.data[i * 4] = R - v;
      pd.data[i * 4 + 1] = G - v;
      pd.data[i * 4 + 2] = B - v * 1.1;
      pd.data[i * 4 + 3] = 255;
    }
    cx.putImageData(pd, 0, 0);
    if (o.lif > 0) {
      // seyrek kâğıt lifleri
      const L = cx;
      L.setTransform(OL, 0, 0, OL, 0, 0);
      for (let i = 0; i < 1400 * o.lif; i++) {
        const x0 = r() * 1024, y0 = r() * 1024, a0 = r() * PI2, l = 3 + r() * 9;
        L.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(120,100,70,0.07)';
        L.lineWidth = 0.35 + r() * 0.3;
        L.beginPath();
        L.moveTo(x0, y0);
        L.quadraticCurveTo(x0 + Math.cos(a0 + 0.6) * l * 0.5, y0 + Math.sin(a0 + 0.6) * l * 0.5, x0 + Math.cos(a0) * l, y0 + Math.sin(a0) * l);
        L.stroke();
      }
      L.setTransform(1, 0, 0, 1, 0, 0);
    }
    TANE = T2;
    return { c, TANE: T2 };
  }

  // ---------------------------------------------------------------- suluboya lavisi
  /** Kutu boyutunda geçici tuval (büyük tuvalde süzgeç pahalıdır). */
  function kucukTuval(w, h) {
    const c = SAHNE.yeniTuval(w, h);
    return { c, x: c.getContext('2d', { willReadFrequently: true }) };
  }
  /** Cihaz pikseli kutusu (pay eklenmiş, sınırlanmış). */
  function cihazKutu(kutu, pay) {
    let [x0, y0, x1, y1] = kutu ? kutu.map((v) => v * OL) : [0, 0, DW, DH];
    x0 = clamp(Math.floor(x0) - pay, 0, DW); y0 = clamp(Math.floor(y0) - pay, 0, DH);
    x1 = clamp(Math.ceil(x1) + pay, 0, DW); y1 = clamp(Math.ceil(y1) + pay, 0, DH);
    return [x0, y0, x1 - x0, y1 - y0];
  }
  /** ciz(ctx) ile beyaz maske çizer; kutu tuvali ve (isteğe bağlı) bulanık kopyası döner. */
  function maskeCiz(ciz, x0, y0, w, h, yumusak) {
    const M = kucukTuval(w, h);
    M.x.setTransform(OL, 0, 0, OL, -x0, -y0);
    M.x.fillStyle = '#fff';
    M.x.strokeStyle = '#fff';
    M.x.lineCap = 'round';
    M.x.lineJoin = 'round';
    ciz(M.x);
    if (yumusak) {
      const Y = kucukTuval(w, h);
      Y.x.filter = `blur(${yumusak * OL}px)`;
      Y.x.drawImage(M.c, 0, 0);
      return Y;
    }
    return M;
  }
  /**
   * Saydam lavi: maskeyi ciz(ctx) ile çizer (beyaz dolgu; gradyanla yoğunluk verilebilir), kenarda pigment
   * birikmesi, kâğıt tanesinde çökelme ve hafif dalgalanma ekler; hedefe 'multiply' ile bindirir.
   * o.f(x,y,a) → piksel başına yoğunluk çarpanı (1024 koordinat) verilebilir.
   */
  function lavi(hedef, ciz, renk, o) {
    o = Object.assign({ alfa: 0.5, kenar: 0.7, kenarR: 2.6, tane: 0.2, dalga: 0.1, dalgaO: 0.008, kutu: null, tohum: 1, renk2: null, karisO: 0.006, mod: 'multiply', f: null, TANE: null, yumusak: 0 }, o);
    const T = o.TANE || TANE;
    const [x0, y0, w, h] = cihazKutu(o.kutu, Math.ceil((o.kenarR * 3 + o.yumusak * 2 + 4) * OL));
    if (w <= 0 || h <= 0) return;
    const M = maskeCiz(ciz, x0, y0, w, h, o.yumusak);
    const Bk = kucukTuval(w, h);
    Bk.x.filter = `blur(${o.kenarR * OL}px)`;
    Bk.x.drawImage(M.c, 0, 0);
    const m = M.x.getImageData(0, 0, w, h).data;
    const b = Bk.x.getImageData(0, 0, w, h).data;
    const Ok = kucukTuval(w, h);
    const out = Ok.x.createImageData(w, h);
    const od = out.data;
    const c1 = hex(renk), c2 = o.renk2 ? hex(o.renk2) : c1;
    const nf = gurultu(o.tohum), nk = o.renk2 ? gurultu(o.tohum + 77) : null;
    const dO = o.dalgaO / OL, kO = o.karisO / OL;
    for (let j = 0; j < h; j++) {
      const gy = y0 + j;
      for (let i = 0; i < w; i++) {
        const k = (j * w + i) * 4;
        const a = m[k + 3] / 255;
        if (a <= 0.002) continue;
        const gx = x0 + i;
        const rim = clamp((a - b[k + 3] / 255) * 2.2, 0, 1);
        const g = T ? T[gy * DW + gx] : 0.5;
        const v = nf(gx * dO, gy * dO);
        let d = a * o.alfa * (1 + o.kenar * rim) * (1 + o.dalga * (v - 0.5) * 2) * (1 + o.tane * (g - 0.5) * 2);
        if (o.f) d *= o.f(gx / OL, gy / OL, a);
        d = clamp(d, 0, 1);
        if (d <= 0) continue;
        let R = c1[0], G = c1[1], B = c1[2];
        if (nk) { const t = sstep(0.3, 0.7, nk(gx * kO, gy * kO)); R = lerp(R, c2[0], t); G = lerp(G, c2[1], t); B = lerp(B, c2[2], t); }
        od[k] = R; od[k + 1] = G; od[k + 2] = B; od[k + 3] = d * 255;
      }
    }
    Ok.x.putImageData(out, 0, 0);
    hedef.save();
    hedef.setTransform(1, 0, 0, 1, 0, 0);
    hedef.globalCompositeOperation = o.mod;
    hedef.drawImage(Ok.c, x0, y0);
    hedef.restore();
  }

  /** Bir yolun içini kâğıda geri döndürür (öndeki öğe arkadakini örter). kutu: 1024 biriminde sınır. */
  function kagidaDon(x, yol, kagitC, kutu) {
    let [x0, y0, x1, y1] = kutu ? kutu.map((v) => v * OL) : [0, 0, DW, DH];
    x0 = clamp(Math.floor(x0) - 4, 0, DW); y0 = clamp(Math.floor(y0) - 4, 0, DH);
    x1 = clamp(Math.ceil(x1) + 4, 0, DW); y1 = clamp(Math.ceil(y1) + 4, 0, DH);
    if (x1 <= x0 || y1 <= y0) return;
    x.save();
    x.clip(yol);
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.drawImage(kagitC, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
    x.restore();
  }
  /** Ana tuvali CPU tarafında (okunabilir) kurar. */
  function anaTuval() {
    const cv = document.getElementById('tuval');
    cv.getContext('2d', { willReadFrequently: true });
    const x = SAHNE.tuval(cv, OL);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return x;
  }

  // ---------------------------------------------------------------- ışık modeli (sağ üstten)
  const ISIK = (() => { const v = [0.62, -0.55, 0.56]; const l = Math.hypot(...v); return v.map((q) => q / l); })();
  const _PROF = SAHNE.kubbeProfili(240);
  /** Kubbede (x,y) için Lambert aydınlığı (0..1); kubbe dışında -1. */
  function kubbeIsik(x, y) {
    if (y > 555 || y < 300) return -1;
    let i = 0;
    while (i < _PROF.length - 2 && _PROF[i + 1].y > y) i++;
    const p = _PROF[i], q = _PROF[i + 1];
    const t = clamp((p.y - y) / (p.y - q.y || 1), 0, 1);
    const r = lerp(p.r, q.r, t);
    if (r <= 0.5 || Math.abs(x - 560) > r) return -1;
    const dh = p.y - q.y, dr = q.r - p.r;
    const l = Math.hypot(dh, dr) || 1;
    const ca = dh / l, sa = -dr / l;
    const u = clamp((x - 560) / r, -1, 1);
    const cz = Math.sqrt(1 - u * u);
    const n = [u * ca, -sa, cz * ca];
    return Math.max(0, n[0] * ISIK[0] + n[1] * ISIK[1] + n[2] * ISIK[2]);
  }
  function kubbeYaricap(y) {
    let i = 0;
    while (i < _PROF.length - 2 && _PROF[i + 1].y > y) i++;
    const p = _PROF[i], q = _PROF[i + 1];
    const t = clamp((p.y - y) / (p.y - q.y || 1), 0, 1);
    return lerp(p.r, q.r, t);
  }
  /** Dikey silindir (kasnak, minare) için aydınlık. */
  function silindirIsik(x, cx, R) {
    const u = clamp((x - cx) / R, -1, 1);
    const n = [u, 0, Math.sqrt(1 - u * u)];
    return Math.max(0, n[0] * ISIK[0] + n[2] * ISIK[2]);
  }

  // ---------------------------------------------------------------- sahne yardımcıları
  const f2 = (v) => Math.round(v * 100) / 100;
  /** Ucu hafif çentikli yabani gül taç yaprağı: merkezden a yönünde, boy L, yarı en G. */
  function tacYolu(cx, cy, a, L, G, centik) {
    centik = centik === undefined ? 0.1 : centik;
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = (u, v) => `${f2(cx + u * L * ca - v * G * sa)},${f2(cy + u * L * sa + v * G * ca)}`;
    const n = 1 - centik;
    return `M${p(0.05, 0)} C${p(0.3, -0.5)} ${p(0.6, -1.02)} ${p(0.86, -0.82)} C${p(1.0, -0.66)} ${p(1.02, -0.16)} ${p(n, 0)} ` +
      `C${p(1.02, 0.16)} ${p(1.0, 0.66)} ${p(0.86, 0.82)} C${p(0.6, 1.02)} ${p(0.3, 0.5)} ${p(0.05, 0)} Z`;
  }
  /** Bulut: tabanı düz, üstü kabarık daireler. [{x,y,r}] ve taban y'si. */
  function bulutDaireleri(cx, cy, s, r, o) {
    o = Object.assign({ n: 9, en: 200, boy: 1 }, o);
    const out = [];
    const n = o.n;
    const taban = cy + 10 * s;
    for (let i = 0; i < n; i++) {
      const t = 0.07 + (0.86 * i) / (n - 1);
      const x = cx + (t - 0.5) * o.en * s + (i && i < n - 1 ? (r() - 0.5) * 8 * s : 0);
      const yuk = Math.pow(Math.sin(Math.PI * t), 1.2);
      const rr = (10 + 20 * yuk * o.boy + (i && i < n - 1 ? r() * 6 : 0)) * s;
      // daire tabana teğet ya da biraz altında: uçlar incelir
      out.push({ x, y: taban - rr * (0.55 + 0.35 * yuk), r: rr });
    }
    for (let i = 0; i < 3; i++) {
      const t = 0.3 + i * 0.2 + (r() - 0.5) * 0.08;
      const rr = (12 + 7 * r()) * s * o.boy;
      out.push({ x: cx + (t - 0.5) * o.en * s, y: taban - (30 + 8 * r()) * s * o.boy, r: rr });
    }
    return { daireler: out, taban };
  }
  /** Bulut dış çizgisi parçaları (görünen yaylar) ve dolgu yolu. */
  function bulutBicim(b) {
    const parcalar = [];
    for (const d of b.daireler) {
      let cur = null;
      for (let k = 0; k <= 120; k++) {
        const a = Math.PI + (Math.PI * 2 * k) / 120;
        const x = d.x + Math.cos(a) * d.r, y = d.y + Math.sin(a) * d.r;
        let acik = y < b.taban - 0.5;
        if (acik) for (const e of b.daireler) if (e !== d && Math.hypot(x - e.x, y - e.y) < e.r - 0.4) { acik = false; break; }
        if (acik) { if (!cur) { cur = []; parcalar.push(cur); } cur.push([x, y]); } else cur = null;
      }
    }
    const dolgu = new Path2D();
    for (const d of b.daireler) { dolgu.moveTo(d.x + d.r, d.y); dolgu.arc(d.x, d.y, d.r, 0, PI2); }
    return { parcalar: parcalar.filter((p) => p.length > 2), dolgu };
  }
  /** Minare parçaları SVG yolu ve kutusuyla. */
  function minareYollari() {
    return SAHNE.minareParcalari().map((p) => {
      let d, x1, x2, y1, y2;
      if (p.tip === 'poligon') { d = SAHNE.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); y1 = Math.min(...p.noktalar.map((q) => q[1])); y2 = Math.max(...p.noktalar.map((q) => q[1])); }
      else if (p.tip === 'topuz') { d = p.yol; x1 = 266; x2 = 334; y1 = 146; y2 = 200; }
      else if (p.tip === 'alem') { d = null; x1 = 286; x2 = 314; y1 = 77; y2 = 152; }
      else { d = SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true); x1 = p.x1; x2 = p.x2; y1 = p.y1; y2 = p.y2; }
      return Object.assign({}, p, { d, kx1: x1, kx2: x2, ky1: y1, ky2: y2 });
    });
  }

  // ---------------------------------------------------------------- örtücü guaj dolgu
  /**
   * Opak guaj: maskeyi ciz(ctx) ile çizer; fırça yönünde ince sürüş izleri (yon: açı ya da (x,y)→açı),

   */
  function guaj(hedef, ciz, renk, o) {
    o = Object.assign({ alfa: 0.97, yon: 0, doku: 0.05, along: 0.02, across: 0.42, leke: 0.03, lekeO: 0.012, kenar: 0.08, kenarR: 1.2, tane: 0.035, kuru: 0, tohum: 1, kutu: null, f: null, mod: 'source-over', renk2: null, karisO: 0.01 }, o);
    const [x0, y0, w, h] = cihazKutu(o.kutu, Math.ceil((o.kenarR * 3 + 4) * OL));
    if (w <= 0 || h <= 0) return;
    const M = maskeCiz(ciz, x0, y0, w, h, 0);
    const Bk = kucukTuval(w, h);
    Bk.x.filter = `blur(${o.kenarR * OL}px)`;
    Bk.x.drawImage(M.c, 0, 0);
    const m = M.x.getImageData(0, 0, w, h).data;
    const b = Bk.x.getImageData(0, 0, w, h).data;
    const Ok = kucukTuval(w, h);
    const out = Ok.x.createImageData(w, h);
    const od = out.data;
    const c1 = hex(renk), c2 = o.renk2 ? hex(o.renk2) : null;
    const nS = gurultu(o.tohum), nM = gurultu(o.tohum + 5), nK = gurultu(o.tohum + 9);
    const yonF = typeof o.yon === 'function' ? o.yon : null;
    let ca = Math.cos(o.yon || 0), sa = Math.sin(o.yon || 0);
    for (let j = 0; j < h; j++) {
      const gy = y0 + j, yy = gy / OL;
      for (let i = 0; i < w; i++) {
        const k = (j * w + i) * 4;
        let a = m[k + 3] / 255;
        if (a <= 0.002) continue;
        const gx = x0 + i, xx = gx / OL;
        if (yonF) { const t = yonF(xx, yy); ca = Math.cos(t); sa = Math.sin(t); }
        const u = xx * ca + yy * sa, v = -xx * sa + yy * ca;
        const st = nS(u * o.along, v * o.across) - 0.5;
        const mo = nM(xx * o.lekeO, yy * o.lekeO) - 0.5;
        const g = (TANE ? TANE[gy * DW + gx] : 0.5) - 0.5;
        const rim = clamp((a - b[k + 3] / 255) * 2.2, 0, 1);
        let L = 1 + o.doku * st * 2 + o.leke * mo * 2 - o.tane * g * 2 - o.kenar * rim;
        let cr, cg, cb;
        if (o.f) { const c = o.f(xx, yy); cr = c[0]; cg = c[1]; cb = c[2]; } else { cr = c1[0]; cg = c1[1]; cb = c1[2]; }
        if (c2) { const t = sstep(0.3, 0.7, nK(xx * o.karisO, yy * o.karisO)); cr = lerp(cr, c2[0], t); cg = lerp(cg, c2[1], t); cb = lerp(cb, c2[2], t); }
        if (o.kuru) a *= clamp(1 - o.kuru * sstep(0.55, 0.9, g + 0.5) * (1 - a * 0.3) * (rim * 1.5 + 0.15) * 2, 0, 1);
        od[k] = clamp(cr * L, 0, 255); od[k + 1] = clamp(cg * L, 0, 255); od[k + 2] = clamp(cb * L, 0, 255); od[k + 3] = a * o.alfa * 255;
      }
    }
    Ok.x.putImageData(out, 0, 0);
    hedef.save();
    hedef.setTransform(1, 0, 0, 1, 0, 0);
    hedef.globalCompositeOperation = o.mod;
    hedef.drawImage(Ok.c, x0, y0);
    hedef.restore();
  }

  // ================================================================ stilin çizimi

  const R = SAHNE.rng(184);
  const ctx = anaTuval();
  const kag = kagitUret({ renk: '#F7F0DE', tohum: 184, dis: 0.8, iri: 0.3, guc: 9, lif: 0.5, laid: 0.22 });
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(kag.c, 0, 0); ctx.restore();

  const MUR = '#2A1D15';
  const P = {
    gok: '#6DB1E2', gok2: '#86C3E8',
    yesil: '#55AA4A', yesil2: '#8CBD40', zumrut: '#2C9F58', zumrut2: '#45AE72',
    altin: '#E6B43C', altin2: '#EFC85A', gul: '#E3788A', gul2: '#EC9AA0',
    toprak: '#DDBB72', tas: '#EBD9B4',
  };
  const nI = gurultu(1841);
  // ---- baskı katmanı (oyma kalıbın mürekkebi) ve renk katmanı
  const K = katman(true);
  const C = katman(true);
  C.x.save(); C.x.setTransform(1, 0, 0, 1, 0, 0); C.x.fillStyle = '#fff'; C.x.fillRect(0, 0, DW, DH); C.x.restore();
  const beyazC = (() => { const c = SAHNE.yeniTuval(DW, DH); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, DW, DH); return c; })();

  /** Öğenin silüetini örtücü yapar: arkadaki oyma çizgileri ve boyaları silinir. */
  function ort(yol, kutu) {
    K.x.save(); K.x.globalCompositeOperation = 'destination-out'; K.x.fillStyle = '#000'; K.x.fill(yol); K.x.restore();
    kagidaDon(C.x, yol, beyazC, kutu);
  }
  /** Oyma çizgi: bıçakla kesilmiş gibi hafif köşeli, uçları sivri; kalınlık w. */
  function oyma(d, w, o) {
    o = o || {};
    const diz = typeof d === 'string' ? duzlestir(d, 1) : d;
    for (const p0 of diz) {
      const p = ornekle(p0, o.adim || 3.2);
      if (p.length < 2) continue;
      const parcalar = o.kose === false ? [p] : koseBol(p, 0.7);
      for (const q0 of parcalar) {
        const faz = R() * 100;
        const q = titret(q0, o.gen === undefined ? 0.35 : o.gen, o.dalga || 30, nI, faz, false);
        const L = uzunluk(q);
        const s0 = o.sivri === false ? 0.0001 : Math.min(o.uc || 5, L * 0.35);
        cizgi(K.x, q, (t, a, s) => w * (0.88 + 0.24 * nI(s / 40 + faz, 2.2)) * (o.sivri === false ? 1 : 0.18 + 0.82 * sstep(0, s0, s) * sstep(0, s0, L - s)), MUR, o.sivri === false);
      }
    }
  }
  /** Tarama: kısa paralel oyma çizgileri (iki ucu sivri). */

  /** Renk lavisi: çizgiden biraz taşar ve kayar (elle renklendirme). */
  function boya(yol, renk, o) {
    o = Object.assign({}, o);
    const dx = o.dx === undefined ? 2.2 + (R() - 0.5) * 3 : o.dx, dy = o.dy === undefined ? -1.6 + (R() - 0.5) * 3 : o.dy;
    const tasma = o.tasma === undefined ? 2.4 : o.tasma;
    lavi(C.x, (x) => {
      x.translate(dx, dy);
      if (o.ciz) o.ciz(x); else { x.fill(yol); if (tasma > 0) { x.lineWidth = tasma * 2; x.stroke(yol); } }
    }, renk, Object.assign({ alfa: 0.6, kenar: 0.55, kenarR: 2, tane: 0.25, dalga: 0.2, dalgaO: 0.02, tohum: (R() * 1e6) | 0 }, o.lavi || {}, { kutu: o.kutu }));
  }
  const kutuD = (d, pay) => kutuBul(duzlestir(d, 3), pay || 4);

  // ================================================================ gök (boya) ve bulut, güneş (oyma)
  boya(null, P.gok, {
    ciz: (x) => { const g = x.createLinearGradient(0, 0, 0, 600); g.addColorStop(0, '#fff'); g.addColorStop(0.55, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 1024, 640); },
    dx: 0, dy: 0, lavi: { alfa: 0.66, kenar: 0, tane: 0.3, dalga: 0.1, dalgaO: 0.005, renk2: P.gok2, karisO: 0.003, f: (x, y) => 0.82 + 0.36 * (nI(x * 0.004, y * 0.045) - 0.5) },
  });
  // güneş
  {
    const gx = 880, gy = 140;
    const disk = new Path2D(SAHNE.daireYolu(gx, gy, 38));
    ort(disk, [830, 90, 930, 190]);
    boya(disk, P.altin, { kutu: [820, 80, 940, 200], lavi: { alfa: 0.7, renk2: P.altin2 } });
    oyma(SAHNE.daireYolu(gx, gy, 38), 3.2, { kose: false });
    oyma(SAHNE.daireYolu(gx, gy, 26), 1.6, { kose: false });
    const isin = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * PI2 + 0.1;
      const r0 = 46, r1 = i % 2 ? 70 : 84;
      if (i % 2) isin.push([[gx + Math.cos(a) * r0, gy + Math.sin(a) * r0], [gx + Math.cos(a) * r1, gy + Math.sin(a) * r1]]);
      else {
        const pts = [];
        for (let t = 0; t <= 1.0001; t += 0.05) {
          const r = r0 + (r1 - r0) * t;
          const o = Math.sin(t * Math.PI * 3) * 2.2;
          pts.push([gx + Math.cos(a) * r - Math.sin(a) * o, gy + Math.sin(a) * r + Math.cos(a) * o]);
        }
        isin.push(pts);
      }
    }
    boya(null, P.altin, { ciz: (x) => { x.lineWidth = 7; for (const s of isin) { yolCiz(x, s); x.stroke(); } }, kutu: [790, 50, 970, 230], lavi: { alfa: 0.5 } });
    for (const s of isin) oyma([s], 2.6, { kose: false, uc: 7, adim: 2 });
  }
  // bulutlar: oyma ustasının kıvrımlı, her yanı tırtıllı bulut kuşağı; alt yarıda yatay taramalar
  const bulutlar = [[170, 246, 1.0], [462, 136, 0.82], [808, 336, 0.92], [952, 486, 0.58], [74, 476, 0.58]];
  for (const [bx, by, bs] of bulutlar) {
    const a0 = 92 * bs, b0 = 22 * bs;
    const pts = [];
    const n = 240, tir = 9;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * PI2;
      const bump = Math.pow(Math.abs(Math.sin(t * tir / 2 + 0.3)), 0.6);
      const ust = Math.sin(t) < 0 ? 1.0 : 0.55;
      const rx = a0 + bump * 13 * bs * ust, ry = b0 + bump * 13 * bs * ust;
      pts.push([bx + Math.cos(t) * rx, by + Math.sin(t) * ry * (Math.sin(t) < 0 ? 1.15 : 0.8)]);
    }
    const yol = p2d(pts, true);
    const kutu = [bx - a0 - 14, by - b0 * 1.3 - 14, bx + a0 + 14, by + b0 + 14];
    ort(yol, kutu);
    boya(yol, '#B9D6EC', { kutu, tasma: 1, lavi: { alfa: 0.35, f: (x, y) => sstep(by - b0 * 0.4, by + b0, y) } });
    oyma([pts.concat([pts[0]])], 2.6, { kose: false, uc: 2, adim: 2 });
    const tr = [];
    for (let k = 0; k < 3; k++) {
      const y = by + 4 * bs + k * 6 * bs;

      if (half > 10) tr.push([[bx - half, y], [bx + half, y]]);
    }
    tara(tr, 1.3);
    // sağ üstte (ışık yanında) dış tırtılı izleyen tek iç kontur: oymacının bulut kalıbı
    const ic = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * PI2;
      if (t < Math.PI * 1.52 || t > Math.PI * 1.9) continue;

  // ================================================================ yer
  boya(null, P.toprak, { ciz: (x) => x.fillRect(0, 803, 1024, 230), dx: 0, dy: 0, kutu: [0, 790, 1024, 1024], lavi: { alfa: 0.55, renk2: '#D1AE60', kenar: 0.6, karisO: 0.01, dalga: 0.25 } });
  boya(null, P.yesil2, { ciz: (x) => { const g = x.createLinearGradient(0, 840, 0, 1024); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, '#fff'); x.fillStyle = g; x.fillRect(0, 810, 1024, 214); }, dx: 0, dy: 0, kutu: [0, 800, 1024, 1024], lavi: { alfa: 0.4, kenar: 0 } });
  // yer çizgisi ve kısa yatay oyma çizgiler, çakıllar
  oyma([[[20, 801], [1004, 801]]], 2.6, { kose: false, uc: 20, adim: 6 });
  for (let i = 0; i < 70; i++) {

  for (let i = 0; i < 26; i++) {

  // ================================================================ kubbe
  {

    for (let k = 1; k < 16; k++) {

        if (ymin > 540) continue;

  // ================================================================ alemler (altın boyalı oyma)

    for (const d of parca) oyma(d, w, { kose: false, uc: 1.5, adim: 1.5 });

  alemCiz(SAHNE.alemParcalari(560, 300, 1), 2.0);
  alemCiz(MY.find((p) => p.tip === 'alem').alem, 1.5);

  // ================================================================ bitkiler (herbaryum üslubu)
  const B = SAHNE.bitki;
  const isik2 = [0.75, -0.66];
  for (const s of B.saplar) {
    const p = ornekle(s, 3);
    // sap: iki kenar çizgisi arası boyalı
    const sol = [], sag = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];

    const kutu = kutuBul([p], 8);
    ort(yol, kutu);
    boya(yol, P.yesil, { kutu, tasma: 1.2, lavi: { alfa: 0.6 } });
    oyma([sol], 2.2, { kose: false, uc: 10 });

  }
  B.yapraklar.forEach((y, i) => {

    const kutu = kutuD(d, 5);

    boya(yol, i % 3 === 0 ? P.yesil2 : P.yesil, { kutu, lavi: { alfa: 0.62, renk2: i % 2 ? '#4E9E62' : '#7DB24A', karisO: 0.03 } });
    oyma(d, y.uzunluk > 50 ? 3.0 : 2.5, { kose: true, uc: 4, adim: 2.8 });
    const [a, b] = SAHNE.yaprakDamari(y);
    oyma([[a, b]], 1.5, { kose: false, uc: 6, adim: 2 });
    // ışıktan uzak yarıda kısa paralel taramalar, diğer yarıda iki-üç damar
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci), nx = -sa, ny = ca;
    const yon = nx * isik2[0] + ny * isik2[1] > 0 ? -1 : 1;

    const tr = [];
    for (let t = 0.18; t < 0.86; t += 0.09) {
      const ox = y.x + ca * L * t, oy = y.y + sa * L * t;
      const w = Wd * 0.62 * Math.sin(Math.PI * Math.min(1, t * 1.05)) * 0.75;
      tr.push([[ox + nx * yon * 2, oy + ny * yon * 2], [ox + ca * w * 0.5 + nx * yon * w, oy + sa * w * 0.5 + ny * yon * w]]);

      const w = Wd * 0.4;
      oyma([[[ox, oy], [ox + ca * w * 0.7 - nx * yon * w, oy + sa * w * 0.7 - ny * yon * w]]], 1.0, { kose: false, uc: 3, adim: 2 });
    }

  B.tomurcuklar.forEach((t) => {

    const yol = new Path2D(d);
    const kutu = kutuD(d, 5);

    boya(yol, P.gul, { kutu, lavi: { alfa: 0.62, renk2: P.gul2 } });

    ort(go, kutu);
    boya(go, P.altin, { kutu, lavi: { alfa: 0.72, renk2: P.altin2 } });
    oyma(SAHNE.daireYolu(c.x, c.y, c.r * 0.22), w * 0.85, { kose: false, uc: 1, adim: 1.5 });
    const n = c.r > 40 ? 9 : 6;
    for (let i = 0; i < n; i++) {

      const rr = c.r * (i % 2 ? 0.1 : 0.14);

      K.x.beginPath(); K.x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.03), 0, PI2); K.x.fill();
    }
  });

  // ================================================================ çerçeve (kalıba ait çift çizgi)
  for (const [ins, w] of [[7, 5.2], [15, 1.7]]) {

  {

      const v = nB(x * 0.004, y * 0.004);

      d[i * 4 + 3] = a * k;
    }

  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  ctx.drawImage(K.c, 0, 0);
  ctx.drawImage(C.c, 0, 0);
