<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-154 Mermer Doku Vektör — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f4f1ec; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-154 Mermer Doku Vektör — düz, temiz vektör biçimler; her biçimin içi gerçekçi bir mermer dokusuyla
  // doldurulur (taş için beyaz Carrara, kubbe için yeşil mermer, taç yaprakları için pembe mermer, gök için
  // açık mavi, zemin için krem mermer). Biçimler ince altın konturla çevrilir; bazı damarlar da altındır.
  const OL = 2, W2 = 1024 * OL;
  const ctx = SAHNE.tuval(document.getElementById('tuval'), OL);
  const Y = SAHNE.yollar();
  const B = SAHNE.bitki;
  const P = (d) => new Path2D(d);
  const dikd = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y1} L${x2},${y2} L${x1},${y2} Z`;

  // ------------------------------------------------------------ değer gürültüsü (tohumlu)
  const PERM = new Uint8Array(512);
  const GRAD = new Float32Array(256);
  (function () {
    const r = SAHNE.rng(154);
    const p = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
    for (let i = 0; i < 256; i++) GRAD[i] = r();
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Yy = yi & 255;
    const a = GRAD[PERM[PERM[X] + Yy]], b = GRAD[PERM[PERM[X + 1] + Yy]];
    const c = GRAD[PERM[PERM[X] + Yy + 1]], d = GRAD[PERM[PERM[X + 1] + Yy + 1]];
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, okt) {
    let s = 0, amp = 0.5, top = 0;
    for (let i = 0; i < okt; i++) { s += gurultu(x, y) * amp; top += amp; x = x * 2.03 + 17.1; y = y * 2.03 + 9.7; amp *= 0.5; }
    return s / top;
  }
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  // ------------------------------------------------------------ mermer tarifleri
  // Cilalı mermer: yumuşak bulutlanma, düşük kontrastlı, yavaş akan ince damarlar (çatlak gibi keskin ve
  // kırık çizgiler yok). a: zemin açık, b: bulutlu ton, d: ana damar, e: ikincil damar; dg/eg: damar gücü;
  // olcek: desen büyüklüğü (px); aci: damar yönü; burgu: akışın kıvrımı; sk: damar sıklığı; dk: damar genişliği.
  const MERMER = {
    carrara: { a: '#FCFBF8', b: '#E8E5E0', d: '#9AA2AC', e: '#C2C7CD', dg: 0.75, eg: 0.45, olcek: 220, aci: 0.75, burgu: 1.8, sk: 2.3, dk: 0.028, altin: 0.008, bulut: 0.85 },
    carrara2: { a: '#FBF9F5', b: '#E7E3DC', d: '#9CA4AD', e: '#C4C8CD', dg: 0.75, eg: 0.45, olcek: 240, aci: -0.55, burgu: 1.9, sk: 2.2, dk: 0.026, altin: 0.008, bulut: 0.85 },
    yesil: { a: '#40B071', b: '#1F844C', d: '#9BDDB5', e: '#6FC893', dg: 0.62, eg: 0.36, olcek: 280, aci: 0.95, burgu: 1.9, sk: 1.7, dk: 0.028, altin: 0, bulut: 0.9 },
    yesilKoyu: { a: '#319B64', b: '#1D7445', d: '#86CFA5', e: '#5DB384', dg: 0.55, eg: 0.32, olcek: 240, aci: 0.3, burgu: 1.8, sk: 1.8, dk: 0.028, altin: 0, bulut: 0.85 },
    pencere: { a: '#226E48', b: '#175236', d: '#5DA87F', e: '#468F68', dg: 0.45, eg: 0.2, olcek: 110, aci: 1.0, burgu: 1.5, sk: 1.6, dk: 0.045, altin: 0, bulut: 0.6 },
    yaprak: { a: '#80C696', b: '#5BAA77', d: '#C3E7CE', e: '#A2D6B3', dg: 0.5, eg: 0.28, olcek: 100, aci: 0.9, burgu: 1.6, sk: 1.7, dk: 0.04, altin: 0, bulut: 0.75 },
    yaprakK: { a: '#63B382', b: '#429462', d: '#AEDCBD', e: '#8CCAA1', dg: 0.48, eg: 0.26, olcek: 110, aci: -0.6, burgu: 1.6, sk: 1.7, dk: 0.04, altin: 0, bulut: 0.75 },
    pembe: { a: '#FAE4E9', b: '#EFBDCA', d: '#E09FB1', e: '#FFF7F9', dg: 0.5, eg: 0.4, olcek: 80, aci: 0.6, burgu: 1.8, sk: 1.7, dk: 0.045, altin: 0, bulut: 0.9 },
    gok: { a: '#E4F0F8', b: '#D0E4F0', d: '#F1F8FC', e: '#ECF5FA', dg: 0.5, eg: 0.25, olcek: 420, aci: 0.4, burgu: 1.7, sk: 1.5, dk: 0.05, altin: 0, bulut: 0.75 },
    bulut: { a: '#FFFFFF', b: '#EEF1F3', d: '#BFC8D0', e: '#D9DFE4', dg: 0.45, eg: 0.25, olcek: 150, aci: 0.2, burgu: 1.6, sk: 1.6, dk: 0.032, altin: 0, bulut: 0.6 },
    krem: { a: '#F3E7D0', b: '#E4D1AE', d: '#FCF6EA', e: '#EBDDC2', dg: 0.55, eg: 0.28, olcek: 280, aci: 0.15, burgu: 1.8, sk: 1.6, dk: 0.035, altin: 0, bulut: 0.75 },
  };
  for (const k in MERMER) for (const c of ['a', 'b', 'd', 'e']) MERMER[k][c] = hex(MERMER[k][c]);
  const ALTIN_A = hex('#F2D98A'), ALTIN_B = hex('#D2A64A'), ALTIN_C = hex('#A97E2E');

  /**
   * Mermer rengi (x, y 1024 biriminde). ox/oy: bloğun kesim yeri (her parça başka yerden kesilmiş gibi).
   * Ana damarlar: düşük frekanslı, yumuşak bir burgu alanıyla kıvrılan doğrusal alanın akış çizgileri
   * (sin(x + türbülans) tarifi). Damar kesiti Gauss eğrisi: yumuşak çekirdek + geniş hale; damarlar boyunca
   * belirip kaybolur. Başka açıda daha ince, daha soluk ikinci bir aile. Carrara'da seyrek, düzgün akan ince
   * altın damar.
   */
  function mermerRenk(m, x, y, ox, oy, out) {
    const ca = Math.cos(m.aci), sa = Math.sin(m.aci);
    const u = (x * ca + y * sa) / m.olcek + ox, v = (-x * sa + y * ca) / m.olcek + oy;
    // düşük frekanslı burgu alanı (keskin kırılma yok)
    const wx = fbm(u * 0.6 + 11.3, v * 0.6 + 2.9, 3) - 0.5;
    const wy = fbm(u * 0.6 + 4.7, v * 0.6 + 13.1, 3) - 0.5;
    // yumuşak bulutlanma: damarlarla aynı yönde akan, uzamış sis bulutları
    const bl = 0.55 * fbm((u + m.burgu * wx) * 2.6 + 3.1, v * 0.9 + 7.7, 4) + 0.45 * fbm(u * 1.1 + 13.3, v * 1.1 + 1.7, 3);
    const t0 = ss(0.26, 0.74, bl) * m.bulut;
    let r = m.a[0] + (m.b[0] - m.a[0]) * t0, g = m.a[1] + (m.b[1] - m.a[1]) * t0, b = m.a[2] + (m.b[2] - m.a[2]) * t0;
    const ince = 0.05 * (fbm(u * 1.8 + 5, v * 1.8 + 9, 2) - 0.5);
    // ana damarlar
    const tt = (u + m.burgu * wx + ince) * m.sk;
    const uz = Math.abs(tt - Math.round(tt));
    const gen = m.dk * (0.55 + 0.9 * fbm(u * 1.5 + 21, v * 1.5 + 5, 2));
    const kapi = ss(0.3, 0.62, fbm(u * 0.8 + v * 0.3 + 41, v * 1.0 + 19, 3));
    const q1 = uz / gen, q1h = uz / (gen * 5);
    const d1 = (0.58 * Math.exp(-q1 * q1) + 0.42 * Math.exp(-q1h * q1h)) * kapi * m.dg;
    r += (m.d[0] - r) * d1; g += (m.d[1] - g) * d1; b += (m.d[2] - b) * d1;
    // ikincil, daha ince ve soluk damarlar
    const tt2 = (v * 0.8 + u * 0.5 + m.burgu * wy + ince) * m.sk * 0.7 + 0.31;
    const uz2 = Math.abs(tt2 - Math.round(tt2));
    const kapi2 = ss(0.45, 0.68, fbm(u * 1.0 + 81, v * 1.0 + 27, 3));
    const q2 = uz2 / (gen * 0.55), q2h = uz2 / (gen * 2.5);
    const d2 = (0.6 * Math.exp(-q2 * q2) + 0.4 * Math.exp(-q2h * q2h)) * kapi2 * m.eg;
    r += (m.e[0] - r) * d2; g += (m.e[1] - g) * d2; b += (m.e[2] - b) * d2;
    // altın damar: bazı ana damarların ortasından geçen ince altın tel (yalnız beyaz mermerde)
    if (m.altin > 0) {
      const k3 = ss(0.46, 0.6, fbm(u * 0.7 + 71, v * 0.7 + 13, 3)) * kapi;
      const ga = (1 - ss(m.altin * 0.35, m.altin, uz)) * k3 * 0.9;
      if (ga > 0.002) {
        const pr = gurultu(x * 0.05 + 3, y * 0.05 + 7);
        const s2 = pr < 0.5 ? pr * 2 : (pr - 0.5) * 2;
        const c1 = pr < 0.5 ? ALTIN_C : ALTIN_B, c2 = pr < 0.5 ? ALTIN_B : ALTIN_A;
        const gr = c1[0] + (c2[0] - c1[0]) * s2, gg = c1[1] + (c2[1] - c1[1]) * s2, gb = c1[2] + (c2[2] - c1[2]) * s2;
        r += (gr - r) * ga; g += (gg - g) * ga; b += (gb - b) * ga;
      }
    }
    out[0] = r; out[1] = g; out[2] = b;
  }

  // ------------------------------------------------------------ yol sınırı ve mermer dolgu
  function yolKutu(d) {
    const tk = d.match(/[MLCAZ]|-?\d*\.?\d+(?:e-?\d+)?/g);
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9, kom = 'M';
    const ek = (x, y, r) => { x1 = Math.min(x1, x - r); x2 = Math.max(x2, x + r); y1 = Math.min(y1, y - r); y2 = Math.max(y2, y + r); };
    for (let i = 0; i < tk.length; ) {
      const t = tk[i];
      if (/[MLCAZ]/.test(t)) { kom = t; i++; continue; }
      if (kom === 'A') { const rx = +tk[i]; ek(+tk[i + 5], +tk[i + 6], rx); i += 7; }
      else { ek(+tk[i], +tk[i + 1], 0); i += 2; }
    }
    return [x1, y1, x2, y2];
  }
  const tmp = [0, 0, 0];
  /** Bir vektör biçimini mermerle doldurur: biçim maskesi (kenar yumuşatmalı) × piksel başına mermer. */
  function mermerDoldur(d, m, ox, oy, kutu, olcek) {
    olcek = olcek || OL;
    const [bx1, by1, bx2, by2] = kutu || yolKutu(d);
    const x0 = Math.floor(bx1) - 2, y0 = Math.floor(by1) - 2;
    const w = Math.ceil(bx2 - x0) + 3, h = Math.ceil(by2 - y0) + 3;
    const cw = Math.max(1, Math.round(w * olcek)), ch = Math.max(1, Math.round(h * olcek));
    const c = SAHNE.yeniTuval(cw, ch);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(olcek, 0, 0, olcek, -x0 * olcek, -y0 * olcek);
    g.fillStyle = '#000';
    g.fill(typeof d === 'string' ? P(d) : d);
    const im = g.getImageData(0, 0, cw, ch);
    const v = im.data;
    for (let j = 0; j < ch; j++) {
      const y = y0 + (j + 0.5) / olcek;
      for (let i = 0; i < cw; i++) {
        const k = (j * cw + i) * 4;
        if (v[k + 3] === 0) continue;
        mermerRenk(m, x0 + (i + 0.5) / olcek, y, ox, oy, tmp);
        v[k] = tmp[0]; v[k + 1] = tmp[1]; v[k + 2] = tmp[2];
      }
    }
    g.putImageData(im, 0, 0);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(c, x0 * OL, y0 * OL, w * OL, h * OL);
    ctx.restore();
  }

  // ------------------------------------------------------------ altın: döşenebilir metal doku (kontur ve dolgu için)
  const ALTIN = (function () {
    const c = SAHNE.yeniTuval(W2, W2);
    const g = c.getContext('2d');
    const lg = g.createLinearGradient(0, 0, W2, W2 * 0.8);
    const duraklar = ['#B8892E', '#F3D98A', '#C99A36', '#FBEBB0', '#B48428', '#E9C870', '#A87A24', '#F5DE96', '#C09030'];
    duraklar.forEach((d, i) => lg.addColorStop(i / (duraklar.length - 1), d));
    g.fillStyle = lg;
    g.fillRect(0, 0, W2, W2);
    // ince varak kırışığı: hafif açık-koyu benekler
    const im = g.getImageData(0, 0, W2, W2);
    const v = im.data;
    for (let j = 0; j < W2; j++) for (let i = 0; i < W2; i++) {
      const n = gurultu(i * 0.045, j * 0.045) * 0.6 + gurultu(i * 0.16, j * 0.16) * 0.4 - 0.5;
      const k = (j * W2 + i) * 4;
      v[k] += n * 46; v[k + 1] += n * 40; v[k + 2] += n * 22;
    }
    g.putImageData(im, 0, 0);
    return c;
  })();
  const altinDesen = ctx.createPattern(ALTIN, 'no-repeat');
  altinDesen.setTransform(new DOMMatrix([1 / OL, 0, 0, 1 / OL, 0, 0]));

  /** İnce altın kontur: koyu altın alt çizgi + parlak üst çizgi (kakma tel gibi). */
  function altinKontur(d, lw) {
    lw = lw || 2.1;
    const p = typeof d === 'string' ? P(d) : d;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(120,84,24,0.85)'; ctx.lineWidth = lw + 0.9; ctx.stroke(p);
    ctx.strokeStyle = altinDesen; ctx.lineWidth = lw; ctx.stroke(p);
    ctx.restore();
  }
  function altinCizgi(pts, lw) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    altinKontur(p, lw);
  }
  function altinDolgu(d) {
    const p = typeof d === 'string' ? P(d) : d;
    ctx.fillStyle = altinDesen; ctx.fill(p);
  }
  /** Düz, yarı saydam vektör gölge (ışık sağ üstten). */
  function golge(d, a) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgba(60,70,80,${a})`;
    ctx.fill(typeof d === 'string' ? P(d) : d);
    ctx.restore();
  }

  // ------------------------------------------------------------ gök (açık mavi mermer), güneş, bulutlar
  mermerDoldur(dikd(0, 0, 1024, 800), MERMER.gok, 0, 0, [0, 0, 1024, 800], 1);
  // güneş: altın varak disk, iki ince altın halka
  altinDolgu(SAHNE.daireYolu(880, 140, 54));
  altinKontur(SAHNE.daireYolu(880, 140, 54), 2.2);
  altinKontur(SAHNE.daireYolu(880, 140, 76), 1.4);
  altinKontur(SAHNE.daireYolu(880, 140, 100), 1.0);

  function bulutYolu(cx, cy, s, ayna) {
    const m = ayna ? -1 : 1;
    const d = [[cx - 66 * s * m, cy + 2 * s, 18 * s], [cx - 38 * s * m, cy - 12 * s, 26 * s], [cx - 2 * s * m, cy - 22 * s, 32 * s], [cx + 34 * s * m, cy - 10 * s, 25 * s], [cx + 62 * s * m, cy + 2 * s, 18 * s]];
    const p = new Path2D();
    for (const [x, y, r] of d) { p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); }
    const r = 10 * s, x1 = cx - 84 * s, x2 = cx + 84 * s, y0 = cy + 2 * s;
    p.moveTo(x1 + r, y0); p.lineTo(x2 - r, y0); p.arc(x2 - r, y0 + r, r, -Math.PI / 2, Math.PI / 2);
    p.lineTo(x1 + r, y0 + 2 * r); p.arc(x1 + r, y0 + r, r, Math.PI / 2, Math.PI * 1.5);
    return p;
  }
  const BULUT = [[170, 246, 1.0, false], [500, 148, 0.78, true], [770, 344, 1.0, true], [952, 474, 0.6, false], [86, 466, 0.62, true]];
  BULUT.forEach(([x, y, s, a], i) => {
    const p = bulutYolu(x, y, s, a);
    // birleşim biçimi: çift kalın altın kontur önce, mermer üstüne → yalnız dış kontur kalır
    ctx.save();
    ctx.strokeStyle = 'rgba(120,84,24,0.85)'; ctx.lineWidth = 2 * (1.8 + 0.9); ctx.stroke(p);
    ctx.strokeStyle = altinDesen; ctx.lineWidth = 2 * 1.8; ctx.stroke(p);
    ctx.restore();
    mermerDoldur(p, MERMER.bulut, i * 3.7, i * 1.9, [x - 90 * s, y - 56 * s, x + 90 * s, y + 24 * s]);
  });

  // ------------------------------------------------------------ zemin (krem mermer)
  mermerDoldur(dikd(0, 800, 1024, 1024), MERMER.krem, 4, 2);
  golge('M300,800 L820,800 L760,834 L236,834 Z', 0.07);
  altinCizgi([[0, 800], [1024, 800]], 2.2);

  // ------------------------------------------------------------ minare (Carrara)
  const M = SAHNE.minareParcalari();
  const mc = 300;
  const minareGovde = [];
  for (const p of M) {
    if (p.tip === 'poligon') minareGovde.push(SAHNE.yol(p.noktalar, true));
    else if (p.tip === 'korkuluk') minareGovde.push(dikd(p.x1, p.y1, p.x2, p.y2));
    else if (p.tip === 'topuz') minareGovde.push(p.yol);
  }
  // bütün minare tek bir bloktan kesilmiş gibi tek dokuda
  const minareYol = new Path2D();
  minareGovde.forEach((d) => minareYol.addPath(P(d)));
  mermerDoldur(minareYol, MERMER.carrara, 2.2, 5.1, [254, 140, 346, 800]);
  // silindir gölgesi (düz, yarı saydam)
  ctx.save(); ctx.clip(minareYol);
  golge(dikd(240, 140, mc - 8, 800), 0.09);
  ctx.restore();
  for (const p of M) {
    if (p.tip === 'poligon') {
      altinKontur(SAHNE.yol(p.noktalar, true), 1.8);
      if (p.ad.startsWith('çıkma')) golge(SAHNE.yol(p.noktalar, true), 0.08);
    } else if (p.tip === 'korkuluk') {
      const adet = 10;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / adet;
        altinCizgi([[x, p.y1 + 5], [x, p.y2 - 3]], 1.4);
      }
      altinCizgi([[p.x1, p.y1 + 4], [p.x2, p.y1 + 4]], 1.2);
      altinKontur(dikd(p.x1, p.y1, p.x2, p.y2), 1.8);
    } else if (p.tip === 'bant') {
      for (const z of SAHNE.zikzakCizgileri()) altinCizgi(z, 1.8);
    } else if (p.tip === 'topuz') {
      altinKontur(p.yol, 1.8);
    }
  }
  S_pencereler(Y.minarePencereleri, 1.6);
  function S_pencereler(liste, lw) {
    liste.forEach((d, i) => {
      mermerDoldur(d, MERMER.pencere, i * 2.3 + 1, i * 1.7);
      altinKontur(d, lw);
    });
  }

  // ------------------------------------------------------------ alem (altın)
  function alem(a, lw) {
    const ys = [
      dikd(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2),
      ...a.kureler.map((k) => SAHNE.daireYolu(k.cx, k.cy, k.r)),
      SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
      SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R),
    ];
    for (const d of ys) {
      altinDolgu(d);
      ctx.save(); ctx.clip(P(d));
      golge(dikd(a.yaka.cx - 40, a.hilal.cy - 30, a.yaka.cx - 1, a.yaka.cy + 20), 0.16);
      ctx.restore();
      ctx.strokeStyle = 'rgba(120,84,24,0.9)'; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(P(d));
    }
  }
  alem(SAHNE.alemParcalari(mc, 146, 0.62), 0.9);

  // ------------------------------------------------------------ kaide (ikinci Carrara bloğu)
  const K = SAHNE.kaide;
  mermerDoldur(Y.kaide, MERMER.carrara2, 7.3, 1.2);
  golge(dikd(K.x1, K.y1, K.x2, K.y1 + 8), 0.08);
  golge(dikd(K.x1, K.y1, K.x1 + 14, K.y2), 0.07);
  altinKontur(Y.kaide, 2.0);
  mermerDoldur(Y.kornis, MERMER.carrara, 9.1, 3.3);
  altinKontur(Y.kornis, 1.8);
  S_pencereler(Y.kaidePencereleri, 1.8);

  // ------------------------------------------------------------ kasnak (koyu yeşil mermer)
  for (let k = 1; k >= 0; k--) {
    const q = SAHNE.kasnak[k];
    const d = dikd(q.x1, q.y1, q.x2, q.y2);
    mermerDoldur(d, MERMER.yesilKoyu, 3 + k * 5.5, 8 + k * 2.2);
    const cx = (q.x1 + q.x2) / 2, R = (q.x2 - q.x1) / 2;
    golge(dikd(q.x1, q.y1, cx - R * 0.3, q.y2), 0.13);
    altinCizgi([[q.x1, q.y1 + 6], [q.x2, q.y1 + 6]], 1.1);
    altinCizgi([[q.x1, q.y2 - 6], [q.x2, q.y2 - 6]], 1.1);
    SAHNE.kasnakPencereleri(k).forEach((w, i) => {
      const pd = SAHNE.kemerYolu(w.x, w.y, w.w, w.h);
      mermerDoldur(pd, MERMER.pencere, i * 1.3 + k * 9, i * 0.7);
      altinKontur(pd, 1.3);
    });
    altinKontur(d, 2.0);
  }

  // ------------------------------------------------------------ kubbe (yeşil mermer, altın kaburgalar)
  const prof = SAHNE.kubbeProfili(60);
  mermerDoldur(Y.kubbe, MERMER.yesil, 1.7, 3.9, [356, 296, 764, 559]);
  const gol = prof.map((q) => [560 - q.r, q.y]).concat(prof.slice().reverse().map((q) => [560 - q.r * 0.3, q.y]));
  golge(SAHNE.yol(gol, true), 0.12);
  ctx.save(); ctx.clip(P(Y.kubbe));
  for (const kb of SAHNE.kaburgalar(16, 60)) altinCizgi(kb.noktalar, 1.25);
  ctx.restore();
  altinKontur(Y.kubbe, 2.3);
  mermerDoldur(dikd(356, 549, 764, 557), MERMER.yesilKoyu, 12, 4);
  altinKontur(dikd(356, 549, 764, 557), 1.4);
  alem(SAHNE.alemParcalari(560, 300, 1), 1.2);

  // ------------------------------------------------------------ bitkiler: altın saplar, yeşil mermer yapraklar, pembe mermer çiçekler
  // öndeki tomurcukların altın sapları (yaprakların arkasında kalır; tomurcuk havada asılı durmaz)
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8, y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    const p = new Path2D();
    p.moveTo(x0, y0); p.quadraticCurveTo(t.x, t.y + 80, bx, t.y + 170);
    altinKontur(p, 2.4);
  }
  for (const s of B.saplar) altinCizgi(s, 3.0);
  const yaps = B.yapraklar.slice().sort((a, b) => a.y - b.y);
  yaps.forEach((y, i) => {
    const d = SAHNE.yaprakYolu(y);
    mermerDoldur(d, y.uzunluk > 50 ? MERMER.yaprakK : MERMER.yaprak, i * 0.73, i * 1.31);
    altinKontur(d, 1.6);
    const [a, b] = SAHNE.yaprakDamari(y);
    altinCizgi([a, [a[0] + (b[0] - a[0]) * 0.85, a[1] + (b[1] - a[1]) * 0.85]], 1.0);
  });
  B.tomurcuklar.forEach((t, i) => {
    const d = SAHNE.tomurcukYolu(t);
    mermerDoldur(d, MERMER.pembe, i * 2.1, i * 0.9);
    altinKontur(d, 1.4);
  });
  const cs = B.cicekler.slice().sort((a, b) => a.r - b.r);
  cs.forEach((c, ci) => {
    SAHNE.tacYapraklari(c).forEach((e, i) => {
      const d = SAHNE.elipsYolu(e);
      mermerDoldur(d, MERMER.pembe, ci * 1.7 + i * 0.61, ci * 0.9 + i * 1.13);
      // ışığa ters kenarda düz, yarı saydam gölge hilali
      const k = Math.max(2.2, c.r * 0.17);
      const ic = new Path2D(SAHNE.elipsYolu({ ...e, cx: e.cx + 0.6 * k, cy: e.cy - 0.8 * k }));
      const dis = new Path2D();
      dis.rect(c.x - c.r * 3, c.y - c.r * 3, c.r * 6, c.r * 6);
      dis.addPath(ic);
      ctx.save();
      ctx.clip(P(d));
      ctx.clip(dis, 'evenodd');
      golge(d, 0.10);
      ctx.restore();
      altinKontur(d, Math.max(1.2, Math.min(2.0, c.r / 26)));
    });
    // altın göbek ve altın erkek organ noktaları
    altinDolgu(SAHNE.daireYolu(c.x, c.y, c.r * 0.17));
    ctx.strokeStyle = 'rgba(120,84,24,0.9)'; ctx.lineWidth = 0.9; ctx.stroke(P(SAHNE.daireYolu(c.x, c.y, c.r * 0.17)));
    for (let i = 0; i < 10; i++) {
      const a = c.aci + (i / 10) * Math.PI * 2;
      const r2 = c.r * 0.29;
      altinCizgi([[c.x + Math.cos(a) * c.r * 0.18, c.y + Math.sin(a) * c.r * 0.18], [c.x + Math.cos(a) * r2, c.y + Math.sin(a) * r2]], 0.8);
      const d = SAHNE.daireYolu(c.x + Math.cos(a) * r2, c.y + Math.sin(a) * r2, Math.max(1.3, c.r * 0.035));
      altinDolgu(d);
    }
  });

  SAHNE.hazir();
</script>
