<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-144 Yarı Gerçekçi Dijital Resim — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas, svg { display: block; }
  #tuval { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // ---------------------------------------------------------------- ortak yardımcılar (bu örneğin içinde)
  const G = {};
  G.PI = Math.PI;
  G.kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.ara = (a, b, t) => a + (b - a) * t;
  G.yumusak = (a, b, x) => {
    let t = (x - a) / (b - a);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return t * t * (3 - 2 * t);
  };
  G.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  G.karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  G.css = (c, a) =>
    a == null
      ? `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`
      : `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  G.norm = (v) => {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  };
  G.nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  /** Ekran dışı tuval ve bağlamı. */
  G.tuval = (w, h) => {
    const c = SAHNE.yeniTuval(w, h);
    return [c, c.getContext('2d', { willReadFrequently: true })];
  };
  /** 2048 iç çözünürlüklü, 1024 koordinatlı ekran dışı katman. */
  G.katman = () => {
    const c = SAHNE.yeniTuval(2048, 2048);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    return [c, x];
  };
  G.yol = (d) => new Path2D(d);
  G.dikd = (x1, y1, x2, y2) => SAHNE.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Tohumlu Perlin gürültüsü: n(x,y) ≈ [-0.7, 0.7], fbm(x,y,oktav) ≈ [-0.5, 0.5]. */
  G.perlin = function (tohum) {
    const r = SAHNE.rng(tohum);
    const p = new Uint8Array(512);
    const perm = [];
    for (let i = 0; i < 256; i++) perm.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = perm[i];
      perm[i] = perm[j];
      perm[j] = t;
    }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const gx = new Float32Array(256);
    const gy = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const a = r() * Math.PI * 2;
      gx[i] = Math.cos(a);
      gy[i] = Math.sin(a);
    }
    function n(x, y) {
      const X = Math.floor(x);
      const Y = Math.floor(y);
      const xf = x - X;
      const yf = y - Y;
      const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
      const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
      const X0 = X & 255;
      const X1 = (X + 1) & 255;
      const Y0 = Y & 255;
      const Y1 = (Y + 1) & 255;
      const aa = p[p[X0] + Y0];
      const ba = p[p[X1] + Y0];
      const ab = p[p[X0] + Y1];
      const bb = p[p[X1] + Y1];
      const d1 = gx[aa] * xf + gy[aa] * yf;
      const d2 = gx[ba] * (xf - 1) + gy[ba] * yf;
      const d3 = gx[ab] * xf + gy[ab] * (yf - 1);
      const d4 = gx[bb] * (xf - 1) + gy[bb] * (yf - 1);
      const x1 = d1 + (d2 - d1) * u;
      const x2 = d3 + (d4 - d3) * u;
      return x1 + (x2 - x1) * v;
    }
    function fbm(x, y, o) {
      let s = 0;
      let a = 0.5;
      let f = 1;
      let t = 0;
      for (let i = 0; i < o; i++) {
        s += a * n(x * f + i * 17.3, y * f - i * 9.1);
        t += a;
        a *= 0.5;
        f *= 2.03;
      }
      return s / t;
    }
    return { n, fbm };
  };

  // ---------------------------------------------------------------- kubbe geometrisi (yükseklik → yarıçap, eğim)
  G.kubbe = (function () {
    const p = SAHNE.kubbeProfili(900);
    const ADIM = 8;
    const N = (555 - 300) * ADIM + 1;
    const R = new Float32Array(N);
    const D = new Float32Array(N);
    let j = p.length - 1;
    for (let i = 0; i < N; i++) {
      const y = 300 + i / ADIM;
      while (j > 1 && p[j - 1].y < y) j--;
      const a = p[j];
      const b = p[j - 1];
      const dy = b.y - a.y;
      const t = dy > 1e-6 ? G.kenet((y - a.y) / dy, 0, 1) : 0;
      R[i] = a.r + (b.r - a.r) * t;
      D[i] = dy > 1e-6 ? (b.r - a.r) / dy : 0;
    }
    const idx = (y) => G.kenet(Math.round((y - 300) * ADIM), 0, N - 1);
    return { r: (y) => R[idx(y)], s: (y) => D[idx(y)] };
  })();

  /**
   * Kubbeyi piksel piksel gölgeler. o.renk(g) → [r,g,b] (0–255), g: {X, Y, n:[x,y,z], u, phi, f, kaburga, oluk, h}
   * Kaburga: dilim sınırında yükselen yuvarlak sırt; oluk: sırtın dibindeki gölge payı; h: 0 taban → 1 tepe.
   */
  G.kubbeGolgele = function (ctx, o) {
    const s = o.olcek || 2;
    const x0 = 356;
    const x1 = 764;
    const y0 = 296;
    const y1 = 558;
    const W = Math.round((x1 - x0) * s);
    const H = Math.round((y1 - y0) * s);
    const [c, cx] = G.tuval(W, H);
    const im = cx.createImageData(W, H);
    const d = im.data;
    const DL = Math.PI / 16;
    const kg = o.kaburgaGen || 1.6;
    const og = o.olukGen || 3;
    const sis = o.siskinlik == null ? 0.5 : o.siskinlik;
    const g = { n: [0, 0, 1] };
    for (let j = 0; j < H; j++) {
      const Y = y0 + (j + 0.5) / s;
      if (Y < 299) continue;
      const Yc = Math.min(Y, 555);
      const r = G.kubbe.r(Yc);
      const sl = G.kubbe.s(Yc);
      const nr = 1 / Math.sqrt(1 + sl * sl);
      const ny = -sl * nr;
      for (let i = 0; i < W; i++) {
        const X = x0 + (i + 0.5) / s;
        const dx = X - 560;
        const kenar = r - Math.abs(dx);
        if (kenar < -1 / s) continue;
        let a = G.kenet(kenar * s + 0.5, 0, 1);
        if (Y < 300.5) a *= G.kenet((Y - 299.5) * s, 0, 1);
        const u = G.kenet(dx / Math.max(r, 0.001), -1, 1);
        const phi = Math.asin(u);
        const k = (phi + Math.PI / 2) / DL;
        const kk = Math.floor(k);
        const f = k - kk - 0.5;
        const dAng = (0.5 - Math.abs(f)) * DL;
        const px = dAng * r * Math.max(Math.cos(phi), 0.04);
        const bi = f > 0 ? kk + 1 : kk;
        let phin;
        let kab = 0;
        let oluk = 0;
        // tepeye yaklaşınca dilimler daralır: sırt genişliği de daralır
        const kgY = kg * G.kenet(r / 60, 0.35, 1);
        if (bi > 0 && bi < 16 && px < kgY) {
          const t = (f > 0 ? -px : px) / kgY;
          phin = -Math.PI / 2 + bi * DL + Math.asin(G.kenet(t, -1, 1)) * 1.15;
          kab = 1 - Math.abs(t);
        } else {
          phin = phi + sis * f * 2 * DL * 2.2;
          if (bi > 0 && bi < 16) oluk = Math.exp(-((px - kgY) * (px - kgY)) / (og * og));
        }
        g.X = X;
        g.Y = Y;
        g.n[0] = nr * Math.sin(phin);
        g.n[1] = ny;
        g.n[2] = nr * Math.cos(phin);
        g.u = u;
        g.phi = phi;
        g.f = f;
        g.kaburga = kab;
        g.oluk = oluk;
        g.h = (555 - Yc) / 255;
        g.r = r;
        const col = o.renk(g);
        const q = (j * W + i) * 4;
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * a;
      }
    }
    cx.putImageData(im, 0, 0);
    ctx.drawImage(c, x0, y0, x1 - x0, y1 - y0);
    return c;
  };

  /** Dikey eksenli silindir için yatay degrade: renk(n) → [r,g,b]; n = (sinφ, 0, cosφ) */
  G.silindirDegrade = function (ctx, x1, x2, renk, ek) {
    const gr = ctx.createLinearGradient(x1, 0, x2, 0);
    const N = 28;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const u = G.kenet(t * 2 - 1, -0.999, 0.999) * (ek == null ? 1 : ek);
      const phi = Math.asin(u);
      gr.addColorStop(t, G.css(renk([Math.sin(phi), 0, Math.cos(phi)], u)));
    }
    return gr;
  };

  /** Basit aydınlatma: taban rengi × (ortam + yayınık) + parlama. */
  G.aydinlat = function (taban, n, L, o) {
    const nl = G.nokta(n, L);
    const sar = o.sarma == null ? 0.25 : o.sarma;
    const dif = Math.max(0, (nl + sar) / (1 + sar));
    const gok = o.gok || [1, 1, 1];
    const isik = o.isik || [1, 1, 1];
    const ort = o.ortam == null ? 0.45 : o.ortam;
    const yuk = 0.5 - 0.5 * n[1];
    const k = o.yayinik == null ? 0.75 : o.yayinik;
    const out = [0, 0, 0];
    for (let i = 0; i < 3; i++) out[i] = taban[i] * (ort * (0.65 + 0.35 * yuk) * gok[i] + k * dif * isik[i]);
    if (o.parlama) {
      const H = G.norm([L[0], L[1], L[2] + 1]);
      const sp = Math.pow(Math.max(0, G.nokta(n, H)), o.us || 30) * o.parlama;
      for (let i = 0; i < 3; i++) out[i] += 255 * sp * isik[i];
    }
    return out;
  };

  /** Sahnenin mimari silueti (minare + kaide + kasnak + kubbe), maske için. */
  G.mimariSiluet = function (ctx, renk, minareDahil) {
    ctx.fillStyle = renk || '#000';
    const Y = SAHNE.yollar();
    if (minareDahil !== false) {
      for (const d of Y.minare) ctx.fill(G.yol(d));
      for (const d of Y.minareAlem) ctx.fill(G.yol(d));
    }
    ctx.fill(G.yol(Y.kaide));
    ctx.fill(G.yol(Y.kornis));
    ctx.fill(G.yol(Y.kasnakUst));
    ctx.fill(G.yol(Y.kasnakAlt));
    ctx.fill(G.yol(Y.kubbe));
    for (const d of Y.alem) ctx.fill(G.yol(d));
  };

  /**
   * Kemerli girinti (pencere): iç koyu, sol iç yanak ışıklı (ışık sağ üstten), üstte gölge.
   * o: {koyu, ic, yanak, kenar, yanakGen}
   */
  G.girinti = function (ctx, x, y, w, h, o) {
    const p = G.yol(SAHNE.kemerYolu(x, y, w, h));
    ctx.save();
    ctx.fillStyle = G.css(o.koyu);
    ctx.fill(p);
    ctx.clip(p);
    // iç yüz: aşağıya doğru biraz açılır
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, G.css(o.koyu));
    g.addColorStop(1, G.css(o.ic));
    ctx.fillStyle = g;
    ctx.fill(p);
    // ışıklı sol yanak
    const yg = (o.yanakGen || 0.22) * w;
    ctx.fillStyle = G.css(o.yanak, o.yanakA == null ? 0.9 : o.yanakA);
    ctx.beginPath();
    ctx.rect(x - w / 2 - 1, y + Math.min(h, w * 0.62) * 0.7, yg + 1, h);
    ctx.fill();
    // üst kemerin düşürdüğü gölge
    const g2 = ctx.createLinearGradient(0, y, 0, y + Math.min(h * 0.55, w * 1.1));
    g2.addColorStop(0, G.css(o.koyu, 0.9));
    g2.addColorStop(1, G.css(o.koyu, 0));
    ctx.fillStyle = g2;
    ctx.fill(p);
    ctx.restore();
    if (o.kenar) {
      ctx.save();
      ctx.strokeStyle = G.css(o.kenar, o.kenarA == null ? 0.7 : o.kenarA);
      ctx.lineWidth = o.kenarGen || 1;
      ctx.stroke(p);
      ctx.restore();
    }
  };

  /** Altın alem: küreler, çubuk, yaka, hilal; renk(n) ile metal gölgesi. */
  G.alem = function (ctx, a, renk, parilti) {
    const kure = (cx, cy, r) => {
      const g = ctx.createRadialGradient(cx + r * 0.35, cy - r * 0.4, r * 0.05, cx, cy, r * 1.02);
      const N = 10;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        g.addColorStop(t, G.css(renk(t)));
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    };
    const yatay = (x1, x2) => {
      const g = ctx.createLinearGradient(x1, 0, x2, 0);
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const u = t * 2 - 1;
        // sağa yakın parlak: yüzey normali ile ışık
        const v = G.kenet(0.5 - 0.5 * (Math.sin(Math.asin(G.kenet(u, -0.99, 0.99))) * 0.8 + 0.25), 0, 1);
        g.addColorStop(t, G.css(renk(v)));
      }
      return g;
    };
    // çubuk
    ctx.fillStyle = yatay(a.cubuk.x1, a.cubuk.x2);
    ctx.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1);
    // yaka
    ctx.save();
    ctx.fillStyle = yatay(a.yaka.cx - a.yaka.rx, a.yaka.cx + a.yaka.rx);
    ctx.beginPath();
    ctx.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    const gy = ctx.createLinearGradient(0, a.yaka.cy - a.yaka.ry, 0, a.yaka.cy + a.yaka.ry);
    gy.addColorStop(0, 'rgba(255,250,220,0.55)');
    gy.addColorStop(0.45, 'rgba(255,250,220,0)');
    gy.addColorStop(1, 'rgba(60,40,10,0.35)');
    ctx.fillStyle = gy;
    ctx.fill();
    ctx.restore();
    for (const k of a.kureler) kure(k.cx, k.cy, k.r);
    // hilal
    const h = a.hilal;
    ctx.fillStyle = yatay(h.cx - h.R, h.cx + h.R);
    ctx.fill(G.yol(SAHNE.hilalYolu(h.cx, h.cy, h.R)));
    if (parilti) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const k of a.kureler) {
        const g = ctx.createRadialGradient(k.cx + k.r * 0.35, k.cy - k.r * 0.4, 0, k.cx + k.r * 0.35, k.cy - k.r * 0.4, k.r * 0.5);
        g.addColorStop(0, `rgba(255,250,225,${0.75 * parilti})`);
        g.addColorStop(1, 'rgba(255,250,225,0)');
        ctx.fillStyle = g;
        ctx.fillRect(k.cx - k.r, k.cy - k.r, k.r * 2, k.r * 2);
      }
      ctx.restore();
    }
  };

  /** Bir tuvalin piksellerine işlem uygular (2048 iç çözünürlükte). */
  G.pikselIsle = function (tuval, fn) {
    const c = tuval.getContext('2d', { willReadFrequently: true });
    const im = c.getImageData(0, 0, tuval.width, tuval.height);
    fn(im.data, tuval.width, tuval.height);
    c.putImageData(im, 0, 0);
  };

  /**
   * Mimariyi (minare, kaide, kasnak) boyar; kubbe ayrıca G.kubbeGolgele ile.
   * P: {golge(taban, n) → rgb, tas, tasKoyu, yesil, pencereYesil{koyu,ic,yanak}, pencereTas{...}, altin(t) → rgb,
   *     zikzak, golgeRenk (cast shadow rgb), kenarCizgi (opsiyonel ince kontur rgb)}
   */
  G.mimariBoya = function (ctx, P) {
    const golge = P.golge;
    const tas = P.tas;
    const sil = (x1, x2, alb, ek) => G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, n), ek);
    const asagiBakan = (x1, x2, alb, egim) =>
      G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, G.norm([n[0] * Math.cos(egim), Math.sin(egim), n[2] * Math.cos(egim)])));
    const yukariBakan = (x1, x2, alb, egim) =>
      G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, G.norm([n[0] * Math.cos(egim), -Math.sin(egim), n[2] * Math.cos(egim)])));
    const parcalar = SAHNE.minareParcalari();
    const bul = (ad) => parcalar.find((p) => p.ad === ad);
    const kutu = (p) => {
      const xs = p.noktalar.map((q) => q[0]);
      const ys = p.noktalar.map((q) => q[1]);
      return { x1: Math.min(...xs), x2: Math.max(...xs), y1: Math.min(...ys), y2: Math.max(...ys) };
    };
    const golgeRenk = P.golgeRenk || [60, 70, 90];

    // ---- minare
    ctx.save();
    // gövdeler (korkuluk arkasına kadar uzatılmış)
    const govde = (ad, y1u, y2u) => {
      const b = kutu(bul(ad));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, y1u == null ? b.y1 : y1u, b.x2 - b.x1, (y2u == null ? b.y2 : y2u) - (y1u == null ? b.y1 : y1u));
      return b;
    };
    const gAlt = govde('gövde-alt');
    const gOrta = govde('gövde-orta', 316, 457);
    const gUst = govde('gövde-üst', 206, 291);
    // şerefelerin gövdeye düşürdüğü gölge (ışık sağ üstten → altında yumuşak gölge)
    const golgeBant = (x1, x2, y, boy, a) => {
      const g = ctx.createLinearGradient(0, y, 0, y + boy);
      g.addColorStop(0, G.css(golgeRenk, a));
      g.addColorStop(1, G.css(golgeRenk, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x1, y, x2 - x1, boy);
    };
    golgeBant(gAlt.x1, gAlt.x2, 488, 34, 0.32);
    golgeBant(gOrta.x1, gOrta.x2, 316, 26, 0.3);
    golgeBant(gUst.x1, gUst.x2, 206, 16, 0.28);
    // korkuluk arkası: balkon gölgesi
    golgeBant(gOrta.x1, gOrta.x2, 436, 20, 0.0);
    ctx.fillStyle = G.css(golgeRenk, 0.22);
    ctx.fillRect(gOrta.x1, 436, gOrta.x2 - gOrta.x1, 20);
    ctx.fillRect(gUst.x1, 272, gUst.x2 - gUst.x1, 18);

    // zikzak bant: oyma çizgiler (koyu oluk + altında ışık)
    if (P.zikzak !== false) {
      ctx.lineJoin = 'miter';
      for (const z of SAHNE.zikzakCizgileri()) {
        const d = G.yol(SAHNE.yol(z));
        ctx.save();
        ctx.translate(0.6, 1.1);
        ctx.strokeStyle = G.css(P.zikzakIsik || [255, 255, 255], 0.55);
        ctx.lineWidth = 2.2;
        ctx.stroke(d);
        ctx.restore();
        ctx.strokeStyle = G.css(P.zikzakRenk || P.tasKoyu, 0.85);
        ctx.lineWidth = 2.4;
        ctx.stroke(d);
      }
      // zikzak bandına silindir gölgesi (kenarlarda koyulaşma)
      ctx.fillStyle = sil(gAlt.x1, gAlt.x2, [255, 255, 255]);
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.0;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // çıkmalar (aşağı bakan, gölgede) + küçük mukarnas yivleri
    for (const ad of ['çıkma-1', 'çıkma-2']) {
      const p = bul(ad);
      const b = kutu(p);
      ctx.fillStyle = asagiBakan(b.x1, b.x2, tas, 0.85);
      ctx.fill(G.yol(SAHNE.yol(p.noktalar, true)));
      ctx.save();
      ctx.clip(G.yol(SAHNE.yol(p.noktalar, true)));
      const adet = ad === 'çıkma-1' ? 9 : 7;
      const cx = 300;
      const Rb = (b.x2 - b.x1) / 2;
      for (let i = 0; i < adet; i++) {
        const u = -1 + (2 * (i + 0.5)) / adet;
        const x = cx + u * Rb * 0.92;
        const w = ((b.x2 - b.x1) / adet) * 0.42 * Math.sqrt(1 - u * u * 0.7);
        ctx.fillStyle = G.css(golgeRenk, 0.22);
        ctx.fill(G.yol(SAHNE.kemerYolu(x, b.y1 + 2, w, (b.y2 - b.y1) * 0.8)));
      }
      ctx.restore();
    }
    // şerefe döşemeleri
    for (const ad of ['şerefe-1', 'şerefe-2']) {
      const b = kutu(bul(ad));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
      ctx.fillStyle = G.css(P.isikRenk || [255, 252, 240], 0.55);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, 1.4);
      ctx.fillStyle = G.css(golgeRenk, 0.3);
      ctx.fillRect(b.x1, b.y2 - 2, b.x2 - b.x1, 2);
    }
    // korkuluklar: tırabzan babaları arası açık (arkası gövde ya da gök)
    for (const ad of ['korkuluk-1', 'korkuluk-2']) {
      const p = bul(ad);
      const R = (p.x2 - p.x1) / 2;
      const cx = (p.x1 + p.x2) / 2;
      const ray = 3.2;
      ctx.fillStyle = sil(p.x1, p.x2, tas);
      ctx.fillRect(p.x1, p.y1, p.x2 - p.x1, ray);
      ctx.fillRect(p.x1, p.y2 - ray, p.x2 - p.x1, ray);
      ctx.fillStyle = G.css(P.isikRenk || [255, 252, 240], 0.6);
      ctx.fillRect(p.x1, p.y1, p.x2 - p.x1, 1);
      const adet = ad === 'korkuluk-1' ? 13 : 11;
      for (let i = 0; i < adet; i++) {
        const u = -1 + (2 * (i + 0.5)) / adet;
        const phi = Math.asin(u * 0.96);
        const x = cx + Math.sin(phi) * R * 0.96;
        const w = 3.6 * Math.max(0.45, Math.cos(phi));
        ctx.fillStyle = sil(x - w / 2, x + w / 2, tas, 0.9);
        ctx.fillRect(x - w / 2, p.y1 + ray, w, p.y2 - p.y1 - 2 * ray);
        // babanın sağ tarafı daha aydınlık; tümüne silindir konumuna göre ton
        const n = [Math.sin(phi), 0, Math.cos(phi)];
        const t = golge(tas, n);
        ctx.fillStyle = G.css(t, 0.45);
        ctx.fillRect(x - w / 2, p.y1 + ray, w, p.y2 - p.y1 - 2 * ray);
      }
    }
    // bilezik
    {
      const b = kutu(bul('bilezik'));
      ctx.fillStyle = sil(b.x1, b.x2, tas);
      ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
      ctx.fillStyle = G.css(golgeRenk, 0.25);
      ctx.fillRect(b.x1, b.y2 - 1.5, b.x2 - b.x1, 1.5);
    }
    // topuz (soğan): yatay silindir tonu + üstten gök ışığı
    {
      const p = bul('topuz');
      const d = G.yol(p.yol);
      ctx.fillStyle = sil(266, 334, tas);
      ctx.fill(d);
      ctx.save();
      ctx.clip(d);
      const g = ctx.createRadialGradient(312, 160, 2, 300, 178, 36);
      g.addColorStop(0, G.css(P.isikRenk || [255, 252, 240], 0.55));
      g.addColorStop(1, G.css(P.isikRenk || [255, 252, 240], 0));
      ctx.fillStyle = g;
      ctx.fillRect(260, 140, 80, 62);
      const g2 = ctx.createLinearGradient(0, 184, 0, 200);
      g2.addColorStop(0, G.css(golgeRenk, 0));
      g2.addColorStop(1, G.css(golgeRenk, 0.25));
      ctx.fillStyle = g2;
      ctx.fillRect(260, 184, 80, 16);
      ctx.restore();
    }
    // minare pencereleri
    for (const w of SAHNE.minarePencereleri) G.girinti(ctx, w.x, w.y, w.w, w.h, P.pencereTas);
    // minare alemi
    G.alem(ctx, bul('alem').alem, P.altin, P.alemParilti);
    ctx.restore();

    // ---- kaide
    const K = SAHNE.kaide;
    const duzDuvar = (x1, x2, alb) => G.silindirDegrade(ctx, x1, x2, (n) => golge(alb, n), 0.38);
    ctx.fillStyle = duzDuvar(K.x1, K.x2, tas);
    ctx.fillRect(K.x1, K.y1, K.x2 - K.x1, K.y2 - K.y1);
    // zemine yakın ortam gölgesi
    {
      const g = ctx.createLinearGradient(0, K.y2 - 22, 0, K.y2);
      g.addColorStop(0, G.css(golgeRenk, 0));
      g.addColorStop(1, G.css(golgeRenk, 0.18));
      ctx.fillStyle = g;
      ctx.fillRect(K.x1, K.y2 - 22, K.x2 - K.x1, 22);
    }
    // korniş altı gölge
    golgeBant(K.x1, K.x2, K.y1, 16, 0.3);
    // korniş: üst yüz parlak, ön yüz, alt kenar koyu
    {
      const k = K.kornis;
      ctx.fillStyle = duzDuvar(k.x1, k.x2, tas);
      ctx.fillRect(k.x1, k.y1, k.x2 - k.x1, k.y2 - k.y1);
      ctx.fillStyle = yukariBakan(k.x1, k.x2, tas, 1.0);
      ctx.fillRect(k.x1, k.y1, k.x2 - k.x1, 3);
      ctx.fillStyle = G.css(golgeRenk, 0.28);
      ctx.fillRect(k.x1, k.y2 - 2, k.x2 - k.x1, 2);
      // korniş uçları
      ctx.fillStyle = G.css(golgeRenk, 0.15);
      ctx.fillRect(k.x1, k.y1, 2, k.y2 - k.y1);
    }
    for (const w of K.pencereler) {
      // taş söve
      ctx.save();
      ctx.strokeStyle = G.css(golge(tas, G.norm([0.15, -0.2, 1])), 0.9);
      ctx.lineWidth = 5;
      ctx.stroke(G.yol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h)));
      ctx.restore();
      G.girinti(ctx, w.x, w.y, w.w, w.h, P.pencereTas);
      // denizlik
      ctx.fillStyle = yukariBakan(w.x - w.w / 2 - 5, w.x + w.w / 2 + 5, tas, 0.6);
      ctx.fillRect(w.x - w.w / 2 - 5, w.y + w.h - 1, w.w + 10, 4);
      ctx.fillStyle = G.css(golgeRenk, 0.25);
      ctx.fillRect(w.x - w.w / 2 - 4, w.y + w.h + 3, w.w + 8, 3);
    }

    // ---- kasnak (alt kat, sonra üst kat)
    for (let kat = 1; kat >= 0; kat--) {
      const q = SAHNE.kasnak[kat];
      ctx.fillStyle = sil(q.x1, q.x2, P.yesil);
      ctx.fillRect(q.x1, q.y1, q.x2 - q.x1, q.y2 - q.y1);
      // üst kenar ışık şeridi (silme), alt kenar gölge
      ctx.fillStyle = yukariBakan(q.x1, q.x2, P.yesil, 1.1);
      ctx.fillRect(q.x1, q.y1, q.x2 - q.x1, 3.5);
      ctx.fillStyle = G.css(P.yesilKoyu || [10, 50, 25], 0.35);
      ctx.fillRect(q.x1, q.y1 + 3.5, q.x2 - q.x1, 1.4);
      const g = ctx.createLinearGradient(0, q.y2 - 8, 0, q.y2);
      g.addColorStop(0, G.css(P.yesilKoyu || [10, 50, 25], 0));
      g.addColorStop(1, G.css(P.yesilKoyu || [10, 50, 25], 0.35));
      ctx.fillStyle = g;
      ctx.fillRect(q.x1, q.y2 - 8, q.x2 - q.x1, 8);
      for (const w of SAHNE.kasnakPencereleri(kat)) {
        const pw = Object.assign({}, P.pencereYesil);
        pw.yanakGen = 0.18 + 0.2 * Math.max(0, -Math.sin(w.aci));
        G.girinti(ctx, w.x, w.y, w.w, w.h, pw);
      }
    }
  };

  /**
   * Hacimli bulut katmanı: puflardan yoğunluk alanı, ışığa doğru örneklenmiş örtme → aydınlık.
   * puflar: [{x,y,r,a}] (1024 koordinat). o: {x0,y0,w,h, olcek, gur (perlin), gurAmp, gurFrek, isik, golge, alt,
   *   kenar:[a,b], emilim, adimlar, adimBoy, tabanY (opsiyonel: bulut tabanı düz kesilir), parlakKenar}
   */
  G.bulut = function (puflar, o) {
    const s = o.olcek || 1;
    const W = Math.ceil(o.w * s);
    const H = Math.ceil(o.h * s);
    const [c, cx] = G.tuval(W, H);
    cx.setTransform(s, 0, 0, s, -o.x0 * s, -o.y0 * s);
    cx.globalCompositeOperation = 'lighter';
    for (const p of puflar) {
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      const a = p.a == null ? 0.5 : p.a;
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(0.55, `rgba(255,255,255,${a * 0.75})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = g;
      cx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    const im = cx.getImageData(0, 0, W, H);
    const d = im.data;
    const D = new Float32Array(W * H);
    const gur = o.gur;
    const ga = o.gurAmp || 0;
    const gf = o.gurFrek || 0.02;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        let v = d[k * 4] / 255;
        if (ga && v > 0.01) {
          const X = o.x0 + i / s;
          const Y = o.y0 + j / s;
          v += ga * gur.fbm(X * gf, Y * gf, o.oktav || 4) * Math.min(1, v * 3);
        }
        if (o.tabanY != null) {
          const Y = o.y0 + j / s;
          const tb = typeof o.tabanY === 'function' ? o.tabanY(o.x0 + i / s) : o.tabanY;
          v *= G.yumusak(tb + (o.tabanYum || 6), tb - (o.tabanYum || 6), Y);
        }
        D[k] = v;
      }
    }
    const Lx = o.isikYon ? o.isikYon[0] : 0.7;
    const Ly = o.isikYon ? o.isikYon[1] : -0.7;
    const adim = o.adimlar || 6;
    const boy = (o.adimBoy || 6) * s;
    const em = o.emilim || 1.2;
    const k0 = o.kenar ? o.kenar[0] : 0.15;
    const k1 = o.kenar ? o.kenar[1] : 0.45;
    const IS = o.isik;
    const GO = o.golge;
    const AL = o.alt || o.golge;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const k = j * W + i;
        const v = D[k];
        const q = k * 4;
        if (v <= k0) {
          d[q + 3] = 0;
          continue;
        }
        let oc = 0;
        for (let t = 1; t <= adim; t++) {
          const xi = Math.round(i + Lx * boy * t);
          const yi = Math.round(j + Ly * boy * t);
          if (xi < 0 || yi < 0 || xi >= W || yi >= H) continue;
          oc += D[yi * W + xi];
        }
        let ay = Math.exp(-oc * em / adim * 2.2);
        if (o.bant) ay = o.bant(ay);
        // alt kısım: aşağıdan bakan, gölgeli taban
        let alt = 0;
        const yi2 = Math.min(H - 1, j + Math.round(8 * s));
        alt = G.kenet((v - D[yi2 * W + i]) * 1.6, 0, 1);
        let col = G.karis(GO, IS, ay);
        col = G.karis(col, AL, alt * (o.altGuc == null ? 0.5 : o.altGuc) * (1 - ay));
        if (o.parlakKenar) {
          const e = 1 - G.yumusak(k0, k1 + 0.15, v);
          col = G.karis(col, o.parlakKenar, e * ay * 0.8);
        }
        d[q] = col[0];
        d[q + 1] = col[1];
        d[q + 2] = col[2];
        d[q + 3] = 255 * G.yumusak(k0, k1, v) * (o.opaklik == null ? 1 : o.opaklik);
      }
    }
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.globalCompositeOperation = 'source-over';
    cx.putImageData(im, 0, 0);
    return c;
  };

  /** Bir kümelenmiş bulut için puf listesi üretir (düz tabanlı kümülüs). */
  G.kumulus = function (rr, cx, cy, gen, yuk, adet, rMin, rMax) {
    const out = [];
    for (let i = 0; i < adet; i++) {
      const t = rr();
      const x = cx + (t - 0.5) * gen;
      // ortada daha yüksek
      const h = Math.cos((t - 0.5) * Math.PI) * yuk;
      const y = cy - rr() * h;
      const r = rMin + (rMax - rMin) * rr() * (0.6 + 0.4 * Math.cos((t - 0.5) * Math.PI));
      out.push({ x, y, r, a: 0.42 + rr() * 0.2 });
    }
    return out;
  };

<script>
  // S-144 Yarı Gerçekçi Dijital Resim — krem zemin üzerinde ince kaş kemer çerçeve; kemerin içinde yumuşak mavi gök,
  // gerçekçi ama ressamca gölgelenmiş kubbe ve minare; altta ve iki yanda beyaz çiçek ve yaprak çelengi.
  // Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, 2);
  const r = SAHNE.rng(144);
  const PN = G.perlin(1441);
  const L = G.norm([0.55, -0.6, 0.6]);

  // ---------------------------------------------------------------- palet
  const KREM = G.hex('#F5EFE3');
  const KREM_KOYU = G.hex('#E9DFCB');
  const GOK_UST = G.hex('#6F9FD3');
  const GOK_ORTA = G.hex('#A9CBEA');
  const GOK_ALT = G.hex('#E8EFF0');
  const UFUK = G.hex('#F4EADB');
  const TAS = G.hex('#FCF6EA');
  const KUBBE = G.hex('#3C9A55');
  const KASNAK = G.hex('#3D9A53');
  const CERCEVE = G.hex('#B39565');
  const GOKISIK = [0.8, 0.9, 1.04];
  const GUNISIK = [1.04, 0.99, 0.9];

  // yarım-Lambert: gölgeler aydınlık ve soğuk, ışıklı yüzler sıcak
  const GOKT = [0.95, 0.975, 1.04];
  const GUNT = [1.09, 1.0, 0.84];
  const golge = (alb, n, amb, k) => {
    const nl = G.nokta(n, L);
    const hl = (nl * 0.5 + 0.5) * (nl * 0.5 + 0.5);
    const a = amb == null ? 0.62 : amb;
    const kk = k == null ? 0.44 : k;
    const yuk = 0.92 + 0.08 * -n[1];
    return [alb[0] * (a * yuk * GOKT[0] + kk * hl * GUNT[0]), alb[1] * (a * yuk * GOKT[1] + kk * hl * GUNT[1]), alb[2] * (a * yuk * GOKT[2] + kk * hl * GUNT[2])];
  };
  const altin = (t) => {
    const durak = [[0, [255, 246, 205]], [0.3, [238, 201, 104]], [0.65, [201, 152, 56]], [1, [138, 98, 34]]];
    for (let i = 1; i < durak.length; i++) {
      if (t <= durak[i][0]) return G.karis(durak[i - 1][1], durak[i][1], (t - durak[i - 1][0]) / (durak[i][0] - durak[i - 1][0]));
    }
    return durak[durak.length - 1][1];
  };

  // ---------------------------------------------------------------- kaş kemer (ogee) çerçeve
  function kemer(e) {
    const xl = 54 + e;
    const xr = 970 - e;
    const ys = 352;
    return (
      `M${xl},1100 L${xl},${ys} C${xl},${188 + e * 0.4} ${148 + e * 0.7},${62 + e * 0.8} 332,${46 + e} ` +
      `C436,${37 + e} 492,${33 + e} 512,${9 + e * 1.3} C532,${33 + e} 588,${37 + e} 692,${46 + e} ` +
      `C${876 - e * 0.7},${62 + e * 0.8} ${xr},${188 + e * 0.4} ${xr},${ys} L${xr},1100 Z`
    );
  }
  const KEMER = G.yol(kemer(0));

  // ---------------------------------------------------------------- 1. krem zemin (kemerin dışı)
  {
    const g = ctx.createRadialGradient(512, 470, 120, 512, 520, 820);
    g.addColorStop(0, G.css([250, 246, 237]));
    g.addColorStop(1, G.css(KREM_KOYU));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 1024);
  }

  // ---------------------------------------------------------------- 2. gök (kemerin içi)
  ctx.save();
  ctx.clip(KEMER);
  {
    const g = ctx.createLinearGradient(0, 20, 0, 800);
    g.addColorStop(0, G.css(GOK_UST));
    g.addColorStop(0.42, G.css(GOK_ORTA));
    g.addColorStop(0.8, G.css(GOK_ALT));
    g.addColorStop(1, G.css(UFUK));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 1024);
    // sağ üstten güneş ışıltısı
    const gl = ctx.createRadialGradient(850, 150, 0, 850, 150, 520);
    gl.addColorStop(0, 'rgba(255,250,232,0.85)');
    gl.addColorStop(0.18, 'rgba(255,247,226,0.45)');
    gl.addColorStop(0.55, 'rgba(255,244,220,0.12)');
    gl.addColorStop(1, 'rgba(255,244,220,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, 1024, 1024);
  }
  // bulutlar: hacimli, yumuşak, ışığı sağ üstten alan
  {
    const rb = SAHNE.rng(31);
    const kume = [
      { x: 150, y: 330, gen: 230, yuk: 70, adet: 26, r0: 22, r1: 48 },
      { x: 120, y: 520, gen: 170, yuk: 40, adet: 18, r0: 18, r1: 36 },
      { x: 455, y: 190, gen: 230, yuk: 50, adet: 22, r0: 18, r1: 38 },
      { x: 820, y: 392, gen: 290, yuk: 90, adet: 32, r0: 24, r1: 54 },
      { x: 905, y: 560, gen: 150, yuk: 34, adet: 14, r0: 16, r1: 32 },
      { x: 690, y: 255, gen: 120, yuk: 22, adet: 10, r0: 12, r1: 24 },
    ];
    for (const k of kume) {
      const p = G.kumulus(rb, k.x, k.y, k.gen, k.yuk, k.adet, k.r0, k.r1);
      const x0 = k.x - k.gen / 2 - k.r1 - 20;
      const y0 = k.y - k.yuk - k.r1 - 20;
      const w = k.gen + 2 * k.r1 + 40;
      const h = k.yuk + 2 * k.r1 + 40;
      const c = G.bulut(p, {
        x0, y0, w, h, olcek: 1.5, gur: PN, gurAmp: 0.2, gurFrek: 0.03, oktav: 3,
        isik: [255, 253, 246], golge: [180, 196, 222], alt: [198, 204, 226], kenar: [0.16, 0.6],
        emilim: 0.5, adimlar: 7, adimBoy: 5, tabanY: k.y + k.r1 * 0.55, tabanYum: 14, altGuc: 0.6, opaklik: 0.94,
      });
      ctx.drawImage(c, x0, y0, w, h);
    }
  }
  // ufuk pusu ve zemin
  {
    const g = ctx.createLinearGradient(0, 700, 0, 820);
    g.addColorStop(0, 'rgba(246,238,224,0)');
    g.addColorStop(1, 'rgba(246,238,224,0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 700, 1024, 120);
    const z = ctx.createLinearGradient(0, 800, 0, 1024);
    z.addColorStop(0, G.css([236, 226, 205]));
    z.addColorStop(1, G.css([222, 208, 182]));
    ctx.fillStyle = z;
    ctx.fillRect(0, 800, 1024, 224);
  }

  // ---------------------------------------------------------------- 3. mimari
  // kaidenin zemine düşen yumuşak gölgesi (sola)
  {
    ctx.save();
    ctx.filter = 'blur(10px)';
    ctx.fillStyle = 'rgba(120,110,95,0.35)';
    ctx.beginPath();
    ctx.moveTo(300, 800);
    ctx.lineTo(820, 800);
    ctx.lineTo(760, 818);
    ctx.lineTo(240, 818);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  G.mimariBoya(ctx, {
    golge,
    tas: TAS,
    tasKoyu: [176, 160, 132],
    yesil: KASNAK,
    yesilKoyu: [12, 52, 26],
    golgeRenk: [92, 98, 118],
    isikRenk: [255, 251, 238],
    zikzakRenk: [168, 150, 120],
    pencereYesil: { koyu: [14, 44, 26], ic: [28, 72, 44], yanak: [74, 140, 92], yanakA: 0.75 },
    pencereTas: { koyu: [104, 94, 82], ic: [138, 126, 108], yanak: [214, 204, 186], yanakA: 0.8, kenar: [170, 158, 136], kenarA: 0.5 },
    altin,
    alemParilti: 0.8,
  });
  // kubbe: piksel piksel yumuşak gerçekçi gölge
  G.kubbeGolgele(ctx, {
    olcek: 2,
    kaburgaGen: 1.9,
    olukGen: 2.6,
    siskinlik: 0.45,
    renk(g) {
      const n = g.n;
      let c = golge(KUBBE, n, 0.5, 0.62);
      const H = G.norm([L[0], L[1], L[2] + 1]);
      const sp = Math.pow(Math.max(0, G.nokta(n, H)), 10) * 0.2 + Math.pow(Math.max(0, G.nokta(n, H)), 34) * 0.07;
      c = [c[0] + 255 * sp * 1.0, c[1] + 255 * sp * 0.98, c[2] + 255 * sp * 0.86];
      // sırtlar biraz açık, oluklar gölgeli
      const k = 1 + 0.1 * g.kaburga - 0.16 * g.oluk;
      c = [c[0] * k, c[1] * k, c[2] * k];
      // kenarda gökten yansıyan soğuk ışık
      const fr = Math.pow(1 - Math.max(0, n[2]), 3);
      c = G.karis(c, [150, 196, 214], fr * 0.35);
      // tabanda kasnağa yakın ortam gölgesi
      const ao = 1 - 0.22 * G.yumusak(535, 556, g.Y);
      return [c[0] * ao, c[1] * ao, c[2] * ao];
    },
  });
  // kasnağın üst silmesi kubbe tabanını keser
  {
    const q = SAHNE.kasnak[0];
    ctx.fillStyle = G.silindirDegrade(ctx, q.x1, q.x2, (n) => golge(G.karis(KASNAK, [255, 255, 255], 0.12), G.norm([n[0] * 0.5, -0.85, n[2] * 0.5])));
    ctx.fillRect(q.x1, q.y1 - 1, q.x2 - q.x1, 4);
  }
  G.alem(ctx, SAHNE.alemParcalari(560, 300, 1), altin, 1);

  // hava perspektifi: arkadaki minare göğün rengine hafifçe karışır
  {

  ctx.restore(); // kemer kırpması

  // ---------------------------------------------------------------- 4. ressamca fırça dokusu (dijital boya fırçası)
  {
    // bölge maskesi: 1 dış, 2 gök, 3 minare, 4 kaide, 5 kasnak, 6 kubbe
    const [mc, mx] = G.tuval(1024, 1024);
    mx.fillStyle = 'rgb(1,0,0)';
    mx.fillRect(0, 0, 1024, 1024);
    mx.save();
    mx.clip(KEMER);
    mx.fillStyle = 'rgb(2,0,0)';
    mx.fillRect(0, 0, 1024, 1024);
    const Y = SAHNE.yollar();
    mx.fillStyle = 'rgb(3,0,0)';
    for (const d of Y.minare) mx.fill(G.yol(d));
    mx.fillStyle = 'rgb(4,0,0)';
    mx.fill(G.yol(Y.kaide));
    mx.fill(G.yol(Y.kornis));
    mx.fillStyle = 'rgb(5,0,0)';
    mx.fill(G.yol(Y.kasnakUst));
    mx.fill(G.yol(Y.kasnakAlt));
    mx.fillStyle = 'rgb(6,0,0)';
    mx.fill(G.yol(Y.kubbe));
    mx.fillStyle = 'rgb(7,0,0)';
    mx.strokeStyle = 'rgb(7,0,0)';
    mx.lineWidth = 4;
    for (const d of Y.alem.concat(Y.minareAlem)) {
      mx.fill(G.yol(d));
      mx.stroke(G.yol(d));
    }
    // pencereler fırçalanmaz (keskin kalır)
    mx.fillStyle = 'rgb(8,0,0)';
    mx.strokeStyle = 'rgb(8,0,0)';
    mx.lineWidth = 3;
    for (const d of Y.kasnakPencereleri.concat(Y.kaidePencereleri, Y.minarePencereleri)) {
      mx.fill(G.yol(d));
      mx.stroke(G.yol(d));
    }
    mx.restore();
    const mv = mx.getImageData(0, 0, 1024, 1024).data;
    const bolge = (x, y) => mv[((y | 0) * 1024 + (x | 0)) * 4];
    const anaVeri = ctx.getImageData(0, 0, 2048, 2048).data;
    const ornek = (x, y) => {
      const i = ((G.kenet(Math.round(y * 2), 0, 2047) * 2048) + G.kenet(Math.round(x * 2), 0, 2047)) * 4;
      return [anaVeri[i], anaVeri[i + 1], anaVeri[i + 2]];
    };
    const ayar = {
      1: { adet: 9000, boy: [10, 22], en: [3, 6], a: 0.22 },
      2: { adet: 38000, boy: [12, 26], en: [3.5, 7], a: 0.22 },
      3: { adet: 3500, boy: [4, 7], en: [1.2, 2], a: 0.26 },
      4: { adet: 6000, boy: [6, 12], en: [1.6, 3], a: 0.28 },
      5: { adet: 7000, boy: [5, 9], en: [1.4, 2.4], a: 0.26 },
      6: { adet: 22000, boy: [7, 15], en: [1.6, 3.2], a: 0.3 },
    };
    const yon = (b, x, y) => {
      if (b === 6) {
        const yy = G.kenet(y, 301, 555);
        const rr = G.kubbe.r(yy);
        const u = (x - 560) / Math.max(rr, 1);
        return Math.atan2(1, u * G.kubbe.s(yy));
      }
      if (b === 3) return Math.PI / 2 + (PN.n(x / 30, y / 30) * 0.1);
      if (b === 4 || b === 5) return PN.n(x / 60, y / 60) * 0.08;
      return -0.06 + PN.n(x / 160, y / 160) * 0.55;
    };
    const rf = SAHNE.rng(1444);
    for (let b = 1; b <= 6; b++) {
      const A = ayar[b];
      const [lc, lx] = G.katman();
      lx.lineCap = 'round';
      let n = 0;
      let deneme = 0;
      while (n < A.adet && deneme < A.adet * 40) {
        deneme++;
        const x = rf() * 1024;
        const y = rf() * 1024;
        if (bolge(x, y) !== b) continue;
        n++;
        const a = yon(b, x, y) + (rf() - 0.5) * 0.25;
        const boy = A.boy[0] + rf() * (A.boy[1] - A.boy[0]);
        const en = A.en[0] + rf() * (A.en[1] - A.en[0]);
        let ox = x - Math.cos(a) * boy * 0.3;
        let oy = y - Math.sin(a) * boy * 0.3;
        if (bolge(G.kenet(ox, 0, 1023), G.kenet(oy, 0, 1023)) !== b) {
          ox = x;
          oy = y;
        }
        const c = ornek(ox, oy);
        const j = (rf() - 0.5) * 7;
        lx.strokeStyle = G.css([c[0] + j, c[1] + j, c[2] + j * 0.8], A.a * (0.6 + rf() * 0.4));
        lx.lineWidth = en;
        lx.beginPath();
        const dx = Math.cos(a) * boy * 0.5;
        const dy = Math.sin(a) * boy * 0.5;
        const bk = (rf() - 0.5) * en * 0.8;
        lx.moveTo(x - dx, y - dy);
        lx.quadraticCurveTo(x - Math.sin(a) * bk, y + Math.cos(a) * bk, x + dx, y + dy);
        lx.stroke();
      }
      // bölgenin dışına taşan fırça izlerini kes
      const [kc, kx] = G.tuval(1024, 1024);
      const km = kx.createImageData(1024, 1024);
      for (let i = 0; i < 1024 * 1024; i++) if (mv[i * 4] === b) km.data[i * 4 + 3] = 255;
      kx.putImageData(km, 0, 0);
      lx.setTransform(1, 0, 0, 1, 0, 0);
      lx.globalCompositeOperation = 'destination-in';
      lx.imageSmoothingEnabled = true;
      lx.drawImage(kc, 0, 0, 2048, 2048);
      ctx.drawImage(lc, 0, 0, 1024, 1024);
    }
  }

  // ---------------------------------------------------------------- 5. ince çerçeve çizgisi (çift)
  {

  // ---------------------------------------------------------------- 6. çiçek çelengi
  let K = ctx;
  const YESILLER = { koyu: [44, 86, 46], orta: [84, 130, 70], acik: [146, 184, 112], damar: [196, 222, 170] };
  function yaprak(x, y, uz, gen, aci, ton) {
    const W = uz * gen * 0.5;
    K.save();
    K.translate(x, y);
    K.rotate(aci);
    const ust = new Path2D(`M0,0 C${uz * 0.22},${-W * 1.05} ${uz * 0.62},${-W * 1.1} ${uz},0 Z`);
    const alt = new Path2D(`M0,0 C${uz * 0.22},${W * 1.05} ${uz * 0.62},${W * 1.1} ${uz},0 Z`);
    // hangi yarı ışığa bakıyor (ışık ekranda sağ üstte)
    const nUst = [Math.sin(aci), -Math.cos(aci)];
    const yUst = 0.5 + 0.5 * (nUst[0] * 0.7 + nUst[1] * -0.7);
    const t = ton == null ? 0.5 : ton;
    const yarim = (p, ay) => {
      const g = K.createLinearGradient(0, 0, uz, 0);
      const k = G.karis(YESILLER.koyu, YESILLER.orta, 0.35 + ay * 0.5);
      const a = G.karis(YESILLER.orta, YESILLER.acik, ay * 0.8);
      const tt = (c) => G.karis(c, [c[0] * 0.8, c[1] * 0.92, c[2] * 0.8], 1 - t);
      g.addColorStop(0, G.css(tt(G.karis(YESILLER.koyu, k, 0.5))));
      g.addColorStop(0.45, G.css(tt(k)));
      g.addColorStop(1, G.css(tt(a)));
      K.fillStyle = g;
      K.fill(p);
    };
    K.shadowColor = 'rgba(40,60,40,0.25)';
    K.shadowBlur = 5;
    K.shadowOffsetX = -2;
    K.shadowOffsetY = 3;
    yarim(ust, yUst);
    K.shadowColor = 'transparent';
    yarim(alt, 1 - yUst);
    // damarlar
    K.strokeStyle = G.css(YESILLER.damar, 0.55);
    K.lineWidth = Math.max(0.7, uz * 0.018);
    K.beginPath();
    K.moveTo(0, 0);
    K.quadraticCurveTo(uz * 0.5, -W * 0.06, uz * 0.96, 0);
    K.stroke();
    K.strokeStyle = G.css(YESILLER.damar, 0.22);
    K.lineWidth = Math.max(0.5, uz * 0.009);
    for (let i = 1; i <= 5; i++) {
      const u = (i / 6) * uz * 0.9;
      for (const sg of [-1, 1]) {
        K.beginPath();
        K.moveTo(u, 0);
        K.quadraticCurveTo(u + uz * 0.08, sg * W * 0.45, u + uz * 0.16, sg * W * 0.72 * Math.sin(Math.PI * (u / uz) * 0.95 + 0.15));
        K.stroke();
      }
    }
    K.restore();
  }

  function tacYaprakYolu(R, w) {
    return new Path2D(
      `M0,0 C${R * 0.2},${-w * 0.5} ${R * 0.5},${-w * 1.05} ${R * 0.84},${-w * 0.86} ` +
        `C${R * 1.0},${-w * 0.72} ${R * 1.04},${-w * 0.2} ${R * 0.95},${-w * 0.04} ` +
        `C${R * 1.04},${w * 0.2} ${R * 1.0},${w * 0.72} ${R * 0.84},${w * 0.86} ` +
        `C${R * 0.5},${w * 1.05} ${R * 0.2},${w * 0.5} 0,0 Z`
    );
  }
  function cicek(x, y, R, aci, rr, egik, egikAci, derin) {
    const sq = egik == null ? 1 : egik;
    const ea = egikAci == null ? 0 : egikAci;
    const dr = derin || 0;
    // çiçeğin arkasına düşen yumuşak gölge
    K.save();
    K.filter = `blur(${Math.max(2, R * 0.14)}px)`;
    K.fillStyle = 'rgba(34,58,40,0.3)';
    K.beginPath();
    K.ellipse(x - R * 0.14, y + R * 0.18, R * 0.95, R * 0.95 * sq, ea, 0, Math.PI * 2);
    K.fill();
    K.restore();
    K.save();
    K.translate(x, y);
    K.rotate(ea);
    K.scale(1, sq);
    K.rotate(-ea);
    const adet = 5;
    for (let i = 0; i < adet; i++) {
      const a = aci + (i * Math.PI * 2) / adet + (rr() - 0.5) * 0.2;
      const Ri = R * (0.9 + rr() * 0.16);
      const w = Ri * (0.45 + rr() * 0.07);
      K.save();
      K.rotate(a);
      const p = tacYaprakYolu(Ri, w);
      const yon = Math.cos(a + Math.PI / 4);
      K.shadowColor = 'rgba(70,78,110,0.24)';
      K.shadowBlur = R * 0.14;
      K.shadowOffsetX = -R * 0.02;
      K.shadowOffsetY = R * 0.05;
      const g = K.createLinearGradient(0, 0, Ri, 0);
      g.addColorStop(0, G.css([214, 222, 178]));
      g.addColorStop(0.2, G.css([240, 243, 226]));
      g.addColorStop(0.55, G.css([253, 253, 250]));
      g.addColorStop(0.9, G.css(G.karis([236, 236, 244], [255, 254, 250], 0.5 + 0.5 * yon)));
      g.addColorStop(1, G.css(G.karis([228, 228, 240], [252, 250, 246], 0.5 + 0.5 * yon)));
      K.fillStyle = g;
      K.fill(p);
      K.shadowColor = 'transparent';
      K.save();
      K.clip(p);
      // çanak biçimi: yaprağın iki yanı merkeze göre hafif gölgeli, ışıktan uzak yan daha çok
      const yan = Math.sin(a + Math.PI / 4) > 0 ? 1 : -1;
      const g2 = K.createLinearGradient(0, -w * yan, 0, w * yan);
      g2.addColorStop(0, 'rgba(255,255,255,0.35)');
      g2.addColorStop(0.35, 'rgba(255,255,255,0)');
      g2.addColorStop(0.62, 'rgba(196,200,222,0)');
      g2.addColorStop(1, `rgba(188,194,220,${0.42 + 0.2 * (1 - yon) * 0.5})`);
      K.fillStyle = g2;
      K.fillRect(-2, -w * 1.2, Ri * 1.1, w * 2.4);
      // dibe doğru yeşilimsi gölge (çiçeğin içi)
      const g3 = K.createRadialGradient(0, 0, 0, 0, 0, Ri * 0.45);
      g3.addColorStop(0, 'rgba(150,170,110,0.45)');
      g3.addColorStop(1, 'rgba(150,170,110,0)');
      K.fillStyle = g3;
      K.fillRect(-2, -w * 1.2, Ri * 0.6, w * 2.4);
      // ince damarlar
      K.strokeStyle = 'rgba(200,204,222,0.5)';
      K.lineWidth = Math.max(0.45, R * 0.011);
      for (let k = -3; k <= 3; k++) {
        K.beginPath();
        K.moveTo(R * 0.12, 0);
        K.quadraticCurveTo(Ri * 0.5, k * w * 0.13, Ri * 0.92, k * w * 0.26);
        K.stroke();
      }
      K.restore();
      K.strokeStyle = 'rgba(170,174,196,0.42)';
      K.lineWidth = Math.max(0.45, R * 0.013);
      K.stroke(p);
      K.restore();
    }
    // bütün çiçeğe sol altta hafif gölge (hacim)
    K.save();
    K.globalCompositeOperation = 'multiply';
    const gh = K.createLinearGradient(R * 0.7, -R * 0.7, -R * 0.7, R * 0.7);
    gh.addColorStop(0, 'rgba(255,255,255,0)');
    gh.addColorStop(1, 'rgba(214,218,236,1)');
    K.fillStyle = gh;
    K.globalAlpha = 0.7;
    K.beginPath();
    K.arc(0, 0, R * 1.08, 0, Math.PI * 2);
    K.fill();
    K.restore();
    // orta: yeşilimsi dişicik ve sarı ercikler
    const go = K.createRadialGradient(R * 0.03, -R * 0.03, 0, 0, 0, R * 0.16);
    go.addColorStop(0, G.css([222, 226, 128]));
    go.addColorStop(1, G.css([150, 168, 78]));
    K.fillStyle = go;
    K.beginPath();
    K.arc(0, 0, R * 0.12, 0, Math.PI * 2);
    K.fill();
    const en = 26;
    for (let i = 0; i < en; i++) {
      const a = (i / en) * Math.PI * 2 + rr() * 0.2;
      const l = R * (0.19 + rr() * 0.13);
      const ex = Math.cos(a) * l;
      const ey = Math.sin(a) * l;
      K.strokeStyle = 'rgba(206,200,136,0.85)';
      K.lineWidth = Math.max(0.45, R * 0.011);
      K.beginPath();
      K.moveTo(Math.cos(a) * R * 0.08, Math.sin(a) * R * 0.08);
      K.lineTo(ex, ey);
      K.stroke();
      const rk = Math.max(0.8, R * 0.028);
      const ge = K.createRadialGradient(ex + rk * 0.3, ey - rk * 0.3, 0, ex, ey, rk);
      ge.addColorStop(0, G.css([255, 228, 126]));
      ge.addColorStop(1, G.css([190, 134, 38]));
      K.fillStyle = ge;
      K.beginPath();
      K.arc(ex, ey, rk, 0, Math.PI * 2);
      K.fill();
    }
    K.restore();
  }
  function tomurcuk(t) {
    K.save();
    K.translate(t.x, t.y);
    K.rotate(t.aci);
    const R = t.r;
    // kısa sap
    K.strokeStyle = G.css([84, 116, 64]);
    K.lineWidth = Math.max(1.2, R * 0.22);
    K.lineCap = 'round';
    K.beginPath();
    K.moveTo(-R * 0.6, 0);
    K.lineTo(-R * 1.6, 0);
    K.stroke();
    // kapalı beyaz taç: uzun damla
    const p = new Path2D(`M${-R * 0.7},0 C${-R * 0.7},${-R * 0.75} ${R * 0.6},${-R * 0.7} ${R * 1.55},0 C${R * 0.6},${R * 0.7} ${-R * 0.7},${R * 0.75} ${-R * 0.7},0 Z`);
    K.shadowColor = 'rgba(40,60,40,0.25)';
    K.shadowBlur = 4;
    K.shadowOffsetY = 2;
    const g = K.createLinearGradient(0, -R * 0.7, 0, R * 0.7);
    g.addColorStop(0, G.css([255, 255, 252]));
    g.addColorStop(0.55, G.css([246, 246, 240]));
    g.addColorStop(1, G.css([214, 218, 226]));
    K.fillStyle = g;
    K.fill(p);
    K.shadowColor = 'transparent';
    // taç yaprağı kıvrım çizgisi
    K.strokeStyle = 'rgba(180,184,204,0.6)';
    K.lineWidth = Math.max(0.5, R * 0.08);
    K.beginPath();
    K.moveTo(-R * 0.2, R * 0.35);
    K.quadraticCurveTo(R * 0.5, R * 0.1, R * 1.45, 0);
    K.stroke();
    // üç sivri çanak yaprağı
    for (const sg of [-1, 0, 1]) {
      const cg = K.createLinearGradient(-R * 0.8, 0, R * 0.4, 0);
      cg.addColorStop(0, G.css([70, 108, 58]));
      cg.addColorStop(1, G.css([118, 160, 88]));
      K.fillStyle = cg;
      K.beginPath();
      K.moveTo(-R * 0.75, sg * R * 0.1);
      K.quadraticCurveTo(-R * 0.3, sg * R * 0.62 + (sg === 0 ? R * 0.18 : 0), R * (sg === 0 ? 0.55 : 0.25), sg * R * 0.42);
      K.quadraticCurveTo(-R * 0.25, sg * R * 0.18, -R * 0.75, sg * R * 0.1);
      K.fill();
    }
    K.restore();
  }

  {
    const B = SAHNE.bitki;
    const rr = SAHNE.rng(77);
    // saplar
    K.save();
    K.lineCap = 'round';
    for (const s of B.saplar) {
      K.strokeStyle = G.css([84, 116, 64]);
      K.lineWidth = 4.2;
      K.stroke(G.yol(SAHNE.yol(s)));
      K.save();
      K.translate(1, -0.5);
      K.strokeStyle = 'rgba(180,210,150,0.5)';
      K.lineWidth = 1.2;
      K.stroke(G.yol(SAHNE.yol(s)));
      K.restore();
    }
    K.restore();
    // çelenk: kemer kenarı boyunca ek dallar (sol ve sağ)
    const ekYaprak = [];
    const ekCicek = [];
    const ekTomurcuk = [];
    for (const taraf of [-1, 1]) {
      const kx = taraf < 0 ? 54 : 970;
      // iki asma: biri çerçeve çizgisi boyunca, biri biraz içeride ve daha kısa
      const asmalar = [
        { dx: 0, boy: 600, faz: 0, cicek: [5, 10, 15, 20, 25], uc: true },
        { dx: 44, boy: 400, faz: 1.3, cicek: [8, 16, 23], uc: true },
        { dx: -36, boy: 300, faz: 2.1, cicek: [12, 22], uc: false },
      ];
      for (const as of asmalar) {
        const pts = [];
        for (let i = 0; i <= 30; i++) {
          const t = i / 30;
          const y = 1035 - t * as.boy;
          const x = kx + taraf * (as.dx - 18 + 24 * Math.sin(t * Math.PI * 1.6 + as.faz) - 10 * t);
          pts.push([x, y]);
        }
        K.strokeStyle = G.css([84, 116, 64]);
        K.lineWidth = 3.4;
        K.lineCap = 'round';
        K.stroke(G.yol(SAHNE.yol(pts)));
        for (let i = 2; i < 30; i++) {
          const [x, y] = pts[i];
          const [xn, yn] = pts[i + 1];
          const yonA = Math.atan2(yn - y, xn - x);
          const sg = i % 2 ? 1 : -1;
          const kucul = 1 - (i / 30) * 0.45;
          ekYaprak.push({ x, y, uz: (30 + rr() * 22) * kucul + 8, gen: 0.46, aci: yonA + sg * (0.75 + rr() * 0.45), ton: 0.35 + rr() * 0.55 });
        }
        for (const i of as.cicek) {
          const [x, y] = pts[i];
          ekCicek.push({ x: x + taraf * (rr() - 0.5) * 22, y: y + (rr() - 0.5) * 10, r: 15 + (30 - i) * 0.85 + rr() * 6, aci: rr() * 6 });
        }
        if (as.uc) {
          ekTomurcuk.push({ x: pts[30][0], y: pts[30][1] - 6, r: 8, aci: -Math.PI / 2 + taraf * 0.2 });
          ekTomurcuk.push({ x: pts[27][0] - taraf * 16, y: pts[27][1], r: 6.5, aci: -Math.PI / 2 - taraf * 0.6 });
        }
      }
    }
    // alt bant için ek yapraklar (gür çelenk)
    for (let i = 0; i < 46; i++) {
      const x = 20 + rr() * 984;
      const y = 860 + rr() * 170;
      ekYaprak.push({ x, y, uz: 44 + rr() * 40, gen: 0.46, aci: -Math.PI / 2 + (x - 512) / 700 + (rr() - 0.5) * 1.9, ton: 0.3 + rr() * 0.5 });
    }
    // yapraklar: arkadakiler önce
    const tum = ekYaprak.concat(B.yapraklar.map((y) => ({ x: y.x, y: y.y, uz: y.uzunluk * 1.08, gen: 0.48, aci: y.aci, ton: 0.4 + rr() * 0.55 })));
    tum.sort((a, b) => a.y - b.y);
    for (const y of tum) yaprak(y.x, y.y, y.uz, y.gen, y.aci, y.ton);
    for (const t of B.tomurcuklar.concat(ekTomurcuk)) tomurcuk(t);
    const cicekler = B.cicekler.map((c) => ({ x: c.x, y: c.y, r: c.r * 1.05, aci: c.aci })).concat(ekCicek);
    // ön bant için birkaç ek küçük çiçek
    const ekOn = [
      { x: 90, y: 1000, r: 38 },
      { x: 940, y: 1000, r: 40 },
      { x: 120, y: 820, r: 26 },
      { x: 905, y: 812, r: 26 },
      { x: 620, y: 1010, r: 30 },
      { x: 455, y: 1012, r: 26 },
      { x: 790, y: 960, r: 30 },
      { x: 280, y: 955, r: 28 },
    ];
    for (const c of ekOn) cicekler.push({ x: c.x, y: c.y, r: c.r, aci: rr() * 6 });
    cicekler.sort((a, b) => a.y + a.r * 0.5 - (b.y + b.r * 0.5));
    for (const c of cicekler) cicek(c.x, c.y, c.r, c.aci, rr, 0.8 + rr() * 0.2, rr() * Math.PI);
  }

  // ---------------------------------------------------------------- 7. çok hafif tuval dokusu ve yumuşak ışık birliği
  {
    const [tc, tx] = G.tuval(1024, 1024);
    const im = tx.createImageData(1024, 1024);
    const rg = SAHNE.rng(9);
    for (let y = 0; y < 1024; y++) {
      for (let x = 0; x < 1024; x++) {
        const v = 128 + PN.fbm(x * 0.09, y * 0.09, 2) * 40 + (rg() - 0.5) * 14;
        const i = (y * 1024 + x) * 4;
        im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
        im.data[i + 3] = 255;
      }
    }
    tx.putImageData(im, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.07;
    ctx.drawImage(tc, 0, 0, 1024, 1024);
    ctx.restore();
  }

  SAHNE.hazir();
