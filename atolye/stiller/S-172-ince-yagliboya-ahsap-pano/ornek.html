<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-172 İnce Yağlıboya (Ahşap Pano) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #e6eef2; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ===================================================================== h3 boya motoru
// Ortak yardımcılar: ışık modeli (kubbe dönel yüzey, kasnak/minare silindir), taş işçiliği, altın alem,
// çiçek/yaprak modelleme, gök ve bulut, kabartma (fırça izi) ve tuval/pano dokusu. Her üslup kendi paletini
// ve seçeneklerini verir; görünen el izi üslubun kendi bölümünde çizilir.
const H = (function () {
  'use strict';
  const S = SAHNE;
  const N = 2048; // iç çözünürlük
  const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const yum = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const kar = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const css = (c, a) => (a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);
  const C = (x) => (typeof x === 'string' ? hex(x) : x);
  function rampa(dur) {
    const d = dur.map(([t, c]) => [t, C(c)]);
    return function (t) {
      if (t <= d[0][0]) return d[0][1];
      for (let i = 1; i < d.length; i++) if (t <= d[i][0]) return kar(d[i - 1][1], d[i][1], (t - d[i - 1][0]) / (d[i][0] - d[i - 1][0]));
      return d[d.length - 1][1];
    };
  }
  const norm = (v) => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
  const nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  // ışık: sağ üst önden (x sağa, y yukarı, z bakana)
  let L = norm([0.56, 0.5, 0.66]);
  let HV = norm([L[0], L[1], L[2] + 1]);
  function isikKur(v) { L = norm(v); HV = norm([L[0], L[1], L[2] + 1]); }

  function gurultu(tohum) {
    const r = S.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    const n = function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    n.fbm = function (x, y, o) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < o; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 31.7; y = ny + 11.3; a *= 0.5; }
      return s / t;
    };
    return n;
  }

  function tuval2(cizimMi) {
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d', { willReadFrequently: true });
    if (cizimMi !== false) g.setTransform(2, 0, 0, 2, 0, 0);
    return [c, g];
  }

  // ------------------------------------------------------------ kubbe profili (y → yarıçap, eğim)
  const KP = (function () {
    const p = S.kubbeProfili(2000); // tabandan (555) tepeye (300)
    const adim = 0.25, y0 = 299, n = Math.ceil((556 - y0) / adim) + 1;
    const R = new Float32Array(n), SL = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const y = y0 + i * adim;
      if (y <= 300) { R[i] = 0; SL[i] = -10; continue; }
      if (y >= 555) { R[i] = 200; SL[i] = 0; continue; }
      // p: y azalan
      while (j < p.length - 2 && p[j + 1].y > y) j++;
      while (j > 0 && p[j].y < y) j--;
      const a = p[j], b = p[j + 1];
      const t = (a.y - y) / (a.y - b.y || 1);
      R[i] = a.r + (b.r - a.r) * t;
      // dρ/dh (h = 555 - y yukarı): (b.r - a.r)/(a.y - b.y)
      SL[i] = (b.r - a.r) / (a.y - b.y || 1e-6);
    }
    return {
      r(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return R[i]; },
      s(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return SL[i]; },
    };
  })();

  /** Kubbe yüzey normali (kaburga ve dilim kabarıklığıyla). Dönüş: {n, u, fi, t, kab} */
  function kubbeNormal(x, y, o) {
    o = o || {};
    let r = KP.r(y);
    if (r < 0.5) r = 0.5;
    let u = (x - 560) / r;
    if (u > 0.9995) u = 0.9995; else if (u < -0.9995) u = -0.9995;
    const fi = Math.asin(u);
    const s = KP.s(Math.max(301, y));
    const m = Math.hypot(1, s);
    const nr = 1 / m, nh = -s / m;
    const D = Math.PI / 16;
    let t = ((fi + Math.PI / 2) / D) % 1;
    if (t < 0) t += 1;
    const d = t < 0.5 ? t : t - 1;
    const wr = o.kaburgaEni || 0.06;
    let tau = (o.dilim === undefined ? 0.13 : o.dilim) * Math.cos(Math.PI * t);
    let kab = 0;
    if (Math.abs(d) < wr) {
      kab = 1 - Math.abs(d) / wr;
      tau = (o.kaburga === undefined ? 0.6 : o.kaburga) * Math.sin((Math.PI / 2) * (d / wr));
    }
    const f2 = fi + tau;
    return { n: [nr * Math.sin(f2), nh, nr * Math.cos(f2)], u, fi, t, d, kab };
  }

  // ------------------------------------------------------------ gök ve bulutlar
  /**
   * P: {ust, orta, ufuk, hale, gunes}; O: {haleR, haleGuc, gunesR, gurultu, ortaT}
   */
  function gokBoya(ctx, P, O) {
    O = O || {};
    const [c, g] = tuval2(false);
    const im = g.createImageData(N, N), d = im.data;
    const ra = rampa([[0, P.ust], [O.ortaT || 0.5, P.orta], [1, P.ufuk]]);
    const hale = C(P.hale), gun = C(P.gunes);
    const nz = gurultu(O.tohum || 11);
    const gx = S.gunes.x, gy = S.gunes.y, haleR = O.haleR || 300, haleG = O.haleGuc === undefined ? 0.85 : O.haleGuc;
    const gR = O.gunesR || 34, gYum = O.gunesYum || 10;
    const gr = O.gurultu === undefined ? 0.03 : O.gurultu;
    for (let py = 0; py < N; py++) {
      const y = (py + 0.5) / 2;
      const base = ra(Math.pow(sat(y / (O.ufukY || 800)), O.us || 1));
      for (let px = 0; px < N; px++) {
        const x = (px + 0.5) / 2;
        const dx = x - gx, dy = y - gy, dist = Math.sqrt(dx * dx + dy * dy);
        const h = haleG * Math.exp(-Math.pow(dist / haleR, 1.25));
        let r = base[0] + (hale[0] - base[0]) * h, gg = base[1] + (hale[1] - base[1]) * h, b = base[2] + (hale[2] - base[2]) * h;
        const k = 1 - yum(gR - gYum, gR + gYum, dist);
        r += (gun[0] - r) * k; gg += (gun[1] - gg) * k; b += (gun[2] - b) * k;
        if (gr) { const v = 1 + (nz.fbm(x / 210, y / 160, 3) - 0.5) * gr; r *= v; gg *= v; b *= v; }
        const i = (py * N + px) * 4;
        d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
    ctx.drawImage(c, 0, 0, 1024, 1024);
  }

  /** Kümülüs bulut: küre kümeleri, sağ üstten ışık. bulutlar: [{x,y,w,h,adet,tohum}] */
  function bulutBoya(ctx, bulutlar, P, O) {
    O = O || {};
    const W = 1024, hb = new Float32Array(W * W).fill(-1), nxb = new Float32Array(W * W), nyb = new Float32Array(W * W), aob = new Float32Array(W * W), cov = new Float32Array(W * W);
    const tabanB = new Float32Array(W * W);
    for (const b of bulutlar) {
      const r = S.rng(b.tohum || 5);
      const kureler = [];
      for (let i = 0; i < b.adet; i++) {
        const t = r() * 2 - 1;
        const kenar = 1 - Math.abs(t);
        const rad = (b.h * 0.34) * (0.45 + 0.75 * kenar) * (0.7 + r() * 0.5);
        const x = b.x + t * b.w * 0.5;
        const y = b.y - r() * b.h * 0.55 * kenar + rad * 0.25;
        kureler.push({ x, y, r: rad, z: kenar * b.h * 0.3 + r() * 6 });
      }
      const taban = b.y + b.h * 0.18;
      for (const k of kureler) {
        const x0 = Math.max(0, Math.floor(k.x - k.r - 2)), x1 = Math.min(W - 1, Math.ceil(k.x + k.r + 2));
        const y0 = Math.max(0, Math.floor(k.y - k.r - 2)), y1 = Math.min(W - 1, Math.ceil(k.y + k.r + 2));
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          const dx = x + 0.5 - k.x, dy = y + 0.5 - k.y, dd = dx * dx + dy * dy;
          const rr = k.r * k.r;
          if (dd > (k.r + 1.5) * (k.r + 1.5)) continue;
          const i = y * W + x;
          const e = sat((k.r + 1 - Math.sqrt(dd)) / (O.kenar || 1.6));
          const ab = yum(taban + 2, taban - (O.tabanYum || 6), y + 0.5);
          const cv = e * ab;
          if (cv > cov[i]) cov[i] = cv;
          const hz = Math.sqrt(Math.max(0, rr - dd)) + k.z;
          if (hz > hb[i]) {
            hb[i] = hz;
            const nz = Math.sqrt(Math.max(0, rr - dd)) / k.r;
            nxb[i] = dx / k.r; nyb[i] = -dy / k.r; aob[i] = nz;
            tabanB[i] = sat((taban - (y + 0.5)) / (b.h * 0.6));
          }
        }
      }
    }
    const [c, g] = [S.yeniTuval(W, W), null];
    const gg = c.getContext('2d');
    const im = gg.createImageData(W, W), d = im.data;
    const ra = rampa([[0, P.golge], [0.5, P.orta], [1, P.isik]]);
    const opak = O.opaklik === undefined ? 0.95 : O.opaklik;
    for (let i = 0; i < W * W; i++) {
      if (cov[i] <= 0) continue;
      const n = norm([nxb[i], nyb[i], Math.max(0.05, aob[i])]);
      let sh = nokta(n, L) * 0.8 + 0.25;
      sh = sh * (0.75 + 0.25 * aob[i]) - 0.28 * (1 - tabanB[i]) * (1 - Math.max(0, n[1]));
      const col = ra(sat(sh));
      d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255 * cov[i] * opak;
    }
    gg.putImageData(im, 0, 0);
    ctx.save();
    if (O.bulanik) ctx.filter = `blur(${O.bulanik}px)`;
    ctx.drawImage(c, 0, 0, 1024, 1024);
    ctx.restore();
  }

  // ------------------------------------------------------------ malzeme: taş, yeşil, altın
  /** Normal → renk: rampa ile yayınık ışık, gök/yer yansıması ve parlama. */
  function golgele(n, M) {
    const dif = Math.max(0, nokta(n, L));
    let v = M.ortam + (1 - M.ortam) * dif;
    let c = M.rampa(sat(v));
    if (M.gok) { const k = M.gokGuc * sat(0.5 + 0.5 * n[1]) * (1 - dif); c = kar(c, M.gok, k); }
    if (M.yer) { const k = M.yerGuc * sat(-n[1]) ; c = kar(c, M.yer, k); }
    if (M.parlak) { const sp = Math.pow(Math.max(0, nokta(n, HV)), M.parlakUs || 40) * M.parlak; c = kar(c, M.parlakRenk || [255, 255, 255], sat(sp)); }
    return c;
  }
  function malzeme(o) {
    return { rampa: rampa(o.rampa), ortam: o.ortam === undefined ? 0.18 : o.ortam, gok: o.gok && C(o.gok), gokGuc: o.gokGuc || 0, yer: o.yer && C(o.yer), yerGuc: o.yerGuc || 0, parlak: o.parlak || 0, parlakUs: o.parlakUs, parlakRenk: o.parlakRenk && C(o.parlakRenk) };
  }
  /** Silindir (dikey eksen) yatay degrade. ny: yüzeyin yukarı eğimi (0 dik, + yukarı bakar). */
  function silindirDeg(ctx, cx, R, x1, x2, M, ny, carp) {
    const g = ctx.createLinearGradient(x1, 0, x2, 0);
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const x = x1 + ((x2 - x1) * i) / n;
      let nx = (x - cx) / R; nx = Math.max(-0.995, Math.min(0.995, nx));
      const nz = Math.sqrt(1 - nx * nx);
      const nn = norm([nx, ny || 0, nz]);
      let c = golgele(nn, M);
      if (carp) c = [c[0] * carp, c[1] * carp, c[2] * carp];
      g.addColorStop(i / n, css(c));
    }
    return g;
  }
  function dikdortgen(x1, y1, x2, y2) { return new Path2D(S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true)); }

  // ------------------------------------------------------------ kubbe
  /** Kubbeyi piksel piksel boyar. renkFn(kn, x, y) → rgb (kn: kubbeNormal sonucu). */
  function kubbeBoya(ctx, renkFn, o) {
    const [c, g] = tuval2(false);
    const x0 = 350, x1 = 770, y0 = 296, y1 = 558;
    const W = (x1 - x0) * 2, Hh = (y1 - y0) * 2;
    const im = g.createImageData(W, Hh), d = im.data;
    for (let py = 0; py < Hh; py++) {
      const y = y0 + (py + 0.5) / 2;
      for (let px = 0; px < W; px++) {
        const x = x0 + (px + 0.5) / 2;
        const kn = kubbeNormal(x, y, o);
        const col = renkFn(kn, x, y);
        const i = (py * W + px) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
      }
    }
    g.putImageData(im, x0 * 2, y0 * 2);
    // maske
    const [m, mg] = tuval2();
    mg.fillStyle = '#000';
    mg.fill(new Path2D(S.kubbeYolu));
    mg.globalCompositeOperation = 'source-in';
    mg.setTransform(1, 0, 0, 1, 0, 0);
    mg.drawImage(c, 0, 0);
    ctx.drawImage(m, 0, 0, 1024, 1024);
  }

  // ------------------------------------------------------------ minare
  /**
   * Minare. T: taş malzemesi, A: altın malzemesi; o: {derz:bool, derzRenk, pencereIc:[ust,alt], pencereKenar, golgeRenk, cizgi}
   */
  function minareBoya(ctx, T, A, o) {
    o = o || {};
    const cx = 300;
    const parcalar = S.minareParcalari();
    const golge = o.golgeRenk || 'rgba(70,60,80,0.32)';
    const G = o.kat !== 'detay', D = o.kat !== 'govde';
    const govde = (x1, x2, y1, y2) => {
      if (G) {
        ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0);
        ctx.fill(dikdortgen(x1, y1, x2, y2));
      }
      if (D && o.derz) {
        const R = (x2 - x1) / 2;
        ctx.save();
        ctx.clip(dikdortgen(x1, y1, x2, y2));
        for (let y = y2 - (o.derzAra || 14); y > y1 + 3; y -= (o.derzAra || 14)) {
          ctx.fillStyle = o.derzRenk || 'rgba(120,100,80,0.28)';
          ctx.fillRect(x1, y, x2 - x1, 0.9);
          ctx.fillStyle = o.derzIsik || 'rgba(255,250,240,0.25)';
          ctx.fillRect(x1, y + 0.9, x2 - x1, 0.6);
          // dikey derzler: silindir üzerinde kısalır
          const sira = Math.round(y / (o.derzAra || 14)) % 2;
          for (let k = -3; k <= 3; k++) {
            const th = (k + sira * 0.5) * 0.52;
            if (Math.abs(th) > 1.45) continue;
            const x = cx + R * Math.sin(th);
            ctx.fillStyle = o.derzRenk || 'rgba(120,100,80,0.28)';
            ctx.fillRect(x - 0.4, y - (o.derzAra || 14) + 1, 0.8 * Math.cos(th) + 0.2, (o.derzAra || 14) - 1);
          }
        }
        ctx.restore();
      }
    };
    const pencere = (p) => { if (D) pencereBoya(ctx, p.x, p.y, p.w, p.h, o, 0); };
    const golgeBant = (x1, x2, y, h) => {
      if (!G || h <= 0) return;
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, golge);
      g.addColorStop(0.7, golge.replace(/[\d.]+\)$/, (m) => parseFloat(m) * 0.5 + ')'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x1, y, x2 - x1, h);
    };
    for (const p of parcalar) {
      if (p.ad === 'gövde-alt') {
        govde(266, 334, 488, 800);
        pencere(S.minarePencereleri[2]);
        golgeBant(266, 334, 488, 12);
      } else if (p.ad === 'zikzak') {
        if (D) zikzakBoya(ctx, o);
      } else if (p.ad.startsWith('çıkma')) {
        mukarnasBoya(ctx, p.noktalar, T, o, G, D);
      } else if (p.ad.startsWith('şerefe')) {
        const [a, , b] = [p.noktalar[0], 0, p.noktalar[2]];
        const x1 = a[0], x2 = b[0], y1 = a[1], y2 = b[1];
        if (G) {
          ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0.15);
          ctx.fill(dikdortgen(x1, y1, x2, y2));
        }
        if (D) {
          ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0.9);
          ctx.fillRect(x1, y1, x2 - x1, 1.6);
          ctx.fillStyle = 'rgba(60,50,60,0.25)';
          ctx.fillRect(x1, y2 - 1.2, x2 - x1, 1.2);
        }
      } else if (p.ad.startsWith('korkuluk')) {
        korkulukBoya(ctx, p, T, o, G, D);
      } else if (p.ad === 'gövde-orta') {
        govde(273, 327, 316, 436);
        pencere(S.minarePencereleri[1]);
        golgeBant(273, 327, 316, 9);
      } else if (p.ad === 'gövde-üst') {
        govde(281, 319, 206, 272);
        pencere(S.minarePencereleri[0]);
        golgeBant(281, 319, 206, 5);
      } else if (p.ad === 'bilezik') {
        if (G) {
          ctx.fillStyle = silindirDeg(ctx, cx, 25, 275, 325, T, 0.1);
          ctx.fill(dikdortgen(275, 198, 325, 206));
        }
        if (D) {
          ctx.fillStyle = silindirDeg(ctx, cx, 25, 275, 325, T, 0.85);
          ctx.fillRect(275, 198, 50, 1.3);
        }
      } else if (p.ad === 'topuz') {
        topuzBoya(ctx, p.yol, T, o, G, D);
      } else if (p.ad === 'alem') {
        if (D) alemBoya(ctx, p.alem, A, o);
      }
    }
    // korkuluğun gövdeye düşürdüğü gölge (şerefe gövdeyi örter: gövdenin şerefe üstü)
    golgeBant(273, 327, 436 - 1, 0); // yer tutucu (gerekirse üslup ekler)
  }

  function pencereBoya(ctx, x, y, w, h, o, aci) {
    const yol = new Path2D(S.kemerYolu(x, y, w, h));
    // taş çerçeve (kemer kaşı)
    if (o.pencereKasi) {
      ctx.save();
      ctx.lineWidth = o.pencereKasi;
      ctx.strokeStyle = o.kasRenk || 'rgba(255,250,235,0.6)';
      ctx.stroke(new Path2D(S.kemerYolu(x, y - o.pencereKasi * 0.6, w + o.pencereKasi * 1.6, h + o.pencereKasi * 0.6)));
      ctx.restore();
    }
    const ic = o.pencereIc || ['#4a4038', '#7a6c5a'];
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, ic[0]);
    g.addColorStop(1, ic[1]);
    ctx.fillStyle = g;
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    // iç kenarlar: sol iç yüz aydınlık, üstte gölge
    const kalin = Math.max(1.2, w * 0.16);
    if (aci === undefined || aci === 0) {

  /** Çiçek: beş taç yaprak (yabani gül biçimi). P: {isik, orta, golge, kok, gobek, ercik, ercikKoyu, cizgi} */

  /** Ek ön yapraklar (çiçek yatağını doldurmak için, referans yapraklarının arkasında). */

      const x = alan.x1 + r() * (alan.x2 - alan.x1);

  // ------------------------------------------------------------ doku ve kabartma

    o = o || {};

    const lx = 0.62, ly = -0.55; // ekran: sağ üst
    const parlak = o.parlak || 0;
    for (let y = 1; y < N - 1; y++) {
      for (let x = 1; x < N - 1; x++) {
        const i = y * N + x;
        const gx = yuk[i + 1] - yuk[i - 1], gy = yuk[i + N] - yuk[i - N];
        let s = -(gx * lx + gy * ly) * guc; // + aydınlık

    ctx.putImageData(im, 0, 0);

  /** Tuval bezi (düz dokuma) yükseklik haritası. */
  function tuvalBezi(yuk, aralik, guc, tohum) {
    const nz = gurultu(tohum || 3);
    const p = aralik;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const fx = x / p, fy = y / p;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const ux = fx - ix, uy = fy - iy;
        const atk = (ix + iy) % 2 === 0; // üstte atkı mı çözgü mü
        const a = Math.sin(Math.PI * uy), b = Math.sin(Math.PI * ux);

        yuk[y * N + x] += h * guc;

    const d = g.getImageData(0, 0, canvas.width, canvas.height).data;
    const w = canvas.width, sk = w / 1024;
    return function (x, y) {
      let px = Math.floor(x * sk), py = Math.floor(y * sk);
      if (px < 0) px = 0; else if (px >= w) px = w - 1;
      if (py < 0) py = 0; else if (py >= w) py = w - 1;
      const i = (py * w + px) * 4;

  // ------------------------------------------------------------ hacimli bulut (yoğunluk + kendi gölgesi)
  /**
   * bulutlar: [{x, y, w, h, adet, tohum}] (y: bulutun ortası). P: {isik, orta, golge}

  function bulutYogun(ctx, bulutlar, P, O) {

    const nz = gurultu(O.tohum || 17);

      }

        const y0 = Math.max(0, Math.floor(k.y - ext)), y1 = Math.min(W - 1, Math.ceil(k.y + ext));

          if (tb <= 0) continue;
          for (let xx = x0; xx <= x1; xx++) {
            const dx = xx + 0.5 - k.x, dy = yy + 0.5 - k.y, q = (dx * dx + dy * dy) / (k.r * k.r);

    const lx = 0.72, ly = -0.69;

    const KAP = new Float32Array(W * W);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const v = D[i];
      if (v < esik - ken) continue;
      const cov = yum(esik - ken, esik + ken, v);

      const kendi = Math.exp(-tau * sig);

  /** Uzun, yatay bulut bantları: ortak tabanlı elipsler, üstü aydınlık, altı serin gri. */

    const isik = C(P.isik), orta = C(P.orta), golge = C(P.golge);

        const ey = taban - ry * (0.35 + r() * 0.5);

        gr.addColorStop(0, css(isik));

        g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, Math.PI * 2); g.fill();

  // ------------------------------------------------------------ fırça: az önce boyanan öğenin üstünden darbe
  /**
   * o: {kutu:[x1,y1,x2,y2], yol: Path2D | [Path2D] (kırpma), yogunluk (1000 px² başına darbe), boy:[a,b], en:[a,b],

  function fircala(ctx, o) {

    const ornek = o.ornekle || ((x, y) => {

      if (px < 0) px = 0; else if (px >= pw) px = pw - 1;
      if (py < 0) py = 0; else if (py >= ph) py = ph - 1;
      const i = (py * pw + px) * 4;
      return [d[i], d[i + 1], d[i + 2]];
    });
    const r = S.rng(o.tohum || 1);
    let yol = null;
    if (o.yol) {
      if (Array.isArray(o.yol)) { yol = new Path2D(); for (const q of o.yol) yol.addPath(q); } else yol = o.yol;
    }
    ctx.save();
    if (yol) ctx.clip(yol);
    ctx.lineCap = o.uc || 'round';
    const alan = (x2 - x1) * (y2 - y1);
    const adet = o.adet || Math.round((alan / 1000) * (o.yogunluk || 10));
    const kil = o.kil || 4;
    const oy = o.oynak === undefined ? 6 : o.oynak, ko = o.kilOynak === undefined ? 8 : o.kilOynak;
    for (let i = 0; i < adet; i++) {
      const x = x1 + r() * (x2 - x1), y = y1 + r() * (y2 - y1);
      if (o.icinde && !o.icinde(x, y)) continue;
      if (yol && o.icMi !== false && !ctx.isPointInPath(yol, x * 2, y * 2)) continue;
      const l = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
      const w = o.en[0] + r() * (o.en[1] - o.en[0]);
      const al = o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]);
      // yol noktaları
      let pts;
      if (o.egri) {
        const ileri = [], geri = [];
        let cx = x, cy = y;
        const adim = Math.max(2, l / 8);
        for (let s = 0; s < 4; s++) { const a = o.yon(cx, cy); cx += Math.cos(a) * adim; cy += Math.sin(a) * adim; ileri.push([cx, cy]); }
        cx = x; cy = y;
        for (let s = 0; s < 4; s++) { const a = o.yon(cx, cy); cx -= Math.cos(a) * adim; cy -= Math.sin(a) * adim; geri.push([cx, cy]); }
        pts = geri.reverse().concat([[x, y]], ileri);
      } else {
        const a = o.yon(x, y);
        const ca = Math.cos(a) * l / 2, sa = Math.sin(a) * l / 2;

        if (o.ucIcinde && !(o.icinde(x - ca, y - sa) && o.icinde(x + ca, y + sa))) continue;

      const j = (r() - 0.5) * 2 * oy;
      c = [c[0] + j + (r() - 0.5) * oy * 0.6, c[1] + j + (r() - 0.5) * oy * 0.6, c[2] + j + (r() - 0.5) * oy * 0.6];

      for (let k = 0; k < kil; k++) {

        ctx.lineWidth = kil === 1 ? w : (w / kil) * 1.7;
        const bas = r() * 0.16 * (n - 1), son = (1 - r() * 0.16) * (n - 1);
        const nok = (s) => { const i0 = Math.min(n - 2, Math.floor(s)), f = s - i0; return [pts[i0][0] + (pts[i0 + 1][0] - pts[i0][0]) * f, pts[i0][1] + (pts[i0 + 1][1] - pts[i0][1]) * f, i0]; };
        const yolN = [nok(bas)];
        for (let q = Math.ceil(bas + 1e-6); q < son; q++) yolN.push([pts[q][0], pts[q][1], Math.min(n - 2, q)]);

        for (let q = 0; q < yolN.length; q++) {
          const i0 = yolN[q][2];

          const m = Math.hypot(tx, ty) || 1;
          tx /= m; ty /= m;
          const X = yolN[q][0] - ty * v, Y = yolN[q][1] + tx * v;

      }
    }
    ctx.restore();
  }

  /** El titremesi: kenarları çok hafifçe dalgalandıran düşük frekanslı yer değiştirme (iç piksel cinsinden). */
  function titret(ctx, genlik, olcek, tohum) {
    const im = ctx.getImageData(0, 0, N, N);
    const src = new Uint8ClampedArray(im.data);
    const d = im.data;
    const nz = gurultu(tohum || 99);
    const G = 64, gs = N / G;
    const DX = new Float32Array((G + 1) * (G + 1)), DY = new Float32Array((G + 1) * (G + 1));
    for (let j = 0; j <= G; j++) for (let i = 0; i <= G; i++) {
      DX[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek, (j * gs) / olcek, 2) - 0.5) * 2 * genlik;
      DY[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek + 50, (j * gs) / olcek + 70, 2) - 0.5) * 2 * genlik;
    }
    for (let y = 0; y < N; y++) {
      const gy = y / gs, j0 = Math.floor(gy), fy = gy - j0;
      for (let x = 0; x < N; x++) {
        const gx = x / gs, i0 = Math.floor(gx), fx = gx - i0;
        const a = j0 * (G + 1) + i0;
        const dx = (DX[a] * (1 - fx) + DX[a + 1] * fx) * (1 - fy) + (DX[a + G + 1] * (1 - fx) + DX[a + G + 2] * fx) * fy;
        const dy = (DY[a] * (1 - fx) + DY[a + 1] * fx) * (1 - fy) + (DY[a + G + 1] * (1 - fx) + DY[a + G + 2] * fx) * fy;
        let sx = x + dx, sy = y + dy;
        if (sx < 0) sx = 0; else if (sx > N - 1.001) sx = N - 1.001;
        if (sy < 0) sy = 0; else if (sy > N - 1.001) sy = N - 1.001;
        const xi = sx | 0, yi = sy | 0, ux = sx - xi, uy = sy - yi;
        const p = (yi * N + xi) * 4, q = p + N * 4;
        const o = (y * N + x) * 4;
        for (let c = 0; c < 3; c++) {
          d[o + c] = (src[p + c] * (1 - ux) + src[p + 4 + c] * ux) * (1 - uy) + (src[q + c] * (1 - ux) + src[q + 4 + c] * ux) * uy;
        }
      }
    }
    ctx.putImageData(im, 0, 0);
  }

  // ------------------------------------------------------------ ressam geçişi: resmi fırça darbeleriyle yeniden boyar
  const BOLGE_ADLARI = ['gok', 'gunes', 'zemin', 'minare', 'kaide', 'kasnak', 'kubbe', 'pencere', 'altin', 'sap', 'yaprak', 'cicek', 'cicekOrta'];
  let BOLGE_DIZI = null;
  function bolgeDizisi() {
    if (BOLGE_DIZI) return BOLGE_DIZI;
    const bh = S.bolgeHaritasi(), v = bh.veri, W = 1024;
    const B = new Uint8Array(W * W), onbellek = new Map();
    for (let i = 0; i < W * W; i++) {
      const k = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onbellek.get(k);
      if (b === undefined) { b = BOLGE_ADLARI.indexOf(S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])); onbellek.set(k, b); }
      B[i] = b;
    }
    BOLGE_DIZI = B;
    return B;
  }
  function kutuBulanik(A, W, r, gec) {
    const T = new Float32Array(A.length);
    for (let g = 0; g < (gec || 2); g++) {
      for (let y = 0; y < W; y++) {
        let s = 0; const o = y * W;
        for (let x = -r; x <= r; x++) s += A[o + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) { T[o + x] = s / (2 * r + 1); s += A[o + Math.min(W - 1, x + r + 1)] - A[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < W; x++) {
        let s = 0;
        for (let y = -r; y <= r; y++) s += T[Math.min(W - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < W; y++) { A[y * W + x] = s / (2 * r + 1); s += T[Math.min(W - 1, y + r + 1) * W + x] - T[Math.max(0, y - r) * W + x]; }
      }
    }
    return A;
  }
  /**
   * o = { katmanlar: [{aralik, en:[a,b], boy:[min,max], alfa:[a,b], esik, detay:[lo,hi], kil, kilOynak, oynak, adim}],
   *       yon:(x,y,b)=>açı, akis: kenar teğetine uyma (0..1), akisR, renkFn:(c,x,y,r,b,lum)=>c,
   *       kalin:(lum,b)=>impasto çarpanı, alan:(x,y,b)=>bool, sert:[bölge adları], tohum, uc, oluk }
   * Dönüş: yükseklik haritası (N×N Float32, 0..1)
   */
  function yenidenBoya(ctx, o) {
    const W = 1024;
    const src = ctx.getImageData(0, 0, N, N).data;
    const SR = new Float32Array(W * W), SG = new Float32Array(W * W), SB = new Float32Array(W * W), LM = new Float32Array(W * W);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const p = (y * 2 * N + x * 2) * 4, q = p + N * 4;
      const i = y * W + x;
      SR[i] = (src[p] + src[p + 4] + src[q] + src[q + 4]) / 4;
      SG[i] = (src[p + 1] + src[p + 5] + src[q + 1] + src[q + 5]) / 4;
      SB[i] = (src[p + 2] + src[p + 6] + src[q + 2] + src[q + 6]) / 4;
      LM[i] = 0.3 * SR[i] + 0.59 * SG[i] + 0.11 * SB[i];
    }
    const Lb = kutuBulanik(LM.slice(), W, 1, 1);
    const GX = new Float32Array(W * W), GY = new Float32Array(W * W);
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      GX[i] = (Lb[i - W + 1] + 2 * Lb[i + 1] + Lb[i + W + 1]) - (Lb[i - W - 1] + 2 * Lb[i - 1] + Lb[i + W - 1]);
      GY[i] = (Lb[i + W - 1] + 2 * Lb[i + W] + Lb[i + W + 1]) - (Lb[i - W - 1] + 2 * Lb[i - W] + Lb[i - W + 1]);
    }
    const J11 = new Float32Array(W * W), J12 = new Float32Array(W * W), J22 = new Float32Array(W * W), DT = new Float32Array(W * W);
    for (let i = 0; i < W * W; i++) { J11[i] = GX[i] * GX[i]; J12[i] = GX[i] * GY[i]; J22[i] = GY[i] * GY[i]; DT[i] = Math.hypot(GX[i], GY[i]); }
    const ar = o.akisR || 4;
    kutuBulanik(J11, W, ar, 2); kutuBulanik(J12, W, ar, 2); kutuBulanik(J22, W, ar, 2); kutuBulanik(DT, W, 3, 2);
    const FC = new Float32Array(W * W), FS = new Float32Array(W * W), FE = new Float32Array(W * W);
    for (let i = 0; i < W * W; i++) {
      // teğet yönünün iki katı açısı (gradyanın 90° döndürülmüşü)
      const a = J11[i] - J22[i], b = 2 * J12[i];
      const m = Math.hypot(a, b);
      FC[i] = m > 1e-6 ? -a / m : 1; FS[i] = m > 1e-6 ? -b / m : 0;
      FE[i] = sat(Math.sqrt(m) / (o.akisOlcek || 90));
      DT[i] = sat(DT[i] / (o.detayOlcek || 160));
    }
    const BI = bolgeDizisi();
    const sertler = new Uint8Array(BOLGE_ADLARI.length);
    for (const s of o.sert || ['kubbe', 'kasnak', 'kaide', 'minare', 'altin', 'pencere']) sertler[BOLGE_ADLARI.indexOf(s)] = 1;
    const idx = (x, y) => { let xi = x | 0, yi = y | 0; if (xi < 0) xi = 0; else if (xi >= W) xi = W - 1; if (yi < 0) yi = 0; else if (yi >= W) yi = W - 1; return yi * W + xi; };
    const akis = o.akis === undefined ? 0.8 : o.akis;
    const yonBul = (x, y) => {
      const i = idx(x, y);
      const b = BOLGE_ADLARI[BI[i]];
      const a0 = o.yon ? o.yon(x, y, b) : 0;
      const w = sat(FE[i] * akis * (o.akisFn ? o.akisFn(b) : 1));
      const vx = (1 - w) * Math.cos(2 * a0) + w * FC[i], vy = (1 - w) * Math.sin(2 * a0) + w * FS[i];
      return Math.atan2(vy, vx) / 2;
    };
    const [hc, hg] = tuval2();
    hg.fillStyle = '#000'; hg.fillRect(0, 0, W, W);
    const r = S.rng(o.tohum || 7);
    ctx.save(); hg.save();
    ctx.lineCap = hg.lineCap = o.uc || 'round';
    ctx.lineJoin = hg.lineJoin = 'round';
    const yolCiz = (g, P, ox, oy) => {
      g.beginPath();
      g.moveTo(P[0][0] + ox, P[0][1] + oy);
      if (P.length === 2) g.lineTo(P[1][0] + ox, P[1][1] + oy);
      else {
        for (let k = 1; k < P.length - 1; k++) g.quadraticCurveTo(P[k][0] + ox, P[k][1] + oy, (P[k][0] + P[k + 1][0]) / 2 + ox, (P[k][1] + P[k + 1][1]) / 2 + oy);
        g.lineTo(P[P.length - 1][0] + ox, P[P.length - 1][1] + oy);
      }
      g.stroke();
    };
    let sayac = 0;
    for (const K of o.katmanlar) {
      const ara = K.aralik, noktalar = [];
      const kx = K.kutu || [0, 0, W, W];
      for (let y = kx[1]; y < kx[3]; y += ara) for (let x = kx[0]; x < kx[2]; x += ara) noktalar.push([x + r() * ara, y + r() * ara]);
      for (let i = noktalar.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = noktalar[i]; noktalar[i] = noktalar[j]; noktalar[j] = t; }
      const adim = K.adim || Math.max(1.5, K.en[1] * 0.6);
      const kil = K.kil || 0;
      for (const [x, y] of noktalar) {
        const i0 = idx(x, y);
        const bi = BI[i0], b = BOLGE_ADLARI[bi];
        if (o.alan && !o.alan(x, y, b)) continue;
        const dt = DT[i0];
        if (K.detay && (dt < K.detay[0] || dt > K.detay[1])) continue;
        if (K.kosul && !K.kosul(x, y, b, dt)) continue;
        const c0 = [SR[i0], SG[i0], SB[i0]];
        const esik = K.esik;
        const maxL = K.boy[0] + r() * (K.boy[1] - K.boy[0]);
        const a = yonBul(x, y);
        const yuru = (sx, sy, dx, dy) => {
          const out = [];
          let px = sx, py = sy, cx = dx, cy = dy, L = 0;
          while (L < maxL / 2) {
            const aa = yonBul(px, py);
            let ex = Math.cos(aa), ey = Math.sin(aa);
            if (ex * cx + ey * cy < 0) { ex = -ex; ey = -ey; }
            const nx = px + ex * adim, ny = py + ey * adim;
            if (nx < -4 || ny < -4 || nx > W + 4 || ny > W + 4) break;
            const j = idx(nx, ny);
            const fark = Math.abs(SR[j] - c0[0]) + Math.abs(SG[j] - c0[1]) + Math.abs(SB[j] - c0[2]);
            if (fark > esik) break;
            if (BI[j] !== bi && (sertler[BI[j]] || sertler[bi])) break;
            out.push([nx, ny]);
            px = nx; py = ny; cx = ex; cy = ey; L += adim;
          }
          return out;
        };
        const ca = Math.cos(a), sa = Math.sin(a);
        const ileri = yuru(x, y, ca, sa), geri = yuru(x, y, -ca, -sa);
        let P = geri.reverse().concat([[x, y]], ileri);
        if (P.length < 2) P = [[x - ca * 0.6, y - sa * 0.6], [x + ca * 0.6, y + sa * 0.6]];
        const lum = 0.3 * c0[0] + 0.59 * c0[1] + 0.11 * c0[2];
        let c = o.renkFn ? o.renkFn(c0.slice(), x, y, r, b, lum) : c0.slice();
        const oy = K.oynak || 0;
        if (oy) { const j = (r() - 0.5) * 2 * oy; c = [c[0] + j + (r() - 0.5) * oy * 0.5, c[1] + j + (r() - 0.5) * oy * 0.5, c[2] + j + (r() - 0.5) * oy * 0.5]; }
        const enK = K.detayEn === false ? 0.5 : dt;
        const w = (K.en[1] + (K.en[0] - K.en[1]) * enK) * (0.85 + 0.3 * r());
        const al = K.alfa[0] + r() * (K.alfa[1] - K.alfa[0]);
        ctx.globalAlpha = al;
        ctx.strokeStyle = css(c);
        ctx.lineWidth = w;
        yolCiz(ctx, P, 0, 0);

        const tx = P[P.length - 1][0] - P[0][0], ty = P[P.length - 1][1] - P[0][1];
        const tm = Math.hypot(tx, ty) || 1;
        const nx = -ty / tm, ny = tx / tm;
        if (kil) {
          const ko = K.kilOynak || 10;

          for (let k = 0; k < kil; k++) {
            const v = ((k + 0.5) / kil - 0.5) * w * 0.8;
            const kj = (r() - 0.5) * 2 * ko;
            ctx.globalAlpha = al * (K.kilAlfa || 0.55);

            const bas = Math.floor(r() * P.length * 0.25), son = P.length - Math.floor(r() * P.length * 0.25);
            const Q = P.slice(bas, Math.max(bas + 2, son));
            if (Q.length >= 2) yolCiz(ctx, Q, nx * v, ny * v);
          }
        }
        // yükseklik: darbenin boya yükü (ışıkta kalın) ve oluklar
        const kal = o.kalin ? o.kalin(lum, b) : 1;
        const gri = 60 + (110 + (r() - 0.5) * 90) * kal;
        hg.globalAlpha = 1;
        hg.strokeStyle = `rgb(${gri | 0},${gri | 0},${gri | 0})`;
        hg.lineWidth = w;
        yolCiz(hg, P, 0, 0);

        if (oluk && w > 1.6) {
          hg.lineWidth = Math.max(0.4, w / (oluk * 2.4));

            const v = ((k + 0.5) / oluk - 0.5) * w * 0.85 + (r() - 0.5) * w * 0.15;

            hg.strokeStyle = `rgb(${gg | 0},${gg | 0},${gg | 0})`;
            yolCiz(hg, P, nx * v, ny * v);
          }
        }
        sayac++;
      }
    }
    ctx.restore(); hg.restore();
    const hd = hg.getImageData(0, 0, N, N).data;
    const yuk = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) yuk[i] = hd[i * 4] / 255;
    if (o.yukBulanik !== 0) kutuBulanik(yuk, N, o.yukBulanik || 1, 1);
    yenidenBoya.sonSayi = sayac;
    return yuk;
  }

  /** Boya kabartısını sağ üst ışıkla aydınlatır; yağlı boyada ışık yüzlerinde ince parıltı (sheen). */
  function boyaIsigi(ctx, yuk, o) {
    o = o || {};

    for (let y = 1; y < N - 1; y++) {

        const gx = yuk[i + 1] - yuk[i - 1], gy = yuk[i + N] - yuk[i - N];

  }

  const yaprakTonu = (i, t) => {
    const r = S.rng(700 + i);
    const kay = (r() - 0.5) * 0.6;
    const f = (c) => [c[0] + kay * 30, c[1] + kay * 6, c[2] - kay * 22];
    return { koyu: f(YAPRAK.koyu), orta: f(YAPRAK.orta), acik: f(YAPRAK.acik), t: t + (r() - 0.5) * 0.2 };
  };
  const ciy = (x, y, s) => {
    ctx.fillStyle = 'rgba(20,50,30,0.35)';
    ctx.beginPath(); ctx.ellipse(x - s * 0.35, y + s * 0.45, s * 1.0, s * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - s * 0.3, y + s * 0.3, s * 0.1, x, y, s);
    g.addColorStop(0, 'rgba(230,255,235,0.9)'); g.addColorStop(0.7, 'rgba(120,180,130,0.55)'); g.addColorStop(1, 'rgba(30,70,40,0.7)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x + s * 0.35, y - s * 0.38, s * 0.28, 0, Math.PI * 2); ctx.fill();
  };
  const ekler = H.ekYapraklar(79, 60, { x1: -20, x2: 1044, y1: 880, y2: 1050 });
  ekler.forEach((y, i) => { const T = yaprakTonu(i + 300, 0.12); H.yaprakBoya(ctx, y, T, { ton: T.t, yanDamar: false, kenar: 0.4, kenarRenk: css(T.koyu, 0.8) }); });
  for (const s of B.saplar) H.sapBoya(ctx, s, { koyu: C('#2E5E33'), acik: C('#9CCB78') }, 3.6);
  B.yapraklar.forEach((y0, i) => {
    const rr = S.rng(1900 + i);
    const y = Object.assign({}, y0, i < 36 ? {} : { uzunluk: y0.uzunluk * (0.82 + rr() * 0.36), genislik: 0.4 + rr() * 0.1 });
    const T = yaprakTonu(i, i < 36 ? 0.55 : 0.32 + ((i * 37) % 10) / 30);
    H.yaprakBoya(ctx, y, T, { ton: T.t, isikKenar: 0.6, kenar: 0.45, kenarRenk: css(T.koyu, 0.85), damarRenk: css(kar(T.acik, [240, 255, 220], 0.4), 0.6), yanDamarRenk: css(T.acik, 0.4) });
    {
      const ext = y.uzunluk * 1.05;
      H.fircala(ctx, { kutu: [y.x - ext, y.y - ext, y.x + ext, y.y + ext], yol: new Path2D(S.yaprakYolu(y)), adet: Math.round(y.uzunluk * 2.2), boy: [y.uzunluk * 0.12, y.uzunluk * 0.3], en: [0.8, 1.5], alfa: [0.3, 0.5], kil: 2, oynak: 9, kilOynak: 6, yon: () => y.aci + (R() - 0.5) * 0.35, tohum: 2000 + i });
    }
    if (rr() < 0.32) {
      const u = y.uzunluk * (0.35 + rr() * 0.35), v = (rr() - 0.5) * y.uzunluk * y.genislik * 0.6;
      ciy(y.x + Math.cos(y.aci) * u - Math.sin(y.aci) * v, y.y + Math.sin(y.aci) * u + Math.cos(y.aci) * v, 1.6 + rr() * 1.4);
    }
  });
  for (const t of B.tomurcuklar) H.tomurcukBoya(ctx, t, CICEK);
  B.cicekler.forEach((c, i) => H.cicekBoya(ctx, c, CICEK, { yanGolge: 0.66, uzakGolge: 0.3, damarRenk: 'rgba(150,165,190,0.3)', cizgi: 0.5, cizgiRenk: 'rgba(120,130,150,0.7)', centik: 0.05,
    tacSonra: (yollar) => H.fircala(ctx, { kutu: [c.x - c.r * 1.1, c.y - c.r * 1.1, c.x + c.r * 1.1, c.y + c.r * 1.1], yol: yollar, adet: Math.round(c.r * 9), boy: [c.r * 0.18, c.r * 0.4], en: [0.8, 1.4], alfa: [0.3, 0.45], kil: 2, oynak: 7, kilOynak: 5, yon: (x, y) => Math.atan2(y - c.y, x - c.x) + (R() - 0.5) * 0.2, tohum: 2100 + i }) }));
  // çiçek ortalarında minicik ışık noktaları
  for (const c of B.cicekler) {
    ctx.fillStyle = 'rgba(255,255,240,0.9)';
    ctx.beginPath(); ctx.arc(c.x + c.r * 0.05, c.y - c.r * 0.06, Math.max(0.6, c.r * 0.035), 0, Math.PI * 2); ctx.fill();
  }

  // ------------------------------------------------------------ ressamın fırçası: minicik, sabırlı darbeler; sırlı, mine gibi yüzey
  {
    const yuk = H.yenidenBoya(ctx, {
      tohum: 1772, akisR: 2, akis: 1, akisOlcek: 50, detayOlcek: 100,
      akisFn: (b) => (b === 'kubbe' ? 0.35 : b === 'gok' || b === 'gunes' ? 0.25 : 1),
      yon: (x, y, b) => {
        if (b === 'kubbe') return H.meridyenYonu(x, y);
        if (b === 'minare') return Math.PI / 2;
        if (b === 'gok' || b === 'gunes' || b === 'kaide' || b === 'kasnak') return 0.015 * Math.sin(x / 60 + y / 13) + 0.04 * Math.sin(x / 170 + y / 90);
        if (y > 790) return -Math.PI / 2 + 0.25 * Math.sin(x / 9 + y / 5);
        return 0;
      },
      renkFn: (c, x, y, r, b, lum) => {
        // sır (glaze) gibi doygun: ortalamadan uzaklaştır
        const m = (c[0] + c[1] + c[2]) / 3, k = 1.1, j = (r() - 0.5) * 6;
        return [m + (c[0] - m) * k + j, m + (c[1] - m) * k + j, m + (c[2] - m) * k + j];
      },
      kalin: (lum) => 0.35 + 0.5 * (lum / 255),
      oluk: 0,
      katmanlar: [
        { aralik: 3.2, en: [2.2, 3.8], boy: [12, 48], alfa: [0.36, 0.58], esik: 16, detay: [0, 0.22], kil: 0, oynak: 8 },
        { aralik: 2.7, en: [1.2, 2.2], boy: [4, 13], adim: 1.2, alfa: [0.72, 0.88], esik: 13, detay: [0.06, 1], kil: 0, oynak: 10 },
        { aralik: 1.9, en: [0.7, 1.2], boy: [2, 7], adim: 0.8, alfa: [0.88, 1], esik: 10, detay: [0.3, 1], kil: 0, oynak: 6 },
      ],
    });
    H.boyaIsigi(ctx, yuk, { guc: 0.45, parilti: 1.2, parEsik: 0.05, golge: 0.5 });
  }
  // kurşun beyazıyla kıl inceliğinde ışık izleri: kaburgalar, yaprak kenarları, taç yapraklar
  {
    const r = S.rng(1779);
    ctx.save();
    ctx.lineCap = 'round';
    const kesikCiz = (pts, ox, oy, renk, en, al, bosluk) => {
      let i = 0;
      while (i < pts.length - 1) {
        const n = 3 + Math.floor(r() * 7);
        ctx.strokeStyle = renk; ctx.globalAlpha = al * (0.6 + r() * 0.4); ctx.lineWidth = en * (0.7 + r() * 0.5);
        ctx.beginPath(); ctx.moveTo(pts[i][0] + ox, pts[i][1] + oy);
        for (let k = 1; k <= n && i + k < pts.length; k++) ctx.lineTo(pts[i + k][0] + ox + (r() - 0.5) * 0.3, pts[i + k][1] + oy);
        ctx.stroke();
        i += n + Math.floor(r() * bosluk);
      }
    };
    ctx.save();
    ctx.clip(new Path2D(S.kubbeYolu));
    for (const k of S.kaburgalar(16)) {
      if (k.u < -0.55 || k.u > 0.97) continue;
      const pts = k.noktalar.filter((p, i) => i % 2 === 0 && p[1] > 306);
      const isik = H.sat(1 - Math.abs(k.u - 0.35) * 1.1);
      kesikCiz(pts, 1.3, 0, '#E9FFE8', 0.75, 0.25 + isik * 0.55, 3);
      kesikCiz(pts, -0.9, 0, '#063226', 0.6, 0.35, 4);
    }
    ctx.restore();
    // yaprakların ışıklı kenarı
    for (const y of S.bitki.yapraklar) {
      const ca = Math.cos(y.aci), sa = Math.sin(y.aci), Lp = y.uzunluk, Wp = Lp * y.genislik;
      const dik = [-sa, ca], isikYari = dik[0] * H.ISIK2[0] + dik[1] * H.ISIK2[1] > 0 ? 1 : -1;
      const pts = [];
      for (let t = 0.12; t <= 0.9; t += 0.06) { const v = isikYari * Wp * 0.5 * Math.sin(Math.PI * t) * 0.82; pts.push([y.x + Lp * t * ca - v * sa, y.y + Lp * t * sa + v * ca]); }
      kesikCiz(pts, 0, 0, '#F4FFDA', 0.7, 0.7, 2);
      const orta = [];
      for (let t = 0.08; t <= 0.85; t += 0.07) orta.push([y.x + Lp * t * ca, y.y + Lp * t * sa]);
      kesikCiz(orta, 0, 0, '#D8F0B0', 0.5, 0.5, 2);
    }
    // taç yapraklarda ışık yönünde ince ışık çizgileri
    for (const c of S.bitki.cicekler) {
      for (let p = 0; p < 5; p++) {
        const a = c.aci + (p * Math.PI * 2) / 5;
        const yuz = Math.cos(a) * H.ISIK2[0] + Math.sin(a) * H.ISIK2[1];
        if (yuz < -0.3) continue;
        for (let q = 0; q < 3; q++) {
          const v = (q - 1) * 0.28 + (r() - 0.5) * 0.1;
          const pts = [];
          for (let t = 0.35; t <= 0.9; t += 0.08) pts.push([c.x + Math.cos(a + v * 0.5) * c.r * t, c.y + Math.sin(a + v * 0.5) * c.r * t]);
          kesikCiz(pts, 0, 0, '#FFFFFF', 0.7, 0.75, 1);
        }
      }
    }
    ctx.restore();
  }
  // yağlı verniğin hafif sıcak birliği
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgb(255,249,238)';
  ctx.fillRect(0, 0, 1024, 1024);
  ctx.restore();
  H.titret(ctx, 1.25, 38, 172);
  // panoya ait ince boyalı çerçeve: altın okr şerit ve ince koyu fileto
  {
    ctx.save();
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = '#B98A34'; ctx.lineWidth = 7;
    ctx.strokeRect(3.5, 3.5, 1017, 1017);
    ctx.strokeStyle = '#E8C66A'; ctx.lineWidth = 1.2;
    ctx.strokeRect(2.2, 2.2, 1019.6, 1019.6);
    ctx.strokeStyle = 'rgba(70,45,20,0.75)'; ctx.lineWidth = 1;
    ctx.strokeRect(7.5, 7.5, 1009, 1009);
    ctx.restore();
  }

  SAHNE.hazir();
})();

</script>
