<title>S-068 İpek Boyama — Atölye örnek görseli</title>
<style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-068 İpek Boyama (Serti) — gergin ipek üstünde gutta (altın ve renksiz) çizgileri yüzeyi kapalı alanlara
// böler; her alanın içinde boyalar ıslak üstüne ıslak akıp kaynaşır, gutta sınırında birikir. Tuz taneleri
// boyayı çekip yıldız patlaması dokuları bırakır; ipeğin parlaklığı ve ince örgüsü, şal kenarı gibi bordür.
// Gutta çizgileri önce maske olarak çizilir; çizgilerin ayırdığı her bağlı bölge (taşkın doldurma ile bulunur)
// kendi etiketine göre boyanır. Altın gutta yükseklik alanından ışıklandırılarak metal gibi parlatılır.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  const karR = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // SVG yolunu nokta dizilerine çevir (her alt yol ayrı)
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('style', 'position:absolute;left:-3000px;top:0;width:10px;height:10px');
  const yolEl = document.createElementNS(svgNS, 'path');
  svgEl.appendChild(yolEl); document.body.appendChild(svgEl);
  function yolNoktalari(d, adim) {
    const parca = d.split(/(?=M)/).filter((s) => s.trim());
    return parca.map((p) => {
      yolEl.setAttribute('d', p);
      const L = yolEl.getTotalLength(), n = Math.max(3, Math.ceil(L / (adim || 3))), out = [];
      for (let i = 0; i <= n; i++) { const q = yolEl.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  // bölge haritası, istenen ölçekte (S × 1024): Uint8Array bölge sırası
  const BADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; BADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(S, donustur) {
    const w = 1024 * S, c = SAHNE.yeniTuval(w, w), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0);
    if (donustur) donustur(g);
    SAHNE.ciz(g, { bolge: true });
    const v = g.getImageData(0, 0, w, w).data, n = w * w, B = new Uint8Array(n), onb = new Map();
    for (let i = 0; i < n; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      B[i] = b;
    }
    return B;
  }
  const kume = (...adlar) => { const s = new Uint8Array(16); adlar.forEach((a) => (s[BI[a]] = 1)); return s; };
  // ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const PROF = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(1024), kubbeDr = new Float32Array(1024);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < PROF.length - 2 && PROF[j + 1].y > y) j++;
    const a = PROF[j], b = PROF[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), r = Math.max(1, kubbeR[yi]);
    const u = clamp((x - 560) / r, -1, 1), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    const l = Math.hypot(u, dr, c);
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / l);
  }
  function silindirIsik(x, cx, yr) {
    const u = clamp((x - cx) / yr, -1, 1), c = Math.sqrt(1 - u * u);
    return Math.max(0, u * LV[0] + c * LV[2]);
  }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }

  const S = 2, W2 = 1024 * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(6801);
  const nA = gurultu(31), nB = gurultu(32), nC = gurultu(33), nD = gurultu(34), nE = gurultu(35), nF = gurultu(36);

  // ------------------------------------------------------------ katmanlar: altın gutta, renksiz gutta, etiket
  const yeni = () => { const c = SAHNE.yeniTuval(W2, W2), x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(S, 0, 0, S, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round'; return [c, x]; };
  const [aC, aG] = yeni(), [rC, rG] = yeni(), [eC, eG] = yeni();
  const T = { gok: 1, gunes: 2, isin: 3, hale: 4, bulut: 5, kubbe: 6, kasnak: 7, pencere: 8, kaide: 9, kornis: 10, minare: 11, zikzak: 12, korkuluk: 13, altin: 14, zemin: 15, yaprak: 16, sap: 17, cicek: 18, cicekOrta: 19, tomurcuk: 20, kenar: 21, kenarCicek: 22, kenarYaprak: 23, kenarIc: 24, topuz: 25, serefe: 26, kose: 27 };
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  // öndeki öğe: arkadaki gutta çizgilerini siler, kendi etiketini boyar
  function on(d, tag) {
    const p = P2(d);
    aG.globalCompositeOperation = rG.globalCompositeOperation = 'destination-out';
    aG.fillStyle = rG.fillStyle = '#000'; aG.fill(p); rG.fill(p);
    aG.globalCompositeOperation = rG.globalCompositeOperation = 'source-over';
    if (tag) { eG.fillStyle = `rgb(${tag},0,0)`; eG.fill(p); }
  }
  const altin = (d, w) => { aG.strokeStyle = '#fff'; aG.lineWidth = w || 1.9; aG.stroke(P2(d)); };
  const renksiz = (d, w) => { rG.strokeStyle = '#fff'; rG.lineWidth = w || 1.6; rG.stroke(P2(d)); };
  const cizgiY = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y1}`;
  const Y = SAHNE.yollar();

  // ------------------------------------------------------------ gök: rüzgâr kurdeleleri gibi kıvrılan bölme çizgileri
  eG.fillStyle = `rgb(${T.gok},0,0)`; eG.fillRect(0, 0, 1024, 1024);
  const gokCizgileri = [];
  {
    const seritler = [[78, 26, 0.9, 0.3], [168, 36, 1.2, 1.7], [262, 30, 0.8, 2.9], [352, 40, 1.1, 0.8], [448, 34, 1.0, 2.2], [548, 38, 1.3, 1.1], [652, 30, 0.9, 2.6], [744, 22, 1.1, 0.4]];
    for (const [y0, A, f, ph] of seritler) {
      const pts = [];
      for (let x = -10; x <= 1034; x += 6) pts.push([x, y0 + A * Math.sin((x / 1024) * Math.PI * 2 * f + ph) + 12 * Math.sin((x / 1024) * Math.PI * 5.3 + ph * 2)]);
      const d = SAHNE.yol(pts);
      gokCizgileri.push(d); renksiz(d, 1.5);
    }
  }
  // ------------------------------------------------------------ güneş: altın disk ve ışınlar, renksiz hale
  {
    const gx = 880, gy = 140;
    on(SAHNE.daireYolu(gx, gy, 124), T.hale); renksiz(SAHNE.daireYolu(gx, gy, 124), 1.6);
    renksiz(SAHNE.daireYolu(gx, gy, 92), 1.2);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2, uz = i % 2 ? 100 : 118, gen = 0.12;
      const p = new Path2D();
      p.moveTo(gx + Math.cos(a - gen) * 50, gy + Math.sin(a - gen) * 50);
      p.quadraticCurveTo(gx + Math.cos(a - gen * 0.2) * uz * 0.75, gy + Math.sin(a - gen * 0.2) * uz * 0.75, gx + Math.cos(a) * uz, gy + Math.sin(a) * uz);
      p.quadraticCurveTo(gx + Math.cos(a + gen * 0.2) * uz * 0.75, gy + Math.sin(a + gen * 0.2) * uz * 0.75, gx + Math.cos(a + gen) * 50, gy + Math.sin(a + gen) * 50);
      p.closePath();
      on(p, T.isin); altin(p, 1.5);
    }
    on(SAHNE.daireYolu(gx, gy, 50), T.gunes); altin(SAHNE.daireYolu(gx, gy, 50), 2.2);
    altin(SAHNE.daireYolu(gx, gy, 30), 1.4);
  }
  // ------------------------------------------------------------ bulutlar: renksiz guttayla dilimli bulutlar
  function bulut(bx, by, s) {
    const lob = [[-80, 8, 26], [-46, -10, 34], [0, -22, 42], [46, -8, 34], [82, 8, 24]];
    const p = new Path2D();
    const pts = [];
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      // daire birleşiminin dış sınırı (kutupsal arama)
      let rMax = 0;
      for (const [lx, ly, lr] of lob) {
        const dx = lx * s, dy = ly * s, r = lr * s, ca = Math.cos(a), sa = Math.sin(a);
        const b = dx * ca + dy * sa, c = dx * dx + dy * dy - r * r, disk = b * b - c;
        if (disk >= 0) rMax = Math.max(rMax, b + Math.sqrt(disk));
      }
      let px = bx + Math.cos(a) * rMax, py = by + Math.sin(a) * rMax;
      py = Math.min(py, by + 20 * s);
      pts.push([px, py]);
    }
    const d = SAHNE.yol(pts, true);
    on(d, T.bulut); renksiz(d, 1.6);
    // iç kıvrımlar
    for (const [lx, ly, lr] of lob.slice(1, 4)) {
      const q = [];
      for (let t = 0; t <= 1; t += 0.03) { const a = Math.PI * (1.05 + t * 0.95); q.push([bx + lx * s + Math.cos(a) * lr * s * 0.62, by + ly * s + 10 * s + Math.sin(a) * lr * s * 0.62]); }
      renksiz(SAHNE.yol(q), 1.2);
    }
    renksiz(cizgiY(bx - 70 * s, by + 8 * s, bx + 74 * s, by + 8 * s), 1.2);
  }
  bulut(165, 246, 1.0); bulut(505, 150, 0.85); bulut(870, 345, 0.72); bulut(98, 470, 0.58); bulut(680, 238, 0.42);

  // ------------------------------------------------------------ minare
  {
    const MP = SAHNE.minareParcalari(), cx = 300;
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      const d = p.tip === 'poligon' ? SAHNE.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      on(d, p.tip === 'korkuluk' ? T.korkuluk : p.tip === 'topuz' ? T.topuz : p.ad.startsWith('şerefe') || p.ad.startsWith('çıkma') || p.ad === 'bilezik' ? T.serefe : T.minare);
    }
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      const d = p.tip === 'poligon' ? SAHNE.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      altin(d, 1.8);
      if (p.tip === 'korkuluk') { const adet = 8; for (let i = 1; i < adet; i++) { const x = p.x1 + ((p.x2 - p.x1) * i) / adet; altin(cizgiY(x, p.y1, x, p.y2), 1.4); } }
    }
    on(SAHNE.yol([[cx - 34, 522], [cx + 34, 522], [cx + 34, 582], [cx - 34, 582]], true), T.zikzak);
    altin(SAHNE.yol([[cx - 34, 522], [cx + 34, 522], [cx + 34, 582], [cx - 34, 582]], true), 1.8);
    for (const z of SAHNE.zikzakCizgileri()) altin(SAHNE.yol(z), 1.6);
    // gövdede ince taş sırası çizgileri (alanları böler)
    for (const y of [640, 700, 760]) altin(cizgiY(cx - 34, y, cx + 34, y), 1.2);
    for (const y of [376]) altin(cizgiY(cx - 27, y, cx + 27, y), 1.2);
    for (const p of SAHNE.minarePencereleri) { const d = SAHNE.kemerYolu(p.x, p.y, p.w, p.h); on(d, T.pencere); altin(d, 1.5); }
    for (const d of Y.minareAlem) { on(d, T.altin); altin(d, 1.1); }
  }
  // ------------------------------------------------------------ kaide
  {
    const Kd = SAHNE.kaide;
    on(Y.kaide, T.kaide); on(Y.kornis, T.kornis);
    altin(Y.kaide, 2); altin(Y.kornis, 1.8);
    for (const x of [365, 495, 625, 755]) altin(cizgiY(x, 704, x, 800), 1.3);
    altin(cizgiY(300, 752, 330, 752), 1.2);
    for (const p of Kd.pencereler) {
      const dis = SAHNE.kemerYolu(p.x, p.y - 8, p.w + 18, p.h + 8), ic = SAHNE.kemerYolu(p.x, p.y, p.w, p.h);
      on(dis, T.kornis); altin(dis, 1.6); on(ic, T.pencere); altin(ic, 1.7);
    }
  }
  // ------------------------------------------------------------ kasnak
  {
    for (const [k, d] of [[1, Y.kasnakAlt], [0, Y.kasnakUst]]) {
      on(d, T.kasnak); altin(d, 2);
      for (const p of SAHNE.kasnakPencereleri(k)) { const pd = SAHNE.kemerYolu(p.x, p.y, p.w, p.h); on(pd, T.pencere); altin(pd, k ? 1.6 : 1.3); }
      // pencereler arası dikey bölmeler
      const ps = SAHNE.kasnakPencereleri(k), q = SAHNE.kasnak[k];
      for (let j = 0; j < ps.length - 1; j++) { const x = (ps[j].x + ps[j + 1].x) / 2; altin(cizgiY(x, q.y1, x, q.y2), 1.1); }
    }
  }
  // ------------------------------------------------------------ kubbe: 16 dilim altın kaburgalarla ayrılmış
  {
    on(SAHNE.kubbeYolu, T.kubbe);
    for (const k of SAHNE.kaburgalar(16)) altin(SAHNE.yol(k.noktalar), 1.6);
    altin(SAHNE.kubbeYolu, 2.4);
    for (const d of Y.alem) { on(d, T.altin); altin(d, 1.3); }
  }
  // ------------------------------------------------------------ zemin: dalgalı renksiz çizgilerle bölünmüş
  {
    on('M0,800 L1024,800 L1024,1024 L0,1024 Z', T.zemin);
    renksiz('M0,800 L1024,800', 1.6);
    for (const [y0, A, ph] of [[842, 10, 0.5], [900, 14, 2.1], [966, 12, 1.2]]) {
      const pts = []; for (let x = -10; x <= 1034; x += 8) pts.push([x, y0 + A * Math.sin(x / 70 + ph) + 5 * Math.sin(x / 23 + ph * 3)]);
      renksiz(SAHNE.yol(pts), 1.3);
    }
  }
  // ------------------------------------------------------------ bitkiler
  {
    const Bt = SAHNE.bitki;
    for (const s of Bt.saplar) {
      const d = SAHNE.yol(s);
      const p = new Path2D(d);
      eG.strokeStyle = `rgb(${T.sap},0,0)`; eG.lineWidth = 7; eG.stroke(p);
      aG.globalCompositeOperation = rG.globalCompositeOperation = 'destination-out'; aG.lineWidth = rG.lineWidth = 7; aG.strokeStyle = rG.strokeStyle = '#000'; aG.stroke(p); rG.stroke(p);
      aG.globalCompositeOperation = rG.globalCompositeOperation = 'source-over';
      rG.lineWidth = 8.6; rG.strokeStyle = '#fff'; rG.stroke(p);
      rG.globalCompositeOperation = 'destination-out'; rG.lineWidth = 5.4; rG.stroke(p); rG.globalCompositeOperation = 'source-over';
    }
    for (const y of Bt.yapraklar) {
      const d = SAHNE.yaprakYolu(y);
      on(d, T.yaprak); renksiz(d, 1.5);
      const [a, b] = SAHNE.yaprakDamari(y);
      renksiz(`M${a[0]},${a[1]} L${b[0]},${b[1]}`, 1.2);
    }
    for (const t of Bt.tomurcuklar) { const d = SAHNE.tomurcukYolu(t); on(d, T.tomurcuk); renksiz(d, 1.4); }
    for (const c of Bt.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) { const d = SAHNE.elipsYolu(e); on(d, T.cicek); renksiz(d, c.r > 40 ? 1.8 : 1.4); }
      const o = SAHNE.daireYolu(c.x, c.y, c.r * 0.24);
      on(o, T.cicekOrta); altin(o, c.r > 40 ? 1.8 : 1.3);
      for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2 + c.aci; const x = c.x + Math.cos(a) * c.r * 0.36, yy = c.y + Math.sin(a) * c.r * 0.36; aG.fillStyle = '#fff'; aG.beginPath(); aG.arc(x, yy, Math.max(1.1, c.r * 0.035), 0, Math.PI * 2); aG.fill(); }
    }
  }
  // ------------------------------------------------------------ şal bordürü: mor bant, altın sarmaşık ve çiçekler, turkuaz iç şerit
  const KB = 54;
  {
    const cer = new Path2D(); cer.rect(0, 0, 1024, 1024); cer.rect(KB, KB, 1024 - 2 * KB, 1024 - 2 * KB);
    aG.globalCompositeOperation = rG.globalCompositeOperation = 'destination-out';
    aG.fillStyle = rG.fillStyle = '#000'; aG.fill(cer, 'evenodd'); rG.fill(cer, 'evenodd');
    aG.globalCompositeOperation = rG.globalCompositeOperation = 'source-over';
    eG.fillStyle = `rgb(${T.kenar},0,0)`; eG.fill(cer, 'evenodd');
    const ic = new Path2D(); ic.rect(KB - 9, KB - 9, 1024 - 2 * (KB - 9), 1024 - 2 * (KB - 9)); ic.rect(KB, KB, 1024 - 2 * KB, 1024 - 2 * KB);
    eG.fillStyle = `rgb(${T.kenarIc},0,0)`; eG.fill(ic, 'evenodd');

  // ============================================================ maskeler ve alanlar
  const av = aG.getImageData(0, 0, W2, W2).data, rv = rG.getImageData(0, 0, W2, W2).data, ev = eG.getImageData(0, 0, W2, W2).data;

  // bağlı bölgeler (gutta çizgilerinin ayırdığı alanlar)
  const ETK = new Int32Array(N2).fill(-1);
  const alanlar = [];
  {
    const kuyruk = new Int32Array(N2);
    for (let s0 = 0; s0 < N2; s0++) {
      if (ETK[s0] >= 0 || GU[s0] > 0.5) continue;

      let bas = 0, son = 0; kuyruk[son++] = s0; ETK[s0] = id;
      const say = new Uint32Array(32);
      let n = 0, sx = 0, sy = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
      while (bas < son) {
        const i = kuyruk[bas++], x = i % W2, y = (i / W2) | 0;
        n++; sx += x; sy += y; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        const t = ev[i * 4]; if (t < 32 && ev[i * 4 + 1] === 0) say[t]++;
        if (x > 0) { const j = i - 1; if (ETK[j] < 0 && GU[j] <= 0.5) { ETK[j] = id; kuyruk[son++] = j; } }
        if (x < W2 - 1) { const j = i + 1; if (ETK[j] < 0 && GU[j] <= 0.5) { ETK[j] = id; kuyruk[son++] = j; } }

  // gutta şişeden sıkılır: çizgi kalınlığı yer yer değişir, kavşaklarda küçük birikintiler
  {

  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x, X = x / S, Yy = y / S;
    const a = alanlar[ETK[i]] || alanlar[0];
    // akış: alan bükülmüş gürültü (domain warp); boya ıslak ipekte kıvrılarak yayılır
    const wx = fbm(nB, X / 150 + a.r1 * 20, Yy / 150, 2) - 0.5, wy = fbm(nB, X / 150 + 40, Yy / 150 + a.r2 * 20, 2) - 0.5;
    const w = fbm(nA, X / 75 + wx * 2.6 + a.r1 * 50, Yy / 75 + wy * 2.6 + a.r2 * 50, 3);
    let d = boya(a, X, Yy, w);
    // ıslakta ince damarlar ve lekelenme
    const leke = 0.84 + 0.32 * fbm(nB, X / 30 + a.r3 * 40, Yy / 30, 3);
    // kuruma çizgileri: ıslak cephenin bıraktığı ince, koyu, dalgalı izler
    // açılmalar (auréole): ıslak cephe durduğu yerde ince koyu bir sınır bırakır, içi boyası itildiği için açılır
    const bs = a.n > 12000 ? 125 : a.n > 2500 ? 70 : 34;
    const fz = fbm(nF, X / bs + wx * 1.6 + a.r2 * 30, Yy / bs + wy * 1.6 - a.r1 * 30, 3);
    const genis = a.n > 900 && !cicekTag.has(a.tag) ? (a.tag === T.kubbe || a.tag === T.kasnak ? 0.6 : a.n > 2500 ? 1 : 0.7) : 0;
    const t1 = 0.57 + (a.r3 - 0.5) * 0.05, t2 = 0.41 - (a.r1 - 0.5) * 0.05;
    const ic1 = sstep(t1, t1 + 0.07, fz), ic2 = sstep(t2, t2 - 0.06, fz);
    const gelgit = genis * (Math.exp(-Math.pow((fz - t1) / 0.0055, 2)) * 0.4 + Math.exp(-Math.pow((fz - t2) / 0.005, 2)) * 0.22);
    let k = leke * (1 + 0.42 * Math.min(1, YAKIN[i] * 1.4) + gelgit) * (1 - genis * (0.24 * ic1 + 0.14 * ic2));
    const tz = TUZ[i];
    k *= (1 - tz) * (1 + TUZK[i] * 0.9);
    let r = ipek[0] * Math.exp(-d[0] * k), g = ipek[1] * Math.exp(-d[1] * k), b = ipek[2] * Math.exp(-d[2] * k);
    // ipek parlaklığı: düşük frekanslı germe dalgası + çok ince örgü
    const sh = fbm(nC, X / 260, Yy / 340, 3), shx = fbm(nC, (X + 3) / 260, Yy / 340, 3) - sh, shy = fbm(nC, X / 260, (Yy + 3) / 340, 3) - sh;
    const bandX = (X - Yy * 0.75) - 150 + (sh - 0.5) * 260;
    const band = 0.35 * Math.exp(-Math.pow(bandX / 55, 2)) + 1.25 * Math.exp(-Math.pow(((X - Yy * 0.75) - 150 + (sh - 0.5) * 260) / 120, 2)) + 0.8 * Math.exp(-Math.pow(((X - Yy * 0.75) + 330 + (sh - 0.5) * 200) / 80, 2));
    // lif yönünde ince parıltı (atkı ipliklerinin anizotrop yansıması)
    const lifP = (nE(X / 220 + (sh - 0.5) * 3, Yy * 0.7) - 0.5) * 0.028 + (nD(X / 70, Yy * 0.45 + 7) - 0.5) * 0.02;
    const parla = Math.pow(clamp(0.5 + (shx * LV2[0] - shy * LV2[1]) * 40, 0, 1), 3) * 0.18 + 0.2 * band + 0.06 * Math.max(0, Math.sin((X + Yy * 0.4) / 160 + sh * 4)) + lifP * (0.5 + band);
    const orgu = 0.98 + 0.02 * ((y % 3 === 0 ? -1 : 0.5) + (x % 4 === 0 ? -0.6 : 0.3));
    const pz = clamp(parla, -0.05, 0.45); r = (r + (255 - r) * pz) * orgu; g = (g + (255 - g) * pz) * orgu; b = (b + (255 - b) * pz) * orgu;
    // renksiz gutta: boyanmamış ipek, hafif kabarık ve parlak
    const gr = GR[i];
    if (gr > 0.01) {
      const ex = HR[Math.min(N2 - 1, i + 1)] - HR[Math.max(0, i - 1)], ey = HR[Math.min(N2 - 1, i + W2)] - HR[Math.max(0, i - W2)];
      const ds = clamp(0.92 + (ex * LV2[0] - ey * LV2[1]) * 0.9, 0.75, 1.1);
      const ur = 246 * ds, ug = 243 * ds, ub = 238 * ds;
      r += (ur - r) * gr; g += (ug - g) * gr; b += (ub - b) * gr;
    }
    // altın gutta: yükseklik alanının eğiminden metal ışık
    const ga = GA[i];
    if (ga > 0.01) {
      const ex = (HA[Math.min(N2 - 1, i + 1)] - HA[Math.max(0, i - 1)]) * 2.2, ey = (HA[Math.min(N2 - 1, i + W2)] - HA[Math.max(0, i - W2)]) * 2.2;
      const nx = -ex, ny = -ey, nz = 0.6, nl = Math.hypot(nx, ny, nz);
      const dif = Math.max(0, (nx * LV2[0] + ny * LV2[1] + nz * LV2[2]) / nl);
      const spe = Math.pow(Math.max(0, (nx * HV[0] + ny * HV[1] + nz * HV[2]) / nl), 28);
      const t = clamp(dif * 1.15, 0, 1);
      const mr = (altinR[0] * 0.5 + (altinA[0] - altinR[0] * 0.5) * t) + spe * 120, mg = (altinR[1] * 0.5 + (altinA[1] - altinR[1] * 0.5) * t) + spe * 110, mb = (altinR[2] * 0.5 + (altinA[2] - altinR[2] * 0.5) * t) + spe * 80;
      const gl = (0.9 + 0.2 * nD(X * 1.3, Yy * 1.3));
      r += (mr * gl - r) * ga; g += (mg * gl - g) * ga; b += (mb * gl - b) * ga;
    }
    o[i * 4] = clamp(r, 0, 255); o[i * 4 + 1] = clamp(g, 0, 255); o[i * 4 + 2] = clamp(b, 0, 255); o[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
