<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-039 Havuz Aksi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #1f4a4a; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-039 Havuz Aksi — sahne yalnızca avludaki durgun havuzun suyunda, havuz kenarından eğik bakılınca görünen
// ters aksiyle gösterilir. Aks, yumuşak boyalı bir sahnenin (kendi çizimimiz) suda kırılmış hâlidir: dalga
// yüzeyinin eğimi aksi dikeyde kaydırır ve sıvazlar, uzaktaki dalgalar incelir (perspektif), yüzen yaprakların
// çevresinde elips dalgacıklar açılır, güneşin aksi dalga eğimiyle pırıltılara bölünür. Yakında aks zayıflar,
// suyun içinden havuzun çini dibi görünür. Üstte ve altta oyma mermer havuz kenarı ve ince kakma bant.
(function () {
  const OL = 2;
  const W = 1024;
  const S2 = W * OL;
  const cv = document.getElementById('tuval');
  const ctx = SAHNE.tuval(cv, OL);
  const r = SAHNE.rng(39);
  const SU_UST = 84, SU_ALT = 940; // suyun görünen kısmı
  const KAY = 960; // aks: sahne y → Y = KAY - y

  // ------------------------------------------------------------ gürültü
  function hash2(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s, o) {
    let t = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2; }
    return t / n;
  }
  const sinir = (v, a, b) => Math.max(a, Math.min(b, v));
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // ------------------------------------------------------------ 1) yansıyan sahne: yumuşak, boyalı bir çizim (ekran dışı, 2048)
  // Aks kusursuz bir ayna görüntüsü değildir: kenarlar yumuşak, tonlar sıcak ve boyalı; ayrıntı az ama ışık doğru.
  const sahne = SAHNE.yeniTuval(S2, S2);
  (function () {
    const g = sahne.getContext('2d');
    g.setTransform(OL, 0, 0, OL, 0, 0);
    const P = (d) => new Path2D(d);
    const yatay = (x1, x2, duraklar) => {
      const gr = g.createLinearGradient(x1, 0, x2, 0);
      duraklar.forEach(([t, c]) => gr.addColorStop(t, c));
      return gr;
    };
    // gök: suda biraz koyulaşan doygun mavi; ufukta sıcak açıklık
    let gr = g.createLinearGradient(0, 0, 0, 800);
    gr.addColorStop(0, '#4D86C4');
    gr.addColorStop(0.5, '#86B5DE');
    gr.addColorStop(0.85, '#C9DCE2');
    gr.addColorStop(1, '#EDE6D2');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, W);
    // güneş: küçük, çok parlak bir çekirdek ve geniş ışıltı (suda pırıltılara bölünecek)
    gr = g.createRadialGradient(880, 140, 4, 880, 140, 320);
    gr.addColorStop(0, 'rgba(255,252,240,1)');
    gr.addColorStop(0.08, 'rgba(255,246,222,0.9)');
    gr.addColorStop(0.3, 'rgba(255,238,206,0.38)');
    gr.addColorStop(1, 'rgba(255,238,206,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, W);
    g.fillStyle = '#FFFFFA';
    g.beginPath();
    g.arc(880, 140, 15, 0, Math.PI * 2);
    g.fill();
    // bulutlar: yumuşak, üstü aydınlık altı gölgeli öbekler
    const rb = SAHNE.rng(11);
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7], [380, 60, 0.9]]) {
      for (let i = 0; i < 22; i++) {
        const x = bx + (rb() - 0.5) * 180 * bs, y = by + (rb() - 0.5) * 30 * bs, rr = (20 + rb() * 30) * bs;
        const c = g.createRadialGradient(x + rr * 0.15, y - rr * 0.25, 0, x, y, rr);
        c.addColorStop(0, 'rgba(255,255,252,0.5)');
        c.addColorStop(0.6, 'rgba(236,240,246,0.22)');
        c.addColorStop(1, 'rgba(220,228,240,0)');
        g.fillStyle = c;
        g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
      }
    }
    // yer
    gr = g.createLinearGradient(0, 800, 0, W);
    gr.addColorStop(0, '#D2C3A0');
    gr.addColorStop(1, '#B5A27E');
    g.fillStyle = gr;
    g.fillRect(0, 798, W, W - 798);

    // minare: silindir gölgesi (sol koyu, sağ aydınlık), şerefe altlarında gölge
    const tas = (x1, x2) => yatay(x1, x2, [[0, '#A39272'], [0.3, '#D3C6A8'], [0.68, '#F7F1E2'], [0.9, '#EDE4CF'], [1, '#C9BB9A']]);
    for (const q of SAHNE.minareParcalari()) {
      if (q.tip === 'alem') continue;
      if (q.tip === 'bant') {
        g.strokeStyle = 'rgba(120,104,80,0.75)';
        g.lineWidth = 3;
        g.lineJoin = 'round';
        for (const z of SAHNE.zikzakCizgileri()) g.stroke(P(SAHNE.yol(z)));
        continue;
      }
      let d, x1, x2;
      if (q.tip === 'poligon') {
        d = SAHNE.yol(q.noktalar, true);
        x1 = Math.min(...q.noktalar.map((u) => u[0]));
        x2 = Math.max(...q.noktalar.map((u) => u[0]));
      } else if (q.tip === 'topuz') {
        d = q.yol; x1 = 266; x2 = 334;
      } else {
        d = SAHNE.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true);
        x1 = q.x1; x2 = q.x2;
      }
      g.fillStyle = tas(x1, x2);
      g.fill(P(d));
      if (q.tip === 'korkuluk') {
        g.fillStyle = 'rgba(96,82,60,0.4)';
        for (let i = 0; i < 9; i++) g.fillRect(q.x1 + 5 + ((q.x2 - q.x1 - 10) * (i + 0.5)) / 9 - 2, q.y1 + 4, 4, q.y2 - q.y1 - 8);
      }
      if (q.ad.startsWith('şerefe')) {
        g.fillStyle = 'rgba(70,58,40,0.35)';
        g.fillRect(x1, q.noktalar[2][1], x2 - x1, 5);
      }
    }
    for (const q of SAHNE.minarePencereleri) {
      g.fillStyle = '#6F6552';
      g.fill(P(SAHNE.kemerYolu(q.x, q.y, q.w, q.h)));
    }
    // altın alemler
    const alem = (a) => {
      const ys = [
        SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
        SAHNE.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true),
        ...a.kureler.map((k) => SAHNE.daireYolu(k.cx, k.cy, k.r)),
        SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R),
      ];
      const x1 = a.yaka.cx - a.yaka.rx, x2 = a.yaka.cx + a.yaka.rx;
      g.fillStyle = yatay(x1, x2, [[0, '#8C6A1C'], [0.55, '#D2AA40'], [0.8, '#F6DE86'], [1, '#C9A23A']]);
      for (const d of ys) g.fill(P(d));
    };
    alem(SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem);

    // kaide
    const K = SAHNE.kaide;
    g.fillStyle = yatay(K.x1, K.x2, [[0, '#C6B896'], [0.45, '#EAE1CC'], [1, '#FBF6EA']]);
    g.fillRect(K.x1, K.y1, K.x2 - K.x1, K.y2 - K.y1);
    g.fillStyle = yatay(K.kornis.x1, K.kornis.x2, [[0, '#E2D8C0'], [1, '#FFFCF2']]);
    g.fillRect(K.kornis.x1, K.kornis.y1, K.kornis.x2 - K.kornis.x1, K.kornis.y2 - K.kornis.y1);
    gr = g.createLinearGradient(0, K.y1, 0, K.y1 + 12);
    gr.addColorStop(0, 'rgba(100,86,60,0.45)');
    gr.addColorStop(1, 'rgba(100,86,60,0)');
    g.fillStyle = gr;
    g.fillRect(K.x1, K.y1, K.x2 - K.x1, 12);
    for (const q of K.pencereler) {
      g.fillStyle = '#7B705C';
      g.fill(P(SAHNE.kemerYolu(q.x, q.y, q.w, q.h)));
    }
    // kasnak: yeşil silindirler
    for (let k = 1; k >= 0; k--) {
      const q = SAHNE.kasnak[k];
      g.fillStyle = yatay(q.x1, q.x2, [[0, '#17461F'], [0.4, '#2C7536'], [0.76, '#62AE66'], [0.93, '#3B8A45'], [1, '#22612C']]);
      g.fillRect(q.x1, q.y1, q.x2 - q.x1, q.y2 - q.y1);
      g.fillStyle = 'rgba(255,255,255,0.2)';
      g.fillRect(q.x1, q.y1, q.x2 - q.x1, 3);
      g.fillStyle = 'rgba(0,0,0,0.22)';
      g.fillRect(q.x1, q.y2 - 4, q.x2 - q.x1, 4);
      for (const w of SAHNE.kasnakPencereleri(k)) {
        g.fillStyle = '#123517';
        g.fill(P(SAHNE.kemerYolu(w.x, w.y, w.w, w.h)));
      }
    }
    // kubbe: ışığı sağ üstten alan küre, yumuşak kaburgalar, parlak alın
    const kubbe = P(SAHNE.kubbeYolu);
    gr = g.createRadialGradient(650, 380, 10, 590, 430, 320);
    gr.addColorStop(0, '#78C077');
    gr.addColorStop(0.35, '#3F9248');
    gr.addColorStop(0.75, '#256A30');
    gr.addColorStop(1, '#143E1B');
    g.fillStyle = gr;
    g.fill(kubbe);
    g.save();
    g.clip(kubbe);
    for (const k of SAHNE.kaburgalar(16)) {
      const d = P(SAHNE.yol(k.noktalar));
      g.lineWidth = 2.4;
      g.strokeStyle = 'rgba(8,36,14,0.32)';
      g.stroke(d);
      g.save();
      g.translate(2, 0);
      g.lineWidth = 1.6;
      g.strokeStyle = 'rgba(190,240,180,0.2)';
      g.stroke(d);
      g.restore();
    }
    gr = g.createRadialGradient(655, 375, 0, 655, 375, 90);
    gr.addColorStop(0, 'rgba(220,255,210,0.35)');
    gr.addColorStop(1, 'rgba(220,255,210,0)');
    g.fillStyle = gr;
    g.fillRect(540, 280, 240, 200);
    g.restore();
    alem(SAHNE.alemParcalari(560, 300, 1));

    // bitkiler (havuzun uzak kıyısında): koyu yapraklar, beyaz çiçekler, pembe tomurcuklar
    const B = SAHNE.bitki;
    g.lineCap = 'round';
    g.lineWidth = 4;
    g.strokeStyle = '#4C6B3C';
    for (const st of B.saplar) g.stroke(P(SAHNE.yol(st)));
    for (const y of B.yapraklar) {
      const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const yg = g.createLinearGradient(y.x - sa * 10, y.y + ca * 10, y.x + sa * 10, y.y - ca * 10);
      const koyu = y.uzunluk > 50;
      yg.addColorStop(0, koyu ? '#2F4F2A' : '#4B6E3D');
      yg.addColorStop(1, koyu ? '#5D8650' : '#7FA368');
      g.fillStyle = yg;
      g.fill(P(SAHNE.yaprakYolu(y)));
    }
    for (const t of B.tomurcuklar) {
      g.fillStyle = '#EBB3C2';
      g.fill(P(SAHNE.tomurcukYolu(t)));
    }
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const cg = g.createRadialGradient(c.x, c.y, c.r * 0.1, c.x, c.y, c.r * 1.05);
        cg.addColorStop(0, '#FBEFF2');
        cg.addColorStop(0.7, '#FFFFFF');
        cg.addColorStop(1, '#F1D2DA');
        g.fillStyle = cg;
        g.fill(P(SAHNE.elipsYolu(e)));
      }
      g.fillStyle = '#E2B13E';
      g.beginPath();
      g.arc(c.x, c.y, c.r * 0.2, 0, Math.PI * 2);
      g.fill();
    }
  })();
  // boyalı yumuşaklık: kenarları eritir; üstüne yatay fırça izi gibi hafif ton dalgalanması
  const yumusak = SAHNE.yeniTuval(S2, S2);
  (function () {
    const g = yumusak.getContext('2d', { willReadFrequently: true });
    g.filter = 'blur(4.6px)';
    g.drawImage(sahne, 0, 0);
    g.filter = 'none';
    const k = SAHNE.yeniTuval(512, 512);
    const kg = k.getContext('2d');
    const im = kg.createImageData(512, 512);
    for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
      const v = 128 + (fbm(x / 40, y / 3, 81, 3) - 0.5) * 90;
      const o = (y * 512 + x) * 4;
      im.data[o] = im.data[o + 1] = im.data[o + 2] = v;
      im.data[o + 3] = 255;
    }
    kg.putImageData(im, 0, 0);
    g.globalCompositeOperation = 'soft-light';
    g.globalAlpha = 0.5;
    g.drawImage(k, 0, 0, S2, S2);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  })();
  const SV = yumusak.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, S2, S2).data;

  // ------------------------------------------------------------ 2) su yüzü modeli: eğik bakış, perspektif, dalgalar
  // p(Y): perspektif ölçeği (uzak kıyı 0,5 → yakın kıyı 1); F: dikey kısalma (eğik bakış).
  // Dalgalar yer düzleminde (U, V) tanımlanır; ekranda uzakta incelir, halkalar elips olur.
  const F = 0.6;
  const PB = 0.5 / (SU_ALT - SU_UST);
  const pY = (Y) => 0.5 + PB * (Y - SU_UST);
  const V_ = (Y) => Math.log(pY(Y)) / (PB * F);
  const U_ = (X, Y) => (X - 512) / pY(Y);
  const DALGALAR = [
    [34, 92, 1.0], [21, 78, 0.6], [13, 104, 0.34], [56, 70, 0.8], [9, 86, 0.16], [11, 32, 0.12], [15, 148, 0.14],
  ].map(([lam, aci, A], i) => {
    const k = (2 * Math.PI) / lam, a = (aci * Math.PI) / 180;
    return { ku: k * Math.cos(a), kv: k * Math.sin(a), A, ev: i * 1.7 };
  });
  const AMP = 0.55;
  // yüzen şeyler (ekran konumu); çevrelerinde dalgacık halkaları
  const yuzenler = [
    { t: 'yaprak', x: 148, y: 312, s: 32, a: 0.6, renk: [214, 92, 118] },
    { t: 'yaprak', x: 196, y: 332, s: 26, a: 2.3, renk: [250, 236, 236] },
    { t: 'yuvarlak', x: 826, y: 196, s: 40, a: 0.4 },
    { t: 'yaprak', x: 884, y: 252, s: 27, a: -1.2, renk: [230, 130, 150] },
    { t: 'yaprak', x: 742, y: 700, s: 30, a: 1.9, renk: [252, 240, 238] },
    { t: 'yuvarlak', x: 112, y: 690, s: 35, a: 2.6 },
    { t: 'yaprak', x: 158, y: 726, s: 23, a: -0.4, renk: [206, 84, 112] },
    { t: 'yaprak', x: 436, y: 846, s: 28, a: 2.9, renk: [236, 150, 168] },
    { t: 'yuvarlak', x: 948, y: 612, s: 30, a: 1.3 },
    { t: 'yaprak', x: 640, y: 900, s: 24, a: 0.9, renk: [252, 244, 240] },
    { t: 'yaprak', x: 300, y: 214, s: 22, a: -2.0, renk: [224, 112, 136] },
    { t: 'yuvarlak', x: 214, y: 872, s: 39, a: -0.9 },
    { t: 'yaprak', x: 268, y: 904, s: 27, a: 0.3, renk: [246, 226, 228] },
    { t: 'yaprak', x: 96, y: 820, s: 24, a: 1.4, renk: [220, 104, 128] },
  ];
  const halkalar = yuzenler.map((o, i) => ({ x: o.x, y: o.y, r0: o.s * 1.0, A: 0.75 + (i % 3) * 0.15, lam: 8.5 + (i % 2) * 1.5 }));
  halkalar.push({ x: 560, y: 470, r0: 4, A: 0.7, lam: 9 }); // kubbenin aksine düşen tek bir damla
  halkalar.push({ x: 600, y: 790, r0: 3, A: 0.55, lam: 8 });
  for (const h of halkalar) { h.U = U_(h.x, h.y); h.V = V_(h.y); }

  // ------------------------------------------------------------ 3) piksel piksel: ters çevir, dalgayla kaydır, suyla boya
  const su = SAHNE.yeniTuval(S2, S2);
  let parlakMaske = null;
  (function () {
    const g = su.getContext('2d');
    const im = g.createImageData(S2, S2);
    const d = im.data;
    const pm = new Float32Array(S2 * S2);
    // kaba ızgarada: sakin / dalgalı yamalar ve evre bükümü
    const G = 16, GN = S2 / G + 2;
    const sakin = new Float32Array(GN * GN), buk = new Float32Array(GN * GN), buk2 = new Float32Array(GN * GN);
    for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) {
      const X = (i * G) / OL, Y = Math.max(SU_UST, (j * G) / OL);
      const U = U_(X, Y), V = V_(Y);
      const n = fbm(U / 300 + 3, V / 190, 21, 3);
      sakin[j * GN + i] = 0.22 + 0.78 * Math.pow(sinir((n - 0.3) * 2.6, 0, 1), 1.2);
      buk[j * GN + i] = (fbm(U / 170, V / 110, 23, 3) - 0.5) * 7;
      buk2[j * GN + i] = (fbm(U / 90 + 9, V / 60, 24, 2) - 0.5) * 5;
    }
    const izgara = (arr, px, py) => {
      const gx = px / G, gy = py / G;
      const i = Math.floor(gx), j = Math.floor(gy);
      const fx = gx - i, fy = gy - j;
      const a = arr[j * GN + i], b = arr[j * GN + i + 1], c = arr[(j + 1) * GN + i], e = arr[(j + 1) * GN + i + 1];
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + e) * fx * fy;
    };
    const DIKEY = [[-3, 0.08], [-2, 0.12], [-1, 0.18], [0, 0.24], [1, 0.18], [2, 0.12], [3, 0.08]]; // aksin dikey sıvazlaması
    const ornek = (sx, sy, out, wt) => {
      const x0 = sinir(Math.floor(sx), 0, S2 - 2), y0 = sinir(Math.floor(sy), 0, S2 - 2);
      const fx = sinir(sx - x0, 0, 1), fy = sinir(sy - y0, 0, 1);
      const p00 = (y0 * S2 + x0) * 4, p10 = p00 + 4, p01 = p00 + S2 * 4, p11 = p01 + 4;
      const w00 = (1 - fx) * (1 - fy) * wt, w10 = fx * (1 - fy) * wt, w01 = (1 - fx) * fy * wt, w11 = fx * fy * wt;
      out[0] += SV[p00] * w00 + SV[p10] * w10 + SV[p01] * w01 + SV[p11] * w11;
      out[1] += SV[p00 + 1] * w00 + SV[p10 + 1] * w10 + SV[p01 + 1] * w01 + SV[p11 + 1] * w11;
      out[2] += SV[p00 + 2] * w00 + SV[p10 + 2] * w10 + SV[p01 + 2] * w01 + SV[p11 + 2] * w11;
    };
    const top = [0, 0, 0];
    const GX = 880, GY = KAY - 140; // güneşin aksinin yeri
    for (let j = SU_UST * OL - 4; j < SU_ALT * OL + 4; j++) {
      const Y = Math.max(SU_UST, j / OL);
      const p = pY(Y), V = V_(Y);
      const yakin = (Y - SU_UST) / (SU_ALT - SU_UST); // 0 uzak, 1 yakın
      const yansima = 0.94 - 0.36 * yakin; // Fresnel: yakında aks zayıflar
      for (let i = 0; i < S2; i++) {
        const X = i / OL;
        const U = (X - 512) / p;
        const m = izgara(sakin, i, j) * AMP;
        const b1 = izgara(buk, i, j), b2 = izgara(buk2, i, j);
        let su_ = 0, sv = 0;
        for (let w = 0; w < DALGALAR.length; w++) {
          const q = DALGALAR[w];
          const c = Math.cos(q.ku * U + q.kv * V + q.ev + (w < 4 ? b1 : b2));
          su_ += q.A * q.ku * c;
          sv += q.A * q.kv * c;
        }
        su_ *= m;
        sv *= m;
        for (const h of halkalar) {
          const eu = U - h.U, ev = V - h.V;
          if (Math.abs(eu) > h.r0 + 80 || Math.abs(ev) > h.r0 + 80) continue;
          const uz = Math.hypot(eu, ev);
          if (uz < 0.5) continue;
          const zarf = Math.exp(-Math.pow((uz - h.r0 - 22) / 24, 2));
          const k = (2 * Math.PI) / h.lam;
          const e = h.A * zarf * k * Math.cos((uz - h.r0) * k);
          su_ += (eu / uz) * e;
          sv += (ev / uz) * e;
        }
        // eğim aksi kaydırır: dikeyde çok, yatayda az; uzakta küçülür
        const dyS = 58 * sv * p, dxS = 16 * su_ * p;
        top[0] = top[1] = top[2] = 0;
        const sx = (X + dxS) * OL;
        for (const [oy, wt] of DIKEY) ornek(sx, (KAY - Y + dyS + oy * p * 2.2) * OL, top, wt);
        // dalga yüzü gölgesi: göğe bakan yüz açık, öbürü koyu
        const yuz = 1 - 0.55 * sv * (0.6 + 0.4 * yakin);
        let R = top[0] * yuz, Gc = top[1] * yuz, B = top[2] * yuz;
        // suyun rengi: aks hafif koyulaşır, deniz yeşiline çalar
        R *= 0.74; Gc *= 0.85; B *= 0.89;
        // havuz dibi (yakında görünür): çini ızgarası, kırılmayla titrer
        const du = U + su_ * 30, dv = V * F + sv * 30;
        const cu = Math.abs(((du / 64) % 1 + 1) % 1 - 0.5), cvv = Math.abs(((dv / 64) % 1 + 1) % 1 - 0.5);
        const derz = Math.max(Math.exp(-Math.pow((0.5 - cu) * 64 / 2.2, 2)), Math.exp(-Math.pow((0.5 - cvv) * 64 / 2.2, 2)));
        const yild = Math.exp(-((cu * cu + cvv * cvv) * 64 * 64) / 90); // derz kesişiminde küçük koyu yıldız yerine yuvarlak
        const dip = [30 + 26 * (1 - yakin), 104 - 10 * derz, 108 - 8 * derz];
        dip[0] -= 14 * derz + 10 * yild; dip[1] -= 10 * yild; dip[2] -= 6 * yild;
        const derin = karis([16, 62, 66], dip, 0.25 + 0.75 * yakin);
        R = R * yansima + derin[0] * (1 - yansima);
        Gc = Gc * yansima + derin[1] * (1 - yansima);
        B = B * yansima + derin[2] * (1 - yansima);
        // güneş pırıltısı: dalga eğimi güneşi tam bu noktaya yansıtıyorsa
        const zarfG = Math.exp(-Math.pow((X - GX) / 150, 2) - Math.pow((Y - GY) / 95, 2));
        let pir = 0;
        if (zarfG > 0.02) {
          const hv = sv * 420 - (Y - GY), hu = su_ * 420 - (X - GX) * 0.9;
          pir = zarfG * Math.exp(-(hv * hv) / 60 - (hu * hu) / 900);
          R += (255 - R) * pir; Gc += (252 - Gc) * pir; B += (238 - B) * pir;
        }
        const o = (j * S2 + i) * 4;
        d[o] = R; d[o + 1] = Gc; d[o + 2] = B; d[o + 3] = 255;
        pm[j * S2 + i] = pir;
      }
    }
    g.putImageData(im, 0, 0);
    parlakMaske = pm;
  })();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(su, 0, 0);
  // pırıltıların ışık taşması
  (function () {
    const k = SAHNE.yeniTuval(S2, S2);
    const g = k.getContext('2d');
    const im = g.createImageData(S2, S2);
    for (let i = 0; i < S2 * S2; i++) {
      const v = Math.min(1, parlakMaske[i] * 1.4);
      if (v < 0.05) continue;
      im.data[i * 4] = 255; im.data[i * 4 + 1] = 250; im.data[i * 4 + 2] = 228; im.data[i * 4 + 3] = v * 255;
    }
    g.putImageData(im, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const [b, a] of [[3, 0.5], [12, 0.35], [40, 0.25]]) {
      ctx.filter = `blur(${b}px)`;
      ctx.globalAlpha = a;
      ctx.drawImage(k, 0, 0);
    }
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  })();
  ctx.setTransform(OL, 0, 0, OL, 0, 0);

  // ------------------------------------------------------------ 4) havuz dibine düşen ışık ağı (yakında, suyun içinden)
  (function () {
    const k = SAHNE.yeniTuval(W / 2, W / 2);
    const g = k.getContext('2d');
    const im = g.createImageData(W / 2, W / 2);
    const d = im.data;
    for (let y = 0; y < W / 2; y++) {
      const Y = y * 2;
      if (Y < SU_UST || Y > SU_ALT) continue;
      const p = pY(Y), V = V_(Y) * F;
      const yakin = (Y - SU_UST) / (SU_ALT - SU_UST);
      for (let x = 0; x < W / 2; x++) {
        const U = (x * 2 - 512) / p;
        const n1 = fbm(U / 46, V / 46, 31, 3), n2 = fbm(U / 46 + 7, V / 46 + 3, 32, 3);
        const ag = Math.pow(1 - Math.abs(Math.sin((n1 - n2) * 18)), 14);
        const o = (y * (W / 2) + x) * 4;
        d[o] = 200; d[o + 1] = 255; d[o + 2] = 236; d[o + 3] = ag * yakin * yakin * 30;
      }
    }
    g.putImageData(im, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(0.8px)';
    ctx.drawImage(k, 0, 0, W, W);
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';
  })();

  // ------------------------------------------------------------ 5) su yüzü: yüzen yapraklar (eğik bakışla kısalmış)
  const yaprakYolu = (L, Wd) => {
    const p = (u, v) => `${(u * L - L * 0.5).toFixed(2)},${(v * Wd).toFixed(2)}`;
    return new Path2D(
      `M${p(0, 0)} C${p(0.16, -0.3)} ${p(0.36, -0.5)} ${p(0.62, -0.5)} C${p(0.88, -0.5)} ${p(1.0, -0.34)} ${p(1.0, -0.15)} ` +
        `C${p(1.0, -0.06)} ${p(0.965, -0.02)} ${p(0.91, 0)} C${p(0.965, 0.02)} ${p(1.0, 0.06)} ${p(1.0, 0.15)} ` +
        `C${p(1.0, 0.34)} ${p(0.88, 0.5)} ${p(0.62, 0.5)} C${p(0.36, 0.5)} ${p(0.16, 0.3)} ${p(0, 0)} Z`
    );
  };
  function yerlestir(o) {
    // yüzey düzlemine yatır: önce döndür, sonra dikeyde kısalt; uzaktakiler küçük
    const p = pY(o.y);
    ctx.setTransform(OL * p, 0, 0, OL * p * F, OL * o.x, OL * o.y);
    ctx.rotate(o.a);
  }
  for (const o of yuzenler) {
    const p = pY(o.y);
    // suya değen yerde koyu, yumuşak bir hale (yaprağın altındaki gölgeli su)
    ctx.setTransform(OL, 0, 0, OL, 0, 0);
    ctx.save();
    ctx.filter = 'blur(3px)';
    yerlestir(o);
    ctx.translate(-3, 4);
    ctx.fillStyle = 'rgba(4,28,30,0.42)';
    if (o.t === 'yaprak') ctx.fill(yaprakYolu(o.s * 1.3, o.s * 1.05));
    else { ctx.beginPath(); ctx.arc(0, 0, o.s * 1.04, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    ctx.filter = 'none';
    ctx.save();
    yerlestir(o);
    if (o.t === 'yaprak') {
      const L = o.s * 1.25, Wd = o.s;
      const pth = yaprakYolu(L, Wd);
      const c = o.renk;
      const g = ctx.createLinearGradient(-L * 0.5, 0, L * 0.5, 0);
      g.addColorStop(0, `rgb(${c[0] * 0.72},${c[1] * 0.62},${c[2] * 0.66})`);
      g.addColorStop(0.45, `rgb(${c[0]},${c[1]},${c[2]})`);
      g.addColorStop(1, `rgb(${Math.min(255, c[0] + 22)},${Math.min(255, c[1] + 26)},${Math.min(255, c[2] + 24)})`);
      ctx.fillStyle = g;
      ctx.fill(pth);
      ctx.save();
      ctx.clip(pth);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2.4;
      ctx.stroke(pth);
      ctx.strokeStyle = `rgba(${c[0] * 0.5},${c[1] * 0.4},${c[2] * 0.45},0.35)`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(-L * 0.42, 0);
      ctx.lineTo(L * 0.22, 0);
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(80,30,40,0.3)';
      ctx.lineWidth = 0.7;
      ctx.stroke(pth);
    } else {
      // yuvarlak nilüfer yaprağı: çentikli, damarlı, kenarı hafif kalkık
      const R = o.s;
      const pth = new Path2D();
      pth.moveTo(0, 0);
      pth.arc(0, 0, R, 0.16, Math.PI * 2 - 0.16);
      pth.closePath();
      const g = ctx.createRadialGradient(R * 0.3, -R * 0.3, R * 0.1, 0, 0, R);
      g.addColorStop(0, '#93BE6E');
      g.addColorStop(0.7, '#4F8A44');
      g.addColorStop(1, '#2F6432');
      ctx.fillStyle = g;
      ctx.fill(pth);
      ctx.save();
      ctx.clip(pth);
      ctx.strokeStyle = 'rgba(210,240,180,0.35)';
      ctx.lineWidth = 0.9;
      for (let k = 1; k < 12; k++) {
        const a = 0.16 + ((Math.PI * 2 - 0.32) * k) / 12;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(Math.cos(a + 0.1) * R * 0.5, Math.sin(a + 0.1) * R * 0.5, Math.cos(a) * R * 0.96, Math.sin(a) * R * 0.96);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(230,255,200,0.45)';
      ctx.lineWidth = 2.2;
      ctx.stroke(pth);
      ctx.restore();
      ctx.strokeStyle = 'rgba(20,50,20,0.5)';
      ctx.lineWidth = 0.8;
      ctx.stroke(pth);
    }
    ctx.restore();
  }
  ctx.setTransform(OL, 0, 0, OL, 0, 0);

  // ------------------------------------------------------------ 7) mermer havuz kenarı (üst ve alt), kakma bant
  const mermer = SAHNE.yeniTuval(W, W);
  (function () {
    const g = mermer.getContext('2d');
    const im = g.createImageData(W, W);
    const d = im.data;
    for (let y = 0; y < W; y++) {
      if (y > SU_UST + 2 && y < SU_ALT - 2) continue;
      for (let x = 0; x < W; x++) {
        const t = Math.sin((x * 0.006 + y * 0.013) * Math.PI * 2 + 7 * fbm(x / 170, y / 120, 41, 5));
        const damar = Math.pow(1 - Math.min(1, Math.abs(t) / 0.11), 2.2) * 0.32;
        const t2 = Math.sin((x * 0.011 - y * 0.007) * Math.PI * 2 + 5 * fbm(x / 90, y / 90, 43, 4));
        const damar2 = Math.pow(1 - Math.min(1, Math.abs(t2) / 0.06), 2.2) * 0.14;
        const bulut = fbm(x / 50, y / 50, 44, 4) - 0.5;
        const v = 1 - damar - damar2 + bulut * 0.06;
        const o = (y * W + x) * 4;
        d[o] = 240 * v - damar * 30;
        d[o + 1] = 236 * v - damar * 26;
        d[o + 2] = 228 * v - damar * 18;
        d[o + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
    g.filter = 'blur(0.6px)';
    g.drawImage(mermer, 0, 0);
    g.filter = 'none';
  })();
  function kenar(ust) {
    // ust: üst kenar mı (suya aşağı doğru iner) yoksa alt kenar mı
    const y0 = ust ? 0 : SU_ALT, y1 = ust ? SU_UST : W;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y0, W, y1 - y0);
    ctx.clip();
    ctx.drawImage(mermer, 0, 0, W, W);
    // profil: dış basamak, yassı üst yüz, oyma oluk, yuvarlatılmış ağız
    const yy = (u) => (ust ? u : W - u); // dış kenardan suya doğru uzaklık u
    const bant = (u1, u2, renkler) => {
      const a = yy(u1), b = yy(u2);
      const g = ctx.createLinearGradient(0, a, 0, b);
      renkler.forEach(([t, c]) => g.addColorStop(t, c));
      ctx.fillStyle = g;
      ctx.fillRect(0, Math.min(a, b), W, Math.abs(b - a));
    };
    bant(0, 6, [[0, 'rgba(60,52,44,0.55)'], [1, 'rgba(60,52,44,0.0)']]);
    // yuvarlatılmış ağız (bullnose): üst kenarda ışıktan uzağa, alt kenarda ışığa bakar
    if (ust) bant(56, SU_UST, [[0, 'rgba(255,255,255,0.35)'], [0.18, 'rgba(255,255,255,0.12)'], [0.55, 'rgba(70,64,56,0.18)'], [1, 'rgba(36,32,26,0.62)']]);
    else bant(56, W - SU_ALT, [[0, 'rgba(80,70,60,0.3)'], [0.3, 'rgba(255,255,255,0.0)'], [0.72, 'rgba(255,255,250,0.5)'], [1, 'rgba(200,196,186,0.2)']]);
    // ince pervaz çizgileri (oyma basamaklar)
    for (const u of [9, 45]) {
      const yl = yy(u);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(0, yl - (ust ? 0 : 1.2), W, 1.2);
      ctx.fillStyle = 'rgba(80,70,60,0.35)';
      ctx.fillRect(0, yl + (ust ? 1.2 : -2.4), W, 1.2);
    }
    // oyma oluk
    const ol = yy(52);
    ctx.fillStyle = 'rgba(70,60,50,0.4)';
    ctx.fillRect(0, ol - (ust ? 1.4 : 0), W, 1.4);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(0, ol + (ust ? 0 : -1.4), W, 1.1);
    // kakma bant: siyah çerçeve içinde yeşil sekiz köşeli yıldızlar, aralarında gül renkli baklavalar
    const b1 = yy(16), b2 = yy(40);
    const bu = Math.min(b1, b2), bh = Math.abs(b2 - b1);
    ctx.fillStyle = 'rgba(244,240,232,0.55)';
    ctx.fillRect(0, bu, W, bh);
    ctx.fillStyle = '#2B2622';
    ctx.fillRect(0, bu, W, 1.6);
    ctx.fillRect(0, bu + bh - 1.6, W, 1.6);
    ctx.fillStyle = '#A4485C';
    ctx.fillRect(0, bu + 3, W, 0.9);
    ctx.fillRect(0, bu + bh - 3.9, W, 0.9);
    const adim = 26;
    const my = bu + bh / 2;
    for (let x = -adim / 2 + (ust ? 0 : adim / 2); x < W + adim; x += adim) {
      // yıldız
      ctx.beginPath();
      const R = 8.4, ri = R * 0.765;
      for (let i = 0; i < 16; i++) {
        const a = (i * Math.PI) / 8 + Math.PI / 8;
        const rr = i % 2 ? ri : R;
        const px = x + Math.cos(a) * rr, py = my + Math.sin(a) * rr;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#2F6B52';
      ctx.fill();
      ctx.strokeStyle = '#1D2A24';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // yıldızın ortasında küçük beyaz sekizgen
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4 + Math.PI / 8;
        const px = x + Math.cos(a) * 2.6, py = my + Math.sin(a) * 2.6;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#EFE7D6';
      ctx.fill();
      // baklava
      const bx = x + adim / 2;
      ctx.beginPath();
      ctx.moveTo(bx, my - 6.2);
      ctx.lineTo(bx + 3.6, my);
      ctx.lineTo(bx, my + 6.2);
      ctx.lineTo(bx - 3.6, my);
      ctx.closePath();
      ctx.fillStyle = '#B4566A';
      ctx.fill();
      ctx.strokeStyle = '#3A2026';
      ctx.lineWidth = 0.6;
      ctx.stroke();
      ctx.fillStyle = '#2B2622';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(bx, my + s * 8.6, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // kakmanın hafif cilası
    const cila = ctx.createLinearGradient(0, bu, 0, bu + bh);
    cila.addColorStop(0, 'rgba(255,255,255,0.12)');
    cila.addColorStop(0.5, 'rgba(255,255,255,0)');
    cila.addColorStop(1, 'rgba(0,0,0,0.06)');
    ctx.fillStyle = cila;
    ctx.fillRect(0, bu, W, bh);
    ctx.restore();
    // suya değen ağız çizgisi
    ctx.fillStyle = ust ? 'rgba(10,30,30,0.7)' : 'rgba(10,30,30,0.5)';
    ctx.fillRect(0, ust ? SU_UST - 0.6 : SU_ALT - 0.6, W, 1.4);
  }
  // üst kenarın suya düşen gölgesi (ışık sağ üstten): yumuşak koyu şerit
  (function () {
    const g = ctx.createLinearGradient(0, SU_UST, 0, SU_UST + 34);
    g.addColorStop(0, 'rgba(4,22,24,0.5)');
    g.addColorStop(1, 'rgba(4,22,24,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, SU_UST, W, 34);
    // alt kenarın sudaki ince aksi
    const g2 = ctx.createLinearGradient(0, SU_ALT - 14, 0, SU_ALT);
    g2.addColorStop(0, 'rgba(230,226,214,0)');
    g2.addColorStop(1, 'rgba(230,226,214,0.28)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, SU_ALT - 14, W, 14);
  })();
  kenar(true);
  kenar(false);
  // oyma dilimli ağız: suya taşan yarım daire dilimler
  function dilimler(ust) {
    const yk = ust ? SU_UST : SU_ALT;
    const R = 11, adim = 25;
    const p = new Path2D();
    for (let x = -adim / 2; x < W + adim; x += adim) {
      p.moveTo(x - R, yk);
      if (ust) p.arc(x, yk, R, Math.PI, 0, true);
      else p.arc(x, yk, R, Math.PI, 0, false);
      p.closePath();
    }
    // suya düşen gölge
    ctx.save();
    ctx.translate(-3, 4);
    ctx.filter = 'blur(2.5px)';
    ctx.fillStyle = 'rgba(4,24,26,0.45)';
    ctx.fill(p);
    ctx.restore();
    ctx.filter = 'none';
    ctx.save();
    ctx.clip(p);
    ctx.drawImage(mermer, 0, 0, W, W);
    const g = ctx.createLinearGradient(0, yk, 0, ust ? yk + R : yk - R);
    if (ust) {
      g.addColorStop(0, 'rgba(40,36,30,0.05)');
      g.addColorStop(0.6, 'rgba(40,36,30,0.16)');
      g.addColorStop(1, 'rgba(30,26,20,0.4)');
    } else {
      g.addColorStop(0, 'rgba(255,255,255,0.0)');
      g.addColorStop(0.6, 'rgba(255,255,250,0.45)');
      g.addColorStop(1, 'rgba(120,110,100,0.3)');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, yk - R, W, 2 * R);
    ctx.restore();
    ctx.strokeStyle = ust ? 'rgba(14,30,30,0.7)' : 'rgba(30,40,40,0.5)';
    ctx.lineWidth = 0.9;
    ctx.stroke(p);
  }
  dilimler(true);
  dilimler(false);

  SAHNE.hazir();
})();
</script>
