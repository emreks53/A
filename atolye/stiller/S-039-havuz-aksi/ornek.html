<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-039 Havuz Aksi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #1f4a4a; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-039 Havuz Aksi — sahne yalnızca avludaki durgun havuzun suyunda, yukarıdan bakılınca görünen aksiyle
// gösterilir: ters dönmüş kubbe, minare ve gök; ince yatay dalga bantları ve hafif kırılmayla bozulur,
// suyun rengiyle (kenarlarda koyu deniz yeşili, ortada berrak) boyanır. Su yüzünde gül yaprakları ve yuvarlak
// yapraklar, çevrelerinde halka halka dalgacıklar; üstte ve altta oyma mermer havuz kenarı ve ince kakma bant.
(function () {
  const OL = 2;
  const W = 1024;
  const S2 = W * OL;
  const cv = document.getElementById('tuval');
  const ctx = SAHNE.tuval(cv, OL);
  const r = SAHNE.rng(39);
  const SU_UST = 84, SU_ALT = 940; // suyun görünen kısmı
  const KAY = 960; // aks: sahne y → Y = KAY - y

  // ------------------------------------------------------------ gürültü
  function hash2(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s, o) {
    let t = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2; }
    return t / n;
  }
  const sinir = (v, a, b) => Math.max(a, Math.min(b, v));
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // ------------------------------------------------------------ 1) yansıyan sahne (ekran dışı, 2048)
  const sahne = SAHNE.yeniTuval(S2, S2);
  (function () {
    const g = sahne.getContext('2d');
    g.setTransform(OL, 0, 0, OL, 0, 0);
    // gök: suda biraz koyulaşan, doygun mavi; güneş parıltısı ve yumuşak bulutlar
    const gr = g.createLinearGradient(0, 0, 0, 800);
    gr.addColorStop(0, '#5E97CF');
    gr.addColorStop(0.55, '#9CC3E2');
    gr.addColorStop(1, '#E6E4D4');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, W);
    const gl = g.createRadialGradient(880, 140, 8, 880, 140, 300);
    gl.addColorStop(0, 'rgba(255,250,232,1)');
    gl.addColorStop(0.12, 'rgba(255,246,220,0.85)');
    gl.addColorStop(0.4, 'rgba(255,240,210,0.3)');
    gl.addColorStop(1, 'rgba(255,240,210,0)');
    g.fillStyle = gl;
    g.fillRect(0, 0, W, W);
    const rb = SAHNE.rng(11);
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7], [380, 60, 0.9]]) {
      for (let i = 0; i < 18; i++) {
        const x = bx + (rb() - 0.5) * 170 * bs, y = by + (rb() - 0.5) * 30 * bs, rr = (22 + rb() * 30) * bs;
        const c = g.createRadialGradient(x, y, 0, x, y, rr);
        c.addColorStop(0, 'rgba(255,255,255,0.42)');
        c.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = c;
        g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
      }
    }
    const z = g.createLinearGradient(0, 800, 0, W);
    z.addColorStop(0, '#CDBF9F');
    z.addColorStop(1, '#B9A987');
    g.fillStyle = z;
    g.fillRect(0, 800, W, W - 800);
    SAHNE.ciz(g, { gok: false });
  })();
  // su kusursuz ayna değildir: kaynağı hafifçe yumuşat
  const yumusak = SAHNE.yeniTuval(S2, S2);
  (function () {
    const g = yumusak.getContext('2d', { willReadFrequently: true });
    g.filter = 'blur(1.4px)';
    g.drawImage(sahne, 0, 0);
  })();
  const SV = yumusak.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, S2, S2).data;

  // ------------------------------------------------------------ 2) dalgacık halkaları (yüzen şeylerin çevresinde)
  const yuzenler = [
    { t: 'yaprak', x: 148, y: 312, s: 24, a: 0.6, renk: [214, 92, 118] },
    { t: 'yaprak', x: 196, y: 336, s: 19, a: 2.3, renk: [250, 236, 236] },
    { t: 'yuvarlak', x: 826, y: 196, s: 30, a: 0.4 },
    { t: 'yaprak', x: 884, y: 252, s: 20, a: -1.2, renk: [230, 130, 150] },
    { t: 'yaprak', x: 742, y: 700, s: 22, a: 1.9, renk: [252, 240, 238] },
    { t: 'yuvarlak', x: 112, y: 690, s: 24, a: 2.6 },
    { t: 'yaprak', x: 152, y: 728, s: 17, a: -0.4, renk: [206, 84, 112] },
    { t: 'yaprak', x: 436, y: 846, s: 21, a: 2.9, renk: [236, 150, 168] },
    { t: 'yuvarlak', x: 948, y: 612, s: 20, a: 1.3 },
    { t: 'yaprak', x: 640, y: 900, s: 18, a: 0.9, renk: [252, 244, 240] },
    { t: 'yaprak', x: 300, y: 214, s: 16, a: -2.0, renk: [224, 112, 136] },
    { t: 'yuvarlak', x: 214, y: 872, s: 27, a: -0.9 },
    { t: 'yaprak', x: 262, y: 902, s: 20, a: 0.3, renk: [246, 226, 228] },
    { t: 'yaprak', x: 96, y: 820, s: 18, a: 1.4, renk: [220, 104, 128] },
  ];
  const halkalar = yuzenler.map((o, i) => ({ x: o.x, y: o.y, r0: o.s * 0.9, A: 1.5 + (i % 3) * 0.3, dal: 8.5 + (i % 2) * 1.5 }));
  halkalar.push({ x: 560, y: 470, r0: 6, A: 1.3, dal: 10 }); // kubbenin aksinde tek bir damla
  halkalar.push({ x: 600, y: 780, r0: 4, A: 1.1, dal: 9 });

  // ------------------------------------------------------------ 3) piksel piksel: ters çevir, dalgalandır, suyla boya
  const su = SAHNE.yeniTuval(S2, S2);
  (function () {
    const g = su.getContext('2d');
    const im = g.createImageData(S2, S2);
    const d = im.data;
    // dalga modeli (1024 birimi): uzun yumuşak kabarma + ince yatay dalgacıklar; evreyi yavaş değişen gürültü büker
    const G = 16, GN = S2 / G + 2;
    const kx = new Float32Array(GN * GN), ky = new Float32Array(GN * GN), ev = new Float32Array(GN * GN), bantG = new Float32Array(GN * GN), kir = new Float32Array(GN * GN);
    for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) {
      const X = (i * G) / OL, Y = (j * G) / OL;
      kx[j * GN + i] = (fbm(X / 140, Y / 95, 21, 3) - 0.5) * 7;
      ky[j * GN + i] = (fbm(X / 140, Y / 95, 22, 3) - 0.5) * 4;
      ev[j * GN + i] = fbm(X / 260, Y / 70, 23, 3) * 9;
      bantG[j * GN + i] = Math.pow(sinir((fbm(X / 300, Y / 55, 24, 3) - 0.3) * 2.2, 0, 1), 1.3);
      kir[j * GN + i] = fbm(X / 34, Y / 9, 25, 2);
    }
    const izgara = (arr, px, py) => {
      const gx = px / G, gy = py / G;
      const i = Math.floor(gx), j = Math.floor(gy);
      const fx = gx - i, fy = gy - j;
      const a = arr[j * GN + i], b = arr[j * GN + i + 1], c = arr[(j + 1) * GN + i], e = arr[(j + 1) * GN + i + 1];
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + e) * fx * fy;
    };
    const orta = [512, 512];
    const DIKEY = [[-1.6, 0.25], [0, 0.5], [1.6, 0.25]]; // dalgacıkların dikey sıvazlaması
    for (let j = SU_UST * OL - 4; j < SU_ALT * OL + 4; j++) {
      const Y = j / OL;
      for (let i = 0; i < S2; i++) {
        const X = i / OL;
        const evre = Y * 0.36 + izgara(ev, i, j);
        const bnt = 0.25 + 0.75 * izgara(bantG, i, j);
        const kab = Math.sin(Y * 0.052 + 1.6 * Math.sin(Y * 0.0105));
        let dx = izgara(kx, i, j) + 2.8 * kab + bnt * 2.8 * Math.sin(evre);
        let dy = izgara(ky, i, j) + bnt * 1.5 * Math.cos(evre * 0.93 + 0.5);
        const sirt = Math.max(0, Math.sin(evre + 1.1));
        let parlak = bnt * Math.pow(sirt, 16) * sinir((izgara(kir, i, j) - 0.42) * 3, 0, 1);
        // halkalar
        for (const h of halkalar) {
          const ex = X - h.x, ey = Y - h.y;
          const uz = Math.hypot(ex, ey);
          if (uz > h.r0 + 70 || uz < 0.5) continue;
          const zarf = Math.exp(-Math.pow((uz - h.r0 - 18) / 22, 2));
          const dal = Math.sin(((uz - h.r0) / h.dal) * Math.PI * 2);
          const m = h.A * dal * zarf;
          dx += (ex / uz) * m;
          dy += (ey / uz) * m;
          parlak += Math.max(0, dal) * zarf * 0.25;
        }
        // ters çevrilmiş sahneden örnekle (çift doğrusal)
        let R = 0, Gc = 0, B = 0;
        for (const [oy, wt] of DIKEY) {
          const sx = (X + dx) * OL, sy = (KAY - Y + dy + oy) * OL;
          const x0 = sinir(Math.floor(sx), 0, S2 - 2), y0 = sinir(Math.floor(sy), 0, S2 - 2);
          const fx = sinir(sx - x0, 0, 1), fy = sinir(sy - y0, 0, 1);
          const p00 = (y0 * S2 + x0) * 4, p10 = p00 + 4, p01 = p00 + S2 * 4, p11 = p01 + 4;
          const w00 = (1 - fx) * (1 - fy) * wt, w10 = fx * (1 - fy) * wt, w01 = (1 - fx) * fy * wt, w11 = fx * fy * wt;
          R += SV[p00] * w00 + SV[p10] * w10 + SV[p01] * w01 + SV[p11] * w11;
          Gc += SV[p00 + 1] * w00 + SV[p10 + 1] * w10 + SV[p01 + 1] * w01 + SV[p11 + 1] * w11;
          B += SV[p00 + 2] * w00 + SV[p10 + 2] * w10 + SV[p01 + 2] * w01 + SV[p11 + 2] * w11;
        }
        // su rengi: kenarlarda koyu deniz yeşili, ortada berrak
        const ex = (X - orta[0]) / 600, ey = (Y - orta[1]) / 470;
        const kenar = sinir(Math.pow(ex * ex + ey * ey, 1.1), 0, 1);
        const kenarUst = Math.exp(-(Y - SU_UST) / 26) * 0.55; // üst kenarın gölgesi
        const a = 0.2 + 0.5 * kenar;
        const yans = 0.86 - 0.18 * kenar;
        const deniz = karis([34, 104, 102], [12, 56, 58], kenar);
        R = R * yans * (1 - a) + deniz[0] * a;
        Gc = Gc * yans * (1 - a) + deniz[1] * a;
        B = B * yans * (1 - a) + deniz[2] * a;
        // dalga sırtında gök parıltısı
        const pk = parlak * (0.3 + 0.25 * (1 - kenar));
        R += (235 - R) * pk;
        Gc += (248 - Gc) * pk;
        B += (250 - B) * pk;
        const gol = 1 - kenarUst;
        const o = (j * S2 + i) * 4;
        d[o] = R * gol;
        d[o + 1] = Gc * gol;
        d[o + 2] = B * gol;
        d[o + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
  })();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(su, 0, 0);
  ctx.setTransform(OL, 0, 0, OL, 0, 0);

  // ------------------------------------------------------------ 4) havuz dibi: ortada berrak suyun altındaki ışık ağı
  (function () {
    const k = SAHNE.yeniTuval(W / 2, W / 2);
    const g = k.getContext('2d');
    const im = g.createImageData(W / 2, W / 2);
    const d = im.data;
    for (let y = 0; y < W / 2; y++) {
      for (let x = 0; x < W / 2; x++) {
        const X = x * 2, Y = y * 2;
        const n1 = fbm(X / 70, Y / 46, 31, 3), n2 = fbm(X / 70 + 7, Y / 46 + 3, 32, 3);
        const ag = Math.pow(1 - Math.abs(Math.sin((n1 - n2) * 14)), 9);
        const ex = (X - 512) / 520, ey = (Y - 512) / 420;
        const orta = Math.max(0, 1 - (ex * ex + ey * ey));
        const v = ag * orta * (Y > SU_UST && Y < SU_ALT ? 1 : 0);
        const o = (y * (W / 2) + x) * 4;
        d[o] = 210; d[o + 1] = 255; d[o + 2] = 236; d[o + 3] = v * 30;
      }
    }
    g.putImageData(im, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(1px)';
    ctx.drawImage(k, 0, 0, W, W);
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';
  })();

  // ------------------------------------------------------------ 5) güneşin aksinde parlama ve pırıltılar
  (function () {
    const gx = 880, gy = KAY - 140;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.scale(1.25, 0.7);
    const gg = ctx.createRadialGradient(0, 0, 2, 0, 0, 120);
    gg.addColorStop(0, 'rgba(255,250,228,0.75)');
    gg.addColorStop(0.25, 'rgba(255,244,214,0.35)');
    gg.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = gg;
    ctx.fillRect(-130, -130, 260, 260);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 70; i++) {
      const a = r() * Math.PI * 2, u = Math.pow(r(), 0.7) * 120;
      const x = gx + Math.cos(a) * u * 1.3, y = gy + Math.sin(a) * u * 0.55;
      if (y > SU_ALT - 6) continue;
      const s = (1 - u / 130) * (2 + r() * 4);
      ctx.fillStyle = `rgba(255,252,236,${0.5 + r() * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(x, y, s * 1.8, s * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      if (s > 3.5) {
        ctx.beginPath();
        ctx.ellipse(x, y, s * 0.35, s * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  })();

  // ------------------------------------------------------------ 6) su yüzü: dalgacık halkaları, yüzen yapraklar
  function halkaCiz(h) {
    for (let k = 0; k < 4; k++) {
      const rr = h.r0 + 6 + k * h.dal;
      const a = 0.3 * Math.exp(-k * 0.45);
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = `rgba(240,252,250,${a})`;
      ctx.beginPath();
      ctx.ellipse(h.x + 0.6, h.y - 0.6, rr, rr * 0.96, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(6,36,38,${a * 0.8})`;
      ctx.beginPath();
      ctx.ellipse(h.x - 0.8, h.y + 1, rr + 2.2, (rr + 2.2) * 0.96, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  halkalar.forEach(halkaCiz);
  const yaprakYolu = (x, y, L, Wd, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    const p = (u, v) => `${(x + u * L * c - v * Wd * s).toFixed(2)},${(y + u * L * s + v * Wd * c).toFixed(2)}`;
    return new Path2D(
      `M${p(0, 0)} C${p(0.16, -0.3)} ${p(0.36, -0.5)} ${p(0.62, -0.5)} C${p(0.88, -0.5)} ${p(1.0, -0.34)} ${p(1.0, -0.15)} ` +
        `C${p(1.0, -0.06)} ${p(0.965, -0.02)} ${p(0.91, 0)} C${p(0.965, 0.02)} ${p(1.0, 0.06)} ${p(1.0, 0.15)} ` +
        `C${p(1.0, 0.34)} ${p(0.88, 0.5)} ${p(0.62, 0.5)} C${p(0.36, 0.5)} ${p(0.16, 0.3)} ${p(0, 0)} Z`
    );
  };
  function golge(p, dx, dy, a) {
    ctx.save();
    ctx.translate(dx, dy);
    ctx.filter = 'blur(3px)';
    ctx.fillStyle = `rgba(4,26,26,${a})`;
    ctx.fill(p);
    ctx.restore();
    ctx.filter = 'none';
  }
  for (const o of yuzenler) {
    if (o.t === 'yaprak') {
      const L = o.s * 1.25, Wd = o.s;
      const x0 = o.x - Math.cos(o.a) * L * 0.5, y0 = o.y - Math.sin(o.a) * L * 0.5;
      const p = yaprakYolu(x0, y0, L, Wd, o.a);
      golge(p, -5, 6, 0.38);
      const g = ctx.createLinearGradient(x0, y0, x0 + Math.cos(o.a) * L, y0 + Math.sin(o.a) * L);
      const c = o.renk;
      g.addColorStop(0, `rgb(${c[0] * 0.72},${c[1] * 0.62},${c[2] * 0.66})`);
      g.addColorStop(0.45, `rgb(${c[0]},${c[1]},${c[2]})`);
      g.addColorStop(1, `rgb(${Math.min(255, c[0] + 22)},${Math.min(255, c[1] + 26)},${Math.min(255, c[2] + 24)})`);
      ctx.fillStyle = g;
      ctx.fill(p);
      // kıvrık kenar parıltısı ve damar
      ctx.save();
      ctx.clip(p);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 2.2;
      ctx.stroke(p);
      ctx.strokeStyle = `rgba(${c[0] * 0.5},${c[1] * 0.4},${c[2] * 0.45},0.35)`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x0 + Math.cos(o.a) * L * 0.08, y0 + Math.sin(o.a) * L * 0.08);
      ctx.lineTo(x0 + Math.cos(o.a) * L * 0.72, y0 + Math.sin(o.a) * L * 0.72);
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(80,30,40,0.25)';
      ctx.lineWidth = 0.6;
      ctx.stroke(p);
    } else {
      // yuvarlak yaprak: çentikli, damarlı, kenarı hafif kalkık
      const R = o.s;
      const p = new Path2D();
      p.moveTo(o.x, o.y);
      p.arc(o.x, o.y, R, o.a + 0.16, o.a + Math.PI * 2 - 0.16);
      p.closePath();
      golge(p, -6, 7, 0.42);
      const g = ctx.createRadialGradient(o.x + R * 0.3, o.y - R * 0.3, R * 0.1, o.x, o.y, R);
      g.addColorStop(0, '#8DBA6A');
      g.addColorStop(0.7, '#4F8A44');
      g.addColorStop(1, '#2F6432');
      ctx.fillStyle = g;
      ctx.fill(p);
      ctx.save();
      ctx.clip(p);
      ctx.strokeStyle = 'rgba(210,240,180,0.35)';
      ctx.lineWidth = 0.8;
      for (let k = 1; k < 12; k++) {
        const a = o.a + 0.16 + ((Math.PI * 2 - 0.32) * k) / 12;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y);
        ctx.quadraticCurveTo(o.x + Math.cos(a + 0.1) * R * 0.5, o.y + Math.sin(a + 0.1) * R * 0.5, o.x + Math.cos(a) * R * 0.96, o.y + Math.sin(a) * R * 0.96);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(230,255,200,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke(p);
      ctx.restore();
      ctx.strokeStyle = 'rgba(20,50,20,0.45)';
      ctx.lineWidth = 0.7;
      ctx.stroke(p);
    }
  }

  // ------------------------------------------------------------ 7) mermer havuz kenarı (üst ve alt), kakma bant
  const mermer = SAHNE.yeniTuval(W, W);
  (function () {
    const g = mermer.getContext('2d');
    const im = g.createImageData(W, W);
    const d = im.data;
    for (let y = 0; y < W; y++) {
      if (y > SU_UST + 2 && y < SU_ALT - 2) continue;
      for (let x = 0; x < W; x++) {
        const t = Math.sin((x * 0.006 + y * 0.013) * Math.PI * 2 + 7 * fbm(x / 170, y / 120, 41, 5));
        const damar = Math.pow(1 - Math.min(1, Math.abs(t) / 0.11), 2.2) * 0.32;
        const t2 = Math.sin((x * 0.011 - y * 0.007) * Math.PI * 2 + 5 * fbm(x / 90, y / 90, 43, 4));
        const damar2 = Math.pow(1 - Math.min(1, Math.abs(t2) / 0.06), 2.2) * 0.14;
        const bulut = fbm(x / 50, y / 50, 44, 4) - 0.5;
        const v = 1 - damar - damar2 + bulut * 0.06;
        const o = (y * W + x) * 4;
        d[o] = 240 * v - damar * 30;
        d[o + 1] = 236 * v - damar * 26;
        d[o + 2] = 228 * v - damar * 18;
        d[o + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
    g.filter = 'blur(0.6px)';
    g.drawImage(mermer, 0, 0);
    g.filter = 'none';
  })();
  function kenar(ust) {
    // ust: üst kenar mı (suya aşağı doğru iner) yoksa alt kenar mı
    const y0 = ust ? 0 : SU_ALT, y1 = ust ? SU_UST : W;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y0, W, y1 - y0);
    ctx.clip();
    ctx.drawImage(mermer, 0, 0, W, W);
    // profil: dış basamak, yassı üst yüz, oyma oluk, yuvarlatılmış ağız
    const yy = (u) => (ust ? u : W - u); // dış kenardan suya doğru uzaklık u
    const bant = (u1, u2, renkler) => {
      const a = yy(u1), b = yy(u2);
      const g = ctx.createLinearGradient(0, a, 0, b);
      renkler.forEach(([t, c]) => g.addColorStop(t, c));
      ctx.fillStyle = g;
      ctx.fillRect(0, Math.min(a, b), W, Math.abs(b - a));
    };
    bant(0, 6, [[0, 'rgba(60,52,44,0.55)'], [1, 'rgba(60,52,44,0.0)']]);
    // yuvarlatılmış ağız (bullnose): üst kenarda ışıktan uzağa, alt kenarda ışığa bakar
    const agiz = SU_UST - 58;
    if (ust) bant(56, SU_UST, [[0, 'rgba(255,255,255,0.35)'], [0.18, 'rgba(255,255,255,0.12)'], [0.55, 'rgba(70,64,56,0.18)'], [1, 'rgba(36,32,26,0.62)']]);
    else bant(56, W - SU_ALT, [[0, 'rgba(80,70,60,0.3)'], [0.3, 'rgba(255,255,255,0.0)'], [0.72, 'rgba(255,255,250,0.5)'], [1, 'rgba(200,196,186,0.2)']]);
    void agiz;
    // ince pervaz çizgileri (oyma basamaklar)
    for (const u of [9, 45]) {
      const yl = yy(u);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(0, yl - (ust ? 0 : 1.2), W, 1.2);
      ctx.fillStyle = 'rgba(80,70,60,0.35)';
      ctx.fillRect(0, yl + (ust ? 1.2 : -2.4), W, 1.2);
    }
    // oyma oluk
    const ol = yy(52);
    ctx.fillStyle = 'rgba(70,60,50,0.4)';
    ctx.fillRect(0, ol - (ust ? 1.4 : 0), W, 1.4);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(0, ol + (ust ? 0 : -1.4), W, 1.1);
    // kakma bant: siyah çerçeve içinde yeşil sekiz köşeli yıldızlar, aralarında gül renkli baklavalar
    const b1 = yy(16), b2 = yy(40);
    const bu = Math.min(b1, b2), bh = Math.abs(b2 - b1);
    ctx.fillStyle = 'rgba(244,240,232,0.55)';
    ctx.fillRect(0, bu, W, bh);
    ctx.fillStyle = '#2B2622';
    ctx.fillRect(0, bu, W, 1.6);
    ctx.fillRect(0, bu + bh - 1.6, W, 1.6);
    ctx.fillStyle = '#A4485C';
    ctx.fillRect(0, bu + 3, W, 0.9);
    ctx.fillRect(0, bu + bh - 3.9, W, 0.9);
    const adim = 26;
    const my = bu + bh / 2;
    for (let x = -adim / 2 + (ust ? 0 : adim / 2); x < W + adim; x += adim) {
      // yıldız
      ctx.beginPath();
      const R = 8.4, ri = R * 0.765;
      for (let i = 0; i < 16; i++) {
        const a = (i * Math.PI) / 8 + Math.PI / 8;
        const rr = i % 2 ? ri : R;
        const px = x + Math.cos(a) * rr, py = my + Math.sin(a) * rr;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#2F6B52';
      ctx.fill();
      ctx.strokeStyle = '#1D2A24';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // yıldızın ortasında küçük beyaz sekizgen
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4 + Math.PI / 8;
        const px = x + Math.cos(a) * 2.6, py = my + Math.sin(a) * 2.6;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#EFE7D6';
      ctx.fill();
      // baklava
      const bx = x + adim / 2;
      ctx.beginPath();
      ctx.moveTo(bx, my - 6.2);
      ctx.lineTo(bx + 3.6, my);
      ctx.lineTo(bx, my + 6.2);
      ctx.lineTo(bx - 3.6, my);
      ctx.closePath();
      ctx.fillStyle = '#B4566A';
      ctx.fill();
      ctx.strokeStyle = '#3A2026';
      ctx.lineWidth = 0.6;
      ctx.stroke();
      ctx.fillStyle = '#2B2622';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(bx, my + s * 8.6, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // kakmanın hafif cilası
    const cila = ctx.createLinearGradient(0, bu, 0, bu + bh);
    cila.addColorStop(0, 'rgba(255,255,255,0.12)');
    cila.addColorStop(0.5, 'rgba(255,255,255,0)');
    cila.addColorStop(1, 'rgba(0,0,0,0.06)');
    ctx.fillStyle = cila;
    ctx.fillRect(0, bu, W, bh);
    ctx.restore();
    // suya değen ağız çizgisi
    ctx.fillStyle = ust ? 'rgba(10,30,30,0.7)' : 'rgba(10,30,30,0.5)';
    ctx.fillRect(0, ust ? SU_UST - 0.6 : SU_ALT - 0.6, W, 1.4);
  }
  // üst kenarın suya düşen gölgesi (ışık sağ üstten): yumuşak koyu şerit
  (function () {
    const g = ctx.createLinearGradient(0, SU_UST, 0, SU_UST + 34);
    g.addColorStop(0, 'rgba(4,22,24,0.5)');
    g.addColorStop(1, 'rgba(4,22,24,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, SU_UST, W, 34);
    // alt kenarın sudaki ince aksi
    const g2 = ctx.createLinearGradient(0, SU_ALT - 14, 0, SU_ALT);
    g2.addColorStop(0, 'rgba(230,226,214,0)');
    g2.addColorStop(1, 'rgba(230,226,214,0.28)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, SU_ALT - 14, W, 14);
  })();
  kenar(true);
  kenar(false);
  // oyma dilimli ağız: suya taşan yarım daire dilimler
  function dilimler(ust) {
    const yk = ust ? SU_UST : SU_ALT;
    const R = 11, adim = 25;
    const p = new Path2D();
    for (let x = -adim / 2; x < W + adim; x += adim) {
      p.moveTo(x - R, yk);
      if (ust) p.arc(x, yk, R, Math.PI, 0, true);
      else p.arc(x, yk, R, Math.PI, 0, false);
      p.closePath();
    }
    // suya düşen gölge
    ctx.save();
    ctx.translate(-3, 4);
    ctx.filter = 'blur(2.5px)';
    ctx.fillStyle = 'rgba(4,24,26,0.45)';
    ctx.fill(p);
    ctx.restore();
    ctx.filter = 'none';
    ctx.save();
    ctx.clip(p);
    ctx.drawImage(mermer, 0, 0, W, W);
    const g = ctx.createLinearGradient(0, yk, 0, ust ? yk + R : yk - R);
    if (ust) {
      g.addColorStop(0, 'rgba(40,36,30,0.05)');
      g.addColorStop(0.6, 'rgba(40,36,30,0.16)');
      g.addColorStop(1, 'rgba(30,26,20,0.4)');
    } else {
      g.addColorStop(0, 'rgba(255,255,255,0.0)');
      g.addColorStop(0.6, 'rgba(255,255,250,0.45)');
      g.addColorStop(1, 'rgba(120,110,100,0.3)');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, yk - R, W, 2 * R);
    ctx.restore();
    ctx.strokeStyle = ust ? 'rgba(14,30,30,0.7)' : 'rgba(30,40,40,0.5)';
    ctx.lineWidth = 0.9;
    ctx.stroke(p);
  }
  dilimler(true);
  dilimler(false);

  SAHNE.hazir();
})();
</script>
