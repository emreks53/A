<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-222 Delâil Ravza Tasviri — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F6F1E3; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ================================================================ ortak el yardımcıları (j5)
  const S = SAHNE;
  const N = 2048; // iç çözünürlük (koordinatlar 1024'te kalır)
  const NN = N * N;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);
  H.kutu = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const M = 256;
    const tab = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * M + x0];
      const b = tab[y0 * M + x1];
      const c = tab[y1 * M + x0];
      const d = tab[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  /** Vuruşlar için ortak gürültü havuzu: her vuruşta yeni tablo kurmamak için tohuma göre kaydırılmış paylaşılan tablolar. */
  H._havuz = [];
  H.nz = function (seed) {
    const j = Math.abs(seed | 0) % 8;
    if (!H._havuz[j]) H._havuz[j] = H.noise(9001 + j * 31);
    const f = H._havuz[j];
    const ox = ((seed * 37.17) % 256 + 256) % 256;
    const oy = ((seed * 91.73) % 256 + 256) % 256;
    return (x, y) => f(x + ox, y + oy);
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed, L}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Nokta dizisini eşit aralıklı yeniden örnekler. */
  H.resample = function (pts, step) {
    const out = [pts[0]];
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      let seg = Math.hypot(x1 - x0, y1 - y0);
      while (acc + seg >= step) {
        const t = (step - acc) / seg;
        x0 = x0 + (x1 - x0) * t;
        y0 = y0 + (y1 - y0) * t;
        out.push([x0, y0]);
        seg = Math.hypot(x1 - x0, y1 - y0);
        acc = 0;
      }
      acc += seg;
    }
    const last = pts[pts.length - 1];
    const lo = out[out.length - 1];
    if (Math.hypot(last[0] - lo[0], last[1] - lo[1]) > step * 0.3) out.push(last);
    return out;
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    if (!amp) return pts;
    const n = H.nz(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step, plen
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.nz(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? (o.ctaper || 0) : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      const wf = o.wf;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (wf) w *= wf(t, pts[i]);
        if (taper > 0) {
          if (t < taper) w *= 0.25 + 0.75 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.25 + 0.75 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Elle doldurma sınırı: yol titrek bir çokgene çevrilir (boya çizgiye tam oturmaz). */
  H.elYolu = function (d, amp, seed, wl) {
    const p = new Path2D();
    let k = 0;
    for (const sp of H.flatten(d, 1.5)) {
      const pts = sp.closed ? sp.pts.concat([sp.pts[0]]) : sp.pts;
      const w = H.wobble(pts, amp, wl || 18, (seed || 5) + k++ * 11);
      w.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      p.closePath();
    }
    return p;
  };

  /** Ekran dışı katman (2048, koordinat 1024). */
  H.katman = function () {
    const c = S.yeniTuval(N, N);
    const k = c.getContext('2d', { willReadFrequently: true });
    k.setTransform(2, 0, 0, 2, 0, 0);
    k.lineCap = 'round';
    k.lineJoin = 'round';
    return { c, k };
  };
  /** Katmanın bulanık alfa kopyası (Uint8ClampedArray, 2048²·4). */
  H.bulanik = function (c, px) {
    const b = S.yeniTuval(N, N);
    const k = b.getContext('2d', { willReadFrequently: true });
    k.filter = `blur(${px}px)`;
    k.drawImage(c, 0, 0);
    return k.getImageData(0, 0, N, N).data;
  };

  // ---------------------------------------------------------------- kubbe ve silindir ışığı
  H.kubbeP = S.kubbeProfili(400);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };
  H.ISIK = (() => {
    const v = [0.62, -0.5, 0.6]; // sağ, yukarı (ekranda -y), öne
    const l = Math.hypot(v[0], v[1], v[2]);
    return v.map((q) => q / l);
  })();
  /** Kubbe yüzeyinde (x, y) noktasının aydınlanması 0..1 ve normali. */
  H.kubbeIsik = function (x, y) {
    const r = Math.max(1, H.kubbeR(y));
    const u = H.clamp((x - 560) / r, -1, 1);
    const dy = 1.5;
    const dr = (H.kubbeR(y - dy) - H.kubbeR(y + dy)) / (2 * dy); // yükseldikçe yarıçap değişimi (negatif)
    let nr = 1;
    let nh = -dr; // yukarı bileşen
    const l = Math.hypot(nr, nh);
    nr /= l;
    nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u;
    const ny = -nh; // ekran y aşağı
    const nz = nr * c;
    return H.clamp(nx * H.ISIK[0] + ny * H.ISIK[1] + nz * H.ISIK[2], 0, 1);
  };
  /** Dikey silindir aydınlanması (u: -1 sol kenar, 1 sağ kenar). */
  H.silindirIsik = function (u) {
    u = H.clamp(u, -1, 1);
    const l = Math.hypot(H.ISIK[0], H.ISIK[2]);
    return H.clamp((u * H.ISIK[0] + Math.sqrt(1 - u * u) * H.ISIK[2]) / l, 0, 1);
  };

  // ---------------------------------------------------------------- fırça izleri
  /**
   * Fırça vuruşu: pts boyunca şerit; başta basınçla açılır, sonda incelir.
   * o: w, color (css), bas (0–0.5), uc (0–0.5), jit (genişlik oynaması), seed, amp, wl
   */
  H.firca = function (ctx, pts, o) {
    if (pts.length < 2) return;
    const seed = o.seed || 1;
    const p2 = o.amp ? H.wobble(pts, o.amp, o.wl || 40, seed) : pts;
    const nz = H.nz(seed * 3 + 7);
    const bas = o.bas === undefined ? 0.12 : o.bas;
    const uc = o.uc === undefined ? 0.3 : o.uc;
    const jit = o.jit === undefined ? 0.2 : o.jit;
    if (o.color) ctx.fillStyle = o.color;
    H.ribbon(ctx, p2, (t, i) => {
      let w = o.w * (1 - jit * 0.5 + jit * 0.5 * nz(i * 0.09, 3.3));
      if (bas > 0 && t < bas) w *= 0.45 + 0.55 * Math.sin(((t / bas) * Math.PI) / 2);
      if (uc > 0 && t > 1 - uc) w *= Math.pow(Math.max(0, (1 - t) / uc), 0.7);
      return Math.max(0.05, w);
    });
  };
  /** Yön alanını izleyen vuruş noktaları: aci(x, y) radyan. */
  H.akis = function (x, y, len, aci, step, yonIsareti) {
    step = step || 3;
    const pts = [[x, y]];
    let px = x;
    let py = y;
    let pa = aci(x, y);
    const sg = yonIsareti || 1;
    for (let s = 0; s < len; s += step) {
      let a = aci(px, py);
      // yön sıçramasın (çizgi alanları için π belirsizliği)
      if (Math.cos(a - pa) < 0) a += Math.PI;
      px += Math.cos(a) * step * sg;
      py += Math.sin(a) * step * sg;
      pa = a;
      pts.push([px, py]);
    }
    return pts;
  };
  /**
   * Bir alanı fırça vuruşlarıyla doldurur.
   * o: box [x0,y0,x1,y1], ara (vuruş merkezleri arası), uzun [a,b], gen [a,b], aci(x,y), renk(x,y,r) → css,
   *    alfa [a,b] (renk css içinde değilse globalAlpha), seed, bas, uc, jit, amp, kirp (Path2D), yogun(x,y) 0..1
   */
  H.vurusDoldur = function (ctx, o) {
    const r = S.rng(o.seed || 11);
    const [x0, y0, x1, y1] = o.box;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    const ara = o.ara;
    const liste = [];
    for (let y = y0 - ara; y < y1 + ara; y += ara * (0.8 + r() * 0.4)) {
      for (let x = x0 - ara + r() * ara; x < x1 + ara; x += ara * (0.7 + r() * 0.6)) {
        liste.push([x + (r() - 0.5) * ara, y + (r() - 0.5) * ara, r()]);
      }
    }
    // karıştır: vuruş sırası rastgele
    for (let i = liste.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = liste[i];
      liste[i] = liste[j];
      liste[j] = t;
    }
    let k = 0;
    for (const [x, y, q] of liste) {
      if (o.yogun && r() > o.yogun(x, y)) continue;
      const L = o.uzun[0] + r() * (o.uzun[1] - o.uzun[0]);
      const W = o.gen[0] + r() * (o.gen[1] - o.gen[0]);
      const ters = r() < 0.5 ? 1 : -1;
      // vuruş merkezden başlasın: geriye yarım boy
      const geri = H.akis(x, y, L / 2, o.aci, 3, -ters);
      const ileri = H.akis(x, y, L / 2, o.aci, 3, ters);
      const pts = geri.reverse().concat(ileri.slice(1));
      ctx.globalAlpha = o.alfa ? o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]) : 1;
      H.firca(ctx, pts, { w: W, color: o.renk(x, y, q, r), bas: o.bas, uc: o.uc, jit: o.jit, seed: (o.seed || 11) * 1000 + k, amp: o.amp, wl: o.wl });
      k++;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return k;
  };

  /**
   * Tarama (hatching): açı aci ile paralel çizgiler; f(x, y) ≥ eşik olan yerlerde çizgi parçası çizilir.
   * Her çizginin kendi eşiği vardır: yoğunluk f ile artar. o: box, ara, aci (sabit ya da fonksiyon değil), f, w, color,
   * kirp (Path2D), seed, amp, egri (çizgi bükümü), minL, taper
   */
  H.tara = function (ctx, o) {
    const [x0, y0, x1, y1] = o.box;
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    const R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
    const ca = Math.cos(o.aci);
    const sa = Math.sin(o.aci);
    const r = S.rng(o.seed || 3);
    const adim = 1.5;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    ctx.fillStyle = o.color;
    let i = 0;
    for (let v = -R; v <= R; v += o.ara * (0.85 + r() * 0.3), i++) {
      const esik = ((i * 0.6180339) % 1) * (o.esikMax || 0.92) + 0.04;
      let seg = [];
      const bitir = () => {
        if (seg.length * adim >= (o.minL || 4)) {
          const pts = o.amp ? H.wobble(seg, o.amp, 30, (o.seed || 3) * 100 + i) : seg;
          H.pen(ctx, [{ pts, closed: false }], { w: o.w * (0.8 + r() * 0.4), amp: 0, press: 0.3, taper: o.taper === undefined ? 0.3 : o.taper, seed: i + 1 });
        }
        seg = [];
      };
      for (let u = -R; u <= R; u += adim) {
        const bend = o.egri ? o.egri * Math.sin((u / R) * Math.PI * 0.5) : 0;
        const x = cx + u * ca - (v + bend) * sa;
        const y = cy + u * sa + (v + bend) * ca;
        if (x < x0 - 2 || x > x1 + 2 || y < y0 - 2 || y > y1 + 2) {
          bitir();
          continue;
        }
        if (o.f(x, y) >= esik) seg.push([x, y]);
        else bitir();
      }
      bitir();
    }
    ctx.restore();
  };

  /** Kâğıt dokusu yüksekliği (2048², 0..1): ince lif + orta benek. */
  H.kagitDoku = function (seed, ince, orta) {
    const n1 = H.noise(seed);
    const n2 = H.noise(seed + 1);
    const n3 = H.noise(seed + 2);
    const out = new Float32Array(NN);
    ince = ince || 3.2;
    orta = orta || 40;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        // lifler: yatay uzatılmış ince gürültü + orta benek
        const v = 0.45 * n1(x / ince, y / (ince * 0.55)) + 0.3 * n1(x / (ince * 2.3) + 50, y / (ince * 1.1) + 20) + 0.25 * n2(x / orta, y / orta) + 0.12 * n3(x / 1.4, y / 1.4);
        out[y * N + x] = 0.5 + 0.5 * v;
      }
    }
    return out;
  };

  /** Yaprak biçimi (sivri uçlu, kenarı kavisli): sap (x,y), yön aci, boy L, en W. Nokta dizisi döner. */
  H.yaprakNoktalari = function (x, y, aci, L, W, egri, n) {
    n = n || 18;
    egri = egri || 0;
    const ca = Math.cos(aci);
    const sa = Math.sin(aci);
    const sol = [];
    const sag = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const w = W * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * 0.5;
      const b = egri * L * Math.sin(Math.PI * t) * 0.18;
      const u = t * L;
      sol.push([x + u * ca - (b - w) * sa, y + u * sa + (b - w) * ca]);
      sag.push([x + u * ca - (b + w) * sa, y + u * sa + (b + w) * ca]);
    }
    return sol.concat(sag.reverse().slice(1));
  };
  /** Bir sapı ya da çizgiyi sabit adımla nokta dizisi olarak bükerek uzatır. */
  H.kavis = function (x0, y0, x1, y1, bukum, n) {
    n = n || 24;
    const dx = x1 - x0;
    const dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L;
    const ny = dx / L;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const b = bukum * Math.sin(Math.PI * t);
      pts.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]);
    }
    return pts;
  };

  // ================================================================ S-222 Delâil Ravza Tasviri
  // Hayalî bir Osmanlı kitap ressamının eli (Delâilü'l-Hayrât'taki Medine tasvirleri): perdahlı kâğıt
  // üstüne örtücü maden boyalar; ince fırçayla altın kontur; cepheden, düzleştirilmiş, bakışımlı,
  // süslemeli bir görünüş. Gök düz ve aydınlık mavi, kubbe taze koyu yeşil, yapı temiz beyaz;
  // kırmızı-altın süs bantları, iki yanda selviler, önde tertipli sıralar hâlinde çiçekler.
  const tuval = document.getElementById('tuval');
  tuval.width = N;
  tuval.height = N;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let tohum = 500;
  const T = () => tohum++;
  const ALTIN = H.katman(); // altın boya (taneli, sonra işlenir)
  const ak = ALTIN.k;

  // renk oynatma: aynı boyanın fırçadan fırçaya küçük farkı
  const ton = (hex, v) => {
    const c = H.hex(hex);
    const k = 1 + v;
    return H.rgba(c.map((q) => H.clamp(q * k, 0, 255)));
  };
  const elYol = (d, amp) => (typeof d === 'string' ? H.elYolu(d, amp === undefined ? 0.5 : amp, T(), 14) : d);
  const boya = (d, renk, amp) => {
    ctx.fillStyle = renk;
    ctx.fill(elYol(d, amp));
  };
  /** örtücü düz alan: önce taban kat, sonra aynı rengin hafif açık/koyu vuruşları (fırça izi görünür) */
  function alan(d, hex, o) {
    o = o || {};
    const yol = elYol(d, o.amp);
    ctx.fillStyle = hex;
    ctx.fill(yol);
    const b = o.box;
    if (!b) return yol;
    H.vurusDoldur(ctx, {
      box: b,
      ara: o.ara || 12,
      uzun: o.uzun || [50, 110],
      gen: o.gen || [10, 16],
      aci: o.aci || (() => 0),
      renk: (x, y, q, r) => ton(o.renkF ? o.renkF(x, y) : hex, (r() - 0.5) * (o.oyna || 0.09)),
      alfa: o.alfa || [0.45, 0.75],
      kirp: yol,
      seed: T(),
      bas: 0.1,
      uc: 0.35,
      jit: 0.3,
      amp: o.vamp || 0.6,
      wl: 40,
    });
    return yol;
  }
  // altın doğrudan resme sürülür (önündeki boya onu örter); ak katmanı yalnız altının tanesi için maskedir
  const altin = (d, w, o) => {
    o = o || {};
    const dd = typeof d === 'string' ? H.flatten(d, 1) : [{ pts: d, closed: !!o.kapali }];
    const sd = T();
    for (const [c, renk] of [[ctx, '#D2AE4E'], [ak, '#fff']]) {
      H.pen(c, dd, {
        w,
        color: renk,
        amp: o.amp === undefined ? 0.35 : o.amp,
        wl: 20,
        seed: sd,
        press: o.press === undefined ? 0.45 : o.press,
        taper: o.taper === undefined ? 0.06 : o.taper,
        ctaper: 0,
        plen: 0.05,
        step: 1,
      });
    }
  };
  const altinDoldur = (d, amp) => {
    const yol = elYol(d, amp === undefined ? 0.3 : amp);
    ctx.fillStyle = '#D2AE4E';
    ctx.fill(yol);
    ak.fillStyle = '#fff';
    ak.fill(yol);
  };
  const altinNokta = (x, y, r) => {
    ctx.fillStyle = '#D2AE4E';
    nokta(ctx, x, y, r);
    ak.fillStyle = '#fff';
    nokta(ak, x, y, r);
  };
  // ince koyu çizgi (altının yanındaki kıl çizgi, ya da konturlar)
  const kil = (d, w, renk, o) => {
    o = o || {};
    H.pen(ctx, typeof d === 'string' ? d : [{ pts: d, closed: !!o.kapali }], {
      w,
      color: renk || 'rgba(40,36,30,0.85)',
      amp: o.amp === undefined ? 0.3 : o.amp,
      wl: 20,
      seed: T(),
      press: 0.4,
      taper: o.taper === undefined ? 0.05 : o.taper,
      ctaper: 0,
      step: 1,
    });
  };
  const nokta = (c, x, y, r) => {
    c.beginPath();
    c.ellipse(x, y, r, r * 0.92, 0.3, 0, Math.PI * 2);
    c.fill();
  };

  const MAVI = '#6FA6DA';
  const YESIL = '#1F8A4C';
  const BEYAZ = '#F8F6EF';
  const KIRMIZI = '#C8463B';
  const PEMBE = '#E8A0A6';
  const SELVI = '#2F6B45';
  const KOYU = '#173A2B';

  // ================================================================ GÖK: düz, aydınlık mavi; yatay fırça izleri
  {
    const gok = H.kutu(-5, -5, 1029, 812);
    ctx.fillStyle = '#78ACDD';
    ctx.fill(H.P(gok));
    // örtücü kat: kısa-orta yatay vuruşlar; tonu fırçadan fırçaya azıcık değişir, ufka doğru hafif açılır
    const gn = H.noise(22209);
    const gokC = (y) => H.mix(H.hex('#6FA6DA'), H.hex('#95C0E7'), H.smooth(320, 800, y));
    // iki kat: önce eğik (sağ üstten sola aşağı), sonra ters eğik ince bir kat; vuruşlar uzun ve birbirine biner
    for (const [yon, alfa, sd] of [[1, [0.5, 0.78], 22201], [-1, [0.22, 0.4], 22208]]) {
      H.vurusDoldur(ctx, {
        box: [0, 0, 1024, 812],
        ara: yon > 0 ? 10 : 15,
        uzun: [70, 140],
        gen: [12, 19],
        aci: (x, y) => yon * (-0.42 + 0.22 * gn(x / 260, y / 260)),
        renk: (x, y, q, r) => {
          const c = gokC(y);
          const v = (r() - 0.5) * 0.085;
          return H.rgba(c.map((q2) => H.clamp(q2 * (1 + v), 0, 255)));
        },
        alfa,
        seed: sd,
        bas: 0.12,
        uc: 0.45,
        jit: 0.35,
        amp: 1.0,
        wl: 60,
      });
    }
  }

  // ---- güneş: küçük altın-beyaz teker, kısa altın ışınlar
  {
    const gx = 872;
    const gy = 132;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2 + 0.06;
      if (i % 2 === 0) {
        // düz ışın: ince, sivri
        const r0 = 30;
        const r1 = 45;
        const a1 = a - 0.055;
        const a2 = a + 0.055;
        const d = `M${gx + Math.cos(a1) * r0},${gy + Math.sin(a1) * r0} L${gx + Math.cos(a) * r1},${gy + Math.sin(a) * r1} L${gx + Math.cos(a2) * r0},${gy + Math.sin(a2) * r0} Z`;
        altinDoldur(d, 0.15);
      } else {
        // alev ışın: dalgalı, ucu incelen
        const pts = [];
        for (let t = 0; t <= 1.0001; t += 0.05) {
          const rr0 = 29 + t * 12;
          const yan = 1.6 * Math.sin(t * Math.PI * 2.2) * (1 - t * 0.3);
          pts.push([gx + Math.cos(a) * rr0 - Math.sin(a) * yan, gy + Math.sin(a) * rr0 + Math.cos(a) * yan]);
        }
        altin(pts, 2.3, { taper: 0.0, amp: 0.05, press: 0.2 });
      }
    }
    altinDoldur(S.daireYolu(gx, gy, 31), 0.3);
    boya(S.daireYolu(gx, gy, 22), '#FBFAF4', 0.4);
    // beyazın içinde fırça izi: birkaç kısa vuruş
    ctx.save();
    ctx.clip(H.P(S.daireYolu(gx, gy, 22)));
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = 0.5;
      H.firca(ctx, [[gx - 24, gy - 14 + i * 6], [gx + 24, gy - 13 + i * 6]], { w: 5, color: i % 2 ? '#FFFFFF' : '#F1EEE2', bas: 0.1, uc: 0.4, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    kil(S.daireYolu(gx, gy, 22), 0.7, 'rgba(150,115,40,0.8)');
    kil(S.daireYolu(gx, gy, 31.5), 0.6, 'rgba(120,90,30,0.7)');
  }

  // ---- bulut kurdeleleri: küçük, beyaz, kıvrık; ince mavi-gri kontur
  function bulut(cx, cy, L, Wb, sg) {
    const orta = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      orta.push([cx - L / 2 + L * t, cy + sg * Wb * 0.7 * Math.sin(t * Math.PI * 2)]);
    }
    // uçlarda küçük kıvrım
    const kivir = (p0, p1, yon) => {
      let a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      let [x, y] = p1;
      const out = [];
      for (let s = 0; s < Wb * 3.2; s += 1) {
        a += yon * (0.05 + 0.16 * (s / (Wb * 3.2)));
        x += Math.cos(a);
        y += Math.sin(a);
        out.push([x, y]);
      }
      return out;
    };
    const sa = kivir(orta[38], orta[40], -sg);
    const so = kivir(orta[2], orta[0], -sg);
    const tum = so.slice().reverse().concat(orta, sa);
    const M = tum.length;
    const nS = so.length;
    const Lp = [];
    const Rp = [];
    for (let i = 0; i < M; i++) {
      const a = tum[Math.max(0, i - 1)];
      const b = tum[Math.min(M - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      let w;
      if (i < nS) w = Wb * (i / nS);
      else if (i >= nS + 41) w = Wb * (1 - (i - nS - 41) / (M - nS - 41));
      else w = Wb * (0.75 + 0.25 * Math.cos(((i - nS) / 40) * Math.PI * 4));
      w = Math.max(0.6, w) / 2;
      Lp.push([tum[i][0] - ty * w, tum[i][1] + tx * w]);
      Rp.push([tum[i][0] + ty * w, tum[i][1] - tx * w]);
    }
    // düğüm: gövdenin ortasından yukarı ayrılıp kendi üstüne kıvrılan filiz
    {
      const m = nS + 20;
      const ta = Math.atan2(tum[m + 1][1] - tum[m - 1][1], tum[m + 1][0] - tum[m - 1][0]);
      const yy = Math.sin(ta - 0.9) < Math.sin(ta + 0.9) ? -1 : 1;
      let fa = ta + yy * 0.9;
      let [fx, fy] = tum[m];
      const fil = [];
      const Lf = Wb * 3.8;
      for (let s2 = 0; s2 <= Lf; s2 += 1) {
        const t = s2 / Lf;
        fa += -yy * (0.012 + 0.2 * t * t);
        fx += Math.cos(fa);
        fy += Math.sin(fa);
        fil.push([fx, fy]);
      }
      const FL = [];
      const FR = [];
      for (let i = 0; i < fil.length; i++) {
        const a = fil[Math.max(0, i - 1)];
        const b = fil[Math.min(fil.length - 1, i + 1)];
        let tx = b[0] - a[0];
        let ty = b[1] - a[1];
        const tl = Math.hypot(tx, ty) || 1;
        tx /= tl;
        ty /= tl;
        const w = Math.max(0.5, Wb * 0.62 * Math.pow(1 - i / fil.length, 0.8)) / 2;
        FL.push([fil[i][0] - ty * w, fil[i][1] + tx * w]);
        FR.push([fil[i][0] + ty * w, fil[i][1] - tx * w]);
      }
      const fy2 = H.polyPath(FL.concat(FR.slice().reverse()), true);
      ctx.fillStyle = '#FBFBF7';
      ctx.fill(fy2);
      altin(FL, 1.0, { taper: 0.2, amp: 0.15 });
      altin(FR, 1.0, { taper: 0.2, amp: 0.15 });
    }
    const kont = Lp.concat(Rp.slice().reverse());
    const yol = H.polyPath(kont, true);
    ctx.fillStyle = '#FBFBF7';
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    for (let i = 0; i < 4; i++) {
      ctx.globalAlpha = 0.55;
      H.firca(ctx, tum.map(([x, y]) => [x, y + (i - 1.5) * Wb * 0.22]), { w: Wb * 0.3, color: i % 2 ? '#FFFFFF' : '#E8EEF3', bas: 0.05, uc: 0.2, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    altin(Lp, 1.1, { taper: 0.15, amp: 0.15 });
    altin(Rp, 1.1, { taper: 0.15, amp: 0.15 });
  }
  bulut(158, 176, 160, 16, 1);
  bulut(474, 96, 140, 14, -1);
  bulut(712, 222, 128, 13, 1);
  bulut(112, 396, 110, 12, -1);
  bulut(924, 336, 118, 13, -1);

  // ================================================================ YER: düz, açık bant
  {
    const yer = H.kutu(-5, 800, 1029, 1029);
    alan(yer, '#E4E8C8', {
      box: [0, 800, 1024, 1024],
      ara: 11,
      uzun: [60, 130],
      gen: [12, 18],
      aci: () => 0,
      oyna: 0.06,
      renkF: (x, y) => (y < 816 ? '#D9E0BA' : '#E4E8C8'),
      alfa: [0.55, 0.85],
      amp: 0.4,
    });
    // yer çizgisi: altın ve kıl çizgi
    altin([[-5, 800.5], [1029, 800.5]], 2.0, { amp: 0.4 });
    kil([[-5, 803], [1029, 803]], 0.6, 'rgba(60,70,40,0.6)');
  }

  // ================================================================ SELVİLER (iki uçta)
  function selvi(cx, taban, tepe, gen) {
    const pts = [];
    const n = 50;
    for (let i = 0; i <= n; i++) {
      const t = i / n; // 0 taban, 1 tepe
      const w = gen * 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + t * 0.95)), 0.75) * (1 - 0.55 * t);
      pts.push([cx - w, taban - (taban - tepe) * t]);
    }
    for (let i = n; i >= 0; i--) {
      const t = i / n;
      const w = gen * 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + t * 0.95)), 0.75) * (1 - 0.55 * t);
      pts.push([cx + w, taban - (taban - tepe) * t]);
    }
    // gövde
    boya(H.kutu(cx - 3.5, taban - 10, cx + 3.5, taban + 14), '#7A5634', 0.3);
    const yol = H.polyPath(H.wobble(pts.concat([pts[0]]), 0.8, 20, T()), true);
    ctx.fillStyle = SELVI;
    ctx.fill(yol);
    // yaprak dokusu: küçük alev biçimli açık ve koyu vuruşlar, yukarı bakan
    ctx.save();
    ctx.clip(yol);
    const rr = S.rng(T());
    for (let i = 0; i < 520; i++) {
      const t = rr();
      const y = taban - (taban - tepe) * t;
      const w = gen * 0.5 * (1 - 0.55 * t);
      const x = cx + (rr() * 2 - 1) * w;
      const L = 9 + rr() * 9;
      const sag = x > cx;
      ctx.globalAlpha = 0.65;
      const renk = rr() < (sag ? 0.6 : 0.3) ? '#4E8C5E' : rr() < 0.5 ? '#245A3A' : '#3B7A4F';
      H.firca(ctx, [[x, y + L * 0.5], [x + (x - cx) * 0.08, y - L * 0.5]], { w: 3.2 + rr() * 2, color: renk, bas: 0.25, uc: 0.6, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    altin(H.wobble(pts.concat([pts[0]]), 0.8, 20, T()), 1.3, { kapali: true });
  }
  selvi(52, 818, 300, 54);
  selvi(972, 818, 300, 54);

  // ================================================================ YAPI
  const MP = S.minareParcalari();
  const mc = 300;
  // ---- minare: temiz beyaz, sol yanda hafif gri-mavi gölge şeridi; altın konturlar; kırmızı-altın bantlar
  {
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      let d;
      let xs;
      if (p.tip === 'poligon') {
        d = S.yol(p.noktalar, true);
        xs = p.noktalar.map((q) => q[0]);
      } else if (p.tip === 'korkuluk') {
        d = H.kutu(p.x1, p.y1, p.x2, p.y2);
        xs = [p.x1, p.x2];
      } else {
        d = p.yol;
        xs = [266, 334];
      }
      const x1 = Math.min(...xs);
      const x2 = Math.max(...xs);
      const yol = alan(d, BEYAZ, { box: [x1, 140, x2, 800], ara: 8, uzun: [30, 70], gen: [6, 9], aci: () => Math.PI / 2, oyna: 0.035, alfa: [0.4, 0.7], amp: 0.3 });
      // gölge şeridi: sol üçte birde açık gri-mavi, yumuşak geçişsiz, fırçayla
      if (p.ad.startsWith('gövde') || p.tip === 'topuz') {
        ctx.save();
        ctx.clip(yol);
        const rr = S.rng(T());
        for (let k = 0; k < 3; k++) {
          const xx = x1 + 3 + k * ((x2 - x1) * 0.09);
          ctx.globalAlpha = 0.32 - k * 0.08;
          H.firca(ctx, [[xx, 120], [xx + (rr() - 0.5), 820]], { w: (x2 - x1) * 0.2, color: '#C9D2D8', bas: 0, uc: 0, jit: 0.25, seed: T(), amp: 0.5 });
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
    // şerefe önleri: kırmızı bant ve altın baklava dizisi
    for (const ad of ['şerefe-1', 'şerefe-2']) {
      const p = MP.find((q) => q.ad === ad);
      const [a, b, c] = p.noktalar;
      boya(H.kutu(a[0], a[1], b[0], c[1]), KIRMIZI, 0.25);
      const y = (a[1] + c[1]) / 2;
      const h = (c[1] - a[1]) * 0.32;
      for (let x = a[0] + 6; x < b[0] - 3; x += 9) altinDoldur(`M${x - 3},${y} L${x},${y - h} L${x + 3},${y} L${x},${y + h} Z`, 0.1);
    }
    // korkuluklar: beyaz, kırmızı babalar
    for (const ad of ['korkuluk-1', 'korkuluk-2']) {
      const p = MP.find((q) => q.ad === ad);
      const adet = ad === 'korkuluk-1' ? 11 : 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + ((p.x2 - p.x1) * (i + 0.5)) / adet;
        boya(S.kemerYolu(x, p.y1 + 4, 5, p.y2 - p.y1 - 6), KIRMIZI, 0.2);
      }
      altin([[p.x1, p.y1 + 1.5], [p.x2, p.y1 + 1.5]], 1.6);
    }
    // zikzak bandı: kırmızı zikzaklar, aralarında altın çizgi
    {
      const zb = MP.find((q) => q.ad === 'zikzak');
      const zz = S.zikzakCizgileri();
      zz.forEach((z, i) => {
        const alt = z.map(([x, y]) => [x, y + 6.5]);
        const yol = H.polyPath(z.concat(alt.slice().reverse()), true);
        ctx.fillStyle = i === 1 ? YESIL : KIRMIZI;
        ctx.fill(yol);
        altin(z, 0.9, { amp: 0.15 });
      });
      altin([[zb.x1, zb.y1], [zb.x2, zb.y1]], 1.4);
      altin([[zb.x1, zb.y2], [zb.x2, zb.y2]], 1.4);
    }
    // pencereler: koyu, altın kenarlı
    for (const w of S.minarePencereleri) {
      const d = S.kemerYolu(w.x, w.y, w.w, w.h);
      boya(d, KOYU, 0.25);
      altin(d, 1.2);
    }
    // altın konturlar
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      if (p.tip === 'poligon') altin(S.yol(p.noktalar, true), 1.4);
      else if (p.tip === 'korkuluk') altin(H.kutu(p.x1, p.y1, p.x2, p.y2), 1.3);
      else altin(p.yol, 1.5);
    }
    // topuzda dilim çizgileri
    altin([[300, 148], [300, 199]], 0.8, { taper: 0.3 });
    altin([[290, 162], [287, 199]], 0.7, { taper: 0.3 });
    altin([[310, 162], [313, 199]], 0.7, { taper: 0.3 });
  }

  // ---- kaide: beyaz; kornişte kırmızı-altın süs bandı; altın kenarlı koyu pencereler
  {
    const K = S.kaide;
    alan(H.kutu(K.x1, K.y1, K.x2, K.y2), BEYAZ, { box: [K.x1, K.y1, K.x2, K.y2], ara: 10, uzun: [60, 140], gen: [8, 12], aci: () => 0, oyna: 0.035, alfa: [0.4, 0.7], amp: 0.3 });
    // korniş: kırmızı bant, içinde altın baklava ve nokta dizisi
    const kk = K.kornis;
    boya(H.kutu(kk.x1, kk.y1, kk.x2, kk.y2), KIRMIZI, 0.25);
    for (let x = kk.x1 + 8; x < kk.x2 - 4; x += 12) {
      altinDoldur(`M${x - 4},${kk.y1 + 6} L${x},${kk.y1 + 2.2} L${x + 4},${kk.y1 + 6} L${x},${kk.y1 + 9.8} Z`, 0.1);
    }
    altin(H.kutu(kk.x1, kk.y1, kk.x2, kk.y2), 1.4);
    // kornişin altında ince süs şeridi: beyaz üstünde kırmızı dalga ve altın çizgi
    {
      const y0 = K.y1 + 4;
      altin([[K.x1, y0 + 9], [K.x2, y0 + 9]], 1.0);
      const pts = [];
      for (let x = K.x1 + 2; x <= K.x2 - 2; x += 1.5) pts.push([x, y0 + 4.5 + 2.6 * Math.sin((x - K.x1) / 4.2)]);
      kil(pts, 1.2, KIRMIZI, { amp: 0.1 });
    }
    // alt bant (taban): kırmızı çizgi ve altın
    boya(H.kutu(K.x1, K.y2 - 9, K.x2, K.y2), KIRMIZI, 0.2);
    altin([[K.x1, K.y2 - 9], [K.x2, K.y2 - 9]], 1.1);
    for (let x = K.x1 + 8; x < K.x2 - 4; x += 14) altinNokta(x, K.y2 - 4.5, 1.6);
    for (const p of K.pencereler) {
      const d = S.kemerYolu(p.x, p.y, p.w, p.h);
      // pencere çevresinde kırmızı kemer bordürü
      boya(S.kemerYolu(p.x, p.y - 6, p.w + 12, p.h + 6), KIRMIZI, 0.2);
      boya(S.kemerYolu(p.x, p.y - 3, p.w + 6, p.h + 3), BEYAZ, 0.2);
      boya(d, KOYU, 0.2);
      altin(S.kemerYolu(p.x, p.y - 6, p.w + 12, p.h + 6), 1.2);
      altin(d, 1.3);
    }
    altin(H.kutu(K.x1, K.y1, K.x2, K.y2), 1.6);
  }

  // ---- kasnak: yeşil, altın kenarlı koyu pencereler, katlar arasında altın şeritler
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    const d = H.kutu(q.x1, q.y1, q.x2, q.y2);
    const cxk = (q.x1 + q.x2) / 2;
    alan(d, '#22904F', {
      box: [q.x1, q.y1, q.x2, q.y2],
      ara: 9,
      uzun: [24, 50],
      gen: [8, 12],
      aci: () => Math.PI / 2,
      oyna: 0.08,
      renkF: (x) => {
        const u = (x - cxk) / ((q.x2 - q.x1) / 2);
        return u < -0.55 ? '#1A7A43' : u > 0.2 && u < 0.6 ? '#2A9A58' : '#22904F';
      },
      alfa: [0.5, 0.85],
      amp: 0.3,
    });
    for (const p of S.kasnakPencereleri(kat)) {
      const wd = S.kemerYolu(p.x, p.y, p.w, p.h);
      boya(wd, KOYU, 0.2);
      altin(wd, kat ? 1.2 : 1.0);
    }
    altin([[q.x1, q.y1 + 1], [q.x2, q.y1 + 1]], 1.8);
    altin([[q.x1, q.y2 - 1], [q.x2, q.y2 - 1]], 1.8);
    altin([[q.x1, q.y1 + 1], [q.x1, q.y2 - 1]], 1.5);
    altin([[q.x2, q.y1 + 1], [q.x2, q.y2 - 1]], 1.5);
    // üst kenarda ince süs: altın nokta dizisi
    for (let x = q.x1 + 6; x < q.x2 - 3; x += 9) altinNokta(x, q.y1 + 5, 1.2);
  }

  // ---- kubbe: taze koyu yeşil, kaburga yönünde örtücü vuruşlar; altın kaburga çizgileri ve altın kontur
  {
    const kd = S.kubbeYolu;
    const meridyenAci = (x, y) => {
      const r = Math.max(1, H.kubbeR(y));
      const u = H.clamp((x - 560) / r, -1, 1);
      const dr = (H.kubbeR(y - 1) - H.kubbeR(y + 1)) / 2;
      return Math.atan2(1, u * -dr);
    };
    alan(kd, YESIL, {
      box: [360, 300, 760, 556],
      ara: 8,
      uzun: [40, 90],
      gen: [7, 11],
      aci: meridyenAci,
      renkF: (x, y) => {
        const l = H.kubbeIsik(x, y);
        return l < 0.3 ? '#187341' : l > 0.72 ? '#2A9C5A' : YESIL;
      },
      oyna: 0.13,
      alfa: [0.5, 0.85],
      amp: 0.4,
    });
    for (const kb of S.kaburgalar(16)) {
      const pts = kb.noktalar.slice().reverse();
      altin(pts, 1.05, { amp: 0.2, taper: 0.0, press: 0.35 });
    }
    altin(kd, 2.2, { press: 0.4 });
    // kubbe eteğinde altın şerit ve kırmızı ince çizgi
    altin([[362, 551], [758, 551]], 1.6);
  }

  // ---- alemler: altın
  function alemCiz(a) {
    const ys = [S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), H.kutu(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)), S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
    for (const d of ys) altinDoldur(d, 0.25);
    for (const d of ys) kil(d, 0.6, 'rgba(110,80,25,0.8)');
  }
  alemCiz(S.alemParcalari(560, 300, 1));
  alemCiz(MP.find((p) => p.tip === 'alem').alem);

  // ================================================================ ÇİÇEKLER: tertipli sıralar
  // lale (kırmızı), karanfil (pembe), gül (beyaz); her biri kendi sapında, iki yaprakla
  function yaprakCift(x, y, L, aci, renk) {
    for (const sg of [-1, 1]) {
      const pts = H.yaprakNoktalari(x, y, -Math.PI / 2 + sg * aci, L, L * 0.32, sg * 0.8, 14);
      const yol = H.polyPath(H.wobble(pts.concat([pts[0]]), 0.3, 10, T()), true);
      ctx.fillStyle = renk;
      ctx.fill(yol);
      ctx.save();
      ctx.clip(yol);
      ctx.globalAlpha = 0.55;
      H.firca(ctx, [[x, y], [x + Math.cos(-Math.PI / 2 + sg * aci) * L, y + Math.sin(-Math.PI / 2 + sg * aci) * L]], { w: L * 0.12, color: '#5FA36A', bas: 0.1, uc: 0.5, seed: T() });
      ctx.restore();
      ctx.globalAlpha = 1;
      kil(pts.concat([pts[0]]), 0.6, 'rgba(25,60,35,0.8)');
    }
  }
  function sap(x, y0, y1, w) {
    H.firca(ctx, H.kavis(x, y0, x, y1, 0.6, 10), { w, color: '#3E7B4A', bas: 0, uc: 0.05, jit: 0.2, seed: T() });
  }
  function lale(x, y, s) {
    // üç sivri taç yapraklı Osmanlı lalesi
    const d = `M${x},${y + s * 0.15} C${x - s * 0.55},${y + s * 0.1} ${x - s * 0.62},${y - s * 0.55} ${x - s * 0.42},${y - s * 1.05} C${x - s * 0.3},${y - s * 0.7} ${x - s * 0.18},${y - s * 0.55} ${x},${y - s * 1.2} C${x + s * 0.18},${y - s * 0.55} ${x + s * 0.3},${y - s * 0.7} ${x + s * 0.42},${y - s * 1.05} C${x + s * 0.62},${y - s * 0.55} ${x + s * 0.55},${y + s * 0.1} ${x},${y + s * 0.15} Z`;
    const yol = H.elYolu(d, 0.3, T(), 10);
    ctx.fillStyle = KIRMIZI;
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    for (let i = -2; i <= 2; i++) {
      ctx.globalAlpha = 0.6;
      H.firca(ctx, [[x + i * s * 0.12, y + s * 0.1], [x + i * s * 0.2, y - s * 1.0]], { w: s * 0.13, color: i % 2 ? '#DC5A4C' : '#B23A31', bas: 0.1, uc: 0.5, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    kil(`M${x},${y + s * 0.1} L${x},${y - s * 0.95}`, 0.6, 'rgba(120,30,25,0.7)', { taper: 0.4 });
    kil(d, 0.75, 'rgba(90,25,20,0.85)');
  }
  function karanfil(x, y, s) {
    // kadeh + dişli yelpaze
    const fan = [];
    const dis = 7;
    for (let i = 0; i <= dis * 2; i++) {
      const t = i / (dis * 2);
      const a = -Math.PI / 2 + (t - 0.5) * 2.3;
      const r = s * (i % 2 ? 0.86 : 1.0);
      fan.push([x + Math.cos(a) * r, y - s * 0.15 + Math.sin(a) * r * 0.9]);
    }
    const yel = [[x - s * 0.18, y - s * 0.1]].concat(fan, [[x + s * 0.18, y - s * 0.1]]);
    const yol = H.polyPath(H.wobble(yel.concat([yel[0]]), 0.25, 10, T()), true);
    ctx.fillStyle = PEMBE;
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i / 5 - 0.5) * 2.0;
      ctx.globalAlpha = 0.55;
      H.firca(ctx, [[x, y - s * 0.1], [x + Math.cos(a) * s, y - s * 0.15 + Math.sin(a) * s]], { w: s * 0.14, color: i % 2 ? '#F2BDC1' : '#D9838C', bas: 0.05, uc: 0.3, seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    kil(yel.concat([yel[0]]), 0.7, 'rgba(140,50,60,0.85)');
    const kadeh = `M${x - s * 0.2},${y - s * 0.12} L${x + s * 0.2},${y - s * 0.12} L${x + s * 0.1},${y + s * 0.35} L${x - s * 0.1},${y + s * 0.35} Z`;
    boya(kadeh, '#3E7B4A', 0.15);
    kil(kadeh, 0.6, 'rgba(25,60,35,0.8)');
  }
  function gul(x, y, s) {
    // beyaz gül: önden; dış halkada beş geniş yuvarlak taç, içte beş küçük taç, ortada pembe kadeh ve
    // kadehin içinde sarmal duran kırmızı kıl çizgiler. Taç diplerine pembe çekilir.
    const rr = S.rng(Math.floor(x * 13 + y * 7));
    const faz = rr() * Math.PI * 2;
    const tac = (R, rx, ry, a, renk, golge, kont) => {
      const cx = x + Math.cos(a) * R;
      const cy = y + Math.sin(a) * R;
      const d = S.elipsYolu({ cx, cy, rx, ry, aci: a });
      const yol = H.elYolu(d, Math.max(0.15, s * 0.012), T(), 8);
      ctx.fillStyle = renk;
      ctx.fill(yol);
      ctx.save();
      ctx.clip(yol);
      ctx.globalAlpha = 0.6;
      H.firca(ctx, [[x, y], [x + Math.cos(a) * (R + rx * 0.5), y + Math.sin(a) * (R + rx * 0.5)]], { w: rx * 0.8, color: golge, bas: 0, uc: 0.75, seed: T() });
      ctx.restore();
      ctx.globalAlpha = 1;
      kil(d, Math.max(0.5, s * 0.03), kont);
    };
    for (let i = 0; i < 5; i++) tac(s * 0.5, s * 0.5, s * 0.44, faz + (i * Math.PI * 2) / 5 + (rr() - 0.5) * 0.12, '#FAF8F1', '#EBD9D6', 'rgba(150,84,88,0.8)');
    for (let i = 0; i < 5; i++) tac(s * 0.27, s * 0.32, s * 0.28, faz + Math.PI / 5 + (i * Math.PI * 2) / 5, '#FFFFFF', '#EFC2C6', 'rgba(160,80,86,0.8)');
    // kadeh
    const kd = S.elipsYolu({ cx: x, cy: y - s * 0.02, rx: s * 0.25, ry: s * 0.21, aci: 0 });
    boya(kd, '#F4D3D5', 0.15);
    kil(kd, Math.max(0.5, s * 0.03), 'rgba(170,70,78,0.85)');
    // sarmal: iç içe üç yay
    for (let k = 0; k < 3; k++) {
      const R = s * (0.19 - k * 0.06);
      const a0 = faz + k * 1.9;
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.08) {
        const a = a0 + t * Math.PI * 1.35;
        pts.push([x + Math.cos(a) * R, y - s * 0.02 + Math.sin(a) * R * 0.85]);
      }
      kil(pts, Math.max(0.55, s * 0.035), 'rgba(176,58,66,0.9)', { taper: 0.3 });
    }
  }
  // yan bitkiler: sahnedeki dört kavisli sap; sap boyunca sıralı mızrak yapraklar, tepede lale/karanfil,
  // yan dalda beyaz gül, uçta gonca
  function mizrakYaprak(x, y, aci, L) {
    const pts = H.yaprakNoktalari(x, y, aci, L, L * 0.3, 0.7, 14);
    const yol = H.polyPath(H.wobble(pts.concat([pts[0]]), 0.3, 10, T()), true);
    ctx.fillStyle = '#3B7748';
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    ctx.globalAlpha = 0.6;
    H.firca(ctx, [[x, y], [x + Math.cos(aci) * L * 0.95, y + Math.sin(aci) * L * 0.95]], { w: L * 0.12, color: '#69AA72', bas: 0.1, uc: 0.6, seed: T() });
    ctx.restore();
    ctx.globalAlpha = 1;
    kil(pts.concat([pts[0]]), 0.6, 'rgba(25,60,35,0.85)');
  }
  function gonca(t) {
    const d = S.tomurcukYolu({ x: t.x, y: t.y, r: t.r * 1.05, aci: t.aci });
    boya(d, KIRMIZI, 0.2);
    ctx.save();
    ctx.clip(H.P(d));
    ctx.globalAlpha = 0.5;
    H.firca(ctx, [[t.x - Math.cos(t.aci) * t.r, t.y - Math.sin(t.aci) * t.r], [t.x + Math.cos(t.aci) * t.r * 1.5, t.y + Math.sin(t.aci) * t.r * 1.5]], { w: t.r * 0.5, color: '#DE6B5E', seed: T() });
    ctx.restore();
    ctx.globalAlpha = 1;
    kil(d, 0.6, 'rgba(90,25,20,0.85)');
    // çanak
    const ca = Math.cos(t.aci);
    const sa = Math.sin(t.aci);
    for (const sg of [-1, 1]) {
      const p0 = [t.x - ca * t.r * 0.9, t.y - sa * t.r * 0.9];
      const p1 = [t.x + ca * t.r * 0.2 - sa * sg * t.r * 0.7, t.y + sa * t.r * 0.2 + ca * sg * t.r * 0.7];
      H.firca(ctx, [p0, p1], { w: 3, color: '#3B7748', bas: 0.2, uc: 0.7, seed: T() });
    }
  }
  {
    const B = S.bitki;
    B.saplar.forEach((s2, i) => {
      H.firca(ctx, s2, { w: 4.2, color: '#3B7748', bas: 0, uc: 0.04, jit: 0.2, seed: T() });
      kil(s2.map(([x, y]) => [x + 1.6, y]), 0.5, 'rgba(25,60,35,0.6)', { taper: 0.3 });
    });
    B.yapraklar.slice(0, 36).forEach((y) => mizrakYaprak(y.x, y.y, y.aci, y.uzunluk * 0.95));
    B.tomurcuklar.slice(0, 8).forEach((t, i) => {
      if (i % 2 === 0) {
        // tepe: lale ya da karanfil
        const k = Math.floor(i / 2);
        if (k % 2 === 0) lale(t.x, t.y + 10, 30);
        else karanfil(t.x, t.y + 8, 27);
      } else gonca(t);
    });
    B.cicekler.slice(0, 4).forEach((c) => gul(c.x, c.y, 19));
  }
  // ön sıralar: tertipli, birbirine yakın; arka sırada küçük, öne doğru büyüyen bitkiler (yarım adım kaydırmalı);
  // aralarda küçük çimen öbekleri
  {
    const rr = S.rng(2225);
    const cimen = (x, y, s) => {
      for (let j = 0; j < 5; j++) {
        const a = -Math.PI / 2 + (j - 2) * 0.35;
        H.firca(ctx, H.kavis(x + (j - 2) * 1.5, y, x + (j - 2) * 1.5 + Math.cos(a) * s, y + Math.sin(a) * s, (j - 2) * 1.5, 6), { w: 2, color: j % 2 ? '#4F8D59' : '#3B7748', bas: 0.1, uc: 0.8, seed: T() });
      }
    };
    const sira = [
      { y: 858, ara: 54, s: 16, kay: 10, sapL: 28 },
      { y: 918, ara: 68, s: 22, kay: 44, sapL: 34 },
      { y: 986, ara: 84, s: 30, kay: 4, sapL: 38 },
    ];
    sira.forEach((r, si) => {
      // önce çimenler (bitkilerin arasında)
      for (let x = r.kay; x < 1024; x += r.ara) {
        if (rr() < 0.22) continue;
        cimen(x + (rr() - 0.5) * r.ara * 0.3, r.y + r.sapL * 0.75 + (rr() - 0.5) * 6, (8 + si * 3) * (0.7 + rr() * 0.5));
      }
      let j = 0;
      let onceki = (si * 2) % 3;
      for (let x0 = r.kay + r.ara / 2; x0 < 1024 - 16; x0 += r.ara, j++) {
        const s2 = r.s * (0.86 + rr() * 0.28);
        const x = x0 + (rr() - 0.5) * r.ara * 0.16;
        const yb = r.y + (rr() - 0.5) * 9;
        if (si < 2 && (x0 < 82 || x0 > 942)) continue;
        if (si === 0 && ((x0 > 96 && x0 < 170) || (x0 > 854 && x0 < 928))) continue;
        // tür sırası elle: komşu iki bitki aynı olmaz, ama sıra bir kalıp gibi tekrarlanmaz
        const tur = (onceki + 1 + (rr() < 0.5 ? 0 : 1)) % 3;
        onceki = tur;
        const dip = yb + r.sapL * 0.75;
        const egim = (rr() - 0.5) * 0.14;
        ctx.save();
        ctx.translate(x, dip);
        ctx.rotate(egim);
        ctx.translate(-x, -dip);
        sap(x, dip, yb - s2 * 0.2, 2.4 + si * 0.5);
        yaprakCift(x, yb + r.sapL * (0.4 + rr() * 0.12), s2 * (1.2 + rr() * 0.3), 0.8 + rr() * 0.3, '#3B7748');
        if (rr() < 0.75) yaprakCift(x, yb + r.sapL * 0.05, s2 * (0.85 + rr() * 0.25), 0.5 + rr() * 0.25, '#3B7748');
        if (tur === 0) lale(x, yb - s2 * 0.15, s2);
        else if (tur === 1) karanfil(x, yb - s2 * 0.2, s2 * 0.92);
        else gul(x, yb - s2 * 0.45, s2 * 0.72);
        ctx.restore();
      }
    });
  }

  // ================================================================ ÇERÇEVE: ince altın cetvel
  {
    const m = 13;
    ctx.fillStyle = 'rgba(0,0,0,0)';
    altin(H.kutu(m, m, 1024 - m, 1024 - m), 3.6, { amp: 0.25, press: 0.3 });
    kil(H.kutu(m - 3.2, m - 3.2, 1024 - m + 3.2, 1024 - m + 3.2), 0.7, 'rgba(30,30,30,0.8)', { amp: 0.2 });
    kil(H.kutu(m + 3.2, m + 3.2, 1024 - m - 3.2, 1024 - m - 3.2), 0.7, 'rgba(30,30,30,0.8)', { amp: 0.2 });
  }

  // ================================================================ BİLEŞİM: altın tanesi + perdahlı kâğıt yüzeyi
  {
    const img = ctx.getImageData(0, 0, N, N);
    const o = img.data;
    const av = ak.getImageData(0, 0, N, N).data;
    const ab = H.bulanik(ALTIN.c, 1.2);
    const n1 = H.noise(2221);
    const n2 = H.noise(2222);
    const doku = H.kagitDoku(2223, 2.6, 36);
    const AL = H.hex('#D2AE4E');
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const p = y * N + x;
        const i = p * 4;
        const h = doku[p];
        // boya yüzeyi: maden boyanın hafif tanesi ve perdah
        const s = 1 + 0.035 * (h - 0.5) + 0.012 * n1(x / 160, y / 160);
        let r = o[i] * s;
        let g = o[i + 1] * s;
        let b = o[i + 2] * s;
        const a = av[i + 3] / 255;
        if (a > 0.003) {
          // yalnız gerçekten altın görünen piksellerde: tane, kenarda koyulaşma, yer yer ışık
          const dist = Math.abs(o[i] - AL[0]) + Math.abs(o[i + 1] - AL[1]) + Math.abs(o[i + 2] - AL[2]);
          const w = a * H.clamp(1 - dist / 140, 0, 1);
          if (w > 0.002) {
            const kenar = Math.max(0, a - ab[i + 3] / 255);
            const tn = 0.88 + 0.22 * (0.5 + 0.5 * n2(x / 1.8, y / 1.8)) + 0.08 * (h - 0.5);
            const parla = 1 + 0.13 * H.smooth(0.3, 0.9, n1(x / 9 + 40, y / 9));
            const k = tn * parla * (1 - 0.3 * kenar);
            r += (r * k - r) * w;
            g += (g * k - g) * w;
            b += (b * k * 0.97 - b) * w;
          }
        }
        o[i] = r;
        o[i + 1] = g;
        o[i + 2] = b;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
</script>
