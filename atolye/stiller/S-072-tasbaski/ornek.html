<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-072 Taşbaskı (Kromolitografi) — 19. yüzyıl renkli taşbaskısı: her renk ayrı bir taştan basılır.
// Taş kalemi greninin düzensiz noktaları, elle noktalanmış (stipple) ince geçişler, taşlar arasında hafif
// kayıklık, temiz ve parlak mürekkep paleti, açık sepya ana kalıp çizgisi, açık renkli basılı süslü bordür
// ve boş kartuş, temiz açık kâğıt.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

'use strict';
// ------------------------------------------------------------------ ortak yardımcılar
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const P2 = (d) => new Path2D(d);

/** Tohumlu değer gürültüsü: (x, y) → [0,1]. */
function gurultuFn(tohum) {
  const r = SAHNE.rng(tohum);
  const v = new Float32Array(256);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { v[i] = r(); p[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = v[p[p[X] + Y]], b = v[p[p[X + 1] + Y]], c = v[p[p[X] + Y + 1]], d = v[p[p[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
/** Fraktal gürültü (fbm): ölçek = en kaba hücre boyu (1024 koordinatında). */
function fbmFn(tohum, oktav, olcek, kazanc) {
  kazanc = kazanc || 0.5;
  const g = [];
  for (let i = 0; i < oktav; i++) g.push(gurultuFn(tohum * 31 + i * 7 + 1));
  let top = 0, a = 1;
  for (let i = 0; i < oktav; i++) { top += a; a *= kazanc; }
  return function (x, y) {
    let s = 0, a = 1, f = 1 / olcek;
    for (let i = 0; i < oktav; i++) { s += a * g[i](x * f + i * 17.3, y * f - i * 9.1); a *= kazanc; f *= 2.03; }
    return s / top;
  };
}

/** Çalışma çözünürlüğünde ekran dışı katman (koordinatlar 1024'te). */
function yeniKatman() {
  const c = SAHNE.yeniTuval(N, N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(O, 0, 0, O, 0, 0);
  return [c, x];
}
function okuKanal(c, kanal) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
  const out = new Float32Array(N * N);
  for (let i = 0, j = kanal; i < N * N; i++, j += 4) out[i] = d[j] / 255;
  return out;
}
/** Çizim fonksiyonundan alfa maskesi (Float32Array, 0–1). */
function maske(ciz, bulaniklik) {
  const [c, x] = yeniKatman();
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  ciz(x);
  if (bulaniklik) return okuKanal(bulanikTuval(c, bulaniklik), 3);
  return okuKanal(c, 3);
}
/** Tuvali bulanıklaştırılmış kopyası (bulaniklik 1024 px cinsinden). */
function bulanikTuval(c, b) {
  const k = SAHNE.yeniTuval(N, N);
  const x = k.getContext('2d', { willReadFrequently: true });
  x.filter = `blur(${b * O}px)`;
  x.drawImage(c, 0, 0);
  return k;
}
/** Float32Array kutu bulanıklığı (3 geçiş ≈ Gauss), r çalışma pikseli. */
function bulanikDizi(a, r) {
  r = Math.max(1, Math.round(r));
  const t = new Float32Array(N * N);
  const gecis = (src, dst, yatay) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < N; j++) {
      let s = 0;
      const idx = (k) => (yatay ? j * N + k : k * N + j);
      for (let k = -r; k <= r; k++) s += src[idx(Math.min(N - 1, Math.max(0, k)))];
      for (let k = 0; k < N; k++) {
        dst[idx(k)] = s * inv;
        s += src[idx(Math.min(N - 1, k + r + 1))] - src[idx(Math.max(0, k - r))];
      }
    }
  };
  for (let p = 0; p < 3; p++) { gecis(a, t, true); gecis(t, a, false); }
  return a;
}
/** Kabartma (gömme) ışığı: yükseklik haritası → gölge/ışık çarpanı. Işık sağ üstten. */
function kabartma(H, guc) {
  const out = new Float32Array(N * N);
  const lx = 0.62, ly = -0.62;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const hx = (H[i + 1] - H[i - 1]) * 0.5, hy = (H[i + N] - H[i - N]) * 0.5;
      out[i] = (-hx * lx - hy * ly) * guc;
    }
  }
  return out;
}

/** SVG yolunu nokta dizilerine çevirir (M, L, C, Z). */
function yolNoktalari(d, adim) {
  adim = adim || 3;
  const t = d.match(/[MLCZA]|-?\d*\.?\d+(?:e-?\d+)?/g);
  const alt = []; let cur = null, i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]);
  while (i < t.length) {
    if (/[MLCZA]/.test(t[i])) cmd = t[i++];
    if (cmd === 'M') { x = num(); y = num(); sx = x; sy = y; cur = []; alt.push(cur); cur.push([x, y]); cmd = 'L'; }
    else if (cmd === 'L') { x = num(); y = num(); cur.push([x, y]); }
    else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(2, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const s = k / n, u = 1 - s;
        cur.push([u * u * u * x + 3 * u * u * s * x1 + 3 * u * s * s * x2 + s * s * s * x3, u * u * u * y + 3 * u * u * s * y1 + 3 * u * s * s * y2 + s * s * s * y3]);
      }
      x = x3; y = y3;
    } else if (cmd === 'Z') { if (Math.hypot(x - sx, y - sy) > 0.01) cur.push([sx, sy]); x = sx; y = sy; cmd = ''; }
    else if (cmd === 'A') { for (let k = 0; k < 5; k++) num(); x = num(); y = num(); cur.push([x, y]); }
    else i++;
  }
  return alt;
}
/** Kâğıt lifi dokusu: ince gürültü + uzun lifler (0–1 civarı, ortalama ~0.5). */
function kagitDokusu(tohum) {
  const g1 = fbmFn(tohum, 3, 2.2), g2 = fbmFn(tohum + 5, 3, 24);
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const X = x / O, Y = y / O;
      out[y * N + x] = 0.6 * g1(X, Y) + 0.4 * g2(X * 1.8, Y * 0.6);
    }
  }
  return out;
}
/** Worley (hücre) gürültüsü: (x, y) → [F1, F2-F1] hücre boyuna göre. */
function worleyFn(tohum, hucre) {
  const r = SAHNE.rng(tohum);
  const ox = new Float32Array(65536), oy = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) { ox[i] = r(); oy[i] = r(); }
  const out = [0, 0];
  return function (x, y) {
    x /= hucre; y /= hucre;
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy, k = ((cy & 255) << 8) | (cx & 255);
        const ex = cx + ox[k] - x, ey = cy + oy[k] - y, d = ex * ex + ey * ey;
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
    }
    out[0] = Math.sqrt(f1); out[1] = Math.sqrt(f2) - out[0];
    return out;
  };
}


// ------------------------------------------------------------------ kurulum
const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
tuval.width = N; tuval.height = N;
const ctx = tuval.getContext('2d');
const Y = SAHNE.yollar();
const BT = SAHNE.bitki;
const rnd = SAHNE.rng(7202);
const S = 0.875, OX = 64, OY = 64; // sahne resim alanına (64–960) sığdırılır

// Taşlar, basım sırasıyla (açıktan koyuya). kay: kayıklık (1024 px), doku: 'kara' kalem greni, 'nokta' elle noktalama
const TAS = [
  { ad: 'sari', renk: '#F6D878', kay: [1.3, -0.9], doku: 'kara', op: 0.9 },
  { ad: 'mavi', renk: '#6AAEE0', kay: [-1.7, 1.0], doku: 'nokta', op: 0.92 },
  { ad: 'gokMavi', renk: '#B2D8F2', kay: [0.6, -1.2], doku: 'kara', op: 0.9 },
  { ad: 'pembe', renk: '#F4A8A2', kay: [1.9, 1.5], doku: 'nokta', op: 0.88 },
  { ad: 'gri', renk: '#C9C1B4', kay: [-0.8, 0.6], doku: 'kara', op: 0.8 },
  { ad: 'okra', renk: '#E2AD4A', kay: [-1.0, -1.5], doku: 'kara', op: 0.9 },
  { ad: 'yesil', renk: '#5BBE70', kay: [1.0, 1.7], doku: 'kara', op: 0.92 },
  { ad: 'prusya', renk: '#4C76B4', kay: [-1.4, -0.4], doku: 'kara', op: 0.85 },
  { ad: 'kirmizi', renk: '#DC6050', kay: [2.1, 0.3], doku: 'kara', op: 0.88 },
  { ad: 'anahat', renk: '#5E4A3A', kay: [0, 0], doku: 'kara', op: 0.9 },
];
const T = {};
for (const t of TAS) {
  const [c, x] = yeniKatman();
  x.fillStyle = '#000'; x.fillRect(0, 0, 1024, 1024);
  x.lineCap = 'round'; x.lineJoin = 'round';
  t.c = c; t.x = x; T[t.ad] = x;
}
const gri = (v) => { const g = Math.round(clamp(v) * 255); return `rgb(${g},${g},${g})`; };
/** Gri tonlu doğrusal/ışınsal geçiş üreticileri (her taş bağlamında yeniden kurulur). */
const lg = (x0, y0, x1, y1, duraklar) => (x) => { const g = x.createLinearGradient(x0, y0, x1, y1); duraklar.forEach(([t, v]) => g.addColorStop(t, gri(v))); return g; };
const rg = (x0, y0, r0, x1, y1, r1, duraklar) => (x) => { const g = x.createRadialGradient(x0, y0, r0, x1, y1, r1); duraklar.forEach(([t, v]) => g.addColorStop(t, gri(v))); return g; };
/** Yolu bütün taşlarda doldurur (öndeki biçim arkadakini örter); listede olmayan taşta ton 0. */
function hepsi(yol, tonlar) {
  const p = typeof yol === 'string' ? P2(yol) : yol;
  for (const t of TAS) {
    const v = tonlar[t.ad];
    t.x.fillStyle = v === undefined ? '#000' : typeof v === 'number' ? gri(v) : v(t.x);
    t.x.fill(p);
  }
}
/** Bir taşa ton ekler (toplamalı). */
function ekle(ad, yol, stil) {
  const x = T[ad];
  x.save(); x.globalCompositeOperation = 'lighter';
  x.fillStyle = typeof stil === 'number' ? gri(stil) : stil(x);
  x.fill(typeof yol === 'string' ? P2(yol) : yol);
  x.restore();
}
/** Bir taşa çizgi (kalem) çizer. */
function cizTas(ad, yol, w, v, topla) {
  const x = T[ad];
  x.save(); if (topla) x.globalCompositeOperation = 'lighter';
  x.lineWidth = w; x.strokeStyle = gri(v);
  x.stroke(typeof yol === 'string' ? P2(yol) : yol);
  x.restore();
}
const anahat = (yol, w) => cizTas('anahat', yol, w || 1.25, 0.95);
const hepsiCiz = (yol, w, tonlar) => { hepsi(yol, tonlar); anahat(yol, w); };
const poly = (pts, kapali) => P2(SAHNE.yol(pts, kapali));

// ------------------------------------------------------------------ sahne (resim alanında)
for (const t of TAS) { t.x.save(); t.x.setTransform(O * S, 0, 0, O * S, O * OX, O * OY); t.x.beginPath(); t.x.rect(0, 0, 1024, 1024); t.x.clip(); }

// gök
{
  const gok = P2('M0,0 H1024 V800 H0 Z');
  hepsi(gok, {
    mavi: lg(0, 0, 0, 800, [[0, 0.62], [0.45, 0.42], [0.8, 0.12], [1, 0.02]]),
    gokMavi: lg(0, 0, 0, 800, [[0, 0.8], [0.55, 0.55], [0.85, 0.2], [1, 0.04]]),
    sari: lg(0, 0, 0, 800, [[0.3, 0], [0.75, 0.24], [1, 0.38]]),
    pembe: lg(0, 0, 0, 800, [[0.55, 0], [0.8, 0.18], [1, 0.14]]),
    prusya: rg(0, 0, 0, 0, 0, 600, [[0, 0.1], [1, 0]]),
  });
  // güneşin çevresi: mavi kalkar, sarı ışık
  for (const ad of ['mavi', 'prusya', 'gokMavi']) {
    const x = T[ad]; const g = x.createRadialGradient(880, 140, 40, 880, 140, 330);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.35, 'rgba(0,0,0,0.65)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fill(gok);
  }
  ekle('sari', gok, rg(880, 140, 44, 880, 140, 300, [[0, 0.62], [0.3, 0.3], [1, 0]]));
  ekle('pembe', gok, rg(880, 140, 120, 880, 140, 320, [[0, 0], [0.5, 0.1], [1, 0]]));
  // güneş kursu
  hepsi(SAHNE.daireYolu(880, 140, 46), { sari: 0.42, okra: 0.05 });
  cizTas('okra', SAHNE.daireYolu(880, 140, 47), 2.5, 0.55);
  // bulutlar: kâğıt beyazı, altları gri ve pembe, üstleri sarımsı
  const rb = SAHNE.rng(31);
  const BULUT = [[170, 250, 1.0], [505, 150, 0.82], [760, 335, 1.1], [945, 470, 0.7], [95, 470, 0.72]];
  for (const [bx, by, bs] of BULUT) {
    const p = new Path2D();
    const parca = [];
    for (let i = 0; i < 9; i++) {
      const u = (i / 8 - 0.5) * 2;
      const r = (26 + rb() * 18) * bs * (1 - 0.45 * Math.abs(u));
      const cx = bx + u * 92 * bs, cy = by - r * 0.45 + (rb() - 0.5) * 8 * bs;
      parca.push([cx, cy, r]);
      p.moveTo(cx + r, cy); p.arc(cx, cy, r, 0, TAU);
    }
    p.rect(bx - 100 * bs, by - 6 * bs, 200 * bs, 16 * bs);
    hepsi(p, {
      gri: lg(0, by - 40 * bs, 0, by + 12 * bs, [[0, 0], [0.55, 0.06], [1, 0.32]]),
      pembe: lg(0, by - 30 * bs, 0, by + 12 * bs, [[0, 0], [1, 0.26]]),
      sari: lg(0, by - 50 * bs, 0, by, [[0, bx > 450 ? 0.22 : 0.08], [1, 0]]),
      mavi: lg(0, by - 50 * bs, 0, by + 10 * bs, [[0, 0.0], [1, 0.12]]),
    });
  }
}
// zemin
hepsi('M0,800 H1024 V1024 H0 Z', {
  sari: 0.55,
  okra: lg(0, 800, 0, 1024, [[0, 0.1], [0.5, 0.24], [1, 0.36]]),
  pembe: lg(0, 800, 0, 1024, [[0, 0.2], [1, 0.08]]),
  gri: lg(0, 800, 0, 1024, [[0, 0.16], [0.15, 0.03], [1, 0.1]]),
  mavi: lg(0, 800, 0, 860, [[0, 0.18], [1, 0]]),
});
{
  // yapının sola düşen gölgesi ve kalemle çekilmiş yatay toprak izleri
  ekle('gri', 'M300,800 L120,826 L80,850 L300,850 L820,850 L820,800 Z', lg(0, 800, 0, 850, [[0, 0.36], [1, 0]]));
  ekle('prusya', 'M300,800 L150,822 L300,836 L820,836 L820,800 Z', lg(0, 800, 0, 836, [[0, 0.08], [1, 0]]));
  const rz = SAHNE.rng(812);
  for (let i = 0; i < 70; i++) {
    const y = 806 + rz() * 210, x = rz() * 1024, L = 30 + rz() * 110;
    cizTas(rz() < 0.5 ? 'gri' : 'okra', P2(`M${x},${y} C${x + L * 0.3},${y - 2} ${x + L * 0.7},${y + 2} ${x + L},${y}`), 2 + rz() * 3, 0.18 + rz() * 0.2, true);
  }
  cizTas('anahat', 'M0,800.5 H1024', 1, 0.6);
  // önde koyulaşan elle noktalanmış ılık gölge (pembe taş) ve köşelere doğru kalemle koyulaşma (gri taş)
  const zem = P2('M0,800 H1024 V1024 H0 Z');
  ekle('pembe', zem, lg(0, 840, 0, 1024, [[0, 0], [0.45, 0.12], [1, 0.26]]));
  ekle('mavi', zem, lg(0, 800, 0, 900, [[0, 0.14], [1, 0]]));
  // kalemle çekilmiş çimen öbekleri (yeşil ve okra taş)
  const rt = SAHNE.rng(813);
  for (let i = 0; i < 34; i++) {
    const x0 = 20 + rt() * 984, y0 = 830 + rt() * 180, n = 4 + Math.floor(rt() * 5), h = 8 + rt() * 12;
    const yolT = new Path2D();
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (k / (n - 1) - 0.5) * 1.3 + (rt() - 0.5) * 0.2, L = h * (0.6 + 0.5 * rt());
      const bx = x0 + (k - n / 2) * 2.2;
      yolT.moveTo(bx, y0); yolT.quadraticCurveTo(bx + Math.cos(a) * L * 0.4, y0 + Math.sin(a) * L * 0.6, bx + Math.cos(a) * L, y0 + Math.sin(a) * L);
    }
    cizTas('yesil', yolT, 1.6, 0.75, true);
    cizTas('okra', yolT, 2.4, 0.3, true);
  }
  // birkaç düz taş ve gölgeleri
  for (let i = 0; i < 9; i++) {
    const x0 = 60 + rt() * 900, y0 = 860 + rt() * 140, rx = 6 + rt() * 9, ry = rx * 0.45;
    const tasYol = SAHNE.elipsYolu({ cx: x0, cy: y0, rx, ry, aci: 0 });
    hepsi(tasYol, { sari: 0.3, gri: lg(x0 + rx, y0 - ry, x0 - rx, y0 + ry, [[0, 0.1], [1, 0.55]]), pembe: 0.1 });
    ekle('gri', SAHNE.elipsYolu({ cx: x0 - rx * 0.6, cy: y0 + ry * 0.8, rx: rx * 1.1, ry: ry * 0.5, aci: 0 }), 0.35);
    anahat(tasYol, 0.9);
  }
}

// minare
{
  const parcalar = SAHNE.minareParcalari();
  const tas = (x1, x2, koyu) => ({
    sari: 0.3,
    gri: lg(x1, 0, x2, 0, [[0, 0.42 + koyu], [0.5, 0.1 + koyu * 0.5], [0.8, 0.0], [1, 0.1]]),
    mavi: lg(x1, 0, x2, 0, [[0, 0.24], [0.55, 0.04], [1, 0.05]]),
    pembe: 0.07,
  });
  for (const p of parcalar) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'bant') { // zikzak bandı
      for (const z of SAHNE.zikzakCizgileri()) { cizTas('anahat', poly(z), 2.4, 0.85); cizTas('kirmizi', poly(z.map(([a, b]) => [a, b + 3])), 2.2, 0.45); }
      continue;
    }
    let d, x1, x2;
    if (p.tip === 'poligon') { d = SAHNE.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
    else if (p.tip === 'topuz') { d = p.yol; x1 = 266; x2 = 334; }

        kap = 0;
        for (let a = -1; a <= 1; a++) for (let bb = -1; bb <= 1; bb++) {
          const ux = cx + bb, uy = cy + a, h = ((uy & 255) << 8) | (ux & 255);
          const nu = (ux + 0.5 + JX[h]) * SP, nv = (uy + 0.5 + JY[h]) * SP;
          const du = nu - U, dv = nv - V;
          const nx = sx + du * NC + dv * NS, ny = sy - du * NS + dv * NC;
          const tx = Math.min(N - 1, Math.max(0, nx | 0)), ty = Math.min(N - 1, Math.max(0, ny | 0));
          const tv = t.ton[ty * N + tx] / 255;
          if (tv <= 0.01) continue;
          if (ATLA[h] && tv < 0.75) continue; // elle noktalamada atlanan yerler
          const rr = (SP * 0.5 * Math.sqrt(tv) + 0.35) * JS[h];
          const dd = Math.hypot(du, dv);
          const v = clamp(rr - dd + 0.5);
          if (v > kap) kap = v;
        }
      } else {
        const tv = t.ton[sy * N + sx] / 255;
        if (tv <= 0.005) continue;
        const gi = ((sy + k * 211) % N) * N + ((sx + k * 397) % N);
        kap = smooth(-0.07, 0.07, tv - G[gi]);
      }
      if (kap <= 0) continue;
      const o = kap * t.op;
      r *= 1 - o * (1 - t.ink[0]); g *= 1 - o * (1 - t.ink[1]); b *= 1 - o * (1 - t.ink[2]);
    }
    px[i * 4] = clamp(r) * 255;
    px[i * 4 + 1] = clamp(g) * 255;
    px[i * 4 + 2] = clamp(b) * 255;
    px[i * 4 + 3] = 255;
  }
}
ctx.putImageData(img, 0, 0);
SAHNE.hazir();
</script>
