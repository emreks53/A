<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-216 Sınırlı Palet Suluboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ======================================================================= suluboya motoru (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, kâğıt dokusu, yol örnekleme, elle çekilmiş çizgi
// ve saydam lavi katları. Her lavi kâğıda bir "pigment yoğunluğu" ekler; üst üste binen katlar çarpılarak
// koyulaşır (gerçek suluboya sırlaması gibi). Rastgelelik yalnız SAHNE.rng ile: görsel her seferinde aynı çıkar.
const S = SAHNE;
const OL = 2; // çalışma ölçeği: 2048 piksel, koordinatlar 1024
const WW = 1024 * OL;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler, eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim, kapali) {
  if (kapali) pts = pts.concat([pts[0]]);
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (!kapali && Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  if (kapali && out.length > 3) {
    const a = out[0];
    const b = out[out.length - 1];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < adim * 0.5) out.pop();
  }
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

let _ofs = 0;
/** Kapalı ya da açık nokta dizisinin kenarını elle titretir (düşük frekanslı oynama). */
function titret(pts, kapali, amp, fr, adim) {
  adim = adim || 1.5;
  const p = yenidenOrnekle(pts, adim, kapali);
  const N = normaller(p, kapali);
  const ofs = (_ofs += 7.9);
  const n = p.length;
  const L = n * adim;
  const R = (L * fr) / (2 * Math.PI);
  return p.map((q, i) => {
    let v;
    if (kapali) {
      const th = (i / n) * Math.PI * 2;
      v = (NZ.n(Math.cos(th) * R + ofs, Math.sin(th) * R + ofs * 0.3) - 0.5) * 2 + (NZ.n(Math.cos(th) * R * 3 + ofs + 50, Math.sin(th) * R * 3) - 0.5) * 0.6;
    } else {
      v = (NZ.n(i * adim * fr + ofs, ofs * 0.3) - 0.5) * 2 + (NZ.n(i * adim * fr * 3 + ofs + 50, 2.2) - 0.5) * 0.6;
    }
    return [q[0] + N[i][0] * amp * v, q[1] + N[i][1] * amp * v];
  });
}

/** Şekil: Path2D + sınır kutusu. polys: [[x,y]...] dizileri (kapalı). */
function sekil(polys, kural) {
  const yol = new Path2D();
  let x0 = 1e9;
  let y0 = 1e9;
  let x1 = -1e9;
  let y1 = -1e9;
  for (const p of polys) {
    p.forEach(([x, y], i) => {
      if (i) yol.lineTo(x, y);
      else yol.moveTo(x, y);
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    });
    yol.closePath();
  }
  return { yol, x0, y0, x1, y1, polys, kural: kural || 'nonzero' };
}
/** SVG yol dizgisinden elle titretilmiş şekil. */
function sekilYol(d, amp, fr, adim) {
  const polys = ornekle(d, adim || 1.5).map((p) => (amp ? titret(p.pts, true, amp, fr || 0.04, adim || 1.5) : p.pts));
  return sekil(polys);
}
/** Nokta dizisinden elle titretilmiş kapalı şekil. */
function sekilPoli(pts, amp, fr, adim) {
  return sekil([amp ? titret(pts, true, amp, fr || 0.04, adim || 1.5) : pts]);
}
/** Şekilleri birleştirir. */
function birlesik(liste) {
  return sekil(liste.flatMap((s) => s.polys));
}

/**
 * Elle çekilmiş çizginin şeridi (Path2D'ye eklenir): w kalınlık, titreme, frek, basinc (kalınlık oynaması),
 * basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta basınç düğümü, px)
 */
function seritPoli(pts, o) {
  const n = pts.length;
  if (n < 2) return null;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1];
  const N = normaller(pts, false);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    const q1 = NZ.n(t * fr + ofs, ofs * 0.37);
    const q2 = NZ.n(t * fr * 3.1 + ofs + 40, 5.5);
    const q3 = NZ.n(t * fr * 0.7 + ofs + 90, 3.3);
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.profil) w *= o.profil(t / (L || 1));
    if (a1 > 0 && t < a1) w *= 0.25 + 0.75 * Math.sin(((Math.PI / 2) * t) / a1);
    if (a2 > 0 && L - t < a2) w *= 0.1 + 0.9 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
    if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  return sol.concat(sag.reverse());
}
/** Nokta dizisini elle çekilmiş çizgi şekline çevirir. */
function cizgiSekil(pts, o) {
  const p = seritPoli(yenidenOrnekle(pts, o.adim || 1.1), o);
  return sekil([p]);
}
/** Birden çok çizgiyi tek şekilde toplar. */
function cizgilerSekil(liste, o) {
  return sekil(liste.map((pts) => seritPoli(yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o))).filter(Boolean));
}

// ---------------------------------------------------------------- kâğıt
const KAGIT = new Float32Array(WW * WW); // kâğıt yüzeyinin yüksekliği (0 çukur … 1 tepe)
/**
 * Kâğıt dokusu. o.tane: diş boyu (px, 1024 biriminde), o.iri: iri dalga payı, o.lif: lif çizgisi payı.
 */
function kagitKur(o) {
  const nz1 = gurultu(o.tohum || 11);
  const nz2 = gurultu((o.tohum || 11) + 1);
  const f1 = 1 / ((o.tane || 3) * OL);
  const f2 = f1 / 3.2;
  const iri = o.iri != null ? o.iri : 0.35;
  const lif = o.lif || 0;
  const tepe = o.tepe != null ? o.tepe : 1;
  let mn = 1e9;
  let mx = -1e9;
  for (let y = 0; y < WW; y++) {
    for (let x = 0; x < WW; x++) {
      let v = nz1.n(x * f1, y * f1) * 0.6 + nz1.n(x * f1 * 2.1 + 7, y * f1 * 2.1 + 3) * 0.25 + nz2.n(x * f2, y * f2) * iri;
      if (lif) v += lif * (nz2.n(x * f1 * 0.25 + 40, y * f1 * 2.5) - 0.5);
      if (tepe !== 1) v = Math.pow(Math.max(0, v), tepe);
      KAGIT[y * WW + x] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
  }
  const k = 1 / (mx - mn);
  for (let i = 0; i < KAGIT.length; i++) KAGIT[i] = (KAGIT[i] - mn) * k;
}

// ---------------------------------------------------------------- pigment yoğunlukları ve lavi
const D = [new Float32Array(WW * WW), new Float32Array(WW * WW), new Float32Array(WW * WW)];
/** Geniş ölçekli düzgünsüzlük dokusu (lavinin elle sürülmüş dalgası). 512², döşenebilir değil ama büyük. */
const DALGA = (function () {
  const nz = gurultu(909);
  const a = new Float32Array(512 * 512);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) a[y * 512 + x] = nz.fbm(x / 22, y / 22, 4);
  return a;
})();

const _mc = document.createElement('canvas');
const _bc = document.createElement('canvas');
/**
 * Lavi: şeklin içine saydam bir boya katı sürer ve kurur.
 *  v: [k0,k1,k2] yoğunluk katkısı (tam ağırlıkta)
 *  rim: kuruyan kenarın koyulaşması (0..), rimR: kenar koyulaşmasının genişliği (px)
 *  boncuk: kenarda ince koyu çizgi (boya birikintisi), gran: kâğıt çukurlarına çöken pigment (granülasyon)
 *  dalga: lavinin içindeki geniş düzgünsüzlük (0..1), dalgaO: dalga ölçeği, yatay: dalganın yatay uzaması
 *  yumusak: ıslak kenar (px bulanıklık; kenar koyulaşmasını azaltır), kuru: kenarın kâğıt dişine göre pürüzü
 *  haric: [sekil] lavinin dışında bırakılan (rezerve) yerler, carp: fn(x,y) → ağırlık çarpanı (degrade)
 */
function lavi(sk, o) {
  const v = o.v;
  const rimR = o.rimR != null ? o.rimR : 3;
  const rim = o.rim != null ? o.rim : 0.6;
  const boncuk = o.boncuk != null ? o.boncuk : 0.35;
  const gran = o.gran != null ? o.gran : 0.15;
  const dalga = o.dalga != null ? o.dalga : 0.14;
  const dalgaO = o.dalgaO || 1;
  const yatay = o.yatay || 1;
  const soft = o.yumusak || 0;
  const kuru = o.kuru != null ? o.kuru : 0.3;
  const carp = o.carp || null;
  const havuz = o.havuz != null ? o.havuz : 0.6; // eğik tahtada boya alt kenarda birikir
  const pad = Math.ceil(rimR * 3 + soft * 3 + 4);
  const x0 = Math.floor(sk.x0 - pad);
  const y0 = Math.floor(sk.y0 - pad);
  const x1 = Math.ceil(sk.x1 + pad);
  const y1 = Math.ceil(sk.y1 + pad);
  const bw = (x1 - x0) * OL;
  const bh = (y1 - y0) * OL;
  if (bw <= 0 || bh <= 0) return;
  _mc.width = bw;
  _mc.height = bh;
  const mx = _mc.getContext('2d', { willReadFrequently: true });
  mx.setTransform(OL, 0, 0, OL, -x0 * OL, -y0 * OL);
  mx.filter = soft ? `blur(${soft * OL}px)` : 'none';
  mx.fillStyle = '#fff';
  mx.fill(sk.yol, sk.kural || 'nonzero');
  mx.filter = 'none'; // sert bırakılan yerler ıslak kenardan etkilenmez
  if (o.haric) {
    mx.globalCompositeOperation = 'destination-out';
    for (const h of o.haric) mx.fill(h.yol, h.kural || 'nonzero');
    mx.globalCompositeOperation = 'source-over';
  }
  mx.filter = 'none';
  const m = mx.getImageData(0, 0, bw, bh).data;
  _bc.width = bw;
  _bc.height = bh;
  const bx = _bc.getContext('2d', { willReadFrequently: true });
  bx.filter = `blur(${0.9 * OL}px)`;
  bx.drawImage(_mc, 0, 0);
  const b0 = bx.getImageData(0, 0, bw, bh).data;
  bx.clearRect(0, 0, bw, bh);
  bx.filter = `blur(${rimR * OL}px)`;
  bx.drawImage(_mc, 0, 0);
  const b1 = bx.getImageData(0, 0, bw, bh).data;
  bx.filter = 'none';
  // yumuşak kenarla bırakılan yerler (ıslakken kenarı nemli fırçayla açılmış): kenar koyulaşması yok
  let hy = null;
  if (o.haricYum) {
    bx.clearRect(0, 0, bw, bh);
    bx.setTransform(OL, 0, 0, OL, -x0 * OL, -y0 * OL);
    bx.filter = `blur(${(o.haricYumR || 6) * OL}px)`;
    bx.fillStyle = '#fff';
    for (const h of o.haricYum) bx.fill(h.yol, h.kural || 'nonzero');
    bx.filter = 'none';
    bx.setTransform(1, 0, 0, 1, 0, 0);
    hy = bx.getImageData(0, 0, bw, bh).data;
  }
  // kuru fırçayla etrafından dolaşılan (rezerve) yerler: kenar sert ama kâğıt dişinde pürüzlü kırılır, bulanık değil
  let hk = null;
  const hkK = o.haricKuruK != null ? o.haricKuruK : 0.7;
  if (o.haricKuru) {
    bx.clearRect(0, 0, bw, bh);
    bx.setTransform(OL, 0, 0, OL, -x0 * OL, -y0 * OL);
    bx.filter = `blur(${(o.haricKuruR || 1.4) * OL}px)`;
    bx.fillStyle = '#fff';
    for (const h of o.haricKuru) bx.fill(h.yol, h.kural || 'nonzero');
    bx.filter = 'none';
    bx.setTransform(1, 0, 0, 1, 0, 0);
    hk = bx.getImageData(0, 0, bw, bh).data;
  }
  const ox = (o.dalgaOfs != null ? o.dalgaOfs : (_ofs += 37.1)) % 400;
  const oy = (ox * 1.7 + 91) % 400;
  const sc = 1 / (2 * OL * dalgaO);
  const D0 = D[0];
  const D1 = D[1];
  const D2 = D[2];
  const v0 = v[0];
  const v1 = v[1];
  const v2 = v[2];
  const kenarYumusak = soft > 0 ? Math.max(0, 1 - soft / 3) : 1;
  for (let py = 0; py < bh; py++) {
    const gy = y0 * OL + py;
    if (gy < 0 || gy >= WW) continue;
    const row = py * bw;
    const ty = (((gy * sc + oy) | 0) & 511) * 512;
    for (let px = 0; px < bw; px++) {
      const gx = x0 * OL + px;
      if (gx < 0 || gx >= WW) continue;
      const k = (row + px) * 4 + 3;
      const ma = m[k];
      if (ma === 0 && b0[k] === 0) continue;
      const gi = gy * WW + gx;
      const P = KAGIT[gi];
      let a;
      if (kuru > 0 && !soft) {
        const t = b0[k] / 255 + (P - 0.5) * kuru;
        a = t <= 0.38 ? 0 : t >= 0.62 ? 1 : yumusak(0.38, 0.62, t);
      } else a = ma / 255;
      if (hy) a *= 1 - hy[k] / 255;
      if (hk && hk[k]) {
        const t = 1 - hk[k] / 255 + (P - 0.5) * hkK;
        a *= t <= 0.4 ? 0 : t >= 0.6 ? 1 : yumusak(0.4, 0.6, t);
      }
      if (a <= 0.003) continue;
      const e1 = kenet((1 - b1[k] / 255) * 2, 0, 1) * kenarYumusak;
      const e0 = kenet((1 - b0[k] / 255) * 2, 0, 1) * kenarYumusak;
      const dv = DALGA[ty + ((((gx * sc) / yatay + ox) | 0) & 511)];
      let w = (1 + dalga * (dv - 0.5) * 2) * (1 + gran * (0.5 - P) * 2);
      if (carp) w *= carp(gx / OL, gy / OL);
      let rr = rim * e1 * e1;
      if (havuz && py > 2 && py < bh - 3) {
        const g = (b1[k - bw * 8] - b1[k + bw * 8]) / 255; // >0: şeklin alt kenarı
        if (g > 0) rr *= 1 + havuz * Math.min(1, g * 4);
        else rr *= 1 + havuz * 0.35 * Math.max(-1, g * 4);
      }
      w = a * (w + rr + boncuk * e0 * e0 * e0);
      if (w <= 0) continue;
      D0[gi] += w * v0;
      D1[gi] += w * v1;
      D2[gi] += w * v2;
    }
  }
}

/** Renkten (hex) RGB optik yoğunluk vektörü: kâğıdı o renge boyayan tam kat × k. */
function od(h, k) {
  const c = hex(h);
  k = k == null ? 1 : k;
  return c.map((v) => -Math.log(Math.max(4, v) / 252) * k);
}

/**
 * Kâğıdı ve yoğunlukları son görüntüye çevirir. renk(d0,d1,d2,P,out) → out[0..2] (0..255).
 * Kâğıt dişi sağ üstten gelen ışıkla hafifçe gölgelenir.
 */
function bitir(renk, o) {
  o = o || {};
  const c = document.createElement('canvas');
  c.width = WW;
  c.height = WW;
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(WW, WW);
  const d = im.data;
  const out = [0, 0, 0];
  const dis = o.dis != null ? o.dis : 0.07;
  const yon = OL - OL * WW; // sağ üst komşu
  for (let i = 0; i < WW * WW; i++) {
    const P = KAGIT[i];
    renk(D[0][i], D[1][i], D[2][i], P, out);
    const j = i + yon;
    const sh = j >= 0 ? 1 + dis * (P - KAGIT[j]) : 1;
    const k = i * 4;
    d[k] = out[0] * sh;
    d[k + 1] = out[1] * sh;
    d[k + 2] = out[2] * sh;
    d[k + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return { c, x };
}

// ---------------------------------------------------------------- sahne yardımcıları
const _prof = S.kubbeProfili(400);
/** Kubbe profilinden y → yarıçap. */
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}
/** Kubbede boylam aralığı [b1,b2] (radyan, -π/2..π/2) ve yükseklik aralığı [ya,yb] arasındaki dilim çokgeni. */
function kubbeDilimi(b1, b2, ya, yb, n) {
  n = n || 40;
  const sol = [];
  const sag = [];
  for (let i = 0; i <= n; i++) {
    const y = ya + ((yb - ya) * i) / n;
    const r = kubbeR(y);
    sol.push([560 + Math.sin(b1) * r, y]);
    sag.push([560 + Math.sin(b2) * r, y]);
  }
  return sol.concat(sag.reverse());
}
const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** Sivri kemer çokgeni. */
function kemerPoli(x, y, w, h) {
  return ornekle(S.kemerYolu(x, y, w, h), 0.8)[0].pts;
}
function elips(cx, cy, rx, ry, aci, n) {
  n = n || 48;
  const ca = Math.cos(aci || 0);
  const sa = Math.sin(aci || 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const u = Math.cos(t) * rx;
    const v = Math.sin(t) * ry;
    out.push([cx + u * ca - v * sa, cy + u * sa + v * ca]);
  }
  return out;
}

// ---------------------------------------------------------------- sahne biçimleri (ressamın ölçülü çizimi)
function bez3(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
}
/**
 * Yaprak: tam biçim ve orta damarla ayrılmış iki yarısı (yerel koordinatta hesaplanıp döndürülür).
 * bukum: orta damarın eğriliği (yaprak hafifçe kıvrılır), asim: iki yarının genişlik farkı, kes: gölge yarısına
 * sürülen ikinci sırrın dipten uca doğru ulaştığı oran (sırrın ucu yarının içinde sert bir kenar bırakır).
 */
function yaprakBicimi(y, bosluk, bukum, asim, kes) {
  bukum = bukum || 0;
  asim = asim || 0;
  kes = kes || 0.65;
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  const orta = (u) => bukum * L * 0.13 * Math.sin(Math.PI * u / L) * (0.5 + 0.5 * u / L);
  const n = 18;
  const ust = [];
  const alt = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const a1 = bez3([0, 0], [L * 0.35, -W * 0.75], [L * 0.8, -W * 0.45], [L, 0], t);
    const a2 = bez3([0, 0], [L * 0.35, W * 0.75], [L * 0.8, W * 0.45], [L, 0], t);
    ust.push([a1[0], a1[1] * (1 + asim) + orta(a1[0])]);
    alt.push([a2[0], a2[1] * (1 - asim) + orta(a2[0])]);
  }
  const g = (bosluk || 0) / 2;
  const damar = [];
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    damar.push([L * t, orta(L * t) - W * 0.05 * Math.sin(Math.PI * t)]);
  }
  // orta damar boşluğu: dipte geniş, uca doğru kapanır; bir yerde fırça damarı neredeyse kapatır
  const gen = (u) => g * Math.sin(Math.PI * Math.min(1, (u / L) * 1.25 + 0.06)) * (1 - 0.6 * Math.exp(-Math.pow((u / L - 0.62) / 0.1, 2)));
  const d1 = damar.map(([u, v]) => [u, v - gen(u)]);
  const d2 = damar.map(([u, v]) => [u, v + gen(u)]);
  const yarim1 = ust.concat(d1);
  const yarim2 = alt.concat(d2);
  const tam = ust.concat(alt.slice().reverse().slice(1));
  // ikinci sır: yarının dipten kes·L'ye kadarki kısmı, ucu hafif eğik ve dalgalı bir çizgiyle kesilmiş
  const kisa = (kenar, dm, isaret) => {
    const uc = L * kes;
    const k1 = kenar.filter(([u]) => u <= uc + 2.5 * isaret);
    const k2 = dm.filter(([u]) => u <= uc - 3 * isaret);
    const a = k1[k1.length - 1];
    const b = k2[0];
    const ara = [];
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      ara.push([a[0] + (b[0] - a[0]) * t + Math.sin(t * Math.PI * 2) * 1.2, a[1] + (b[1] - a[1]) * t]);
    }
    return k1.concat(ara, k2);
  };
  const kisa1 = kisa(ust, d1, 1);
  const kisa2 = kisa(alt, d2, -1);
  // uç kısım: kenarın ve damarın (1 − kes)·L'den uca kadarki kısmı; kesik ucu dalgalı
  const ucKisim = (kenar, dm) => {
    const uc = L * (1 - kes * 0.85);
    const k1 = kenar.filter(([u]) => u >= uc);
    const k2 = dm.filter(([u]) => u >= uc + 2);
    const a = k2[k2.length - 1];
    const b = k1[0];
    const ara = [];
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      ara.push([a[0] + (b[0] - a[0]) * t - Math.sin(t * Math.PI * 2) * 1.4, a[1] + (b[1] - a[1]) * t]);
    }
    return k1.concat(k2, ara);
  };
  const uc1 = ucKisim(ust, d1);
  const uc2 = ucKisim(alt, d2);
  const T = (arr) => arr.map(([u, v]) => p(u, v));
  // ışık sağ üstten: yarının dış normali ışığa bakıyor mu?
  const nx = -(-sa);
  const ny = -ca; // üst yarı (v<0) yönü
  const isikUst = nx * 0.66 + ny * -0.75 > 0;
  return { tam: T(tam), yarim: [T(yarim1), T(yarim2)], kisa: [T(kisa1), T(kisa2)], uc: [T(uc1), T(uc2)], isikli: isikUst ? 0 : 1, damar: T(damar.slice().reverse()), ucu: p(L, orta(L)) };
}
/** Beş taç yapraklı çiçeğin taç yaprakları (uçta hafif çentik) ve gölge yarıları. */
function cicekBicimi(c) {
  const out = { taclar: [], golgeler: [], ic: [] };
  const Lx = 0.66;
  const Ly = -0.75;
  for (let i = 0; i < 5; i++) {
    const a = c.aci + (i * Math.PI * 2) / 5;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const R = c.r;
    const pts = [];
    const n = 56;
    for (let k = 0; k < n; k++) {
      const t = (k / n) * Math.PI * 2;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41;
      const tt = Math.atan2(Math.sin(t), Math.cos(t));
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2)); // uçtaki çentik
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7; // dipte daralma
      pts.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.taclar.push(pts);
    // gölge tarafı: v ekseni ışığa bakmıyorsa v>0 yarısı gölgede
    const vx = -sa;
    const vy = ca;
    const isaret = vx * Lx + vy * Ly > 0 ? -1 : 1;
    const g = [];
    for (let k = 0; k <= 28; k++) {
      const t = (k / 28) * Math.PI;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41 * isaret;
      const tt = t;
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2));
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    for (let k = 10; k >= 0; k--) {
      const u = R * 0.03 + (R * 0.97 * k) / 10;
      const v = R * 0.05 * Math.sin((Math.PI * k) / 10) * isaret;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.golgeler.push(g);
    out.ic.push(a);
  }
  return out;
}
/** Düzensiz, yatay uzanan bulut biçimi (tabanı düzce, üstü yumuşak dalgalı; pul pul değil). */
function bulutBicimi(cx, cy, rx, ry, tohum) {
  const nz = gurultu(tohum);
  const pts = [];
  const n = 120;
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const c = Math.cos(t);
    const s = Math.sin(t);
    let r = 1 + 0.22 * (nz.n(c * 1.6 + 5, s * 1.6 + 5) - 0.5) * 2 + 0.08 * (nz.n(c * 4 + 9, s * 4 + 2) - 0.5) * 2;
    let x = cx + c * rx * r;
    let y = cy + s * ry * r * (s < 0 ? 1.05 : 0.55);
    if (s > 0) y = Math.min(y, cy + ry * 0.38 + (nz.n(c * 3, 7) - 0.5) * ry * 0.15);
    pts.push([x, y]);
  }
  return pts;
}
/** Sahnedeki bütün biçimler (titreme genliği amp). */
function sahneSekilleri(amp) {
  amp = amp == null ? 0.6 : amp;
  const G = {};
  const fr = 0.05;
  G.minareParca = {};
  const minareListe = [];
  for (const p of S.minareParcalari()) {
    if (p.tip === 'poligon') G.minareParca[p.ad] = sekilPoli(p.noktalar, amp, fr);
    else if (p.tip === 'korkuluk' || p.tip === 'bant') G.minareParca[p.ad] = sekilPoli(dikd(p.x1, p.y1, p.x2, p.y2), amp, fr);
    else if (p.tip === 'topuz') G.minareParca[p.ad] = sekilYol(p.yol, amp * 0.6, fr);
    else if (p.tip === 'alem') G.minareAlemP = p.alem;
    if (G.minareParca[p.ad]) minareListe.push(G.minareParca[p.ad]);
  }
  G.minare = birlesik(minareListe);
  const alemSekilleri = (a, k) => ({
    yaka: sekilPoli(elips(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 40), amp * 0.3 * k, 0.1, 0.8),
    cubuk: sekilPoli(dikd(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), amp * 0.2 * k, 0.1, 0.8),
    kureler: a.kureler.map((q) => sekilPoli(elips(q.cx, q.cy, q.r, q.r, 0, 36), amp * 0.25 * k, 0.12, 0.7)),
    hilal: sekilYol(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), amp * 0.15 * k, 0.12, 0.6),
  });
  G.minareAlem = alemSekilleri(G.minareAlemP, 0.6);
  G.alemP = S.alemParcalari(560, 300, 1);
  G.alem = alemSekilleri(G.alemP, 1);
  const alemListe = (A) => [A.yaka, A.cubuk, ...A.kureler, A.hilal];
  const K = S.kaide;
  G.kaide = sekilPoli(dikd(K.x1, K.y1, K.x2, K.y2), amp, fr);
  G.kornis = sekilPoli(dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), amp * 0.7, fr);
  G.kaidePencere = K.pencereler.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.5, 0.08, 1));
  G.kasnak = S.kasnak.map((q) => sekilPoli(dikd(q.x1, q.y1, q.x2, q.y2), amp, fr));
  G.kasnakPencereP = [0, 1].map((k) => S.kasnakPencereleri(k));
  G.kasnakPencere = G.kasnakPencereP.map((L) => L.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8)));
  G.minarePencere = S.minarePencereleri.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8));
  G.kubbe = sekilPoli(S.kubbeNoktalari(80), amp, fr);
  G.yapi = birlesik([G.minare, ...alemListe(G.minareAlem), G.kaide, G.kornis, ...G.kasnak, G.kubbe, ...alemListe(G.alem)]);
  // bitkiler
  const B = S.bitki;
  G.yapraklar = B.yapraklar.map((y, i) => Object.assign({ y }, yaprakBicimi(y, 0.9 + karma(i, 1, 216) * 1.5, (karma(i, 2, 216) - 0.5) * 2, (karma(i, 3, 216) - 0.5) * 0.36, 0.5 + karma(i, 4, 216) * 0.3)));
  G.cicekler = B.cicekler.map((c) => Object.assign({ c }, cicekBicimi(c)));
  G.cicekSekil = sekil(G.cicekler.flatMap((c) => c.taclar));
  G.tomurcuklar = B.tomurcuklar.map((t, i) => ({ t, i, pts: ornekle(S.tomurcukYolu(t), 1)[0].pts }));
  G.tomurcukSekil = sekil(G.tomurcuklar.map((t) => t.pts));
  G.saplar = B.saplar;
  return G;
}

/**
 * Kümülüs bulutu: birkaç farklı boyda tümseğin yumuşak birleşimi (pul pul değil), tabanı düzce.
 * Döner: {pts: dış çizgi, ust(x): üst kenar yüksekliği, taban, x0, x1, golge(oran, tohum): alt kısmın çokgeni}
 */
function kumulus(x0, x1, taban, h, tohum) {
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const k = 3 + Math.floor(r() * 2);
  const tum = [{ c: x0 + w * (0.36 + 0.26 * r()), s: w * (0.26 + 0.06 * r()), h }];
  for (let i = 1; i < k; i++) tum.push({ c: x0 + w * (0.14 + 0.72 * r()), s: w * (0.13 + 0.14 * r()), h: h * (0.42 + 0.4 * r()) });
  const tau = h * 0.14;
  const N = 90;
  const ust = [];
  const alt = [];
  const yuk = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = x0 + w * t;
    let s = 0;
    for (const b of tum) {
      const d = (x - b.c) / b.s;
      const v = d * d < 1 ? b.h * Math.pow(1 - d * d, 0.85) : 0;
      s += Math.exp(v / tau);
    }
    let ht = tau * Math.log(Math.max(1, s - (tum.length - 1)));
    ht *= Math.pow(Math.sin(Math.PI * t), 0.35);
    ht += h * 0.05 * (nz.n(t * 7, 1) - 0.5) * 2 * Math.sin(Math.PI * t);
    ht = Math.max(ht, h * 0.1 * Math.pow(Math.sin(Math.PI * t), 0.5));
    yuk.push(ht);
    ust.push([x, taban - ht]);
    alt.push([x, taban + h * 0.07 * Math.pow(Math.sin(Math.PI * t), 0.6) + h * 0.03 * (nz.n(t * 5, 9) - 0.5)]);
  }
  const pts = ust.concat(alt.slice().reverse());
  function golge(oran, ek) {
    const g = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const kes = taban - yuk[i] * oran + h * 0.09 * (nz.n(t * 4 + ek, 3 + ek) - 0.5) * 2;
      g.push([ust[i][0], Math.max(ust[i][1], Math.min(alt[i][1] - 0.5, kes))]);
    }
    return g.concat(alt.slice().reverse());
  }
  return { pts, golge, taban, x0, x1, h, yuk, ust, alt };
}

/**
 * Yatay bulut kümesi (stratokümülüs): uzun, alçak; üstü düzensiz dalgalı, uçları ince kuyruklu, tabanı düz.
 * Döner kumulus ile aynı biçimde nesne.
 */
function bulutBandi(x0, x1, taban, h, tohum) {
  const nz = gurultu(tohum);
  const r = S.rng(tohum);
  const w = x1 - x0;
  const N = 110;
  const ust = [];
  const alt = [];
  const yuk = [];
  const tum = [];
  const nt = 3 + Math.floor(r() * 3);
  for (let i = 0; i < nt; i++) tum.push({ c: 0.18 + (0.64 * (i + 0.2 + r() * 0.6)) / nt, s: 0.09 + r() * 0.09, a: 0.45 + r() * 0.55 });
  tum[Math.floor(r() * nt)].a = 1;
  let enb = 0;
  const ham = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    let v = 0;
    for (const b of tum) v = Math.max(v, b.a * Math.exp(-Math.pow((t - b.c) / b.s, 2)));
    let v2 = 0;
    for (const b of tum) v2 += b.a * Math.exp(-Math.pow((t - b.c) / b.s, 2));
    ham.push(0.65 * v + 0.35 * Math.min(1.2, v2));
    enb = Math.max(enb, ham[i]);
  }
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = x0 + w * t;
    const kuyruk = Math.pow(Math.sin(Math.PI * t), 0.3);
    let ht = h * kuyruk * (0.26 + 0.74 * (ham[i] / enb)) + h * 0.04 * (nz.n(t * 9, 1.3) - 0.5) * 2 * kuyruk;
    ht = Math.max(ht, h * 0.16 * kuyruk);
    yuk.push(ht);
    ust.push([x, taban - ht]);
    alt.push([x, taban + h * 0.12 * Math.pow(Math.sin(Math.PI * t), 0.5) * (0.6 + 0.8 * nz.n(t * 6 + 20, 4))]);
  }
  const pts = ust.concat(alt.slice().reverse());
  function golge(oran, ek) {
    const g = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const kes = taban - yuk[i] * oran + h * 0.12 * (nz.n(t * 6 + ek, 3 + ek) - 0.5) * 2;
      g.push([ust[i][0], Math.max(ust[i][1], Math.min(alt[i][1] - 0.5, kes))]);
    }
    return g.concat(alt.slice().reverse());
  }
  return { pts, golge, taban, x0, x1, h, yuk, ust, alt };
}

/**
 * Bulut kümesi: tabanı düz, farklı boyda birkaç tümseğin birleşimi (her tümsek elle titretilmiş yassı elips).
 * Döner: {sk: bütün bulut (birleşim), lobes, golge(oran, ek): tabandan oran·h yüksekliğe kadar alt kısım (birleşim)}
 * Gölgenin üst sınırı tümseklerin çizgisini izlemez, hafif dalgalı yatay bir çizgidir (ışık tepeleri açık bırakır).
 */
function bulutKumesi(x0, x1, taban, h, tohum, o) {
  o = o || {};
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const lob = [];
  const n = Math.max(3, Math.round(w / (o.lobBoy || 58)));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5 + (r() - 0.5) * 0.7) / n;
    const env = Math.pow(Math.sin(Math.PI * kenet(t, 0.02, 0.98)), 0.7);
    const ry = h * (0.3 + 0.7 * env * (0.55 + 0.45 * r()));
    const rx = Math.min(w * 0.3, ry * (1.05 + 0.7 * r()));
    lob.push({ cx: x0 + w * t, cy: taban - ry * (0.62 + 0.15 * r()), rx, ry });
  }
  lob.push({ cx: x0 + w * 0.5, cy: taban - h * 0.12, rx: w * 0.5, ry: h * 0.26 });
  const tabanY = (x) => taban + h * (o.tabanDalga || 0.035) * (nz.n(x / (o.tabanDalga ? 70 : 40), 3) - 0.5) * 2;
  const pz = o.puruz != null ? o.puruz : 0.07;
  const ham = lob.map((L, j) => {
    const pts = [];
    const m = 72;
    for (let k = 0; k < m; k++) {
      const a = (k / m) * Math.PI * 2;
      const q = 1 + pz * (nz.n(Math.cos(a) * 1.5 + j * 3.1, Math.sin(a) * 1.5 + j) - 0.5) * 2 + pz * 0.5 * (nz.n(Math.cos(a) * 4 + j * 1.3, Math.sin(a) * 4 + 9) - 0.5) * 2;
      pts.push([L.cx + Math.cos(a) * L.rx * q, L.cy + Math.sin(a) * L.ry * q]);
    }
    return titret(pts, true, o.amp != null ? o.amp : 0.9, 0.05, 1.5);
  });
  const kes = (dy) => ham.map((p) => p.map(([x, y]) => [x, Math.min(y, tabanY(x) + (dy || 0))]));
  const titrek = kes(0);
  /** x'teki bulut tepesinin yüksekliği (0..1, h'ye göre). */
  const tepeHam = (x) => {
    let t = 0;
    for (const L of lob) {
      const d = (x - L.cx) / L.rx;
      if (d * d < 1) t = Math.max(t, taban - (L.cy - L.ry * Math.sqrt(1 - d * d)));
    }
    return t / h;
  };
  const tepe = (x) => kenet(tepeHam(x), 0, 1.2);
  /** Alt (gölge) kısım: üst sınırı tepeyi kısmen izleyen dalgalı çizgi; uzat > 0 → tabanın altına taşar. */
  function golge(oran, ek, uzat, izle) {
    const cizgi = izle
      ? (x) => taban - h * oran * tepeHam(x) + h * 0.07 * (nz.n(x / 45 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2
      : (x) => taban - h * oran * (0.45 + 0.75 * tepe(x)) + h * 0.11 * (nz.n(x / 55 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2;
    return sekil(kes(uzat || 0).map((p) => p.map(([x, y]) => [x, Math.max(y, Math.min(cizgi(x), tabanY(x) - 0.5))])));
  }
  function ust(oran, ek) {
    const cizgi = (x) => taban - h * oran + h * 0.07 * (nz.n(x / 60 + (ek || 0) * 3.7, 17 + (ek || 0)) - 0.5) * 2;
    return sekil(titrek.map((p) => p.map(([x, y]) => [x, Math.min(y, cizgi(x))])));
  }
  const alt = (dy) => sekil([[[x0 - 60, taban + (dy || 0)], [x1 + 60, taban + (dy || 0)], [x1 + 60, taban + 260], [x0 - 60, taban + 260]]]);
  return { sk: sekil(titrek), lob, golge, ust, alt, tepe, tepeHam, taban, h, x0, x1 };
}

/**
 * Elle boyanmış kümülüs: tepesi birkaç geniş, yatık tümsekten oluşan düzensiz bir çizgi (yuvarlak pullar değil),
 * tabanı hemen hemen düz. Döner: {pts, sk, golge(oran, ek) → şekil, taban, h, x0, x1}
 */
function bulutCiz(x0, x1, taban, h, tohum, o) {
  o = o || {};
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const nb = o.tumsek || 4;
  const tum = [];
  for (let i = 0; i < nb; i++) tum.push({ c: 0.12 + (0.76 * (i + 0.2 + 0.6 * r())) / nb, s: 0.1 + 0.1 * r(), a: 0.5 + 0.4 * r(), egik: 0.1 + 0.2 * r() });
  tum[Math.floor(r() * nb)].a = 1;
  const N = 160;
  const ust = [];
  const alt = [];
  const yuk = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = x0 + w * t;
    let v = 0;
    let top = 0;
    for (const b of tum) {
      let d = (t - b.c) / b.s;
      d *= d < 0 ? 1 + b.egik : 1 - b.egik * 0.6; // rüzgâr tarafı biraz dik, öbür yanı yatık
      const q = d * d < 1 ? b.a * Math.pow(1 - d * d, 0.62) : 0; // yuvarlak ama geniş, yassı tümsek
      v = Math.max(v, q);
      top += q;
    }
    v = 0.8 * v + 0.2 * Math.min(1.1, top);
    const e = Math.min(t, 1 - t) / 0.07;
    const kuyruk = e < 1 ? Math.sqrt(1 - (1 - e) * (1 - e)) : 1; // uçlar yuvarlak ve küt
    let ht = h * kuyruk * (0.28 + 0.72 * v) + h * 0.06 * (nz.n(t * 11, 1.3) - 0.5) * 2 * kuyruk + h * 0.025 * (nz.n(t * 37, 4.1) - 0.5) * 2 * kuyruk;
    ht = Math.max(ht, h * 0.22 * kuyruk);
    yuk.push(ht);
    ust.push([x, taban - ht]);
    alt.push([x, taban + h * 0.07 * kuyruk * (0.5 + nz.n(t * 5 + 20, 4)) + h * 0.02 * (nz.n(t * 23, 8) - 0.5)]);
  }
  const pts = ust.concat(alt.slice().reverse());
  const sk = sekilPoli(pts, o.amp != null ? o.amp : 1.3, 0.035, 1.5);
  /** Alt (gölge) kısım: üst sınırı tepeyi kısmen izleyen, serbest elle çekilmiş dalgalı çizgi. */
  function golge(oran, ek) {
    const g = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const kes = taban - (yuk[i] * 0.3 + h * 0.42) * oran + h * 0.08 * (nz.n(t * 6 + ek, 3 + ek) - 0.5) * 2;
      g.push([ust[i][0], Math.max(ust[i][1] + 1.5, Math.min(alt[i][1] - 0.5, kes))]);
    }
    // alt kenar bulutun tabanından biraz taşar: gökle bindiği yerde ince koyu çizgi (beyaz kenar kalmaz)
    return sekilPoli(g.concat(alt.slice().reverse().map(([x, y]) => [x, y + 2.6])), 0.7, 0.05, 1.5);
  }
  return { pts, sk, golge, taban, h, x0, x1 };
}

// ======================================================================= S-216 Sınırlı Palet Suluboya
// Ressam yalnız üç pigmentle boyar: ultramarin (U), aureolin sarısı (A), kalıcı gül (R). Her lavi kâğıda bu üç
// pigmentten belli miktarlar ekler; renk, pigmentlerin dalga boyuna göre ışığı yutmasından (Beer–Lambert) hesaplanır.
// Böylece yeşiller mavi + sarıdan, gölgeler mavi + gülden kâğıdın üstünde karışır; beyazlar boş kâğıttır.

// ---- taze yeşil ayarı: hedef ton (OKLab derece), dönüş payı, doygunluk tavanı ve payı, açılma
const TAZE = { ton: 138, don: 0.4, tavan: 0.14, doy: 0.7, acik: 0.03, acikEsik: 0.85, acikBant: 0.06 };
// ---- üç pigmentin spektral yutma eğrileri (400–700 nm) ve renk dönüşümü
const SPEK = (function () {
  const L = [];
  for (let l = 400; l <= 700; l += 10) L.push(l);
  const g = (l, m, s1, s2) => Math.exp(-0.5 * Math.pow((l - m) / (l < m ? s1 : s2), 2));
  const xb = (l) => 1.056 * g(l, 599.8, 37.9, 31) + 0.362 * g(l, 442, 16, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2);
  const yb = (l) => 0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1);
  const zb = (l) => 1.217 * g(l, 437, 11.8, 36) + 0.681 * g(l, 459, 26, 13.8);
  const sig = (x) => 1 / (1 + Math.exp(-x));
  const p = [0.353, 2.076, 528.367, 40, 0, 686.676, 0.138, 1.833, 483.064, 9.767, 0.3, 1.671, 523.15, 50.276, 0.448];
  const AU = L.map((l) => p[0] + p[1] * sig((l - p[2]) / p[3]) * (1 - p[4] * sig((l - p[5]) / 18)));
  const AA = L.map((l) => p[6] + p[7] * (1 - sig((l - p[8]) / p[9])));
  const AR = L.map((l) => p[10] + p[11] * g(l, p[12], p[13], p[13] * 0.8) + p[14] * g(l, 460, 30, 30));
  const XB = L.map(xb);
  const YB = L.map(yb);
  const ZB = L.map(zb);
  const M = (X, Y, Z) => [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z];
  const W0 = M(XB.reduce((a, b) => a + b), YB.reduce((a, b) => a + b), ZB.reduce((a, b) => a + b));
  const kagit = 0.985;
  function rgb(u, a, r) {
    let X = 0;
    let Y = 0;
    let Z = 0;
    for (let i = 0; i < L.length; i++) {
      const t = kagit * Math.exp(-(u * AU[i] + a * AA[i] + r * AR[i]));
      X += t * XB[i];
      Y += t * YB[i];
      Z += t * ZB[i];
    }
    const lin = M(X, Y, Z).map((v, i) => Math.max(0, v / W0[i]));
    return tazeKarisim(lin, u, a, r).map((v) => {
      v = Math.max(0, v);
      v = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
      return Math.min(1, v) * 255;
    });
  }
  // Ultramarin ile saydam aureolinin ıslak kâğıtta verdiği temiz, taze yeşil: basit Beer–Lambert modeli bu karışımı
  // fazla bulanık (zeytinî) bulur. Mavi ve sarı birlikte olup gül az olduğunda renk OKLab'da yeşile doğru biraz
  // döndürülür, doygunluğu bir tavana doğru artırılır ve biraz açılır. Yalnız mavi (gök), yalnız sarı/gül (taş, altın)
  // ya da gül katılmış menekşe-gri karışımlar değişmez.
  function tazeKarisim(lin, u, a, r) {
    const w = (1 - Math.exp(-5 * Math.min(u, a))) * Math.exp(-10 * r);
    if (w < 0.002) return lin;
    const cb = Math.cbrt;
    const l = cb(0.4122214708 * lin[0] + 0.5363325363 * lin[1] + 0.0514459929 * lin[2]);
    const m = cb(0.2119034982 * lin[0] + 0.6806995451 * lin[1] + 0.1073969566 * lin[2]);
    const s = cb(0.0883024619 * lin[0] + 0.2817188376 * lin[1] + 0.6299787005 * lin[2]);
    const LL = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
    // çok sulu, kâğıda yakın açık karışımlar (ör. güneşin aureolini ile göğün mavisinin bindiği ince kenar)
    // doygun bir yeşile çevrilmez; aksi hâlde güneşin çevresinde yeşil bir halka doğar
    const wl = w * (1 - Math.min(1, Math.max(0, (LL - TAZE.acikEsik) / TAZE.acikBant)));
    if (wl < 0.002) return lin;
    const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
    const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    let C = Math.hypot(A, B);
    let h = (Math.atan2(B, A) * 180) / Math.PI;
    if (h > 70 && h < 220) h += (TAZE.ton - h) * TAZE.don * wl * Math.min(1, (h - 70) / 25) * Math.min(1, (220 - h) / 25);
    if (C < TAZE.tavan) C += (TAZE.tavan - C) * TAZE.doy * wl;
    const L2 = LL + TAZE.acik * wl;
    const hr = (h * Math.PI) / 180;
    let out = lin;
    for (let it = 0; it < 40; it++) {
      const a2 = C * Math.cos(hr);
      const b2 = C * Math.sin(hr);
      const l3 = Math.pow(L2 + 0.3963377774 * a2 + 0.2158037573 * b2, 3);
      const m3 = Math.pow(L2 - 0.1055613458 * a2 - 0.0638541728 * b2, 3);
      const s3 = Math.pow(L2 - 0.0894841775 * a2 - 1.291485548 * b2, 3);
      out = [4.0767416621 * l3 - 3.3077115913 * m3 + 0.2309699292 * s3, -1.2684380046 * l3 + 2.6097574011 * m3 - 0.3413193965 * s3, -0.0041960863 * l3 - 0.7034186147 * m3 + 1.707614701 * s3];
      if (out.every((v) => v >= -0.0005 && v <= 1.0005)) break;
      C *= 0.96;
    }
    return out;
  }
  // 3B tablo (her pigment 0..3.2 yoğunluk), üç doğrusal ara değer
  const N = 33;
  const MAX = 3.2;
  const T = new Float32Array(N * N * N * 3);
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++)
      for (let k = 0; k < N; k++) {
        const c = rgb((i / (N - 1)) * MAX, (j / (N - 1)) * MAX, (k / (N - 1)) * MAX);
        const q = ((i * N + j) * N + k) * 3;
        T[q] = c[0];
        T[q + 1] = c[1];
        T[q + 2] = c[2];
      }
  const s = (N - 1) / MAX;
  function bak(u, a, r, out) {
    u = kenet(u * s, 0, N - 1.001);
    a = kenet(a * s, 0, N - 1.001);
    r = kenet(r * s, 0, N - 1.001);
    const i = u | 0;
    const j = a | 0;
    const k = r | 0;
    const fu = u - i;
    const fa = a - j;
    const fr = r - k;
    for (let c = 0; c < 3; c++) {
      const q = (x, y, z) => T[((x * N + y) * N + z) * 3 + c];
      const c00 = q(i, j, k) * (1 - fr) + q(i, j, k + 1) * fr;
      const c01 = q(i, j + 1, k) * (1 - fr) + q(i, j + 1, k + 1) * fr;
      const c10 = q(i + 1, j, k) * (1 - fr) + q(i + 1, j, k + 1) * fr;
      const c11 = q(i + 1, j + 1, k) * (1 - fr) + q(i + 1, j + 1, k + 1) * fr;
      out[c] = (c00 * (1 - fa) + c01 * fa) * (1 - fu) + (c10 * (1 - fa) + c11 * fa) * fu;
    }
  }
  return { rgb, bak };
})();

/** Kubbe üzerinde dilim boyunca fırça vuruşu: boylam merkezi bm, yarım genişlik hw (radyan), ya → yb. */
function kubbeVurus(bm, hw, ya, yb, tohum, profil) {
  const nz = gurultu(tohum);
  const n = 34;
  const sol = [];
  const sag = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const y = ya + (yb - ya) * t;
    const rr = kubbeR(y);
    let w = profil ? profil(t) : Math.pow(Math.sin(Math.PI * (0.05 + 0.9 * t)), 0.4);
    w *= 1 + 0.16 * (nz.n(t * 4, 1) - 0.5) * 2;
    const c = bm + (nz.n(t * 2.2, 5) - 0.5) * hw * 0.5;
    sol.push([560 + Math.sin(c - hw * w) * rr, y]);
    sag.push([560 + Math.sin(c + hw * w) * rr, y]);
  }
  return sol.concat(sag.reverse());
}

const DILIM = 16;
const isikB = 0.62;
const rD = SAHNE.rng(2160);
for (let k = 0; k < DILIM; k++) {
  const b1 = -Math.PI / 2 + (Math.PI * k) / DILIM;
  const b2 = b1 + Math.PI / DILIM;
  const bm = (b1 + b2) / 2;
  const lit = Math.max(0, Math.cos(bm - isikB));
  // elde karıştırılan mavi her dilimde biraz başka: komşu dilimler belirgin biçimde ayrışır
  const fark = (k % 2 ? 1 : -1) * (0.13 + rD() * 0.08);
  const u = (0.1 + 0.17 * Math.pow(1 - lit, 1.1)) * (0.86 + rD() * 0.28 + fark);
  const gen = Math.max(0.25, Math.cos(bm)); // dilimin görünen genişliği (kenarlarda dar)
  const rose = 0.003 + 0.042 * (1 - lit) * (1 - lit);
  const pts = kubbeDilimi(b1, b2, 301, 556, 50);
  const n2 = pts.length / 2;
  const sk = sekilPoli(pts.map(([x, y], j) => [x + (j < n2 ? -1.5 : 1.5) * gen, y]), 0.5, 0.05, 1.2);
  // ışık tarafındaki dilimlerde ressam dilimin ortasında dar, uzun bir şeridi açık bırakır (sert kenarlı)
  const acik = [];
  if (lit > 0.8 && k < DILIM - 1) {
    const ya = 312 + rD() * 18;
    const yb = 430 + rD() * 90;
    acik.push(sekilPoli(kubbeVurus(b1 + (b2 - b1) * (0.42 + rD() * 0.16), (b2 - b1) * (0.15 + rD() * 0.07), ya, Math.min(548, yb + 40), 6100 + k, (t) => Math.pow(Math.sin(Math.PI * Math.min(0.5, 0.04 + 0.75 * t)), 0.55)), 0.6, 0.07, 1.2));
  }
  lavi(sk, { v: [u, 0, rose], rim: 0.65 * gen, rimR: 3.2, boncuk: 0.75 * gen, gran: 0.35, dalga: 0.34, dalgaO: 1.1, havuz: 1.3, kuru: 0.35, carp: (x, y) => 0.86 + 0.28 * ((y - 301) / 255), haric: bitkiRez.concat(acik) });
  // dilim boyunca ikinci vuruşlar: dar, sert kenarlı, kâğıtta kuruyup bindiği yerde koyulaşan
  const ns = 1 + (rD() < 0.6 ? 1 : 0);
  for (let s = 0; s < ns; s++) {
    const tepeden = rD() < 0.5;
    const ya = tepeden ? 304 + rD() * 26 : 360 + rD() * 120;
    const yb = tepeden ? (rD(), 554) : 554; // tepeden inen vuruş da dilimin dibine kadar iner: yarıda sivri biten (akıntıya benzeyen) uç kalmaz
    const hw = (b2 - b1) * (0.16 + rD() * 0.14);
    const c = b1 + (b2 - b1) * (0.28 + rD() * 0.44);
    const tur = rD();
    let v;
    if (lit > 0.6) v = tur < 0.5 ? [0.04, 0.17 + 0.06 * lit, 0] : [0.13, 0, 0.002];
    else if (lit > 0.25) v = tur < 0.4 ? [0.04, 0.2, 0] : [0.13, 0, 0.006];
    else v = tur < 0.5 ? [0.08, 0, 0.036] : [0.09, 0.06, 0.006];
    const profil = tepeden ? (t) => Math.pow(Math.sin(Math.PI * Math.min(0.5, 0.06 + 0.9 * t)), 0.5) : (t) => Math.pow(Math.min(1, Math.sin(Math.PI * 0.5 * Math.min(1, t * 2.2))), 0.6);
    lavi(sekilPoli(kubbeVurus(c, hw, ya, yb, 6200 + k * 3 + s, profil), 0.5, 0.06, 1.2), { v, rim: 0.75, rimR: 2.4, boncuk: 0.8, gran: 0.3, dalga: 0.25, dalgaO: 0.8, havuz: 1, kuru: 0.45, haric: bitkiRez.concat(acik) });
  }
  // bazı dilimlere tabandan ikinci mavi sır: yarıda kesilen üst kenarı kuruyup dilimin içinde sert çizgi kalır
  if (rD() < 0.55) {
    const ust = 400 + rD() * 110;
    const nz = gurultu(5100 + k);
    const yarim = [];
    for (let i = 0; i <= 30; i++) {
      const y = 556 - ((556 - ust) * i) / 30;
      yarim.push([560 + Math.sin(b1 - 0.004) * kubbeR(y), y]);
    }
    for (let i = 0; i <= 12; i++) {
      const bb = b1 + ((b2 - b1) * i) / 12;
      yarim.push([560 + Math.sin(bb) * kubbeR(ust), ust + (nz.n(i / 3, 2) - 0.5) * 12 + 5 * Math.sin((Math.PI * i) / 12)]);
    }
    for (let i = 30; i >= 0; i--) {
      const y = 556 - ((556 - ust) * i) / 30;
      yarim.push([560 + Math.sin(b2 + 0.004) * kubbeR(y), y]);
    }
    lavi(sekilPoli(yarim, 0.5, 0.06, 1.2), { v: [0.05 + 0.05 * (1 - lit), 0.0, 0.004 + 0.014 * (1 - lit)], rim: 0.7, rimR: 2.4, boncuk: 0.75, gran: 0.25, dalga: 0.12, haric: bitkiRez });
  }
}
// kubbenin gölgeli yanı (ultramarin + gül = menekşe-mavi) ve alt kenar: geniş, sert kenarlı iki sır; kenarları
// sol üstten sağ alta eğik iner (ışık sağ üstten), bu yüzden kaburgaları keser ve ayrı bir sır olarak okunur
function meridyenSekli(bA, bB, ya, yb, tohum, dalgaB) {
  const nz = gurultu(tohum);
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const y = ya + ((yb - ya) * i) / 40;
    pts.push([560 + Math.sin(bA) * kubbeR(y) - 2, y]);
  }
  for (let i = 40; i >= 0; i--) {
    const y = ya + ((yb - ya) * i) / 40;
    const bb = typeof bB === 'function' ? bB((y - ya) / (yb - ya)) : bB;
    const b = bb + (nz.n(i / 9, 2) - 0.5) * (dalgaB || 0.14);
    pts.push([560 + Math.sin(b) * kubbeR(y), y]);
  }
  return sekilPoli(pts, 0.8, 0.05);
}

// pencere araları yalnız yer yer ince bir fırça çizgisiyle belirtilir.
const rK = SAHNE.rng(2170);
G.kasnakPencereP.forEach((Lp, kat) => {
  const q = S.kasnak[kat];
  const Rk = (q.x2 - q.x1) / 2;
  const isikX = (x) => Math.max(0, Math.cos(Math.asin(kenet((x - 560) / Rk, -1, 1)) - isikB));
  const kes = [q.x1 - 2, 452 + rK() * 40 + kat * 18, 610 + rK() * 50, q.x2 + 2];
  for (let i = 0; i < kes.length - 1; i++) {
    const xa = kes[i] - (i ? 10 + rK() * 10 : 0);
    const xb = kes[i + 1];
    const lit = isikX((xa + xb) / 2);
    const u = (0.1 + 0.2 * (1 - lit)) * (0.92 + rK() * 0.16);
    const eg = (rK() - 0.5) * 10;
    lavi(sekilPoli([[xa + eg, q.y1], [xb - eg * 0.5, q.y1], [xb + eg * 0.5, q.y2], [xa - eg, q.y2]], 0.8, 0.05, 1.2), { v: [u, 0.0, 0.004 + 0.016 * (1 - lit)], rim: 0.7, rimR: 2.8, boncuk: 0.75, gran: 0.3, dalga: 0.36, dalgaO: 0.9, yatay: 2, havuz: 1.2, kuru: 0.35, carp: (x, y) => (1.12 - 0.3 * kenet((x - xa) / (xb - xa), 0, 1)) * (0.86 + 0.28 * ((y - q.y1) / (q.y2 - q.y1))), haric: bitkiRez });
  }
  // alt kısma ikinci sır: iki üç parça, her biri birkaç bölme boyunca; üst kenarı serbest elle, kuruyup sert kalır
  const nzk = gurultu(5300 + kat * 40);
  let x = q.x1 - 2;
  while (x < q.x2) {
    const x2 = Math.min(q.x2 + 2, x + 110 + rK() * 140);
    const ust = q.y1 + (q.y2 - q.y1) * (0.4 + rK() * 0.25);
    const pts = [[x, q.y2]];
    for (let j = 0; j <= 16; j++) {
      const xx = x + ((x2 - x) * j) / 16;
      pts.push([xx, ust + (nzk.n(xx / 30, kat * 3) - 0.5) * 9]);
    }
    pts.push([x2, q.y2]);
    const lit = isikX((x + x2) / 2);
    lavi(sekilPoli(pts, 0.5, 0.06, 1.2), { v: [0.05 + 0.08 * (1 - lit), 0.0, 0.004 + 0.02 * (1 - lit)], rim: 0.75, rimR: 2.4, boncuk: 0.8, gran: 0.3, dalga: 0.16, havuz: 1.2, haric: bitkiRez });
    if (x2 >= q.x2) break;
    x = x2 + 8 + rK() * 30;
  }
  // pencere araları: yer yer ince, kesik dikey fırça çizgisi
  for (let i = 0; i < Lp.length - 1; i++) {
    if (rK() < 0.45) continue;
    const xm = (Lp[i].x + Lp[i + 1].x) / 2 + (rK() - 0.5) * 2;
    const lit = isikX(xm);
    const ya = q.y1 + 6 + rK() * 6;
    const yb = q.y2 - 4 - rK() * 10;
    lavi(cizgiSekil([[xm, ya], [xm + (rK() - 0.5) * 1.5, yb]], { w: 1.3 + rK() * 1.2, titreme: 0.4, basinc: 0.4, basSivri: 4, sonSivri: 10 }), { v: [0.08 + 0.12 * (1 - lit), 0.02, 0.01 + 0.02 * (1 - lit)], rim: 0.3, rimR: 1, boncuk: 0.3, gran: 0.3, kuru: 0.45, haric: bitkiRez });
  }
});
// kasnağın gölge yanı: iki menekşe-mavi sır, kenarları sert ve dalgalı (bölmeleri aşar)
(function () {
  const nz = gurultu(5401);
  const gol = (xs, xe, tohum) => {
    const pts = [[353, 552], [xs, 552]];
    for (let i = 1; i <= 14; i++) {
      const y = 552 + (142 * i) / 14;
      pts.push([xs + (xe - xs) * (i / 14) + (nz.n(i / 3 + tohum, tohum) - 0.5) * 22, y]);
    }
    pts.push([335, 694], [335, 611], [353, 611]);
    return sekilPoli(pts, 0.9, 0.04);
  };
  const ust = birlesik([sekilPoli(dikd(0, 0, 1024, 552.5), 0, 0), sekilPoli(dikd(0, 552, 352.5, 610.5), 0, 0), sekilPoli(dikd(0, 610, 334.5, 700), 0, 0)]);
  lavi(gol(632, 650, 1), { v: [0.08, 0.0, 0.036], rim: 0.75, rimR: 2.8, boncuk: 0.8, gran: 0.3, dalga: 0.15, havuz: 1, haric: bitkiRez.concat([ust]) });
  lavi(gol(462, 432, 2), { v: [0.06, 0.0, 0.034], rim: 0.75, rimR: 2.6, boncuk: 0.8, gran: 0.3, dalga: 0.12, havuz: 1, haric: bitkiRez.concat([ust]) });
})();
// kubbe saçağının ve kat aralarının gölgesi: tek tek çekilmiş, kalınlığı oynayan, yer yer kesilen yatay vuruşlar
(function () {
  const rr = S.rng(5410);
  for (const [xa, xb, y, w, v] of [
    [350, 770, 559, 7.5, [0.2, 0.03, 0.05]],
    [334, 786, 613.5, 6.5, [0.2, 0.03, 0.05]],
    [334, 786, 689, 5.5, [0.16, 0.03, 0.04]],
  ]) {
    let x = xa - 2;
    while (x < xb) {
      const L = 110 + rr() * 170;
      const x2 = Math.min(xb + 2, x + L);
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.05) pts.push([x + (x2 - x) * t, y + (rr() - 0.5) * 0.6]);
      const lit = x > 560 ? 0.85 : 1.15;
      lavi(cizgiSekil(pts, { w: w * (0.85 + rr() * 0.3), titreme: 0.7, frek: 0.02, basinc: 0.45, basSivri: 8, sonSivri: 14, civi: 6 }), { v: v.map((q) => q * lit), rim: 0.6, rimR: 1.8, boncuk: 0.6, gran: 0.35, dalga: 0.2, kuru: 0.45, haric: bitkiRez });
      if (x2 >= xb) break;
      x = x2 - 4 - rr() * 10;
    }
  }
})();
// kasnak pencereleri: her pencere tek fırça darbesi (boya altta birikir); sonra sol yarısına ikinci, daha koyu sır
// (pencere içinin gölgesi): sağda ışıklı ince bir şerit kalır. Karışım pencereden pencereye biraz değişir.
const rW = SAHNE.rng(2172);
G.kasnakPencere.forEach((L, kat) =>
  L.forEach((p, i) => {
    const P = G.kasnakPencereP[kat][i];
    const sol = P.x < 560 ? 1.12 : 0.92;
    const u = (0.2 + rW() * 0.14) * sol;
    const ro = (0.06 + rW() * 0.09) * sol;
    lavi(p, { v: [u, 0.04 + rW() * 0.08, ro], rim: 0.7, rimR: 1.6, boncuk: 0.6, gran: 0.35, dalga: 0.14, havuz: 1.5, haric: bitkiRez });
    const ww = P.w * (0.55 + rW() * 0.1);
    lavi(sekilPoli(kemerPoli(P.x - P.w * 0.5 + ww * 0.5, P.y + 1.5, ww, P.h - 1.5), 0.35, 0.1, 0.8), { v: [0.12 * sol, 0.02, 0.06 * sol], rim: 0.6, rimR: 1.2, boncuk: 0.5, gran: 0.3, havuz: 1.2, haric: bitkiRez });
  })
);
// kubbe alemi
alemBoya(G.alem, G.alemP, 1);

// ---------------------------------------------------------------- toprak, yapraklar, saplar, çiçekler
const zemin = (function () {
  const nz = gurultu(77);
  const pts = [[-30, 1054], [1054, 1054]];
  for (let x = 1054; x >= -30; x -= 8) pts.push([x, 797 + (nz.n(x / 60, 1) - 0.5) * 6]);
  return sekil([pts]);
})();
// yapraklar toprak sırlarından korunur (ressam toprağı yaprakların çevresinden dolaştırır): yeşilleri gül kirletmez
const yaprakRez = sekil(G.yapraklar.map((Y) => Y.tam));
const toprakRez = [G.cicekSekil, G.tomurcukSekil, yaprakRez];
lavi(zemin, { v: [0.015, 0.09, 0.05], rim: 0.45, rimR: 3, boncuk: 0.4, gran: 0.35, dalga: 0.25, dalgaO: 1.4, yatay: 2.5, haric: [G.kaide, G.minare].concat(toprakRez) });
// toprak: yatay, uçları incelen geniş yuvarlak fırça darbeleri. Arkada gül-sarı (aureolin + gül), öne doğru sarı ve
// mavi + sarı açık yeşiller; bitki diplerinde birkaç menekşe-gri gölge darbesi. Darbeler bindiği yerde koyulaşır.
(function () {
  const rr = S.rng(7701);
  const M = {
    gul: [0.012, 0.19, 0.1],
    sari: [0.008, 0.24, 0.05],
    yesil: [0.11, 0.23, 0.008],
    yesil2: [0.15, 0.28, 0.01],
    menekse: [0.09, 0.015, 0.06],
  };
  // her geçiş uzun ve yatay; başı dolgun, sonu kuru fırçayla kâğıt dişinde kırılarak biter
  const gecis = [
    [812, 34, -60, 560, 'gul'], [818, 30, 420, 1090, 'sari'], [846, 40, 140, 860, 'gul'], [872, 36, -60, 380, 'menekse'],
    [890, 44, 560, 1090, 'yesil'], [915, 42, -60, 640, 'sari'], [948, 46, 300, 1090, 'yesil'], [976, 50, -60, 520, 'yesil2'],
    [1004, 48, 470, 1090, 'gul'], [930, 30, 760, 1090, 'menekse'], [1012, 40, -60, 300, 'sari'],
  ];
  for (const [y, w, xa, xb, ad] of gecis) {
    const x = xa + (rr() - 0.5) * 60;
    const L = xb - xa + (rr() - 0.5) * 80;
    const egim = (rr() - 0.5) * 0.03;
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 0.02) pts.push([x + L * t, y + egim * L * t + Math.sin(Math.PI * t) * (rr() - 0.5) * 0]);
    const k = 0.62 + rr() * 0.22;
    const bas = xa < 0 ? 0 : 26;
    const son = xb > 1024 ? 0 : 90;
    lavi(cizgiSekil(pts, { w: w * (0.9 + rr() * 0.2), titreme: 2.2, frek: 0.012, basinc: 0.25, basSivri: bas, sonSivri: son, civi: bas ? 12 : 0 }), {
      v: M[ad].map((q) => q * k),
      rim: 0.75,
      rimR: 3.2,
      boncuk: 0.85,
      gran: 0.4,
      dalga: 0.32,
      dalgaO: 1.1,
      yatay: 2.5,
      havuz: 1.4,
      kuru: 0.55,
      carp: (px) => 1.12 - 0.35 * kenet((px - x) / L, 0, 1),
      haric: toprakRez.concat([G.kaide, G.minare, sekilPoli(dikd(-100, -100, 1200, 799), 0, 0)]),
    });
  }
})();
lavi(sekilPoli([[230, 798], [300, 798], [300, 812], [236, 814]], 0.8, 0.05), { v: MX.tasGolge.map((q) => q * 0.9), rim: 0.6, rimR: 2, boncuk: 0.55, gran: 0.4, haric: bitkiRez });
lavi(sekilPoli([[300, 799], [820, 799], [826, 806], [300, 809]], 0.8, 0.05), { v: MX.tasGolge.map((q) => q * 0.75), rim: 0.6, rimR: 2, boncuk: 0.55, gran: 0.4, haric: bitkiRez });

// arkada açık yaprak katı: yuvarlak fırçanın tek darbeli sırları (bastırılıp kaldırılan fırça: dipte dolgun, uca doğru
// incelen, yer yer kâğıt dişinde kuru kırılan kenar); mavimsi ve sarımsı, birbirinin üstüne binen yerler koyulaşır
(function () {
  const rr = S.rng(881);
  for (let i = 0; i < 34; i++) {
    const x = -10 + rr() * 1044;
    const y = 862 + rr() * 178;
    const aci = -Math.PI / 2 + (x - 512) / 1100 + (rr() - 0.5) * 1.4;
    const L = 58 + rr() * 56;
    const w = 15 + rr() * 11;
    const bel = (rr() - 0.5) * 0.6;
    const pts = [];
    for (let k = 0; k <= 22; k++) {
      const t = k / 22;
      const o = Math.sin(Math.PI * t) * bel * L * 0.28;
      pts.push([x + Math.cos(aci) * L * t - Math.sin(aci) * o, y + Math.sin(aci) * L * t + Math.cos(aci) * o]);
    }
    const sk = cizgiSekil(pts, { w, titreme: 0.7, frek: 0.05, basinc: 0.22, profil: (t) => Math.pow(Math.sin(Math.PI * (0.18 + 0.82 * t)), 0.65) * (1 - 0.25 * t), basSivri: 3, sonSivri: L * 0.35 });
    const mavi = 0.08 + rr() * 0.22;
    lavi(sk, { v: [mavi, 0.2 + rr() * 0.2, 0.002], rim: 0.6, rimR: 2.2, boncuk: 0.55, gran: 0.3, dalga: 0.35, dalgaO: 0.6, kuru: 0.55, carp: (px, py) => 0.8 + 0.4 * kenet(((px - x) * Math.cos(aci) + (py - y) * Math.sin(aci)) / L, 0, 1), haric: [G.cicekSekil, G.tomurcukSekil] });
  }
})();
// saplar
for (const s of G.saplar) lavi(cizgiSekil(s, { w: 4, titreme: 0.5, frek: 0.02, basinc: 0.25, sonSivri: 40, basSivri: 6 }), { v: [0.4, 0.55, 0.015], rim: 0.35, rimR: 1.4, boncuk: 0.4, gran: 0.3, kuru: 0.25, haric: [G.cicekSekil] });
// yapraklar: her yarı ayrı lavi (orta damar beyaz kâğıt kalır, kalınlığı oynar). Ressam yeşili kâğıtta karıştırır:
// önce sarıya çalan açık bir yeşil, kuruyunca üstüne ultramarin sırrı: ışık yarısında yalnız uca doğru (uç daha mavi,
// dip daha sarı), gölge yarısında dipten (gül katılmış, menekşe-gri yeşil). Sırların ucu yarının içinde sert kenar
// bırakır, bindiği yer koyulaşır. Mavi sarıyı geçmez: yeşil turkuaza kaçmaz.
G.yapraklar.forEach((Y, i) => {
  const yuksek = Y.y.y < 800;
  const sari = 0.55 + r() * 0.35;
  const mavi = Math.min(sari * 0.8, 0.22 + r() * 0.34 + (yuksek ? -0.02 : 0.03));
  const kuv = yuksek ? 0.78 : 1;
  const yx = Math.cos(Y.y.aci);
  const yy = Math.sin(Y.y.aci);
  const Lq = Y.y.uzunluk;
  const carp = (px, py) => 0.82 + 0.4 * kenet(((px - Y.y.x) * yx + (py - Y.y.y) * yy) / Lq, 0, 1);
  const haric = [G.cicekSekil, G.tomurcukSekil];
  for (let h = 0; h < 2; h++) {
    const golge = h !== Y.isikli;
    const v = golge ? [mavi * kuv * 0.82, sari * kuv * 0.92, 0.02] : [mavi * kuv * 0.5, sari * kuv, 0.004];
    lavi(sekilPoli(Y.yarim[h], 0.35, 0.08, 1), { v, rim: 0.7, rimR: 2.2, boncuk: 0.65, gran: 0.3, dalga: 0.25, dalgaO: 0.6, havuz: 1.2, carp, haric });
    if (golge) lavi(sekilPoli(Y.kisa[h], 0.3, 0.08, 1), { v: [mavi * kuv * 0.55, sari * kuv * 0.1, 0.032], rim: 0.7, rimR: 1.8, boncuk: 0.7, gran: 0.3, dalga: 0.2, dalgaO: 0.6, havuz: 1, haric });
    else lavi(sekilPoli(Y.uc[h], 0.3, 0.08, 1), { v: [mavi * kuv * 0.45, 0, 0.003], rim: 0.7, rimR: 1.8, boncuk: 0.7, gran: 0.35, dalga: 0.2, dalgaO: 0.6, havuz: 1, haric });
  }
});
// tomurcuklar: gül dokunuşu + yeşil çanak; öndeki saksız tomurcuklara kısa sap
G.tomurcuklar.forEach((T) => {
  const t = T.t;
  if (T.i >= 8) {
    const ax = t.x - Math.cos(t.aci) * t.r * 0.8;
    const ay = t.y - Math.sin(t.aci) * t.r * 0.8;
    lavi(cizgiSekil([[ax, ay], [ax - 2 + (r() - 0.5) * 3, ay + 18], [ax - 3, ay + 30]], { w: 2.6, titreme: 0.3, basinc: 0.2, sonSivri: 10 }), { v: [0.38, 0.52, 0.015], rim: 0.3, rimR: 1.2, boncuk: 0.3, gran: 0.3, kuru: 0.2 });
  }
  lavi(sekilPoli(T.pts, 0.3, 0.1, 0.8), { v: [0.03, 0.04, 0.34], rim: 0.55, rimR: 1.6, boncuk: 0.5, gran: 0.2, dalga: 0.12 });
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
  lavi(sekilPoli([p(-t.r * 0.95, 0), p(-t.r * 0.2, -t.r * 0.95), p(t.r * 0.25, -t.r * 0.35), p(t.r * 0.1, 0), p(t.r * 0.25, t.r * 0.35), p(-t.r * 0.2, t.r * 0.95)], 0.3, 0.1, 0.8), { v: [0.36, 0.5, 0.012], rim: 0.45, rimR: 1.3, boncuk: 0.45, gran: 0.25 });
});
// çiçekler: taç yaprakları boş kâğıt; menekşe gölge sırları, sarı göbek
G.cicekler.forEach((C) => {
  const c = C.c;
  C.golgeler.forEach((g) => lavi(sekilPoli(g, 0.35, 0.08, 1), { v: [0.085, 0.006, 0.05], rim: 0.6, rimR: Math.max(1.4, c.r * 0.06), boncuk: 0.5, gran: 0.3, dalga: 0.15 }));
  // taç yaprağı dibinde ikinci, daha küçük gölge (bindirme)
  C.taclar.forEach((t, i) => {
    const a = C.ic[i];
    const pts = elips(c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3, c.r * 0.22, c.r * 0.16, a, 30);
    lavi(sekilPoli(pts, 0.3, 0.1, 0.8), { v: [0.06, 0.03, 0.035], rim: 0.5, rimR: 1.4, boncuk: 0.45, gran: 0.25 });
  });
  const R0 = c.r * 0.2;
  lavi(sekilPoli(elips(c.x, c.y, R0, R0 * 0.94, c.aci, 40), 0.35, 0.12, 0.8), { v: [0.0, 0.85, 0.04], rim: 0.5, rimR: 1.5, boncuk: 0.45, gran: 0.15 });
  const yarim = [];
  for (let i = 0; i <= 20; i++) {
    const t = 0.55 * Math.PI + (i / 20) * Math.PI;
    yarim.push([c.x + Math.cos(t) * R0, c.y + Math.sin(t) * R0 * 0.94]);
  }
  lavi(sekilPoli(yarim, 0.3, 0.12, 0.8), { v: [0.1, 0.4, 0.22], rim: 0.45, rimR: 1.2, boncuk: 0.4, gran: 0.2 });
  const n = Math.max(7, Math.round(c.r / 3.2));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.3;
    const rr = c.r * (0.27 + r() * 0.05);
    const x = c.x + Math.cos(a) * rr;
    const y = c.y + Math.sin(a) * rr;
    const d = Math.max(1.2, c.r * 0.04);
    lavi(sekilPoli(elips(x, y, d, d * 0.85, a, 12), 0.15, 0.2, 0.5), { v: [0.12, 0.7, 0.28], rim: 0.3, rimR: 0.8, boncuk: 0.3, gran: 0.1, kuru: 0.1 });
  }
});

// ---------------------------------------------------------------- son: pigmentler → renk
const son = bitir((u, a, rr, P, out) => SPEK.bak(u, a, rr, out), { dis: 0.028 });
ekranaAktar(son.c);
SAHNE.hazir();

</script>
