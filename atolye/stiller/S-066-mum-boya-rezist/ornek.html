<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-066 Mum Boya Rezist — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f7f3ea; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-066 Mum Boya Rezist — önce beyaz ve renkli mum boyalarla çizgi ve desen, sonra üstünden canlı suluboya
// yıkamaları. Mum boyayı iter: mum çizgileri kâğıt dokusunun tepelerinde tanecikli ve keskin kalır, boya
// çizgilerin kenarında birikir, mumun üstünde küçük damlalar hâlinde boncuklanır.
// Katmanlar 2048 iç çözünürlükte piksel piksel kurulur: mum basıncı (açıklaştır karışımıyla, öndeki öğe
// arkadakinin çizgisini siler) + kâğıt yüksekliği → mum kapsaması; yıkamalar optik yoğunluk olarak birikir.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  const karR = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // SVG yolunu nokta dizilerine çevir (her alt yol ayrı)
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('style', 'position:absolute;left:-3000px;top:0;width:10px;height:10px');
  const yolEl = document.createElementNS(svgNS, 'path');
  svgEl.appendChild(yolEl); document.body.appendChild(svgEl);
  function yolNoktalari(d, adim) {
    const parca = d.split(/(?=M)/).filter((s) => s.trim());
    return parca.map((p) => {
      yolEl.setAttribute('d', p);
      const L = yolEl.getTotalLength(), n = Math.max(3, Math.ceil(L / (adim || 3))), out = [];
      for (let i = 0; i <= n; i++) { const q = yolEl.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  // bölge haritası, istenen ölçekte (S × 1024): Uint8Array bölge sırası
  const BADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; BADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(S, donustur) {
    const w = 1024 * S, c = SAHNE.yeniTuval(w, w), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0);
    if (donustur) donustur(g);
    SAHNE.ciz(g, { bolge: true });
    const v = g.getImageData(0, 0, w, w).data, n = w * w, B = new Uint8Array(n), onb = new Map();
    for (let i = 0; i < n; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      B[i] = b;
    }
    return B;
  }
  const kume = (...adlar) => { const s = new Uint8Array(16); adlar.forEach((a) => (s[BI[a]] = 1)); return s; };
  // ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const PROF = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(1024), kubbeDr = new Float32Array(1024);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < PROF.length - 2 && PROF[j + 1].y > y) j++;
    const a = PROF[j], b = PROF[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), r = Math.max(1, kubbeR[yi]);
    const u = clamp((x - 560) / r, -1, 1), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    const l = Math.hypot(u, dr, c);
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / l);
  }
  function silindirIsik(x, cx, yr) {
    const u = clamp((x - cx) / yr, -1, 1), c = Math.sqrt(1 - u * u);
    return Math.max(0, u * LV[0] + c * LV[2]);
  }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }

  const S = 2, W2 = 1024 * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(6601);
  const BOL = bolgeDizisi(S);
  const nA = gurultu(11), nB = gurultu(12), nC = gurultu(13), nD = gurultu(14), nE = gurultu(15), nG = gurultu(16), nK = gurultu(17);

  // ------------------------------------------------------------ kâğıt (soğuk preslenmiş) yüksekliği
  const H = new Float32Array(N2);
  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    H[y * W2 + x] = 0.58 * fbm(nA, x / 7.5, y / 7.5, 3) + 0.27 * nB(x / 2.6, y / 2.6) + 0.15 * nK(x / 1.3, y / 1.3);
  }

  // ------------------------------------------------------------ mum boya katmanı
  const renkC = SAHNE.yeniTuval(W2, W2), renkG = renkC.getContext('2d', { willReadFrequently: true });
  const basC = SAHNE.yeniTuval(W2, W2), basG = basC.getContext('2d', { willReadFrequently: true });
  renkG.fillStyle = '#ffffff'; renkG.fillRect(0, 0, W2, W2);
  basG.fillStyle = '#000'; basG.fillRect(0, 0, W2, W2);
  renkG.setTransform(S, 0, 0, S, 0, 0); basG.setTransform(S, 0, 0, S, 0, 0);
  renkG.lineCap = basG.lineCap = 'round'; renkG.lineJoin = basG.lineJoin = 'round';
  basG.globalCompositeOperation = 'lighten';
  const MUM = {
    beyaz: '#FFFDF6', krem: '#FFF1B8', sari: '#F7D234', turuncu: '#F49A35', pembe: '#F27FA8',
    yesil: '#B9DE5C', mavi: '#A6DAF2', altin: '#EDB834', lila: '#D6B4F2', kirmizi: '#E9544E',
  };
  const gri = (p) => { const v = Math.round(clamp(p, 0, 1) * 255); return `rgb(${v},${v},${v})`; };
  // bir mum boya çizgisi: 2–3 iz (mumun ucu), boyunca değişen basınç ve kalınlık, uçlarda incelme
  function mum(pts, renk, gen, bas, o) {
    o = o || {};
    if (pts.length < 2) return;
    gen *= o.ham ? 1 : 1.3;
    const ph = R() * 200, iz = o.iz || (gen > 2.6 ? 3 : 2), jit = o.jit == null ? 0.5 : o.jit;
    // elle titreme
    const q = pts.map(([x, y], i) => [x + (nD(ph + i * 0.09, 1.7) - 0.5) * jit * 2, y + (nD(ph + i * 0.09, 9.3) - 0.5) * jit * 2]);
    renkG.strokeStyle = renk;
    for (let k = 0; k < iz; k++) {
      const off = iz > 1 ? ((k / (iz - 1)) - 0.5) * gen * 0.5 : 0;
      const pk = bas * (0.82 + 0.18 * R()), wk = gen * (iz > 1 ? 0.62 : 1);
      for (let i = 1; i < q.length; i++) {
        const [x0, y0] = q[i - 1], [x1, y1] = q[i];
        const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
        const t = i / (q.length - 1);
        const uc = o.uc === false ? 1 : Math.min(1, 0.45 + sstep(0, 0.12, t) * 0.55) * Math.min(1, 0.45 + sstep(1, 0.86, t) * 0.55);
        const p = pk * (0.72 + 0.56 * nC(ph + i * 0.21, k * 3.3)) * uc;
        const lw = wk * (0.8 + 0.4 * nC(ph + i * 0.13, 7 + k)) * (0.7 + 0.3 * uc);
        basG.strokeStyle = gri(p); basG.lineWidth = lw; renkG.lineWidth = lw;
        basG.beginPath(); basG.moveTo(x0 + nx * off, y0 + ny * off); basG.lineTo(x1 + nx * off, y1 + ny * off); basG.stroke();
        renkG.beginPath(); renkG.moveTo(x0 + nx * off, y0 + ny * off); renkG.lineTo(x1 + nx * off, y1 + ny * off); renkG.stroke();
      }
    }
  }
  const mumYol = (d, renk, gen, bas, o) => { for (const p of yolNoktalari(d, 2.2)) mum(p, renk, gen, bas, o); };
  const cizgi = (x0, y0, x1, y1, n) => { const out = []; n = n || Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2.5)); for (let i = 0; i <= n; i++) out.push([lerp(x0, x1, i / n), lerp(y0, y1, i / n)]); return out; };
  // öndeki öğe, arkadaki çizgileri siler (ressam arkadakini öndekinin içine çizmez)
  function sil(d) { const p = typeof d === 'string' ? new Path2D(d) : d; basG.globalCompositeOperation = 'source-over'; basG.fillStyle = '#000'; basG.fill(p); basG.globalCompositeOperation = 'lighten'; }
  // dolgu karalaması: kapalı yolun içini sıkı, yön değiştiren mum taramasıyla doldur
  function karala(d, renk, aci, aralik, gen, bas, kes) {
    const p = new Path2D(d);
    yolEl.setAttribute('d', d);
    const bb = yolEl.getBBox();
    renkG.save(); basG.save(); renkG.clip(p); basG.clip(p);
    if (kes) { const q = new Path2D(); q.rect(kes[0], kes[1], kes[2] - kes[0], kes[3] - kes[1]); renkG.clip(q); basG.clip(q); }
    const ca = Math.cos(aci), sa = Math.sin(aci), cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2, Rr = Math.hypot(bb.width, bb.height) / 2 + 4;
    for (let s = -Rr; s <= Rr; s += aralik) {
      const pts = [];
      for (let t = -Rr; t <= Rr; t += 2.5) pts.push([cx + ca * t - sa * s, cy + sa * t + ca * s]);
      mum(pts, renk, gen, bas, { uc: false, iz: 2, jit: 0.4 });
    }
    renkG.restore(); basG.restore();
  }

  const Y = SAHNE.yollar();
  // --- gök: güneş ve bulutlar
  {
    const gx = 880, gy = 140;
    karala(SAHNE.daireYolu(gx, gy, 27), MUM.sari, -0.6, 2.6, 3.4, 1);
    for (let k = 0; k < 2; k++) karala(SAHNE.daireYolu(gx, gy, 27), MUM.sari, 0.7 + k, 3.4, 3, 0.85);
    const halka = (r, renk, gen, bas) => { const pts = []; const a0 = R() * 6.3; for (let i = 0; i <= 90; i++) { const a = a0 + (i / 84) * Math.PI * 2; pts.push([gx + Math.cos(a) * r * (1 + (R() - 0.5) * 0.015), gy + Math.sin(a) * r * (1 + (R() - 0.5) * 0.015)]); } mum(pts, renk, gen, bas); };
    halka(36, MUM.turuncu, 4, 1); halka(47, MUM.sari, 3.4, 0.95); halka(58, MUM.beyaz, 3, 0.9);
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2 + 0.07, uzun = i % 2 ? 128 + R() * 30 : 175 + R() * 45, r0 = 70;
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.03) {
        const r = r0 + (uzun - r0) * t, dal = i % 2 ? 0 : Math.sin(t * 13 + i) * 5 * t;
        pts.push([gx + Math.cos(a) * r - Math.sin(a) * dal, gy + Math.sin(a) * r + Math.cos(a) * dal]);
      }
      mum(pts, i % 2 ? MUM.sari : MUM.beyaz, i % 2 ? 3.6 : 3, 0.95);
    }
  }
  // bulut: tümsekli üst kenar, düz taban; içi gevşek beyaz mum taramasıyla doldurulmuş, içinde kıvrımlar
  function bulut(bx, by, s) {
    const pts = [], adet = 5;
    const x0 = bx - 105 * s, x1 = bx + 105 * s;
    for (let k = 0; k < adet; k++) {
      const xa = lerp(x0, x1, k / adet), xb = lerp(x0, x1, (k + 1) / adet), xm = (xa + xb) / 2, rr = (xb - xa) / 2 * 1.18;
      const yuk = (1 - Math.abs(k / (adet - 1) - 0.5) * 1.3) * 30 * s + 8 * s;
      for (let i = 0; i <= 16; i++) { const a = Math.PI * 1.04 + (i / 16) * Math.PI * 0.92; pts.push([xm + Math.cos(a) * rr, by - yuk * 0.4 + Math.sin(a) * (rr * 0.5 + yuk * 0.62)]); }
    }
    const taban = [];
    for (let i = 0; i <= 30; i++) { const t = i / 30; taban.push([lerp(x1 + 4 * s, x0 - 4 * s, t), by + 6 * s + Math.sin(t * Math.PI) * 5 * s]); }
    const kontur = pts.concat(taban);
    const d = SAHNE.yol(kontur, true);
    karala(d, MUM.beyaz, -0.45 + (R() - 0.5) * 0.3, 6.5 * s + 2, 3.2, 0.72);
    mum(kontur.concat([kontur[0]]), MUM.beyaz, 3.6, 1, { uc: false });
    for (let k = 0; k < 3; k++) {
      const cx = bx + (k - 1) * 62 * s + (R() - 0.5) * 10, cy = by - 10 * s + (R() - 0.5) * 6, sp = [];
      for (let t = 0; t <= 1; t += 0.02) { const a = t * Math.PI * 3.2 + k, r = (2 + t * 13) * s; sp.push([cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 0.75]); }
      mum(sp, k === 1 ? MUM.mavi : MUM.beyaz, 2.8, 0.95);
    }
    for (let k = 0; k < 2; k++) mum(cizgi(bx - 70 * s + k * 50 * s, by + 18 * s + k * 9 * s, bx + 50 * s + k * 55 * s, by + 18 * s + k * 9 * s), MUM.mavi, 3, 0.85);
  }
  bulut(160, 240, 1.0); bulut(500, 150, 0.85); bulut(880, 345, 0.74); bulut(84, 462, 0.6); bulut(668, 236, 0.45);
  // gökte küçük yıldızcıklar ve rüzgâr kıvrımları
  {
    const rr = SAHNE.rng(31);
    for (let i = 0; i < 60; i++) {
      const x = 30 + rr() * 960, y = 30 + rr() * 520;
      if (SAHNE.kubbedeMi(x, y) || (x > 230 && x < 370 && y > 60) || Math.hypot(x - 880, y - 140) < 200 || (x > 340 && x < 790 && y > 280)) continue;
      const s = 5 + rr() * 4;
      if (i % 3 === 0) { for (let k = 0; k < 4; k++) { const a = (k / 4) * Math.PI; mum(cizgi(x - Math.cos(a) * s * (k % 2 ? 0.6 : 1), y - Math.sin(a) * s * (k % 2 ? 0.6 : 1), x + Math.cos(a) * s * (k % 2 ? 0.6 : 1), y + Math.sin(a) * s * (k % 2 ? 0.6 : 1), 4), k % 2 ? MUM.sari : MUM.beyaz, 2.2, 0.95, { jit: 0.2 }); } }
      else mum(cizgi(x, y, x + 1.5, y + 1, 2), i % 2 ? MUM.beyaz : MUM.sari, 4.2, 0.95, { jit: 0.2 });
    }
    // büyük rüzgâr sarmalları
    for (const [cx, cy, R0, tur, renk] of [[96, 98, 40, 2.3, MUM.mavi], [404, 52, 22, 1.8, MUM.beyaz], [985, 640, 26, 1.6, MUM.mavi]]) {
      const sp = [];
      for (let t = 0; t <= 1; t += 0.006) { const a = t * Math.PI * 2 * tur, r = R0 * (0.12 + 0.88 * t); sp.push([cx + Math.cos(a) * r * 1.25, cy + Math.sin(a) * r]); }
      const son = sp[sp.length - 1];
      for (let t = 0; t <= 1; t += 0.02) sp.push([son[0] + t * 150, son[1] + Math.sin(t * Math.PI * 1.4) * 10 + t * 4]);
      mum(sp, renk, 3, 0.95);
    }
    for (const [x0, y0, L, A] of [[20, 360, 210, 9], [600, 72, 190, 7], [410, 250, 120, 6], [640, 470, 0, 0]]) {
      if (!L) continue;
      const pts = []; for (let t = 0; t <= 1; t += 0.01) pts.push([x0 + L * t, y0 + Math.sin(t * Math.PI * 2.2) * A]);
      const sonA = Math.PI * 2.2, sx = x0 + L, sy = y0 + Math.sin(sonA) * A;
      for (let t = 0; t <= 1; t += 0.03) { const a = -Math.PI / 2 + t * Math.PI * 1.6, r = 12 * (1 - t * 0.6); pts.push([sx + Math.cos(a) * r, sy + 12 + Math.sin(a) * r]); }
      mum(pts, MUM.beyaz, 2.6, 0.85);
    }
  }

  // --- minare (arkada): dış çizgi, taş sıraları, zikzak, şerefe korkulukları, pencereler
  {
    sil('M246,800 L246,140 L354,140 L354,800 Z');
    const MP = SAHNE.minareParcalari();
    // ışıklı yan: hafif basınçla krem mum taraması (kâğıt tanesinin tepelerini tutar)
    for (const d of Y.minare) { karala(d, MUM.krem, 1.15, 3.6, 2.6, 0.52, [298, 60, 360, 800]); karala(d, MUM.beyaz, -0.4, 4.4, 2.4, 0.42, [306, 60, 360, 800]); }
    for (const d of Y.minare) mumYol(d, MUM.beyaz, 2.8, 1);
    const cx = 300;
    for (let y = 500; y < 800; y += 19) { if (y > 516 && y < 590) continue; mum(cizgi(cx - 33, y, cx + 33, y), MUM.beyaz, 1.7, 0.6); }
    for (let y = 330; y < 436; y += 18) mum(cizgi(cx - 26, y, cx + 26, y), MUM.beyaz, 1.6, 0.55);
    for (let y = 222; y < 272; y += 16) mum(cizgi(cx - 18, y, cx + 18, y), MUM.beyaz, 1.5, 0.5);
    const z = SAHNE.zikzakCizgileri();
    z.forEach((p, k) => mum(p, k === 1 ? MUM.pembe : MUM.turuncu, 3.4, 1, { uc: false }));
    for (const p of MP) if (p.tip === 'korkuluk') {

    { const ys = kume('yaprak', 'sap', 'cicek'); for (let i = 0; i < N2; i++) if (ys[BOL[i]]) YAP[i] = 1; }
    const YB = bulanik(YAP, W2, W2, 16);
    yika(A, [0, 780, 1024, 1024], (x, y, i, d) => {
      const w = n1(x, y, 90, 8), t = clamp((y - 800) / 224, 0, 1);
      const v = n1(x, y, 55, 13);
      ekle(i, d * (0.3 + 0.18 * w) * (0.6 + 0.6 * t), P.och);
      ekle(i, d * (0.05 + 0.26 * t) * (0.5 + 0.9 * w), P.ora);
      ekle(i, d * 0.3 * t * t * sstep(0.45, 0.75, w), P.sie);
      ekle(i, d * 0.42 * sstep(0.52, 0.78, v) * (1 - 0.5 * t), P.sap);
      ekle(i, d * 0.18 * YB[i] * sstep(0.35, 0.7, 1 - w * 0.6 + t * 0.2), P.ult);
      ekle(i, d * 0.06 * YB[i], P.vio);
      ekle(i, d * 0.22 * sstep(0.5, 0.2, w), P.gam);
      // yapının sola düşen gölgesi
      const gol = sstep(150, 260, x) * sstep(840, 700, x) * sstep(842 + (w - 0.5) * 30, 806, y) * sstep(790, 801, y);
      ekle(i, d * gol * 0.12, P.vio); ekle(i, d * gol * 0.24, P.ult);
    }, { kenar: 1, gran: 0.7, tohum: 8 });
  }
  // YAPRAKLAR ve SAPLAR: sap yeşili + ftalo + ultramarin, ıslakta değişen
  {
    const A = maske(kume('yaprak', 'sap'), 3, 0.35, 12, 9);
    yika(A, [0, 520, 1024, 1024], (x, y, i, d) => {
      const w = n1(x, y, 45, 10), v = n1(x, y, 120, 11);
      ekle(i, d * (0.5 + 0.4 * w), P.sap);
      ekle(i, d * (0.45 + 0.4 * (1 - w)), P.pht);
      ekle(i, d * 0.55 * sstep(0.45, 0.75, v), P.ult);
      ekle(i, d * 0.4 * sstep(0.55, 0.3, v), P.gam);
    }, { kenar: 1.2, gran: 0.5, dalga: 0.4, tohum: 9 });
  }
  // ÇİÇEKLER: gül + macenta, kimi mora çalan; ortada gamboj + turuncu
  {
    const Bt = SAHNE.bitki;
    const A = maske(kume('cicek'), 3, 0.35, 10, 10);
    yika(A, [0, 520, 1024, 1024], (x, y, i, d) => {
      let en = 1e9, c0 = null;
      for (const c of Bt.cicekler) { const q = Math.hypot(x - c.x, y - c.y) / c.r; if (q < en) { en = q; c0 = c; } }
      const isTom = en > 1.15;
      const w = n1(x, y, 30, 12), hue = c0 ? (Math.sin(c0.x * 0.05 + c0.y * 0.03) * 0.5 + 0.5) : 0.5;
      const rad = isTom ? 0.8 : clamp(en, 0, 1);
      const yog = isTom ? 0.9 : 0.35 + 0.6 * Math.pow(1 - rad, 1.4) + 0.2 * sstep(0.85, 1, rad);
      ekle(i, d * yog * (0.55 + 0.3 * w), P.ros);
      ekle(i, d * yog * (0.25 + 0.45 * hue) * (0.6 + 0.8 * (1 - w)), P.mag);
      ekle(i, d * yog * 0.35 * sstep(0.6, 0.95, hue), P.vio);
    }, { kenar: 1.2, gran: 0.4, dalga: 0.35, tohum: 10 });
    const A2 = maske(kume('cicekOrta'), 2, 0.2, 6, 11);
    yika(A2, [0, 520, 1024, 1024], (x, y, i, d) => { ekle(i, d * 0.8, P.gam); ekle(i, d * 0.45, P.ora); }, { kenar: 0.8, tohum: 11 });
  }

  // ------------------------------------------------------------ birleştirme: mum boyayı iter
  const kagit = [251, 248, 240];
  const img = ctx.createImageData(W2, W2), o = img.data;
  const DAMLA = new Float32Array(N2);
  // mumun üstünde boncuklanan boya damlaları
  {
    const rr = SAHNE.rng(77);
    for (let k = 0; k < 70000; k++) {
      const x = Math.floor(rr() * W2), y = Math.floor(rr() * W2), i = y * W2 + x;
      if (C[i] < 0.6 || DR[i] + DG[i] + DB[i] < 0.8 || rr() > 0.55) continue;
      const rad = (0.9 + rr() * rr() * 2.8) * S;
      const x0 = Math.max(0, Math.floor(x - rad - 1)), x1 = Math.min(W2 - 1, Math.ceil(x + rad + 1));
      const y0 = Math.max(0, Math.floor(y - rad - 1)), y1 = Math.min(W2 - 1, Math.ceil(y + rad + 1));
      const sx = (rr() - 0.5) * 0.5, sy = (rr() - 0.5) * 0.5;
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
        const q = Math.hypot((xx - x) * (1 + sx), (yy - y) * (1 + sy)) / rad;
        if (q > 1.05) continue;
        const v = (q < 1 ? 0.7 + 0.75 * Math.pow(q, 4) : 1.45 * (1.05 - q) / 0.05);
        const j = yy * W2 + xx;
        DAMLA[j] = Math.max(DAMLA[j], v);
      }
    }
  }
  // maskeleme bandı: kenarda temiz kâğıt payı, bandın altına hafifçe sızmış boya
  const PAY = 16 * S;
  const bant = (x, y) => {
    const d = Math.min(x, y, W2 - 1 - x, W2 - 1 - y) - PAY;
    const sz = (nK(x / 9, y / 9) - 0.5) * 1.6 * S + (nK(x / 2.1 + 40, y / 2.1) - 0.5) * 0.8 * S;
    return sstep(-0.8 * S, 0.6 * S, d + sz);
  };
  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x, bt = bant(x, y), c = C[i] * bt;
    if (bt < 1) { const f = bt; DR[i] *= f; DG[i] *= f; DB[i] *= f; }
    // kâğıt kabartısı (ışık sağ üstten)
    const xi = Math.min(W2 - 2, x), yi = Math.max(1, y);
    const eg = (H[yi * W2 + xi + 1] - H[(yi - 1) * W2 + xi]) * 0;
    const kab = 1 + (H[Math.max(0, y - 1) * W2 + Math.min(W2 - 1, x + 1)] - H[i]) * 0.55;
    // boya: mumun üstünde neredeyse yok, çevresinde birikir
    const havuz = (Math.max(0, Cb[i] - c) * 1.9 + Math.max(0, Cb2[i] - c) * 0.6) * bt;
    const dm = DAMLA[i] * bt;
    const kal = (1 - 0.94 * c) * (1 + havuz) + dm * c * 0.95;
    let r = kagit[0] * Math.exp(-DR[i] * kal), g = kagit[1] * Math.exp(-DG[i] * kal), b = kagit[2] * Math.exp(-DB[i] * kal);
    if (c > 0.001) {
      const cr = rv[i * 4], cg = rv[i * 4 + 1], cb = rv[i * 4 + 2];
      // mum: kâğıt tepelerinde parlak, hafif yarı saydam; üstünde ince bir boya filmi
      const film = 0.06 + dm * 0.0;
      const mr = cr * (0.93 + 0.1 * H[i]) * Math.exp(-DR[i] * film), mg = cg * (0.93 + 0.1 * H[i]) * Math.exp(-DG[i] * film), mb = cb * (0.93 + 0.1 * H[i]) * Math.exp(-DB[i] * film);
      const cc = c * (1 - Math.min(1, dm) * 0.9);
      r = r + (mr - r) * cc; g = g + (mg - g) * cc; b = b + (mb - b) * cc;
    }
    const k = kab;
    o[i * 4] = clamp(r * k, 0, 255); o[i * 4 + 1] = clamp(g * k, 0, 255); o[i * 4 + 2] = clamp(b * k, 0, 255); o[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
