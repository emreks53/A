<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-039 Masal Kitabı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f7edda; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-039 Masal Kitabı (Storybook Render) — çağdaş resimli çocuk kitabı illüstrasyonu.
// Her biçim ayrı bir guaj katmanıdır: degrade + maskeye kırpılmış fırça vuruşları → kâğıt dişine göre
// kuru fırça kenarı ve guaj tanesi (kenarda pigment birikmesi) → dolgunun koyu tonunda, iki titrek geçişli,
// kâğıt dişinde kopan renkli kalem konturu. Sıcak palet, yuvarlatılmış biçimler, bol süslü çiçekler,
// en sonda kâğıt lifi ve sağ üstten yumuşak sıcak ışık.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const T0 = performance.now();
  const zaman = (ad) => console.warn(ad + ' ' + Math.round(performance.now() - T0));
  const K = 2;
  const N = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);
  const rnd = S.rng(39);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3902);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  // ------------------------------------------------------------------ kâğıt dişi (ince tane) dokusu, 2048 çözünürlükte
  const DIS = new Float32Array(N * N);
  {
    const r = S.rng(3901);
    const kaba = new Float32Array(513 * 513);
    for (let i = 0; i < kaba.length; i++) kaba[i] = r();
    for (let y = 0; y < N; y++) {
      const fy = (y / N) * 512, iy = Math.floor(fy), ty = fy - iy;
      for (let x = 0; x < N; x++) {
        const fx = (x / N) * 512, ix = Math.floor(fx), tx = fx - ix;
        const a = kaba[iy * 513 + ix], b = kaba[iy * 513 + ix + 1], c = kaba[(iy + 1) * 513 + ix], d = kaba[(iy + 1) * 513 + ix + 1];
        const v = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
        DIS[y * N + x] = 0.55 * v + 0.45 * r();
      }
    }
  }
  const ss = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const karis = (a, b, t) => {
    const A = rgb(a), B = rgb(b);
    return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
  };

  // ------------------------------------------------------------------ guaj katmanı: dolgu + kuru fırça kenarı + tane; sonra renkli kalem kontur
  /**
   * o.ciz(g): maske yolu; o.boya(g): maskenin içine boyama (degrade, fırça izleri); o.kontur(g): kontur yolları (stroke);
   * o.kRenk: kontur rengi; o.kKal: kalınlık; o.kuru: kenar pürüzü (0..1); o.tane: guaj tanesi; o.golge: {dx,dy,blur,alfa}
   */
  function guaj(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = 8;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    // maske ve onun bulanık hâli (kenar uzaklığı yerine)
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const bc = tuvalYap(w, h);
    const bx = bc.getContext('2d', { willReadFrequently: true });
    bx.filter = `blur(${(o.kenarR || 2.2) * K}px)`;
    bx.drawImage(mc, 0, 0);
    const bd = bx.getImageData(0, 0, w, h).data;
    // boya
    const pc = tuvalYap(w, h);
    const pg = pc.getContext('2d', { willReadFrequently: true });
    pg.setTransform(K, 0, 0, K, -X0, -Y0);
    o.boya(pg);
    pg.setTransform(1, 0, 0, 1, 0, 0);
    pg.globalAlpha = 1;
    pg.globalCompositeOperation = 'destination-in';
    pg.drawImage(mc, 0, 0);
    pg.globalCompositeOperation = 'source-over';
    const md = mg.getImageData(0, 0, w, h).data;
    const img = pg.getImageData(0, 0, w, h);
    const P = img.data;
    const kuru = o.kuru != null ? o.kuru : 0.6;
    const tane = o.tane != null ? o.tane : 1;
    const sr = S.rng(Math.floor(X0 * 7 + Y0 * 13));
    const ofs = Math.floor(sr() * 1000);
    for (let y = 0; y < h; y++) {
      const gy = Y0 + y;
      for (let x = 0; x < w; x++) {
        const i = y * w + x, j = i * 4;
        const a = md[j + 3] / 255;
        if (a <= 0) {
          P[j + 3] = 0;
          continue;
        }
        const gx = X0 + x;
        const t = DIS[gy * N + gx];
        const t2 = DIS[((gy + ofs) % N) * N + ((gx * 3 + ofs) % N)];
        const B = bd[j + 3] / 255; // içeride 1, kenara doğru 0.5'e iner
        // kuru fırça: kenarda kâğıt dişine göre boya kopar
        let al = a;
        if (kuru > 0) al *= ss(0.5, 0.5 + 0.22 * kuru, B + (t - 0.5) * 0.5 * kuru + 0.08);
        // guaj tanesi: boya kâğıdın dişine göre hafif açılıp koyulaşır; kenarda pigment birikir
        const k = 1 + (t2 - 0.5) * 0.16 * tane - (1 - ss(0.55, 0.85, B)) * 0.07 * tane;
        P[j] = P[j] * k;
        P[j + 1] = P[j + 1] * k;
        P[j + 2] = P[j + 2] * k;
        P[j + 3] = al * 255;
      }
    }
    pg.setTransform(1, 0, 0, 1, 0, 0);
    pg.globalCompositeOperation = 'source-over';
    pg.putImageData(img, 0, 0);
    const hedef = o.hedef || ana;
    if (o.golge) {
      const gl = o.golge;
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(mc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#5a3a2a';
      sx.fillRect(0, 0, w, h);
      const pad = Math.ceil(gl.blur * K * 2.5) + 2;
      const c2 = tuvalYap(w + 2 * pad, h + 2 * pad);
      const x2 = c2.getContext('2d');
      x2.filter = `blur(${gl.blur * K}px)`;
      x2.drawImage(sc, pad, pad);
      hedef.save();
      hedef.globalAlpha = gl.alfa;
      hedef.globalCompositeOperation = 'multiply';
      hedef.drawImage(c2, X0 + gl.dx * K - pad, Y0 + gl.dy * K - pad);
      hedef.restore();
    }
    hedef.drawImage(pc, X0, Y0);
    if (o.kontur) kalem(o.kontur, o.kRenk, o.kKal || 2, hedef, X0, Y0, w, h, o.kAlfa, o.oyma);
  }

  /** Renkli kalem / pastel boya konturu: iki titrek geçiş, kâğıt dişinde kopan çizgi. */
  function kalem(ciz, renk, kal, hedef, X0, Y0, w, h, alfa, oyma) {
    if (X0 == null) {
      const b = sinir((g) => {
        g.lineWidth = kal + 4;
        ciz(g);
      });
      if (!b) return;
      X0 = Math.max(0, Math.floor((b.x0 - 8) * K));
      Y0 = Math.max(0, Math.floor((b.y0 - 8) * K));
      w = Math.min(N, Math.ceil((b.x1 + 8) * K)) - X0;
      h = Math.min(N, Math.ceil((b.y1 + 8) * K)) - Y0;
    }
    const c = tuvalYap(w, h);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.strokeStyle = renk;
    g.fillStyle = renk;
    const gecis = [[0, 0, 1], [0.45, -0.35, 0.7], [-0.3, 0.4, 0.55]];
    for (const [dx, dy, kk] of gecis) {
      g.setTransform(K, 0, 0, K, -X0 + dx * K, -Y0 + dy * K);
      g.lineWidth = kal * kk;
      g.globalAlpha = 0.75;
      ciz(g);
    }
    if (oyma) {
      g.setTransform(K, 0, 0, K, -X0, -Y0);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'destination-out';
      oyma(g);
      g.globalCompositeOperation = 'source-over';
    }
    const id = g.getImageData(0, 0, w, h);
    const P = id.data;
    for (let y = 0; y < h; y++) {
      const gy = Y0 + y;
      for (let x = 0; x < w; x++) {
        const j = (y * w + x) * 4;
        if (!P[j + 3]) continue;
        const t = DIS[gy * N + X0 + x];
        P[j + 3] = P[j + 3] * ss(0.18, 0.6, t + 0.12) * (alfa || 0.92);
      }
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.putImageData(id, 0, 0);
    (hedef || ana).drawImage(c, X0, Y0);
  }

  /** Maskeye kırpılmış fırça vuruşları (guaj katmanlaması): renkler, yön ve sayı verilir. */
  function vuruslar(g, x1, y1, x2, y2, renkler, adet, boy, en, aci, alfa, tohum) {
    const r = S.rng(tohum || 1);
    g.save();
    g.lineCap = 'round';
    for (let i = 0; i < adet; i++) {
      const x = x1 + r() * (x2 - x1), y = y1 + r() * (y2 - y1);
      const a = (typeof aci === 'function' ? aci(x, y) : aci) + (r() - 0.5) * 0.35;
      const L = boy * (0.6 + r() * 0.8);
      g.strokeStyle = renkler[Math.floor(r() * renkler.length)];
      g.globalAlpha = alfa * (0.5 + r() * 0.5);
      g.lineWidth = en * (0.6 + r() * 0.8);
      g.beginPath();
      g.moveTo(x - Math.cos(a) * L / 2, y - Math.sin(a) * L / 2);
      g.quadraticCurveTo(x + (r() - 0.5) * L * 0.3, y + (r() - 0.5) * L * 0.3, x + Math.cos(a) * L / 2, y + Math.sin(a) * L / 2);
      g.stroke();
    }
    g.restore();
  }

  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  function yDik(g, x1, y1, x2, y2, r) {
    g.beginPath();
    g.roundRect(x1, y1, x2 - x1, y2 - y1, r);
  }

  // ================================================================== 1. kâğıt ve gök
  {
    const g = ana;
    g.fillStyle = '#F7EDDA';
    g.fillRect(0, 0, N, N);
  }
  guaj({
    ciz: (g) => g.fillRect(-10, -10, 1044, 820),
    boya: (g) => {
      const gr = g.createLinearGradient(0, 0, 0, 800);
      gr.addColorStop(0, '#9CC7DD');
      gr.addColorStop(0.5, '#C6DFDF');
      gr.addColorStop(0.85, '#F6DFBF');
      gr.addColorStop(1, '#F8D9B4');
      g.fillStyle = gr;
      g.fillRect(0, 0, 1024, 820);
      const gl = g.createRadialGradient(880, 140, 20, 880, 140, 360);
      gl.addColorStop(0, 'rgba(255,236,190,0.95)');
      gl.addColorStop(0.4, 'rgba(255,226,180,0.4)');
      gl.addColorStop(1, 'rgba(255,226,180,0)');
      g.fillStyle = gl;
      g.fillRect(0, 0, 1024, 820);
      vuruslar(g, 0, 0, 1024, 800, ['#B5D6E3', '#A9CFE0', '#D3E6E3', '#F2E2C6'], 900, 60, 10, (x, y) => -0.08 + Math.sin(y / 90) * 0.1, 0.18, 11);
    },
    kuru: 1,
    kenarR: 4,
  });
  zaman('gok');
  // güneş: sıcak sarı disk, turuncu kalem konturu
  guaj({
    ciz: (g) => { g.beginPath(); g.arc(880, 140, 48, 0, 7); g.fill(); },
    boya: (g) => {
      const gr = g.createRadialGradient(866, 126, 4, 880, 140, 50);
      gr.addColorStop(0, '#FFF3C4');
      gr.addColorStop(1, '#F7C95A');
      g.fillStyle = gr;
      g.fillRect(820, 80, 120, 120);
      vuruslar(g, 832, 92, 928, 188, ['#FBD877', '#FFE9A6'], 40, 22, 5, -0.5, 0.35, 3);
    },
    kontur: (g) => { g.beginPath(); g.arc(880, 140, 48, 0, 7); g.stroke(); },
    kRenk: '#D98A2B',
    kKal: 2.4,
  });
  // bulutlar: yuvarlak, krem; mavi-gri kalem konturu
  const bulutlar = [
    [165, 250, 1.0],
    [480, 150, 0.82],
    [770, 330, 1.0],
    [70, 470, 0.7],
    [955, 470, 0.66],
  ];
  for (const [bx, by, bs] of bulutlar) {
    const yol = new Path2D();
    const r = S.rng(Math.round(bx + by * 3));
    // klasik resimli kitap bulutu: düz tabanlı, yuvarlak topaklardan
    const tops = [[-0.36, 0.0, 0.2], [-0.14, -0.14, 0.27], [0.12, -0.08, 0.24], [0.33, 0.02, 0.17]];
    const L = 190 * bs;
    for (const [u, v, rr] of tops) {
      const cx = bx + u * L, cy = by + v * L, R = rr * L * (0.95 + r() * 0.1);
      yol.moveTo(cx + R, cy);
      yol.arc(cx, cy, R, 0, Math.PI * 2);
    }
    yol.roundRect(bx - 0.5 * L, by - 0.02 * L, L, 0.16 * L, 0.08 * L);
    const H = 50 * bs;
    guaj({
      ciz: (g) => g.fill(yol),
      boya: (g) => {
        const gr = g.createLinearGradient(0, by - L * 0.4, 0, by + L * 0.15);
        gr.addColorStop(0, '#FFFCF5');
        gr.addColorStop(0.7, '#F6EDE4');
        gr.addColorStop(1, '#E3D6CF');
        g.fillStyle = gr;
        g.fillRect(bx - L, by - L, L * 2, L * 1.4);

  const minikler = [];
  for (let i = 0; i < 34; i++) minikler.push([30 + rr() * 964, 830 + rr() * 190, 7 + rr() * 5, rr()]);
  for (let i = 0; i < 10; i++) {
    const yan = i % 2 ? 1 : -1;
    minikler.push([yan < 0 ? 40 + rr() * 200 : 790 + rr() * 200, 600 + rr() * 220, 6 + rr() * 4, rr()]);
  }
  minikler.sort((a, b) => a[1] - b[1]);
  zaman('minik0');
  for (const [x, y, r, t] of minikler) {
    if (t < 0.45) minikCicek(x, y, r, '#9EC3EA', '#5B7FB0', '#F4CF5A');
    else if (t < 0.75) minikCicek(x, y, r, '#FFF4E4', '#C8A07A', '#E9A93A');
    else minikCicek(x, y, r, '#F6C0CF', '#C27088', '#F4CF5A');
  }
  zaman('minik');
  // tomurcuklar
  for (const t of B.tomurcuklar) {
    const yl = P2(S.tomurcukYolu(t));
    guaj({ ciz: (g) => g.fill(yl), boya: (g) => { const gr = g.createLinearGradient(t.x - t.r, t.y + t.r, t.x + t.r, t.y - t.r); gr.addColorStop(0, '#E98AA3'); gr.addColorStop(1, '#F8C3D0'); g.fillStyle = gr; g.fillRect(t.x - 30, t.y - 30, 60, 60); }, kontur: (g) => g.stroke(yl), kRenk: '#B04F6E', kKal: 1.3, kuru: 0.3, kenarR: 1 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const cn = new Path2D();
    cn.ellipse(t.x - ca * t.r * 0.6, t.y - sa * t.r * 0.6, t.r * 0.75, t.r * 0.42, t.aci, 0, 7);
    guaj({ ciz: (g) => g.fill(cn), boya: (g) => { g.fillStyle = '#6FA453'; g.fillRect(t.x - 30, t.y - 30, 60, 60); }, kontur: (g) => g.stroke(cn), kRenk: '#3F6E30', kKal: 1.1, kuru: 0.2, kenarR: 0.6 });
  }
  // büyük çiçekler: gül, papatya ve beş yapraklı bahar çiçeği (sırayla)
  function gul(c) {
    const R = c.r * 0.95;
    const dis = new Path2D();
    for (let k = 0; k < 7; k++) {
      const a = c.aci + (k / 7) * Math.PI * 2;
      dis.moveTo(c.x + Math.cos(a) * R * 0.5 + R * 0.55, c.y + Math.sin(a) * R * 0.5);
      dis.arc(c.x + Math.cos(a) * R * 0.5, c.y + Math.sin(a) * R * 0.5, R * 0.55, 0, 7);
    }
    guaj({
      ciz: (g) => g.fill(dis),
      boya: (g) => {
        const gr = g.createRadialGradient(c.x + R * 0.2, c.y - R * 0.25, R * 0.1, c.x, c.y, R * 1.15);
        gr.addColorStop(0, '#FBC9C9');
        gr.addColorStop(0.6, '#F39A9E');
        gr.addColorStop(1, '#E07882');
        g.fillStyle = gr;
        g.fillRect(c.x - R * 1.3, c.y - R * 1.3, R * 2.6, R * 2.6);
        vuruslar(g, c.x - R, c.y - R, c.x + R, c.y + R, ['#F7B2B4', '#E8858D', '#FCD6D2'], 30, R * 0.5, R * 0.1, (x, y) => Math.atan2(y - c.y, x - c.x) + Math.PI / 2, 0.4, Math.round(c.x));
      },
      kontur: (g) => g.stroke(dis),
      kRenk: '#B04B5A',
      kKal: 1.8,
      kuru: 0.45,
      kenarR: 1.5,
      golge: { dx: -2, dy: 3, blur: 3, alfa: 0.3, renk: '#7A4A3A' },
    });
    // iç taç: sarmal kalem kıvrımları
    const ic = new Path2D();
    ic.arc(c.x, c.y, R * 0.55, 0, 7);
    guaj({ ciz: (g) => g.fill(ic), boya: (g) => { const gr = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, R * 0.6); gr.addColorStop(0, '#D9606F'); gr.addColorStop(1, '#F29CA2'); g.fillStyle = gr; g.fillRect(c.x - R, c.y - R, R * 2, R * 2); }, kuru: 0.3, kenarR: 1.2 });
    kalem((g) => {
      g.beginPath();
      for (let t = 0; t < 1; t += 0.01) {
        const a = c.aci + t * Math.PI * 5.2, rad = R * (0.06 + 0.5 * t);
        const x = c.x + Math.cos(a) * rad, y = c.y + Math.sin(a) * rad * 0.92;
        if (t === 0) g.moveTo(x, y);
        else g.lineTo(x, y);
      }
      g.stroke();
      for (let k = 0; k < 7; k++) {
        const a = c.aci + (k / 7) * Math.PI * 2 + 0.4;
        g.beginPath();
        g.arc(c.x + Math.cos(a) * R * 0.5, c.y + Math.sin(a) * R * 0.5, R * 0.36, a + 1.9, a + 3.3);
        g.stroke();
      }
    }, '#A33F52', 1.6);
  }
  function papatya(c) {
    const R = c.r * 1.0;
    const yl = new Path2D();
    const n = 14;
    for (let k = 0; k < n; k++) {
      const a = c.aci + (k / n) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const p = (u, v) => [c.x + u * ca - v * sa, c.y + u * sa + v * ca];
      const q0 = p(R * 0.2, 0), q1 = p(R * 0.55, -R * 0.16), q2 = p(R * 1.0, -R * 0.1), q3 = p(R * 1.02, 0), q4 = p(R * 1.0, R * 0.1), q5 = p(R * 0.55, R * 0.16);
      yl.moveTo(q0[0], q0[1]);
      yl.bezierCurveTo(q1[0], q1[1], q2[0], q2[1], q3[0], q3[1]);
      yl.bezierCurveTo(q4[0], q4[1], q5[0], q5[1], q0[0], q0[1]);
      yl.closePath();
    }
    guaj({
      ciz: (g) => g.fill(yl),
      boya: (g) => {
        const gr = g.createRadialGradient(c.x + R * 0.3, c.y - R * 0.3, R * 0.1, c.x, c.y, R * 1.1);
        gr.addColorStop(0, '#FFFDF6');
        gr.addColorStop(1, '#EFE0CF');
        g.fillStyle = gr;
        g.fillRect(c.x - R * 1.2, c.y - R * 1.2, R * 2.4, R * 2.4);
      },
      kontur: (g) => g.stroke(yl),
      kRenk: '#B9926A',
      kKal: 1.4,
      kuru: 0.4,
      kenarR: 1,
      golge: { dx: -2, dy: 3, blur: 3, alfa: 0.3, renk: '#7A5A3A' },
    });
    const o = new Path2D();
    o.arc(c.x, c.y, R * 0.26, 0, 7);
    guaj({ ciz: (g) => g.fill(o), boya: (g) => { const gr = g.createRadialGradient(c.x + R * 0.08, c.y - R * 0.08, 1, c.x, c.y, R * 0.28); gr.addColorStop(0, '#FBD86A'); gr.addColorStop(1, '#E2A132'); g.fillStyle = gr; g.fillRect(c.x - R * 0.4, c.y - R * 0.4, R * 0.8, R * 0.8); }, kontur: (g) => g.stroke(o), kRenk: '#A8661C', kKal: 1.3, kuru: 0.3, kenarR: 0.8 });
    kalem((g) => { for (let k = 0; k < 10; k++) { const a = k * 2.4, rad = R * 0.16 * Math.sqrt(k / 10); g.beginPath(); g.arc(c.x + Math.cos(a) * rad, c.y + Math.sin(a) * rad, 0.6, 0, 7); g.stroke(); } }, '#A8661C', 1.6);
  }
  function bahar(c, renk) {
    const [a1, a2, kr] = renk;
    for (const e of S.tacYapraklari(c)) {
      const yl = new Path2D();
      const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
      const p = (u, v) => [c.x + u * ca - v * sa, c.y + u * sa + v * ca];
      const L = c.r * 1.04, W = c.r * 0.5;
      const q = [p(L * 0.1, 0), p(L * 0.3, -W * 1.1), p(L * 0.95, -W * 1.05), p(L * 0.98, -W * 0.2), p(L * 0.86, 0), p(L * 0.98, W * 0.2), p(L * 0.95, W * 1.05), p(L * 0.3, W * 1.1)];
      yl.moveTo(q[0][0], q[0][1]);
      yl.bezierCurveTo(q[1][0], q[1][1], q[2][0], q[2][1], q[3][0], q[3][1]);
      yl.quadraticCurveTo(q[4][0], q[4][1], q[5][0], q[5][1]);
      yl.bezierCurveTo(q[6][0], q[6][1], q[7][0], q[7][1], q[0][0], q[0][1]);
      yl.closePath();
      guaj({
        ciz: (g) => g.fill(yl),
        boya: (g) => {
          const gr = g.createRadialGradient(c.x, c.y, c.r * 0.1, c.x, c.y, c.r * 1.05);
          gr.addColorStop(0, a2);
          gr.addColorStop(0.5, a1);
          gr.addColorStop(1, karis(a1, '#FFFFFF', 0.35));
          g.fillStyle = gr;
          g.fillRect(c.x - c.r * 1.2, c.y - c.r * 1.2, c.r * 2.4, c.r * 2.4);
        },
        kontur: (g) => {
          g.stroke(yl);
          const m0 = p(L * 0.3, 0), m1 = p(L * 0.65, 0);
          g.beginPath();
          g.moveTo(m0[0], m0[1]);
          g.lineTo(m1[0], m1[1]);
          g.stroke();
        },
        kRenk: kr,
        kKal: 1.5,
        kuru: 0.4,
        kenarR: 1.1,
        golge: { dx: -1.5, dy: 2.5, blur: 2.5, alfa: 0.28, renk: '#7A4A3A' },
      });
    }
    const o = new Path2D();
    o.arc(c.x, c.y, c.r * 0.2, 0, 7);
    guaj({ ciz: (g) => g.fill(o), boya: (g) => { g.fillStyle = '#F2C04A'; g.fillRect(c.x - c.r, c.y - c.r, c.r * 2, c.r * 2); }, kontur: (g) => g.stroke(o), kRenk: '#A8661C', kKal: 1.2, kuru: 0.3, kenarR: 0.7 });
    kalem((g) => { for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; g.beginPath(); g.arc(c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3, 0.5, 0, 7); g.stroke(); } }, '#A8661C', Math.max(1.6, c.r * 0.06));
  }
  const BAHAR = [
    ['#F6B8C8', '#E77F9C', '#B04F6E'],
    ['#FCD2B4', '#F29B78', '#BC6A44'],
    ['#E6C9F0', '#B98BD6', '#7E559E'],
  ];
  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);
  for (const { c, i } of sirali) {
    if (c.r >= 40) {
      if (i % 3 === 0) gul(c);
      else if (i % 3 === 1) papatya(c);
      else bahar(c, BAHAR[i % 3]);
    } else bahar(c, BAHAR[i % 3]);
  }
  zaman('cicek');

  // ================================================================== 4. kâğıt dokusu ve sıcak, yumuşak ışık
  {
    const id = ana.getImageData(0, 0, N, N);
    const d = id.data;
    const r = S.rng(3990);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const i = y * N + x, j = i * 4;
        const t = DIS[i];
        // lif: ince yatay-eğik çizgiler
        const lif = Math.sin((x * 0.9 + y * 0.35) * 0.08 + Math.sin(y * 0.013) * 3) * 0.5 + 0.5;
        const k = 0.955 + t * 0.07 + (lif - 0.5) * 0.012;
        d[j] = d[j] * k;
        d[j + 1] = d[j + 1] * k;
        d[j + 2] = d[j + 2] * (k - 0.004);
      }
    }
    ana.putImageData(id, 0, 0);
    // sağ üstten sıcak ışık, köşelerde hafif kararma
    ana.save();
    ana.globalCompositeOperation = 'soft-light';
    const gl = ana.createRadialGradient(880 * K, 140 * K, 50 * K, 700 * K, 400 * K, 1100 * K);
    gl.addColorStop(0, 'rgba(255,220,160,0.55)');
    gl.addColorStop(0.5, 'rgba(255,220,170,0.15)');
    gl.addColorStop(1, 'rgba(90,60,80,0.35)');
    ana.fillStyle = gl;
    ana.fillRect(0, 0, N, N);
    ana.restore();
  }

  zaman('son');
  S.hazir();
}, 0);
