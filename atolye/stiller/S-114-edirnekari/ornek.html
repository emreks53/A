<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-114 Edirnekâri — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f3e8cf; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-114 Edirnekâri — Edirne işi boyalı ve lake ahşap dolap kapağı: gönyeli (köşeleri 45° birleşen)
// kalıplı varak altın pervazla çevrili, krem boyalı ahşap pano. Panoda manzara; iki yanda simetrik
// vazolarda gül, lale, karanfil, sümbül ve papatya demetleri, önde simetrik çiçek kuşağı. Her biçim
// altın tahrirli, taç yapraklarda beyaz ışık fırçaları; mercan boyalı kuşakta altın halkâri dal ve
// boyalı çiçekler. En üstte sıcak, saydam lake vernik; altından ahşap lifleri hafifçe belli olur.
// Aydınlık ve zarif (koyu lake değil).
(function () {
  const S = SAHNE;
  const K = 2;
  const W2 = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const R = S.rng(1141);
  const g = ctx;

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const yumusak = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(41), n2 = gurultu(42), n3 = gurultu(43), n4 = gurultu(44);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.27 * n(x * 2.03, y * 2.03) + 0.15 * n(x * 4.1, y * 4.1) + 0.08 * n(x * 8.3, y * 8.3);
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const f2 = (v) => v.toFixed(2);

  // altın tahrir: koyu altın çizgi + üstünde ince açık parıltı (kabartma varak çizgisi)
  function altinCizgi(d, w) {
    const p = P2(d);
    w = w || 1.3;
    g.strokeStyle = '#A97C22'; g.lineWidth = w; g.stroke(p);
    g.save(); g.translate(-0.25, -0.3);
    g.strokeStyle = 'rgba(255,232,150,0.85)'; g.lineWidth = w * 0.42; g.stroke(p);
    g.restore();
  }
  // varak altın dolgu: metalik degrade
  function altinDoldur(d, x1, y1, x2, y2) {
    const p = P2(d);
    const gr = g.createLinearGradient(x1, y1, x2, y2);
    gr.addColorStop(0, '#9C711C'); gr.addColorStop(0.35, '#E3B64A'); gr.addColorStop(0.55, '#FBE7A1'); gr.addColorStop(0.75, '#D9A93E'); gr.addColorStop(1, '#A57A22');
    g.fillStyle = gr; g.fill(p);
  }
  // sivri uçlu, incelen fırça darbesi (nokta dizisi boyunca)
  function firca(pts, w, renk) {
    if (pts.length < 2) return;
    const L = [], Rr = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.min(pts.length - 1, i + 1)], z = pts[Math.max(0, i - 1)];
      let nx = -(a[1] - z[1]), ny = a[0] - z[0];
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const t = i / (pts.length - 1);
      const ww = w * Math.sin(Math.PI * Math.min(1, t * 1.1 + 0.02)) * (1 - 0.3 * t);
      L.push([pts[i][0] + nx * ww, pts[i][1] + ny * ww]);
      Rr.push([pts[i][0] - nx * ww, pts[i][1] - ny * ww]);
    }
    g.fillStyle = renk;
    g.beginPath();
    L.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    for (let i = Rr.length - 1; i >= 0; i--) g.lineTo(Rr[i][0], Rr[i][1]);
    g.closePath();
    g.fill();
  }
  function yay(cx, cy, rx, ry, a0, a1, n) {
    const out = [];
    n = n || 14;
    for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
    return out;
  }
  function polYol(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath(); return p; }
  function acikYol(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); return p; }

  // dolap kapağının ölçüleri: boncuklu dış pervaz | mercan kuşak | kalıplı altın pervaz | pano
  const B0 = 11, B1 = 54, B2 = 72;
  const PX1 = B2, PX2 = 1024 - B2; // pano iç kenarı

  // ------------------------------------------------------------ krem boyalı zemin (ahşap üstüne astar ve boya)
  (function zemin() {
    const im = ctx.createImageData(W2, W2);
    const d = im.data;
    for (let j = 0; j < W2; j++) {
      for (let i = 0; i < W2; i++) {
        const x = i / K, y = j / K;
        const m = fbm(n1, x / 110, y / 110) - 0.5;
        const fc = n2(x / 30, y / 2.2) - 0.5; // boya fırçası çekişleri
        const v = 4 * m + 3 * fc;
        const o = (j * W2 + i) * 4;
        d[o] = 246 + v; d[o + 1] = 238 + v; d[o + 2] = 216 + v; d[o + 3] = 255;
      }
    }
    ctx.putImageData(im, 0, 0);
  })();

  // ------------------------------------------------------------ gök: soluk mavi boya, ufka doğru kreme açılır; fırça izli
  {
    const gr = g.createLinearGradient(0, PX1, 0, 800);
    gr.addColorStop(0, '#A9D0F2'); gr.addColorStop(0.45, '#C6E0F5'); gr.addColorStop(0.8, '#E6EEEC'); gr.addColorStop(1, '#F6EDD6');
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 806);
    for (let k = 0; k < 420; k++) {
      const x = R() * 1024, y = PX1 + R() * 730, L = 60 + R() * 140;
      const pts = []; for (let i = 0; i <= 8; i++) pts.push([x + (L * i) / 8, y + Math.sin(i * 0.8 + k) * 1.5]);
      firca(pts, 2 + R() * 3, R() < 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(150,185,215,0.07)');
    }
    const gl = g.createRadialGradient(880, 140, 10, 880, 140, 320);
    gl.addColorStop(0, 'rgba(255,246,220,0.85)'); gl.addColorStop(0.4, 'rgba(255,244,215,0.35)'); gl.addColorStop(1, 'rgba(255,244,215,0)');
    g.fillStyle = gl; g.fillRect(0, 0, 1024, 806);
  }
  // güneş: varak altın gülbezek ve kıvrık ışınlar
  {
    const gx = 880, gy = 140;
    for (let k = 0; k < 24; k++) {
      const a = (k / 24) * Math.PI * 2;
      const L = k % 2 ? 52 : 63;
      const p = new Path2D();
      p.moveTo(gx + Math.cos(a - 0.08) * 36, gy + Math.sin(a - 0.08) * 36);
      p.quadraticCurveTo(gx + Math.cos(a + 0.05) * L * 0.75, gy + Math.sin(a + 0.05) * L * 0.75, gx + Math.cos(a) * L, gy + Math.sin(a) * L);
      p.quadraticCurveTo(gx + Math.cos(a + 0.13) * L * 0.6, gy + Math.sin(a + 0.13) * L * 0.6, gx + Math.cos(a + 0.08) * 36, gy + Math.sin(a + 0.08) * 36);
      p.closePath();
      altinDoldur(p, gx - 70, gy - 70, gx + 70, gy + 70);
      altinCizgi(p, 0.9);
    }
    const disk = S.daireYolu(gx, gy, 38);
    altinDoldur(disk, gx - 38, gy - 38, gx + 38, gy + 38);
    altinCizgi(disk, 1.4);
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const e = S.elipsYolu({ cx: gx + Math.cos(a) * 22, cy: gy + Math.sin(a) * 22, rx: 9, ry: 5, aci: a });
      altinCizgi(e, 0.8);
    }
    altinCizgi(S.daireYolu(gx, gy, 11), 1);
  }
  // bulutlar: beyaz boya kümeleri, alt kenarda soluk gri-mavi, dış siluette altın kontur
  {
    const bulutlar = [[185, 250, 0.95], [500, 150, 0.8], [760, 330, 1.05], [892, 470, 0.62], [150, 470, 0.62]];
    for (const [bx, by, bs] of bulutlar) {
      const daireler = [[-64, 8, 20], [-36, -4, 27], [0, -12, 32], [36, -3, 26], [64, 8, 19], [-20, 10, 24], [22, 10, 24]];
      const p = new Path2D();
      for (const [dx, dy, r] of daireler) { p.moveTo(bx + (dx + r) * bs, by + dy * bs); p.arc(bx + dx * bs, by + dy * bs, r * bs, 0, Math.PI * 2); }
      const gr = g.createLinearGradient(0, by - 44 * bs, 0, by + 32 * bs);
      gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.6, '#FBFAF6'); gr.addColorStop(1, '#D8E2EC');
      g.fillStyle = gr; g.fill(p);
      for (const [dx, dy, r] of daireler) {
        const pp = new Path2D(); pp.arc(bx + dx * bs, by + dy * bs, r * bs, 0, Math.PI * 2);
        g.strokeStyle = '#A97C22'; g.lineWidth = 2.4; g.stroke(pp);
      }
      g.fillStyle = gr; g.fill(p);
      g.save();
      g.clip(p);
      for (const [dx, dy, r] of daireler) firca(yay(bx + dx * bs, by + dy * bs, r * bs * 0.75, r * bs * 0.7, Math.PI * 1.1, Math.PI * 1.75, 10), 2.4 * bs, 'rgba(255,255,255,0.95)');
      g.restore();
    }
  }
  // halkâri: altın tozuyla çekilmiş ince helezon dal; dalın iki yanında sırayla yaprakçıklar, ucunda
  // küçük beş benekli çiçek (penç). İki ton altın: koyu dal, açık yaprak.
  function halkari(x0, y0, a0, L, yon, s, renkDal, renkYaprak) {
    s = s || 1;
    renkDal = renkDal || 'rgba(176,128,38,0.95)';
    renkYaprak = renkYaprak || 'rgba(222,178,72,0.95)';
    const N = 56;
    const pts = [[x0, y0]];
    let a = a0, x = x0, y = y0;
    const ds = L / N;
    for (let i = 1; i <= N; i++) {
      const t = i / N;
      a += yon * (0.004 + 0.13 * t * t * t) * (ds / s) * 1.0;
      x += Math.cos(a) * ds; y += Math.sin(a) * ds;
      pts.push([x, y]);
    }
    g.strokeStyle = renkDal; g.lineWidth = 1.1 * s; g.stroke(acikYol(pts));
    for (let i = 5, k = 0; i < N - 6; i += 6, k++) {
      const [px, py] = pts[i], [qx, qy] = pts[i + 1];
      const an = Math.atan2(qy - py, qx - px) + (k % 2 ? 1 : -1) * 0.75;
      const yy = { x: px, y: py, uzunluk: (9 - (i / N) * 4) * s, genislik: 0.42, aci: an };
      g.fillStyle = renkYaprak; g.fill(P2(S.yaprakYolu(yy)));
      g.strokeStyle = renkDal; g.lineWidth = 0.45 * s; g.stroke(P2(S.yaprakYolu(yy)));
    }
    const [ex, ey] = pts[N];
    g.fillStyle = renkYaprak;
    for (let k = 0; k < 5; k++) { const an = (k / 5) * Math.PI * 2; g.beginPath(); g.arc(ex + Math.cos(an) * 2.6 * s, ey + Math.sin(an) * 2.6 * s, 1.6 * s, 0, 7); g.fill(); }
    g.fillStyle = renkDal; g.beginPath(); g.arc(ex, ey, 1.2 * s, 0, 7); g.fill();
    return pts;
  }
  // panonun sol üst köşesinde halkâri köşebent (sağ üstte güneş)
  {
    const cx = PX1 + 6, cy = PX1 + 6;
    halkari(cx, cy, 0.12, 150, 1, 1.15);
    halkari(cx, cy, 1.45, 150, -1, 1.15);
    halkari(cx + 4, cy + 4, 0.78, 92, 1, 1.0);
    halkari(cx + 30, cy + 8, 0.3, 70, -1, 0.85);
    halkari(cx + 8, cy + 30, 1.27, 70, 1, 0.85);
    // köşe gülbezeği
    for (let k = 0; k < 8; k++) {
      const an = Math.PI / 4 + ((k - 3.5) / 8) * (Math.PI / 2) * 0.9;
      const yy = { x: cx, y: cy, uzunluk: 22, genislik: 0.36, aci: an };
      altinDoldur(S.yaprakYolu(yy), cx, cy, cx + 22, cy + 22);
      g.strokeStyle = 'rgba(140,100,25,0.8)'; g.lineWidth = 0.6; g.stroke(P2(S.yaprakYolu(yy)));
    }
  }
  // yer: açık fıstıki-krem boya, yumuşak fırça; aralarda altın zer benekleri
  {
    const gr = g.createLinearGradient(0, 800, 0, 1024);
    gr.addColorStop(0, '#EEEACB'); gr.addColorStop(1, '#EADFB8');
    g.fillStyle = gr; g.fillRect(0, 800, 1024, 224);
    for (let k = 0; k < 160; k++) {
      const x = R() * 1024, y = 806 + R() * 210, L = 40 + R() * 90;
      const pts = []; for (let i = 0; i <= 6; i++) pts.push([x + (L * i) / 6, y + Math.sin(i + k) * 1.2]);
      firca(pts, 2 + R() * 2, R() < 0.5 ? 'rgba(255,250,235,0.25)' : 'rgba(170,175,100,0.12)');
    }
    altinCizgi('M0,800 L1024,800', 1);
    const rh = S.rng(77);
    for (let k = 0; k < 18; k++) {
      const x0 = 250 + rh() * 530, y0 = 812 + rh() * 128;
      halkari(x0, y0, rh() * 6.28, 40 + rh() * 20, rh() < 0.5 ? 1 : -1, 0.7);
    }
  }

  // ------------------------------------------------------------ yapılar (boyalı, altın tahrirli)
  function tas(d, x1, x2) {
    const p = P2(d);
    const gr = g.createLinearGradient(x1, 0, x2, 0);
    gr.addColorStop(0, '#D9D2C6'); gr.addColorStop(0.35, '#F3EEE4'); gr.addColorStop(0.75, '#FFFDF7'); gr.addColorStop(1, '#EFE7D8');
    g.fillStyle = gr; g.fill(p);
  }
  // minare
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem' || p.tip === 'bant') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const d = S.yol(p.noktalar, true);
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
        g.fillStyle = '#E78C7E'; g.fill(P2(d));
        g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(Math.min(...xs), p.noktalar[0][1], Math.max(...xs) - Math.min(...xs), 2);
      } else tas(d, Math.min(...xs), Math.max(...xs));
      altinCizgi(d, 1.2);
    } else if (p.tip === 'topuz') {
      tas(p.yol, 266, 334);
      // topuzda ince altın dilimler
      g.save(); g.clip(P2(p.yol));
      for (const dx of [-12, 0, 12]) altinCizgi(`M${300 + dx * 1.6},200 Q${300 + dx * 1.2},170 300,146`, 0.8);
      g.restore();
      altinCizgi(p.yol, 1.2);
    } else if (p.tip === 'korkuluk') {
      const d = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      g.fillStyle = '#F8F2E6'; g.fill(P2(d));
      for (let i = 0; i < 9; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / 9;
        const pp = S.yol([[x - 2, p.y1 + 4], [x + 2, p.y1 + 4], [x + 2, p.y2 - 4], [x - 2, p.y2 - 4]], true);
        altinDoldur(pp, x - 2, 0, x + 2, 0);
      }
      altinCizgi(d, 1.1);
    }
  }
  // zikzak: mercan ve lacivert ince boya, altın kenarlı
  S.zikzakCizgileri().forEach((z, i) => {
    g.strokeStyle = i === 1 ? '#5A7DC4' : '#E07A6A'; g.lineWidth = 4; g.lineJoin = 'miter';
    g.stroke(P2(S.yol(z)));
    g.lineJoin = 'round';
  });
  for (const p of S.minarePencereleri) { g.fillStyle = '#7D8FA8'; g.fill(P2(S.kemerYolu(p.x, p.y, p.w, p.h))); altinCizgi(S.kemerYolu(p.x, p.y, p.w, p.h), 1); }

  // kaide
  const Kd = S.kaide;
  {
    const d = S.yol([[Kd.x1, Kd.y1], [Kd.x2, Kd.y1], [Kd.x2, Kd.y2], [Kd.x1, Kd.y2]], true);
    tas(d, Kd.x1, Kd.x2);
    // kaidede küçük altın çiçek dizisi (kuşak)
    for (let k = 0; k < 17; k++) {
      const x = Kd.x1 + 16 + k * 30.6, y = Kd.y1 + 12;
      if (k % 2) { g.fillStyle = '#E58F86'; g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); altinCizgi(S.daireYolu(x, y, 3.2), 0.7); }
      else { g.fillStyle = '#C39A3A'; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    }
    altinCizgi(`M${Kd.x1},${Kd.y1 + 22} L${Kd.x2},${Kd.y1 + 22}`, 0.9);
    altinCizgi(d, 1.3);
    const kr = S.yol([[Kd.kornis.x1, Kd.kornis.y1], [Kd.kornis.x2, Kd.kornis.y1], [Kd.kornis.x2, Kd.kornis.y2], [Kd.kornis.x1, Kd.kornis.y2]], true);
    g.fillStyle = '#FFFDF6'; g.fill(P2(kr));
    altinDoldur(S.yol([[Kd.kornis.x1, Kd.kornis.y2 - 3], [Kd.kornis.x2, Kd.kornis.y2 - 3], [Kd.kornis.x2, Kd.kornis.y2], [Kd.kornis.x1, Kd.kornis.y2]], true), 0, Kd.kornis.y2 - 3, 0, Kd.kornis.y2);
    altinCizgi(kr, 1.2);
    for (const p of Kd.pencereler) {
      const w = S.kemerYolu(p.x, p.y, p.w, p.h);
      const gr = g.createLinearGradient(p.x - p.w / 2, 0, p.x + p.w / 2, 0);
      gr.addColorStop(0, '#6E7F96'); gr.addColorStop(1, '#93A3B6');
      g.fillStyle = gr; g.fill(P2(w));
      altinCizgi(S.kemerYolu(p.x, p.y - 4, p.w + 8, p.h + 4), 1.6);
      altinCizgi(w, 1);
    }
  }
  // kasnak
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const d = S.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true);
    const gr = g.createLinearGradient(q.x1, 0, q.x2, 0);
    gr.addColorStop(0, '#2F7E43'); gr.addColorStop(0.45, '#3E9852'); gr.addColorStop(0.78, '#73BE68'); gr.addColorStop(1, '#45A056');
    g.fillStyle = gr; g.fill(P2(d));
    // ışık fırçası
    firca([[q.x1 + (q.x2 - q.x1) * 0.6, q.y1 + 6], [q.x1 + (q.x2 - q.x1) * 0.8, q.y1 + 6]], 1.6, 'rgba(255,255,240,0.5)');
    for (const p of S.kasnakPencereleri(k)) { const w = S.kemerYolu(p.x, p.y, p.w, p.h); g.fillStyle = '#1F5631'; g.fill(P2(w)); altinCizgi(w, 0.9); }
    altinDoldur(S.yol([[q.x1, q.y2 - 4], [q.x2, q.y2 - 4], [q.x2, q.y2], [q.x1, q.y2]], true), 0, q.y2 - 4, 0, q.y2);
    altinCizgi(d, 1.3);
  }
  // kubbe: yeşil boya, ışık yanında beyazımsı fırça ışıkları, kaburgalar altın
  {
    const kb = P2(S.kubbeYolu);
    const gr = g.createRadialGradient(650, 380, 10, 590, 430, 300);
    gr.addColorStop(0, '#8ACB72'); gr.addColorStop(0.4, '#4AA35A'); gr.addColorStop(1, '#2B7A41');
    g.fillStyle = gr; g.fill(kb);

  function kyaprak(x, y, L, a, buk, genis, renk) {

    pembe: ['#FBD3DA', '#EE8FA2', '#C94968'],
    beyaz: ['#FFFFFF', '#F7E3E2', '#E2A2AE'],
    mercan: ['#FCCFC3', '#EE7E74', '#C2433F'],
    sari: ['#FFF3C9', '#F6CB64', '#D99A2B'],
  };
  const KIRMIZI = ['#D9443F', '#A8302C'], SARI = ['#F2B632', '#E08A1E'];
  // tek bir öğeyi çiz (ayna: x yönünde yansıt)
  function oge(o, ox, oy, ay) {
    const x = ox + o.dx * ay, y = oy + o.dy;
    const a = (o.a || 0) * ay;
    if (o.t === 'gul') gul(x, y, o.r, GUL[o.renk]);
    else if (o.t === 'lale') lale(x, y, o.s, a, o.renk === 'sari' ? SARI : KIRMIZI);
    else if (o.t === 'karanfil') karanfil(x, y, o.r, a);
    else if (o.t === 'sumbul') sumbul(x, y, o.s, ay > 0 ? o.a : Math.PI - o.a);
    else if (o.t === 'papatya') papatya(x, y, o.r, o.a || 0.3);
    else if (o.t === 'sukufe') sukufe(x, y, o.r, o.renk);
    else if (o.t === 'gonca') gonca(x, y, o.r, ay > 0 ? o.a : Math.PI - o.a, o.renk);
  }
  // çiçeğin sapın bağlandığı nokta
  function sapUcu(o, ox, oy, ay) {
    const x = ox + o.dx * ay, y = oy + o.dy;
    if (o.t === 'lale') return [x - Math.sin((o.a || 0) * ay) * 8 * o.s, y + Math.cos((o.a || 0) * ay) * 8 * o.s];
    if (o.t === 'karanfil') return [x - Math.sin((o.a || 0) * ay) * 0.75 * o.r, y + Math.cos((o.a || 0) * ay) * 0.75 * o.r];
    if (o.t === 'sumbul') return [x, y];
    if (o.t === 'gonca') { const a = ay > 0 ? o.a : Math.PI - o.a; return [x - Math.cos(a) * o.r, y - Math.sin(a) * o.r]; }
    return [x, y + (o.r || 10) * 0.4];
  }

  // vazodaki demet: simetrik; orta ekseninde lale, büyük gül ve beyaz gül, iki yanda eşli öğeler
  const DEMET_ORTA = [
    { t: 'lale', dx: 0, dy: -282, s: 1.75, a: 0, renk: 'kirmizi' },
    { t: 'papatya', dx: 0, dy: -222, r: 15 },
    { t: 'gul', dx: 0, dy: -160, r: 37, renk: 'pembe' },
    { t: 'gul', dx: 0, dy: -64, r: 23, renk: 'beyaz' },
  ];
  const DEMET_YAN = [
    { t: 'gonca', dx: -50, dy: -262, r: 8, a: -Math.PI / 2 - 0.5, renk: '#EE8C9E' },
    { t: 'sumbul', dx: -30, dy: -206, s: 1.3, a: -Math.PI / 2 - 0.3 },
    { t: 'karanfil', dx: -58, dy: -168, r: 24, a: -0.45 },
    { t: 'lale', dx: -68, dy: -104, s: 1.2, a: -0.62, renk: 'sari' },
    { t: 'gul', dx: -38, dy: -96, r: 24, renk: 'mercan' },
    { t: 'papatya', dx: -66, dy: -42, r: 15, a: 0.5 },
  ];
  const DEMET_DOLGU = [
    { t: 'sukufe', dx: -22, dy: -126, r: 7, renk: '#9DB8EE' },
    { t: 'sukufe', dx: -76, dy: -136, r: 6.5, renk: '#FFFFFF' },
    { t: 'sukufe', dx: -18, dy: -244, r: 6, renk: '#FFFFFF' },
    { t: 'sukufe', dx: -40, dy: -60, r: 6, renk: '#F7D36A' },
    { t: 'sukufe', dx: -84, dy: -78, r: 6, renk: '#F6B7C2' },
    { t: 'sukufe', dx: -26, dy: -30, r: 5.5, renk: '#9DB8EE' },
  ];
  function demet(vx, agiz) {
    const ox = vx, oy = agiz;
    const hepsi = [];
    for (const o of DEMET_ORTA) hepsi.push([o, 1]);
    for (const o of DEMET_YAN) { hepsi.push([o, 1]); hepsi.push([o, -1]); }
    // saplar (ağızdan çiçeğe kavisli)
    const sapList = [];
    for (const [o, ay] of hepsi) {
      const [ux, uy] = sapUcu(o, ox, oy, ay);
      const x0 = ox + o.dx * ay * 0.12, y0 = oy + 8;
      const pts = egri(x0, y0, ox + o.dx * ay * 0.55, oy + (uy - oy) * 0.45, ux, uy);
      sapList.push([pts, o, ay]);
    }
    for (const [pts] of sapList) sap(pts, 3);
    // ağızdan sarkan ve yükselen büyük yapraklar
    for (const ay of [-1, 1]) {
      kyaprak(ox + ay * 6, oy + 2, 58, ay > 0 ? 0.42 : Math.PI - 0.42, ay * 0.22, 0.2);
      kyaprak(ox + ay * 4, oy - 4, 64, ay > 0 ? -0.55 : Math.PI + 0.55, -ay * 0.18, 0.19);
      kyaprak(ox + ay * 2, oy - 8, 70, -Math.PI / 2 + ay * 0.42, ay * 0.2, 0.17);
    }
    // saplar boyunca yapraklar (dış yanda alçakta, iç yanda yüksekte; eşli öğelerde aynalı)
    for (const [pts, o, ay] of sapList) {
      if (o.dx === 0 && o.dy > -100) continue;
      const sx = o.dx === 0 ? 0 : Math.sign(o.dx * ay);
      for (const [t, dis] of [[0.42, 1], [0.68, -1]]) {
        const i = Math.round(t * (pts.length - 1));
        const [px, py] = pts[i], [qx, qy] = pts[i + 1];
        const tan = Math.atan2(qy - py, qx - px);
        const L = 24 + (Math.abs(o.dy * 7 + t * 31) % 8);
        if (sx === 0) { for (const s2 of [-1, 1]) kyaprak(px, py, L, tan + s2 * 0.85, s2 * 0.25, 0.2); }
        else { const s2 = sx * dis; kyaprak(px, py, L, tan + s2 * 0.85, s2 * 0.25, 0.2); }
      }
    }
    // büyük gülün arkasında gül yaprakları
    const bg = DEMET_ORTA[2];
    for (const ay of [-1, 1]) {
      for (const [aa, L] of [[-0.35, 30], [0.25, 34], [0.85, 28]]) {
        const an = ay > 0 ? aa : Math.PI - aa;
        kyaprak(ox + Math.cos(an) * bg.r * 0.55, oy + bg.dy + Math.sin(an) * bg.r * 0.55, L, an, 0.15 * ay, 0.24);
      }
    }
    // çiçekler: arkadan öne (yukarıdan aşağı)
    const sirali = hepsi.slice().sort((a, b) => a[0].dy - b[0].dy);
    for (const [o, ay] of sirali) oge(o, ox, oy, ay);
    for (const o of DEMET_DOLGU) { oge(o, ox, oy, 1); oge(o, ox, oy, -1); }
  }

  // ------------------------------------------------------------ yandaki vazolar ve demetler (simetrik)
  const VX1 = 176, VX2 = 1024 - 176 - 0; // pano ortasına (512) göre simetrik
  const VTABAN = 940, VH = 168, VW = 118;
  for (const vx of [VX1, VX2]) demet(vx, VTABAN - VH + 6);
  for (const vx of [VX1, VX2]) vazo(vx, VTABAN, VH, VW);
  // vazonun ağzında öne sarkan küçük yapraklar ve goncalar (vazo ile demeti bağlar)
  for (const vx of [VX1, VX2]) {
    const oy = VTABAN - VH + 4;
    for (const ay of [-1, 1]) {
      kyaprak(vx + ay * 4, oy, 40, ay > 0 ? 0.95 : Math.PI - 0.95, ay * 0.3, 0.2);
      gonca(vx + ay * 40, oy + 26, 7, ay > 0 ? 1.3 : Math.PI - 1.3, '#F6B7C2');
    }
  }

  // ------------------------------------------------------------ önde simetrik çiçek kuşağı
  {
    const ox = 512, oy = 888;
    const ORTA = [{ t: 'gul', dx: 0, dy: 0, r: 52, renk: 'pembe' }];
    const YAN = [
      { t: 'lale', dx: -250, dy: -48, s: 1.15, a: -0.22, renk: 'sari' },
      { t: 'sumbul', dx: -108, dy: -46, s: 1.25, a: -Math.PI / 2 - 0.22 },
      { t: 'gonca', dx: -46, dy: -64, r: 9, a: -Math.PI / 2 - 0.35, renk: '#EE8C9E' },
      { t: 'lale', dx: -196, dy: -22, s: 1.55, a: -0.42, renk: 'kirmizi' },
      { t: 'karanfil', dx: -82, dy: -14, r: 30, a: -0.38 },
      { t: 'gul', dx: -146, dy: 26, r: 34, renk: 'beyaz' },
      { t: 'papatya', dx: -236, dy: 40, r: 20, a: 0.2 },
      { t: 'papatya', dx: -62, dy: 50, r: 17, a: 0.6 },
    ];
    const DOLGU = [
      { t: 'sukufe', dx: -128, dy: -22, r: 7, renk: '#9DB8EE' },
      { t: 'sukufe', dx: -200, dy: 30, r: 7, renk: '#F6B7C2' },
      { t: 'sukufe', dx: -30, dy: -60, r: 6, renk: '#FFFFFF' },
      { t: 'sukufe', dx: -100, dy: 52, r: 6.5, renk: '#F7D36A' },
      { t: 'sukufe', dx: -168, dy: -40, r: 6, renk: '#FFFFFF' },
      { t: 'sukufe', dx: -222, dy: -10, r: 6, renk: '#9DB8EE' },
      { t: 'sukufe', dx: -276, dy: 10, r: 6, renk: '#FFFFFF' },
    ];
    // arkada yelpaze gibi açılan yapraklar
    for (let k = 0; k < 11; k++) {
      for (const ay of [-1, 1]) {
        const dx = 14 + k * 25, L = 62 + ((k * 37) % 23);
        const an = -Math.PI / 2 - (0.12 + k * 0.1) * ay;
        kyaprak(ox + dx * ay, 958 - (k % 2) * 16, L, an, -ay * 0.18, 0.18);
      }
    }
    const hepsi = [];
    for (const o of ORTA) hepsi.push([o, 1]);
    for (const o of YAN) { hepsi.push([o, 1]); hepsi.push([o, -1]); }
    // lale, sümbül ve goncanın görünen sapları
    for (const [o, ay] of hepsi) {
      if (o.t !== 'lale' && o.t !== 'sumbul' && o.t !== 'gonca') continue;
      const [ux, uy] = sapUcu(o, ox, oy, ay);
      sap(egri(ux, uy, ux + 6 * ay, (uy + 960) / 2, ux + 10 * ay, 960), 3);
      kyaprak(ux + 4 * ay, uy + 30, 30, ay > 0 ? -0.9 : Math.PI + 0.9, -ay * 0.2, 0.2);
    }
    const sirali = hepsi.slice().sort((a, b) => a[0].dy - b[0].dy);
    for (const [o, ay] of sirali) oge(o, ox, oy, ay);
    for (const o of DOLGU) { oge(o, ox, oy, 1); oge(o, ox, oy, -1); }
  }

  // ------------------------------------------------------------ mercan boyalı kuşak: altın halkâri dal ve boyalı çiçekler
  {
    g.fillStyle = '#E3806B';
    g.beginPath(); g.rect(B0, B0, 1024 - 2 * B0, 1024 - 2 * B0); g.rect(B1, B1, 1024 - 2 * B1, 1024 - 2 * B1); g.fill('evenodd');
    const c = (B0 + B1) / 2, amp = 8.5;
    const boy = 1024 - 2 * B1, P = boy / 8;
    const MAT = [[1, 0, 0, 1, 0, 0], [0, 1, -1, 0, 1024, 0], [-1, 0, 0, -1, 1024, 1024], [0, -1, 1, 0, 0, 1024]];
    for (let kn = 0; kn < 4; kn++) {
      const m = MAT[kn];
      g.save();
      g.setTransform(m[0] * K, m[1] * K, m[2] * K, m[3] * K, m[4] * K, m[5] * K);
      // kenar altın filetoları
      altinCizgi(`M${B1},${B0 + 2.5} L${1024 - B1},${B0 + 2.5}`, 1.1);
      altinCizgi(`M${B1},${B1 - 2.5} L${1024 - B1},${B1 - 2.5}`, 1.1);
      // dalgalı altın dal
      const pts = [];
      for (let i = 0; i <= 320; i++) { const u = B1 + (boy * i) / 320; pts.push([u, c + amp * Math.sin((2 * Math.PI * (u - B1)) / P)]); }
      g.strokeStyle = '#B98A2C'; g.lineWidth = 1.6; g.stroke(acikYol(pts));
      g.save(); g.translate(-0.3, -0.3); g.strokeStyle = 'rgba(255,232,150,0.8)'; g.lineWidth = 0.6; g.stroke(acikYol(pts)); g.restore();
      // sıfır geçişlerinde altın yaprakçık çiftleri ve küçük helezon
      for (let k = 0; k <= 16; k++) {
        const u = B1 + (k * P) / 2;
        if (u < B1 + 4 || u > 1024 - B1 - 4) continue;
        const yon = k % 2 ? -1 : 1;
        const tan = Math.atan2(yon * amp * 2 * Math.PI / P, 1);
        for (const s2 of [-1, 1]) {
          const yy = { x: u, y: c, uzunluk: 9, genislik: 0.42, aci: tan + s2 * 0.75 + (s2 < 0 ? Math.PI : 0) * 0 };
          altinDoldur(S.yaprakYolu(yy), u - 8, c - 8, u + 8, c + 8);
          g.strokeStyle = 'rgba(140,100,25,0.8)'; g.lineWidth = 0.5; g.stroke(P2(S.yaprakYolu(yy)));
        }
      }
      // tepe ve çukurların koynunda boyalı çiçekler
      for (let k = 0; k < 16; k++) {
        const u = B1 + P / 4 + (k * P) / 2;
        const sg = k % 2 ? -1 : 1;
        const v = c - 6.5 * sg;
        const tur = k % 4;
        if (tur === 0) gul(u, v, 8.5, GUL.beyaz);
        else if (tur === 2) gul(u, v, 8.5, GUL.sari);
        else sukufe(u, v, 7.2, tur === 1 ? '#FFFFFF' : '#A9C2F0');
        // dal tepesinde küçük altın yaprak
        const yy = { x: u, y: c + amp * sg, uzunluk: 7, genislik: 0.42, aci: sg > 0 ? Math.PI / 2 : -Math.PI / 2 };
        altinDoldur(S.yaprakYolu(yy), u - 6, c - 6, u + 6, c + 6);
      }
      g.restore();
    }
    // köşe kareleri: altın çerçeveli beyaz gül göbeği
    for (const [cx, cy] of [[c, c], [1024 - c, c], [1024 - c, 1024 - c], [c, 1024 - c]]) {
      const kare = S.yol([[cx - 19, cy - 19], [cx + 19, cy - 19], [cx + 19, cy + 19], [cx - 19, cy + 19]], true);
      g.fillStyle = '#E3806B'; g.fill(P2(kare));
      altinCizgi(kare, 1.4);
      for (let k = 0; k < 4; k++) {
        const an = Math.PI / 4 + (k * Math.PI) / 2;
        const yy = { x: cx, y: cy, uzunluk: 18, genislik: 0.42, aci: an };
        altinDoldur(S.yaprakYolu(yy), cx - 14, cy - 14, cx + 14, cy + 14);
        g.strokeStyle = 'rgba(140,100,25,0.8)'; g.lineWidth = 0.6; g.stroke(P2(S.yaprakYolu(yy)));
      }
      gul(cx, cy, 11, GUL.beyaz);
    }
  }
  // dış pervaz: varak altın üzerinde kabartma boncuk dizisi
  {
    const d = new Path2D();
    d.rect(0, 0, 1024, 1024); d.rect(B0, B0, 1024 - 2 * B0, 1024 - 2 * B0);
    const gr = g.createLinearGradient(0, 0, 1024, 1024);
    gr.addColorStop(0, '#F3D88E'); gr.addColorStop(0.5, '#D6A643'); gr.addColorStop(1, '#C08E2E');
    g.fillStyle = gr; g.fill(d, 'evenodd');
    for (let k = 0; k < 4; k++) {
      for (let i = 0; i < 116; i++) {
        const u = B0 / 2 + ((1024 - B0) * (i + 0.5)) / 116;
        const [x, y] = [[u, B0 / 2], [1024 - B0 / 2, u], [1024 - u, 1024 - B0 / 2], [B0 / 2, 1024 - u]][k];
        const gg = g.createRadialGradient(x + 1.1, y - 1.1, 0.3, x, y, 4);
        gg.addColorStop(0, '#FFF6CF'); gg.addColorStop(0.45, '#E6B852'); gg.addColorStop(1, '#94691A');
        g.fillStyle = gg; g.beginPath(); g.arc(x, y, 3.7, 0, 7); g.fill();
      }
    }
  }

  // ------------------------------------------------------------ son geçiş: gönyeli kalıplı altın pervaz, ahşap lifleri, lake
  {
    // pervaz kesiti (dıştan içe, w = 0 … B2 − B1): pah, yarım yuvarlak boncuk, oluk, düz şerit, panoya iniş
    const KW = B2 - B1;
    const h = (w) => {
      if (w < 2) return w * 1.2;
      if (w < 10) return 2.4 + 3.2 * Math.sin((Math.PI * (w - 2)) / 8);
      if (w < 14) return 2.4 - 1.9 * Math.sin((Math.PI / 2) * ((w - 10) / 4));
      if (w < 16.5) return 0.5;
      return 0.5 - 1.6 * (w - 16.5);
    };
    const EG = new Float32Array(KW * 8 + 8);
    for (let i = 0; i < EG.length; i++) { const w = i / 8; EG[i] = (h(w + 0.2) - h(w - 0.2)) / 0.4; }
    const Lx = 0.5, Ly = -0.62, Lz = 0.6;
    // ahşap lifleri (1024 ızgarada): pervaz kollarında gönyeyle dönen yön, panoda dikey
    const LIF = new Float32Array(1024 * 1024);
    for (let j = 0; j < 1024; j++) for (let i = 0; i < 1024; i++) {
      const m = Math.min(i, 1023 - i, j, 1023 - j);
      let u, v, ofs;
      if (m >= B2) { u = i; v = j; ofs = 0; }
      else if (Math.min(i, 1023 - i) < Math.min(j, 1023 - j)) { u = i; v = j; ofs = 311; }
      else { u = j; v = i; ofs = 517; }
      const warp = fbm(n1, (u + ofs) / 170, v / 520) * 70 + 6 * n2((u + ofs) / 24, v / 160);
      const r = (u + warp) / 10.5;
      const f = r - Math.floor(r);
      const halka = Math.exp(-Math.pow((f - 0.5) / 0.15, 2));
      const lif = n3((u + ofs) / 1.6, v / 45) - 0.5;
      LIF[j * 1024 + i] = halka * 0.75 + lif * 0.55;
    }
    const im = ctx.getImageData(0, 0, W2, W2);
    const d = im.data;
    for (let j = 0; j < W2; j++) {
      const y = (j + 0.5) / K;
      for (let i = 0; i < W2; i++) {
        const x = (i + 0.5) / K;
        const o = (j * W2 + i) * 4;
        const dl = x, dr = 1024 - x, dt = y, db = 1024 - y;
        const m = Math.min(dl, dr, dt, db);
        let r = d[o], gg = d[o + 1], b = d[o + 2];
        const lf = LIF[(j >> 1) * 1024 + (i >> 1)];
        let amp;
        if (m >= B1 && m < B2) {
          // kalıplı pervaz: kesitin eğiminden normal, sağ üstten ışık
          let ix = 0, iy = 0;
          if (m === dl) ix = 1; else if (m === dr) ix = -1; else if (m === dt) iy = 1; else iy = -1;
          const w = m - B1;
          const s = EG[Math.min(EG.length - 1, Math.round(w * 8))];
          const nx = -s * ix, ny = -s * iy, nz = 1, nl = Math.sqrt(nx * nx + ny * ny + 1);
          const sh = (nx * Lx + ny * Ly + nz * Lz) / nl;
          const t = clamp((sh + 0.15) / 1.15, 0, 1);
          if (t < 0.5) { const u = t / 0.5; r = lerp(122, 214, u); gg = lerp(86, 166, u); b = lerp(24, 66, u); }
          else { const u = (t - 0.5) / 0.5; r = lerp(214, 255, u); gg = lerp(166, 238, u); b = lerp(66, 176, u); }
          const sp = Math.pow(Math.max(0, sh), 18) * 90;
          r += sp; gg += sp; b += sp * 0.8;
          amp = 0.05;
        } else if (m < B0) amp = 0.03;
        else if (m < B1) amp = 0.13;
        else {
          amp = 0.065;
          // pervazın panoya düşen ince gölgesi (ışık sağ üstten: üst ve sağ kenarda)
          const gol = 0.16 * (1 - yumusak(0, 8, y - B2)) + 0.14 * (1 - yumusak(0, 8, 1024 - B2 - x));
          r *= 1 - gol; gg *= 1 - gol; b *= 1 - gol * 0.9;
        }
        // ahşap lifleri boya ve verniğin altından
        const k = 1 - amp * (lf - 0.3);
        r *= k; gg *= k; b *= k;
        // lake vernik: sıcak saydam ton, hafif doygunluk
        const ort = (r + gg + b) / 3;
        r = ort + (r - ort) * 1.07; gg = ort + (gg - ort) * 1.07; b = ort + (b - ort) * 1.07;
        r *= 1.0; gg *= 0.972; b *= 0.905;
        // vernik parlaklığı: geniş ve dar çapraz bantlar, lif dokusuyla dalgalanır
        const u = (x - y * 0.72) / 1024;
        const b1 = Math.exp(-Math.pow((u - 0.29) / 0.075, 2));
        const b2 = Math.exp(-Math.pow((u - 0.45) / 0.022, 2)) * 0.85;
        const son = clamp(1 - Math.abs(y - 360) / 720, 0, 1);
        const pa = (b1 * 0.27 + b2 * 0.2) * son * (0.78 + 0.35 * (lf - 0.3));
        r += (255 - r) * pa; gg += (253 - gg) * pa; b += (244 - b) * pa;
        d[o] = r; d[o + 1] = gg; d[o + 2] = b;
      }
    }
    ctx.putImageData(im, 0, 0);
    // altın üzerinde küçük parıltılar
    for (const [px, py, rr] of [[560, 238, 2.6], [905, 118, 2.2], [300, 152, 2], [B1 + 6, 300, 2.2], [1024 - B1 - 8, 520, 2.4], [640, B1 + 7, 2.2]]) {
      const gr = g.createRadialGradient(px, py, 0, px, py, rr * 3);
      gr.addColorStop(0, 'rgba(255,255,245,0.95)'); gr.addColorStop(1, 'rgba(255,255,245,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(px, py, rr * 3, 0, 7); g.fill();
    }
  }
  SAHNE.hazir();
})();
</script>
