<!doctype html>
<html lang="tr">

<title>S-166 Işıklı Sır Suluboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-166 Işıklı Sır Suluboya — hayalî bir gerçekçi suluboya ressamının eli: parlak beyaz soğuk preslenmiş kâğıtta
// birbiri üstüne kurumuş çok sayıda saydam sır, her sırrın keskin ve temiz kenarı, korunmuş pırıl pırıl kâğıt
// beyazları (kaburga ışıkları, bulut tepeleri, çiçekler), güçlü güneşte sıcak ışık / serin mavi gölge ve
// tepede derin kobalttan ufukta sıcak altına inen dereceli gök.
(function () {
  'use strict';
  // ================================================================== suluboya motoru (çarpımsal sır modeli)
  // Her yıkama piksel başına bir kapsama (0–1) alanıdır; renk = kâğıt × Π exp(−soğurma × kapsama).
  // Opak boya (guaj) üstte karışır: renk = renk × (1 − örtme) + boya × örtme. En sonda kâğıt kabartması.
  function Motor(o) {
    const W = 1024, N = W * W;
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    function gurultu(tohum) {
      const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
      for (let i = 0; i < M * M; i++) T[i] = r();
      return function (x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
        const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
        const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
        const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      };
    }
    function fbm(n, x, y, okt) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < okt; i++) {
        s += a * n(x, y); t += a;
        const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
        x = nx + 17.3; y = ny + 9.1; a *= 0.5;
      }
      return s / t;
    }
    function kutu(src, w, h, r) {
      const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
      for (let y = 0; y < h; y++) {
        const o = y * w; let acc = 0;
        for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
        for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
        for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
      }
      return out;
    }
    function bulanik(src, w, h, r) {
      if (r <= 0) return src;
      const rr = Math.max(1, Math.round(r * 0.6));
      return kutu(kutu(kutu(src, w, h, rr), w, h, rr), w, h, rr);
    }

    const tohum = o.tohum || 1;
    const kagit = hex(o.kagit || '#fbfaf5');
    const dk = Object.assign({ olcek: 4.6, ince: 1.7, karisim: 0.62, kabartma: 0.11, ton: 0.035 }, o.doku || {});
    const nA = gurultu(tohum + 1), nB = gurultu(tohum + 2), nC = gurultu(tohum + 3), nD = gurultu(tohum + 4), nE = gurultu(tohum + 5), nF = gurultu(tohum + 6);
    const H = new Float32Array(N), G = new Float32Array(N), DX = new Float32Array(N), DY = new Float32Array(N), AK = new Float32Array(N), KAL = new Float32Array(N);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const h = dk.karisim * fbm(nA, x / dk.olcek, y / dk.olcek, 3) + (1 - dk.karisim) * nB(x / dk.ince, y / dk.ince);
      H[i] = h;
      G[i] = 0.6 * (1 - h) + 0.4 * nC(x / 2.1 + 40, y / 2.1);
      DX[i] = (fbm(nD, x / 38, y / 38, 3) - 0.5) * 2 + (nE(x / 6, y / 6) - 0.5) * 0.35;
      DY[i] = (fbm(nD, x / 38 + 50, y / 38 + 20, 3) - 0.5) * 2 + (nE(x / 6 + 30, y / 6) - 0.5) * 0.35;
      AK[i] = 0.7 * fbm(nF, x / 70, y / 70, 4) + 0.3 * fbm(nF, x / 16 + 80, y / 16, 2);
    }
    const C0 = new Float32Array(N), C1 = new Float32Array(N), C2 = new Float32Array(N);
    C0.fill(kagit[0] / 255); C1.fill(kagit[1] / 255); C2.fill(kagit[2] / 255);

    const mc = document.createElement('canvas');
    mc.width = W; mc.height = W;
    const mx = mc.getContext('2d', { willReadFrequently: true });

    function kutuBul(a, k) {
      let x0 = W, y0 = W, x1 = -1, y1 = -1;
      const kx0 = k ? k[0] : 0, ky0 = k ? k[1] : 0, kx1 = k ? k[2] : W, ky1 = k ? k[3] : W;
      for (let y = ky0; y < ky1; y++) {
        const o = y * W;
        for (let x = kx0; x < kx1; x++) if (a[o + x] > 0.001) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; y1 = y; }
      }
      return x1 < 0 ? { x0: 0, y0: 0, x1: 0, y1: 0, bos: true } : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
    }
    const kirp = (k) => k ? [clamp(Math.floor(k[0]), 0, W), clamp(Math.floor(k[1]), 0, W), clamp(Math.ceil(k[2]), 0, W), clamp(Math.ceil(k[3]), 0, W)] : null;
    /** Maske: ciz(ctx) beyazla çizer; dönen {a, x0,y0,x1,y1}. kutu verilirse yalnız o bölge okunur. */
    function maske(ciz, kutuA) {
      const k = kirp(kutuA);
      mx.setTransform(1, 0, 0, 1, 0, 0);
      mx.globalCompositeOperation = 'source-over';
      mx.globalAlpha = 1;
      mx.filter = 'none';
      if (k) mx.clearRect(k[0], k[1], k[2] - k[0], k[3] - k[1]); else mx.clearRect(0, 0, W, W);
      mx.fillStyle = '#fff'; mx.strokeStyle = '#fff';
      mx.lineCap = 'round'; mx.lineJoin = 'round';
      mx.save();
      if (k) { mx.beginPath(); mx.rect(k[0], k[1], k[2] - k[0], k[3] - k[1]); mx.clip(); }
      ciz(mx);
      mx.restore();
      mx.setTransform(1, 0, 0, 1, 0, 0);
      mx.globalCompositeOperation = 'source-over';
      mx.globalAlpha = 1;
      const a = new Float32Array(N);
      if (k) {
        const w = k[2] - k[0], h = k[3] - k[1];
        if (w <= 0 || h <= 0) return { a, x0: 0, y0: 0, x1: 0, y1: 0, bos: true };
        const d = mx.getImageData(k[0], k[1], w, h).data;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) a[(y + k[1]) * W + x + k[0]] = d[(y * w + x) * 4 + 3] / 255;
        mx.clearRect(k[0], k[1], w, h);
        return Object.assign({ a }, kutuBul(a, k));
      }
      const d = mx.getImageData(0, 0, W, W).data;
      for (let i = 0; i < N; i++) a[i] = d[i * 4 + 3] / 255;
      return Object.assign({ a }, kutuBul(a));
    }
    function yolMaske(yollar, kalinlik, kutuA) {
      return maske((c) => {
        for (const y of [].concat(yollar)) {
          const p = typeof y === 'string' ? new Path2D(y) : y;
          if (kalinlik) { c.lineWidth = kalinlik; c.stroke(p); } else c.fill(p);
        }
      }, kutuA);
    }
    /** İşlev maskesi: f(x, y) → 0..1, kutu içinde. */
    function fMaske(kutuA, f) {
      const a = new Float32Array(N);
      const x0 = clamp(Math.floor(kutuA[0]), 0, W), y0 = clamp(Math.floor(kutuA[1]), 0, W), x1 = clamp(Math.ceil(kutuA[2]), 0, W), y1 = clamp(Math.ceil(kutuA[3]), 0, W);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) a[y * W + x] = clamp(f(x, y), 0, 1);
      return { a, x0, y0, x1, y1 };
    }
    /** İki maskeden yenisi; kutu: 'ilk' (m1 kutusu yeter), 'kesis' ya da birleşim (varsayılan). */
    function islem(m1, m2, f, tur) {
      const a = new Float32Array(N);
      let k;
      if (tur === 'ilk' || !m2) k = [m1.x0, m1.y0, m1.x1, m1.y1];
      else if (tur === 'kesis') k = [Math.max(m1.x0, m2.x0), Math.max(m1.y0, m2.y0), Math.min(m1.x1, m2.x1), Math.min(m1.y1, m2.y1)];
      else if (tur === 'hepsi') k = [0, 0, W, W];
      else k = [Math.min(m1.x0, m2.x0), Math.min(m1.y0, m2.y0), Math.max(m1.x1, m2.x1), Math.max(m1.y1, m2.y1)];
      if (m1.bos && m2 && !m2.bos && tur !== 'ilk' && tur !== 'kesis') k = [m2.x0, m2.y0, m2.x1, m2.y1];
      if (k[2] <= k[0] || k[3] <= k[1]) return { a, x0: 0, y0: 0, x1: 0, y1: 0, bos: true };
      for (let y = k[1]; y < k[3]; y++) for (let x = k[0]; x < k[2]; x++) { const i = y * W + x; a[i] = clamp(f(m1.a[i], m2 ? m2.a[i] : 0, i), 0, 1); }
      return Object.assign({ a }, kutuBul(a, k));
    }
    const cikar = (m1, m2) => islem(m1, m2, (p, q) => p * (1 - q), 'ilk');
    const kesis = (m1, m2) => islem(m1, m2, (p, q) => p * q, 'kesis');
    const birles = (m1, m2) => islem(m1, m2, (p, q) => p + q - p * q);
    function mBulanik(m, r) {
      r = Math.max(1, Math.round(r));
      if (m.bos) return m;
      const x0 = Math.max(0, m.x0 - 2 * r - 2), y0 = Math.max(0, m.y0 - 2 * r - 2), x1 = Math.min(W, m.x1 + 2 * r + 2), y1 = Math.min(W, m.y1 + 2 * r + 2);
      const w = x1 - x0, h = y1 - y0, L = new Float32Array(w * h);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) L[(y - y0) * w + x - x0] = m.a[y * W + x];
      const B = bulanik(L, w, h, r), a = new Float32Array(N);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) a[y * W + x] = B[(y - y0) * w + x - x0];
      return { a, x0, y0, x1, y1 };
    }
    function ornekle(a, x, y) {
      x = x < 0 ? 0 : x > W - 1.001 ? W - 1.001 : x;
      y = y < 0 ? 0 : y > W - 1.001 ? W - 1.001 : y;
      const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * W + xi;
      return a[i] * (1 - fx) * (1 - fy) + a[i + 1] * fx * (1 - fy) + a[i + W] * (1 - fx) * fy + a[i + W + 1] * fx * fy;
    }

    /**
     * Yıkama / sır. o: yog (yoğunluk), kenar (kuruma kenarı koyuluğu), kenarR, gran (granülasyon), akis (akış dalgası),
     * titre (el titremesi px), yumusak (kenar yumuşatma yarıçapı), grad(x,y) çarpanı, koru (korunan maske),
     * kuru (kuru fırça eşiği 0–1: boya yalnız kâğıdın tepelerine), kuruY (eşik yumuşaklığı), kayma (titreme alanı kaydırma)
     */
    function yika(m, renk, o) {
      o = o || {};
      if (m.bos) return;
      const T = typeof renk === 'string' ? hex(renk) : renk;
      const yog = o.yog == null ? 1 : o.yog;
      const ab = T.map((c) => -Math.log(clamp(c / 255, 0.004, 1)) * yog);
      const kenar = o.kenar == null ? 0.3 : o.kenar, kr = o.kenarR || 4, gran = o.gran == null ? 0.2 : o.gran, akis = o.akis == null ? 0.14 : o.akis;
      const titre = o.titre || 0, yum = o.yumusak || 0, kuru = o.kuru || 0, kuruY = o.kuruY || 0.07, tuy = o.tuy || 0;
      const pad = Math.ceil(titre + yum * 2 + kr * 2 + 3);
      const x0 = Math.max(0, m.x0 - pad), y0 = Math.max(0, m.y0 - pad), x1 = Math.min(W, m.x1 + pad), y1 = Math.min(W, m.y1 + pad);
      const w = x1 - x0, h = y1 - y0;
      let L = new Float32Array(w * h);
      const ks = o.kayma == null ? (tohum * 37 + Math.round(m.x0 * 1.3 + m.y0 * 0.7)) % 400 : o.kayma;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        if (titre) {
          const k = ((y + ks) % W) * W + ((x + ks * 2) % W);
          L[j] = ornekle(m.a, x + DX[k] * titre, y + DY[k] * titre);
        } else L[j] = m.a[y * W + x];
      }
      if (yum) L = bulanik(L, w, h, yum);
      if (tuy) {
        // ıslak kâğıtta tüylenen kenar: bulanık maske gürültülü bir eşikle yumuşakça kesilir
        const tg = o.tuyG || 0.22;
        for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
          const j = (y - y0) * w + x - x0, v = L[j];
          if (v <= 0.001 || v >= 0.999) continue;
          const i = y * W + x;
          const t = 0.5 + (AK[(i + ks * 613) % N] - 0.5) * tuy + (G[i] - 0.5) * tuy * 0.35;
          L[j] = sstep(t - tg, t + tg, v);
        }
      }
      const Lb = kenar ? bulanik(L, w, h, kr) : null;
      const grad = o.grad, koru = o.koru ? o.koru.a : null;
      const tk = 1 - kenar * 0.45;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        let a = L[j];
        if (a <= 0.002) continue;
        const i = y * W + x;
        if (kenar) { const e = a - Lb[j]; a = a * tk + kenar * 2.2 * (e > 0 ? e : 0); }
        if (gran) a *= 1 + gran * (G[i] - 0.5) * 2;
        if (akis) a *= 1 + akis * (AK[(i + ks * 1031) % N] - 0.5) * 2;
        if (grad) a *= grad(x, y);
        if (koru) a *= 1 - koru[i];
        if (kuru) a *= sstep(kuru - kuruY, kuru + kuruY, H[i] * 0.85 + G[(i + 7919) % N] * 0.15 + (AK[i] - 0.5) * 0.25);
        if (a <= 0) continue;
        C0[i] *= Math.exp(-ab[0] * a); C1[i] *= Math.exp(-ab[1] * a); C2[i] *= Math.exp(-ab[2] * a);
      }
    }
    /** Opak boya (guaj, beyaz): o.kap örtme, o.kuru kuru fırça eşiği, o.kalin kabartma kalınlığı, o.titre. */
    function opak(m, renk, o) {
      o = o || {};
      if (m.bos) return;
      const T = (typeof renk === 'string' ? hex(renk) : renk).map((c) => c / 255);
      const kap = o.kap == null ? 0.95 : o.kap, kuru = o.kuru || 0, kuruY = o.kuruY || 0.08, kalin = o.kalin == null ? 0.5 : o.kalin;
      const titre = o.titre || 0, yum = o.yumusak || 0, grad = o.grad, koru = o.koru ? o.koru.a : null, akis = o.akis == null ? 0.1 : o.akis;
      const kirik = o.kirik || 0;
      const pad = Math.ceil(titre + yum * 2 + 3);
      const x0 = Math.max(0, m.x0 - pad), y0 = Math.max(0, m.y0 - pad), x1 = Math.min(W, m.x1 + pad), y1 = Math.min(W, m.y1 + pad);
      const w = x1 - x0, h = y1 - y0;
      let L = new Float32Array(w * h);
      const ks = (tohum * 53 + Math.round(m.x0 * 1.7 + m.y0)) % 400;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        if (titre) { const k = ((y + ks) % W) * W + ((x + ks * 2) % W); L[j] = ornekle(m.a, x + DX[k] * titre, y + DY[k] * titre); }
        else L[j] = m.a[y * W + x];
      }
      if (yum) L = bulanik(L, w, h, yum);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        let a = L[j];
        if (a <= 0.002) continue;
        const i = y * W + x;
        if (kirik) a = sstep(0.4, 0.6, a + (H[i] - 0.5) * kirik + (AK[(i + 4409) % N] - 0.5) * 0.3 * kirik) * (0.75 + 0.25 * a);
        a *= kap;
        if (akis) a *= 1 + akis * (AK[(i + ks * 977) % N] - 0.5) * 2;
        if (grad) a *= grad(x, y);
        if (koru) a *= 1 - koru[i];
        if (kuru) a *= sstep(kuru - kuruY, kuru + kuruY, H[i] * 0.8 + (AK[(i + 3331) % N] - 0.5) * 0.3 + G[i] * 0.2);
        a = clamp(a, 0, 1);
        C0[i] += (T[0] - C0[i]) * a; C1[i] += (T[1] - C1[i]) * a; C2[i] += (T[2] - C2[i]) * a;
        KAL[i] += a * kalin;
      }
    }
    /** Son: kâğıt kabartması (sol üstten ışık), guaj kalınlığı, tuvale yazma. */
    function bitir(ctx) {
      const K = bulanik(KAL, W, W, 1);
      const img = ctx.createImageData(W, W), d = img.data;
      for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const ia = Math.max(0, i - W - 1), ib = Math.min(N - 1, i + W + 1);
        const rel = (H[ia] - H[ib]) * dk.kabartma + (K[ia] - K[ib]) * 0.35;
        const s = 1 + rel - dk.ton * (0.5 - H[i]);
        d[i * 4] = clamp(C0[i] * s * 255, 0, 255);
        d[i * 4 + 1] = clamp(C1[i] * s * 255, 0, 255);
        d[i * 4 + 2] = clamp(C2[i] * s * 255, 0, 255);
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    return { W, N, H, G, AK, DX, DY, clamp, sstep, hex, gurultu, fbm, bulanik, maske, yolMaske, fMaske, islem, cikar, kesis, birles, mBulanik, yika, opak, bitir, C: [C0, C1, C2] };
  }

  // ================================================================== sahne geometrisi ve ışık
  function Geo() {
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const prof = SAHNE.kubbeProfili(500);
    const KR = new Float32Array(1024), KD = new Float32Array(1024);
    for (let y = 300; y <= 555; y++) {
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
      KR[y] = a.r + (b.r - a.r) * t;
    }
    KR[300] = 0.5;
    for (let y = 301; y < 555; y++) KD[y] = (KR[y + 1] - KR[y - 1]) / 2;
    KD[300] = KD[301] * 1.4; KD[555] = KD[554];
    const L = (() => { const v = [0.6, -0.55, 0.58], l = Math.hypot(...v); return v.map((c) => c / l); })();
    /** Kubbe noktası: {u, fi (boylam), dilim (0–15), t (dilim içi 0–1), isik} */
    function kubbe(x, y, yassi) {
      const yy = clamp(y, 300, 555), yi = Math.floor(yy), fy = yy - yi;
      const r = Math.max(0.5, KR[yi] + (KR[Math.min(555, yi + 1)] - KR[yi]) * fy);
      const dr = KD[yi];
      const u = clamp((x - 560) / r, -1, 1);
      const fi = Math.asin(u);

  kasnakSir(0.86, '#7DBA63', 0.7);
  kasnakSir(0.62, '#3E965A', 0.6);
  kasnakSir(0.32, '#1F6B62', 0.55);
  // kat çizgileri: üst kenarda pırıl şerit (korunur), alt kenarda gölge
  M.yika(M.fMaske([330, 600, 790, 618], (x, y) => (y >= 610 && y < 618 && x > 334 && x < 786 ? 1 : 0)), '#1E5A55', { yog: 0.5, koru: korBina, kenar: 0.3, titre: 0.4, grad: (x) => 0.6 + 0.6 * (1 - kasnakIsik(x)) });
  M.yika(M.fMaske([330, 555, 790, 566], (x, y) => (y >= 555 && y < 563 && x > 352 && x < 768 ? 1 : 0)), '#1E5A55', { yog: 0.55, koru: korBina, kenar: 0.3, titre: 0.4, grad: (x) => 0.6 + 0.6 * (1 - kasnakIsik(x)) });
  M.yika(M.fMaske([330, 600, 790, 612], (x, y) => (y >= 604 && y < 610 && x > 352 && x < 768 ? 1 : 0)), '#1E5A55', { yog: 0.35, koru: korBina, kenar: 0.2, titre: 0.3 });
  // pencereler: koyu derin kemerler (küçük koyu vurgular)
  M.yika(M.yolMaske(Y.kasnakPencereleri), '#17423C', { yog: 0.95, koru: korBina, kenar: 0.4, kenarR: 2, titre: 0.35 });
  M.yika(M.yolMaske([0, 1].flatMap((k) => SAHNE.kasnakPencereleri(k).map((p) => SAHNE.kemerYolu(p.x - p.w * 0.12, p.y, p.w * 0.7, p.h * 0.5)))), '#16353A', { yog: 0.5, koru: korBina, kenar: 0.2, titre: 0.3 });

  // ------------------------------------------------------------ 4. kubbe: kademeli keskin sırlar ve korunmuş kaburga ışıkları
  const kab = SAHNE.kaburgalar(16);
  const kubbeVeri = new Float32Array(W * W);
  const kaburgaUzak = new Float32Array(W * W);
  const kubbeSaf = new Float32Array(W * W); // işaretli: en yakın kaburgaya piksel uzaklığı (sağ +)
  for (let y = 298; y <= 556; y++) for (let x = 356; x <= 764; x++) {
    const i = y * W + x;
    if (mKubbe.a[i] <= 0) continue;
    const k = g.kubbe(x, y, 0.62);
    kubbeVeri[i] = k.isik + (nz(x / 16, y / 16) - 0.5) * 0.02 + (nz(x / 40 + 9, y / 40) - 0.5) * 0.03;
    kubbeSaf[i] = k.isik;
    let enk = 99, isa = 0;
    for (const kb of kab) {
      const xr = 560 + kb.u * k.r, d = x - xr, ad = Math.abs(d) / Math.max(0.35, Math.sqrt(Math.cos(kb.boylam)));
      if (ad < enk) { enk = ad; isa = d >= 0 ? 1 : -1; }
    }
    kaburgaUzak[i] = enk * isa;
  }
  const isikKoru = M.fMaske([356, 296, 766, 557], (x, y) => {
    const i = y * W + x, m = mKubbe.a[i]; if (m <= 0) return 0;
    const v = kubbeSaf[i], d = kaburgaUzak[i];
    const serit = d > 0.3 && d < 2.4 ? sstep(0.7, 0.78, v) * sstep(0.3, 0.8, d) : 0;
    const parilti = sstep(0.962, 0.968, v + (nz(x / 22, y / 22) - 0.5) * 0.006) * sstep(1.5, 4, Math.abs(d));
    return m * Math.max(serit, parilti);
  });
  const kubbeKoru = M.birles(korBina, isikKoru);
  M.yika(mKubbe, '#D3E38D', { yog: 0.85, koru: kubbeKoru, kenar: 0.3, gran: 0.12, titre: 0.45 });
  const kubbeSir = (esik, renk, yog, alt) => M.yika(M.fMaske([356, 296, 766, 557], (x, y) => {
    const i = y * W + x, m = mKubbe.a[i]; if (m <= 0) return 0;
    const v = kubbeVeri[i];
    return m * sstep(-esik - 0.016, -esik + 0.016, -v) * (alt == null ? 1 : sstep(alt - 0.02, alt + 0.02, v));
  }), renk, { yog, koru: kubbeKoru, kenar: 0.38, kenarR: 2.5, gran: 0.16, akis: 0.1, titre: 0.45 });
  kubbeSir(0.9, '#93C76C', 0.6);
  kubbeSir(0.72, '#4FA35C', 0.55);
  kubbeSir(0.5, '#2C8160', 0.5);
  kubbeSir(0.24, '#1E6464', 0.45);
  kubbeSir(0.02, '#2A4F78', 0.35, -0.42);
  // kaburgalar: sol yanında ince koyu gölge çizgisi
  M.yika(M.fMaske([356, 296, 766, 557], (x, y) => {
    const i = y * W + x, m = mKubbe.a[i]; if (m <= 0) return 0;
    const d = kaburgaUzak[i];
    return m * (d < -0.2 && d > -2.4 ? 1 : 0) * (y > 304 ? 1 : 0);
  }), '#1E5A4A', { yog: 0.6, koru: korBina, kenar: 0.1, titre: 0.35, grad: (x, y) => 0.55 + 0.6 * (1 - clamp(kubbeVeri[y * W + x], 0, 1)) });
  // kubbe tabanı ile kasnak arasında gölge
  M.yika(M.fMaske([356, 540, 766, 557], (x, y) => (y > 549 ? mKubbe.a[y * W + x] : 0)), '#1F5A55', { yog: 0.45, koru: korBina, kenar: 0.2, titre: 0.4 });

  // ------------------------------------------------------------ 5. altın alemler
  const alemler = [SAHNE.alemParcalari(560, 300, 1), SAHNE.alemParcalari(300, 146, 0.62)];
  M.yika(mAlem, '#EDBE4C', { yog: 0.9, koru: M.fMaske([270, 60, 600, 320], (x, y) => {
    for (const a of alemler) for (const k of a.kureler) if (Math.hypot(x - (k.cx + k.r * 0.35), y - (k.cy - k.r * 0.35)) < k.r * 0.28) return 1;
    return 0;
  }), kenar: 0.3, titre: 0.25 });
  M.yika(M.kesis(mAlem, M.fMaske([270, 60, 600, 320], (x, y) => {
    for (const a of alemler) {
      const cx = a.yaka.cx;
      if (Math.abs(x - cx) < 30) {
        for (const k of a.kureler) { const dx = x - k.cx, dy = y - k.cy; if (dx * dx + dy * dy < k.r * k.r * 1.1) return dx * 0.72 - dy * 0.69 < k.r * 0.05 ? 1 : 0; }
        if (y > a.yaka.cy - a.yaka.ry - 1 && y < a.yaka.cy + a.yaka.ry + 1) return x < cx + a.yaka.rx * 0.15 ? 1 : 0;
        if (y > a.hilal.cy - a.hilal.R * 1.2 && y < a.hilal.cy + a.hilal.R * 1.1) return x < cx - a.hilal.R * 0.05 ? 1 : 0;
        return x < cx + 0.4 ? 1 : 0;
      }
    }
    return 0;
  })), '#B06E25', { yog: 0.65, kenar: 0.3, titre: 0.2 });

  // ------------------------------------------------------------ 6. zemin
  const zemin = M.fMaske([0, 796, W, W], (x, y) => (y >= 800 ? 1 : y >= 799 ? y - 799 : 0));
  M.yika(zemin, '#E9C690', { yog: 0.85, koru: M.birles(korOn, mBina), kenar: 0.15, gran: 0.18, akis: 0.15, grad: (x, y) => 0.8 + 0.4 * sstep(800, 1024, y) });
  // ufuk çizgisinde ince serin pus ve uzakta daha koyu sıcak toprak şeridi (keskin üst kenar)
  M.yika(M.fMaske([0, 798, W, 822], (x, y) => (y >= 800 && y < 806 + (nz(x / 30, 7) - 0.5) * 3 ? 1 : 0)), '#C9A77E', { yog: 0.55, koru: M.birles(korOn, mBina), kenar: 0.3, titre: 0.5 });
  M.yika(M.fMaske([0, 798, W, W], (x, y) => (y >= 800 ? 1 : 0)), '#D7B385', { yog: 0.35, koru: M.birles(korOn, mBina), kenar: 0.2, titre: 0.5, grad: (x, y) => sstep(850, 1024, y) });
  // bitkilerin zemine düşen serin gölgeleri
  M.yika(M.mBulanik(M.maske((c) => { c.translate(-9, 7); for (const d of Y.yapraklar) c.fill(P(d)); for (const f of cicekler) for (const t of f.tac) c.fill(P(t.d)); }), 1), '#A9ABD6', { yog: 0.7, koru: M.birles(korOn, mBina), kenar: 0.3, titre: 0.6, grad: (x, y) => (y > 800 ? 1 : 0) });

  // ------------------------------------------------------------ 7. bitkiler: saplar, yapraklar (iki yarım, ortada korunmuş damar), tomurcuklar
  M.yika(M.maske((c) => { c.lineWidth = 3.4; for (const s of Y.saplar) c.stroke(P(s)); }), '#79A64A', { yog: 0.9, koru: mOnde, kenar: 0.3, titre: 0.4 });
  M.yika(M.maske((c) => { c.lineWidth = 1.6; c.translate(-1, 0.6); for (const s of Y.saplar) c.stroke(P(s)); }), '#2F6A4A', { yog: 0.5, koru: mOnde, kenar: 0.2, titre: 0.3 });
  // yapraklar: arkadan öne gruplar halinde; her yaprak ışıklı yarısı sarı-yeşil, gölge yarısı mavi-yeşil
  const yapraklar = B.yapraklar.map((y, i) => ({ y, i, tonR: R(), tonG: R() }));
  const damarKoru = (liste) => M.maske((c) => { c.lineWidth = 1.3; for (const o of liste) { const [a, b] = SAHNE.yaprakDamari(o.y); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); } });
  const gruplar = [yapraklar.filter((o) => o.i % 3 === 0), yapraklar.filter((o) => o.i % 3 === 1), yapraklar.filter((o) => o.i % 3 === 2)];
  for (const grup of gruplar) {
    const dk = damarKoru(grup);
    const korY = M.birles(mOnde, dk);
    const sicak = grup.filter((o) => o.tonR < 0.55), serin = grup.filter((o) => o.tonR >= 0.55);
    M.yika(M.yolMaske(sicak.map((o) => SAHNE.yaprakYolu(o.y))), '#B4D467', { yog: 0.85, koru: korY, kenar: 0.35, kenarR: 2.5, gran: 0.15, titre: 0.45 });
    M.yika(M.yolMaske(serin.map((o) => SAHNE.yaprakYolu(o.y))), '#93C878', { yog: 0.85, koru: korY, kenar: 0.35, kenarR: 2.5, gran: 0.15, titre: 0.45 });
    // gölge yarısı: ışıktan uzak yan
    const golgeYari = grup.map((o) => {
      const nx = -Math.sin(o.y.aci), ny = Math.cos(o.y.aci);
      const taraf = nx * LX + ny * LY > 0 ? -1 : 1;
      return yaprakYarisi(o.y, taraf);
    });
    M.yika(M.yolMaske(golgeYari), '#2E7E5E', { yog: 0.75, koru: korY, kenar: 0.4, kenarR: 2, gran: 0.15, titre: 0.4 });
    M.yika(M.yolMaske(grup.filter((o) => o.tonG < 0.35).map((o) => SAHNE.yaprakYolu(o.y))), '#3C7A57', { yog: 0.35, koru: korY, kenar: 0.3, titre: 0.4 });
  }
  // tomurcuklar: gül pembesi, gölge yanı koyu gül, dipte yeşil çanak
  M.yika(mTomurcuk, '#F0B4C4', { yog: 0.85, koru: mCicek, kenar: 0.35, titre: 0.3 });
  M.yika(M.kesis(mTomurcuk, M.fMaske([0, 500, W, W], (x, y) => {
    for (const t of B.tomurcuklar) { const dx = x - t.x, dy = y - t.y; if (dx * dx + dy * dy < t.r * t.r * 4) return dx * LX + dy * LY < -t.r * 0.1 ? 1 : 0; }
    return 0;
  })), '#C45C80', { yog: 0.6, kenar: 0.3, titre: 0.25 });
  M.yika(M.maske((c) => { for (const t of B.tomurcuklar) { c.beginPath(); c.ellipse(t.x - Math.cos(t.aci) * t.r * 0.55, t.y - Math.sin(t.aci) * t.r * 0.55, t.r * 0.62, t.r * 0.42, t.aci, 0, Math.PI * 2); c.fill(); } }), '#5E9446', { yog: 0.8, koru: mCicek, kenar: 0.3, titre: 0.25 });

  // ------------------------------------------------------------ 8. beyaz çiçekler: kâğıt beyazı, serin keskin gölgeler
  for (const f of cicekler) {
    const c = f.c;
    // taç yaprak gölgeleri: ışıktan uzak yarı, üst üste binen yaprağın ince gölgesi, göbek çevresinde çanak gölgesi
    const tacM = f.tac.map((t) => M.yolMaske(t.d));
    f.tac.forEach((t, k) => {
      const nx = -Math.sin(t.a), ny = Math.cos(t.a);
      const yon = Math.cos(t.a) * LX + Math.sin(t.a) * LY; // yaprak ışığa doğru mu uzanıyor
      const taraf = nx * LX + ny * LY > 0 ? -1 : 1;
      const yari = M.maske((cx) => {
        cx.fill(P(t.d));
        cx.globalCompositeOperation = 'destination-in';
        cx.save(); cx.translate(c.x, c.y); cx.rotate(t.a);
        cx.beginPath();
        const off = c.r * (0.03 + 0.2 * (1 + yon) * 0.5);
        cx.moveTo(-c.r, taraf * off); cx.bezierCurveTo(c.r * 0.4, taraf * off, c.r * 0.8, taraf * c.r * 0.12, c.r * 1.3, taraf * c.r * 0.26);
        cx.lineTo(c.r * 1.3, taraf * c.r); cx.lineTo(-c.r, taraf * c.r); cx.closePath(); cx.fill();
        cx.restore();
        cx.globalCompositeOperation = 'destination-out';
        cx.beginPath(); cx.arc(c.x, c.y, c.r * 0.3, 0, Math.PI * 2); cx.fill();
      });
      M.yika(yari, '#C3C8E8', { yog: 0.25 + 0.6 * (1 - yon) * 0.5, kenar: 0.4, kenarR: 2, gran: 0.1, titre: 0.4 });
    });
    // üst üste binme gölgeleri
    for (let k = 0; k < 5; k++) {
      const ust = f.tac[k], alt = tacM[(k + 1) % 5];
      const golge = M.maske((cx) => { cx.save(); cx.translate(-2.2, 2.6); cx.fill(P(ust.d)); cx.restore(); cx.globalCompositeOperation = 'destination-out'; cx.beginPath(); cx.arc(c.x, c.y, c.r * 0.34, 0, Math.PI * 2); cx.fill(); });
      const ince = M.islem(alt, golge, (p, q, i) => p * q * (1 - tacM[k].a[i]), "kesis");
      M.yika(ince, '#A9ADD8', { yog: 0.7, kenar: 0.2, titre: 0.2 });
    }
    // göbek çanağı: göbeğin çevresinde soluk sıcak-serin halka
    M.yika(M.kesis(mCicek, M.fMaske([c.x - c.r, c.y - c.r, c.x + c.r, c.y + c.r], (x, y) => { const d = Math.hypot(x - c.x + c.r * 0.04, y - c.y - c.r * 0.05); return d < c.r * 0.42 ? 1 : 0; })), '#E3E0EE', { yog: 0.5, kenar: 0.3, titre: 0.5 });
    // göbek: kadmiyum sarısı disk, gölge yanı siena, ercik noktaları, korunmuş parıltı
    const gr = c.r * 0.2;
    const gob = M.maske((cx) => { cx.beginPath(); cx.arc(c.x, c.y, gr, 0, Math.PI * 2); cx.fill(); });
    const parilti = M.maske((cx) => { cx.beginPath(); cx.arc(c.x + gr * 0.35, c.y - gr * 0.38, gr * 0.28, 0, Math.PI * 2); cx.fill(); });
    M.yika(gob, '#F2C437', { yog: 0.95, koru: parilti, kenar: 0.35, kenarR: 1.5, titre: 0.3 });
    M.yika(M.kesis(gob, M.fMaske([c.x - gr - 2, c.y - gr - 2, c.x + gr + 2, c.y + gr + 2], (x, y) => ((x - c.x) * LX + (y - c.y) * LY < -gr * 0.15 ? 1 : 0))), '#C07A22', { yog: 0.65, kenar: 0.3, titre: 0.2 });
    M.yika(M.maske((cx) => {
      for (let i = 0; i < 11; i++) {
        const a = (i / 11) * Math.PI * 2 + c.aci, rr = gr * (1.25 + ((i * 7) % 3) * 0.1);
        cx.beginPath(); cx.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.032), 0, Math.PI * 2); cx.fill();
      }
    }), '#A4621D', { yog: 0.85, kenar: 0.2, titre: 0.15 });
  }

  M.bitir(ctx);
  SAHNE.hazir();

})();
</script>
