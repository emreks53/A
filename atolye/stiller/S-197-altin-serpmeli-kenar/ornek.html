<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-197 Altın Serpmeli Kenar Süslemeli Resim — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #E9D9B4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ---------------------------------------------------------------- ortak el yardımcıları
  const S = SAHNE;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const N = 256;
    const tab = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * N + x0];
      const b = tab[y0 * N + x1];
      const c = tab[y1 * N + x0];
      const d = tab[y1 * N + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    const n = H.noise(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen bir şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.noise(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? 0 : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (taper > 0) {
          if (t < taper) w *= 0.3 + 0.7 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.3 + 0.7 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Kubbe yarıçapı r(y) ve eğimi; y 300–555. */
  H.kubbeP = S.kubbeProfili(200);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };

  /** Bölge haritası istenen ölçekte (ör. 2 → 2048²): kod dizisi + ad listesi. */
  H.BOLGE_ADLARI = Object.keys(S.BOLGE);
  H.bolgeHaritasi = function (olcek) {
    const N = 1024 * olcek;
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(olcek, 0, 0, olcek, 0, 0);
    S.ciz(g, { bolge: true });
    const v = g.getImageData(0, 0, N, N).data;
    const kod = new Uint8Array(N * N);
    const tablo = H.BOLGE_ADLARI.map((ad) => H.hex(S.BOLGE[ad]));
    const onbellek = new Map();
    for (let i = 0, j = 0; i < N * N; i++, j += 4) {
      const key = (v[j] << 16) | (v[j + 1] << 8) | v[j + 2];
      let k = onbellek.get(key);
      if (k === undefined) {
        let en = 1e9;
        k = 0;
        for (let m = 0; m < tablo.length; m++) {
          const dr = v[j] - tablo[m][0];
          const dg = v[j + 1] - tablo[m][1];
          const db = v[j + 2] - tablo[m][2];
          const dd = dr * dr + dg * dg + db * db;
          if (dd < en) {
            en = dd;
            k = m;
          }
        }
        onbellek.set(key, k);
      }
      kod[i] = k;
    }
    const K = {};
    H.BOLGE_ADLARI.forEach((ad, i) => (K[ad] = i));
    return { N, kod, K };
  };

  /**
   * Örtmeli kontur katmanı: sahne sırasıyla her nesne için önce kendi alanını siler (arkadakilerin
   * çizgileri onun altında kalır), sonra kendi çizgisini çizer. Sonunda ana tuvale bindirilir.
   */
  H.konturKatmani = function (olcek) {
    const c = S.yeniTuval(1024 * olcek, 1024 * olcek);
    const k = c.getContext('2d');
    k.setTransform(olcek, 0, 0, olcek, 0, 0);
    return {
      c,
      k,
      sil(d) {
        k.save();
        k.globalCompositeOperation = 'destination-out';
        k.fillStyle = '#000';
        for (const x of [].concat(d)) k.fill(typeof x === 'string' ? new Path2D(x) : x);
        k.restore();
      },
    };
  };

  // ---------------------------------------------------------------- S-197 Altın Serpmeli Kenar Süslemeli Resim
  // Hayalî bir albüm ressamının eli: ortada sincap kılı fırçayla, mühreyle perdahlanmış örtücü suluboya
  // (guaş) ile ince işlenmiş bir resim; çevresinde altın serpilmiş (zerefşan) geniş açık devetüyü kâğıt
  // kenar; kenarda doğadan çizilmiş çiçekli bitkiler, çoğu iki tonlu altınla, bazıları yumuşak renklerle;
  // kenar ile resim arasında altın, lacivert ve kırmızı ince cetveller, açık yeşil kâğıt şerit.
  const N2 = 2048;
  const tuval = document.getElementById('tuval');
  tuval.width = N2;
  tuval.height = N2;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  const R = S.rng(197);
  const P = H.P;
  let tohum = 3;

  const RESIM = { x: 126, y: 126, w: 772 };
  const SC = RESIM.w / 1024;
  const K = {
    kenar: '#ECDDBB',
    kenarKoyu: '#DCC79C',
    altin: '#D2AE52',
    altinAcik: '#F1D88A',
    altinKoyu: '#94702A',
    lacivert: '#2F4FA0',
    surh: '#B8402F',
    serit: '#C9DCC4',
    murekkep: '#3A2A1C',
  };

  // ------------------------------------------------ 1) kenar kâğıdı: açık devetüyü, ince lif dokusu
  {
    const img = ctx.getImageData(0, 0, N2, N2);
    const o = img.data;
    const n1 = H.noise(5);
    const n2 = H.noise(6);
    const c1 = H.hex(K.kenar);
    for (let y = 0; y < N2; y++) {
      for (let x = 0; x < N2; x++) {
        const v = 0.035 * n1(x / 160, y / 160) + 0.012 * n2(x / 5, y / 26) + 0.008 * n2(x * 0.7 + 99, y * 0.7);
        const i = (y * N2 + x) * 4;
        o[i] = c1[0] * (1 + v);
        o[i + 1] = c1[1] * (1 + v);
        o[i + 2] = c1[2] * (1 + v * 1.3);
        o[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // altın parçacıkları (zerefşan): düzensiz, köşeli pullar; bazıları ışığı yakalar
  function zerefsan(adet, alan, seed) {
    const r = S.rng(seed);
    for (let i = 0; i < adet; i++) {
      const [x, y] = alan(r);
      if (x === null) continue;
      const s = r() < 0.1 ? 2.4 + r() * 3 : 0.7 + r() * 1.8;
      const n = 4 + ((r() * 3) | 0);
      const a0 = r() * 6.28;
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        const a = a0 + (k / n) * 6.28 + (r() - 0.5) * 0.8;
        const rr = s * (0.5 + r() * 0.7);
        const px = x + Math.cos(a) * rr;
        const py = y + Math.sin(a) * rr * (0.6 + r() * 0.5);
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      const t = r();
      ctx.fillStyle = t < 0.25 ? K.altinAcik : t < 0.8 ? K.altin : '#B48C38';
      ctx.globalAlpha = 0.75 + r() * 0.25;
      ctx.fill();
      if (t < 0.18 && s > 1.2) {
        ctx.fillStyle = 'rgba(255,248,215,0.9)';
        ctx.fillRect(x - 0.4, y - 0.4, 0.8, 0.8);
      }
    }
    ctx.globalAlpha = 1;
  }
  const kenardaMi = (x, y) => !(x > RESIM.x - 24 && x < RESIM.x + RESIM.w + 24 && y > RESIM.y - 24 && y < RESIM.y + RESIM.w + 24);
  zerefsan(4200, (r) => {
    const x = r() * 1024;
    const y = r() * 1024;
    return kenardaMi(x, y) ? [x, y] : [null, null];
  }, 31);

  // ------------------------------------------------ 2) kenardaki çiçekli bitkiler (altın ve yumuşak renk)
  const ink = (d, w, renk, amp) => H.pen(ctx, d, { w, color: renk, amp: amp === undefined ? 0.3 : amp, wl: 16, seed: tohum++, press: 0.5, taper: 0.2, step: 0.8 });
  const cizgi = (pts, w, renk, amp) => ink([{ pts, closed: false }], w, renk, amp);
  // bir yaprak (sap noktası, yön, boy, en, kıvrım)
  function yaprakYolu(x, y, a, L, Wd, kiv) {
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const p = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
    const b = p(L, kiv * L * 0.25);
    const c1 = p(L * 0.3, -Wd);
    const c2 = p(L * 0.75, -Wd * 0.6 + kiv * L * 0.2);
    const c3 = p(L * 0.75, Wd * 0.6 + kiv * L * 0.2);
    const c4 = p(L * 0.3, Wd);
    return `M${x},${y} C${c1} ${c2} ${b} C${c3} ${c4} ${x},${y} Z`.replace(/(\d+\.\d{2})\d+/g, '$1');
  }
  function boyaAltin(d, renkli) {
    const yol = P(d);
    const b = new Path2D(d);
    ctx.fillStyle = renkli || K.altin;
    ctx.fill(yol);
    return b;
  }
  // gölge taraması: biçimin bir yanına ince koyu altın çizgiler
  function tara(d, x, y, a, L, adet, renk) {
    ctx.save();
    ctx.clip(P(d));
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    for (let i = 0; i < adet; i++) {
      const t = (i + 0.5) / adet;
      const px = x + ca * L * t;
      const py = y + sa * L * t;
      ctx.strokeStyle = renk;
      ctx.lineWidth = 0.45;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - sa * L * 0.22, py + ca * L * 0.22);
      ctx.stroke();
    }
    ctx.restore();
  }
  // doğadan çizilmiş bitki: kıvrık sap, iki tonlu yapraklar (ucu dönük olanlar), çiçek ve tomurcuklar
  function bitki(tur, x, y, s, renk, rr) {
    const altin = !renk;
    const yapA = altin ? '#E2C374' : renk.yaprak;
    const yapK = altin ? '#BE9440' : renk.yaprakK;
    const cicA = altin ? '#EFD48A' : renk.cicek;
    const cicK = altin ? '#C9A04A' : renk.cicek2;
    const kont = altin ? '#8C6722' : '#6A5432';
    const taraR = altin ? 'rgba(130,92,28,0.75)' : 'rgba(80,70,50,0.45)';
    const yon = rr() < 0.5 ? -1 : 1;
    // toprak öbeği ve otlar
    const tp = `M${x - 13 * s},${y} C${x - 9 * s},${y - 4.5 * s} ${x + 9 * s},${y - 4.5 * s} ${x + 13 * s},${y} Z`;
    ctx.fillStyle = '#D9B864';
    ctx.fill(P(tp));
    ink(tp, 0.5, '#8C6722', 0.1);
    for (let i = -3; i <= 3; i++) cizgi([[x + i * 3.6 * s, y - 1.5], [x + i * 5 * s + (rr() - 0.5) * 2, y - (5 + rr() * 4) * s]], 0.45, '#8C6722', 0.1);
    // sap: hafif S eğrisi
    const sapNok = (x0, y0, L, egim, sal) => {
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.04) {
        pts.push([x0 + Math.sin(egim) * L * t + sal * Math.sin(t * Math.PI) * s, y0 - Math.cos(egim) * L * t]);
      }
      return pts;
    };
    const sapCiz = (pts, w) => {
      ctx.strokeStyle = yapK;
      ctx.lineWidth = (w || 1.5) * s;
      ctx.lineCap = 'round';
      ctx.stroke(H.polyPath(pts));
      cizgi(pts, 0.45, kont, 0.12);
    };
    // yaprak: mızrak biçimli, kıvrık; bir yarısı koyu; bazılarının ucu dönük (açık tonda)
    const yaprak = (px, py, a, L, Wd, bk, donuk) => {
      L *= s;
      Wd *= s;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const m = (u) => bk * L * 0.35 * Math.sin(Math.PI * u) + bk * L * 0.2 * u * u;
      const P2 = (u, v) => [px + u * L * ca - (v + m(u)) * sa, py + u * L * sa + (v + m(u)) * ca];
      const sol = [];
      const sag = [];
      const N = 18;
      const uc = donuk ? 0.78 : 1;
      for (let i = 0; i <= N; i++) {
        const u = (i / N) * uc;
        const w = Wd * Math.sin(Math.PI * Math.pow(u / 1, 0.8)) * (1 - 0.15 * u);
        sol.push(P2(u, -w));
        sag.push(P2(u, w));
      }
      const tum = sol.concat(sag.slice().reverse());
      const yol = H.polyPath(tum, true);
      ctx.fillStyle = yapA;
      ctx.fill(yol);
      const orta = [];
      for (let i = 0; i <= N; i++) orta.push(P2((i / N) * uc, 0));
      ctx.fillStyle = yapK;
      ctx.fill(H.polyPath((bk >= 0 ? sol : sag).concat(orta.slice().reverse()), true));
      // koyu yarıda ince tarama
      ctx.save();
      ctx.clip(H.polyPath((bk >= 0 ? sol : sag).concat(orta.slice().reverse()), true));
      ctx.strokeStyle = taraR;
      ctx.lineWidth = 0.35;
      for (let i = 2; i < N; i += 2) {
        const a1 = P2((i / N) * uc, 0);
        const a2 = P2((i / N) * uc + 0.05, (bk >= 0 ? -1 : 1) * Wd);
        ctx.beginPath();
        ctx.moveTo(a1[0], a1[1]);
        ctx.lineTo(a2[0], a2[1]);
        ctx.stroke();
      }
      ctx.restore();
      ink([{ pts: tum, closed: true }], 0.5, kont, 0.1);
      cizgi(orta, 0.35, kont, 0.05);
      if (donuk) {
        // dönük uç: yaprağın tersi açık tonda görünür
        const b0 = sol[N];
        const b1 = sag[N];
        const tip = P2(uc + 0.05, (bk >= 0 ? 1 : -1) * Wd * 1.8);
        const d = `M${b0[0]},${b0[1]} Q${tip[0]},${tip[1]} ${b1[0]},${b1[1]} Z`;
        ctx.fillStyle = altin ? '#F3DE9C' : renk.yaprakA;
        ctx.fill(P(d));
        ink(d, 0.45, kont, 0.05);
      }
    };
    const tomurcuk = (bx, by, a, r) => {
      r *= s;
      const d = S.tomurcukYolu({ x: bx, y: by, r, aci: a });
      ctx.fillStyle = cicA;
      ctx.fill(P(d));
      ctx.save();
      ctx.clip(P(d));
      ctx.fillStyle = cicK;
      ctx.fillRect(bx - r * 3, by - r * 3, r * 3 * (yon > 0 ? 1 : 0.9), r * 6);
      ctx.restore();
      ink(d, 0.45, kont, 0.05);
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const c1 = [bx - ca * r * 0.4 - sa * r * 0.9, by - sa * r * 0.4 + ca * r * 0.9];
      const c2 = [bx - ca * r * 0.4 + sa * r * 0.9, by - sa * r * 0.4 - ca * r * 0.9];

  // ------------------------------------------------ 5a) guaş fırçası: ortadaki resim, renk alanının içinde kalan

    const src = new Uint8ClampedArray(o);
    const RB = S.rng(1971);
    const nd = H.noise(1972);
    // yaprak yönleri
    const yonT = S.yeniTuval(1024, 1024);
    const yg = yonT.getContext('2d', { willReadFrequently: true });
    yg.fillStyle = 'rgb(128,128,0)';
    yg.fillRect(0, 0, 1024, 1024);
    for (const y of S.bitki.yapraklar) {
      yg.fillStyle = `rgb(${Math.round(128 + 127 * Math.cos(y.aci))},${Math.round(128 + 127 * Math.sin(y.aci))},255)`;

    const YD = yg.getImageData(0, 0, 1024, 1024).data;
    function vurus(cx, cy, a, L, Wd, col, alfa, esik) {
      const dx = Math.cos(a);
      const dy = Math.sin(a);
      const h = L / 2;
      const hw = Wd / 2;
      const nb = 7;
      const kil = [];
      const boy = [];
      for (let i = 0; i < nb; i++) {
        kil.push(0.62 + 0.38 * RB());
        boy.push(0.7 + 0.3 * RB());
      }
      const bk = (RB() - 0.5) * Wd * 0.5;
      const c0i = ((cy | 0) * W + (cx | 0)) * 4;
      const r0 = src[c0i];
      const g0 = src[c0i + 1];
      const b0 = src[c0i + 2];
      const e = h + hw + 2;
      const xa = Math.max(0, Math.floor(cx - e));
      const xb = Math.min(W - 1, Math.ceil(cx + e));
      const ya = Math.max(0, Math.floor(cy - e));
      const yb = Math.min(W - 1, Math.ceil(cy + e));
      for (let y = ya; y <= yb; y++) {
        for (let x = xa; x <= xb; x++) {
          const px = x + 0.5 - cx;
          const py = y + 0.5 - cy;
          const t = (px * dx + py * dy) / h;
          if (t <= -1 || t >= 1) continue;
          const sv = (-px * dy + py * dx - bk * (1 - t * t)) / hw;
          if (sv <= -1 || sv >= 1) continue;
          const bi = Math.min(nb - 1, (((sv + 1) / 2) * nb) | 0);
          const at = t > 0 ? t : -t * 1.6; // başı yuvarlak ve dolgun, sonu kuru fırça
          if (at > boy[bi]) continue;
          const i = (y * W + x) * 4;
          const fark = Math.abs(src[i] - r0) + Math.abs(src[i + 1] - g0) + Math.abs(src[i + 2] - b0);
          if (fark > esik) continue;
          let w = alfa * kil[bi] * H.smooth(1, 0.72, Math.abs(sv)) * H.smooth(boy[bi], boy[bi] - 0.2, at);
          w *= 1 - fark / esik;
          o[i] += (col[0] - o[i]) * w;
          o[i + 1] += (col[1] - o[i + 1]) * w;
          o[i + 2] += (col[2] - o[i + 2]) * w;
        }
      }
    }
    function gecis(adet, olcek) {
      for (let c = 0; c < adet; c++) {
        const cx = RB() * W;
        const cy = RB() * W;
        const sx = Math.min(1023, (cx * olc) | 0);
        const sy = Math.min(1023, (cy * olc) | 0);
        const b = BH.kod[sy * 1024 + sx];
        let a;
        let L;
        let Wd;
        let esik = 60;
        if (b === KB.gok || b === KB.gunes) {
          a = 0.06 * nd(cx / 400, cy / 400) + (RB() - 0.5) * 0.1;
          L = 48 + RB() * 44;
          Wd = 7 + RB() * 5;
          esik = 52;
        } else if (b === KB.zemin) {
          a = (RB() - 0.5) * 0.3 - (RB() < 0.4 ? 1.2 : 0);
          L = 16 + RB() * 16;
          Wd = 5 + RB() * 4;
        } else if (b === KB.kubbe) {
          const r = H.kubbeR(sy) || 1;
          const u = (sx - 560) / r;
          const dr = (H.kubbeR(sy - 2) - H.kubbeR(sy + 2)) / 4;
          a = Math.atan2(-1, u * dr) + (RB() - 0.5) * 0.1;
          L = 18 + RB() * 16;
          Wd = 5 + RB() * 3;
          esik = 58;
        } else if (b === KB.kasnak || b === KB.minare || b === KB.kaide) {
          a = Math.PI / 2 + (RB() - 0.5) * 0.08;
          L = 12 + RB() * 12;
          Wd = 4 + RB() * 3;
          esik = 50;
        } else if (b === KB.yaprak) {
          const i = (sy * 1024 + sx) * 4;
          a = Math.atan2(YD[i + 1] - 128, YD[i] - 128) + (RB() - 0.5) * 0.25;
          L = 10 + RB() * 10;
          Wd = 4 + RB() * 2.5;
          esik = 52;
        } else if (b === KB.cicek) {
          let en = 1e9;
          a = 0;
          for (const cc of S.bitki.cicekler) {
            const d = (sx - cc.x) ** 2 + (sy - cc.y) ** 2;
            if (d < en) {
              en = d;
              a = Math.atan2(sy - cc.y, sx - cc.x);
            }
          }
          L = 9 + RB() * 7;
          Wd = 4 + RB() * 2;
          esik = 44;
        } else continue;
        L *= olcek;
        Wd *= olcek;
        const ci = ((cy | 0) * W + (cx | 0)) * 4;
        // ressamın paletinde her fırça biraz farklı karışır: açık/koyu, sıcak/serin
        const f = 1 + (RB() - 0.5) * 0.07;
        const col = [src[ci] * f * (1 + (RB() - 0.5) * 0.03), src[ci + 1] * f, src[ci + 2] * f * (1 + (RB() - 0.5) * 0.035)];
        vurus(cx, cy, a, L, Wd, col, 0.82 + RB() * 0.18, esik);
      }
    }
    gecis(7000, 1.9);
    gecis(11000, 1.35);
    gecis(14000, 0.95);
    ctx.putImageData(img, ox, ox);
  }

  // ------------------------------------------------ 5) son: ortada ince fırça izi (guaşın yönlü dokusu), kenarda kâğıt
  {
    const img = ctx.getImageData(0, 0, N2, N2);
    const o = img.data;
    const n = H.noise(808);
    const nf = H.noise(809);
    const x0 = RESIM.x * 2;
    const x1 = (RESIM.x + RESIM.w) * 2;
    for (let y = 0; y < N2; y++) {
      for (let x = 0; x < N2; x++) {
        const i = (y * N2 + x) * 4;
        let f;
        if (x >= x0 && x < x1 && y >= x0 && y < x1) {
          const sx = Math.min(1023, Math.max(0, ((x / 2 - RESIM.x) / SC) | 0));
          const sy = Math.min(1023, Math.max(0, ((y / 2 - RESIM.y) / SC) | 0));
          const b = BH.kod[sy * 1024 + sx];
          let a;
          if (b === KB.gok || b === KB.gunes || b === KB.zemin) a = 0.04 * nf(x / 300, y / 300);
          else if (b === KB.kubbe) {
            const r = H.kubbeR(sy) || 1;
            const u = (sx - 560) / r;
            const dr = (H.kubbeR(sy - 2) - H.kubbeR(sy + 2)) / 4;
            a = Math.atan2(-1, u * dr);
          } else if (b === KB.kasnak || b === KB.minare || b === KB.kaide) a = Math.PI / 2;
          else a = -0.8;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          const u2 = x * ca + y * sa;
          const v2 = -x * sa + y * ca;
          f = 1 + 0.012 * n(u2 / 26, v2 / 2.4) + 0.01 * n(x / 3, y / 3);
        } else {
          f = 1 + 0.018 * n(x / 3.5, y / 3.5) + 0.01 * n(x / 40, y / 9);
        }
        o[i] *= f;
        o[i + 1] *= f;
        o[i + 2] *= f;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
