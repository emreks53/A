<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-153 İnce Konturlu Düz Renk — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-153 İnce Konturlu Düz Renk — editoryal çizim: her biçim ince, eşit kalınlıkta koyu yeşil ya da
  // kahverengi bir konturla çevrilir; konturun içi tam oturan düz bir renkle ve tek bir yumuşak gölge
  // tonuyla doldurulur. İç ayrıntılar (kaburga, taş derzi, yaprak damarı, erkek organ) daha da ince çizgilerle.
  const OL = 2;
  const ctx = SAHNE.tuval(document.getElementById('tuval'), OL);
  const rng = SAHNE.rng(153);
  const Y = SAHNE.yollar();
  const P = (d) => new Path2D(d);
  const B = SAHNE.bitki;

  // ------------------------------------------------------------ palet
  const C = {
    gok: '#A8D8EA', gokAcik: '#CBE9F1',
    gunes: '#FCE7A6', gunesHale: '#F6F1D2',
    bulut: '#FFFFFF', bulutG: '#E3F1F6',
    zemin: '#EED9AE', zeminG: '#DFC593',
    tas: '#FBF4E4', tasG: '#EADBBE', tasPen: '#5E8E86', tasPenG: '#4C7A73',
    kubbe: '#3FA266', kubbeG: '#33905A',
    kasnak: '#33935A', kasnakG: '#28794A', pen: '#1D5A3A',
    altin: '#EDC15A', altinG: '#CF9C38',
    yaprak: '#7DBB6E', yaprakG: '#5FA05A', yaprakK: '#5AA867', yaprakKG: '#46905A',
    sap: '#5E9F57',
    cicek: '#FFFFFF', cicekG: '#F5D2DC', orta: '#F4C34E', ortaG: '#E3A43A',
    tomurcuk: '#F5B4C3', tomurcukG: '#E896AA',
    // kontur renkleri
    kY: '#1F4634', kK: '#5A3D2A', kA: '#6E4A1E', kG: '#2C5468', kC: '#3E4A2E',
  };
  const LW = 1.45; // ana kontur
  const LI = 0.85; // iç ayrıntı

  function dolKontur(d, dolgu, kontur, lw) {
    const p = typeof d === 'string' ? P(d) : d;
    if (dolgu) { ctx.fillStyle = dolgu; ctx.fill(p); }
    if (kontur) { ctx.strokeStyle = kontur; ctx.lineWidth = lw || LW; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(p); }
  }
  function cizgi(pts, renk, lw) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.strokeStyle = renk; ctx.lineWidth = lw || LI; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function kirp(d, f) { ctx.save(); ctx.clip(typeof d === 'string' ? P(d) : d); f(); ctx.restore(); }
  const dikd = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y1} L${x2},${y2} L${x1},${y2} Z`;
  // ------------------------------------------------------------ gök
  ctx.fillStyle = C.gok;
  ctx.fillRect(0, 0, 1024, 1024);
  // ufukta tek, düz, daha açık bir bant (yapının arkasında kalır)
  ctx.fillStyle = C.gokAcik;
  ctx.fillRect(0, 760, 1024, 40);

  // güneş: düz hale, düz disk, ince halkalar
  dolKontur(SAHNE.daireYolu(880, 140, 112), C.gunesHale, 'rgba(110,74,30,0.35)', LI);
  dolKontur(SAHNE.daireYolu(880, 140, 58), C.gunes, C.kA, LW);
  dolKontur(SAHNE.daireYolu(880, 140, 44), null, 'rgba(110,74,30,0.45)', LI);
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2 + 0.07;
    const r1 = 70, r2 = i % 2 ? 86 : 98;
    cizgi([[880 + Math.cos(a) * r1, 140 + Math.sin(a) * r1], [880 + Math.cos(a) * r2, 140 + Math.sin(a) * r2]], 'rgba(110,74,30,0.55)', LI);
  }

  // bulutlar: daire birleşimi, düz beyaz, alt yarısında tek gölge tonu
  /** Uzun, alçak, sakin bulut: düz taban üzerinde küçük, yassı kabarcıklar; ince kontur, alt kenarda tek gölge tonu. */
  function bulut(cx, cy, s, ayna) {
    const m = ayna ? -1 : 1;
    const d = [
      [-78, 4, 13], [-58, -4, 18], [-32, -12, 24], [-2, -17, 27], [28, -11, 22], [52, -4, 17], [74, 3, 12],
    ].map(([x, y, r]) => [cx + x * s * m, cy + y * s * 0.9, r * s]);
    const yap = (dx, dy) => {
      const p = new Path2D();
      for (const [x, y, rr] of d) { p.moveTo(x + dx + rr, y + dy); p.ellipse(x + dx, y + dy, rr, rr * 0.86, 0, 0, Math.PI * 2); }
      const r = 7 * s, x1 = cx - 92 * s + dx, x2 = cx + 92 * s + dx, y0 = cy + 1 * s + dy;
      p.moveTo(x1 + r, y0);
      p.lineTo(x2 - r, y0);
      p.arc(x2 - r, y0 + r, r, -Math.PI / 2, Math.PI / 2);
      p.lineTo(x1 + r, y0 + 2 * r);
      p.arc(x1 + r, y0 + r, r, Math.PI / 2, Math.PI * 1.5);
      return p;
    };
    const p = yap(0, 0);
    ctx.strokeStyle = C.kG; ctx.lineWidth = LW * 1.7; ctx.stroke(p);
    ctx.fillStyle = C.bulutG; ctx.fill(p);
    // tek gölge tonu: ışığa doğru kaydırılmış kopya beyaz → gölge yalnız alt kenarda ince hilal
    ctx.save(); ctx.clip(p);
    ctx.fillStyle = C.bulut; ctx.fill(yap(4 * s, -6 * s));
    ctx.restore();
  }
  bulut(170, 246, 1.0);
  bulut(500, 146, 0.78, true);
  bulut(770, 344, 1.0, true);
  bulut(952, 474, 0.6);
  bulut(86, 466, 0.62, true);

  // ------------------------------------------------------------ zemin
  ctx.fillStyle = C.zemin;
  ctx.fillRect(0, 800, 1024, 224);
  // yapının sola düşen gölgesi (düz, tek ton)
  dolKontur('M300,800 L820,800 L760,836 L232,836 Z', C.zeminG, null);
  cizgi([[0, 800], [1024, 800]], C.kK, LW);

  // ------------------------------------------------------------ minare
  const M = SAHNE.minareParcalari();
  const mc = 300;
  /** Silindir gölgesi: sol kenardan (u=-1) u=-0.28'e kadar tek ton. */
  function silindirGolge(x1, x2, y1, y2, renk) {
    const c = (x1 + x2) / 2, r = (x2 - x1) / 2;
    ctx.fillStyle = renk;
    ctx.fillRect(x1, y1, c - r * 0.28 - x1, y2 - y1);
  }
  for (const p of M) {
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]), ys = p.noktalar.map((q) => q[1]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
      const d = SAHNE.yol(p.noktalar, true);
      if (p.ad.startsWith('çıkma')) {
        dolKontur(d, C.tasG, C.kK);
        // çıkmanın altındaki ince yivler
        for (let k = 1; k < 4; k++) {
          const t = k / 4;
          cizgi([[x1 + (x2 - x1) * 0.0 + (p.noktalar[0][0] - x1) * t, y1 + (y2 - y1) * t], [x2 - (x2 - p.noktalar[3][0]) * t, y1 + (y2 - y1) * t]], 'rgba(90,61,42,0.5)', LI);
        }
        continue;
      }
      ctx.fillStyle = C.tas; ctx.fill(P(d));
      kirp(d, () => silindirGolge(x1, x2, y1, y2, C.tasG));
      dolKontur(d, null, C.kK);
      if (p.ad.startsWith('şerefe')) cizgi([[x1 + 2, y1 + 3.5], [x2 - 2, y1 + 3.5]], 'rgba(90,61,42,0.55)', LI);
      if (p.ad === 'gövde-alt') {
        // taş sıraları
        for (let y = 600; y < 800; y += 26) cizgi([[x1 + 1, y], [x2 - 1, y]], 'rgba(90,61,42,0.28)', LI);
      }
    } else if (p.tip === 'bant') {
      // zikzak bant: iki ince çerçeve çizgisi ve üç zikzak
      cizgi([[p.x1, p.y1], [p.x2, p.y1]], C.kK, LI);
      cizgi([[p.x1, p.y2], [p.x2, p.y2]], C.kK, LI);
      for (const z of SAHNE.zikzakCizgileri()) cizgi(z, C.kK, 1.1);
    } else if (p.tip === 'korkuluk') {
      const d = dikd(p.x1, p.y1, p.x2, p.y2);
      ctx.fillStyle = C.tas; ctx.fill(P(d));
      kirp(d, () => silindirGolge(p.x1, p.x2, p.y1, p.y2, C.tasG));
      // korkuluk babaları: ince dikey çiftler
      const adet = 11;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / adet;
        ctx.fillStyle = 'rgba(94,142,134,0.55)';
        ctx.fillRect(x - 1.6, p.y1 + 4, 3.2, p.y2 - p.y1 - 7);
        cizgi([[x - 1.6, p.y1 + 4], [x - 1.6, p.y2 - 3]], C.kK, 0.6);
        cizgi([[x + 1.6, p.y1 + 4], [x + 1.6, p.y2 - 3]], C.kK, 0.6);
      }
      cizgi([[p.x1, p.y1 + 4], [p.x2, p.y1 + 4]], C.kK, LI);
      dolKontur(d, null, C.kK);
    } else if (p.tip === 'topuz') {
      ctx.fillStyle = C.tas; ctx.fill(P(p.yol));
      kirp(p.yol, () => { ctx.fillStyle = C.tasG; ctx.fill(P(`M${mc - 40},210 L${mc - 40},140 L${mc - 3},140 C${mc - 10},160 ${mc - 12},185 ${mc - 7},210 Z`)); });
      dolKontur(p.yol, null, C.kK);
      cizgi([[mc - 14, 168], [mc + 14, 168]], 'rgba(90,61,42,0.45)', LI);
    }
  }
  // minare pencereleri
  for (const d of Y.minarePencereleri) dolKontur(d, C.tasPen, C.kK, LW * 0.9);

  // ------------------------------------------------------------ alem
  function alem(a, olcek) {
    const ys = [
      SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
      dikd(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2),
    ];
    const lw = LW * Math.max(0.7, olcek);
    dolKontur(ys[1], C.altin, C.kA, lw * 0.8);
    for (const k of a.kureler) {
      const d = SAHNE.daireYolu(k.cx, k.cy, k.r);
      ctx.fillStyle = C.altin; ctx.fill(P(d));
      kirp(d, () => { ctx.fillStyle = C.altinG; ctx.beginPath(); ctx.arc(k.cx - k.r * 0.45, k.cy + k.r * 0.3, k.r * 0.95, 0, Math.PI * 2); ctx.fill(); });
      dolKontur(d, null, C.kA, lw);
    }
    ctx.fillStyle = C.altin; ctx.fill(P(ys[0]));
    kirp(ys[0], () => { ctx.fillStyle = C.altinG; ctx.fillRect(a.yaka.cx - a.yaka.rx, a.yaka.cy, a.yaka.rx * 2, a.yaka.ry); });
    dolKontur(ys[0], null, C.kA, lw);
    const h = SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R);
    ctx.fillStyle = C.altin; ctx.fill(P(h));
    kirp(h, () => { ctx.fillStyle = C.altinG; ctx.fillRect(a.hilal.cx - a.hilal.R * 1.2, a.hilal.cy - a.hilal.R, a.hilal.R * 0.75, a.hilal.R * 2.2); });
    dolKontur(h, null, C.kA, lw);
  }
  alem(SAHNE.alemParcalari(mc, 146, 0.62), 0.62);

  // ------------------------------------------------------------ kaide
  const K = SAHNE.kaide;
  ctx.fillStyle = C.tas; ctx.fill(P(Y.kaide));
  kirp(Y.kaide, () => {
    // kornişin düşürdüğü ince gölge şeridi
    ctx.fillStyle = C.tasG;
    ctx.fillRect(K.x1, K.y1, K.x2 - K.x1, 9);
    // sol uçta dar gölge yüzü
    ctx.fillRect(K.x1, K.y1, 16, K.y2 - K.y1);
  });
  // taş derzleri: ince, açık kahve
  kirp(Y.kaide, () => {
    const sira = [704, 728, 752, 776, 800];
    for (let i = 1; i < sira.length - 1; i++) cizgi([[K.x1, sira[i]], [K.x2, sira[i]]], 'rgba(90,61,42,0.26)', LI);
    for (let i = 0; i < sira.length - 1; i++) {
      const kay = i % 2 ? 0 : 26;
      for (let x = K.x1 + 16 + kay; x < K.x2; x += 52) cizgi([[x, sira[i] + (i ? 0 : 9)], [x, sira[i + 1]]], 'rgba(90,61,42,0.22)', LI);
    }
  });
  dolKontur(Y.kaide, null, C.kK);
  cizgi([[K.x1 + 16, K.y1 + 9], [K.x1 + 16, K.y2]], 'rgba(90,61,42,0.55)', LI);
  dolKontur(Y.kornis, C.tas, C.kK);
  cizgi([[K.kornis.x1, K.kornis.y1 + 4], [K.kornis.x2, K.kornis.y1 + 4]], 'rgba(90,61,42,0.5)', LI);
  for (const p of K.pencereler) {
    // pencere: düz renk, ince çerçeve (iki çizgi), denizlik
    const dis = SAHNE.kemerYolu(p.x, p.y - 4, p.w + 10, p.h + 6);
    dolKontur(dis, C.tas, 'rgba(90,61,42,0.7)', LI);
    const d = SAHNE.kemerYolu(p.x, p.y, p.w, p.h);
    ctx.fillStyle = C.tasPen; ctx.fill(P(d));
    kirp(d, () => { ctx.fillStyle = C.tasPenG; ctx.fillRect(p.x - p.w / 2, p.y, p.w * 0.38, p.h); });
    dolKontur(d, null, C.kK);
    dolKontur(dikd(p.x - p.w / 2 - 8, p.y + p.h, p.x + p.w / 2 + 8, p.y + p.h + 4), C.tasG, C.kK, LI);
  }

  // ------------------------------------------------------------ kasnak
  for (let k = 1; k >= 0; k--) {
    const q = SAHNE.kasnak[k];
    const d = dikd(q.x1, q.y1, q.x2, q.y2);
    const cx = (q.x1 + q.x2) / 2, R = (q.x2 - q.x1) / 2;
    ctx.fillStyle = C.kasnak; ctx.fill(P(d));
    kirp(d, () => {
      ctx.fillStyle = C.kasnakG;
      ctx.fillRect(q.x1, q.y1, cx - R * 0.3 - q.x1, q.y2 - q.y1);
    });
    // üst ve alt silmeler
    cizgi([[q.x1, q.y1 + 5], [q.x2, q.y1 + 5]], 'rgba(31,70,52,0.7)', LI);
    cizgi([[q.x1, q.y2 - 5], [q.x2, q.y2 - 5]], 'rgba(31,70,52,0.7)', LI);
    for (const w of SAHNE.kasnakPencereleri(k)) {
      const pd = SAHNE.kemerYolu(w.x, w.y, w.w, w.h);
      dolKontur(SAHNE.kemerYolu(w.x, w.y - 3, w.w + 5 * Math.cos(w.aci), w.h + 3), null, 'rgba(31,70,52,0.55)', LI * 0.9);
      dolKontur(pd, C.pen, C.kY, LI * 1.2);
    }
    dolKontur(d, null, C.kY);
  }

  // ------------------------------------------------------------ kubbe
  const prof = SAHNE.kubbeProfili(60);
  ctx.fillStyle = C.kubbe; ctx.fill(P(Y.kubbe));
  // tek gölge tonu: sol kenar ile u=-0.32 meridyeni arasında
  const gol = prof.map((q) => [560 - q.r, q.y]).concat(prof.slice().reverse().map((q) => [560 - q.r * 0.32, q.y]));
  dolKontur(SAHNE.yol(gol, true), C.kubbeG, null);
  // kaburgalar: her biri ince çift çizgi (yükseltilmiş şerit)
  kirp(Y.kubbe, () => {
    for (const kb of SAHNE.kaburgalar(16, 60)) {
      const c = Math.cos(kb.boylam);
      const ac = 1.6 * c + 0.3;
      cizgi(kb.noktalar.map(([x, y], i) => [x - ac * (prof[i].r / 200), y]), 'rgba(24,62,42,0.8)', LI);
      cizgi(kb.noktalar.map(([x, y], i) => [x + ac * (prof[i].r / 200), y]), 'rgba(24,62,42,0.45)', LI * 0.8);
    }
  });
  dolKontur(Y.kubbe, null, C.kY);
  // kubbe tabanında ince silme
  dolKontur(dikd(356, 549, 764, 557), C.kasnak, C.kY, LI);
  alem(SAHNE.alemParcalari(560, 300, 1), 1);

  // ------------------------------------------------------------ bitkiler
  const L = { x: 0.6, y: -0.8 }; // ışık yönü
  function serit(pts, w0, w1) {
    const sol = [], sag = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1;
      const w = (w0 + (w1 - w0) * (i / (pts.length - 1))) / 2;
      sol.push([pts[i][0] - (dy / n) * w, pts[i][1] + (dx / n) * w]);
      sag.push([pts[i][0] + (dy / n) * w, pts[i][1] - (dx / n) * w]);
    }
    return SAHNE.yol(sol.concat(sag.reverse()), true);
  }
  function yaprak(y, buyuk) {
    const d = SAHNE.yaprakYolu(y);
    const ana = buyuk ? C.yaprakK : C.yaprak;
    const gol = buyuk ? C.yaprakKG : C.yaprakG;
    ctx.fillStyle = ana; ctx.fill(P(d));
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const nx = -sa, ny = ca; // v>0 yönü
    const isikli = nx * L.x + ny * L.y > 0 ? 1 : -1; // ışıklı taraf
    const s = -isikli;
    const W = y.uzunluk;
    const q = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    kirp(d, () => {
      ctx.fillStyle = gol;
      ctx.fill(P(SAHNE.yol([q(-2, 0), q(W + 2, 0), q(W + 2, s * W), q(-2, s * W)], true)));
    });
    dolKontur(d, null, C.kY, LW * (buyuk ? 1 : 0.85));
    // damarlar
    const [a, b] = SAHNE.yaprakDamari(y);
    cizgi([a, b], 'rgba(31,70,52,0.75)', LI);
    const gen = W * y.genislik;
    for (let k = 1; k <= 4; k++) {
      const t = 0.16 + k * 0.16;
      for (const yon of [-1, 1]) {
        const p0 = q(W * t, 0), p1 = q(W * (t + 0.13), yon * gen * 0.22), p2 = q(W * (t + 0.2), yon * gen * 0.3 * (1 - t * 0.6));
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
        ctx.strokeStyle = 'rgba(31,70,52,0.5)'; ctx.lineWidth = LI * 0.75; ctx.stroke();
      }
    }
  }
  function tomurcuk(t) {
    const d = SAHNE.tomurcukYolu(t);
    ctx.fillStyle = C.tomurcuk; ctx.fill(P(d));
    kirp(d, () => {
      ctx.fillStyle = C.tomurcukG;
      ctx.beginPath(); ctx.arc(t.x - t.r * 0.7, t.y + t.r * 0.2, t.r * 1.1, 0, Math.PI * 2); ctx.fill();
    });
    dolKontur(d, null, C.kC, LI * 1.3);
    // çanak yapraklar
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    for (const yon of [-1, 1]) {
      const yp = { x: t.x - ca * t.r * 0.7, y: t.y - sa * t.r * 0.7, uzunluk: t.r * 1.5, genislik: 0.42, aci: t.aci + yon * 0.55 };
      dolKontur(SAHNE.yaprakYolu(yp), C.yaprak, C.kY, LI * 1.1);
    }
  }
  function cicek(c) {
    const ty = SAHNE.tacYapraklari(c);
    // taç yaprakları sırayla: düz beyaz, içte tek pembe gölge tonu, ince kontur
    for (const e of ty) {
      const d = P(SAHNE.elipsYolu(e));
      ctx.fillStyle = C.cicek; ctx.fill(d);
      kirp(d, () => {
        // tek gölge tonu: ışığa ters kenarda hilal + iç çanakta yumuşak pembe
        ctx.fillStyle = C.cicekG;
        ctx.fill(d);
        const k = Math.max(2.6, c.r * 0.17);
        ctx.fillStyle = C.cicek;
        ctx.fill(P(SAHNE.elipsYolu({ ...e, cx: e.cx + L.x * k, cy: e.cy + L.y * k })));
        ctx.fillStyle = C.cicekG;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.34, 0, Math.PI * 2); ctx.fill();
      });
      dolKontur(d, null, C.kC, LW * Math.min(1, 0.55 + c.r / 70));
      // ortadan uca iki ince kıvrım çizgisi
      const a = e.aci;
      for (const s of [-0.18, 0.2]) {
        const r0 = c.r * 0.3, r1 = c.r * (0.72 + Math.abs(s));
        cizgi([[c.x + Math.cos(a + s * 0.8) * r0, c.y + Math.sin(a + s * 0.8) * r0], [c.x + Math.cos(a + s) * r1, c.y + Math.sin(a + s) * r1]], 'rgba(62,74,46,0.35)', LI * 0.75);
      }
    }
    // erkek organlar: ince çizgi + nokta
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + c.aci;
      const r1 = c.r * 0.17, r2 = c.r * (0.3 + (i % 2) * 0.05);
      cizgi([[c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1], [c.x + Math.cos(a) * r2, c.y + Math.sin(a) * r2]], 'rgba(110,74,30,0.8)', LI * 0.75);
      ctx.fillStyle = C.ortaG;
      ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * r2, c.y + Math.sin(a) * r2, Math.max(1.1, c.r * 0.03), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.kA; ctx.lineWidth = 0.5; ctx.stroke();
    }
    const od = SAHNE.daireYolu(c.x, c.y, c.r * 0.16);
    ctx.fillStyle = C.orta; ctx.fill(P(od));
    kirp(od, () => { ctx.fillStyle = C.ortaG; ctx.beginPath(); ctx.arc(c.x - c.r * 0.08, c.y + c.r * 0.06, c.r * 0.15, 0, Math.PI * 2); ctx.fill(); });
    dolKontur(od, null, C.kA, LI);
  }

  // saplar
  for (const s of B.saplar) dolKontur(serit(s, 6, 3.2), C.sap, C.kY, LI * 1.2);
  // yapraklar: arkadakiler önce
  const yaps = B.yapraklar.slice().sort((a, b) => a.y - b.y);
  for (const y of yaps) yaprak(y, y.uzunluk > 50);
  for (const t of B.tomurcuklar) tomurcuk(t);
  const cs = B.cicekler.slice().sort((a, b) => a.r - b.r);
  for (const c of cs) cicek(c);

  SAHNE.hazir();
</script>
