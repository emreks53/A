<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-176 Elle Boyanmış Kâğıt Kolaj — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f4ecdc; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-176 Elle Boyanmış Kâğıt Kolaj — hayalî bir kolaj ressamının eli: önce kendi kâğıtlarını boyar (geniş
// fırça darbeleri, ıslak boyaya tarak izleri, sünger ve fırça ucuyla benekler), sonra bu kâğıtları makasla
// titizce keser ve üst üste yapıştırır. Her biçimin içinde boyanın kendi dokusu, kenarı keskin makas kesimi,
// altında ince gölge. Yöntem: her "boyalı kâğıt" ekran dışı bir tuvale fırça/tarak/benek ilkelleriyle
// sarmal (dikişsiz) olarak boyanır; parçalar el titremeli makas yollarıyla bu kâğıtların deseniyle doldurulup
// ince gölgeyle ana tuvale yapıştırılır.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const S = SAHNE;
  const OL = 2, W2 = 1024 * OL;
  const PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const P = (d) => new Path2D(d);
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];

  /** Tohumlu değer gürültüsü: n(x, y) → 0..1 */
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const Pm = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { Pm[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = Pm[i]; Pm[i] = Pm[j]; Pm[j] = t; }
    for (let i = 0; i < 256; i++) Pm[i + 256] = Pm[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[Pm[Pm[X] + Y]], b = G[Pm[Pm[X + 1] + Y]], c = G[Pm[Pm[X] + Y + 1]], d = G[Pm[Pm[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const fbm = (n, x, y, o) => {
    o = o || 4;
    let s = 0, a = 0.5, f = 1, t = 0;
    for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); t += a; a *= 0.5; f *= 2.03; }
    return s / t;
  };

  // SVG yolu örnekleme (ölçüm için gizli svg öğesi)
  const _svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  _svg.setAttribute('style', 'position:absolute;left:0;top:0;width:0;height:0;overflow:hidden');
  const _olcu = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  _svg.appendChild(_olcu);
  document.body.appendChild(_svg);
  /** SVG yolunu alt yollarına ayırıp her birini ~adim aralıkla örnekler → [[x,y]...][] */
  function ornekle(d, adim) {
    const out = [];
    for (const parca of d.trim().split(/(?=M)/)) {
      if (!parca.trim()) continue;
      _olcu.setAttribute('d', parca);
      const L = _olcu.getTotalLength();
      const n = Math.max(10, Math.round(L / adim));
      const pts = [];
      for (let i = 0; i < n; i++) { const p = _olcu.getPointAtLength((L * i) / n); pts.push([p.x, p.y]); }
      out.push(pts);
    }
    return out;
  }
  /** Çokgeni ~adim aralıkla yoğunlaştırır (köşeler korunur). */
  function yogunlastir(pts, adim, acik) {
    const out = [];
    const N = acik ? pts.length - 1 : pts.length;
    for (let i = 0; i < N; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(1, Math.round(L / adim));
      for (let k = 0; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
    }
    if (acik) out.push(pts[pts.length - 1]);
    return out;
  }
  /**
   * Kapalı nokta dizisini normali boyunca, yay uzunluğuna bağlı periyodik gürültüyle oynatır (el kesimi / yırtık).
   * o: {genlik, dalga, ince, inceDalga, tohum}
   */
  function titret(pts, o) {
    const N = pts.length;
    const n = gurultu(o.tohum || 1);
    let L = 0;
    const s = [0];
    for (let i = 1; i <= N; i++) { const a = pts[i - 1], b = pts[i % N]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); s.push(L); }
    const out = [];
    const R1 = L / (PI2 * (o.dalga || 40));
    const R2 = L / (PI2 * (o.inceDalga || 6));
    for (let i = 0; i < N; i++) {
      const p = pts[i], a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const l = Math.hypot(nx, ny) || 1;
      nx /= l; ny /= l;
      const t = (s[i] / L) * PI2;
      let off = (n(50 + R1 * Math.cos(t), 50 + R1 * Math.sin(t)) - 0.5) * 2 * (o.genlik || 0);
      if (o.ince) off += (n(150 + R2 * Math.cos(t), 150 + R2 * Math.sin(t)) - 0.5) * 2 * o.ince;
      out.push([p[0] + nx * off, p[1] + ny * off]);
    }
    return out;
  }
  /** Nokta dizilerinden Path2D. */
  function yolu(liste, acik) {
    const p = new Path2D();
    for (const pts of liste) {
      pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      if (!acik) p.closePath();
    }
    return p;
  }
  /** Nokta dizisini hep aynı dönüş yönüne çevirir (nonzero birleşimlerde örtüşen alt yollar delik açmasın). */
  function yonlu(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return a < 0 ? pts.slice().reverse() : pts;
  }
  /** SVG yolu → el titremeli Path2D */
  function elYolu(d, o) {
    o = o || {};
    let t = 0;
    return yolu(ornekle(d, o.adim || 2).map((pts) => yonlu(titret(pts, Object.assign({}, o, { tohum: (o.tohum || 1) + 31 * t++ })))));
  }
  function polyEl(pts, o) {
    o = o || {};
    return yolu([yonlu(titret(yogunlastir(pts, o.adim || 2), o))]);
  }
  const dikYol = (x1, y1, x2, y2) => S.yol(dikd(x1, y1, x2, y2), true);

  /** hex → [r,g,b] */
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; }
  function karisim(h1, h2, t) {
    const a = rgb(h1), b = rgb(h2);
    return '#' + a.map((v, i) => Math.round(mix(v, b[i], t)).toString(16).padStart(2, '0')).join('');
  }

  const ana = S.tuval(document.getElementById('tuval'), OL);
  ana.lineCap = 'round';
  ana.lineJoin = 'round';
  const R = S.rng(1760);

  // ------------------------------------------------------------ boyalı kâğıt üretimi
  /** w×h birimlik boyalı kâğıt (OL ölçekli tuval); boya(g, r, w, h) 1024 birimiyle boyar. */
  function kagit(w, h, tohum, boya) {
    const c = S.yeniTuval(Math.round(w * OL), Math.round(h * OL));
    const g = c.getContext('2d');
    g.setTransform(OL, 0, 0, OL, 0, 0);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g._w = w; g._h = h;
    boya(g, S.rng(tohum), w, h);
    return c;
  }
  /** Sarmal çizim: kâğıt döşenince dikiş görünmesin diye kenara taşan izler karşı kenarda tekrarlanır. */
  function sar(g, x, y, rad, fn) {
    const w = g._w, h = g._h;
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) {
      if (x + dx < -rad || x + dx > w + rad || y + dy < -rad || y + dy > h + rad) continue;
      fn(x + dx, y + dy);
    }
  }
  /** Tek fırça darbesi: omurga boyunca kıl kıl ince çizgiler. */
  function firca(g, r, x, y, aci, L, w, renk, alfa, o) {
    o = o || {};
    const ca = Math.cos(aci), sa = Math.sin(aci);
    const bukum = (r() - 0.5) * (o.bukum === undefined ? 0.25 : o.bukum) * L;
    const n = Math.max(3, Math.round(w * (o.yogun || 0.8)));
    const kil = [];
    for (let k = 0; k < n; k++) kil.push([(k / (n - 1) - 0.5) * w, r() * L * 0.18, L * (0.78 + r() * 0.22), alfa * (0.3 + 0.7 * r()), (w / n) * (0.8 + r() * 1.4), (r() - 0.5) * w * 0.1]);
    sar(g, x, y, L + w, (X, Y) => {
      const pt = (u, v) => { const t = u / L; const b = bukum * 4 * t * (1 - t); return [X + u * ca - (v + b) * sa, Y + u * sa + (v + b) * ca]; };
      for (const [v, u0, u1, a, lw, j] of kil) {
        const p0 = pt(u0, v), p1 = pt((u0 + u1) / 2, v + j), p2 = pt(u1, v);
        g.strokeStyle = rgba(renk, a);
        g.lineWidth = lw;
        g.beginPath();
        g.moveTo(p0[0], p0[1]);
        g.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
        g.stroke();
      }
    });
  }
  /** Islak boyada tarak izi: yolFn(t) boyunca 'dis' diş, aralarında 'aralik'; ara ara kopar. */
  function tarak(g, r, yolFn, adim, dis, aralik, renk, alfa, kal, sirt, kopma) {
    const n = gurultu(Math.floor(r() * 1e6));
    const esik = kopma === undefined ? 0.2 : kopma;
    for (let k = 0; k < dis; k++) {
      const off = k * aralik + (r() - 0.5) * aralik * 0.2;
      const a = alfa * (0.6 + 0.4 * r());
      const lw = kal * (0.75 + 0.5 * r());
      const katlar = sirt ? [[sirt, a * 0.45, lw * 0.6, lw * 0.85], [renk, a, lw, 0]] : [[renk, a, lw, 0]];
      for (const [rk, aa, gen, kay] of katlar) {
        g.strokeStyle = rgba(rk, aa);
        g.lineWidth = gen;
        g.beginPath();
        let acik = false;
        for (let i = 0; i <= adim; i++) {
          const t = i / adim;
          const p = yolFn(t), q = yolFn(Math.min(1, t + 0.5 / adim)), q0 = yolFn(Math.max(0, t - 0.5 / adim));
          let nx = -(q[1] - q0[1]), ny = q[0] - q0[0];
          const l = Math.hypot(nx, ny) || 1;
          nx /= l; ny /= l;
          const sap = off + kay + (n(t * 9, k * 3.1) - 0.5) * aralik * 0.35;
          const x = p[0] + nx * sap, y = p[1] + ny * sap;
          const kop = n(t * 23 + k * 0.7, k * 5.3 + 40) < esik;
          if (kop) { acik = false; continue; }
          if (!acik) { g.moveTo(x, y); acik = true; } else g.lineTo(x, y);
        }
        g.stroke();
      }
    }
  }
  /** Fırça ucu / sünger beneği kümesi. */
  function benek(g, r, x, y, yar, adet, renk, alfa, boy) {
    const noktalar = [];
    for (let i = 0; i < adet; i++) {
      const a = r() * PI2, d = yar * Math.sqrt(r());
      const s = boy * (0.35 + r() * 0.9);
      noktalar.push([Math.cos(a) * d, Math.sin(a) * d, s, s * (0.55 + r() * 0.5), r() * 3, alfa * (0.5 + 0.5 * r())]);
    }
    sar(g, x, y, yar + boy * 2, (X, Y) => {
      for (const [dx, dy, s1, s2, an, a] of noktalar) {
        g.fillStyle = rgba(renk, a);
        g.beginPath();
        g.ellipse(X + dx, Y + dy, s1, s2, an, 0, PI2);
        g.fill();
      }
    });
  }
  /** Kâğıdın lifli dokusu (çok hafif). */
  function lif(g, r, w, h, adet, alfa) {
    for (let i = 0; i < adet; i++) {
      const x = r() * w, y = r() * h, a = r() * PI2, L = 4 + r() * 16;
      const acik = r() < 0.6;
      g.strokeStyle = acik ? `rgba(255,253,245,${alfa * (0.5 + r())})` : `rgba(70,50,30,${alfa * 0.5 * (0.5 + r())})`;
      g.lineWidth = 0.4 + r() * 0.6;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a + 0.6) * L * 0.5, y + Math.sin(a + 0.6) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L);
      g.stroke();
    }
  }
  const sec = (r, dizi) => dizi[Math.floor(r() * dizi.length)];

  /** Genel tarif: taban renk + fırça darbeleri (+ tarak + benek). */
  function boyaliKagit(tohum, t) {
    const w = t.w || 512, h = t.h || 512;
    return kagit(w, h, tohum, (g, r) => {
      g.fillStyle = t.taban;
      g.fillRect(0, 0, w, h);
      const yon = t.yon === undefined ? 0 : t.yon;
      const adet = Math.round((t.darbe || 260) * (w * h) / (512 * 512));
      for (let i = 0; i < adet; i++) {
        const L = (t.L || 70) * (0.6 + r() * 0.8), gen = (t.gen || 14) * (0.6 + r() * 0.8);
        firca(g, r, r() * w, r() * h, yon + (r() - 0.5) * (t.sapma || 0.5), L, gen, sec(r, t.renkler), Math.min(0.85, (t.alfa || 0.3) * 1.3), { bukum: t.bukum });
      }
      if (t.tarak) {
        const T = t.tarak;
        for (let i = 0; i < T.adet; i++) {
          const x0 = r() * w, y0 = r() * h;
          const a = (T.yon === undefined ? yon : T.yon) + (r() - 0.5) * 0.3;
          const L = T.L * (0.7 + r() * 0.6), dalga = T.dalga || 0, faz = r() * 6;
          const fn = (s) => {
            const u = (s - 0.5) * L;
            const v = Math.sin(s * L / 40 + faz) * dalga;
            return [x0 + u * Math.cos(a) - v * Math.sin(a), y0 + u * Math.sin(a) + v * Math.cos(a)];
          };
          for (const [dx, dy] of [[0, 0], [w, 0], [-w, 0], [0, h], [0, -h]]) {
            const p0 = fn(0), p1 = fn(1);
            const minx = Math.min(p0[0], p1[0]) + dx, maxx = Math.max(p0[0], p1[0]) + dx, miny = Math.min(p0[1], p1[1]) + dy, maxy = Math.max(p0[1], p1[1]) + dy;
            if (maxx < -40 || minx > w + 40 || maxy < -40 || miny > h + 40) continue;
            tarak(g, r, (s) => { const p = fn(s); return [p[0] + dx, p[1] + dy]; }, Math.round(L / 3), T.dis, T.aralik, T.renk, Math.min(0.8, T.alfa * 1.35), T.kal || 1.2);
          }
        }
      }
      if (t.benek) {
        for (const B of t.benek) {
          const adet2 = Math.round(B.kume * (w * h) / (512 * 512));
          for (let i = 0; i < adet2; i++) benek(g, r, r() * w, r() * h, B.yar, B.adet, sec(r, B.renkler), B.alfa, B.boy);
        }
      }
      lif(g, r, w, h, Math.round(1400 * (w * h) / (512 * 512)), 0.05);
    });
  }

  // ------------------------------------------------------------ kâğıtlar
  const KAGIT = {};
  // gök: tek büyük kâğıt; turkuaz-seruleum akril, geniş fırçayla iki yönde çapraz sürülmüş sakin darbeler
  KAGIT.gok = kagit(1024, 1024, 11, (g, r) => {
    const lg = g.createLinearGradient(0, 0, 120, 800);
    lg.addColorStop(0, '#1F86BE');
    lg.addColorStop(0.45, '#45A9D2');
    lg.addColorStop(1, '#A6DCE6');
    g.fillStyle = lg;
    g.fillRect(0, 0, 1024, 1024);
    const rg = g.createRadialGradient(880, 140, 30, 880, 140, 560);
    rg.addColorStop(0, 'rgba(214,240,238,0.95)');
    rg.addColorStop(0.5, 'rgba(170,224,232,0.35)');
    rg.addColorStop(1, 'rgba(170,224,232,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 1024, 1024);
    const ton = (x, y) => {
      const d = Math.hypot(x - 880, y - 140);
      const yakin = clamp(1 - d / 760, 0, 1) * 0.7 + clamp(y / 820, 0, 1) * 0.5;
      return yakin > 0.62 ? sec(r, ['#C6EAEE', '#B3E2EA', '#D6F0F0', '#A6DAE6']) : yakin > 0.34 ? sec(r, ['#62B8DA', '#78C3DF', '#52AED6', '#86CBE2']) : sec(r, ['#2286BE', '#2E92C8', '#1E7CB6', '#3A9ACC', '#2A8AC2']);
    };
    // birinci kat: hafif yükselen, geniş ve uzun yassı fırça darbeleri
    for (let i = 0; i < 650; i++) {
      const x = r() * 1150 - 60, y = r() * 860 - 10;
      firca(g, r, x, y, -0.2 + (r() - 0.5) * 0.08, 170 + r() * 170, 28 + r() * 22, ton(x, y), 0.15, { bukum: 0.04, yogun: 0.6 });
    }
    // ikinci kat: karşı yönde, seyrek ve hafif (sakin bir çapraz doku)
    for (let i = 0; i < 220; i++) {
      const x = r() * 1150 - 60, y = r() * 860 - 10;
      firca(g, r, x, y, 0.3 + (r() - 0.5) * 0.08, 150 + r() * 140, 24 + r() * 18, ton(x, y), 0.09, { bukum: 0.04, yogun: 0.6 });
    }
    // fırça ucuyla seyrek açık benekler
    for (let i = 0; i < 120; i++) { const x = r() * 1024, y = r() * 800; benek(g, r, x, y, 14, 12, sec(r, ['#D8F1F2', '#BDE6EC']), 0.18, 1.4); }
    lif(g, r, 1024, 1024, 5000, 0.05);
  });
  KAGIT.hale = boyaliKagit(12, { taban: '#F8E58C', renkler: ['#FBF0B4', '#F5D466', '#FCEFA8', '#F2C55A'], darbe: 200, L: 60, gen: 12, sapma: 3.2, alfa: 0.4,
    benek: [{ kume: 160, yar: 7, adet: 10, renkler: ['#F0AE45', '#F6C760'], alfa: 0.45, boy: 0.9 }] });
  // güneş: limon sarısı kâğıt, merkezden dışa ışınsal fırça darbeleri ve beyaz-sarı benekler
  KAGIT.gunes = kagit(512, 512, 13, (g, r) => {
    const rg = g.createRadialGradient(256, 256, 4, 256, 256, 80);
    rg.addColorStop(0, '#FFF2A0');
    rg.addColorStop(0.55, '#FBE14E');
    rg.addColorStop(1, '#F5C931');
    g.fillStyle = rg;
    g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 300; i++) {
      const a = r() * PI2, d = 6 + r() * 70;
      firca(g, r, 256 + Math.cos(a) * d, 256 + Math.sin(a) * d, a + (r() - 0.5) * 0.2, 22 + r() * 26, 5 + r() * 6, sec(r, ['#FFF4AE', '#F6CF2E', '#FCE873', '#EFBE2A']), 0.4, { bukum: 0.15 });
    }
    for (let i = 0; i < 200; i++) benek(g, r, 256 + (r() - 0.5) * 170, 256 + (r() - 0.5) * 170, 6, 9, sec(r, ['#FFFBE0', '#E9B52A']), 0.45, 0.8);
    lif(g, r, 512, 512, 1200, 0.05);
  });
  // uzak tepeler: leylak-mavi akril, yatay uzun darbeler ve tarakla açılmış seyrek ince çizgiler
  KAGIT.ufuk = kagit(1024, 512, 39, (g, r) => {
    const lg = g.createLinearGradient(0, 0, 0, 300);
    lg.addColorStop(0, '#B7B9E2');
    lg.addColorStop(1, '#D3D3EE');
    g.fillStyle = lg;
    g.fillRect(0, 0, 1024, 512);
    for (let i = 0; i < 700; i++) firca(g, r, r() * 1024, r() * 512, (r() - 0.5) * 0.1, 80 + r() * 120, 8 + r() * 12, sec(r, ['#C3C4E8', '#A7A8D8', '#DCDBF2', '#B5B1E0', '#CBD3EE']), 0.42, { bukum: 0.05 });
    for (let y = 14; y < 512; y += 30 + r() * 10) tarak(g, r, (s) => [s * 1060 - 18, y + Math.sin(s * 9 + y) * 4], 360, 4, 4, '#E6E4F6', 0.4, 1.4);
    lif(g, r, 1024, 512, 3000, 0.05);

  }
  yapistir(kesP(dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), { genlik: 0.5 }), DESEN.beyaz, { gb: 4, ga: 0.34, gy: 3 });

  // ------------------------------------------------------------ 5. kasnak
  for (const k of [1, 0]) {
    const q = S.kasnak[k];
    const ay = q.x1 + (q.x2 - q.x1) * 0.66;
    yapistir(kesP(dikd(q.x1, q.y1, ay + 6, q.y2)), DESEN.kasnakKoyu, { gb: 5, ga: 0.32 });
    // sağdaki ışıklı kısım ayrı kâğıt: hafif eğri bir makas dikişiyle
    const pts = [[ay, q.y1], [q.x2, q.y1], [q.x2, q.y2], [ay - 4, q.y2]];
    yapistir(kesP(pts, { genlik: 0.6 }), DESEN.kasnakAcik, { gb: 3, ga: 0.3 });
    for (const p of S.kasnakPencereleri(k)) yapistir(kes(S.kemerYolu(p.x, p.y, p.w, p.h), { genlik: 0.3 }), DESEN.mor, { gb: 2, ga: 0.32, gx: -0.8, gy: 1.2 });
    // üst silme şeridi
    yapistir(kesP(dikd(q.x1 - 2, q.y1 - 1, q.x2 + 2, q.y1 + 4), { genlik: 0.4 }), DESEN.kubbe[3], { gb: 2, ga: 0.28 });
  }

  // ------------------------------------------------------------ 6. kubbe: koyu taban + ayrı ayrı kesilmiş 16 dilim
  yapistir(kes(S.kubbeYolu, { genlik: 0.5 }), DESEN.kubbeTaban, { gb: 7, ga: 0.34 });
  const prof = S.kubbeProfili(90);
  const N = 16;
  for (let k = 0; k < N; k++) {
    const b0 = -Math.PI / 2 + (Math.PI * k) / N, b1 = -Math.PI / 2 + (Math.PI * (k + 1)) / N;
    const u0 = Math.sin(b0), u1 = Math.sin(b1);
    const sol = [], sag = [];
    for (const q of prof) {
      const ara = 1.5 * Math.pow(q.r / 200, 0.8);
      const xl = 560 + u0 * q.r + (k === 0 ? 0 : ara), xr = 560 + u1 * q.r - (k === N - 1 ? 0 : ara);
      if (xr - xl < 0.5) break;
      sol.push([xl, q.y]);
      sag.push([xr, q.y]);
    }
    if (sol.length < 3) continue;
    const fm = (b0 + b1) / 2;
    const l = 0.5 + 0.5 * Math.sin(fm + 0.42);
    const tur = l < 0.28 ? 0 : l < 0.55 ? 1 : l < 0.8 ? 2 : 3;
    const um = Math.sin(fm);
    yapistir(kesP(sol.concat(sag.reverse()), { genlik: 0.45, dalga: 60 }), DESEN.kubbe[tur], { gb: 2.6, ga: 0.36, gx: -1, gy: 1.6, don: um * 18 });
  }
  yapistir(kes(S.daireYolu(560, 305, 8), { genlik: 0.2 }), DESEN.kubbe[2], { gb: 2 });
  alem(S.alemParcalari(560, 300, 1));

  // ------------------------------------------------------------ 7. zemin (kum kâğıdı)
  const zem = [];
  for (let x = -4; x <= 1028; x += 6) zem.push([x, 794 + 4 * Math.sin(x / 120 + 0.6) + 2 * Math.sin(x / 41)]);
  zem.push([1028, 1030], [-4, 1030]);
  yapistir(kesP(zem, { genlik: 0.8 }), DESEN.kum, { ox: 0, oy: 768, gb: 6, ga: 0.3, gy: -2, gx: -1 });
  const zem2 = [];
  for (let x = -4; x <= 1028; x += 6) zem2.push([x, 880 + 16 * Math.sin(x / 170 + 2.2) + 6 * Math.sin(x / 53)]);
  zem2.push([1028, 1030], [-4, 1030]);
  yapistir(kesP(zem2, { genlik: 0.8 }), DESEN.kum2, { ox: 0, oy: 500, gb: 7, ga: 0.28, gy: -2.5, gx: -1 });

  // ------------------------------------------------------------ 8. bitkiler
  const B = S.bitki;
  // saplar: ince kesilmiş yeşil şeritler
  for (const s of B.saplar) {
    const yol = new Path2D(S.yol(s));
    DESEN.yaprak[0].setTransform(new DOMMatrix().translate(R() * 512, R() * 512).scale(1 / OL));
    golge(yol, { ga: 0.3, gb: 3, gx: -1.2, gy: 1.8 }, 5);
    ana.strokeStyle = DESEN.yaprak[0];
    ana.lineWidth = 5;
    ana.stroke(yol);
  }
  /** Orta damar boyunca ikiye kesilmiş yaprak: iki yarı ayrı kâğıttan. */
  function yaprak(y, d1, d2) {
    const L = y.uzunluk, W = L * y.genislik;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const yari = (isaret) => {
      const pts = [];
      for (let i = 0; i <= 26; i++) {
        const t = i / 26;
        const hw = W * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * (1 - 0.18 * t);
        pts.push(p(L * t, isaret * hw));
      }
      for (let i = 26; i >= 0; i--) {
        const t = i / 26;
        pts.push(p(L * t, isaret * (0.7 + 0.4 * Math.sin(Math.PI * t))));
      }
      return pts;
    };
    const don = (y.aci * 180) / Math.PI;
    const tum = [];
    for (let i = 0; i <= 30; i++) { const t = i / 30; tum.push(p(L * t, W * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * (1 - 0.18 * t))); }
    for (let i = 29; i >= 1; i--) { const t = i / 30; tum.push(p(L * t, -W * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * (1 - 0.18 * t))); }
    yapistir(kesP(tum, { genlik: 0.4, dalga: 30 }), d1, { gb: 3.5, ga: 0.32, don });
    // açık yarı: orta damar boyunca kesilip üste yapıştırılmış ikinci kâğıt
    yapistir(kesP(yari(-1), { genlik: 0.3, dalga: 30 }), d2, { gb: 1.6, ga: 0.3, gx: -0.8, gy: 1.2, don });
  }
  const yanYaprak = B.yapraklar.slice(0, 36), onYaprak = B.yapraklar.slice(36);
  yanYaprak.forEach((y, i) => yaprak(y, DESEN.yaprak[i % 2 ? 3 : 1], DESEN.yaprak[i % 3 === 0 ? 2 : 0]));
  onYaprak.forEach((y, i) => yaprak(y, DESEN.yaprak[[1, 3, 1, 1, 3][i % 5]], DESEN.yaprak[[0, 2, 0, 2, 0][i % 5]]));
  // tomurcuklar: pembe kâğıt + yeşil çanak
  for (const t of B.tomurcuklar) {
    yapistir(kes(S.tomurcukYolu(t), { genlik: 0.25 }), DESEN.pembe, { gb: 2.5, ga: 0.3 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const q = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const r0 = t.r;
    yapistir(kesP([q(-r0 * 1.1, 0), q(-r0 * 0.2, -r0 * 0.95), q(r0 * 0.25, -r0 * 0.35), q(-r0 * 0.05, 0), q(r0 * 0.25, r0 * 0.35), q(-r0 * 0.2, r0 * 0.95)], { genlik: 0.2 }), DESEN.yaprak[1], { gb: 2, ga: 0.28 });
  }
  /** Taç yaprağı: dışta yuvarlak, merkeze doğru daralan, ucunda hafif çentik. */
  function tacYol(cc, a, olcek) {
    const L = cc.r * 1.02 * olcek, W = cc.r * 0.82 * olcek;
    const ca = Math.cos(a), sa = Math.sin(a);
    const pts = [];
    for (let i = 0; i < 90; i++) {
      const th = (i / 90) * PI2;
      let u = Math.cos(th), v = Math.sin(th);
      const ic = u < 0 ? 1 - 0.55 * u * u : 1;
      v *= ic;
      u = 0.5 + 0.5 * u - 0.07 * Math.exp(-Math.pow(th > Math.PI ? th - PI2 : th, 2) / 0.02);
      pts.push([cc.x + (u * L) * ca - (v * W * 0.5) * sa, cc.y + (u * L) * sa + (v * W * 0.5) * ca]);
    }
    return pts;
  }
  for (const cc of B.cicekler) {
    // arkadaki gölgeli taç katı (taç yaprakları arasından görünen lila ton) ve beyaz taç yaprakları
    const sira = [0, 2, 4, 1, 3];
    for (const i of sira) {
      const a = cc.aci + (i * PI2) / 5;
      yapistir(kesP(tacYol(cc, a, 1), { genlik: 0.35, dalga: 24 }), i % 2 ? DESEN.cicekGolge : DESEN.cicek, { gb: Math.max(2.5, cc.r * 0.09), ga: 0.3, gx: -1.4, gy: 2, don: (a * 180) / Math.PI });
    }
    // taç diplerinde pembe, beş loblu ince kâğıt; sarı benekli göbek; çevresinde küçük turuncu makas noktaları
    const lob = [];
    for (let i = 0; i < 200; i++) {
      const t = (i / 200) * PI2;
      const rr = cc.r * (0.27 + 0.07 * Math.pow(Math.abs(Math.cos((t - cc.aci) * 2.5)), 1.2));
      lob.push([cc.x + Math.cos(t) * rr, cc.y + Math.sin(t) * rr]);
    }
    yapistir(kesP(lob, { genlik: 0.2, dalga: 12 }), DESEN.halka, { gb: 1.6, ga: 0.22 });
    yapistir(kes(S.daireYolu(cc.x, cc.y, cc.r * 0.19), { genlik: 0.25, dalga: 10 }), DESEN.orta, { gb: 2, ga: 0.3 });
    const nk = cc.r > 40 ? 11 : 8;
    for (let i = 0; i < nk; i++) {
      const a = cc.aci + (i / nk) * PI2;
      yapistir(kes(S.daireYolu(cc.x + Math.cos(a) * cc.r * 0.27, cc.y + Math.sin(a) * cc.r * 0.27, Math.max(1.1, cc.r * 0.032)), { genlik: 0.05 }), DESEN.mercan, { gb: 1, ga: 0.25, gx: -0.5, gy: 0.7 });
    }
  }

  // ------------------------------------------------------------ 9. ışık: sağ üstten yumuşak gün ışığı, kâğıt lifi
  ana.save();
  ana.globalCompositeOperation = 'soft-light';
  const isik = ana.createRadialGradient(GX, GY, 40, GX, GY, 1300);
  isik.addColorStop(0, 'rgba(255,250,232,0.5)');
  isik.addColorStop(0.55, 'rgba(255,250,232,0.08)');
  isik.addColorStop(1, 'rgba(60,40,30,0.18)');
  ana.fillStyle = isik;
  ana.fillRect(0, 0, 1024, 1024);
  ana.restore();

  S.hazir();

})();
</script>
