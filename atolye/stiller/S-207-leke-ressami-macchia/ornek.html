<!doctype html>
<html lang="tr">

<meta charset="utf-8">
<title>S-207 Leke Ressamı (Macchia) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-207 Leke Ressamı (Macchia): kodla çizilmiş örnek görsel (hayalî bir ressamın eli).
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md. Bütün yardımcılar bu dosyanın içindedir.
// ===================================================================== j2 ortak çekirdek
// Ressamın eli için yardımcılar: gürültü, yol düzleştirme, fırça darbesi (kıl izleri, kuru uç,
// yükseklik haritası), bölge boyama, boya kabartısı ışığı, zemin dokusu ve el titremesi.
const S = SAHNE;
const K = {};
K.N = 2048; // iç çözünürlük
K.kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
K.karis = (a, b, t) => a + (b - a) * t;
K.yum = (e0, e1, x) => {
  const t = K.kenet((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
K.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
K.rk = (c, a) => `rgba(${K.kenet(c[0] | 0, 0, 255)},${K.kenet(c[1] | 0, 0, 255)},${K.kenet(c[2] | 0, 0, 255)},${a === undefined ? 1 : a})`;
K.rkar = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
K.kay = (c, d) => [c[0] + d, c[1] + d, c[2] + d];
/** Çok duraklı renk rampası: dur = [[t, [r,g,b]], ...] */
K.rampa = (dur) => (t) => {
  if (t <= dur[0][0]) return dur[0][1].slice();
  for (let i = 1; i < dur.length; i++) {
    if (t <= dur[i][0]) {
      const u = (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]);
      return K.rkar(dur[i - 1][1], dur[i][1], u);
    }
  }
  return dur[dur.length - 1][1].slice();
};

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
K.gurultu = function (tohum) {
  const r = S.rng(tohum);
  const P = new Uint16Array(512);
  const V = new Float32Array(256);
  const p = [];
  for (let i = 0; i < 256; i++) {
    p.push(i);
    V[i] = r();
  }
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = p[i];
    p[i] = p[j];
    p[j] = t;
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const n = (x, y) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = P[(xi & 255) + P[yi & 255]];
    const b = P[((xi + 1) & 255) + P[yi & 255]];
    const c = P[(xi & 255) + P[(yi + 1) & 255]];
    const d = P[((xi + 1) & 255) + P[(yi + 1) & 255]];
    return (V[a] * (1 - u) + V[b] * u) * (1 - v) + (V[c] * (1 - u) + V[d] * u) * v;
  };
  n.fbm = (x, y, o) => {
    o = o || 4;
    let s = 0;
    let a = 0.5;
    let t = 0;
    for (let i = 0; i < o; i++) {
      s += n(x, y) * a;
      t += a;
      x = x * 2.03 + 17.1;
      y = y * 2.03 + 9.7;
      a *= 0.5;
    }
    return s / t;
  };
  return n;
};

// --------------------------------------------------------------- SVG yolunu düzleştirme (M L C A Z)
K.duz = function (d, adim) {
  adim = adim || 2;
  const tok = d.match(/[MLCAZ]|-?\d*\.?\d+(?:e[-+]?\d+)?/g);
  const out = [];
  let cur = null;
  let i = 0;
  let x = 0;
  let y = 0;
  let cmd = 'M';
  const num = () => parseFloat(tok[i++]);
  while (i < tok.length) {
    if (/[MLCAZ]/.test(tok[i])) cmd = tok[i++];
    if (cmd === 'M') {
      x = num();
      y = num();
      cur = [[x, y]];
      out.push(cur);
      cmd = 'L';
    } else if (cmd === 'L') {
      x = num();
      y = num();
      cur.push([x, y]);
    } else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(3, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const t = k / n;
        const u = 1 - t;
        cur.push([u * u * u * x + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3]);
      }
      x = x3;
      y = y3;
    } else if (cmd === 'A') {
      const rx = num(), ry = num(), phi = (num() * Math.PI) / 180, fa = num(), fs = num(), x2 = num(), y2 = num();
      K.yay(x, y, rx, ry, phi, fa, fs, x2, y2, cur, adim);
      x = x2;
      y = y2;
    } else if (cmd === 'Z') {
      cmd = 'M';
      if (i < tok.length && !/[MLCAZ]/.test(tok[i])) i++;
    }
  }
  return out;
};
K.yay = function (x1, y1, rx, ry, phi, fa, fs, x2, y2, out, adim) {
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
  const x1p = cp * dx + sp * dy, y1p = -sp * dx + cp * dy;
  rx = Math.abs(rx);
  ry = Math.abs(ry);
  const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
  if (lam > 1) {
    const s = Math.sqrt(lam);
    rx *= s;
    ry *= s;
  }
  const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
  const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
  let co = Math.sqrt(Math.max(0, num / den));
  if (fa === fs) co = -co;
  const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
  const cx = cp * cxp - sp * cyp + (x1 + x2) / 2, cy = sp * cxp + cp * cyp + (y1 + y2) / 2;
  const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
  const t1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
  let dt = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
  if (!fs && dt > 0) dt -= 2 * Math.PI;
  else if (fs && dt < 0) dt += 2 * Math.PI;
  const n = Math.max(6, Math.ceil((Math.abs(dt) * Math.max(rx, ry)) / adim));
  for (let i = 1; i <= n; i++) {
    const t = t1 + (dt * i) / n;
    const ex = rx * Math.cos(t), ey = ry * Math.sin(t);
    out.push([cp * ex - sp * ey + cx, sp * ex + cp * ey + cy]);
  }
};
/** Çokgen(ler) → Path2D */
K.p2d = function (polys) {
  const p = new Path2D();
  for (const q of polys) {
    q.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    p.closePath();
  }
  return p;
};
K.dik = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** El çizgisiyle titreyen çokgen: noktalar arası sıklaştırılır, yerinden hafifçe oynatılır. */
K.elCokgen = function (poly, genlik, olcek, tohum, kapali) {
  const n = K.gurultu(tohum || 5);
  const yo = [];
  const m = poly.length;
  const son = kapali === false ? m - 1 : m;
  for (let i = 0; i < son; i++) {
    const a = poly[i], b = poly[(i + 1) % m];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const k = Math.max(1, Math.ceil(L / 4));
    for (let j = 0; j < k; j++) yo.push([a[0] + ((b[0] - a[0]) * j) / k, a[1] + ((b[1] - a[1]) * j) / k]);
  }
  if (kapali === false) yo.push(poly[m - 1]);
  return yo.map(([x, y]) => [x + (n.fbm(x / olcek, y / olcek, 2) - 0.5) * 2 * genlik, y + (n.fbm(x / olcek + 31, y / olcek + 57, 2) - 0.5) * 2 * genlik]);
};

// --------------------------------------------------------------- tuvaller
K.tuval2 = function () {
  const c = S.yeniTuval(K.N, K.N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  return [c, x];
};
K.tuval1 = function () {
  const c = S.yeniTuval(1024, 1024);
  return [c, c.getContext('2d', { willReadFrequently: true })];
};
/** Path2D ya da çizim işlevinden 1024² maske (Uint8Array, 0/1). */
K.maske = function (yol, ek) {
  const [c, x] = K.tuval1();
  x.fillStyle = '#fff';
  if (typeof yol === 'function') yol(x);
  else x.fill(yol, ek || 'nonzero');
  const d = x.getImageData(0, 0, 1024, 1024).data;
  const m = new Uint8Array(1024 * 1024);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  m.ic = (px, py) => {
    const xi = px | 0, yi = py | 0;
    return xi >= 0 && yi >= 0 && xi < 1024 && yi < 1024 && m[yi * 1024 + xi] === 1;
  };
  return m;
};
/** 1024² tuvalden renk örnekleyici. */
K.ornek = function (tuval) {
  const W = tuval.width;
  const sc = W / 1024;
  const d = tuval.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, W).data;
  return (x, y) => {
    const xi = K.kenet(Math.round(x * sc), 0, W - 1), yi = K.kenet(Math.round(y * sc), 0, W - 1);
    const i = (yi * W + xi) * 4;
    return [d[i], d[i + 1], d[i + 2]];
  };
};

// --------------------------------------------------------------- fırça darbesi
/**
 * pts: orta çizgi; o: {w, renk, a, kil, kilA, jit, kuru, bas, son, uc, dalga, r, h, hv, ha, sirt, oluk, dolgu}
 *  kil: kıl izi sayısı; kuru: uçta kıl kopması (0..1); bas/son: baş ve son incelme payı; uc: uçtaki en oranı
 *  h: yükseklik bağlamı (boya kalınlığı), hv: kalınlık (0..1), sirt: kenar sırtı, oluk: kıl oluğu derinliği
 */
K.firca = function (c, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const R = o.r;
  const L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[n - 1] || 1;
  const nx = new Array(n), ny = new Array(n), wa = new Array(n);
  const bas = o.bas === undefined ? 0.12 : o.bas;
  const son = o.son === undefined ? 0.3 : o.son;
  const uc = o.uc === undefined ? 0.35 : o.uc;
  const dal = o.dalga || 0;
  const ph = R() * 6.28;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / m;
    ny[i] = dx / m;
    const t = L[i] / tot;
    let p = 1;
    if (bas > 0 && t < bas) p = 0.5 + 0.5 * Math.sqrt(t / bas);
    if (son > 0 && t > 1 - son) p *= uc + (1 - uc) * Math.sqrt((1 - t) / son);
    if (dal) p *= 1 + dal * Math.sin(ph + t * 5.5);
    wa[i] = o.w * p;
  }
  const kenar = (path) => {
    path.beginPath();
    for (let i = 0; i < n; i++) path.lineTo(pts[i][0] + (nx[i] * wa[i]) / 2, pts[i][1] + (ny[i] * wa[i]) / 2);
    for (let i = n - 1; i >= 0; i--) path.lineTo(pts[i][0] - (nx[i] * wa[i]) / 2, pts[i][1] - (ny[i] * wa[i]) / 2);
    path.closePath();
  };
  const a = o.a === undefined ? 1 : o.a;
  if (o.dolgu !== false) {
    kenar(c);
    c.fillStyle = K.rk(o.renk, a);
    c.fill();
  }
  const k = o.kil || 0;
  const kilYol = [];
  if (k > 0) {
    c.lineCap = 'round';
    const jit = o.jit === undefined ? 10 : o.jit;
    const kilA = o.kilA === undefined ? 0.5 : o.kilA;
    const kuru = o.kuru || 0;
    for (let b = 0; b < k; b++) {
      const v = ((b + 0.5) / k - 0.5) * 0.9 + ((R() - 0.5) * 0.25) / k;
      const d = (R() - 0.5) * 2 * jit;
      const col = [o.renk[0] + d + (R() - 0.5) * jit * 0.3, o.renk[1] + d + (R() - 0.5) * jit * 0.3, o.renk[2] + d + (R() - 0.5) * jit * 0.3];
      const t0 = R() * 0.08;
      const t1 = 1 - kuru * Math.pow(R(), 1.5) * 0.7 - R() * 0.05;
      c.beginPath();
      let ilk = true;
      const yol = [];
      for (let i = 0; i < n; i++) {
        const t = L[i] / tot;
        if (t < t0 || t > t1) continue;
        const X = pts[i][0] + nx[i] * v * wa[i], Y = pts[i][1] + ny[i] * v * wa[i];
        yol.push([X, Y]);
        if (ilk) {
          c.moveTo(X, Y);
          ilk = false;
        } else c.lineTo(X, Y);
      }
      const lw = Math.max(0.35, (o.w / k) * (0.45 + R() * 0.6));
      c.lineWidth = lw;
      c.strokeStyle = K.rk(col, a * kilA);
      c.stroke();
      kilYol.push([yol, lw, d]);
    }
  }
  if (o.h) {
    const h = o.h;
    const hv = o.hv === undefined ? 0.5 : o.hv;
    if (o.dolgu !== false) {
      kenar(h);
      const g = Math.round(K.kenet(hv, 0, 1) * 255);
      h.fillStyle = `rgba(${g},${g},${g},${o.ha === undefined ? 0.9 : o.ha})`;
      h.fill();
      if (o.sirt) {
        const g2 = Math.round(K.kenet(hv + o.sirt, 0, 1) * 255);
        h.strokeStyle = `rgb(${g2},${g2},${g2})`;
        h.lineWidth = o.sirtEn || 1.2;
        h.stroke();
      }
    }
    const ol = o.oluk === undefined ? 0.12 : o.oluk;
    if (ol && kilYol.length) {
      h.lineCap = 'round';
      for (const [yol, lw, d] of kilYol) {
        if (yol.length < 2) continue;
        const g = Math.round(K.kenet(hv + (d > 0 ? ol : -ol), 0, 1) * 255);
        h.strokeStyle = `rgb(${g},${g},${g})`;
        h.lineWidth = lw * 0.8;
        h.beginPath();
        yol.forEach(([X, Y], i) => (i ? h.lineTo(X, Y) : h.moveTo(X, Y)));
        h.stroke();
      }
    }
  }
};

/** Yön alanını izleyen orta çizgi: (x,y) merkezli, boy uzunluğunda. */
K.cizgiKur = function (x, y, boy, yon, egri, adim) {
  adim = adim || Math.max(2, boy / 8);
  const yari = boy / 2;
  if (!egri) {
    const a = yon(x, y);
    const ca = Math.cos(a), sa = Math.sin(a);
    const m = Math.max(2, Math.ceil(boy / adim));
    const out = [];
    for (let i = 0; i <= m; i++) {
      const s = -yari + (boy * i) / m;
      out.push([x + ca * s, y + sa * s]);
    }
    return out;
  }
  const ileri = [], geri = [];
  let cx = x, cy = y;
  const m = Math.max(1, Math.ceil(yari / adim));
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx += Math.cos(a) * adim;
    cy += Math.sin(a) * adim;
    ileri.push([cx, cy]);
  }
  cx = x;
  cy = y;
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx -= Math.cos(a) * adim;
    cy -= Math.sin(a) * adim;
    geri.push([cx, cy]);
  }
  return geri.reverse().concat([[x, y]], ileri);
};

/**
 * Bölge boyama: titreşimli ızgaradan başlayan darbeler, renk örneklenir.
 * o: {kutu, aralik, maske, klip, boy:[a,b], en:[a,b], yon(x,y), renk(x,y,r), egri, a:[a,b], firca:{...}, h, tohum, karistir}
 */
K.bolgeBoya = function (c, o) {
  const r = S.rng(o.tohum || 1);
  const [x1, y1, x2, y2] = o.kutu;
  const s = o.aralik;
  const nok = [];
  for (let y = y1; y < y2; y += s) {
    for (let x = x1; x < x2; x += s) {
      const px = x + r() * s, py = y + r() * s;
      if (o.maske && !o.maske.ic(px, py)) continue;
      if (o.icinde && !o.icinde(px, py)) continue;
      nok.push([px, py, r()]);
    }
  }
  if (o.karistir !== false) nok.sort((p, q) => p[2] - q[2]);
  c.save();
  if (o.h) o.h.save();
  if (o.klip) {
    c.clip(o.klip);
    if (o.h) o.h.clip(o.klip);
  }
  const fo = o.firca || {};
  for (const [px, py] of nok) {
    const boy = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
    const w = o.en[0] + r() * (o.en[1] - o.en[0]);
    const pts = K.cizgiKur(px, py, boy, o.yon, o.egri, o.adim);
    const renk = o.renk(px, py, r);
    if (!renk) continue;
    const a = o.a ? o.a[0] + r() * (o.a[1] - o.a[0]) : 1;
    const hv = o.hv ? (typeof o.hv === 'function' ? o.hv(px, py, r) : o.hv[0] + r() * (o.hv[1] - o.hv[0])) : 0.5;
    K.firca(c, pts, Object.assign({}, fo, { w, renk, a, r, h: o.h, hv }));
  }
  if (o.h) o.h.restore();
  c.restore();
};

// --------------------------------------------------------------- boya kabartısı ışığı, zemin dokusu, titreme
/**
 * Yükseklik haritasından sağ üst ışıkla gölgeleme.
 * o: {guc, bulanik, parilti, parEsik, doku(x,y)->delta (iç piksel), dokuGuc}
 */
K.isikla = function (ctx, hc, o) {
  const N = K.N;
  const t = S.yeniTuval(N, N);
  const tx = t.getContext('2d', { willReadFrequently: true });
  tx.filter = `blur(${o.bulanik === undefined ? 1 : o.bulanik}px)`;
  tx.drawImage(hc, 0, 0);
  tx.filter = 'none';
  const H = tx.getImageData(0, 0, N, N).data;
  const im = ctx.getImageData(0, 0, N, N);
  const d = im.data;
  const g = o.guc === undefined ? 0.006 : o.guc;
  const par = o.parilti || 0;
  const pe = o.parEsik === undefined ? 0.12 : o.parEsik;
  const doku = o.doku;
  const W4 = N * 4;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = (y * N + x) * 4;
      const dx = H[i + 4] - H[i - 4];
      const dy = H[i + W4] - H[i - W4];
      // ışık sağ üstten: sağa yükselen yüzey karanlık, yukarı bakan yüzey aydınlık
      let s = (-dx * 0.7 + dy * 0.7) * g;
      if (doku) s += doku(x, y);
      let m = 1 + s;
      d[i] = d[i] * m;
      d[i + 1] = d[i + 1] * m;
      d[i + 2] = d[i + 2] * m;
      if (par && s > pe) {
        const p = (s - pe) * par * 255;
        d[i] += p;
        d[i + 1] += p;
        d[i + 2] += p * 0.95;
      }
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

/** Düzensiz tuval bezi dokusu (iç piksel koordinatı): ince keten, iplik kalınlığı değişken. */
K.bezDokusu = function (aralik, guc, tohum) {
  const n = K.gurultu(tohum || 11);
  const N = K.N;
  const sx = new Float32Array(N), sy = new Float32Array(N), kx = new Float32Array(N), ky = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    sx[i] = n(i / 23, 3.3) * 6.28;
    sy[i] = n(7.7, i / 23) * 6.28;
    kx[i] = 0.6 + n(i / 9, 13.1) * 0.8;
    ky[i] = 0.6 + n(21.4, i / 9) * 0.8;
  }
  const w = (2 * Math.PI) / aralik;
  return (x, y) => {
    const a = Math.sin(x * w + sy[y]) * kx[x];
    const b = Math.sin(y * w + sx[x]) * ky[y];
    const ust = ((Math.floor(x / aralik) + Math.floor(y / aralik)) & 1) === 0;
    return (ust ? a * 0.65 + b * 0.35 : b * 0.65 + a * 0.35) * guc;
  };
};

/** Düşük frekanslı yer değiştirme: el titremesi (iç piksel cinsinden genlik). */
K.titret = function (ctx, genlik, olcek, tohum) {
  const N = K.N;
  const im = ctx.getImageData(0, 0, N, N);
  const src = new Uint8ClampedArray(im.data);
  const d = im.data;
  const nz = K.gurultu(tohum || 99);
  const G = 128, gs = N / G;
  const DX = new Float32Array((G + 1) * (G + 1)), DY = new Float32Array((G + 1) * (G + 1));
  for (let j = 0; j <= G; j++)
    for (let i = 0; i <= G; i++) {
      DX[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek, (j * gs) / olcek, 3) - 0.5) * 2 * genlik;
      DY[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek + 50, (j * gs) / olcek + 70, 3) - 0.5) * 2 * genlik;
    }
  for (let y = 0; y < N; y++) {
    const gy = y / gs, j0 = Math.min(G - 1, Math.floor(gy)), fy = gy - j0;
    for (let x = 0; x < N; x++) {
      const gx = x / gs, i0 = Math.min(G - 1, Math.floor(gx)), fx = gx - i0;
      const a = j0 * (G + 1) + i0;
      const dx = (DX[a] * (1 - fx) + DX[a + 1] * fx) * (1 - fy) + (DX[a + G + 1] * (1 - fx) + DX[a + G + 2] * fx) * fy;
      const dy = (DY[a] * (1 - fx) + DY[a + 1] * fx) * (1 - fy) + (DY[a + G + 1] * (1 - fx) + DY[a + G + 2] * fx) * fy;
      let sx = x + dx, sy = y + dy;
      if (sx < 0) sx = 0;
      else if (sx > N - 1.001) sx = N - 1.001;
      if (sy < 0) sy = 0;
      else if (sy > N - 1.001) sy = N - 1.001;
      const xi = sx | 0, yi = sy | 0, ux = sx - xi, uy = sy - yi;
      const p = (yi * N + xi) * 4, q = p + N * 4;
      const o = (y * N + x) * 4;
      for (let c = 0; c < 3; c++) d[o + c] = (src[p + c] * (1 - ux) + src[p + 4 + c] * ux) * (1 - uy) + (src[q + c] * (1 - ux) + src[q + 4 + c] * ux) * uy;
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

// --------------------------------------------------------------- sahne geometrisi (çokgen olarak)
K.geo = function () {
  const G = {};
  G.kubbe = S.kubbeNoktalari(90);
  G.kubbeYol = K.p2d([G.kubbe]);
  // kubbe yarıçapı tablosu (y tamsayı)
  const pr = S.kubbeProfili(400);
  G.kr = new Float32Array(1024);
  for (let y = 0; y < 1024; y++) {
    if (y < 300 || y > 555) {
      G.kr[y] = 0;
      continue;
    }
    for (let i = 0; i < pr.length - 1; i++) {
      if (y <= pr[i].y && y >= pr[i + 1].y) {
        const t = (pr[i].y - y) / (pr[i].y - pr[i + 1].y || 1);
        G.kr[y] = pr[i].r + (pr[i + 1].r - pr[i].r) * t;
        break;
      }
    }
  }
  G.kubbeR = (y) => {
    if (y < 300 || y > 555) return 0;
    const yi = Math.floor(y), f = y - yi;
    return G.kr[yi] * (1 - f) + G.kr[Math.min(1023, yi + 1)] * f;
  };
  G.kaburga = S.kaburgalar(16, 80);
  G.kasnak = S.kasnak.map((k) => K.dik(k.x1, k.y1, k.x2, k.y2));
  G.kasnakPen = [0, 1].map((k) => S.kasnakPencereleri(k).map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p)));
  const KD = S.kaide;
  G.kaide = K.dik(KD.x1, KD.y1, KD.x2, KD.y2);
  G.kornis = K.dik(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2, KD.kornis.y2);
  G.kaidePen = KD.pencereler.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.minare = S.minareParcalari().map((p) => {
    const q = Object.assign({}, p);
    if (p.tip === 'poligon') q.poly = p.noktalar;
    else if (p.tip === 'bant' || p.tip === 'korkuluk') q.poly = K.dik(p.x1, p.y1, p.x2, p.y2);
    else if (p.tip === 'topuz') q.poly = K.duz(p.yol, 1)[0];
    return q;
  });
  G.minareGovde = G.minare.filter((p) => p.poly && p.tip !== 'bant');
  G.minareYol = K.p2d(G.minareGovde.map((p) => p.poly));
  G.minarePen = S.minarePencereleri.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.zikzak = S.zikzakCizgileri();
  G.alemK = S.alemParcalari(560, 300, 1);
  G.alemM = S.minareParcalari().find((p) => p.tip === 'alem').alem;
  G.hilal = (a) => K.duz(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.5)[0];
  G.binaYol = (() => {
    const p = new Path2D();
    p.addPath(G.kubbeYol);
    p.addPath(K.p2d(G.kasnak));
    p.addPath(K.p2d([G.kaide, G.kornis]));
    p.addPath(G.minareYol);
    return p;
  })();
  return G;
};

/** Kubbe yüzey normali (dönel yüzey + 16 dilim). Işık L için: {n:[x,yukarı,bakan], phi, k, f} */
K.kubbeNormal = function (G, x, y, oluk) {
  const r = G.kubbeR(y);
  if (r <= 0.5) return null;
  const u = (x - 560) / r;
  if (u < -1 || u > 1) return null;
  const phi = Math.asin(u);
  const r1 = G.kubbeR(Math.min(555, y + 1)), r0 = G.kubbeR(Math.max(300, y - 1));
  const drdy = (r1 - r0) / 2;
  const m = Math.sqrt(1 + drdy * drdy);
  const nr = 1 / m, nup = drdy / m;
  const dil = Math.PI / 16;
  const gk = (phi + Math.PI / 2) / dil;
  const k = Math.floor(gk), f = gk - k;
  const ph = phi + (f - 0.5) * (oluk === undefined ? 0.45 : oluk);
  return { n: [nr * Math.sin(ph), nup, nr * Math.cos(ph)], phi, k, f, u };
};
K.nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
K.birim = (v) => {
  const m = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / m, v[1] / m, v[2] / m];
};

/** Taç yaprağı: ters yumurta biçimi, uçta yuvarlak ve çok hafif çentikli. (cx,cy) dip, aci yönünde uzanır. */
K.tacYaprak = function (cx, cy, aci, boy, en, centik) {
  const ca = Math.cos(aci), sa = Math.sin(aci);
  const p = (u, v) => [cx + u * ca - v * sa, cy + u * sa + v * ca];
  const W = en / 2, L = boy, c = centik === undefined ? 0.04 : centik;
  const bz = (a, b, cc, d, t) => {
    const u = 1 - t;
    return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * cc + t * t * t * d;
  };
  const yan = [];
  const seg = [
    [[0, 0], [0.22 * L, 0.3 * W], [0.42 * L, 0.98 * W], [0.7 * L, W]],
    [[0.7 * L, W], [0.92 * L, 1.0 * W], [1.0 * L, 0.55 * W], [(1 - c) * L + c * L, 0.12 * W]],
  ];
  for (const [a, b, cc, d] of seg) for (let k = 1; k <= 14; k++) yan.push([bz(a[0], b[0], cc[0], d[0], k / 14), bz(a[1], b[1], cc[1], d[1], k / 14)]);
  const out = [p(0, 0)];
  for (const [u, v] of yan) out.push(p(u, v));
  out.push(p((1 - c) * L, 0));
  for (let k = yan.length - 1; k >= 0; k--) out.push(p(yan[k][0], -yan[k][1]));
  return out;
};
/** Altın küre: dolgu + gölge ve ışık hilalleri (ince fırça darbeleriyle). */
K.kure = function (c, cx, cy, r, ramp, R, h) {
  const pol = [];
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * 6.283;
    pol.push([cx + Math.cos(a) * r * (1 + (R() - 0.5) * 0.04), cy + Math.sin(a) * r * (1 + (R() - 0.5) * 0.04)]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(ramp(0.45));
  c.fill(yol);
  c.save();
  c.clip(yol);
  const yay = (a0, a1, q, w, renk, al) => {
    const pts = [];
    for (let k = 0; k <= 10; k++) {
      const a = a0 + ((a1 - a0) * k) / 10;
      pts.push([cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q]);
    }
    K.firca(c, pts, { w, renk, a: al, r: R, kil: 0, bas: 0.3, son: 0.35, uc: 0.2 });
  };
  yay(1.2, 3.6, 0.72, r * 0.62, ramp(0.12), 0.85); // sol alt gölge
  yay(2.2, 3.1, 0.95, r * 0.22, ramp(0.55), 0.6); // yansıyan ışık
  yay(-1.9, 0.3, 0.42, r * 0.55, ramp(0.85), 0.9); // sağ üst ışık
  c.restore();
  if (h) {
    h.fillStyle = 'rgb(150,150,150)';
    h.fill(yol);
  }
  return yol;
};

/**
 * Kümülüs bulut alanı: küre yığını yükseklik alanı (karnabahar biçimi), düz taban, gürültüyle bükülen kenar.
 * kutleler: [{x1,x2,taban,kuleler:[{x,ust,en}]}]; o: {tohum, bukum, isik:[x,yukarı,bakan]}
 * Döner: {e (kenar örtüsü 0..1), lit (0..1), aci (izohips teğeti), ag (yön ağırlığı)} — hepsi 1024².
 */
K.bulutAlani = function (kutleler, o) {
  o = o || {};
  const N = 1024;
  const r = S.rng(o.tohum || 31);
  const nz = K.gurultu((o.tohum || 31) + 7);
  const Hf = new Float32Array(N * N);
  const TB = new Float32Array(N * N);
  const UST = new Float32Array(N * N);
  const puf = [];
  for (const k of kutleler) {
    const enK = k.enKat || 1;
    k.ustMin = Math.min(...k.kuleler.map((q) => q.ust));
    for (let x = k.x1 + 16; x <= k.x2 - 10; x += 20 + r() * 14) puf.push({ x, y: k.taban - 14 - r() * 10, r: (20 + r() * 18) * enK, z: 0, k });
    for (const t of k.kuleler) {
      const H = k.taban - t.ust;
      const n = Math.max(2, Math.ceil(H / 17));
      for (let j = 0; j <= n; j++) {
        const f = j / n;
        const y = k.taban - 22 - f * (H - 22 - t.en * 0.24);
        const rr = t.en * (0.52 - 0.24 * f) * (0.7 + r() * 0.5);
        puf.push({ x: t.x + (r() - 0.5) * t.en * 0.5 * (1 - f * 0.5), y, r: rr, z: f * 12, k });
        const ns = 1 + Math.floor(r() * 3);
        for (let s = 0; s < ns; s++) {
          const yan = r() < 0.5 ? -1 : 1;
          puf.push({ x: t.x + yan * t.en * (0.28 + r() * 0.32), y: y + r() * 16 - 4, r: rr * (0.32 + r() * 0.36), z: f * 12 - 3, k });
        }
      }
    }
  }
  for (const p of puf) {
    const x0 = Math.max(0, Math.floor(p.x - p.r)), x1 = Math.min(N - 1, Math.ceil(p.x + p.r));
    const y0 = Math.max(0, Math.floor(p.y - p.r)), y1 = Math.min(N - 1, Math.ceil(Math.min(p.y + p.r, p.k.taban + 2)));
    const r2 = p.r * p.r;
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        const d2 = (x - p.x) * (x - p.x) + (y - p.y) * (y - p.y);
        if (d2 >= r2) continue;
        const hh = Math.sqrt(r2 - d2) + p.z + 1;
        const i = y * N + x;
        if (hh > Hf[i]) {
          Hf[i] = hh;
          TB[i] = p.k.taban;
          UST[i] = p.k.ustMin;
        }
      }
  }
  // yumuşatılmış yükseklik (küre dikişleri kaybolsun)
  const yum = (A, rad) => {
    const T = new Float32Array(N * N), O = new Float32Array(N * N);
    for (let y = 0; y < N; y++) {
      let s = 0;
      for (let x = -rad; x <= rad; x++) s += A[y * N + K.kenet(x, 0, N - 1)];
      for (let x = 0; x < N; x++) {
        T[y * N + x] = s / (2 * rad + 1);
        s += A[y * N + Math.min(N - 1, x + rad + 1)] - A[y * N + Math.max(0, x - rad)];
      }
    }
    for (let x = 0; x < N; x++) {
      let s = 0;
      for (let y = -rad; y <= rad; y++) s += T[K.kenet(y, 0, N - 1) * N + x];
      for (let y = 0; y < N; y++) {
        O[y * N + x] = s / (2 * rad + 1);
        s += T[Math.min(N - 1, y + rad + 1) * N + x] - T[Math.max(0, y - rad) * N + x];
      }
    }
    return O;
  };
  const Hs = yum(Hf, o.yumR || 3);
  const Hb = yum(Hf, 14);
  const L = K.birim(o.isik || [0.55, 0.62, 0.56]);
  const e = new Float32Array(N * N), lit = new Float32Array(N * N), aci = new Float32Array(N * N), ag = new Float32Array(N * N);
  const bk = o.bukum === undefined ? 9 : o.bukum;
  for (let y = 1; y < N - 1; y++)
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const wx = (nz.fbm(x / 34, y / 34, 3) - 0.5) * 2 * bk, wy = (nz.fbm(x / 34 + 40, y / 34 + 13, 3) - 0.5) * 2 * bk;
      const sx = K.kenet(Math.round(x + wx), 0, N - 1), sy = K.kenet(Math.round(y + wy), 0, N - 1);
      const j = sy * N + sx;
      const hv = Hs[j];
      e[i] = K.yum(0.5, 3.5, hv);
      if (hv > 0.05) {
        const zx0 = (Hs[j + 1] - Hs[j - 1]) / 2, zy0 = (Hs[j + N] - Hs[j - N]) / 2;
        const l0 = (-zx0 * L[0] + zy0 * L[1] + L[2]) / Math.sqrt(zx0 * zx0 + zy0 * zy0 + 1);
        if (o.kayip) e[i] = K.yum(0.5, 3.5 + o.kayip * K.kenet(0.6 - l0, 0, 1), hv);
        const zx = (Hs[j + 1] - Hs[j - 1]) / 2, zy = (Hs[j + N] - Hs[j - N]) / 2;
        let l = (-zx * L[0] + zy * L[1] + L[2]) / Math.sqrt(zx * zx + zy * zy + 1);
        const tb = TB[j], us = UST[j];
        const alt = K.yum(tb - 46, tb - 2, sy); // taban gölgesi
        const dik = K.kenet((sy - us) / Math.max(40, tb - us), 0, 1); // aşağıda daha gölgeli
        l = l * (1 - (o.altGolge === undefined ? 0.35 : o.altGolge) * alt) - (o.dikGolge === undefined ? 0.18 : o.dikGolge) * dik + 0.12;
        lit[i] = K.kenet(l, 0, 1);
      }
      const bx = (Hb[i + 1] - Hb[i - 1]) / 2, by = (Hb[i + N] - Hb[i - N]) / 2;
      const gm = Math.hypot(bx, by);
      aci[i] = Math.atan2(by, bx) + Math.PI / 2;
      ag[i] = K.yum(0.05, 0.6, gm);
    }
  return { e, lit, aci, ag, Hf };
};

/** Ayrı bir katmanda boyar, sonra 1024² örtü dizisiyle (0..1) maskeleyip ana tuvale basar. */
K.maskeliKatman = function (ctx, ortu, ciz) {
  const [kc, kx] = K.tuval2();
  ciz(kx);
  const mc = S.yeniTuval(1024, 1024);
  const mx = mc.getContext('2d');
  const im = mx.createImageData(1024, 1024);
  for (let i = 0; i < 1024 * 1024; i++) {
    im.data[i * 4] = 255;
    im.data[i * 4 + 1] = 255;
    im.data[i * 4 + 2] = 255;
    im.data[i * 4 + 3] = Math.round(K.kenet(ortu[i], 0, 1) * 255);
  }
  mx.putImageData(im, 0, 0);
  kx.save();
  kx.setTransform(1, 0, 0, 1, 0, 0);
  kx.globalCompositeOperation = 'destination-in';
  kx.imageSmoothingEnabled = true;
  kx.drawImage(mc, 0, 0, K.N, K.N);
  kx.restore();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(kc, 0, 0);
  ctx.restore();
};

/** Mat çiçek göbeği: düz disk, sol altta koyu bir darbe, sağ üstte birkaç açık lekecik, çevrede erkek organ noktaları. */
K.cicekOrta = function (c, cx, cy, r, renk, R, o) {
  o = o || {};
  const pol = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * 6.283;
    const q = r * (0.9 + R() * 0.18);
    pol.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(renk.orta);
  c.fill(yol);
  c.save();
  c.clip(yol);
  K.firca(c, [[cx - r * 0.9, cy + r * 0.1], [cx - r * 0.2, cy + r * 0.75], [cx + r * 0.6, cy + r * 0.85]], { w: r * 0.75, renk: renk.koyu, a: 0.85, r: R, kil: 3, jit: 8, bas: 0.3, son: 0.4, uc: 0.2 });
  const n = o.lek || 5;
  for (let i = 0; i < n; i++) {
    const a = -0.9 + (R() - 0.5) * 1.4, q = r * (0.15 + R() * 0.4);
    const x = cx + Math.cos(a) * q, y = cy + Math.sin(a) * q;
    K.firca(c, [[x - r * 0.18, y + r * 0.08], [x + r * 0.18, y - r * 0.08]], { w: r * 0.28, renk: renk.acik, a: 0.9, r: R, kil: 0, bas: 0.3, son: 0.4, uc: 0.3 });
  }
  c.restore();
  if (renk.nokta) {
    const m = o.nokta || 11;
    for (let i = 0; i < m; i++) {
      const a = (i / m) * 6.283 + R() * 0.3;
      const q = r * (1.15 + R() * 0.25);
      c.fillStyle = K.rk(renk.nokta, 0.9);
      c.beginPath();
      c.arc(cx + Math.cos(a) * q, cy + Math.sin(a) * q, Math.max(0.7, r * 0.11) * (0.8 + R() * 0.4), 0, 6.283);
      c.fill();
    }
  }
};

// ===================================================================== S-207 Leke Ressamı (Macchia)
// Hayalî bir leke ressamı: açık okr astarlı küçük ahşap pano; her biçim güçlü güneşte görüldüğü gibi
// iki üç düz renk lekesine indirgenir. Her leke dolu, yassı bir fırçanın birkaç uzun, kararlı darbesiyle
// atılır: dolu ve kare başlayan, kıl kıl kuruyarak biten darbeler, kenarlarında boya sırtı, yağlı parıltı.
(function () {
  const G = K.geo();
  const tv = document.getElementById('tuval');
  tv.width = K.N;
  tv.height = K.N;
  const ctx = tv.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  const [hc, h] = K.tuval2();
  h.fillStyle = 'rgb(30,30,30)';
  h.fillRect(0, 0, 1024, 1024);
  const R = S.rng(2071);

  const P = {
    serulyen: K.hex('#6FAEDD'),
    orta: K.hex('#9FC9E9'),
    soluk: K.hex('#CFE3F0'),
    beyaz: K.hex('#FAF6EC'),
    leylak: K.hex('#A9A6CF'),
    leylakKoyu: K.hex('#8A86B9'),
    leylakDerin: K.hex('#67659C'),
    gunesYesil: K.hex('#66B66C'),
    ortaYesil: K.hex('#468E5D'),
    golgeYesil: K.hex('#286350'),
    derinYesil: K.hex('#1E5A3D'),
    isikYesil: K.hex('#A3D38F'),
    okr: K.hex('#E6D2A8'),
    kum: K.hex('#EBD9B0'),
    altin: K.hex('#D9AE48'),
    altinIsik: K.hex('#F3D77E'),
    altinKoyu: K.hex('#A97F2C'),
    sari: K.hex('#EFC443'),
  };
  const gri = (v, a) => {
    const g = Math.round(K.kenet(v, 0, 1) * 255);
    return a === undefined ? `rgb(${g},${g},${g})` : `rgba(${g},${g},${g},${a})`;
  };

  /**
   * Dolu yassı fırça darbesi. Kıl şeritlerinden kurulur: şeritler birlikte, kare ve dolu başlar (başta boya
   * topağı), her biri kendi boya yüküyle bir iki ton farklı akar; bazı kıllar alttaki ya da komşu ıslak rengi
   * sürükler (yaş üstüne yaş karışma çizgileri). Uçta gövde biter, kıllar kesik kesik kuruyarak dağılır.
   * Yükseklik tuvaline: gövde kalınlığı, kıl olukları, iki kenarda boya sırtı, başta boya topağı.
   * o: {w, renk, mix, mixP, a, jit, kuru (kuru uç payı), h, hv, sirt, lip, serit, nefes}
   */
  const darbe = (c, pts0, o) => {
    if (pts0.length < 2) return;
    const pts = [pts0[0]];
    for (let i = 1; i < pts0.length; i++) {
      const a = pts0[i - 1], b = pts0[i];
      const m = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 2.5));
      for (let k = 1; k <= m; k++) pts.push([a[0] + ((b[0] - a[0]) * k) / m, a[1] + ((b[1] - a[1]) * k) / m]);
    }
    const n = pts.length;
    const L = [0];
    for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const tot = L[n - 1] || 1;
    const T = L.map((l) => l / tot);
    const nx = [], ny = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const m = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      nx.push(-(b[1] - a[1]) / m);
      ny.push((b[0] - a[0]) / m);
    }
    const w = o.w;
    const ph = R() * 6.28;
    const nf = o.nefes === undefined ? 0.06 : o.nefes;
    const prof = o.profil;
    const wp = T.map((t) => w * (prof ? prof(t) : t < 0.04 ? 0.9 + 0.1 * Math.sqrt(t / 0.04) : 1) * (1 + nf * Math.sin(ph + t * 5.3)));
    const ns = Math.max(3, Math.round(w / (o.serit || 3.4)));
    const kuru = o.kuru === undefined ? 0.32 : o.kuru;
    const jit = o.jit === undefined ? 8 : o.jit;
    const al = o.a === undefined ? 1 : o.a;
    const mixP = o.mix ? (o.mixP === undefined ? 0.3 : o.mixP) : 0;
    const H = o.h;
    const hv = o.hv === undefined ? 0.45 : o.hv;
    const govdeT0 = 1 - kuru;
    const yolKur = (c2, f, ta, tb, kenar, b, yan) => {
      c2.beginPath();
      let ilk = true;
      for (let i = 0; i < n; i++) {
        const t = T[i];
        if (t < ta || t > tb) continue;
        // kuru uçta kıllar hafifçe açılır (yelpaze), her kıl biraz yana kayar
        const ac = t > govdeT0 ? (t - govdeT0) / (kuru + 1e-6) : 0;
        const v = f * wp[i] * (1 + 0.12 * ac) + Math.sin(ph + b * 1.7 + t * 9) * 0.3 * kenar + (yan || 0) * ac;
        const X = pts[i][0] + nx[i] * v, Y = pts[i][1] + ny[i] * v;
        if (ilk) {
          c2.moveTo(X, Y);
          ilk = false;
        } else c2.lineTo(X, Y);
      }
      return !ilk;
    };
    const govdeT = 1 - kuru * 0.75;
    // fırça eğik tutulur: başlangıç kenarı tek bir eğik çizgi; gövde önce düz renkle kapanır, kıllar üstüne
    const egik = (R() - 0.5) * 2 * Math.min(0.14, (w * 0.6) / tot);
    const s0 = R() * 0.01;
    const tSol = s0 + Math.max(0, egik), tSag = s0 + Math.max(0, -egik);
    const govdeSon = 1 - kuru;
    const govdeYol = (c2, te) => {
      c2.beginPath();
      for (let i = 0; i < n; i++) if (T[i] >= tSag && T[i] <= te) c2.lineTo(pts[i][0] + (nx[i] * wp[i]) / 2, pts[i][1] + (ny[i] * wp[i]) / 2);
      for (let i = n - 1; i >= 0; i--) if (T[i] >= tSol && T[i] <= te) c2.lineTo(pts[i][0] - (nx[i] * wp[i]) / 2, pts[i][1] - (ny[i] * wp[i]) / 2);
      c2.closePath();
    };
    govdeYol(c, govdeSon);
    c.fillStyle = K.rk(o.renk, al);
    c.fill();
    if (H) {
      // boya kalınlığı: dolu başta kalın, uca doğru incelir
      govdeYol(H, govdeT);
      const gr = H.createLinearGradient(pts[0][0], pts[0][1], pts[n - 1][0], pts[n - 1][1]);
      gr.addColorStop(0, gri(hv + 0.1, 0.95));
      gr.addColorStop(0.5, gri(hv + 0.02, 0.93));
      gr.addColorStop(1, gri(hv - 0.08, 0.9));
      H.fillStyle = gr;
      H.fill();
    }
    c.lineJoin = 'round';
    let dk = (R() - 0.5) * 2 * jit; // kıl demetleri: komşu kıllar benzer boya taşır
    let mixK = mixP && R() < mixP;
    // kuru uçta kıllar demet demet kopar: komşu 3–5 kıl aynı yerde biter, aynı yerde boşluk bırakır
    const demetBoy = 3 + ((R() * 3) | 0);
    const demetler = [];
    for (let q = 0; q <= Math.ceil(ns / demetBoy); q++) {
      const gsQ = 1 - kuru * (0.4 + R() * 0.6);
      const t1Q = 1 - kuru * Math.pow(R(), 1.2) * 0.4;
      const kes = [];
      let t = gsQ;
      while (t < t1Q) {
        const sL = (22 + R() * 46) / tot;
        kes.push([t, Math.min(t1Q, t + sL)]);
        t += sL + ((4 + R() * 9) / tot) * (0.4 + (t - gsQ) / (1 - gsQ + 1e-6));
      }
      demetler.push({ gs: gsQ, kes });
    }
    for (let b = 0; b < ns; b++) {
      const f = (b + 0.5) / ns - 0.5;
      const kenar = Math.abs(f) * 2;
      const lw = (w / ns) * (1.25 + R() * 0.4);
      const t0 = tSol + (tSag - tSol) * (f + 0.5) + R() * 0.008 * (1 + kenar * 2);
      const dm = demetler[Math.floor(b / demetBoy)];
      const gs = dm.gs - (kenar > 0.75 ? R() * 0.06 : 0) + (R() - 0.5) * 0.02;
      if (R() < 0.35) dk = (R() - 0.5) * 2 * jit;
      else dk = dk * 0.7 + (R() - 0.5) * jit * 0.6;
      if (R() < 0.3) mixK = mixP && R() < mixP;
      const d = dk;
      let col = [o.renk[0] + d, o.renk[1] + d, o.renk[2] + d * 0.9];
      if (mixK) col = K.rkar(col, o.mix, 0.3 + R() * 0.4);
      c.lineCap = 'butt';
      if (yolKur(c, f, t0, gs, kenar, b)) {
        c.lineWidth = lw;
        c.strokeStyle = K.rk(col, al);
        c.stroke();
      }
      // kuru uç: demet demet kesilen, dolgun izler (kıl başına kıl inceliğinde değil)
      c.lineCap = 'round';
      for (const [ta0, tb0] of dm.kes) {
        const ta = ta0 + (R() - 0.5) * 0.015, tb = tb0 + (R() - 0.5) * 0.02;
        if (tb <= ta || R() < 0.08) continue;
        if (yolKur(c, f, ta, tb, kenar, b, (R() - 0.5) * 2)) {
          c.lineWidth = lw * (0.8 + R() * 0.3);
          c.strokeStyle = K.rk(col, al * 0.9);
          c.stroke();
          if (H) {
            H.lineCap = 'round';
            H.lineWidth = lw * 0.7;
            H.strokeStyle = gri(hv * 0.85 + (R() - 0.5) * 0.18, 0.8);
            H.stroke();
          }
        }
      }
      if (H && yolKur(H, f, t0, gs, kenar, b)) {
        H.lineCap = 'butt';
        H.lineWidth = lw * 0.38;
        H.strokeStyle = gri(hv + (R() - 0.5) * 0.5 + d / 400, 0.9);
        H.stroke();
      }
    }
    if (H) {
      // kenar sırtları (fırçanın iki yanından taşan boya): kırık, değişken güçte
      const sirt = o.sirt === undefined ? 0.06 : o.sirt;
      if (sirt) {
        H.lineCap = 'round';
        for (const f of [-0.5, 0.5]) {
          let ta = 0.01 + R() * 0.08;
          while (ta < govdeT) {
            const tb = Math.min(govdeT, ta + 0.1 + R() * 0.3);
            if (yolKur(H, f * (0.9 + R() * 0.06), ta, tb, 0, 0)) {
              H.lineWidth = Math.max(1.2, w * 0.06) * (0.6 + R() * 0.7);
              H.strokeStyle = gri(hv + 0.04 + sirt * (0.4 + R() * 1.0), 0.85);
              H.stroke();
            }
            ta = tb + 0.03 + R() * 0.2;
          }
        }
      }
      // başta boya topağı: başlangıçta kabaran, birkaç piksel içinde gövdeye inen düzensiz bir yığın
      const lip = o.lip === undefined ? 0.05 : o.lip;
      if (lip) {
        const tl = Math.min(0.16, (8 + R() * 8) / tot);
        H.beginPath();
        for (let i = 0; i < n && T[i] <= tl; i++) H.lineTo(pts[i][0] + (nx[i] * wp[i]) / 2.15, pts[i][1] + (ny[i] * wp[i]) / 2.15);
        for (let i = n - 1; i >= 0; i--) if (T[i] <= tl) H.lineTo(pts[i][0] - (nx[i] * wp[i]) / 2.15, pts[i][1] - (ny[i] * wp[i]) / 2.15);
        H.closePath();
        const ie = Math.min(n - 1, Math.max(1, T.findIndex((t) => t > tl)));
        const gr = H.createLinearGradient(pts[0][0], pts[0][1], pts[ie][0], pts[ie][1]);
        gr.addColorStop(0, gri(hv + 0.06 + lip, 0.85));
        gr.addColorStop(0.35, gri(hv + 0.08 + lip, 0.7));
        gr.addColorStop(1, gri(hv + 0.08, 0));
        H.fillStyle = gr;
        H.fill();
      }
    }
  };

  // ----------------------------------------------------------------- astar: açık okr pano
  ctx.fillStyle = K.rk(P.okr);
  ctx.fillRect(0, 0, 1024, 1024);

  /** Fırçayla kesilmiş kenar: çevre düz parçalara bölünür, köşeler hafifçe oynatılır. */
  const kesik = (poly, amp, seg) => {
    let cev = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      cev += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    const sg = seg || K.kenet(cev / 28, 2.5, 15);
    const out = [];
    let kalan = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      let t = kalan;
      while (t < L) {
        const f = t / L;
        out.push([a[0] + (b[0] - a[0]) * f + (R() - 0.5) * 2 * amp, a[1] + (b[1] - a[1]) * f + (R() - 0.5) * 2 * amp]);
        t += sg * (0.75 + R() * 0.5);
      }
      kalan = t - L;
    }
    return out.length > 2 ? out : poly;
  };

  const kademe = [-1, -0.5, 0, 0.5, 1];
  /** Darbe rengi: ton basamağı, sıcak-soğuk kayması. */
  const tonla = (taban, adim, sic) => {
    // ara sıra paletten biraz daha az ya da çok beyazla karışmış bir darbe: komşularından belirgin ayrılır
    const d = kademe[(R() * 5) | 0] * adim * (R() < 0.12 ? 1.7 : 1) + (R() - 0.5) * 4;
    const s = (R() - 0.5) * sic;
    return [taban[0] + d + s, taban[1] + d, taban[2] + d - s];
  };

  /**
   * Leke: elle kesilmiş düz renk alanı; içi lekenin yönünde uzun, dolu yassı darbelerle sıra sıra doldurulur.
   * o: {yon, en, boyK, sik, adim, sic, sapma, mix:[renkler], mixP, kuru, titre, seg, hv, sirt, kontur, renkF, yonF}
   */
  const leke = (poly, renk, o) => {
    o = o || {};
    const p = o.titre === 0 ? poly : kesik(poly, o.titre === undefined ? 0.9 : o.titre, o.seg);
    const yol = K.p2d([p]);
    const yon = o.yon === undefined ? 0 : o.yon;
    const en = o.en || 26;
    const ca = Math.cos(yon), sa = Math.sin(yon);
    let umin = Infinity, umax = -Infinity, vmin = Infinity, vmax = -Infinity;
    for (const [x, y] of p) {
      const u = x * ca + y * sa, v = -x * sa + y * ca;
      umin = Math.min(umin, u);
      umax = Math.max(umax, u);
      vmin = Math.min(vmin, v);
      vmax = Math.max(vmax, v);
    }
    const hv = o.hv === undefined ? 0.45 : o.hv;
    ctx.save();
    ctx.clip(yol);
    h.save();
    h.clip(yol);
    ctx.fillStyle = K.rk(o.alt || renk);
    ctx.fill(yol);
    h.fillStyle = gri(hv * 0.9);
    h.fill(yol);
    const boyK = o.boyK || 3;
    const satir = en * (o.sik || 0.7);
    const liste = [];
    if (o.sira) {
      for (let v = vmin - satir * 0.45; v < vmax + satir * 0.5; v += satir * (0.85 + R() * 0.3)) {
        let u = umin - R() * en * boyK * 0.7;
        while (u < umax + en * 0.3) {
          const Ls = en * boyK * (0.6 + R() * 0.8);
          liste.push([u, v + (R() - 0.5) * satir * 0.5, Ls, R()]);
          u += Ls * (0.5 + R() * 0.3);
        }
      }
    } else {
      // serbest yerleşim: darbeler sıra sıra değil, alanı iki üç kat örtecek kadar rastgele yerlere atılır
      const Lort = en * boyK;
      const alan = (umax - umin + Lort * 0.6) * (vmax - vmin + satir);
      const adet = Math.ceil((alan / (en * Lort * 0.8)) * (o.yog || 2.2));
      for (let i = 0; i < adet; i++) {
        const Ls = Lort * (0.4 + R() * 1.2);
        const u = umin - Ls * 0.6 + R() * (umax - umin + Ls * 0.6);
        const v = vmin - satir * 0.4 + R() * (vmax - vmin + satir * 0.8);
        liste.push([u, v, Ls, R()]);
      }
    }
    liste.sort((a, b) => a[3] - b[3]);
    const adim = o.adim === undefined ? 12 : o.adim;
    const sic = o.sic === undefined ? 8 : o.sic;
    const sapma = o.sapma === undefined ? 0.06 : o.sapma;
    for (const [u, v, Ls] of liste) {
      const cu = u + Ls / 2;
      const cx = cu * ca - v * sa, cy = cu * sa + v * ca;
      let pts;
      if (o.yonF) pts = K.cizgiKur(cx, cy, Ls, o.yonF, true, Math.max(3, Ls / 10));
      else {
        const a = yon + (R() - 0.5) * 2 * sapma;
        const dx = (Math.cos(a) * Ls) / 2, dy = (Math.sin(a) * Ls) / 2;
        const bow = (R() - 0.5) * en * 0.3;
        const ox = -Math.sin(a) * bow, oy = Math.cos(a) * bow;
        pts = [[cx - dx, cy - dy], [cx - dx * 0.33 + ox, cy - dy * 0.33 + oy], [cx + dx * 0.33 + ox, cy + dy * 0.33 + oy], [cx + dx, cy + dy]];
      }
      if (R() < 0.5) pts.reverse();
      const taban = o.renkF ? o.renkF(cx, cy) : renk;
      const mix = o.mix ? o.mix[(R() * o.mix.length) | 0] : null;
      darbe(ctx, pts, { w: en * (0.8 + R() * 0.45), renk: tonla(taban, adim, sic), mix, mixP: o.mixP, jit: o.jit === undefined ? 7 : o.jit, kuru: o.kuru === undefined ? 0.3 : o.kuru, h, hv: hv + (R() - 0.5) * (o.hvJ === undefined ? 0.2 : o.hvJ), sirt: o.sirtD === undefined ? 0.06 : o.sirtD, lip: o.lip });
    }
    // kenarı kesen darbeler: fırça lekenin sınırı boyunca, içe doğru yarım en kayık sürülür
    if (o.kontur) {
      const kw = o.kontur;
      const m = p.length;
      let cx0 = 0, cy0 = 0;
      for (const [x, y] of p) {
        cx0 += x / m;
        cy0 += y / m;
      }
      let parca = [];
      let acc = 0;
      const hedef = () => kw * (3 + R() * 3);
      let sinir = hedef();
      const bas = (q) => {
        if (q.length < 2) return;
        const pp = q.map(([x, y]) => {
          const dx = cx0 - x, dy = cy0 - y;
          const dm = Math.hypot(dx, dy) || 1;
          return [x + (dx / dm) * kw * 0.28, y + (dy / dm) * kw * 0.28];
        });
        const taban = o.renkF ? o.renkF(pp[0][0], pp[0][1]) : renk;
        darbe(ctx, R() < 0.5 ? pp : pp.reverse(), { w: kw, renk: tonla(taban, adim * 0.7, sic), jit: 6, kuru: 0.25, h, hv: hv + 0.04, sirt: 0.1 });
      };
      for (let i = 0; i <= m; i++) {
        const q = p[i % m];
        if (parca.length) acc += Math.hypot(q[0] - parca[parca.length - 1][0], q[1] - parca[parca.length - 1][1]);
        parca.push(q);
        if (acc > sinir) {
          bas(parca);
          parca = [q];
          acc = 0;
          sinir = hedef();
        }
      }
      bas(parca);
    }
    h.restore();
    ctx.restore();
    // leke sınırında boya sırtı
    if (o.sirt !== 0) {
      h.save();
      h.strokeStyle = gri(hv + (o.sirt || 0.1));
      h.lineWidth = o.sirtEn || 1.8;
      h.stroke(yol);
      h.restore();
    }
    return { yol, p };
  };

  /** Lekeler arasında açık kalan astar: kırık, düzensiz ince okr aralık. */
  const astarCizgi = (pts, w, sur) => {
    const acik = sur === undefined ? 0.6 : sur;
    const L = [];
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      L.push(acc);
    }
    const bas = (parca) => {
      if (parca.length < 2) return;
      const ww = w * (0.75 + R() * 0.5);
      K.firca(ctx, parca, { w: ww, renk: K.kay(P.okr, (R() - 0.5) * 8), a: 0.95, r: R, kil: 0, bas: 0.08, son: 0.2, uc: 0.35, dalga: 0.2 });
      K.firca(h, parca, { w: ww * 0.85, renk: [60, 60, 60], a: 1, r: R, kil: 0, bas: 0.08, son: 0.2, uc: 0.35 });
    };
    let parca = [];
    let ac = R() < acik;
    let sonra = 20 + R() * 60;
    for (let i = 0; i < pts.length; i++) {
      const s = i === 0 ? 0 : L[i - 1];
      if (s > sonra) {
        if (ac) bas(parca);
        parca = [pts[i - 1]];
        ac = R() < acik;
        sonra = s + (ac ? 30 + R() * 80 : 20 + R() * 60);
      }
      parca.push(pts[i]);
    }
    if (ac) bas(parca);
  };
  const yatayBant = (y0, y1, x0, x1, gen, tohum) => {
    const n = K.gurultu(tohum);
    const ust = [], alt = [];
    for (let x = x0; x <= x1; x += 16) {
      ust.push([x, y0 + (n(x / 140, 1) - 0.5) * gen]);
      alt.push([x, y1 + (n(x / 140, 7) - 0.5) * gen]);
    }
    return ust.concat(alt.reverse());
  };

  /** Uçları yuvarlak, kenarları hafif dalgalı yatay leke (kumda iç lekeler için). */
  const yuvarlakLeke = (x0, x1, y0, y1, tohum) => {
    const n = K.gurultu(tohum);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = (x1 - x0) / 2, ry = (y1 - y0) / 2;
    const out = [];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * 6.283;
      const ca = Math.cos(a), sa = Math.sin(a);
      // süperelips: düz uzun kenarlar, yuvarlak uçlar
      const ex = Math.sign(ca) * Math.pow(Math.abs(ca), 0.45), ey = Math.sign(sa) * Math.pow(Math.abs(sa), 0.6);
      const q = 1 + (n(i / 5, 3) - 0.5) * 0.12;
      out.push([cx + ex * rx * q, cy + ey * ry * q]);
    }
    return out;
  };
  // ----------------------------------------------------------------- gök: üç düz bant
  const bant = (y0, y1, x0, x1, gen, tohum) => {
    const n = K.gurultu(tohum);
    const ust = [], alt = [];
    for (let x = x0; x <= x1; x += 12) {

      alt.push([x, y1 + (n(x / 110, 7) - 0.5) * gen + (n(x / 30, 9) - 0.5) * gen * 0.4]);
    }
    return ust.concat(alt.reverse());
  };
  // gök bantlarının altına sürülmüş ince mavi alt kat (kuru uçlardan okr değil, mavi-gri bir kat görünür)
  ctx.fillStyle = K.rk(K.hex('#9CC2DF'));
  ctx.fillRect(0, 0, 1024, 800);
  const gokAlt = K.hex('#BCD8EE');
  leke(bant(-10, 300, -20, 1044, 0, 1), P.serulyen, { yon: -0.03, en: 50, boyK: 6, sik: 0.66, titre: 0, hv: 0.42, sapma: 0.07, adim: 19, sic: 15, mix: [K.hex('#5F9FD4'), K.hex('#80BAE3')], mixP: 0.16, kuru: 0.34 });
  leke(bant(286, 560, -20, 1044, 40, 2), P.orta, { yon: 0.025, en: 44, boyK: 6.5, sik: 0.66, titre: 1.2, hv: 0.42, sapma: 0.07, adim: 18, sic: 14, mix: [K.hex('#92C0E5'), K.hex('#AFD3EE')], mixP: 0.16, kuru: 0.34 });
  leke(bant(548, 812, -20, 1044, 40, 3), gokAlt, { yon: -0.015, en: 36, boyK: 7, sik: 0.66, titre: 1.2, hv: 0.42, sapma: 0.06, adim: 15, sic: 12, mix: [K.hex('#C4DDF0'), P.soluk], mixP: 0.16, kuru: 0.34, renkF: (x, y) => K.rkar(gokAlt, P.soluk, K.yum(610, 780, y)) });
  // sınırları aşan darbeler: bir bandın fırçası komşu bandın içine dalar, uçları kuru biter
  const asanDarbe = (yb, ust, alt, tohum) => {
    const rb = S.rng(tohum);
    for (let x = -60; x < 1050; x += 170 + rb() * 170) {

      const pts = [[x, y], [x + L * 0.33, y + (rb() - 0.5) * 4], [x + L * 0.66, y + (rb() - 0.5) * 4], [x + L, y + (rb() - 0.5) * 5]];
      darbe(ctx, rb() < 0.5 ? pts : pts.reverse(), { w: 26 + rb() * 18, renk, mix: asagi ? alt : ust, mixP: 0.3, jit: 7, kuru: 0.45, h, hv: 0.42 });
    }
  };
  asanDarbe(294, P.serulyen, P.orta, 61);
  asanDarbe(552, P.orta, gokAlt, 62);

  // bulutlar: her bulut iki leke: güneşli beyaz gövde ve düz bir sınırla kesilmiş leylak-gri taban gölgesi.
  // Gövde yatay, hafif eğik darbelerle doldurulur; sonra gök rengi birkaç kısa darbeyle bulutun kenarına geri
  // sürülür (ressam gökyüzünü bulutun çevresinde yeniden keser), böylece siluet fırçayla kesilmiş kalır.
  const bulut = (cx, cy, w, hg, tohum, gokRenk) => {
    const rb = S.rng(tohum);
    const nz = K.gurultu(tohum + 5);
    const yb = cy + hg * 0.42;
    const t1 = 0.3 + rb() * 0.08, t2 = 0.58 + rb() * 0.1, a1 = 0.75 + rb() * 0.15, a2 = 1.0;
    const ust = [], alt = [];
    const n = 26;
    const sol = 0.5 + rb() * 0.25; // sol uç daha sivri, sağ uç daha dolgun (ya da tersi)
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      // yarım elips gibi: uçlar yuvarlak (sivri değil), taban düz; üstte iki alçak kambur
      const th = Math.PI * Math.pow(t, sol / 0.62);
      const zarf = Math.pow(Math.sin(th), 0.8);
      const kam = 0.6 + 0.4 * Math.max(a1 * Math.exp(-(((t - t1) / 0.16) ** 2)), a2 * Math.exp(-(((t - t2) / 0.19) ** 2)));
      const x = cx - (w / 2) * Math.cos(th);
      ust.push([x, yb - hg * zarf * kam - (nz(t * 7, 1) - 0.5) * 5 * zarf]);
      alt.push([x, yb + (nz(t * 4, 7) - 0.5) * 3 * zarf - Math.sin(th) * 2]);
    }
    const poly = ust.concat(alt.reverse());
    const gol = K.rkar(P.leylak, P.beyaz, 0.5);
    const govde = leke(poly, K.hex('#FBF8EF'), { yon: -0.02, en: 13, boyK: 4, sik: 0.62, seg: 8, titre: 1.4, hv: 0.5, adim: 10, sic: 8, sapma: 0.1, yog: 2.6, mix: [K.hex('#FFFDF6'), K.hex('#ECE9F1')], mixP: 0.3, kuru: 0.3, sirt: 0.08, renkF: (x, y) => K.rkar(K.hex('#FFFDF5'), K.hex('#F0EDEC'), K.kenet((y - (yb - hg)) / hg, 0, 1)) });
    // taban gölgesi: bulutun alt üçte biri, hafif eğik ve fırçayla kesilmiş tek bir sınırla
    const ys = yb - hg * (0.3 + rb() * 0.06), eg = (rb() - 0.5) * 0.06;
    ctx.save();
    ctx.clip(govde.yol);
    h.save();
    h.clip(govde.yol);
    leke([[cx - w, ys + eg * w], [cx + w, ys - eg * w], [cx + w, yb + 12], [cx - w, yb + 12]], gol, { yon: eg * 0.5, en: 11, boyK: 5, titre: 0.8, seg: 12, hv: 0.46, adim: 9, sic: 6, sapma: 0.05, mix: [K.rkar(P.leylak, P.beyaz, 0.3), K.hex('#D9DCEB')], mixP: 0.3, sirt: 0.06 });
    h.restore();
    ctx.restore();
    // gök rengi, iki kamburun arasındaki çukurda kısa bir darbeyle bulutun kenarına geri sürülür
    const tv = (t1 + t2) / 2 + (rb() - 0.5) * 0.04;
    const [vx, vy] = ust[Math.round(tv * n)];
    const L = 26 + rb() * 18;
    darbe(ctx, [[vx - L / 2, vy - 2], [vx + L / 2, vy - 1 + (rb() - 0.5) * 3]], { w: 7 + rb() * 3, renk: tonla(gokRenk, 6, 6), jit: 5, kuru: 0.45, h, hv: 0.42 });
  };
  bulut(136, 248, 200, 46, 11, P.serulyen);
  bulut(496, 136, 236, 50, 12, P.serulyen);
  bulut(868, 352, 206, 42, 13, P.orta);

  // güneş: tek, düz, soluk sarı-beyaz bir leke; kenarı fırçayla kesilmiş (kusursuz daire değil), içinde
  // eğik, kısa, kalın darbeler; sağ üstte daha beyaz, sol altta biraz daha sarı
  {
    const sx = 880, sy = 139;
    const nzs = K.gurultu(78);
    const disk = [];
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * 6.283;
      const q = 31 * (0.97 + (nzs(Math.cos(a) * 1.4 + 3, Math.sin(a) * 1.4 + 3) - 0.5) * 0.12);
      disk.push([sx + Math.cos(a) * q, sy + Math.sin(a) * q]);

    leke(disk, K.hex('#FFF7DE'), { yon: -0.5, en: 13, boyK: 3, titre: 0.4, seg: 7, hv: 0.5, adim: 6, sic: 4, mix: [K.hex('#FFFCF0'), K.hex('#FAEDC0')], mixP: 0.35, kuru: 0.15, sirt: 0.06 });
    ctx.save();

    darbe(ctx, [[sx - 4, sy - 22], [sx + 26, sy - 6]], { w: 12, renk: K.hex('#FFFCF0'), jit: 3, kuru: 0.2, h, hv: 0.52 });
    darbe(ctx, [[sx - 28, sy + 6], [sx - 2, sy + 26]], { w: 12, renk: K.hex('#F8E7AE'), jit: 3, kuru: 0.2, h, hv: 0.5 });
    ctx.restore();
  }

  // uzak toprak: gökle kum arasında ince, soluk okr-gri alçak tepeler (ufuk pusu, deniz değil)
  {
    const nt = K.gurultu(71);
    const ust = [], alt = [];
    for (let x = -20; x <= 1044; x += 10) {
      ust.push([x, 780 - nt(x / 170, 2) * 30 - nt(x / 45, 5) * 6]);

    const rh = S.rng(72);
    for (let x = 20; x < 1010; x += 90 + rh() * 80) {
      const y = 786 + rh() * 8;
      darbe(ctx, [[x, y], [x + 40 + rh() * 40, y - 3]], { w: 10 + rh() * 4, renk: K.hex('#BEBCC0'), jit: 6, kuru: 0.4, h, hv: 0.42 });
    }

  // ----------------------------------------------------------------- yer: güneşli kum, leylak gölgeler
  leke(yatayBant(798, 1034, -20, 1044, 6, 4), P.kum, { yon: 0.02, en: 36, boyK: 6.5, yog: 1.7, titre: 0.8, hv: 0.42, hvJ: 0.13, sapma: 0.11, adim: 16, sic: 16, mix: [K.hex('#F3E5C2'), K.hex('#E0C892')], mixP: 0.3 });
  leke(yuvarlakLeke(380, 760, 838, 884, 41), K.hex('#F4E6C4'), { yon: 0.02, en: 30, boyK: 4, titre: 1.4, hv: 0.44, sirt: 0, adim: 9 });
  leke(yuvarlakLeke(-60, 300, 930, 990, 42), K.hex('#E2C894'), { yon: -0.02, en: 30, boyK: 4, titre: 1.4, hv: 0.44, sirt: 0, adim: 9 });
  leke(yuvarlakLeke(640, 1090, 952, 1040, 43), K.hex('#F2E3BE'), { yon: 0.03, en: 30, boyK: 4, titre: 1.4, hv: 0.44, sirt: 0, adim: 9 });
  // binanın ayağında güneşe karşı kısa leylak gölge şeridi
  leke([[292, 799], [828, 799], [818, 813], [296, 817]], K.rkar(P.leylak, P.kum, 0.3), { yon: 0, en: 12, boyK: 6, titre: 1, hv: 0.45, adim: 8 });
  leke([[226, 800], [300, 800], [300, 813], [214, 819]], K.rkar(P.leylak, P.kum, 0.35), { yon: 0, en: 10, boyK: 6, titre: 1, hv: 0.45, adim: 8 });
  for (const cc of S.bitki.cicekler) {
    if (cc.y < 820) continue;
    // öğle güneşi: çiçeğin hemen altında, sola kayan kısa, yassı bir gölge lekesi
    const gx = cc.x - cc.r * 0.3, gy = cc.y + cc.r * 0.84;
    const rx = cc.r * 0.8, ry = cc.r * 0.2;
    const el = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * 6.283;
      el.push([gx + Math.cos(a) * rx, gy + Math.sin(a) * ry]);
    }
    leke(el, K.rkar(P.leylak, P.kum, 0.42), { yon: -0.03, en: Math.max(6, cc.r * 0.22), boyK: 4, titre: 1, hv: 0.44, adim: 7, sirt: 0 });
  }

  // ----------------------------------------------------------------- minare: güneşli beyaz / leylak gölge
  const c = 300;
  const bolLeke = (poly, oran, yonu, golgeRenk, isikRenk, o) => {
    // biçimi dikey bir sınırla iki lekeye böler (sol gölge, sağ ışık); sınır fırçayla kesin kesilir
    const xs = poly.map((q) => q[0]);
    const x1 = Math.min(...xs), x2 = Math.max(...xs);
    const xb = x1 + (x2 - x1) * oran;
    const yol = K.p2d([poly]);
    ctx.save();
    ctx.clip(yol);
    h.save();
    h.clip(yol);
    const ys = poly.map((q) => q[1]);
    const y1 = Math.min(...ys) - 2, y2 = Math.max(...ys) + 2;
    leke([[x1 - 3, y1], [xb + (R() - 0.5) * 1.2, y1], [xb + (R() - 0.5) * 1.2, y2], [x1 - 3, y2]], golgeRenk, Object.assign({ yon: yonu, en: 12, titre: 0.4, hv: 0.45, mix: [K.hex('#9AA6D2')], mixP: 0.25 }, o || {}));
    leke([[xb, y1], [x2 + 3, y1], [x2 + 3, y2], [xb, y2]], isikRenk, Object.assign({ yon: yonu, en: 12, titre: 0.4, hv: 0.52, mix: [K.hex('#F1E6CC')], mixP: 0.25 }, o || {}));
    h.restore();
    ctx.restore();
  };
  for (const p of G.minare) {
    if (!p.poly || p.tip === 'bant') continue;
    if (p.ad.startsWith('çıkma')) {
      leke(p.poly, P.leylakKoyu, { yon: 0, en: 9, boyK: 4, titre: 0.4, adim: 10 });
      continue;
    }
    if (p.tip === 'korkuluk') {
      leke(p.poly, P.leylak, { yon: 0, en: 9, boyK: 4, titre: 0.4, adim: 10 });
      continue;
    }
    if (p.tip === 'topuz') {
      bolLeke(p.poly, 0.45, -1.2, P.leylak, P.beyaz, { en: 10, boyK: 2.5 });

    }
    if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
      bolLeke(p.poly, 0.32, 0, P.leylak, P.beyaz, { en: 8, boyK: 4 });
      continue;
    }
    bolLeke(p.poly, 0.42, Math.PI / 2, P.leylak, P.beyaz, { en: 15, boyK: 4, adim: 13 });
  }
  // korkuluk dikmeleri: güneşte kısa beyaz vuruşlar
  for (const p of G.minare) {
    if (p.tip !== 'korkuluk') continue;
    const n = 7;
    for (let i = 0; i < n; i++) {
      const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * (i + 0.5)) / n;
      const lit = x > c - 10;
      darbe(ctx, [[x, p.y1 + 3], [x, p.y2 - 1]], { w: 4.6, renk: lit ? P.beyaz : K.rkar(P.leylak, P.beyaz, 0.35), jit: 5, kuru: 0.15, h, hv: 0.6, sirt: 0.1, lip: 0.1 });
    }
    darbe(ctx, [[p.x1, p.y1 + 1.8], [p.x2, p.y1 + 1.8]], { w: 3.6, renk: P.beyaz, jit: 5, kuru: 0.15, h, hv: 0.6, sirt: 0.1 });
  }
  // zikzak: yassı fırçanın kenarıyla leylak
  // her kol ayrı, kısa bir darbe: köşelerde bir öncekinin üstüne biraz taşar, eni ve tonu darbeden darbeye değişir
  for (const z of G.zikzak) {
    const zj = z.map(([x, y]) => [x + (R() - 0.5) * 1.2, y + (R() - 0.5) * 1.6]);
    for (let i = 0; i < zj.length - 1; i++) {
      const [ax, ay] = zj[i], [bx, by] = zj[i + 1];
      const dx = bx - ax, dy = by - ay, m = Math.hypot(dx, dy) || 1;
      const u0 = -0.6 - R() * 0.8, u1 = 0.6 + R() * 1.0;
      const pts = [[ax + (dx / m) * u0, ay + (dy / m) * u0], [bx + (dx / m) * u1, by + (dy / m) * u1]];
      const golgede = ax < c - 6;
      darbe(ctx, R() < 0.5 ? pts : pts.reverse(), { w: 2.6 + R() * 1.5, renk: tonla(golgede ? P.leylakDerin : P.leylakKoyu, 10, 8), jit: 6, kuru: 0.12, h, hv: 0.56, sirt: 0.08, lip: 0.06, serit: 1.3 });
    }
  }
  for (const p of G.minarePen) leke(p.poly, P.leylakDerin, { yon: Math.PI / 2, en: 8, boyK: 3, titre: 0.4, hv: 0.5, adim: 8 });

  // ----------------------------------------------------------------- kaide: güneşli beyaz ön yüz
  ctx.fillStyle = K.rk(P.okr);
  ctx.fill(K.p2d([G.kaide]));
  leke([[300, 704], [356, 704], [340, 800], [300, 800]], K.rkar(P.leylak, P.beyaz, 0.4), { yon: Math.PI / 2, en: 16, boyK: 3, titre: 0.6, adim: 12, mix: [P.leylak], mixP: 0.25 });
  leke([[355.5, 716], [820, 716], [820, 800], [339.5, 800]], P.beyaz, { yon: 0, en: 26, boyK: 9, yog: 1.5, titre: 0.6, hv: 0.48, hvJ: 0.16, sapma: 0.04, adim: 14, sic: 16, mix: [K.hex('#F2E5C6'), K.hex('#E6E4F0')], mixP: 0.35, kontur: 12 });
  // korniş altında kısa gölge: leylak bant
  leke([[358.5, 704], [820, 704], [820, 716.5], [357, 716]], K.rkar(P.leylak, P.beyaz, 0.25), { yon: 0, en: 9, boyK: 6, titre: 0.6, adim: 9 });
  leke(G.kornis, P.beyaz, { yon: 0, en: 10, boyK: 6, titre: 0.4, hv: 0.56, adim: 10 });
  for (const p of G.kaidePen) {
    leke(p.poly, P.leylakDerin, { yon: Math.PI / 2, en: 10, boyK: 3, titre: 0.5, adim: 9 });
    const xl = p.x - p.w / 2;
    leke([[xl, p.y + p.w * 0.5], [xl + p.w * 0.32, p.y + p.w * 0.4], [xl + p.w * 0.32, p.y + p.h], [xl, p.y + p.h]], P.leylak, { yon: Math.PI / 2, en: 6, boyK: 4, titre: 0.3, adim: 8 });
  }

  // ----------------------------------------------------------------- kasnak: dört yeşil leke
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const w = q.x2 - q.x1;
    ctx.fillStyle = K.rk(P.ortaYesil);
    ctx.fillRect(q.x1, q.y1, w, q.y2 - q.y1);
    const kes = k ? [0, 0.24, 0.5, 0.86, 1] : [0, 0.24, 0.5, 0.86, 1];
    const egim = k ? 7 : 5;
    const renk = [P.golgeYesil, P.ortaYesil, P.gunesYesil, K.rkar(P.ortaYesil, P.gunesYesil, 0.4)];
    for (let j = 0; j < 4; j++) {
      const xa = q.x1 + w * kes[j], xb = q.x1 + w * kes[j + 1];
      const ea = j === 0 ? 0 : egim, eb = j === 3 ? 0 : egim;
      const ga = j === 0 ? -1 : 0, gb = j === 3 ? 1 : 0;
      leke([[xa + ga + ea, q.y1], [xb + gb + eb, q.y1], [xb + gb - eb, q.y2], [xa + ga - ea, q.y2]], renk[j], { yon: 0.0, en: 17, boyK: 3.5, titre: 0.5, hv: 0.46, adim: 9, sic: 8, mix: [renk[(j + 1) % 4], renk[Math.max(0, j - 1)]], mixP: 0.25 });
    }
    // üst kenarda güneşi tutan saçak
    leke([[q.x1 + w * 0.2, q.y1], [q.x2, q.y1], [q.x2, q.y1 + 5], [q.x1 + w * 0.2, q.y1 + 5]], P.isikYesil, { yon: 0, en: 5, boyK: 8, titre: 0.4, adim: 8 });
    leke([[q.x1, q.y1], [q.x1 + w * 0.2 + 2, q.y1], [q.x1 + w * 0.2 + 2, q.y1 + 4], [q.x1, q.y1 + 4]], P.ortaYesil, { yon: 0, en: 4, boyK: 8, titre: 0.4, adim: 8 });
    for (const p of G.kasnakPen[k]) {
      // pencereler elle: boyu, eni ve yeri azıcık değişir; gölge lekesinde gölgeye karışır, ışıkta keskin ve koyu
      const golgede = p.x < q.x1 + w * 0.24;
      const pw = p.w * (0.92 + R() * 0.14), ph2 = p.h * (0.94 + R() * 0.1);
      const poly = K.duz(S.kemerYolu(p.x + (R() - 0.5) * 1.2, p.y + (p.h - ph2) * (0.3 + R() * 0.4), pw, ph2), 1)[0];
      leke(poly, golgede ? K.rkar(P.derinYesil, P.golgeYesil, 0.45) : tonla(P.derinYesil, 8, 6), { yon: Math.PI / 2, en: 8, boyK: 3, titre: 0.45, hv: 0.5, sirt: golgede ? 0.05 : 0.15, adim: 8 });
      if (p.x > 470) {
        // güneşli tarafta pencerenin sol içi ışık alır: tek, ince bir darbe
        const xl = p.x - p.w / 2;
        darbe(ctx, [[xl + p.w * 0.16, p.y + p.w * 0.55], [xl + p.w * 0.16, p.y + p.h - 1]], { w: Math.max(2.4, p.w * 0.26), renk: K.rkar(P.ortaYesil, P.gunesYesil, 0.5), jit: 5, kuru: 0.2, h, hv: 0.52, sirt: 0.08 });
      }
    }
  }

  // ----------------------------------------------------------------- kubbe: dilimleri izleyen büyük lekeler
  const prN = 60;
  const pr = S.kubbeProfili(prN);
  const kab = [-1, ...G.kaburga.map((k) => k.u), 1];
  const kp = (u, i) => [560 + u * pr[i].r, pr[i].y];
  /** Kubbe lekesi: ua..ub dilim aralığı (u = sin boylam), alt sınır ia(u) ve üst sınır ib profil indisleri. */
  const kubbePoly = (ua, ub, ia, ib) => {
    const out = [];
    const ia0 = typeof ia === 'function' ? ia : () => ia;
    const ib0 = typeof ib === 'function' ? ib : () => ib;
    const nU = 10;
    for (let s = 0; s <= nU; s++) {
      const u = ua + ((ub - ua) * s) / nU;
      out.push(kp(u, Math.round(ia0(u))));
    }
    for (let i = Math.round(ia0(ub)); i <= Math.round(ib0(ub)); i++) out.push(kp(ub, i));
    for (let s = nU; s >= 0; s--) {
      const u = ua + ((ub - ua) * s) / nU;
      out.push(kp(u, Math.round(ib0(u))));
    }
    for (let i = Math.round(ib0(ua)); i >= Math.round(ia0(ua)); i--) out.push(kp(ua, i));
    return out;
  };
  // darbe yönü: meridyen teğeti (dilim boyunca)
  const meridyenYon = (x, y) => {
    const yy = K.kenet(y, 304, 553);
    const r = Math.max(8, G.kubbeR(yy));
    const u = K.kenet((x - 560) / r, -1, 1);
    const drdy = (G.kubbeR(Math.min(554, yy + 2)) - G.kubbeR(Math.max(301, yy - 2))) / 4;
    return Math.atan2(1, u * drdy);
  };
  ctx.fillStyle = K.rk(P.okr);
  ctx.fill(G.kubbeYol);
  // dilim grupları: gölge (sol), orta, güneşli (sağ), sağ kenarda dönen orta-güneşli
  const gruplar = [
    { a: 0, b: 5, renk: K.hex('#2C6C54'), mix: [P.ortaYesil, K.hex('#2E6C64')] },
    { a: 5, b: 8, renk: P.ortaYesil, mix: [P.golgeYesil, P.gunesYesil] },
    { a: 8, b: 15, renk: P.gunesYesil, mix: [P.ortaYesil, P.isikYesil] },
    { a: 15, b: 16, renk: K.rkar(P.ortaYesil, P.gunesYesil, 0.45), mix: [P.gunesYesil] },
  ];
  for (const g of gruplar) {
    const poly = kubbePoly(kab[g.a] - (g.a ? 0.004 : 0.02), kab[g.b] + (g.b < 16 ? 0.004 : 0.02), 0, prN);
    leke(poly, g.renk, { yonF: meridyenYon, en: 19, boyK: 5, sik: 0.7, titre: 0.5, hv: 0.47, adim: 8, sic: 7, mix: g.mix, mixP: 0.1, kuru: 0.3 });
  }
  // güneşin vurduğu tek, kararlı ışık lekesi (sağ üst dilimler, eğik kesilmiş alt kenar)
  {
    const ua = kab[10], ub = kab[14];
    const poly = kubbePoly(ua, ub, (u) => 17 + ((u - ua) / (ub - ua)) * 11, 55);
    leke(poly, P.isikYesil, { yonF: meridyenYon, en: 15, boyK: 4, sik: 0.7, titre: 0.8, hv: 0.55, adim: 7, sic: 6, mix: [K.hex('#93C97F'), K.hex('#B5D99A')], mixP: 0.2 });
  }
  // kaburgalar: her biri yassı fırçanın kenarıyla çekilmiş, aşağıdan yukarı incelen, yer yer kesilen tek çizgi
  for (let k = 1; k < kab.length - 1; k++) {
    const u = kab[k];
    const renk = k <= 4 ? K.rkar(P.golgeYesil, P.gunesYesil, 0.3) : k <= 7 ? K.rkar(P.golgeYesil, P.derinYesil, 0.3) : k >= 11 && k <= 12 ? K.rkar(P.ortaYesil, P.gunesYesil, 0.4) : K.rkar(P.ortaYesil, P.golgeYesil, 0.45);
    const kesit = [[2, 22, 4.6], [21, 40, 3.4], [39, 55, 2.3]];
    for (const [i0, i1, w] of kesit) {
      if (R() < 0.12) continue;
      const a0 = i0 + (R() < 0.3 ? 2 + R() * 3 : 0);
      const pts = [];
      for (let i = Math.round(a0); i <= i1; i++) pts.push(kp(u, i));
      darbe(ctx, pts, { w: w * (0.9 + R() * 0.3), renk: tonla(renk, 6, 6), jit: 5, kuru: 0.25, h, hv: 0.56, sirt: 0.1, lip: 0.08, serit: 1.2 });
    }
  }
  // dilim tepeleri: alemin altında, tepede kısa bir koyu-orta leke (dilimlerin birleştiği yer)
  leke(kubbePoly(kab[3], kab[13], 56, prN), K.rkar(P.ortaYesil, P.gunesYesil, 0.3), { yon: 0, en: 6, boyK: 4, titre: 0.3, hv: 0.5, adim: 8, sirt: 0 });
  // ışıkla gölgenin buluştuğu dilim sınırında yer yer açık kalan astar
  // siluette yer yer açık kalan astar

  // ----------------------------------------------------------------- alemler: altın lekeler
  const alem = (a) => {
    const cw = a.cubuk.x2 - a.cubuk.x1;
    K.firca(ctx, [[a.cubuk.x1 + cw / 2, a.cubuk.y2], [a.cubuk.x1 + cw / 2, a.cubuk.y1]], { w: cw * 1.1, renk: P.altin, a: 0.95, r: R, kil: 2, jit: 6, bas: 0.02, son: 0.04, uc: 0.8, h, hv: 0.34, sirt: 0.03 });
    K.firca(ctx, [[a.cubuk.x2 - cw * 0.2, a.cubuk.y2], [a.cubuk.x2 - cw * 0.2, a.cubuk.y1]], { w: cw * 0.45, renk: P.altinIsik, a: 0.95, r: R, kil: 0, bas: 0.02, son: 0.04, uc: 0.8 });
    const y = a.yaka;
    const ep = [];
    for (let i = 0; i < 16; i++) ep.push([y.cx + Math.cos((i / 16) * 6.283) * y.rx, y.cy + Math.sin((i / 16) * 6.283) * y.ry]);
    leke(ep, P.altin, { yon: 0, en: 6, boyK: 3, titre: 0.3, hv: 0.34, adim: 10, sirt: 0.03 });
    leke([[y.cx, y.cy - y.ry], [y.cx + y.rx, y.cy - y.ry * 0.2], [y.cx + y.rx * 0.6, y.cy + y.ry * 0.3], [y.cx, y.cy]], P.altinIsik, { yon: 0, en: 5, titre: 0.3, adim: 8, hv: 0.35, sirt: 0 });
    for (const k of a.kureler) {
      const kp2 = [];
      for (let i = 0; i < 14; i++) kp2.push([k.cx + Math.cos((i / 14) * 6.283) * k.r, k.cy + Math.sin((i / 14) * 6.283) * k.r]);
      leke(kp2, P.altinKoyu, { yon: 0.5, en: 6, boyK: 2, titre: 0.3, hv: 0.34, adim: 8, sirt: 0.03 });
      const ip = [];
      for (let i = 0; i <= 8; i++) {
        const an = -2.2 + (i / 8) * 2.9;
        ip.push([k.cx + Math.cos(an) * k.r, k.cy + Math.sin(an) * k.r]);
      }
      ip.push([k.cx - k.r * 0.2, k.cy + k.r * 0.25]);
      leke(ip, P.altin, { yon: 0.5, en: 6, boyK: 2, titre: 0.2, hv: 0.34, adim: 8, sirt: 0.03 });
      const sp = [];
      for (let i = 0; i < 8; i++) sp.push([k.cx + k.r * 0.35 + Math.cos((i / 8) * 6.283) * k.r * 0.28, k.cy - k.r * 0.35 + Math.sin((i / 8) * 6.283) * k.r * 0.28]);
      leke(sp, P.altinIsik, { yon: 0.5, en: 4, boyK: 2, titre: 0.2, hv: 0.35, sirt: 0, adim: 6 });
    }
    const hp = G.hilal(a);
    leke(hp, P.altin, { yon: 0.3, en: 6, boyK: 2, titre: 0.2, hv: 0.34, adim: 8, sirt: 0.03 });
    const H = a.hilal;
    const sag = hp.filter(([x]) => x > H.cx + H.R * 0.2);
    if (sag.length > 3) leke(sag, P.altinIsik, { yon: 0.3, en: 4, boyK: 2, titre: 0.2, sirt: 0, adim: 6, hv: 0.35 });
  };
  alem(G.alemK);
  alem(G.alemM);

  // ----------------------------------------------------------------- bitkiler
  for (const s of S.bitki.saplar) {
    darbe(ctx, s, { w: 4.8, renk: tonla(P.golgeYesil, 8, 8), jit: 9, kuru: 0.12, h, hv: 0.5, sirt: 0.08, serit: 1.6, nefes: 0.12, profil: (t) => 1 - 0.3 * t });
    K.firca(ctx, s.map(([x, y]) => [x + 1.4, y]), { w: 1.8, renk: P.gunesYesil, a: 0.92, r: R, kil: 0, bas: 0.05, son: 0.1, uc: 0.6 });
  }
  S.bitki.tomurcuklar.forEach((t, i) => {
    if (i < 8) return;
    const pts = [];
    for (let k = 0; k <= 5; k++) pts.push([t.x - Math.cos(t.aci) * (t.r * 0.6 + k * 5), t.y - Math.sin(t.aci) * (t.r * 0.6 + k * 5)]);
    K.firca(ctx, pts, { w: 3.6, renk: P.golgeYesil, a: 0.95, r: R, kil: 2, jit: 6, h, hv: 0.5 });
  });
  // yapraklar: damarın iki yanı iki leke; her yarı, dipte bastırılıp uca doğru kaldırılan tek dolu darbe.
  // Yaprağın kenarı darbelerin kendi kenarıdır; iki darbenin buluştuğu yerde damar kendiliğinden kalır.
  for (const y of S.bitki.yapraklar) {
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const Lf = y.uzunluk, W = Lf * y.genislik;
    const vLit = -sa * 0.7 + ca * -0.7 > 0 ? 1 : -1;
    const on = Lf > 50;
    const koyu = on ? P.golgeYesil : P.ortaYesil;
    const acik = on ? K.rkar(P.ortaYesil, P.gunesYesil, 0.35) : P.gunesYesil;
    const sicak = (R() - 0.5) * 16; // yaprak yaprak hafif sarı ya da mavi yeşil
    const P2 = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const sira = vLit > 0 ? [-1, 1] : [1, -1]; // önce gölge yarısı, sonra ışık yarısı
    const yaprakProf = (t) => (t < 0.3 ? 0.18 + 0.82 * Math.sqrt(t / 0.3) : t > 0.4 ? Math.max(0.03, Math.pow((1 - t) / 0.6, 0.8)) : 1);
    for (const yan of sira) {
      const lit = yan === vLit;
      const pts = [];
      for (let k = 0; k <= 8; k++) {
        const t = k / 8;
        // yarım yaprak biçimi: dipte ve uçta damara yakın, ortada dışa doğru
        const v = yan * W * 0.25 * Math.sin(Math.PI * Math.pow(t, 0.85)) * 1.05;
        pts.push(P2(Lf * (t * 1.03 - 0.01), v));
      }
      const tb = lit ? acik : koyu;
      darbe(ctx, pts, { w: W * 0.56, renk: tonla([tb[0] + sicak, tb[1], tb[2] - sicak], 9, 6), mix: lit ? P.gunesYesil : P.derinYesil, mixP: 0.3, jit: 9, kuru: 0.05, h, hv: 0.5, sirt: 0.07, lip: 0.05, serit: 2.6, nefes: 0.04, profil: yaprakProf });
      // ışık yarısında, dipten ortaya kadar ikinci, daha açık ve dar bir darbe (üçüncü ton)
      if (lit && Lf > 34 && R() < 0.6) {
        const p2 = [];
        for (let k = 0; k <= 6; k++) {
          const t = 0.1 + (k / 6) * (0.42 + R() * 0.12);
          p2.push(P2(Lf * t, yan * W * 0.3 * Math.sin(Math.PI * Math.pow(t, 0.85))));
        }
        darbe(ctx, p2, { w: W * 0.2, renk: tonla(K.rkar(acik, P.isikYesil, on ? 0.25 : 0.35), 8, 6), jit: 7, kuru: 0.45, h, hv: 0.56, sirt: 0.06, serit: 2.2, profil: (t) => 0.5 + 0.5 * Math.sin(Math.PI * Math.min(1, t * 1.3)) });
      }
    }
  }
  for (const t of S.bitki.tomurcuklar) {
    const poly = K.duz(S.tomurcukYolu(t), 1.5)[0];
    leke(poly, P.beyaz, { yon: t.aci, en: 8, boyK: 2, titre: 0.4, hv: 0.6, adim: 8 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    leke([[t.x - ca * t.r, t.y - sa * t.r], [t.x + sa * t.r, t.y - ca * t.r], [t.x + ca * t.r * 0.2, t.y + sa * t.r * 0.2], [t.x - sa * t.r, t.y + ca * t.r]], P.ortaYesil, { yon: t.aci, en: 6, boyK: 2, titre: 0.3, adim: 6 });
  }
  // çiçekler: her taç yaprağı uçtan göbeğe çekilmiş bir iki dolu darbe; ışıktan uzak yanda tek leylak gölge
  // lekesi; ortada kalın sarı bir nokta
  const cicekGolge = K.rkar(K.hex('#B2B0D3'), P.beyaz, 0.42);
  const cs = S.bitki.cicekler.slice().sort((a, b) => a.r - b.r);
  for (const cc of cs) {
    const yap = [];
    for (let i = 0; i < 5; i++) {
      const a = cc.aci + (i * Math.PI * 2) / 5;
      yap.push({ a, poly: kesik(K.tacYaprak(cc.x, cc.y, a, cc.r * 1.0, cc.r * 0.96, 0.06), 0.7, Math.max(5, cc.r * 0.26)) });
    }
    const birlik = new Path2D();
    for (const t of yap) birlik.addPath(K.p2d([t.poly]));
    // sağ üstten başlayıp sırayla: komşu yapraklar üst üste biner
    yap.sort((p, q) => Math.sin(p.a - 0.6) - Math.sin(q.a - 0.6));
    for (const t of yap) {
      const yol = K.p2d([t.poly]);
      ctx.save();
      ctx.clip(yol);
      h.save();
      h.clip(yol);
      ctx.fillStyle = K.rk(P.beyaz);
      ctx.fill(yol);
      h.fillStyle = gri(0.47);
      h.fill(yol);
      const ns = cc.r > 40 ? 3 : 2;
      const ca = Math.cos(t.a), sa = Math.sin(t.a);
      for (let k = 0; k < ns; k++) {
        const v = ((k + 0.5) / ns - 0.5) * cc.r * 0.6;
        const Q = (u, vv) => [cc.x + u * ca - vv * sa, cc.y + u * sa + vv * ca];
        const pts = [Q(cc.r * 1.1, v * 1.05), Q(cc.r * 0.6, v * 0.95), Q(cc.r * 0.08, v * 0.4)];
        darbe(ctx, pts, { w: ((cc.r * 0.62) / ns) * 1.45, renk: tonla(P.beyaz, 9, 8), mix: R() < 0.5 ? K.hex('#EFE4CC') : K.hex('#E2E2EE'), mixP: 0.35, jit: 7, kuru: 0.3, h, hv: 0.49, sirt: 0.08, lip: 0.1 });
      }
      h.restore();
      ctx.restore();
    }
    // gölge lekesi: ışığa dik bir sınırla kesilmiş sol alt yarı
    {
      const ux = 0.7071, uy = -0.7071; // ışık yönü (sağ üst)
      const off = cc.r * 0.04;
      const px = -uy, py = ux;
      const big = cc.r * 1.5;
      const m0 = [cc.x + ux * off, cc.y + uy * off];
      const gp = [
        [m0[0] + px * big, m0[1] + py * big],
        [m0[0] + px * big - ux * big, m0[1] + py * big - uy * big],
        [m0[0] - px * big - ux * big, m0[1] - py * big - uy * big],
        [m0[0] - px * big, m0[1] - py * big],
      ];
      ctx.save();
      ctx.clip(birlik);
      h.save();
      h.clip(birlik);
      leke(gp, cicekGolge, { yon: Math.atan2(py, px), en: Math.max(7, cc.r * 0.36), boyK: 3, titre: 0.6, hv: 0.48, adim: 7, sic: 6, mix: [K.hex('#C9C6DF')], mixP: 0.25, sirt: 0 });
      h.restore();
      ctx.restore();
    }
    // sarı orta nokta: düz, mat bir leke; sol altında okr gölge lekesi, sağ üstünde açık bir dokunuş
    {
      const rr = cc.r * 0.2;
      const nzc = R() * 6.28;
      const blob = (ox, oy, r0) => {
        const op = [];
        for (let i = 0; i < 20; i++) {
          const a = (i / 20) * 6.283;
          const q = r0 * (0.93 + 0.08 * Math.sin(a * 2 + nzc) + R() * 0.03);
          op.push([cc.x + ox + Math.cos(a) * q, cc.y + oy + Math.sin(a) * q]);
        }
        return K.p2d([op]);
      };
      const oy = blob(0, 0, rr);
      ctx.fillStyle = K.rk(P.sari);
      ctx.fill(oy);
      h.fillStyle = gri(0.52);
      h.fill(oy);
      // gölge yarısı: ışığa dik, düz bir sınırla kesilmiş okr leke (küre gölgesi değil)
      ctx.save();
      ctx.clip(oy);
      const tx = cc.x - rr * 0.12, ty = cc.y + rr * 0.12;
      ctx.beginPath();
      ctx.moveTo(tx - rr * 2, ty - rr * 2);
      ctx.lineTo(tx + rr * 2, ty + rr * 2 + (R() - 0.5) * rr * 0.3);
      ctx.lineTo(tx - rr * 2, ty + rr * 2);
      ctx.closePath();
      ctx.fillStyle = K.rk(K.hex('#D2A136'));
      ctx.fill();
      ctx.restore();
    }
  }

  // ----------------------------------------------------------------- boya kabartısı, yağlı parıltı ve el
  const pano = (() => {
    const n = K.gurultu(91);
    return (x, y) => (n.fbm(x / 7, y / 7, 2) - 0.5) * 0.03;
  })();
  // iki ölçekte ışık: ince (kıl olukları, sırtlar) ve geniş (darbe gövdelerinin kabartısı)
  {
    const N = K.N;
    const oku = (bl) => {
      const t = S.yeniTuval(N, N);
      const tx = t.getContext('2d', { willReadFrequently: true });
      tx.filter = `blur(${bl}px)`;
      tx.drawImage(hc, 0, 0);
      tx.filter = 'none';
      const d = tx.getImageData(0, 0, N, N).data;
      const o = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) o[i] = d[i * 4];
      return o;
    };
    const H1 = oku(1.3), H2 = oku(3.5);
    const im = ctx.getImageData(0, 0, N, N);
    const d = im.data;
    const g1 = 0.0052, g2 = 0.0085, par = 0.3, pe = 0.13;
    for (let y = 2; y < N - 2; y++) {
      for (let x = 2; x < N - 2; x++) {
        const j = y * N + x;
        const s1 = (-(H1[j + 1] - H1[j - 1]) * 0.7 + (H1[j + N] - H1[j - N]) * 0.7) * g1;
        const s2 = (-(H2[j + 2] - H2[j - 2]) * 0.7 + (H2[j + 2 * N] - H2[j - 2 * N]) * 0.7) * g2 * 0.5;
        const s = s1 + s2 + pano(x, y);
        const i = j * 4;
        const m = 1 + s;
        d[i] *= m;
        d[i + 1] *= m;
        d[i + 2] *= m;
        if (s > pe) {
          const q = (s - pe) * par * 255;
          d[i] += q;
          d[i + 1] += q;
          d[i + 2] += q * 0.95;
        }
      }
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(im, 0, 0);
    ctx.restore();
  }
  K.titret(ctx, 1.4, 80, 31);
  S.hazir();
})();

</script>
