<script>
// S-043 Yumurta Temperası — 14. yüzyıl İtalyan pano resmi (Duccio, Fra Angelico): alçı astarlı ahşap pano, gök
// yerine zımbalanmış ve oyulmuş varak altın zemin, altın yaldızlı çerçeve. Biçimler karıştırılmadan, ince kısa
// tarama darbeleriyle kurulur; taşın gölgesinde yeşil toprak (terre verte) alt boyası görünür. Mat, ışıklı mücevher
// renkleri (malakit yeşili, zinober, lacivert), kubbe kaburgalarında mordan altın çizgiler, yüzeyde ince çatlak ağı.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const css = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Değer gürültüsü (0..1), 256'lık döşemeli tablo. */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32, w×h), yalnız [y0,y1] satır aralığında. */
  function kutu(src, w, h, r, y0, y1) {
    y0 = Math.max(0, y0 || 0); y1 = Math.min(h - 1, y1 === undefined ? h - 1 : y1);
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    const ya = Math.max(0, y0 - r), yb = Math.min(h - 1, y1 + r);
    for (let y = ya; y <= yb; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = y0 - r; y <= y0 + r; y++) acc += tmp[clamp(y, ya, yb) * w + x];
      for (let y = y0; y <= y1; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(yb, y + r + 1) * w + x] - tmp[Math.max(ya, y - r) * w + x]; }
    }
    return out;
  }
  function bulanik(src, w, h, r, gecis, y0, y1) {
    let a = src;
    for (let g = 0; g < (gecis || 3); g++) a = kutu(a, w, h, r, y0 === undefined ? 0 : y0 - r * 3, y1 === undefined ? h - 1 : y1 + r * 3);
    return a;
  }
  /** Tuvale çizilen biçimlerden kapsama maskesi (0..1). s: ölçek. Dönen: {m, y0, y1} (piksel satırları). */
  function maskeYap(s, ciz) {
    const n = W * s, c = SAHNE.yeniTuval(n, n), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(s, 0, 0, s, 0, 0);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    ciz(g);
    const d = g.getImageData(0, 0, n, n).data, m = new Float32Array(n * n);
    let y0 = n, y1 = -1;
    for (let y = 0; y < n; y++) {
      let var_ = false; const o = y * n;
      for (let x = 0; x < n; x++) { const a = d[(o + x) * 4 + 3]; if (a) { m[o + x] = a / 255; var_ = true; } }
      if (var_) { if (y < y0) y0 = y; y1 = y; }
    }
    return { m, y0, y1 };
  }
  // ------------------------------------------------------------ ışık modeli (ışık sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const KUBBE = (() => {
    const prof = SAHNE.kubbeProfili(800), adim = 4, R = new Float32Array(256 * adim + 1), D = new Float32Array(256 * adim + 1);
    for (let k = 0; k <= 255 * adim; k++) {
      const y = 300 + k / adim;
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
      R[k] = a.r + (b.r - a.r) * t;
    }
    for (let k = 1; k < 255 * adim; k++) D[k] = (R[k + 1] - R[k - 1]) * adim / 2;
    D[0] = D[1] * 1.4; D[255 * adim] = D[255 * adim - 1];
    const ix = (y) => clamp(Math.round((y - 300) * adim), 0, 255 * adim);
    return {
      r: (y) => R[ix(y)],
      u: (x, y) => clamp((x - 560) / Math.max(0.5, R[ix(y)]), -1, 1),
      normal(x, y) {
        const k = ix(y), u = clamp((x - 560) / Math.max(0.5, R[k]), -1, 1), c = Math.sqrt(1 - u * u), d = D[k], l = Math.hypot(u, d, c);
        return [u / l, -d / l, c / l];
      },
      isik(x, y) { const n = this.normal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); },
      /** kaburga fazı: boylamın 16 dilimdeki konumu (tam sayıya yakınsa kaburga çizgisi) */
      faz(x, y) { const u = this.u(x, y); return (Math.asin(u) + Math.PI / 2) / (Math.PI / 16); },
    };
  })();
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25;
    if (y >= 146) { const t = (200 - y) / 54; return Math.max(2, 24 * Math.sin(Math.min(1, t * 1.25) * Math.PI * 0.62 + 0.55) * (1 - t * 0.55)); }
    return 3;
  }
  const kasnakIsik = (x, y) => (y < 610 ? silindirIsik(x, 560, 208) : silindirIsik(x, 560, 226));

  const S = 2, WW = W * S, N = WW * WW, N1 = W * W;
  const tuval = document.getElementById('tuval');
  tuval.getContext('2d', { willReadFrequently: true });
  const ctx = SAHNE.tuval(tuval, S);
  const Y = SAHNE.yollar();
  const P = (d) => new Path2D(d);
  const R = SAHNE.rng(4343);
  const nA = gurultu(61), nB = gurultu(62), nC = gurultu(63);
  const L2 = [0.74, -0.67];

  // ------------------------------------------------------------ bölge haritası (bitkisiz)
  const ADLAR = Object.keys(SAHNE.BOLGE), BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N1);
  {
    const c = SAHNE.yeniTuval(), g = c.getContext('2d', { willReadFrequently: true });
    SAHNE.ciz(g, { bolge: true, cicek: false });
    const v = g.getImageData(0, 0, W, W).data, onb = new Map();
    for (let i = 0; i < N1; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key); if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    }
  }
  const bolge = (x, y) => ADLAR[BOL[clamp(y | 0, 0, W - 1) * W + clamp(x | 0, 0, W - 1)]];

  // ------------------------------------------------------------ çerçeve ve panel ölçüleri
  const CER = 30, PX0 = 34, PX1 = 990, PY0 = 34, PY1 = 990, UFUK = 800;
  const SINIR_I = PX0 + 24; // zımbalı bordürün iç kenarı

  // ------------------------------------------------------------ zımba ve oyma: yükseklik tuvali
  const zc = SAHNE.yeniTuval(WW, WW), zg = zc.getContext('2d', { willReadFrequently: true });
  zg.setTransform(S, 0, 0, S, 0, 0); zg.fillStyle = 'rgb(200,200,200)'; zg.fillRect(0, 0, W, W);
  const zimba = (x, y, r, d) => { zg.fillStyle = `rgb(${d},${d},${d})`; zg.beginPath(); zg.arc(x, y, r, 0, Math.PI * 2); zg.fill(); };
  const rozet = (x, y, r) => { zimba(x, y, r * 0.42, 110); for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2; zimba(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.34, 120); } };
  const oyma = (pts, lw) => { zg.strokeStyle = 'rgb(90,90,90)'; zg.lineWidth = lw || 1; zg.lineCap = 'round'; zg.beginPath(); pts.forEach(([x, y], i) => (i ? zg.lineTo(x, y) : zg.moveTo(x, y))); zg.stroke(); };
  // bordür: iki oyma çizgi arasında rozet ve nokta dizisi (üst, sol, sağ)
  {
    const a = PX0 + 4, b = SINIR_I, m = (a + b) / 2, alt = UFUK - 10;
    oyma([[a, alt], [a, a], [W - a, a], [W - a, alt]], 0.9);
    oyma([[b, alt], [b, b], [W - b, b], [W - b, alt]], 0.9);
    const yol = [];
    for (let x = m; x <= W - m; x += 1) yol.push([x, m]);
    const dizi = (x0, y0, x1, y1) => { const l = Math.hypot(x1 - x0, y1 - y0), n = Math.round(l / 24); for (let k = 0; k <= n; k++) { const t = k / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t; rozet(x, y, 5.2); if (k < n) { const x2 = x + (x1 - x0) / n / 2, y2 = y + (y1 - y0) / n / 2; zimba(x2, y2, 1.6, 120); } } };
    dizi(m, m, W - m, m); dizi(m, m + 24, m, alt - 6); dizi(W - m, m + 24, W - m, alt - 6);
    // iç kenar boyunca ince nokta sırası
    for (let x = b + 4; x <= W - b - 4; x += 4.2) zimba(x, b + 4, 1.05, 130);
    for (let y = b + 8; y <= alt; y += 4.2) { zimba(b + 4, y, 1.05, 130); zimba(W - b - 4, y, 1.05, 130); }
  }
  // güneş: tanecikli (granitura) disk, oyma halkalar, zımba halkası, ışınlar
  {
    const cx = 880, cy = 140;
    for (let r = 2; r < 46; r += 2.6) { const n = Math.max(1, Math.round((2 * Math.PI * r) / 2.7)); for (let k = 0; k < n; k++) { const a = (k / n) * Math.PI * 2 + r; zimba(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0.95, 120); } }
    const halka = (r) => { const pts = []; for (let k = 0; k <= 120; k++) { const a = (k / 120) * Math.PI * 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } oyma(pts, 1); };
    halka(49); halka(54);
    for (let k = 0; k < 44; k++) { const a = (k / 44) * Math.PI * 2; zimba(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60, 2.1, 115); }
    for (let k = 0; k < 32; k++) { const a = (k / 32) * Math.PI * 2 + 0.05, r1 = k % 2 ? 108 : 132; oyma([[cx + Math.cos(a) * 68, cy + Math.sin(a) * 68], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], 1.1); if (!(k % 2)) zimba(cx + Math.cos(a) * (r1 + 6), cy + Math.sin(a) * (r1 + 6), 2.3, 115); }
  }
  const ZH = new Float32Array(N);
  { const d = zg.getImageData(0, 0, WW, WW).data; for (let i = 0; i < N; i++) ZH[i] = d[i * 4] / 255; }
  const ZHb = bulanik(ZH, WW, WW, 1, 2);

  // ------------------------------------------------------------ 1. geçiş: varak altın zemin ve yaldızlı çerçeve (piksel)
  const ALTIN = [[0, [84, 52, 18]], [0.32, [160, 112, 38]], [0.56, [212, 164, 66]], [0.78, [242, 210, 124]], [1, [255, 244, 196]]];
  const BOLE = [150, 58, 38];
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  // varak yaprakları elle döşenmiş: sıra yükseklikleri, yaprak genişlikleri ve sıra eğimi hafifçe değişir,
  // birleşim yerleri sıradan sıraya kayar (düzenli tuğla ızgarası değil)
  const SIRA = [];
  {
    const rv = SAHNE.rng(4344);
    let yy = PY0 - 30 - rv() * 40;
    while (yy < PY1 + 100) {
      const sira = { y0: yy, egim: (rv() - 0.5) * 0.014, kol: [] };
      let xx = PX0 - 20 - rv() * 70;
      while (xx < PX1 + 120) { sira.kol.push(xx); xx += 72 + rv() * 22; }
      sira.kol.push(xx);
      SIRA.push(sira); yy += 74 + rv() * 20;
    }
  }
  const BOLE_C = [170, 74, 46];
  const altinRenk = (X, Yy, i, ek) => {
    // sıra: eğim ve hafif dalga ile kaydırılmış y'ye göre
    let sat = 0;
    const yk = (q) => SIRA[q].y0 + SIRA[q].egim * (X - 512) + (nA(X / 120, q * 3.1) - 0.5) * 3;
    while (sat < SIRA.length - 2 && Yy >= yk(sat + 1)) sat++;
    const sr = SIRA[sat], fy = Yy - yk(sat);
    let sut = 0; while (sut < sr.kol.length - 2 && X >= sr.kol[sut + 1] + fy * 0.012) sut++;
    const fx = X - sr.kol[sut] - fy * 0.012;
    let v = 0.54 + (hash(sut + sat * 31, sat) - 0.5) * 0.1 + (fbm(nA, X / 170, Yy / 170, 3) - 0.5) * 0.5 + ek;
    v += (nB(X / 6, Yy / 40) - 0.5) * 0.05; // ince kırışık
    const ek1 = Math.min(fx, fy);
    if (ek1 < 1.1) v -= 0.1 * (1 - ek1 / 1.1);
    else if (ek1 < 3) v += 0.04;
    // zımba/oyma kabartısı
    const xa = i - 1, xb = i + 1, ya = i - WW, yb = i + WW;
    const gx = (ZHb[xb] - ZHb[xa]) * 9, gy = (ZHb[yb] - ZHb[ya]) * 9, nl = Math.hypot(gx, gy, 1);
    const dif = (-gx * LV[0] - gy * LV[1] + LV[2]) / nl;
    v += (dif - LV[2]) * 1.15 - (0.78 - ZHb[i]) * 0.5;
    let c = rampa(ALTIN, clamp(v, 0, 1));
    // aşınma 1: kenar ve köşelerde altın incelmiş, alttaki kırmızı bolus yumuşak, sıcak bir ton olarak sezilir
    const kd = Math.min(X - PX0, PX1 - X, Yy - PY0), kose = Math.min(Math.hypot(X - PX0, Yy - PY0), Math.hypot(PX1 - X, Yy - PY0));
    const ovul = sstep(46, 0, kd) * 0.55 + sstep(150, 0, kose) * 0.5;
    if (ovul > 0) c = mixc(c, mixc(BOLE_C, c, 0.45), clamp(ovul * sstep(0.35, 0.7, fbm(nC, X / 60, Yy / 60, 2)), 0, 0.42));
    // aşınma 2: bazı yaprak birleşimlerinde, birleşim boyunca kesik kesik ince sıcak kırmızı bolus çizgisi
    const ust = fy < fx, dikis = ust ? hash(sat * 7 + 3, sut * 13 + 1) : hash(sut * 11 + 5, sat * 17 + 2);
    if (dikis < 0.4 && ek1 < 1.5) {
      const boy = ust ? X : Yy, parca = sstep(0.42, 0.62, nB(boy / 26 + dikis * 50, ust ? 3.7 : 8.3));
      c = mixc(c, BOLE_C, parca * 0.72 * (1 - sstep(0.6, 1.5, ek1)));
    }
    return c;
  };
  {
    const img = ctx.createImageData(WW, WW), d = img.data;
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x, X = x / S, Yy = y / S;
      const ic = Math.min(X, Yy, W - X, W - Yy);
      let c;
      if (ic < CER) {
        // çerçeve profili: dış düz, oluk, boncuk; ışık sağ üstten (üst ve sağ kenar daha parlak)
        const t = ic / CER;
        const taraf = X > Yy ? (W - X < Yy ? 1.12 : 1.04) : (W - Yy < X ? 0.78 : 0.86);
        const prof = t < 0.28 ? 0.62 : t < 0.62 ? 0.42 + 0.35 * Math.sin(((t - 0.28) / 0.34) * Math.PI) : t < 0.84 ? 0.55 + 0.4 * Math.sin(((t - 0.62) / 0.22) * Math.PI) : 0.45;
        let v = prof * taraf + (fbm(nA, X / 30, Yy / 30, 3) - 0.5) * 0.18;
        c = rampa(ALTIN, clamp(v, 0, 1));
        // çerçevede aşınma: yalnız çıkıntılı profillerde (boncuk, dış kenar), yumuşak ve sıcak
        const cikinti = t < 0.1 || (t > 0.66 && t < 0.8) ? 1 : 0.25;
        c = mixc(c, mixc(BOLE, c, 0.4), cikinti * 0.4 * sstep(0.5, 0.72, fbm(nC, X / 50, Yy / 50, 2)));
      } else if (ic < PX0) {
        c = [176, 40, 30]; // zinober fileto
        c = mixc(c, [120, 30, 24], (nA(X / 4, Yy / 4) - 0.5) * 0.6 + 0.2);
      } else {
        c = altinRenk(X, Yy, i, (fbm(nB, X / 400, Yy / 400, 2) - 0.5) * 0.2 + 0.06 * (X - Yy) / 1000);
      }
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // ------------------------------------------------------------ tarama yardımcıları
  const panel = new Path2D(); panel.rect(PX0, PY0, PX1 - PX0, PY1 - PY0);
  function cizgi(x0, y0, x1, y1, c, a, lw) { ctx.strokeStyle = css(c, a); ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
  /**
   * Bölgeyi kısa, paralel tarama darbeleriyle doldurur. yon(x,y) → açı; renk(x,y) → [r,g,b] ya da null (darbe yok).
   * yatay: satır satır (yatay yönler için), değilse sütun sütun.
   */
  function tara(yol, bb, yon, renk, o) {
    const ara = o.ara || 2.2, boy = o.boy || 7, lw = o.lw || 1.05, a = o.a === undefined ? 0.9 : o.a, ic = o.ic, jt = o.jit === undefined ? 0.07 : o.jit;
    ctx.save(); ctx.clip(panel); if (yol) ctx.clip(yol); ctx.lineCap = 'round';
    const [x0, y0, x1, y1] = bb;
    if (!o.yatay) {
      for (let x = x0; x <= x1; x += ara) {
        let y = y0 - R() * boy;

      for (let jj = cj - 1; jj <= cj + 1; jj++) for (let ii = ci - 1; ii <= ci + 1; ii++) {
        if (ii < 0 || jj < 0 || ii >= nx || jj >= ny) continue;
        const k = jj * nx + ii, dx = (wx - cxs[k]) / HX * 20, dy = (wy - cys[k]) / HY * 20, dd = dx * dx + dy * dy;
        if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) d2 = dd;
      }
      const kenar = Math.sqrt(d2) - Math.sqrt(d1);
      const kir = fbm(nC, X / 22, Yy / 22, 2);
      let cat = (1 - sstep(0.0, 0.85, kenar)) * sstep(0.38, 0.5, kir);
      const ince = (1 - sstep(0, 0.5, Math.abs(fbm(nA, X / 9 + 40, Yy / 9, 2) - 0.5) * 30)) * 0.35 * sstep(0.45, 0.6, kir);
      cat = Math.max(cat * 0.55, ince);
      let r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
      // çatlak: koyu kir çizgisi, kenarında hafif açık kalkma
      r = r * (1 - cat * 0.45) + 30 * cat * 0.2; g = g * (1 - cat * 0.48) + 22 * cat * 0.2; b = b * (1 - cat * 0.52) + 14 * cat * 0.2;
      // vernik: hafif sıcak, yaşlanmış ton ve ince alçı tanesi
      const tane = 1 + (nC(X * 1.7, Yy * 1.7) - 0.5) * 0.05;
      d[i * 4] = clamp(r * 0.99 * tane + 3, 0, 255); d[i * 4 + 1] = clamp(g * 0.97 * tane + 1, 0, 255); d[i * 4 + 2] = clamp(b * 0.9 * tane, 0, 255);
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
