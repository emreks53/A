<script>
// S-067 Batik — pamuklu bez üstüne mumla boyama (Cava batik resmi): tjanting ile çekilmiş krem mum çizgileri ve
// isen-isen dolgular (cecek noktaları, sawut çizgileri, pirinç taneleri), açıktan koyuya üst üste boya katmanları

// (crackle), mum altına düzensizce sızan boya haleleri, görünen pamuk örgüsü, kat izleri ve tumpal bordür.

// kayma, lekeli boya halesi, çatlak ağı, boya alımındaki dalgalanma ve bez örgüsü uygulanır.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  const karR = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;

      }

    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // SVG yolunu nokta dizilerine çevir (her alt yol ayrı)
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  svgEl.setAttribute('style', 'position:absolute;left:-3000px;top:0;width:10px;height:10px');
  const yolEl = document.createElementNS(svgNS, 'path');
  svgEl.appendChild(yolEl); document.body.appendChild(svgEl);
  function yolNoktalari(d, adim) {
    const parca = d.split(/(?=M)/).filter((s) => s.trim());

  // bölge haritası, istenen ölçekte (S × 1024): Uint8Array bölge sırası
  const BADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; BADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(S, donustur) {

  // ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const PROF = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(1024), kubbeDr = new Float32Array(1024);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < PROF.length - 2 && PROF[j + 1].y > y) j++;

  function silindirIsik(x, cx, yr) {

    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;

  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(6701);
  const nA = gurultu(21), nB = gurultu(22), nC = gurultu(23), nD = gurultu(24), nE = gurultu(25), nF = gurultu(26);

  // boya katmanları (açıktan koyuya): bezin kremi, zerdeçal-okra, açık soga, kök boya kırmızısı, yeşil, çivit kademeleri, soga
  const K = {
    krem: '#F1E4C3', okraAcik: '#E6C88A', okra: '#D29B45', sogaAcik: '#B87A43', soga: '#6E4224', sogaKoyu: '#4A2C1C',
    kizil: '#8E2F21', tas: '#E2C994', tasKoyu: '#C8A26C',
    acikYesil: '#8AA95B', yesil: '#3F7A4E', koyuYesil: '#24513F', yaprak: '#2F5F49',
    gok0: '#EAD8A6', gok1: '#B5C7CF', gok2: '#86A2BC', gok3: '#56729D', gok4: '#384F80',
    mavi: '#3D5A8A', civit: '#1A2240',
  };
  const D = SAHNE.yeniTuval(W2, W2), g = D.getContext('2d', { willReadFrequently: true });
  const yol = (d) => new Path2D(d);
  const doldur = (d, c) => { g.fillStyle = c; g.fill(typeof d === 'string' ? yol(d) : d); };
  const cek = (d, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.stroke(typeof d === 'string' ? yol(d) : d); };
  const nokta = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const cizgi = (x0, y0, x1, y1, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  // cecek: tjanting noktası, elle konduğu için hafif kayık ve boyu değişken
  const cecek = (x, y, r, c) => nokta(x + (R() - 0.5) * 0.7, y + (R() - 0.5) * 0.7, r * (0.8 + R() * 0.4), c);
  const Y = SAHNE.yollar();
  const KR = 46; // bordür genişliği

  // ------------------------------------------------------------ gök: güneşten uzaklaştıkça koyulaşan çivit kademeleri
  {
    const img = g.createImageData(W2, W2), v = img.data;
    const kad = [K.gok0, K.gok1, K.gok2, K.gok3, K.gok4].map(hex), kremR = hex(K.krem);
    const esik = [185, 400, 590, 790];
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const X = x / S, Yy = y / S;
      const f = Math.hypot(X - 880, Yy - 140) - 0.15 * (Yy - 140) + (fbm(nF, X / 150, Yy / 150, 3) - 0.5) * 60 + (nA(X / 14, Yy / 14) - 0.5) * 7;
      let k = 0; while (k < 4 && f > esik[k]) k++;
      // kademe sınırında ince krem mum çizgisi (bir sonraki boya banyosundan önce çekilmiş)
      const sinir = Math.min(k > 0 ? f - esik[k - 1] : 99, k < 4 ? esik[k] - f : 99);
      const c = sinir < 0.8 ? kremR : kad[k], i = (y * W2 + x) * 4;
      v[i] = c[0]; v[i + 1] = c[1]; v[i + 2] = c[2]; v[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  g.setTransform(S, 0, 0, S, 0, 0);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // gökte isen: üçlü ve yedili cecek kümeleri (cecek telu, cecek pitu), seyrek ve elle dağılmış
  {
    const rr = SAHNE.rng(77);
    const yer = [];
    for (let k = 0; k < 2600 && yer.length < 260; k++) {
      const x = 60 + rr() * 904, y = 60 + rr() * 720;
      if (Math.hypot(x - 880, y - 140) < 150) continue;
      if (yer.some((p) => Math.hypot(p[0] - x, p[1] - y) < 38)) continue;
      yer.push([x, y]);
      const a = rr() * Math.PI * 2;
      if (rr() < 0.4) { // cecek pitu: altı nokta çevrede, biri ortada
        for (let j = 0; j < 6; j++) cecek(x + Math.cos(a + j * Math.PI / 3) * 4.6, y + Math.sin(a + j * Math.PI / 3) * 4.6, 1.6, K.krem);
        cecek(x, y, 1.9, K.krem);
      } else for (let j = 0; j < 3; j++) cecek(x + Math.cos(a + j * 2.094) * 3.6, y + Math.sin(a + j * 2.094) * 3.6, 1.7, K.krem);
    }
  }
  // mega mendung bulutları: dilimli bulut, dıştan içe koyudan açığa bantlar, aralarında krem mum çizgileri
  const BULUTLAR = [
    { lob: [[90, 250, 30], [130, 232, 38], [178, 226, 42], [225, 236, 34], [258, 252, 24], [150, 262, 30], [205, 262, 28], [70, 266, 18]] },
    { lob: [[440, 150, 24], [474, 134, 32], [514, 128, 34], [552, 138, 28], [580, 154, 18], [494, 160, 24], [536, 162, 22]] },
    { lob: [[790, 352, 22], [822, 336, 30], [860, 330, 32], [898, 340, 26], [928, 356, 18], [842, 360, 22], [884, 362, 20]] },
    { lob: [[60, 470, 18], [86, 458, 26], [118, 454, 26], [146, 466, 18], [100, 478, 18]] },
    { lob: [[870, 490, 16], [896, 478, 22], [926, 476, 22], [952, 488, 15], [910, 496, 16]] },
    { lob: [[620, 236, 14], [642, 226, 19], [668, 224, 19], [690, 234, 13], [656, 240, 14]] },
  ];
  // tam öklid uzaklık dönüşümü (Felzenszwalb): bant konturları bulutun dış çizgisini izlesin
  function edt1(f, n) {
    const d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s2 = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s2 <= z[k]) { k--; s2 = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s2; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    return d;
  }
  function edt(M, w, h) { // M: 1 içeride → içerideki her pikselin dışarıya uzaklığı
    const INF = 1e12, D = new Float32Array(w * h);
    const col = new Float32Array(h);
    for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) col[y] = M[y * w + x] ? INF : 0; const d = edt1(col, h); for (let y = 0; y < h; y++) D[y * w + x] = d[y]; }
    const row = new Float32Array(w);
    for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) row[x] = D[y * w + x]; const d = edt1(row, w); for (let x = 0; x < w; x++) D[y * w + x] = Math.sqrt(d[x]); }
    return D;
  }
  {
    const img = g.getImageData(0, 0, W2, W2), v = img.data;
    const bant = [hex(K.civit), hex(K.mavi), hex(K.gok2), hex(K.gok1), hex(K.krem)];
    const krem = hex(K.krem);

      for (const [x, y, r] of b.lob) { x0 = Math.min(x0, x - r - 5); y0 = Math.min(y0, y - r - 5); x1 = Math.max(x1, x + r + 5); y1 = Math.max(y1, y + r + 5); }

  {

  // ------------------------------------------------------------ minare: krem taş, sol yanı açık soga, çivit pencereler
  {
    const MP = SAHNE.minareParcalari(), cx = 300;
    for (const p of MP) {

        // dallanma: ana çatlaktan yanlara, aşağı yukarı dik açıyla daha kısa çatlaklar
        if (derin < 3 && rr() < oranlar[derin]) {
          const yon = (rr() < 0.5 ? 1 : -1) * (1.15 + gauss(rr) * 0.3);
          kuyruk.push([x, y, a + yon, derin + 1, (derin === 0 ? 20 + rr() * 110 : derin === 1 ? 10 + rr() * 55 : 5 + rr() * 26), benim]);
        }
      }
      if (pts.length < 3) continue;
      const w0 = gen[derin] * (0.8 + rr() * 0.4), op = opak[derin] * (0.8 + rr() * 0.2);
      // boya çatlağa her yerde aynı girmez: çizgi boyunca değişen koyuluk ve uca doğru incelme
      const n = pts.length;
      for (let i = 1; i < n; i += 4) {
        const t = i / n, w = w0 * (derin === 0 ? 1 - 0.4 * Math.abs(t - 0.5) * 2 : 1 - 0.55 * t);
        const q = pts[i];
        cg.strokeStyle = `rgba(255,255,255,${(op * (0.45 + 0.55 * sstep(0.2, 0.7, nOp(q[0] / 9, q[1] / 9)))).toFixed(3)})`;
        cg.lineWidth = Math.max(0.3, w);
        cg.beginPath(); cg.moveTo(pts[i - 1][0], pts[i - 1][1]);
        for (let j = i; j < Math.min(n, i + 4); j++) cg.lineTo(pts[j][0], pts[j][1]);
        cg.stroke();
      }
    }
    const v = cg.getImageData(0, 0, W2, W2).data;
    const A = new Float32Array(N2);
    for (let i = 0; i < N2; i++) A[i] = v[i * 4 + 3] / 255;
    // boya çatlaktan ipliklere yayılır: atkı ve çözgü yönünde kısa sızıntı + yumuşak hale
    const Ab = bulanik(A, W2, W2, 3);
    const Ah = new Float32Array(N2), Av = new Float32Array(N2);
    const r3 = 3, k3 = 1 / (2 * r3 + 1);
    for (let y = 0; y < W2; y++) { const o = y * W2; for (let x = 0; x < W2; x++) { let s = 0; for (let d = -r3; d <= r3; d++) s += A[o + clamp(x + d, 0, W2 - 1)]; Ah[o + x] = s * k3; } }
    for (let x = 0; x < W2; x++) for (let y = 0; y < W2; y++) { let s = 0; for (let d = -r3; d <= r3; d++) s += A[clamp(y + d, 0, W2 - 1) * W2 + x]; Av[y * W2 + x] = s * k3; }
    for (let i = 0; i < N2; i++) {
      const x = i % W2, y = (i / W2) | 0;
      const yogun = 0.62 + 0.5 * nD(x / 170 + 5, y / 170 + 9);
      CAT[i] = Math.min(1, (A[i] * 0.9 + Math.max(Ah[i], Av[i]) * 0.45 + Ab[i] * 0.3) * yogun);
    }
  }
  // ------------------------------------------------------------ birleştirme: çatlak, boya alımı, bez örgüsü, kırışıklık
  const img = ctx.createImageData(W2, W2), o = img.data;
  const P = 6; // iplik aralığı (2048'de 6 px)
  const ATKI = new Float32Array(Math.ceil(W2 / P) + 1), CozgU = new Float32Array(Math.ceil(W2 / P) + 1);
  { const rr = SAHNE.rng(3131); for (let i = 0; i < ATKI.length; i++) { ATKI[i] = (rr() - 0.5) * 0.09 + (rr() < 0.04 ? -0.06 : 0); CozgU[i] = (rr() - 0.5) * 0.09 + (rr() < 0.04 ? -0.06 : 0); } }
  // kat izleri: bez katlanıp sıkıştırıldığı yerlerde hafif açık/koyu şerit
  const KATLAR = [[0, 342, 1024, 318, 5], [512, 0, 498, 1024, 4]];
  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x;
    let dr = DR[i], dg = DG[i], db = DB[i];
    const ix = Math.floor(x / P), iy = Math.floor(y / P), fx = (x % P) / P, fy = (y % P) / P;
    const atki = (ix + iy) % 2 === 0; // düz örgü: hangi iplik üstte
    const ipT = atki ? nD(ix * 0.37, iy * 0.11 + 30) : nD(ix * 0.11 + 70, iy * 0.37);
    const leke = 0.82 + 0.36 * fbm(nE, x / 220, y / 220, 3);
    const al = leke * (0.9 + 0.2 * ipT) * (1 + (atki ? ATKI[iy] : CozgU[ix]) * 2);
    if (dr > 0) dr *= al; if (dg > 0) dg *= al; if (db > 0) db *= al;
    const c = CAT[i];
    if (c > 0.01) {
      const k = c * 0.86;
      dr += Math.max(0, DK[0] - dr) * k; dg += Math.max(0, DK[1] - dg) * k; db += Math.max(0, DK[2] - db) * k;
    }
    const prof = atki ? Math.sin(Math.PI * fy) : Math.sin(Math.PI * fx);
    const kes = Math.sin(Math.PI * fx) * Math.sin(Math.PI * fy);
    let kat = 0;
    for (const [ax, ay, bx, by, w] of KATLAR) {
      const X = x / S, Yy = y / S, vx = bx - ax, vy = by - ay, L = Math.hypot(vx, vy);
      const dd = ((X - ax) * vy - (Yy - ay) * vx) / L + (nB(X / 40, Yy / 40) - 0.5) * 6;
      kat += Math.exp(-(dd * dd) / (w * w)) * 0.05 - Math.exp(-((dd - w * 1.2) * (dd - w * 1.2)) / (w * w * 1.5)) * 0.035;
    }
    const kirisik = 1 + (fbm(nC, x / 420 + 3, y / 300 - 2, 3) - 0.5) * 0.12 + kat;
    const orgu = (0.86 + 0.14 * prof + 0.04 * kes + (ipT - 0.5) * 0.06) * kirisik;
    const r = krem[0] * Math.exp(-dr) * orgu, gg = krem[1] * Math.exp(-dg) * orgu, b = krem[2] * Math.exp(-db) * orgu;
    o[i * 4] = clamp(r, 0, 255); o[i * 4 + 1] = clamp(gg, 0, 255); o[i * 4 + 2] = clamp(b, 0, 255); o[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
