<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-067 Batik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f5ecd6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-067 Batik — fildişi pamuklu bez üstüne mumla boyama (açık zeminli Cava/pesisir batik resmi): tjanting ile
// çekilmiş krem mum çizgileri ve isen-isen dolgular (cecek noktaları, sawut çizgileri, pirinç taneleri), açıktan
// koyuya üst üste binen açık boya kademeleri (yumuşak sarı, gök mavisi, yumuşak yeşiller, gül, açık soga), yalnız
// ince kontur ve küçük pencerelerde kalan çivit, renk sınırlarında mumun altına sızan yumuşak boya haleleri,
// görünen pamuk örgüsü ve açık renkli tumpal bordür.
// Desen önce düz boya renkleriyle 2048 iç çözünürlükte çizilir; sonra optik yoğunluk uzayında iplik yönünde
// kayma, yumuşak boya halesi, boya alımındaki hafif dalgalanma ve bez örgüsü uygulanır.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) {
      s += a * n(x, y); t += a;
      const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
      x = nx + 17.3; y = ny + 9.1; a *= 0.5;
    }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = acc * k;
        acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc * k;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return out;
  }
  function bulanik(src, w, h, r) {
    const rr = Math.max(1, Math.round(r * 0.6));
    return kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, rr), w, h, rr), w, h, rr);
  }
  // ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const PROF = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(1024), kubbeDr = new Float32Array(1024);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < PROF.length - 2 && PROF[j + 1].y > y) j++;
    const a = PROF[j], b = PROF[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), r = Math.max(1, kubbeR[yi]);
    const u = clamp((x - 560) / r, -1, 1), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    const l = Math.hypot(u, dr, c);
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / l);
  }
  const S = 2, W2 = 1024 * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(6701);
  const nA = gurultu(21), nB = gurultu(22), nC = gurultu(23), nD = gurultu(24), nE = gurultu(25), nF = gurultu(26);

  // boya katmanları (açıktan koyuya): fildişi bez, yumuşak sarı, gök mavisi kademeleri, yumuşak yeşiller, gül, açık soga;
  // çivit yalnız son, çok dar kanallarda (ince kontur) ve küçük pencerelerde
  const K = {
    krem: '#F6EDD8',
    sariAcik: '#F5E3A8', sari: '#EDCB78', okra: '#DFB066',
    sogaAcik: '#E6CCA4', soga: '#C9A073', sogaKoyu: '#9C7148',
    roz: '#EFB0AA', rozKoyu: '#D9878A',
    tas: '#F0E2C2', tasKoyu: '#E1C99F',
    acikYesil: '#C5DFA0', yesil: '#9FCB86', koyuYesil: '#76B077', yesilKontur: '#4F8E62',
    yaprak: '#8FC07F', yaprakAcik: '#C2DEA0',
    gok1: '#F6E7B8', gok2: '#DCEBF0', gok3: '#C3DCEC', gok4: '#A9CCE8',
    bulut1: '#90B5DE', bulut2: '#B5D0EA', bulut3: '#D6E7F3',
    pencere: '#5F7DB5', civit: '#3A5893',
  };
  const D = SAHNE.yeniTuval(W2, W2), g = D.getContext('2d', { willReadFrequently: true });
  const yol = (d) => new Path2D(d);
  const P2 = (d) => (typeof d === 'string' ? yol(d) : d);
  const doldur = (d, c) => { g.fillStyle = c; g.fill(P2(d)); };
  const cek = (d, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.stroke(P2(d)); };
  const nokta = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const cizgi = (x0, y0, x1, y1, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  // cecek: tjanting noktası, elle konduğu için hafif kayık ve boyu değişken
  const cecek = (x, y, r, c) => nokta(x + (R() - 0.5) * 0.7, y + (R() - 0.5) * 0.7, r * (0.8 + R() * 0.4), c);
  // kontur: biçimin içinde krem mum şeridi, dış kenarında son çivit banyosunun bıraktığı ince kanal
  const kontur = (d, mum, cv, renk) => {
    const p = P2(d);
    g.save(); g.clip(p); g.strokeStyle = K.krem; g.lineWidth = mum * 2; g.stroke(p); g.restore();
    g.strokeStyle = renk || K.civit; g.lineWidth = cv; g.stroke(p);
  };
  const Y = SAHNE.yollar();
  const KR = 46; // bordür genişliği

  // ------------------------------------------------------------ gök: güneş çevresi fildişi, uzaklaştıkça açık sarı ve gök mavisi kademeleri
  {
    const img = g.createImageData(W2, W2), v = img.data;
    const kad = [K.krem, K.gok1, K.gok2, K.gok3, K.gok4].map(hex), kremR = hex(K.krem);
    const esik = [235, 395, 560, 760];
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const X = x / S, Yy = y / S;
      const f = Math.hypot(X - 880, Yy - 140) - 0.15 * (Yy - 140) + (fbm(nF, X / 150, Yy / 150, 3) - 0.5) * 60 + (nA(X / 14, Yy / 14) - 0.5) * 7;
      let k = 0; while (k < 4 && f > esik[k]) k++;
      // kademe sınırında ince krem mum çizgisi (bir sonraki boya banyosundan önce çekilmiş)
      const sinir = Math.min(k > 0 ? f - esik[k - 1] : 99, k < 4 ? esik[k] - f : 99);
      // koyu tarafta ikinci, daha ince mum çizgisi (klowong çift çizgisi)
      const ikinci = k > 0 ? Math.abs(f - esik[k - 1] - 4.4) : 99;
      const c = sinir < 0.9 || ikinci < 0.45 ? kremR : kad[k], i = (y * W2 + x) * 4;
      v[i] = c[0]; v[i + 1] = c[1]; v[i + 2] = c[2]; v[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  g.setTransform(S, 0, 0, S, 0, 0);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // gökte isen: üçlü ve yedili cecek kümeleri (cecek telu, cecek pitu); fildişi alanda açık mavi, mavide krem
  {
    const rr = SAHNE.rng(77);
    const yer = [];
    for (let k = 0; k < 4000 && yer.length < 420; k++) {
      const x = 60 + rr() * 904, y = 60 + rr() * 720;
      const dg = Math.hypot(x - 880, y - 140);
      if (dg < 150) continue;
      if (yer.some((p) => Math.hypot(p[0] - x, p[1] - y) < 30)) continue;
      yer.push([x, y]);
      const c = dg - 0.15 * (y - 140) < 470 ? K.bulut2 : K.krem;
      const a = rr() * Math.PI * 2;
      if (rr() < 0.4) { // cecek pitu: altı nokta çevrede, biri ortada
        for (let j = 0; j < 6; j++) cecek(x + Math.cos(a + j * Math.PI / 3) * 4.6, y + Math.sin(a + j * Math.PI / 3) * 4.6, 1.6, c);
        cecek(x, y, 1.9, c);
      } else for (let j = 0; j < 3; j++) cecek(x + Math.cos(a + j * 2.094) * 3.6, y + Math.sin(a + j * 2.094) * 3.6, 1.7, c);
    }
  }
  // mega mendung bulutları: dilimli bulut, dıştan içe açık maviden fildişine bantlar, aralarında krem mum çizgileri
  const BULUTLAR = [
    { lob: [[90, 250, 30], [130, 232, 38], [178, 226, 42], [225, 236, 34], [258, 252, 24], [150, 262, 30], [205, 262, 28], [70, 266, 18]] },
    { lob: [[440, 150, 24], [474, 134, 32], [514, 128, 34], [552, 138, 28], [580, 154, 18], [494, 160, 24], [536, 162, 22]] },
    { lob: [[790, 352, 22], [822, 336, 30], [860, 330, 32], [898, 340, 26], [928, 356, 18], [842, 360, 22], [884, 362, 20]] },
    { lob: [[60, 470, 18], [86, 458, 26], [118, 454, 26], [146, 466, 18], [100, 478, 18]] },
    { lob: [[870, 490, 16], [896, 478, 22], [926, 476, 22], [952, 488, 15], [910, 496, 16]] },
    { lob: [[620, 236, 14], [642, 226, 19], [668, 224, 19], [690, 234, 13], [656, 240, 14]] },
  ];
  // tam öklid uzaklık dönüşümü (Felzenszwalb): bant konturları bulutun dış çizgisini izlesin
  function edt1(f, n) {
    const d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s2 = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s2 <= z[k]) { k--; s2 = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s2; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    return d;
  }
  function edt(M, w, h) { // M: 1 içeride → içerideki her pikselin dışarıya uzaklığı
    const INF = 1e12, D = new Float32Array(w * h);
    const col = new Float32Array(h);
    for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) col[y] = M[y * w + x] ? INF : 0; const d = edt1(col, h); for (let y = 0; y < h; y++) D[y * w + x] = d[y]; }
    const row = new Float32Array(w);
    for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) row[x] = D[y * w + x]; const d = edt1(row, w); for (let x = 0; x < w; x++) D[y * w + x] = Math.sqrt(d[x]); }
    return D;
  }
  {
    const img = g.getImageData(0, 0, W2, W2), v = img.data;
    const civ = hex(K.civit);
    const bant = [hex(K.bulut1), hex(K.bulut2), hex(K.bulut3), hex('#E9F1F4'), hex(K.krem)];
    const krem = hex(K.krem);
    for (const b of BULUTLAR) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const [x, y, r] of b.lob) { x0 = Math.min(x0, x - r - 5); y0 = Math.min(y0, y - r - 5); x1 = Math.max(x1, x + r + 5); y1 = Math.max(y1, y + r + 5); }
      const X0 = Math.floor(x0 * S), Y0 = Math.floor(y0 * S), w = Math.ceil((x1 - x0) * S), h = Math.ceil((y1 - y0) * S);
      const M = new Uint8Array(w * h), Dd = new Float32Array(w * h);
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
        const x = (X0 + xx) / S, y = (Y0 + yy) / S;
        let d = 1e9;
        for (const [cx, cy, r] of b.lob) d = Math.min(d, Math.hypot(x - cx, y - cy) - r);
        Dd[yy * w + xx] = d;
        if (d < 0) M[yy * w + xx] = 1;
      }
      const E = edt(M, w, h);
      const bw = Math.max(4.2, Math.min(6.2, (y1 - y0) / 13));
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
        const j = yy * w + xx, d = M[j] ? -E[j] / S : Dd[j];
        if (d > 2.6) continue;
        const i = ((Y0 + yy) * W2 + X0 + xx) * 4;
        let c;
        if (d > 0.55) c = krem; // dışta krem mum şeridi
        else if (d > -0.55) c = civ; // en dışta ince çivit kanalı
        else { const k = Math.floor(-d / bw), f = (-d) % bw; c = f < 1.45 && k > 0 ? krem : bant[Math.min(4, k)]; }
        v[i] = c[0]; v[i + 1] = c[1]; v[i + 2] = c[2];
      }
    }
    g.putImageData(img, 0, 0);
  }
  // ------------------------------------------------------------ güneş: halkalar, alev biçimli ışınlar, cecek dizileri
  {
    const gx = 880, gy = 140;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2, uz = i % 2 ? 106 : 130, gen = i % 2 ? 0.13 : 0.11;
      const p = new Path2D();
      p.moveTo(gx + Math.cos(a - gen) * 66, gy + Math.sin(a - gen) * 66);
      p.quadraticCurveTo(gx + Math.cos(a - gen * 0.3) * (uz * 0.8), gy + Math.sin(a - gen * 0.3) * (uz * 0.8), gx + Math.cos(a) * uz, gy + Math.sin(a) * uz);
      p.quadraticCurveTo(gx + Math.cos(a + gen * 0.3) * (uz * 0.8), gy + Math.sin(a + gen * 0.3) * (uz * 0.8), gx + Math.cos(a + gen) * 66, gy + Math.sin(a + gen) * 66);
      p.closePath();
      doldur(p, i % 2 ? K.sariAcik : K.sari); cek(p, K.okra, 0.9);
      if (i % 2 === 0) for (let k = 0; k < 3; k++) nokta(gx + Math.cos(a) * (82 + k * 13), gy + Math.sin(a) * (82 + k * 13), 1.9 - k * 0.3, K.krem);
    }
    const halka = [[66, K.roz], [56, K.sariAcik], [44, K.sari], [30, K.sariAcik], [20, K.sari]];
    for (const [r, c] of halka) { nokta(gx, gy, r, c); g.strokeStyle = K.krem; g.lineWidth = 2; g.beginPath(); g.arc(gx, gy, r, 0, Math.PI * 2); g.stroke(); }
    g.strokeStyle = K.okra; g.lineWidth = 0.9; g.beginPath(); g.arc(gx, gy, 67.4, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < 26; i++) { const a = (i / 26) * Math.PI * 2; nokta(gx + Math.cos(a) * 61, gy + Math.sin(a) * 61, 1.7, K.krem); }
    for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2 + 0.13; nokta(gx + Math.cos(a) * 37, gy + Math.sin(a) * 37, 2.1, K.krem); nokta(gx + Math.cos(a + 0.22) * 50, gy + Math.sin(a + 0.22) * 50, 1.5, K.krem); }
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; nokta(gx + Math.cos(a) * 11, gy + Math.sin(a) * 11, 3.4, K.roz); }
    nokta(gx, gy, 4, K.rozKoyu);
  }

  // ------------------------------------------------------------ minare: fildişi taş, sol yanı açık soga, çivit-mavi pencereler
  {
    const MP = SAHNE.minareParcalari(), cx = 300;
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      const d = p.tip === 'poligon' ? SAHNE.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      if (p.tip === 'korkuluk') {
        doldur(d, K.soga);
        const adet = 9;
        for (let i = 0; i <= adet; i++) { const x = p.x1 + 3 + ((p.x2 - p.x1 - 6) * i) / adet; g.fillStyle = K.krem; g.fillRect(x - 1.6, p.y1 + 3.5, 3.2, p.y2 - p.y1 - 5); }
        cizgi(p.x1, p.y1 + 1.5, p.x2, p.y1 + 1.5, K.krem, 3);
        cek(d, K.civit, 1);
        continue;
      }
      doldur(d, K.tas);
      g.save(); g.clip(yol(d));
      const yb = p.tip === 'poligon' ? Math.max(...p.noktalar.map((q) => q[1])) : 210, ya = p.tip === 'poligon' ? Math.min(...p.noktalar.map((q) => q[1])) : 140;
      const xs = p.tip === 'poligon' ? Math.min(...p.noktalar.map((q) => q[0])) : 266;
      const xe = p.tip === 'poligon' ? Math.max(...p.noktalar.map((q) => q[0])) : 334;
      // ışıklı sağ yan kremde kalır (mumlanmış), sol yan iki kademe soga
      g.fillStyle = K.krem; g.fillRect(xs + (xe - xs) * 0.52, ya - 2, (xe - xs) * 0.34, yb - ya + 4);
      g.fillStyle = K.tasKoyu; g.fillRect(xs - 2, ya - 2, (xe - xs) * 0.3 + 2, yb - ya + 4);
      g.fillStyle = K.sogaAcik; g.fillRect(xs - 2, ya - 2, (xe - xs) * 0.1 + 2, yb - ya + 4);
      g.restore();
      kontur(d, 1.2, 1);
    }
    // taş sıraları: açık soga çizgiler, sıra aralarında cecek
    for (let y = 500; y < 800; y += 19) { if (y > 516 && y < 590) continue; cizgi(cx - 33, y, cx + 33, y, K.sogaAcik, 1.2); for (let x = cx - 28; x < cx + 30; x += 9) cecek(x + ((y / 19) % 2) * 4.5, y + 9.5, 0.9, K.tasKoyu); }
    for (let y = 334; y < 436; y += 17) { cizgi(cx - 26, y, cx + 26, y, K.sogaAcik, 1.2); for (let x = cx - 22; x < cx + 24; x += 8) cecek(x, y + 8.5, 0.85, K.tasKoyu); }
    for (let y = 214; y < 272; y += 14) cizgi(cx - 18, y, cx + 18, y, K.sogaAcik, 1.1);
    // zikzak bandı: gül zemin, krem zikzaklar
    g.fillStyle = K.roz; g.fillRect(cx - 34, 522, 68, 60);
    for (const z of SAHNE.zikzakCizgileri()) cek(SAHNE.yol(z), K.krem, 2.6);
    for (const z of SAHNE.zikzakCizgileri()) for (let i = 1; i < z.length - 1; i += 2) nokta(z[i][0], z[i][1] + 8, 1.4, K.rozKoyu);
    cizgi(cx - 34, 522, cx + 34, 522, K.civit, 1); cizgi(cx - 34, 582, cx + 34, 582, K.civit, 1);

      for (const e of taclar) {
        g.save(); g.clip(yol(SAHNE.elipsYolu(e)));
        g.strokeStyle = K.krem; g.lineWidth = 1.2; g.beginPath(); g.arc(c.x, c.y, c.r * 0.6, 0, Math.PI * 2); g.stroke();
        const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
        const cz = tur === 0 ? K.roz : K.krem;

  // ------------------------------------------------------------ bordür: yumuşak sarı zemin, gök mavisi tumpal üçgenleri, köşelerde kawung, ince çivit çerçeve
  {
    const ic = KR;

  // ============================================================ boyama süreci: optik yoğunluk uzayında
  const desen = g.getImageData(0, 0, W2, W2).data;
  const krem = hex(K.krem);
  const kremL = krem.map((c) => -Math.log(c / 255));
  // desen → yoğunluk (iplik yönünde sızma ile örneklenir)
  const DR = new Float32Array(N2), DG = new Float32Array(N2), DB = new Float32Array(N2);
  const SIRA = new Float32Array(W2), SUTUN = new Float32Array(W2);
  for (let i = 0; i < W2; i++) { SIRA[i] = (nB(i / 6.0, 3.3) - 0.5) * 2 + (nB(i / 1.7, 9.1) - 0.5) * 0.9; SUTUN[i] = (nB(7.7, i / 6.0) - 0.5) * 2 + (nB(2.2, i / 1.7) - 0.5) * 0.9; }
  const logT = new Float32Array(256); for (let v = 0; v < 256; v++) logT[v] = -Math.log(Math.max(3, v) / 255);
  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x;
    const dx = SIRA[y] * 1.0 + (nA(x / 5, y / 5) - 0.5) * 1.8, dy = SUTUN[x] * 1.0 + (nA(x / 5 + 50, y / 5) - 0.5) * 1.8;
    const sx = clamp(Math.round(x + dx), 0, W2 - 1), sy = clamp(Math.round(y + dy), 0, W2 - 1), j = (sy * W2 + sx) * 4;
    DR[i] = Math.max(0, logT[desen[j]] - kremL[0]); DG[i] = Math.max(0, logT[desen[j + 1]] - kremL[1]); DB[i] = Math.max(0, logT[desen[j + 2]] - kremL[2]);
  }
  // boya halesi: boya mumun kenarından ipliklere yumuşakça sızar (yalnız açık tarafa doğru, renk sınırı boyunca ince ve yumuşak)
  {
    const BR = bulanik(DR, W2, W2, 6), BG = bulanik(DG, W2, W2, 6), BB = bulanik(DB, W2, W2, 6);
    const BR2 = bulanik(DR, W2, W2, 2), BG2 = bulanik(DG, W2, W2, 2), BB2 = bulanik(DB, W2, W2, 2);
    for (let i = 0; i < N2; i++) {
      const x = i % W2, y = (i / W2) | 0;
      const k = 0.55 + 0.35 * fbm(nC, x / 30, y / 30, 3), k2 = 0.55 + 0.25 * nE(x / 9, y / 9);
      DR[i] += Math.max(0, BR[i] - DR[i]) * k + Math.max(0, BR2[i] - DR[i]) * k2;
      DG[i] += Math.max(0, BG[i] - DG[i]) * k + Math.max(0, BG2[i] - DG[i]) * k2;
      DB[i] += Math.max(0, BB[i] - DB[i]) * k + Math.max(0, BB2[i] - DB[i]) * k2;
    }
  }
  // ------------------------------------------------------------ birleştirme: boya alımı ve pamuk bez örgüsü
  const img = ctx.createImageData(W2, W2), o = img.data;
  const P = 6; // iplik aralığı (2048'de 6 px)
  const ATKI = new Float32Array(Math.ceil(W2 / P) + 1), CozgU = new Float32Array(Math.ceil(W2 / P) + 1);
  { const rr = SAHNE.rng(3131); for (let i = 0; i < ATKI.length; i++) { ATKI[i] = (rr() - 0.5) * 0.08 + (rr() < 0.04 ? -0.05 : 0); CozgU[i] = (rr() - 0.5) * 0.08 + (rr() < 0.04 ? -0.05 : 0); } }
  for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x;
    let dr = DR[i], dg = DG[i], db = DB[i];
    const ix = Math.floor(x / P), iy = Math.floor(y / P), fx = (x % P) / P, fy = (y % P) / P;
    const atki = (ix + iy) % 2 === 0; // düz örgü: hangi iplik üstte
    const ipT = atki ? nD(ix * 0.37, iy * 0.11 + 30) : nD(ix * 0.11 + 70, iy * 0.37);
    // boya alımı: el boyamasının hafif, geniş dalgalanması ve iplikten ipliğe değişim
    const al = (0.92 + 0.16 * fbm(nE, x / 260, y / 260, 3)) * (0.9 + 0.2 * ipT) * (1 + (atki ? ATKI[iy] : CozgU[ix]) * 2);
    dr *= al; dg *= al; db *= al;

    const kes = Math.sin(Math.PI * fx) * Math.sin(Math.PI * fy);
    const orgu = 0.885 + 0.115 * prof + 0.035 * kes + (ipT - 0.5) * 0.05;
    const r = krem[0] * Math.exp(-dr) * orgu, gg = krem[1] * Math.exp(-dg) * orgu, b = krem[2] * Math.exp(-db) * orgu;
    o[i * 4] = clamp(r, 0, 255); o[i * 4 + 1] = clamp(gg, 0, 255); o[i * 4 + 2] = clamp(b, 0, 255); o[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
