<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-031 Beş Vakit — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #10132e; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-031 Beş Vakit — tuval soldan sağa beş dikey banda bölünür; her bant AYNI kesintisiz sahneyi bir namaz
  // vaktinin ışığında gösterir: İmsak, Öğle, İkindi, Akşam, Yatsı. Geometri bantlar arasında kesintisiz sürer;
  // yalnız ışık, renk, gök ve gölgeler değişir. Bantlar ince altın kıl çizgilerle ayrılır; üstte ortak bir
  // yay üzerinde güneşin/ayın konumu işaretlenir.
  (function () {
    const S = SAHNE;
    const W = 1024;
    const IC = 2048;
    const tuval = document.getElementById('tuval');
    const ctx = S.tuval(tuval, 2);
    const rnd = S.rng(31);
    // bant sınırları: beş vakit neredeyse eşit genişlikte (gece kanatları biraz geniş); İmsak gök ve sol çiçekler,
    // Öğle bütün minare, İkindi kubbenin ortası ve alemi, Akşam kubbenin sağ omzu ve batan güneş, Yatsı ay ve sağ çiçekler
    const SINIR = [0, 236, 428, 620, 812, W];
    const bx = (b) => SINIR[b];
    const bw = (b) => SINIR[b + 1] - SINIR[b];
    const orta = (b) => SINIR[b] + (SINIR[b + 1] - SINIR[b]) / 2;
    const GUNES_AKSAM = [787, 516]; // Akşam bandında alçak güneş
    const bantNo = (x) => (x < SINIR[1] ? 0 : x < SINIR[2] ? 1 : x < SINIR[3] ? 2 : x < SINIR[4] ? 3 : 4);

    // ---------------------------------------------------------------- vakitlerin ışığı
    const nrm = (v) => {
      const l = Math.hypot(v[0], v[1], v[2]);
      return [v[0] / l, v[1] / l, v[2] / l];
    };
    const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
    const VAKIT = [
      {
        ad: 'İmsak',
        gunes: { yon: nrm([-0.85, 0.12, 0.5]), renk: hex('#E9A9BC'), guc: 0.16 },
        gok: { renk: hex('#6A70B8'), guc: 0.7 },
        yer: { renk: hex('#3E3760'), guc: 0.24 },
        pencere: 0.8,
        alem: 0.6,
        projektor: null,
        golge: null,
        ton: hex('#7C7FC0'),
        tonGuc: 0.16,
        doygunluk: 0.8,
        pozlama: 1.0,
      },
      {
        ad: 'Öğle',
        gunes: { yon: nrm([0.12, 0.9, 0.42]), renk: hex('#FFFDF5'), guc: 1.1 },
        gok: { renk: hex('#A6CAF0'), guc: 0.56 },
        yer: { renk: hex('#EADCBC'), guc: 0.36 },
        pencere: 0,
        alem: 0,
        projektor: null,
        golge: { kx: 0.07, ky: 0.06, guc: 0.6 },
        ton: hex('#FFFFFF'),
        tonGuc: 0,
        doygunluk: 1.25,
        pozlama: 1.12,
      },
      {
        ad: 'İkindi',
        gunes: { yon: nrm([0.52, 0.44, 0.73]), renk: hex('#FFCF8E'), guc: 1.12 },
        gok: { renk: hex('#A6B6C8'), guc: 0.34 },
        yer: { renk: hex('#E8C48A'), guc: 0.26 },
        pencere: 0,
        alem: 0,
        projektor: null,
        golge: { kx: 0.78, ky: 0.2, guc: 0.62 },
        ton: hex('#FFC36A'),
        tonGuc: 0.15,
        doygunluk: 1.08,
        pozlama: 1.0,
      },
      {
        ad: 'Akşam',
        gunes: { yon: nrm([0.9, 0.12, -0.36]), renk: hex('#FF8A3D'), guc: 1.5 },
        gok: { renk: hex('#9C5A98'), guc: 0.46 },
        yer: { renk: hex('#9A4A3A'), guc: 0.12 },
        pencere: 0.25,
        alem: 0.15,
        projektor: null,
        golge: { kx: 0.9, ky: 0.95, guc: 0.72 },
        ton: hex('#E0607A'),
        tonGuc: 0.12,
        doygunluk: 1.05,
        pozlama: 1.0,
        isiltin: true,
      },
      {
        ad: 'Yatsı',
        gunes: { yon: nrm([-0.45, 0.62, 0.55]), renk: hex('#9DB2FF'), guc: 0.1 },
        gok: { renk: hex('#22306A'), guc: 0.42 },
        yer: { renk: hex('#151A36'), guc: 0.1 },
        pencere: 1.05,
        alem: 1.0,
        projektor: { yon: nrm([0.1, 0.12, 0.98]), renk: hex('#FFD9A6'), guc: 0.34 },
        golge: null,
        ton: hex('#2A3A8A'),
        tonGuc: 0.14,
        doygunluk: 0.95,
        pozlama: 1.0,
      },
    ];

    // ---------------------------------------------------------------- 1. düz renk (albedo) katmanı: ışıksız sahne
    const ALB = S.yeniTuval(IC, IC);
    {
      const a = ALB.getContext('2d');
      a.setTransform(2, 0, 0, 2, 0, 0);
      const doldur = (d, c) => {
        a.fillStyle = c;
        a.fill(typeof d === 'string' ? new Path2D(d) : d);
      };
      const Y = S.yollar();
      // minare
      for (const p of S.minareParcalari()) {
        if (p.tip === 'alem') continue;
        if (p.tip === 'poligon') doldur(S.yol(p.noktalar, true), p.ad.startsWith('şerefe') ? '#F1EADA' : '#E9E1CD');
        else if (p.tip === 'topuz') doldur(p.yol, '#EEE7D6');
        else if (p.tip === 'korkuluk') {
          doldur(S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true), '#E6DDC8');
          a.fillStyle = '#9A8E76';
          for (let i = 0; i < 9; i++) {
            const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / 9;
            a.fillRect(x - 1.8, p.y1 + 4, 3.6, p.y2 - p.y1 - 7);
          }
          a.fillStyle = '#F4EEE0';
          a.fillRect(p.x1, p.y1, p.x2 - p.x1, 3);
        } else if (p.tip === 'bant') {
          doldur(S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true), '#E9E1CD');
        }
      }
      a.strokeStyle = '#A3967A';
      a.lineWidth = 3;
      a.lineJoin = 'miter';
      for (const z of Y.zikzak) a.stroke(new Path2D(z));
      for (const p of Y.minarePencereleri) doldur(p, '#3E372C');
      // kaide
      const K = S.kaide;
      doldur(Y.kaide, '#ECE5D2');
      a.strokeStyle = 'rgba(160,145,115,0.28)';
      a.lineWidth = 1;
      for (let y = 728; y < 800; y += 24) {
        a.beginPath();
        a.moveTo(K.x1, y);
        a.lineTo(K.x2, y);
        a.stroke();
      }
      doldur(Y.kornis, '#F4EFE2');
      for (const p of Y.kaidePencereleri) doldur(p, '#3E372C');
      // kasnak
      for (let k = 1; k >= 0; k--) {
        const q = S.kasnak[k];
        doldur(S.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true), '#2E7A3B');
        a.fillStyle = '#3E8E4A';
        a.fillRect(q.x1, q.y1, q.x2 - q.x1, 3);
        a.fillStyle = '#21602C';
        a.fillRect(q.x1, q.y2 - 3, q.x2 - q.x1, 3);
        for (const p of S.kasnakPencereleri(k)) doldur(S.kemerYolu(p.x, p.y, p.w, p.h), '#10301A');
      }
      // kubbe
      doldur(S.kubbeYolu, '#358A45');
      a.save();
      a.clip(new Path2D(S.kubbeYolu));
      a.strokeStyle = 'rgba(18,60,26,0.55)';
      a.lineWidth = 1.5;
      for (const k of Y.kaburgalar) a.stroke(new Path2D(k));
      a.restore();
      // alemler
      for (const d of Y.alem) doldur(d, '#D1A945');
      for (const d of Y.minareAlem) doldur(d, '#D1A945');
      // bitkiler
      a.lineCap = 'round';
      a.lineWidth = 4;
      a.strokeStyle = '#5B7D47';
      for (const s of Y.saplar) a.stroke(new Path2D(s));
      for (const y of S.bitki.yapraklar) {
        doldur(S.yaprakYolu(y), y.uzunluk > 50 ? '#4A7340' : '#628E4E');
        const [p, q] = S.yaprakDamari(y);
        a.strokeStyle = 'rgba(205,230,180,0.5)';
        a.lineWidth = 1.2;
        a.beginPath();
        a.moveTo(p[0], p[1]);
        a.lineTo(q[0], q[1]);
        a.stroke();
      }
      for (const t of S.bitki.tomurcuklar) doldur(S.tomurcukYolu(t), '#EFC2CE');
      for (const c of S.bitki.cicekler) {
        for (const e of S.tacYapraklari(c)) {
          const g = a.createRadialGradient(c.x, c.y, c.r * 0.1, c.x, c.y, c.r * 1.05);
          g.addColorStop(0, '#F1C6D3');
          g.addColorStop(0.45, '#FBF8F5');
          g.addColorStop(1, '#F6EEF0');
          doldur(S.elipsYolu(e), g);
          a.strokeStyle = 'rgba(170,140,150,0.4)';
          a.lineWidth = 1;
          a.stroke(new Path2D(S.elipsYolu(e)));
        }
        doldur(S.daireYolu(c.x, c.y, c.r * 0.18), '#E6B43C');
        a.fillStyle = '#C48A22';
        for (let i = 0; i < 9; i++) {
          const t = (i / 9) * Math.PI * 2;
          a.beginPath();
          a.arc(c.x + Math.cos(t) * c.r * 0.26, c.y + Math.sin(t) * c.r * 0.26, Math.max(1.2, c.r * 0.035), 0, Math.PI * 2);
          a.fill();
        }
      }
    }
    const albV = ALB.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, IC, IC).data;

    // ---------------------------------------------------------------- 2. bölge haritası (2048) + kapsama
    const ADLAR = Object.keys(S.BOLGE);
    const NO = Object.fromEntries(ADLAR.map((x, i) => [x, i]));
    const bolge = new Uint8Array(IC * IC);
    const kapsa = new Float32Array(IC * IC);
    {
      const c = S.yeniTuval(IC, IC);
      const g = c.getContext('2d', { willReadFrequently: true });
      g.setTransform(2, 0, 0, 2, 0, 0);
      S.ciz(g, { bolge: true, gok: false });
      const v = g.getImageData(0, 0, IC, IC).data;
      for (let i = 0; i < IC * IC; i++) {
        kapsa[i] = v[i * 4 + 3] / 255;
        bolge[i] = kapsa[i] > 0 ? NO[S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])] : 255;
      }
      // kenar yumuşatmasından doğan yanlış bölgeleri çoğunlukla düzelt
      const kopya = bolge.slice();
      const say = new Uint8Array(256);
      for (let y = 1; y < IC - 1; y++) {
        for (let x = 1; x < IC - 1; x++) {
          const i = y * IC + x;
          const b = kopya[i];
          if (b === 255) continue;
          if (kopya[i - 1] === b && kopya[i + 1] === b && kopya[i - IC] === b && kopya[i + IC] === b) continue;
          say.fill(0);
          for (let v2 = -1; v2 <= 1; v2++) for (let u = -1; u <= 1; u++) say[kopya[i + v2 * IC + u]]++;
          if (say[b] <= 2) {
            let en = b;
            for (let k = 0; k < 13; k++) if (say[k] > say[en] || en === 255) en = k;
            bolge[i] = en;
          }
        }
      }
    }

    // ---------------------------------------------------------------- geometri: kubbe profili, minare yarı genişliği
    const kubbeR = new Float32Array(600);
    const kubbeE = new Float32Array(600);
    {
      const p = S.kubbeProfili(800);
      for (let j = 0; j < 600; j++) {
        const y = 300 + j * 0.5;
        let r = 0;
        for (let i = 0; i < p.length - 1; i++) {
          if (y <= p[i].y && y >= p[i + 1].y) {
            const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
            r = p[i].r + (p[i + 1].r - p[i].r) * t;
            break;
          }
        }
        kubbeR[j] = r;
      }
      for (let j = 0; j < 600; j++) {
        const a = kubbeR[Math.max(0, j - 2)];
        const b = kubbeR[Math.min(599, j + 2)];
        // dr/dh: h yukarı, y aşağı → dh = -dy
        kubbeE[j] = (a - b) / (((Math.min(599, j + 2) - Math.max(0, j - 2)) * 0.5) || 1);
      }
    }
    const parcalar = S.minareParcalari();
    function minareYari(y) {
      for (const p of parcalar) {
        if (p.tip === 'poligon') {
          const ys = p.noktalar.map((q) => q[1]);
          const y1 = Math.min(...ys);
          const y2 = Math.max(...ys);
          if (y >= y1 && y <= y2) {
            if (p.ad.startsWith('çıkma')) {
              const ust = Math.abs(p.noktalar[1][0] - 300);
              const alt = Math.abs(p.noktalar[0][0] - 300);
              return { w: ust + (alt - ust) * ((y - y1) / (y2 - y1)), tip: 'cikma' };
            }
            if (p.ad.startsWith('gövde-alt') && y > 488) return { w: 34, tip: 'govde' };
            return { w: Math.abs(p.noktalar[1][0] - p.noktalar[0][0]) / 2, tip: p.ad.startsWith('şerefe') ? 'serefe' : 'govde' };
          }
        } else if (p.tip === 'korkuluk' && y >= p.y1 && y <= p.y2) return { w: (p.x2 - p.x1) / 2, tip: 'govde' };
      }
      if (y < 200 && y > 140) return { w: 26, tip: 'topuz' };
      return { w: 34, tip: 'govde' };
    }
    const minareTablo = [];
    for (let j = 0; j < 1700; j++) minareTablo.push(minareYari(j * 0.5));
    const cicekler = S.bitki.cicekler;

    // ---------------------------------------------------------------- 3. gölgeler: yer gölgesi (izdüşüm) ve minareye düşen kubbe gölgesi
    const yerGolge = new Float32Array(IC * IC);
    {
      const c = S.yeniTuval(IC, IC);
      const g = c.getContext('2d', { willReadFrequently: true });
      const Y = S.yollar();
      for (let b = 0; b < 5; b++) {
        const V = VAKIT[b];
        if (!V.golge) continue;
        g.save();
        g.setTransform(2, 0, 0, 2, 0, 0);
        g.beginPath();
        g.rect(bx(b) - 40, 0, bw(b) + 80, W);
        g.clip();
        const { kx, ky } = V.golge;
        g.transform(1, 0, kx, -ky, -800 * kx, 800 + 800 * ky);
        g.filter = `blur(${(3 + kx * 4).toFixed(1)}px)`;
        g.fillStyle = `rgba(0,0,0,${V.golge.guc})`;
        const yollar = [S.kubbeYolu, Y.kasnakUst, Y.kasnakAlt, Y.kaide, Y.kornis, ...Y.minare, ...Y.alem, ...Y.minareAlem];
        for (const d of yollar) g.fill(new Path2D(d));
        g.restore();
        g.filter = 'none';
        // bant dışına taşanı kes
        const v = g.getImageData(0, 0, IC, IC).data;
        const x1 = Math.round(bx(b) * 2);
        const x2 = Math.round(bx(b + 1) * 2);
        for (let y = 1600; y < IC; y++) for (let x = x1; x < x2; x++) yerGolge[y * IC + x] = v[(y * IC + x) * 4 + 3] / 255;
        g.clearRect(0, 0, IC, IC);
      }
    }
    // minare gölgesi: ekranda ışığa doğru yürü, kubbe/kasnak/kaide engelliyorsa gölgede (1024 çözünürlükte)
    const minGolge = new Float32Array(W * W);
    {
      const kaba = new Uint8Array(W * W);
      for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) kaba[y * W + x] = bolge[(y * 2 + 1) * IC + x * 2 + 1];
      const engel = new Set([NO.kubbe, NO.kasnak, NO.kaide, NO.pencere]);
      for (let b = 0; b < 5; b++) {
        const V = VAKIT[b];
        if (!V.golge) continue;
        let dx = V.gunes.yon[0];
        let dy = -V.gunes.yon[1];
        const l = Math.hypot(dx, dy);
        dx /= l;
        dy /= l;
        for (let y = 60; y < 800; y++) {
          for (let x = bx(b); x < bx(b + 1); x++) {
            const i = y * W + x;
            const r = kaba[i];
            if (r !== NO.minare && r !== NO.altin) continue;
            if (x > 360 && r === NO.altin) continue; // kubbe alemi değil
            let gol = 0;
            for (let k = 2; k < 420; k += 1.5) {
              const xx = Math.round(x + dx * k);
              const yy = Math.round(y + dy * k);
              if (xx < 0 || yy < 0 || xx >= W || yy >= W) break;
              const e = kaba[yy * W + xx];
              if (engel.has(e) && (e !== NO.pencere || xx > 340)) {
                gol = 1;
                break;
              }
            }
            minGolge[i] = gol;
          }
        }
      }
      // yumuşat
      const k2 = minGolge.slice();
      for (let y = 2; y < W - 2; y++) {
        for (let x = 2; x < W - 2; x++) {
          let s = 0;
          for (let v = -2; v <= 2; v++) for (let u = -2; u <= 2; u++) s += k2[(y + v) * W + x + u];
          minGolge[y * W + x] = s / 25;
        }
      }
    }

    // ---------------------------------------------------------------- 4. gökler (her bant kendi vaktinde)
    const GOK = S.yeniTuval(IC, IC);
    {
      const g = GOK.getContext('2d');
      g.setTransform(2, 0, 0, 2, 0, 0);
      const durak = [
        [[0, '#121741'], [0.42, '#272C66'], [0.72, '#54508F'], [0.92, '#9C7BA6'], [1, '#C496A8']],
        [[0, '#1C58C2'], [0.5, '#3F86DA'], [0.85, '#9DCBF1'], [1, '#D4EAF8']],
        [[0, '#6A93CA'], [0.24, '#A6BCCD'], [0.44, '#E2CF9F'], [0.7, '#F2C27E'], [1, '#F8B868']],
        [[0, '#2A1C58'], [0.24, '#6E2C76'], [0.46, '#C5467A'], [0.6, '#F2834A'], [0.69, '#FFC86A'], [1, '#FFD98E']],
        [[0, '#04071E'], [0.5, '#0B133C'], [0.88, '#18215A'], [1, '#262C60']],
      ];
      const yildizCiz = (x, y, r, a) => {
        const gg = g.createRadialGradient(x, y, 0, x, y, r * 3.2);
        gg.addColorStop(0, `rgba(255,255,255,${a})`);
        gg.addColorStop(0.3, `rgba(220,230,255,${a * 0.35})`);
        gg.addColorStop(1, 'rgba(220,230,255,0)');
        g.fillStyle = gg;
        g.fillRect(x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
      };
      const bulut = (bx, by, s, renk, n, ys) => {
        for (let i = 0; i < n; i++) {
          const x = bx + (rnd() - 0.5) * 150 * s;
          const y = by + (rnd() - 0.5) * (ys || 30) * s;
          const r = (22 + rnd() * 30) * s;
          const gg = g.createRadialGradient(x, y, 0, x, y, r);
          gg.addColorStop(0, renk);
          gg.addColorStop(1, renk.replace(/[\d.]+\)$/, '0)'));
          g.fillStyle = gg;
          g.fillRect(x - r, y - r, r * 2, r * 2);
        }
      };
      for (let b = 0; b < 5; b++) {
        g.save();
        g.beginPath();
        g.rect(bx(b), 0, bw(b), 800);
        g.clip();
        const lg = g.createLinearGradient(0, 0, 0, 800);
        for (const [t, c] of durak[b]) lg.addColorStop(t, c);
        g.fillStyle = lg;
        g.fillRect(bx(b), 0, bw(b), 800);
        if (b === 0) {
          // doğuda (solda) şafak öncesi ışıma, son yıldızlar, sabah yıldızı
          let rg = g.createRadialGradient(-60, 820, 10, -60, 820, 520);
          rg.addColorStop(0, 'rgba(250,170,170,0.5)');
          rg.addColorStop(1, 'rgba(250,170,170,0)');
          g.fillStyle = rg;
          g.fillRect(0, 0, bw(0), 800);
          for (let i = 0; i < 70; i++) {
            const x = rnd() * bw(0);
            const y = Math.pow(rnd(), 1.6) * 520;
            yildizCiz(x, y, 0.4 + rnd() * 0.5, (0.25 + rnd() * 0.5) * (1 - y / 600));
          }
          // ufka yakın, alttan pembe aydınlanan ince şafak bulutları
          for (const [cy, s] of [[598, 0.8], [668, 1], [722, 0.7]]) {
            for (let i = 0; i < 7; i++) {
              const x = -20 + rnd() * (bw(0) + 40);
              const y = cy + (rnd() - 0.5) * 8;
              g.save();
              g.translate(x, y);
              g.scale(1, 0.13);
              const rr = (38 + rnd() * 36) * s;
              const cg = g.createRadialGradient(0, rr * 0.4, 0, 0, rr * 0.4, rr);

        const j = Math.max(0, Math.min(599, Math.round((y - 300) * 2)));
        const r = kubbeR[j] || 1;
        const s = -kubbeE[j];

        if (f < 0.06) d = -0.25;
        else if (f > 0.94) d = 0.25;
        const fn = fi + d;
        N[0] = nr * Math.sin(fn);
        N[1] = Math.max(nh, -0.2);
        N[2] = nr * Math.cos(fn);
      } else if (b === NO.kasnak || (b === NO.pencere && y > 555 && y < 692)) {
        const k = y < 610 ? S.kasnak[0] : S.kasnak[1];
        const u = Math.max(-0.99, Math.min(0.99, (x - 560) / ((k.x2 - k.x1) / 2)));

        N[1] = 0.04;
        N[2] = Math.sqrt(1 - u * u);
      } else if (b === NO.kaide) {

      } else if (b === NO.minare) {

          N[0] = u * 0.8; N[1] = -0.6; N[2] = c * 0.8;
        } else if (m.tip === 'serefe') {
          N[0] = u * 0.95; N[1] = 0.3; N[2] = c * 0.95;

        const t3 = t2 * t;
        const x = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
        const y = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
        if (k === 1 && t === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    // işaretler
    const altinS = '#F3D47E';
    function gunesIsareti(x, y, r, renk, isin) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
      g.addColorStop(0, renk.replace('1)', '0.55)'));
      g.addColorStop(1, renk.replace('1)', '0)'));
      ctx.fillStyle = g;
      ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
      ctx.strokeStyle = renk;
      ctx.lineWidth = 1.1;
      for (let k = 0; k < isin; k++) {
        const a = (k / isin) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r * 1.35, y + Math.sin(a) * r * 1.35);
        ctx.lineTo(x + Math.cos(a) * r * 1.85, y + Math.sin(a) * r * 1.85);
        ctx.stroke();
      }
      ctx.fillStyle = renk;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,20,0.6)';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    function hilalIsareti(x, y, r, yildizX) {
      ctx.save();
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6);
      g.addColorStop(0, 'rgba(240,220,160,0.35)');
      g.addColorStop(1, 'rgba(240,220,160,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
      ctx.fillStyle = altinS;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.arc(x + r * 0.45 * yildizX, y - r * 0.15, r * 0.82, 0, Math.PI * 2, true);
      ctx.fill('evenodd');
      // küçük yıldız
      const sx = x + r * 1.3 * yildizX;
      const sy = y - r * 0.55;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4 - Math.PI / 2;
        const rr = k % 2 ? r * 0.12 : r * 0.42;
        ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    hilalIsareti(isaret[0][0], isaret[0][1], 7.5, 1);
    gunesIsareti(isaret[1][0], isaret[1][1], 7.5, 'rgba(255,250,228,1)', 12);
    gunesIsareti(isaret[2][0], isaret[2][1], 6.8, 'rgba(255,214,120,1)', 10);
    {
      // akşam: ufuk çizgisinin üstünde yarım güneş
      const [x, y] = isaret[3];
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - 20, y - 20, 40, 20);
      ctx.clip();
      gunesIsareti(x, y, 7, 'rgba(255,160,90,1)', 10);
      ctx.restore();
      ctx.strokeStyle = altinS;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(x - 17, y + 0.5);
      ctx.lineTo(x + 17, y + 0.5);
      ctx.stroke();
    }
    hilalIsareti(isaret[4][0], isaret[4][1], 7.5, -1);
    ctx.restore();

    S.hazir();
  })();
</script>
