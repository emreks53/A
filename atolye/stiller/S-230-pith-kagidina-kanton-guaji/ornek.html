<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-230 Pith Kâğıdına Kanton Guajı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ================================================================ ressamın aletleri (j6 ortak yardımcıları)
// Gürültü, yol örnekleme, elle çekilmiş çizgi (şerit), boya tamponu (saydam/örtücü), fırça darbesi
// (iki tonlu yükleme, kıl izi, ıslak kenar), maske ve lavi. Rastgelelik yalnız SAHNE.rng ile.
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const css = (c, a) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a == null ? 1 : a})`;

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);
const NZ2 = gurultu(977);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}
/** Kuadratik/kübik Bezier → nokta dizisi */
function bezier(p0, p1, p2, p3, n) {
  const out = [];
  n = n || 24;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const u = 1 - t;
    if (p3) out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    else out.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]);
  }
  return out;
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu şerit. o: w, renk, kapali, titreme(px), frek, basinc, sivri/basSivri/sonSivri, civi
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.wf) w *= o.wf(t / L);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Cetvelle çekilmiş düz çizgi (uçlarda hafif fırça vurgusu). */
function cetvel(ctx, x1, y1, x2, y2, o) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.max(2, Math.ceil(L / 1.5));
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
  serit(ctx, pts, Object.assign({ titreme: 0.08, frek: 0.03, basinc: 0.12, civi: Math.min(2.2, L * 0.15), sonSivri: Math.min(2.5, L * 0.2) }, o, { ofs: (_ofs += 13.7) }));
}

// ---------------------------------------------------------------- kubbe profili
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

// ---------------------------------------------------------------- boya tamponu
/**
 * Boya tamponu: 1024·olcek kare, RGB 0..1. kagit: hex.
 *  B.glaze(k, c, d): saydam boya (kâğıt rengini çarparak koyulaştırır)
 *  B.opak(k, c, a): örtücü boya
 */
function Boya(olcek, kagit) {
  this.s = olcek;
  this.W = 1024 * olcek;
  const N = this.W * this.W;
  const c = hex(kagit);
  this.R = new Float32Array(N).fill(c[0]);
  this.G = new Float32Array(N).fill(c[1]);
  this.B = new Float32Array(N).fill(c[2]);
  this.dis = null; // kâğıt dişi (−1..1), boyanın tutunmasını oynatır
  this.disGuc = 0;
  this._bv = new Float32Array(N).fill(9);
  this._u = new Float32Array(N);
  this._v = new Float32Array(N);
  this._h = new Float32Array(N);
}
Boya.prototype.tuval = function () {
  const c = S.yeniTuval(this.W, this.W);
  const x = c.getContext('2d');
  const im = x.createImageData(this.W, this.W);
  const d = im.data;
  for (let k = 0, j = 0; k < this.R.length; k++, j += 4) {
    d[j] = this.R[k] * 255;
    d[j + 1] = this.G[k] * 255;
    d[j + 2] = this.B[k] * 255;
    d[j + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
};
Boya.prototype.glaze = function (k, c, d) {
  if (d <= 0) return;
  if (d > 1) d = 1;
  this.R[k] *= 1 - d * (1 - c[0]);
  this.G[k] *= 1 - d * (1 - c[1]);
  this.B[k] *= 1 - d * (1 - c[2]);
};
Boya.prototype.opak = function (k, c, a) {
  if (a <= 0) return;
  if (a > 1) a = 1;
  this.R[k] += (c[0] - this.R[k]) * a;
  this.G[k] += (c[1] - this.G[k]) * a;
  this.B[k] += (c[2] - this.B[k]) * a;
};

/** Maske: çizim fonksiyonu (sahne koordinatında) → Float32Array (0..1) */
function maske(B, ciz) {
  const c = S.yeniTuval(B.W, B.W);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(B.s, 0, 0, B.s, 0, 0);
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, B.W, B.W).data;
  const m = new Float32Array(B.W * B.W);
  const W = B.W;
  let x0 = W;
  let y0 = W;
  let x1 = -1;
  let y1 = -1;
  for (let k = 0; k < m.length; k++) {
    const a = d[k * 4 + 3];
    if (a) {
      m[k] = a / 255;
      const px = k % W;
      const py = (k - px) / W;
      if (px < x0) x0 = px;
      if (px > x1) x1 = px;
      if (py < y0) y0 = py;
      if (py > y1) y1 = py;
    }
  }
  m.bb = x1 < 0 ? [0, 0, -1, -1] : [x0, y0, x1, y1];
  return m;
}
/** Maskeyi canvas filtresiyle bulanıklaştırır (px: sahne biriminde). */
function bulanik(B, m, px) {
  const W = B.W;
  const c = S.yeniTuval(W, W);
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(W, W);
  for (let k = 0; k < m.length; k++) {
    im.data[k * 4 + 3] = m[k] * 255;
  }
  x.putImageData(im, 0, 0);
  const c2 = S.yeniTuval(W, W);
  const x2 = c2.getContext('2d', { willReadFrequently: true });
  x2.filter = `blur(${px * B.s}px)`;
  x2.drawImage(c, 0, 0);
  const d = x2.getImageData(0, 0, W, W).data;
  const out = new Float32Array(W * W);
  for (let k = 0; k < out.length; k++) out[k] = d[k * 4 + 3] / 255;
  if (m.bb) {
    const e = Math.ceil(px * B.s * 3) + 2;
    out.bb = [Math.max(0, m.bb[0] - e), Math.max(0, m.bb[1] - e), Math.min(W - 1, m.bb[2] + e), Math.min(W - 1, m.bb[3] + e)];
  }
  return out;
}

/**
 * Fırça darbesi (piksel başına). o:
 *  pts: orta çizgi (sahne koordinatı), w: yarı genişlik (sayı ya da f(t,x,y)),
 *  c1, c2: iki tonlu yükleme (v=-1 kenarı c1, v=+1 kenarı c2; [r,g,b] 0..1), d1, d2: iki kenarın yoğunluğu,
 *  gecis: tonların karışma eğrisi (1 doğrusal; >1 c1 baskın),
 *  havuz: ıslak kenar koyulaşması, kil: kıl izi şiddeti, kilSik: kıl sıklığı, kenar: kenar titremesi (0..),
 *  kuru: kuru uç oranı (0..1), opak: örtücü mü, maske: Float32Array (çarpan), ucHavuz: uçta boya birikmesi
 */
function darbe(B, o) {
  const s = B.s;
  const W = B.W;
  let pts = o.pts.map((p) => [p[0] * s, p[1] * s]);
  pts = yenidenOrnekle(pts, 1.0);
  const n = pts.length;
  if (n < 2) return;
  const cs = new Float32Array(n);
  for (let i = 1; i < n; i++) cs[i] = cs[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = cs[n - 1] || 1;
  // yumuşatılmış normaller
  const N = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 3)];
    const b = pts[Math.min(n - 1, i + 3)];
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  const ofs = (_ofs += 17.13);
  const ke = o.kenar != null ? o.kenar : 0.08;
  const kf = o.kenarFrek != null ? o.kenarFrek : 0.06;
  const hwA = new Float32Array(n);
  const hwB = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = cs[i] / L;
    const w = (typeof o.w === 'function' ? o.w(t, pts[i][0] / s, pts[i][1] / s) : o.w) * s;
    const us = cs[i] / s;
    hwA[i] = Math.max(0, w * (1 + ke * ((NZ.n(us * kf + ofs, 1.3) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs, 7.7) - 0.5) * 0.6)));
    hwB[i] = Math.max(0, w * (1 + ke * ((NZ.n(us * kf + ofs + 50, 2.9) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs + 50, 4.1) - 0.5) * 0.6)));
  }
  let bx0 = W;
  let by0 = W;
  let bx1 = 0;
  let by1 = 0;
  const bv = B._bv;
  const BU = B._u;
  const BV = B._v;
  const BH = B._h;
  for (let i = 0; i < n - 1; i++) {
    const ax = pts[i][0];
    const ay = pts[i][1];
    const dx = pts[i + 1][0] - ax;
    const dy = pts[i + 1][1] - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) continue;
    const len = Math.sqrt(len2);
    const ex = (dx / len) * 1.2;
    const ey = (dy / len) * 1.2;
    const hA0 = hwA[i] + 1;
    const hB0 = hwB[i] + 1;
    const hA1 = hwA[i + 1] + 1;
    const hB1 = hwB[i + 1] + 1;
    const kx = [ax - ex + N[i][0] * hA0, ax - ex - N[i][0] * hB0, ax + dx + ex + N[i + 1][0] * hA1, ax + dx + ex - N[i + 1][0] * hB1];
    const ky = [ay - ey + N[i][1] * hA0, ay - ey - N[i][1] * hB0, ay + dy + ey + N[i + 1][1] * hA1, ay + dy + ey - N[i + 1][1] * hB1];
    const x0 = Math.max(0, Math.floor(Math.min(kx[0], kx[1], kx[2], kx[3]) - 1));
    const x1 = Math.min(W - 1, Math.ceil(Math.max(kx[0], kx[1], kx[2], kx[3]) + 1));
    const y0 = Math.max(0, Math.floor(Math.min(ky[0], ky[1], ky[2], ky[3]) - 1));
    const y1 = Math.min(W - 1, Math.ceil(Math.max(ky[0], ky[1], ky[2], ky[3]) + 1));
    if (x0 < bx0) bx0 = x0;
    if (y0 < by0) by0 = y0;
    if (x1 > bx1) bx1 = x1;
    if (y1 > by1) by1 = y1;
    const nx0 = N[i][0];
    const ny0 = N[i][1];
    const nx1 = N[i + 1][0];
    const ny1 = N[i + 1][1];
    const ilk = i === 0;
    const son = i === n - 2;
    for (let py = y0; py <= y1; py++) {
      const qy = py + 0.5;
      for (let px = x0; px <= x1; px++) {
        const qx = px + 0.5;
        const t = ((qx - ax) * dx + (qy - ay) * dy) / len2;
        if (t < -1.2 || t > 2.2) continue;
        if ((ilk && t < 0) || (son && t > 1)) continue;
        const tc = t < 0 ? 0 : t > 1 ? 1 : t;
        if (Math.abs(t - tc) * len > 1.1) continue;
        const cx = ax + dx * tc;
        const cy = ay + dy * tc;
        const nx = nx0 + (nx1 - nx0) * tc;
        const ny = ny0 + (ny1 - ny0) * tc;
        const sd = (qx - cx) * nx + (qy - cy) * ny;
        const hw = sd >= 0 ? hwA[i] + (hwA[i + 1] - hwA[i]) * tc : hwB[i] + (hwB[i + 1] - hwB[i]) * tc;
        const hwp = hw + 0.75;
        const av = Math.abs(sd) / hwp;
        if (av > 1) continue;
        const k = py * W + px;
        if (av < bv[k]) {
          bv[k] = av;
          BU[k] = cs[i] + tc * len;
          BV[k] = sd / hwp;
          BH[k] = hwp;
        }
      }
    }
  }

  const c1 = o.c1;
  const c2 = o.c2 || o.c1;
  const d1 = o.d1 != null ? o.d1 : o.d != null ? o.d : 0.8;
  const d2 = o.d2 != null ? o.d2 : d1;
  const gecis = o.gecis || 1;
  const havuz = o.havuz != null ? o.havuz : 0.35;
  const kil = o.kil != null ? o.kil : 0.25;
  const kilSik = o.kilSik != null ? o.kilSik : 0.45;
  const kuru = o.kuru || 0;
  const ucHavuz = o.ucHavuz || 0;
  const basHavuz = o.basHavuz || 0;
  const dSon = o.dSon != null ? o.dSon : 1;
  const puruz = o.puruz != null ? o.puruz : 0.7;
  const yuk = o.yuk || null;
  const kal = o.kal != null ? o.kal : 1;
  const opak = !!o.opak;
  const mk = o.maske;
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;
  const kilOfs = ofs * 0.31;
  const yumusakKenar = o.yumusak != null ? o.yumusak : 1.0;
  const cb = o.renkFn; // isteğe bağlı f(t, v, x, y) → [c, d] üzerine yazar

    for (let px = bx0; px <= bx1; px++) {
      const k = py * W + px;
      const av = bv[k];
      if (av > 1.5) continue;
      bv[k] = 9;
      const u = BU[k];
      const v = BV[k];
      const hwp = BH[k];
      const t = u / L;
      const fe = Math.min(0.9, (yumusakKenar * s) / hwp);
      const avr = dis && puruz ? av + ((puruz * s) / hwp) * (0.5 + 0.5 * kenet(dis[k], -1, 1)) : av;
      let cov = 1 - yumusak(1 - fe, 1, avr);
      if (cov <= 0) continue;
      // kıl izleri: darbe boyunca uzanan ince çizgiler
      const vp = (v * hwp) / s;
      const br = NZ.n(vp * kilSik + kilOfs, (u / s) * 0.018 + kilOfs);
      const br2 = NZ2.n(vp * kilSik * 2.3 + kilOfs, (u / s) * 0.03);
      let dm = 1 + kil * ((br - 0.5) * 1.6 + (br2 - 0.5) * 0.8);
      // kuru uç
      if (kuru > 0 && t > 1 - kuru) {
        const q = (t - (1 - kuru)) / kuru;
        cov *= yumusak(q - 0.25, q + 0.15, br * 0.75 + br2 * 0.35);
      }
      // ıslak kenar
      dm *= 1 + havuz * yumusak(0.5, 0.97, av);
      if (ucHavuz > 0) dm *= 1 + ucHavuz * yumusak(0.82, 0.99, t);
      if (basHavuz > 0) dm *= 1 + basHavuz * (1 - yumusak(0.0, 0.12, t));
      if (dSon !== 1) dm *= 1 + (dSon - 1) * t;
      let m = (v + 1) * 0.5;
      if (gecis !== 1) m = Math.pow(m, gecis);
      let cr = c1[0] + (c2[0] - c1[0]) * m;
      let cg = c1[1] + (c2[1] - c1[1]) * m;
      let cbb = c1[2] + (c2[2] - c1[2]) * m;
      let d = (d1 + (d2 - d1) * m) * dm * cov;
      if (cb) {
        const r = cb(t, v, px / s, py / s, d);
        if (r) {
          cr = r[0][0];
          cg = r[0][1];
          cbb = r[0][2];
          d = r[1] * cov * dm;
        }
      }
      if (dis && disG) d *= 1 + disG * dis[k];
      if (mk) {
        if (mk.v) {
          const li = px - mk.x0;
          const lj = py - mk.y0;
          d *= li >= 0 && lj >= 0 && li < mk.w && lj < mk.h ? mk.v[lj * mk.w + li] : 0;
        } else d *= mk[k];

      if (d <= 0.002) continue;
      if (opak) B.opak(k, [cr, cg, cbb], d);
      else B.glaze(k, [cr, cg, cbb], d);
      if (yuk) {

        const dc = d > 1 ? 1 : d;
        yuk[k] += (hh - yuk[k]) * dc;
      }
    }
  }
}

/** Yarım genişlik profilleri (t: 0 giriş → 1 çıkış) */
const PROFIL = {

  firca: (t) => (t < 0.12 ? 0.55 + 0.45 * Math.sin((Math.PI / 2) * (t / 0.12)) : 1) * (t > 0.5 ? Math.pow(Math.cos(((t - 0.5) / 0.5) * (Math.PI / 2)), 0.75) : 1),
  // iki ucu sivri yaprak
  yaprak: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.62),
  // yuvarlak uçlu kısa leke
  leke: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.4),
  // düz bant: uçlarda kısa incelme
  bant: (t) => Math.min(1, 0.6 + 0.4 * Math.sin((Math.PI / 2) * Math.min(1, t / 0.04)), 0.5 + 0.5 * Math.sin((Math.PI / 2) * Math.min(1, (1 - t) / 0.05))),
};

/** Yuvarlak topuklu, ucu incelen darbe profili (L: darbe boyu, hw: yarı genişlik, uc: incelen uç oranı). */
function yuvarlakProf(L, hw, uc, bas) {
  const cap = hw * (bas != null ? bas : 0.9);
  return (t) => {
    const d = t * L;
    let f = 1;
    if (d < cap) {
      const q = 1 - d / cap;
      f = 0.12 + 0.88 * Math.sqrt(Math.max(0, 1 - q * q));
    }
    if (uc > 0 && t > 1 - uc) f *= Math.pow(Math.max(0, Math.cos(((t - (1 - uc)) / uc) * (Math.PI / 2))), 0.55);
    return f;
  };
}

/** Yatay (ya da açılı) lavi: maske üzerinde düz renk, fırça sırası izi ve kenar havuzu. */

}

/** Kâğıt dişi: −1..1 alanı (lif + tane). */
function kagitDisi(B, o) {

      if (lif) v += (nz.n(x * 0.05 + y * 0.9, y * 0.05 - x * 0.2) - 0.5) * 2 * lif;

/** Ana tuvalin pikselleri üzerinde geçiş. */

/** SVG yolunun sahne koordinatında sınır kutusu. */

/** Yerel maske: {v, x0, y0, w, h} (tampon pikseli). kutu: sahne koordinatında [x0,y0,x1,y1]. */

/** Yerel maskeyi bulanıklaştırır (kutu genişler). */

/** Uzun cetvel çizgisi: fırça yeniden yüklenince birleşen parçalar, köşelerde hafif taşma. */
function cetvelUzun(ctx, x1, y1, x2, y2, o) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  const tas = o && o.tasma != null ? o.tasma : 0.8;
  const ux = (x2 - x1) / (L || 1);
  const uy = (y2 - y1) / (L || 1);
  const ax = x1 - ux * tas;
  const ay = y1 - uy * tas;
  const bx = x2 + ux * tas;
  const by = y2 + uy * tas;
  const LL = L + 2 * tas;
  if (LL < 170) return cetvel(ctx, ax, ay, bx, by, o);
  const n = Math.max(2, Math.round(LL / (110 + ((_ofs * 7.3) % 60))));
  let t0 = 0;
  for (let i = 0; i < n; i++) {

/** Bir yerel maskeyi aynı yönde, yan yana fırça darbeleriyle doldurur (boya izi görünen düz renk). */

  if (!ym) return;

  const en = o.en || 6;
  const ara = o.aralik || en * 1.5;
  let off = -Rp + ara * 0.4 * rr();
  while (off <= Rp + ara * 0.5) {
    const px = cx - sa * off;
    const py = cy + ca * off;
    const L = Ra * 2;
    const bas = -Ra - rr() * 8;

      w: en * (0.85 + 0.3 * rr()),
      c1,
      c2: c1,
      d1: (o.d1 != null ? o.d1 : o.d) * (0.9 + 0.2 * rr()),
      d2: (o.d1 != null ? o.d1 : o.d) * (0.9 + 0.2 * rr()),
      maske: ym,
    }));
    off += ara * (0.85 + 0.3 * rr());

/** Küçük yumuşak nokta (noktalama / pardaht): hafif eliptik, kenarı yumuşak. */
function nokta(B, x, y, rad, c, d, opak, aci, bas) {

  const y1 = Math.min(W - 1, Math.ceil(cy + R * e + 1));

    }

}
/** Noktalama ile gölgeleme: kutu içinde titrek ızgara; her hücrede p = golge(x,y) olasılığıyla bir nokta. */
function noktala(B, kutu, golge, o) {
  const rr = o.rng || S.rng(o.tohum || 9);
  const g = o.aralik || 2.4;
  for (let y = kutu[1]; y < kutu[3]; y += g) {
    for (let x = kutu[0]; x < kutu[2]; x += g) {
      const px = x + (rr() - 0.5) * g * 0.9;
      const py = y + (rr() - 0.5) * g * 0.9;
      const p = golge(px, py);
      if (p <= 0 || rr() > p) continue;
      const c = o.c2 ? karistir(o.c, o.c2, rr()) : o.c;
      nokta(B, px, py, (o.r || 0.9) * (0.75 + 0.5 * rr()), c, (o.d || 0.5) * (0.7 + 0.5 * rr()), o.opak, rr() * Math.PI, 1 + rr() * 0.4);
    }
  }
}
/** Yerel maskenin değeri (sahne koordinatında), dışarıda 0. */
function ymDeger(B, ym, x, y) {
  if (!ym) return 0;
  const i = Math.round(x * B.s) - ym.x0;
  const j = Math.round(y * B.s) - ym.y0;
  if (i < 0 || j < 0 || i >= ym.w || j >= ym.h) return 0;
  return ym.v[j * ym.w + i];
}

/** Boya kabartısı: yükseklik alanından sağ üst ışıkla hafif aydınlatma (guaj darbelerinin kalınlığı). */
function kabartma(B, yuk, guc) {
  const W = B.W;
  for (let y = 1; y < W - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const k = y * W + x;
      const gx = yuk[k + 1] - yuk[k - 1];
      const gy = yuk[k + W] - yuk[k - W];
      // ışık sağ üstten: yüzey sağa-yukarı bakıyorsa (yükseklik sola-aşağı artıyorsa) aydınlık
      let sh = (-gx * 0.7 + gy * 0.7) * guc;
      if (sh > 0.12) sh = 0.12;
      if (sh < -0.12) sh = -0.12;
      const f = 1 + sh;
      B.R[k] = Math.min(1, B.R[k] * f);
      B.G[k] = Math.min(1, B.G[k] * f);
      B.B[k] = Math.min(1, B.B[k] * f);
    }
  }
}

/** Maske içini yan yana kısa guaj darbeleriyle doldurur; renkFn(x,y) → [renk, yoğunluk]. */

    // tepe kenarı: kıvrımı izleyen kısa, beyaz yay darbeleri (kenar darbe uçlarından oluşur)
    let x = cx - yariEn * 0.92;
    while (x < cx + yariEn * 0.92) {

      const pts = [];
      for (let i = 0; i <= 8; i++) {

    }
  }
  bulut(142, 210, 96, 30, 2321);

}

{

};

}

guajDoldur(ymDik(273, 316, 327, 322), { en: 2, aralik: 2.6, boy: 14, renkFn: (x, y, rr) => [karistir(P.golge, P.golgeK, 0.5), 0.9] });

// minarenin parçaları çevresinde ince, serin gri-mavi kontur (ihraç resminin düzgün ama elle çekilmiş çizgisi)

// ------------------------------------------------------------------ kaide: parlak beyaz, sıra sıra yatay darbeler (taş dizileri gibi düzenli)
{

    const gol = 0.75 * Math.exp(-Math.pow((y - 707) / 8, 2)) + 0.6 * Math.pow(Math.max(0, 1 - (x - 300) / 70), 2) + 0.12 * yumusak(760, 800, y);

    let x = 296 - rk() * 20 - (sira % 2) * 18;
    while (x < 826) {
      const L = 30 + rk() * 34;
      const yy = y + (rk() - 0.5) * 1.2;
      const pts = [];
      for (let i = 0; i <= 6; i++) pts.push([x + (L * i) / 6, yy + 0.8 * Math.sin((Math.PI * i) / 6)]);
      let c = kaideTon(x + L / 2, yy);

      c = s > 0 ? karistir(c, hex('#D9E2EC'), s * 3) : karistir(c, P.beyaz, -s * 6);
      g({ pts, w: ((h) => ((pf) => (t) => h * pf(t))(yuvarlakProf(L, h, 0.3, 0.8)))(3.5 + rk() * 0.6), c1: c, c2: c, d1: 0.95, d2: 0.95, maske: km, kal: 1.2, kil: 0.1 });
      x += L * (0.7 + 0.2 * rk());

  konturYol(Y.kaide, 0.6, hex('#8497B3'), 0.75);

}

// ------------------------------------------------------------------ kasnak: zümrüt, solda derin yeşil
const KD = karistir(P.derin, P.zumrut, 0.38); // kasnağın en koyu yeşili (daha açık, ışıl ışıl)
for (const kat of [1, 0]) {
  const q = S.kasnak[kat];
  const cx = (q.x1 + q.x2) / 2;
  const R = (q.x2 - q.x1) / 2;
  const kr = (x, y, rr) => {
    const s = kenet((x - cx) / R, -1, 1);
    const isik = kenet(0.5 + 0.5 * Math.cos(Math.asin(s) - 0.7), 0, 1);
    let c = isik < 0.5 ? karistir(KD, P.zumrut, isik * 2) : karistir(P.zumrut, P.zumrutA, (isik - 0.5) * 2);
    c = karistir(c, P.derin, 0.3 * Math.exp(-Math.pow((y - q.y1) / 6, 2)));
    return [c, 1];
  };
  taban(ym(kat ? Y.kasnakAlt : Y.kasnakUst, 1), kr);
  // dikey, küt başlı darbeler (sütun sütun), üstte kornişin gölgesi yatay bir darbe şeridiyle
  {
    const km2 = ym(kat ? Y.kasnakAlt : Y.kasnakUst, 1);
    const rd = S.rng(2350 + kat);
    for (let x = q.x1 - 2 + rd() * 3; x < q.x2 + 2; x += 5.6 + rd() * 1.4) {
      let y = q.y2 + 2 - rd() * 8;
      while (y > q.y1 - 2) {
        const L = 18 + rd() * 16;
        const pts = [];
        const eg = (rd() - 0.5) * 1.2;
        for (let i = 0; i <= 5; i++) pts.push([x + eg * Math.sin((Math.PI * i) / 5), y - (L * i) / 5]);
        const sx = kenet((x - cx) / R, -1, 1);
        const isik = kenet(0.5 + 0.5 * Math.cos(Math.asin(sx) - 0.7), 0, 1);
        let c = isik < 0.5 ? karistir(KD, P.zumrut, isik * 2) : karistir(P.zumrut, P.zumrutA, (isik - 0.5) * 2);
        const mik = rd();
        c = rd() < 0.5 ? karistir(c, hex('#5ED29A'), 0.38 * mik) : karistir(c, P.derin, 0.32 * mik);
        g({ pts, w: ((pf) => (t) => 3.6 * pf(t))(yuvarlakProf(L, 3.6, 0.25, 0.8)), c1: c, c2: c, d1: 0.92, d2: 0.92, maske: km2, kal: 1.2, kil: 0.2 });
        y -= L * (0.72 + 0.2 * rd());
      }
    }
    for (let x = q.x1 - 6 - rd() * 10; x < q.x2; ) {
      const L = 40 + rd() * 30;
      const sx = kenet((x + L / 2 - cx) / R, -1, 1);
      const isik = kenet(0.5 + 0.5 * Math.cos(Math.asin(sx) - 0.7), 0, 1);
      const c = karistir(P.derin, P.derinK, 0.25 + 0.35 * (1 - isik) + rd() * 0.1);
      g({ pts: [[x, q.y1 + 4.2], [x + L * 0.5, q.y1 + 4.6], [x + L, q.y1 + 4.0]], w: ((pf) => (t) => 2.6 * pf(t))(yuvarlakProf(L, 2.6, 0.3, 0.8)), c1: c, c2: c, d1: 0.9, d2: 0.9, maske: km2, kal: 1 });
      x += L * (0.7 + 0.2 * rd());
    }
  }
  g({ pts: [[q.x1, q.y1 + 1.2], [q.x2, q.y1 + 1.2]], w: 1.3, c1: P.zumrutP, c2: P.zumrutP, d1: 0.85, d2: 0.85, kil: 0.1 });
  for (const p of S.kasnakPencereleri(kat)) pencereBoya(p, hex('#0E4A2E'), hex('#1D6544'), hex('#4FA877'));
  konturYol(kat ? Y.kasnakAlt : Y.kasnakUst, 0.65, P.derinK, 0.75);
}

// ------------------------------------------------------------------ kubbe: ışıl ışıl zümrüt; dilim dilim, meridyen boyunca basamaklı darbelerle modelaj
{
  const km = ym(Y.kubbe, 1);
  const DG = Math.PI / 16;
  // genel ışık (sağ üstten) + her dilimin kendi dışbükeyliği (dilimin solu biraz koyu, sağı açık)
  const kubbeIsik = (u, y) => {
    const lon = Math.asin(kenet(u, -1, 1));
    const fr = (((lon + Math.PI / 2) / DG) % 1 + 1) % 1;
    const dilim = 0.42 * (fr - 0.5) + 0.08 * Math.sin(Math.PI * fr);
    return kenet(0.46 + 0.5 * u - 0.34 * yumusak(0.84, 1, u) + 0.14 * (1 - (y - 300) / 255) + dilim, 0, 1);
  };
  const tonla = (isik) => (isik < 0.5 ? karistir(P.derin, P.zumrut, isik * 2) : karistir(P.zumrut, hex('#45C88A'), (isik - 0.5) * 2));
  taban(km, (x, y) => {
    const R = kubbeR(y) || 1;
    return [tonla(kubbeIsik(kenet((x - 560) / R, -1, 1), y)), 1];
  });
  // her dilime üç sütun darbe; darbeler meridyen boyunca, kısa ve üst üste binen
  for (let gi = 0; gi < 16; gi++) {
    for (let s = 0; s < 3; s++) {
      const lon = -Math.PI / 2 + DG * (gi + (s + 0.5 + (r() - 0.5) * 0.35) / 3);
      const u = Math.sin(lon);
      let y = 560 + r() * 4;
      while (y > 300) {
        const L = 26 + r() * 26;
        const y2 = Math.max(298, y - L);
        const pts = [];
        for (let i = 0; i <= 6; i++) {
          const yy = y + (y2 - y) * (i / 6);
          pts.push([560 + u * kubbeR(yy), yy]);
        }
        const ym2 = (y + y2) / 2;
        const isik = kubbeIsik(u, ym2);
        // basamaklı ton (6 kademe), her darbe ±%12 kendi tonunda
        const kademe = Math.round(isik * 6) / 6;
        let c = tonla(kademe);
        const v = 1 + (r() - 0.5) * 0.3;
        c = karistir(c, r() < 0.5 ? P.zumrutA : P.derin, r() * 0.24).map((q) => Math.min(1, q * v));
        const en = 1.4 + 3.0 * (kubbeR(ym2) / 200) * Math.sqrt(Math.max(0.05, 1 - u * u));
        g({ pts, w: (t) => en * PROFIL.yaprak(t * 0.9 + 0.05), c1: c, c2: c, d1: 0.93, d2: 0.93, maske: km, kal: 1.3 });
        if (y2 <= 300) break;
        y = y2 + 5 + r() * 4;
      }
    }
  }
  // parlak vurgular: sağ üstte, dilimlerin sağ yarısında açık zümrüt kısa darbeler
  for (let i = 0; i < 190; i++) {
    const gi = 9 + Math.floor(r() * 5);
    const lon = -Math.PI / 2 + DG * (gi + 0.45 + r() * 0.4);
    const u = Math.sin(lon);
    const y = 325 + r() * 175;
    const yv = Math.hypot((u - 0.45) / 0.32, (y - 395) / 90);
    if (yv > 1 || r() > 1 - yv * 0.65) continue;
    const L = 14 + r() * 16;
    const pts = [];
    for (let k = 0; k <= 4; k++) { const yy = y - (L * k) / 4; pts.push([560 + u * kubbeR(yy), yy]); }
    const hc = karistir(hex('#52CF92'), hex('#9AE6BC'), r() * 0.7 * (1 - yv * 0.5));
    g({ pts, w: (t) => (2.4 + r() * 1.3) * PROFIL.yaprak(t), c1: hc, c2: hc, d1: 0.88, d2: 0.88, maske: km, kal: 1.4 });
  }
  // kaburgalar: elle çekilmiş ince koyu çizgi ve yanında açık sırt
  for (const k of S.kaburgalar(16, 60)) {
    const pts = k.noktalar.filter((p) => p[1] > 306);
    g({ pts: pts.map((p) => [p[0] - 1.1, p[1]]), w: (t) => 1.15 * (1 - t * 0.55) + 0.1, c1: P.derinK, c2: P.derinK, d1: 0.78, d2: 0.78, maske: km, kil: 0.05, kenar: 0.3, kenarFrek: 0.04 });
    g({ pts: pts.map((p) => [p[0] + 0.9, p[1]]), w: (t) => 0.8 * (1 - t * 0.6), c1: P.zumrutP, c2: P.zumrutP, d1: 0.62, d2: 0.62, maske: km, kil: 0.05, kenar: 0.3, kenarFrek: 0.04 });
  }
  // kubbenin silueti: elle çekilmiş, kalınlığı oynayan derin yeşil kontur
  konturYol(Y.kubbe, 0.8, P.derinK, 0.8);
}
// altın alemler: örtücü altın sarısı gövde, kürelerde sol altta koyu yay, sağ üstte açık yay ve küçük ışık darbesi,
// her parçanın çevresinde elle çekilmiş, kalınlığı oynayan koyu altın kontur
function alemBoya(yollar, A, sc) {
  for (const d of yollar) {
    const k = yolKutu(d, 0);
    const m = ym(d, 1);
    taban(m, (x) => { const u = kenet((x - k[0]) / (k[2] - k[0] + 0.01), 0, 1); return [karistir(P.altinK, P.altinA, yumusak(0.1, 0.95, u)), 1]; });
    guajDoldur(m, { en: 1.3 * sc + 0.3, aralik: 1.6 * sc + 0.3, boy: 8 * sc + 2, aci: Math.PI / 2, renkFn: (x, y, rr) => {
      const u = kenet((x - k[0]) / (k[2] - k[0] + 0.01), 0, 1);
      let c = u < 0.32 ? P.altinK : u < 0.66 ? P.altin : P.altinA;
      c = karistir(c, rr() < 0.5 ? P.altinA : P.altinK, rr() * 0.3);
      return [c, 0.95];
    } });
  }
  for (const q of A.kureler) {
    const m = ymaske(B, (x) => { x.beginPath(); x.arc(q.cx, q.cy, q.r, 0, Math.PI * 2); x.fill(); }, [q.cx - q.r - 2, q.cy - q.r - 2, q.cx + q.r + 2, q.cy + q.r + 2]);
    const yay = (R, a0, a1) => { const o = []; for (let i = 0; i <= 10; i++) { const a = a0 + (a1 - a0) * (i / 10); o.push([q.cx + Math.cos(a) * R, q.cy + Math.sin(a) * R]); } return o; };
    g({ pts: yay(q.r * 0.78, Math.PI * 0.35, Math.PI * 1.2), w: (t) => q.r * 0.26 * PROFIL.yaprak(t) + 0.3, c1: hex('#A9741A'), c2: hex('#A9741A'), d1: 0.8, d2: 0.8, maske: m, kil: 0.1, kal: 0.8 });
    g({ pts: yay(q.r * 0.55, -Math.PI * 0.85, -Math.PI * 0.12), w: (t) => q.r * 0.2 * PROFIL.yaprak(t) + 0.3, c1: hex('#FBE69A'), c2: hex('#FBE69A'), d1: 0.85, d2: 0.85, maske: m, kil: 0.1, kal: 0.8 });
    nokta(B, q.cx + q.r * 0.34, q.cy - q.r * 0.38, Math.max(0.8, q.r * 0.16), hex('#FFF7D6'), 0.9, true, -0.7, 1.4);
  }
  // yaka: üstte açık, altta koyu yatay darbe
  const yk = A.yaka;
  g({ pts: [[yk.cx - yk.rx * 0.8, yk.cy - yk.ry * 0.25], [yk.cx, yk.cy - yk.ry * 0.45], [yk.cx + yk.rx * 0.8, yk.cy - yk.ry * 0.25]], w: (t) => yk.ry * 0.28 * PROFIL.yaprak(t) + 0.3, c1: hex('#FBE69A'), c2: hex('#FBE69A'), d1: 0.8, d2: 0.8, kil: 0.1, kal: 0.8 });
  // kontur
  for (const d of yollar) {
    for (const pp of ornekle(d, 0.8)) {
      const pts = pp.kapali ? pp.pts.concat([pp.pts[0]]) : pp.pts;
      const o = (_ofs += 3.3);
      g({ pts, w: (t) => (0.28 + 0.32 * NZ.n(t * 7 + o, 2.2)) * (0.6 + 0.4 * sc) + 0.08, c1: hex('#8C5E10'), c2: hex('#8C5E10'), d1: 0.85, d2: 0.85, kil: 0, kenar: 0.2, kal: 0.4 });
    }
  }
}
alemBoya(Y.alem, S.alemParcalari(560, 300, 1), 1);
alemBoya(Y.minareAlem, MP.find((p) => p.tip === 'alem').alem, 0.62);

// ------------------------------------------------------------------ bitkiler: doygun yeşil yapraklar, beyaz ve pembe şakayıklar
for (const s of S.bitki.saplar) {
  g({ pts: s, w: (t) => 2.5 - 1.1 * t, c1: P.yaprakK, c2: P.yaprak, d1: 0.97, d2: 0.97, kenar: 0.14, kenarFrek: 0.04 });
  // sapın ışık yanında (sağda) ince açık darbe, parça parça
  const sp = ofsetle(s, 0.9, false);
  for (let i = 0; i < sp.length - 3; i += 3 + Math.floor(r() * 3)) {
    const j = Math.min(sp.length - 1, i + 2 + Math.floor(r() * 3));
    g({ pts: sp.slice(i, j + 1), w: (t) => 0.6 * PROFIL.leke(t) + 0.15, c1: hex('#8FD06A'), c2: hex('#8FD06A'), d1: 0.75, d2: 0.75, kil: 0, kal: 0.5 });
  }
}
S.bitki.tomurcuklar.forEach((t, i) => {
  if (i < 8) return;
  g({ pts: bezier([t.x + 1, t.y + 30], [t.x - 2, t.y + 18], [t.x - Math.cos(t.aci) * 6, t.y - Math.sin(t.aci) * 6 + 2], null, 12), w: 1.4, c1: P.yaprakK, c2: P.yaprak, d1: 0.97, d2: 0.97 });
});
// yaprak kenarı (S.yaprakYolu ile aynı Bezier): u ∈ [0,1] boyunca yarı genişlik tablosu
const YK = (() => {
  const tab = new Float32Array(65);
  const smp = [];
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    const u = 3 * (1 - t) * (1 - t) * t * 0.35 + 3 * (1 - t) * t * t * 0.8 + t * t * t;
    const v = 3 * (1 - t) * (1 - t) * t * 0.75 + 3 * (1 - t) * t * t * 0.45;
    smp.push([u, v]);
  }
  for (let k = 0; k <= 64; k++) {
    const u = k / 64;
    let best = 0;
    for (let i = 0; i < smp.length - 1; i++) if (smp[i][0] <= u && smp[i + 1][0] >= u) { const q = (u - smp[i][0]) / (smp[i + 1][0] - smp[i][0] || 1); best = smp[i][1] + (smp[i + 1][1] - smp[i][1]) * q; break; }
    tab[k] = best;
  }
  return (u) => { const q = kenet(u, 0, 1) * 64; const i = Math.min(63, Math.floor(q)); return tab[i] + (tab[i + 1] - tab[i]) * (q - i); };
})();
S.bitki.yapraklar.forEach((y) => {
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  const ton = r();
  const m = ym(S.yaprakYolu(y), 1);
  // ışık sağ üstten: normali sağ üste bakan yarı açık
  const isikYan = -sa * 0.7 - ca * 0.7 > 0 ? 1 : -1;
  for (const yan of [-1, 1]) {
    const acik = yan === isikYan;
    const govde = acik ? karistir(P.yaprak, P.yaprakA, 0.3 + ton * 0.35) : karistir(P.yaprakK, P.yaprak, ton * 0.45);
    // 1) gövde: yarıyı kaplayan bir darbe
    const pts = [];
    for (let k = 0; k <= 12; k++) {
      const t = k / 12;
      pts.push(p(L * t, yan * W * 0.5 * YK(t)));
    }
    g({ pts, w: (t) => W * 0.62 * YK(t) + 1.0, c1: govde, c2: govde, d1: 0.98, d2: 0.98, maske: m, kil: 0.2, kal: 1.1 });
    // 2) balıksırtı dolgu: yarının tamamı, orta damardan kenara (ve kenarın biraz dışına, maske keser) uca doğru
    //    eğik, yan yana küt darbelerle örülür; her darbe kendi tonunda (±%13), dipten uca ton açılır
    const adim = Math.max(2.6, W * 0.12);
    const egim = 0.75 + r() * 0.2; // darbenin orta damara göre ileri eğimi
    for (let u0 = -adim * 0.3; u0 < L * 0.96; u0 += adim * (0.8 + 0.35 * r())) {
      const tt = kenet(u0 / L, 0, 1);
      const hwE = W * YK(kenet(tt + 0.08, 0, 1)) * 1.25 + 1.5;
      const sp = [];
      for (let k = 0; k <= 5; k++) {
        const q = k / 5;
        const vv = hwE * q;
        sp.push(p(u0 + vv * egim + 1.2 * Math.sin(Math.PI * q), yan * vv));
      }
      const grad = acik ? tt * 0.35 : tt * 0.15;
      let c = karistir(govde, acik ? hex('#B6E383') : P.yaprak, grad);
      const v = (r() - 0.5) * 2;
      c = v > 0 ? karistir(c, acik ? hex('#D2F0A0') : hex('#4FB062'), v * (acik && v > 0.7 ? 0.55 : 0.38)) : karistir(c, hex('#0E4E24'), -v * 0.3);
      const hw = adim * (0.55 + 0.2 * r());
      g({ pts: sp, w: ((pf) => (t) => hw * pf(t))(yuvarlakProf(hwE * 1.3, hw, 0.25, 0.7)), c1: c, c2: c, d1: 0.93, d2: 0.93, maske: m, kil: 0.18, kal: 1.15 });
    }
  }
  // damar: açık sarı-yeşil ince darbe
  g({ pts: [p(L * 0.03, 0), p(L * 0.5, W * 0.01), p(L * 0.9, 0)], w: (t) => 0.8 * (1 - t * 0.7) + 0.2, c1: hex('#BFE47F'), c2: hex('#BFE47F'), d1: 0.88, d2: 0.88, maske: m, kil: 0.05 });
  // gölge yanında elle çekilmiş ince koyu kontur (kalınlığı 0.6–1.6 px oynar), uçta incelir
  const kp = [];
  for (let k = 0; k <= 20; k++) {
    const t = 0.04 + 0.96 * (k / 20);
    kp.push(p(L * t, -isikYan * W * YK(t) * 0.97));
  }
  g({ pts: kp, w: (t) => 0.55 + 0.55 * Math.sin(Math.PI * t) * (0.7 + 0.6 * NZ.n(t * 5 + ton * 9, 2.2)), c1: hex('#145C2B'), c2: hex('#145C2B'), d1: 0.75, d2: 0.75, kil: 0, kenar: 0.2, kal: 0.6 });
});
// tomurcuklar: pembe
for (const t of S.bitki.tomurcuklar) {
  const m = ym(S.tomurcukYolu(t), 1);
  guajDoldur(m, { en: 1.6, aralik: 2, boy: 10, aci: t.aci, renkFn: (x, y, rr) => [karistir(P.pembe, P.pembeK, rr() * 0.5), 0.98] });
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  for (const yan of [-1, 1]) g({ pts: [[t.x - ca * t.r * 0.9, t.y - sa * t.r * 0.9], [t.x + ca * t.r * 0.3 - sa * yan * t.r * 0.55, t.y + sa * t.r * 0.3 + ca * yan * t.r * 0.55]], w: (q) => t.r * 0.22 * PROFIL.yaprak(q), c1: P.yaprak, c2: P.yaprak, d1: 0.97, d2: 0.97 });
}
// şakayıklar: dış halkadan içe beş halka taç yaprağı; her yaprak dipte koyu, uçta açık bir darbe, içinde ince
// fırça çizgileri; çiçeğin sol altı (ışığın karşısı) gri-mor / koyu pembe gölgede, ışık yanındaki uçlarda açık kenar
function sakayik(c, pembe) {
  const taban0 = pembe ? P.pembe : P.beyaz;
  const koyu = pembe ? hex('#D5628A') : hex('#AEB0CB');
  const orta = pembe ? hex('#EC98B2') : hex('#DEDEEC');
  const acik = pembe ? P.pembeA : P.beyaz;
  const obovat = (t) => (t < 0.55 ? 0.3 + 0.7 * Math.sin((Math.PI / 2) * (t / 0.55)) : Math.pow(Math.max(0, 1 - Math.pow((t - 0.55) / 0.45, 3)), 0.35));
  const halkalar = [
    { n: 9, R: 1.0, w: 0.42, ofs: 0, koy: 0.1 },
    { n: 8, R: 0.82, w: 0.4, ofs: 0.35, koy: 0.2 },
    { n: 7, R: 0.62, w: 0.38, ofs: 0.1, koy: 0.3 },
    { n: 6, R: 0.44, w: 0.34, ofs: 0.6, koy: 0.42 },
    { n: 5, R: 0.27, w: 0.3, ofs: 0.2, koy: 0.55 },
  ];
  halkalar.forEach((h) => {
    for (let i = 0; i < h.n; i++) {
      const a = c.aci + h.ofs + (i / h.n) * Math.PI * 2 + (r() - 0.5) * 0.18;
      const Lp = c.r * h.R * (0.93 + r() * 0.12);
      const kv = (r() - 0.5) * 0.12 * c.r;
      // ışık sağ üstten: sol alta bakan yapraklar gölgede
      const golgeYan = Math.max(0, Math.cos(a - Math.PI * 0.75));
      const isikYan = Math.max(0, Math.cos(a + Math.PI * 0.25));
      const yton = (r() - 0.5) * 0.12; // yaprak başına ton oyunu
      const pp = (t, v) => {
        const rad = c.r * 0.06 + (Lp - c.r * 0.06) * t;
        const vv = kv * Math.sin(Math.PI * t) + v;
        return [c.x + Math.cos(a) * rad - Math.sin(a) * vv, c.y + Math.sin(a) * rad + Math.cos(a) * vv];
      };
      const pts = [];
      for (let k = 0; k <= 10; k++) pts.push(pp(k / 10, 0));
      const wf = (t) => c.r * h.w * 0.8 * obovat(t);
      g({
        pts,
        w: wf,
        c1: taban0,
        c2: taban0,
        renkFn: (t, v) => {
          let col = karistir(koyu, orta, yumusak(0.0, 0.42, t));
          col = karistir(col, taban0, yumusak(0.3, 0.72, t));
          col = karistir(col, acik, 0.85 * yumusak(0.68, 0.96, t) * (0.55 + 0.45 * (v + 1) / 2));
          col = karistir(col, koyu, h.koy * (1 - yumusak(0.0, 0.4, t)) + 0.16 * Math.max(0, -v) * (1 - 0.6 * t));
          col = karistir(col, koyu, (pembe ? 0.42 : 0.5) * golgeYan * (0.45 + 0.55 * t) + (pembe ? 0.08 : 0.3) * yumusak(0.7, 1, Math.abs(v)) * yumusak(0.3, 0.9, t));
          col = yton > 0 ? karistir(col, acik, yton * 2) : karistir(col, koyu, -yton * 1.6);
          return [col, 1.25]; // örtücü: alttaki yeşil seçilmez
        },
        kenar: 0.1,
        kenarFrek: 0.22,
        kil: 0.16,
        kal: 0.55,
      });
      // yaprağın içinde dipten açılan 2–3 ince fırça çizgisi (taç yaprağının kıvrımı)
      const nc = c.r > 30 ? 3 : 2;
      for (let j = 0; j < nc; j++) {
        const vf = ((j + 0.5) / nc - 0.5) * 1.1 + (r() - 0.5) * 0.2;
        const t1 = 0.5 + r() * 0.25;
        const lp = [];
        for (let k = 0; k <= 6; k++) {
          const t = 0.08 + (t1 - 0.08) * (k / 6);
          lp.push(pp(t, vf * wf(t) * 0.8));
        }
        const lc = karistir(koyu, pembe ? hex('#C24E78') : hex('#9993BC'), 0.3);
        g({ pts: lp, w: (t) => 0.55 * (1 - 0.6 * t) + 0.15, c1: lc, c2: lc, d1: 0.28 + 0.25 * golgeYan, d2: 0.28 + 0.25 * golgeYan, kil: 0, kal: 0.2 });
      }
      // uç kenarı: ışık yanında ince açık kenar darbesi, gölge yanında ince koyu kontur (yaprak yaprak seçilir)
      if (h.R < 0.95 || pembe || isikYan > 0.3) {
        const kenarPts = [];
        for (let k = 0; k <= 16; k++) {
          const q = k / 16;
          const yan = q < 0.5 ? 1 : -1;
          const t = q < 0.5 ? 0.62 + 0.36 * (q / 0.5) : 0.98 - 0.36 * ((q - 0.5) / 0.5);
          kenarPts.push(pp(t, yan * Math.max(0, wf(t) - 1.3)));
        }
        const golgede = golgeYan > 0.45;
        const kc = golgede ? karistir(koyu, pembe ? hex('#B9416B') : hex('#8E88B2'), 0.4) : pembe ? hex('#FFE8EF') : P.beyaz;
        g({ pts: kenarPts, w: (t) => (golgede ? 0.6 : 0.75) * Math.pow(Math.sin(Math.PI * t), 0.5) + 0.15, c1: kc, c2: kc, d1: golgede ? (pembe ? 0.55 : 0.42) : 0.8, d2: golgede ? (pembe ? 0.55 : 0.42) : 0.8, kil: 0, kal: 0.3 });
      }
    }
  });
  // orta: sarı ercikler
  for (let i = 0; i < 16; i++) {
    const a = r() * Math.PI * 2;
    const q = r() * c.r * 0.14;
    nokta(B, c.x + Math.cos(a) * q, c.y + Math.sin(a) * q, Math.max(1, c.r * 0.035), r() < 0.7 ? P.sari : hex('#E0A82E'), 0.98, true);
  }
}
S.bitki.cicekler.forEach((c, i) => sakayik(c, i % 2 === 1));

// ------------------------------------------------------------------ kenar bandı: ihraç albümlerindeki gibi ince mavi bant,
// bant boyunca iki sıra uzun, örtücü darbeyle boyanır (darbeden darbeye ton oynar); içte cetvelle çekilmiş ince beyaz ve koyu çizgi
{
  const bant = 14;
  const bm = ymaske(B, (x) => { x.fillRect(0, 0, 1024, 1024); x.clearRect(bant, bant, 1024 - 2 * bant, 1024 - 2 * bant); }, [0, 0, 1024, 1024]);
  const rb2 = S.rng(2305);
  const yer = (side, along, across) => (side === 0 ? [along, across] : side === 1 ? [along, 1024 - across] : side === 2 ? [across, along] : [1024 - across, along]);
  for (let side = 0; side < 4; side++) {
    for (const off of [3.6, 10.4]) {
      let a = -30 - rb2() * 80;
      while (a < 1054) {
        const L = 80 + rb2() * 150;
        const v = (rb2() - 0.5) * 2;
        const c = v > 0 ? karistir(P.kenar, hex('#78ABE4'), 0.3 * v) : karistir(P.kenar, hex('#2659A8'), -0.34 * v);
        const eg = (rb2() - 0.5) * 1.4;
        const pts = [];
        for (let i = 0; i <= 10; i++) {
          const t = i / 10;
          pts.push(yer(side, a + L * t, off + eg * Math.sin(Math.PI * t)));
        }
        const hw = 4.4 + rb2() * 0.8;
        g({ pts, w: ((pf) => (t) => hw * pf(t))(yuvarlakProf(L, hw, 0.22, 0.8)), c1: c, c2: c, d1: 0.96, d2: 0.96, maske: bm, kuru: 0.16, kil: 0.24, kal: 1.15 });
        a += L * (0.68 + 0.25 * rb2());
      }
    }
  }
  // cetvelle çekilmiş iç çizgiler (uçlarda hafif fırça vurgusu)
  const cizgi = (q, w, c, d) => {
    const kose = [[q, q], [1024 - q, q], [1024 - q, 1024 - q], [q, 1024 - q]];
    for (let i = 0; i < 4; i++) {
      const [x1, y1] = kose[i];
      const [x2, y2] = kose[(i + 1) % 4];
      const pts = [];
      for (let k = 0; k <= 40; k++) pts.push([x1 + ((x2 - x1) * k) / 40, y1 + ((y2 - y1) * k) / 40]);
      g({ pts, w: (t) => w * (0.85 + 0.3 * NZ.n(t * 13 + i * 5 + q, 3.3)), c1: c, c2: c, d1: d, d2: d, kil: 0, kenar: 0.1, kal: 0.3 });
    }
  };
  cizgi(bant + 0.6, 0.5, hex('#1E468C'), 0.8);
  cizgi(bant + 2.5, 0.75, P.beyaz, 0.92);
}

// ------------------------------------------------------------------ boya kabartısı
{
  // yükseklik alanını yumuşat (yalnız darbe sırtları kalsın, kıl çatlakları değil)
  const W = B.W;
  const tmp = new Float32Array(YUK.length);
  for (let gec = 0; gec < 2; gec++) {
    for (let y = 0; y < W; y++) for (let x = 2; x < W - 2; x++) { const k = y * W + x; tmp[k] = (YUK[k - 2] + YUK[k - 1] + YUK[k] + YUK[k + 1] + YUK[k + 2]) / 5; }
    for (let y = 2; y < W - 2; y++) for (let x = 0; x < W; x++) { const k = y * W + x; YUK[k] = (tmp[k - 2 * W] + tmp[k - W] + tmp[k] + tmp[k + W] + tmp[k + 2 * W]) / 5; }
  }
  kabartma(B, YUK, 0.35);
}
const ctx = anaTuval();
ctx.drawImage(B.tuval(), 0, 0, 1024, 1024);
// pith kâğıdı: ince, uzunca hücreli, kadifemsi doku (düzgün ve sağlam; kabarcık değil)
{
  const hucre = 12; // 2048 pikselde hücre boyu (1024'te ~6 px)
  const sx = 1.7; // yatay uzama
  const rr = S.rng(2302);
  const nx = Math.ceil(2048 / (hucre * sx)) + 2;
  const ny = Math.ceil(2048 / hucre) + 2;
  const px = new Float32Array(nx * ny);
  const py = new Float32Array(nx * ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    px[j * nx + i] = (i + 0.15 + rr() * 0.7) * hucre * sx;
    py[j * nx + i] = (j + 0.15 + rr() * 0.7) * hucre;
  }
  const nz = gurultu(2303);
  const hucreTon = new Float32Array(nx * ny);
  for (let k = 0; k < hucreTon.length; k++) hucreTon[k] = rr();
  pikselGecis(ctx, (d, idx, x, y) => {
    const ci = Math.floor(x / (hucre * sx));
    const cj = Math.floor(y / hucre);
    let f1 = 1e9;
    let f2 = 1e9;
    let i1 = 0;
    let i2 = 0;
    for (let dj = -1; dj <= 1; dj++) {
      const jj = cj + dj;
      if (jj < 0 || jj >= ny) continue;
      for (let di = -1; di <= 1; di++) {
        const ii = ci + di;
        if (ii < 0 || ii >= nx) continue;
        const k = jj * nx + ii;
        const dx = (x - px[k]) / sx;
        const dy = y - py[k];
        const q = dx * dx + dy * dy;
        if (q < f1) { f2 = f1; i2 = i1; f1 = q; i1 = k; } else if (q < f2) { f2 = q; i2 = k; }
      }
    }
    // yumuşak hücre beneği: en yakın iki hücrenin tonları, sınırda yumuşakça karışır (çizgi ya da kabarcık yok)
    const a1 = Math.sqrt(f1);
    const a2 = Math.sqrt(f2);
    const w1 = a2 / (a1 + a2 + 1e-6);
    const ton = hucreTon[i1] * w1 + hucreTon[i2] * (1 - w1);
    const saten = nz.fbm(x * 0.0018, y * 0.0026, 2) - 0.5;
    const isik = (d[idx] + d[idx + 1] + d[idx + 2]) / 765;
    const gg = 1 + 0.13 * (ton - 0.5) * (0.3 + 0.7 * isik) + 0.03 * saten;
    // kadife: pith'in yarı saydam hücreleri koyu boyayı da hafifçe aydınlatır (ışığı içine alan yüzey)
    const kad = (1 - isik) * (0.025 + 0.06 * ton);
    for (let c = 0; c < 3; c++) d[idx + c] = Math.min(255, d[idx + c] * gg + 2 + (255 - d[idx + c]) * kad);
  });
}
S.hazir();
