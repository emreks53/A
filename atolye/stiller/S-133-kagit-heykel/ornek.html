<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-133 Kâğıt Heykel — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #eef3f4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-133 Kâğıt Heykel — çizilmiş (bombeli), kıvrılmış ve bükülmüş pastel kâğıttan kabartma: kubbe ayrı ayrı
  // bükülmüş dilimlerden, minare rulo silindirlerden, gök eğri kat izli bir kâğıt kabartmadan, güneş sarmal
  // pililerden; taç yaprakların uçları geriye kıvrık. Yumuşak stüdyo ışığı sağ üstten, gölgeler yumuşak.
  const OL = 2, W2 = 1024 * OL, TAU = Math.PI * 2;
  const ana = SAHNE.tuval(document.getElementById('tuval'), OL);
  const Yl = SAHNE.yollar();
  const P = (d) => new Path2D(d);

  // ------------------------------------------------------------ ışık ve renk yardımcıları
  const LV = (() => { const v = [0.5, -0.58, 0.64]; const n = Math.hypot(...v); return v.map((c) => c / n); })();
  const HV = (() => { const v = [LV[0], LV[1], LV[2] + 1]; const n = Math.hypot(...v); return v.map((c) => c / n); })();
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function tonRGB(pal, t) {
    t = Math.max(0, Math.min(1, t));
    const A = hex(pal[t < 0.5 ? 0 : 1]), B = hex(pal[t < 0.5 ? 1 : 2]), f = t < 0.5 ? t * 2 : (t - 0.5) * 2;
    return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f];
  }
  const ton = (pal, t, a) => { const c = tonRGB(pal, t); return a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; };
  const isik = (n) => { const l = Math.hypot(n[0], n[1], n[2]) || 1; return Math.max(0, (n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]) / l); };
  const yumusak = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const PAL = {
    yesil: ['#17603A', '#38995B', '#B4EBBE'],
    yesilK: ['#1E4D33', '#2C6A46', '#478860'],
    tas: ['#C9BCAD', '#EFE8DE', '#FFFEFA'],
    tasK: ['#94877A', '#AE9F8F', '#C8BAA8'],
    altin: ['#B4852A', '#E6BE5C', '#FFF1B8'],
    sari: ['#EDA93A', '#F8CD6A', '#FFF2C4'],
    bulut: ['#C4C0CE', '#E9E7EE', '#FFFFFF'],
    tepe1: ['#8DBE8E', '#B6DAAA', '#E0F1D2'],
    tepe2: ['#74B07E', '#9ECF97', '#D2ECC2'],
    zemin: ['#DDB07C', '#F2D2A6', '#FDEFD9'],
    nane: ['#5FA86E', '#8FCB90', '#CDEDC4'],
    yaprak: ['#3C8752', '#6DB57D', '#B1E0B3'],
    yaprak2: ['#4E9762', '#86C892', '#C2E9C3'],
    beyaz: ['#D9C6C8', '#F6EFEE', '#FFFFFF'],
    pembe: ['#E7959F', '#F4BFC3', '#FDE6E5'],
  };

  // ------------------------------------------------------------ kâğıt dokusu: ince, düzgün çizim kâğıdı
  const DOKU = SAHNE.yeniTuval(W2, W2);
  (function doku() {
    const g = DOKU.getContext('2d');
    const r = SAHNE.rng(133);
    const n = 320, nt = SAHNE.yeniTuval(n, n), ng = nt.getContext('2d');
    const im1 = ng.createImageData(n, n);
    for (let i = 0; i < n * n; i++) {
      const v = r(), k = i * 4;
      if (v > 0.5) { im1.data[k] = 255; im1.data[k + 1] = 255; im1.data[k + 2] = 252; im1.data[k + 3] = (v - 0.5) * 2 * 10; }
      else { im1.data[k] = 100; im1.data[k + 1] = 90; im1.data[k + 2] = 80; im1.data[k + 3] = (0.5 - v) * 2 * 6; }
    }
    ng.putImageData(im1, 0, 0);
    g.imageSmoothingEnabled = true;
    g.drawImage(nt, 0, 0, W2, W2);
    const ince = SAHNE.yeniTuval(W2, W2), ig = ince.getContext('2d');
    const im = ig.createImageData(W2, W2);
    for (let i = 0; i < W2 * W2; i++) {
      const v = r(), k = i * 4;
      if (v < 0.5) { im.data[k] = 255; im.data[k + 1] = 255; im.data[k + 2] = 252; im.data[k + 3] = 15 * (0.5 - v) * 2; }
      else { im.data[k] = 80; im.data[k + 1] = 70; im.data[k + 2] = 62; im.data[k + 3] = 10 * (v - 0.5) * 2; }
    }
    ig.putImageData(im, 0, 0);
    g.drawImage(ince, 0, 0);
    g.lineCap = 'round';
    for (let i = 0; i < 3000; i++) {
      const x = r() * W2, y = r() * W2, a = r() * TAU, L = 6 + r() * 24;
      g.strokeStyle = r() < 0.7 ? `rgba(255,255,252,${0.04 + r() * 0.05})` : `rgba(90,80,70,${0.02 + r() * 0.03})`;
      g.lineWidth = 0.5 + r() * 0.8;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * L * 0.5, y + Math.sin(a + 0.5) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
    }
  })();

  // ------------------------------------------------------------ katman makinesi: doku, ışıklı kenar, iki kat yumuşak gölge
  const LT = SAHNE.yeniTuval(W2, W2), lg = LT.getContext('2d');
  const HT = SAHNE.yeniTuval(W2, W2), hg = HT.getContext('2d');
  let katmanNo = 0;
  function katman(ciz, o) {
    o = o || {};
    katmanNo++;
    lg.setTransform(1, 0, 0, 1, 0, 0);
    lg.globalCompositeOperation = 'source-over';
    lg.globalAlpha = 1;
    lg.clearRect(0, 0, W2, W2);
    lg.setTransform(OL, 0, 0, OL, 0, 0);
    ciz(lg);
    lg.setTransform(1, 0, 0, 1, 0, 0);
    lg.globalCompositeOperation = 'source-atop';
    lg.globalAlpha = o.doku === undefined ? 1 : o.doku;
    const dx = (katmanNo * 733) % W2, dy = (katmanNo * 419) % W2;
    for (const [ox, oy] of [[-dx, -dy], [W2 - dx, -dy], [-dx, W2 - dy], [W2 - dx, W2 - dy]]) lg.drawImage(DOKU, ox, oy);
    const d = (o.kenar || 1.25) * OL;
    const kenar = (renk, sx, sy, alfa) => {
      hg.setTransform(1, 0, 0, 1, 0, 0);
      hg.globalCompositeOperation = 'source-over';
      hg.globalAlpha = 1;
      hg.clearRect(0, 0, W2, W2);
      hg.drawImage(LT, 0, 0);
      hg.globalCompositeOperation = 'source-in';
      hg.fillStyle = renk;
      hg.fillRect(0, 0, W2, W2);
      hg.globalCompositeOperation = 'destination-out';
      hg.drawImage(LT, sx, sy);
      lg.globalCompositeOperation = 'source-atop';
      lg.globalAlpha = alfa;
      lg.drawImage(HT, 0, 0);
    };
    kenar('#FFFFFF', -d, d, o.parlak === undefined ? 0.75 : o.parlak);
    kenar('#3C3430', d * 0.8, -d * 0.8, 0.14);
    lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'source-over';
    const g = Object.assign({ x: -9, y: 13, b: 22, a: 0.17 }, o.g || {});
    // derin stüdyo gölgesi: kabartma zeminden belirgin biçimde kalkık durur
    g.a *= 1.85; g.x *= 1.75; g.y *= 1.75; g.b *= 1.3;
    const t = Object.assign({ x: -2, y: 3, b: 4, a: 0.2 }, o.t || {});
    t.a *= 1.4; t.x *= 1.3; t.y *= 1.3;
    ana.save();
    ana.setTransform(1, 0, 0, 1, 0, 0);
    ana.shadowColor = `rgba(84,60,64,${g.a})`;
    ana.shadowBlur = g.b * OL; ana.shadowOffsetX = g.x * OL; ana.shadowOffsetY = g.y * OL;
    ana.drawImage(LT, 0, 0);
    ana.shadowColor = `rgba(60,52,60,${t.a})`;
    ana.shadowBlur = t.b * OL; ana.shadowOffsetX = t.x * OL; ana.shadowOffsetY = t.y * OL;
    ana.drawImage(LT, 0, 0);
    ana.restore();
  }
  function delik(g, yol) { g.save(); g.globalCompositeOperation = 'destination-out'; g.fill(typeof yol === 'string' ? P(yol) : yol); g.restore(); }
  const dik = (x1, y1, x2, y2) => SAHNE.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Rulo kâğıt silindiri: yatay eğim (ışık sağdan), sağ kenarda ince yansıma. */
  function silindir(g, x1, x2, pal, k) {
    k = k || 0;
    const gr = g.createLinearGradient(x1, 0, x2, 0);
    gr.addColorStop(0, ton(pal, 0.2 + k)); gr.addColorStop(0.16, ton(pal, 0.4 + k)); gr.addColorStop(0.5, ton(pal, 0.74 + k));
    gr.addColorStop(0.72, ton(pal, 0.96 + k)); gr.addColorStop(0.88, ton(pal, 0.8 + k)); gr.addColorStop(1, ton(pal, 0.58 + k));
    return gr;
  }
  /** Bükülmüş şerit (silme): dikey eğim — üstte ışık, altta gölge. */
  function bukum(g, y1, y2, pal, ters) {
    const gr = g.createLinearGradient(0, y1, 0, y2);
    if (!ters) { gr.addColorStop(0, ton(pal, 0.98)); gr.addColorStop(0.45, ton(pal, 0.82)); gr.addColorStop(1, ton(pal, 0.36)); }
    else { gr.addColorStop(0, ton(pal, 0.4)); gr.addColorStop(0.55, ton(pal, 0.8)); gr.addColorStop(1, ton(pal, 0.95)); }
    return gr;
  }
  /** Çizik (skor) izi: bir koyu, bir açık ince çizgi. */
  function cizik(g, yol, w) {
    g.save();
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.lineWidth = w || 0.9;
    g.strokeStyle = 'rgba(60,50,50,0.22)'; g.stroke(yol);
    g.translate(0.7, -0.5);
    g.strokeStyle = 'rgba(255,255,255,0.7)'; g.stroke(yol);
    g.restore();
  }
  function cizgi(pts) { const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); return p; }

  /** Dönel yüzey gölgelendirici (piksel piksel): dilimleri ayrı ayrı bombeli kâğıt. */
  function donel(o) {
    const X1 = Math.floor((o.cx - o.rmax - 2) * OL), X2 = Math.ceil((o.cx + o.rmax + 2) * OL);
    const Y1 = Math.floor(o.y1 * OL), Y2 = Math.ceil(o.y2 * OL);
    const w = X2 - X1, h = Y2 - Y1;
    const c = SAHNE.yeniTuval(w, h), g = c.getContext('2d');
    const im = g.createImageData(w, h), D = im.data;
    const N = o.dilim, B = o.bombe;
    for (let py = 0; py < h; py++) {
      const y = (Y1 + py + 0.5) / OL;
      const r = o.r(y);
      if (!(r > 0.3)) continue;
      const drdy = (o.r(y + 0.6) - o.r(y - 0.6)) / 1.2;
      for (let px = 0; px < w; px++) {
        const x = (X1 + px + 0.5) / OL;
        const dxa = Math.abs(x - o.cx);
        const kap = Math.max(0, Math.min(1, (r - dxa) * OL + 0.5));
        if (kap <= 0) continue;
        const u = Math.max(-1, Math.min(1, (x - o.cx) / r));
        const fi = Math.asin(u);
        const gk = (fi + Math.PI / 2) / (Math.PI / N);
        const k = Math.min(N - 1, Math.floor(gk)), s = gk - k;
        const fc = -Math.PI / 2 + ((k + 0.5) * Math.PI) / N;
        const fn = fc + (s - 0.5) * (Math.PI / N) * B;
        const L = Math.hypot(1, drdy);
        const n = [Math.sin(fn) / L, -drdy / L, Math.cos(fn) / L];
        const l = Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]);
        let t = o.amb + o.kat * l;
        // dilim kenarlarında ince oluk gölgesi (komşu dilim arası)
        const kenar = Math.min(s, 1 - s) * (Math.PI / N) * r * Math.cos(fi); // ekranda kenara uzaklık (px)
        t *= 0.55 + 0.45 * yumusak(0.3, 4.2, kenar);
        // dilimin ışığa bakan sağ kenarında ince parlak kâğıt kenarı
        const sk = (1 - s) * (Math.PI / N) * r * Math.cos(fi);
        if (s > 0.5 && sk > 0.5 && sk < 1.6) t += 0.1 * o.kenarIsik;
        const sp = Math.pow(Math.max(0, n[0] * HV[0] + n[1] * HV[1] + n[2] * HV[2]), o.us || 26) * o.parla;
        const cc = tonRGB(o.pal, t);
        const i = (py * w + px) * 4;
        D[i] = Math.min(255, cc[0] + sp * 255); D[i + 1] = Math.min(255, cc[1] + sp * 255); D[i + 2] = Math.min(255, cc[2] + sp * 255);
        D[i + 3] = kap * 255;
      }
    }
    g.putImageData(im, 0, 0);
    return { c, x: X1 / OL, y: Y1 / OL, w: w / OL, h: h / OL };
  }
  /** Bezier eğrisinden y → yarıçap tablosu. */
  function profilTablosu(noktalar, cx) {
    const s = noktalar.slice().sort((a, b) => a[1] - b[1]);
    return (y) => {
      if (y < s[0][1] || y > s[s.length - 1][1]) return 0;
      for (let i = 0; i < s.length - 1; i++) {
        if (y >= s[i][1] && y <= s[i + 1][1]) {
          const t = (y - s[i][1]) / (s[i + 1][1] - s[i][1] || 1);
          return Math.abs(s[i][0] + (s[i + 1][0] - s[i][0]) * t - cx);
        }
      }
      return 0;
    };
  }
  const bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; };

  // ------------------------------------------------------------ 1: gök — eğri kat izli kâğıt kabartma (piksel piksel)
  const GX = 880, GY = 140;
  (function gok() {
    // Eğri kat izli (curved-crease) pili: sol alttaki uzak bir merkez çevresinde eş merkezli, dönüşümlü dağ ve
    // vadi katları. Her şerit ayrı renkte bir kâğıt; ışığa (sağ üst) dönük yüzler aydınlık, karşı yüzler gölgede.
    // Renkler güneşe yaklaştıkça serin açık turkuazdan krem ve sıcak kayısıya döner (gün ışığında renkli kartlar).
    const im = ana.createImageData(W2, W2), D = im.data;
    const C = [-300, 1500], ARA = 118;
    const RAMPA = [[700, '#C6E7E6'], [1050, '#D3EDE5'], [1300, '#E6F2E0'], [1500, '#F7F1DB'], [1700, '#FCE9C8'], [1900, '#FCDFB6'], [2100, '#FAD6A8']]
      .map(([d, h]) => [d, hex(h)]);
    const rampa = (d) => {
      if (d <= RAMPA[0][0]) return RAMPA[0][1];
      for (let i = 0; i < RAMPA.length - 1; i++) {
        const [d0, c0] = RAMPA[i], [d1, c1] = RAMPA[i + 1];
        if (d <= d1) { const f = (d - d0) / (d1 - d0); return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f]; }
      }
      return RAMPA[RAMPA.length - 1][1];
    };
    const sic = hex('#FFF6E2');
    for (let py = 0; py < W2; py++) {
      const y = (py + 0.5) / OL;
      for (let px = 0; px < W2; px++) {
        const x = (px + 0.5) / OL;
        const dx = x - C[0], dy = y - C[1], d = Math.hypot(dx, dy);
        const q = d / ARA, k = Math.floor(q), s = q - k;
        const yon = k % 2 ? 1 : -1;
        const by = rampa(d);
        // yüz eğimi: kenarlara doğru bükülen, ortası daha dik yüz
        const tau = yon * (0.16 + 0.16 * Math.sin(Math.PI * s));
        const ux = dx / d, uy = dy / d;
        const l = (ux * tau * LV[0] + uy * tau * LV[1] + LV[2]) / Math.hypot(tau, 1);
        const rel = (l - LV[2]) / 0.3; // yaklaşık −1 … +1
        let r = by[0], g = by[1], b = by[2];
        if (rel > 0) { const m = rel * 0.42; r += (255 - r) * m; g += (254 - g) * m; b += (246 - b) * m; }
        else {
          // gölge yüz: aynı rengin daha tok (kendisiyle çarpılmış) hâli — grileşmeden koyulaşır
          const m = -rel * 0.4; r += (r * r / 255 - r) * m; g += (g * g / 255 - g) * m; b += (b * b / 255 - b) * m;
          r *= 1 + rel * 0.035; g *= 1 + rel * 0.035; b *= 1 + rel * 0.02;
        }
        // kat izleri: vadide (ışıklı yüzün dış kenarı) ince koyu oluk, sırtta (ışıklı yüzün iç kenarı) parlak çizgi
        const e = s * ARA, e2 = (1 - s) * ARA;
        if (yon > 0) {
          const v = Math.max(0, 1 - e2 / 3); r *= 1 - 0.1 * v; g *= 1 - 0.1 * v; b *= 1 - 0.08 * v;
          const sr = Math.max(0, 1 - e / 1.5) * 0.65; r += (255 - r) * sr; g += (255 - g) * sr; b += (250 - b) * sr;
        } else {
          const v = Math.max(0, 1 - e / 3); r *= 1 - 0.08 * v; g *= 1 - 0.08 * v; b *= 1 - 0.06 * v;
        }
        const gd = Math.hypot(x - GX, y - GY), gs = Math.max(0, 1 - gd / 380);
        const sg = gs * gs * 0.5;
        const i = (py * W2 + px) * 4;
        D[i] = Math.min(255, r + (sic[0] - r) * sg);
        D[i + 1] = Math.min(255, g + (sic[1] - g) * sg);
        D[i + 2] = Math.min(255, b + (sic[2] - b) * sg);
        D[i + 3] = 255;
      }
    }
    ana.putImageData(im, 0, 0);
    ana.save(); ana.setTransform(1, 0, 0, 1, 0, 0); ana.globalAlpha = 0.8; ana.drawImage(DOKU, 0, 0); ana.restore();
  })();

  // ------------------------------------------------------------ 2: güneş — sarmal pilili kâğıt disk
  katman((g) => {
    // bükülmüş kâğıt ışınlar: her ışın ortasından çizik, iki yarısı ayrı tonda
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = (i * TAU) / n + 0.1, ca = Math.cos(a), sa = Math.sin(a);
      const r0 = 64, r1 = i % 2 ? 104 : 118, w = 15;
      const p = (u, v) => [GX + u * ca - v * sa, GY + u * sa + v * ca];
      const A = p(r0, 0), T = p(r1, 0), S1 = p(r0 + 12, -w / 2), S2 = p(r0 + 12, w / 2);
      const yar = (q, k) => { const yp = new Path2D(); yp.moveTo(...A); yp.quadraticCurveTo(...q, ...T); yp.closePath(); return yp; };
      const t1 = 0.3 + 0.75 * isik([sa * 0.6 + ca * 0.2, -ca * 0.6 + sa * 0.2, 0.75]);
      const t2 = 0.3 + 0.75 * isik([-sa * 0.6 + ca * 0.2, ca * 0.6 + sa * 0.2, 0.75]);
      for (const [q, t] of [[p(r0 + 14, -w * 0.62), t1], [p(r0 + 14, w * 0.62), t2]]) {
        const gr = g.createLinearGradient(A[0], A[1], T[0], T[1]);
        gr.addColorStop(0, ton(PAL.sari, t - 0.12)); gr.addColorStop(1, ton(PAL.sari, t + 0.06));
        g.fillStyle = gr; g.fill(yar(q));
      }
      void S1; void S2;
      cizik(g, cizgi([A, T]), 0.6);
    }
  }, { g: { x: -6, y: 9, b: 14, a: 0.14 } });
  katman((g) => {
    const R = 70, X1 = Math.floor((GX - R - 2) * OL), Y1 = Math.floor((GY - R - 2) * OL), w = Math.ceil((2 * R + 4) * OL);
    const c = SAHNE.yeniTuval(w, w), cg = c.getContext('2d'), im = cg.createImageData(w, w), D = im.data;
    const N = 30;
    for (let py = 0; py < w; py++) for (let px = 0; px < w; px++) {
      const x = (X1 + px + 0.5) / OL - GX, y = (Y1 + py + 0.5) / OL - GY, d = Math.hypot(x, y);
      const kap = Math.max(0, Math.min(1, (R - d) * OL + 0.5));
      if (kap <= 0) continue;
      const th = Math.atan2(y, x) + 0.85 * Math.log(Math.max(d, 2) / R);
      const q = ((th / TAU) * N % 1 + 1) % 1 * 2, k = Math.floor(q), s = q - k;
      const yon = k ? 1 : -1;
      // pilinin eğimi teğet yönde, disk ortaya doğru hafif kubbeli
      const ta = Math.atan2(y, x) + Math.PI / 2;
      const tau = yon * 0.55 * Math.sin(Math.PI * (0.15 + 0.85 * s)) * Math.min(1, d / 18);
      const kub = 0.5 * (d / R);

  katman((g) => {
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const s of B.saplar) {
      const d = P(SAHNE.yol(s));
      g.strokeStyle = ton(PAL.yaprak, 0.45); g.lineWidth = 6; g.stroke(d);
      g.save(); g.translate(1.3, -0.6); g.strokeStyle = ton(PAL.yaprak, 0.85); g.lineWidth = 2; g.stroke(d); g.restore();
    }
    for (const y of yanYaprak) yaprak(g, y, PAL.yaprak2);
  }, { g: { x: -6, y: 9, b: 14, a: 0.16 } });
  katman((g) => { onYaprak.forEach((y, i) => { if (i % 2 === 0) yaprak(g, Object.assign({}, y, { uzunluk: y.uzunluk * 1.05 }), PAL.yaprak); }); }, { g: { x: -8, y: 12, b: 18, a: 0.17 } });
  katman((g) => { onYaprak.forEach((y, i) => { if (i % 2 === 1) yaprak(g, y, PAL.yaprak2); }); }, { g: { x: -8, y: 12, b: 18, a: 0.17 } });
  // tomurcuklar: kıvrık koni
  katman((g) => {
    for (const t of B.tomurcuklar) {
      const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
      const a = [t.x + sa * t.r, t.y - ca * t.r], b = [t.x - sa * t.r, t.y + ca * t.r];
      const gr = g.createLinearGradient(a[0], a[1], b[0], b[1]);
      gr.addColorStop(0, ton(PAL.pembe, 0.3)); gr.addColorStop(0.55, ton(PAL.pembe, 0.85)); gr.addColorStop(0.8, ton(PAL.pembe, 1)); gr.addColorStop(1, ton(PAL.pembe, 0.6));
      g.fillStyle = gr; g.fill(P(SAHNE.tomurcukYolu(t)));
      cizik(g, cizgi([[t.x - ca * t.r * 0.6, t.y - sa * t.r * 0.6], [t.x + ca * t.r * 1.3, t.y + sa * t.r * 1.3]]), 0.6);
    }
  }, { g: { x: -4, y: 6, b: 9, a: 0.16 } });
  // çiçekler: bombeli, ucu geri kıvrık taç yaprakları; ortası saçaklı rulo
  katman((g) => {
    for (const c of B.cicekler) {
      const tac = SAHNE.tacYapraklari(c);
      // arkadan öne: her yaprak bir öncekinin üstüne hafif gölge düşürür
      tac.forEach((e, i) => {
        const yol = P(SAHNE.elipsYolu(e));
        const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
        // ucu ışığa dönük mü? (taç yaprağın ekseni sağ üste bakıyorsa kıvrım tepesi daha parlak)
        const uIsik = Math.max(0, ca * 0.62 - sa * 0.78);
        g.save();
        // yaprak yüzeyden kalkık: belirgin, yumuşak gölge
        g.shadowColor = 'rgba(110,70,80,0.34)'; g.shadowBlur = c.r * 0.2 * OL; g.shadowOffsetX = -c.r * 0.07 * OL; g.shadowOffsetY = c.r * 0.11 * OL;
        g.fillStyle = ton(PAL.beyaz, 0.9); g.fill(yol);
        g.restore();
        g.save(); g.clip(yol);
        // kıvrık uç: eksen boyunca silindir eğimi — kıvrımın tepesi parlak, geriye dönen uç pembemsi gölgede
        const u0 = [e.cx + ca * e.rx * 0.5, e.cy + sa * e.rx * 0.5], u1 = [e.cx + ca * e.rx * 1.02, e.cy + sa * e.rx * 1.02];
        const gu = g.createLinearGradient(u0[0], u0[1], u1[0], u1[1]);
        gu.addColorStop(0, ton(PAL.beyaz, 0.8)); gu.addColorStop(0.42, ton(PAL.beyaz, 1));
        gu.addColorStop(0.62, ton(PAL.beyaz, 0.9 + 0.1 * uIsik)); gu.addColorStop(1, ton(PAL.pembe, 0.62 + 0.25 * uIsik));
        g.fillStyle = gu; g.fill(yol);
        const ic = P(SAHNE.elipsYolu({ cx: e.cx - ca * e.rx * 0.3, cy: e.cy - sa * e.rx * 0.3, rx: e.rx * 1.0, ry: e.ry * 1.3, aci: e.aci }));
        // çanak gibi içe bükük gövde: dipte pembe gölge, ortada aydınlık
        const gr = g.createRadialGradient(c.x, c.y, c.r * 0.08, c.x, c.y, c.r * 0.95);
        gr.addColorStop(0, ton(PAL.pembe, 0.35)); gr.addColorStop(0.3, ton(PAL.pembe, 0.78)); gr.addColorStop(0.55, ton(PAL.beyaz, 0.66)); gr.addColorStop(0.85, ton(PAL.beyaz, 0.95)); gr.addColorStop(1, ton(PAL.beyaz, 0.85));
        g.fillStyle = gr; g.fill(ic);
        // yan bombe: ışıktan uzak yan koyu
        const tn = isik([-sa, ca, 0.6]) - isik([sa, -ca, 0.6]);
        const a = [e.cx - sa * e.ry, e.cy + ca * e.ry], b = [e.cx + sa * e.ry, e.cy - ca * e.ry];
        const g2 = g.createLinearGradient(a[0], a[1], b[0], b[1]);
        const koyuA = tn < 0 ? 0.26 : 0.03, koyuB = tn < 0 ? 0.03 : 0.26;
        g2.addColorStop(0, `rgba(130,80,95,${koyuA})`); g2.addColorStop(0.5, 'rgba(130,80,95,0)'); g2.addColorStop(1, `rgba(130,80,95,${koyuB})`);
        g.fillStyle = g2; g.fill(yol);
        // kıvrımın altına düşen gölge (iç kısmın uç kenarında) ve kıvrım tepesinde ince ışık
        g.save(); g.clip(ic);
        g.filter = `blur(${Math.max(0.8, c.r * 0.035)}px)`;
        g.strokeStyle = 'rgba(120,70,85,0.42)'; g.lineWidth = Math.max(1.2, c.r * 0.07); g.stroke(ic);
        g.restore();
        g.filter = 'none';
        g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(0.6, c.r * 0.018);
        g.save(); g.translate(ca * c.r * 0.025, sa * c.r * 0.025); g.stroke(ic); g.restore();
        g.restore();
        // orta çizik damar
        cizik(g, cizgi([[c.x + ca * c.r * 0.18, c.y + sa * c.r * 0.18], [c.x + ca * c.r * 0.62, c.y + sa * c.r * 0.62]]), Math.max(0.6, c.r * 0.016));
        void i;
      });
      // saçaklı sarı rulo göbek
      const R = c.r * 0.24;
      let gr = g.createRadialGradient(c.x + R * 0.3, c.y - R * 0.3, R * 0.1, c.x, c.y, R);
      gr.addColorStop(0, ton(PAL.sari, 0.95)); gr.addColorStop(1, ton(PAL.sari, 0.4));
      g.fillStyle = gr; g.beginPath(); g.arc(c.x, c.y, R, 0, TAU); g.fill();
      g.save(); g.lineCap = 'round';
      const n = Math.round(c.r * 0.7);
      for (let i = 0; i < n; i++) {
        const a = (i * TAU) / n;
        const t = 0.35 + 0.65 * isik([Math.cos(a), Math.sin(a), 0.9]);
        g.strokeStyle = ton(PAL.sari, i % 2 ? t : t - 0.25); g.lineWidth = Math.max(0.7, c.r * 0.022);
        g.beginPath(); g.moveTo(c.x + Math.cos(a) * R * 0.5, c.y + Math.sin(a) * R * 0.5); g.lineTo(c.x + Math.cos(a + 0.12) * R * 1.02, c.y + Math.sin(a + 0.12) * R * 1.02); g.stroke();
      }
      g.restore();
      gr = g.createRadialGradient(c.x + R * 0.15, c.y - R * 0.18, 0, c.x, c.y, R * 0.45);
      gr.addColorStop(0, ton(PAL.sari, 1)); gr.addColorStop(1, ton(PAL.sari, 0.5));
      g.fillStyle = gr; g.beginPath(); g.arc(c.x, c.y, R * 0.42, 0, TAU); g.fill();
    }
  }, { g: { x: -8, y: 12, b: 18, a: 0.2 } });

  // ------------------------------------------------------------ stüdyo ışığı: sağ üstten yumuşak aydınlık
  (function isikla() {
    ana.save();
    ana.globalCompositeOperation = 'soft-light';
    const g = ana.createRadialGradient(GX, GY, 40, GX, GY, 1300);
    g.addColorStop(0, 'rgba(255,250,236,0.5)');
    g.addColorStop(0.55, 'rgba(255,250,236,0.06)');
    g.addColorStop(1, 'rgba(50,45,60,0.16)');
    ana.fillStyle = g;
    ana.fillRect(0, 0, 1024, 1024);
    ana.restore();
  })();

  SAHNE.hazir();
</script>
