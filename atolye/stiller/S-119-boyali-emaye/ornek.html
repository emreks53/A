<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-119 Boyalı Emaye — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f7f4ec; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-119 Boyalı Emaye — resim emayesi levha: süt beyazı emaye zemin üzerine ince emaye renkleriyle
// fırçayla boyanmış, fırınlanmış sahne. Tel (kloazone) yok: renk alanları fırında hafifçe akar,
// kenarlarında boya birikip yuvarlanır; yüzey kalın, camsı ve derindir. Modelleme minyatürcü
// noktalamayla (pointillé) yapılır; altın ince boya çizgisi ve nokta olarak sürülür; güneş, çiçek
// göbekleri ve kenar şeridindeki taşlar altın folyo (paillon) üstünde saydam emaye "mücevherler"dir.
// Yöntem: 2048 iç çözünürlük; boya, altın, folyo ve emaye kalınlığı (yükseklik) için dört katman.
// Kalınlık haritası iki ayrı yarıçapla bulanıklaştırılır: farkı renk kenarlarındaki birikmeyi,
// eğimi camsı yüzeyin normalini verir. Piksel döngüsünde birikme, Blinn-Phong parıltısı, yüzey
// dalgasıyla kırılan pencere yansıması, buruşuk folyo ve kabarık altın birleştirilir.
(function () {
  const S = SAHNE;
  const K = 2, N = 1024 * K;
  const tuval = document.getElementById('tuval');
  tuval.width = N; tuval.height = N;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const rnd = S.rng(119);
  const P = (d) => new Path2D(d);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const Y = S.yollar();
  const TAM = 2 * Math.PI;

  function hash(ix, iy, s) {
    let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // ------------------------------------------------------------ katmanlar
  const yeni = () => { const c = document.createElement('canvas'); c.width = N; c.height = N; return c; };
  const boyaC = yeni(), altinC = yeni(), folyoC = yeni(), yukC = yeni();
  const b = boyaC.getContext('2d', { willReadFrequently: true });
  const g = altinC.getContext('2d', { willReadFrequently: true });
  const f = folyoC.getContext('2d', { willReadFrequently: true });
  const h = yukC.getContext('2d', { willReadFrequently: true });
  for (const c of [b, g, f, h]) { c.setTransform(K, 0, 0, K, 0, 0); c.lineCap = 'round'; c.lineJoin = 'round'; }
  g.strokeStyle = '#fff'; g.fillStyle = '#fff'; f.fillStyle = '#fff';
  h.fillStyle = '#000'; h.fillRect(0, 0, 1024, 1024);

  const rgba = (r, g2, b2, a) => `rgba(${r | 0},${g2 | 0},${b2 | 0},${a})`;
  const gri = (v) => { const q = Math.round(clamp(v, 0, 1) * 255); return `rgb(${q},${q},${q})`; };
  const lin = (x1, y1, x2, y2, duraklar) => { const q = b.createLinearGradient(x1, y1, x2, y2); duraklar.forEach(([t, c]) => q.addColorStop(t, c)); return q; };
  const rad = (x1, y1, r1, x2, y2, r2, duraklar) => { const q = b.createRadialGradient(x1, y1, r1, x2, y2, r2); duraklar.forEach(([t, c]) => q.addColorStop(t, c)); return q; };
  const dol = (yol, stil, alfa) => { b.save(); if (alfa != null) b.globalAlpha = alfa; b.fillStyle = stil; b.fill(yol); b.restore(); };
  // kırpılmış dolgu (alan içinde geçişli gölge ya da ışık katı)
  const ust = (yol, stil, alfa, kip) => { b.save(); b.clip(yol); b.globalAlpha = alfa; if (kip) b.globalCompositeOperation = kip; b.fillStyle = stil; b.fillRect(0, 0, 1024, 1024); b.restore(); };
  // boyalı ince kontür (emaye boyasıyla çizilmiş çizgi; tel değil)
  const kontur = (yol, renk, w) => { b.save(); b.strokeStyle = renk; b.lineWidth = w; b.stroke(yol); b.restore(); };
  // emaye kalınlığı (yükseklik haritası): öndeki alan arkadakinin yerine geçer
  const kat = (yol, v) => { h.fillStyle = gri(v); h.fill(yol); };
  const katCizgi = (yol, v, w) => { h.strokeStyle = gri(v); h.lineWidth = w; h.stroke(yol); };
  // yuvarlak, kabarık emaye damlası (mücevher ya da inci)
  function damla(x, y, r, alt, tepe) {
    const q = h.createRadialGradient(x - r * 0.15, y - r * 0.15, 0, x, y, r);
    q.addColorStop(0, gri(tepe)); q.addColorStop(0.65, gri(alt + (tepe - alt) * 0.55)); q.addColorStop(1, gri(alt));
    h.fillStyle = q; h.beginPath(); h.arc(x, y, r, 0, TAM); h.fill();
  }
  const altinCizgi = (yol, w) => { g.lineWidth = w; g.stroke(yol); };
  const altinNokta = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, TAM); g.fill(); };
  // öndeki biçim arkadaki altını ve folyoyu örter
  function onPlan(yol) {
    for (const c of [g, f]) { c.save(); c.globalCompositeOperation = 'destination-out'; c.fill(yol); c.restore(); }
  }
  // minyatürcü noktalama: alanın içine yoğunluğu konuma bağlı ince boya noktaları
  function noktala(yol, kutu, adet, renkFn, r) {
    b.save(); b.clip(yol);
    const [x0, y0, w, hh] = kutu;
    for (let k = 0; k < adet; k++) {
      const x = x0 + rnd() * w, y = y0 + rnd() * hh;
      const c = renkFn(x, y);
      if (!c) continue;
      b.fillStyle = c;
      b.beginPath(); b.arc(x, y, r * (0.6 + rnd() * 0.7), 0, TAM); b.fill();
    }
    b.restore();
  }
  // folyo üstünde saydam emaye taş (paillon): folyo maskesi + saydam renk + kabarık damla
  function tas(x, y, r, ic, dis) {
    const yol = new Path2D(); yol.arc(x, y, r, 0, TAM);
    onPlan(yol);
    f.fill(yol);
    dol(yol, rad(x - r * 0.3, y - r * 0.3, 0, x, y, r, [[0, ic], [1, dis]]));
    damla(x, y, r, 0.55, 1);
    return yol;
  }

  // ------------------------------------------------------------ 1. süt beyazı emaye zemin ve gök
  dol(new Path2D('M0,0 H1024 V1024 H0 Z'), '#FBF9F3');
  {
    const gk = new Path2D('M0,0 H1024 V805 H0 Z');
    dol(gk, lin(0, 0, 0, 805, [[0, '#1C86D0'], [0.3, '#47ABE4'], [0.6, '#9ED6F0'], [0.86, '#DDF0F3'], [1, '#FAF7EE']]));
    // güneş tarafında sıcak, açık emaye
    ust(gk, rad(880, 140, 10, 880, 140, 420, [[0, 'rgba(255,250,228,1)'], [0.3, 'rgba(255,246,222,0.7)'], [1, 'rgba(255,246,222,0)']]), 1);
    // camsı, hafif dalgalı lavi: yatay yumuşak sürmeler (fırında birbirine akmış)
    const tmp = yeni(); const tc = tmp.getContext('2d'); tc.setTransform(K, 0, 0, K, 0, 0);
    for (let k = 0; k < 70; k++) {
      const x = rnd() * 1024, y = rnd() * 640;
      const t = y / 805;
      tc.fillStyle = rnd() < 0.5 ? rgba(40, 130, 210, 0.09 * (1 - t)) : rgba(255, 253, 246, 0.12);
      tc.beginPath(); tc.ellipse(x, y, 120 + rnd() * 120, 14 + rnd() * 14, (rnd() - 0.5) * 0.08, 0, TAM); tc.fill();
    }
    b.save(); b.clip(gk); b.setTransform(1, 0, 0, 1, 0, 0); b.filter = `blur(${12 * K}px)`; b.drawImage(tmp, 0, 0); b.restore();
    // minyatürcü noktalama: gök tepede koyu kobalt noktalarla derinleşir
    noktala(gk, [0, 0, 1024, 520], 60000, (x, y) => {
      const dg = Math.hypot(x - 880, y - 140);
      const p = Math.pow(1 - y / 520, 1.6) * clamp((dg - 150) / 260, 0, 1);
      return rnd() < p ? rgba(18, 92, 182, 0.26) : null;
    }, 0.55);
    kat(gk, 0.22);
  }

  // ------------------------------------------------------------ 2. güneş: folyo üstünde saydam sarı-turuncu emaye, altın ışınlar
  {
    const gx = S.gunes.x, gy = S.gunes.y;
    for (let k = 0; k < 32; k++) {
      const a = (k / 32) * TAM;
      const r1 = 52, r2 = k % 2 ? 80 : 108;
      const yol = new Path2D();
      yol.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1);
      if (k % 2) { yol.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2); altinCizgi(yol, 1.7); }
      else {
        for (let t = 0; t <= 1.0001; t += 0.1) {
          const r = r1 + (r2 - r1) * t, aa = a + Math.sin(t * TAM) * 0.045;
          yol.lineTo(gx + Math.cos(aa) * r, gy + Math.sin(aa) * r);
        }
        altinCizgi(yol, 2.2);
      }
    }
    for (let k = 0; k < 16; k++) { const a = (k / 16 + 1 / 32) * TAM; altinNokta(gx + Math.cos(a) * 116, gy + Math.sin(a) * 116, 2.3); }
    const disk = tas(gx, gy, 42, 'rgba(255,240,150,0.62)', 'rgba(244,150,30,0.92)');
    altinCizgi(disk, 2.6);
  }

  // ------------------------------------------------------------ 3. bulutlar: kabarık, opak beyaz emaye
  function bulut(bx, by, s) {
    const tum = [[-62, 10, 26], [-30, -6, 32], [8, -14, 36], [44, -4, 30], [72, 10, 22]];
    const yol = new Path2D();
    for (const [dx, dy, r] of tum) { yol.moveTo(bx + dx * s + r * s, by + dy * s); yol.arc(bx + dx * s, by + dy * s, r * s, 0, TAM); }
    yol.rect(bx - 66 * s, by + 4 * s, 140 * s, 28 * s);
    dol(yol, lin(0, by - 50 * s, 0, by + 32 * s, [[0, '#FFFFFF'], [0.55, '#FBF9FC'], [1, '#D8D4F2']]));
    ust(yol, rad(bx - 40 * s, by + 18 * s, 0, bx - 40 * s, by + 18 * s, 60 * s, [[0, 'rgba(246,186,210,0.55)'], [1, 'rgba(246,186,210,0)']]), 1);
    noktala(yol, [bx - 100 * s, by - 10 * s, 200 * s, 44 * s], Math.round(1600 * s), (x, y) => (rnd() < (y - by + 10 * s) / (44 * s) ? rgba(150, 146, 214, 0.2) : null), 0.5);
    kat(yol, 0.5);
  }
  bulut(170, 250, 1.0); bulut(500, 150, 0.85); bulut(752, 336, 1.0); bulut(938, 472, 0.68); bulut(88, 472, 0.68);

  // ------------------------------------------------------------ 4. yer: açık kum rengi, ince saydam emaye
  {
    const yer = new Path2D('M0,798 H1024 V1024 H0 Z');
    dol(yer, lin(0, 798, 0, 1024, [[0, '#F8E6C4'], [0.45, '#F2CF9C'], [1, '#ECBF86']]));
    noktala(yer, [0, 798, 1024, 226], 30000, (x, y) => (rnd() < 0.55 ? rgba(214, 140, 70, 0.2) : rgba(255, 246, 226, 0.35)), 0.55);
    kat(yer, 0.24);
  }

  // ------------------------------------------------------------ 5. minare: beyaz emaye, mavi-gri noktalama, altın halkalar
  function alemAltin(a) {
    g.fill(P(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 })));
    g.fill(P(S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true)));
    for (const k of a.kureler) g.fill(P(S.daireYolu(k.cx, k.cy, k.r)));
    g.fill(P(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)));
  }
  {
    const c = S.minare.cx;
    const mYol = new Path2D();
    for (const d of Y.minare) mYol.addPath(P(d));
    for (const p of S.minareParcalari()) {
      if (p.tip === 'alem') { alemAltin(p.alem); continue; }
      if (p.tip === 'bant') continue;
      let d, x1, x2;
      if (p.tip === 'poligon') { d = S.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
      else if (p.tip === 'topuz') { d = p.yol; x1 = c - 34; x2 = c + 34; }
      else { d = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true); x1 = p.x1; x2 = p.x2; }
      const yol = P(d);
      const ozel = p.ad.startsWith('şerefe') || p.ad === 'bilezik';
      const renk = ozel ? ['#7FA6DA', '#DCE8F7', '#FFFFFF'] : ['#B6C0D4', '#F2F1EC', '#FFFFFF'];
      dol(yol, lin(x1, 0, x2, 0, [[0, renk[0]], [0.5, renk[1]], [0.78, renk[2]], [1, renk[1]]]));
      if (p.tip === 'korkuluk') {
        // korkuluk: turkuaz emaye zemin üzerinde beyaz babalar
        dol(yol, lin(x1, 0, x2, 0, [[0, '#2E93B8'], [0.6, '#5CC3DC'], [1, '#3AA6C6']]));
        for (let k = 0; k < 8; k++) {
          const xx = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (k + 0.5)) / 8;
          dol(P(S.kemerYolu(xx, p.y1 + 4, 6, p.y2 - p.y1 - 6)), '#FFFFFF', 0.92);
        }
        altinCizgi(P(`M${p.x1},${p.y1 + 1} L${p.x2},${p.y1 + 1}`), 1.5);
      }
      if (ozel) { const ym = (p.noktalar[0][1] + p.noktalar[2][1]) / 2; altinCizgi(P(`M${x1 + 1},${ym} L${x2 - 1},${ym}`), 1.7); }
      kat(yol, p.tip === 'korkuluk' ? 0.52 : 0.44);
    }
    ust(mYol, lin(c - 54, 0, c - 4, 0, [[0, 'rgba(110,132,190,0.32)'], [1, 'rgba(110,132,190,0)']]), 1);
    // zikzak bant: altın boya
    S.zikzakCizgileri().forEach((z) => { g.lineJoin = 'miter'; altinCizgi(P(S.yol(z)), 2.4); g.lineJoin = 'round'; });
    for (const w of S.minarePencereleri) {
      const yol = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      dol(yol, lin(0, w.y, 0, w.y + w.h, [[0, '#1D3F96'], [1, '#4677CC']]));
      kat(yol, 0.56);
    }
  }

  // ------------------------------------------------------------ 6. kaide: beyaz emaye
  {
    const Kd = S.kaide;
    const yol = P(Y.kaide);
    dol(yol, lin(Kd.x1, 0, Kd.x2, 0, [[0, '#C3CBDA'], [0.28, '#F1F0EB'], [1, '#FFFFFF']]));
    ust(yol, lin(0, Kd.y1, 0, Kd.y1 + 16, [[0, 'rgba(130,150,190,0.55)'], [1, 'rgba(130,150,190,0)']]), 1);
    ust(yol, lin(0, Kd.y2 - 18, 0, Kd.y2, [[0, 'rgba(238,200,150,0)'], [1, 'rgba(238,200,150,0.5)']]), 1);
    ust(yol, rad(Kd.x1 - 30, Kd.y1 + 50, 0, Kd.x1 - 30, Kd.y1 + 50, 220, [[0, 'rgba(110,132,190,0.32)'], [1, 'rgba(110,132,190,0)']]), 1);
    kat(yol, 0.44);
    const kor = P(Y.kornis);
    dol(kor, lin(Kd.kornis.x1, 0, Kd.kornis.x2, 0, [[0, '#CDD5E2'], [1, '#FFFFFF']]));
    kat(kor, 0.5);
    altinCizgi(P(`M${Kd.kornis.x1 + 2},${Kd.kornis.y2} L${Kd.kornis.x2 - 2},${Kd.kornis.y2}`), 1.8);
    // altta boyalı küçük süs: altın noktalar ve turkuaz emaye damlacıklar
    for (let x = Kd.x1 + 16, k = 0; x < Kd.x2 - 8; x += 18, k++) {
      if (k % 2) altinNokta(x, 789, 1.8);
      else { const d = new Path2D(); d.arc(x, 789, 2.6, 0, TAM); dol(d, '#2EA6C8'); damla(x, 789, 2.6, 0.44, 0.62); }
    }
    for (const w of Kd.pencereler) {
      altinCizgi(P(S.kemerYolu(w.x, w.y - 7, w.w + 14, w.h + 7)), 1.3);
      const ic = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      dol(ic, lin(0, w.y, 0, w.y + w.h, [[0, '#1C3C90'], [1, '#4A7CCB']]));
      ust(ic, lin(w.x - w.w / 2, 0, w.x + w.w / 2, 0, [[0, 'rgba(255,255,255,0)'], [0.25, 'rgba(255,255,255,0.35)'], [0.4, 'rgba(255,255,255,0)']]), 1);
      kat(ic, 0.58);
    }
  }

  // ------------------------------------------------------------ 7. kasnak: zümrüt emaye
  for (let kat_ = 1; kat_ >= 0; kat_--) {
    const q = S.kasnak[kat_];
    const yol = P(kat_ ? Y.kasnakAlt : Y.kasnakUst);
    dol(yol, lin(q.x1, 0, q.x2, 0, [[0, '#0C6A3A'], [0.35, '#179250'], [0.74, '#5ACB8A'], [1, '#22A05C']]));
    ust(yol, lin(0, q.y2 - 14, 0, q.y2, [[0, 'rgba(6,60,32,0)'], [1, 'rgba(6,60,32,0.5)']]), 1);
    noktala(yol, [q.x1, q.y1, 170, q.y2 - q.y1], 6000, (x, y) => (rnd() < Math.pow(clamp(1 - (x - q.x1) / 160, 0, 1), 1.4) ? rgba(4, 70, 36, 0.3) : null), 0.55);
    kat(yol, 0.5);
    for (const w of S.kasnakPencereleri(kat_)) {
      const p = P(S.kemerYolu(w.x, w.y, w.w, w.h));
      dol(p, lin(0, w.y, 0, w.y + w.h, [[0, '#173A86'], [1, '#3E70C6']]));
      kat(p, 0.6);
    }
    altinCizgi(P(`M${q.x1 + 1},${q.y1 + 1.5} L${q.x2 - 1},${q.y1 + 1.5}`), 2.0);
    if (kat_ === 1) {
      const ws = S.kasnakPencereleri(1);
      for (let j = 0; j < ws.length - 1; j++) altinNokta((ws[j].x + ws[j + 1].x) / 2, 652, 2.0);
    }
  }

  // ------------------------------------------------------------ 8. kubbe: zümrüt emaye, noktalama ve tarama, ince altın kaburgalar
  {
    const yol = P(S.kubbeYolu);
    dol(yol, rad(650, 385, 10, 590, 440, 300, [[0, '#B4F0C6'], [0.2, '#58C988'], [0.56, '#159855'], [1, '#0A6034']]));
    ust(yol, lin(360, 0, 500, 0, [[0, 'rgba(4,56,30,0.55)'], [1, 'rgba(4,56,30,0)']]), 1);
    // noktalama: sol gölge yanında koyu zümrüt noktalar
    noktala(yol, [360, 300, 400, 260], 40000, (x, y) => {
      const t = clamp((x - 362) / 200, 0, 1), alt = clamp((y - 330) / 220, 0, 1);
      return rnd() < Math.pow(1 - t, 1.3) * (0.4 + 0.6 * alt) ? rgba(3, 66, 34, 0.3) : null;
    }, 0.55);
    // ışık yanında ince beyaz emaye taramalar (kaburgalar arası)
    b.save(); b.clip(yol); b.strokeStyle = 'rgba(236,255,242,0.7)'; b.lineWidth = 0.9;
    const kb = S.kaburgalar(48);
    for (let i = 0; i < kb.length; i++) {
      const k = kb[i];
      if (i % 3 === 0 || k.u < 0.0 || k.u > 0.86) continue;
      const pts = k.noktalar;
      const bas = Math.floor(pts.length * 0.12), son = Math.floor(pts.length * (0.45 + 0.35 * (1 - Math.abs(k.u - 0.45))));
      b.globalAlpha = 0.25 + 0.6 * Math.sin(clamp(k.u, 0, 1) * Math.PI);
      b.beginPath();
      for (let j = bas; j < son; j++) (j === bas ? b.moveTo(pts[j][0], pts[j][1]) : b.lineTo(pts[j][0], pts[j][1]));
      b.stroke();
    }
    b.restore();
    kontur(yol, 'rgba(6,70,38,0.75)', 1.6);
    kat(yol, 0.52);
    const kab = S.kaburgalar(16);
    for (const k of kab) {
      const yp = new Path2D(); k.noktalar.forEach(([x, y], i) => (i ? yp.lineTo(x, y) : yp.moveTo(x, y)));
      kontur(yp, 'rgba(6,74,40,0.45)', 2.2);
      altinCizgi(yp, 1.15);
    }
    for (let k = 0; k < 32; k++) { const ph = -Math.PI / 2 + ((k + 0.5) / 32) * Math.PI; altinNokta(560 + Math.sin(ph) * 192, 547, 1.8); }
    alemAltin(S.alemParcalari(560, 300, 1));
  }

  // ------------------------------------------------------------ 9. bitkiler: yeşil emaye yapraklar, beyaz emaye çiçekler, folyo göbekler
  {
    const B = S.bitki;
    b.save(); b.strokeStyle = '#3B8C4C'; b.lineWidth = 4;
    for (const s of B.saplar) b.stroke(P(S.yol(s)));
    b.restore();
    for (const s of B.saplar) katCizgi(P(S.yol(s)), 0.46, 4);
    for (const y of B.yapraklar) {
      const yol = P(S.yaprakYolu(y));
      onPlan(yol);
      const [a, c] = S.yaprakDamari(y);
      const koyu = y.uzunluk > 55;
      dol(yol, lin(a[0], a[1], c[0], c[1], [[0, koyu ? '#16743E' : '#258C4A'], [0.6, koyu ? '#36A25A' : '#52B864'], [1, koyu ? '#86CF86' : '#A9DD8C']]));
      // yaprağın bir yarısı koyu (damar boyunca bölünmüş modelleme)
      const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
      const dx = c[0] - a[0], dy = c[1] - a[1], L = Math.hypot(dx, dy) || 1;
      const px = -dy / L, py = dx / L, w = y.genislik * 0.6;
      ust(yol, lin(mx - px * w, my - py * w, mx + px * w, my + py * w, [[0, 'rgba(6,64,34,0.42)'], [0.5, 'rgba(6,64,34,0.32)'], [0.5, 'rgba(6,64,34,0)'], [1, 'rgba(6,64,34,0)']]), 1);
      kontur(yol, 'rgba(10,80,42,0.5)', 0.9);
      kat(yol, 0.5);
      altinCizgi(P(`M${a[0]},${a[1]} L${a[0] * 0.15 + c[0] * 0.85},${a[1] * 0.15 + c[1] * 0.85}`), 0.85);
    }
    for (const t of B.tomurcuklar) {
      const yol = P(S.tomurcukYolu(t));
      onPlan(yol);
      dol(yol, rad(t.x + Math.cos(t.aci) * t.r, t.y + Math.sin(t.aci) * t.r, 1, t.x, t.y, t.r * 1.8, [[0, '#FFD6E2'], [1, '#D2457A']]));
      kontur(yol, 'rgba(170,40,90,0.5)', 0.8);
      kat(yol, 0.56);
    }
    for (const c of B.cicekler) {
      const tac = S.tacYapraklari(c);
      const tBir = new Path2D();
      for (const e of tac) tBir.addPath(P(S.elipsYolu(e)));
      onPlan(tBir);
      for (const e of tac) {
        const yol = P(S.elipsYolu(e));
        dol(yol, rad(c.x, c.y, c.r * 0.1, c.x, c.y, c.r * 1.08, [[0, '#D23F76'], [0.3, '#EE93B4'], [0.56, '#FCE3EC'], [0.74, '#FFFFFF'], [1, '#FFFFFF']]));
        // gölge yanında soluk lila
        const sx = e.cx - Math.cos(e.aci) * e.rx * 0.2, sy = e.cy + e.ry * 0.8;
        ust(yol, rad(sx, sy, 0, sx, sy, e.rx * 0.9, [[0, 'rgba(176,170,222,0.5)'], [1, 'rgba(176,170,222,0)']]), 1);
        kontur(yol, 'rgba(206,80,126,0.55)', c.r > 40 ? 1.1 : 0.85);
      }
      // dipten uca ince gül ve beyaz fırça çizgileri
      b.save(); b.clip(tBir); b.lineWidth = Math.max(0.6, c.r * 0.022);
      const n = Math.round(c.r * 1.4);
      for (let k = 0; k < n; k++) {
        const a = rnd() * TAM, r0 = c.r * (0.2 + rnd() * 0.15), r1 = c.r * (0.5 + rnd() * 0.45);
        b.strokeStyle = rnd() < 0.55 ? 'rgba(214,70,120,0.28)' : 'rgba(255,255,255,0.7)';
        b.beginPath(); b.moveTo(c.x + Math.cos(a) * r0, c.y + Math.sin(a) * r0); b.lineTo(c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1); b.stroke();
      }
      b.restore();
      kat(tBir, 0.6);
      const orta = tas(c.x, c.y, c.r * 0.21, 'rgba(255,226,120,0.55)', 'rgba(232,124,32,0.9)');
      altinCizgi(orta, Math.max(0.9, c.r * 0.025));
      const sn = Math.max(7, Math.round(c.r / 4));
      for (let k = 0; k < sn; k++) { const a = (k / sn) * TAM + c.aci; altinNokta(c.x + Math.cos(a) * c.r * 0.32, c.y + Math.sin(a) * c.r * 0.32, Math.max(1.1, c.r * 0.035)); }
    }
  }

  // ------------------------------------------------------------ 10. levhanın kendi kenar şeridi: turkuaz emaye, altın çizgi, inci ve taşlar
  {
    const serit = new Path2D(); serit.rect(0, 0, 1024, 1024); serit.rect(22, 22, 980, 980);
    for (const c of [g, f]) { c.save(); c.globalCompositeOperation = 'destination-out'; c.fill(serit, 'evenodd'); c.restore(); }
    b.save(); b.fillStyle = lin(0, 0, 1024, 1024, [[0, '#2CB2D2'], [0.5, '#1A9AC4'], [1, '#27A8CB']]); b.fill(serit, 'evenodd'); b.restore();
    h.save(); h.fillStyle = gri(0.5); h.fill(serit, 'evenodd'); h.restore();
    altinCizgi(P('M22,22 H1002 V1002 H22 Z'), 2.4);
    altinCizgi(P('M2.5,2.5 H1021.5 V1021.5 H2.5 Z'), 2.4);
    const kenarNoktalari = (t) => [[t, 11.5], [t, 1012.5], [11.5, t], [1012.5, t]];
    for (let k = 0; k <= 8; k++) {
      const t = 11.5 + k * 125.125;
      const ana = k === 0 || k === 8 || k === 4;
      for (const [x, y] of kenarNoktalari(t)) {
        const yol = tas(x, y, ana ? 8.5 : 6.2, ana ? 'rgba(255,120,140,0.55)' : 'rgba(120,230,170,0.55)', ana ? 'rgba(196,20,60,0.92)' : 'rgba(10,130,80,0.92)');
        altinCizgi(yol, 1.4);
      }
      if (k < 8) {
        for (let j = 1; j < 5; j++) {
          const tt = t + (125.125 * j) / 5;
          for (const [x, y] of kenarNoktalari(tt)) { const d = new Path2D(); d.arc(x, y, 2.4, 0, TAM); dol(d, '#FFFFFF'); damla(x, y, 2.4, 0.5, 0.72); }
        }
      }
    }
  }

  // ------------------------------------------------------------ 11. fırın: renkler hafifçe akar; kalınlık haritaları
  const akmis = yeni();
  {
    const x = akmis.getContext('2d');
    x.filter = `blur(${0.7 * K}px)`; x.drawImage(boyaC, 0, 0);
    x.filter = `blur(${8 * K}px)`; x.globalCompositeOperation = 'screen'; x.globalAlpha = 0.12; x.drawImage(boyaC, 0, 0);
  }
  const boyaV = akmis.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
  const altinV = g.getImageData(0, 0, N, N).data;
  const folyoV = f.getImageData(0, 0, N, N).data;
  const bulanik = (src, r) => { const c = yeni(); const x = c.getContext('2d', { willReadFrequently: true }); x.filter = `blur(${r * K}px)`; x.drawImage(src, 0, 0); return x.getImageData(0, 0, N, N).data; };
  const altinB = bulanik(altinC, 0.9);
  const yukS = bulanik(yukC, 1.5);   // yuvarlanmış emaye yüzeyi
  const yukL = bulanik(yukC, 7);   // birikme için geniş ortalama

  // ------------------------------------------------------------ 12. birleşim
  const out = ctx.createImageData(N, N);
  const o = out.data;
  const L = [0.55, -0.62, 0.62]; { const n = Math.hypot(...L); L[0] /= n; L[1] /= n; L[2] /= n; }
  const Hh = [L[0], L[1], L[2] + 1]; { const n = Math.hypot(...Hh); Hh[0] /= n; Hh[1] /= n; Hh[2] /= n; }
  const NL0 = L[2];
  const EGIM = 5.5; // kalınlık eğiminden normale
  const pc = Math.cos(-0.06), ps = Math.sin(-0.06);
  const PW = 96, PD = PW * 0.3, PR = PW * 1.3, PY = -50; // sivri kemerli pencere yansıması
  for (let py = 0; py < N; py++) {
    const y = py / K;
    const ym = py > 1 ? -2 * N * 4 : 0, yp = py < N - 2 ? 2 * N * 4 : 0;
    for (let px = 0; px < N; px++) {
      const j = (py * N + px) * 4;
      const x = px / K;
      let r = boyaV[j], gg = boyaV[j + 1], bb = boyaV[j + 2];
      const mx = Math.max(r, gg, bb), mn = Math.min(r, gg, bb);
      const doy = (mx - mn) / (mx + 1);
      // emaye kalınlığı: renk kenarında birikme (koyulaşma ve doygunluk)
      const hs = yukS[j] / 255, hl = yukL[j] / 255;
      const birik = clamp((hs - hl) * 7, 0, 0.7) * doy;
      // fırınlanmış katın çok hafif yoğunluk dalgası
      const dalga = (vnoise(x * 0.02, y * 0.02, 4) - 0.5) * 0.08 * doy;
      const kk = 1 - birik * 0.75 - dalga;
      r *= kk; gg *= kk; bb *= kk;
      const ort = (r + gg + bb) / 3, ds = 1 + birik * 0.9;
      r = ort + (r - ort) * ds; gg = ort + (gg - ort) * ds; bb = ort + (bb - ort) * ds;
      // folyo (paillon): buruşuk metal saydam emayenin altında parlar
      const fo = folyoV[j + 3] / 255;
      if (fo > 0.01) {
        const qx = x * 0.3, qy = y * 0.3;
        const ix = Math.floor(qx), iy = Math.floor(qy);
        let d1 = 9, d2 = 9, hid = 0;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const cx2 = ix + ox + hash(ix + ox, iy + oy, 41), cy2 = iy + oy + hash(ix + ox, iy + oy, 42);
          const dd = (qx - cx2) ** 2 + (qy - cy2) ** 2;
          if (dd < d1) { d2 = d1; d1 = dd; hid = hash(ix + ox, iy + oy, 43); } else if (dd < d2) d2 = dd;
        }
        const sirt = clamp((Math.sqrt(d2) - Math.sqrt(d1)) * 6, 0, 1);
        const parla = (0.66 + 0.75 * Math.pow(hid, 1.3)) * (0.85 + 0.15 * sirt) + (1 - sirt) * 0.2;
        const fr = r * parla * 1.06, fg = gg / 255 * 240 * parla, fb = bb / 255 * 175 * parla;
        r = r * (1 - fo) + fr * fo; gg = gg * (1 - fo) + fg * fo; bb = bb * (1 - fo) + fb * fo;
      }
      // camsı yüzeyin normali: yuvarlanmış kalınlık eğimi + levhanın hafif bombesi
      const xm = px > 1 ? -8 : 0, xp = px < N - 2 ? 8 : 0;
      let nx = -(yukS[j + xp] - yukS[j + xm]) / 255 / 4 * EGIM * K + (x - 512) / 1024 * 0.08;
      let ny = -(yukS[j + yp] - yukS[j + ym]) / 255 / 4 * EGIM * K + (y - 512) / 1024 * 0.08;
      let nz = 1;
      const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
      const NL = nx * L[0] + ny * L[1] + nz * L[2];
      const NH = Math.max(0, nx * Hh[0] + ny * Hh[1] + nz * Hh[2]);
      // kenarın ışığa dönük yanı açılır, öbür yanı derinleşir
      const golge = 1 + clamp(NL - NL0, -0.6, 0.4) * 0.45;
      r *= golge; gg *= golge; bb *= golge;
      // altın: metal tozu pırıltısı ve hafif kabarıklık (kendi normali)
      const al = altinV[j + 3] / 255;
      if (al > 0.01) {
        const axm = px > 0 ? j - 4 : j, axp = px < N - 1 ? j + 4 : j;
        const aym = py > 0 ? j - N * 4 : j, ayp = py < N - 1 ? j + N * 4 : j;
        const hx = (altinB[axp + 3] - altinB[axm + 3]) / 255, hy = (altinB[ayp + 3] - altinB[aym + 3]) / 255;
        let gx = -hx * 2.2, gy = -hy * 2.2, gz = 1;
        const gl = Math.hypot(gx, gy, gz); gx /= gl; gy /= gl; gz /= gl;
        const GL = Math.max(0, gx * L[0] + gy * L[1] + gz * L[2]);
        const GH = Math.max(0, gx * Hh[0] + gy * Hh[1] + gz * Hh[2]);
        const toz = 0.86 + 0.28 * vnoise(x * 2.2, y * 2.2, 21);
        const ton = (0.56 + 0.6 * GL) * toz;
        const sp = Math.pow(GH, 30) * 0.8 + (hash(px, py, 5) > 0.986 ? 0.35 : 0);
        const ar = 216 * ton + 255 * sp, ag = 170 * ton + 245 * sp, ab = 74 * ton + 190 * sp;
        r = r * (1 - al) + ar * al; gg = gg * (1 - al) + ag * al; bb = bb * (1 - al) + ab * al;
      }
      // cam parıltısı: kenarlarda keskin ışık
      let sheen = Math.pow(NH, 120) * 0.85;
      // levhanın genel parlaklığı
      const dx = x - 640, dy = y - 300;
      sheen += 0.06 * Math.exp(-(dx * dx + dy * dy) / (2 * 360 * 360));
      // pencere yansıması: yüzey eğimiyle kırılır, portakal kabuğu dokusuyla titrer
      const kab1 = vnoise(x * 0.3, y * 0.3, 75) - 0.5;
      const rx = x + nx * 46 + kab1 * 2.4 - 700, ry = y + ny * 46 + kab1 * 2.4 - 312;
      const wx = (rx * pc - ry * ps), wy = (rx * ps + ry * pc);
      if (wy > -190 && wy < 165 && Math.abs(wx) < 115) {
        // sivri kemerli, ortadan tek dikmeyle ikiye ayrılmış pencere
        let yg = PW;
        if (wy < PY) { const q = PR * PR - (wy - PY) * (wy - PY); yg = q > 0 ? Math.sqrt(q) - PD : -1; }
        let pen = clamp((yg - Math.abs(wx)) * 0.1, 0, 1) * clamp((150 - wy) * 0.1, 0, 1);
        const dik = clamp((Math.abs(wx) - 5) * 0.6, 0, 1);
        pen *= dik * (0.75 + 0.25 * clamp(-wy / 150 + 0.5, 0, 1));
        sheen += pen * 0.4;
      }
      sheen = clamp(sheen, 0, 1);
      r += (255 - r) * sheen; gg += (255 - gg) * sheen; bb += (255 - bb) * sheen;
      o[j] = clamp(r, 0, 255); o[j + 1] = clamp(gg, 0, 255); o[j + 2] = clamp(bb, 0, 255); o[j + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
  S.hazir();
})();
</script>
