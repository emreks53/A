<script>
// ---------------------------------------------------------------- el yardımcıları (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, yol örnekleme, elle çekilmiş (titrek, basınçlı) çizgi,
// katmanlar ve piksel geçişleri. Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const OLCEK = 2; // çalışma tuvali 2048 piksel; koordinatlar 1024

function yeniKatman() {
  const c = S.yeniTuval(1024 * OLCEK, 1024 * OLCEK);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(OLCEK, 0, 0, OLCEK, 0, 0);
  return { c, x };
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// SVG yolunu örnekleme (getPointAtLength)
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

/** Kırık çizgiyi normali boyunca d kadar kaydırır. */
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit (kontur) olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1 kalınlık oynaması),
 *  sivri / basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta hafif basınç düğümü, px)
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}

/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini (ör. kaburga) elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}

/** Bir tuvalin bütün pikselleri üzerinde geçiş: fn(veri, i, x, y) — x,y piksel koordinatı (tuvalin kendi ölçeğinde). */
function pikselGecis(ctx, fn) {
  const c = ctx.canvas;
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  const W = c.width;
  const H = c.height;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) fn(d, (y * W + x) * 4, x, y);
  }
  ctx.putImageData(im, 0, 0);
}

/** Önceden hesaplanmış gürültü dokusu (hızlı örnekleme): dk(x,y) piksel → [0,1]. */
function gurultuDokusu(boyut, olcek, oktav, tohum) {
  const nz = gurultu(tohum);
  const a = new Float32Array(boyut * boyut);
  for (let y = 0; y < boyut; y++) for (let x = 0; x < boyut; x++) a[y * boyut + x] = nz.fbm(x * olcek, y * olcek, oktav);
  return (x, y) => a[((y | 0) % boyut) * boyut + ((x | 0) % boyut)];
}

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

/** Kubbe profilinden y → yarıçap (hızlı tablo). */
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.getContext('2d', { willReadFrequently: true });
  const ctx = S.tuval(cv, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma.c, 0, 0, 1024, 1024);
  return ctx;
}

/**
 * Altın (ya da gümüş) varak dokusu: kare varak yaprakları sıra sıra, her yaprağın tonu biraz farklı,
 * bindirme yerlerinde ince koyu/açık dikiş, perdah izi ve ışık parlaması. Tam boy katman döner.
 *  o: boy (varak kenarı, 1024 biriminde), tohum, koyu/orta/acik/parlak (hex), cesit (ton farkı), isik(x,y) → ek parlaklık
 */
function varakDokusu(o) {
  const L = yeniKatman();
  const W2 = 1024 * OLCEK;
  const im = L.x.createImageData(W2, W2);
  const d = im.data;
  const tohum = o.tohum || 1;
  const r = S.rng(tohum);
  const boy = o.boy * OLCEK;
  const satirOfs = [];
  const kay = o.kaydirma != null ? o.kaydirma : 1;
  for (let j = 0; j < 400; j++) satirOfs.push(r() * boy * kay);
  const nz = gurultu(tohum + 5);
  const K = hex(o.koyu || '#A9832F');
  const M = hex(o.orta || '#D4AF55');
  const A = hex(o.acik || '#EED48A');
  const P = hex(o.parlak || '#FBF0C4');
  const cesit = o.cesit != null ? o.cesit : 0.18;
  const dikis = 1.3 * OLCEK;
  const ramp = (v) => (v < 0.45 ? karistir(K, M, v / 0.45) : v < 0.78 ? karistir(M, A, (v - 0.45) / 0.33) : karistir(A, P, Math.min(1, (v - 0.78) / 0.22)));
  const x0 = o.x0 != null ? o.x0 * OLCEK : 0;
  const x1 = o.x1 != null ? o.x1 * OLCEK : W2;
  const y0 = o.y0 != null ? o.y0 * OLCEK : 0;
  const y1 = o.y1 != null ? o.y1 * OLCEK : W2;
  for (let y = y0; y < y1; y++) {
    const j = Math.floor(y / boy);
    const fy = y - j * boy;
    const ox = satirOfs[j % 400];
    for (let x = x0; x < x1; x++) {
      const xi = x + ox;
      const i = Math.floor(xi / boy);
      const fx = xi - i * boy;
      let v = 0.55 + (karma(i + 500, j + 500, tohum) - 0.5) * cesit * 2;
      if (o.isik) v += o.isik(x / OLCEK, y / OLCEK);
      v += 0.09 * (nz.n(x * 0.0035, y * 0.0035) - 0.5) + 0.06 * (nz.n(x * 0.0018 + 30, y * 0.028) - 0.5) + 0.03 * (nz.n(x * 0.02, y * 0.2) - 0.5);
      v += 0.05 * (fx / boy - 0.5) - 0.03 * (fy / boy - 0.5);
      const dk = o.dikis != null ? o.dikis : 1;
      if (fx < dikis || fy < dikis) v -= 0.13 * dk;
      else if (fx < dikis * 1.9 || fy < dikis * 1.9) v += 0.07 * dk;
      v += 0.02 * (karma(x, y, tohum + 9) - 0.5);
      const col = ramp(kenet(v, 0, 1));
      const k = (y * W2 + x) * 4;
      d[k] = col[0];
      d[k + 1] = col[1];
      d[k + 2] = col[2];
      d[k + 3] = 255;
    }
  }
  L.x.putImageData(im, 0, 0);
  return L;
}
// ---------------------------------------------------------------- S-188 Shin-hanga Ağaç Baskı
// Hayalî ressam-baskıcının eli: yaban kirazı kalıplar, hangi-tō bıçağıyla oyulmuş ince çivit-mürekkep ana kalıp
// (sumi-ita), pirinç nişastası + suluboya, bambu kılıflı baren, kalın kizuki-hōsho washi. Her renk ayrı kalıptan
// basılır; gök ve gölgeler kalıp silinerek derecelenir (bokashi), geniş alanlarda ağaç damarı ve baren izi
// görünür; ana kalıp renklere göre hafif kaymıştır (kentō payı). Işık gerçekçidir: sağ üstten sıcak, gölgeler
// lavanta-mavi.
const calisma = yeniKatman();
const c = calisma.x;
const renk = yeniKatman(); // renk kalıpları
const R = renk.x;
const hat = yeniKatman(); // ana (çizgi) kalıp
const H = hat.x;
const Y = S.yollar();
const rr = S.rng(188);
const KAGIT = hex('#F8F4EA');
const HAT = '#2B3547';

function lavi(ctx, yol, x1, y1, x2, y2, duraklar) {
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  duraklar.forEach(([t, r]) => g.addColorStop(t, r));
  ctx.fillStyle = g;
  ctx.fill(yol);
}
/** Kalıp kenarı: renk alanı hafif oynak kenarla basılır. */
const kalip = (d, amp) => titrekYol(d, amp != null ? amp : 0.55, 0.05, 1.6);
/** Önündeki biçim, arkadaki çizgileri örter (ana kalıpta o çizgiler oyulmamıştır). */
function ort(yol) {
  H.save();
  H.globalCompositeOperation = 'destination-out';
  H.fillStyle = '#000';
  H.fill(yol);
  H.restore();
}
/** Oyulmuş ana kalıp çizgisi: hafif köşeli (uzun örnek adımı), keskin kenarlı, kalınlığı bıçakla oynar. */
const OYMA = { w: 1.15, renk: HAT, titreme: 0.22, frek: 0.03, basinc: 0.22, adim: 2.4 };
/** Renk kalıbında alanı kâğıda döndürür (önceki renkler o biçimin altında basılmamıştır). */
function sil(yol) {
  R.save();
  R.globalCompositeOperation = 'destination-out';
  R.fillStyle = '#000';
  R.fill(yol);
  R.restore();
}
const oy = (d, o) => cizgiYol(H, d, Object.assign({}, OYMA, o || {}));
const oyN = (pts, o) => cizgiNokta(H, pts, Object.assign({}, OYMA, o || {}));

// ---- 1) gök kalıbı: üstten silinerek derecelenen mavi, ufukta şeftali
{
  const g = R.createLinearGradient(0, 0, 0, 800);
  g.addColorStop(0, '#6197C8');
  g.addColorStop(0.3, '#93BCDC');
  g.addColorStop(0.62, '#D3E3EA');
  g.addColorStop(0.84, '#F5E2C9');
  g.addColorStop(1, '#F7D9BA');

  rg.addColorStop(0, 'rgba(250,222,170,0.55)');

  R.fillStyle = rg;
  R.fillRect(600, 0, 424, 420);

}

// ---- 2) bulutlar: kâğıt boş bırakılır; altları lavanta gölge kalıbıyla, ışık yanı şeftaliyle derecelenir
function bulut(cx, cy, w, h, tohum) {
  const r = S.rng(tohum);
  const taban = cy + h * 0.32;
  const p = new Path2D();
  const n = 6 + Math.floor(w / 40);
  const lob = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const kemer = Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * t)), 1.4);
    const ry = h * (0.2 + 0.42 * kemer * (0.75 + r() * 0.5));
    const rx = ry * (1.1 + r() * 0.6);
    lob.push([cx - w / 2 + w * t + (r() - 0.5) * 12, taban - ry * (0.55 + r() * 0.25), rx, ry]);
  }
  // ikinci kat: üstte daha küçük kabarıklar
  for (let i = 0; i < Math.floor(n / 2); i++) {
    const t = 0.25 + 0.5 * r();
    const ry = h * (0.16 + 0.16 * r());
    lob.push([cx - w / 2 + w * t, taban - h * (0.5 + 0.25 * r()), ry * 1.3, ry]);
  }
  for (const [x, y, rx, ry] of lob) {
    p.moveTo(x + rx, y);
    p.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }
  // iç kabarıklar: her birinin alt kenarında hilal biçimli soluk lavanta (ikinci gölge kalıbı)
  const icler = [];
  const icTaban = taban - h * 0.26;
  for (let i = 0; i < 3; i++) {
    const t = 0.24 + i * 0.27 + (r() - 0.5) * 0.08;
    const ry = h * (0.26 + r() * 0.1);
    icler.push([cx - w / 2 + w * t, icTaban - ry * 0.7, ry * 1.45, ry]);
  }
  const kes = new Path2D();
  kes.rect(cx - w, cy - h * 3, w * 2, taban - (cy - h * 3) + 0.5);
  R.save();
  R.clip(kes);
  R.globalCompositeOperation = 'destination-out';
  R.fillStyle = 'rgba(0,0,0,0.97)';
  R.fill(p);
  R.globalCompositeOperation = 'source-over';
  R.clip(p);
  let g = R.createLinearGradient(0, taban, 0, taban - h * 1.05);
  g.addColorStop(0, 'rgba(148,146,190,0.66)');
  g.addColorStop(0.3, 'rgba(166,164,202,0.34)');
  g.addColorStop(0.62, 'rgba(186,184,214,0.06)');
  g.addColorStop(1, 'rgba(190,190,214,0)');
  R.fillStyle = g;
  R.fillRect(cx - w, cy - h * 3, w * 2, h * 4);
  for (const [x, y, rx, ry] of icler) {
    R.save();
    R.translate(x, y);
    R.scale(rx / ry, 1);
    const gg = R.createRadialGradient(0, -ry * 0.45, ry * 0.95, 0, -ry * 0.45, ry * 1.45);
    gg.addColorStop(0, 'rgba(156,154,196,0)');
    gg.addColorStop(1, 'rgba(156,154,196,0.38)');
    R.fillStyle = gg;
    R.beginPath();
    R.arc(0, 0, ry, 0, Math.PI * 2);
    R.fill();
    R.restore();
  }
  g = R.createLinearGradient(cx + w * 0.55, cy - h * 0.9, cx - w * 0.05, cy + h * 0.1);
  g.addColorStop(0, 'rgba(250,212,168,0.5)');
  g.addColorStop(1, 'rgba(250,212,168,0)');
  R.fillStyle = g;
  R.fillRect(cx - w, cy - h * 3, w * 2, h * 4);
  R.restore();
}

  const L = yeniKatman();

  const dd = im.data;
  const ramp = [hex('#24584E'), hex('#2F7058'), hex('#4E9A62'), hex('#93C77C'), hex('#D3E8A4')];
  for (let py = 0; py < y1 - y0; py++) {
    const y = (py + y0) / OLCEK;
    const Rr = kubbeR(y);
    const lat = kenet((555 - y) / 255, 0, 1);
    for (let px = 0; px < w; px++) {
      const x = (px + x0) / OLCEK;
      const u = Rr > 0.5 ? kenet((x - 560) / Rr, -1, 1) : 0;
      const th = Math.asin(u);
      // küre normali ile ışık yönü (sağ üst-ön)
      const phi = lat * 1.25;
      const nx = Math.sin(th) * Math.cos(phi);
      const ny = Math.sin(phi);
      const nzv = Math.cos(th) * Math.cos(phi);
      const dif = kenet(nx * 0.62 + ny * 0.5 + nzv * 0.6, 0, 1);
      const k = (th + Math.PI / 2) / (Math.PI / 16);
      const f = k - Math.floor(k);
      let v = 0.1 + 0.82 * dif;
      v -= 0.06 * Math.exp(-f / 0.18);
      v += 0.05 * yumusak(0.82, 1, f) * dif;
      v += 0.22 * Math.pow(kenet((dif - 0.82) / 0.18, 0, 1), 2);
      v = kenet(v, 0, 1) * 4;
      const i0 = Math.min(3, Math.floor(v));
      const col = karistir(ramp[i0], ramp[i0 + 1], v - i0);
      const i = (py * w + px) * 4;
      dd[i] = col[0];
      dd[i + 1] = col[1];
      dd[i + 2] = col[2];
      dd[i + 3] = 255;
    }
  }
  L.x.putImageData(im, x0, y0);

}

  R.fillStyle = '#5E9A5C';
  R.fill(yol);
  // ışığa bakan yarı sarı-yeşil, öbürü mavi-yeşil
  const [ax, ay] = P(L * 0.5, -W * 0.5);
  const [bx, by] = P(L * 0.5, W * 0.5);
  const isikSol = -Math.sin(y.aci) * 0.7 + Math.cos(y.aci) * 0.7 > 0;
  lavi(R, yol, ax, ay, bx, by, isikSol ? [[0, 'rgba(170,206,112,0.85)'], [0.5, 'rgba(120,170,90,0.3)'], [0.52, 'rgba(36,86,78,0.35)'], [1, 'rgba(36,86,78,0.6)']] : [[0, 'rgba(36,86,78,0.6)'], [0.48, 'rgba(36,86,78,0.35)'], [0.5, 'rgba(120,170,90,0.3)'], [1, 'rgba(170,206,112,0.85)']]);

function tacYolu(cx, cy, r, a) {
  const ca = Math.cos(a);

  const P = (u, v) => `${(cx + (u * ca - v * sa) * r).toFixed(2)},${(cy + (u * sa + v * ca) * r).toFixed(2)}`;
  return (
    `M${P(0.12, -0.1)} C${P(0.28, -0.44)} ${P(0.56, -0.6)} ${P(0.82, -0.44)} ` +
    `C${P(1.0, -0.3)} ${P(1.04, -0.1)} ${P(0.97, -0.03)} C${P(0.95, 0)} ${P(0.95, 0)} ${P(0.97, 0.03)} ` +
    `C${P(1.04, 0.1)} ${P(1.0, 0.3)} ${P(0.82, 0.44)} C${P(0.56, 0.6)} ${P(0.28, 0.44)} ${P(0.12, 0.1)} Z`
  );
}

    const s = 0.5 + 0.5 * Math.sin(wv * Math.PI * 2);
    const damar = yumusak(0.78, 1, s) * 0.9 + yumusak(0.9, 1, 1 - s) * 0.3;
    let m = 1 - 0.17 * damar + 0.07 * (nz.fbm(X * 0.04, Yy * 0.04, 2) - 0.5) + 0.06 * (karma(x >> 1, y >> 1, 5) - 0.5);
    // baren: hafif dairesel sürtme izi
    const bx = X % 46;
    const by = Yy % 46;
    m += 0.025 * Math.sin(Math.hypot(bx - 23, by - 23) * 0.9 + nz.n(X * 0.01, Yy * 0.01) * 6);
    d[i] = kenet(KAGIT[0] - (KAGIT[0] - d[i]) * m, 0, 255);
    d[i + 1] = kenet(KAGIT[1] - (KAGIT[1] - d[i + 1]) * m, 0, 255);
    d[i + 2] = kenet(KAGIT[2] - (KAGIT[2] - d[i + 2]) * m, 0, 255);
  });
}
c.save();
c.translate(0.9, -0.7);
c.globalAlpha = 0.94;
c.drawImage(hat.c, 0, 0, 1024, 1024);
c.restore();

// ---- 11) ekran: washi lifleri
const ekran = ekranaAktar(calisma);
{
  pikselGecis(ekran, (d, i, x, y) => {
    const m = 1 + 0.03 * (karma(x, y, 21) - 0.5);
    d[i] = kenet(d[i] * m, 0, 255);
    d[i + 1] = kenet(d[i + 1] * m, 0, 255);
    d[i + 2] = kenet(d[i + 2] * m, 0, 255);
  });
}
SAHNE.hazir();
