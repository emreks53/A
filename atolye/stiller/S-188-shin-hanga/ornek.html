<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-188 Shin-hanga Ağaç Baskı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ---------------------------------------------------------------- el yardımcıları (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, yol örnekleme, elle çekilmiş (titrek, basınçlı) çizgi,
// katmanlar ve piksel geçişleri. Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const OLCEK = 2; // çalışma tuvali 2048 piksel; koordinatlar 1024

function yeniKatman() {
  const c = S.yeniTuval(1024 * OLCEK, 1024 * OLCEK);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(OLCEK, 0, 0, OLCEK, 0, 0);
  return { c, x };
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// SVG yolunu örnekleme (getPointAtLength)
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

/** Kırık çizgiyi normali boyunca d kadar kaydırır. */
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit (kontur) olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1 kalınlık oynaması),
 *  sivri / basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta hafif basınç düğümü, px)
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}

/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini (ör. kaburga) elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}

/** Bir tuvalin bütün pikselleri üzerinde geçiş: fn(veri, i, x, y) — x,y piksel koordinatı (tuvalin kendi ölçeğinde). */
function pikselGecis(ctx, fn) {
  const c = ctx.canvas;
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  const W = c.width;
  const H = c.height;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) fn(d, (y * W + x) * 4, x, y);
  }
  ctx.putImageData(im, 0, 0);
}

/** Önceden hesaplanmış gürültü dokusu (hızlı örnekleme): dk(x,y) piksel → [0,1]. */
function gurultuDokusu(boyut, olcek, oktav, tohum) {
  const nz = gurultu(tohum);
  const a = new Float32Array(boyut * boyut);
  for (let y = 0; y < boyut; y++) for (let x = 0; x < boyut; x++) a[y * boyut + x] = nz.fbm(x * olcek, y * olcek, oktav);
  return (x, y) => a[((y | 0) % boyut) * boyut + ((x | 0) % boyut)];
}

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

/** Kubbe profilinden y → yarıçap (hızlı tablo). */
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.getContext('2d', { willReadFrequently: true });
  const ctx = S.tuval(cv, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma.c, 0, 0, 1024, 1024);
  return ctx;
}

/**
 * Altın (ya da gümüş) varak dokusu: kare varak yaprakları sıra sıra, her yaprağın tonu biraz farklı,
 * bindirme yerlerinde ince koyu/açık dikiş, perdah izi ve ışık parlaması. Tam boy katman döner.
 *  o: boy (varak kenarı, 1024 biriminde), tohum, koyu/orta/acik/parlak (hex), cesit (ton farkı), isik(x,y) → ek parlaklık
 */
function varakDokusu(o) {
  const L = yeniKatman();
  const W2 = 1024 * OLCEK;
  const im = L.x.createImageData(W2, W2);
  const d = im.data;
  const tohum = o.tohum || 1;
  const r = S.rng(tohum);
  const boy = o.boy * OLCEK;
  const satirOfs = [];
  const kay = o.kaydirma != null ? o.kaydirma : 1;
  for (let j = 0; j < 400; j++) satirOfs.push(r() * boy * kay);
  const nz = gurultu(tohum + 5);
  const K = hex(o.koyu || '#A9832F');
  const M = hex(o.orta || '#D4AF55');
  const A = hex(o.acik || '#EED48A');
  const P = hex(o.parlak || '#FBF0C4');
  const cesit = o.cesit != null ? o.cesit : 0.18;
  const dikis = 1.3 * OLCEK;
  const ramp = (v) => (v < 0.45 ? karistir(K, M, v / 0.45) : v < 0.78 ? karistir(M, A, (v - 0.45) / 0.33) : karistir(A, P, Math.min(1, (v - 0.78) / 0.22)));
  const x0 = o.x0 != null ? o.x0 * OLCEK : 0;
  const x1 = o.x1 != null ? o.x1 * OLCEK : W2;
  const y0 = o.y0 != null ? o.y0 * OLCEK : 0;
  const y1 = o.y1 != null ? o.y1 * OLCEK : W2;
  for (let y = y0; y < y1; y++) {
    const j = Math.floor(y / boy);
    const fy = y - j * boy;
    const ox = satirOfs[j % 400];
    for (let x = x0; x < x1; x++) {
      const xi = x + ox;
      const i = Math.floor(xi / boy);
      const fx = xi - i * boy;
      let v = 0.55 + (karma(i + 500, j + 500, tohum) - 0.5) * cesit * 2;
      if (o.isik) v += o.isik(x / OLCEK, y / OLCEK);
      v += 0.09 * (nz.n(x * 0.0035, y * 0.0035) - 0.5) + 0.06 * (nz.n(x * 0.0018 + 30, y * 0.028) - 0.5) + 0.03 * (nz.n(x * 0.02, y * 0.2) - 0.5);
      v += 0.05 * (fx / boy - 0.5) - 0.03 * (fy / boy - 0.5);
      const dk = o.dikis != null ? o.dikis : 1;
      if (fx < dikis || fy < dikis) v -= 0.13 * dk;
      else if (fx < dikis * 1.9 || fy < dikis * 1.9) v += 0.07 * dk;
      v += 0.02 * (karma(x, y, tohum + 9) - 0.5);
      const col = ramp(kenet(v, 0, 1));
      const k = (y * W2 + x) * 4;
      d[k] = col[0];
      d[k + 1] = col[1];
      d[k + 2] = col[2];
      d[k + 3] = 255;
    }
  }
  L.x.putImageData(im, 0, 0);
  return L;
}

/**
 * Bir yolun içini piksel başına boyar (ressamın kat kat sürdüğü lavileri hesaplamak için).
 * fn(x, y, o): x,y 1024 biriminde; o = [r, g, b, a] (0..255) dizisine yazar. a başlangıçta 255'tir.
 */
function pikselBoya(ctx, yol, x0, y0, x1, y1, fn) {
  x0 = Math.floor(x0);
  y0 = Math.floor(y0);
  x1 = Math.ceil(x1);
  y1 = Math.ceil(y1);
  const W = (x1 - x0) * OLCEK;
  const H = (y1 - y0) * OLCEK;
  if (W <= 0 || H <= 0) return;
  const cv = S.yeniTuval(W, H);
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const im = cx.createImageData(W, H);
  const d = im.data;
  const o = [0, 0, 0, 255];
  for (let py = 0; py < H; py++) {
    const y = y0 + (py + 0.5) / OLCEK;
    for (let px = 0; px < W; px++) {
      const x = x0 + (px + 0.5) / OLCEK;
      o[3] = 255;
      fn(x, y, o);
      const i = (py * W + px) * 4;
      d[i] = o[0];
      d[i + 1] = o[1];
      d[i + 2] = o[2];
      d[i + 3] = o[3];
    }
  }
  cx.putImageData(im, 0, 0);
  ctx.save();
  if (yol) ctx.clip(yol);
  ctx.drawImage(cv, x0, y0, x1 - x0, y1 - y0);
  ctx.restore();
}

/**
 * Elle sürülmüş kat kat lavi: düzgün bir hedef koyuluğu (T ∈ 0..1) N ayrı fırça katına böler. Her katın sınırı
 * fırça boyunca hafifçe oynar ve su fırçasıyla yumuşatılmıştır; katın içinde fırça kıllarının bıraktığı boyuna
 * izler, sınırında ince bir ıslak kenar kalır. Dönen fonksiyon: (T, a, b, ek) → 0..1
 *  a: fırça yönüne dik koordinat (px), b: fırça boyunca koordinat (px), ek: bölgeye özgü kaydırma.
 */
function katmanlayici(o) {
  const nz = gurultu(o.tohum || 77);
  const N = o.N || 6;
  const yum = o.yum != null ? o.yum : 0.05;
  const dalga = o.dalga != null ? o.dalga : 0.05;
  const df = o.df != null ? o.df : 0.02;
  const dfa = o.dfa != null ? o.dfa : 0.004;
  const lif = o.lif != null ? o.lif : 0.15;
  const lfa = o.lfa != null ? o.lfa : 0.5;
  const lfb = o.lfb != null ? o.lfb : 0.012;
  const kenar = o.kenar || 0;
  return function (T, a, b, ek) {
    ek = ek || 0;
    let s = 0;
    for (let j = 1; j <= N; j++) {
      const e = j / (N + 1);
      const w = dalga * ((nz.n(b * df + j * 31.7 + ek, a * dfa + j * 7.3) - 0.5) * 2 + 0.35 * (nz.n(b * df * 3.3 + j * 5.1 + ek, 9.7 + j) - 0.5));
      const q = T + w - e;
      if (q < -yum) continue;
      let k = yumusak(-yum, yum, q);
      if (lif) k *= 1 + lif * (nz.n(a * lfa + j * 13.1 + ek * 0.7, b * lfb + j * 3.7) - 0.5) * 2;
      if (kenar) k += kenar * Math.max(0, 1 - Math.abs(q - yum * 0.5) / (yum * 0.9));
      s += k;
    }
    return s / N;
  };
}

/** Çok duraklı renk rampası: [[t, [r,g,b]], …] → v ∈ 0..1 için renk. */
function rampa(duraklar) {
  return function (v) {
    if (v <= duraklar[0][0]) return duraklar[0][1];
    for (let i = 1; i < duraklar.length; i++) {
      if (v <= duraklar[i][0]) {
        const [t0, c0] = duraklar[i - 1];
        const [t1, c1] = duraklar[i];
        return karistir(c0, c1, (v - t0) / (t1 - t0 || 1));
      }
    }
    return duraklar[duraklar.length - 1][1];
  };
}

/** Kubbe hücresi: (x, y) için u, boylam açısı, dilim no (0..15), dilim içi konum f (0 sol kaburga → 1 sağ), enlem. */
function kubbeHucre(x, y) {
  const R = kubbeR(y);
  const lat = kenet((555 - y) / 255, 0, 1);
  const u = R > 0.5 ? kenet((x - 560) / R, -1, 1) : 0;
  const th = Math.asin(u);
  const k = (th + Math.PI / 2) / (Math.PI / 16);
  const gi = Math.max(0, Math.min(15, Math.floor(k)));
  const f = k - gi;
  const uc = Math.sin(-Math.PI / 2 + ((gi + 0.5) * Math.PI) / 16);
  return { R, lat, u, th, gi, f, uc };
}

/** Elips kümesinin birleşim sınırı: her elipsin başka bir elipsin içinde kalmayan yay parçaları ([[x,y],…] dizileri). */
function elipsBirlesimi(elipsler, adim) {
  adim = adim || 1.5;
  const icinde = (x, y, haric) => elipsler.some((e, j) => j !== haric && Math.pow((x - e.x) / e.rx, 2) + Math.pow((y - e.y) / e.ry, 2) < 0.985);
  const parcalar = [];
  elipsler.forEach((e, i) => {
    const n = Math.max(24, Math.ceil((2 * Math.PI * Math.max(e.rx, e.ry)) / adim));
    let cur = [];
    const run = [];
    for (let k = 0; k <= n; k++) {
      const a = (k / n) * Math.PI * 2;
      const x = e.x + Math.cos(a) * e.rx;
      const y = e.y + Math.sin(a) * e.ry;
      if (!icinde(x, y, i)) cur.push([x, y]);
      else if (cur.length) {
        run.push(cur);
        cur = [];
      }
    }
    if (cur.length) run.push(cur);
    // başta ve sonda kesilen parçayı birleştir
    if (run.length > 1 && run[0][0] && run[run.length - 1].length && Math.hypot(run[0][0][0] - run[run.length - 1][run[run.length - 1].length - 1][0], run[0][0][1] - run[run.length - 1][run[run.length - 1].length - 1][1]) < adim * 2) {
      const son = run.pop();
      run[0] = son.concat(run[0]);
    }
    for (const r of run) if (r.length > 2) parcalar.push(r);
  });
  return parcalar;
}

// ---- 2) bulutlar: yığma bulutlar; kâğıt boş bırakılır, gölge yanları iki lavanta kalıbıyla (silinerek
//         derecelenmiş) basılır, ışık alan sağ üst kenarlara soluk şeftali; kontur yok (gerçekçi ışık)
function bulut(cx, cy, w, h, tohum) {
  const r = S.rng(tohum);
  const taban = cy + h * 0.34;
  const daireler = [];
  const n = 6 + Math.floor(w / 36);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const zarf = Math.pow(Math.sin(Math.PI * (0.05 + 0.9 * t)), 1.1) * (0.7 + 0.5 * r());
    const rad = h * (0.2 + 0.36 * zarf);
    daireler.push([cx - w / 2 + w * (0.04 + 0.92 * t) + (r() - 0.5) * 10, taban - rad * (0.55 + 0.3 * r()), rad]);
  }
  for (let k = 0; k < Math.floor(n * 0.6); k++) {
    const t = 0.18 + 0.64 * r();
    const zarf = Math.sin(Math.PI * t);
    const rad = h * (0.16 + 0.26 * r()) * (0.6 + 0.5 * zarf);
    daireler.push([cx - w / 2 + w * t, taban - h * (0.32 + 0.48 * zarf * (0.6 + 0.5 * r())), rad]);
  }
  const x0 = Math.floor(cx - w / 2 - h * 0.6);
  const y0 = Math.floor(cy - h * 1.5);
  const bw = Math.ceil(w + h * 1.2);
  const bh = Math.ceil(taban - y0 + 4);
  const W = bw * OLCEK;
  const H = bh * OLCEK;
  // biçim maskesi ve yükseklik haritası (geniş bulanık)
  const mk = S.yeniTuval(W, H);
  const m = mk.getContext('2d', { willReadFrequently: true });
  m.setTransform(OLCEK, 0, 0, OLCEK, -x0 * OLCEK, -y0 * OLCEK);
  m.fillStyle = '#fff';
  m.filter = `blur(${1.2 * OLCEK}px)`;
  for (const [x, y, rad] of daireler) {
    m.beginPath();
    m.arc(x, y, rad, 0, Math.PI * 2);
    m.fill();
  }
  m.filter = 'none';
  m.globalCompositeOperation = 'destination-out';
  m.beginPath();
  m.moveTo(x0 - 5, taban);
  const nb = gurultu(tohum + 3);
  for (let x = x0 - 5; x <= x0 + bw + 5; x += 3) m.lineTo(x, taban - 6 * (nb.fbm(x * 0.03, 1.5, 2) - 0.5) - 3 * Math.exp(-Math.pow((x - cx) / (w * 0.32), 2)) + 4 * Math.pow(Math.abs(x - cx) / (w * 0.5), 3));
  m.lineTo(x0 + bw + 5, y0 + bh + 10);
  m.lineTo(x0 - 5, y0 + bh + 10);
  m.fill();
  const md = m.getImageData(0, 0, W, H).data;
  const yk = S.yeniTuval(W, H);
  const y2 = yk.getContext('2d', { willReadFrequently: true });
  y2.filter = `blur(${h * 0.22 * OLCEK}px)`;
  y2.drawImage(mk, 0, 0);
  const hd = y2.getImageData(0, 0, W, H).data;
  const Hm = (px, py) => hd[(Math.min(H - 1, Math.max(0, py)) * W + Math.min(W - 1, Math.max(0, px))) * 4 + 3] / 255;
  // gölge katları (iki lavanta kalıbı) ve ışık kalıbı
  const g1 = katmanlayici({ N: 2, yum: 0.09, dalga: 0.06, df: 0.03, dfa: 0.02, lif: 0, kenar: 0, tohum: tohum * 3 });
  const sk = S.yeniTuval(W, H);
  const s2 = sk.getContext('2d', { willReadFrequently: true });
  const im = s2.createImageData(W, H);
  const d = im.data;
  const L = [0.62, -0.6, 0.5];
  const Ln = Math.hypot(...L);
  const ad = 3 * OLCEK;
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const k = (py * W + px) * 4;
      const a = md[k + 3] / 255;
      if (a <= 0) continue;
      const gx = (Hm(px + ad, py) - Hm(px - ad, py)) * 7;
      const gy = (Hm(px, py + ad) - Hm(px, py - ad)) * 7;
      const nl = Math.hypot(gx, gy, 1);
      const dif = (-gx * L[0] - gy * L[1] + L[2]) / (nl * Ln);
      const y = y0 + py / OLCEK;
      const x = x0 + px / OLCEK;
      const alt = kenet((y - (taban - h * 0.45)) / (h * 0.45), 0, 1);
      const T = kenet(0.62 - dif * 0.75 + 0.55 * alt * alt, 0, 1);
      const v = g1(T, x, y, tohum);
      const isik = kenet((dif - 0.72) / 0.2, 0, 1) * (1 - alt);
      // lavanta gölge; ışık yanında şeftali
      const ga = 0.62 * v;
      const ia = 0.38 * isik;
      const top = ga + ia * (1 - ga);
      d[k] = (148 * ga + 252 * ia * (1 - ga)) / (top || 1);
      d[k + 1] = (148 * ga + 214 * ia * (1 - ga)) / (top || 1);
      d[k + 2] = (194 * ga + 172 * ia * (1 - ga)) / (top || 1);
      d[k + 3] = 255 * a * top;
    }
  }
  s2.putImageData(im, 0, 0);
  R.save();
  R.globalCompositeOperation = 'destination-out';
  R.drawImage(mk, x0, y0, bw, bh);
  R.restore();
  R.drawImage(sk, x0, y0, bw, bh);
}

{
  const nz = gurultu(1882);
  const budaklar = [[690, 60, 40], [60, 560, 34], [470, 940, 44]];
  const W2 = 1024 * OLCEK;
  const im = R.getImageData(0, 0, W2, W2);
  const d = im.data;
  for (let py = 0; py < W2; py++) {
    const y = py / OLCEK;
    for (let px = 0; px < W2; px++) {
      const k = (py * W2 + px) * 4;
      if (d[k + 3] < 8) continue;
      const x = px / OLCEK;
      let faz = y * 0.05 + 5.2 * nz.fbm(x * 0.0012, y * 0.0032, 3) + 1.3 * nz.fbm(x * 0.005 + 40, y * 0.014, 2);
      for (const [bx, by, br] of budaklar) {
        const dx = (x - bx) / (br * 2.2);
        const dy = (y - by) / br;
        const q = dx * dx + dy * dy;
        if (q < 9) faz -= 1.1 * Math.exp(-q) * Math.sign(y - by + 0.01);
      }
      const s = faz - Math.floor(faz);
      // geç odun: halkanın bir yanında ince koyu çizgi, ötesi yavaşça açılır
      const gen = 0.035 + 0.04 * nz.n(x * 0.004 + 9, y * 0.01);
      const cizgi = Math.exp(-Math.pow((s - 0.12) / gen, 2)) * (0.35 + 0.65 * nz.n(x * 0.008, y * 0.04));
      const lif = nz.n(x * 0.02 + 7, y * 0.9) - 0.5;
      const mc = 1 - 0.08 * cizgi - 0.03 * lif + 0.025 * (s - 0.5);
      d[k] = kenet(d[k] * mc, 0, 255);
      d[k + 1] = kenet(d[k + 1] * mc, 0, 255);
      d[k + 2] = kenet(d[k + 2] * (1 - 0.07 * cizgi - 0.02 * lif), 0, 255);
    }
  }
  R.putImageData(im, 0, 0);
}

      const dif = kenet(u * 0.62 + Math.sqrt(1 - u * u) * 0.6, 0, 1);
      let D = 0.46 + 0.04 * k;
      D += 0.42 * golge(kenet(1 - dif * 1.1, 0, 1), x, y, k * 40);
      D -= 0.2 * ust(kenet((dif - 0.72) / 0.28, 0, 1), x, y, k * 60 + 9);
      D += 0.16 * ust(kenet(1 - (y - q.y1) / 18, 0, 1), y, x, k * 80 + 3);
      D += 0.05 * (benek.fbm(x * 0.35, y * 0.35, 2) - 0.5) - 0.07 * yumusak(0.68, 0.8, benek.n(x * 0.9 + 50, y * 0.9));
      const col = renk(kenet(D, 0, 1));
      o[0] = col[0];
      o[1] = col[1];
      o[2] = col[2];
    });
    ort(new Path2D(d));
    for (const p of S.kasnakPencereleri(k)) {
      const dp = S.kemerYolu(p.x, p.y, p.w, p.h);
      pencere(dp, [[0, 'rgba(26,48,52,0.95)'], [1, 'rgba(44,74,70,0.9)']]);
      oy(dp, { w: 0.75 });
    }
    oy(d);
  }
}

// ---- 7) kubbe: üç renk kalıbı üst üste: düz yeşil, solda silinerek derecelenmiş koyu yeşil (iki baskı),
//         sağda sarı-yeşil ışık kalıbı; her dilimin sol kaburgası boyunca dar bir gölge bokashisi
{
  const golge = katmanlayici({ N: 3, yum: 0.13, dalga: 0.09, df: 0.012, dfa: 0.01, lif: 0.06, lfa: 0.06, lfb: 0.01, kenar: 0, tohum: 1884 });
  const dar = katmanlayici({ N: 2, yum: 0.14, dalga: 0.1, df: 0.03, dfa: 0.01, lif: 0, kenar: 0, tohum: 1885 });
  const isikK = katmanlayici({ N: 2, yum: 0.14, dalga: 0.1, df: 0.015, dfa: 0.01, lif: 0, kenar: 0, tohum: 1886 });
  const renk = rampa([[0, hex('#D6EBA6')], [0.25, hex('#99CB7E')], [0.5, hex('#5A9E66')], [0.75, hex('#327258')], [1, hex('#22544A')]]);
  const benek = gurultu(1889);
  pikselBoya(R, kalip(Y.kubbe, 0.4), 356, 296, 764, 558, (x, y, o) => {
    const h = kubbeHucre(x, y);
    const a = h.th * 200;
    const phi = h.lat * 1.25;
    const dif = kenet(Math.sin(h.th) * Math.cos(phi) * 0.62 + Math.sin(phi) * 0.5 + Math.cos(h.th) * Math.cos(phi) * 0.6, 0, 1);
    let D = 0.36;
    D += 0.5 * golge(kenet(1 - dif * 1.15, 0, 1), a, y, 0);
    D += 0.12 * dar(kenet(1 - h.f / 0.4, 0, 1), a, y, h.gi * 23.1);
    D -= 0.3 * isikK(kenet((dif - 0.7) / 0.3, 0, 1), a, y, 77);
    D += 0.05 * (benek.fbm(x * 0.35, y * 0.35, 2) - 0.5) - 0.07 * yumusak(0.68, 0.8, benek.n(x * 0.9 + 50, y * 0.9));
    const col = renk(kenet(D, 0, 1));
    o[0] = col[0];
    o[1] = col[1];
    o[2] = col[2];
  });
  ort(new Path2D(Y.kubbe));
  for (const kb of S.kaburgalar(16, 60)) oyN(kb.noktalar.slice(0, -1), { w: 0.75, sonSivri: 40 });
  oy(Y.kubbe, { w: 1.25 });
}
altin(Y.alem);

// ---- 8) ufuk sisi: renk kalıpları alt kenarda silinir
{
  R.save();
  const g = R.createLinearGradient(0, 730, 0, 836);
  g.addColorStop(0, 'rgba(250,244,234,0)');
  g.addColorStop(0.6, 'rgba(250,244,234,0.7)');
  g.addColorStop(1, 'rgba(250,244,234,0)');
  R.fillStyle = g;
  R.fillRect(0, 730, 1024, 106);
  R.restore();
}

// ---- 9) bitkiler: yaban gülleri, ışıkta sarı-yeşil yapraklar
const B = S.bitki;
for (const s of B.saplar) {
  const pts = yenidenOrnekle(s, 1.5);
  serit(R, pts, { w: 4.4, renk: 'rgba(96,130,80,0.95)', titreme: 0.3, frek: 0.01, sonSivri: 90 });
  serit(R, ofsetle(pts, 1.2), { w: 1.4, renk: 'rgba(170,200,120,0.6)', titreme: 0.3, frek: 0.01, sonSivri: 90 });
  const o = ofsetle(pts, 0);
  H.save();
  H.globalCompositeOperation = 'destination-out';
  serit(H, o, { w: 5, renk: '#000', titreme: 0.3, frek: 0.01 });
  H.restore();
  oyN(ofsetle(pts, 2.3), { w: 0.8, sonSivri: 90 });
  oyN(ofsetle(pts, -2.3), { w: 0.8, sonSivri: 90 });
}
function yaprak(y) {
  const d = S.yaprakYolu(y);
  const yol = kalip(d, 0.4);
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const P = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  R.fillStyle = '#5E9A5C';
  R.fill(yol);
  // ışığa bakan yarı sarı-yeşil, öbürü mavi-yeşil
  const [ax, ay] = P(L * 0.5, -W * 0.5);
  const [bx, by] = P(L * 0.5, W * 0.5);
  const isikSol = -Math.sin(y.aci) * 0.7 + Math.cos(y.aci) * 0.7 > 0;
  lavi(R, yol, ax, ay, bx, by, isikSol ? [[0, 'rgba(170,206,112,0.85)'], [0.5, 'rgba(120,170,90,0.3)'], [0.52, 'rgba(36,86,78,0.35)'], [1, 'rgba(36,86,78,0.6)']] : [[0, 'rgba(36,86,78,0.6)'], [0.48, 'rgba(36,86,78,0.35)'], [0.5, 'rgba(120,170,90,0.3)'], [1, 'rgba(170,206,112,0.85)']]);
  const [tx, ty] = P(L, 0);
  lavi(R, yol, y.x, y.y, tx, ty, [[0, 'rgba(30,70,60,0.35)'], [1, 'rgba(30,70,60,0)']]);
  ort(new Path2D(d));
  oy(d, { w: 0.95, adim: 2.2 });
  oyN([P(L * 0.04, 0), P(L * 0.86, 0)], { w: 0.6, sonSivri: L * 0.3 });
}
for (const y of B.yapraklar) yaprak(y);
for (const t of B.tomurcuklar) {
  const d = S.tomurcukYolu(t);
  const yol = kalip(d, 0.3);
  sil(yol);
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  lavi(R, yol, t.x + ca * t.r * 1.6, t.y + sa * t.r * 1.6, t.x - ca * t.r, t.y - sa * t.r, [[0, 'rgba(232,150,166,0.9)'], [0.6, 'rgba(240,196,200,0.5)'], [1, 'rgba(120,160,100,0.8)']]);
  ort(new Path2D(d));
  oy(d, { w: 0.8 });
}
function tacYolu(cx, cy, r, a) {
  const ca = Math.cos(a);
  const sa = Math.sin(a);
  const P = (u, v) => `${(cx + (u * ca - v * sa) * r).toFixed(2)},${(cy + (u * sa + v * ca) * r).toFixed(2)}`;
  return (
    `M${P(0.12, -0.1)} C${P(0.28, -0.44)} ${P(0.56, -0.6)} ${P(0.82, -0.44)} ` +
    `C${P(1.0, -0.3)} ${P(1.04, -0.1)} ${P(0.97, -0.03)} C${P(0.95, 0)} ${P(0.95, 0)} ${P(0.97, 0.03)} ` +
    `C${P(1.04, 0.1)} ${P(1.0, 0.3)} ${P(0.82, 0.44)} C${P(0.56, 0.6)} ${P(0.28, 0.44)} ${P(0.12, 0.1)} Z`
  );
}
function gul(f) {
  const Rr = f.r * 1.08;
  for (let i = 0; i < 5; i++) {
    const a = f.aci + (i * Math.PI * 2) / 5;
    const d = tacYolu(f.x, f.y, Rr * (0.96 + rr() * 0.07), a);
    const yol = kalip(d, 0.35);
    // kâğıt beyazı; gölge yanı lavanta, dip sıcak
    R.save();
    R.clip(yol);
    R.globalCompositeOperation = 'destination-out';
    R.fillStyle = '#000';
    R.fill(yol);
    R.globalCompositeOperation = 'source-over';
    const golge = 0.5 - 0.5 * Math.cos(a + 0.75);
    const ex = f.x + Math.cos(a) * Rr;
    const ey = f.y + Math.sin(a) * Rr;
    let g = R.createRadialGradient(ex, ey, 0, ex, ey, Rr * 0.9);
    g.addColorStop(0, GOLGE(0.05 + 0.5 * golge));
    g.addColorStop(1, GOLGE(0.02 + 0.12 * golge));
    R.fillStyle = g;
    R.fill(yol);
    g = R.createRadialGradient(f.x, f.y, 0, f.x, f.y, Rr * 0.55);
    g.addColorStop(0, 'rgba(240,200,150,0.55)');
    g.addColorStop(1, 'rgba(240,200,150,0)');
    R.fillStyle = g;
    R.fill(yol);
    R.restore();
    ort(new Path2D(d));
    oy(d, { w: 0.75 + f.r * 0.006 });
  }
  const yol = new Path2D(S.daireYolu(f.x, f.y, Rr * 0.2));
  const g = R.createRadialGradient(f.x + Rr * 0.05, f.y - Rr * 0.05, 0, f.x, f.y, Rr * 0.2);
  g.addColorStop(0, '#F6DA6A');
  g.addColorStop(1, '#D99A30');
  R.fillStyle = g;
  R.fill(yol);
  ort(yol);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    H.fillStyle = 'rgba(120,70,30,0.85)';
    H.beginPath();
    H.arc(f.x + Math.cos(a) * Rr * 0.23, f.y + Math.sin(a) * Rr * 0.23, 0.8 + f.r * 0.02, 0, Math.PI * 2);
    H.fill();
  }
  oy(S.daireYolu(f.x, f.y, Rr * 0.12), { w: 0.6 });
}
for (const f of B.cicekler) gul(f);

// ---- 10) baskı: kâğıt + renk kalıpları (baren izi, boya benekleri) + kaymış ana kalıp
c.fillStyle = '#F8F4EA';
c.fillRect(0, 0, 1024, 1024);
c.drawImage(renk.c, 0, 0, 1024, 1024);
{
  const nz = gurultu(1881);
  const yon = gurultu(1887);
  pikselGecis(c, (d, i, x, y) => {
    if (d[i] > 246 && d[i + 1] > 241 && d[i + 2] > 230) return;
    const X = x / OLCEK;
    const Yy = y / OLCEK;
    // baren: elle dairesel sürtülen bambu kılıfın kısa, yönü yer yer değişen izleri
    const th = yon.fbm(X * 0.006, Yy * 0.006, 2) * Math.PI * 4;
    const ca = Math.cos(th);
    const sa = Math.sin(th);
    const u = X * ca + Yy * sa;
    const v = -X * sa + Yy * ca;
    const baren = nz.n(u * 0.05, v * 0.55) - 0.5;
    // boya benekleri (susam baskısı izlenimi) ve kâğıdın emişi
    const benek = nz.fbm(X * 0.09 + 31, Yy * 0.09, 2) - 0.5;
    const m = 1 + 0.06 * baren + 0.07 * benek + 0.05 * (karma(x >> 1, y >> 1, 5) - 0.5);
    d[i] = kenet(KAGIT[0] - (KAGIT[0] - d[i]) * m, 0, 255);
    d[i + 1] = kenet(KAGIT[1] - (KAGIT[1] - d[i + 1]) * m, 0, 255);
    d[i + 2] = kenet(KAGIT[2] - (KAGIT[2] - d[i + 2]) * m, 0, 255);
  });
}
c.save();
c.translate(0.9, -0.7);
c.globalAlpha = 0.94;
c.drawImage(hat.c, 0, 0, 1024, 1024);
c.restore();

// ---- 11) ekran: washi lifleri
const ekran = ekranaAktar(calisma);
{
  pikselGecis(ekran, (d, i, x, y) => {
    const m = 1 + 0.03 * (karma(x, y, 21) - 0.5);
    d[i] = kenet(d[i] * m, 0, 255);
    d[i + 1] = kenet(d[i + 1] * m, 0, 255);
    d[i + 2] = kenet(d[i + 2] * m, 0, 255);
  });
}
