<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-190 Mavi-Yeşil Manzara — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ---------------------------------------------------------------- el yardımcıları (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, yol örnekleme, elle çekilmiş (titrek, basınçlı) çizgi,
// katmanlar ve piksel geçişleri. Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const OLCEK = 2; // çalışma tuvali 2048 piksel; koordinatlar 1024

function yeniKatman() {
  const c = S.yeniTuval(1024 * OLCEK, 1024 * OLCEK);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(OLCEK, 0, 0, OLCEK, 0, 0);
  return { c, x };
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// SVG yolunu örnekleme (getPointAtLength)
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

/** Kırık çizgiyi normali boyunca d kadar kaydırır. */
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit (kontur) olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1 kalınlık oynaması),
 *  sivri / basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta hafif basınç düğümü, px)
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}

/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini (ör. kaburga) elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}

/** Bir tuvalin bütün pikselleri üzerinde geçiş: fn(veri, i, x, y) — x,y piksel koordinatı (tuvalin kendi ölçeğinde). */
function pikselGecis(ctx, fn) {
  const c = ctx.canvas;
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  const W = c.width;
  const H = c.height;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) fn(d, (y * W + x) * 4, x, y);
  }
  ctx.putImageData(im, 0, 0);
}

/** Önceden hesaplanmış gürültü dokusu (hızlı örnekleme): dk(x,y) piksel → [0,1]. */
function gurultuDokusu(boyut, olcek, oktav, tohum) {
  const nz = gurultu(tohum);
  const a = new Float32Array(boyut * boyut);
  for (let y = 0; y < boyut; y++) for (let x = 0; x < boyut; x++) a[y * boyut + x] = nz.fbm(x * olcek, y * olcek, oktav);
  return (x, y) => a[((y | 0) % boyut) * boyut + ((x | 0) % boyut)];
}

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

/** Kubbe profilinden y → yarıçap (hızlı tablo). */
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.getContext('2d', { willReadFrequently: true });
  const ctx = S.tuval(cv, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma.c, 0, 0, 1024, 1024);
  return ctx;
}

/**
 * Altın (ya da gümüş) varak dokusu: kare varak yaprakları sıra sıra, her yaprağın tonu biraz farklı,
 * bindirme yerlerinde ince koyu/açık dikiş, perdah izi ve ışık parlaması. Tam boy katman döner.
 *  o: boy (varak kenarı, 1024 biriminde), tohum, koyu/orta/acik/parlak (hex), cesit (ton farkı), isik(x,y) → ek parlaklık
 */
function varakDokusu(o) {
  const L = yeniKatman();
  const W2 = 1024 * OLCEK;
  const im = L.x.createImageData(W2, W2);
  const d = im.data;
  const tohum = o.tohum || 1;
  const r = S.rng(tohum);
  const boy = o.boy * OLCEK;
  const satirOfs = [];
  const kay = o.kaydirma != null ? o.kaydirma : 1;
  for (let j = 0; j < 400; j++) satirOfs.push(r() * boy * kay);
  const nz = gurultu(tohum + 5);
  const K = hex(o.koyu || '#A9832F');
  const M = hex(o.orta || '#D4AF55');
  const A = hex(o.acik || '#EED48A');
  const P = hex(o.parlak || '#FBF0C4');
  const cesit = o.cesit != null ? o.cesit : 0.18;
  const dikis = 1.3 * OLCEK;
  const ramp = (v) => (v < 0.45 ? karistir(K, M, v / 0.45) : v < 0.78 ? karistir(M, A, (v - 0.45) / 0.33) : karistir(A, P, Math.min(1, (v - 0.78) / 0.22)));
  const x0 = o.x0 != null ? o.x0 * OLCEK : 0;
  const x1 = o.x1 != null ? o.x1 * OLCEK : W2;
  const y0 = o.y0 != null ? o.y0 * OLCEK : 0;
  const y1 = o.y1 != null ? o.y1 * OLCEK : W2;
  for (let y = y0; y < y1; y++) {
    const j = Math.floor(y / boy);
    const fy = y - j * boy;
    const ox = satirOfs[j % 400];
    for (let x = x0; x < x1; x++) {
      const xi = x + ox;
      const i = Math.floor(xi / boy);
      const fx = xi - i * boy;
      let v = 0.55 + (karma(i + 500, j + 500, tohum) - 0.5) * cesit * 2;
      if (o.isik) v += o.isik(x / OLCEK, y / OLCEK);
      v += 0.09 * (nz.n(x * 0.0035, y * 0.0035) - 0.5) + 0.06 * (nz.n(x * 0.0018 + 30, y * 0.028) - 0.5) + 0.03 * (nz.n(x * 0.02, y * 0.2) - 0.5);
      v += 0.05 * (fx / boy - 0.5) - 0.03 * (fy / boy - 0.5);
      const dk = o.dikis != null ? o.dikis : 1;
      if (fx < dikis || fy < dikis) v -= 0.13 * dk;
      else if (fx < dikis * 1.9 || fy < dikis * 1.9) v += 0.07 * dk;
      v += 0.02 * (karma(x, y, tohum + 9) - 0.5);
      const col = ramp(kenet(v, 0, 1));
      const k = (y * W2 + x) * 4;
      d[k] = col[0];
      d[k + 1] = col[1];
      d[k + 2] = col[2];
      d[k + 3] = 255;
    }
  }
  L.x.putImageData(im, 0, 0);
  return L;
}

/**
 * Bir yolun içini piksel başına boyar (ressamın kat kat sürdüğü lavileri hesaplamak için).
 * fn(x, y, o): x,y 1024 biriminde; o = [r, g, b, a] (0..255) dizisine yazar. a başlangıçta 255'tir.
 */
function pikselBoya(ctx, yol, x0, y0, x1, y1, fn) {
  x0 = Math.floor(x0);
  y0 = Math.floor(y0);
  x1 = Math.ceil(x1);
  y1 = Math.ceil(y1);
  const W = (x1 - x0) * OLCEK;
  const H = (y1 - y0) * OLCEK;
  if (W <= 0 || H <= 0) return;
  const cv = S.yeniTuval(W, H);
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const im = cx.createImageData(W, H);
  const d = im.data;
  const o = [0, 0, 0, 255];
  for (let py = 0; py < H; py++) {
    const y = y0 + (py + 0.5) / OLCEK;
    for (let px = 0; px < W; px++) {
      const x = x0 + (px + 0.5) / OLCEK;
      o[3] = 255;
      fn(x, y, o);
      const i = (py * W + px) * 4;
      d[i] = o[0];
      d[i + 1] = o[1];
      d[i + 2] = o[2];
      d[i + 3] = o[3];
    }
  }
  cx.putImageData(im, 0, 0);
  ctx.save();
  if (yol) ctx.clip(yol);
  ctx.drawImage(cv, x0, y0, x1 - x0, y1 - y0);
  ctx.restore();
}

/**
 * Elle sürülmüş kat kat lavi: düzgün bir hedef koyuluğu (T ∈ 0..1) N ayrı fırça katına böler. Her katın sınırı
 * fırça boyunca hafifçe oynar ve su fırçasıyla yumuşatılmıştır; katın içinde fırça kıllarının bıraktığı boyuna
 * izler, sınırında ince bir ıslak kenar kalır. Dönen fonksiyon: (T, a, b, ek) → 0..1
 *  a: fırça yönüne dik koordinat (px), b: fırça boyunca koordinat (px), ek: bölgeye özgü kaydırma.
 */
function katmanlayici(o) {
  const nz = gurultu(o.tohum || 77);
  const N = o.N || 6;
  const yum = o.yum != null ? o.yum : 0.05;
  const dalga = o.dalga != null ? o.dalga : 0.05;
  const df = o.df != null ? o.df : 0.02;
  const dfa = o.dfa != null ? o.dfa : 0.004;
  const lif = o.lif != null ? o.lif : 0.15;
  const lfa = o.lfa != null ? o.lfa : 0.5;
  const lfb = o.lfb != null ? o.lfb : 0.012;
  const kenar = o.kenar || 0;
  return function (T, a, b, ek) {
    ek = ek || 0;
    let s = 0;
    for (let j = 1; j <= N; j++) {
      const e = j / (N + 1);
      const w = dalga * ((nz.n(b * df + j * 31.7 + ek, a * dfa + j * 7.3) - 0.5) * 2 + 0.35 * (nz.n(b * df * 3.3 + j * 5.1 + ek, 9.7 + j) - 0.5));
      const q = T + w - e;
      if (q < -yum) continue;
      let k = yumusak(-yum, yum, q);
      if (lif) k *= 1 + lif * (nz.n(a * lfa + j * 13.1 + ek * 0.7, b * lfb + j * 3.7) - 0.5) * 2;
      if (kenar) k += kenar * Math.max(0, 1 - Math.abs(q - yum * 0.5) / (yum * 0.9));
      s += k;
    }
    return s / N;
  };
}

/** Çok duraklı renk rampası: [[t, [r,g,b]], …] → v ∈ 0..1 için renk. */
function rampa(duraklar) {
  return function (v) {
    if (v <= duraklar[0][0]) return duraklar[0][1];
    for (let i = 1; i < duraklar.length; i++) {
      if (v <= duraklar[i][0]) {
        const [t0, c0] = duraklar[i - 1];
        const [t1, c1] = duraklar[i];
        return karistir(c0, c1, (v - t0) / (t1 - t0 || 1));
      }
    }
    return duraklar[duraklar.length - 1][1];
  };
}

/** Kubbe hücresi: (x, y) için u, boylam açısı, dilim no (0..15), dilim içi konum f (0 sol kaburga → 1 sağ), enlem. */
function kubbeHucre(x, y) {
  const R = kubbeR(y);
  const lat = kenet((555 - y) / 255, 0, 1);
  const u = R > 0.5 ? kenet((x - 560) / R, -1, 1) : 0;
  const th = Math.asin(u);
  const k = (th + Math.PI / 2) / (Math.PI / 16);
  const gi = Math.max(0, Math.min(15, Math.floor(k)));
  const f = k - gi;
  const uc = Math.sin(-Math.PI / 2 + ((gi + 0.5) * Math.PI) / 16);
  return { R, lat, u, th, gi, f, uc };
}

/** Elips kümesinin birleşim sınırı: her elipsin başka bir elipsin içinde kalmayan yay parçaları ([[x,y],…] dizileri). */
function elipsBirlesimi(elipsler, adim) {
  adim = adim || 1.5;
  const icinde = (x, y, haric) => elipsler.some((e, j) => j !== haric && Math.pow((x - e.x) / e.rx, 2) + Math.pow((y - e.y) / e.ry, 2) < 0.985);
  const parcalar = [];
  elipsler.forEach((e, i) => {
    const n = Math.max(24, Math.ceil((2 * Math.PI * Math.max(e.rx, e.ry)) / adim));
    let cur = [];
    const run = [];
    for (let k = 0; k <= n; k++) {
      const a = (k / n) * Math.PI * 2;
      const x = e.x + Math.cos(a) * e.rx;
      const y = e.y + Math.sin(a) * e.ry;
      if (!icinde(x, y, i)) cur.push([x, y]);
      else if (cur.length) {
        run.push(cur);
        cur = [];
      }
    }
    if (cur.length) run.push(cur);
    // başta ve sonda kesilen parçayı birleştir
    if (run.length > 1 && run[0][0] && run[run.length - 1].length && Math.hypot(run[0][0][0] - run[run.length - 1][run[run.length - 1].length - 1][0], run[0][0][1] - run[run.length - 1][run[run.length - 1].length - 1][1]) < adim * 2) {
      const son = run.pop();
      run[0] = son.concat(run[0]);
    }
    for (const r of run) if (r.length > 2) parcalar.push(r);
  });
  return parcalar;
}

const katAz = katmanlayici({ N: 4, yum: 0.09, dalga: 0.12, df: 0.028, dfa: 0.01, lif: 0.2, lfa: 0.3, lfb: 0.02, kenar: 0.1, tohum: 1902 });
const katIsik = katmanlayici({ N: 2, yum: 0.12, dalga: 0.1, df: 0.02, dfa: 0.01, lif: 0.1, lfa: 0.2, lfb: 0.02, kenar: 0, tohum: 1903 });
/** Asimetrik, omuzlu doruk profili: u ∈ [0,1] → v ∈ [0,1]. Basamak genişlik/yükseklikleri rastgele: düz omuz + sarp yamaç. */
function dorukProfili(r, nz, tepeU) {
  const yan = (adet) => {
    const du = [];
    const dv = [];
    for (let i = 0; i < adet; i++) {
      const sarp = r() < 0.55;
      du.push(sarp ? 0.4 + r() * 0.5 : 0.9 + r() * 0.9);
      dv.push(sarp ? 0.8 + r() * 0.8 : 0.15 + r() * 0.25);
    }
    const su = du.reduce((a, b) => a + b, 0);
    const sv = dv.reduce((a, b) => a + b, 0);
    const pts = [[0, 0]];
    let u = 0;
    let v = 0;
    for (let i = 0; i < adet; i++) {
      u += du[i] / su;
      v += dv[i] / sv;
      pts.push([u, v]);
    }
    return pts;
  };
  const sol = yan(3 + Math.floor(r() * 2)).map(([u, v]) => [u * tepeU, v]);
  const sag = yan(3 + Math.floor(r() * 2)).map(([u, v]) => [1 - u * (1 - tepeU), v]);
  const N = 120;
  const ara = (pts, u) => {
    for (let i = 1; i < pts.length; i++) {
      const [u0, v0] = pts[i - 1];
      const [u1, v1] = pts[i];
      if ((u - u0) * (u - u1) <= 0) return v0 + (v1 - v0) * ((u - u0) / (u1 - u0 || 1));
    }
    return 0;
  };
  let v = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    v.push(u <= tepeU ? ara(sol, u) : ara(sag.slice().reverse(), u));
  }
  for (let pas = 0; pas < 5; pas++) v = v.map((q, i) => (i === 0 || i === N ? q : (v[i - 1] + 2 * q + v[i + 1]) / 4));
  // dolgun omuzlar: profil dışa doğru şişirilir (mermi değil, kütleli kaya)
  v = v.map((q) => 1 - Math.pow(1 - q, 1.45));
  // omuzlarda küçük ikincil tepecikler (kırık, kademeli doruk başı)
  const tepecik = [];
  for (let j = 0; j < 4; j++) tepecik.push([0.12 + r() * 0.76, 0.025 + r() * 0.03, 0.035 + r() * 0.045]);
  v = v.map((q, i) => {
    const u = i / N;
    let ek = 0;
    for (const [cu, cw, chh] of tepecik) ek = Math.max(ek, chh * Math.max(0, 1 - Math.pow((u - cu) / cw, 2)));
    return q + ek * yumusak(0.3, 0.6, q);
  });
  // kaya kırıkları ve yuvarlak doruk başı
  v = v.map((q, i) => {
    const u = i / N;
    let w = q + 0.016 * (nz.n(u * 30, 3) - 0.5) + 0.008 * (nz.n(u * 80, 9) - 0.5);
    if (w > 0.94) w = 0.94 + (w - 0.94) * 0.5;
    return kenet(w, 0, 1);
  });
  return (u) => {
    const f = kenet(u, 0, 1) * N;
    const i = Math.min(N - 1, Math.floor(f));
    return v[i] + (v[i + 1] - v[i]) * (f - i);
  };
}
function kaya(x, yb, w, h, tohum, uzak, ic) {

      c.fill();
    }
  }
  return { x, yb, w, h, prof, tepeU };
}

function bulutSerit(x1, x2, y, h, tohum) {
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  // üst kenar: geniş, akıcı dalgalar; arada iri kıvrımlı başlar
  const ust = [];
  const N = Math.round((x2 - x1) / 4);
  const basx = [];
  for (let k = 0; k < Math.round((x2 - x1) / 110); k++) basx.push(x1 + 40 + r() * (x2 - x1 - 80));
  for (let i = 0; i <= N; i++) {
    const xx = x1 + ((x2 - x1) * i) / N;
    let yy = y - h * 0.15 - h * 0.25 * Math.sin(xx * 0.022 + tohum) - h * 0.12 * (nz.n(xx * 0.02, 1) - 0.5);
    for (const bx of basx) yy -= h * 0.42 * Math.exp(-Math.pow((xx - bx) / (h * 0.75), 2));
    ust.push([xx, yy]);
  }
  const alt = [];
  for (let i = N; i >= 0; i--) {
    const xx = x1 + ((x2 - x1) * i) / N;
    alt.push([xx, y + h * 0.35 + h * 0.1 * Math.sin(xx * 0.03 + tohum * 2)]);
  }
  const d = S.yol(ust.concat(alt), true);
  const yol = new Path2D(d);
  c.fillStyle = 'rgba(253,251,246,0.97)';
  c.fill(yol);
  lavi(yol, 0, y + h * 0.45, 0, y - h * 0.7, [[0, 'rgba(136,172,212,0.42)'], [0.45, 'rgba(160,190,220,0.1)'], [1, 'rgba(160,190,220,0)']]);
  altinNokta(ust, { w: 0.95 });
  altinNokta(alt, { w: 0.8 });
  // içte, üst kenara koşut akan iki ince çizgi; başların altında içe kıvrılan uçlar
  for (const [k, aral] of [[0.32, [0.08, 0.62]], [0.62, [0.3, 0.92]]]) {
    const i0 = Math.round(N * aral[0]);
    const i1 = Math.round(N * aral[1]);
    const pts = ust.slice(i0, i1).map(([xx, yy]) => [xx, yy + (y + h * 0.35 - yy) * k]);
    altinNokta(pts, { w: 0.6, sivri: 20 });
  }
  for (const bx of basx) {
    const cx = bx;
    const cy = y - h * 0.3;
    const rad = h * 0.34;
    const pts = [];
    for (let a = Math.PI * 1.05; a <= Math.PI * 2.6; a += 0.1) {
      const q = rad * (1 - (a - Math.PI) / (Math.PI * 2.4));
      pts.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q * 0.8]);
    }
    altinNokta(pts, { w: 0.65, sivri: 6 });
  }
}

    const pts = p.tip === 'poligon' ? p.noktalar : [[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]];
    const d = S.yol(pts, true);
    const yol = new Path2D(d);
    const xs = pts.map((q) => q[0]);
    const ys = pts.map((q) => q[1]);
    tas(yol, Math.min(...xs), Math.max(...xs));
    if (p.ad.startsWith('çıkma')) lavi(yol, 0, Math.min(...ys), 0, Math.max(...ys), [[0, TG(0.4)], [1, TG(0.12)]]);
    if (p.tip === 'korkuluk') {
      const adet = 10;
      const adim = (p.x2 - p.x1) / adet;
      for (let i = 0; i < adet; i++) {
        c.fillStyle = 'rgba(70,150,124,0.75)';
        c.fillRect(p.x1 + i * adim + 1.6, p.y1 + 4, adim - 3.2, p.y2 - p.y1 - 7.5);
      }
    }
    if (p.ad.startsWith('şerefe')) altinNokta([[Math.min(...xs) + 1, ys[2] - 2], [Math.max(...xs) - 1, ys[2] - 2]], { w: 0.8 });
    cizgiYol(c, d, MIM);
  } else if (p.tip === 'bant') {
    for (const z of S.zikzakCizgileri()) {
      cizgiNokta(c, z, { w: 2.6, renk: 'rgba(60,104,170,0.85)', titreme: 0.12 });
      altinNokta(z.map((q) => [q[0], q[1] - 0.2]), { w: 0.6 });
    }
  } else if (p.tip === 'topuz') {
    const yol = new Path2D(p.yol);
    tas(yol, 266, 334);
    altinNokta([[278, 192], [322, 192]], { w: 0.7 });
    cizgiYol(c, p.yol, MIM);
  }
}
for (const p of S.minarePencereleri) {
  const d = S.kemerYolu(p.x, p.y, p.w, p.h);
  pencere(d);
  cizgiYol(c, d, Object.assign({}, MIM, { w: 0.75 }));
}
function alem(yollar) {
  for (const d of yollar) {
    const yol = new Path2D(d);
    const b = ornekle(d, 2)[0].pts;
    const xs = b.map((q) => q[0]);
    lavi(yol, Math.min(...xs), 0, Math.max(...xs), 0, [[0, '#A47A2C'], [0.5, '#D4AE56'], [0.8, '#F2DA92'], [1, '#C59B44']]);
    cizgiYol(c, d, { w: 0.7, renk: '#5A3E1C', titreme: 0.12 });
  }
}
alem(Y.minareAlem);
{
  const K = S.kaide;
  const yol = new Path2D(Y.kaide);
  tas(yol, K.x1, K.x2);
  lavi(yol, 0, K.y1, 0, K.y1 + 26, [[0, TG(0.34)], [1, TG(0)]]);
  cizgiYol(c, Y.kaide, MIM);
  const yk = new Path2D(Y.kornis);
  c.fillStyle = 'rgba(253,250,242,0.97)';
  c.fill(yk);
  lavi(yk, 0, K.kornis.y1, 0, K.kornis.y2, [[0, TG(0)], [1, TG(0.3)]]);
  cizgiYol(c, Y.kornis, MIM);
  altinNokta([[K.kornis.x1 + 2, K.kornis.y2 - 3], [K.kornis.x2 - 2, K.kornis.y2 - 3]], { w: 0.8 });
  for (const p of K.pencereler) {
    const d = S.kemerYolu(p.x, p.y, p.w, p.h);
    pencere(d);
    cizgiYol(c, d, Object.assign({}, MIM, { w: 0.85 }));
  }
}
for (let k = 1; k >= 0; k--) {
  const q = S.kasnak[k];
  const d = k ? Y.kasnakAlt : Y.kasnakUst;
  const yol = new Path2D(d);
  lavi(yol, q.x1, 0, q.x2, 0, [[0, '#2C7458'], [0.2, '#358463'], [0.55, '#4C9C78'], [0.78, '#6DB894'], [0.9, '#5CAA86'], [1, '#3E8C6C']]);
  lavi(yol, 0, q.y1, 0, q.y2, [[0, 'rgba(20,56,50,0.35)'], [0.25, 'rgba(20,56,50,0.04)'], [1, 'rgba(20,56,50,0.12)']]);
  for (const p of S.kasnakPencereleri(k)) {
    const dp = S.kemerYolu(p.x, p.y, p.w, p.h);
    pencere(dp);
    cizgiYol(c, dp, Object.assign({}, MIM, { w: 0.6, renk: '#1E3A33' }));
  }
  cizgiYol(c, d, MIM);
  altinNokta([[q.x1 + 2, q.y2 - 3.5], [q.x2 - 2, q.y2 - 3.5]], { w: 0.75 });
}
{
  const L = yeniKatman();
  const x0 = 356 * OLCEK;
  const x1 = 764 * OLCEK;
  const y0 = 296 * OLCEK;
  const y1 = 558 * OLCEK;
  const w = x1 - x0;
  const im = L.x.getImageData(x0, y0, w, y1 - y0);
  const dd = im.data;
  const ACIK = hex('#9ED2B8');
  const ORTA = hex('#469C7A');
  const KOYU = hex('#23664F');
  for (let py = 0; py < y1 - y0; py++) {
    const y = (py + y0) / OLCEK;
    const Rr = kubbeR(y);
    const lat = kenet((555 - y) / 255, 0, 1);
    for (let px = 0; px < w; px++) {
      const x = (px + x0) / OLCEK;
      const u = Rr > 0.5 ? kenet((x - 560) / Rr, -1, 1) : 0;
      const th = Math.asin(u);
      const k = (th + Math.PI / 2) / (Math.PI / 16);
      const f = k - Math.floor(k);
      let v = 0.42 + 0.34 * u + 0.2 * lat;
      v -= 0.16 * Math.exp(-f / 0.24);
      v += 0.06 * yumusak(0.8, 1, f);
      v -= 0.2 * yumusak(0.6, 1, -u);
      v -= 0.12 * (1 - yumusak(0, 0.14, lat));
      v += 0.04 * (NZ.n(th * 30, y * 0.02) - 0.5);
      v = kenet(v, 0, 1);
      const col = v < 0.5 ? karistir(KOYU, ORTA, v / 0.5) : karistir(ORTA, ACIK, (v - 0.5) / 0.5);
      // dorukta hafif azurit
      const az = 0.18 * yumusak(0.55, 1, lat);
      const i = (py * w + px) * 4;
      dd[i] = col[0] * (1 - az) + 60 * az;
      dd[i + 1] = col[1] * (1 - az) + 110 * az;
      dd[i + 2] = col[2] * (1 - az) + 180 * az;
      dd[i + 3] = 255;
    }
  }
  L.x.putImageData(im, x0, y0);
  c.save();
  c.clip(new Path2D(Y.kubbe));
  c.drawImage(L.c, 0, 0, 1024, 1024);
  c.restore();
  for (const kb of S.kaburgalar(16, 80)) altinNokta(kb.noktalar.slice(0, -1), { w: 0.85, sonSivri: 36, titreme: 0.15, frek: 0.01 });
  cizgiYol(c, Y.kubbe, Object.assign({}, MIM, { w: 1.1 }));
  altinCizgi(Y.kubbe, { w: 0.6, titreme: 0.1 });
}
alem(Y.alem);

// ---- 6) bitkiler: malakit yapraklar (altın damarlı), beyaz kasımpatıları
const B = S.bitki;
for (const s of B.saplar) {
  const pts = yenidenOrnekle(s, 1.2);
  serit(c, pts, { w: 4.2, renk: 'rgba(70,140,110,0.95)', titreme: 0.3, frek: 0.01, sonSivri: 90 });
  serit(c, ofsetle(pts, 2), { w: 0.65, renk: '#2A3A2C', titreme: 0.3, sonSivri: 90 });
  serit(c, ofsetle(pts, -2), { w: 0.65, renk: '#2A3A2C', titreme: 0.3, sonSivri: 90 });
}
for (const y of B.yapraklar) {
  const d = S.yaprakYolu(y);
  const yol = new Path2D(d);
  const L = y.uzunluk;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const P = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  const mavi = rr() < 0.3;
  c.fillStyle = mavi ? '#4F86B0' : '#4E9E7C';
  c.fill(yol);
  const [tx, ty] = P(L, 0);
  lavi(yol, y.x, y.y, tx, ty, mavi ? [[0, 'rgba(30,60,120,0.5)'], [1, 'rgba(150,190,220,0.35)']] : [[0, 'rgba(20,70,56,0.55)'], [1, 'rgba(160,214,180,0.4)']]);
  cizgiYol(c, d, { w: 0.7, renk: '#20382E', titreme: 0.3, frek: 0.05, basinc: 0.3 });
  altinNokta([P(L * 0.04, 0), P(L * 0.5, L * 0.012), P(L * 0.9, 0)], { w: 0.55, sonSivri: L * 0.3 });
}
for (const t of B.tomurcuklar) {
  const d = S.tomurcukYolu(t);
  const yol = new Path2D(d);
  c.fillStyle = '#FBF8F0';
  c.fill(yol);
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  lavi(yol, t.x + ca * t.r * 1.6, t.y + sa * t.r * 1.6, t.x - ca * t.r, t.y - sa * t.r, [[0, 'rgba(240,226,200,0.2)'], [1, 'rgba(70,150,120,0.75)']]);
  cizgiYol(c, d, { w: 0.6, renk: MUR, titreme: 0.15 });
}
function kasimpati(f) {
  const R = f.r * 1.12;
  const r = S.rng(Math.round(f.x * 13 + f.y * 3));
  const halkalar = [
    { n: Math.round(18 + f.r * 0.1), r1: 1.0, gen: 0.2, ofs: 0 },
    { n: Math.round(16 + f.r * 0.08), r1: 0.8, gen: 0.21, ofs: 0.1 },
    { n: Math.round(13 + f.r * 0.06), r1: 0.6, gen: 0.23, ofs: 0.05 },
    { n: Math.round(10 + f.r * 0.04), r1: 0.42, gen: 0.26, ofs: 0.15 },
  ];
  for (const h of halkalar) {
    for (let j = 0; j < h.n; j++) {
      const a = f.aci + h.ofs + (j / h.n) * Math.PI * 2 + (r() - 0.5) * 0.08;
      const L = R * h.r1 * (0.9 + r() * 0.14);
      const W = R * h.gen;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const P = (u, v) => `${(f.x + u * ca - v * sa).toFixed(2)},${(f.y + u * sa + v * ca).toFixed(2)}`;
      const d = `M${P(R * 0.08, 0)} C${P(L * 0.3, -W * 0.42)} ${P(L * 0.72, -W * 0.56)} ${P(L * 0.94, -W * 0.36)} C${P(L * 1.04, -W * 0.2)} ${P(L * 1.04, W * 0.2)} ${P(L * 0.94, W * 0.36)} C${P(L * 0.72, W * 0.56)} ${P(L * 0.3, W * 0.42)} ${P(R * 0.08, 0)} Z`;
      const yol = new Path2D(d);
      c.fillStyle = '#FCFAF4';
      c.fill(yol);
      const golge = 0.5 - 0.5 * Math.cos(a + 0.8);
      lavi(yol, f.x, f.y, f.x + ca * L, f.y + sa * L, [[0, 'rgba(196,200,120,0.55)'], [0.45, `rgba(150,176,206,${0.08 + 0.18 * golge})`], [1, `rgba(150,176,206,${0.02 + 0.08 * golge})`]]);
      cizgiYol(c, d, { w: 0.42 + f.r * 0.0025, renk: 'rgba(132,104,64,0.75)', titreme: 0.15, frek: 0.08, basinc: 0.25 });
    }
  }
  const yol = new Path2D(S.daireYolu(f.x, f.y, R * 0.2));
  const g = c.createRadialGradient(f.x + R * 0.04, f.y - R * 0.04, 0, f.x, f.y, R * 0.2);
  g.addColorStop(0, '#F1CF6A');
  g.addColorStop(1, '#C9922E');
  c.fillStyle = g;
  c.fill(yol);
  for (let i = 0; i < 16; i++) {
    const a = r() * Math.PI * 2;
    const q = Math.sqrt(r()) * R * 0.16;
    c.fillStyle = 'rgba(150,96,30,0.75)';
    c.beginPath();
    c.arc(f.x + Math.cos(a) * q, f.y + Math.sin(a) * q, 0.7 + f.r * 0.012, 0, Math.PI * 2);
    c.fill();
  }
  cizgiYol(c, S.daireYolu(f.x, f.y, R * 0.2), { w: 0.5, renk: 'rgba(110,70,30,0.8)', titreme: 0.1 });
}
for (const f of B.cicekler) kasimpati(f);

// ---- 7) katların düzensizliği: mineral boya ipekte hafif dalgalı yoğunlukta durur
{
  const dk1 = gurultuDokusu(1024, 0.014, 4, 191);
  const dk2 = gurultuDokusu(1024, 0.09, 2, 192);
  pikselGecis(c, (d, i, x, y) => {
    const m = 0.9 + 0.2 * dk1(x * 0.5, y * 0.5) + 0.08 * (dk2(x * 0.5, y * 0.5) - 0.5);
    d[i] = kenet(IPEK[0] + (d[i] - IPEK[0]) * m, 0, 255);
    d[i + 1] = kenet(IPEK[1] + (d[i + 1] - IPEK[1]) * m, 0, 255);
    d[i + 2] = kenet(IPEK[2] + (d[i + 2] - IPEK[2]) * m, 0, 255);
  });
}

// ---- 8) ekran: ipek dokusu ve mineral tanesi
const ekran = ekranaAktar(calisma);
{
  const sat = new Float32Array(1024);
  const sut = new Float32Array(1024);
  const nz = gurultu(190);
  for (let i = 0; i < 1024; i++) {
    sat[i] = 0.55 + 0.9 * nz.n(i * 0.41, 1.7) + (nz.n(i * 0.05, 8.1) > 0.8 ? 0.5 : 0);
    sut[i] = 0.55 + 0.9 * nz.n(i * 0.43, 4.9);
  }
  pikselGecis(ekran, (d, i, x, y) => {
    const ay = 0.5 + 0.5 * Math.cos((y * 2 * Math.PI) / 3.2 + nz.n(x * 0.01, y * 0.002) * 3);
    const ax = 0.5 + 0.5 * Math.cos((x * 2 * Math.PI) / 3.4 + nz.n(y * 0.01, x * 0.002) * 3);
    const t = ay * sat[y] * 0.5 + ax * sut[x] * 0.5;
    const doy = (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2])) / 255;
    const m = 1 - 0.04 * t + (0.022 + 0.09 * doy) * (karma(x, y, 5) - 0.5) + 0.05 * doy * (karma(x >> 1, y >> 1, 6) - 0.5);
    d[i] = kenet(d[i] * m + 2, 0, 255);
    d[i + 1] = kenet(d[i + 1] * m + 1.5, 0, 255);
    d[i + 2] = kenet(d[i + 2] * m, 0, 255);
  });
}
