<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-225 Safevi Minyatürü — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #FBFAF4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ================================================================ ortak el yardımcıları (j5)
  const S = SAHNE;
  const N = 2048; // iç çözünürlük (koordinatlar 1024'te kalır)
  const NN = N * N;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);
  H.kutu = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const M = 256;
    const tab = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * M + x0];
      const b = tab[y0 * M + x1];
      const c = tab[y1 * M + x0];
      const d = tab[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  /** Vuruşlar için ortak gürültü havuzu: her vuruşta yeni tablo kurmamak için tohuma göre kaydırılmış paylaşılan tablolar. */
  H._havuz = [];
  H.nz = function (seed) {
    const j = Math.abs(seed | 0) % 8;
    if (!H._havuz[j]) H._havuz[j] = H.noise(9001 + j * 31);
    const f = H._havuz[j];
    const ox = ((seed * 37.17) % 256 + 256) % 256;
    const oy = ((seed * 91.73) % 256 + 256) % 256;
    return (x, y) => f(x + ox, y + oy);
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed, L}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Nokta dizisini eşit aralıklı yeniden örnekler. */
  H.resample = function (pts, step) {
    const out = [pts[0]];
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      let seg = Math.hypot(x1 - x0, y1 - y0);
      while (acc + seg >= step) {
        const t = (step - acc) / seg;
        x0 = x0 + (x1 - x0) * t;
        y0 = y0 + (y1 - y0) * t;
        out.push([x0, y0]);
        seg = Math.hypot(x1 - x0, y1 - y0);
        acc = 0;
      }
      acc += seg;
    }
    const last = pts[pts.length - 1];
    const lo = out[out.length - 1];
    if (Math.hypot(last[0] - lo[0], last[1] - lo[1]) > step * 0.3) out.push(last);
    return out;
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    if (!amp) return pts;
    const n = H.nz(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step, plen
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.nz(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? (o.ctaper || 0) : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      const wf = o.wf;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (wf) w *= wf(t, pts[i]);
        if (taper > 0) {
          if (t < taper) w *= 0.25 + 0.75 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.25 + 0.75 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Elle doldurma sınırı: yol titrek bir çokgene çevrilir (boya çizgiye tam oturmaz). */
  H.elYolu = function (d, amp, seed, wl) {
    const p = new Path2D();
    let k = 0;
    for (const sp of H.flatten(d, 1.5)) {
      const pts = sp.closed ? sp.pts.concat([sp.pts[0]]) : sp.pts;
      const w = H.wobble(pts, amp, wl || 18, (seed || 5) + k++ * 11);
      w.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      p.closePath();
    }
    return p;
  };

  /** Ekran dışı katman (2048, koordinat 1024). */
  H.katman = function () {
    const c = S.yeniTuval(N, N);
    const k = c.getContext('2d', { willReadFrequently: true });
    k.setTransform(2, 0, 0, 2, 0, 0);
    k.lineCap = 'round';
    k.lineJoin = 'round';
    return { c, k };
  };
  /** Katmanın bulanık alfa kopyası (Uint8ClampedArray, 2048²·4). */
  H.bulanik = function (c, px) {
    const b = S.yeniTuval(N, N);
    const k = b.getContext('2d', { willReadFrequently: true });
    k.filter = `blur(${px}px)`;
    k.drawImage(c, 0, 0);
    return k.getImageData(0, 0, N, N).data;
  };

  // ---------------------------------------------------------------- kubbe ve silindir ışığı
  H.kubbeP = S.kubbeProfili(400);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };
  H.ISIK = (() => {
    const v = [0.62, -0.5, 0.6]; // sağ, yukarı (ekranda -y), öne
    const l = Math.hypot(v[0], v[1], v[2]);
    return v.map((q) => q / l);
  })();
  /** Kubbe yüzeyinde (x, y) noktasının aydınlanması 0..1 ve normali. */
  H.kubbeIsik = function (x, y) {
    const r = Math.max(1, H.kubbeR(y));
    const u = H.clamp((x - 560) / r, -1, 1);
    const dy = 1.5;
    const dr = (H.kubbeR(y - dy) - H.kubbeR(y + dy)) / (2 * dy); // yükseldikçe yarıçap değişimi (negatif)
    let nr = 1;
    let nh = -dr; // yukarı bileşen
    const l = Math.hypot(nr, nh);
    nr /= l;
    nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u;
    const ny = -nh; // ekran y aşağı
    const nz = nr * c;
    return H.clamp(nx * H.ISIK[0] + ny * H.ISIK[1] + nz * H.ISIK[2], 0, 1);
  };
  /** Dikey silindir aydınlanması (u: -1 sol kenar, 1 sağ kenar). */
  H.silindirIsik = function (u) {
    u = H.clamp(u, -1, 1);
    const l = Math.hypot(H.ISIK[0], H.ISIK[2]);
    return H.clamp((u * H.ISIK[0] + Math.sqrt(1 - u * u) * H.ISIK[2]) / l, 0, 1);
  };

  // ---------------------------------------------------------------- fırça izleri
  /**
   * Fırça vuruşu: pts boyunca şerit; başta basınçla açılır, sonda incelir.
   * o: w, color (css), bas (0–0.5), uc (0–0.5), jit (genişlik oynaması), seed, amp, wl
   */
  H.firca = function (ctx, pts, o) {
    if (pts.length < 2) return;
    const seed = o.seed || 1;
    const p2 = o.amp ? H.wobble(pts, o.amp, o.wl || 40, seed) : pts;
    const nz = H.nz(seed * 3 + 7);
    const bas = o.bas === undefined ? 0.12 : o.bas;
    const uc = o.uc === undefined ? 0.3 : o.uc;
    const jit = o.jit === undefined ? 0.2 : o.jit;
    if (o.color) ctx.fillStyle = o.color;
    H.ribbon(ctx, p2, (t, i) => {
      let w = o.w * (1 - jit * 0.5 + jit * 0.5 * nz(i * 0.09, 3.3));
      if (bas > 0 && t < bas) w *= 0.45 + 0.55 * Math.sin(((t / bas) * Math.PI) / 2);
      if (uc > 0 && t > 1 - uc) w *= Math.pow(Math.max(0, (1 - t) / uc), 0.7);
      return Math.max(0.05, w);
    });
  };
  /** Yön alanını izleyen vuruş noktaları: aci(x, y) radyan. */
  H.akis = function (x, y, len, aci, step, yonIsareti) {
    step = step || 3;
    const pts = [[x, y]];
    let px = x;
    let py = y;
    let pa = aci(x, y);
    const sg = yonIsareti || 1;
    for (let s = 0; s < len; s += step) {
      let a = aci(px, py);
      // yön sıçramasın (çizgi alanları için π belirsizliği)
      if (Math.cos(a - pa) < 0) a += Math.PI;
      px += Math.cos(a) * step * sg;
      py += Math.sin(a) * step * sg;
      pa = a;
      pts.push([px, py]);
    }
    return pts;
  };
  /**
   * Bir alanı fırça vuruşlarıyla doldurur.
   * o: box [x0,y0,x1,y1], ara (vuruş merkezleri arası), uzun [a,b], gen [a,b], aci(x,y), renk(x,y,r) → css,
   *    alfa [a,b] (renk css içinde değilse globalAlpha), seed, bas, uc, jit, amp, kirp (Path2D), yogun(x,y) 0..1
   */
  H.vurusDoldur = function (ctx, o) {
    const r = S.rng(o.seed || 11);
    const [x0, y0, x1, y1] = o.box;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    const ara = o.ara;
    const liste = [];
    for (let y = y0 - ara; y < y1 + ara; y += ara * (0.8 + r() * 0.4)) {
      for (let x = x0 - ara + r() * ara; x < x1 + ara; x += ara * (0.7 + r() * 0.6)) {
        liste.push([x + (r() - 0.5) * ara, y + (r() - 0.5) * ara, r()]);
      }
    }
    // karıştır: vuruş sırası rastgele
    for (let i = liste.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = liste[i];
      liste[i] = liste[j];
      liste[j] = t;
    }
    let k = 0;
    for (const [x, y, q] of liste) {
      if (o.yogun && r() > o.yogun(x, y)) continue;
      const L = o.uzun[0] + r() * (o.uzun[1] - o.uzun[0]);
      const W = o.gen[0] + r() * (o.gen[1] - o.gen[0]);
      const ters = r() < 0.5 ? 1 : -1;
      // vuruş merkezden başlasın: geriye yarım boy
      const geri = H.akis(x, y, L / 2, o.aci, 3, -ters);
      const ileri = H.akis(x, y, L / 2, o.aci, 3, ters);
      const pts = geri.reverse().concat(ileri.slice(1));
      ctx.globalAlpha = o.alfa ? o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]) : 1;
      H.firca(ctx, pts, { w: W, color: o.renk(x, y, q, r), bas: o.bas, uc: o.uc, jit: o.jit, seed: (o.seed || 11) * 1000 + k, amp: o.amp, wl: o.wl });
      k++;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return k;
  };

  /**
   * Tarama (hatching): açı aci ile paralel çizgiler; f(x, y) ≥ eşik olan yerlerde çizgi parçası çizilir.
   * Her çizginin kendi eşiği vardır: yoğunluk f ile artar. o: box, ara, aci (sabit ya da fonksiyon değil), f, w, color,
   * kirp (Path2D), seed, amp, egri (çizgi bükümü), minL, taper
   */
  H.tara = function (ctx, o) {
    const [x0, y0, x1, y1] = o.box;
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    const R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
    const ca = Math.cos(o.aci);
    const sa = Math.sin(o.aci);
    const r = S.rng(o.seed || 3);
    const adim = 1.5;
    ctx.save();
    if (o.kirp) ctx.clip(o.kirp);
    ctx.fillStyle = o.color;
    let i = 0;
    for (let v = -R; v <= R; v += o.ara * (0.85 + r() * 0.3), i++) {
      const esik = ((i * 0.6180339) % 1) * (o.esikMax || 0.92) + 0.04;
      let seg = [];
      const bitir = () => {
        if (seg.length * adim >= (o.minL || 4)) {
          const pts = o.amp ? H.wobble(seg, o.amp, 30, (o.seed || 3) * 100 + i) : seg;
          H.pen(ctx, [{ pts, closed: false }], { w: o.w * (0.8 + r() * 0.4), amp: 0, press: 0.3, taper: o.taper === undefined ? 0.3 : o.taper, seed: i + 1 });
        }
        seg = [];
      };
      for (let u = -R; u <= R; u += adim) {
        const bend = o.egri ? o.egri * Math.sin((u / R) * Math.PI * 0.5) : 0;
        const x = cx + u * ca - (v + bend) * sa;
        const y = cy + u * sa + (v + bend) * ca;
        if (x < x0 - 2 || x > x1 + 2 || y < y0 - 2 || y > y1 + 2) {
          bitir();
          continue;
        }
        if (o.f(x, y) >= esik) seg.push([x, y]);
        else bitir();
      }
      bitir();
    }
    ctx.restore();
  };

  /** Kâğıt dokusu yüksekliği (2048², 0..1): ince lif + orta benek. */
  H.kagitDoku = function (seed, ince, orta) {
    const n1 = H.noise(seed);
    const n2 = H.noise(seed + 1);
    const n3 = H.noise(seed + 2);
    const out = new Float32Array(NN);
    ince = ince || 3.2;
    orta = orta || 40;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        // lifler: yatay uzatılmış ince gürültü + orta benek
        const v = 0.45 * n1(x / ince, y / (ince * 0.55)) + 0.3 * n1(x / (ince * 2.3) + 50, y / (ince * 1.1) + 20) + 0.25 * n2(x / orta, y / orta) + 0.12 * n3(x / 1.4, y / 1.4);
        out[y * N + x] = 0.5 + 0.5 * v;
      }
    }
    return out;
  };

  /** Yaprak biçimi (sivri uçlu, kenarı kavisli): sap (x,y), yön aci, boy L, en W. Nokta dizisi döner. */
  H.yaprakNoktalari = function (x, y, aci, L, W, egri, n) {
    n = n || 18;
    egri = egri || 0;
    const ca = Math.cos(aci);
    const sa = Math.sin(aci);
    const sol = [];
    const sag = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const w = W * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) * 0.5;
      const b = egri * L * Math.sin(Math.PI * t) * 0.18;
      const u = t * L;
      sol.push([x + u * ca - (b - w) * sa, y + u * sa + (b - w) * ca]);
      sag.push([x + u * ca - (b + w) * sa, y + u * sa + (b + w) * ca]);
    }
    return sol.concat(sag.reverse().slice(1));
  };
  /** Bir sapı ya da çizgiyi sabit adımla nokta dizisi olarak bükerek uzatır. */
  H.kavis = function (x0, y0, x1, y1, bukum, n) {
    n = n || 24;
    const dx = x1 - x0;
    const dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L;
    const ny = dx / L;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const b = bukum * Math.sin(Math.PI * t);
      pts.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]);
    }
    return pts;
  };

  // ================================================================ S-225 Safevi Minyatürü
  // Hayalî bir Safevi saray musavvirinin eli: perdahlı (mühreli) kâğıt üstüne maden boyalar; ince koyu
  // ve altın konturlar; açık lacivertten soluk maviye inen gündüz göğü ve içinde beyaz Çin bulut
  // kıvrımları; yüksek ufuklu, açık nane yeşili çayır ve üstüne düzenli serpilmiş minik çiçek demetleri;
  // iki yanda beyaz-pembe çiçek açmış badem ağaççıkları; uçlarda küçük lavanta ve soluk mercan
  // süngerimsi kayalar; mimaride süslemeli düz renk alanları ve firuze vurgular.
  const tuval = document.getElementById('tuval');
  tuval.width = N;
  tuval.height = N;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let tohum = 1100;
  const T = () => tohum++;
  const hx = H.hex;
  const rgb = (c, v) => H.rgba(c.map((q) => H.clamp(q * (1 + (v || 0)), 0, 255)));
  const elYol = (d, amp) => (typeof d === 'string' ? H.elYolu(d, amp === undefined ? 0.4 : amp, T(), 14) : d);
  const doldur = (d, renk, amp) => {
    const p = elYol(d, amp);
    ctx.fillStyle = renk;
    ctx.fill(p);
    return p;
  };
  const ALT = H.katman(); // altın tanesi maskesi
  const ak = ALT.k;
  const ALTIN = '#CFA74A';
  const cizgi = (d, w, renk, o) => {
    o = o || {};
    const dd = typeof d === 'string' ? H.flatten(d, 1) : [{ pts: d, closed: !!o.kapali }];
    const sd = T();
    const hedef = renk === ALTIN ? [[ctx, ALTIN], [ak, '#fff']] : [[ctx, renk]];
    for (const [c, rk] of hedef) {
      H.pen(c, dd, {
        w,
        color: rk,
        amp: o.amp === undefined ? 0.3 : o.amp,
        wl: 18,
        seed: sd,
        press: o.press === undefined ? 0.4 : o.press,
        taper: o.taper === undefined ? 0.08 : o.taper,
        ctaper: 0,
        step: 1,
      });
    }
  };
  const altinDoldur = (d, amp) => {
    const p = elYol(d, amp === undefined ? 0.2 : amp);
    ctx.fillStyle = ALTIN;
    ctx.fill(p);
    ak.fillStyle = '#fff';
    ak.fill(p);
  };
  const KONTUR = 'rgba(46,44,60,0.85)';
  // beyaz boyanın fırçadan fırçaya sıcak/soğuk farkı
  const beyazF = (x, y, q) => hx(q < 0.35 ? '#FFFFFF' : q < 0.68 ? '#FBFAF4' : q < 0.88 ? '#EEEBE0' : '#E5EAF0');
  /** örtücü düz alan + ince fırça izi */
  function alan(d, hex, o) {
    o = o || {};
    const yol = elYol(d, o.amp);
    ctx.fillStyle = hex;
    ctx.fill(yol);
    if (o.box) {
      H.vurusDoldur(ctx, {
        box: o.box,
        ara: o.ara || 6,
        uzun: o.uzun || [24, 50],
        gen: o.gen || [4, 6],
        aci: o.aci || (() => 0),
        renk: (x, y, q, r) => rgb(o.renkF ? o.renkF(x, y, q) : hx(hex), (r() - 0.5) * (o.oyna || 0.07)),
        alfa: o.alfa || [0.5, 0.8],
        kirp: yol,
        seed: T(),
        bas: 0.15,
        uc: 0.45,
        jit: 0.3,
        amp: 0.4,
        wl: 30,
      });
    }
    return yol;
  }
  const nokta = (c, x, y, r) => {
    c.beginPath();
    c.ellipse(x, y, r, r * 0.92, 0.4, 0, Math.PI * 2);
    c.fill();
  };

  // ================================================================ GÖK: açık laciverden soluk maviye, ince vuruşlar
  const ufuk = (x) => 612 - 6 * Math.sin(x / 120 + 0.5) - 26 * Math.pow(Math.abs(x - 512) / 512, 2.2) * 2.2;
  {
    const ust = hx('#6E98DA');
    const alt = hx('#CFE1F4');
    const renk = (y) => H.mix(ust, alt, H.smooth(60, 600, y));
    for (let y = 0; y < 640; y += 28) {
      ctx.fillStyle = rgb(renk(y + 14));
      ctx.fillRect(-5, y, 1034, 30);
    }
    // örtücü lapis: geniş, uzun, hafif dalgalı vuruşlar; tonu fırçadan fırçaya belirgin değişir, bindiği yerde koyulaşır
    const gn = H.noise(22509);
    for (const [ara, uzun, gen, oyna, alfa, sd, koyu] of [
      [11, [80, 150], [14, 22], 0.24, [0.62, 0.9], 22501, 0],
      [26, [70, 130], [14, 20], 0.1, [0.22, 0.32], 22508, 1],
    ]) {
      H.vurusDoldur(ctx, {
        box: [0, 0, 1024, 640],
        ara,
        uzun,
        gen,
        aci: (x, y) => 0.1 * gn(x / 200, y / 140) + 0.04 * Math.sin(x / 90),
        renk: (x, y, q, r) => rgb(koyu ? H.mix(renk(y), hx('#4F7FC8'), 0.55) : renk(y + (r() - 0.5) * 30), (r() - 0.5) * oyna),
        alfa,
        seed: sd,
        bas: 0.15,
        uc: 0.4,
        jit: 0.3,
        amp: 0.8,
        wl: 60,
      });
    }
  }
  // ---- güneş: küçük soluk sarı-beyaz teker, ince altın halka
  {
    const gx = 878;
    const gy = 132;
    doldur(S.daireYolu(gx, gy, 26), '#FDF8E4', 0.6);
    ctx.save();
    ctx.clip(H.P(S.daireYolu(gx, gy, 26)));
    for (let i = 0; i < 9; i++) {
      ctx.globalAlpha = 0.6;
      H.firca(ctx, [[gx - 28, gy - 20 + i * 5], [gx + 28, gy - 19 + i * 5]], { w: 4, color: i % 2 ? '#FFFDF2' : '#F7EDC8', seed: T() });
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    cizgi(S.daireYolu(gx, gy, 26.5), 1.6, ALTIN, { amp: 0.55, press: 0.5 });
  }
  // ---- Çin bulut kıvrımları: beyaz kurdele, düğümlü, kuyruklu; ince mavi kontur
  function bulut(cx, cy, L, W, yon) {
    // orta çizgi: soldan sağa dalga, ortada bir düğüm (ilmik), uçlarda kıvrım
    const pts = [];
    const n = 120;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      let x = cx - L / 2 + L * t;
      let y = cy + yon * W * 0.9 * Math.sin(t * Math.PI * 2.2);
      // ilmik: t 0.42–0.58 arası küçük bir daire
      if (t > 0.4 && t < 0.6) {
        const u = (t - 0.4) / 0.2;
        const a = -Math.PI / 2 + u * Math.PI * 2;
        x = cx - L * 0.1 + L * 0.2 * u + Math.cos(a) * W * 1.3 * yon * 0.0 + Math.sin(u * Math.PI * 2) * W * 1.2;
        y = cy + yon * (W * 1.2 * (1 - Math.cos(u * Math.PI * 2)) * -0.9) + yon * W * 0.9 * Math.sin(t * Math.PI * 2.2);
      }
      pts.push([x, y]);
    }
    const kivir = (p0, p1, sg) => {
      let a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      let [x, y] = p1;
      const out = [];
      const Lk = W * 5.6;
      for (let s = 0; s < Lk; s += 1) {
        a += sg * (0.012 + 0.12 * Math.pow(s / Lk, 1.4));
        x += Math.cos(a);
        y += Math.sin(a);
        out.push([x, y]);
      }
      return out;
    };
    const sa = kivir(pts[n - 2], pts[n], yon);
    const so = kivir(pts[2], pts[0], yon);
    const tum = so.slice().reverse().concat(pts, sa);
    const M = tum.length;
    const ns = so.length;
    const Lp = [];
    const Rp = [];
    for (let i = 0; i < M; i++) {
      const a = tum[Math.max(0, i - 1)];
      const b = tum[Math.min(M - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      let w;
      if (i < ns) w = W * 0.75 * Math.pow(i / ns, 0.9);
      else if (i >= ns + n + 1) w = W * 0.75 * Math.pow(1 - (i - ns - n - 1) / (M - ns - n - 1), 0.9);
      else w = W * (0.75 + 0.25 * Math.abs(Math.cos(((i - ns) / n) * Math.PI * 3)) * Math.pow(Math.sin(((i - ns) / n) * Math.PI), 0.5));
      w = Math.max(0.5, w) / 2;
      Lp.push([tum[i][0] - ty * w, tum[i][1] + tx * w]);
      Rp.push([tum[i][0] + ty * w, tum[i][1] - tx * w]);
    }
    // gövdeyi kalın beyaz fırça şeridiyle boya (ilmik kendi üstüne biner)
    // mat, örtücü beyaz; bir kenarı boyunca çok soluk mavi bir gölge şeridi (parlak tüp ışığı yok)
    ctx.globalAlpha = 1;
    const govdeYol = H.polyPath(Lp.concat(Rp.slice().reverse()), true);
    ctx.fillStyle = '#FBFBF8';
    ctx.fill(govdeYol);
    H.firca(ctx, tum, { w: W * 0.9, color: '#FBFBF8', bas: 0.12, uc: 0.12, jit: 0.15, seed: T() });
    ctx.save();
    ctx.clip(govdeYol);
    ctx.globalAlpha = 0.4;
    H.firca(ctx, Rp, { w: W * 0.32, color: '#D3DEEC', bas: 0.2, uc: 0.2, seed: T() });
    ctx.restore();
    ctx.globalAlpha = 1;
    cizgi(Lp, 1.0, 'rgba(58,82,140,0.9)', { taper: 0.15, press: 0.6 });
    cizgi(Rp, 0.75, 'rgba(58,82,140,0.9)', { taper: 0.15, press: 0.6 });
  }
  bulut(132, 238, 180, 14, 1);
  bulut(520, 118, 200, 13, -1);
  bulut(790, 300, 220, 14, 1);
  bulut(120, 432, 150, 11, -1);
  bulut(912, 468, 124, 11, 1);

  // ================================================================ ÇAYIR: yüksek ufuk, açık nane yeşili
  {
    const pts = [[-10, 1034]];
    for (let x = -10; x <= 1034; x += 4) pts.push([x, ufuk(x)]);
    pts.push([1034, 1034]);
    const cayir = H.polyPath(H.wobble(pts, 0.6, 20, T()), true);
    ctx.fillStyle = '#A6D4AE';
    ctx.fill(cayir);
    H.vurusDoldur(ctx, {
      box: [0, 480, 1024, 1024],
      ara: 8,
      uzun: [34, 70],
      gen: [8, 13],
      aci: (x, y) => 0.08 * Math.sin(x / 70 + y / 40),
      renk: (x, y, q, r) => rgb(H.mix(hx('#B2DBB7'), hx('#90C49A'), H.smooth(600, 1024, y) * (0.6 + 0.4 * r())), (r() - 0.5) * 0.2),
      alfa: [0.6, 0.9],
      kirp: cayir,
      seed: 22502,
      bas: 0.15,
      uc: 0.45,
      jit: 0.3,
      amp: 0.4,
    });
    // ufuk çizgisi: ince koyu yeşil
    cizgi(pts.slice(1, -1), 0.9, 'rgba(60,110,80,0.7)', { taper: 0.02, amp: 0.4 });
  }
  // ---- uçlarda süngerimsi kayalar (lavanta ve soluk mercan), küçük
  function kaya(cx, cy, w, h, renk, koyu) {
    // Safevi süngerimsi kaya: yukarı doğru üst üste binen yuvarlak, dik loblar; arkadakiler (üstte) önce.
    // Her lob dipte koyu, tepede açık dikey vuruşlarla boyanır; tepesinin içinde kenarı izleyen açık bir
    // yankı çizgisi, çevresinde ince koyu kontur; delik yok
    const rr = S.rng(Math.floor(cx * 3 + cy));
    const c0 = hx(renk);
    const cK = hx(koyu);
    const cA = H.mix(c0, [255, 255, 255], 0.5);
    const loblar = [];
    for (const [adet, yk, lwk, lhk] of [[2, 0.66, 0.3, 0.42], [3, 0.36, 0.3, 0.44], [4, 0.0, 0.27, 0.42]]) {
      for (let i = 0; i < adet; i++) {
        const u = (i / (adet - 1) - 0.5) * (adet === 2 ? 0.36 : adet === 3 ? 0.62 : 0.84);
        loblar.push({ x: cx + u * w + (rr() - 0.5) * w * 0.05, y: cy - yk * h, w: w * lwk * (0.88 + rr() * 0.24), h: h * lhk * (0.85 + rr() * 0.3), f: rr() * 6 });
      }
    }
    for (const L of loblar) {
      const pts = [];
      for (let k = 0; k <= 40; k++) {
        const a = Math.PI + (k / 40) * Math.PI;
        const lob = 1 + 0.07 * Math.sin(k * 0.45 + L.f) + 0.04 * Math.sin(k * 1.1 + L.f * 2);
        pts.push([L.x + Math.cos(a) * L.w * 0.5 * lob, L.y + Math.sin(a) * L.h * lob]);
      }
      pts.push([L.x + L.w * 0.45, L.y + L.h * 0.15], [L.x - L.w * 0.45, L.y + L.h * 0.15]);
      const yol = H.polyPath(H.wobble(pts.concat([pts[0]]), 0.4, 10, T()), true);
      ctx.fillStyle = rgb(c0);
      ctx.fill(yol);
      ctx.save();
      ctx.clip(yol);
      // dikey vuruşlar: dipte koyu, tepede açık
      for (let k = 0; k < 9; k++) {
        const x = L.x - L.w * 0.5 + (k + 0.5) * (L.w / 9) + (rr() - 0.5) * 2;
        const tep = L.y - L.h * Math.sqrt(Math.max(0, 1 - Math.pow((x - L.x) / (L.w * 0.5), 2)));
        ctx.globalAlpha = 0.7;
        H.firca(ctx, [[x, L.y + L.h * 0.2], [x + (rr() - 0.5) * 2, L.y - L.h * 0.15]], { w: L.w / 7, color: rgb(H.mix(cK, c0, 0.25 + rr() * 0.3)), bas: 0.05, uc: 0.6, seed: T() });
        H.firca(ctx, [[x, tep + L.h * 0.55], [x + (rr() - 0.5) * 2, tep]], { w: L.w / 8, color: rgb(H.mix(c0, cA, 0.4 + rr() * 0.5)), bas: 0.4, uc: 0.1, seed: T() });
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      // tepede içe doğru açık yankı çizgisi ve ince koyu kontur
      const yanki = pts.slice(10, 34).map(([px, py]) => [px + (L.x - px) * 0.22, py + (L.y - py) * 0.22]);
      cizgi(yanki, 0.8, H.rgba(H.mix(cA, [255, 255, 255], 0.4), 0.85), { taper: 0.4, amp: 0.2 });
      cizgi(pts.slice(0, 41), 0.85, H.rgba(H.mix(cK, [50, 30, 60], 0.5), 0.8), { taper: 0.12, press: 0.6, amp: 0.3 });
    }
  }
  kaya(40, ufuk(40) + 6, 90, 44, '#CDB9DD', '#A68CBF');
  kaya(96, ufuk(96) + 10, 60, 26, '#ECC3B2', '#C98F7D');
  kaya(990, ufuk(990) + 6, 88, 46, '#ECC3B2', '#C98F7D');
  kaya(935, ufuk(935) + 10, 56, 24, '#CDB9DD', '#A68CBF');

  // ---- çayıra serpilmiş minik çiçek demetleri (düzenli aralıklarla)
  function demetcik(x, y, s, tur) {
    const renk = ['#FFFFFF', '#F0C3CF', '#7E9BE0', '#F6E08A'][tur];
    H.firca(ctx, [[x, y + 7 * s], [x + 0.5, y - 4 * s]], { w: 1.4 * s, color: '#4F8F5E', bas: 0.05, uc: 0.2, seed: T() });
    for (const sg of [-1, 1]) {
      const pts = H.yaprakNoktalari(x, y + 4 * s, -Math.PI / 2 + sg * 0.9, 6.5 * s, 2.6 * s, sg * 0.4, 6);
      ctx.fillStyle = '#3F8556';
      ctx.fill(H.polyPath(pts, true));
    }
    // 3–5 çiçekçik
    const adet = 3 + (tur % 2);
    for (let i = 0; i < adet; i++) {
      const a = -Math.PI / 2 + (i - (adet - 1) / 2) * 0.7;
      const px = x + Math.cos(a) * 4.5 * s;
      const py = y - 3 * s + Math.sin(a) * 4.5 * s;
      ctx.fillStyle = renk;
      nokta(ctx, px, py, 1.9 * s);
      ctx.fillStyle = tur === 2 ? '#3D5BAA' : '#D69A3A';
      nokta(ctx, px, py, 0.6 * s);
    }
  }
  {
    const rr = S.rng(2253);
    let k = 0;
    for (let y = 640; y < 1020; y += 30) {
      const kay = (Math.round((y - 640) / 30) % 2) * 19;
      for (let x = 14 + kay; x < 1020; x += 38) {
        // ressam serpiştirir: aralık aşağı yukarı eşit, ama ızgara gibi değil
        if (rr() < 0.12) continue;
        const px = x + (rr() - 0.5) * 22;
        const py = y + (rr() - 0.5) * 16;
        if (py < ufuk(px) + 12) continue;
        // yapının arkasına ve önüne düşenler
        if (px > 286 && px < 834 && py < 806) continue;
        if (px > 260 && px < 340 && py < 806) continue;
        const s = (0.85 + H.smooth(640, 1000, py) * 0.6) * (0.82 + rr() * 0.36);
        k += 1 + (rr() < 0.4 ? 1 : 0);
        demetcik(px, py, s, k % 4);
      }
    }
  }

  // ================================================================ YAPI: süslemeli düz alanlar, firuze vurgular, ince konturlar
  const MP = S.minareParcalari();
  const BEYAZ = '#FBFAF4';
  const FIRUZE = '#3FB3B3';
  const LACI = '#2F4F9A';
  const YESIL = '#2E8A57';
  {
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      let d;
      let x1;
      let x2;
      if (p.tip === 'poligon') {
        d = S.yol(p.noktalar, true);
        const xs = p.noktalar.map((q) => q[0]);
        x1 = Math.min(...xs);
        x2 = Math.max(...xs);
      } else if (p.tip === 'korkuluk') {
        d = H.kutu(p.x1, p.y1, p.x2, p.y2);
        x1 = p.x1;
        x2 = p.x2;
      } else {
        d = p.yol;
        x1 = 266;
        x2 = 334;
      }
      const topuz = p.tip === 'topuz';
      const serefe = p.ad.startsWith('şerefe') || p.ad === 'bilezik';
      alan(d, topuz ? FIRUZE : serefe ? FIRUZE : '#F4F2EA', { box: [x1, 140, x2, 800], ara: 5, uzun: [24, 50], gen: [5, 8], aci: () => Math.PI / 2, oyna: topuz || serefe ? 0.18 : 0.06, renkF: topuz || serefe ? null : (x, y, q) => (x < x1 + (x2 - x1) * 0.3 ? H.mix(beyazF(x, y, q), hx('#DCE2EA'), 0.6) : beyazF(x, y, q)), alfa: [0.65, 0.92], amp: 0.25 });
    }
    // şerefe bantlarında beyaz nokta dizisi
    for (const ad of ['şerefe-1', 'şerefe-2', 'bilezik']) {
      const p = MP.find((q) => q.ad === ad);
      const [a, b, c] = p.noktalar;
      const y = (a[1] + c[1]) / 2;
      for (let x = a[0] + 4; x < b[0] - 2; x += 6) {
        ctx.fillStyle = '#FFFFFF';
        nokta(ctx, x, y, 1.3);
      }
    }
    // korkuluk: beyaz zemin üstünde lacivert kafes
    for (const ad of ['korkuluk-1', 'korkuluk-2']) {
      const p = MP.find((q) => q.ad === ad);
      const h = p.y2 - p.y1;
      for (let x = p.x1 + 2; x + h * 0.9 <= p.x2 - 1; x += h * 0.9) {
        cizgi([[x, p.y2 - 2], [x + h * 0.45, p.y1 + 3], [x + h * 0.9, p.y2 - 2]], 1.1, LACI, { taper: 0, amp: 0.1 });
      }
    }
    // zikzak bandı yerine: lacivert zeminde firuze baklavalar
    {
      const zb = MP.find((q) => q.ad === 'zikzak');
      doldur(H.kutu(zb.x1, zb.y1, zb.x2, zb.y2), LACI, 0.2);
      for (let r = 0; r < 3; r++) {
        const y = zb.y1 + 10 + r * 20;
        for (let x = zb.x1 + 6 + (r % 2) * 6; x < zb.x2 - 3; x += 12) {
          doldur(`M${x - 5},${y} L${x},${y - 8} L${x + 5},${y} L${x},${y + 8} Z`, FIRUZE, 0.1);
          ctx.fillStyle = '#FFFFFF';
          nokta(ctx, x, y, 1.2);
        }
      }
      cizgi(H.kutu(zb.x1, zb.y1, zb.x2, zb.y2), 1.2, ALTIN);
    }
    for (const w of S.minarePencereleri) {
      const d = S.kemerYolu(w.x, w.y, w.w, w.h);
      doldur(S.kemerYolu(w.x, w.y - 3, w.w + 6, w.h + 3), FIRUZE, 0.2);
      doldur(d, '#2B3550', 0.2);
      cizgi(d, 0.8, ALTIN);
    }
    for (const p of MP) {
      if (p.tip === 'alem' || p.tip === 'bant') continue;
      if (p.tip === 'poligon') cizgi(S.yol(p.noktalar, true), 1.7, KONTUR, { press: 0.65, amp: 0.45 });
      else if (p.tip === 'korkuluk') cizgi(H.kutu(p.x1, p.y1, p.x2, p.y2), 1.4, KONTUR, { press: 0.6, amp: 0.4 });
      else {
        cizgi(p.yol, 1.8, KONTUR, { press: 0.65, amp: 0.45 });
        // topuzda ince altın dilimler
        cizgi([[300, 148], [300, 199]], 0.7, ALTIN, { taper: 0.3 });
        cizgi([[290, 162], [287, 199]], 0.6, ALTIN, { taper: 0.3 });
        cizgi([[310, 162], [313, 199]], 0.6, ALTIN, { taper: 0.3 });
      }
    }
  }
  // ---- kaide: beyaz; üstte lacivert-firuze çini frizi, altta süpürgelik; firuze çerçeveli pencereler
  {
    const K = S.kaide;
    alan(H.kutu(K.x1, K.y1, K.x2, K.y2), '#F4F2EA', { box: [K.x1, K.y1, K.x2, K.y2], ara: 6, uzun: [40, 90], gen: [7, 10], oyna: 0.06, renkF: (x, y, q) => (x < K.x1 + 70 ? H.mix(beyazF(x, y, q), hx('#DCE2EA'), 0.6) : beyazF(x, y, q)), alfa: [0.65, 0.92], amp: 0.25 });
    // friz: lacivert zeminde firuze ve beyaz küçük gülçeler
    const fy1 = K.y1 + 3;
    const fy2 = K.y1 + 19;
    doldur(H.kutu(K.x1, fy1, K.x2, fy2), LACI, 0.15);
    for (let x = K.x1 + 10; x < K.x2 - 6; x += 16) {
      const y = (fy1 + fy2) / 2;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
        ctx.fillStyle = FIRUZE;
        nokta(ctx, x + Math.cos(a) * 3.4, y + Math.sin(a) * 3.4, 2.2);
      }
      ctx.fillStyle = '#FFFFFF';
      nokta(ctx, x, y, 1.6);
      if (x + 8 < K.x2 - 6) {
        ctx.fillStyle = ALTIN;
        nokta(ctx, x + 8, y, 1.1);
        ak.fillStyle = '#fff';
        nokta(ak, x + 8, y, 1.1);
      }
    }
    cizgi([[K.x1, fy1], [K.x2, fy1]], 1.0, ALTIN);
    cizgi([[K.x1, fy2], [K.x2, fy2]], 1.0, ALTIN);
    // süpürgelik: firuze bant, ince altın
    doldur(H.kutu(K.x1, K.y2 - 12, K.x2, K.y2), FIRUZE, 0.15);
    for (let x = K.x1 + 6; x < K.x2 - 4; x += 10) {
      ctx.fillStyle = '#FFFFFF';
      nokta(ctx, x, K.y2 - 6, 1.2);
    }
    cizgi([[K.x1, K.y2 - 12], [K.x2, K.y2 - 12]], 1.0, ALTIN);
    // korniş
    const kk = K.kornis;
    alan(H.kutu(kk.x1, kk.y1, kk.x2, kk.y2), BEYAZ, { box: [kk.x1, kk.y1, kk.x2, kk.y2], ara: 3, uzun: [30, 60], gen: [3, 4], oyna: 0.03, amp: 0.2 });
    cizgi(H.kutu(kk.x1, kk.y1, kk.x2, kk.y2), 1.6, KONTUR, { press: 0.65, amp: 0.45 });
    for (const p of K.pencereler) {
      const d = S.kemerYolu(p.x, p.y, p.w, p.h);
      doldur(S.kemerYolu(p.x, p.y - 7, p.w + 14, p.h + 7), FIRUZE, 0.2);
      // kemer köşeliklerinde ince altın kıvrım
      doldur(S.kemerYolu(p.x, p.y - 3, p.w + 6, p.h + 3), BEYAZ, 0.15);
      doldur(d, '#2B3550', 0.2);
      cizgi(S.kemerYolu(p.x, p.y - 7, p.w + 14, p.h + 7), 0.9, ALTIN);
      cizgi(d, 0.9, ALTIN);
    }
    cizgi(H.kutu(K.x1, K.y1, K.x2, K.y2), 1.9, KONTUR, { press: 0.65, amp: 0.5 });
  }
  // ---- kasnak: üst kat firuze (kafes desenli), alt kat yeşil, firuze çerçeveli pencereler
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    const d = H.kutu(q.x1, q.y1, q.x2, q.y2);
    if (kat === 0) {
      const yol = alan(d, FIRUZE, { box: [q.x1, q.y1, q.x2, q.y2], ara: 5, uzun: [20, 44], gen: [6, 9], aci: () => Math.PI / 2, oyna: 0.2, renkF: (x) => ((x - 560) / 208 < -0.45 ? hx('#2E9A9C') : (x - 560) / 208 > 0.2 ? hx('#52C2BE') : hx(FIRUZE)), alfa: [0.65, 0.92], amp: 0.2 });
      // ince beyaz kafes (baklava ağı)
      ctx.save();
      ctx.clip(yol);
      for (let x = q.x1 - 60; x < q.x2 + 60; x += 14) {
        cizgi([[x, q.y2], [x + 55, q.y1]], 0.55, 'rgba(255,255,255,0.7)', { taper: 0, amp: 0.1 });
        cizgi([[x, q.y1], [x + 55, q.y2]], 0.55, 'rgba(255,255,255,0.7)', { taper: 0, amp: 0.1 });
      }
      ctx.restore();
    } else {
      alan(d, YESIL, { box: [q.x1, q.y1, q.x2, q.y2], ara: 5, uzun: [24, 50], gen: [6, 9], aci: () => Math.PI / 2, oyna: 0.22, renkF: (x) => ((x - 560) / 226 < -0.45 ? hx('#22744A') : (x - 560) / 226 > 0.2 ? hx('#3C9E68') : hx(YESIL)), alfa: [0.65, 0.92], amp: 0.2 });
    }
    for (const p of S.kasnakPencereleri(kat)) {
      const wd = S.kemerYolu(p.x, p.y, p.w, p.h);
      if (kat === 1) doldur(S.kemerYolu(p.x, p.y - 3, p.w + 6, p.h + 3), FIRUZE, 0.15);
      doldur(wd, '#22304A', 0.15);
      cizgi(wd, 0.7, ALTIN);
    }
    cizgi([[q.x1, q.y1 + 0.5], [q.x2, q.y1 + 0.5]], 1.4, ALTIN);
    cizgi(d, 1.7, KONTUR, { press: 0.65, amp: 0.45 });
  }
  // ---- kubbe: düz yeşil, ince vuruş izi; altın kaburgalar; kaburga aralarında küçük altın noktalar
  {
    const kd = S.kubbeYolu;
    const meridyenAci = (x, y) => {
      const r = Math.max(1, H.kubbeR(y));
      const u = H.clamp((x - 560) / r, -1, 1);
      const dr = (H.kubbeR(y - 1) - H.kubbeR(y + 1)) / 2;
      return Math.atan2(1, u * -dr);
    };
    alan(kd, YESIL, {
      box: [360, 300, 760, 556],
      ara: 6,
      uzun: [40, 80],
      gen: [6, 10],
      aci: meridyenAci,
      renkF: (x, y) => {
        // dilim dilim: sol üçte bir belirgin koyu, sağ yan açık; her dilimin fırçası azıcık farklı
        const l = H.kubbeIsik(x, y);
        const r0 = Math.max(1, H.kubbeR(y));
        const dilim = Math.floor(((Math.asin(H.clamp((x - 560) / r0, -1, 1)) + Math.PI / 2) / Math.PI) * 16);
        const c = l < 0.3 ? hx('#1F6E44') : l > 0.7 ? hx('#43A56F') : H.mix(hx('#1F6E44'), hx('#43A56F'), ((l - 0.3) / 0.4) * 0.75);
        return c.map((v) => v * (dilim % 2 ? 1.04 : 0.965));
      },
      oyna: 0.22,
      alfa: [0.65, 0.92],
      amp: 0.3,
    });
    const kb = S.kaburgalar(16);
    for (const k of kb) cizgi(k.noktalar.slice().reverse(), 0.9, ALTIN, { taper: 0, amp: 0.15 });
    // kaburga aralarında altın nokta dizileri (kubbe eteğine yakın)
    const us = [-1].concat(kb.map((k) => k.u), [1]);
    for (let g = 0; g < us.length - 1; g++) {
      const um = (us[g] + us[g + 1]) / 2;
      for (let y = 540; y > 380; y -= 22) {
        const x = 560 + um * H.kubbeR(y);
        if (Math.abs(um) > 0.93) continue;
        ctx.fillStyle = ALTIN;
        nokta(ctx, x, y, 1.4);
        ak.fillStyle = '#fff';
        nokta(ak, x, y, 1.4);
      }
    }
    cizgi(kd, 2.2, ALTIN, { press: 0.6 });
    cizgi([[362, 551], [758, 551]], 1.2, ALTIN);
  }
  function alemCiz(a) {
    const ys = [S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), H.kutu(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)), S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
    for (const d of ys) altinDoldur(d);
    for (const d of ys) cizgi(d, 0.55, 'rgba(110,80,30,0.85)', { taper: 0, amp: 0.1 });
  }
  alemCiz(S.alemParcalari(560, 300, 1));
  alemCiz(MP.find((p) => p.tip === 'alem').alem);

  // ================================================================ BADEM AĞAÇÇIKLARI: koyu dallar, beyaz-pembe çiçekler
  function bademAgaci(x0, y0, yon, seed, xmin, xmax) {
    const rr = S.rng(seed);
    const dallar = [];
    const dal = (x, y, a, L, w, d) => {
      const pts = [[x, y]];
      let px = x;
      let py = y;
      let aa = a;
      const n = Math.max(4, Math.round(L / 8));
      for (let i = 0; i < n; i++) {
        aa += (rr() - 0.5) * 0.3;
        // dik büyüsün, yanlara taşmasın
        aa += (-Math.PI / 2 - aa) * 0.08;
        px += Math.cos(aa) * (L / n);
        py += Math.sin(aa) * (L / n);
        px = H.clamp(px, xmin, xmax);
        pts.push([px, py]);
      }
      dallar.push({ pts, w, d });
      if (d < 3) {
        const k = d === 0 ? 4 : 2;
        for (let j = 0; j < k; j++) {
          const i = Math.floor(n * (d === 0 ? 0.3 + 0.55 * (j / (k - 1)) : 0.35 + 0.5 * rr()));
          const [bx, by] = pts[i];
          dal(bx, by, aa + (j % 2 ? 1 : -1) * (0.35 + rr() * 0.3), L * (0.5 + rr() * 0.2), w * 0.6, d + 1);
        }
      }
    };
    dal(x0, y0, -Math.PI / 2 + yon * 0.1, 236, 8, 0);
    for (const d of dallar) H.firca(ctx, d.pts, { w: d.w, color: '#5B4636', bas: 0.0, uc: 0.6, jit: 0.25, seed: T() });
    for (const d of dallar) H.firca(ctx, d.pts.map(([x, y]) => [x + d.w * 0.2, y]), { w: d.w * 0.3, color: 'rgba(140,110,90,0.6)', bas: 0.1, uc: 0.6, seed: T() });
    // küçük yeşil yapraklar
    for (const d of dallar) {
      for (let i = 1; i < d.pts.length; i += 2) {
        if (rr() < 0.55) continue;
        const [x, y] = d.pts[i];
        const a = -Math.PI / 2 + (rr() - 0.5) * 2.4;
        const pts = H.yaprakNoktalari(x, y, a, 10, 4.4, 0.3, 6);
        ctx.fillStyle = '#4C8F5E';
        ctx.fill(H.polyPath(pts, true));
      }
    }
    // çiçekler: beş yapraklı, beyaz ve pembe; ince dallarda ve uçlarda
    for (const d of dallar) {
      if (d.d === 0) continue;
      for (let i = 1; i < d.pts.length; i++) {
        if (rr() < 0.35) continue;
        const [x, y] = d.pts[i];
        const ox = x + (rr() - 0.5) * 10;
        const oy = y + (rr() - 0.5) * 9;
        const r = 5.4 + rr() * 2.4;
        const pembe = rr() < 0.45;
        const aci = rr() * Math.PI;
        for (let k = 0; k < 5; k++) {
          const a = aci + (k / 5) * Math.PI * 2;
          ctx.fillStyle = pembe ? '#F0C3CF' : '#FFFFFF';
          ctx.beginPath();
          ctx.ellipse(ox + Math.cos(a) * r * 0.6, oy + Math.sin(a) * r * 0.6, r * 0.55, r * 0.42, a, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = pembe ? 'rgba(190,110,130,0.7)' : 'rgba(150,140,160,0.7)';
        ctx.lineWidth = 0.55;
        for (let k = 0; k < 5; k++) {
          const a = aci + (k / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(ox + Math.cos(a) * r * 0.6, oy + Math.sin(a) * r * 0.6, r * 0.55, r * 0.42, a, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = '#D9576E';
        nokta(ctx, ox, oy, r * 0.2);
      }
    }
  }
  bademAgaci(118, 1000, -1, 22511, 20, 232);
  bademAgaci(222, 990, 1, 22512, 150, 262);
  bademAgaci(906, 1000, 1, 22513, 796, 1004);
  bademAgaci(802, 990, -1, 22514, 772, 880);

  // ================================================================ ÖN: büyük beyaz güller ve tek tek boyanmış yapraklar
  function yaprakcik(x, y, aci, L) {
    const pts = H.yaprakNoktalari(x, y, aci, L, L * 0.4, 0.4, 10);
    const yol = H.polyPath(pts, true);
    ctx.fillStyle = '#2E7A4E';
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    ctx.globalAlpha = 0.6;
    const ca = Math.cos(aci);
    const sa = Math.sin(aci);
    H.firca(ctx, [[x - sa * L * 0.08, y + ca * L * 0.08], [x + ca * L - sa * L * 0.04, y + sa * L + ca * L * 0.04]], { w: L * 0.18, color: '#5FAA72', bas: 0.1, uc: 0.6, seed: T() });
    ctx.restore();
    ctx.globalAlpha = 1;
    cizgi([[x, y], [x + ca * L * 0.85, y + sa * L * 0.85]], 0.45, 'rgba(200,235,200,0.7)', { taper: 0.4, amp: 0 });
    cizgi(pts.concat([pts[0]]), 0.5, 'rgba(25,60,40,0.8)', { taper: 0, amp: 0.05 });
  }
  function beyazGul(x, y, r) {
    const rr = S.rng(Math.floor(x * 7 + y));
    // yaprak çelengi
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * 0.15 + (i / 6) * Math.PI * 0.7 + (rr() - 0.5) * 0.2;
      yaprakcik(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, a + (rr() - 0.5) * 0.3, r * (0.85 + rr() * 0.3));
    }
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI * 0.15 - (i / 3) * Math.PI * 0.7;
      yaprakcik(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, a, r * 0.7);
    }
    // taç halkaları: dış beş taç, iç halka, ortada altın-sarı göbek
    const halka = (R, n, faz, renk, kont) => {
      for (let i = 0; i < n; i++) {
        const a = faz + (i / n) * Math.PI * 2;
        const cx = x + Math.cos(a) * R * 0.5;
        const cy = y + Math.sin(a) * R * 0.5;
        const d = S.elipsYolu({ cx, cy, rx: R * 0.55, ry: R * 0.45, aci: a });
        const p = doldur(d, renk, 0.2);
        ctx.save();
        ctx.clip(p);
        // iki-üç tonlu taç: dipte serin gri gölge, ortada sıcak beyaz, kenarda saf beyaz vuruş
        ctx.globalAlpha = 0.8;
        H.firca(ctx, [[x, y], [x + Math.cos(a) * R * 0.75, y + Math.sin(a) * R * 0.75]], { w: R * 0.34, color: '#DAD9D3', bas: 0.05, uc: 0.6, seed: T() });
        const yan = Math.cos(a + 0.9);
        ctx.globalAlpha = 0.9;
        H.firca(ctx, [[cx + Math.cos(a + 1.3) * R * 0.3, cy + Math.sin(a + 1.3) * R * 0.3], [x + Math.cos(a) * R * 1.02, y + Math.sin(a) * R * 1.02], [cx + Math.cos(a - 1.3) * R * 0.3, cy + Math.sin(a - 1.3) * R * 0.3]], { w: R * 0.12, color: yan > 0 ? '#FFFFFF' : '#F1EEE6', bas: 0.2, uc: 0.3, seed: T() });
        ctx.restore();
        ctx.globalAlpha = 1;
        cizgi(d, 0.6, kont, { taper: 0, amp: 0.1 });
      }
    };
    halka(r, 6, rr(), '#FBFAF4', 'rgba(120,110,120,0.75)');
    halka(r * 0.68, 5, rr() + 0.6, '#FFFFFF', 'rgba(140,120,130,0.7)');
    halka(r * 0.4, 5, rr() + 1.2, '#FCEFF1', 'rgba(170,120,135,0.7)');
    // göbek: soluk pembe gonca, içinde kıvrık çizgi ve küçük altın nokta
    doldur(S.daireYolu(x, y, r * 0.14), '#F3C9D2', 0.1);
    cizgi([[x - r * 0.08, y + r * 0.02], [x, y - r * 0.07], [x + r * 0.08, y + r * 0.01]], 0.6, 'rgba(170,90,110,0.85)', { taper: 0.3, amp: 0 });
    ctx.fillStyle = ALTIN;
    nokta(ctx, x, y + r * 0.03, Math.max(1, r * 0.035));
  }
  {
    const C = S.bitki.cicekler.slice(4);
    // arka sıradaki küçük beyaz ve pembe çiçekler, sonra büyük beyaz güller
    for (const c of C.slice(0, 4)) beyazGul(c.x, c.y, c.r * 0.85);
    for (const c of C.slice(4)) beyazGul(c.x, c.y, c.r * 0.72);
    // tomurcuklar: kısa saplı pembe goncalar
    S.bitki.tomurcuklar.slice(8).forEach((t) => {
      H.firca(ctx, [[t.x, t.y + 16], [t.x, t.y]], { w: 1.8, color: '#3F7F52', seed: T() });
      yaprakcik(t.x, t.y + 12, -Math.PI / 2 - 0.9, 11);
      yaprakcik(t.x, t.y + 12, -Math.PI / 2 + 0.9, 11);
      const d = S.tomurcukYolu({ x: t.x, y: t.y, r: t.r * 0.8, aci: -Math.PI / 2 });
      doldur(d, '#F0C3CF', 0.15);
      cizgi(d, 0.5, 'rgba(160,90,110,0.8)', { taper: 0 });
    });
  }

  // ================================================================ BİLEŞİM: mühreli kâğıt; altının tanesi
  {
    const img = ctx.getImageData(0, 0, N, N);
    const o = img.data;
    const av = ak.getImageData(0, 0, N, N).data;
    const doku = H.kagitDoku(2254, 2.2, 30);
    const n1 = H.noise(2255);
    const n2 = H.noise(2256);
    const AL = hx(ALTIN);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const p = y * N + x;
        const i = p * 4;
        const h = doku[p];
        const s = 1 + 0.035 * (h - 0.5) + 0.02 * n1(x / 130, y / 130) + 0.01 * n2(x / 70 + 20, y / 70);
        let r = o[i] * s;
        let g = o[i + 1] * s;
        let b = o[i + 2] * s;
        const a = av[i + 3] / 255;
        if (a > 0.003) {
          const dist = Math.abs(o[i] - AL[0]) + Math.abs(o[i + 1] - AL[1]) + Math.abs(o[i + 2] - AL[2]);
          const w = a * H.clamp(1 - dist / 140, 0, 1);
          if (w > 0.002) {
            const k = 0.88 + 0.24 * (0.5 + 0.5 * n2(x / 1.7, y / 1.7)) + 0.12 * H.smooth(0.3, 0.9, n1(x / 8 + 50, y / 8));
            r += (r * k - r) * w;
            g += (g * k - g) * w;
            b += (b * k * 0.96 - b) * w;
          }
        }
        o[i] = r;
        o[i + 1] = g;
        o[i + 2] = b;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
</script>
