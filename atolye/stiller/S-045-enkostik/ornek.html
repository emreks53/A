<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-045 Enkostik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #2a1c10; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-045 Enkostik — sıcak, pigmentli balmumuyla ahşap panoya boyama: üst üste eritilip kaynaştırılmış saydam mum
// katları derinlik ve içten bir ışıltı verir. Isıyla pürüzsüzleşmiş alanların yanında fırçayla yığılmış dokulu,
// kazıyıcıyla sıyrılmış ve damlatılmış bölümler; biçim kenarlarında göllenmiş mum sırtları, oyulup koyu boyayla
// doldurulmuş çizgiler, yumuşak bulanık kenarlar ve saten parlaklık.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const css = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Değer gürültüsü (0..1), 256'lık döşemeli tablo. */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32, w×h), yalnız [y0,y1] satır aralığında. */
  function kutu(src, w, h, r, y0, y1) {
    y0 = Math.max(0, y0 || 0); y1 = Math.min(h - 1, y1 === undefined ? h - 1 : y1);
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    const ya = Math.max(0, y0 - r), yb = Math.min(h - 1, y1 + r);
    for (let y = ya; y <= yb; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = y0 - r; y <= y0 + r; y++) acc += tmp[clamp(y, ya, yb) * w + x];
      for (let y = y0; y <= y1; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(yb, y + r + 1) * w + x] - tmp[Math.max(ya, y - r) * w + x]; }
    }
    return out;
  }
  function bulanik(src, w, h, r, gecis, y0, y1) {
    let a = src;
    for (let g = 0; g < (gecis || 3); g++) a = kutu(a, w, h, r, y0 === undefined ? 0 : y0 - r * 3, y1 === undefined ? h - 1 : y1 + r * 3);
    return a;
  }
  /** Tuvale çizilen biçimlerden kapsama maskesi (0..1). s: ölçek. Dönen: {m, y0, y1} (piksel satırları). */
  function maskeYap(s, ciz) {
    const n = W * s, c = SAHNE.yeniTuval(n, n), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(s, 0, 0, s, 0, 0);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    ciz(g);
    const d = g.getImageData(0, 0, n, n).data, m = new Float32Array(n * n);
    let y0 = n, y1 = -1;
    for (let y = 0; y < n; y++) {
      let var_ = false; const o = y * n;
      for (let x = 0; x < n; x++) { const a = d[(o + x) * 4 + 3]; if (a) { m[o + x] = a / 255; var_ = true; } }
      if (var_) { if (y < y0) y0 = y; y1 = y; }
    }
    return { m, y0, y1 };
  }
  // ------------------------------------------------------------ ışık modeli (ışık sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const KUBBE = (() => {
    const prof = SAHNE.kubbeProfili(800), adim = 4, R = new Float32Array(256 * adim + 1), D = new Float32Array(256 * adim + 1);
    for (let k = 0; k <= 255 * adim; k++) {
      const y = 300 + k / adim;
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
      R[k] = a.r + (b.r - a.r) * t;
    }
    for (let k = 1; k < 255 * adim; k++) D[k] = (R[k + 1] - R[k - 1]) * adim / 2;
    D[0] = D[1] * 1.4; D[255 * adim] = D[255 * adim - 1];
    const ix = (y) => clamp(Math.round((y - 300) * adim), 0, 255 * adim);
    return {
      r: (y) => R[ix(y)],
      u: (x, y) => clamp((x - 560) / Math.max(0.5, R[ix(y)]), -1, 1),
      normal(x, y) {
        const k = ix(y), u = clamp((x - 560) / Math.max(0.5, R[k]), -1, 1), c = Math.sqrt(1 - u * u), d = D[k], l = Math.hypot(u, d, c);
        return [u / l, -d / l, c / l];
      },
      isik(x, y) { const n = this.normal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); },
      /** kaburga fazı: boylamın 16 dilimdeki konumu (tam sayıya yakınsa kaburga çizgisi) */
      faz(x, y) { const u = this.u(x, y); return (Math.asin(u) + Math.PI / 2) / (Math.PI / 16); },
    };
  })();
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25;
    if (y >= 146) { const t = (200 - y) / 54; return Math.max(2, 24 * Math.sin(Math.min(1, t * 1.25) * Math.PI * 0.62 + 0.55) * (1 - t * 0.55)); }
    return 3;
  }
  const kasnakIsik = (x, y) => (y < 610 ? silindirIsik(x, 560, 208) : silindirIsik(x, 560, 226));

  const S = 2, WW = W * S, N = WW * WW;
  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, S);
  const Y = SAHNE.yollar();
  const P = (d) => new Path2D(d);
  const R = SAHNE.rng(4545);
  const nA = gurultu(81), nB = gurultu(82), nC = gurultu(83), nD = gurultu(84);

  // ------------------------------------------------------------ tamponlar
  const MUM = hex('#F3E3B8');
  const CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N), H = new Float32Array(N);
  const GN = new Float32Array(N), GL = new Float32Array(N);
  for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x, X = x / S, Yy = y / S;
    GN[i] = fbm(nA, X / 6, Yy / 6, 3);
    GL[i] = fbm(nB, X / 90, Yy / 90, 3);
  }
  function katman(mk, renk, o) {
    o = o || {};
    const yum = o.yum === undefined ? 4 : o.yum, op = o.op === undefined ? 0.85 : o.op, sut = o.sut === undefined ? 0.06 : o.sut;
    const kal = o.kal === undefined ? 0.3 : o.kal, kaba = o.kaba === undefined ? 0.3 : o.kaba;
    if (mk.y1 < 0) return;
    const y0 = Math.max(0, mk.y0 - 16), y1 = Math.min(WW - 1, mk.y1 + 16);
    const mb = yum ? bulanik(mk.m, WW, WW, yum, 2, y0, y1) : mk.m;
    const fn = typeof renk === 'function';
    let c = renk;
    for (let y = y0; y <= y1; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x, v = mb[i];
      if (v < 0.01) continue;
      const t = 0.5 + (GN[i] - 0.5) * kaba;
      let a = sstep(t - 0.35, t + 0.35, v);
      if (fn) { c = renk(x / S, y / S, i); if (!c) continue; if (c.length > 3) a *= c[3]; }
      a *= op;
      if (a <= 0.003) continue;
      // saydam mum: alttaki renk biraz görünür, mum katı süt gibi hafif bulanıklaştırır
      CR[i] += (c[0] - CR[i]) * a; CG[i] += (c[1] - CG[i]) * a; CB[i] += (c[2] - CB[i]) * a;
      CR[i] += (MUM[0] - CR[i]) * a * sut; CG[i] += (MUM[1] - CG[i]) * a * sut; CB[i] += (MUM[2] - CB[i]) * a * sut;
      H[i] += a * kal;
    }
  }
  const maske = (f) => maskeYap(S, f);
  const tumu = { m: new Float32Array(N).fill(1), y0: 0, y1: WW - 1 };
  function kosul(temel, f) {
    const m = new Float32Array(N);
    for (let y = temel.y0; y <= temel.y1; y++) for (let x = 0; x < WW; x++) { const i = y * WW + x; if (temel.m[i] > 0) m[i] = temel.m[i] * f(x / S, y / S, i); }
    return { m, y0: temel.y0, y1: temel.y1 };
  }
  const birlesik = (dizi) => { const p = new Path2D(); dizi.forEach((d) => p.addPath(P(d))); return p; };

  // ------------------------------------------------------------ 1. alt kat: sıcak okra mum ve renk blokları
  katman(tumu, (x, y) => {
    if (y < 800) return rampa([[0, [206, 118, 58]], [0.45, [232, 176, 80]], [0.85, [244, 212, 128]], [1, [238, 196, 120]]], y / 800 + (GL[0] - 0.5) * 0.1);
    return [178, 92, 46];
  }, { yum: 0, op: 1, sut: 0, kal: 0.4 });
  const kubbeP = P(Y.kubbe), kasnakP = birlesik([Y.kasnakUst, Y.kasnakAlt]), kaideP = birlesik([Y.kaide, Y.kornis]), minareP = birlesik(Y.minare);
  katman(maske((g) => g.fill(kubbeP)), [196, 196, 74], { yum: 3, op: 0.9 });
  katman(maske((g) => g.fill(kasnakP)), [140, 150, 60], { yum: 3, op: 0.9 });
  katman(maske((g) => { g.fill(kaideP); g.fill(minareP); }), [234, 204, 146], { yum: 3, op: 0.9 });
  const ALT = { R: CR.slice(), G: CG.slice(), B: CB.slice() }; // kazıyıcı bu kata kadar sıyırır

  // ------------------------------------------------------------ 2. ana renkler: saydam turkuaz gök, ışıltılı güneş
  katman(tumu, (x, y, i) => {
    if (y > 806) return null;
    const t = y / 800 + (GL[i] - 0.5) * 0.12;
    const c = rampa([[0, [22, 84, 128]], [0.35, [46, 140, 172]], [0.62, [112, 192, 190]], [0.85, [226, 222, 176]], [1, [242, 214, 160]]], t);
    const d = Math.hypot(x - 880, y - 140);
    const isilti = Math.exp(-(d * d) / (2 * 150 * 150));
    return [...mixc(c, [250, 196, 92], isilti * 0.85), 0.86 - 0.2 * isilti];
  }, { yum: 0, op: 1, sut: 0.04, kal: 0.5 });
  // sütlü beyaz mum perdeleri
  katman(kosul(tumu, (x, y, i) => (y < 760 ? sstep(0.56, 0.7, fbm(nC, x / 120, y / 60, 3)) : 0)), [236, 232, 212], { yum: 0, op: 0.28, sut: 0.1, kal: 0.25 });
  // derinlik: alt kattan sızan sıcak ışık ve serin sır lekeleri
  katman(kosul(tumu, (x, y) => (y < 790 ? sstep(0.55, 0.75, fbm(nD, x / 140, y / 110, 3)) : 0)), [236, 150, 92], { yum: 0, op: 0.35, sut: 0.02, kal: 0.15 });
  katman(kosul(tumu, (x, y) => (y < 560 ? sstep(0.5, 0.72, fbm(nA, x / 160 + 7, y / 120, 3)) * sstep(700, 200, x) : 0)), [18, 70, 112], { yum: 0, op: 0.4, sut: 0.02, kal: 0.15 });
  // güneş: koyu sarı hale ve parlak disk, kenarında göllenmiş mum
  const gunesM = maske((g) => g.fill(P(SAHNE.daireYolu(880, 140, 62))));
  katman(maske((g) => g.fill(P(SAHNE.daireYolu(880, 140, 92)))), [246, 172, 64], { yum: 8, op: 0.55, kal: 0.3 });
  katman(gunesM, [255, 226, 128], { yum: 3, op: 0.95, kal: 0.6 });
  katman(maske((g) => g.fill(P(SAHNE.daireYolu(888, 132, 34)))), [255, 246, 206], { yum: 6, op: 0.8, kal: 0.3 });
  // bulutlar: kalın, yumuşak beyaz mum yığınları
  const BULUT = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
  const bulutCiz = (g, kx, ky, olc) => {
    for (const [bx, by, bs] of BULUT) {
      const rb = SAHNE.rng(Math.round(bx * 3 + by));
      for (let k = 0; k < 9; k++) { g.beginPath(); g.ellipse(bx + (rb() - 0.5) * 170 * bs + kx, by + (rb() - 0.5) * 26 * bs + ky, (34 + rb() * 30) * bs * olc, (16 + rb() * 12) * bs * olc, 0, 0, Math.PI * 2); g.fill(); }
    }
  };
  const bulutM = maske((g) => bulutCiz(g, 0, 0, 1));
  katman(bulutM, [206, 210, 208], { yum: 10, op: 0.6, kal: 0.12, kaba: 0.6 });
  katman(maske((g) => bulutCiz(g, 4, -6, 0.78)), [252, 248, 236], { yum: 9, op: 0.75, kal: 0.12, kaba: 0.6 });

  // ------------------------------------------------------------ yapı
  katman(maske((g) => g.fill(minareP)), (x, y) => {
    const l = silindirIsik(x, 300, minareYari(y));
    let c = mixc([176, 150, 120], [250, 236, 206], sstep(0.15, 0.75, l));
    if ((y > 468 && y < 488) || (y > 300 && y < 316)) c = mixc(c, [130, 104, 86], 0.45);
    return c;
  }, { yum: 3, op: 0.92, kal: 0.15 });
  katman(maske((g) => { for (const [x1, x2, y1, y2] of [[252, 348, 436, 456], [260, 340, 272, 290]]) for (let k = 0; k < 9; k++) { const x = x1 + 5 + ((x2 - x1 - 10) * (k + 0.5)) / 9; g.fillRect(x - 1.8, y1 + 4, 3.6, y2 - y1 - 8); } }), [120, 92, 72], { yum: 1, op: 0.8, kal: 0.1 });
  katman(maske((g) => { g.lineWidth = 3; for (const z of SAHNE.zikzakCizgileri()) g.stroke(P(SAHNE.yol(z))); }), [180, 76, 48], { yum: 1, op: 0.85, kal: 0.1 });
  katman(maske((g) => g.fill(P(Y.kaide))), (x, y) => (y < 714 ? [214, 186, 146] : mixc([210, 180, 140], [252, 238, 206], sstep(320, 760, x))), { yum: 3, op: 0.92, kal: 0.15 });
  katman(maske((g) => g.fill(P(Y.kornis))), (x, y) => (y < 698 ? [255, 246, 222] : [190, 160, 120]), { yum: 1, op: 0.95, kal: 0.15 });
  katman(maske((g) => { Y.kaidePencereleri.forEach((d) => g.fill(P(d))); Y.minarePencereleri.forEach((d) => g.fill(P(d))); }), [88, 52, 40], { yum: 1, op: 0.85, kal: 0 });
  katman(maske((g) => g.fill(kasnakP)), (x, y) => { const l = kasnakIsik(x, y); return mixc([12, 52, 40], [44, 120, 72], sstep(0.15, 0.8, l)); }, { yum: 3, op: 0.88, kal: 0.15 });
  katman(maske((g) => { g.fillRect(352, 555, 416, 3.5); g.fillRect(334, 610, 452, 3.5); }), [110, 170, 96], { yum: 1, op: 0.8, kal: 0.2 });
  katman(maske((g) => Y.kasnakPencereleri.forEach((d) => g.fill(P(d)))), [8, 30, 24], { yum: 1, op: 0.9, kal: 0 });
  // kubbe: sarı-yeşil alt katın üstüne saydam zümrüt, ışıkta açık mum, gölgede koyu sır
  const kubbeM = maske((g) => g.fill(kubbeP));
  katman(kubbeM, (x, y) => { const l = KUBBE.isik(x, y); return [...mixc([10, 70, 50], [30, 122, 70], sstep(0.1, 0.7, l)), 0.86]; }, { yum: 3, op: 1, kal: 0.2 });
  katman(kosul(kubbeM, (x, y) => sstep(0.68, 0.9, KUBBE.isik(x, y))), [150, 206, 112], { yum: 4, op: 0.6, kal: 0.3 });
  katman(kosul(kubbeM, (x, y) => sstep(0.86, 0.96, KUBBE.isik(x, y) + (nC(x / 30, y / 30) - 0.5) * 0.1)), [232, 244, 186], { yum: 5, op: 0.55, kal: 0.25 });
  katman(maske((g) => { Y.alem.forEach((d) => g.fill(P(d))); Y.minareAlem.forEach((d) => g.fill(P(d))); }), (x) => { const cx = x > 430 ? 560 : 300; return mixc([180, 110, 30], [255, 220, 120], sstep(-3, 4, x - cx)); }, { yum: 1, op: 0.95, kal: 0.5 });

  // ------------------------------------------------------------ yer: sıyena, dokulu yeşil mum
  katman(maske((g) => g.fillRect(0, 798, W, 226)), (x, y, i) => (y < 826 ? [206, 128, 64] : [...rampa([[0, [44, 96, 52]], [0.5, [92, 140, 62]], [0.75, [170, 160, 72]], [1, [214, 150, 70]]], fbm(nD, x / 60, y / 36, 3)), 0.82]), { yum: 3, op: 0.92, kal: 0.15 });
  katman(maske((g) => { g.beginPath(); g.moveTo(300, 800); g.lineTo(820, 800); g.lineTo(792, 822); g.lineTo(240, 822); g.closePath(); g.fill(); }), [132, 66, 36], { yum: 4, op: 0.6, kal: 0 });

  // yapı maskesi: kazıma ve fırça yığınları yapının üstüne taşmaz
  const yapiM = maske((g) => { g.fill(minareP); g.fill(kaideP); g.fill(kasnakP); g.fill(kubbeP); Y.alem.forEach((d) => g.fill(P(d))); Y.minareAlem.forEach((d) => g.fill(P(d))); });
  const yb = bulanik(yapiM.m, WW, WW, 3, 2);
  // ------------------------------------------------------------ kazıyıcı: gökte ve yerde, alt kat şeritler hâlinde açılır
  {
    const a = -0.32, ca = Math.cos(a), sa = Math.sin(a);
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x, X = x / S, Yy = y / S;
      const bolge = Math.max(sstep(150, 60, Math.hypot((X - 150) * 0.6, Yy - 640)), sstep(150, 60, Math.hypot((X - 930) * 0.7, Yy - 640)), sstep(120, 40, Math.hypot((X - 640) * 0.5, Yy - 60)));
      if (bolge <= 0.01 || yb[i] > 0.6) continue;
      const u = X * ca + Yy * sa, v = -X * sa + Yy * ca;
      const serit = nA(u / 70, v / 3.2) * 0.7 + nC(u / 20, v / 1.4) * 0.3;
      const k = sstep(0.48, 0.56, serit) * bolge * (1 - sstep(0.05, 0.5, yb[i]));
      if (k <= 0) continue;
      CR[i] += (ALT.R[i] - CR[i]) * k * 0.9; CG[i] += (ALT.G[i] - CG[i]) * k * 0.9; CB[i] += (ALT.B[i] - CB[i]) * k * 0.9;
      H[i] -= k * 0.5;
    }
  }

  // ------------------------------------------------------------ bitkiler: mum lekeleri
  const B = SAHNE.bitki;
  katman(maske((g) => { g.lineWidth = 3.8; g.lineCap = 'round'; Y.saplar.forEach((d) => g.stroke(P(d))); }), [62, 96, 46], { yum: 1, op: 0.9, kal: 0.3 });
  katman(maske((g) => Y.yapraklar.forEach((d) => g.fill(P(d)))), (x, y) => [52, 98, 50], { yum: 2, op: 0.88, kal: 0.6 });
  katman(maske((g) => B.yapraklar.forEach((y) => { const L = y.uzunluk, tr = Math.sin(y.aci) * 0.74 + Math.cos(y.aci) * 0.67 > 0 ? -1 : 1; g.beginPath(); g.ellipse(y.x + Math.cos(y.aci) * L * 0.45 - Math.sin(y.aci) * tr * L * 0.1, y.y + Math.sin(y.aci) * L * 0.45 + Math.cos(y.aci) * tr * L * 0.1, L * 0.36, L * 0.1, y.aci, 0, Math.PI * 2); g.fill(); })), [150, 186, 92], { yum: 3, op: 0.6, kal: 0.2 });
  katman(maske((g) => Y.tomurcuklar.forEach((d) => g.fill(P(d)))), [214, 104, 112], { yum: 2, op: 0.9, kal: 0.5 });
  const cicekM = maske((g) => B.cicekler.forEach((c) => SAHNE.tacYapraklari(c).forEach((e) => g.fill(P(SAHNE.elipsYolu(e))))));
  katman(cicekM, [220, 206, 196], { yum: 3, op: 0.92, kal: 0.6 });
  katman(maske((g) => B.cicekler.forEach((c) => SAHNE.tacYapraklari(c).forEach((e) => { g.beginPath(); g.ellipse(e.cx + c.r * 0.06, e.cy - c.r * 0.06, e.rx * 0.8, e.ry * 0.78, e.aci, 0, Math.PI * 2); g.fill(); }))), [254, 248, 236], { yum: 3, op: 0.9, kal: 0.4 });
  katman(maske((g) => B.cicekler.forEach((c) => { g.beginPath(); g.arc(c.x, c.y, c.r * 0.4, 0, Math.PI * 2); g.fill(); })), [236, 150, 156], { yum: 4, op: 0.45, kal: 0.1 });
  katman(maske((g) => B.cicekler.forEach((c) => { g.beginPath(); g.arc(c.x, c.y, c.r * 0.19, 0, Math.PI * 2); g.fill(); })), [236, 160, 50], { yum: 1, op: 0.95, kal: 0.7 });

  // ------------------------------------------------------------ dokulu fırça yığınları ve damlalar (yükseklik)
  {
    const c = SAHNE.yeniTuval(WW, WW), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0); g.lineCap = 'round';
    const rv = SAHNE.rng(61);
    // fırçayla yığılmış mum: sol üst gökte, yerde ve çayırda kısa kalın darbeler
    const bolgeA = (x, y) => sstep(210, 120, Math.hypot((x - 120) * 0.8, y - 600)) + sstep(170, 90, Math.hypot((x - 960) * 0.9, y - 560)) * 0.8;
    for (let k = 0; k < 9000; k++) {
      const x = rv() * W, y = 480 + rv() * 544;
      const z = y > 832 ? 0.5 * sstep(0.4, 0.6, fbm(nB, x / 90, y / 90, 2)) + 0.15 : bolgeA(x, y);
      if (rv() > z) continue;
      const a = y > 832 ? -Math.PI / 2 + (rv() - 0.5) * 1.4 : -0.3 + (rv() - 0.5) * 0.9, l = 10 + rv() * 26;
      g.strokeStyle = `rgba(255,255,255,${0.12 + rv() * 0.2})`; g.lineWidth = 5 + rv() * 9;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (rv() - 0.5) * 6, y + Math.sin(a) * l * 0.5 + (rv() - 0.5) * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    const d = g.getImageData(0, 0, WW, WW).data, t = new Float32Array(N);
    for (let i = 0; i < N; i++) t[i] = d[i * 4 + 3] / 255;
    const tb = bulanik(t, WW, WW, 2, 2);
    for (let i = 0; i < N; i++) H[i] += tb[i] * 1.5 * (1 - sstep(0.05, 0.5, yb[i]));
  }
  // sır perdelerinin kenarında göllenmiş mum: perde sınırları boyunca ince, parlak sırtlar (yalnız gökte)
  {
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x, X = x / S, Yy = y / S;
      if (Yy > 790) continue;
      const gz = 1 - sstep(0.02, 0.3, yb[i]);
      if (gz <= 0) continue;
      const f1 = fbm(nC, X / 120, Yy / 60, 3), f2 = fbm(nD, X / 140, Yy / 110, 3), f3 = fbm(nA, X / 160 + 7, Yy / 120, 3);
      let sirt = Math.exp(-Math.pow((f1 - 0.63) / 0.01, 2)) * (Yy < 760 ? 1 : 0) + Math.exp(-Math.pow((f2 - 0.65) / 0.01, 2)) * 0.35 + Math.exp(-Math.pow((f3 - 0.61) / 0.01, 2)) * sstep(700, 200, X) * (Yy < 560 ? 0.6 : 0);
      sirt = Math.min(1, sirt) * gz;
      if (sirt < 0.01) continue;
      CR[i] += (MUM[0] - CR[i]) * sirt * 0.25; CG[i] += (MUM[1] - CG[i]) * sirt * 0.25; CB[i] += (MUM[2] - CB[i]) * sirt * 0.2;
      H[i] += sirt * 0.5;
    }
  }
  // ısıyla kaynaşmış pürüzsüz alanlar ve göllenmiş kenar sırtları
  {
    const kenarM = new Float32Array(N);
    const yukler = [kubbeM, gunesM, cicekM];
    for (const m of yukler) for (let i = 0; i < N; i++) kenarM[i] = Math.max(kenarM[i], m.m[i]);
    const kb = bulanik(kenarM, WW, WW, 4, 2);
    for (let i = 0; i < N; i++) { const v = kb[i]; H[i] += sstep(0.25, 0.5, v) * (1 - sstep(0.5, 0.85, v)) * 0.9; }
  }

  // ------------------------------------------------------------ yumuşak kenar: renk tamponu hafifçe bulanıklaşır
  { const r = bulanik(CR, WW, WW, 2, 2), g = bulanik(CG, WW, WW, 2, 2), b = bulanik(CB, WW, WW, 2, 2); CR.set(r); CG.set(g); CB.set(b); }

  // ------------------------------------------------------------ oyulmuş ve koyu boyayla doldurulmuş çizgiler
  {
    const c = SAHNE.yeniTuval(WW, WW), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0); g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    const cz = (pts, lw) => { g.lineWidth = lw; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x + (R() - 0.5) * 0.6, y + (R() - 0.5) * 0.6) : g.moveTo(x, y))); g.stroke(); };
    cz(SAHNE.kubbeNoktalari(80), 1.4);
    for (const k of SAHNE.kaburgalar(16, 40)) cz(k.noktalar.slice(0, -2), 1.05);
    for (const q of SAHNE.kasnak) cz([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2], [q.x1, q.y1]], 1.1);
    cz([[290, 692], [830, 692], [830, 704], [290, 704], [290, 692]], 1); cz([[300, 704], [300, 800]], 1); cz([[820, 704], [820, 800]], 1);
    for (const p of SAHNE.minareParcalari()) if (p.noktalar) cz([...p.noktalar, p.noktalar[0]], 0.9);
    // güneş çevresinde oyulmuş halkalar
    for (const r of [72, 84, 104]) { const pts = []; for (let k = 0; k <= 90; k++) { const a = (k / 90) * Math.PI * 1.7 + 2.2 + r * 0.03; pts.push([880 + Math.cos(a) * r, 140 + Math.sin(a) * r]); } cz(pts, 0.9); }
    const d = g.getImageData(0, 0, WW, WW).data;
    for (let i = 0; i < N; i++) {
      const a = d[i * 4 + 3] / 255; if (!a) continue;
      const k = a * 0.88;
      CR[i] += (34 - CR[i]) * k; CG[i] += (26 - CG[i]) * k; CB[i] += (30 - CB[i]) * k;
      H[i] -= a * 0.9;
    }
  }
  // damlalar: üst kenardan aşağı süzülen mum ve yere sıçramış damlacıklar
  {
    const c = SAHNE.yeniTuval(WW, WW), g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(S, 0, 0, S, 0, 0); g.lineCap = 'round';
    const rv = SAHNE.rng(71), damla = [];
    // kısa akıntılar: güneşin altından ve sağ kenardan süzülen birkaç mum izi
    for (const [x, y, l] of [[846, 206, 70], [902, 210, 46], [996, 40, 120], [70, 300, 60]]) damla.push([x, y, l, 4 + rv() * 3]);
    for (const [x, y, l, w] of damla) {
      // dalgalı, aşağı doğru incelip sonunda damla biriktiren iz
      const pts = []; for (let j = 0; j <= 20; j++) { const t = j / 20; pts.push([x + Math.sin(t * 5 + x) * 1.6, y + l * t]); }
      g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath();
      pts.forEach(([px, py], j) => { const ww = w * (0.55 + 0.45 * (1 - j / 20)); if (j) g.lineTo(px - ww / 2, py); else g.moveTo(px - ww / 2, py); });
      for (let j = 20; j >= 0; j--) { const ww = w * (0.55 + 0.45 * (1 - j / 20)); g.lineTo(pts[j][0] + ww / 2, pts[j][1]); }
      g.closePath(); g.fill();
      g.beginPath(); g.ellipse(pts[20][0], pts[20][1], w * 0.6, w * 0.75, 0, 0, Math.PI * 2); g.fill();
    }
    const sicrama = [];
    for (let k = 0; k < 60; k++) sicrama.push([40 + rv() * 944, 840 + rv() * 170, 1.2 + rv() * 3.4]);
    // gökte fırçadan damlamış mum benekleri (iki küme)
    for (const [cx, cy, n] of [[420, 90, 26], [130, 380, 20], [700, 470, 16]]) for (let k = 0; k < n; k++) { const a = rv() * Math.PI * 2, r = Math.pow(rv(), 0.7) * 70; sicrama.push([cx + Math.cos(a) * r * 1.4, cy + Math.sin(a) * r * 0.8, 1.4 + rv() * 4.2]); }
    for (const [x, y, r] of sicrama) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
    const d = g.getImageData(0, 0, WW, WW).data, t = new Float32Array(N);
    for (let i = 0; i < N; i++) t[i] = d[i * 4 + 3] / 255;
    const tb = bulanik(t, WW, WW, 2, 2);
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const i = y * WW + x, a = t[i]; if (!a && tb[i] < 0.01) continue;
      const Yy = y / S, renk = Yy > 830 ? [236, 200, 120] : [Math.min(255, CR[i] * 1.12 + 22), Math.min(255, CG[i] * 1.1 + 22), Math.min(255, CB[i] * 1.06 + 18)];
      const k = a * 0.45;
      CR[i] += (renk[0] - CR[i]) * k; CG[i] += (renk[1] - CG[i]) * k; CB[i] += (renk[2] - CB[i]) * k;
      H[i] += tb[i] * 0.8;
    }
  }

  // ------------------------------------------------------------ ışık: hafif dağınık gölge, saten parlama, mumun derinliği
  for (let i = 0; i < N; i++) H[i] += GL[i] * 0.8 + (GN[i] - 0.5) * 0.08;
  const Hb = bulanik(H, WW, WW, 3, 2);
  const Hv = [LV[0], LV[1], LV[2] + 1]; { const l = Math.hypot(...Hv); Hv[0] /= l; Hv[1] /= l; Hv[2] /= l; }
  const img = ctx.createImageData(WW, WW), d = img.data;
  for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x;
    const xa = x > 1 ? i - 2 : i, xb = x < WW - 2 ? i + 2 : i, ya = y > 1 ? i - 2 * WW : i, yb = y < WW - 2 ? i + 2 * WW : i;
    const gx = (Hb[xb] - Hb[xa]) * 2.2, gy = (Hb[yb] - Hb[ya]) * 2.2, nl = Math.hypot(gx, gy, 1);
    const dif = (-gx * LV[0] - gy * LV[1] + LV[2]) / nl;
    const sp = Math.pow(Math.max(0, (-gx * Hv[0] - gy * Hv[1] + Hv[2]) / nl), 20);
    const k = 1 + (dif - LV[2]) * 0.45;
    // içten ışıltı: kalın mumda renk biraz daha sıcak ve doygun
    const derin = clamp(H[i] * 0.12, 0, 0.12);
    const r = CR[i] * (1 + derin * 0.25), g = CG[i] * (1 + derin * 0.08), b = CB[i] * (1 - derin * 0.2);
    const par = sp * 50;
    d[i * 4] = clamp(r * k + par, 0, 255); d[i * 4 + 1] = clamp(g * k + par * 0.98, 0, 255); d[i * 4 + 2] = clamp(b * k + par * 0.9, 0, 255); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
