<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-206 Hollanda Şehir Manzarası — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-206 Hollanda Şehir Manzarası: kodla çizilmiş örnek görsel (hayalî bir ressamın eli).
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md. Bütün yardımcılar bu dosyanın içindedir.
// ===================================================================== j2 ortak çekirdek
// Ressamın eli için yardımcılar: gürültü, yol düzleştirme, fırça darbesi (kıl izleri, kuru uç,
// yükseklik haritası), bölge boyama, boya kabartısı ışığı, zemin dokusu ve el titremesi.
const S = SAHNE;
const K = {};
K.N = 2048; // iç çözünürlük
K.kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
K.karis = (a, b, t) => a + (b - a) * t;
K.yum = (e0, e1, x) => {
  const t = K.kenet((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
K.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
K.rk = (c, a) => `rgba(${K.kenet(c[0] | 0, 0, 255)},${K.kenet(c[1] | 0, 0, 255)},${K.kenet(c[2] | 0, 0, 255)},${a === undefined ? 1 : a})`;
K.rkar = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
K.kay = (c, d) => [c[0] + d, c[1] + d, c[2] + d];
/** Çok duraklı renk rampası: dur = [[t, [r,g,b]], ...] */
K.rampa = (dur) => (t) => {
  if (t <= dur[0][0]) return dur[0][1].slice();
  for (let i = 1; i < dur.length; i++) {
    if (t <= dur[i][0]) {
      const u = (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]);
      return K.rkar(dur[i - 1][1], dur[i][1], u);
    }
  }
  return dur[dur.length - 1][1].slice();
};

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
K.gurultu = function (tohum) {
  const r = S.rng(tohum);
  const P = new Uint16Array(512);
  const V = new Float32Array(256);
  const p = [];
  for (let i = 0; i < 256; i++) {
    p.push(i);
    V[i] = r();
  }
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = p[i];
    p[i] = p[j];
    p[j] = t;
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const n = (x, y) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = P[(xi & 255) + P[yi & 255]];
    const b = P[((xi + 1) & 255) + P[yi & 255]];
    const c = P[(xi & 255) + P[(yi + 1) & 255]];
    const d = P[((xi + 1) & 255) + P[(yi + 1) & 255]];
    return (V[a] * (1 - u) + V[b] * u) * (1 - v) + (V[c] * (1 - u) + V[d] * u) * v;
  };
  n.fbm = (x, y, o) => {
    o = o || 4;
    let s = 0;
    let a = 0.5;
    let t = 0;
    for (let i = 0; i < o; i++) {
      s += n(x, y) * a;
      t += a;
      x = x * 2.03 + 17.1;
      y = y * 2.03 + 9.7;
      a *= 0.5;
    }
    return s / t;
  };
  return n;
};

// --------------------------------------------------------------- SVG yolunu düzleştirme (M L C A Z)
K.duz = function (d, adim) {
  adim = adim || 2;
  const tok = d.match(/[MLCAZ]|-?\d*\.?\d+(?:e[-+]?\d+)?/g);
  const out = [];
  let cur = null;
  let i = 0;
  let x = 0;
  let y = 0;
  let cmd = 'M';
  const num = () => parseFloat(tok[i++]);
  while (i < tok.length) {
    if (/[MLCAZ]/.test(tok[i])) cmd = tok[i++];
    if (cmd === 'M') {
      x = num();
      y = num();
      cur = [[x, y]];
      out.push(cur);
      cmd = 'L';
    } else if (cmd === 'L') {
      x = num();
      y = num();
      cur.push([x, y]);
    } else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(3, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const t = k / n;
        const u = 1 - t;
        cur.push([u * u * u * x + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3]);
      }
      x = x3;
      y = y3;
    } else if (cmd === 'A') {
      const rx = num(), ry = num(), phi = (num() * Math.PI) / 180, fa = num(), fs = num(), x2 = num(), y2 = num();
      K.yay(x, y, rx, ry, phi, fa, fs, x2, y2, cur, adim);
      x = x2;
      y = y2;
    } else if (cmd === 'Z') {
      cmd = 'M';
      if (i < tok.length && !/[MLCAZ]/.test(tok[i])) i++;
    }
  }
  return out;
};
K.yay = function (x1, y1, rx, ry, phi, fa, fs, x2, y2, out, adim) {
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
  const x1p = cp * dx + sp * dy, y1p = -sp * dx + cp * dy;
  rx = Math.abs(rx);
  ry = Math.abs(ry);
  const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
  if (lam > 1) {
    const s = Math.sqrt(lam);
    rx *= s;
    ry *= s;
  }
  const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
  const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
  let co = Math.sqrt(Math.max(0, num / den));
  if (fa === fs) co = -co;
  const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
  const cx = cp * cxp - sp * cyp + (x1 + x2) / 2, cy = sp * cxp + cp * cyp + (y1 + y2) / 2;
  const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
  const t1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
  let dt = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
  if (!fs && dt > 0) dt -= 2 * Math.PI;
  else if (fs && dt < 0) dt += 2 * Math.PI;
  const n = Math.max(6, Math.ceil((Math.abs(dt) * Math.max(rx, ry)) / adim));
  for (let i = 1; i <= n; i++) {
    const t = t1 + (dt * i) / n;
    const ex = rx * Math.cos(t), ey = ry * Math.sin(t);
    out.push([cp * ex - sp * ey + cx, sp * ex + cp * ey + cy]);
  }
};
/** Çokgen(ler) → Path2D */
K.p2d = function (polys) {
  const p = new Path2D();
  for (const q of polys) {
    q.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    p.closePath();
  }
  return p;
};
K.dik = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** El çizgisiyle titreyen çokgen: noktalar arası sıklaştırılır, yerinden hafifçe oynatılır. */
K.elCokgen = function (poly, genlik, olcek, tohum, kapali) {
  const n = K.gurultu(tohum || 5);
  const yo = [];
  const m = poly.length;
  const son = kapali === false ? m - 1 : m;
  for (let i = 0; i < son; i++) {
    const a = poly[i], b = poly[(i + 1) % m];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const k = Math.max(1, Math.ceil(L / 4));
    for (let j = 0; j < k; j++) yo.push([a[0] + ((b[0] - a[0]) * j) / k, a[1] + ((b[1] - a[1]) * j) / k]);
  }
  if (kapali === false) yo.push(poly[m - 1]);
  return yo.map(([x, y]) => [x + (n.fbm(x / olcek, y / olcek, 2) - 0.5) * 2 * genlik, y + (n.fbm(x / olcek + 31, y / olcek + 57, 2) - 0.5) * 2 * genlik]);
};

// --------------------------------------------------------------- tuvaller
K.tuval2 = function () {
  const c = S.yeniTuval(K.N, K.N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  return [c, x];
};
K.tuval1 = function () {
  const c = S.yeniTuval(1024, 1024);
  return [c, c.getContext('2d', { willReadFrequently: true })];
};
/** Path2D ya da çizim işlevinden 1024² maske (Uint8Array, 0/1). */
K.maske = function (yol, ek) {
  const [c, x] = K.tuval1();
  x.fillStyle = '#fff';
  if (typeof yol === 'function') yol(x);
  else x.fill(yol, ek || 'nonzero');
  const d = x.getImageData(0, 0, 1024, 1024).data;
  const m = new Uint8Array(1024 * 1024);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  m.ic = (px, py) => {
    const xi = px | 0, yi = py | 0;
    return xi >= 0 && yi >= 0 && xi < 1024 && yi < 1024 && m[yi * 1024 + xi] === 1;
  };
  return m;
};
/** 1024² tuvalden renk örnekleyici. */
K.ornek = function (tuval) {
  const W = tuval.width;
  const sc = W / 1024;
  const d = tuval.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, W).data;
  return (x, y) => {
    const xi = K.kenet(Math.round(x * sc), 0, W - 1), yi = K.kenet(Math.round(y * sc), 0, W - 1);
    const i = (yi * W + xi) * 4;
    return [d[i], d[i + 1], d[i + 2]];
  };
};

// --------------------------------------------------------------- fırça darbesi
/**
 * pts: orta çizgi; o: {w, renk, a, kil, kilA, jit, kuru, bas, son, uc, dalga, r, h, hv, ha, sirt, oluk, dolgu}
 *  kil: kıl izi sayısı; kuru: uçta kıl kopması (0..1); bas/son: baş ve son incelme payı; uc: uçtaki en oranı
 *  h: yükseklik bağlamı (boya kalınlığı), hv: kalınlık (0..1), sirt: kenar sırtı, oluk: kıl oluğu derinliği
 */
K.firca = function (c, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const R = o.r;
  const L = [0];
  for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[n - 1] || 1;
  const nx = new Array(n), ny = new Array(n), wa = new Array(n);
  const bas = o.bas === undefined ? 0.12 : o.bas;
  const son = o.son === undefined ? 0.3 : o.son;
  const uc = o.uc === undefined ? 0.35 : o.uc;
  const dal = o.dalga || 0;
  const ph = R() * 6.28;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / m;
    ny[i] = dx / m;
    const t = L[i] / tot;
    let p = 1;
    if (bas > 0 && t < bas) p = 0.5 + 0.5 * Math.sqrt(t / bas);
    if (son > 0 && t > 1 - son) p *= uc + (1 - uc) * Math.sqrt((1 - t) / son);
    if (dal) p *= 1 + dal * Math.sin(ph + t * 5.5);
    wa[i] = o.w * p;
  }
  const kenar = (path) => {
    path.beginPath();
    for (let i = 0; i < n; i++) path.lineTo(pts[i][0] + (nx[i] * wa[i]) / 2, pts[i][1] + (ny[i] * wa[i]) / 2);
    for (let i = n - 1; i >= 0; i--) path.lineTo(pts[i][0] - (nx[i] * wa[i]) / 2, pts[i][1] - (ny[i] * wa[i]) / 2);
    path.closePath();
  };
  const a = o.a === undefined ? 1 : o.a;
  if (o.dolgu !== false) {
    kenar(c);
    c.fillStyle = K.rk(o.renk, a);
    c.fill();
  }
  const k = o.kil || 0;
  const kilYol = [];
  if (k > 0) {
    c.lineCap = 'round';
    const jit = o.jit === undefined ? 10 : o.jit;
    const kilA = o.kilA === undefined ? 0.5 : o.kilA;
    const kuru = o.kuru || 0;
    for (let b = 0; b < k; b++) {
      const v = ((b + 0.5) / k - 0.5) * 0.9 + ((R() - 0.5) * 0.25) / k;
      const d = (R() - 0.5) * 2 * jit;
      const col = [o.renk[0] + d + (R() - 0.5) * jit * 0.3, o.renk[1] + d + (R() - 0.5) * jit * 0.3, o.renk[2] + d + (R() - 0.5) * jit * 0.3];
      const t0 = R() * 0.08;
      const t1 = 1 - kuru * Math.pow(R(), 1.5) * 0.7 - R() * 0.05;
      c.beginPath();
      let ilk = true;
      const yol = [];
      for (let i = 0; i < n; i++) {
        const t = L[i] / tot;
        if (t < t0 || t > t1) continue;
        const X = pts[i][0] + nx[i] * v * wa[i], Y = pts[i][1] + ny[i] * v * wa[i];
        yol.push([X, Y]);
        if (ilk) {
          c.moveTo(X, Y);
          ilk = false;
        } else c.lineTo(X, Y);
      }
      const lw = Math.max(0.35, (o.w / k) * (0.45 + R() * 0.6));
      c.lineWidth = lw;
      c.strokeStyle = K.rk(col, a * kilA);
      c.stroke();
      kilYol.push([yol, lw, d]);
    }
  }
  if (o.h) {
    const h = o.h;
    const hv = o.hv === undefined ? 0.5 : o.hv;
    if (o.dolgu !== false) {
      kenar(h);
      const g = Math.round(K.kenet(hv, 0, 1) * 255);
      h.fillStyle = `rgba(${g},${g},${g},${o.ha === undefined ? 0.9 : o.ha})`;
      h.fill();
      if (o.sirt) {
        const g2 = Math.round(K.kenet(hv + o.sirt, 0, 1) * 255);
        h.strokeStyle = `rgb(${g2},${g2},${g2})`;
        h.lineWidth = o.sirtEn || 1.2;
        h.stroke();
      }
    }
    const ol = o.oluk === undefined ? 0.12 : o.oluk;
    if (ol && kilYol.length) {
      h.lineCap = 'round';
      for (const [yol, lw, d] of kilYol) {
        if (yol.length < 2) continue;
        const g = Math.round(K.kenet(hv + (d > 0 ? ol : -ol), 0, 1) * 255);
        h.strokeStyle = `rgb(${g},${g},${g})`;
        h.lineWidth = lw * 0.8;
        h.beginPath();
        yol.forEach(([X, Y], i) => (i ? h.lineTo(X, Y) : h.moveTo(X, Y)));
        h.stroke();
      }
    }
  }
};

/** Yön alanını izleyen orta çizgi: (x,y) merkezli, boy uzunluğunda. */
K.cizgiKur = function (x, y, boy, yon, egri, adim) {
  adim = adim || Math.max(2, boy / 8);
  const yari = boy / 2;
  if (!egri) {
    const a = yon(x, y);
    const ca = Math.cos(a), sa = Math.sin(a);
    const m = Math.max(2, Math.ceil(boy / adim));
    const out = [];
    for (let i = 0; i <= m; i++) {
      const s = -yari + (boy * i) / m;
      out.push([x + ca * s, y + sa * s]);
    }
    return out;
  }
  const ileri = [], geri = [];
  let cx = x, cy = y;
  const m = Math.max(1, Math.ceil(yari / adim));
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx += Math.cos(a) * adim;
    cy += Math.sin(a) * adim;
    ileri.push([cx, cy]);
  }
  cx = x;
  cy = y;
  for (let s = 0; s < m; s++) {
    const a = yon(cx, cy);
    cx -= Math.cos(a) * adim;
    cy -= Math.sin(a) * adim;
    geri.push([cx, cy]);
  }
  return geri.reverse().concat([[x, y]], ileri);
};

/**
 * Bölge boyama: titreşimli ızgaradan başlayan darbeler, renk örneklenir.
 * o: {kutu, aralik, maske, klip, boy:[a,b], en:[a,b], yon(x,y), renk(x,y,r), egri, a:[a,b], firca:{...}, h, tohum, karistir}
 */
K.bolgeBoya = function (c, o) {
  const r = S.rng(o.tohum || 1);
  const [x1, y1, x2, y2] = o.kutu;
  const s = o.aralik;
  const nok = [];
  for (let y = y1; y < y2; y += s) {
    for (let x = x1; x < x2; x += s) {
      const px = x + r() * s, py = y + r() * s;
      if (o.maske && !o.maske.ic(px, py)) continue;
      if (o.icinde && !o.icinde(px, py)) continue;
      nok.push([px, py, r()]);
    }
  }
  if (o.karistir !== false) nok.sort((p, q) => p[2] - q[2]);
  c.save();
  if (o.h) o.h.save();
  if (o.klip) {
    c.clip(o.klip);
    if (o.h) o.h.clip(o.klip);
  }
  const fo = o.firca || {};
  for (const [px, py] of nok) {
    const boy = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
    const w = o.en[0] + r() * (o.en[1] - o.en[0]);
    const pts = K.cizgiKur(px, py, boy, o.yon, o.egri, o.adim);
    const renk = o.renk(px, py, r);
    if (!renk) continue;
    const a = o.a ? o.a[0] + r() * (o.a[1] - o.a[0]) : 1;
    const hv = o.hv ? (typeof o.hv === 'function' ? o.hv(px, py, r) : o.hv[0] + r() * (o.hv[1] - o.hv[0])) : 0.5;
    K.firca(c, pts, Object.assign({}, fo, { w, renk, a, r, h: o.h, hv }));
  }
  if (o.h) o.h.restore();
  c.restore();
};

// --------------------------------------------------------------- boya kabartısı ışığı, zemin dokusu, titreme
/**
 * Yükseklik haritasından sağ üst ışıkla gölgeleme.
 * o: {guc, bulanik, parilti, parEsik, doku(x,y)->delta (iç piksel), dokuGuc}
 */
K.isikla = function (ctx, hc, o) {
  const N = K.N;
  const t = S.yeniTuval(N, N);
  const tx = t.getContext('2d', { willReadFrequently: true });
  tx.filter = `blur(${o.bulanik === undefined ? 1 : o.bulanik}px)`;
  tx.drawImage(hc, 0, 0);
  tx.filter = 'none';
  const H = tx.getImageData(0, 0, N, N).data;
  const im = ctx.getImageData(0, 0, N, N);
  const d = im.data;
  const g = o.guc === undefined ? 0.006 : o.guc;
  const par = o.parilti || 0;
  const pe = o.parEsik === undefined ? 0.12 : o.parEsik;
  const doku = o.doku;
  const W4 = N * 4;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = (y * N + x) * 4;
      const dx = H[i + 4] - H[i - 4];
      const dy = H[i + W4] - H[i - W4];
      // ışık sağ üstten: sağa yükselen yüzey karanlık, yukarı bakan yüzey aydınlık
      let s = (-dx * 0.7 + dy * 0.7) * g;
      if (doku) s += doku(x, y);
      let m = 1 + s;
      d[i] = d[i] * m;
      d[i + 1] = d[i + 1] * m;
      d[i + 2] = d[i + 2] * m;
      if (par && s > pe) {
        const p = (s - pe) * par * 255;
        d[i] += p;
        d[i + 1] += p;
        d[i + 2] += p * 0.95;
      }
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

/** Düzensiz tuval bezi dokusu (iç piksel koordinatı): ince keten, iplik kalınlığı değişken. */
K.bezDokusu = function (aralik, guc, tohum) {
  const n = K.gurultu(tohum || 11);
  const N = K.N;
  const sx = new Float32Array(N), sy = new Float32Array(N), kx = new Float32Array(N), ky = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    sx[i] = n(i / 23, 3.3) * 6.28;
    sy[i] = n(7.7, i / 23) * 6.28;
    kx[i] = 0.6 + n(i / 9, 13.1) * 0.8;
    ky[i] = 0.6 + n(21.4, i / 9) * 0.8;
  }
  const w = (2 * Math.PI) / aralik;
  return (x, y) => {
    const a = Math.sin(x * w + sy[y]) * kx[x];
    const b = Math.sin(y * w + sx[x]) * ky[y];
    const ust = ((Math.floor(x / aralik) + Math.floor(y / aralik)) & 1) === 0;
    return (ust ? a * 0.65 + b * 0.35 : b * 0.65 + a * 0.35) * guc;
  };
};

/** Düşük frekanslı yer değiştirme: el titremesi (iç piksel cinsinden genlik). */
K.titret = function (ctx, genlik, olcek, tohum) {
  const N = K.N;
  const im = ctx.getImageData(0, 0, N, N);
  const src = new Uint8ClampedArray(im.data);
  const d = im.data;
  const nz = K.gurultu(tohum || 99);
  const G = 128, gs = N / G;
  const DX = new Float32Array((G + 1) * (G + 1)), DY = new Float32Array((G + 1) * (G + 1));
  for (let j = 0; j <= G; j++)
    for (let i = 0; i <= G; i++) {
      DX[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek, (j * gs) / olcek, 3) - 0.5) * 2 * genlik;
      DY[j * (G + 1) + i] = (nz.fbm((i * gs) / olcek + 50, (j * gs) / olcek + 70, 3) - 0.5) * 2 * genlik;
    }
  for (let y = 0; y < N; y++) {
    const gy = y / gs, j0 = Math.min(G - 1, Math.floor(gy)), fy = gy - j0;
    for (let x = 0; x < N; x++) {
      const gx = x / gs, i0 = Math.min(G - 1, Math.floor(gx)), fx = gx - i0;
      const a = j0 * (G + 1) + i0;
      const dx = (DX[a] * (1 - fx) + DX[a + 1] * fx) * (1 - fy) + (DX[a + G + 1] * (1 - fx) + DX[a + G + 2] * fx) * fy;
      const dy = (DY[a] * (1 - fx) + DY[a + 1] * fx) * (1 - fy) + (DY[a + G + 1] * (1 - fx) + DY[a + G + 2] * fx) * fy;
      let sx = x + dx, sy = y + dy;
      if (sx < 0) sx = 0;
      else if (sx > N - 1.001) sx = N - 1.001;
      if (sy < 0) sy = 0;
      else if (sy > N - 1.001) sy = N - 1.001;
      const xi = sx | 0, yi = sy | 0, ux = sx - xi, uy = sy - yi;
      const p = (yi * N + xi) * 4, q = p + N * 4;
      const o = (y * N + x) * 4;
      for (let c = 0; c < 3; c++) d[o + c] = (src[p + c] * (1 - ux) + src[p + 4 + c] * ux) * (1 - uy) + (src[q + c] * (1 - ux) + src[q + 4 + c] * ux) * uy;
    }
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.putImageData(im, 0, 0);
  ctx.restore();
};

// --------------------------------------------------------------- sahne geometrisi (çokgen olarak)
K.geo = function () {
  const G = {};
  G.kubbe = S.kubbeNoktalari(90);
  G.kubbeYol = K.p2d([G.kubbe]);
  // kubbe yarıçapı tablosu (y tamsayı)
  const pr = S.kubbeProfili(400);
  G.kr = new Float32Array(1024);
  for (let y = 0; y < 1024; y++) {
    if (y < 300 || y > 555) {
      G.kr[y] = 0;
      continue;
    }
    for (let i = 0; i < pr.length - 1; i++) {
      if (y <= pr[i].y && y >= pr[i + 1].y) {
        const t = (pr[i].y - y) / (pr[i].y - pr[i + 1].y || 1);
        G.kr[y] = pr[i].r + (pr[i + 1].r - pr[i].r) * t;
        break;
      }
    }
  }
  G.kubbeR = (y) => {
    if (y < 300 || y > 555) return 0;
    const yi = Math.floor(y), f = y - yi;
    return G.kr[yi] * (1 - f) + G.kr[Math.min(1023, yi + 1)] * f;
  };
  G.kaburga = S.kaburgalar(16, 80);
  G.kasnak = S.kasnak.map((k) => K.dik(k.x1, k.y1, k.x2, k.y2));
  G.kasnakPen = [0, 1].map((k) => S.kasnakPencereleri(k).map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p)));
  const KD = S.kaide;
  G.kaide = K.dik(KD.x1, KD.y1, KD.x2, KD.y2);
  G.kornis = K.dik(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2, KD.kornis.y2);
  G.kaidePen = KD.pencereler.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.minare = S.minareParcalari().map((p) => {
    const q = Object.assign({}, p);
    if (p.tip === 'poligon') q.poly = p.noktalar;
    else if (p.tip === 'bant' || p.tip === 'korkuluk') q.poly = K.dik(p.x1, p.y1, p.x2, p.y2);
    else if (p.tip === 'topuz') q.poly = K.duz(p.yol, 1)[0];
    return q;
  });
  G.minareGovde = G.minare.filter((p) => p.poly && p.tip !== 'bant');
  G.minareYol = K.p2d(G.minareGovde.map((p) => p.poly));
  G.minarePen = S.minarePencereleri.map((p) => Object.assign({ poly: K.duz(S.kemerYolu(p.x, p.y, p.w, p.h), 1)[0] }, p));
  G.zikzak = S.zikzakCizgileri();
  G.alemK = S.alemParcalari(560, 300, 1);
  G.alemM = S.minareParcalari().find((p) => p.tip === 'alem').alem;
  G.hilal = (a) => K.duz(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.5)[0];
  G.binaYol = (() => {
    const p = new Path2D();
    p.addPath(G.kubbeYol);
    p.addPath(K.p2d(G.kasnak));
    p.addPath(K.p2d([G.kaide, G.kornis]));
    p.addPath(G.minareYol);
    return p;
  })();
  return G;
};

/** Kubbe yüzey normali (dönel yüzey + 16 dilim). Işık L için: {n:[x,yukarı,bakan], phi, k, f} */
K.kubbeNormal = function (G, x, y, oluk) {
  const r = G.kubbeR(y);
  if (r <= 0.5) return null;
  const u = (x - 560) / r;
  if (u < -1 || u > 1) return null;
  const phi = Math.asin(u);
  const r1 = G.kubbeR(Math.min(555, y + 1)), r0 = G.kubbeR(Math.max(300, y - 1));
  const drdy = (r1 - r0) / 2;
  const m = Math.sqrt(1 + drdy * drdy);
  const nr = 1 / m, nup = drdy / m;
  const dil = Math.PI / 16;
  const gk = (phi + Math.PI / 2) / dil;
  const k = Math.floor(gk), f = gk - k;
  const ph = phi + (f - 0.5) * (oluk === undefined ? 0.45 : oluk);
  return { n: [nr * Math.sin(ph), nup, nr * Math.cos(ph)], phi, k, f, u };
};
K.nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
K.birim = (v) => {
  const m = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / m, v[1] / m, v[2] / m];
};

/** Taç yaprağı: ters yumurta biçimi, uçta yuvarlak ve çok hafif çentikli. (cx,cy) dip, aci yönünde uzanır. */
K.tacYaprak = function (cx, cy, aci, boy, en, centik) {
  const ca = Math.cos(aci), sa = Math.sin(aci);
  const p = (u, v) => [cx + u * ca - v * sa, cy + u * sa + v * ca];
  const W = en / 2, L = boy, c = centik === undefined ? 0.04 : centik;
  const bz = (a, b, cc, d, t) => {
    const u = 1 - t;
    return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * cc + t * t * t * d;
  };
  const yan = [];
  const seg = [
    [[0, 0], [0.22 * L, 0.3 * W], [0.42 * L, 0.98 * W], [0.7 * L, W]],
    [[0.7 * L, W], [0.92 * L, 1.0 * W], [1.0 * L, 0.55 * W], [(1 - c) * L + c * L, 0.12 * W]],
  ];
  for (const [a, b, cc, d] of seg) for (let k = 1; k <= 14; k++) yan.push([bz(a[0], b[0], cc[0], d[0], k / 14), bz(a[1], b[1], cc[1], d[1], k / 14)]);
  const out = [p(0, 0)];
  for (const [u, v] of yan) out.push(p(u, v));
  out.push(p((1 - c) * L, 0));
  for (let k = yan.length - 1; k >= 0; k--) out.push(p(yan[k][0], -yan[k][1]));
  return out;
};
/** Altın küre: dolgu + gölge ve ışık hilalleri (ince fırça darbeleriyle). */
K.kure = function (c, cx, cy, r, ramp, R, h) {
  const pol = [];
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * 6.283;
    pol.push([cx + Math.cos(a) * r * (1 + (R() - 0.5) * 0.04), cy + Math.sin(a) * r * (1 + (R() - 0.5) * 0.04)]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(ramp(0.45));
  c.fill(yol);
  c.save();
  c.clip(yol);
  const yay = (a0, a1, q, w, renk, al) => {
    const pts = [];
    for (let k = 0; k <= 10; k++) {
      const a = a0 + ((a1 - a0) * k) / 10;
      pts.push([cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q]);
    }
    K.firca(c, pts, { w, renk, a: al, r: R, kil: 0, bas: 0.3, son: 0.35, uc: 0.2 });
  };
  yay(1.2, 3.6, 0.72, r * 0.62, ramp(0.12), 0.85); // sol alt gölge
  yay(2.2, 3.1, 0.95, r * 0.22, ramp(0.55), 0.6); // yansıyan ışık
  yay(-1.9, 0.3, 0.42, r * 0.55, ramp(0.85), 0.9); // sağ üst ışık
  c.restore();
  if (h) {
    h.fillStyle = 'rgb(150,150,150)';
    h.fill(yol);
  }
  return yol;
};

/**
 * Kümülüs bulut alanı: küre yığını yükseklik alanı (karnabahar biçimi), düz taban, gürültüyle bükülen kenar.
 * kutleler: [{x1,x2,taban,kuleler:[{x,ust,en}]}]; o: {tohum, bukum, isik:[x,yukarı,bakan]}
 * Döner: {e (kenar örtüsü 0..1), lit (0..1), aci (izohips teğeti), ag (yön ağırlığı)} — hepsi 1024².
 */
K.bulutAlani = function (kutleler, o) {
  o = o || {};
  const N = 1024;
  const r = S.rng(o.tohum || 31);
  const nz = K.gurultu((o.tohum || 31) + 7);
  const Hf = new Float32Array(N * N);
  const TB = new Float32Array(N * N);
  const UST = new Float32Array(N * N);
  const puf = [];
  for (const k of kutleler) {
    const enK = k.enKat || 1;
    k.ustMin = Math.min(...k.kuleler.map((q) => q.ust));
    for (let x = k.x1 + 16; x <= k.x2 - 10; x += 20 + r() * 14) puf.push({ x, y: k.taban - 14 - r() * 10, r: (20 + r() * 18) * enK, z: 0, k });
    for (const t of k.kuleler) {
      const H = k.taban - t.ust;
      const n = Math.max(2, Math.ceil(H / 17));
      for (let j = 0; j <= n; j++) {
        const f = j / n;
        const y = k.taban - 22 - f * (H - 22 - t.en * 0.24);
        const rr = t.en * (0.52 - 0.24 * f) * (0.7 + r() * 0.5);
        puf.push({ x: t.x + (r() - 0.5) * t.en * 0.5 * (1 - f * 0.5), y, r: rr, z: f * 12, k });
        const ns = 1 + Math.floor(r() * 3);
        for (let s = 0; s < ns; s++) {
          const yan = r() < 0.5 ? -1 : 1;
          puf.push({ x: t.x + yan * t.en * (0.28 + r() * 0.32), y: y + r() * 16 - 4, r: rr * (0.32 + r() * 0.36), z: f * 12 - 3, k });
        }
      }
    }
  }
  for (const p of puf) {
    const x0 = Math.max(0, Math.floor(p.x - p.r)), x1 = Math.min(N - 1, Math.ceil(p.x + p.r));
    const y0 = Math.max(0, Math.floor(p.y - p.r)), y1 = Math.min(N - 1, Math.ceil(Math.min(p.y + p.r, p.k.taban + 2)));
    const r2 = p.r * p.r;
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        const d2 = (x - p.x) * (x - p.x) + (y - p.y) * (y - p.y);
        if (d2 >= r2) continue;
        const hh = Math.sqrt(r2 - d2) + p.z + 1;
        const i = y * N + x;
        if (hh > Hf[i]) {
          Hf[i] = hh;
          TB[i] = p.k.taban;
          UST[i] = p.k.ustMin;
        }
      }
  }
  // yumuşatılmış yükseklik (küre dikişleri kaybolsun)
  const yum = (A, rad) => {
    const T = new Float32Array(N * N), O = new Float32Array(N * N);
    for (let y = 0; y < N; y++) {
      let s = 0;
      for (let x = -rad; x <= rad; x++) s += A[y * N + K.kenet(x, 0, N - 1)];
      for (let x = 0; x < N; x++) {
        T[y * N + x] = s / (2 * rad + 1);
        s += A[y * N + Math.min(N - 1, x + rad + 1)] - A[y * N + Math.max(0, x - rad)];
      }
    }
    for (let x = 0; x < N; x++) {
      let s = 0;
      for (let y = -rad; y <= rad; y++) s += T[K.kenet(y, 0, N - 1) * N + x];
      for (let y = 0; y < N; y++) {
        O[y * N + x] = s / (2 * rad + 1);
        s += T[Math.min(N - 1, y + rad + 1) * N + x] - T[Math.max(0, y - rad) * N + x];
      }
    }
    return O;
  };
  const Hs = yum(Hf, o.yumR || 3);
  const Hb = yum(Hf, 14);
  const L = K.birim(o.isik || [0.55, 0.62, 0.56]);
  const e = new Float32Array(N * N), lit = new Float32Array(N * N), aci = new Float32Array(N * N), ag = new Float32Array(N * N);
  const bk = o.bukum === undefined ? 9 : o.bukum;
  for (let y = 1; y < N - 1; y++)
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const wx = (nz.fbm(x / 34, y / 34, 3) - 0.5) * 2 * bk, wy = (nz.fbm(x / 34 + 40, y / 34 + 13, 3) - 0.5) * 2 * bk;
      const sx = K.kenet(Math.round(x + wx), 0, N - 1), sy = K.kenet(Math.round(y + wy), 0, N - 1);
      const j = sy * N + sx;
      const hv = Hs[j];
      e[i] = K.yum(0.5, 3.5, hv);
      if (hv > 0.05) {
        const zx0 = (Hs[j + 1] - Hs[j - 1]) / 2, zy0 = (Hs[j + N] - Hs[j - N]) / 2;
        const l0 = (-zx0 * L[0] + zy0 * L[1] + L[2]) / Math.sqrt(zx0 * zx0 + zy0 * zy0 + 1);
        if (o.kayip) e[i] = K.yum(0.5, 3.5 + o.kayip * K.kenet(0.6 - l0, 0, 1), hv);
        const zx = (Hs[j + 1] - Hs[j - 1]) / 2, zy = (Hs[j + N] - Hs[j - N]) / 2;
        let l = (-zx * L[0] + zy * L[1] + L[2]) / Math.sqrt(zx * zx + zy * zy + 1);
        const tb = TB[j], us = UST[j];
        const alt = K.yum(tb - 46, tb - 2, sy); // taban gölgesi
        const dik = K.kenet((sy - us) / Math.max(40, tb - us), 0, 1); // aşağıda daha gölgeli
        l = l * (1 - (o.altGolge === undefined ? 0.35 : o.altGolge) * alt) - (o.dikGolge === undefined ? 0.18 : o.dikGolge) * dik + 0.12;
        lit[i] = K.kenet(l, 0, 1);
      }
      const bx = (Hb[i + 1] - Hb[i - 1]) / 2, by = (Hb[i + N] - Hb[i - N]) / 2;
      const gm = Math.hypot(bx, by);
      aci[i] = Math.atan2(by, bx) + Math.PI / 2;
      ag[i] = K.yum(0.05, 0.6, gm);
    }
  return { e, lit, aci, ag, Hf };
};

/** Ayrı bir katmanda boyar, sonra 1024² örtü dizisiyle (0..1) maskeleyip ana tuvale basar. */
K.maskeliKatman = function (ctx, ortu, ciz) {
  const [kc, kx] = K.tuval2();
  ciz(kx);
  const mc = S.yeniTuval(1024, 1024);
  const mx = mc.getContext('2d');
  const im = mx.createImageData(1024, 1024);
  for (let i = 0; i < 1024 * 1024; i++) {
    im.data[i * 4] = 255;
    im.data[i * 4 + 1] = 255;
    im.data[i * 4 + 2] = 255;
    im.data[i * 4 + 3] = Math.round(K.kenet(ortu[i], 0, 1) * 255);
  }
  mx.putImageData(im, 0, 0);
  kx.save();
  kx.setTransform(1, 0, 0, 1, 0, 0);
  kx.globalCompositeOperation = 'destination-in';
  kx.imageSmoothingEnabled = true;
  kx.drawImage(mc, 0, 0, K.N, K.N);
  kx.restore();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(kc, 0, 0);
  ctx.restore();
};

/** Mat çiçek göbeği: düz disk, sol altta koyu bir darbe, sağ üstte birkaç açık lekecik, çevrede erkek organ noktaları. */
K.cicekOrta = function (c, cx, cy, r, renk, R, o) {
  o = o || {};
  const pol = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * 6.283;
    const q = r * (0.9 + R() * 0.18);
    pol.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q]);
  }
  const yol = K.p2d([pol]);
  c.fillStyle = K.rk(renk.orta);
  c.fill(yol);
  c.save();
  c.clip(yol);
  K.firca(c, [[cx - r * 0.9, cy + r * 0.1], [cx - r * 0.2, cy + r * 0.75], [cx + r * 0.6, cy + r * 0.85]], { w: r * 0.75, renk: renk.koyu, a: 0.85, r: R, kil: 3, jit: 8, bas: 0.3, son: 0.4, uc: 0.2 });
  const n = o.lek || 5;
  for (let i = 0; i < n; i++) {
    const a = -0.9 + (R() - 0.5) * 1.4, q = r * (0.15 + R() * 0.4);
    const x = cx + Math.cos(a) * q, y = cy + Math.sin(a) * q;
    K.firca(c, [[x - r * 0.18, y + r * 0.08], [x + r * 0.18, y - r * 0.08]], { w: r * 0.28, renk: renk.acik, a: 0.9, r: R, kil: 0, bas: 0.3, son: 0.4, uc: 0.3 });
  }
  c.restore();
  if (renk.nokta) {
    const m = o.nokta || 11;
    for (let i = 0; i < m; i++) {
      const a = (i / m) * 6.283 + R() * 0.3;
      const q = r * (1.15 + R() * 0.25);
      c.fillStyle = K.rk(renk.nokta, 0.9);
      c.beginPath();
      c.arc(cx + Math.cos(a) * q, cy + Math.sin(a) * q, Math.max(0.7, r * 0.11) * (0.8 + R() * 0.4), 0, 6.283);
      c.fill();
    }
  }
};

// ===================================================================== S-206 Hollanda Şehir Manzarası
// Hayalî bir şehir manzarası ressamı: açık gri astarlı tuval, serin ve berrak kuzey gün ışığı, büyük ve
// yüksek bir gök, beyaz ve mavi-gri kümülüsler; küçük darbelerle kaynaştırılmış sakin mimari ve
// taş, yaprak, altın üzerinde parıldayan kabarık ışık noktaları (pointillé).
(function () {
  const G = K.geo();
  const tv = document.getElementById('tuval');
  tv.width = K.N;
  tv.height = K.N;
  const ctx = tv.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(K.N / 1024, 0, 0, K.N / 1024, 0, 0);
  const [hc, h] = K.tuval2();
  h.fillStyle = 'rgb(20,20,20)';
  h.fillRect(0, 0, 1024, 1024);
  const nz = K.gurultu(206);
  const nz2 = K.gurultu(2061);
  const R = S.rng(2060);

  const P = {
    azurDerin: K.hex('#6C9FD0'),
    azur: K.hex('#7FAFD9'),
    soluk: K.hex('#D8E6EF'),
    bulut: K.hex('#F5F4EE'),
    bulutGolge: K.hex('#A9B5C2'),
    bulutDerin: K.hex('#8E9CAF'),
    tasIsik: K.hex('#F3F1EA'),
    tas: K.hex('#E2E1DA'),
    tasGolge: K.hex('#B4BAC1'),
    tasDerin: K.hex('#8F98A3'),
    kubbe: K.hex('#3C8F5C'),
    yesil: K.hex('#4E8B6A'),
    altin: K.hex('#D4B45A'),
    altinIsik: K.hex('#F4E3A6'),
    altinKoyu: K.hex('#8E7432'),
    zemin: K.hex('#CFCAB9'),
    nokta: K.hex('#FBF7E8'),
  };
  const Lv = K.birim([0.62, 0.55, 0.56]); // sağ üst önden ışık

  // ----------------------------------------------------------------- 0) açık gri astar
  ctx.fillStyle = '#CDCDC6';
  ctx.fillRect(0, 0, 1024, 1024);

  // ----------------------------------------------------------------- 1) model (alt boya, örnekleme kaynağı)
  const [mc, m] = K.tuval1();
  // bulutlar: küre yığını yükseklik alanı
  const kutleler = [
    { x1: -70, x2: 232, taban: 404, kuleler: [{ x: -30, ust: 250, en: 110 }, { x: 48, ust: 160, en: 120 }, { x: 132, ust: 112, en: 120 }, { x: 200, ust: 214, en: 74 }] },
    { x1: 352, x2: 700, taban: 146, kuleler: [{ x: 390, ust: 84, en: 70 }, { x: 468, ust: 30, en: 100 }, { x: 560, ust: 48, en: 92 }, { x: 650, ust: 92, en: 70 }] },
    { x1: 618, x2: 1090, taban: 476, kuleler: [{ x: 664, ust: 372, en: 80 }, { x: 748, ust: 290, en: 110 }, { x: 852, ust: 244, en: 130 }, { x: 966, ust: 270, en: 120 }, { x: 1056, ust: 330, en: 100 }] },
    { x1: -40, x2: 206, taban: 588, kuleler: [{ x: 26, ust: 536, en: 56 }, { x: 112, ust: 520, en: 64 }, { x: 184, ust: 552, en: 42 }] },
    { x1: 806, x2: 1060, taban: 596, kuleler: [{ x: 852, ust: 552, en: 50 }, { x: 938, ust: 532, en: 64 }, { x: 1020, ust: 548, en: 56 }] },
  ];
  const BA = K.bulutAlani(kutleler, { tohum: 31, bukum: 4.5, kayip: 16, yumR: 6 });
  const gokRamp = K.rampa([
    [0, P.azurDerin],
    [0.42, P.azur],
    [0.78, K.hex('#B9D2E6')],
    [1, P.soluk],
  ]);
  const bulutRamp = K.rampa([
    [0, K.hex('#93A0B2')],
    [0.25, K.hex('#A2AEBD')],
    [0.45, P.bulutGolge],
    [0.66, K.hex('#D9DDE1')],
    [0.82, K.hex('#EFEFEA')],
    [1, K.hex('#FBFAF4')],
  ]);
  const bulutE = BA.e;
  const im = m.createImageData(1024, 1024);
  const d = im.data;
  for (let y = 0; y < 1024; y++) {
    for (let x = 0; x < 1024; x++) {
      const i = y * 1024 + x;
      const t = K.kenet(y / 790, 0, 1);
      let c = gokRamp(t + (nz.fbm(x / 260, y / 140, 3) - 0.5) * 0.1);
      const ds = Math.hypot(x - 880, y - 140);
      const hk = Math.exp(-((ds / 130) ** 2)) * 0.7;
      c = K.rkar(c, K.hex('#EDF3F4'), hk);
      const e = bulutE[i];
      if (e > 0) {
        const lit = BA.lit[i] * 0.94 + 0.08 + (nz2.fbm(x / 26, y / 26, 2) - 0.5) * 0.14;
        c = K.rkar(c, bulutRamp(K.kenet(lit, 0, 1)), e);
      }
      if (y >= 800) {
        c = K.rkar(P.zemin, K.hex('#BDB8A8'), K.kenet((y - 800) / 224, 0, 1));
        const zv = nz.fbm(x / 180, y / 46, 3);
        c = K.rkar(c, zv > 0.5 ? K.hex('#DCD6C2') : K.hex('#B3B4AC'), Math.abs(zv - 0.5) * 1.3);
      }
      const o = i * 4;
      d[o] = c[0];
      d[o + 1] = c[1];
      d[o + 2] = c[2];
      d[o + 3] = 255;
    }
  }
  m.putImageData(im, 0, 0);
  const gokModel = K.ornek(mc);
  const yonAci = BA.aci, yonAg = BA.ag;

  // mimari model: minare (silindir), kaide, kasnak, kubbe
  const silindir = (x1, x2, ramp, L) => {
    const g = m.createLinearGradient(x1, 0, x2, 0);
    for (let k = 0; k <= 12; k++) {
      const t = k / 12;
      const ph = Math.asin(K.kenet(t * 2 - 1, -1, 1));
      const n = [Math.sin(ph), 0, Math.cos(ph)];
      let v = K.kenet(K.nokta(n, L || Lv), 0, 1);
      if (t < 0.12) v += (0.12 - t) * 1.2; // serin yansıyan ışık
      g.addColorStop(t, K.rk(ramp(K.kenet(v, 0, 1))));
    }
    return g;
  };
  const tasRamp = K.rampa([
    [0, P.tasDerin],
    [0.3, P.tasGolge],
    [0.62, P.tas],
    [1, P.tasIsik],
  ]);
  for (const p of G.minare) {
    if (!p.poly || p.tip === 'bant') continue;
    const xs = p.poly.map((q) => q[0]);
    const x1 = Math.min(...xs), x2 = Math.max(...xs);
    m.fillStyle = silindir(x1, x2, tasRamp);
    m.fill(K.p2d([p.poly]));
    if (p.ad.startsWith('çıkma')) {
      m.fillStyle = 'rgba(120,130,145,0.55)';
      m.fill(K.p2d([p.poly]));
    }
  }
  // kaide: düz ön yüz
  {
    const g = m.createLinearGradient(300, 0, 820, 0);
    g.addColorStop(0, K.rk(K.hex('#D9DAD6')));
    g.addColorStop(0.5, K.rk(P.tas));
    g.addColorStop(1, K.rk(P.tasIsik));
    m.fillStyle = g;
    m.fill(K.p2d([G.kaide]));
    m.fillStyle = K.rk(P.tasIsik);
    m.fill(K.p2d([G.kornis]));
    const g2 = m.createLinearGradient(0, 704, 0, 716);
    g2.addColorStop(0, 'rgba(120,132,148,0.75)');
    g2.addColorStop(1, 'rgba(120,132,148,0)');
    m.fillStyle = g2;
    m.fillRect(300, 704, 520, 12);
  }
  const yesilRamp = K.rampa([
    [0, K.hex('#1E4D39')],
    [0.32, K.hex('#2C714D')],
    [0.58, P.kubbe],
    [0.84, K.hex('#5FAA7C')],
    [1, K.hex('#9CCFAE')],
  ]);
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    m.fillStyle = silindir(q.x1, q.x2, (v) => yesilRamp(v * 0.88));
    m.fill(K.p2d([G.kasnak[k]]));
  }
  {
    const imk = m.getImageData(0, 0, 1024, 1024);
    const dk = imk.data;
    for (let y = 300; y <= 555; y++) {
      for (let x = 355; x <= 765; x++) {
        const kn = K.kubbeNormal(G, x, y, 0.5);
        if (!kn) continue;
        let v = K.kenet(K.nokta(kn.n, Lv), 0, 1);
        v = v * 0.92 + 0.04;
        // sol kenarda gökten serin yansıma
        const ref = Math.max(0, -kn.n[0]) * 0.22;
        let c = yesilRamp(v);
        c = K.rkar(c, K.hex('#7FA9B8'), ref);
        const o = (y * 1024 + x) * 4;
        dk[o] = c[0];
        dk[o + 1] = c[1];
        dk[o + 2] = c[2];
      }
    }
    m.putImageData(imk, 0, 0);
  }
  const model = K.ornek(mc);

  // ----------------------------------------------------------------- 2) gök: küçük, kaynaştırılmış darbeler
  const gokYon = (x, y) => {
    const xi = K.kenet(x | 0, 0, 1023), yi = K.kenet(y | 0, 0, 1023);
    const i = yi * 1024 + xi;
    const w = yonAg[i] * 0.85 * K.yum(0.02, 0.45, bulutE[i]);
    const a0 = (nz.fbm(x / 300, y / 300, 2) - 0.5) * 0.5 - 0.08 + (nz2.fbm(x / 70 + 13, y / 55, 2) - 0.5) * 0.5;
    const a1 = yonAci[i];
    // açıların ikiye katlanmış ortalaması (darbe yönü yönsüz)
    const cx = Math.cos(2 * a0) * (1 - w) + Math.cos(2 * a1) * w;
    const cy = Math.sin(2 * a0) * (1 - w) + Math.sin(2 * a1) * w;
    return Math.atan2(cy, cx) / 2;
  };
  const jitRenk = (sd, mdl) => (x, y, r) => {
    const c = (mdl || model)(x, y);
    const j = (r() - 0.5) * sd;
    return [c[0] + j + (r() - 0.5) * sd * 0.4, c[1] + j + (r() - 0.5) * sd * 0.4, c[2] + j + (r() - 0.5) * sd * 0.3];
  };
  const gokMaske = K.maske((x) => {
    x.fillRect(0, 0, 1024, 806);
  });
  const fGok = { kil: 10, kilA: 0.5, jit: 12, kuru: 0.45, bas: 0.2, son: 0.4, uc: 0.25, oluk: 0.05, ha: 0.45 };
  K.bolgeBoya(ctx, { kutu: [0, 0, 1024, 806], aralik: 11, maske: gokMaske, boy: [46, 92], en: [14, 21], yon: gokYon, egri: true, renk: jitRenk(15, gokModel), a: [0.8, 0.92], firca: fGok, h, hv: [0.3, 0.36], tohum: 1 });
  K.bolgeBoya(ctx, { kutu: [0, 0, 1024, 806], aralik: 8, maske: gokMaske, boy: [28, 56], en: [9, 14], yon: gokYon, egri: true, renk: jitRenk(12, gokModel), a: [0.7, 0.88], firca: fGok, h, hv: [0.31, 0.36], tohum: 2 });
  // bulutların ışıklı tepeleri: biraz daha kalın beyaz
  K.bolgeBoya(ctx, {
    kutu: [0, 0, 1024, 620],
    aralik: 6,
    icinde: (x, y) => {
      const i = (y | 0) * 1024 + (x | 0);
      if (bulutE[i] < 0.6) return false;
      const c = gokModel(x, y);
      return c[0] > 222;
    },
    boy: [12, 26],
    en: [6, 10],
    yon: gokYon,
    egri: true,
    renk: (x, y, r) => K.kay(K.rkar(gokModel(x, y), P.bulut, 0.5), (r() - 0.3) * 8),
    a: [0.85, 0.95],
    firca: Object.assign({}, fGok, { kil: 4, kuru: 0.45 }),
    h,
    hv: [0.5, 0.65],
    tohum: 3,
  });
  // bulut gölgelerinde serin mavi-gri vurgu darbeleri
  K.bolgeBoya(ctx, {
    kutu: [0, 0, 1024, 620],
    aralik: 9,
    icinde: (x, y) => {
      const i = (y | 0) * 1024 + (x | 0);
      if (bulutE[i] < 0.7) return false;
      const c = gokModel(x, y);
      return c[0] < 195;
    },
    boy: [14, 26],
    en: [6, 10],
    yon: gokYon,
    egri: true,
    renk: (x, y, r) => K.kay(K.rkar(gokModel(x, y), P.bulutDerin, 0.08), (r() - 0.5) * 6),
    a: [0.4, 0.55],
    firca: fGok,
    h,
    hv: [0.3, 0.4],
    tohum: 4,
  });
  // güneş: birkaç kısa, kalın, soluk sarı-beyaz darbe; uçları kenarı hafifçe düzensiz bırakır, çevredeki açık gök
  // darbeleriyle yumuşakça kaynaşır
  {
    const rs = S.rng(2061);
    const gx = 880, gy = 140, gr = 28;
    const disk = [];
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * 6.283;
      const rr = gr * (1 + (rs() - 0.5) * 0.07);
      disk.push([gx + Math.cos(a) * rr, gy + Math.sin(a) * rr]);
    }
    ctx.fillStyle = K.rk(K.hex('#FFFBEC'));
    ctx.fill(K.p2d([K.elCokgen(disk, 1.4, 9, 13)]));
    ctx.save();
    ctx.lineCap = 'round';
    for (const [dy, w] of [[-15, 12], [-3, 14], [9, 14], [19, 9]]) {
      const yari = Math.max(2, Math.sqrt(Math.max(0, gr * gr - dy * dy)) - w / 2) * (0.82 + rs() * 0.26);
      const k = (rs() - 0.5) * 5;
      const renk = K.kay(K.rkar(K.hex('#FFFEF6'), K.hex('#FCF3D4'), (dy + 15) / 34), (rs() - 0.5) * 3);
      ctx.strokeStyle = K.rk(renk, 0.95);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(gx - yari + k, gy + dy + 1.5);
      ctx.lineTo(gx + yari + k * 0.4, gy + dy - 1.5);
      ctx.stroke();
      for (let b = 0; b < 4; b++) {
        const v = (b / 3 - 0.5) * w * 0.65;
        ctx.strokeStyle = K.rk(K.kay(renk, (rs() - 0.5) * 9), 0.4);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(gx - yari * (0.6 + rs() * 0.4) + k, gy + dy + v + 1.5);
        ctx.lineTo(gx + yari * (0.6 + rs() * 0.4) + k, gy + dy + v - 1.5);
        ctx.stroke();
      }
    }
    ctx.restore();
    // kenarda, diskin yarısına binen birkaç kısa açık gök darbesi
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * 6.283 + rs() * 0.5;
      const x = gx + Math.cos(a) * (gr + 3), y = gy + Math.sin(a) * (gr + 3);
      const t = a + Math.PI / 2 + (rs() - 0.5) * 0.4;
      const L = 14 + rs() * 10;
      K.firca(ctx, [[x - (Math.cos(t) * L) / 2, y - (Math.sin(t) * L) / 2], [x + (Math.cos(t) * L) / 2, y + (Math.sin(t) * L) / 2]], { w: 7 + rs() * 3, renk: K.kay(K.hex('#EAF0F1'), (rs() - 0.5) * 6), a: 0.7, r: R, kil: 4, jit: 5, kilA: 0.3, bas: 0.3, son: 0.4, uc: 0.2 });
    }
  }

  // ----------------------------------------------------------------- 3) yer
  K.bolgeBoya(ctx, {
    kutu: [0, 796, 1024, 1024],
    aralik: 8,
    boy: [40, 84],
    en: [10, 15],
    yon: (x, y) => (nz2.fbm(x / 90, y / 40, 2) - 0.5) * 0.3,
    egri: true,
    renk: jitRenk(16, gokModel),
    a: [0.85, 0.97],
    firca: { kil: 9, jit: 11, kilA: 0.5, kuru: 0.4, oluk: 0.05, ha: 0.5 },
    h,
    hv: [0.32, 0.38],
    tohum: 5,
  });

  // ----------------------------------------------------------------- 4) mimari: biçimi izleyen küçük darbeler
  const fMim = { kil: 5, kilA: 0.55, jit: 11, kuru: 0.3, bas: 0.1, son: 0.3, uc: 0.4, oluk: 0.1 };
  // minare: dikey
  G.minare.forEach((p, i) => {
    if (!p.poly || p.tip === 'bant' || p.tip === 'topuz') return;
    const yol = K.p2d([p.poly]);
    const xs = p.poly.map((q) => q[0]), ys = p.poly.map((q) => q[1]);
    const yat = p.ad.startsWith('çıkma') || p.ad.startsWith('şerefe') || p.ad === 'bilezik';
    const hgt = Math.max(...ys) - Math.min(...ys);
    K.bolgeBoya(ctx, {
      kutu: [Math.min(...xs) - 2, Math.min(...ys) - 2, Math.max(...xs) + 2, Math.max(...ys) + 2],
      aralik: 3.4,
      maske: K.maske(yol),
      klip: yol,
      boy: yat ? [10, 20] : [Math.min(10, hgt), Math.min(22, hgt + 4)],
      en: [3.5, 5.5],
      yon: () => (yat ? 0 : Math.PI / 2) + (R() - 0.5) * 0.06,
      renk: jitRenk(yat ? 7 : 13),
      a: [0.85, 0.95],
      firca: fMim,
      h,
      hv: [0.35, 0.55],
      tohum: 60 + i,
    });
  });
  // kaide ve korniş: yatay
  const kaideYol = K.p2d([G.kaide, G.kornis]);
  K.bolgeBoya(ctx, { kutu: [288, 690, 832, 800], aralik: 4.5, maske: K.maske(kaideYol), klip: kaideYol, boy: [18, 40], en: [5, 8], yon: () => (R() - 0.5) * 0.05, renk: jitRenk(13), a: [0.85, 0.95], firca: fMim, h, hv: [0.35, 0.55], tohum: 7 });
  // kasnak: yatay
  const kasnakYol = K.p2d(G.kasnak);
  K.bolgeBoya(ctx, { kutu: [330, 552, 790, 694], aralik: 3.8, maske: K.maske(kasnakYol), klip: kasnakYol, boy: [12, 26], en: [4, 6], yon: () => (R() - 0.5) * 0.05, renk: jitRenk(11), a: [0.85, 0.95], firca: fMim, h, hv: [0.35, 0.55], tohum: 8 });
  // kubbe: meridyen boyunca
  const meridyen = (x, y) => {
    const r = G.kubbeR(K.kenet(y, 301, 555));
    const u = K.kenet((x - 560) / (r || 1), -1, 1);
    const drdy = (G.kubbeR(K.kenet(y + 1, 301, 555)) - G.kubbeR(K.kenet(y - 1, 301, 555))) / 2;
    return Math.atan2(1, u * drdy);
  };
  K.bolgeBoya(ctx, { kutu: [356, 298, 764, 556], aralik: 3.8, maske: K.maske(G.kubbeYol), klip: G.kubbeYol, boy: [14, 28], en: [4, 6.5], yon: meridyen, egri: true, renk: jitRenk(11), a: [0.85, 0.95], firca: fMim, h, hv: [0.38, 0.56], tohum: 9 });

  // ----------------------------------------------------------------- 5) ayrıntılar: ince samur fırça
  const ince = (pts, w, renk, a, hv, o) => K.firca(ctx, pts, Object.assign({ w, renk, a, r: R, kil: 0, bas: 0.08, son: 0.2, uc: 0.5, dalga: 0.15, h, hv: hv === undefined ? 0.45 : hv, ha: 0.7 }, o || {}));
  const el = (pts, amp) => pts.map(([x, y]) => [x + (nz.fbm(x / 30, y / 30, 2) - 0.5) * 2 * (amp || 0.8), y + (nz.fbm(x / 30 + 9, y / 30 + 4, 2) - 0.5) * 2 * (amp || 0.8)]);
  // kubbe kaburgaları: koyu çizgi + ışıklı yanda açık çizgi
  ctx.save();
  ctx.clip(G.kubbeYol);
  h.save();
  h.clip(G.kubbeYol);
  for (const kb of G.kaburga) {
    const pts = el(kb.noktalar.slice(1), 0.6);
    const sag = kb.u > -0.2;
    ince(pts, 1.9 - Math.abs(kb.u) * 0.6, K.hex('#1C4A35'), 0.55, 0.5);
    if (sag) ince(pts.map(([x, y]) => [x + 1.8 - kb.u * 0.6, y]), 1.3, K.hex('#9BD0AE'), 0.38 + kb.u * 0.2, 0.55);
  }
  h.restore();
  ctx.restore();
  // kasnak bant kenarları
  for (let k = 0; k < 2; k++) {
    const q = S.kasnak[k];
    ince(el([[q.x1, q.y1 + 1.5], [q.x2, q.y1 + 1.5]]), 2.4, K.hex('#8CC4A0'), 0.6, 0.55);
    ince(el([[q.x1, q.y2 - 1.5], [q.x2, q.y2 - 1.5]]), 2.6, K.hex('#183D2C'), 0.55, 0.4);
  }
  // kasnak pencereleri
  for (let k = 0; k < 2; k++) {
    for (const p of G.kasnakPen[k]) {
      const yol = K.p2d([el(p.poly, 0.4)]);
      ctx.fillStyle = K.rk(K.hex('#173A2B'));
      ctx.fill(yol);
      ctx.save();
      ctx.clip(yol);
      for (let q = 0; q < 3; q++) ince([[p.x - p.w * 0.3 + q * p.w * 0.3, p.y + p.h + 2], [p.x - p.w * 0.3 + q * p.w * 0.3 + (R() - 0.5) * 2, p.y - 2]], p.w * 0.45, K.kay(K.hex('#1C4433'), (R() - 0.5) * 16), 0.8, 0.4, { kil: 3, jit: 8 });
      ctx.restore();
      // içte, sol yanakta ışık (ışık sağdan girer)
      if (p.aci > -0.9) {
        ctx.save();
        ctx.clip(yol);
        ince([[p.x - p.w / 2 + 1.2, p.y + p.w * 0.5], [p.x - p.w / 2 + 1.2, p.y + p.h]], Math.max(1.2, p.w * 0.22), K.hex('#4E8A68'), 0.75);
        ctx.restore();
      }
      h.fillStyle = 'rgb(60,60,60)';
      h.fill(yol);
    }
  }
  // korniş: ışıklı üst yüz ve altında gölge
  ince(el([[290, 692.5], [830, 692.5]], 0.5), 2.6, P.tasIsik, 0.95, 0.6);
  ince(el([[300, 705.5], [820, 705.5]], 0.5), 3, K.hex('#9EA7B2'), 0.6, 0.4);
  ince(el([[290, 703], [830, 703]], 0.5), 1.4, K.hex('#B9BFC6'), 0.7, 0.45);
  // kaide pencereleri
  for (const p of G.kaidePen) {
    const yol = K.p2d([el(p.poly, 0.5)]);
    ctx.fillStyle = K.rk(K.hex('#5E6773'));
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    for (let q = 0; q < 4; q++) ince([[p.x - p.w * 0.36 + q * p.w * 0.24, p.y + p.h + 2], [p.x - p.w * 0.36 + q * p.w * 0.24 + (R() - 0.5) * 2, p.y - 2]], p.w * 0.32, K.kay(K.hex('#5A6470'), (R() - 0.5) * 18), 0.85, 0.4, { kil: 3, jit: 8 });
    ince([[p.x - p.w / 2 + 2, p.y + 6], [p.x - p.w / 2 + 2, p.y + p.h]], 3.2, K.hex('#9AA2AC'), 0.8);
    ince([[p.x + p.w / 2 - 2, p.y + 8], [p.x + p.w / 2 - 2, p.y + p.h]], 2.2, K.hex('#454D58'), 0.6);
    ctx.restore();
    h.fillStyle = 'rgb(50,50,50)';
    h.fill(yol);
    ince(el([[p.x - p.w / 2 - 3, p.y + p.h + 1.5], [p.x + p.w / 2 + 3, p.y + p.h + 1.5]]), 2.6, P.tasIsik, 0.95, 0.6);
  }
  // kaide taş sıraları: çok ince, soluk
  for (let y = 728; y < 800; y += 24) ince(el([[302, y], [818, y]], 0.6), 1, K.hex('#C9CDD0'), 0.45, 0.42);
  // kaidenin dibinde kısa, serin gölge (öğle güneşi)
  for (let k = 0; k < 22; k++) {
    const x = 292 + k * 25 + R() * 6;
    ince([[x, 801 + R()], [x + 30 + R() * 10, 801 + R()]], 4 + R() * 2, K.hex('#A9ADB0'), 0.75, 0.4, { kil: 3, jit: 6 });
  }
  // minare ayrıntıları
  const c = 300;
  for (const p of G.minare) {
    if (p.ad.startsWith('şerefe')) {
      const [x1, y1] = p.poly[0], [x2, y2] = p.poly[2];
      ince(el([[x1, y1 + 1], [x2, y1 + 1]], 0.4), 2, P.tasIsik, 0.95, 0.6);
      ince(el([[x1, y2 - 1], [x2, y2 - 1]], 0.4), 2, K.hex('#98A1AD'), 0.7, 0.4);
    }
    if (p.ad.startsWith('çıkma')) {
      // mukarnas çıkma: aşağıya bakan, serin gölge; dikey kertikler
      const [a, b, cc, dd] = p.poly;
      ince(el([[a[0], a[1] - 1.5], [dd[0], dd[1] - 1.5]], 0.3), 2.2, K.hex('#8A93A0'), 0.7, 0.4);
      for (let k = 1; k < 8; k++) {
        const t = k / 8;
        const xa = a[0] + (dd[0] - a[0]) * t, xb = b[0] + (cc[0] - b[0]) * t;
        const lit = t > 0.5;
        ince([[xb, b[1] + 1.5], [xa, a[1] - 2]], 1.3, lit ? K.hex('#C9CED4') : K.hex('#7F8996'), 0.6, 0.45, { bas: 0.02, son: 0.05, dalga: 0 });
      }
    }
    if (p.tip === 'korkuluk') {
      ctx.fillStyle = K.rk(K.hex('#A3ABB5'), 0.85);
      ctx.fillRect(p.x1, p.y1 + 3, p.x2 - p.x1, p.y2 - p.y1 - 5);
      ince(el([[p.x1, p.y1 + 1.5], [p.x2, p.y1 + 1.5]], 0.4), 3, P.tasIsik, 0.95, 0.6);
      const n = 9;
      for (let i = 0; i < n; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / n;
        const lit = (x - c) / (p.x2 - c);
        const col = K.rkar(P.tasGolge, P.tasIsik, K.kenet(0.45 + lit * 0.55, 0, 1));
        ince([[x, p.y1 + 4], [x, p.y2 - 2]], 3.2, col, 0.95, 0.55);
      }
    }
    if (p.ad === 'bilezik') {
      ince(el([[p.poly[0][0], 199], [p.poly[1][0], 199]], 0.3), 2.2, P.tasIsik, 0.9, 0.6);
      ince(el([[p.poly[0][0], 205], [p.poly[1][0], 205]], 0.3), 2, K.hex('#98A1AD'), 0.7, 0.4);
    }
    if (p.tip === 'topuz') {
      // soğan topuz: kavisli darbelerle modellenir
      ctx.save();
      const ty = K.p2d([p.poly]);
      ctx.clip(ty);
      for (let k = 0; k < 14; k++) {
        const t = k / 13;
        const x0 = c - 22 + 44 * t;
        const col = tasRamp(K.kenet(0.18 + t * 0.95 - (t > 0.85 ? (t - 0.85) * 2 : 0), 0, 1));
        ince([[x0 + (c - x0) * 0.1, 200], [x0 + (x0 - c) * 0.35, 180], [c + (x0 - c) * 0.3, 158], [c, 146]], 5, col, 0.85, 0.5, { son: 0.5, uc: 0.2 });
      }
      ctx.restore();
    }
  }
  // zikzak bant
  for (const z of G.zikzak) ince(el(z, 0.4), 2.4, K.hex('#8D96A2'), 0.8, 0.45, { son: 0.05, bas: 0.05 });
  // minare pencereleri
  for (const p of G.minarePen) {
    const yol = K.p2d([el(p.poly, 0.4)]);
    ctx.fillStyle = K.rk(K.hex('#5E6773'));
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    ince([[p.x - p.w / 2 + 1.5, p.y + 5], [p.x - p.w / 2 + 1.5, p.y + p.h]], 2.2, K.hex('#9AA2AC'), 0.8);
    ctx.restore();
    ince(el([[p.x - p.w / 2 - 2, p.y + p.h + 1], [p.x + p.w / 2 + 2, p.y + p.h + 1]]), 2, P.tasIsik, 0.9, 0.6);
  }
  // minarenin sol yanında ince serin kontur
  ince(el([[266.5, 488], [266.5, 800]], 0.5), 1.6, K.hex('#8F98A3'), 0.5);
  ince(el([[273.5, 316], [273.5, 436]], 0.5), 1.4, K.hex('#8F98A3'), 0.5);

  // altın alemler
  const altinR = K.rampa([
    [0, P.altinKoyu],
    [0.45, P.altin],
    [0.8, P.altinIsik],
    [1, K.hex('#FFF6D8')],
  ]);
  const alem = (a) => {
    // çubuk: solda koyu, sağda ışıklı
    const cw = a.cubuk.x2 - a.cubuk.x1;
    ince([[a.cubuk.x1 + cw * 0.5, a.cubuk.y2 + 2], [a.cubuk.x1 + cw * 0.5, a.cubuk.y1]], cw * 1.05, P.altin, 0.95, 0.6, { dalga: 0, son: 0.05, bas: 0.02 });
    ince([[a.cubuk.x1 + cw * 0.25, a.cubuk.y2], [a.cubuk.x1 + cw * 0.25, a.cubuk.y1]], cw * 0.45, P.altinKoyu, 0.9, 0.6, { dalga: 0, son: 0.05 });
    ince([[a.cubuk.x2 - cw * 0.2, a.cubuk.y2], [a.cubuk.x2 - cw * 0.2, a.cubuk.y1]], cw * 0.35, P.altinIsik, 0.9, 0.6, { dalga: 0, son: 0.05 });
    // yaka: elips
    const y = a.yaka;
    const ep = [];
    for (let i = 0; i < 28; i++) {
      const t = (i / 28) * 6.283;
      ep.push([y.cx + Math.cos(t) * y.rx, y.cy + Math.sin(t) * y.ry]);
    }
    const ey = K.p2d([ep]);
    ctx.fillStyle = K.rk(P.altin);
    ctx.fill(ey);
    ctx.save();
    ctx.clip(ey);
    ince([[y.cx - y.rx, y.cy + y.ry * 0.5], [y.cx, y.cy + y.ry * 0.9], [y.cx + y.rx, y.cy + y.ry * 0.5]], y.ry * 1.0, P.altinKoyu, 0.85, 0.6, { dalga: 0 });
    ince([[y.cx - y.rx * 0.2, y.cy - y.ry * 0.55], [y.cx + y.rx * 0.8, y.cy - y.ry * 0.3]], y.ry * 0.7, P.altinIsik, 0.9, 0.6, { dalga: 0 });
    ctx.restore();
    h.fillStyle = 'rgb(140,140,140)';
    h.fill(ey);
    for (const k of a.kureler) K.kure(ctx, k.cx, k.cy, k.r, altinR, R, h);
    // hilal
    const hp = G.hilal(a);
    const hy = K.p2d([hp]);
    ctx.fillStyle = K.rk(P.altin);
    ctx.fill(hy);
    ctx.save();
    ctx.clip(hy);
    const H = a.hilal;
    const yay = (a0, a1, q, w, renk, al) => {
      const pts = [];
      for (let k = 0; k <= 12; k++) {
        const an = a0 + ((a1 - a0) * k) / 12;
        pts.push([H.cx + Math.cos(an) * H.R * q, H.cy + Math.sin(an) * H.R * q]);
      }
      ince(pts, w, renk, al, 0.6, { dalga: 0, bas: 0.25, son: 0.3, uc: 0.2 });
    };
    yay(1.9, 3.5, 0.9, H.R * 0.4, P.altinKoyu, 0.85);
    yay(-0.4, 1.3, 0.9, H.R * 0.35, P.altinIsik, 0.9);
    ctx.restore();
    h.fillStyle = 'rgb(150,150,150)';
    h.fill(hy);
  };
  alem(G.alemK);
  alem(G.alemM);

  // ----------------------------------------------------------------- pointillé yardımcıları
  const nokta = (x, y, r, renk) => {
    const k = 7;
    const pts = [];
    const a0 = R() * 6.28;
    for (let i = 0; i < k; i++) {
      const a = a0 + (i * 6.28) / k;
      const q = r * (0.8 + R() * 0.35);
      pts.push([x + Math.cos(a) * q, y + Math.sin(a) * q]);
    }
    const yol = K.p2d([pts]);
    ctx.fillStyle = K.rk(renk, 0.96);
    ctx.fill(yol);
    h.fillStyle = 'rgb(235,235,235)';
    h.fill(yol);
  };
  const noktaSira = (x1, y1, x2, y2, ara, r, renk, olas) => {
    const L = Math.hypot(x2 - x1, y2 - y1);
    const kn = K.gurultu(Math.floor(x1 * 7 + y1 * 13));
    for (let s = R() * ara; s < L; s += ara * (0.4 + R() * 1.4)) {
      const t = s / L;
      // kümeler: gürültüyle seyrelen ve sıklaşan noktalar
      const yog = kn(s / 26, 0.5);
      if (R() > (olas || 1) * (0.25 + yog * 1.1)) continue;
      nokta(x1 + (x2 - x1) * t + (R() - 0.5) * 1.6, y1 + (y2 - y1) * t + (R() - 0.5) * 1.8, r * (0.55 + R() * 0.8), renk);
    }
  };

  const kume = (x, y, n, rMin, rMax, yay, renk, yon) => {
    const a0 = yon === undefined ? -0.8 : yon;
    for (let i = 0; i < n; i++) {
      const f = i / Math.max(1, n - 1);
      const r = rMax - (rMax - rMin) * f * (0.7 + R() * 0.3);
      const an = a0 + (R() - 0.5) * 1.6;
      const q = i === 0 ? 0 : yay * (0.45 + R() * 0.6);
      nokta(x + Math.cos(an) * q, y + Math.sin(an) * q, r, K.kay(renk, (R() - 0.5) * 6));
    }
  };
  // ----------------------------------------------------------------- 6) bitkiler
  const yesilR = K.rampa([
    [0, K.hex('#264F40')],
    [0.4, K.hex('#3B7158')],
    [0.7, P.yesil],
    [1, K.hex('#8DB8A0')],
  ]);
  const Ls2 = [0.7, -0.7];
  // saplar
  for (const s of S.bitki.saplar) {
    const pts = el(s, 0.8);
    ince(pts, 4.2, K.hex('#3B6A55'), 0.95, 0.5, { son: 0.15, uc: 0.6 });
    ince(pts.map(([x, y]) => [x + 1.2, y - 0.5]), 1.5, K.hex('#86B39A'), 0.7, 0.55);
  }
  // öndeki tomurcuklara kısa saplar
  S.bitki.tomurcuklar.forEach((t, i) => {
    if (i < 8) return;
    const pts = [];
    for (let k = 0; k <= 6; k++) pts.push([t.x - Math.cos(t.aci) * (t.r * 0.6 + k * 4.5) + Math.sin(k * 0.7) * 1.5, t.y - Math.sin(t.aci) * (t.r * 0.6 + k * 4.5)]);
    ince(pts, 3, K.hex('#3B6A55'), 0.95, 0.5);
  });
  const yaprakBoya = (y, i) => {
    const poly = K.duz(S.yaprakYolu(y), 1.5)[0];
    const yol = K.p2d([el(poly, 0.6)]);
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const nxv = -sa, nyv = ca;
    const vLit = nxv * Ls2[0] + nyv * Ls2[1] > 0 ? 1 : -1;
    const on = y.uzunluk > 50;
    const tonA = on ? 0.38 + R() * 0.2 : 0.5 + R() * 0.25;
    ctx.save();
    ctx.clip(yol);
    h.save();
    h.clip(yol);
    const W = y.uzunluk * y.genislik;
    ctx.fillStyle = K.rk(yesilR(K.kenet(tonA - 0.1, 0, 1)));
    ctx.fill(yol);
    for (let k = 0; k < 6; k++) {
      const v = (k / 5 - 0.5) * W * 0.9;
      const lit = (v * vLit > 0 ? 0.3 + Math.abs(v / W) * 0.3 : -0.2) + (R() - 0.5) * 0.22;
      const col = K.kay(yesilR(K.kenet(tonA + lit, 0, 1)), (R() - 0.5) * 10);
      const pts = [];
      for (let s = 0; s <= 8; s++) {
        const u = (s / 8) * y.uzunluk * 1.05 - 2;
        const vv = v * Math.sin(((s / 8) * 0.9 + 0.08) * Math.PI);
        pts.push([y.x + u * ca - vv * sa, y.y + u * sa + vv * ca]);
      }
      K.firca(ctx, pts, { w: W * 0.34, renk: col, a: 0.92, r: R, kil: 4, jit: 12, kilA: 0.55, kuru: 0.4, h, hv: 0.45 + R() * 0.1, oluk: 0.1 });
    }
    // orta damar
    const [a, b] = S.yaprakDamari(y);
    ince([a, [(a[0] + b[0]) / 2 + nxv * 0.5, (a[1] + b[1]) / 2 + nyv * 0.5], b], 1.2, yesilR(K.kenet(tonA + 0.45, 0, 1)), 0.6);
    h.restore();
    ctx.restore();
    // kenar: yaprağın iki yanı dipten uca birer ince, sivrilen darbeyle elle kapatılır
    for (const yan of [-1, 1]) {
      const pts = [];
      for (let s2 = 0; s2 <= 10; s2++) {
        const u = (s2 / 10) * y.uzunluk;
        const tt = s2 / 10;
        const vv = yan * W * 0.5 * Math.sin(Math.min(1, tt * 1.15) * Math.PI) * (tt < 0.5 ? 1 : 0.92);
        pts.push([y.x + u * ca - vv * sa, y.y + u * sa + vv * ca]);
      }
      const isik = yan * vLit > 0;
      ince(el(pts, 0.7), on ? 2.6 : 2.0, yesilR(K.kenet(tonA + (isik ? 0.28 : -0.22), 0, 1)), 0.85, 0.5, { bas: 0.15, son: 0.35, uc: 0.15, kil: 2, jit: 8 });
    }
  };
  S.bitki.yapraklar.forEach(yaprakBoya);
  // yaprak uçları: ışığa bakan yapraklarda uca yakın küme
  for (const y of S.bitki.yapraklar) {
    if (R() < 0.62) continue;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const vLit = -sa * 0.7 + ca * -0.7 > 0 ? 1 : -1;
    const u = y.uzunluk * (0.72 + R() * 0.12), v = vLit * y.uzunluk * y.genislik * 0.2;
    kume(y.x + u * ca - v * sa, y.y + u * sa + v * ca, 2 + (R() < 0.4 ? 1 : 0), 1.0, 1.9, 3.2, K.hex('#E9F1D2'), y.aci);
  }
  // tomurcuklar: kapalı beyaz tomurcuk (ışıklı sağ, serin gölgeli sol) ve dibinde iki yeşil çanak yaprak
  for (const t of S.bitki.tomurcuklar) {
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const P2 = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const yol = K.p2d([el(K.duz(S.tomurcukYolu(t), 1)[0], 0.4)]);
    ctx.save();
    ctx.clip(yol);
    h.save();
    h.clip(yol);
    ctx.fillStyle = K.rk(K.hex('#E4E6E2'));
    ctx.fill(yol);
    // gövde darbeleri: dipten uca
    const isikV = -sa * 0.7 - ca * 0.7 > 0 ? 1 : -1; // ışığa bakan yan (sağ üst)
    for (let k = 0; k < 3; k++) {
      const v = (k - 1) * t.r * 0.62;
      const col = v * isikV > 0 ? K.hex('#FBFAF3') : v === 0 ? K.hex('#EEEEE8') : K.hex('#BCC4CC');
      ince([P2(-t.r * 0.9, v * 0.8), P2(t.r * 0.4, v), P2(t.r * 1.5, v * 0.25)], t.r * 0.8, col, 0.95, 0.55, { kil: 3, jit: 6, son: 0.4, uc: 0.2 });
    }
    h.restore();
    ctx.restore();
    // çanak yapraklar: dipten iki yana sarılan sivri yeşil darbeler
    for (const yan of [-1, 1]) {
      ince([P2(-t.r * 1.0, yan * t.r * 0.25), P2(-t.r * 0.3, yan * t.r * 0.95), P2(t.r * 0.45, yan * t.r * 0.55)], t.r * 0.55, yan * isikV > 0 ? K.hex('#6E9E82') : K.hex('#3F6E58'), 0.95, 0.5, { bas: 0.2, son: 0.6, uc: 0.1 });
    }
    ince([P2(-t.r * 1.15, 0), P2(-t.r * 0.55, 0)], t.r * 0.9, K.hex('#4A7A62'), 0.95, 0.5, { son: 0.5, uc: 0.4 });
  }
  // çiçekler
  const beyazR = K.rampa([
    [0, K.hex('#A7B1BD')],
    [0.35, K.hex('#C9CFD6')],
    [0.7, K.hex('#EDEDE8')],
    [1, K.hex('#FBFAF4')],
  ]);
  const ciceklerSirali = S.bitki.cicekler.slice().sort((a, b) => a.r - b.r);
  for (const cc of ciceklerSirali) {
    const n = 5;
    const sira = [0, 1, 2, 3, 4].sort((i, j) => Math.sin(cc.aci + (j * 6.283) / 5) - Math.sin(cc.aci + (i * 6.283) / 5));
    for (const i of sira) {
      const a = cc.aci + (i * Math.PI * 2) / n;
      const poly = K.tacYaprak(cc.x + Math.cos(a) * cc.r * 0.08, cc.y + Math.sin(a) * cc.r * 0.08, a, cc.r * 1.02, cc.r * 0.92, 0.05);
      const yol = K.p2d([el(poly, 0.4)]);
      const yuz = Math.cos(a) * 0.7 - Math.sin(a) * 0.7; // ışığa bakan yaprak
      ctx.save();
      ctx.clip(yol);
      h.save();
      h.clip(yol);
      ctx.fillStyle = K.rk(beyazR(0.5 + yuz * 0.2));
      ctx.fill(yol);
      for (let k = 0; k < 5; k++) {
        const v = (k / 4 - 0.5) * cc.r * 0.8;
        const yan = Math.sign(Math.cos(a + Math.PI / 2) * 0.7 - Math.sin(a + Math.PI / 2) * 0.7) * Math.sign(v);
        const t0 = K.kenet(0.6 + yuz * 0.28 + yan * 0.1 + (R() - 0.5) * 0.12, 0, 1);
        const pts = [];
        for (let s2 = 0; s2 <= 6; s2++) {
          const u = (s2 / 6) * cc.r * 1.15;
          const vv = v * (0.35 + 0.65 * Math.sin((s2 / 6) * 1.6));
          pts.push([cc.x + u * Math.cos(a) - vv * Math.sin(a), cc.y + u * Math.sin(a) + vv * Math.cos(a)]);
        }
        K.firca(ctx, pts, { w: cc.r * 0.3, renk: beyazR(t0), a: 0.92, r: R, kil: 4, jit: 7, kilA: 0.4, kuru: 0.25, h, hv: 0.5, ha: 0.5, oluk: 0.025, son: 0.2 });
      }
      // dibe yakın serin gölge
      ince([[cc.x, cc.y], [cc.x + Math.cos(a) * cc.r * 0.5, cc.y + Math.sin(a) * cc.r * 0.5]], cc.r * 0.34, K.hex('#B3BDC7'), 0.5, 0.5, { son: 0.6, uc: 0.1 });
      h.restore();
      ctx.restore();
      if (yuz < 0.2) {
        ctx.save();
        ctx.strokeStyle = K.rk(K.hex('#97A2AE'), 0.35);
        ctx.lineWidth = 1;
        ctx.stroke(yol);
        ctx.restore();
      }
    }
    // orta: mat sarı-okr göbek, koyu yan, çevresinde erkek organ noktaları
    K.cicekOrta(ctx, cc.x, cc.y, cc.r * 0.19, { orta: K.hex('#D9B347'), koyu: K.hex('#8F7A2E'), acik: K.hex('#EFD77A'), nokta: K.hex('#B58A2C') }, R, { lek: 4, nokta: 12 });
  }

  // ----------------------------------------------------------------- 7) pointillé: kabarık ışık noktaları
  // Işık noktaları yalnız ışığın gerçekten yakaladığı yerlerde, düzensiz kümeler hâlinde: alemlerin ve hilallerin
  // ışıklı sağ yanı, ışıklı pencere eşikleri, korniş ve şerefe kenarında birkaç yer, yaprak uçları, çiçek göbekleri.
  // Her küme 2–5 lekecik; lekecikler farklı boyda (2–5 px), sıcak beyaz ve kabarık.
  const sicakBeyaz = K.hex('#FFF4D0');
  const altinNokta = (a, s) => {
    for (const k of a.kureler) kume(k.cx + k.r * 0.36, k.cy - k.r * 0.36, 2 + (R() < 0.5 ? 1 : 0), 0.9 * s, 1.7 * s, k.r * 0.35, K.hex('#FFF6D6'));
    kume(a.yaka.cx + a.yaka.rx * 0.45, a.yaka.cy - a.yaka.ry * 0.3, 2, 1.0 * s, 1.7 * s, 3 * s, sicakBeyaz, 0);
    kume(a.cubuk.x2 - 1, (a.cubuk.y1 + a.cubuk.y2) / 2, 2, 0.9 * s, 1.4 * s, 4 * s, sicakBeyaz, -1.57);
    const H = a.hilal;
    kume(H.cx + Math.cos(-0.15) * H.R * 0.9, H.cy + Math.sin(-0.15) * H.R * 0.9, 3, 0.9 * s, 1.7 * s, H.R * 0.3, K.hex('#FFF6D6'), -0.6);
  };
  altinNokta(G.alemK, 1.45);
  altinNokta(G.alemM, 1.05);
  // minare topuzunun ışıklı sağ omzu
  kume(c + 13, 168, 3, 1.4, 2.6, 4, sicakBeyaz, -0.6);
  // korniş: ışıklı sağ yarıda üç yerde küme (bir dizi boncuk değil)
  for (const x of [598, 706, 792]) kume(x + (R() - 0.5) * 20, 692.5, 3 + Math.floor(R() * 2), 1.3, 2.6, 6, sicakBeyaz, 0);
  // şerefe ve korkuluk kenarlarında ışıklı uçta birer küme
  for (const p of G.minare) {
    if (p.ad.startsWith('şerefe')) kume(p.poly[1][0] - 7, p.poly[0][1] + 1.5, 3, 1.1, 2.2, 4, sicakBeyaz, 0);
    if (p.ad === 'bilezik') kume(c + 18, 199, 2, 1.0, 1.8, 3, sicakBeyaz, 0);
  }
  // ışıklı pencere eşikleri: kaidenin sağdaki iki penceresi ve kasnağın ışık yanındaki birkaç penceresi
  for (const p of G.kaidePen.slice(1)) kume(p.x + p.w / 2 - 2, p.y + p.h + 1, 3, 1.3, 2.4, 5, sicakBeyaz, 0);
  for (let k = 0; k < 2; k++) {
    const pen = G.kasnakPen[k].filter((p) => p.x > 600 && p.x < 730);
    for (const p of pen.filter((q, i) => i % 2 === k)) kume(p.x + p.w * 0.3, p.y + p.h + 1.5, 2 + (R() < 0.5 ? 1 : 0), 1.0, 1.9, 4, K.hex('#EEF6E6'), 0);
  }
  // çiçek göbekleri: sağ üstte parlak sıcak beyaz küme
  for (const cc of S.bitki.cicekler) {
    const n = 3 + Math.floor(cc.r / 20);
    kume(cc.x + cc.r * 0.07, cc.y - cc.r * 0.07, n, 1.3 + cc.r * 0.012, 2.2 + cc.r * 0.045, cc.r * 0.1, K.hex('#FFF4C4'), -0.8);
  }

  // ----------------------------------------------------------------- 8) boya kabartısı, tuval bezi, el titremesi
  // bulutlarda kabartı üçte bire iner (sıva gibi değil, değerle modellenen kaynaşmış darbeler); kalın boya
  // yalnız en parlak tepelerde kalır
  {
    const oc = S.yeniTuval(1024, 1024);
    const ox = oc.getContext('2d');
    const oi = ox.createImageData(1024, 1024);
    for (let y = 0; y < 640; y++)
      for (let x = 0; x < 1024; x++) {
        const i = y * 1024 + x;
        const e = bulutE[i];
        if (e < 0.02) continue;
        const c = gokModel(x, y);
        const tepe = K.yum(236, 248, (c[0] + c[1] + c[2]) / 3);
        const o = i * 4;
        oi.data[o] = oi.data[o + 1] = oi.data[o + 2] = 88;
        oi.data[o + 3] = Math.round(K.kenet(e * 1.4, 0, 1) * (0.68 - tepe * 0.38) * 255);
      }
    ox.putImageData(oi, 0, 0);
    h.save();
    h.setTransform(1, 0, 0, 1, 0, 0);
    h.drawImage(oc, 0, 0, K.N, K.N);
    h.restore();
  }
  const bez = K.bezDokusu(5.2, 0.026, 17);
  K.isikla(ctx, hc, { guc: 0.0055, bulanik: 1.0, doku: bez, parilti: 0.6, parEsik: 0.12 });
  K.titret(ctx, 1.6, 90, 23);
  S.hazir();
})();
