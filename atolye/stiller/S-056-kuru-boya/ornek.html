<script>
// S-056 Kuru Boya (renkli kalem) — beyaz resim kâğıdında, uçları incelen yönlü tarama öbekleri.
// Renkler üst üste taranarak gözde karışır (sarı + mavi → yeşil); pigment yalnız kâğıt dişinin
// tepelerine tutunduğundan hafif bastırılan yerlerde beyaz kâğıt benekleri görünür. Bazı alanlar

// (çukur çizgi) beyaz bırakılmış; ince, net kontur çizgileri koyu renk kalemlerle.
(function () {
  'use strict';
  // ================================================================ ortak yardımcılar
  const W = 1024, N = W * W, W2 = 2048, N2 = W2 * W2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${(+a).toFixed(3)})`;

  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };

  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  // ayrılabilir kutu bulanıklığı (Float32)
  function bulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }

  }

  // ---------------------------------------------------------------- bölge haritası (1024)
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);

  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const bolgeNo = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];

  // ---------------------------------------------------------------- ışık (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;

  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;

  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  // kubbenin minareye düşen gölgesi (alt gövdede çapraz sınır)

    else if (b === 'kaide') { l = 0.42 + 0.5 * clamp((x - 300) / 520, 0, 1); if (y < 704) l = 0.96; else if (y < 714) l *= 0.55; }

  function harita(fn) {
    const m = new Float32Array(N);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) { const i = y * W + x; m[i] = fn(x, y, ADLAR[BOL[i]], ISIK[i]); }
    return m;
  }

  // ---------------------------------------------------------------- SVG yolu → nokta dizileri
  const SVGNS = 'http://www.w3.org/2000/svg';
  const gizliSvg = document.createElementNS(SVGNS, 'svg');
  gizliSvg.setAttribute('width', '0'); gizliSvg.setAttribute('height', '0');
  gizliSvg.style.position = 'absolute'; gizliSvg.style.left = '-10px'; gizliSvg.style.top = '-10px';
  const gizliYol = document.createElementNS(SVGNS, 'path');
  gizliSvg.appendChild(gizliYol); document.body.appendChild(gizliSvg);
  function ornekle(d, adim) {
    adim = adim || 3;
    return d.split(/(?=M)/).filter((s) => s.trim()).map((p) => {
      gizliYol.setAttribute('d', p);
      const L = gizliYol.getTotalLength(), n = Math.max(2, Math.ceil(L / adim)), out = [];
      for (let i = 0; i <= n; i++) { const q = gizliYol.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  const Y = SAHNE.yollar();
  const P2 = (d) => new Path2D(d);
  function birlesik(dizi) { const p = new Path2D(); for (const d of dizi) p.addPath(new Path2D(d)); return p; }

  // ---------------------------------------------------------------- vuruş (uçları incelen, basıncı değişen çizgi)
  let KALINLIK = 1; // stil, bütün vuruşları kalınlaştırmak için değiştirebilir
  // pts: [[x,y],...]; w: genişlik; a: basınç (0..1); c: [r,g,b]; bas/son: uçlardaki incelme payı
  function strok(cx, pts, w, a, c, bas, son) {
    const n = pts.length;
    if (n < 2) return;
    w *= KALINLIK;
    bas = bas === undefined ? 0.16 : bas; son = son === undefined ? 0.3 : son;
    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const T = cum[n - 1] || 1;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const s = cum[i] / T;
      const k = Math.pow(Math.min(1, bas > 0 ? s / bas : 1, son > 0 ? (1 - s) / son : 1), 0.6);
      const hw = (w / 2) * (0.18 + 0.82 * k);

      R.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);

    p.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);

    if (Math.hypot(bx - ax, by - ay) > Math.max(4, T * 0.7)) {
      const g = cx.createLinearGradient(ax, ay, bx, by);
      g.addColorStop(0, rgba(c, a * (bas > 0 ? 0.35 : 1)));
      g.addColorStop(Math.min(0.45, bas * 0.9 + 0.02), rgba(c, a));
      g.addColorStop(Math.max(0.55, 1 - son * 0.8), rgba(c, a));
      g.addColorStop(1, rgba(c, a * (son > 0 ? 0.05 : 1)));

  }
  // bir yolu el çizgisi gibi birkaç parçada çiz (hafif titreme, örtüşen vuruşlar)
  function elCizgisi(cx, pts, w, a, c, r, o) {
    o = o || {};
    // seyrek noktaları sıklaştır (uzun düz kenarlar da parça parça çizilebilsin)
    if (pts.length >= 2) {
      const yeni = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i], L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), k = Math.ceil(L / 3);
        for (let j = 1; j <= k; j++) yeni.push([lerp(p0[0], p1[0], j / k), lerp(p0[1], p1[1], j / k)]);
      }
      pts = yeni;
    }
    const titre = o.titre === undefined ? 0.35 : o.titre, parca = o.parca || 70;
    const n = pts.length;
    if (n < 2) return;
    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const T = cum[n - 1];

    while (s0 < T - 1) {
      const L = parca * (0.6 + 0.8 * r());
      const s1 = Math.min(T, s0 + L);

      const ph = r() * 10, amp = titre * (0.5 + r());
      for (let i = 0; i < n; i++) {
        if (cum[i] < s0 - 2 || cum[i] > s1 + 2) continue;
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
        let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const off = amp * Math.sin(ph + cum[i] * 0.09) + (o.kayma || 0);
        seg.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
      }
      if (seg.length >= 2) strok(cx, seg, w * (0.85 + 0.3 * r()), a * (0.8 + 0.2 * r()), c, o.bas === undefined ? 0.12 : o.bas, o.son === undefined ? 0.2 : o.son);
      s0 = s1 - (o.ortus === undefined ? 6 : o.ortus) * r();

  }
  // öbek taraması: kısa paralel vuruş öbekleri (renkli kalem / tebeşir taraması)
  // o: {bx:[x1,y1,x2,y2], ic(x,y), aci (sayı ya da fn), aciJ, aralik, boy, kal, alfa(sayı ya da fn), renk (dizi ya da fn), obek, sik, egri, bas, son}
  function tara(cx, o, r) {
    const [x1, y1, x2, y2] = o.bx;
    const ob = o.obek || 26, adim = ob * (o.sik || 0.62);

      if (al <= 0.01) continue;

  // ---------------------------------------------------------------- 2048 katman tuvali
  function katmanTuvali() {

  // bir noktanın (ya da çevresinin) verilen bölgelerde olup olmadığı

  const tuval = document.getElementById('tuval');

  const nA = gurultu(11), nB = gurultu(12), nC = gurultu(13), nD = gurultu(14), nE = gurultu(15);

  const H = new Float32Array(N2);
  {

  katman((x) => { x.save(); x.clip(kubbeYolu); taraK(x, { bx: kuBx, aci: 0.55, aciJ: 0.14, aralik: 2.6, boy: 22, kal: 1.35, alfa: 0.62, renk: hex('#3553A8'), obek: 20 }, r); x.restore(); },
    { sil: kuSil, bx: kuBx, guc: 1.35, maske: kuTon((l) => sstep(0.45, 0.08, l) * 0.8) });
  katman((x) => { x.save(); x.clip(kubbeYolu); taraK(x, { bx: kuBx, aci: egik + 0.2, aciJ: 0.14, aralik: 2.8, boy: 18, kal: 1.3, alfa: 0.6, renk: hex('#33285E'), obek: 18 }, r); x.restore(); },
    { sil: kuSil, bx: kuBx, guc: 1.5, maske: kuTon((l) => sstep(0.3, 0.0, l) * 0.85) });
  // ışıkta krem beyazı cila (opak)
  katman((x) => meridyen(x, { du: 0.012, boy: 40, kal: 1.8, alfa: 0.6, renk: hex('#FBF5D2') }),
    { sil: kuSil, bx: kuBx, opq: 0.55, maske: kuTon((l) => sstep(0.8, 0.98, l)) });

  // ================================================================ ALEMLER (altın)
  const altinKat = (bx) => {
    const ic = icinde(['altin'], 3);
    [['#F2C94A', 0.8, 1.5, (l) => 0.6 + 0.4 * l, 0.12], ['#E0892C', 0.7, egik, (l) => sstep(0.8, 0.3, l), 0.1], ['#8A4318', 0.75, 0.6, (l) => sstep(0.4, 0.05, l) * 0.9, 0.1], ['#FFF6C8', 0.8, 1.5, (l) => sstep(0.75, 0.95, l), 0.75]].forEach(([rk, al, aci, fn, opq]) =>
      katman((x) => { x.save(); const p = new Path2D(); p.addPath(alemYolu); p.addPath(minareAlemYolu); x.clip(p); taraK(x, { bx, ic, aci, aciJ: 0.1, aralik: 1.7, boy: 9, kal: 1.2, alfa: al, renk: hex(rk), obek: 8, sik: 0.5 }, r); x.restore(); },
        { bx, opq, maske: harita((x, y, b, l) => (b === 'altin' ? fn(l) : 0)) }));
  };
  altinKat([270, 70, 590, 312]);

  // ================================================================ BİTKİLER
  // saplar
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s, 3.4, 0.85, hex('#5E9A3E'), r, { parca: 90, titre: 0.4 }); },
    { sil: [MK.yaprakUstu], bx: [0, 500, W, W], cila: false });
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s.map(([a, b]) => [a - 0.9, b]), 1.4, 0.8, hex('#24543A'), r, { parca: 80, titre: 0.3 }); },
    { sil: [MK.yaprakUstu], bx: [0, 500, W, W], cila: false });
  // yapraklar: her yaprak kendi örtüsünde, damardan dışa açılı tarama
  function yaprakCiz(x, renk, alfaFn, opt) {
    for (let i = 0; i < B.yapraklar.length; i++) {
      const yp = B.yapraklar[i], p = yaprakYollari[i];
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fill(p); x.restore();
      const al = alfaFn(yp, i);
      if (al <= 0.01) continue;
      x.save(); x.clip(p);
      const L = yp.uzunluk, ca = Math.cos(yp.aci), sa = Math.sin(yp.aci);
      for (const taraf of [-1, 1]) {
        const isikli = (-sa * taraf) * 0.74 + (ca * taraf) * -0.67 > 0;
        const a2 = al * (opt.yari ? (isikli ? opt.yari[0] : opt.yari[1]) : 1);
        if (a2 <= 0.01) continue;
        const aci = yp.aci + taraf * (opt.aci || 0.62);
        const n = Math.round(L / opt.aralik);
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n + (r() - 0.5) * 0.4 / n;
          const sx = yp.x + ca * L * t, sy = yp.y + sa * L * t;
          const len = L * yp.genislik * 0.74 * Math.sin(Math.PI * clamp(t * 0.95 + 0.04, 0, 1)) * (0.8 + 0.35 * r()) + 2;
          const ex = sx + Math.cos(aci) * len, ey = sy + Math.sin(aci) * len;
          const mx = (sx + ex) / 2 + (r() - 0.5) * 1.2, my = (sy + ey) / 2 + (r() - 0.5) * 1.2;
          strok(x, [[sx, sy], [mx, my], [ex, ey]], opt.kal * (0.8 + 0.4 * r()), clamp(a2 * (0.7 + 0.4 * r()), 0, 1), renk, 0.05, 0.55);
        }
      }
      x.restore();
    }
  }
  const yBx = [0, 500, W, W];
  katman((x) => yaprakCiz(x, hex('#A9C94C'), (yp) => 0.8, { aralik: 1.9, kal: 1.5, yari: [1, 0.8] }), { sil: [MK.onBitki], bx: yBx });
  katman((x) => yaprakCiz(x, hex('#3F8C40'), (yp) => (yp.uzunluk > 50 ? 0.85 : 0.6), { aralik: 2.0, kal: 1.45, aci: 0.5, yari: [0.45, 1] }), { sil: [MK.onBitki], bx: yBx });
  katman((x) => yaprakCiz(x, hex('#1D5238'), (yp) => (yp.uzunluk > 50 ? 0.75 : 0.35), { aralik: 2.4, kal: 1.4, aci: 0.75, yari: [0.1, 0.9] }), { sil: [MK.onBitki], bx: yBx });
  katman((x) => yaprakCiz(x, hex('#2F3F82'), (yp) => (yp.y > 880 ? 0.6 : 0.15), { aralik: 3.0, kal: 1.3, aci: 0.9, yari: [0, 0.8] }), { sil: [MK.onBitki], bx: yBx });
  katman((x) => yaprakCiz(x, hex('#F0E27A'), (yp, i) => (i % 4 === 1 ? 0.6 : 0.25), { aralik: 2.6, kal: 1.4, aci: 0.4, yari: [0.9, 0] }), { sil: [MK.onBitki], bx: yBx, opq: 0.35 });
  // tomurcuklar
  katman((x) => { B.tomurcuklar.forEach((t, i) => { const p = tomurcukYollari[i]; x.save(); x.clip(p); taraK(x, { bx: [t.x - 18, t.y - 18, t.x + 18, t.y + 18], aci: t.aci, aciJ: 0.1, aralik: 1.8, boy: 16, kal: 1.3, alfa: 0.85, renk: hex('#F08AB0'), obek: 14, sik: 0.45 }, r); x.restore(); }); },
    { bx: yBx });
  katman((x) => { B.tomurcuklar.forEach((t, i) => { const p = tomurcukYollari[i]; x.save(); x.clip(p); taraK(x, { bx: [t.x - 18, t.y - 18, t.x + 18, t.y + 18], aci: t.aci + 0.8, aciJ: 0.1, aralik: 2, boy: 12, kal: 1.2, alfa: 0.75, renk: hex('#B8336E'), obek: 10, sik: 0.5 }, r); x.restore(); }); },
    { bx: yBx });
  // çiçekler: taç yaprakları göbekten dışa basınçlı vuruşlarla; uçları kâğıt beyazı
  function tacCiz(x, renk, alfaFn, opt) {
    B.cicekler.forEach((c, ci) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e, ei) => {
        const p = P2(SAHNE.elipsYolu(e));
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67; // ışığa bakan taç
        const al = alfaFn(c, e, yon);
        if (al <= 0.01) return;
        x.save(); x.clip(p);
        const n = Math.round((c.r * 1.5) / opt.aralik);
        const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
        for (let k = 0; k < n; k++) {
          const off = (k / (n - 1) - 0.5) * c.r * 0.95 + (r() - 0.5) * opt.aralik * 0.5;
          const bas = c.r * (0.12 + r() * 0.1), son = c.r * (opt.boy[0] + r() * opt.boy[1]);
          const fan = off / (c.r * 1.2);
          const a2 = e.aci + fan * 0.9;
          const sx = c.x + Math.cos(e.aci) * bas - sa * off * 0.25, sy = c.y + Math.sin(e.aci) * bas + ca * off * 0.25;
          const ex = sx + Math.cos(a2) * son, ey = sy + Math.sin(a2) * son;
          const mx = (sx + ex) / 2 - sa * c.r * 0.03, my = (sy + ey) / 2 + ca * c.r * 0.03;
          strok(x, [[sx, sy], [mx, my], [ex, ey]], opt.kal * (0.8 + 0.4 * r()) * Math.max(0.7, c.r / 45), clamp(al * (0.7 + 0.4 * r()), 0, 1), renk, 0.02, 0.75);
        }
        x.restore();
      });
    });
  }
  const cBx = [0, 500, W, W];
  katman((x) => tacCiz(x, hex('#F6A6C2'), (c, e, yon) => 0.75 + 0.2 * (yon < 0), { aralik: 1.5, kal: 1.5, boy: [0.55, 0.45] }), { bx: cBx });
  katman((x) => tacCiz(x, hex('#D2427E'), (c, e, yon) => 0.8, { aralik: 1.8, kal: 1.5, boy: [0.2, 0.25] }), { bx: cBx });
  katman((x) => tacCiz(x, hex('#A898D8'), (c, e, yon) => (yon < -0.1 ? 0.75 : 0.0), { aralik: 2.0, kal: 1.4, boy: [0.5, 0.5] }), { bx: cBx });
  katman((x) => tacCiz(x, hex('#8E2A62'), (c, e, yon) => 0.85, { aralik: 2.4, kal: 1.3, boy: [0.06, 0.12] }), { bx: cBx });
  // göbekler
  katman((x) => { for (const c of B.cicekler) { x.save(); x.beginPath(); x.arc(c.x, c.y, c.r * 0.22, 0, 7); x.clip(); taraK(x, { bx: [c.x - c.r * 0.3, c.y - c.r * 0.3, c.x + c.r * 0.3, c.y + c.r * 0.3], aci: egik, aralik: 1.5, boy: 12, kal: 1.4, alfa: 0.9, renk: hex('#F5C832'), obek: 10, sik: 0.4 }, r); x.restore(); } },
    { bx: cBx, opq: 0.3 });
  katman((x) => { for (const c of B.cicekler) { x.save(); x.beginPath(); x.arc(c.x, c.y, c.r * 0.22, 0, 7); x.clip(); taraK(x, { bx: [c.x - c.r * 0.3, c.y - c.r * 0.3, c.x + c.r * 0.3, c.y + c.r * 0.3], aci: 0.6, aralik: 1.8, boy: 10, kal: 1.3, alfa: 0.75, renk: hex('#E07A26'), obek: 8, sik: 0.5 }, r); x.restore(); } },
    { bx: cBx });
  katman((x) => { for (const c of B.cicekler) for (let i = 0; i < 11; i++) { const a = (i / 11) * Math.PI * 2 + r() * 0.3, rr = c.r * (0.25 + r() * 0.06); x.fillStyle = rgba(hex('#7A3A1E'), 0.9); x.beginPath(); x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.035), 0, 7); x.fill(); } },
    { bx: cBx, cila: false });

  // ================================================================ KONTUR ÇİZGİLERİ (net, ince, renkli kalemle)
  const kontur = (fn, bx) => katman(fn, { bx: bx || [0, 0, W, W], cila: false, yumus: 0.12 });
  // kubbe ve kaburgalar
  kontur((x) => {
    const kn = SAHNE.kubbeNoktalari(120);
    elCizgisi(x, kn, 1.5, 0.95, hex('#1A4A35'), r, { parca: 120 });
    for (const kb of SAHNE.kaburgalar(16, 90)) {
      const pts = kb.noktalar.filter((p) => p[1] > 303);
      elCizgisi(x, pts, 1.0, 0.55 + 0.35 * clamp((0.4 - kb.u), 0, 1), hex('#1B4D3A'), r, { parca: 90, titre: 0.25 });
    }
  });
  // kasnak, kaide, minare çizgileri
  kontur((x) => {
    const yesil = hex('#1D4A3C'), sepya = hex('#6E4B3C');
    for (const k of SAHNE.kasnak) {
      elCizgisi(x, [[k.x1, k.y1], [k.x2, k.y1]], 1.2, 0.85, yesil, r, { parca: 140 });
      elCizgisi(x, [[k.x1, k.y2], [k.x2, k.y2]], 1.3, 0.9, yesil, r, { parca: 140 });
      elCizgisi(x, [[k.x1, k.y1], [k.x1, k.y2]], 1.2, 0.85, yesil, r);
      elCizgisi(x, [[k.x2, k.y1], [k.x2, k.y2]], 1.2, 0.85, yesil, r);
    }
    for (const p of [0, 1].flatMap((k) => SAHNE.kasnakPencereleri(k))) elCizgisi(x, kemerNok(p), 0.9, 0.85, hex('#13283A'), r, { parca: 200, titre: 0.15 });
    const K2 = SAHNE.kaide, kr = K2.kornis;
    elCizgisi(x, [[kr.x1, kr.y1], [kr.x2, kr.y1]], 1.2, 0.85, sepya, r, { parca: 150 });
    elCizgisi(x, [[kr.x1, kr.y2], [kr.x2, kr.y2]], 1.1, 0.8, sepya, r, { parca: 150 });
    elCizgisi(x, [[kr.x1, kr.y1], [kr.x1, kr.y2]], 1.1, 0.8, sepya, r);
    elCizgisi(x, [[kr.x2, kr.y1], [kr.x2, kr.y2]], 1.1, 0.8, sepya, r);
    elCizgisi(x, [[K2.x1, K2.y1], [K2.x1, K2.y2]], 1.2, 0.85, sepya, r);
    elCizgisi(x, [[K2.x2, K2.y1], [K2.x2, K2.y2]], 1.2, 0.85, sepya, r);
    elCizgisi(x, [[K2.x1 - 8, 800], [K2.x2 + 10, 800]], 1.0, 0.5, sepya, r, { parca: 120 });
    for (const p of K2.pencereler) elCizgisi(x, kemerNok(p), 1.0, 0.85, hex('#4A2E40'), r, { parca: 200 });
    // minare
    for (const p of SAHNE.minareParcalari()) {
      if (p.tip === 'poligon') { const q = p.noktalar; for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; if (a[1] === 800 && b[1] === 800) continue; elCizgisi(x, [a, b], 1.25, 0.9, sepya, r, { parca: 120 }); } }
      else if (p.tip === 'korkuluk') {
        elCizgisi(x, [[p.x1, p.y1], [p.x2, p.y1]], 1.0, 0.8, sepya, r);
        elCizgisi(x, [[p.x1, p.y1], [p.x1, p.y2]], 1.0, 0.8, sepya, r); elCizgisi(x, [[p.x2, p.y1], [p.x2, p.y2]], 1.0, 0.8, sepya, r);
        const n = 11; for (let i = 0; i < n; i++) { const xx = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / n; strok(x, [[xx, p.y1 + 3], [xx, p.y2 - 1]], 2.0, 0.85, hex('#6A4A50'), 0.05, 0.1); }
      } else if (p.tip === 'topuz') elCizgisi(x, ornekle(p.yol, 2)[0], 1.25, 0.9, sepya, r, { parca: 200 });
    }
    for (const z of SAHNE.zikzakCizgileri()) elCizgisi(x, z, 1.5, 0.75, hex('#8C5A48'), r, { parca: 30, titre: 0.2, ortus: 2 });
    for (const p of SAHNE.minarePencereleri) elCizgisi(x, kemerNok(p), 0.95, 0.85, hex('#4A2E40'), r, { parca: 200 });
  }, [240, 60, 840, 810]);
  // alem çizgileri
  kontur((x) => { const c = hex('#7A4116'); for (const d of [...Y.alem, ...Y.minareAlem]) for (const pts of ornekle(d, 1.5)) elCizgisi(x, pts, 0.85, 0.8, c, r, { parca: 200, titre: 0.1 }); }, [260, 60, 600, 320]);
  // bitki çizgileri
  kontur((x) => {
    B.yapraklar.forEach((yp, i) => { x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore(); elCizgisi(x, ornekle(SAHNE.yaprakYolu(yp), 2)[0], 0.95, 0.8, hex('#1F4A30'), r, { parca: 60, titre: 0.15 }); });
    sil(K, MK.onBitki);
    B.tomurcuklar.forEach((t) => elCizgisi(x, ornekle(SAHNE.tomurcukYolu(t), 1.5)[0], 0.9, 0.85, hex('#9A2858'), r, { parca: 80, titre: 0.1 }));
    B.cicekler.forEach((c) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e, ei) => {
        // komşu taç yaprağının altında kalan kısmı çizme: önce sil
        let pts = ornekle(SAHNE.elipsYolu(e), 1.5)[0];
        const icE = (sn, q) => { const ca = Math.cos(sn.aci), sa = Math.sin(sn.aci), dx = q[0] - sn.cx, dy = q[1] - sn.cy; const u = (dx * ca + dy * sa) / sn.rx, v = (-dx * sa + dy * ca) / sn.ry; return u * u + v * v < 0.98; };
        const icSonraki = (q) => tl.some((sn, ej) => ej > ei && icE(sn, q));
        const parcalar = []; let cur = [];
        for (const q of pts) { if (icSonraki(q)) { if (cur.length > 1) parcalar.push(cur); cur = []; } else cur.push(q); }
        if (cur.length > 1) parcalar.push(cur);
        for (const pp of parcalar) elCizgisi(x, pp, 0.95 * Math.max(0.8, c.r / 50), 0.8, hex('#B23A72'), r, { parca: 90, titre: 0.12 });
      });
      for (const pts of ornekle(SAHNE.daireYolu(c.x, c.y, c.r * 0.22), 1.5)) elCizgisi(x, pts, 0.9, 0.7, hex('#A0561E'), r, { parca: 200, titre: 0.1 });
    });
  }, [0, 500, W, W]);

  // ---------------------------------------------------------------- sonuç: kâğıt kabartısı ile birlikte
  const img = ctx.createImageData(W2, W2), d = img.data;
  for (let i = 0; i < N2; i++) {
    const sh = 0.985 + 0.03 * (H[i] - 0.5);
    d[i * 4] = clamp(RR[i] * 255 * sh, 0, 255); d[i * 4 + 1] = clamp(RG[i] * 255 * sh, 0, 255); d[i * 4 + 2] = clamp(RB[i] * 255 * sh, 0, 255); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
</script>
