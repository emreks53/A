<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-237 Geç Osmanlı Suluboya Manzarası — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-237 Geç Osmanlı Suluboya Manzarası — hayalî bir ressamın eli. Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
// Kâğıt, lavi, maske ve yol yardımcıları atölyenin S-161 kitinden uyarlanmıştır; çizim bu dosyanın sonundadır.
(function () {
  'use strict';
  // ================================================================ ortak kit: kâğıt, lavi, yol, ışık
  const N = 1024, NN = N * N, N2 = 2048, NN2 = N2 * N2, PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karis(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(PI2 * r()); }

  /** Değer gürültüsü (0..1). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function hashF(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /** Kâğıt yükseklik alanı (2048 × 2048, 0..1). o: {tohum, ince:[ölçek,genlik], orta, iri, kum, dokuma(X,Y)} */
  function kagitYap(o) {
    const n1 = gurultu(o.tohum), n2 = gurultu(o.tohum + 1), n3 = gurultu(o.tohum + 2);
    const H = new Float32Array(NN2);
    const [s1, a1] = o.ince, [s2, a2] = o.orta, [s3, a3] = o.iri;
    const kum = o.kum || 0;
    let mn = 1e9, mx = -1e9;
    for (let Y = 0; Y < N2; Y++) {
      for (let X = 0; X < N2; X++) {
        let v = a1 * (0.62 * n1(X / s1, Y / s1) + 0.38 * n1(X / (s1 * 0.47) + 91.3, Y / (s1 * 0.47) + 13.7)) + a2 * n2(X / s2, Y / s2) + a3 * n3(X / s3, Y / s3);
        if (o.dokuma) v += o.dokuma(X, Y);
        if (kum) v += (hashF(X, Y, o.tohum) - 0.5) * kum;
        H[Y * N2 + X] = v;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
    }
    const k = 1 / (mx - mn || 1);
    for (let i = 0; i < NN2; i++) H[i] = (H[i] - mn) * k;
    return H;
  }
  /** 2048 alanı 1024'e indirir (2×2 ortalama). */
  function kucult(H) {
    const h = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = 2 * y * N2 + 2 * x;
      h[y * N + x] = (H[i] + H[i + 1] + H[i + N2] + H[i + N2 + 1]) * 0.25;
    }
    return h;
  }

  /** Kutu bulanıklığı (ayrık, gecis kez), yalnız bb içinde. */
  const _kb1 = new Float32Array(NN), _kb2 = new Float32Array(NN);
  function kutuBulanik(src, r, gecis, bb, hedef) {
    r = Math.max(1, Math.round(r));
    const x0 = bb ? bb.x0 : 0, x1 = bb ? bb.x1 : N - 1, y0 = bb ? bb.y0 : 0, y1 = bb ? bb.y1 : N - 1;
    const a = hedef || new Float32Array(NN);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) a[y * N + x] = src[y * N + x];
    const t = _kb1;
    const inv = 1 / (2 * r + 1);
    for (let g = 0; g < gecis; g++) {
      for (let y = y0; y <= y1; y++) {
        const row = y * N;
        let s = 0;
        for (let k = -r; k <= r; k++) s += a[row + clamp(x0 + k, x0, x1)];
        for (let x = x0; x <= x1; x++) {
          t[row + x] = s * inv;
          s += a[row + Math.min(x1, x + r + 1)] - a[row + Math.max(x0, x - r)];
        }
      }
      for (let x = x0; x <= x1; x++) {
        let s = 0;
        for (let k = -r; k <= r; k++) s += t[clamp(y0 + k, y0, y1) * N + x];
        for (let y = y0; y <= y1; y++) {
          a[y * N + x] = s * inv;
          s += t[Math.min(y1, y + r + 1) * N + x] - t[Math.max(y0, y - r) * N + x];
        }
      }
    }
    return a;
  }

  // ---------------------------------------------------------------- maskeler (1024)
  function sinirla(M) {
    let x0 = N, x1 = -1, y0 = N, y1 = -1;
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) if (M[row + x] > 0.002) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    M.bb = x1 < 0 ? null : { x0, x1, y0, y1 };
    return M;
  }
  const _mc = SAHNE.yeniTuval(N, N);
  const _mx = _mc.getContext('2d', { willReadFrequently: true });
  /** Yol çizen bir işlevden maske (beyaz dolgu/çizgi → 1). */
  function yolMaske(ciz) {
    _mx.setTransform(1, 0, 0, 1, 0, 0);
    _mx.globalCompositeOperation = 'source-over';
    _mx.clearRect(0, 0, N, N);
    _mx.fillStyle = '#fff';
    _mx.strokeStyle = '#fff';
    _mx.lineCap = 'round';
    _mx.lineJoin = 'round';
    ciz(_mx);
    const d = _mx.getImageData(0, 0, N, N).data;
    const M = new Float32Array(NN);
    for (let i = 0; i < NN; i++) M[i] = d[4 * i + 3] / 255;
    return sinirla(M);
  }
  function mIslem(A, B, f) { const M = new Float32Array(NN); for (let i = 0; i < NN; i++) M[i] = f(A[i], B ? B[i] : 0); return sinirla(M); }
  const mEksi = (A, B) => mIslem(A, B, (a, b) => a * (1 - b));
  const mCarp = (A, B) => mIslem(A, B, (a, b) => a * b);
  const mBirles = (A, B) => mIslem(A, B, (a, b) => Math.max(a, b));
  function mFonk(A, f) { const M = new Float32Array(NN); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; if (A[i] > 0) M[i] = A[i] * f(x, y); } return sinirla(M); }

  const BOLGE_AD = Object.keys(SAHNE.BOLGE);
  /** Bitkisiz bölge kimlikleri (yapı, gök, zemin). */
  function bolgeKimlik() {
    const c = SAHNE.yeniTuval(N, N);
    const x = c.getContext('2d', { willReadFrequently: true });
    SAHNE.ciz(x, { bolge: true, cicek: false });
    const d = x.getImageData(0, 0, N, N).data;
    const ids = new Uint8Array(NN);
    const bel = new Map();
    for (let i = 0; i < NN; i++) {
      const key = (d[4 * i] << 16) | (d[4 * i + 1] << 8) | d[4 * i + 2];
      let v = bel.get(key);
      if (v === undefined) { v = BOLGE_AD.indexOf(SAHNE.bolgeAdi(d[4 * i], d[4 * i + 1], d[4 * i + 2])); bel.set(key, v); }
      ids[i] = v;
    }
    return ids;
  }
  function bolgeMaske(ids, adlar, kosul) {
    const set = adlar.map((a) => BOLGE_AD.indexOf(a));
    const M = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (set.includes(ids[i]) && (!kosul || kosul(x, y))) M[i] = 1;
    }
    sinirla(M);
    if (!M.bb) return M;
    const bb = { x0: Math.max(0, M.bb.x0 - 2), x1: Math.min(N - 1, M.bb.x1 + 2), y0: Math.max(0, M.bb.y0 - 2), y1: Math.min(N - 1, M.bb.y1 + 2) };
    const R = kutuBulanik(M, 1, 1, bb);
    return sinirla(R);
  }

  // ---------------------------------------------------------------- lavi (saydam suluboya katmanı, 1024)
  function laviKur(H1, tohum) {
    const a = gurultu(tohum + 21), b = gurultu(tohum + 22), c = gurultu(tohum + 23);
    const dx = new Float32Array(NN), dy = new Float32Array(NN), ak = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      dx[i] = (a(x / 26, y / 26) - 0.5) * 1.3 + (a(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      dy[i] = (b(x / 26, y / 26) - 0.5) * 1.3 + (b(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      ak[i] = 0.6 * c(x / 70, y / 70) + 0.4 * c(x / 19 + 7, y / 19 + 3);
    }
    return { dx, dy, ak, H: H1, buf: new Float32Array(3 * NN).fill(1), say: 0 };
  }
  /** Aynalı sarma: gürültü haritası kaydırılınca dikiş çıkmasın. */
  const ayna = (v) => { v &= 2047; return v > 1023 ? 2047 - v : v; };
  const _md = new Float32Array(NN), _mb = new Float32Array(NN);
  /** Bir lavi katı: M maskesi, renk; o: guc, kenar (kenarda pigment birikmesi), tane, akis, oyna (kenar titremesi),
   *  kx/ky (kayma), yay (kenar bulanıklık yarıçapı), yumusak (0..1 ıslak kenar), f(x,y) yoğunluk çarpanı. */
  function lavi(L, M, renk, o) {
    o = Object.assign({ guc: 0.5, kenar: 0.5, tane: 0.25, akis: 0.25, oyna: 1.5, kx: 0, ky: 0, yay: 3, yumusak: 0, f: null }, o || {});
    if (!M.bb) return;
    L.say++;
    const ox = (L.say * 197) & 1023, oy = (L.say * 331) & 1023;
    const C = hex(renk).map((v) => 1 - v / 255);
    const pad = Math.ceil(o.oyna + Math.abs(o.kx) + Math.abs(o.ky) + o.yay * 3 + 3);
    const bb = { x0: Math.max(0, M.bb.x0 - pad), x1: Math.min(N - 1, M.bb.x1 + pad), y0: Math.max(0, M.bb.y0 - pad), y1: Math.min(N - 1, M.bb.y1 + pad) };
    const Md = _md;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const j = ayna(y + oy) * N + ayna(x + ox);
      const sx = clamp(x + L.dx[j] * o.oyna - o.kx, 0, N - 1.001), sy = clamp(y + L.dy[j] * o.oyna - o.ky, 0, N - 1.001);
      const ix = Math.floor(sx), iy = Math.floor(sy);
      let v = 0;
      {
        const fx = sx - ix, fy = sy - iy, k = iy * N + ix;
        const a = M[k] + (M[k + 1] - M[k]) * fx, b = M[k + N] + (M[k + N + 1] - M[k + N]) * fx;
        v = a + (b - a) * fy;
      }
      Md[y * N + x] = v;
    }
    const B = o.yay > 0 ? kutuBulanik(Md, o.yay, 2, bb, _mb) : Md;
    const buf = L.buf;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const i = y * N + x;
      const m = Md[i], bl = B[i];
      if (m < 0.002 && bl < 0.002) continue;
      const j = ayna(y + oy) * N + ayna(x + ox);
      const base = o.yumusak ? m + (bl - m) * o.yumusak : m;
      let e = m - bl;
      if (e < 0) e = 0;
      let d = base * o.guc * (1 + o.kenar * e * 2.5) * (1 + o.akis * (L.ak[j] - 0.5) * 2) * (1 + o.tane * (0.5 - L.H[i]) * 2);
      if (o.f) d *= o.f(x, y);
      if (d <= 0) continue;
      if (d > 1) d = 1;
      buf[3 * i] *= 1 - d * C[0];
      buf[3 * i + 1] *= 1 - d * C[1];
      buf[3 * i + 2] *= 1 - d * C[2];
    }
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) Md[y * N + x] = 0;
  }

  // ---------------------------------------------------------------- katmanlar ve birleştirme (2048)
  function katman() {
    const c = SAHNE.yeniTuval(N2, N2);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x };
  }
  /** Son birleştirme: kâğıt rengi × lavi × mürekkep katmanları, kâğıt dokusu kabartması.
   *  o: {ctx, kagit(X,Y,h)→[r,g,b] 0..1, H (2048), L (lavi), katmanlar:[{c, mod:'carp'|'ust', dis(X,Y,h,a)→a}], kabartma, cukur} */
  function birlestir(o) {
    const out = o.ctx.createImageData(N2, N2);
    const od = out.data;
    const H = o.H, buf = o.L ? o.L.buf : null;
    const kat = o.katmanlar.map((k) => ({ d: k.c.getContext('2d').getImageData(0, 0, N2, N2).data, mod: k.mod, dis: k.dis, renk: k.renk }));
    const kab = o.kabartma || 0, cuk = o.cukur || 0;
    for (let Y = 0; Y < N2; Y++) {
      const sy = Math.min(N - 1.001, Math.max(0, (Y + 0.5) / 2 - 0.5));
      const iy = Math.floor(sy), fy = sy - iy;
      for (let X = 0; X < N2; X++) {
        const I = Y * N2 + X;
        const h = H[I];
        let [r, g, b] = o.kagit(X, Y, h);
        if (buf) {
          const sx = Math.min(N - 1.001, Math.max(0, (X + 0.5) / 2 - 0.5));
          const ix = Math.floor(sx), fx = sx - ix;
          const k = iy * N + ix;
          const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
          r *= buf[3 * k] * w00 + buf[3 * k + 3] * w10 + buf[3 * (k + N)] * w01 + buf[3 * (k + N) + 3] * w11;
          g *= buf[3 * k + 1] * w00 + buf[3 * k + 4] * w10 + buf[3 * (k + N) + 1] * w01 + buf[3 * (k + N) + 4] * w11;
          b *= buf[3 * k + 2] * w00 + buf[3 * k + 5] * w10 + buf[3 * (k + N) + 2] * w01 + buf[3 * (k + N) + 5] * w11;
        }
        for (const K of kat) {
          let a = K.d[4 * I + 3] / 255;
          if (a <= 0) continue;
          if (K.dis) a = K.dis(X, Y, h, a, K.d[4 * I], K.d[4 * I + 1], K.d[4 * I + 2]);
          if (a <= 0) continue;
          let cr = K.d[4 * I] / 255, cg = K.d[4 * I + 1] / 255, cb = K.d[4 * I + 2] / 255;
          if (K.renk) { const c = K.renk(X, Y, h, cr, cg, cb); cr = c[0]; cg = c[1]; cb = c[2]; }
          if (K.mod === 'carp') { r *= 1 - a * (1 - cr); g *= 1 - a * (1 - cg); b *= 1 - a * (1 - cb); }
          else { r += (cr - r) * a; g += (cg - g) * a; b += (cb - b) * a; }
        }
        if (kab || cuk) {
          const X1 = X > 1 ? X - 2 : X, Y1 = Y > 1 ? Y - 2 : Y, X2 = X < N2 - 2 ? X + 2 : X, Y2 = Y < N2 - 2 ? Y + 2 : Y;
          const s = 1 + kab * (H[Y1 * N2 + X1] - H[Y2 * N2 + X2]) - cuk * (0.5 - h);
          r *= s; g *= s; b *= s;
        }
        od[4 * I] = r * 255;
        od[4 * I + 1] = g * 255;
        od[4 * I + 2] = b * 255;
        od[4 * I + 3] = 255;
      }
    }
    o.ctx.setTransform(1, 0, 0, 1, 0, 0);
    o.ctx.putImageData(out, 0, 0);
  }

  // ---------------------------------------------------------------- yollar
  /** SVG yolunu (M L C A Z, mutlak) nokta dizilerine çevirir; dizi.kapali bilgisi. */
  function duzlestir(d, adim) {
    adim = adim || 1.5;
    const tok = d.match(/[MLCAZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const cizgi = (x, y) => {
      const m = Math.max(1, Math.ceil(Math.hypot(x - cx, y - cy) / adim));
      for (let j = 1; j <= m; j++) cur.push([cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m]);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') { if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) cizgi(sx, sy); cur.kapali = true; } cx = sx; cy = sy; cur = null; continue; }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') cizgi(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          cur.push([u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const ddx = (cx - x) / 2, ddy = (cy - y) / 2;
        const x1p = cr * ddx + sr * ddy, y1p = -sr * ddx + cr * ddy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(6, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          cur.push([cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy]);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
  /** Eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1], q = out[out.length - 1];
    if (Math.hypot(s[0] - q[0], s[1] - q[1]) > adim * 0.3) out.push([s[0], s[1]]);
    return out;
  }
  /** Yay uzunluğu s0..s1 aralığındaki parça. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = s, b = s + L;
      if (b >= s0 && a <= s1) {
        if (!out.length) { const t = L ? clamp((s0 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); }
        if (b <= s1) out.push([p[i][0], p[i][1]]);
        else { const t = L ? clamp((s1 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); break; }
      }
      s = b;
    }
    return out;
  }
  /** Normal boyunca gürültüyle titretir (elin doğal titremesi). */
  function titret(p, gen, dalga, nf, faz) {
    const out = [];
    let s = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const d = gen * (nf(s / dalga + faz, faz * 1.7) - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }

  }
  /** Çizgiyi bir koşulun doğru olduğu parçalara böler. */
  function kirp(p, ic) {
    const out = [];
    let cur = null;
    for (const q of p) {
      if (ic(q[0], q[1])) { if (!cur) { cur = []; out.push(cur); } cur.push(q); }
      else cur = null;
    }
    return out.filter((c) => c.length > 1);
  }
  /** Değişken kalınlıklı şerit (normal yönünde), uçları yuvarlak. wf(t) → kalınlık. */
  function serit(x, p, wf) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const w = wf(i / (n - 1)) / 2;
      L.push([p[i][0] - ty * w, p[i][1] + tx * w]);
      R.push([p[i][0] + ty * w, p[i][1] - tx * w]);
    }
    x.beginPath();
    x.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) x.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath();
    x.fill();
    const w0 = wf(0) / 2, w1 = wf(1) / 2;
    x.beginPath(); x.arc(p[0][0], p[0][1], w0, 0, PI2); x.fill();
    x.beginPath(); x.arc(p[n - 1][0], p[n - 1][1], w1, 0, PI2); x.fill();

  function cizDizi(x, p) { x.beginPath(); x.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) x.lineTo(p[i][0], p[i][1]); }

  // ---------------------------------------------------------------- ışık (sağ üstten)
  const ISIK = (() => { const v = [0.62, 0.5, 0.6]; const l = Math.hypot(...v); return v.map((a) => a / l); })();
  const _kr = (() => {
    const p = SAHNE.kubbeProfili(600);
    const r = new Float32Array(256), dr = new Float32Array(256);
    for (let h = 0; h <= 255; h++) {
      const y = 555 - h;
      let rr = 0;
      for (let i = 0; i < p.length - 1; i++) if (y <= p[i].y && y >= p[i + 1].y) { const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1); rr = lerp(p[i].r, p[i + 1].r, t); break; }

    }
    for (let h = 0; h <= 255; h++) dr[h] = (r[Math.min(255, h + 1)] - r[Math.max(0, h - 1)]) / (h === 0 || h === 255 ? 1 : 2);

  })();
  function kubbeR(y) { const h = clamp(555 - y, 0, 255); const i = Math.floor(h), f = h - i; return lerp(_kr.r[i], _kr.r[Math.min(255, i + 1)], f); }
  /** Kubbe yüzey normali ve aydınlanma (0..1). */
  function kubbeIsik(x, y) {
    const h = clamp(555 - y, 0, 254.9), i = Math.floor(h);
    const r = Math.max(1, kubbeR(y));
    const u = clamp((x - 560) / r, -1, 1);
    const dr = _kr.dr[i];
    let nr = 1, nh = -dr;
    const l = Math.hypot(nr, nh);
    nr /= l; nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u, ny = nh, nz = nr * c;

  // ---------------------------------------------------------------- sahne biçimleri
  /** Taç yaprağı (ters yumurta, ucunda hafif çentik) nokta dizisi. c: çiçek, i: sıra. */
  function tacNoktalari(c, i, o) {
    o = o || {};
    const a = c.aci + (i * PI2) / 5 + (o.don || 0);
    const L = c.r * (o.boy || 1.0), W = c.r * (o.en || 1.1);
    const ca = Math.cos(a), sa = Math.sin(a);
    const n = o.n || 26, sol = [], sag = [];
    for (let k = 0; k <= n; k++) {
      const u = k / n;
      const w = (W / 2) * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.45)), 0.55) * (0.3 + 0.7 * Math.sqrt(u));
      sol.push([u, w]);

    return pts.map(([u, v]) => {
      const cen = (o.centik || 0) * Math.exp(-Math.pow(v / (W * 0.16), 2)) * sstep(0.8, 1, u);
      const uu = (u - cen) * L + c.r * (o.ic || 0.08);

  function noktaYolu(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); P.closePath(); return P; }
  function yapiCizgileri() {

  /** Alem parçalarının çizgileri: {p, tur:'yaka'|'cubuk'|'kure'|'hilal'} */
  function alemCizgileri(a) {
    const out = [];
    const el = (cx, cy, rx, ry) => { const p = []; for (let i = 0; i <= 64; i++) { const t = (i / 64) * PI2; p.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); } return p; };
    out.push({ p: el(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry), tur: 'yaka' });

    out.push({ p: [[a.cubuk.x2, a.cubuk.y2], [a.cubuk.x2, a.cubuk.y1]], tur: 'cubuk' });
    for (const k of a.kureler) out.push({ p: el(k.cx, k.cy, k.r, k.r), tur: 'kure', k });
    for (const q of duzlestir(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.7)) out.push({ p: q, tur: 'hilal' });

  }

  /** Bitkiler çizim sırasıyla: sap → yaprak → tomurcuk → çiçek. */
  function bitkiListesi(tacO) {
    const B = SAHNE.bitki;
    const out = [];
    B.saplar.forEach((s, i) => out.push({ tur: 'sap', p: ornekle(s, 2), i }));
    B.yapraklar.forEach((y, i) => out.push({ tur: 'yaprak', y, i, p: duzlestir(SAHNE.yaprakYolu(y), 1)[0], damar: SAHNE.yaprakDamari(y) }));
    B.tomurcuklar.forEach((t, i) => out.push({ tur: 'tomurcuk', t, i, p: duzlestir(SAHNE.tomurcukYolu(t), 0.8)[0] }));
    B.cicekler.forEach((c, i) => out.push({ tur: 'cicek', c, i, taclar: [0, 1, 2, 3, 4].map((k) => tacNoktalari(c, k, tacO)) }));

  /** Bitki maskeleri (1024): cicek, tomurcuk, yaprak, sap, hepsi; sapKalin: sap genişliği. */
  function bitkiMaskeleri(liste, sapKalin) {
    const cizTur = (tur) => yolMaske((x) => {
      for (const e of liste) {
        if (e.tur !== tur) continue;
        if (tur === 'sap') { x.lineWidth = sapKalin || 4; x.stroke(noktaYoluAcik(e.p)); }
        else if (tur === 'cicek') { for (const t of e.taclar) x.fill(noktaYolu(t)); x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.3, 0, PI2); x.fill(); }
        else x.fill(noktaYolu(e.p));
      }
    });
    const cicek = cizTur('cicek');
    const tom0 = cizTur('tomurcuk');
    const tomurcuk = mEksi(tom0, cicek);
    const ust = mBirles(cicek, tom0);
    const yap0 = cizTur('yaprak');
    const yaprak = mEksi(yap0, ust);
    const ust2 = mBirles(ust, yap0);
    const sap0 = cizTur('sap');
    const sap = mEksi(sap0, ust2);

  function noktaYoluAcik(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); return P; }
  /** Çiçek merkezine uzaklık / yarıçap haritası (çiçek maskesinde). */
  function cicekUzaklik(liste) {
    const D = new Float32Array(NN).fill(9);
    for (const e of liste) {
      if (e.tur !== 'cicek') continue;
      const c = e.c, R = c.r * 1.2;
      for (let y = Math.max(0, Math.floor(c.y - R)); y <= Math.min(N - 1, Math.ceil(c.y + R)); y++)
        for (let x = Math.max(0, Math.floor(c.x - R)); x <= Math.min(N - 1, Math.ceil(c.x + R)); x++) {
          const d = Math.hypot(x - c.x, y - c.y) / c.r;
          if (d < D[y * N + x]) D[y * N + x] = d;
        }
    }
    return D;
  }


  // ================================================================ j8 ekleri: bulut biçimi, kalem konturu, fırça vuruşu
  const ISIK2 = (() => { const v = [0.78, -0.63]; const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; })();

  /** Bulut: hafif dalgalı taban, üstte farklı boyda birkaç geniş tepe (daire yayı değil, toplanmış yumuşak eğri).
   *  b: {x, y (taban), w, h, tohum, n}. Döner: {pts (kapalı), ust (soldan sağa üst kenar), alt, x0, x1, taban, P} */
  function bulutSekli(b) {
    const r = SAHNE.rng(b.tohum || 1);
    const n = b.n || 4;
    const tepeler = [];
    const dd = 0.84 / n;
    for (let i = 0; i < n; i++) tepeler.push({ t: 0.08 + dd * (i + 0.5) + (r() - 0.5) * dd * 0.3, s: dd * (0.42 + r() * 0.14), h: (0.5 + r() * 0.5) * (0.75 + 0.5 * Math.sin(Math.PI * (i + 0.5) / n)) });
    const M = 120, ust = [], alt = [];
    const tepe = b.tepe == null ? 0.3 : b.tepe;
    for (let k = 0; k <= M; k++) {
      const t = k / M, th = Math.PI * (1 - t);
      let v = 0;
      for (const q of tepeler) v += q.h * Math.exp(-Math.pow((t - q.t) / q.s, 2));
      const rr = 1 - tepe + tepe * Math.min(1.25, v);
      ust.push([b.x + (b.w / 2) * Math.cos(th), b.y - b.h * Math.pow(Math.sin(th), 0.9) * rr]);
      alt.push([b.x + (b.w / 2) * Math.cos(th), b.y + b.h * 0.1 * Math.pow(Math.sin(th), 0.6) + b.h * 0.03 * Math.sin(t * 11 + (b.tohum || 0)) * Math.sin(th)]);
    }
    const pts = ust.concat(alt.slice(1, -1).reverse());
    return { pts, ust, alt, x0: b.x - b.w / 2, x1: b.x + b.w / 2, taban: b.y, P: noktaYolu(pts) };
  }

  /** Kapalı nokta dizisinin işaretli alanı (> 0: ekranda saat yönü). */
  function isaretliAlan(p) { let A = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; A += a[0] * b[1] - b[0] * a[1]; } return A / 2; }

  /** Dışa bakan normaller: kapalı dizide alan işaretinden, açık dizide o.yan ([nx,ny] yaklaşık dış yön) ile. */
  function disNormaller(p, kapali, yan) {
    const n = p.length, out = [];
    const sg = kapali ? (isaretliAlan(p) > 0 ? 1 : -1) : 1;
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      let nx = ty * sg, ny = -tx * sg;
      if (!kapali && yan && nx * yan[0] + ny * yan[1] < 0) { nx = -nx; ny = -ny; }
      out.push([nx, ny]);
    }
    return out;
  }

  /** Değişken kalınlıklı kapalı ya da açık şerit; w dizisi nokta başına kalınlık. Uçlar yuvarlak. */
  function seritW(x, p, w, kapali) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];

  /**

  // ================================================================ doğal bulut alanı ve eşik konturu

   * neredeyse düzdür; kenar düşük frekanslı gürültüyle bozulur, böylece sıra sıra yarım daire (ikon bulut) çıkmaz.

  function bulutAlani(tanim, o) {

  /** Eşik konturu (kare yürütme): F alanında `esik` düzey çizgisi, bb içinde; düzeltilmiş nokta dizileri (kapalı olanlarda .kapali). */

  // ---------------------------------------------------------------- kâğıt: krem-beyaz, soğuk preslenmiş, belirgin diş
  const H = kagitYap({ tohum: 2374, ince: [3.0, 0.6], orta: [13, 0.32], iri: [150, 0.18], kum: 0.14 });
  const KAGIT = hex('#F7F1E3').map((v) => v / 255);
  const kagit = (X, Y, h) => { const k = 0.975 + 0.04 * h; return [KAGIT[0] * k, KAGIT[1] * k, KAGIT[2] * k]; };
  const H1 = kucult(H);
  const L = laviKur(H1, 237);
  const ids = bolgeKimlik();
  const liste = bitkiListesi({ centik: 0.05, en: 1.05, boy: 0.96 });
  const BM = bitkiMaskeleri(liste, 3.2);

  // çayırdaki küçük kır çiçekleri: küçük kümeler hâlinde
  const kirCicek = [];
  {
    const r = SAHNE.rng(23701);
    const kumeler = [[95, 870], [330, 905], [455, 1000], [610, 905], [760, 1005], [985, 890], [250, 1000], [905, 1000], [520, 842], [40, 960], [700, 842]];
    for (const [kx, ky] of kumeler) {
      const n = 3 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        const x = kx + (r() - 0.5) * 46, y = ky + (r() - 0.5) * 22;
        const rr = (y > 950 ? 7.5 : 6) + r() * 2.2;
        kirCicek.push({ x, y, r: rr, aci: r() * PI2 });
      }
    }
  }
  const kirM = yolMaske((x) => { for (const c of kirCicek) for (let k = 0; k < 5; k++) { const p = tacNoktalari(c, k, { en: 1.15, boy: 1.0, n: 12 }); x.fill(noktaYolu(p)); } });
  const ustBitki = mBirles(BM.hepsi, kirM);
  const bolge = (adlar, kosul) => mEksi(bolgeMaske(ids, adlar, kosul), ustBitki);
  // arka lavi yeşil biçimlerin altından da geçer (kenarlarında kâğıt çizgisi kalmasın); yalnız beyaz çiçekler korunur
  const beyazlar = mBirles(mBirles(BM.cicek, BM.tomurcuk), kirM);
  const bolgeAlti = (adlar, kosul) => mEksi(bolgeMaske(ids, adlar, kosul), beyazlar);
  const GX = 880, GY = 140;

  // ---------------------------------------------------------------- fırça geçişleri ve kâğıt payı
  /** Maskeyi kenarından değişken bir payla içeri çeker: çizgiyle boya arasında yer yer kıl inceliğinde kâğıt kalır. */
  function pay(M, en, tohum) {
    if (!M.bb) return M;
    const nn = gurultu(tohum);
    const bb = { x0: Math.max(0, M.bb.x0 - 4), x1: Math.min(N - 1, M.bb.x1 + 4), y0: Math.max(0, M.bb.y0 - 4), y1: Math.min(N - 1, M.bb.y1 + 4) };
    const B = kutuBulanik(M, 3, 1, bb);
    const R = new Float32Array(NN);
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const i = y * N + x;
      if (M[i] <= 0) continue;
      const t = 0.5 + en * clamp((nn(x / 26, y / 26) - 0.42) * 2.4, 0, 1);
      R[i] = M[i] * sstep(t - 0.07, t + 0.07, B[i]);
    }
    return sinirla(R);
  }
  /**
   * Geniş fırçanın gidip gelişleri: M maskesi hafif eğik, yatay şeritler hâlinde yukarıdan aşağı boyanır.
   * Her şeridin üst kenarı bir önceki ıslak şeride yumuşakça karışır, alt kenarında boya toplanıp ince bir ıslak kenarla
   * kurur; fırça her geçişte bir yandan öbür yana boşalır (yön sırayla değişir). Şerit aralarında yer yer kâğıt kalır.
   * o: {y0, y1, h, bin, aci, dal, guc, kenar, tane, akis, oyna, yay, bosluk(y)→olasılık, f(x,y), tohum}
   */
  function seritLavi(L, M, renk, o) {
    const r = SAHNE.rng(o.tohum || 1);
    const nA = gurultu((o.tohum || 1) * 7 + 3);
    const tg = Math.tan(o.aci || 0);
    let y = o.y0;
    let i = 0;
    while (y < o.y1) {
      const h = o.h * (0.6 + 0.9 * r());
      const ust = y, alt = y + h, yon = i % 2 ? -1 : 1, ph = r() * 100, ii = i;
      const dal = o.dal == null ? 6 : o.dal;
      const topB = (x) => ust + tg * (x - 512) + dal * (nA(x / 190 + ph, ii * 1.7) - 0.5) * 2;
      const botB = (x) => alt + tg * (x - 512) + dal * (nA(x / 160 + ph + 40, ii * 1.7 + 9) - 0.5) * 2 + 2.2 * (nA(x / 23 + ph, ii + 4.4) - 0.5) * 2;
      const yu = o.ust == null ? 6 : o.ust;
      const m = mFonk(M, (x, yy) => sstep(topB(x) - yu, topB(x) + yu * 1.4, yy) * sstep(0.8, -0.8, yy - botB(x)));
      const yuk = 0.8 + 0.4 * r();
      lavi(L, m, typeof renk === 'function' ? renk(ii) : renk, {
        guc: o.guc * yuk, kenar: o.kenar == null ? 1.2 : o.kenar, tane: o.tane == null ? 0.08 : o.tane, akis: o.akis == null ? 0.1 : o.akis, oyna: o.oyna == null ? 1 : o.oyna, yay: o.yay == null ? 1.6 : o.yay,
        f: (x, yy) => {
          const t = clamp(yon > 0 ? x / N : 1 - x / N, 0, 1);
          const b = botB(x);
          return (1.12 - 0.3 * t) * (1 + (o.alt == null ? 0.22 : o.alt) * sstep(b - 14, b - 1, yy)) * (o.f ? o.f(x, yy) : 1);
        },
      });
      const bosluk = o.bosluk ? o.bosluk(alt) : 0;
      y = alt - (r() < bosluk ? -(2 + r() * 4) : (o.bin == null ? 8 : o.bin) * (0.6 + 0.8 * r()));
      i++;
    }
  }

  // ---------------------------------------------------------------- gök: ıslak üstüne ıslak, denetimli
  const BA = bulutAlani([
    { x: 178, y: 268, w: 262, h: 78, tohum: 31, tepe: 0.4 },
    { x: 518, y: 166, w: 196, h: 56, tohum: 32, tepe: 0.55 },
    { x: 792, y: 346, w: 252, h: 74, tohum: 33, tepe: 0.38 },
    { x: 950, y: 484, w: 150, h: 38, tohum: 34, tepe: 0.5, ek: 2 },
    { x: 84, y: 490, w: 156, h: 38, tohum: 35, tepe: 0.42, ek: 2 },
  ], { tohum: 2375, gurultu: 0.3 });
  const BU = BA.F;
  // kenar yumuşaklığı: üstte ve sağda kuru kâğıda değen sert, biraz koyulaşmış kenar; yalnız sol alt (gölge) yanda
  // ıslak kâğıtta dağılan, denetimli yumuşak kenar
  const yumus = (x, y) => {
    for (const c of BA.bulutlar) {
      const b = c.b;
      if (x >= c.bb.x0 && x <= c.bb.x1 && y >= c.bb.y0 && y <= c.bb.y1) {
        const alt = sstep(b.y - b.h * 0.8, b.y - b.h * 0.05, y), sol = sstep(b.x + b.w * 0.1, b.x - b.w * 0.42, x);
        return 0.018 + 0.32 * clamp(alt * (0.3 + 0.7 * sol) * 1.6, 0, 1) * (0.6 + 0.4 * nf2(x / 44, y / 34));
      }
    }
    return 0.018;
  };
  const gunesUz = (x, y) => Math.hypot(x - GX, y - GY);
  const gokBolge = mBirles(bolgeAlti(['gok', 'gunes']), yolMaske((x) => { x.beginPath(); x.arc(GX, GY, 96, 0, PI2); x.fill(); }));
  const gunesR = (x, y) => { const a = Math.atan2(y - GY, x - GX); return 35.5 + 1.6 * (nf4(Math.cos(a) * 0.9 + 6, Math.sin(a) * 0.9 + 6) - 0.5) * 2; };
  const bulutluk = (x, y) => { const s = yumus(x, y); return BU[y * N + x] + 0.035 * (nf3(x / 6, y / 5) - 0.5) * 2 + s * 0.55 * (fbm(nf4, x / 9, y / 7) - 0.5) + s * 0.4 * (nf3(x / 22, y / 15) - 0.5); };
  const gokM = mFonk(gokBolge, (x, y) => { const s = yumus(x, y); return (1 - sstep(0.4, 0.4 + s, bulutluk(x, y))) * sstep(gunesR(x, y) - 1, gunesR(x, y) + 2.5, gunesUz(x, y)); });
  // gök: tepeden ufka yatay fırça bantlarıyla derecelenmiş lavi; her bant bir öncekinin ıslak dibine biner, durduğu
  // yerde ince, biraz koyu bir kuruma kenarı bırakır; pigment fırçanın yönünde çöker (yatay tane izleri)
  seritLavi(L, gokM, '#8EBEE2', {
    y0: -24, y1: 812, h: 128, bin: 8, aci: 0.012, dal: 7, guc: 0.66, kenar: 0.62, alt: 0.09, ust: 10, tane: 0.12, akis: 0.12, oyna: 1.3, yay: 1.6, tohum: 2376,
    f: (x, y) => {
      const d = gunesUz(x, y);
      const cok = 1 + 0.13 * (nf3(x / 95, y / 4.5) - 0.5) * 2;
      return lerp(1.0, 0.16, sstep(40, 790, y + 30 * (nf4(x / 260, 2) - 0.5))) * (1 - 0.45 * Math.exp(-(d * d) / (2 * 75 * 75))) * cok;
    },
  });
  // bulutun üst ve sağ kenarında kuruyan gök boyası: ince, biraz koyulaşmış sert kenar
  {
    const bb = gokM.bb;
    const B = kutuBulanik(gokM, 2, 1, bb);
    const kenarM = mFonk(gokM, (x, y) => (yumus(x, y) < 0.06 ? sstep(0.985, 0.72, B[y * N + x]) : 0) * (BU[y * N + x] > 0.12 ? 1 : 0));
    lavi(L, kenarM, '#7FA9CC', { guc: 0.36, kenar: 0.4, tane: 0.1, oyna: 0.6, yay: 1 });
  }
  // ikinci, üst geçiş: tepede daha parlak gök mavisi, alt sınırı ıslakta yumuşak
  lavi(L, mFonk(gokM, (x, y) => 1 - sstep(130, 300, y + 60 * (nf4(x / 200, 7) - 0.5))), '#7FB4E2', { guc: 0.3, kenar: 0.1, tane: 0.1, oyna: 2, yay: 4, yumusak: 0.6, f: (x, y) => 1 - 0.7 * Math.exp(-(gunesUz(x, y) ** 2) / (2 * 110 * 110)) });
  // bulutların gölgeli alt yanı: ıslakken bırakılmış soğuk gri-mavi, yukarı doğru kâğıda dağılır
  const bulutGolge = mFonk(gokBolge, (x, y) => {
    const v = BU[y * N + x];
    if (v < 0.2) return 0;
    for (const c of BA.bulutlar) {
      const b = c.b;
      if (x < c.bb.x0 || x > c.bb.x1 || y < c.bb.y0 || y > c.bb.y1) continue;
      const alt = sstep(b.y - b.h * (0.62 + 0.12 * (nf2(x / 30, b.tohum) - 0.5) * 2), b.y - b.h * 0.1, y) * 0.9 + 0.3 * sstep(b.x, b.x - b.w * 0.55, x) * sstep(b.y - b.h * 1.1, b.y - b.h * 0.3, y);
      return sstep(0.35, 0.6, bulutluk(x, y)) * Math.min(1, alt);
    }
    return 0;
  });
  lavi(L, bulutGolge, '#A3AFC2', { guc: 0.6, kenar: 0.15, tane: 0.22, akis: 0.32, oyna: 2.5, yay: 2.5, yumusak: 0.45 });
  // güneş: kâğıt bırakılmış kursa çok soluk limon sarısı
  lavi(L, mFonk(gokBolge, (x, y) => 1 - sstep(gunesR(x, y) - 1.5, gunesR(x, y) + 1.5, gunesUz(x, y))), '#F6EBA8', { guc: 0.42, kenar: 0.35, tane: 0.15, yay: 1.5, oyna: 1.2 });

  // ---------------------------------------------------------------- uzakta mavi-yeşil bir koru ve çayır
  const koruUst = (x) => 800 - (16 + 16 * fbm(nf3, x / 34, 3.7) + 9 * Math.max(0, Math.sin(x / 23 + 1.3)) * nf(x / 60, 9));
  const koru = mFonk(bolgeAlti(['gok']), (x, y) => (y > koruUst(x) && y < 801 && (x < 296 || x > 824) ? 1 : 0));
  lavi(L, koru, '#97B4A6', { guc: 0.62, kenar: 0.35, tane: 0.2, oyna: 1.5, yay: 2, f: (x, y) => 0.75 + 0.35 * sstep(koruUst(x), 800, y) });
  const cayir = bolgeAlti(['zemin']);
  lavi(L, cayir, '#B3C47C', { guc: 0.55, kenar: 0.5, tane: 0.14, akis: 0.3, oyna: 2.2, yay: 3, f: (x, y) => lerp(0.62, 1.05, sstep(800, 960, y)) });
  // çayırda yatay fırça bantları: sap yeşili, öne doğru dolgunlaşır, her bandın dibinde kurumuş ince kenar
  seritLavi(L, cayir, '#7EAA5E', { y0: 818, y1: 1030, h: 66, bin: 6, aci: -0.01, dal: 7, guc: 0.34, kenar: 0.8, alt: 0.12, ust: 8, tane: 0.12, oyna: 1.6, yay: 1.8, tohum: 2377,
    bosluk: () => 0.35, f: (x, y) => lerp(0.45, 1.15, sstep(820, 1000, y)) * (1 + 0.15 * (nf3(x / 120, y / 6) - 0.5) * 2) });
  lavi(L, mFonk(cayir, (x, y) => (y < 812 ? 1 : 0)), '#C9C6A0', { guc: 0.4, kenar: 0.6, oyna: 1.5, yay: 2 });

  // ---------------------------------------------------------------- yapı
  // kubbe: her dilim kendi tonunda (ışığa göre), dilimler arası yumuşak, kaburgaya oturan sınırlar
  const kubbe = bolge(['kubbe']);
  const dilimIsik = (x, y) => {
    const R = Math.max(1, kubbeR(y));
    const u = clamp((x - 560) / R, -1, 1);
    const th = Math.asin(u);
    const k = (th + Math.PI / 2) / (Math.PI / 16);
    const gi = Math.floor(clamp(k, 0, 15.999));
    const fr = k - gi;
    const uc = Math.sin(-Math.PI / 2 + ((gi + 0.5) * Math.PI) / 16);
    const xc = 560 + uc * R;
    const a = kubbeIsik(xc, y);
    // komşu dilime doğru dar bir geçiş (ıslak kenar gibi)
    const gn = fr > 0.5 ? Math.min(15, gi + 1) : Math.max(0, gi - 1);
    const un = Math.sin(-Math.PI / 2 + ((gn + 0.5) * Math.PI) / 16);
    const b = kubbeIsik(560 + un * R, y);
    const t = sstep(0.0, 0.12, Math.abs(fr - 0.5) - 0.38) * 0.5;
    return lerp(a, b, t) * 0.75 + kubbeIsik(x, y) * 0.25;
  };
  // önce bütün kubbeye açık, sıcak bir sap-zeytin yeşili; sonra her dilim yukarıdan aşağı ayrı bir fırçayla:
  // fırça izi dilim boyunca uzanır, boya dilimin alt ucunda toplanıp koyu, kurumuş bir kenar bırakır
  lavi(L, kubbe, '#A5B778', { guc: 0.62, kenar: 0.55, tane: 0.14, akis: 0.25, oyna: 1.2, yay: 2 });
  {
    const kU = (x, y) => (x - 560) / Math.max(1, kubbeR(y));
    const kabU = (k) => Math.sin(-Math.PI / 2 + (Math.PI * k) / 16);
    for (let k = 0; k < 16; k++) {
      const ua = kabU(k), ub = kabU(k + 1), du = ub - ua, ort = (ua + ub) / 2;
      const isik = clamp(0.55 + 0.55 * ort, 0, 1);
      const ov = 0.003 + 0.008 * du;
      const sap = (y, s2) => 0.004 * (nf3(y / 40 + k * 3 + s2, k) - 0.5) * 2;
      const altUc = (x) => 552 - 6 * nf2(x / 9 + k, 3.3);
      const gm = mFonk(kubbe, (x, y) => { const u = kU(x, y); return sstep(ua - ov - 0.004, ua - ov + 0.004, u + sap(y, 0)) * sstep(ub + ov + 0.004, ub + ov - 0.004, u + sap(y, 5)) * sstep(0.8, -0.8, y - altUc(x)); });
      lavi(L, gm, '#4D9B70', {
        guc: lerp(0.78, 0.2, isik), kenar: 1.25, tane: 0.12, akis: 0.15, oyna: 1.1, yay: 1.6,
        f: (x, y) => { const t = clamp((kU(x, y) - ua) / du, 0, 1); return (0.62 + 0.5 * sstep(330, 548, y)) * (1.1 - 0.2 * t) * (1 + 0.14 * (nf(t * 3 + k * 7, y / 70) - 0.5) * 2); },
      });
    }
    lavi(L, mFonk(kubbe, (x, y) => sstep(-0.3, -0.55, kU(x, y))), '#4E8E7A', { guc: 0.42, kenar: 0.3, tane: 0.14, oyna: 2.5, yay: 5, yumusak: 0.7, f: (x, y) => kubbe[y * N + x] });
  }
  lavi(L, mFonk(kubbe, (x, y) => sstep(522, 553, y)), '#4E8E7A', { guc: 0.24, kenar: 0.3, oyna: 1.5, yay: 3, yumusak: 0.5 });

  const kasnak = bolge(['kasnak']);
  const cylU = (x, y) => (x - 560) / (y < 610 ? 208 : 226);
  const cylI = (x, y) => silindirIsik(cylU(x, y));
  lavi(L, kasnak, '#7CB48E', { guc: 0.75, kenar: 0.5, tane: 0.18, oyna: 1, yay: 2 });
  lavi(L, kasnak, '#4D9B70', { guc: 0.65, kenar: 0.6, tane: 0.18, oyna: 1.2, yay: 2, f: (x, y) => sstep(0.92, 0.45, cylI(x, y)) });
  lavi(L, kasnak, '#4E8E7A', { guc: 0.55, kenar: 0.6, oyna: 1.2, yay: 2, f: (x, y) => sstep(0.5, 0.2, cylI(x, y)) + ((y >= 555 && y < 565) || (y >= 610 && y < 618) ? 0.5 : 0) });
  lavi(L, bolge(['pencere'], (x, y) => y >= 555 && y < 692 && x > 334), '#3B4A40', { guc: 0.85, kenar: 0.4, tane: 0.18, oyna: 0.5, yay: 1 });

  const minare = bolge(['minare']);
  const mU = (x, y) => (x - 300) / mYari(y);
  lavi(L, minare, '#EFE6D2', { guc: 0.32, kenar: 0.8, tane: 0.14, oyna: 1, yay: 2 });
  lavi(L, mFonk(minare, (x, y) => sstep(0.66, 0.6, silindirIsik(mU(x, y)))), '#9EA9B8', { guc: 0.5, kenar: 1.2, tane: 0.14, oyna: 1.2, yay: 1.8, f: (x, y) => 0.7 + 0.6 * sstep(0.6, 0.25, silindirIsik(mU(x, y))) });
  lavi(L, mFonk(minare, (x, y) => ((y > 468 && y < 492) || (y > 300 && y < 320) || (y > 436 && y < 442) || (y > 272 && y < 278) || (y > 206 && y < 212) ? 1 : 0)), '#9EA9B8', { guc: 0.5, kenar: 0.5, oyna: 1, yay: 1.5 });
  const kaide = bolge(['kaide']);
  lavi(L, kaide, '#EFE6D2', { guc: 0.36, kenar: 0.8, tane: 0.14, oyna: 1.3, yay: 2, f: (x, y) => lerp(1.2, 0.7, (x - 290) / 540) });
  lavi(L, mFonk(kaide, (x, y) => (y >= 704 && y < 720 ? 1 - 0.6 * sstep(704, 720, y) : 0)), '#9EA9B8', { guc: 0.55, kenar: 0.4, oyna: 1.3, yay: 2 });
  lavi(L, mFonk(kaide, (x, y) => sstep(360, 300, x) * (y > 704 ? 1 : 0)), '#9EA9B8', { guc: 0.4, kenar: 0.3, oyna: 1.5, yay: 3, yumusak: 0.4 });
  lavi(L, mFonk(kaide, (x, y) => sstep(770, 800, y) * 0.6), '#B7B49A', { guc: 0.35, kenar: 0.2, oyna: 2, yay: 3, yumusak: 0.6 });
  lavi(L, bolge(['pencere'], (x, y) => y >= 692 || x < 345), '#4A4B44', { guc: 0.82, kenar: 0.4, tane: 0.18, oyna: 0.5, yay: 1 });

  const altin = bolge(['altin'], (x, y) => x < 700); // güneş çevresindeki kenar pikselleri altın sayılmasın
  lavi(L, altin, '#D9B45A', { guc: 0.85, kenar: 0.5, oyna: 0.3, yay: 1 });
  lavi(L, mFonk(altin, (x, y) => (x < (x < 430 ? 299 : 559) ? 1 : 0)), '#9C7A34', { guc: 0.45, kenar: 0.5, oyna: 0.3, yay: 1 });

  // ---------------------------------------------------------------- bitkiler: yumuşak sap ve zeytin yeşilleri
  const yaprakRenk = ['#7EAA5E', '#8FAF65', '#6E9F78'];
  for (let g = 0; g < 3; g++) {
    const m = yolMaske((x) => { for (const e of liste) if (e.tur === 'yaprak' && e.i % 3 === g) x.fill(noktaYolu(e.p)); });
    lavi(L, mCarp(m, BM.yaprak), yaprakRenk[g], { guc: 0.74, kenar: 0.5, tane: 0.2, oyna: 0.9, yay: 1.2 });
  }
  const golgeYan = (e) => { const a = e.y.aci; return Math.sin(a) * 0.78 + Math.cos(a) * 0.62 < 0 ? 1 : 0; };
  const yarim = yolMaske((x) => {
    for (const e of liste) {
      if (e.tur !== 'yaprak') continue;
      const m = Math.floor(e.p.length / 2);
      const q = golgeYan(e) ? e.p.slice(0, m + 1) : e.p.slice(m).concat([e.p[0]]);
      x.fill(noktaYolu(q));
    }
  });
  lavi(L, mCarp(yarim, BM.yaprak), '#4E8E7A', { guc: 0.45, kenar: 0.6, oyna: 0.8, yay: 1.5 });
  lavi(L, BM.sap, '#7C9C5C', { guc: 0.85, kenar: 0.4, oyna: 0.5, yay: 1 });
  lavi(L, BM.tomurcuk, '#C4D3A0', { guc: 0.75, kenar: 0.7, oyna: 0.5, yay: 1 });
  const CD = cicekUzaklik(liste);
  lavi(L, mFonk(BM.cicek, (x, y) => { const d = CD[y * N + x]; return d < 0.5 + 0.12 * nf4(x / 8, y / 8) ? 1 : 0; }), '#B6CCC8', { guc: 0.32, kenar: 0.5, tane: 0.18, yay: 2, oyna: 1, f: (x, y) => 1 - 0.6 * sstep(0.2, 0.5, CD[y * N + x]) });
  lavi(L, yolMaske((x) => { for (const e of liste) if (e.tur === 'cicek') { x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.19, 0, PI2); x.fill(); } }), '#E2BC50', { guc: 0.88, kenar: 0.6, oyna: 0.5, yay: 1 });
  // kır çiçekleri: kâğıt bırakılmış taç yaprakları, dipte soluk gölge, sarı göbek
  lavi(L, mFonk(kirM, (x, y) => { let v = 0; for (const c of kirCicek) { const d = Math.hypot(x - c.x, y - c.y); if (d < c.r * 1.2) v = Math.max(v, 1 - sstep(c.r * 0.25, c.r * 0.7, d)); } return v; }), '#BCC4B4', { guc: 0.4, kenar: 0.3, yay: 1, oyna: 0.5 });
  lavi(L, yolMaske((x) => { for (const c of kirCicek) { x.beginPath(); x.arc(c.x, c.y, c.r * 0.26, 0, PI2); x.fill(); } }), '#E2BC50', { guc: 0.85, kenar: 0.5, yay: 1, oyna: 0.3 });

  // ---------------------------------------------------------------- kurşun kalem ön çizimi (lavilerin altında, yer yer görünür)
  const KUR = katman();
  KUR.x.fillStyle = '#7E7E7B';
  const kalemCiz = (p, w, cift) => {
    let q = titret(ornekle(p, 1), 0.4, 30, nf3, rng() * 99);
    // kalem yer yer kalkar: uzun çizgiler kısa boşluklarla kırılır
    const parcalar = [];
    for (let i0 = 0; i0 < q.length - 1;) {
      const L0 = Math.round(40 + rng() * 90), i1 = Math.min(q.length, i0 + L0);
      parcalar.push(q.slice(i0, i1));
      i0 = i1 + (rng() < 0.55 ? Math.round(3 + rng() * 6) : 0);
    }
    for (const pq of parcalar) if (pq.length > 2) serit(KUR.x, pq, (t) => w * (0.6 + 0.4 * Math.sin(Math.PI * t)));
    if (cift && rng() < cift && q.length > 20) {
      const a = Math.floor(rng() * q.length * 0.4), b = Math.min(q.length - 1, a + Math.floor(q.length * (0.3 + rng() * 0.4)));
      const dx = (rng() - 0.5) * 1.6, dy = (rng() - 0.5) * 1.6;
      serit(KUR.x, q.slice(a, b).map((v) => [v[0] + dx, v[1] + dy]), (t) => w * 0.7 * Math.sin(Math.PI * t));
    }
  };
  for (const e of yapiCizgileri()) {
    if (e.tur === 'kaburga') { const p = e.p.filter((q) => q[1] > 316 && q[1] < 553); if (p.length > 4 && rng() < 0.75) kalemCiz(p, 0.8, 0); continue; }
    kalemCiz(e.p, e.tur === 'kubbe' ? 1.4 : 1.2, 0.85);
  }
  for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem]) for (const e of alemCizgileri(a)) kalemCiz(e.p, 0.95, 0.7);
  kalemCiz([[0, 800], [1024, 800]], 1.0, 0.6);
  { const p = []; for (let a = -0.4; a < PI2 * 0.84 - 0.4; a += 0.02) { const rr = gunesR(GX + Math.cos(a) * 30, GY + Math.sin(a) * 30) + 1.4 + 1.6 * Math.sin(2 * a + 0.9) + 1.5 * (a / PI2); p.push([GX + Math.cos(a) * rr, GY + Math.sin(a) * rr]); } kalemCiz(p, 1.0, 0); }
  // bitkiler ressam sırasıyla: öndeki biçim arkasındaki kalem izini örter (silgiyle alınmış gibi)
  const silK = (k, P) => { k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#000'; k.strokeStyle = '#000'; k.lineWidth = 2; k.fill(P); k.stroke(P); k.restore(); };
  for (const e of liste) {
    if (e.tur === 'sap') { const P = noktaYoluAcik(e.p); KUR.x.save(); KUR.x.globalCompositeOperation = 'destination-out'; KUR.x.lineWidth = 4; KUR.x.stroke(P); KUR.x.restore(); }
    else if (e.tur === 'yaprak') { silK(KUR.x, noktaYolu(e.p)); kalemCiz(e.p, 0.9, 0.3); }
    else if (e.tur === 'cicek') { const o = new Path2D(); o.arc(e.c.x, e.c.y, e.c.r * 0.3, 0, PI2); silK(KUR.x, o); for (const t of e.taclar) { silK(KUR.x, noktaYolu(t)); kalemCiz(t.concat([t[0]]), 1.0, 0.6); } const o2 = new Path2D(); o2.arc(e.c.x, e.c.y, e.c.r * 0.22, 0, PI2); silK(KUR.x, o2); }
    else if (e.tur === 'tomurcuk') { silK(KUR.x, noktaYolu(e.p)); kalemCiz(e.p, 0.8, 0); }
  }


  // ---------------------------------------------------------------- ince fırça: kaburgalar, pencere vurguları, saplar, damarlar
  const FIR = katman();
  const fir = (p, o) => kontur(FIR.x, p, Object.assign({ basinc: 0.25, nf, faz: rng() * 90, dalga: 26 }, o));
  const elA = (pts, gen) => titret(ornekle(pts, 1), gen == null ? 0.35 : gen, 34, nf3, rng() * 80);
  for (const k of SAHNE.kaburgalar(16, 120)) {
    const p = k.noktalar.slice().reverse().filter((q) => q[1] > 312 + 20 * (1 - Math.abs(k.u)) && q[1] < 553);
    const golge = k.u < 0.1;
    FIR.x.fillStyle = golge ? 'rgba(46,96,80,0.62)' : 'rgba(60,118,90,0.42)';
    fir(elA(p, 0.3), { w: golge ? 1.6 : 1.2, bas: 8, son: 3 });
  }
  // kasnak üst ve alt kenarlarında ince gölge çizgileri
  FIR.x.fillStyle = 'rgba(52,96,82,0.5)';
  for (const [x1, x2, y] of [[352, 768, 557], [334, 786, 612], [352, 768, 608], [334, 786, 690]]) fir(elA([[x1 + 2, y], [x2 - 2, y]], 0.4), { w: 1.3, bas: 6, son: 6 });
  // pencereler: yalnız burada koyu, ince vurgu (kemerin üst ve gölge yanında)
  FIR.x.fillStyle = 'rgba(40,44,38,0.7)';
  const kemerCiz = (w, kal) => {
    const d = duzlestir(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), 1)[0];
    const ust = d.filter((q) => q[1] < w.y + Math.min(w.h, w.w * 0.62) + 2 && q[0] <= w.x + w.w * 0.3);
    if (ust.length > 3) fir(elA(ust, 0.15), { w: kal, bas: 2, son: 3 });
  };
  for (const k of [0, 1]) for (const w of SAHNE.kasnakPencereleri(k)) kemerCiz(w, k ? 1.3 : 1.0);
  for (const w of SAHNE.kaide.pencereler) kemerCiz(w, 1.5);
  for (const w of SAHNE.minarePencereleri) kemerCiz(w, 1.1);
  // korniş altı ve şerefe altı gölge çizgisi
  FIR.x.fillStyle = 'rgba(110,118,132,0.55)';
  fir(elA([[292, 705], [828, 705]], 0.5), { w: 1.6, bas: 8, son: 10 });
  for (const [x1, x2, y] of [[248, 352, 469], [257, 343, 301]]) fir(elA([[x1, y], [x2, y]], 0.3), { w: 1.3, bas: 4, son: 4 });
  // zikzak bandı: ince fırçayla mavi-gri
  FIR.x.fillStyle = 'rgba(105,112,124,0.7)';
  for (const z of SAHNE.zikzakCizgileri()) fir(elA(z, 0.2), { w: 1.4, bas: 2, son: 2 });
  // korkuluk parmakları
  for (const [x1, x2, y1, y2, n] of [[252, 348, 436, 456, 9], [260, 340, 272, 290, 8]]) {
    for (let i = 0; i < n; i++) { const x = x1 + 5 + ((x2 - x1 - 10) * (i + 0.5)) / n; fir(elA([[x, y1 + 4], [x, y2 - 3]], 0.1), { w: 1.4, bas: 1, son: 1 }); }
    fir(elA([[x1 + 1, y1 + 2], [x2 - 1, y1 + 2]], 0.2), { w: 1.2, bas: 2, son: 2 });
  }
  // çayırda ince ot vuruşları (ön planda, kümeler hâlinde); öndeki bitkiler bunları örter
  {
    const r = SAHNE.rng(23709);
    for (let i = 0; i < 520; i++) {
      const x = r() * 1024, y = 836 + Math.pow(r(), 0.7) * 186;
      const len = 7 + (y - 820) * 0.08 + r() * 8;
      const a = -Math.PI / 2 + (r() - 0.5) * 0.6;
      if (kirM[Math.round(y - 4) * N + Math.round(x)] > 0.1) continue;
      vurus(FIR.x, ornekle([[x, y], [x + Math.cos(a) * len * 0.5 + (r() - 0.5) * 2, y + Math.sin(a) * len * 0.5], [x + Math.cos(a) * len, y + Math.sin(a) * len]], 1), { w: 1.6 + r() * 0.9, renk: i % 3 === 0 ? [84, 124, 90] : [100, 136, 80], a0: 0.5, a1: 0.25, bas: 0.5, son: len * 0.6 });
    }
    // kır çiçeklerinin üstüne düşen ot izleri silinir
    const k = FIR.x;
    k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#000';
    for (const c of kirCicek) { k.beginPath(); k.arc(c.x, c.y, c.r * 1.1, 0, PI2); k.fill(); }
    k.restore();
  }
  // bitkiler ressam sırasıyla: her öğe arkasındaki fırça izini örter, sonra kendi izleri çizilir
  const silF = (fn) => { const k = FIR.x; k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#000'; k.strokeStyle = '#000'; fn(k); k.restore(); };
  for (const e of liste) {
    if (e.tur === 'sap') {
      silF((k) => { k.lineWidth = 3.4; k.lineCap = 'round'; k.stroke(noktaYoluAcik(e.p)); });
      FIR.x.fillStyle = 'rgba(92,120,72,0.55)';
      fir(elA(e.p.slice().reverse(), 0.4), { w: 1.2, bas: 6, son: 3 });
    } else if (e.tur === 'yaprak') {
      silF((k) => k.fill(noktaYolu(e.p)));
      FIR.x.fillStyle = 'rgba(70,108,84,0.45)';
      const [a, b] = e.damar;
      fir(elA([a, [lerp(a[0], b[0], 0.8), lerp(a[1], b[1], 0.8)]], 0.2), { w: 1.0, bas: 2, son: 4 });
    } else if (e.tur === 'tomurcuk') {
      const t = e.t, ca = Math.cos(t.aci), sa = Math.sin(t.aci);
      FIR.x.fillStyle = 'rgba(92,124,74,0.7)';
      if (e.i >= 8) {
        const sp = [[t.x - ca * t.r * 0.7, t.y - sa * t.r * 0.7], [t.x - ca * t.r * 2.4 + 2, t.y + t.r * 2.2]];
        silF((k) => { k.lineWidth = 3; k.beginPath(); k.moveTo(sp[0][0], sp[0][1]); k.lineTo(sp[1][0], sp[1][1]); k.stroke(); });
        fir(elA(sp, 0.2), { w: 1.3, bas: 1, son: 3 });
      }
      silF((k) => k.fill(noktaYolu(e.p)));
      for (const sgn of [-1, 1]) fir(elA([[t.x - ca * t.r * 0.9, t.y - sa * t.r * 0.9], [t.x + ca * t.r * 0.3 - sa * sgn * t.r * 0.62, t.y + sa * t.r * 0.3 + ca * sgn * t.r * 0.62]], 0.1), { w: 1.6, bas: 1, son: 3 });
    } else if (e.tur === 'cicek') {
      const c = e.c;
      silF((k) => { for (const t of e.taclar) k.fill(noktaYolu(t)); k.beginPath(); k.arc(c.x, c.y, c.r * 0.3, 0, PI2); k.fill(); });
      FIR.x.fillStyle = 'rgba(138,104,42,0.8)';
      const say = c.r > 40 ? 10 : 7;
      for (let i = 0; i < say; i++) { const a = (i / say) * PI2 + c.aci; const rr = c.r * 0.22; FIR.x.beginPath(); FIR.x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, c.r > 40 ? 1.3 : 0.9, 0, PI2); FIR.x.fill(); }
    }
  }

  // ---------------------------------------------------------------- birleştir
  birlestir({
    ctx, H, L, kagit, kabartma: 0.1, cukur: 0.04,
    katmanlar: [
      { c: KUR.c, mod: 'carp', dis: (X, Y, h, a) => a * 0.95 * (0.5 + 0.5 * sstep(0.25, 0.7, h)) },
      { c: FIR.c, mod: 'carp', dis: (X, Y, h, a) => a * (0.88 + 0.2 * (0.5 - h)) },
    ],
  });
  SAHNE.hazir();

})();
</script>
