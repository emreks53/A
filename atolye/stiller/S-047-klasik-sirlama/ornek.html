<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-047 Klasik Sırlama (Sfumato) — eski usta yağlıboyası. Sıcak açık astar üstüne değer çalışması, üstüne saydam
// renk sırları (yeşil sır tek düze değil: bakır yeşili, sap yeşili, gölgede kahveleşmiş reçineli yeşil). Işıklar
// kalın ve opak sürülür, fırça izi verniğin altında hafifçe seçilir; gölgeler ince ve sfumato ile erir.
// Claude Lorrain ve Felemenk usulü ışıklı, doğal bulutlu gök; sıcak kahve-amber hava; yüzyılların sararmış verniği,
// ince çatlak ağı (krakle), kirlenmiş ve kararmış tuval kenarları.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024, N = W * W;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Tohumlu değer gürültüsü (256 periyotlu, yumuşak). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32Array); üç kez → yaklaşık Gauss. */
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, r), w, h, r), w, h, r);

  // ------------------------------------------------------------ bölge haritası (2048'de; kenarlarda 2×2 alt örnek)
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(olcek) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    SAHNE.ciz(g, { bolge: true, cicek: false });
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Uint8Array(w * w), onb = new Map();
    for (let i = 0; i < w * w; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      out[i] = b;
    }
    return out;
  }
  const GOK = BI.gok, GUNES = BI.gunes, ZEMIN = BI.zemin, MINARE = BI.minare, KAIDE = BI.kaide, KASNAK = BI.kasnak,
    KUBBE = BI.kubbe, PENCERE = BI.pencere, ALTIN = BI.altin;
  const W2 = 2 * W, BOL2 = bolgeDizisi(2);

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeRt = new Float32Array(W), kubbeDrt = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeRt[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDrt[y] = (kubbeRt[y + 1] - kubbeRt[y - 1]) / 2;
  kubbeDrt[300] = kubbeDrt[301] * 1.3; kubbeDrt[555] = kubbeDrt[554];
  function kubbeR(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeRt[555] : kubbeRt[i] * (1 - f) + kubbeRt[i + 1] * f; }
  function kubbeDr(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeDrt[555] : kubbeDrt[i] * (1 - f) + kubbeDrt[i + 1] * f; }
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(0.5, kubbeR(y)), -1, 1);
  function kubbeNormal(x, y) {
    const u = kubbeU(x, y), c = Math.sqrt(Math.max(0, 1 - u * u)), dr = kubbeDr(y), l = Math.hypot(u, dr, c) || 1;
    return [u / l, -dr / l, c / l];
  }
  function kubbeIsik(x, y) { const n = kubbeNormal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const ACI = Math.PI / 16;

  const R = SAHNE.rng(4747);
  const nA = gurultu(31), nB = gurultu(32), nC = gurultu(33), nD = gurultu(34), nE = gurultu(35);

  // ------------------------------------------------------------ ışık havuzu: kubbeyi saran ışık, çevreye doğru sıcak karanlık
  const havuz = (x, y) => {
    const dx = (x - 670) / 500, dy = (y - 420) / (y > 420 ? 470 : 520);
    return 0.4 + 0.7 * Math.exp(-(dx * dx + dy * dy) * 1.05);
  };

  // ------------------------------------------------------------ bulut kalınlığı (kümülüs: düz taban, kabarık tepe)
  const BH = 800, CH0 = new Float32Array(W * BH);
  const BULUTLAR = [
    // cx, taban y, yarı genişlik, yükseklik, tohum
    [140, 372, 250, 170, 1],
    [500, 182, 150, 50, 2],
    [805, 340, 215, 96, 3],
    [50, 585, 165, 40, 4],
    [985, 545, 150, 44, 5],
  ];
  for (let y = 0; y < BH; y++) for (let x = 0; x < W; x++) {
    let H = 0, wx = 0, wy = 0, hesap = false;
    for (const [cx, yb, hw, h, s] of BULUTLAR) {
      if (y < yb - h * 1.45 - 30 || y > yb + 36 || x < cx - hw - 20 || x > cx + hw + 20) continue;
      if (!hesap) { wx = (fbm(nE, x / 90, y / 90, 2) - 0.5) * 44; wy = (fbm(nE, x / 90 + 31, y / 90 + 17, 2) - 0.5) * 32; hesap = true; }
      const hx = (x + wx * 0.5 - cx) / hw; if (hx <= -1 || hx >= 1) continue;
      const pr = Math.pow(1 - hx * hx, 0.55);
      const top = yb - h * pr * (0.55 + 0.9 * fbm(nD, x / 72 + s * 7.1, s * 3.3, 3));
      const bot = yb + 16 * (fbm(nD, x / 46 + s * 5.3, s * 9.7, 2) - 0.5);
      const e = sstep(top - 8, top + 34, y + wy * 0.5) * sstep(bot + 12, bot - 22, y) * sstep(1, 0.72, Math.abs(hx));
      if (e <= 0) continue;
      const bil = fbm(nA, (x + wx) / 30 + s * 11, (y + wy) / 25 + s * 5, 5);
      H = Math.max(H, e * (0.3 + 1.15 * bil));
    }
    CH0[y * W + x] = H;
  }
  const CHB = bulanik3(CH0, W, BH, 1);
  const chb = (x, y) => {
    x = clamp(x, 0, W - 1.001); y = clamp(y, 0, BH - 1.001);
    const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * W + xi;
    return (CHB[i] * (1 - fx) + CHB[i + 1] * fx) * (1 - fy) + (CHB[i + W] * (1 - fx) + CHB[i + W + 1] * fx) * fy;
  };

  // ------------------------------------------------------------ uzak ağaç kümeleri (ufukta, hava perspektifiyle)
  const AGACLAR = [[30, 34, 40], [92, 30, 30], [178, 44, 54], [246, 26, 30], [852, 30, 34], [918, 44, 60], [990, 36, 42]];
  function agac(x, y) {
    let en = null, ust = 1e9;
    for (const a of AGACLAR) {
      const u = (x - a[0]) / a[1]; if (u <= -1 || u >= 1) continue;
      const t = 800 - a[2] * Math.sqrt(1 - u * u) * (0.85 + 0.3 * fbm(nB, x / 9, a[0], 2));
      if (t < ust) { ust = t; en = a; }
    }
    if (!en || y < ust - 1) return null;
    const u = (x - en[0]) / en[1], v = (y - (800 - en[2] * 0.6)) / (en[2] * 0.7);
    const yaprak = fbm(nC, x / 6, y / 6, 3);
    const V = clamp(0.38 + 0.38 * u - 0.32 * v + (yaprak - 0.5) * 0.5, 0, 1);
    return { a: sstep(ust - 1, ust + 1, y), c: mixc([0.07, 0.085, 0.04], [0.42, 0.44, 0.22], V) };
  }

  // ------------------------------------------------------------ gök: ışıklı pus, doğal bulutlar, uzak tepeler
  function gokRenk(x, y) {
    const dd = Math.hypot(x - 880, y - 140);
    const t = clamp(y / 790, 0, 1) + (fbm(nC, x / 170, y / 110, 3) - 0.5) * 0.06 + 0.12 * Math.exp(-(dd * dd) / (2 * 320 * 320));
    let c = rampa([[0, [0.12, 0.2, 0.36]], [0.26, [0.24, 0.38, 0.54]], [0.52, [0.5, 0.58, 0.62]], [0.78, [0.82, 0.79, 0.66]], [1, [0.97, 0.88, 0.66]]], t);
    c = mixc(c, [1.0, 0.94, 0.74], 0.85 * Math.exp(-(dd * dd) / (2 * 150 * 150)));
    c = mixc(c, [0.98, 0.9, 0.68], 0.5 * Math.exp(-(dd * dd) / (2 * 380 * 380)));
    c = mixc(c, [1.0, 0.99, 0.93], sstep(48, 24, dd));
    // ince, yatay yüksek bulut tülleri
    if (y < 520) {
      const cs = sstep(0.56, 0.8, fbm(nB, x / 300 + y / 900, y / 13, 4)) * sstep(520, 300, y) * 0.32;
      c = mixc(c, mixc([0.66, 0.68, 0.7], [1.0, 0.94, 0.8], Math.exp(-(dd * dd) / (2 * 420 * 420))), cs);
    }
    // kümülüs bulutlar: ışık güneşten (sağ üst); aydınlık kenarlar krem-altın, gölgeler mor-gri
    if (y < BH) {
      const h = chb(x, y);
      if (h > 0.1) {
        const al = sstep(0.16, 0.52, h);
        const gx = (chb(x + 2, y) - chb(x - 2, y)) / 4, gy = (chb(x, y + 2) - chb(x, y - 2)) / 4;
        let lx = 880 - x, ly = 140 - y; const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
        const nx = -gx * 22, ny = -gy * 22, nl = Math.hypot(nx, ny, 1);
        const lam = clamp((nx * lx * 0.85 + ny * ly * 0.85 + 0.42) / nl, 0, 1);
        let acc = 0; for (let j = 1; j <= 6; j++) acc += chb(x + lx * j * 8, y + ly * j * 8);
        const T = Math.exp(-acc * 0.36);
        const lit = clamp(0.5 * lam + 0.62 * T - 0.06, 0, 1);
        const yakin = Math.exp(-(dd * dd) / (2 * 430 * 430));
        const litC = mixc([0.97, 0.9, 0.78], [1.0, 0.97, 0.88], yakin);
        let shC = mixc(c, [0.46, 0.43, 0.48], 0.62);
        shC = mixc(shC, [0.78, 0.6, 0.44], 0.22 * sstep(0.2, 0.8, ny / nl)); // alttan yansıyan sıcak ışık
        let cc = mixc(shC, litC, Math.pow(lit, 1.2));
        cc = mixc(cc, [1.0, 0.97, 0.86], 0.5 * (1 - al) * sstep(0.3, 0.9, lam) * yakin); // gümüş kenar
        c = mixc(c, cc, al * 0.97);
      }
    }
    // uzak tepeler ve ağaçlar
    if (y > 690) {
      const pus = [0.76, 0.75, 0.66];
      const h1 = 752 + 14 * Math.sin(x / 150 + 1.3) + 26 * (fbm(nD, x / 120, 2.5, 3) - 0.5);
      c = mixc(c, mixc([0.48, 0.56, 0.6], pus, 0.4 + 0.4 * sstep(h1, h1 + 40, y)), sstep(h1 - 1.2, h1 + 1.2, y) * 0.78);
      const h2 = 778 + 7 * Math.sin(x / 80) + 12 * (fbm(nD, x / 60, 7.5, 3) - 0.5);
      c = mixc(c, mixc([0.38, 0.42, 0.3], pus, 0.32), sstep(h2 - 1.2, h2 + 1.2, y) * 0.9);
      const ag = agac(x, y);
      if (ag) c = mixc(c, mixc(ag.c, pus, 0.22), ag.a);
    }
    return c;
  }

  // ------------------------------------------------------------ sırlama: astar × değer × sır^kalınlık
  const ASTAR = [1.0, 0.92, 0.72];
  const sir = (V, T, kal) => {
    const u = 0.045 + 0.98 * V;
    return [ASTAR[0] * u * Math.pow(T[0], kal), ASTAR[1] * u * Math.pow(T[1], kal), ASTAR[2] * u * Math.pow(T[2], kal)];
  };
  const tasRenk = (V) => rampa([[0, [0.1, 0.06, 0.03]], [0.25, [0.26, 0.17, 0.09]], [0.5, [0.52, 0.39, 0.24]], [0.75, [0.8, 0.68, 0.48]], [0.92, [0.95, 0.87, 0.68]], [1, [1.0, 0.95, 0.82]]], V);
  const altinRenk = (V) => rampa([[0, [0.16, 0.08, 0.02]], [0.4, [0.5, 0.3, 0.07]], [0.75, [0.88, 0.64, 0.22]], [1, [1.0, 0.92, 0.6]]], V);
  /** Yeşil sır: bakır yeşili ↔ sap yeşili; gölgede kahveleşmiş reçineli yeşil. */
  function yesilSir(x, y, V) {
    const m1 = fbm(nB, x / 70, y / 88, 4), m2 = fbm(nC, x / 46 + 9, y / 58, 3);
    let T = mixc([0.24, 0.55, 0.42], [0.45, 0.6, 0.15], sstep(0.3, 0.7, m1));
    T = mixc(T, [0.52, 0.43, 0.2], (1 - V) * 0.6 * sstep(0.3, 0.68, m2));
    return [T, m2];
  }
  const KAIDE_P = SAHNE.kaide.pencereler;
  const KASNAK_P = [SAHNE.kasnakPencereleri(0), SAHNE.kasnakPencereleri(1)];

  // ------------------------------------------------------------ piksel boyama (bölgeye göre); out = [r,g,b,gölgelilik]
  const out = [0, 0, 0, 0];
  function boya(b, x, y) {
    let c, gol;
    if (b === GOK || b === GUNES) {
      c = gokRenk(x, y); gol = 0.2;
    } else if (b === KUBBE) {
      let V = kubbeIsik(x, y);
      const u = kubbeU(x, y), r = kubbeR(y), co = Math.sqrt(Math.max(0, 1 - u * u));
      const faz = (Math.asin(u) + Math.PI / 2) / ACI, fr = faz - Math.round(faz);
      const pxd = Math.abs(fr) * ACI * r * co, oluk = Math.exp(-(pxd * pxd) / 4.5);
      V *= 1 - 0.17 * oluk;
      if (fr > 0) V += 0.08 * Math.exp(-((pxd - 3.2) * (pxd - 3.2)) / 3.5) * V;
      V += 0.06 * sstep(500, 555, y) * sstep(0.1, -0.8, u);
      V = clamp(V, 0, 1);
      const [T, m2] = yesilSir(x, y, V);
      c = sir(V, T, 0.8 + 2.0 * (1 - V) + (m2 - 0.5) * 0.5 + 0.55 * oluk);
      c = mixc(c, [0.8, 0.84, 0.5], Math.pow(V, 6) * 0.42);
      const nn = kubbeNormal(x, y), hz = Math.max(0, (nn[0] * LV[0] + nn[1] * LV[1] + nn[2] * (LV[2] + 1)) / Math.hypot(LV[0], LV[1], LV[2] + 1));
      c = mixc(c, [0.96, 0.95, 0.78], Math.pow(hz, 36) * 0.38);
      // gölge yanında sıcak yansıma (kaide ve yerden)
      c = mixc(c, [0.42, 0.28, 0.12], 0.16 * sstep(0.2, -0.9, u) * sstep(420, 555, y));
      gol = 1 - V;
    } else if (b === KASNAK) {
      const ust = y < 610;
      let V = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.9 : 1.0);
      if (ust && y < 574) V *= 0.42 + 0.58 * sstep(555, 574, y);
      if (!ust && y < 613.5) V = Math.min(1, V * 1.25 + 0.06);
      else if (!ust && y < 628) V *= 0.6 + 0.4 * sstep(613, 628, y);
      if (y > 682) V *= 0.86;
      for (const p of KASNAK_P[ust ? 0 : 1]) {
        const dx = x - (p.x - p.w / 2 - 1.5);
        if (y > p.y && y < p.y + p.h && Math.abs(dx) < 2.6) V += 0.2 * (1 - Math.abs(dx) / 2.6) * silindirIsik(p.x, 560, 226);
      }
      V = clamp(V, 0, 1);
      const [T, m2] = yesilSir(x * 1.3, y * 1.3, V);
      c = sir(V, mixc(T, [0.42, 0.5, 0.2], 0.25), 1.15 + 1.7 * (1 - V) + (m2 - 0.5) * 0.4);
      c = mixc(c, [0.7, 0.74, 0.44], Math.pow(V, 7) * 0.3);
      gol = 1 - V;
    } else if (b === PENCERE) {
      const kasnakta = y > 555 && y < 692 && x > 330 && x < 790;
      c = kasnakta ? [0.03, 0.045, 0.025] : [0.085, 0.055, 0.03];
      if (y > 704 && y < 800) {
        for (const p of KAIDE_P) {
          if (Math.abs(x - p.x) > p.w / 2 + 1) continue;
          const sol = x - (p.x - p.w / 2);
          c = mixc([0.06, 0.04, 0.02], [0.2, 0.13, 0.07], sstep(p.y + 10, p.y + p.h, y) * 0.6);
          if (sol < 4) c = mixc(c, tasRenk(0.55 + 0.25 * (p.x - 300) / 520), sstep(4, 1, sol) * 0.85);
        }
      }
      gol = 1;
    } else if (b === KAIDE) {
      let V = 0.32 + 0.64 * Math.pow(clamp((x - 300) / 520, 0, 1), 0.7);
      if (y < 704) { V = 0.6 + 0.38 * clamp((x - 290) / 540, 0, 1); if (y < 695) V = Math.min(1, V * 1.12); }
      else if (y < 724) V *= 0.5 + 0.5 * sstep(704, 724, y);
      V *= 1 - 0.24 * sstep(762, 800, y);
      if (y > 704) {
        const sira = Math.floor((y - 704) / 24), yy = (y - 704) % 24, xx = (x - 300 + (sira % 2) * 30) % 60;
        const derz = Math.max(Math.exp(-(yy * yy) / 1.2), Math.exp(-((24 - yy) * (24 - yy)) / 1.2), Math.exp(-(xx * xx) / 1.2));

      }
    }
    const BT = new Float32Array(4096); { const r = SAHNE.rng(919); for (let i = 0; i < 4096; i++) BT[i] = r(); }
    const H = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const k = SID[i]; if (k < 0) continue;
      const s = vur[k], a = SA[i], cn = SC[i];
      const kenar = 1 - sstep(0.62, 1.0, Math.abs(cn)), kuru = sstep(0.2, 1.0, a);
      const bp = (cn * 0.5 + 0.5) * s.hw * 1.5, bi = Math.floor(bp), bf = bp - bi;
      const b0 = BT[(s.tohum + bi) & 4095], b1 = BT[(s.tohum + bi + 1) & 4095], br = b0 + (b1 - b0) * sstep(0, 1, bf);
      const m = s.mx * kenar * (1 - 0.6 * kuru * br);
      const st = 1 + (br - 0.5) * s.st * (1 + kuru * 1.5);
      CR[i] = (CR[i] * (1 - m) + s.r * m) * st; CG[i] = (CG[i] * (1 - m) + s.g * m) * st; CB[i] = (CB[i] * (1 - m) + s.b * m) * st;
      H[i] = ((0.5 + 0.5 * br) * kenar * (1 - 0.5 * kuru) + 0.35 * sstep(0.55, 0.9, Math.abs(cn)) * (1 - kuru)) * (s.s === 1 || s.s === 6 ? 0.8 : 1);
    }
    // kabartı: verniğin altında, sağ üstten gelen ışıkla çok hafif
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, rel = 0.35 * (H[i - 1] - H[i + 1] + H[i + W] - H[i - W]);
      const k = 1 + rel * 0.09 * (1 - GOLGE[i] * 0.7);
      CR[i] *= k; CG[i] *= k; CB[i] *= k;
    }
  }

  // ------------------------------------------------------------ sfumato: ışıkta kenar bulunur, gölgede duman gibi kaybolur
  {
    const r2 = [bulanik3(CR, W, W, 3), bulanik3(CG, W, W, 3), bulanik3(CB, W, W, 3)];
    const gb = bulanik3(GOLGE, W, W, 2);
    for (let i = 0; i < N; i++) {
      const k = sstep(0.38, 0.95, gb[i]) * 0.72;
      CR[i] += (r2[0][i] - CR[i]) * k; CG[i] += (r2[1][i] - CG[i]) * k; CB[i] += (r2[2][i] - CB[i]) * k;
    }
  }

  // ------------------------------------------------------------ çatlak ağı (krakle): bozulmuş Voronoi hücre sınırları, çanaklaşma
  const CAT = new Float32Array(N), CUP = new Float32Array(N);
  function krakle(hucre, gen, guc, tohum, ax, ay) {
    const r = SAHNE.rng(tohum), M = Math.ceil(W * 1.2 / hucre) + 3;
    const PX = new Float32Array(M * M), PY = new Float32Array(M * M);
    for (let j = 0; j < M; j++) for (let k = 0; k < M; k++) { PX[j * M + k] = (k + 0.15 + r() * 0.7) * hucre; PY[j * M + k] = (j + 0.15 + r() * 0.7) * hucre; }
    for (let py = 0; py < W; py++) for (let px = 0; px < W; px++) {
      const wx = px * ax + (nC(px / 17 + tohum, py / 17) - 0.5) * hucre * 0.6 + hucre, wy = py * ay + (nD(px / 17, py / 17 + tohum) - 0.5) * hucre * 0.6 + hucre;
      const gx = Math.floor(wx / hucre), gy = Math.floor(wy / hucre);
      let f1 = 1e9, f2 = 1e9, q1 = 0;
      for (let j = gy - 1; j <= gy + 1; j++) for (let k = gx - 1; k <= gx + 1; k++) {
        if (j < 0 || k < 0 || j >= M || k >= M) continue;
        const q = j * M + k, dx = PX[q] - wx, dy = PY[q] - wy, d = dx * dx + dy * dy;
        if (d < f1) { f2 = f1; f1 = d; q1 = q; } else if (d < f2) f2 = d;
      }
      const e = (Math.sqrt(f2) - Math.sqrt(f1)) * 0.5, i = py * W + px;
      const yog = sstep(0.22, 0.66, nC(px / 130 + tohum * 3, py / 130));
      const gg = gen * (0.6 + 0.8 * nD(px / 36 + tohum, py / 36));
      CAT[i] = Math.max(CAT[i], guc * (0.3 + 0.7 * yog) * (1 - sstep(gg * 0.3, gg, e)));
      const vx = wx - PX[q1], vy = wy - PY[q1], vl = Math.hypot(vx, vy) || 1;
      CUP[i] += ((vx * 0.7 - vy * 0.7) / vl) * sstep(hucre * 0.35, 0, e) * 0.03 * guc;
    }
  }
  krakle(15, 0.95, 1.0, 71, 0.9, 1.06);
  krakle(6.5, 0.6, 0.38, 72, 1.0, 1.0);

  // ------------------------------------------------------------ sararmış vernik, kir, bez dokusu, çatlaklar, son ton
  {
    const tuval = document.getElementById('tuval');
    const ctx = SAHNE.tuval(tuval, 1);
    const img = ctx.createImageData(W, W), d = img.data;
    const ton = (v) => { v = clamp(v, 0, 1.2); const s = Math.min(1, v); return clamp(s * s * (3 - 2 * s) * 0.32 + v * 0.68, 0, 1); };
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let r = CR[i], g = CG[i], b = CB[i];
      const lum = 0.3 * r + 0.55 * g + 0.15 * b;
      // vernik: maviyi yeşile, beyazı bal rengine çeker; kenar ve altta daha kalın, eşitsiz
      const ex = Math.min(x, W - x, y, W - y);
      const kal = 0.1 * (1 - sstep(0, 230, ex)) + 0.05 * sstep(600, 1024, y) + 0.06 * (fbm(nE, x / 150, y / 150, 3) - 0.5);
      r = r * (0.99 - kal * 0.2) + 0.03; g = g * (0.9 - kal * 0.3) + 0.018; b = b * (0.64 - kal * 0.45) + 0.005;
      // kir ve kararmış tuval kenarı
      const kir = 0.8 + 0.2 * sstep(0, 170, ex) - 0.07 * (fbm(nB, x / 110, y / 110, 3) - 0.5) - 0.12 * sstep(10, 0, ex);
      r *= kir; g *= kir * 0.985; b *= kir * 0.95;
      // bez dokusu: ışıklarda hafifçe seçilen tuval örgüsü
      const orgu = Math.sin(x * 1.92 + 0.5 * Math.sin(y * 0.11)) * Math.sin(y * 2.03 + 0.4 * Math.sin(x * 0.07));
      const dok = 1 + (0.022 * orgu + 0.02 * (nA(x * 0.8, y * 0.8) - 0.5)) * (0.4 + 0.6 * sstep(0.1, 0.5, lum));
      // çatlaklar: açıkta koyu, koyuda hafif açık çizgi; hücre kenarları kalkık
      const cat = CAT[i];
      const cg = 1 - 0.3 * cat * sstep(0.05, 0.4, lum) + 0.1 * cat * sstep(0.14, 0.03, lum);
      const k = dok * cg * (1 + CUP[i] * sstep(0.03, 0.3, lum));
      d[i * 4] = ton(r * k) * 255; d[i * 4 + 1] = ton(g * k) * 255; d[i * 4 + 2] = ton(b * k) * 255; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
</script>
