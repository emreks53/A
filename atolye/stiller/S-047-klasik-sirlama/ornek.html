<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-047 Klasik Sırlama (Sfumato) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #2a1a0e; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-047 Klasik Sırlama (Sfumato) — eski usta yağlıboyası: sıcak açık astar üstüne değer çalışması (grizay),
// üstüne saydam renk sırları; kenarlar sfumato ile duman gibi erir, fırça izi görünmez. Güçlü ışık-gölge,
// sıcak koyu çevre, hava perspektifi; yüzyılların sararmış verniği ve bütün yüzeyi saran ince çatlak ağı.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Tohumlu değer gürültüsü (256 periyotlu, yumuşak). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32Array). */
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, r), w, h, r), w, h, r);

  // ------------------------------------------------------------ bölge haritası (istenen ölçekte)
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(olcek, cicek) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    SAHNE.ciz(g, { bolge: true, cicek: cicek !== false });
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Uint8Array(w * w), onb = new Map();
    for (let i = 0; i < w * w; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      out[i] = b;
    }
    return out;
  }
  /** Bir Path2D listesini (1024 koordinatında) olcek çözünürlüğünde 0..1 maskeye çevirir. */
  function maske(olcek, ciz) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff';
    ciz(g);
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Float32Array(w * w);
    for (let i = 0; i < w * w; i++) out[i] = v[i * 4 + 3] / 255;
    return out;
  }

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeRt = new Float32Array(W), kubbeDrt = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeRt[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDrt[y] = (kubbeRt[y + 1] - kubbeRt[y - 1]) / 2;
  kubbeDrt[300] = kubbeDrt[301] * 1.3; kubbeDrt[555] = kubbeDrt[554];
  function kubbeR(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeRt[555] : kubbeRt[i] * (1 - f) + kubbeRt[i + 1] * f; }
  function kubbeDr(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeDrt[555] : kubbeDrt[i] * (1 - f) + kubbeDrt[i + 1] * f; }
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(0.5, kubbeR(y)), -1, 1);
  /** Kubbe yüzey normali [nx, ny, nz] (ekran: x sağ, y aşağı, z izleyiciye). */
  function kubbeNormal(x, y) {
    const u = kubbeU(x, y), c = Math.sqrt(Math.max(0, 1 - u * u)), dr = kubbeDr(y), l = Math.hypot(u, dr, c) || 1;
    return [u / l, -dr / l, c / l];
  }
  function kubbeIsik(x, y) { const n = kubbeNormal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  /** Kubbenin minareye düşen gölgesi (minarenin sağ alt kısmı kubbenin arkasında kalır). */
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const BULUTLAR = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];

  const S = 2, W2 = W * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(4747);
  const nA = gurultu(31), nB = gurultu(32), nC = gurultu(33), nD = gurultu(34);

  const BOL = bolgeDizisi(S, false);
  const BOL1 = bolgeDizisi(1, false);
  const CR = new Float32Array(N2), CG = new Float32Array(N2), CB = new Float32Array(N2);
  const GOLGE = new Float32Array(N2); // sfumato için: ne kadar gölgede (0 ışık, 1 derin gölge)
  const ACI = Math.PI / 16;

  // ------------------------------------------------------------ bulut yoğunluğu (1024'te, yumuşak)
  const BULUT = new Float32Array(W * W);
  {
    const kumeler = [[150, 300, 1.25], [470, 150, 1.0], [790, 330, 1.05], [960, 480, 0.6], [80, 500, 0.6], [640, 520, 0.5]];
    for (let y = 0; y < 760; y++) for (let x = 0; x < W; x++) {
      let b = 0;
      for (const [cx, cy, s] of kumeler) {
        const dx = (x - cx) / (190 * s), dy = (y - cy) / (62 * s) * (y > cy ? 1.7 : 1);
        b = Math.max(b, Math.exp(-(dx * dx + dy * dy)));
      }
      const n = fbm(nA, x / 64, y / 46, 5);
      BULUT[y * W + x] = sstep(0.38, 0.8, b * 1.15 + (n - 0.5) * 1.1);
    }
  }
  const bul = (x, y) => {
    x = clamp(x, 0, W - 1.001); y = clamp(y, 0, W - 1.001);
    const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * W + xi;
    return (BULUT[i] * (1 - fx) + BULUT[i + 1] * fx) * (1 - fy) + (BULUT[i + W] * (1 - fx) + BULUT[i + W + 1] * fx) * fy;
  };

  // ------------------------------------------------------------ ışık havuzu: kubbeyi saran ışık, çevreye doğru sıcak karanlık
  const havuz = (x, y) => {
    const dx = (x - 650) / 480, dy = (y - 440) / (y > 440 ? 470 : 430);
    return 0.32 + 0.8 * Math.exp(-(dx * dx + dy * dy) * 1.05);
  };

  // ------------------------------------------------------------ sırlama: astar × saydam renk sırrı^kalınlık
  const SIR_YESIL = [0.3, 0.6, 0.25];
  const sir = (V, T, kal, astar) => {
    const a = astar || [1.0, 0.92, 0.72];
    const u = 0.05 + 0.98 * V;
    return [a[0] * u * Math.pow(T[0], kal), a[1] * u * Math.pow(T[1], kal), a[2] * u * Math.pow(T[2], kal)];
  };
  const tasRenk = (V) => rampa([[0, [0.09, 0.055, 0.03]], [0.25, [0.24, 0.16, 0.09]], [0.5, [0.5, 0.38, 0.24]], [0.75, [0.8, 0.68, 0.48]], [0.92, [0.96, 0.88, 0.68]], [1, [1.0, 0.96, 0.82]]], V);
  const altinRenk = (V) => rampa([[0, [0.16, 0.08, 0.02]], [0.4, [0.5, 0.3, 0.07]], [0.75, [0.88, 0.64, 0.22]], [1, [1.0, 0.92, 0.6]]], V);

  for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
    const i = py * W2 + px, x = (px + 0.5) / S, y = (py + 0.5) / S, b = ADLAR[BOL[i]];
    let c, gol = 0;
    if (b === 'gok' || b === 'gunes' || (b === 'altin' && false)) {
      const t = y / 800;
      c = rampa([[0, [0.08, 0.17, 0.27]], [0.3, [0.2, 0.36, 0.5]], [0.6, [0.46, 0.58, 0.62]], [0.84, [0.84, 0.78, 0.6]], [1, [0.94, 0.8, 0.54]]], t + (fbm(nC, x / 140, y / 90, 3) - 0.5) * 0.08);
      const dd = Math.hypot(x - 880, y - 140);
      c = mixc(c, [1.0, 0.9, 0.62], 0.9 * Math.exp(-(dd * dd) / (2 * 140 * 140)));
      c = mixc(c, [0.98, 0.84, 0.56], 0.45 * Math.exp(-(dd * dd) / (2 * 330 * 330)));
      c = mixc(c, [1.0, 0.98, 0.88], sstep(52, 30, dd));
      // bulutlar: ışık sağ üstten; aydınlık yanlar altın krem, gölge yanlar mor-gri
      const d = bul(x, y);
      if (d > 0.002) {
        const kenar = clamp(0.5 + (d - bul(x + 8, y - 8)) * 2.6, 0, 1);
        const golge = 1 - 0.75 * bul(x + 26, y - 26) * sstep(0.2, 0.9, d);
        const lit = clamp(kenar * 0.55 + golge * 0.6 - 0.1, 0, 1);
        const yakin = Math.exp(-(dd * dd) / (2 * 380 * 380));
        const cg = mixc(mixc([0.44, 0.42, 0.44], [0.62, 0.6, 0.58], 1 - d * 0.5), mixc([0.98, 0.86, 0.64], [1.0, 0.96, 0.84], yakin), Math.pow(lit, 1.2));
        c = mixc(c, cg, Math.min(1, d * 1.05));
      }
      // uzak tepeler: hava perspektifiyle mavimsi ve puslu
      if (y > 690) {
        const h1 = 768 + 16 * Math.sin(x / 140 + 1.3) + 22 * (fbm(nD, x / 110, 2.5, 3) - 0.5);
        const h2 = 786 + 8 * Math.sin(x / 70) + 16 * (fbm(nD, x / 60, 7.5, 3) - 0.5);
        const pus = mixc([0.56, 0.62, 0.62], [0.86, 0.8, 0.62], 0.35);
        c = mixc(c, pus, sstep(h1 - 1.5, h1 + 1.5, y) * 0.75);
        c = mixc(c, mixc([0.34, 0.37, 0.28], pus, 0.25), sstep(h2 - 1.5, h2 + 1.5, y) * 0.9);
      }
      gol = 0.25;
    } else if (b === 'kubbe' || b === 'altin' && y > 290 && x > 400 && false) {
      let V = kubbeIsik(x, y);
      const u = kubbeU(x, y), r = kubbeR(y), co = Math.sqrt(Math.max(0, 1 - u * u));
      const faz = (Math.asin(u) + Math.PI / 2) / ACI, fr = faz - Math.round(faz);
      const pxd = Math.abs(fr) * ACI * r * co;
      V *= 1 - 0.15 * Math.exp(-(pxd * pxd) / 5);
      if (fr > 0) V += 0.07 * Math.exp(-((pxd - 3.5) * (pxd - 3.5)) / 4) * V;
      V += 0.05 * sstep(510, 555, y) * sstep(0.1, -0.8, u); // tabanda yansıyan sıcak ışık
      V = clamp(V * 0.97, 0, 1);
      const kal = 0.85 + 1.9 * (1 - V) + (fbm(nB, x / 40, y / 40, 3) - 0.5) * 0.35;
      c = sir(V, SIR_YESIL, kal);
      // parlak yerde açık, sıcak sır sürtmesi (scumble)
      const sp = Math.pow(clamp(V, 0, 1), 8);
      c = mixc(c, [0.8, 0.86, 0.5], sp * 0.5);
      { const nn = kubbeNormal(x, y), hz = Math.max(0, (nn[0] * LV[0] + nn[1] * LV[1] + nn[2] * (LV[2] + 1)) / Math.hypot(LV[0], LV[1], LV[2] + 1)); c = mixc(c, [0.95, 0.96, 0.75], Math.pow(hz, 40) * 0.45); }
      const lm = 0.3 * c[0] + 0.6 * c[1] + 0.1 * c[2];
      c = mixc(c, [lm * 1.05, lm, lm * 0.7], 0.26);
      gol = 1 - V;
    } else if (b === 'kasnak') {
      const ust = y < 610;
      let V = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.95 : 1.06);
      if (ust && y < 572) V *= 0.3 + 0.7 * sstep(555, 572, y);
      if (!ust && y < 626) V *= 0.4 + 0.6 * sstep(610, 626, y);
      // pencere açıklıklarının ışık alan sol iç yüzü
      for (const p of SAHNE.kasnakPencereleri(ust ? 0 : 1)) {
        const dx = x - (p.x - p.w / 2 - 1.5);
        if (y > p.y && y < p.y + p.h && Math.abs(dx) < 2.5) V += 0.18 * (1 - Math.abs(dx) / 2.5) * silindirIsik(p.x, 560, 226);
      }
      c = sir(V, SIR_YESIL, 1.2 + 1.7 * (1 - V) + (fbm(nB, x / 40, y / 40, 3) - 0.5) * 0.3);
      { const lm = 0.3 * c[0] + 0.6 * c[1] + 0.1 * c[2]; c = mixc(c, [lm * 1.05, lm, lm * 0.7], 0.28); }
      gol = 1 - V;
    } else if (b === 'pencere') {
      const kasnakta = y > 555 && y < 692 && x > 330 && x < 790;
      c = kasnakta ? [0.02, 0.04, 0.025] : [0.07, 0.04, 0.02];
      gol = 1;
    } else if (b === 'kaide') {
      let V = 0.32 + 0.68 * clamp((x - 300) / 520, 0, 1) ** 0.75;
      if (y < 704) V = 0.55 + 0.42 * clamp((x - 290) / 540, 0, 1); else if (y < 720) V *= 0.45 + 0.55 * sstep(704, 720, y);
      V *= 1 - 0.18 * sstep(770, 800, y);
      if (y > 704) {
        const sira = Math.floor((y - 704) / 24), yy = (y - 704) % 24, xx = (x - 300 + (sira % 2) * 30) % 60;
        const derz = Math.max(Math.exp(-(yy * yy) / 1.2), Math.exp(-((24 - yy) * (24 - yy)) / 1.2), Math.exp(-(xx * xx) / 1.2));
        V *= 1 - 0.07 * derz;
      }
      c = tasRenk(V);
      gol = 1 - V;
    } else if (b === 'minare') {
      let V = silindirIsik(x, 300, minareYari(y)) * 0.92;
      if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) V *= 0.5;
      if ((y > 436 && y < 456) || (y > 272 && y < 290)) V *= 0.82 + 0.18 * Math.cos((x - 300) * 0.8);
      V *= 1 - 0.65 * minareGolge(x, y);
      c = tasRenk(V);
      // hava perspektifi: minare kubbeden geride, biraz puslu
      c = mixc(c, [0.62, 0.62, 0.56], 0.14);
      gol = 1 - V;
    } else if (b === 'altin') {
      const cx = x > 430 ? 560 : 300, sc = cx === 560 ? 1 : 0.62;
      const V = clamp(0.5 + (x - cx) / (16 * sc), 0, 1);
      c = altinRenk(V * 0.95);
      c = mixc(c, [1, 0.97, 0.82], Math.pow(V, 12) * 0.7);
      gol = 0.5;
    } else {
      // yer: ufukta altın pus, öne doğru sıcak, derin toprak karanlığı
      const t = clamp((y - 800) / 224, 0, 1);
      c = rampa([[0, [0.6, 0.5, 0.32]], [0.12, [0.36, 0.27, 0.15]], [0.4, [0.16, 0.12, 0.06]], [1, [0.07, 0.05, 0.025]]], t + (fbm(nB, x / 90, y / 40, 3) - 0.5) * 0.2);
      const yo = fbm(nA, x / 46, y / 38, 4), yk = sstep(0.42, 0.62, yo) * sstep(806, 850, y);
      const tepe = clamp((yo - fbm(nA, (x + 7) / 46, (y - 7) / 38, 4)) * 9, 0, 1);
      c = mixc(c, mixc([0.05, 0.08, 0.035], [0.26, 0.3, 0.12], tepe * 0.8), yk * 0.9);
      gol = 0.6 + 0.4 * t;
    }
    const hv = havuz(x, y);
    CR[i] = c[0] * hv; CG[i] = c[1] * hv; CB[i] = c[2] * hv;
    GOLGE[i] = clamp(gol * 0.8 + (1 - hv) * 0.35, 0, 1);
  }

  // ------------------------------------------------------------ çiçekler: Felemenk natürmort usulü, koyudan ışığa çıkan beyaz çiçekler
  {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, S);
    const B = SAHNE.bitki;
    const L2 = [0.75, -0.66];
    const rgb = (a, k) => `rgb(${Math.round(clamp(a[0] * (k || 1), 0, 1) * 255)},${Math.round(clamp(a[1] * (k || 1), 0, 1) * 255)},${Math.round(clamp(a[2] * (k || 1), 0, 1) * 255)})`;
    // gövdeler
    g.lineCap = 'round';
    for (const s of B.saplar) {
      g.strokeStyle = rgb([0.12, 0.13, 0.05], havuz(s[12][0], s[12][1]) * 1.2); g.lineWidth = 3.6;
      g.stroke(new Path2D(SAHNE.yol(s)));
      g.strokeStyle = rgb([0.32, 0.34, 0.14], havuz(s[12][0], s[12][1])); g.lineWidth = 1.2;
      g.save(); g.translate(0.9, -0.4); g.stroke(new Path2D(SAHNE.yol(s))); g.restore();
    }
    // yapraklar: koyu sırlı yeşil, ışığa bakan yarıda yumuşak parıltı
    for (const y of B.yapraklar) {
      const hv = havuz(y.x, y.y) * (1.0 + R() * 0.7);
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const nx = -sa, ny = ca, isik = nx * L2[0] + ny * L2[1];
      const mx = y.x + ca * L * 0.45, my = y.y + sa * L * 0.45, wd = L * y.genislik * 0.5;
      const gr = g.createLinearGradient(mx - nx * wd, my - ny * wd, mx + nx * wd, my + ny * wd);
      const ac = [0.4, 0.48, 0.16], kz = [0.04, 0.07, 0.03], or = [0.15, 0.22, 0.08];
      const s1 = isik > 0 ? kz : ac, s2 = isik > 0 ? ac : kz;
      gr.addColorStop(0, rgb(s1, hv)); gr.addColorStop(0.48, rgb(or, hv)); gr.addColorStop(0.52, rgb(mixc(or, [0.4, 0.42, 0.2], 0.3), hv)); gr.addColorStop(1, rgb(s2, hv * (0.7 + Math.abs(isik) * 0.5)));
      // gölge
      g.save(); g.filter = 'blur(5px)'; g.fillStyle = 'rgba(10,6,2,0.45)'; g.translate(-4, 6); g.fill(new Path2D(SAHNE.yaprakYolu(y))); g.restore();
      g.fillStyle = gr; g.fill(new Path2D(SAHNE.yaprakYolu(y)));
      const [a0, a1] = SAHNE.yaprakDamari(y);
      g.strokeStyle = rgb([0.36, 0.4, 0.2], hv * 0.8); g.lineWidth = 0.9;
      g.beginPath(); g.moveTo(a0[0], a0[1]); g.lineTo(a1[0], a1[1]); g.stroke();
    }
    for (const t of B.tomurcuklar) {
      const hv = havuz(t.x, t.y);
      const gr = g.createRadialGradient(t.x + t.r * 0.4, t.y - t.r * 0.5, 0, t.x, t.y, t.r * 1.7);
      gr.addColorStop(0, rgb([0.98, 0.84, 0.8], hv)); gr.addColorStop(0.5, rgb([0.7, 0.42, 0.4], hv)); gr.addColorStop(1, rgb([0.22, 0.1, 0.08], hv));
      g.fillStyle = gr; g.fill(new Path2D(SAHNE.tomurcukYolu(t)));
    }
    // çiçekler: arkadakinden öndekine
    for (const cc of B.cicekler) {
      const hv = Math.min(1.25, havuz(cc.x, cc.y) * 1.6);
      const tp = SAHNE.tacYapraklari(cc);
      // çiçeğin düşürdüğü yumuşak gölge
      g.save(); g.filter = `blur(${Math.max(3, cc.r * 0.25)}px)`; g.fillStyle = 'rgba(8,4,1,0.55)';
      g.beginPath(); g.ellipse(cc.x - cc.r * 0.25, cc.y + cc.r * 0.3, cc.r * 1.05, cc.r * 0.95, 0, 0, Math.PI * 2); g.fill(); g.restore();
      // ışıktan uzak taç yapraklar önce
      const sira = tp.map((e, k) => [e, Math.cos(e.aci) * L2[0] + Math.sin(e.aci) * L2[1]]).sort((p, q) => p[1] - q[1]);
      for (const [e, yon] of sira) {
        const d = SAHNE.elipsYolu(e);
        const ox = e.cx + L2[0] * e.rx * 0.35, oy = e.cy + L2[1] * e.rx * 0.35;
        const gr = g.createRadialGradient(ox, oy, e.rx * 0.05, e.cx, e.cy, e.rx * 1.25);
        const k = 0.72 + 0.28 * (yon + 1) / 2;
        gr.addColorStop(0, rgb([1.0, 0.98, 0.92], hv * k)); gr.addColorStop(0.45, rgb([0.93, 0.88, 0.79], hv * k));
        gr.addColorStop(0.8, rgb([0.66, 0.58, 0.48], hv * k)); gr.addColorStop(1, rgb([0.48, 0.4, 0.32], hv * k));
        g.save(); g.filter = 'blur(2.5px)'; g.fillStyle = 'rgba(20,10,4,0.35)'; g.translate(-2, 3); g.fill(new Path2D(d)); g.restore();
        g.fillStyle = gr; g.fill(new Path2D(d));
        // göbeğe yakın pembe gölge
        const gp = g.createRadialGradient(cc.x, cc.y, 0, cc.x, cc.y, cc.r * 0.7);
        gp.addColorStop(0, `rgba(196,140,120,${0.45 * hv})`); gp.addColorStop(1, 'rgba(196,140,120,0)');
        g.fillStyle = gp; g.fill(new Path2D(d));
      }
      const gr = g.createRadialGradient(cc.x + cc.r * 0.06, cc.y - cc.r * 0.06, 0, cc.x, cc.y, cc.r * 0.24);
      gr.addColorStop(0, rgb([1.0, 0.86, 0.4], hv)); gr.addColorStop(0.6, rgb([0.78, 0.52, 0.12], hv)); gr.addColorStop(1, rgb([0.32, 0.18, 0.04], hv));
      g.fillStyle = gr; g.beginPath(); g.arc(cc.x, cc.y, cc.r * 0.21, 0, Math.PI * 2); g.fill();
      g.fillStyle = rgb([0.36, 0.2, 0.05], hv);
      for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2; g.beginPath(); g.arc(cc.x + Math.cos(a) * cc.r * 0.27, cc.y + Math.sin(a) * cc.r * 0.27, Math.max(0.9, cc.r * 0.03), 0, Math.PI * 2); g.fill(); }
    }
    const v = g.getImageData(0, 0, W2, W2).data;
    for (let i = 0; i < N2; i++) {
      const a = v[i * 4 + 3] / 255; if (!a) continue;
      CR[i] = CR[i] * (1 - a) + (v[i * 4] / 255);
      CG[i] = CG[i] * (1 - a) + (v[i * 4 + 1] / 255);
      CB[i] = CB[i] * (1 - a) + (v[i * 4 + 2] / 255);
      GOLGE[i] = GOLGE[i] * (1 - a) + a * clamp(1 - (v[i * 4] + v[i * 4 + 1]) / 400, 0, 1);
    }
  }

  // ------------------------------------------------------------ sfumato: ışıkta kenar bulunur, gölgede duman gibi kaybolur
  {
    const r1 = [bulanik3(CR, W2, W2, 1), bulanik3(CG, W2, W2, 1), bulanik3(CB, W2, W2, 1)];
    const r2 = [bulanik3(CR, W2, W2, 6), bulanik3(CG, W2, W2, 6), bulanik3(CB, W2, W2, 6)];
    const gb = bulanik3(GOLGE, W2, W2, 4);
    for (let i = 0; i < N2; i++) {
      const k = sstep(0.35, 0.95, gb[i]) * 0.75;
      CR[i] = r1[0][i] + (r2[0][i] - r1[0][i]) * k;
      CG[i] = r1[1][i] + (r2[1][i] - r1[1][i]) * k;
      CB[i] = r1[2][i] + (r2[2][i] - r1[2][i]) * k;
    }
  }

  // ------------------------------------------------------------ çatlak ağı (krakle): bozulmuş Voronoi hücre sınırları
  const CAT = new Float32Array(N2), CUP = new Float32Array(N2);
  function krakle(hucre, gen, guc, tohum) {
    const r = SAHNE.rng(tohum), M = Math.ceil(W2 / hucre) + 2;
    const PX = new Float32Array(M * M), PY = new Float32Array(M * M), PV = new Float32Array(M * M);
    for (let j = 0; j < M; j++) for (let k = 0; k < M; k++) { PX[j * M + k] = (k + r()) * hucre; PY[j * M + k] = (j + r()) * hucre; PV[j * M + k] = r(); }
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const wx = px * 0.82 + (nC(px / 23, py / 23) - 0.5) * hucre * 0.6, wy = py * 1.08 + (nD(px / 23, py / 23) - 0.5) * hucre * 0.6;
      const gx = Math.floor(wx / hucre), gy = Math.floor(wy / hucre);
      let f1 = 1e9, f2 = 1e9, id = 0;
      for (let j = gy - 1; j <= gy + 1; j++) for (let k = gx - 1; k <= gx + 1; k++) {
        if (j < 0 || k < 0 || j >= M || k >= M) continue;
        const q = j * M + k, dx = PX[q] - wx, dy = PY[q] - wy, d = dx * dx + dy * dy;
        if (d < f1) { f2 = f1; f1 = d; id = q; } else if (d < f2) f2 = d;
      }
      const e = (Math.sqrt(f2) - Math.sqrt(f1)) * 0.5;
      const i = py * W2 + px;
      const yog = sstep(0.25, 0.7, nC(px / 140 + tohum, py / 140));
      const gg = gen * (0.6 + 0.8 * nD(px / 40 + tohum, py / 40));
      CAT[i] = Math.max(CAT[i], guc * (0.35 + 0.65 * yog) * (1 - sstep(gg * 0.35, gg, e)));
      CUP[i] += (PV[id] - 0.5) * guc * 0.035 + sstep(gen * 4, 0, e) * 0.015 * guc;
    }
  }
  krakle(26, 0.75, 1.0, 71);
  krakle(11, 0.5, 0.35, 72);

  // ------------------------------------------------------------ vernik, bez dokusu, çatlaklar, son ton
  {
    const img = ctx.createImageData(W2, W2), d = img.data;
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px, x = px / S, y = py / S;
      let r = CR[i], g = CG[i], b = CB[i];
      // sararmış vernik: maviyi yeşile, beyazı bal rengine çeker; koyular sıcak kahveye açılır
      const lum = 0.3 * r + 0.55 * g + 0.15 * b;
      r = r * 0.98 + 0.03; g = g * 0.93 + 0.02; b = b * 0.76 + 0.006;
      // vernik ve kir kenarlarda koyulaşır
      const ex = Math.min(x, W - x, y, W - y);
      const kir = 0.82 + 0.18 * sstep(0, 190, ex) - 0.06 * (fbm(nB, x / 120, y / 120, 3) - 0.5);
      r *= kir; g *= kir * 0.99; b *= kir * 0.96;
      // bez dokusu (çok hafif)
      const dok = 1 + 0.03 * Math.sin(px * 1.15 + 0.4 * Math.sin(py * 0.05)) * Math.sin(py * 1.15) + 0.03 * (nA(px * 0.9, py * 0.9) - 0.5);
      // çatlaklar: açık yerde koyu çizgi, koyu yerde hafif açık; hücre çanaklaşması
      const cat = CAT[i];
      const cg = 1 - 0.28 * cat * sstep(0.04, 0.4, lum) + 0.08 * cat * sstep(0.12, 0.02, lum);
      const k = dok * cg * (1 + CUP[i]);
      // ton eğrisi: hafif S, derin ama tam siyah olmayan gölgeler
      const ton = (v) => { v = clamp(v, 0, 1.2); return clamp(v * v * (3 - 2 * Math.min(1, v)) * 0.35 + v * 0.65, 0, 1); };
      d[i * 4] = ton(r * k) * 255; d[i * 4 + 1] = ton(g * k) * 255; d[i * 4 + 2] = ton(b * k) * 255; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
</script>
