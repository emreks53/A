<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-003 Yumuşak Pastel — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #9d9487; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-003 Yumuşak Pastel — tonlu (sıcak gri) Mi-Teintes kâğıdı üzerinde tebeşirimsi, kırık vuruşlar. Pigment
// yalnız kâğıt dişinin tepelerine tutunur: her katın vuruşları bir basınç haritasına çizilir, sonra
// "diş yüksekliği > 1 − basınç" olan yerlerde boya bırakılır. Çubuğun yan yüzüyle geniş vuruşlar,
// ucuyla tarama çizgileri; gök ve kubbe gölgesi parmakla dağıtılır, üstüne keskin vuruşlar gelir.
(function () {
  'use strict';
  const W = 1024, N = W * W, S2 = 2, W2 = W * S2, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(3003);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const nA = gurultu(21), nB = gurultu(22), nC = gurultu(23), nD = gurultu(24);

  // ------------------------------------------------------------ bölgeler ve ışık
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const bolge = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];
  const SINIF = new Uint8Array(16);
  [['gok', 1], ['gunes', 1], ['kubbe', 2], ['kasnak', 3], ['kaide', 4], ['minare', 5], ['pencere', 6], ['altin', 7], ['yaprak', 8], ['sap', 8], ['cicek', 9], ['cicekOrta', 10], ['zemin', 11]].forEach(([a, s]) => (SINIF[BI[a]] = s));
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(1, kubbeR[clamp(Math.round(y), 300, 555)]), -1, 1);
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), u = kubbeU(x, y), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / Math.hypot(u, dr, c));
  }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));

  // ------------------------------------------------------------ pastel çubukları (sınırlı bir kutu)
  const CUBUK = [
    [64, 80, 150], [78, 108, 186], [96, 146, 214], [150, 192, 230], [206, 226, 240], [176, 160, 214], [124, 104, 170],
    [80, 120, 200], [120, 170, 224], [180, 212, 236], [70, 150, 196], [136, 196, 214],
    [228, 224, 204], [204, 216, 218], [238, 234, 192], [250, 242, 206],
    [246, 240, 222], [255, 250, 238], [252, 230, 158], [246, 200, 116], [238, 168, 150], [232, 178, 196],
    [34, 66, 60], [46, 98, 76], [66, 136, 84], [108, 172, 92], [168, 208, 120], [214, 232, 164], [70, 122, 120], [150, 196, 170], [196, 222, 200],
    [236, 220, 188], [204, 184, 152], [158, 136, 140], [112, 100, 132], [70, 58, 82], [52, 42, 62],
    [232, 182, 58], [252, 222, 122], [150, 98, 32], [204, 156, 98], [160, 108, 66], [112, 82, 56],
    [210, 72, 118], [244, 192, 44], [214, 128, 34],
  ];
  const TEBESIR = [236, 232, 222];
  function cubukSec(c, kirik) {
    // tebeşirimsi: pastel çubuğunun beyaz dolgusu renkleri açar ve yumuşatır
    c = mixc(c, TEBESIR, 0.1);
    // en yakın iki çubuktan biri (kırık renk)
    let e1 = 1e9, e2 = 1e9, i1 = 0, i2 = 0;
    for (let i = 0; i < CUBUK.length; i++) {
      const k = CUBUK[i], dr = c[0] - k[0], dg = c[1] - k[1], db = c[2] - k[2];
      const d = dr * dr * 0.9 + dg * dg * 1.2 + db * db * 0.8;
      if (d < e1) { e2 = e1; i2 = i1; e1 = d; i1 = i; } else if (d < e2) { e2 = d; i2 = i; }
    }
    return CUBUK[R() < (kirik || 0) && e2 < e1 * 3.5 + 900 ? i2 : i1];
  }

  // ------------------------------------------------------------ hedef: ressamın gördüğü renkler (yüksek anahtar, tozlu)
  const RAMPA = {
    kubbe: [[0, [44, 86, 84]], [0.3, [62, 122, 98]], [0.55, [92, 158, 102]], [0.78, [146, 194, 118]], [0.92, [198, 222, 156]], [1, [234, 240, 196]]],
    kasnak: [[0, [40, 78, 76]], [0.35, [56, 110, 90]], [0.65, [82, 144, 98]], [1, [138, 184, 118]]],
    tas: [[0, [104, 92, 128]], [0.35, [156, 138, 146]], [0.6, [206, 188, 160]], [0.82, [240, 226, 196]], [1, [255, 250, 236]]],
    altin: [[0, [140, 90, 30]], [0.5, [226, 176, 58]], [1, [254, 230, 140]]],
  };
  const hc0 = SAHNE.yeniTuval(W, W), h0 = hc0.getContext('2d', { willReadFrequently: true });
  {
    const img = h0.createImageData(W, W), d = img.data;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, b = ADLAR[BOL[i]];
      let c;
      if (b === 'kubbe') c = rampa(RAMPA.kubbe, kubbeIsik(x, y));
      else if (b === 'kasnak') { const ust = y < 610; let l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.9 : 1); if (ust && y < 568) l *= 0.6; c = rampa(RAMPA.kasnak, l); }
      else if (b === 'kaide') { let l = 0.5 + 0.45 * clamp((x - 300) / 520, 0, 1); if (y < 704) l = 0.97; else if (y < 713) l *= 0.62; c = rampa(RAMPA.tas, l); }
      else if (b === 'minare') { let l = silindirIsik(x, 300, minareYari(y)); if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) l *= 0.5; l *= 1 - 0.5 * minareGolge(x, y); c = rampa(RAMPA.tas, l); }
      else if (b === 'altin') { const cx = x > 430 ? 560 : 300; c = rampa(RAMPA.altin, clamp(0.5 + (x - cx) / 12, 0, 1)); }
      else if (b === 'pencere') { const kas = y > 555 && y < 692 && x > 330 && x < 790; c = kas ? [18, 40, 40] : [84, 66, 80]; }
      else if (y < 800) {
        const t = y / 800;
        c = rampa([[0, [92, 120, 184]], [0.4, [128, 162, 212]], [0.72, [178, 202, 224]], [0.9, [226, 222, 206]], [1, [242, 216, 180]]], t + (nA(x / 220, y / 140) - 0.5) * 0.1);
        const dd = Math.hypot(x - 880, y - 140);
        c = mixc(c, [252, 232, 160], 0.85 * Math.exp(-(dd * dd) / (2 * 170 * 170)));
        c = mixc(c, [255, 250, 236], sstep(64, 40, dd));
      } else {
        const yer = 826 + (fbm(nB, x / 60, 3, 3) - 0.5) * 50;
        if (y < yer) c = [206, 164, 104];
        else {
          const t = fbm(nA, x / 34, y / 30, 4);
          c = rampa([[0, [40, 72, 66]], [0.35, [56, 102, 78]], [0.6, [84, 138, 90]], [0.8, [128, 170, 98]], [1, [190, 208, 132]]], clamp(t * 1.5 - 0.25, 0, 1));
          c = mixc(c, [120, 84, 60], 0.6 * sstep(0.6, 0.72, fbm(nC, x / 60, y / 40, 3)));
          c = mixc(c, [56, 110, 110], 0.5 * sstep(0.62, 0.75, fbm(nD, x / 50 + 9, y / 50, 3)));
        }
      }
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    h0.putImageData(img, 0, 0);
    // bulutlar
    const rb = SAHNE.rng(3);
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]]) {
      for (let i = 0; i < 14; i++) {
        const x = bx + (rb() - 0.5) * 150 * bs, y = by + (rb() - 0.5) * 30 * bs, r = (22 + rb() * 26) * bs;
        const g = h0.createRadialGradient(x, y - r * 0.3, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,250,238,0.55)'); g.addColorStop(0.65, 'rgba(232,222,236,0.3)'); g.addColorStop(1, 'rgba(200,190,226,0)');
        h0.fillStyle = g; h0.beginPath(); h0.arc(x, y, r, 0, Math.PI * 2); h0.fill();
      }
    }
  }
  // bitkiler: renk + doğrultu haritası
  const yc = SAHNE.yeniTuval(W, W), y0 = yc.getContext('2d', { willReadFrequently: true });
  {
    const B = SAHNE.bitki, rb = SAHNE.rng(17);
    const yonRenk = (a) => `rgb(${Math.round((Math.cos(2 * a) + 1) * 127.5)},${Math.round((Math.sin(2 * a) + 1) * 127.5)},255)`;
    h0.lineCap = 'round'; y0.lineCap = 'round';
    for (const s of B.saplar) {
      h0.strokeStyle = 'rgb(66,110,56)'; h0.lineWidth = 4.5; h0.stroke(new Path2D(SAHNE.yol(s)));
      for (let i = 0; i < s.length - 1; i++) { y0.strokeStyle = yonRenk(Math.atan2(s[i + 1][1] - s[i][1], s[i + 1][0] - s[i][0])); y0.lineWidth = 6; y0.beginPath(); y0.moveTo(...s[i]); y0.lineTo(...s[i + 1]); y0.stroke(); }
    }
    for (const yp of B.yapraklar) {
      const p = new Path2D(SAHNE.yaprakYolu(yp));
      const nx = -Math.sin(yp.aci), ny = Math.cos(yp.aci), isikli = nx * 0.74 + ny * -0.67 > 0 ? 1 : -1, w2 = yp.uzunluk * yp.genislik * 0.5;
      const g = h0.createLinearGradient(yp.x - nx * w2 * isikli, yp.y - ny * w2 * isikli, yp.x + nx * w2 * isikli, yp.y + ny * w2 * isikli);
      const koyu = yp.uzunluk > 50 ? 0.85 : 1, t = rb();
      g.addColorStop(0, `rgb(${22 * koyu},${60 * koyu},${48 * koyu})`);
      g.addColorStop(0.5, `rgb(${(50 + t * 30) * koyu},${(112 + t * 20) * koyu},${60 * koyu})`);
      g.addColorStop(1, `rgb(${(140 + t * 40) * koyu},${(190 + t * 20) * koyu},${90 * koyu})`);
      h0.fillStyle = g; h0.fill(p); y0.fillStyle = yonRenk(yp.aci); y0.fill(p);
    }
    for (const t of B.tomurcuklar) { const p = new Path2D(SAHNE.tomurcukYolu(t)); h0.fillStyle = 'rgb(226,140,170)'; h0.fill(p); y0.fillStyle = yonRenk(t.aci); y0.fill(p); }
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const p = new Path2D(SAHNE.elipsYolu(e));
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
        h0.fillStyle = yon > -0.25 ? 'rgb(255,252,244)' : 'rgb(196,186,222)'; h0.fill(p);
        y0.fillStyle = yonRenk(e.aci); y0.fill(p);
      }
      h0.fillStyle = 'rgb(244,190,44)'; h0.beginPath(); h0.arc(c.x, c.y, c.r * 0.22, 0, Math.PI * 2); h0.fill();
      y0.fillStyle = yonRenk(rb() * 3); y0.beginPath(); y0.arc(c.x, c.y, c.r * 0.22, 0, Math.PI * 2); y0.fill();
    }
  }
  const HV = h0.getImageData(0, 0, W, W).data, YV = y0.getImageData(0, 0, W, W).data;
  const hedef = (x, y) => { const i = (clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)) * 4; return [HV[i], HV[i + 1], HV[i + 2]]; };

  function yon(x, y, tip) {
    const xi = clamp(Math.round(x), 0, W - 1), yi = clamp(Math.round(y), 0, W - 1), i = yi * W + xi;
    if (YV[i * 4 + 2] > 200) return Math.atan2(YV[i * 4 + 1] / 127.5 - 1, YV[i * 4] / 127.5 - 1) / 2;
    const b = ADLAR[BOL[i]];
    switch (b) {
      case 'kubbe': return Math.atan2(1, kubbeU(x, y) * kubbeDr[clamp(yi, 300, 555)]);
      case 'kasnak': case 'kaide': case 'zemin': return tip === 'cizgi' && b === 'kaide' ? -1.05 : (nB(x / 50, y / 50) - 0.5) * 0.2;
      case 'minare': return ((y > 436 && y < 490) || (y > 270 && y < 318) || (y > 196 && y < 208)) ? 0 : Math.PI / 2;
      case 'pencere': case 'altin': return Math.PI / 2;
      default: return tip === 'cizgi' ? -1.0 + (nC(x / 90, y / 90) - 0.5) * 0.3 : -0.18 + (fbm(nC, x / 200, y / 200, 2) - 0.5) * 0.7;
    }
  }

  // ------------------------------------------------------------ kâğıt dişi (Mi-Teintes peteği + lif)
  const G = new Float32Array(N2);
  {
    const s = 7.4, h = s * 0.866, rj = SAHNE.rng(91), J = new Float32Array(512 * 512 * 2);
    for (let i = 0; i < J.length; i++) J[i] = (rj() - 0.5) * 3.4;
    for (let y = 0; y < W2; y++) {
      const row0 = Math.round(y / h);
      for (let x = 0; x < W2; x++) {
        let en = 1e9;
        for (let rr = row0 - 1; rr <= row0 + 1; rr++) {
          const off = (rr & 1) * s * 0.5, col0 = Math.round((x - off) / s);
          for (let cc = col0 - 1; cc <= col0 + 1; cc++) {
            const ji = ((rr & 511) * 512 + (cc & 511)) * 2;
            const dx = x - (cc * s + off + J[ji]), dy = y - (rr * h + J[ji + 1]);
            const d = dx * dx + dy * dy; if (d < en) en = d;
          }
        }
        const pet = 1 - sstep(0, s * 0.62, Math.sqrt(en));
        G[y * W2 + x] = 0.3 * pet * (0.6 + 0.8 * nB(x / 40, y / 40)) + 0.4 * fbm(nD, x / 3.6, y / 3.6, 3) + 0.15 * nA(x / 1.2 + 300, y / 1.2) + 0.15 * fbm(nC, x / 26, y / 26, 2);
      }
    }
    // 0..1'e yay
    let mn = 1, mx = 0; for (let i = 0; i < N2; i += 7) { mn = Math.min(mn, G[i]); mx = Math.max(mx, G[i]); }
    for (let i = 0; i < N2; i++) G[i] = sstep(0.12, 0.88, (G[i] - mn) / (mx - mn));
  }

  // ------------------------------------------------------------ kompozit (kâğıt rengi ile başlar)
  const KAGIT = [157, 148, 135];
  const CR = new Float32Array(N2).fill(KAGIT[0]), CG = new Float32Array(N2).fill(KAGIT[1]), CB = new Float32Array(N2).fill(KAGIT[2]);
  const BOYA = new Float32Array(N2); // ne kadar pigment tutundu (son ışıklandırma için)
  const kc = SAHNE.yeniTuval(W2, W2), kx = kc.getContext('2d', { willReadFrequently: true });
  function katBaslat() { kx.setTransform(1, 0, 0, 1, 0, 0); kx.clearRect(0, 0, W2, W2); kx.setTransform(S2, 0, 0, S2, 0, 0); kx.lineCap = 'butt'; kx.lineJoin = 'round'; }
  // basınç haritası → dişe tutunma
  function katUygula(opak, yumus, disKay) {
    const v = kx.getImageData(0, 0, W2, W2).data;
    const ys = yumus || 0.09, dk = disKay || 0;
    for (let i = 0; i < N2; i++) {
      const a = v[i * 4 + 3];
      if (!a) continue;
      const p = a / 255;
      const d = sstep(1 - p - ys, 1 - p + ys, G[i] + dk) * opak;
      if (d <= 0.002) continue;
      CR[i] += (v[i * 4] - CR[i]) * d; CG[i] += (v[i * 4 + 1] - CG[i]) * d; CB[i] += (v[i * 4 + 2] - CB[i]) * d;
      BOYA[i] = Math.min(1.5, BOYA[i] + d);
    }
  }
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
  // çubuğun yan yüzü: geniş, düz uçlu, basıncı bir kenarda ağır
  function yanVurus(x, y, a, L, Wd, c, p) {
    const ca = Math.cos(a), sa = Math.sin(a), nx = -sa, ny = ca;
    const seg = Math.max(3, Math.round(L / 5)), seritler = 4;
    const egri = (R() - 0.5) * 0.3, agir = R() < 0.5 ? 0 : seritler - 1;
    for (let l = 0; l < seritler; l++) {
      const o0 = -Wd / 2 + (Wd * l) / seritler, om = o0 + Wd / seritler / 2;
      const pl = p * (l === agir ? 1.0 : 0.72 + R() * 0.2);

      const ex = nx * isikli * gen * 0.44, ey = ny * isikli * gen * 0.44;

  {
