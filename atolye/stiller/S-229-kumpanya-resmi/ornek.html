<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-229 Kumpanya Resmi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ================================================================ ressamın aletleri (j6 ortak yardımcıları)
// Gürültü, yol örnekleme, elle çekilmiş çizgi (şerit), boya tamponu (saydam/örtücü), fırça darbesi
// (iki tonlu yükleme, kıl izi, ıslak kenar), maske ve lavi. Rastgelelik yalnız SAHNE.rng ile.
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const css = (c, a) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a == null ? 1 : a})`;

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);
const NZ2 = gurultu(977);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}
/** Kuadratik/kübik Bezier → nokta dizisi */
function bezier(p0, p1, p2, p3, n) {
  const out = [];
  n = n || 24;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const u = 1 - t;
    if (p3) out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    else out.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]);
  }
  return out;
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu şerit. o: w, renk, kapali, titreme(px), frek, basinc, sivri/basSivri/sonSivri, civi
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.wf) w *= o.wf(t / L);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Cetvelle çekilmiş düz çizgi (uçlarda hafif fırça vurgusu). */
function cetvel(ctx, x1, y1, x2, y2, o) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.max(2, Math.ceil(L / 1.5));
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
  serit(ctx, pts, Object.assign({ titreme: 0.08, frek: 0.03, basinc: 0.12, civi: Math.min(2.2, L * 0.15), sonSivri: Math.min(2.5, L * 0.2) }, o, { ofs: (_ofs += 13.7) }));
}

// ---------------------------------------------------------------- kubbe profili
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

// ---------------------------------------------------------------- boya tamponu
/**
 * Boya tamponu: 1024·olcek kare, RGB 0..1. kagit: hex.
 *  B.glaze(k, c, d): saydam boya (kâğıt rengini çarparak koyulaştırır)
 *  B.opak(k, c, a): örtücü boya
 */
function Boya(olcek, kagit) {
  this.s = olcek;
  this.W = 1024 * olcek;
  const N = this.W * this.W;
  const c = hex(kagit);
  this.R = new Float32Array(N).fill(c[0]);
  this.G = new Float32Array(N).fill(c[1]);
  this.B = new Float32Array(N).fill(c[2]);
  this.dis = null; // kâğıt dişi (−1..1), boyanın tutunmasını oynatır
  this.disGuc = 0;
  this._bv = new Float32Array(N).fill(9);
  this._u = new Float32Array(N);
  this._v = new Float32Array(N);
  this._h = new Float32Array(N);
}
Boya.prototype.tuval = function () {
  const c = S.yeniTuval(this.W, this.W);
  const x = c.getContext('2d');
  const im = x.createImageData(this.W, this.W);
  const d = im.data;
  for (let k = 0, j = 0; k < this.R.length; k++, j += 4) {
    d[j] = this.R[k] * 255;
    d[j + 1] = this.G[k] * 255;
    d[j + 2] = this.B[k] * 255;
    d[j + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
};
Boya.prototype.glaze = function (k, c, d) {
  if (d <= 0) return;
  if (d > 1) d = 1;
  this.R[k] *= 1 - d * (1 - c[0]);
  this.G[k] *= 1 - d * (1 - c[1]);
  this.B[k] *= 1 - d * (1 - c[2]);
};
Boya.prototype.opak = function (k, c, a) {
  if (a <= 0) return;
  if (a > 1) a = 1;
  this.R[k] += (c[0] - this.R[k]) * a;
  this.G[k] += (c[1] - this.G[k]) * a;
  this.B[k] += (c[2] - this.B[k]) * a;
};

/** Maske: çizim fonksiyonu (sahne koordinatında) → Float32Array (0..1) */
function maske(B, ciz) {
  const c = S.yeniTuval(B.W, B.W);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(B.s, 0, 0, B.s, 0, 0);
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, B.W, B.W).data;
  const m = new Float32Array(B.W * B.W);
  const W = B.W;
  let x0 = W;
  let y0 = W;
  let x1 = -1;
  let y1 = -1;
  for (let k = 0; k < m.length; k++) {
    const a = d[k * 4 + 3];
    if (a) {
      m[k] = a / 255;
      const px = k % W;
      const py = (k - px) / W;
      if (px < x0) x0 = px;
      if (px > x1) x1 = px;
      if (py < y0) y0 = py;
      if (py > y1) y1 = py;
    }
  }
  m.bb = x1 < 0 ? [0, 0, -1, -1] : [x0, y0, x1, y1];
  return m;
}
/** Maskeyi canvas filtresiyle bulanıklaştırır (px: sahne biriminde). */
function bulanik(B, m, px) {
  const W = B.W;
  const c = S.yeniTuval(W, W);
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(W, W);
  for (let k = 0; k < m.length; k++) {
    im.data[k * 4 + 3] = m[k] * 255;
  }
  x.putImageData(im, 0, 0);
  const c2 = S.yeniTuval(W, W);
  const x2 = c2.getContext('2d', { willReadFrequently: true });
  x2.filter = `blur(${px * B.s}px)`;
  x2.drawImage(c, 0, 0);
  const d = x2.getImageData(0, 0, W, W).data;
  const out = new Float32Array(W * W);
  for (let k = 0; k < out.length; k++) out[k] = d[k * 4 + 3] / 255;
  if (m.bb) {
    const e = Math.ceil(px * B.s * 3) + 2;
    out.bb = [Math.max(0, m.bb[0] - e), Math.max(0, m.bb[1] - e), Math.min(W - 1, m.bb[2] + e), Math.min(W - 1, m.bb[3] + e)];
  }
  return out;
}

/**
 * Fırça darbesi (piksel başına). o:
 *  pts: orta çizgi (sahne koordinatı), w: yarı genişlik (sayı ya da f(t,x,y)),
 *  c1, c2: iki tonlu yükleme (v=-1 kenarı c1, v=+1 kenarı c2; [r,g,b] 0..1), d1, d2: iki kenarın yoğunluğu,
 *  gecis: tonların karışma eğrisi (1 doğrusal; >1 c1 baskın),
 *  havuz: ıslak kenar koyulaşması, kil: kıl izi şiddeti, kilSik: kıl sıklığı, kenar: kenar titremesi (0..),
 *  kuru: kuru uç oranı (0..1), opak: örtücü mü, maske: Float32Array (çarpan), ucHavuz: uçta boya birikmesi
 */
function darbe(B, o) {
  const s = B.s;
  const W = B.W;
  let pts = o.pts.map((p) => [p[0] * s, p[1] * s]);
  pts = yenidenOrnekle(pts, 1.0);
  const n = pts.length;
  if (n < 2) return;
  const cs = new Float32Array(n);
  for (let i = 1; i < n; i++) cs[i] = cs[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = cs[n - 1] || 1;
  // yumuşatılmış normaller
  const N = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 3)];
    const b = pts[Math.min(n - 1, i + 3)];
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  const ofs = (_ofs += 17.13);
  const ke = o.kenar != null ? o.kenar : 0.08;
  const kf = o.kenarFrek != null ? o.kenarFrek : 0.06;
  const hwA = new Float32Array(n);
  const hwB = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = cs[i] / L;
    const w = (typeof o.w === 'function' ? o.w(t, pts[i][0] / s, pts[i][1] / s) : o.w) * s;
    const wb = o.wB ? (typeof o.wB === 'function' ? o.wB(t, pts[i][0] / s, pts[i][1] / s) : o.wB) * s : w;
    const us = cs[i] / s;
    hwA[i] = Math.max(0, w * (1 + ke * ((NZ.n(us * kf + ofs, 1.3) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs, 7.7) - 0.5) * 0.6)));
    hwB[i] = Math.max(0, wb * (1 + ke * ((NZ.n(us * kf + ofs + 50, 2.9) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs + 50, 4.1) - 0.5) * 0.6)));
  }
  let bx0 = W;
  let by0 = W;
  let bx1 = 0;
  let by1 = 0;
  const bv = B._bv;
  const BU = B._u;
  const BV = B._v;
  const BH = B._h;
  for (let i = 0; i < n - 1; i++) {
    const ax = pts[i][0];
    const ay = pts[i][1];
    const dx = pts[i + 1][0] - ax;
    const dy = pts[i + 1][1] - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) continue;
    const len = Math.sqrt(len2);
    const ex = (dx / len) * 1.2;
    const ey = (dy / len) * 1.2;
    const hA0 = hwA[i] + 1;
    const hB0 = hwB[i] + 1;
    const hA1 = hwA[i + 1] + 1;
    const hB1 = hwB[i + 1] + 1;
    const kx = [ax - ex + N[i][0] * hA0, ax - ex - N[i][0] * hB0, ax + dx + ex + N[i + 1][0] * hA1, ax + dx + ex - N[i + 1][0] * hB1];
    const ky = [ay - ey + N[i][1] * hA0, ay - ey - N[i][1] * hB0, ay + dy + ey + N[i + 1][1] * hA1, ay + dy + ey - N[i + 1][1] * hB1];
    const x0 = Math.max(0, Math.floor(Math.min(kx[0], kx[1], kx[2], kx[3]) - 1));
    const x1 = Math.min(W - 1, Math.ceil(Math.max(kx[0], kx[1], kx[2], kx[3]) + 1));
    const y0 = Math.max(0, Math.floor(Math.min(ky[0], ky[1], ky[2], ky[3]) - 1));
    const y1 = Math.min(W - 1, Math.ceil(Math.max(ky[0], ky[1], ky[2], ky[3]) + 1));
    if (x0 < bx0) bx0 = x0;
    if (y0 < by0) by0 = y0;
    if (x1 > bx1) bx1 = x1;
    if (y1 > by1) by1 = y1;
    const nx0 = N[i][0];
    const ny0 = N[i][1];
    const nx1 = N[i + 1][0];
    const ny1 = N[i + 1][1];
    const ilk = i === 0;
    const son = i === n - 2;
    for (let py = y0; py <= y1; py++) {
      const qy = py + 0.5;
      for (let px = x0; px <= x1; px++) {
        const qx = px + 0.5;
        const t = ((qx - ax) * dx + (qy - ay) * dy) / len2;
        if (t < -1.2 || t > 2.2) continue;
        if ((ilk && t < 0) || (son && t > 1)) continue;
        const tc = t < 0 ? 0 : t > 1 ? 1 : t;
        if (Math.abs(t - tc) * len > 1.1) continue;
        const cx = ax + dx * tc;
        const cy = ay + dy * tc;
        const nx = nx0 + (nx1 - nx0) * tc;
        const ny = ny0 + (ny1 - ny0) * tc;
        const sd = (qx - cx) * nx + (qy - cy) * ny;
        const hw = sd >= 0 ? hwA[i] + (hwA[i + 1] - hwA[i]) * tc : hwB[i] + (hwB[i + 1] - hwB[i]) * tc;
        const hwp = hw + 0.75;
        const av = Math.abs(sd) / hwp;
        if (av > 1) continue;
        const k = py * W + px;
        if (av < bv[k]) {
          bv[k] = av;
          BU[k] = cs[i] + tc * len;
          BV[k] = sd / hwp;
          BH[k] = hwp;
        }
      }
    }
  }
  // gölgeleme ve boyama
  const c1 = o.c1;
  const c2 = o.c2 || o.c1;
  const d1 = o.d1 != null ? o.d1 : o.d != null ? o.d : 0.8;
  const d2 = o.d2 != null ? o.d2 : d1;
  const gecis = o.gecis || 1;
  const havuz = o.havuz != null ? o.havuz : 0.35;
  const kil = o.kil != null ? o.kil : 0.25;
  const kilSik = o.kilSik != null ? o.kilSik : 0.45;
  const kuru = o.kuru || 0;
  const ucHavuz = o.ucHavuz || 0;
  const basHavuz = o.basHavuz || 0;
  const dSon = o.dSon != null ? o.dSon : 1;
  const puruz = o.puruz != null ? o.puruz : 0.7;
  const yuk = o.yuk || null;
  const kal = o.kal != null ? o.kal : 1;
  const opak = !!o.opak;
  const mk = o.maske;
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;
  const kilOfs = ofs * 0.31;
  const yumusakKenar = o.yumusak != null ? o.yumusak : 1.0;
  const cb = o.renkFn; // isteğe bağlı f(t, v, x, y) → [c, d] üzerine yazar
  for (let py = by0; py <= by1; py++) {
    for (let px = bx0; px <= bx1; px++) {
      const k = py * W + px;
      const av = bv[k];
      if (av > 1.5) continue;
      bv[k] = 9;
      const u = BU[k];
      const v = BV[k];
      const hwp = BH[k];
      const t = u / L;
      const fe = Math.min(0.9, (yumusakKenar * s) / hwp);
      const avr = dis && puruz ? av + ((puruz * s) / hwp) * (0.5 + 0.5 * kenet(dis[k], -1, 1)) : av;
      let cov = 1 - yumusak(1 - fe, 1, avr);
      if (cov <= 0) continue;
      // kıl izleri: darbe boyunca uzanan ince çizgiler
      const vp = (v * hwp) / s;
      const br = NZ.n(vp * kilSik + kilOfs, (u / s) * 0.018 + kilOfs);
      const br2 = NZ2.n(vp * kilSik * 2.3 + kilOfs, (u / s) * 0.03);
      let dm = 1 + kil * ((br - 0.5) * 1.6 + (br2 - 0.5) * 0.8);
      // kuru uç
      if (kuru > 0 && t > 1 - kuru) {
        const q = (t - (1 - kuru)) / kuru;
        cov *= yumusak(q - 0.25, q + 0.15, br * 0.75 + br2 * 0.35);
      }
      // ıslak kenar
      dm *= 1 + havuz * yumusak(0.5, 0.97, av);
      if (ucHavuz > 0) dm *= 1 + ucHavuz * yumusak(0.82, 0.99, t);
      if (basHavuz > 0) dm *= 1 + basHavuz * (1 - yumusak(0.0, 0.12, t));
      if (dSon !== 1) dm *= 1 + (dSon - 1) * t;
      let m = (v + 1) * 0.5;
      if (gecis !== 1) m = Math.pow(m, gecis);
      let cr = c1[0] + (c2[0] - c1[0]) * m;
      let cg = c1[1] + (c2[1] - c1[1]) * m;
      let cbb = c1[2] + (c2[2] - c1[2]) * m;
      let d = (d1 + (d2 - d1) * m) * dm * cov;
      if (cb) {
        const r = cb(t, v, px / s, py / s, d);
        if (r) {
          cr = r[0][0];
          cg = r[0][1];
          cbb = r[0][2];
          d = r[1] * cov * dm;
        }
      }
      if (dis && disG) d *= 1 + disG * dis[k];
      if (mk) {
        if (mk.v) {
          const li = px - mk.x0;
          const lj = py - mk.y0;
          d *= li >= 0 && lj >= 0 && li < mk.w && lj < mk.h ? mk.v[lj * mk.w + li] : 0;
        } else d *= mk[k];
      }
      if (d <= 0.002) continue;
      if (opak) B.opak(k, [cr, cg, cbb], d);
      else B.glaze(k, [cr, cg, cbb], d);
      if (yuk) {
        const hh = kal * (0.55 + 0.9 * br + 0.3 * br2) * (0.7 + 0.3 * yumusak(0, 0.5, cov));
        const dc = d > 1 ? 1 : d;
        yuk[k] += (hh - yuk[k]) * dc;
      }
    }
  }
}

/** Yarım genişlik profilleri (t: 0 giriş → 1 çıkış) */
const PROFIL = {
  // fırça topuğundan ucuna: yuvarlak giriş, sivri çıkış
  firca: (t) => (t < 0.12 ? 0.55 + 0.45 * Math.sin((Math.PI / 2) * (t / 0.12)) : 1) * (t > 0.5 ? Math.pow(Math.cos(((t - 0.5) / 0.5) * (Math.PI / 2)), 0.75) : 1),
  // iki ucu sivri yaprak
  yaprak: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.62),
  // yuvarlak uçlu kısa leke
  leke: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.4),
  // düz bant: uçlarda kısa incelme
  bant: (t) => Math.min(1, 0.6 + 0.4 * Math.sin((Math.PI / 2) * Math.min(1, t / 0.04)), 0.5 + 0.5 * Math.sin((Math.PI / 2) * Math.min(1, (1 - t) / 0.05))),
};

/** Yuvarlak topuklu, ucu incelen darbe profili (L: darbe boyu, hw: yarı genişlik, uc: incelen uç oranı). */
function yuvarlakProf(L, hw, uc, bas) {
  const cap = hw * (bas != null ? bas : 0.9);
  return (t) => {
    const d = t * L;
    let f = 1;
    if (d < cap) {
      const q = 1 - d / cap;
      f = 0.12 + 0.88 * Math.sqrt(Math.max(0, 1 - q * q));
    }
    if (uc > 0 && t > 1 - uc) f *= Math.pow(Math.max(0, Math.cos(((t - (1 - uc)) / uc) * (Math.PI / 2))), 0.55);
    return f;
  };
}

/** Eğik konan yassı fırçanın iki yarı genişlik profili: kavisli, bir köşesi önde baş; incelen, kuruyan uç. */
function basCift(Lp, hw, rk) {
  const pr = yuvarlakProf(Lp, hw, 0.22, 0.02);
  const hA = hw * (0.45 + 0.4 * rk());
  const hB = hw * (1.5 + 1.3 * rk());
  const bas = (h) => (t) => {
    const d = t * Lp;
    if (d >= h) return 1;
    const q = 1 - d / h;
    return 0.08 + 0.92 * Math.sqrt(Math.max(0, 1 - q * q));
  };
  const fA = bas(hA);
  const fB = bas(hB);
  const ters = rk() < 0.5;
  const wa = (t) => hw * pr(t) * (ters ? fB(t) : fA(t));
  const wb = (t) => hw * pr(t) * (ters ? fA(t) : fB(t));
  return [wa, wb];
}

/** Yatay (ya da açılı) lavi: maske üzerinde düz renk, fırça sırası izi ve kenar havuzu. */
function lavi(B, m, o) {
  const W = B.W;
  const s = B.s;
  const c = o.c;
  const d0 = o.d != null ? o.d : 0.5;
  const pool = o.havuz != null ? o.havuz : 0.4;
  const bl = o.havuzEn ? bulanik(B, m, o.havuzEn) : null;
  const aci = o.aci || 0;
  const ca = Math.cos(aci);
  const sa = Math.sin(aci);
  const sira = o.sira || 0; // fırça sırası izinin şiddeti
  const siraEn = o.siraEn || 40;
  const dalga = o.dalga != null ? o.dalga : 0.12;
  const nz = o.nz || NZ;
  const ofs = (_ofs += 23.1);
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;
  const yf = o.yogFn;
  const cf = o.renkFn;
  const bb = m.bb || [0, 0, W - 1, W - 1];
  for (let py = bb[1]; py <= bb[3]; py++) {
    for (let px = bb[0]; px <= bb[2]; px++) {
      const k = py * W + px;
      const mv = m[k];
      if (mv <= 0.003) continue;
      const x = px / s;
      const y = py / s;
      const a = x * ca + y * sa; // fırça yönü boyunca
      const b = -x * sa + y * ca; // fırça yönüne dik
      let d = d0;
      if (yf) d = yf(x, y, d);
      // dalgalı yoğunluk
      d *= 1 + dalga * ((nz.fbm(x * 0.012 + ofs, y * 0.012, 3) - 0.5) * 2);
      if (sira) {
        // her fırça sırası: kenarı titrek bant, bindirme yeri biraz koyu
        const bb = b / siraEn + (nz.n(a * 0.01 + ofs, b * 0.002) - 0.5) * 0.5;
        const fr = bb - Math.floor(bb);
        const bindir = yumusak(0.86, 0.97, fr) * (1 - yumusak(0.97, 1.0, fr));
        d *= 1 + sira * (bindir * 1.3 - 0.25 + (nz.n(a * 0.004 + Math.floor(bb) * 7.1, 3.3) - 0.5) * 0.6);
        // kıl izi
        d *= 1 + sira * 0.5 * (nz.n(b * 0.5 + ofs, a * 0.008) - 0.5);
      }
      if (bl && pool) {
        const e = Math.max(0, mv - bl[k]);
        d *= 1 + pool * Math.min(1, e * 2.6);
      }
      if (dis && disG) d *= 1 + disG * dis[k];
      d *= mv;
      const col = cf ? cf(x, y) : c;
      if (o.opak) B.opak(k, col, d);
      else B.glaze(k, col, d);
    }
  }
}

/** Kâğıt dişi: −1..1 alanı (lif + tane). */
function kagitDisi(B, o) {
  const W = B.W;
  const s = B.s;
  const a = new Float32Array(W * W);
  const nz = gurultu(o.tohum || 31);
  const lif = o.lif || 0;
  const tane = o.tane != null ? o.tane : 1;
  const olc = o.olcek || 0.35;
  for (let py = 0; py < W; py++) {
    for (let px = 0; px < W; px++) {
      const x = px / s;
      const y = py / s;
      let v = (nz.fbm(x * olc, y * olc, 3) - 0.5) * 2 * tane;
      if (lif) v += (nz.n(x * 0.05 + y * 0.9, y * 0.05 - x * 0.2) - 0.5) * 2 * lif;
      v += (karma(px, py, 3) - 0.5) * 0.3;
      a[py * W + px] = v;
    }
  }
  B.dis = a;
  return a;
}

/** Ana tuval: 2048 iç çözünürlük, koordinatlar 1024. */

/** Ana tuvalin pikselleri üzerinde geçiş. */
function pikselGecis(ctx, fn) {

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) fn(d, (y * W + x) * 4, x, y);

/** SVG yolunun sahne koordinatında sınır kutusu. */
function yolKutu(d, pay) {
  pay = pay == null ? 3 : pay;
  let x0 = 1e9;
  let y0 = 1e9;
  let x1 = -1e9;
  let y1 = -1e9;
  for (const p of ornekle(d, 3)) {
    for (const q of p.pts) {
      if (q[0] < x0) x0 = q[0];
      if (q[1] < y0) y0 = q[1];
      if (q[0] > x1) x1 = q[0];
      if (q[1] > y1) y1 = q[1];
    }
  }
  return [x0 - pay, y0 - pay, x1 + pay, y1 + pay];
}
/** Yerel maske: {v, x0, y0, w, h} (tampon pikseli). kutu: sahne koordinatında [x0,y0,x1,y1]. */
function ymaske(B, ciz, kutu) {
  const s = B.s;
  const W = B.W;
  const X0 = Math.max(0, Math.floor(kutu[0] * s));
  const Y0 = Math.max(0, Math.floor(kutu[1] * s));
  const X1 = Math.min(W, Math.ceil(kutu[2] * s));
  const Y1 = Math.min(W, Math.ceil(kutu[3] * s));
  const w = X1 - X0;
  const h = Y1 - Y0;
  if (w <= 0 || h <= 0) return null;
  const c = S.yeniTuval(w, h);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(s, 0, 0, s, -X0, -Y0);
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, w, h).data;
  const v = new Float32Array(w * h);
  for (let k = 0; k < v.length; k++) v[k] = d[k * 4 + 3] / 255;
  return { v, x0: X0, y0: Y0, w, h };
}
/** Yerel maskeyi bulanıklaştırır (kutu genişler). */
function ybulanik(B, ym, px) {
  const s = B.s;
  const W = B.W;
  const pad = Math.ceil(px * s * 2.5) + 1;
  const X0 = Math.max(0, ym.x0 - pad);
  const Y0 = Math.max(0, ym.y0 - pad);
  const X1 = Math.min(W, ym.x0 + ym.w + pad);
  const Y1 = Math.min(W, ym.y0 + ym.h + pad);
  const w = X1 - X0;
  const h = Y1 - Y0;
  const c = S.yeniTuval(w, h);
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(ym.w, ym.h);
  for (let k = 0; k < ym.v.length; k++) im.data[k * 4 + 3] = ym.v[k] * 255;
  const c0 = S.yeniTuval(ym.w, ym.h);
  c0.getContext('2d').putImageData(im, 0, 0);

  x.drawImage(c0, ym.x0 - X0, ym.y0 - Y0);
  const d = x.getImageData(0, 0, w, h).data;
  const v = new Float32Array(w * h);
  for (let k = 0; k < v.length; k++) v[k] = d[k * 4 + 3] / 255;

}
/** Yerel maskede lavi (lavi ile aynı seçenekler). */

  const c = o.c;
  const d0 = o.d != null ? o.d : 0.5;
  const pool = o.havuz != null ? o.havuz : 0.4;
  const bl = o.havuzEn && pool ? ybulanik(B, ym, o.havuzEn) : null;
  const aci = o.aci || 0;

  const siraEn = o.siraEn || 40;
  const dalga = o.dalga != null ? o.dalga : 0.12;
  const dalgaF = o.dalgaF || 0.012;
  const nz = o.nz || NZ;
  const ofs = (_ofs += 23.1);
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;

      const b = -x * sa + y * ca;
      let d = d0;
      if (yf) d = yf(x, y, d);
      if (dalga) d *= 1 + dalga * ((nz.fbm(x * dalgaF + ofs, y * dalgaF, 3) - 0.5) * 2);
      if (sira) {
        const bb = b / siraEn + (nz.n(a * 0.01 + ofs, b * 0.002) - 0.5) * 0.5;
        const fr = bb - Math.floor(bb);

        d *= 1 + sira * 0.5 * (nz.n(b * 0.5 + ofs, a * 0.008) - 0.5);

/** Uzun cetvel çizgisi: fırça yeniden yüklenince birleşen parçalar, köşelerde hafif taşma. */
function cetvelUzun(ctx, x1, y1, x2, y2, o) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  const tas = o && o.tasma != null ? o.tasma : 0.8;
  const ux = (x2 - x1) / (L || 1);
  const uy = (y2 - y1) / (L || 1);
  const ax = x1 - ux * tas;
  const ay = y1 - uy * tas;
  const bx = x2 + ux * tas;
  const by = y2 + uy * tas;
  const LL = L + 2 * tas;
  if (LL < 170) return cetvel(ctx, ax, ay, bx, by, o);
  const n = Math.max(2, Math.round(LL / (110 + ((_ofs * 7.3) % 60))));
  let t0 = 0;
  for (let i = 0; i < n; i++) {
    const t1 = i === n - 1 ? 1 : (i + 1) / n + (((_ofs * 3.1 + i * 17) % 10) - 5) / LL;
    const e = i === n - 1 ? 0 : 1.2 / LL;
    cetvel(ctx, ax + (bx - ax) * t0, ay + (by - ay) * t0, ax + (bx - ax) * (t1 + e), ay + (by - ay) * (t1 + e), o);
    t0 = t1;
  }

/** Bir yerel maskeyi aynı yönde, yan yana fırça darbeleriyle doldurur (boya izi görünen düz renk). */
function taraDoldur(B, ym, o) {
  if (!ym) return;
  const rr = o.rng || S.rng(o.tohum || 5);
  const bx0 = ym.x0 / B.s;
  const by0 = ym.y0 / B.s;
  const bx1 = (ym.x0 + ym.w) / B.s;
  const by1 = (ym.y0 + ym.h) / B.s;
  const cx = (bx0 + bx1) / 2;
  const cy = (by0 + by1) / 2;
  const ca = Math.cos(o.aci || 0);
  const sa = Math.sin(o.aci || 0);
  const Rp = Math.abs(sa) * (bx1 - bx0) / 2 + Math.abs(ca) * (by1 - by0) / 2 + 2; // darbelere dik yarı boy
  const Ra = Math.abs(ca) * (bx1 - bx0) / 2 + Math.abs(sa) * (by1 - by0) / 2 + 6; // darbe boyunca yarı boy
  const en = o.en || 6;
  const ara = o.aralik || en * 1.5;
  let off = -Rp + ara * 0.4 * rr();
  while (off <= Rp + ara * 0.5) {
    const px = cx - sa * off;
    const py = cy + ca * off;
    const L = Ra * 2;
    const bas = -Ra - rr() * 8;
    const son = Ra + rr() * 8;
    const eg = (rr() - 0.5) * (o.egri || 0);
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const a = bas + (son - bas) * t;
      const v = eg * Math.sin(Math.PI * t);
      pts.push([px + ca * a - sa * v, py + sa * a + ca * v]);
    }
    const ton = rr();
    const c1 = o.c2 ? karistir(o.c1, o.c2, ton * (o.tonOyna != null ? o.tonOyna : 0.6)) : o.c1;
    darbe(B, Object.assign({}, o, {
      pts,
      w: en * (0.85 + 0.3 * rr()),
      c1,
      c2: c1,
      d1: (o.d1 != null ? o.d1 : o.d) * (0.9 + 0.2 * rr()),
      d2: (o.d1 != null ? o.d1 : o.d) * (0.9 + 0.2 * rr()),
      maske: ym,
    }));
    off += ara * (0.85 + 0.3 * rr());
  }
}

/** Küçük yumuşak nokta (noktalama / pardaht): hafif eliptik, kenarı yumuşak. */
function nokta(B, x, y, rad, c, d, opak, aci, bas) {
  const s = B.s;
  const W = B.W;
  const R = rad * s;
  const cx = x * s;
  const cy = y * s;
  const e = bas || 1; // eliptiklik
  const ca = Math.cos(aci || 0);
  const sa = Math.sin(aci || 0);
  const x0 = Math.max(0, Math.floor(cx - R * e - 1));
  const x1 = Math.min(W - 1, Math.ceil(cx + R * e + 1));
  const y0 = Math.max(0, Math.floor(cy - R * e - 1));
  const y1 = Math.min(W - 1, Math.ceil(cy + R * e + 1));
  for (let py = y0; py <= y1; py++) {
    for (let px = x0; px <= x1; px++) {
      const dx = px + 0.5 - cx;
      const dy = py + 0.5 - cy;
      const u = (dx * ca + dy * sa) / e;
      const v = -dx * sa + dy * ca;
      const q = Math.sqrt(u * u + v * v);
      const cov = 1 - yumusak(R - 0.8, R + 0.5, q);
      if (cov <= 0) continue;
      const k = py * W + px;
      if (opak) B.opak(k, c, d * cov);
      else B.glaze(k, c, d * cov);
    }
  }
}
/** Noktalama ile gölgeleme: kutu içinde titrek ızgara; her hücrede p = golge(x,y) olasılığıyla bir nokta. */
function noktala(B, kutu, golge, o) {
  const rr = o.rng || S.rng(o.tohum || 9);
  const g = o.aralik || 2.4;
  for (let y = kutu[1]; y < kutu[3]; y += g) {
    for (let x = kutu[0]; x < kutu[2]; x += g) {
      const px = x + (rr() - 0.5) * g * 0.9;
      const py = y + (rr() - 0.5) * g * 0.9;
      const p = golge(px, py);
      if (p <= 0 || rr() > p) continue;
      const c = o.c2 ? karistir(o.c, o.c2, rr()) : o.c;
      nokta(B, px, py, (o.r || 0.9) * (0.75 + 0.5 * rr()), c, (o.d || 0.5) * (0.7 + 0.5 * rr()), o.opak, rr() * Math.PI, 1 + rr() * 0.4);
    }
  }
}
/** Yerel maskenin değeri (sahne koordinatında), dışarıda 0. */
function ymDeger(B, ym, x, y) {
  if (!ym) return 0;
  const i = Math.round(x * B.s) - ym.x0;
  const j = Math.round(y * B.s) - ym.y0;
  if (i < 0 || j < 0 || i >= ym.w || j >= ym.h) return 0;
  return ym.v[j * ym.w + i];
}

/** Boya kabartısı: yükseklik alanından sağ üst ışıkla hafif aydınlatma (guaj darbelerinin kalınlığı). */
function kabartma(B, yuk, guc) {
  const W = B.W;
  for (let y = 1; y < W - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const k = y * W + x;
      const gx = yuk[k + 1] - yuk[k - 1];
      const gy = yuk[k + W] - yuk[k - W];
      // ışık sağ üstten: yüzey sağa-yukarı bakıyorsa (yükseklik sola-aşağı artıyorsa) aydınlık
      let sh = (-gx * 0.7 + gy * 0.7) * guc;
      if (sh > 0.12) sh = 0.12;
      if (sh < -0.12) sh = -0.12;
      const f = 1 + sh;
      B.R[k] = Math.min(1, B.R[k] * f);
      B.G[k] = Math.min(1, B.G[k] * f);
      B.B[k] = Math.min(1, B.B[k] * f);
    }
  }
}

/** Dikey (ya da açılı) tek fırça geçişi: dikdörtgenin ortasından, iki tonlu yükle (sol kenar c2). */
function gecis(x1, y1, x2, y2, o) {

/**
 * Bir yerel maskeyi sıra sıra, her sırada fırçanın yeniden yüklendiği 1–3 parçayla doldurur (saydam lavi). Parçalar üst üste
 * bindiği yerde lavi koyulaşır; her parçanın kendi tonu, eğik başı, kuruyan ucu ve alt kenarında boncuğu olur.
 * o: dikey, enMin/enAra (yarı genişlik), boyMin/boyAra, binis (sıra bindirmesi), c1, c2, tonOyna, d, dOyna, bosluk (atlama olasılığı f(x,y))
 */
function parcaDoldur(ym, o) {
  if (!ym) return;
  const rr = o.rng || r;
  const s = B.s;
  const bx0 = ym.x0 / s;
  const by0 = ym.y0 / s;
  const bx1 = (ym.x0 + ym.w) / s;
  const by1 = (ym.y0 + ym.h) / s;
  const dikey = !!o.dikey;
  const islak = !!o.islak;
  const HB = islak ? G : B;
  if (islak) {
    for (let j = 0; j < ym.h; j++) {
      for (let i = 0, k = (ym.y0 + j) * B.W + ym.x0; i < ym.w; i++, k++) {
        G.R[k] = 1;
        G.G[k] = 1;
        G.B[k] = 1;
      }
    }
  }
  const A0 = dikey ? by0 : bx0;
  const A1 = dikey ? by1 : bx1;
  const B0 = dikey ? bx0 : by0;
  const B1 = dikey ? bx1 : by1;
  let b = B0 - rr() * o.enMin * 0.6;
  while (b < B1) {
    const en = o.enMin + rr() * o.enAra;
    const bc = b + en;
    let a = A0 - 3 - rr() * 6;
    const egim = (rr() - 0.5) * (o.egim != null ? o.egim : 0.012);
    while (a < A1) {
      const Lp = Math.min(A1 + 4 - a, o.boyMin + rr() * o.boyAra);
      const a2 = A1 - (a + Lp) < o.boyMin * 0.35 ? A1 + 4 : a + Lp;
      const cx = dikey ? bc : (a + a2) / 2;
      const cy = dikey ? (a + a2) / 2 : bc;
      if (!(o.bosluk && rr() < o.bosluk(cx, cy))) {
        const pts = [];
        const bow = (rr() - 0.5) * (o.bow != null ? o.bow : 2);
        for (let q = a; q <= a2; q += 2) {
          const t = (q - a) / (a2 - a || 1);
          const v = bc + egim * (q - a) + bow * Math.sin(Math.PI * t);
          pts.push(dikey ? [v, q] : [q, v]);
        }
        const c = karistir(o.c1, o.c2 || o.c1, rr() * (o.tonOyna != null ? o.tonOyna : 0.6));
        const dd = o.d * (1 + (rr() - 0.5) * 2 * (o.dOyna != null ? o.dOyna : 0.15)) * (o.dFn ? o.dFn(cx, cy) : 1);
        const LL = a2 - a;
        const egik = Math.min(0.4, (en * (0.6 + rr() * 0.8)) / LL);
        const yon = rr() < 0.5;
        const pA = yuvarlakProf(LL, en * 0.5, o.uc != null ? o.uc : 0.05, 0.9);
        const wa = (t) => en * pA(t);
        const wb = (t) => (t < egik ? en * (0.15 + 0.85 * (t / egik)) * pA(t) : en * pA(t));
        const cK = o.cK ? karistir(c, o.cK, o.kOran || 0.5) : c;
        const kD = o.kD || 1;
        const bnc = o.boncuk || 0;
        const islakFn = (t, v) => {
          const mm = (v + 1) * 0.5;
          const cc = karistir(c, cK, mm);
          const d0 = dd * (1 + (kD - 1) * mm) * (1 + bnc * yumusak(0.55, 0.93, v));
          return [[1 - d0 * (1 - cc[0]), 1 - d0 * (1 - cc[1]), 1 - d0 * (1 - cc[2])], 0.95];
        };
        darbe(HB, Object.assign({
          havuz: 0.4,
          kil: 0.2,
          kilSik: 0.3,
          kenar: 0.06,
          kenarFrek: 0.05,
          yumusak: 0.9,
          kuru: 0.12,
          dis: 1.3,
        }, o.darbe || {}, {
          pts,
          w: yon ? wa : wb,
          wB: yon ? wb : wa,
          c1: c,
          c2: cK,
          d1: dd,
          d2: dd * kD,
          maske: ym,
          renkFn: islak ? islakFn : o.renkFn,
        }, islak ? { opak: true, havuz: 0, dis: 0 } : {}));
      }
      if (a2 >= A1) break;
      a = a2 - (o.ucBinis || 8) * (0.4 + rr());
    }
    b += 2 * en - (o.binis != null ? o.binis : 4) * (0.5 + rr());
  }
  if (islak) {
    // ıslak katmanı kâğıda geçir: pigment kâğıt dişinde tanelenir
    const tane = o.tane != null ? o.tane : 0.35;
    for (let j = 0; j < ym.h; j++) {
      for (let i = 0, k = (ym.y0 + j) * B.W + ym.x0; i < ym.w; i++, k++) {
        const mv = ym.v[j * ym.w + i];
        if (mv <= 0.003) continue;
        const f = mv * (1 + tane * B.dis[k]);
        B.R[k] *= 1 - (1 - G.R[k]) * f;
        B.G[k] *= 1 - (1 - G.G[k]) * f;
        B.B[k] *= 1 - (1 - G.B[k]) * f;
      }
    }
  }
}

/**
 * Islak birleşen yatay fırça geçişleriyle düz lavi. Geçişler ayrı bir ıslak katmana örtücü yazılır (ıslakken birleştikleri için
 * bindirme koyulaşmaz); her geçişin kendi tonu, alt kenarındaki boya boncuğu, kıl izleri ve fırçanın yeniden yüklendiği yerdeki
 * topuk izi kalır. Sonra katman maskeyle, isteğe bağlı çarpanla ve kâğıt dişinde tanelenerek kâğıda geçirilir.
 */
const G = new Boya(2, '#FFFFFF');
function islakLavi(o) {
  const W = B.W;
  const s = B.s;
  const P0 = Math.max(0, Math.floor(o.y0 * s));
  const P1 = Math.min(W, Math.ceil(o.y1 * s));
  for (let py = P0; py < P1; py++) {
    const d = o.tabanD(py / s);
    const gr = 1 - d * (1 - o.cTaban[0]);
    const gg = 1 - d * (1 - o.cTaban[1]);
    const gb = 1 - d * (1 - o.cTaban[2]);
    for (let px = 0, k = py * W; px < W; px++, k++) {
      G.R[k] = gr;
      G.G[k] = gg;
      G.B[k] = gb;
    }
  }
  const rs = S.rng(o.tohum);
  let yc = o.ilkY;
  let dSira = o.dIlk;
  let sira = 0;
  let kayma = rs() * 200; // parça sınırları sıradan sıraya kayar (tuğla gibi değil, düzensiz)
  while (yc < o.y1 + 24) {
    const en = o.enMin + rs() * o.enAra;
    const dRow = dSira * (sira % 2 ? 1 + o.oyna : 1 - o.oyna) * (0.94 + rs() * 0.12);
    const egim = (rs() - 0.5) * (o.egimOyna || 0.02);
    // satır 2–4 parçada boyanır: fırça yeniden yüklenip bir öncekinin ucuna binerek devam eder; her parçanın kendi tonu var
    const nPar = o.parMin + Math.floor(rs() * (o.parAra + 0.99));
    kayma = (kayma + 140 + rs() * 260) % 400;
    let x0 = -60 - kayma * 0.25;
    for (let i = 0; i < nPar; i++) {
      const kalan = 1100 - x0;
      const x1 = i === nPar - 1 ? 1100 : x0 + (kalan / (nPar - i)) * (0.7 + rs() * 0.6);
      const xe = i === nPar - 1 ? 1110 : x1 + 70 + rs() * 50;
      const tonP = rs();
      const dP = dRow * (1 + (rs() - 0.5) * 2 * o.parcaOyna);
      const cP = karistir(karistir(o.renkA, o.renkB, tonP), o.cTaban, rs() * 0.3);
      const yy = yc + (rs() - 0.5) * 5;
      const bow = (rs() - 0.5) * 7;
      const pts = [];
      for (let x = x0; x <= xe; x += 4) pts.push([x, yy + egim * (x - x0) + bow * Math.sin(Math.PI * (x - x0) / (xe - x0))]);
      const Lp = xe - x0;
      const son = i === nPar - 1;
      // fırça eğik tutulur: alt kenar üst kenardan biraz sonra başlar (yuvarlak değil eğik baş)
      const egik = (12 + rs() * 22) / Lp;
      const pA = yuvarlakProf(Lp, en * 0.55, son ? 0 : 0.1, 0.9);
      darbe(G, {
        pts,
        w: (t) => en * pA(t),
        wB: (t) => en * pA(t) * (t < egik ? 0.15 + 0.85 * Math.sqrt(t / egik) : 1),
        c1: cP,
        opak: true,
        kenar: 0.07,
        kenarFrek: 0.025,
        kil: o.kil != null ? o.kil : 0.22,
        kilSik: 0.2,
        havuz: 0,
        kuru: son ? 0 : 0.08,
        yumusak: 1.4,
        renkFn: (t, v, x, y) => {
          const boncuk = o.boncuk * yumusak(0.55, 0.93, v) * (0.55 + 0.9 * NZ2.n(x * 0.035 + sira * 5.3, sira * 2.3));
          // yeniden yüklenen fırça bir öncekinin ıslak ucuna biner: baş yumuşakça karışır, biraz içeride topuk koyuluğu
          const u = t * Lp;
          const bas = i > 0 ? yumusak(0, 30 + 26 * NZ.n(y * 0.06 + i * 3.1, sira * 1.7), u - v * 22 - 14 * (NZ2.n(y * 0.09, i + sira * 3.3) - 0.5)) : 1;
          const topuk = i > 0 ? 0.1 * Math.exp(-Math.pow((u - 30) / 16, 2)) : 0;
          // fırçadaki boya azaldıkça geçiş açılır: her parça topuktan uca doğru solar
          const sol = 1 + (o.solma || 0) * (0.45 - Math.min(1, u / Math.min(Lp, 420)));
          const dd = dP * (1 + boncuk + topuk) * sol;
          return [[1 - dd * (1 - cP[0]), 1 - dd * (1 - cP[1]), 1 - dd * (1 - cP[2])], 0.95 * bas];
        },
      });

    }
    yc += 2 * en - (7 + rs() * 8);
    dSira *= o.dCarp[0] + rs() * o.dCarp[1];
    sira++;
  }
  // ıslak katmanı kâğıda geçir
  const dis = B.dis;
  const m = o.m;
  for (let py = P0; py < P1; py++) {
    const y = py / s;
    for (let px = 0; px < W; px++) {
      const k = py * W + px;
      const mv = m[k];
      if (mv <= 0.003) continue;
      const f = mv * (o.carpFn ? o.carpFn(px / s, y) : 1) * (1 + o.tane * dis[k]);
      B.R[k] *= 1 - (1 - G.R[k]) * f;
      B.G[k] *= 1 - (1 - G.G[k]) * f;
      B.B[k] *= 1 - (1 - G.B[k]) * f;
    }
  }
}

// ------------------------------------------------------------------ gök: dereceli düz lavi, geniş yatay fırça geçişleriyle serilmiş
// Ressam büyük fırçayla soldan sağa yatay geçişler yapar; her geçiş bir öncekinin ıslak alt kenarını alır ve biraz daha sulandırılmıştır
// (gök basamak basamak ufka doğru açılır). Geçişler ıslakken birleştiği için üst üste binen yer koyulaşmaz; ama her geçişin kendi tonu,
// alt kenarında kalan boya boncuğu, uzun kıl izleri ve fırçanın yeniden yüklendiği yerdeki topuk izi görünür.
// güneşin yeri: tam daire değil, elle çevrilmiş biçim
const gunesYol = (x, R) => {
  x.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const rr = R + 0.9 * Math.sin(2 * a + 0.7) + 0.6 * Math.sin(3 * a + 2.1) + 0.4 * Math.sin(5 * a + 1.3);
    const X = S.gunes.x + Math.cos(a) * rr;
    const Yy = S.gunes.y + Math.sin(a) * rr * 0.97;
    if (i) x.lineTo(X, Yy);
    else x.moveTo(X, Yy);
  }
  x.closePath();
  x.fill();

  for (let j = 0; j < ym.h; j++) for (let i = 0; i < ym.w; i++) {
    const k = (ym.y0 + j) * B.W + ym.x0 + i;
    const v = ym.v[j * ym.w + i];
    if (v > dolu[k]) dolu[k] = v;
  }
}
function yikaBos(sekil, c, d, o) {
  const k0 = sekil[1];
  const X0 = Math.max(0, Math.floor((k0[0] - 6) * B.s));
  const Y0 = Math.max(0, Math.floor((k0[1] - 6) * B.s));
  const X1 = Math.min(B.W, Math.ceil((k0[2] + 6) * B.s));
  const Y1 = Math.min(B.W, Math.ceil((k0[3] + 6) * B.s));
  for (let py = Y0; py < Y1; py++) for (let px = X0; px < X1; px++) bos[py * B.W + px] = 1 - dolu[py * B.W + px];
  return yika(sekil, c, d, Object.assign({ carp: bos }, o));
}

  doluEkle(m);
