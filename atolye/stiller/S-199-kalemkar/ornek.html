<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-199 Kalemkâr — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F3EAD6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
(function () {
  'use strict';
  // ---------------------------------------------------------------- ortak el yardımcıları
  const S = SAHNE;
  const H = {};
  H.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.smooth = (e0, e1, x) => {
    const t = H.clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  };
  H.hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  H.rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a === undefined ? 1 : a})`;
  H.mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  H.P = (d) => new Path2D(d);

  /** Tohumlu değer gürültüsü: n(x, y) → [-1, 1], 256 periyotlu. */
  H.noise = function (seed) {
    const r = S.rng(seed);
    const N = 256;
    const tab = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) tab[i] = r() * 2 - 1;
    return function (x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const x0 = xi & 255;
      const y0 = yi & 255;
      const x1 = (x0 + 1) & 255;
      const y1 = (y0 + 1) & 255;
      const a = tab[y0 * N + x0];
      const b = tab[y0 * N + x1];
      const c = tab[y1 * N + x0];
      const d = tab[y1 * N + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  };
  H.fbm = function (n, x, y, oct) {
    let s = 0;
    let a = 0.5;
    let f = 1;
    let t = 0;
    for (let i = 0; i < (oct || 4); i++) {
      s += a * n(x * f + i * 17.3, y * f - i * 9.1);
      t += a;
      a *= 0.5;
      f *= 2.03;
    }
    return s / t;
  };

  /** SVG yolunu nokta dizilerine çevirir: [{pts, closed}] (alt yollar ayrı). */
  H.flatten = function (d, step) {
    step = step || 2;
    if (!H._p) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.style.position = 'absolute';
      H._p = document.createElementNS(ns, 'path');
      svg.appendChild(H._p);
      document.body.appendChild(svg);
    }
    return d
      .trim()
      .split(/(?=M)/)
      .filter((s) => s.trim().length)
      .map((sd) => {
        H._p.setAttribute('d', sd);
        const L = H._p.getTotalLength();
        const n = Math.max(2, Math.ceil(L / step));
        const pts = [];
        for (let i = 0; i <= n; i++) {
          const q = H._p.getPointAtLength((L * i) / n);
          pts.push([q.x, q.y]);
        }
        const closed = /Z\s*$/i.test(sd.trim());
        if (closed) pts.pop();
        return { pts, closed, L };
      });
  };

  /** Elin titremesi: noktaları çizgiye dik yönde yavaş bir gürültüyle kaydırır. */
  H.wobble = function (pts, amp, wl, seed) {
    const n = H.noise(seed || 1);
    const out = [];
    let s = 0;
    const oy = ((seed || 1) * 37.7) % 200;
    for (let i = 0; i < pts.length; i++) {
      if (i) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const off = amp * n(s / wl, oy);
      out.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
    }
    return out;
  };

  /** Değişken kalınlıklı şerit (kalem/fırça izi): wfn(t, i) tam genişlik. */
  H.ribbon = function (ctx, pts, wfn) {
    const n = pts.length;
    if (n < 2) return;
    const L = [];
    const R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const w = wfn(i / (n - 1), i) / 2;
      L.push([pts[i][0] - ty * w, pts[i][1] + tx * w]);
      R.push([pts[i][0] + ty * w, pts[i][1] - tx * w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fill();
  };

  /**
   * Elle çekilmiş çizgi: d (SVG yolu ya da [{pts, closed}]) boyunca titrek, basıncı değişen bir şerit.
   * o: w, amp, wl, seed, color, press (0–1), taper (0–0.5), step
   */
  H.pen = function (ctx, d, o) {
    const subs = typeof d === 'string' ? H.flatten(d, o.step || 1.2) : d;
    if (o.color) ctx.fillStyle = o.color;
    let k = 0;
    const seed = o.seed || 1;
    for (const sp of subs) {
      let pts = sp.pts;
      if (sp.closed) pts = pts.concat([pts[0], pts[1]]);
      if (pts.length < 2) continue;
      pts = H.wobble(pts, o.amp === undefined ? 0.5 : o.amp, o.wl || 26, seed + k * 13);
      const nz = H.noise(seed * 7 + k * 3 + 1);
      const press = o.press === undefined ? 0.35 : o.press;
      const taper = sp.closed ? 0 : o.taper === undefined ? 0.15 : o.taper;
      const plen = o.plen || 0.06;
      H.ribbon(ctx, pts, (t, i) => {
        let w = o.w * (1 - press * 0.5 + press * 0.5 * nz(i * plen, 5.5));
        if (taper > 0) {
          if (t < taper) w *= 0.3 + 0.7 * Math.sqrt(t / taper);
          else if (t > 1 - taper) w *= 0.3 + 0.7 * Math.sqrt((1 - t) / taper);
        }
        return Math.max(0.05, w);
      });
      k++;
    }
  };

  /** Nokta dizisini Path2D'ye çevirir. */
  H.polyPath = function (pts, closed) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (closed) p.closePath();
    return p;
  };

  /** Kubbe yarıçapı r(y) ve eğimi; y 300–555. */
  H.kubbeP = S.kubbeProfili(200);
  H.kubbeR = function (y) {
    const p = H.kubbeP;
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < p.length - 1; i++) {
      if (y <= p[i].y && y >= p[i + 1].y) {
        const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1);
        return p[i].r + (p[i + 1].r - p[i].r) * t;
      }
    }
    return 0;
  };

  /** Bölge haritası istenen ölçekte (ör. 2 → 2048²): kod dizisi + ad listesi. */
  H.BOLGE_ADLARI = Object.keys(S.BOLGE);
  H.bolgeHaritasi = function (olcek) {
    const N = 1024 * olcek;
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(olcek, 0, 0, olcek, 0, 0);
    S.ciz(g, { bolge: true });
    const v = g.getImageData(0, 0, N, N).data;
    const kod = new Uint8Array(N * N);
    const tablo = H.BOLGE_ADLARI.map((ad) => H.hex(S.BOLGE[ad]));
    const onbellek = new Map();
    for (let i = 0, j = 0; i < N * N; i++, j += 4) {
      const key = (v[j] << 16) | (v[j + 1] << 8) | v[j + 2];
      let k = onbellek.get(key);
      if (k === undefined) {
        let en = 1e9;
        k = 0;
        for (let m = 0; m < tablo.length; m++) {
          const dr = v[j] - tablo[m][0];
          const dg = v[j + 1] - tablo[m][1];
          const db = v[j + 2] - tablo[m][2];
          const dd = dr * dr + dg * dg + db * db;
          if (dd < en) {
            en = dd;
            k = m;
          }
        }
        onbellek.set(key, k);
      }
      kod[i] = k;
    }
    const K = {};
    H.BOLGE_ADLARI.forEach((ad, i) => (K[ad] = i));
    return { N, kod, K };
  };

  /**
   * Örtmeli kontur katmanı: sahne sırasıyla her nesne için önce kendi alanını siler (arkadakilerin
   * çizgileri onun altında kalır), sonra kendi çizgisini çizer. Sonunda ana tuvale bindirilir.
   */
  H.konturKatmani = function (olcek) {
    const c = S.yeniTuval(1024 * olcek, 1024 * olcek);
    const k = c.getContext('2d');
    k.setTransform(olcek, 0, 0, olcek, 0, 0);
    return {
      c,
      k,
      sil(d) {
        k.save();
        k.globalCompositeOperation = 'destination-out';
        k.fillStyle = '#000';
        for (const x of [].concat(d)) k.fill(typeof x === 'string' ? new Path2D(x) : x);
        k.restore();
      },
    };
  };

  // ---------------------------------------------------------------- S-199 Kalemkâr
  // Hayalî bir kalemkâr ustasının eli: krem, el dokuması pamuklu bez; bambu kalemle (kalam) elle çekilmiş
  // demir karası konturlar; doğal boyalar fırçayla elle doldurulur: çivit (indigo), kök boya (madder),
  // zerdeçal sarısı ve sarının çivit üstüne bindirilmesiyle yeşil. Boya çizgiye tam oturmaz, bezin
  // dokusuna işler, kenarlarında hafifçe koyulaşır. Kenarlarda kök boya zeminli, krem sarmaşıklı bordür.
  const N2 = 2048;
  const tuval = document.getElementById('tuval');
  tuval.width = N2;
  tuval.height = N2;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const R = S.rng(199);
  const P = H.P;

  // sahne, bordürün içine biraz küçültülerek oturur
  const SC = 0.862;
  const OX = 71;
  const OY = 71;
  const katman = () => {
    const c = S.yeniTuval(N2, N2);
    const k = c.getContext('2d', { willReadFrequently: true });
    return { c, k };
  };
  const BOYA = {
    civit: { renk: H.hex('#3D5FA6'), ...katman() },
    kok: { renk: H.hex('#B5352B'), ...katman() },
    sari: { renk: H.hex('#E9B52E'), ...katman() },
    yesil: { renk: H.hex('#3C8C56'), ...katman() },
    kara: { renk: H.hex('#221915'), ...katman() },
    gok: { renk: H.hex('#3F8EEA'), ...katman() },
  };
  const KATLAR = Object.values(BOYA);
  const sahneT = (k) => k.setTransform(2 * SC, 0, 0, 2 * SC, 2 * OX, 2 * OY);
  const mutlakT = (k) => k.setTransform(2, 0, 0, 2, 0, 0);
  let tohum = 1;

  // elle doldurma: yol titrek bir çokgene çevrilir (boya çizgiye tam oturmaz)
  const dolguOnbellek = new Map();
  function elYolu(d, amp) {
    const key = d + '|' + amp;
    if (dolguOnbellek.has(key)) return dolguOnbellek.get(key);
    const p = new Path2D();
    for (const sp of H.flatten(d, 1.6)) {
      const pts = H.wobble(sp.pts.concat([sp.pts[0]]), amp, 16, tohum++);
      pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      p.closePath();
    }
    dolguOnbellek.set(key, p);
    return p;
  }
  function boya(ad, d, yogun, amp) {
    const k = BOYA[ad].k;
    k.fillStyle = `rgba(255,255,255,${yogun === undefined ? 1 : yogun})`;
    k.fill(typeof d === 'string' ? elYolu(d, amp === undefined ? 0.8 : amp) : d);
  }
  function sil(d, katlar) {
    const p = typeof d === 'string' ? P(d) : d;
    for (const L of katlar || KATLAR) {
      L.k.save();
      L.k.globalCompositeOperation = 'destination-out';
      L.k.fillStyle = '#000';
      L.k.fill(p);
      L.k.restore();
    }
  }
  // kalem çizgisi (demir karası ya da kök boya)
  function kalem(d, w, renk, amp) {
    const k = BOYA[renk || 'kara'].k;
    H.pen(k, d, { w, color: '#fff', amp: amp === undefined ? 0.45 : amp, wl: 20, seed: tohum++, press: 0.45, taper: 0.12, step: 1, plen: 0.05 });
  }
  const cizgi = (pts, w, renk, amp) => kalem([{ pts, closed: false }], w, renk, amp);
  function nokta(x, y, r, renk) {
    const k = BOYA[renk || 'kara'].k;
    k.fillStyle = '#fff';
    k.beginPath();
    k.ellipse(x, y, r * (0.9 + R() * 0.2), r * (0.9 + R() * 0.2), R() * 3, 0, Math.PI * 2);
    k.fill();
  }
  const her = (f) => KATLAR.forEach((L) => f(L.k));
  const kutu = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  // ================================================================ SAHNE (sahne koordinatında)
  her(sahneT);
  const Y = S.yollar();

  // ---- gök: elle sürülmüş açık çivit; ufka doğru krem
  {
    const k = BOYA.gok.k;
    const gg = k.createLinearGradient(0, 0, 0, 800);
    gg.addColorStop(0, 'rgba(255,255,255,0.62)');
    gg.addColorStop(0.5, 'rgba(255,255,255,0.42)');
    gg.addColorStop(0.88, 'rgba(255,255,255,0.16)');
    gg.addColorStop(1, 'rgba(255,255,255,0.06)');
    k.fillStyle = gg;
    k.fill(elYolu(kutu(-2, -2, 1026, 800), 0.6));
  }
  // güneş: zerdeçal göbek, kök boya ve sarı alevli taç
  {
    const gx = 872;
    const gy = 150;
    sil(S.daireYolu(gx, gy, 62));
    const tac = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      const a1 = a - 0.17;
      const a2 = a + 0.17;
      const r0 = 38;
      const r1 = i % 2 ? 54 : 60;
      const d = `M${gx + Math.cos(a1) * r0},${gy + Math.sin(a1) * r0} Q${gx + Math.cos(a - 0.05) * (r0 + r1) * 0.55},${gy + Math.sin(a - 0.05) * (r0 + r1) * 0.55} ${gx + Math.cos(a) * r1},${gy + Math.sin(a) * r1} Q${gx + Math.cos(a + 0.05) * (r0 + r1) * 0.55},${gy + Math.sin(a + 0.05) * (r0 + r1) * 0.55} ${gx + Math.cos(a2) * r0},${gy + Math.sin(a2) * r0} Z`;
      tac.push([d, i % 2 ? 'sari' : 'kok']);
    }
    for (const [d, r] of tac) boya(r, d, 0.9, 0.5);
    for (const [d] of tac) kalem(d, 1.5);
    boya('sari', S.daireYolu(gx, gy, 38), 0.95, 0.5);
    kalem(S.daireYolu(gx, gy, 38), 2.1);
    kalem(S.daireYolu(gx, gy, 30), 1.1, 'kok', 0.3);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      nokta(gx + Math.cos(a) * 24, gy + Math.sin(a) * 24, 1.4, 'kok');
    }
    boya('kok', S.daireYolu(gx, gy, 9), 0.9, 0.3);
    kalem(S.daireYolu(gx, gy, 9), 1.2);
  }
  // bulutlar: dilimli tepe, düz taban; çift çizgi (kara ve içte kök boya)
  function bulutYolu(bx, by, w, n, olcek) {
    const s = olcek || 1;
    const x0 = bx - (w / 2) * s;
    const x1 = bx + (w / 2) * s;
    const h = 10 * s;
    let d = `M${x0},${by} C${x0 + w * 0.3 * s},${by + h * 0.5} ${x1 - w * 0.3 * s},${by + h * 0.5} ${x1},${by}`;
    // tepe dilimleri sağdan sola
    const rs = [];
    for (let i = 0; i < n; i++) rs.push(0.8 + 0.4 * Math.sin(i * 2.1 + bx));
    const top = rs.reduce((a, b) => a + b, 0);
    let x = x1;
    for (let i = 0; i < n; i++) {
      const dw = ((x1 - x0) * rs[i]) / top;
      const nx = x - dw;
      const t = (i + 0.5) / n;
      const yuk = (14 + 22 * Math.sin(Math.PI * t)) * s;
      const ya = by - (i === 0 ? 0 : (8 + 14 * Math.sin((Math.PI * i) / n)) * s);
      const yb = by - (i === n - 1 ? 0 : (8 + 14 * Math.sin((Math.PI * (i + 1)) / n)) * s);
      d += ` C${x},${ya - yuk} ${nx},${yb - yuk} ${nx},${yb}`;
      x = nx;
    }
    return d + ' Z';
  }
  const bulutlar = [
    [175, 252, 190, 5],
    [505, 152, 160, 4],
    [765, 332, 200, 5],
    [950, 478, 110, 3],
    [86, 472, 120, 3],
  ];
  for (const [bx, by, w, n] of bulutlar) {
    const d = bulutYolu(bx, by, w, n);
    sil(d);
    kalem(d, 1.9);
    const ic = bulutYolu(bx, by - 4, w * 0.8, n, 0.8);
    kalem(ic, 1.1, 'kok', 0.35);
    // tabanda küçük çivit kıvrımları
    for (let i = 0; i < n + 1; i++) {
      const x = bx - w * 0.3 + (w * 0.6 * i) / n;
      cizgi([[x - 7, by - 6], [x - 2, by - 10], [x + 3, by - 7]], 1.0, 'civit', 0.2);
    }
  }

  // ---- yer: açık zerdeçal yıkama, sıra sıra kara noktalar ve kök boya filizleri
  {
    boya('sari', kutu(-2, 800, 1026, 1026), 0.22, 0.5);
    const rr = S.rng(41);
    for (let y = 818; y < 1024; y += 17) {
      const kay = ((y - 818) / 17) % 2 ? 8 : 0;
      for (let x = 10 + kay; x < 1020; x += 16) {
        nokta(x + (rr() - 0.5) * 1.5, y + (rr() - 0.5) * 1.5, 1.05);
      }
    }
    for (let i = 0; i < 26; i++) {
      const x = 30 + rr() * 960;
      const y = 830 + rr() * 180;
      for (let j = 0; j < 3; j++) {
        const a = -Math.PI / 2 + (j - 1) * 0.9;
        nokta(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 1.6, 'kok');
      }
      cizgi([[x, y + 1], [x, y + 9]], 0.9, 'kara', 0.2);
    }
    cizgi([[-2, 800], [300, 800.5], [600, 799.5], [1026, 800]], 2.0);
    cizgi([[-2, 806], [400, 806.5], [800, 805.6], [1026, 806]], 0.9, 'kok', 0.3);
  }

  // ---- minare
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') {
      const a = p.alem;
      for (const d of Y.minareAlem) {
        sil(d);
        boya('sari', d, 0.95, 0.25);
      }
      for (const d of Y.minareAlem) kalem(d, 1.0, 'kara', 0.15);
      continue;
    }
    if (p.tip === 'bant') continue;
    let d;
    if (p.tip === 'poligon') d = S.yol(p.noktalar, true);
    else if (p.tip === 'topuz') d = p.yol;
    else d = kutu(p.x1, p.y1, p.x2, p.y2);
    sil(d);
    if (p.ad.startsWith('şerefe')) boya('kok', d, 0.9, 0.4);
    if (p.ad.startsWith('çıkma')) boya('sari', d, 0.55, 0.4);
    if (p.tip === 'topuz') boya('gok', d, 0.85, 0.5);
    if (p.tip === 'korkuluk') {
      for (let i = 0; i <= 9; i++) {
        const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * i) / 9;
        cizgi([[x, p.y1 + 2], [x, p.y2 - 2]], 1.1);
      }
      for (let i = 0; i < 9; i++) {
        const x = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / 9;
        nokta(x, (p.y1 + p.y2) / 2, 1.4, 'kok');
      }
    }
    if (p.ad.startsWith('şerefe')) {
      for (let x = p.noktalar[0][0] + 5; x < p.noktalar[1][0] - 2; x += 7) sil(S.daireYolu(x, (p.noktalar[0][1] + p.noktalar[2][1]) / 2, 1.5), [BOYA.kok]);

  // gövdede kenara paralel noktalı çizgi

  // zikzak bant: kök boya ve çivit şeritler, kalemle çevrili

      kalem(S.daireYolu(x, 752, 2.4), 0.8, 'kara', 0.1);

  // ---- kasnak: yeşil (çivit üstüne sarı), çivit pencereler
  for (let k = 1; k >= 0; k--) {

    const d = kutu(q.x1, q.y1, q.x2, q.y2);

    for (let i = 0; i < ps.length - 1; i++) {

  // ---- kubbe: yeşil dilimler (bir koyu bir açık), kalemle kaburgalar
  {

    const kenarlar = [prof.map((q) => [560 - q.r, q.y])].concat(kab.map((k) => k.noktalar)).concat([prof.map((q) => [560 + q.r, q.y])]);
    for (let i = 0; i < kenarlar.length - 1; i++) {

      const b = kenarlar[i + 1];
      const pts = a.concat(b.slice().reverse());

    }
    kalem(Y.kubbe, 2.3);
    // her dilimin ortasında kalemle ince noktalı çizgi
    for (let i = 0; i < kenarlar.length - 1; i++) {
      const a = kenarlar[i];

      for (let j = 3; j < a.length - 8; j += 2) {

        const y = (a[j][1] + b[j][1]) / 2;
        if (Math.abs(b[j][0] - a[j][0]) < 7 || y < 318) continue;

    for (const k of kab) {
      const pts = k.noktalar.filter((q) => q[1] < 553);

    }
    // kaburgaların dibinde krem damla dizisi
    for (let i = 0; i < kenarlar.length - 1; i++) {
      const a = kenarlar[i];
      const b = kenarlar[i + 1];
      const j = 5;
      const x = (a[j][0] + b[j][0]) / 2;
      const y = (a[j][1] + b[j][1]) / 2 + 2;
      const w = Math.abs(b[j][0] - a[j][0]);
      if (w < 8) continue;
      const r = Math.min(4.2, w * 0.22);
      const dd = `M${x},${y - r * 2.2} C${x + r},${y - r} ${x + r},${y + r * 0.8} ${x},${y + r * 0.8} C${x - r},${y + r * 0.8} ${x - r},${y - r} ${x},${y - r * 2.2} Z`;
      sil(dd, [BOYA.yesil]);
      kalem(dd, 0.8, 'kara', 0.1);
      nokta(x, y - r * 0.2, r * 0.32, 'kok');
    }
    for (const d of Y.alem) {
      sil(d);
      boya('sari', d, 0.95, 0.25);
    }
    for (const d of Y.alem) kalem(d, 1.2, 'kara', 0.15);
  }

  // ---- bitkiler
  {
    // saplar: yeşil boya, iki yanda kalem
    S.bitki.saplar.forEach((s) => {
      const k = BOYA.yesil.k;
      k.lineWidth = 4.2;
      k.lineCap = 'round';
      k.strokeStyle = 'rgba(255,255,255,0.9)';
      k.stroke(H.polyPath(s));
      const sol = [];
      const sag = [];
      for (let i = 0; i < s.length; i++) {
        const a = s[Math.max(0, i - 1)];
        const b = s[Math.min(s.length - 1, i + 1)];
        let tx = b[0] - a[0];
        let ty = b[1] - a[1];
        const tl = Math.hypot(tx, ty) || 1;
        tx /= tl;
        ty /= tl;
        sol.push([s[i][0] - ty * 2.4, s[i][1] + tx * 2.4]);

      }
      cizgi(sol, 1.0, 'kara', 0.3);

    S.bitki.yapraklar.forEach((y, i) => {

          cizgi([[c.x + Math.cos(a) * c.r * 0.32, c.y + Math.sin(a) * c.r * 0.32], [c.x + Math.cos(a) * c.r * (s ? 0.72 : 0.82), c.y + Math.sin(a) * c.r * (s ? 0.72 : 0.82)]], Math.max(0.6, c.r * 0.018), 'kara', 0.15);
        }
      }
      const od = S.daireYolu(c.x, c.y, c.r * 0.22);
      sil(od);
      boya('sari', od, 0.95, 0.3);
      kalem(od, Math.max(1, c.r * 0.04), 'kara', 0.15);
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;

      }
      nokta(c.x, c.y, Math.max(0.8, c.r * 0.04), 'kara');

  // ================================================================ BORDÜR (mutlak koordinat)
  her(mutlakT);
  {
    const ic = 70; // sahnenin başladığı yer
    // sahnenin dışını temizle (bordür bezin üstüne yeniden çizilir)
    const dis = new Path2D();
    dis.rect(0, 0, 1024, 1024);
    dis.rect(ic, ic, 1024 - 2 * ic, 1024 - 2 * ic);
    for (const L of KATLAR) {
      L.k.save();
      L.k.globalCompositeOperation = 'destination-out';
      L.k.fillStyle = '#000';
      L.k.fill(dis, 'evenodd');
      L.k.restore();
    }
    // kök boya zeminli şerit
    const b1 = 11;
    const b2 = 54;
    const serit = new Path2D();
    serit.rect(b1, b1, 1024 - 2 * b1, 1024 - 2 * b1);
    serit.rect(b2, b2, 1024 - 2 * b2, 1024 - 2 * b2);
    BOYA.kok.k.fillStyle = 'rgba(255,255,255,0.93)';
    BOYA.kok.k.fill(serit, 'evenodd');
    const kare = (x, y, w) => S.yol([[x, y], [x + w, y], [x + w, y + w], [x, y + w]], true);
    // sarmaşık: dört kenar boyunca dalga; tepelerde nilüfer, çukurlarda yaprak
    const orta = (b1 + b2) / 2;
    const kenarlar = [
      [[b2 + 8, orta], [1, 0], [0, 1]],
      [[1024 - orta, b2 + 8], [0, 1], [-1, 0]],
      [[1024 - b2 - 8, 1024 - orta], [-1, 0], [0, -1]],
      [[orta, 1024 - b2 - 8], [0, -1], [1, 0]],
    ];
    const uzunluk = 1024 - 2 * b2 - 16;
    const per = 104;
    const adet = Math.round(uzunluk / per);
    const dalga = uzunluk / adet;
    const motifler = [];
    for (const [[sx, sy], [dx, dy], [nx, ny]] of kenarlar) {
      const g = (s, t) => [sx + dx * s + nx * t, sy + dy * s + ny * t];
      const sap = [];
      for (let s = 0; s <= uzunluk; s += 2) sap.push(g(s, 8.5 * Math.sin((2 * Math.PI * s) / dalga)));
      // sap: krem şerit, iki yanda kalem
      const k = BOYA.kok.k;
      k.save();
      k.globalCompositeOperation = 'destination-out';
      k.lineWidth = 3.4;
      k.lineCap = 'round';
      k.strokeStyle = '#000';
      k.stroke(H.polyPath(H.wobble(sap, 0.3, 20, tohum++)));
      k.restore();
      motifler.push({ sap, g });
      for (let i = 0; i < adet * 2; i++) {
        const s = ((i + 0.5) * dalga) / 2;
        const yukari = i % 2 === 0;
        const t0 = 8.5 * Math.sin((2 * Math.PI * s) / dalga);
        const [x, y] = g(s, t0);
        // yön: şeridin dışına ya da içine
        const yx = yukari ? nx : -nx;
        const yy = yukari ? ny : -ny;
        if (i % 2 === 0) {
          // nilüfer (yandan): üç sivri taç yaprak + çanak
          const q = (u, v) => [x + yx * u * 1.32 + dx * v * 1.32, y + yy * u * 1.32 + dy * v * 1.32];
          const yaprak = (u0, v0, u1, v1, gen) => {
            const a = q(u0, v0);
            const b = q(u1, v1);
            const m1 = q((u0 + u1) / 2 + gen * 0.2, (v0 + v1) / 2 - gen);
            const m2 = q((u0 + u1) / 2 - gen * 0.2, (v0 + v1) / 2 + gen);
            return `M${a[0]},${a[1]} Q${m1[0]},${m1[1]} ${b[0]},${b[1]} Q${m2[0]},${m2[1]} ${a[0]},${a[1]} Z`;
          };
          const parcalar = [
            [yaprak(-2, 0, -15, -9, 3.2), 'sari'],
            [yaprak(-2, 0, -15, 9, 3.2), 'sari'],
            [yaprak(-2, 0, -18, 0, 4.4), null],
          ];
          for (const [d, renk] of parcalar) {
            sil(d, [BOYA.kok]);
            if (renk) boya(renk, d, 0.85, 0.25);
            kalem(d, 1.0, 'kara', 0.12);
          }
          const cn = `M${q(-1, -6)[0]},${q(-1, -6)[1]} Q${q(4, 0)[0]},${q(4, 0)[1]} ${q(-1, 6)[0]},${q(-1, 6)[1]} Z`;
          sil(cn, [BOYA.kok]);
          boya('civit', cn, 0.8, 0.2);
          kalem(cn, 0.9, 'kara', 0.1);
          nokta(...q(-11, 0), 1.1, 'kok');
        } else {
          // yaprak çifti
          for (const sgn of [-1, 1]) {
            const a = [x, y];
            const tip = [x + yx * 15 + dx * 12 * sgn, y + yy * 15 + dy * 12 * sgn];
            const m1 = [x + yx * 13 + dx * 1 * sgn, y + yy * 13 + dy * 1 * sgn];
            const m2 = [x + yx * 2 + dx * 12 * sgn, y + yy * 2 + dy * 12 * sgn];
            const d = `M${a[0]},${a[1]} Q${m1[0]},${m1[1]} ${tip[0]},${tip[1]} Q${m2[0]},${m2[1]} ${a[0]},${a[1]} Z`;
            sil(d, [BOYA.kok]);
            boya('yesil', d, 0.85, 0.2);
            kalem(d, 0.9, 'kara', 0.1);
          }
        }
      }
      // sapın kalem çizgileri
      const sol = [];
      const sag = [];
      for (const [px, py] of sap) {
        sol.push([px + nx * 1.9, py + ny * 1.9]);
        sag.push([px - nx * 1.9, py - ny * 1.9]);
      }
      cizgi(sol, 0.8, 'kara', 0.25);
      cizgi(sag, 0.8, 'kara', 0.25);
    }
    // kök boya zeminde serpme krem noktalar (boya almamış)
    {
      const rr = S.rng(77);
      const krem = [];
      for (let i = 0; i < 900; i++) {
        const t = rr();
        const yan = (rr() * 4) | 0;
        const s0 = b2 + 8 + t * (1024 - 2 * b2 - 16);
        const u = b1 + 4 + rr() * (b2 - b1 - 8);
        const [x, y] = yan === 0 ? [s0, u] : yan === 1 ? [1024 - u, s0] : yan === 2 ? [s0, 1024 - u] : [u, s0];
        krem.push([x, y]);

      for (const [x, y] of krem) {
        // yalnız kırmızı zeminde ve motiflerden uzakta

          const a = kv[((Math.round((y + ddy) * 2)) * N2 + Math.round((x + ddx) * 2)) * 4 + 3];
          if (a < 200) bos = false;
        }
        if (bos) sil(S.daireYolu(x, y, 1.15), [BOYA.kok]);
      }
    }
    // köşe rozetleri
    for (const [cx, cy] of [[orta, orta], [1024 - orta, orta], [1024 - orta, 1024 - orta], [orta, 1024 - orta]]) {
      sil(S.daireYolu(cx, cy, 18), [BOYA.kok]);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
        const d = S.elipsYolu({ cx: cx + Math.cos(a) * 11, cy: cy + Math.sin(a) * 11, rx: 7.5, ry: 4, aci: a });
        boya(i % 2 ? 'civit' : 'sari', d, 0.8, 0.2);
        kalem(d, 0.9, 'kara', 0.1);
      }
      boya('kok', S.daireYolu(cx, cy, 4.5), 0.95, 0.15);
      kalem(S.daireYolu(cx, cy, 4.5), 1, 'kara', 0.1);
      kalem(S.daireYolu(cx, cy, 19), 1.1, 'kara', 0.2);
    }
    // çizgiler: dış kalem, şerit kenarları, iç çift çizgi ve arasında noktalar
    kalem(kare(5, 5, 1014), 1.4, 'kara', 0.4);
    kalem(kare(b1, b1, 1024 - 2 * b1), 1.7, 'kara', 0.4);
    kalem(kare(b2, b2, 1024 - 2 * b2), 1.7, 'kara', 0.4);
    kalem(kare(58.5, 58.5, 1024 - 117), 0.9, 'kara', 0.3);
    kalem(kare(66.5, 66.5, 1024 - 133), 0.9, 'kara', 0.3);
    for (let s = 62.5; s <= 1024 - 62.5; s += 7.2) {
      for (const [x, y] of [[s, 62.5], [s, 1024 - 62.5], [62.5, s], [1024 - 62.5, s]]) nokta(x, y, 1.25, (Math.round(s / 7.2) % 3 === 0) ? 'kok' : 'kara');
    }
    kalem(kare(ic, ic, 1024 - 2 * ic), 1.6, 'kara', 0.35);
  }

  // ================================================================ BİLEŞİM: bez + boyalar + kalem + dokuma
  {
    const nm = H.noise(301);
    const nd = H.noise(302);
    const veri = {};
    for (const [ad, L] of Object.entries(BOYA)) {
      const v = L.k.getImageData(0, 0, N2, N2).data;
      // bulanık kopya: kenar koyulaşması ve ipliğe sızma için
      const bc = S.yeniTuval(N2, N2);
      const bk = bc.getContext('2d', { willReadFrequently: true });
      bk.filter = ad === 'kara' ? 'blur(1.2px)' : 'blur(3px)';
      bk.drawImage(L.c, 0, 0);
      const b = bk.getImageData(0, 0, N2, N2).data;
      veri[ad] = { v, b, c: L.c };
    }
    const img = ctx.createImageData(N2, N2);
    const o = img.data;
    const bez = [244, 236, 217];
    const sira = ['gok', 'sari', 'civit', 'yesil', 'kok', 'kara'];
    const ip = 4.3;
    for (let y = 0; y < N2; y++) {
      for (let x = 0; x < N2; x++) {
        const p = y * N2 + x;
        const i = p * 4;
        // dokuma: çözgü ve atkı iplikleri, el ipliği kalınlık farkı (fitil)
        const ax = x + 0.9 * nd(y / 60, x / 9);
        const ay = y + 0.9 * nd(x / 60 + 50, y / 9);
        const kx = Math.floor(ax / ip);
        const ky = Math.floor(ay / ip);
        const cx = 0.5 + 0.5 * Math.cos((2 * Math.PI * ax) / ip);
        const cy = 0.5 + 0.5 * Math.cos((2 * Math.PI * ay) / ip);
        const ust = (kx + ky) & 1;
        const fitilX = nm(kx * 1.7, y / 55);
        const fitilY = nm(ky * 1.7 + 80, x / 55);
        const iplik = ust ? cx * (0.9 + 0.1 * fitilX) : cy * (0.9 + 0.1 * fitilY);
        const doku = 0.885 + 0.115 * iplik;
        let r = bez[0] * (1 + 0.02 * (ust ? fitilX : fitilY));
        let gr = bez[1] * (1 + 0.02 * (ust ? fitilX : fitilY));
        let b = bez[2] * (1 + 0.025 * (ust ? fitilX : fitilY));
        const lek = 0.85 + 0.11 * nm(x / 85, y / 85) + 0.05 * nm(kx * 1.3, y / 14) + 0.08 * (iplik - 0.5);
        for (const ad of sira) {
          const V = veri[ad];
          const m = V.v[i + 3] / 255;
          const mb = V.b[i + 3] / 255;
          let d;
          if (ad === 'kara') {
            d = Math.max(m, mb * 0.35) * (0.92 + 0.08 * iplik);
          } else {
            const kenar = Math.max(0, m - mb);
            d = Math.max(m, mb * 0.22) * lek * (1 + 0.55 * kenar);
            if (ad === 'gok') d *= 0.84 + 0.16 * nm(x / 170 + 31, y / 7);
            if (d > 1) d = 1;
          }
          if (d <= 0.002) continue;
          const c = BOYA[ad].renk;
          r *= 1 - d + (d * c[0]) / 255;
          gr *= 1 - d + (d * c[1]) / 255;
          b *= 1 - d + (d * c[2]) / 255;
        }
        o[i] = r * doku;
        o[i + 1] = gr * doku;
        o[i + 2] = b * doku;
        o[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  S.hazir();

})();
