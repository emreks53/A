<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-178 Boyalı Katmanlı Kâğıt — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f4efe4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-178 Boyalı Katmanlı Kâğıt — hayalî bir kâğıt ressamının eli: kalın suluboya kâğıtlarını önce suluboyayla
// boyar (dereceli gök yıkaması, beyazdan lilaya gölgelenmiş bulut kümeleri, ıslak üstüne ıslak yeşiller, pigment
// granülasyonu, fırçayla çizilmiş kaburgalar), kuruyunca maket bıçağıyla keser ve araya köpük koyarak katman
// katman dizer; gökte havada asılı bulut yerine ufuktan yükselen üç sıra bulut kümesi katmanı vardır.
// Her katmanın kesik kenarında kâğıdın beyaz özü ince bir ışık çizgisi olarak görünür, altındaki katmana
// yumuşak gölge düşer.
// Yöntem: her katmanın boyası piksel piksel üretilen bir suluboya yıkamasıdır (degrade + ıslak karışım +
// yıkama bantları + granülasyon); katman yolu bu yıkamayla doldurulur, gölgesi tuval dışı gölge hilesiyle,
// beyaz kesik kenarı kaydırılmış yolun farkıyla çizilir.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const S = SAHNE;
  const OL = 2, W2 = 1024 * OL;
  const PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const P = (d) => new Path2D(d);
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];

  /** Tohumlu değer gürültüsü: n(x, y) → 0..1 */
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const Pm = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { Pm[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = Pm[i]; Pm[i] = Pm[j]; Pm[j] = t; }
    for (let i = 0; i < 256; i++) Pm[i + 256] = Pm[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[Pm[Pm[X] + Y]], b = G[Pm[Pm[X + 1] + Y]], c = G[Pm[Pm[X] + Y + 1]], d = G[Pm[Pm[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const fbm = (n, x, y, o) => {
    o = o || 4;
    let s = 0, a = 0.5, f = 1, t = 0;
    for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); t += a; a *= 0.5; f *= 2.03; }
    return s / t;
  };

  // SVG yolu örnekleme (ölçüm için gizli svg öğesi)
  const _svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  _svg.setAttribute('style', 'position:absolute;left:0;top:0;width:0;height:0;overflow:hidden');
  const _olcu = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  _svg.appendChild(_olcu);
  document.body.appendChild(_svg);
  /** SVG yolunu alt yollarına ayırıp her birini ~adim aralıkla örnekler → [[x,y]...][] */
  function ornekle(d, adim) {
    const out = [];
    for (const parca of d.trim().split(/(?=M)/)) {
      if (!parca.trim()) continue;
      _olcu.setAttribute('d', parca);
      const L = _olcu.getTotalLength();
      const n = Math.max(10, Math.round(L / adim));
      const pts = [];
      for (let i = 0; i < n; i++) { const p = _olcu.getPointAtLength((L * i) / n); pts.push([p.x, p.y]); }
      out.push(pts);
    }
    return out;
  }
  /** Çokgeni ~adim aralıkla yoğunlaştırır (köşeler korunur). */
  function yogunlastir(pts, adim, acik) {
    const out = [];
    const N = acik ? pts.length - 1 : pts.length;
    for (let i = 0; i < N; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(1, Math.round(L / adim));
      for (let k = 0; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
    }
    if (acik) out.push(pts[pts.length - 1]);
    return out;
  }
  /**
   * Kapalı nokta dizisini normali boyunca, yay uzunluğuna bağlı periyodik gürültüyle oynatır (el kesimi / yırtık).
   * o: {genlik, dalga, ince, inceDalga, tohum}
   */
  function titret(pts, o) {
    const N = pts.length;
    const n = gurultu(o.tohum || 1);
    let L = 0;
    const s = [0];
    for (let i = 1; i <= N; i++) { const a = pts[i - 1], b = pts[i % N]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); s.push(L); }
    const out = [];
    const R1 = L / (PI2 * (o.dalga || 40));
    const R2 = L / (PI2 * (o.inceDalga || 6));
    for (let i = 0; i < N; i++) {
      const p = pts[i], a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const l = Math.hypot(nx, ny) || 1;
      nx /= l; ny /= l;
      const t = (s[i] / L) * PI2;
      let off = (n(50 + R1 * Math.cos(t), 50 + R1 * Math.sin(t)) - 0.5) * 2 * (o.genlik || 0);
      if (o.ince) off += (n(150 + R2 * Math.cos(t), 150 + R2 * Math.sin(t)) - 0.5) * 2 * o.ince;
      out.push([p[0] + nx * off, p[1] + ny * off]);
    }
    return out;
  }
  /** Nokta dizilerinden Path2D. */
  function yolu(liste, acik) {
    const p = new Path2D();
    for (const pts of liste) {
      pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      if (!acik) p.closePath();
    }
    return p;
  }
  /** Nokta dizisini hep aynı dönüş yönüne çevirir (nonzero birleşimlerde örtüşen alt yollar delik açmasın). */
  function yonlu(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return a < 0 ? pts.slice().reverse() : pts;
  }
  /** SVG yolu → el titremeli Path2D */
  function elYolu(d, o) {
    o = o || {};
    let t = 0;
    return yolu(ornekle(d, o.adim || 2).map((pts) => yonlu(titret(pts, Object.assign({}, o, { tohum: (o.tohum || 1) + 31 * t++ })))));
  }
  function polyEl(pts, o) {
    o = o || {};
    return yolu([yonlu(titret(yogunlastir(pts, o.adim || 2), o))]);
  }
  const dikYol = (x1, y1, x2, y2) => S.yol(dikd(x1, y1, x2, y2), true);

  /** hex → [r,g,b] */
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; }
  function karisim(h1, h2, t) {
    const a = rgb(h1), b = rgb(h2);
    return '#' + a.map((v, i) => Math.round(mix(v, b[i], t)).toString(16).padStart(2, '0')).join('');
  }

  const ana = S.tuval(document.getElementById('tuval'), OL);
  ana.lineCap = 'round';
  ana.lineJoin = 'round';
  ana.imageSmoothingQuality = 'high';
  const R = S.rng(1780);

  // ------------------------------------------------------------ kâğıt tanesi (paylaşılan)
  const N = 1024;
  const TANE = new Float32Array(N * N);
  (function () {
    const n = gurultu(4242), r = S.rng(4243);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      TANE[j * N + i] = 0.5 * n(i / 1.6, j / 1.6) + 0.3 * n(i / 4 + 50, j / 4) + 0.2 * r();
    }
  })();

  /**
   * Suluboya yıkaması (1024 × 1024 sahne pikseli). o: {
   *   renk: [[t, hex]...] (degrade rampası), t: (x, y) → 0..1, oynak: degrade dalgalanması,
   *   islak: [{renk, olcek, guc, esik}] ıslak üstüne ıslak ikinci pigmentler, bant: yatay yıkama bantları,
   *   gran: granülasyon gücü, kutu: [x1, y1, x2, y2] yalnız bu bölge üretilir }
   */
  function yika(o) {
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d');
    const [bx1, by1, bx2, by2] = (o.kutu || [0, 0, N, N]).map((v, i) => clamp(Math.round(v + (i < 2 ? -6 : 6)), 0, N));
    const w = bx2 - bx1, h = by2 - by1;
    if (w <= 0 || h <= 0) return c;
    const im = g.createImageData(w, h);
    const d = im.data;
    const tohum = o.tohum || Math.floor(R() * 1e6);
    const n1 = gurultu(tohum), n2 = gurultu(tohum + 1), n3 = gurultu(tohum + 2);
    // degrade rampası
    const LUT = new Float32Array(256 * 3);
    const st = o.renk.map(([t, h2]) => [t, rgb(h2)]);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let k = 0;
      while (k < st.length - 2 && t > st[k + 1][0]) k++;
      const [ta, ca] = st[k], [tb, cb] = st[k + 1];
      const u = clamp((t - ta) / (tb - ta || 1), 0, 1);
      for (let q = 0; q < 3; q++) LUT[i * 3 + q] = mix(ca[q], cb[q], u);
    }
    const islak = (o.islak || []).map((s) => ({ c: rgb(s.renk), olcek: s.olcek || 120, guc: s.guc || 0.5, esik: s.esik === undefined ? 0.5 : s.esik, n: gurultu(tohum + 7 + Math.floor((s.olcek || 1) * 13)) }));
    const oynak = o.oynak === undefined ? 0.1 : o.oynak;
    if (o.cam) o.cam.forEach((cm) => (cm.c = rgb(cm.renk)));
    const bant = o.bant || 0;
    const gran = o.gran === undefined ? 0.5 : o.gran;
    for (let y = by1; y < by2; y++) for (let x = bx1; x < bx2; x++) {
      let t = o.t(x, y) + (fbm(n1, x / 95, y / 95, 3) - 0.5) * 2 * oynak;
      t = clamp(t, 0, 1);
      const li = (t * 255) | 0;
      let r = LUT[li * 3], gg = LUT[li * 3 + 1], b = LUT[li * 3 + 2];
      for (const s of islak) {
        const v = fbm(s.n, x / s.olcek, y / s.olcek, 3);
        const m = clamp((v - s.esik) / 0.18, 0, 1) * s.guc;
        if (m > 0) { r = mix(r, s.c[0], m); gg = mix(gg, s.c[1], m); b = mix(b, s.c[2], m); }
      }
      // pigment yoğunluğu: yıkama bantları ve yumuşak dalgalanma
      let yog = 1 + (n2(x / 380, y / 11) - 0.5) * bant + (n3(x / 40, y / 40) - 0.5) * 0.05;
      // granülasyon: kâğıdın çukurlarında pigment birikir (koyu tonlarda daha belirgin)
      const koyuluk = 1 - (r + gg + b) / 765;
      yog += (0.5 - TANE[y * N + x]) * gran * (0.3 + koyuluk) * 0.16;
      // ikinci kat sır (glaze): kuruyan ıslak kenarda pigment birikir, ince koyu çizgi kalır
      if (o.cam) for (const cm of o.cam) {
        const v = cm.f(x, y);
        if (v > 0) {
          const m = cm.alfa * (1 + 0.9 * Math.exp(-v / 1.4)) * (0.85 + 0.3 * n3(x / 30 + 9, y / 30));
          r = mix(r, (r * cm.c[0]) / 255, m); gg = mix(gg, (gg * cm.c[1]) / 255, m); b = mix(b, (b * cm.c[2]) / 255, m);
        }
      }
      const k = ((y - by1) * w + (x - bx1)) * 4;
      // yoğunluk: beyaz kâğıda göre pigment koyulaşması
      d[k] = clamp(255 - (255 - r) * yog, 0, 255);
      d[k + 1] = clamp(255 - (255 - gg) * yog, 0, 255);
      d[k + 2] = clamp(255 - (255 - b) * yog, 0, 255);
      d[k + 3] = 255;
    }
    g.putImageData(im, bx1, by1);
    if (o.firca) { g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; o.firca(g); g.restore(); }
    return c;
  }

  // ------------------------------------------------------------ katman
  function golge(yol, o, kural) {
    const T = 3000;
    ana.save();
    ana.translate(-T, 0);
    ana.shadowColor = `rgba(52,40,30,${o.ga === undefined ? 0.36 : o.ga})`;
    ana.shadowBlur = (o.gb === undefined ? 12 : o.gb) * OL;
    ana.shadowOffsetX = (T + (o.gx === undefined ? -4.5 : o.gx)) * OL;
    ana.shadowOffsetY = (o.gy === undefined ? 7 : o.gy) * OL;
    ana.fillStyle = '#000';
    ana.fill(yol, kural || 'nonzero');
    ana.restore();
  }
  const BUYUK = new Path2D();
  BUYUK.rect(-60, -60, 1144, 1144);
  /** Kaydırılmış yolun dışında kalan kenar bandı (kesik kenar ışığı / kalınlık gölgesi). */
  const KT = S.yeniTuval(W2, W2), kg = KT.getContext('2d');
  function kenarBandi(yol, kural, dx, dy, renk) {
    kg.setTransform(1, 0, 0, 1, 0, 0);
    kg.globalCompositeOperation = 'source-over';
    kg.clearRect(0, 0, W2, W2);
    kg.setTransform(OL, 0, 0, OL, 0, 0);
    kg.fillStyle = renk;
    kg.fill(yol, kural);
    kg.globalCompositeOperation = 'destination-out';
    kg.translate(dx, dy);
    kg.fillStyle = '#000';
    kg.fill(yol, kural);
    ana.save();
    ana.setTransform(1, 0, 0, 1, 0, 0);
    ana.drawImage(KT, 0, 0);
    ana.restore();
  }
  /** Boyalı kâğıt katmanı: gölge, suluboya yüzeyi, kesik kenarın beyaz özü. */
  function katman(yol, boya, o) {
    o = o || {};
    const kural = o.kural || 'nonzero';
    if (o.golge !== false) golge(yol, o, kural);
    ana.save();
    ana.clip(yol, kural);
    if (typeof boya === 'string' || boya instanceof CanvasGradient) { ana.fillStyle = boya; ana.fillRect(-10, -10, 1044, 1044); }
    else ana.drawImage(boya, 0, 0, 1024, 1024);
    if (o.ust) o.ust(ana);
    ana.restore();
    const k = o.kenar === undefined ? 1.25 : o.kenar;
    if (k > 0) {
      kenarBandi(yol, kural, -k, k, `rgba(255,253,246,${o.isik === undefined ? 0.9 : o.isik})`);
      kenarBandi(yol, kural, k * 0.8, -k * 0.8, 'rgba(60,45,30,0.16)');
    }
  }
  /** Bıçak kesimi: çok hafif el titremesi. */
  let tohumSay = 900;
  const KESIM = { genlik: 0.45, dalga: 50, ince: 0.12, inceDalga: 6, adim: 1.6 };
  const kes = (d, o) => elYolu(d, Object.assign({}, KESIM, { tohum: tohumSay++ }, o || {}));
  const kesP = (pts, o) => polyEl(pts, Object.assign({}, KESIM, { tohum: tohumSay++ }, o || {}));
  const birlestir = (...yollar) => { const p = new Path2D(); for (const y of yollar) p.addPath(y); return p; };
  const dogrusal = (x1, y1, x2, y2, dur) => { const g = ana.createLinearGradient(x1, y1, x2, y2); dur.forEach(([t, c]) => g.addColorStop(t, c)); return g; };
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ------------------------------------------------------------ 1. gök: sakin, dereceli suluboya yıkaması (arka kart)
  const GX = 880, GY = 140;
  const GOK = yika({
    tohum: 11,
    renk: [[0, '#6A97D2'], [0.35, '#8DB3E0'], [0.7, '#C3D7EE'], [1, '#EEF1F4']],
    t: (x, y) => clamp(y / 640 + 0.2 * ss(0, 1, 1 - Math.hypot(x - GX, y - GY) / 480), 0, 1),
    oynak: 0.04,
    islak: [{ renk: '#A9A3DA', olcek: 220, guc: 0.12, esik: 0.58 }],
    bant: 0.1,
    gran: 0.45,
  });
  ana.drawImage(GOK, 0, 0, 1024, 1024);

  // ------------------------------------------------------------ 2. güneş: üç kat üst üste kesilmiş daire
  const daireP = (cx, cy, r) => { const p = []; for (let i = 0; i < 220; i++) { const t = (i / 220) * PI2; p.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]); } return p; };
  katman(kesP(daireP(GX, GY, 116)), yika({ tohum: 12, kutu: [GX - 128, GY - 128, GX + 128, GY + 128], renk: [[0, '#FDF6DC'], [1, '#F8EBC0']], t: (x, y) => Math.hypot(x - GX, y - GY) / 118, gran: 0.35 }), { ga: 0.24, gb: 11, gx: -3, gy: 5 });
  katman(kesP(daireP(GX, GY, 90)), yika({ tohum: 13, kutu: [GX - 100, GY - 100, GX + 100, GY + 100], renk: [[0, '#FBE7A0'], [1, '#F6D57A']], t: (x, y) => Math.hypot(x - GX, y - GY) / 92, gran: 0.45 }), { ga: 0.26, gb: 9, gx: -3, gy: 5 });
  katman(kesP(daireP(GX, GY, 64)), yika({ tohum: 14, kutu: [GX - 76, GY - 76, GX + 76, GY + 76], renk: [[0, '#FCE27C'], [0.6, '#F6C445'], [1, '#EFAE38']], t: (x, y) => Math.hypot(x - GX + 16, y - GY + 16) / 86, gran: 0.6 }), { ga: 0.3, gb: 8, gx: -3, gy: 5 });

  // ------------------------------------------------------------ 3. bulut kümeleri: ufuktan yükselen üç sıra boyalı kâğıt katmanı
  // her sıra: tepesi yuvarlak kabarık bir siluet; üstte beyaz, alta doğru lila-mavi suluboya
  function kumeNok(taban, tepeY, rmin, rmax, tohum) {
    const r = S.rng(tohum);
    const tepeler = [];
    let x = -60;
    while (x < 1100) {
      const rr = rmin + r() * (rmax - rmin);
      tepeler.push([x + rr * 0.8, tepeY(x) + rr, rr]);
      x += rr * (1.05 + r() * 0.5);
    }
    const ust = [];
    for (let xx = -30; xx <= 1054; xx += 2) {
      let y = Infinity;
      for (const [cx, cy, rr] of tepeler) if (Math.abs(xx - cx) < rr) y = Math.min(y, cy - Math.sqrt(rr * rr - (xx - cx) * (xx - cx)));
      if (y === Infinity) y = taban;
      ust.push([xx, Math.min(y, taban)]);
    }
    ust.push([1054, taban], [-30, taban]);
    return { pts: ust, ust: (xx) => { let y = Infinity; for (const [cx, cy, rr] of tepeler) if (Math.abs(xx - cx) < rr) y = Math.min(y, cy - Math.sqrt(rr * rr - (xx - cx) * (xx - cx))); return y === Infinity ? taban : y; } };
  }
  const SIRALAR = [
    { tepe: (x) => 412 + 40 * Math.sin(x / 260 + 0.8) + 18 * Math.sin(x / 97), rmin: 30, rmax: 58, tohum: 71, ust: '#FFFFFF', alt: '#C7CEEB', ga: 0.26 },
    { tepe: (x) => 492 + 30 * Math.sin(x / 210 + 2.4) + 14 * Math.sin(x / 83 + 1), rmin: 26, rmax: 50, tohum: 72, ust: '#FFFFFF', alt: '#CFD0EE', ga: 0.28 },
    { tepe: (x) => 566 + 22 * Math.sin(x / 180 + 4.1) + 10 * Math.sin(x / 61 + 2), rmin: 22, rmax: 42, tohum: 73, ust: '#FFFEFA', alt: '#D8D6F0', ga: 0.3 },
  ];
  for (const sr of SIRALAR) {
    const k = kumeNok(740, sr.tepe, sr.rmin, sr.rmax, sr.tohum);
    const boya = yika({ tohum: sr.tohum + 100, kutu: [0, 300, 1024, 760], renk: [[0, sr.ust], [0.4, '#F4F4FB'], [1, sr.alt]], t: (x, y) => clamp((y - k.ust(x)) / 90, 0, 1), islak: [{ renk: '#E4DCF2', olcek: 70, guc: 0.25, esik: 0.6 }], gran: 0.35, oynak: 0.05,
      cam: [{ renk: '#D6D2EE', alfa: 0.22, f: (x, y) => y - (k.ust(x + 12) + 36 + 6 * Math.sin(x / 37)) }] });
    katman(kesP(k.pts, { genlik: 0.3, dalga: 60 }), boya, { ga: sr.ga, gb: 14, gx: -3, gy: 2.5 });
  }

  // ------------------------------------------------------------ 4. uzak kum tepeleri (iki katman, sıcak yıkamalar)
  function tepeYolu(y0, gen, faz) {
    const pts = [];
