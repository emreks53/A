<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-077 Lake Resim — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #070505; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-077 Lake Resim — derin, ayna gibi parlak siyah ve kırmızı lake zemin; zımparalanıp cilalanarak
// ortaya çıkarılmış alt katmanlar (yaldız, kırmızı); açık yerlerde kırık yumurta kabuğu kakması,
// altın ve gümüş varak pulları, sedef parçaları (Vietnam sơn mài / Japon urushi havası).
// Yöntem: boya katmanı (lake rengi) + malzeme katmanları (varak, yumurta kabuğu, sedef, alt lake).
// Varak ve alt lake "zımpara" gürültüsüyle bulutlu kenarlarla ortaya çıkar; yumurta kabuğu bükülmüş
// Voronoi ile kırık parçalara ayrılır; sedef ince film girişimi renkleriyle boyanır; parlaklık en üstte.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024 * K, H = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  const rnd = S.rng(7777);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(101), n2 = gurultu(202), n3 = gurultu(303), n4 = gurultu(404), n5 = gurultu(505);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.27 * n(x * 2.07, y * 2.07) + 0.15 * n(x * 4.3, y * 4.3) + 0.08 * n(x * 8.9, y * 8.9);
  const hash = (i, j, k) => { let h = (i * 374761393 + j * 668265263 + k * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  // ------------------------------------------------------------ katmanlar
  function katman() { const c = S.yeniTuval(W, H); const x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(K, 0, 0, K, 0, 0); x.lineJoin = 'round'; x.lineCap = 'round'; return [c, x]; }
  const [cB, B] = katman(); // lake rengi (en üst lake tabakası)
  const [cA, A] = katman(); // alt lake (zımparayla ortaya çıkan ikinci renk): rgb renk, alfa miktar
  const [cG, G] = katman(); // varak (altın / gümüş / lake altındaki yaldız): rgb ton, alfa miktar
  const [cE, E] = katman(); // yumurta kabuğu: rgb ton, alfa kaplama
  const [cP, P] = katman(); // sedef: r = parça faz kayması, alfa kaplama
  const hepsi = [B, A, G, E, P];
  const lin = (x1, y1, x2, y2, d) => { const g = B.createLinearGradient(x1, y1, x2, y2); d.forEach(([t, c]) => g.addColorStop(t, c)); return g; };
  const rad = (x, y, r0, r1, d) => { const g = B.createRadialGradient(x, y, r0, x, y, r1); d.forEach(([t, c]) => g.addColorStop(t, c)); return g; };

  // Opak bir parça: kendi katmanına çizilir, alttaki diğer malzemeleri siler.
  // m: 'lake' (renk B'ye), 'varak', 'kabuk', 'sedef'; renk: o malzemenin rengi/tonu
  function parca(yol, m, renk, o) {
    o = o || {};
    const p = P2(yol);
    const hedef = { lake: B, varak: G, kabuk: E, sedef: P }[m];
    for (const x of [A, G, E, P]) {
      if (x === hedef) continue;
      x.globalCompositeOperation = 'destination-out';
      if (o.cizgi) { x.lineWidth = o.cizgi; x.strokeStyle = '#000'; x.stroke(p); } else { x.fillStyle = '#000'; x.fill(p); }
      x.globalCompositeOperation = 'source-over';
    }
    if (m !== 'lake') { // altında lake zemini (çatlak ve aralıklarda görünür)
      B.fillStyle = o.zemin || '#120a07';
      if (o.cizgi) { B.lineWidth = o.cizgi; B.strokeStyle = B.fillStyle; B.stroke(p); } else B.fill(p);
    }
    if (o.cizgi) { hedef.lineWidth = o.cizgi; hedef.strokeStyle = renk; hedef.stroke(p); } else { hedef.fillStyle = renk; hedef.fill(p); }
  }
  // Saydam katman ekle (silmeden): alt lake ya da lake altı varak
  function ekle(x, yol, renk, kirp) {
    x.save();
    if (kirp) x.clip(P2(kirp));
    x.fillStyle = renk; x.fill(P2(yol));
    x.restore();
  }

  // ------------------------------------------------------------ gök: siyah lake, ufukta zımparalanmış kehribar yaldız
  B.fillStyle = lin(0, 0, 0, 800, [[0, '#060404'], [0.55, '#0c0605'], [1, '#1c0b07']]);
  B.fillRect(0, 0, 1024, 1024);
  // zımpara derinliği: ufukta ve güneş çevresinde siyahın altından önce kırmızı, sonra yaldız (cánh gián) çıkar
  for (const [x, renk] of [[A, '150,32,16'], [G, '196,132,48']]) {
    x.fillStyle = lin(0, 420, 0, 800, [[0, `rgba(${renk},0)`], [0.6, `rgba(${renk},0.5)`], [1, `rgba(${renk},0.8)`]]);
    x.fillRect(0, 420, 1024, 380);
    x.fillStyle = rad(880, 140, 50, 340, [[0, `rgba(${renk},1)`], [0.3, `rgba(${renk},0.68)`], [1, `rgba(${renk},0)`]]);
    x.fillRect(480, 0, 544, 560);
  }

  // güneş: altın varak disk, gümüş halka
  parca(S.daireYolu(880, 140, 58), 'varak', 'rgba(232,186,78,1)');
  parca(S.daireYolu(880, 140, 73), 'varak', 'rgba(206,210,214,1)', { cizgi: 3.2 });
  parca(S.daireYolu(880, 140, 84), 'varak', 'rgba(226,180,74,1)', { cizgi: 1.4 });

  // bulutlar: gümüş varak, alt kenarları zımparayla eriyen; içlerinde altın kıvrım çizgisi
  function bulutYolu(cx, cy, w, h, n) {
    const x0 = cx - w / 2;
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + w * t, cy - h * Math.pow(Math.sin(Math.PI * t), 0.7)]); }
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
      let nx = dy / L, ny = -dx / L;
      if (ny > 0) { nx = -nx; ny = -ny; }
      const b = L * 0.6;
      p.bezierCurveTo(ax + nx * b, ay + ny * b, bx + nx * b, by + ny * b, bx, by);
    }
    p.bezierCurveTo(cx + w * 0.25, cy + h * 0.35, cx - w * 0.25, cy + h * 0.35, pts[0][0], pts[0][1]);
    p.closePath();
    return p;
  }
  const bulutlar = [[170, 262, 230, 52, 5], [480, 150, 180, 42, 4], [758, 352, 160, 36, 4], [100, 470, 130, 30, 3], [950, 468, 120, 28, 3]];
  for (const [bx, by, bw, bh, bn] of bulutlar) {
    const p = bulutYolu(bx, by, bw, bh, bn);
    G.save(); G.globalCompositeOperation = 'destination-out'; G.fillStyle = '#000'; G.fill(p); G.restore();
    G.fillStyle = lin(0, by - bh * 1.1, 0, by + bh * 0.35, [[0, 'rgba(214,218,222,1)'], [0.55, 'rgba(206,210,214,0.95)'], [1, 'rgba(196,200,206,0.25)']]);
    G.fill(p);
    // altın kıvrım
    const k = new Path2D();
    k.moveTo(bx - bw * 0.36, by - bh * 0.05);
    k.bezierCurveTo(bx - bw * 0.1, by - bh * 0.32, bx + bw * 0.12, by + bh * 0.1, bx + bw * 0.3, by - bh * 0.2);
    k.arc(bx + bw * 0.3 - bh * 0.12, by - bh * 0.2, bh * 0.12, 0, Math.PI * 1.6, true);
    G.lineWidth = 1.6; G.strokeStyle = 'rgba(232,184,80,1)'; G.stroke(k);
  }

  // altın ve gümüş varak pulları
  {
    const r = S.rng(99);
    const odak = [[880, 140, 260, 70], [170, 262, 170, 34], [480, 150, 140, 26], [758, 352, 130, 24], [512, 700, 520, 60], [100, 470, 100, 14], [950, 468, 100, 14]];
    for (const [ox, oy, yr, adet] of odak) {
      for (let i = 0; i < adet; i++) {
        const a = r() * Math.PI * 2, d = yr * Math.sqrt(r());
        const x = ox + Math.cos(a) * d * 1.3, y = oy + Math.sin(a) * d * 0.7;
        if (y > 790 || S.kubbedeMi(x, y)) continue;
        const rr = 1.2 + r() * r() * 5;
        const n = 3 + Math.floor(r() * 4);
        const p = new Path2D();
        const a0 = r() * 6.28;
        for (let k = 0; k < n; k++) { const aa = a0 + (k / n) * Math.PI * 2 + (r() - 0.5) * 0.8; const q = rr * (0.5 + r() * 0.7); k ? p.lineTo(x + Math.cos(aa) * q, y + Math.sin(aa) * q * 0.8) : p.moveTo(x + Math.cos(aa) * q, y + Math.sin(aa) * q * 0.8); }
        p.closePath();
        G.fillStyle = r() < 0.62 ? 'rgba(234,190,84,1)' : 'rgba(214,218,224,1)';
        G.fill(p);
      }
    }
  }

  // ------------------------------------------------------------ zemin: kırmızı lake, zımparada siyah ve yaldız
  B.fillStyle = lin(0, 800, 0, 1024, [[0, '#9A2416'], [0.5, '#7A1810'], [1, '#4A0C08']]);
  B.fillRect(0, 800, 1024, 224);
  for (const x of [A, G, E, P]) { x.save(); x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fillRect(0, 800, 1024, 224); x.restore(); }
  A.fillStyle = lin(0, 800, 0, 1024, [[0, 'rgba(14,6,4,0.3)'], [1, 'rgba(14,6,4,0.7)']]);
  A.fillRect(0, 800, 1024, 224);
  G.fillStyle = 'rgba(200,140,60,0.25)'; G.fillRect(0, 800, 1024, 60);

  // ------------------------------------------------------------ minare: yumurta kabuğu, altın şerefeler
  const mc = 300;
  const kabukTon = (x1, x2) => lin(x1, 0, x2, 0, [[0, 'rgba(150,112,74,1)'], [0.35, 'rgba(206,182,146,1)'], [0.7, 'rgba(244,236,218,1)'], [1, 'rgba(250,246,234,1)']]);
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs);
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') parca(S.yol(p.noktalar, true), 'varak', 'rgba(228,182,76,1)');
      else if (p.ad.startsWith('çıkma')) parca(S.yol(p.noktalar, true), 'lake', lin(x1, 0, x2, 0, [[0, '#5a1009'], [1, '#B02A18']]));
      else parca(S.yol(p.noktalar, true), 'kabuk', kabukTon(x1, x2));
    } else if (p.tip === 'korkuluk') {
      parca(dik(p.x1, p.y1, p.x2, p.y2), 'lake', '#0d0706');
      const adet = 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 3 + ((p.x2 - p.x1 - 6) * (i + 0.5)) / adet;
        parca(dik(x - 2.6, p.y1 + 3, x + 2.6, p.y2 - 1), 'kabuk', i < 3 ? 'rgba(200,174,138,1)' : 'rgba(244,236,220,1)');
      }
      parca(`M${p.x1},${p.y1 + 1.5} L${p.x2},${p.y1 + 1.5}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2.2 });
    } else if (p.tip === 'bant') {
      parca(dik(p.x1, p.y1, p.x2, p.y2), 'kabuk', kabukTon(p.x1, p.x2));
      for (const z of S.zikzakCizgileri()) parca(S.yol(z), 'lake', '#A52314', { cizgi: 4.2 });
    } else if (p.tip === 'topuz') {
      parca(p.yol, 'kabuk', kabukTon(mc - 24, mc + 24));
    }
  }
  for (const p of S.minarePencereleri) {
    parca(S.kemerYolu(p.x, p.y, p.w + 5, p.h + 3), 'lake', '#A82516');
    parca(S.kemerYolu(p.x, p.y + 2.5, p.w, p.h), 'lake', '#090505');
  }
  function alem(a) {
    const al = 'rgba(234,190,82,1)';
    parca(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), 'varak', al);
    parca(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), 'varak', al);
    for (const k of a.kureler) parca(S.daireYolu(k.cx, k.cy, k.r), 'varak', al);
    parca(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 'varak', al);
  }
  alem(S.alemParcalari(mc, 146, 0.62));

  // ------------------------------------------------------------ kaide: yumurta kabuğu
  const KA = S.kaide;
  parca(dik(KA.x1, KA.y1, KA.x2, KA.y2), 'kabuk', lin(KA.x1, 0, KA.x2, 0, [[0, 'rgba(160,122,82,1)'], [0.22, 'rgba(220,200,166,1)'], [0.6, 'rgba(244,236,218,1)'], [1, 'rgba(252,248,238,1)']]));
  parca(dik(KA.kornis.x1, KA.kornis.y1, KA.kornis.x2, KA.kornis.y2), 'lake', lin(KA.kornis.x1, 0, KA.kornis.x2, 0, [[0, '#6a140c'], [1, '#B42C1A']]));
  parca(`M${KA.kornis.x1},${KA.kornis.y2} L${KA.kornis.x2},${KA.kornis.y2}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2 });
  parca(`M${KA.x1},${KA.y2 - 3} L${KA.x2},${KA.y2 - 3}`, 'lake', '#8E1E12', { cizgi: 5 });
  for (const p of KA.pencereler) {
    parca(S.kemerYolu(p.x, p.y - 4, p.w + 12, p.h + 6), 'varak', 'rgba(226,180,74,1)');
    parca(S.kemerYolu(p.x, p.y - 1, p.w + 6, p.h + 2), 'lake', '#9E2214');
    parca(S.kemerYolu(p.x, p.y + 2, p.w, p.h - 1), 'lake', '#080404');
  }

  // ------------------------------------------------------------ kasnak: yeşil lake, kenarlarda kırmızı alt lake
  const KS = S.kasnak;
  for (const k of [1, 0]) {
    const q = KS[k];
    const yol = dik(q.x1, q.y1, q.x2, q.y2);
    parca(yol, 'lake', lin(q.x1, 0, q.x2, 0, k ? [[0, '#0A2414'], [0.5, '#14432A'], [0.85, '#1E5A36'], [1, '#143E26']] : [[0, '#0D2C19'], [0.5, '#185033'], [0.85, '#24683F'], [1, '#17462B']]));
    ekle(A, yol, lin(q.x1, 0, q.x2, 0, [[0, 'rgba(150,34,18,0.55)'], [0.15, 'rgba(150,34,18,0)'], [0.85, 'rgba(150,34,18,0)'], [1, 'rgba(150,34,18,0.5)']]));
    ekle(G, yol, lin(q.x1, 0, q.x2, 0, [[0, 'rgba(170,160,70,0)'], [0.55, 'rgba(170,160,70,0.1)'], [0.82, 'rgba(176,166,72,0.5)'], [1, 'rgba(170,160,70,0.15)']]));
    for (const p of S.kasnakPencereleri(k)) {
      parca(S.kemerYolu(p.x, p.y - 2, p.w + 4, p.h + 3), 'varak', 'rgba(222,178,72,1)');
      parca(S.kemerYolu(p.x, p.y, p.w, p.h), 'lake', '#070404');
    }
    parca(`M${q.x1},${q.y1 + 1} L${q.x2},${q.y1 + 1}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2.2 });
    parca(`M${q.x1},${q.y2 - 1} L${q.x2},${q.y2 - 1}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 1.6 });
  }

  // ------------------------------------------------------------ kubbe: yeşil lake, sağ üstte yeşilin altından yaldız
  parca(S.kubbeYolu, 'lake', rad(650, 380, 20, 330, [[0, '#2C7A45'], [0.4, '#1A5A33'], [0.8, '#0E3720'], [1, '#08200F']]));
  ekle(G, S.kubbeYolu, rad(665, 365, 10, 230, [[0, 'rgba(200,188,84,0.9)'], [0.45, 'rgba(176,170,72,0.55)'], [1, 'rgba(150,150,60,0)']]), S.kubbeYolu);
  ekle(A, S.kubbeYolu, rad(655, 375, 10, 260, [[0, 'rgba(84,140,64,0.95)'], [0.45, 'rgba(84,140,64,0.62)'], [1, 'rgba(84,140,64,0)']]), S.kubbeYolu);
  {
    G.save(); G.clip(P2(S.kubbeYolu));
    for (const k of S.kaburgalar(16)) { G.lineWidth = 1.5; G.strokeStyle = 'rgba(226,182,78,1)'; G.stroke(P2(S.yol(k.noktalar))); }
    G.restore();
    G.lineWidth = 2.2; G.strokeStyle = 'rgba(226,182,78,1)'; G.stroke(P2('M360,555 C358,430 440,318 560,300 C680,318 762,430 760,555'));
  }
  alem(S.alemParcalari(560, 300, 1));

  // ------------------------------------------------------------ bitkiler
  const bit = S.bitki;
  for (const s of bit.saplar) parca(S.yol(s), 'varak', 'rgba(214,170,70,1)', { cizgi: 3.4 });
  for (const y of bit.yapraklar) {
    const yol = S.yaprakYolu(y);
    parca(yol, 'lake', y.uzunluk > 50 ? '#0F2A18' : '#16381F');
    // ışığa dönük yarıda lake altından yaldız: altın-yeşil
    const [a, b] = S.yaprakDamari(y);
    const g = G.createLinearGradient(a[0] - Math.sin(y.aci) * 20, a[1] + Math.cos(y.aci) * 20, a[0] + Math.sin(y.aci) * 20, a[1] - Math.cos(y.aci) * 20);
    const yon = Math.sin(y.aci) * 1 + Math.cos(y.aci) * 1 > 0 ? 1 : -1; // sağ üste bakan taraf
    g.addColorStop(0, `rgba(190,170,70,${yon > 0 ? 0.15 : 0.8})`);
    g.addColorStop(1, `rgba(190,170,70,${yon > 0 ? 0.8 : 0.15})`);
    ekle(G, yol, g, yol);
    const g2 = A.createLinearGradient(a[0] - Math.sin(y.aci) * 20, a[1] + Math.cos(y.aci) * 20, a[0] + Math.sin(y.aci) * 20, a[1] - Math.cos(y.aci) * 20);
    g2.addColorStop(0, `rgba(70,96,40,${yon > 0 ? 0.15 : 0.8})`);
    g2.addColorStop(1, `rgba(70,96,40,${yon > 0 ? 0.8 : 0.15})`);
    ekle(A, yol, g2, yol);
    parca(`M${a[0]},${a[1]} L${b[0]},${b[1]}`, 'varak', 'rgba(228,184,80,1)', { cizgi: 1.3 });
  }
  for (const t of bit.tomurcuklar) {
    parca(S.tomurcukYolu(t), 'lake', '#B02818');
    ekle(A, S.tomurcukYolu(t), 'rgba(60,8,6,0.5)', S.tomurcukYolu(t));
    parca(S.tomurcukYolu(t), 'varak', 'rgba(226,180,74,1)', { cizgi: 1.1 });
  }
  function cicek(c, sedef) {
    const tl = S.tacYapraklari(c);
    tl.forEach((e, i) => {
      const yol = S.elipsYolu(e);
      if (sedef) {
        parca(yol, 'sedef', `rgb(${Math.floor(hash(i, Math.round(c.x), 7) * 255)},0,0)`);
        parca(yol, 'lake', '#120806', { cizgi: 1.1 });
      } else {
        parca(yol, 'kabuk', rad(c.x, c.y, c.r * 0.15, c.r * 1.05, [[0, 'rgba(200,110,96,1)'], [0.42, 'rgba(236,208,190,1)'], [0.7, 'rgba(246,240,226,1)'], [1, 'rgba(252,249,240,1)']]));
        // taç yaprak dibinde kırmızı alt lake (kabuğun çatlaklarından değil, üstünden ince lake)
        ekle(A, yol, rad(c.x, c.y, c.r * 0.12, c.r * 0.75, [[0, 'rgba(170,34,24,0.85)'], [1, 'rgba(170,34,24,0)']]), yol);
      }
    });
    parca(S.daireYolu(c.x, c.y, c.r * 0.24), 'varak', 'rgba(234,188,80,1)');
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + c.aci; parca(S.daireYolu(c.x + Math.cos(a) * c.r * 0.15, c.y + Math.sin(a) * c.r * 0.15, Math.max(1, c.r * 0.03)), 'lake', '#2a0a06'); }
  }
  bit.cicekler.forEach((c, i) => cicek(c, i < 4 || c.r < 40));

  // ------------------------------------------------------------ piksel geçişi: zımpara, varak, kabuk, sedef
  const img = B.getImageData(0, 0, W, H), bd = img.data;
  const ad = A.getImageData(0, 0, W, H).data;
  const gd = G.getImageData(0, 0, W, H).data;
  const ed = E.getImageData(0, 0, W, H).data;
  const pd = P.getImageData(0, 0, W, H).data;
  const catlak = hex('#1A0E09');

  for (let y = 0; y < H; y++) {
    const yy = y / K;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const xx = x / K;
      let r = bd[i], g = bd[i + 1], b = bd[i + 2];
      // zımpara gürültüsü: ortaya çıkan katmanların bulutlu, keskin kenarları
      const zg = fbm(n1, xx * 0.0095, yy * 0.0095) + 0.07 * (n4(xx * 0.11, yy * 0.11) - 0.5) + 0.03 * (n5(xx * 0.3, yy * 0.3) - 0.5);
      // lakenin derinliği: çok hafif dalgalı yoğunluk
      const dk = 1 + 0.06 * (n2(xx * 0.006, yy * 0.006) - 0.5);
      r *= dk; g *= dk; b *= dk;
      // alt lake
      const aa = ad[i + 3] / 255;
      if (aa > 0.004) {
        const m = sstep(0.47, 0.5, aa + (zg - 0.5) * 0.9);
        r += (ad[i] - r) * m; g += (ad[i + 1] - g) * m; b += (ad[i + 2] - b) * m;
      }
      // varak
      const ga = gd[i + 3] / 255;
      if (ga > 0.004) {
        // aynı zımpara alanı: önce kırmızı alt lake, biraz daha derinde yaldız çıkar (kırmızı hale)
        const m = ga > 0.97 ? 1 : sstep(0.56, 0.59, ga + (zg - 0.5) * 0.9);
        if (m > 0) {
          // varak kareleri (yaklaşık 26 birim), ekleri, kırışıklık
          const Ls = 62, u = (xx + 7) / Ls, v = (yy + 3) / Ls;
          const ui = Math.floor(u), vi = Math.floor(v + (ui % 2) * 0.37);
          const fu = u - ui, fv = v + (ui % 2) * 0.37 - vi;
          let t = 0.95 + 0.1 * hash(ui, vi, 3);
          const ek = Math.min(fu, 1 - fu, fv, 1 - fv) * Ls;
          if (ek < 0.8) t *= 1.06;
          t *= 0.94 + 0.12 * n4(xx * 0.25, yy * 0.06 + ui) + 0.06 * (fbm(n2, xx * 0.04, yy * 0.04) - 0.5);
          // kenara doğru (lake altında) hafif koyulaşma: cánh gián
          t *= 0.75 + 0.3 * Math.min(1, ga * 1.4);
          const vr = gd[i] * t, vg = gd[i + 1] * t, vb = gd[i + 2] * t;
          r += (vr - r) * m; g += (vg - g) * m; b += (vb - b) * m;
        }
      }
      // yumurta kabuğu
      const ea = ed[i + 3] / 255;
      if (ea > 0.01) {
        // bükülmüş koordinatta Voronoi: kırık kabuk parçaları
        const wx = x + 9 * (n5(x * 0.02, y * 0.02) - 0.5), wy = y + 9 * (n4(x * 0.02 + 5, y * 0.02) - 0.5);
        const Gs = 12;
        const ci = Math.floor(wx / Gs), cj = Math.floor(wy / Gs);
        let d1 = 1e9, d2 = 1e9, bi = 0, bj = 0, sx = 0, sy = 0;
        for (let j = cj - 1; j <= cj + 1; j++) for (let k2 = ci - 1; k2 <= ci + 1; k2++) {
          const px = (k2 + 0.08 + 0.84 * hash(k2, j, 11)) * Gs, py = (j + 0.08 + 0.84 * hash(k2, j, 12)) * Gs;
          const d = (wx - px) * (wx - px) + (wy - py) * (wy - py);
          if (d < d1) { d2 = d1; d1 = d; bi = k2; bj = j; sx = px; sy = py; } else if (d < d2) d2 = d;
        }
        const kenar = Math.sqrt(d2) - Math.sqrt(d1);
        const h1 = hash(bi, bj, 13);
        const bosluk = 1.1 + (h1 > 0.9 ? 1.6 : 0);
        const parcaM = sstep(bosluk - 0.5, bosluk + 0.5, kenar);
        let t = 0.88 + 0.2 * hash(bi, bj, 14) + 0.07 * (((wx - sx) - (wy - sy)) / Gs);
        const sar = (hash(bi, bj, 15) - 0.5) * 14;
        let er = ed[i] * t + sar, eg = ed[i + 1] * t + sar * 0.6, eb = ed[i + 2] * t - sar * 0.3;
        er = er + (catlak[0] - er) * (1 - parcaM);
        eg = eg + (catlak[1] - eg) * (1 - parcaM);
        eb = eb + (catlak[2] - eb) * (1 - parcaM);
        r += (er - r) * ea; g += (eg - g) * ea; b += (eb - b) * ea;
      }
      // sedef
      const pa = pd[i + 3] / 255;
      if (pa > 0.01) {
        const ofs = pd[i] / 255 * 6.28;
        const w1 = xx * 0.045 + 2.2 * fbm(n2, xx * 0.02 + ofs, yy * 0.02);
        const halka = Math.sin(w1 * 6.0 + ofs * 3) * 0.5 + 0.5;
        const faz = 3.6 * fbm(n5, xx * 0.012 + ofs, yy * 0.012 - ofs) + ofs + halka * 0.5;
        const tab = 214 + 26 * (halka - 0.5);
        const ir = 14 + 12 * n4(xx * 0.03 - ofs, yy * 0.03);
        let sr = tab + ir * Math.cos(faz * 6.28), sg = tab + ir * Math.cos(faz * 6.28 - 2.1), sb = tab + 6 + ir * 1.1 * Math.cos(faz * 6.28 - 4.2);
        // parlak öz ve hafif gri yansıma
        const p2 = n3(xx * 0.05 + ofs, yy * 0.05);
        const k3 = 0.84 + 0.24 * p2;
        sr *= k3; sg *= k3; sb *= k3;
        r += (sr - r) * pa; g += (sg - g) * pa; b += (sb - b) * pa;
      }
      bd[i] = r; bd[i + 1] = g; bd[i + 2] = b; bd[i + 3] = 255;
    }
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.putImageData(img, 0, 0); ctx.restore();

  // ------------------------------------------------------------ ayna parlaklığı: pencere yansıması, cila parıltısı
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  // yumuşak, geniş çapraz cila ışığı
  let g = ctx.createLinearGradient(0, 0, 1024, 1024);
  g.addColorStop(0, 'rgba(255,250,240,0.10)'); g.addColorStop(0.35, 'rgba(255,250,240,0.02)'); g.addColorStop(1, 'rgba(255,250,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  // pencere yansıması (dört bölmeli), keskin kenarlı ama yumuşak düşüşlü
  const pen = S.yeniTuval(W, H), px = pen.getContext('2d');
  px.setTransform(K, 0, 0, K, 0, 0);
  px.filter = 'blur(12px)';
  // panelin dışındaki büyük bir pencerenin yansıması: sol üst köşeden taşar, sağ alta doğru söner
  const pg = px.createLinearGradient(-40, -40, 330, 360);
  pg.addColorStop(0, 'rgba(236,242,255,0.2)'); pg.addColorStop(0.55, 'rgba(236,242,255,0.07)'); pg.addColorStop(1, 'rgba(236,242,255,0)');
  px.fillStyle = pg;
  px.beginPath();
  px.moveTo(-40, -40); px.lineTo(150, -40); px.lineTo(118, 380); px.lineTo(-40, 400); px.closePath();
  px.moveTo(166, -40); px.lineTo(300, -40); px.lineTo(268, 360); px.lineTo(134, 378); px.closePath();
  px.fill();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(pen, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  // ince, uzun bir parıltı çizgisi (panelin cilalı yüzeyinde)
  g = ctx.createLinearGradient(0, 940, 0, 1000);
  g.addColorStop(0, 'rgba(255,240,230,0)'); g.addColorStop(0.5, 'rgba(255,240,230,0.07)'); g.addColorStop(1, 'rgba(255,240,230,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 940, 1024, 60);
  ctx.restore();
  // panel kenarı: hafif koyulaşma
  ctx.save();
  g = ctx.createRadialGradient(512, 480, 420, 512, 512, 760);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  ctx.restore();

  S.hazir();
})();
