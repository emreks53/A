<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-077 Lake Resim — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #E8C27A; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-077 Lake Resim — ışıklı altın varak ve kehribar lake zeminli, ayna gibi parlak pano; zımparalanıp
// cilalanarak ortaya çıkarılmış alt katmanlar (yaldız, yeşim, kırmızı); açık yerlerde yumurta kabuğu kakması,
// altın ve gümüş varak, sedef parçaları, kırmızı lake vurgular (Vietnam sơn mài / Japon urushi havası).
// Yöntem: boya katmanı (lake rengi) + malzeme katmanları (varak, yumurta kabuğu, sedef, alt lake).
// Varak ve alt lake biçimleri izleyen yumuşak, denetimli geçişlerle (yalnızca geçişte ince zımpara tanesi)
// ortaya çıkar; kubbe dilim dilim gölgelenir; yumurta kabuğu bükülmüş
// Voronoi ile kırık parçalara ayrılır; sedef ince film girişimi renkleriyle boyanır; parlaklık en üstte.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024 * K, H = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  const rnd = S.rng(7777);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(101), n2 = gurultu(202), n3 = gurultu(303), n4 = gurultu(404), n5 = gurultu(505);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.27 * n(x * 2.07, y * 2.07) + 0.15 * n(x * 4.3, y * 4.3) + 0.08 * n(x * 8.9, y * 8.9);
  const hash = (i, j, k) => { let h = (i * 374761393 + j * 668265263 + k * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  // ------------------------------------------------------------ katmanlar
  function katman() { const c = S.yeniTuval(W, H); const x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(K, 0, 0, K, 0, 0); x.lineJoin = 'round'; x.lineCap = 'round'; return [c, x]; }
  const [cB, B] = katman(); // lake rengi (en üst lake tabakası)
  const [cA, A] = katman(); // alt lake (zımparayla ortaya çıkan ikinci renk): rgb renk, alfa miktar
  const [cG, G] = katman(); // varak (altın / gümüş / lake altındaki yaldız): rgb ton, alfa miktar
  const [cE, E] = katman(); // yumurta kabuğu: rgb ton, alfa kaplama
  const [cP, P] = katman(); // sedef: r = parça faz kayması, alfa kaplama
  const hepsi = [B, A, G, E, P];
  const lin = (x1, y1, x2, y2, d) => { const g = B.createLinearGradient(x1, y1, x2, y2); d.forEach(([t, c]) => g.addColorStop(t, c)); return g; };
  const rad = (x, y, r0, r1, d) => { const g = B.createRadialGradient(x, y, r0, x, y, r1); d.forEach(([t, c]) => g.addColorStop(t, c)); return g; };

  // Opak bir parça: kendi katmanına çizilir, alttaki diğer malzemeleri siler.
  // m: 'lake' (renk B'ye), 'varak', 'kabuk', 'sedef'; renk: o malzemenin rengi/tonu
  function parca(yol, m, renk, o) {
    o = o || {};
    const p = P2(yol);
    const hedef = { lake: B, varak: G, kabuk: E, sedef: P }[m];
    for (const x of [A, G, E, P]) {
      if (x === hedef) continue;
      x.globalCompositeOperation = 'destination-out';
      if (o.cizgi) { x.lineWidth = o.cizgi; x.strokeStyle = '#000'; x.stroke(p); } else { x.fillStyle = '#000'; x.fill(p); }
      x.globalCompositeOperation = 'source-over';
    }
    if (m !== 'lake') { // altında lake zemini (kabuk aralarında görünür)
      B.fillStyle = o.zemin || '#B07A36';
      if (o.cizgi) { B.lineWidth = o.cizgi; B.strokeStyle = B.fillStyle; B.stroke(p); } else B.fill(p);
    }
    if (o.cizgi) { hedef.lineWidth = o.cizgi; hedef.strokeStyle = renk; hedef.stroke(p); } else { hedef.fillStyle = renk; hedef.fill(p); }
  }
  // Saydam katman ekle (silmeden): alt lake ya da lake altı varak
  function ekle(x, yol, renk, kirp) {
    x.save();
    if (kirp) x.clip(P2(kirp));
    x.fillStyle = renk; x.fill(P2(yol));
    x.restore();
  }

  // ------------------------------------------------------------ gök: kehribar lake altında ışıklı altın varak
  // Üstte ince kehribar lake (cánh gián) altından sıcak altın; güneşe ve ufka doğru lake cilayla incelir,
  // varak çıplak ve açık şampanya altını olarak parlar.
  B.fillStyle = lin(0, 0, 0, 800, [[0, '#C98C40'], [0.55, '#D9A452'], [1, '#E6BC6C']]);
  B.fillRect(0, 0, 1024, 1024);
  G.fillStyle = lin(0, 0, 0, 800, [[0, 'rgba(234,192,104,0.62)'], [0.5, 'rgba(238,200,112,0.74)'], [1, 'rgba(244,214,138,0.9)']]);
  G.fillRect(0, 0, 1024, 800);
  G.fillStyle = rad(880, 140, 40, 360, [[0, 'rgba(252,236,178,0.95)'], [0.35, 'rgba(248,224,152,0.7)'], [0.7, 'rgba(242,210,130,0.25)'], [1, 'rgba(240,206,124,0)']]);
  G.fillRect(480, 0, 544, 560);
  // ufukta çok hafif cinnabar alt lake: sıcak, gül altını bir bant
  A.fillStyle = lin(0, 560, 0, 800, [[0, 'rgba(214,120,70,0)'], [1, 'rgba(214,120,70,0.22)']]);
  A.fillRect(0, 560, 1024, 240);

  // güneş: altın varak disk, gümüş halka
  parca(S.daireYolu(880, 140, 62), 'lake', '#D24A2C');
  ekle(G, S.daireYolu(880, 140, 62), rad(880, 140, 0, 62, [[0, 'rgba(255,232,150,1)'], [0.42, 'rgba(252,216,124,0.92)'], [0.78, 'rgba(240,170,92,0.3)'], [1, 'rgba(232,150,80,0)']]), S.daireYolu(880, 140, 62));
  parca(S.daireYolu(880, 140, 62), 'varak', 'rgba(232,184,84,1)', { cizgi: 1.6 });
  parca(S.daireYolu(880, 140, 72), 'varak', 'rgba(232,236,240,1)', { cizgi: 2.6 });
  parca(S.daireYolu(880, 140, 83), 'varak', 'rgba(226,230,236,1)', { cizgi: 1.4 });

  // bulutlar: gümüş varak, alt kenarları zımparayla eriyen; içlerinde altın kıvrım çizgisi
  function bulutYolu(cx, cy, w, h, n) {
    const x0 = cx - w / 2;
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + w * t, cy - h * Math.pow(Math.sin(Math.PI * t), 0.7)]); }
    const p = new Path2D();
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
      let nx = dy / L, ny = -dx / L;
      if (ny > 0) { nx = -nx; ny = -ny; }
      const b = L * 0.6;
      p.bezierCurveTo(ax + nx * b, ay + ny * b, bx + nx * b, by + ny * b, bx, by);
    }
    p.bezierCurveTo(cx + w * 0.25, cy + h * 0.35, cx - w * 0.25, cy + h * 0.35, pts[0][0], pts[0][1]);
    p.closePath();
    return p;
  }
  const bulutlar = [[170, 262, 230, 52, 5], [480, 150, 180, 42, 4], [758, 352, 160, 36, 4], [100, 470, 130, 30, 3], [950, 468, 120, 28, 3]];
  const bulutYollari = [];
  for (const [bx, by, bw, bh, bn] of bulutlar) {
    const p = bulutYolu(bx, by, bw, bh, bn);
    bulutYollari.push(p);
    G.save(); G.globalCompositeOperation = 'destination-out'; G.fillStyle = '#000'; G.fill(p); G.restore();
    // parlak gümüş varak; alt kenarda hafif inci tonu
    G.fillStyle = lin(0, by - bh * 1.15, 0, by + bh * 0.36, [[0, 'rgba(240,242,244,1)'], [0.5, 'rgba(228,231,235,1)'], [0.8, 'rgba(218,220,226,1)'], [1, 'rgba(226,214,196,1)']]);
    G.fill(p);
    // maki-e altın çizgi: üst kontur ve içe doğru yinelenen ikinci kontur
    G.save();
    G.beginPath(); G.rect(bx - bw, by - bh * 2, bw * 2, bh * 1.8); G.clip();
    G.lineWidth = 1.8; G.strokeStyle = 'rgba(214,160,64,1)'; G.stroke(p);
    G.clip(p);
    G.translate(bx, by + bh * 0.06); G.scale(0.8, 0.66); G.translate(-bx, -by);
    G.lineWidth = 1.2 / 0.72; G.strokeStyle = 'rgba(228,182,80,1)'; G.stroke(p);
    G.restore();
  }

  // nashiji: güneş çevresinde ve ufukta yoğunlaşan ince altın pullar; birkaç kesik varak karesi (kirikane)
  {
    const r = S.rng(99);
    const pul = (x, y, rr, renk) => {
      const n = 4 + Math.floor(r() * 3), p = new Path2D(), a0 = r() * 6.28;
      for (let k = 0; k < n; k++) { const aa = a0 + (k / n) * Math.PI * 2 + (r() - 0.5) * 0.7; const q = rr * (0.55 + r() * 0.6); k ? p.lineTo(x + Math.cos(aa) * q, y + Math.sin(aa) * q * 0.75) : p.moveTo(x + Math.cos(aa) * q, y + Math.sin(aa) * q * 0.75); }
      p.closePath(); G.fillStyle = renk; G.fill(p);
    };
    for (let i = 0; i < 2600; i++) {
      const x = r() * 1024, y = r() * 800;
      const ds = Math.hypot((x - 880) * 0.85, y - 140);
      const yog = Math.max(0.9 * Math.exp(-Math.pow(Math.max(0, ds - 70) / 120, 2)), 0.75 * sstep(560, 790, y));
      if (r() > yog || ds < 90 || S.kubbedeMi(x, y) || bulutYollari.some((q) => G.isPointInPath(q, x * K, y * K))) continue;
      const t = r();
      pul(x, y, 0.5 + r() * r() * 1.6, t < 0.45 ? `rgba(${246 + 8 * r() | 0},${226 + 20 * r() | 0},${150 + 30 * r() | 0},1)` : 'rgba(232,236,240,1)');
    }
    // kirikane: güneşin iki yanında seyrek kesik altın kareler
    for (let i = 0; i < 38; i++) {
      const a = -Math.PI * 0.95 + r() * Math.PI * 1.25, d = 112 + r() * 120;
      const x = 880 + Math.cos(a) * d, y = 140 + Math.sin(a) * d * 0.9;
      if (y < 4 || y > 520 || x > 1020) continue;
      const s2 = 1.6 + r() * 2.2, q = r() * 1.57;
      const p = new Path2D();
      for (let k = 0; k < 4; k++) { const aa = q + k * Math.PI / 2; k ? p.lineTo(x + Math.cos(aa) * s2, y + Math.sin(aa) * s2) : p.moveTo(x + Math.cos(aa) * s2, y + Math.sin(aa) * s2); }
      p.closePath(); G.fillStyle = r() < 0.4 ? 'rgba(252,232,160,1)' : 'rgba(232,236,240,1)'; G.fill(p);
    }
  }

  // ------------------------------------------------------------ zemin: kehribar-altın lake, altta cinnabar sıcaklığı
  B.fillStyle = lin(0, 800, 0, 1024, [[0, '#D9A050'], [1, '#C98244']]);
  B.fillRect(0, 800, 1024, 224);
  for (const x of [A, G, E, P]) { x.save(); x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fillRect(0, 800, 1024, 224); x.restore(); }
  A.fillStyle = lin(0, 800, 0, 1024, [[0, 'rgba(204,92,52,0.08)'], [1, 'rgba(204,92,52,0.4)']]);
  A.fillRect(0, 800, 1024, 224);
  G.fillStyle = lin(0, 800, 0, 1024, [[0, 'rgba(244,210,128,0.82)'], [0.5, 'rgba(236,196,108,0.55)'], [1, 'rgba(230,186,100,0.3)']]); G.fillRect(0, 800, 1024, 224);
  // ufuk çizgisi: ince kırmızı lake
  parca('M0,800 L1024,800', 'lake', '#C23A22', { cizgi: 3 });

  // ------------------------------------------------------------ minare: yumurta kabuğu, altın şerefeler
  const mc = 300;
  const kabukTon = (x1, x2) => lin(x1, 0, x2, 0, [[0, 'rgba(214,190,156,1)'], [0.35, 'rgba(236,224,202,1)'], [0.7, 'rgba(250,245,232,1)'], [1, 'rgba(253,251,243,1)']]);
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs);
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') parca(S.yol(p.noktalar, true), 'varak', 'rgba(228,182,76,1)');
      else if (p.ad.startsWith('çıkma')) parca(S.yol(p.noktalar, true), 'lake', lin(x1, 0, x2, 0, [[0, '#A8301C'], [1, '#D8502E']]));
      else parca(S.yol(p.noktalar, true), 'kabuk', kabukTon(x1, x2));
    } else if (p.tip === 'korkuluk') {
      parca(dik(p.x1, p.y1, p.x2, p.y2), 'lake', '#C0402A');
      const adet = 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 3 + ((p.x2 - p.x1 - 6) * (i + 0.5)) / adet;
        parca(dik(x - 2.6, p.y1 + 3, x + 2.6, p.y2 - 1), 'kabuk', i < 3 ? 'rgba(226,210,184,1)' : 'rgba(250,245,232,1)');
      }
      parca(`M${p.x1},${p.y1 + 1.5} L${p.x2},${p.y1 + 1.5}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2.2 });
    } else if (p.tip === 'bant') {
      parca(dik(p.x1, p.y1, p.x2, p.y2), 'kabuk', kabukTon(p.x1, p.x2));
      for (const z of S.zikzakCizgileri()) parca(S.yol(z), 'lake', '#CC4428', { cizgi: 4.2 });
    } else if (p.tip === 'topuz') {
      parca(p.yol, 'kabuk', kabukTon(mc - 24, mc + 24));
    }
  }
  for (const p of S.minarePencereleri) {
    parca(S.kemerYolu(p.x, p.y, p.w + 5, p.h + 3), 'lake', '#C83E24');
    parca(S.kemerYolu(p.x, p.y + 2.5, p.w, p.h), 'lake', '#4A1E10');
  }
  function alem(a) {
    // altın zeminde seçilsin diye her parça önce kırmızı lakeyle çevrelenir, üstüne parlak altın varak konur
    const al = 'rgba(250,218,120,1)';
    const ys = [dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)), S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
    for (const y of ys) parca(y, 'lake', '#B8381F', { cizgi: 3.4 });
    for (const y of ys) parca(y, 'varak', al);
  }
  alem(S.alemParcalari(mc, 146, 0.62));

  // ------------------------------------------------------------ kaide: yumurta kabuğu
  const KA = S.kaide;
  parca(dik(KA.x1, KA.y1, KA.x2, KA.y2), 'kabuk', lin(KA.x1, 0, KA.x2, 0, [[0, 'rgba(214,192,160,1)'], [0.22, 'rgba(238,226,204,1)'], [0.6, 'rgba(250,245,232,1)'], [1, 'rgba(253,251,243,1)']]));
  parca(dik(KA.kornis.x1, KA.kornis.y1, KA.kornis.x2, KA.kornis.y2), 'lake', lin(KA.kornis.x1, 0, KA.kornis.x2, 0, [[0, '#B0341E'], [1, '#D8502E']]));
  parca(`M${KA.kornis.x1},${KA.kornis.y2} L${KA.kornis.x2},${KA.kornis.y2}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2 });
  parca(`M${KA.x1},${KA.y2 - 3} L${KA.x2},${KA.y2 - 3}`, 'lake', '#C23A22', { cizgi: 5 });
  for (const p of KA.pencereler) {
    parca(S.kemerYolu(p.x, p.y - 4, p.w + 12, p.h + 6), 'varak', 'rgba(226,180,74,1)');
    parca(S.kemerYolu(p.x, p.y - 1, p.w + 6, p.h + 2), 'lake', '#C83E24');
    parca(S.kemerYolu(p.x, p.y + 2, p.w, p.h - 1), 'lake', '#4A1E10');
  }

  // ------------------------------------------------------------ kasnak: yeşil lake, kenarlarda kırmızı alt lake
  const KS = S.kasnak;
  for (const k of [1, 0]) {
    const q = KS[k];
    const yol = dik(q.x1, q.y1, q.x2, q.y2);
    parca(yol, 'lake', lin(q.x1, 0, q.x2, 0, k ? [[0, '#23703F'], [0.5, '#2F8550'], [0.85, '#3E9C60'], [1, '#2F8450']] : [[0, '#2A7C48'], [0.5, '#37935A'], [0.85, '#4AAD6C'], [1, '#389258']]));
    ekle(A, yol, lin(q.x1, 0, q.x2, 0, [[0, 'rgba(200,66,38,0.28)'], [0.05, 'rgba(200,66,38,0)'], [0.95, 'rgba(200,66,38,0)'], [1, 'rgba(200,66,38,0.22)']]));
    ekle(G, yol, lin(q.x1, 0, q.x2, 0, [[0, 'rgba(206,196,96,0)'], [0.55, 'rgba(206,196,96,0.12)'], [0.82, 'rgba(222,204,104,0.55)'], [1, 'rgba(206,196,96,0.15)']]));
    for (const p of S.kasnakPencereleri(k)) {
      parca(S.kemerYolu(p.x, p.y - 2, p.w + 4, p.h + 3), 'varak', 'rgba(222,178,72,1)');
      parca(S.kemerYolu(p.x, p.y, p.w, p.h), 'lake', '#1E4A2C');
    }
    parca(`M${q.x1},${q.y1 + 1} L${q.x2},${q.y1 + 1}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 2.2 });
    parca(`M${q.x1},${q.y2 - 1} L${q.x2},${q.y2 - 1}`, 'varak', 'rgba(228,182,76,1)', { cizgi: 1.6 });
  }

  // ------------------------------------------------------------ kubbe: yeşil lake, sağ üstte yeşilin altından yaldız
  parca(S.kubbeYolu, 'lake', '#2E8A50');
  {
    // Her dilim (kaburga arası) kendi ışığını alır; ışıklı yanda yeşil lake zımparayla incelir ve altındaki
    // altın varak önce yeşim yeşili, sonra altın-yeşil, en parlak yerde altın olarak yumuşakça görünür.
    const pr = S.kubbeProfili(500);
    const rAt = (y) => {
      for (let i = 0; i < pr.length - 1; i++) if (y <= pr[i].y && y >= pr[i + 1].y) { const t = (pr[i].y - y) / (pr[i].y - pr[i + 1].y || 1); return pr[i].r + (pr[i + 1].r - pr[i].r) * t; }
      return 0;
    };
    const x0 = 356 * K, y0 = 298 * K, w = 408 * K, h = 258 * K;
    const cb = S.yeniTuval(w, h), ca = S.yeniTuval(w, h), cg = S.yeniTuval(w, h);
    const ib = new ImageData(w, h), ia = new ImageData(w, h), ig = new ImageData(w, h);
    const db = ib.data, da = ia.data, dg = ig.data;
    const Lx = 0.6, Ly = 0.64, Lz = 0.48, Ln = Math.hypot(Lx, Ly, Lz);
    for (let py = 0; py < h; py++) {
      const yy = (y0 + py + 0.5) / K;
      const R = rAt(yy); if (R <= 0) continue;
      const th = clamp((555 - yy) / 255, 0, 1) * 1.2, ct = Math.cos(th), st = Math.sin(th);
      for (let px = 0; px < w; px++) {
        const xx = (x0 + px + 0.5) / K;
        const u = (xx - 560) / R; if (u < -1 || u > 1) continue;
        const ph = Math.asin(u);
        const gs = (ph + Math.PI / 2) / (Math.PI / 16), sl = gs - Math.floor(gs);
        const pe = ph + (sl - 0.5) * 0.46; // dilimin şişkinliği
        const d = (Math.sin(pe) * ct * Lx + st * Ly + Math.cos(pe) * ct * Lz) / Ln;
        const o = (py * w + px) * 4;
        const k = clamp(d * 0.55 + 0.45, 0, 1), kk = k * k;
        db[o] = 30 + 40 * kk; db[o + 1] = 110 + 66 * kk; db[o + 2] = 62 + 38 * kk; db[o + 3] = 255;
        const ja = sstep(0.3, 0.78, d) * 0.72;
        da[o] = 112; da[o + 1] = 196; da[o + 2] = 128; da[o + 3] = ja * 255;
        const ga = sstep(0.72, 1.0, d) * 0.88, gm = sstep(0.2, 1, ga);
        dg[o] = 150 + 100 * gm; dg[o + 1] = 190 + 34 * gm; dg[o + 2] = 90 + 50 * gm; dg[o + 3] = ga * 0.93 * 255;
      }
    }
    for (const [c, d, x] of [[cb, ib, B], [ca, ia, A], [cg, ig, G]]) {
      c.getContext('2d').putImageData(d, 0, 0);
      x.save(); x.clip(P2(S.kubbeYolu)); x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(c, x0, y0); x.restore();
    }
  }
  {
    G.save(); G.clip(P2(S.kubbeYolu));
    for (const k of S.kaburgalar(16)) { G.lineWidth = 1.5; G.strokeStyle = 'rgba(226,182,78,1)'; G.stroke(P2(S.yol(k.noktalar))); }
    G.restore();
    parca(S.kubbeYolu, 'lake', '#B8381F', { cizgi: 3.2 });
    G.save(); G.clip(P2(S.kubbeYolu)); G.lineWidth = 2.4; G.strokeStyle = 'rgba(230,186,82,1)'; G.stroke(P2(S.kubbeYolu)); G.restore();
  }
  alem(S.alemParcalari(560, 300, 1));

  // ------------------------------------------------------------ bitkiler
  const bit = S.bitki;
  for (const s of bit.saplar) parca(S.yol(s), 'lake', '#3A8A4C', { cizgi: 3.6 });
  for (const y of bit.yapraklar) {
    const yol = S.yaprakYolu(y);
    parca(yol, 'lake', y.uzunluk > 50 ? '#2C7A44' : '#38894E');
    // ışığa dönük yarıda lake altından yaldız: altın-yeşil
    const [a, b] = S.yaprakDamari(y);
    const g = G.createLinearGradient(a[0] - Math.sin(y.aci) * 20, a[1] + Math.cos(y.aci) * 20, a[0] + Math.sin(y.aci) * 20, a[1] - Math.cos(y.aci) * 20);
    const yon = Math.sin(y.aci) * 1 + Math.cos(y.aci) * 1 > 0 ? 1 : -1; // sağ üste bakan taraf
    g.addColorStop(0, `rgba(214,200,92,${yon > 0 ? 0.04 : 0.7})`);
    g.addColorStop(0.5, 'rgba(196,192,84,0.22)');
    g.addColorStop(1, `rgba(214,200,92,${yon > 0 ? 0.7 : 0.04})`);
    ekle(G, yol, g, yol);
    const g2 = A.createLinearGradient(a[0] - Math.sin(y.aci) * 20, a[1] + Math.cos(y.aci) * 20, a[0] + Math.sin(y.aci) * 20, a[1] - Math.cos(y.aci) * 20);
    g2.addColorStop(0, `rgba(96,176,104,${yon > 0 ? 0.1 : 0.8})`);
    g2.addColorStop(1, `rgba(96,176,104,${yon > 0 ? 0.8 : 0.1})`);
    ekle(A, yol, g2, yol);
    parca(`M${a[0]},${a[1]} L${b[0]},${b[1]}`, 'varak', 'rgba(228,184,80,1)', { cizgi: 1.3 });
  }
  for (const t of bit.tomurcuklar) {
    parca(S.tomurcukYolu(t), 'lake', '#D2472C');
    parca(S.tomurcukYolu(t), 'varak', 'rgba(226,180,74,1)', { cizgi: 1.1 });
  }
  function cicek(c, sedef) {
    const tl = S.tacYapraklari(c);
    tl.forEach((e, i) => {
      const yol = S.elipsYolu(e);
      if (sedef) {
        parca(yol, 'sedef', `rgb(${Math.floor(hash(i, Math.round(c.x), 7) * 255)},0,0)`);
        parca(yol, 'varak', 'rgba(214,166,72,1)', { cizgi: 1.2 });
      } else {
        parca(yol, 'kabuk', rad(c.x, c.y, c.r * 0.15, c.r * 1.05, [[0, 'rgba(232,170,156,1)'], [0.42, 'rgba(244,224,210,1)'], [0.7, 'rgba(251,246,236,1)'], [1, 'rgba(254,252,246,1)']]));
        // taç yaprak dibinde kabuğun üstünden ince kırmızı lake
        ekle(A, yol, rad(c.x, c.y, c.r * 0.12, c.r * 0.6, [[0, 'rgba(206,70,44,0.7)'], [1, 'rgba(206,70,44,0)']]), yol);
      }
    });
    parca(S.daireYolu(c.x, c.y, c.r * 0.24), 'varak', 'rgba(234,188,80,1)');
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + c.aci; parca(S.daireYolu(c.x + Math.cos(a) * c.r * 0.15, c.y + Math.sin(a) * c.r * 0.15, Math.max(1, c.r * 0.03)), 'lake', '#8A2A16'); }
  }
  bit.cicekler.forEach((c, i) => cicek(c, i < 4 || c.r < 40));

  // ------------------------------------------------------------ piksel geçişi: zımpara, varak, kabuk, sedef
  const img = B.getImageData(0, 0, W, H), bd = img.data;
  const ad = A.getImageData(0, 0, W, H).data;
  const gd = G.getImageData(0, 0, W, H).data;
  const ed = E.getImageData(0, 0, W, H).data;
  const pd = P.getImageData(0, 0, W, H).data;
  const catlak = hex('#C9A066');

  for (let y = 0; y < H; y++) {
    const yy = y / K;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const xx = x / K;
      let r = bd[i], g = bd[i + 1], b = bd[i + 2];
      // ince zımpara tanesi: yalnızca geçiş bölgelerinde (alfa 0 ile 1 arasında) hissedilir
      const zg = n5(xx * 0.32, yy * 0.32) - 0.5 + 0.3 * (n4(xx * 0.7, yy * 0.7) - 0.5);
      // lakenin derinliği: çok hafif dalgalı yoğunluk
      const dk = 1 + 0.06 * (n2(xx * 0.006, yy * 0.006) - 0.5);
      r *= dk; g *= dk; b *= dk;
      // alt lake
      const aa = ad[i + 3] / 255;
      if (aa > 0.004) {
        const m = clamp(aa + zg * 0.3 * aa * (1 - aa), 0, 1);
        r += (ad[i] - r) * m; g += (ad[i + 1] - g) * m; b += (ad[i + 2] - b) * m;
      }
      // varak
      const ga = gd[i + 3] / 255;
      if (ga > 0.004) {
        const m = ga > 0.97 ? 1 : clamp(ga + zg * 0.4 * ga * (1 - ga), 0, 1);
        if (m > 0) {
          // varak kareleri (yaklaşık 30 birim, sıraları kaydırılmış): bindirme payı ve ince gölge
          const Ls = 30, v = (yy + 11) / Ls, vi = Math.floor(v);
          const u = (xx + 5) / Ls + (vi & 1) * 0.5, ui = Math.floor(u);
          const fu = u - ui, fv = v - vi;
          const gk = ga > 0.97 ? 1 : 0.4 * ga * ga; // ekler ve ton farkları çıplak varakta belirgin, lake altında silik
          // her varak karesi ışığı biraz farklı açıyla yansıtır; panel boyunca geniş, yumuşak bir cila parıltısı
          let t = 1 + gk * (0.18 * hash(ui, vi, 3) - 0.09) + gk * 0.08 * Math.sin((xx + yy) * 0.012 + hash(ui, vi, 4) * 2);
          const ek = Math.min(fu * Ls, fv * Ls);
          const ek2 = Math.min((1 - fu) * Ls, (1 - fv) * Ls);
          if (ek < 0.7) t *= 1 + 0.08 * gk; else if (ek < 1.3) t *= 1 - 0.14 * gk;
          if (ek2 < 0.45) t *= 1 - 0.1 * gk;
          t *= 1 + (0.1 * n4(xx * 0.16 + ui * 3.1, yy * 0.16 + vi * 1.7) - 0.05) * (0.45 + 0.55 * gk);
          // kehribar lake altında (alfa düşükken) sıcaklaşma: cánh gián
          t *= 0.72 + 0.28 * Math.min(1, ga * 1.25);
          const vr = gd[i] * t, vg = gd[i + 1] * t, vb = gd[i + 2] * t;
          r += (vr - r) * m; g += (vg - g) * m; b += (vb - b) * m;
        }
      }
      // yumurta kabuğu
      const ea = ed[i + 3] / 255;
      if (ea > 0.01) {
        // bükülmüş koordinatta Voronoi: kırık kabuk parçaları
        const wx = x + 9 * (n5(x * 0.02, y * 0.02) - 0.5), wy = y + 9 * (n4(x * 0.02 + 5, y * 0.02) - 0.5);
        const Gs = 12;
        const ci = Math.floor(wx / Gs), cj = Math.floor(wy / Gs);
        let d1 = 1e9, d2 = 1e9, bi = 0, bj = 0, sx = 0, sy = 0;
        for (let j = cj - 1; j <= cj + 1; j++) for (let k2 = ci - 1; k2 <= ci + 1; k2++) {
          const px = (k2 + 0.08 + 0.84 * hash(k2, j, 11)) * Gs, py = (j + 0.08 + 0.84 * hash(k2, j, 12)) * Gs;
          const d = (wx - px) * (wx - px) + (wy - py) * (wy - py);
          if (d < d1) { d2 = d1; d1 = d; bi = k2; bj = j; sx = px; sy = py; } else if (d < d2) d2 = d;
        }
        const kenar = Math.sqrt(d2) - Math.sqrt(d1);
        const h1 = hash(bi, bj, 13);
        const bosluk = 0.75;
        const parcaM = sstep(bosluk - 0.5, bosluk + 0.5, kenar);
        let t = 0.88 + 0.2 * hash(bi, bj, 14) + 0.07 * (((wx - sx) - (wy - sy)) / Gs);
        const sar = (hash(bi, bj, 15) - 0.5) * 14;
        let er = ed[i] * t + sar, eg = ed[i + 1] * t + sar * 0.6, eb = ed[i + 2] * t - sar * 0.3;
        er = er + (catlak[0] - er) * (1 - parcaM);
        eg = eg + (catlak[1] - eg) * (1 - parcaM);
        eb = eb + (catlak[2] - eb) * (1 - parcaM);
        r += (er - r) * ea; g += (eg - g) * ea; b += (eb - b) * ea;
      }
      // sedef
      const pa = pd[i + 3] / 255;
      if (pa > 0.01) {
        const ofs = pd[i] / 255 * 6.28;
        const w1 = xx * 0.045 + 2.2 * fbm(n2, xx * 0.02 + ofs, yy * 0.02);
        const halka = Math.sin(w1 * 6.0 + ofs * 3) * 0.5 + 0.5;
        const faz = 3.6 * fbm(n5, xx * 0.012 + ofs, yy * 0.012 - ofs) + ofs + halka * 0.5;
        const tab = 214 + 26 * (halka - 0.5);
        const ir = 14 + 12 * n4(xx * 0.03 - ofs, yy * 0.03);
        let sr = tab + ir * Math.cos(faz * 6.28), sg = tab + ir * Math.cos(faz * 6.28 - 2.1), sb = tab + 6 + ir * 1.1 * Math.cos(faz * 6.28 - 4.2);
        // parlak öz ve hafif gri yansıma
        const p2 = n3(xx * 0.05 + ofs, yy * 0.05);
        const k3 = 0.84 + 0.24 * p2;
        sr *= k3; sg *= k3; sb *= k3;
        r += (sr - r) * pa; g += (sg - g) * pa; b += (sb - b) * pa;
      }
      bd[i] = r; bd[i + 1] = g; bd[i + 2] = b; bd[i + 3] = 255;
    }
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.putImageData(img, 0, 0); ctx.restore();

  // ------------------------------------------------------------ ayna parlaklığı: pencere yansıması, cila parıltısı
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  // yumuşak, geniş çapraz cila ışığı
  let g = ctx.createLinearGradient(0, 0, 1024, 1024);
  g.addColorStop(0, 'rgba(255,250,240,0.05)'); g.addColorStop(0.35, 'rgba(255,250,240,0.01)'); g.addColorStop(1, 'rgba(255,250,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  // pencere yansıması (dört bölmeli), keskin kenarlı ama yumuşak düşüşlü
  const pen = S.yeniTuval(W, H), px = pen.getContext('2d');
  px.setTransform(K, 0, 0, K, 0, 0);
  px.filter = 'blur(3px)';
  // panelin dışındaki büyük bir pencerenin yansıması: sol üst köşeden taşar, sağ alta doğru söner
  const pg = px.createLinearGradient(-40, -40, 330, 360);
  pg.addColorStop(0, 'rgba(255,252,244,0.22)'); pg.addColorStop(0.5, 'rgba(255,252,244,0.08)'); pg.addColorStop(1, 'rgba(236,242,255,0)');
  px.fillStyle = pg;
  px.beginPath();
  px.moveTo(-40, -40); px.lineTo(132, -40); px.lineTo(104, 330); px.lineTo(-40, 346); px.closePath();
  px.moveTo(146, -40); px.lineTo(262, -40); px.lineTo(236, 314); px.lineTo(118, 328); px.closePath();
  px.fill();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(pen, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  // ince, uzun bir parıltı çizgisi (panelin cilalı yüzeyinde)
  g = ctx.createLinearGradient(0, 940, 0, 1000);
  g.addColorStop(0, 'rgba(255,240,230,0)'); g.addColorStop(0.5, 'rgba(255,240,230,0.07)'); g.addColorStop(1, 'rgba(255,240,230,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 940, 1024, 60);
  ctx.restore();
  S.hazir();
})();
</script>
