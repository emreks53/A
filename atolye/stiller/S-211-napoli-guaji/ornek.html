<script>
// ================================================================ ressamın aletleri (ortak el yardımcıları)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: renk, gürültü, yol örnekleme, elle çekilmiş çizgi,
// tek fırça darbesi (başlangıç, basınç, kuru uç, kıllar), alanı darbelerle doldurma, maskeler ve ışık.
// Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const W = 1024;
const OL = 2; // çalışma çözünürlüğü 2048; koordinatlar 1024
const PI = Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const yumusak = (a, b, v) => {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
function hex(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function karis(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function rgba(c, a) {
  return `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a == null ? 1 : a})`;
}
/** Renk rampası: [[t, '#hex'], ...] → fn(t) → [r,g,b] */
function rampa(duraklar) {
  const D = duraklar.map(([t, c]) => [t, typeof c === 'string' ? hex(c) : c]);
  return (t) => {
    if (t <= D[0][0]) return D[0][1].slice();
    for (let i = 1; i < D.length; i++) {
      if (t <= D[i][0]) return karis(D[i - 1][1], D[i][1], (t - D[i - 1][0]) / (D[i][0] - D[i - 1][0]));
    }
    return D[D.length - 1][1].slice();
  };
}
/** Boya karışımındaki küçük oynama: a ton (açık/koyu), k renk sapması */
function oyna(c, r, a, k) {
  const j = (r() - 0.5) * 2 * a;
  k = k || 0;
  return [c[0] + j + (r() - 0.5) * k, c[1] + j + (r() - 0.5) * k, c[2] + j + (r() - 0.5) * k];
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}
/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}
function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1), sivri / basSivri / sonSivri (uçlarda incelme, px)
 */
function serit(c, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = NZ.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = NZ.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = NZ.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = NZ.n(t * fr + ofs, ofs * 0.37);
      q2 = NZ.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = NZ.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((PI / 2) * (L - t)) / a2);
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  c.beginPath();
  if (o.kapali) {
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) c.lineTo(sol[i][0], sol[i][1]);
    c.closePath();
    c.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
  } else {
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) c.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
  }
  if (o.renk) c.fillStyle = o.renk;
  c.fill('nonzero');
}
/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(c, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(c, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(c, pts, o) {
  serit(c, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu ve kırpma için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    if (p.kapali) {
      let alan = 0;
      for (let i = 0; i < p.pts.length; i++) {
        const a = p.pts[i];
        const b = p.pts[(i + 1) % p.pts.length];
        alan += a[0] * b[1] - b[0] * a[1];
      }
      if (alan < 0) p.pts.reverse();
    }
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}
function yolBirlestir(dler) {
  const p = new Path2D();
  for (const d of dler) p.addPath(typeof d === 'string' ? new Path2D(d) : d);
  return p;
}

// ---------------------------------------------------------------- maskeler (1024 ızgarada)
function maskeYap(ciz) {
  const c = S.yeniTuval(W, W);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, W, W).data;
  const m = new Uint8Array(W * W);
  for (let i = 0; i < W * W; i++) m[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return m;
}
function yolMaskesi(yol) {
  return maskeYap((x) => x.fill(typeof yol === 'string' ? new Path2D(yol) : yol));
}
function mIc(m, x, y) {
  x = Math.round(x);
  y = Math.round(y);
  return x >= 0 && y >= 0 && x < W && y < W && m[y * W + x] === 1;
}
/** Kare yapılı genişletme (r px). */
function genislet(m, r) {
  const T = new Uint8Array(W * W);
  const O = new Uint8Array(W * W);
  for (let y = 0; y < W; y++) {
    let son = -1e9;
    const o = y * W;
    for (let x = 0; x < W; x++) {
      if (m[o + x]) son = x;
      if (x - son <= r) T[o + x] = 1;
    }
    son = 1e9;
    for (let x = W - 1; x >= 0; x--) {
      if (m[o + x]) son = x;
      if (son - x <= r) T[o + x] = 1;
    }
  }
  for (let x = 0; x < W; x++) {
    let son = -1e9;
    for (let y = 0; y < W; y++) {
      if (T[y * W + x]) son = y;
      if (y - son <= r) O[y * W + x] = 1;
    }
    son = 1e9;
    for (let y = W - 1; y >= 0; y--) {
      if (T[y * W + x]) son = y;
      if (son - y <= r) O[y * W + x] = 1;
    }
  }
  return O;
}
/** Maske kenarına uzaklık (kaba, iki geçişli şehir bloğu): içeride pozitif px. */
function kenarUzak(m, enFazla) {
  const D = new Float32Array(W * W);
  const big = enFazla || 60;
  for (let i = 0; i < W * W; i++) D[i] = m[i] ? big : 0;
  for (let y = 1; y < W; y++)
    for (let x = 1; x < W; x++) {
      const i = y * W + x;
      if (D[i] > 0) D[i] = Math.min(D[i], D[i - 1] + 1, D[i - W] + 1, D[i - W - 1] + 1.414);
    }
  for (let y = W - 2; y >= 0; y--)
    for (let x = W - 2; x >= 0; x--) {
      const i = y * W + x;
      if (D[i] > 0) D[i] = Math.min(D[i], D[i + 1] + 1, D[i + W] + 1, D[i + W + 1] + 1.414);
    }
  return D;
}

// ---------------------------------------------------------------- fırça darbesi
/**
 * Tek fırça darbesi. pts: ana çizgi, w: genişlik, rgb: renk.
 * o: alfa, bas (başta incelme payı 0..0.5), son (sonda incelme), basinc (0..1 genişlik oynaması), titreme (kenar, px),
 *    kil (kıl izi sayısı), kilAlfa, kilFark (kıl ton farkı), kuru (0..1 kuru uç), r (rng), basUc (iniş düğümü 0..1)
 */
function darbe(c, pts, w, rgb, o) {
  o = o || {};
  const r = o.r || RD;
  pts = yenidenOrnekle(pts, Math.max(0.8, Math.min(w * 0.4, 3)));
  const n = pts.length;
  if (n < 2) return;
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] || 1;
  const N = normaller(pts, false);
  const ofs = (_ofs += 7.31);
  const bas = o.bas != null ? o.bas : 0.15;
  const son = o.son != null ? o.son : 0.3;
  const pr = o.basinc != null ? o.basinc : 0.25;
  const tit = o.titreme != null ? o.titreme : w * 0.07;
  const kuru = o.kuru || 0;
  const govde = 1 - kuru * (0.2 + 0.25 * r());
  const dug = o.basUc != null ? o.basUc : 0.12;
  const gen = (t, tb) => {
    // t: 0..1 darbe boyunca; tb: gövdenin bittiği yer
    let f = 1;
    if (t < bas) f *= 0.5 + 0.5 * Math.sin(((t / bas) * PI) / 2);
    if (t < bas * 1.6) f *= 1 + dug * Math.sin((t / (bas * 1.6)) * PI);
    const te = (tb - t) / tb;
    if (te < son) f *= 0.08 + 0.92 * Math.sin((Math.max(0, te / son) * PI) / 2);
    f *= 1 + pr * (NZ.n(t * 2.1 + ofs, ofs * 0.53) - 0.5) * 2;
    return Math.max(0.02, f);
  };
  // gövde
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i] / L;
    if (t > govde + 1e-6) break;
    const hw = (w * gen(t, govde)) / 2;
    const e1 = tit * (NZ.n(s[i] * 0.09 + ofs, 1.7) - 0.5) * 2;
    const e2 = tit * (NZ.n(s[i] * 0.09 + ofs, 8.3) - 0.5) * 2;
    sol.push([pts[i][0] + N[i][0] * (hw + e1), pts[i][1] + N[i][1] * (hw + e1)]);
    sag.push([pts[i][0] - N[i][0] * (hw + e2), pts[i][1] - N[i][1] * (hw + e2)]);
  }
  if (sol.length > 1) {
    c.beginPath();
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < sol.length; i++) c.lineTo(sol[i][0], sol[i][1]);
    for (let i = sag.length - 1; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
    c.fillStyle = rgba(rgb, o.alfa == null ? 1 : o.alfa);
    c.fill();
  }
  // kıl izleri (fırçanın kılları boyayı çizgi çizgi bırakır; kuru uçta ayrılırlar)
  const kil = o.kil || 0;
  if (kil > 0) {
    c.lineCap = 'round';
    const ka = o.kilAlfa != null ? o.kilAlfa : 0.35;
    const kf = o.kilFark != null ? o.kilFark : 14;
    for (let k = 0; k < kil; k++) {
      const v = ((k + 0.5) / kil - 0.5) * 0.8 + (r() - 0.5) * 0.12;
      const j = (r() - 0.5) * 2 * kf;
      const cc = [rgb[0] + j, rgb[1] + j, rgb[2] + j];
      const t0 = r() * 0.12;
      const t1 = kuru ? govde + r() * (1 - govde) : 0.78 + r() * 0.2;
      c.strokeStyle = rgba(cc, ka * (0.6 + 0.8 * r()));
      c.lineWidth = Math.max(0.45, (w / kil) * (0.45 + 0.6 * r()));
      c.beginPath();
      let ilk = true;
      for (let i = 0; i < n; i++) {
        const t = s[i] / L;
        if (t < t0 || t > t1) continue;
        const hw = w * gen(Math.min(t, govde), kuru ? 1 : govde) * v;
        const x = pts[i][0] + N[i][0] * hw;
        const y = pts[i][1] + N[i][1] * hw;
        if (ilk) {
          c.moveTo(x, y);
          ilk = false;
        } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
}
let RD = S.rng(1);

/** (x,y) merkezli, yon alanını izleyen darbe yolu (l uzunluk). */
function darbeYolu(x, y, l, yon, egri) {
  if (!egri) {
    const a = yon(x, y);
    const ca = (Math.cos(a) * l) / 2;
    const sa = (Math.sin(a) * l) / 2;
    return [
      [x - ca, y - sa],
      [x + ca, y + sa],
    ];
  }
  const adim = l / 8;
  const ileri = [];
  const geri = [];
  let cx = x;
  let cy = y;
  for (let s = 0; s < 4; s++) {
    const a = yon(cx, cy);
    cx += Math.cos(a) * adim;
    cy += Math.sin(a) * adim;
    ileri.push([cx, cy]);
  }
  cx = x;
  cy = y;
  for (let s = 0; s < 4; s++) {
    const a = yon(cx, cy);
    cx -= Math.cos(a) * adim;
    cy -= Math.sin(a) * adim;
    geri.push([cx, cy]);
  }
  return geri.reverse().concat([[x, y]], ileri);
}

/**
 * Bir alanı fırça darbeleriyle doldurur. Darbeler sarsılmış bir ızgaraya dağıtılır, karışık sırayla çekilir.
 * o: kutu [x1,y1,x2,y2], aralik (px), klip (Path2D), icinde(x,y), boy [a,b], en [a,b], yon(x,y) → açı, egri,
 *    renk(x,y,r) → rgb, alfa [a,b], darbe (darbe() seçenekleri), tohum, atla(x,y,r) → true ise darbe yok
 */
function alanBoya(c, o) {
  const r = S.rng(o.tohum || 1);
  const [x1, y1, x2, y2] = o.kutu;
  const ar = o.aralik;
  const ar2 = o.aralikY || ar;
  const L = [];
  for (let y = y1; y < y2; y += ar2) {
    for (let x = x1; x < x2; x += ar) {
      const px = x + r() * ar;
      const py = y + r() * ar2;
      if (o.icinde && !o.icinde(px, py)) continue;
      L.push([px, py]);
    }
  }
  for (let i = L.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = L[i];
    L[i] = L[j];
    L[j] = t;
  }
  if (o.sirala) L.sort(o.sirala);
  c.save();
  if (o.klip) c.clip(o.klip);
  const dO = Object.assign({}, o.darbe || {}, { r });
  for (const [x, y] of L) {
    if (o.atla && o.atla(x, y, r)) continue;
    const l = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
    const w = o.en[0] + r() * (o.en[1] - o.en[0]);
    const pts = darbeYolu(x, y, l, o.yon, o.egri);
    const col = o.renk(x, y, r);
    if (!col) continue;
    dO.alfa = o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]);
    darbe(c, pts, (o.enFn ? o.enFn(x, y) : 1) * w, col, dO);
  }
  c.restore();
}

// ---------------------------------------------------------------- ışık ve biçim (sağ üstten gelen öğle ışığı)
function norm(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
const ISIK = norm([0.5, -0.62, 0.6]); // x sağ, y aşağı (ekran), z bakana doğru
const KP = S.kubbeProfili(240);
/** Kubbe yüksekliğinde yarıçap. */
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < KP.length - 1; i++) {
    if (y <= KP[i].y && y >= KP[i + 1].y) {
      const t = (KP[i].y - y) / (KP[i].y - KP[i + 1].y || 1);
      return KP[i].r + (KP[i + 1].r - KP[i].r) * t;
    }
  }
  return 0;
}
/** Kubbe üzerindeki noktanın bilgisi: u (−1 sol kenar … 1 sağ), h (0 taban … 1 tepe), dilim (0..16), f (dilim içi 0..1), lam (ışık), lamF (dilim düz yüzü) */
function kubbeBilgi(x, y) {
  const R = Math.max(1, kubbeR(y));
  const u = clamp((x - 560) / R, -0.999, 0.999);
  const h = clamp((555 - y) / 255, 0, 1);
  const boy = Math.asin(u);
  const e = Math.pow(h, 1.25) * 1.25; // yükseldikçe yüzey göğe döner
  const ln = (b) => {
    const nx = Math.sin(b) * Math.cos(e);
    const nz = Math.cos(b) * Math.cos(e);
    const ny = -Math.sin(e);
    return nx * ISIK[0] + ny * ISIK[1] + nz * ISIK[2];
  };
  const dil = (boy + PI / 2) / (PI / 16);
  const di = Math.floor(dil);
  const f = dil - di;
  const bm = -PI / 2 + (di + 0.5) * (PI / 16);
  return { u, h, R, boy, dilim: di, f, lam: ln(boy), lamF: ln(bm) };
}
/** Kubbe meridyeninin (kaburga yönü) ekrandaki açısı (aşağıdan yukarı). */
function kubbeYon(x, y) {
  const R = Math.max(1, kubbeR(y));
  const u = clamp((x - 560) / R, -1, 1);
  const dr = kubbeR(y - 1) - R; // y azaldıkça r değişimi
  return Math.atan2(-1, u * dr);
}
/** Silindir (kasnak, minare) üzerinde ışık: u −1..1 */
function silindirIsik(u) {
  u = clamp(u, -0.999, 0.999);
  const nx = u;
  const nz = Math.sqrt(1 - u * u);
  return nx * ISIK[0] + nz * ISIK[2];
}

// ---------------------------------------------------------------- bulutlar (yaz öğlesinin yassı tabanlı küçük kümeleri)
/** Bulut biçimleri: her biri {x, y, s, lobs:[{x,y,rx,ry}], taban} */
function bulutKur(tohum) {
  const r = S.rng(tohum || 31);
  const yerler = [
    [170, 250, 1.0],
    [505, 148, 0.8],
    [770, 335, 1.0],
    [945, 468, 0.62],
    [92, 470, 0.66],
  ];
  return yerler.map(([x, y, s]) => {
    const lobs = [];
    const gen = 125 * s;
    const adet = 4 + Math.floor(r() * 2);
    for (let i = 0; i < adet; i++) {
      const t = adet === 1 ? 0.5 : i / (adet - 1);
      const lx = x - gen * 0.8 + t * gen * 1.6 + (r() - 0.5) * 16 * s;
      const orta = 1 - Math.abs(t - 0.42) * 1.5;
      const ry = (13 + 22 * Math.max(0.12, orta) + r() * 7) * s;
      const rx = ry * (1.9 + r() * 0.8);
      lobs.push({ x: lx, y: y + 14 * s - ry * 0.62, rx, ry });
    }
    // iki yanda ince, yassı uzantılar
    lobs.push({ x: x - gen * 0.95, y: y + 9 * s, rx: 46 * s, ry: 8 * s });
    lobs.push({ x: x + gen * 0.98, y: y + 10 * s, rx: 52 * s, ry: 7 * s });
    return { x, y, s, lobs, taban: y + 16 * s, gen };
  });
}
/** Bulut yoğunluğu (0 dışarıda, 1 iç): kenar, tabana doğru düz kesilir. */
function bulutYog(B, x, y) {
  let en = 0;
  for (const L of B.lobs) {
    const dx = (x - L.x) / L.rx;
    const dy = (y - L.y) / L.ry;
    en = Math.max(en, 1 - (dx * dx + dy * dy));
  }
  if (en < -0.35) return 0;
  const tab = yumusak(B.taban + 2 * B.s, B.taban - 8 * B.s, y);
  const gn = (NZ.fbm(x * 0.011 + B.x, y * 0.018, 2) - 0.5) * 0.36;
  return clamp(en + gn * yumusak(-0.35, 0.05, en), 0, 1) * tab;
}

// ---------------------------------------------------------------- kâğıt ve son geçişler
/** Bütün tuval üzerinde piksel geçişi: fn(d, i, x, y) — x,y 2048 ızgarada. */
function pikselGecis(c, fn) {
  const cv = c.canvas;
  const im = c.getImageData(0, 0, cv.width, cv.height);
  const d = im.data;
  const Wc = cv.width;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < Wc; x++) fn(d, (y * Wc + x) * 4, x, y);
  c.putImageData(im, 0, 0);
}

// bulutlar: yassı tabanlı küçük yaz bulutları, baştan sona fırça darbesiyle: gölgeli alt gövde üç mavi-gri
// karışımın kısa yatay darbeleri (darbe uçları bulutun kenarını ve hafif düzensiz tabanını çizer, maske yok),
// ışık alan üst kısım konturu izleyen tebeşir beyazı örtücü darbeler.
const BULUT = (function () {
  const r = S.rng(2111);
  const yerler = [
    [160, 238, 1.0, 6],
    [560, 132, 0.72, 5],
    [800, 330, 0.95, 6],
    [962, 472, 0.55, 4],
    [72, 458, 0.6, 4],
  ];
  return yerler.map(([x, y, s, adet]) => {
    const lobs = [];
    const gen = 120 * s;
    for (let i = 0; i < adet; i++) {
      const t = i / (adet - 1);
      const lx = x - gen * 0.78 + t * gen * 1.56 + (r() - 0.5) * 20 * s;
      const orta = 1 - Math.abs(t - (0.35 + r() * 0.2)) * 1.6;
      const ry = (11 + 24 * Math.max(0.1, orta) + r() * 8) * s;
      const rx = ry * (1.5 + r() * 0.9);
      lobs.push({ x: lx, y: y + 14 * s - ry * (0.55 + r() * 0.15), rx, ry });
    }
    lobs.push({ x: x - gen * 0.92, y: y + 9 * s, rx: 40 * s, ry: 7 * s });
    lobs.push({ x: x + gen * 0.95, y: y + 10 * s, rx: 48 * s, ry: 6.5 * s });
    return { x, y, s, lobs, taban: y + 16 * s, gen };
  });
})();
const BULUT_BOYA = [hex('#FFFFFB'), hex('#E5EDF6'), hex('#C9D8EA'), hex('#AFC3DD')];
for (const B of BULUT) {
  const r = S.rng(Math.round(B.x * 3 + B.y));
  const top = Math.min(...B.lobs.map((l) => l.y - l.ry));
  const yog = (x, y) => bulutYog(B, x, y);
  const golge = (x, y) => clamp(((y - top) / (B.taban - top)) * 1.05 - ((x - B.x) / B.gen) * 0.2 - 0.05, 0, 1);
  // darbe uçlarını bulutun içinde bitir: merkezden iki yana yoğunluk eşiğe düşene kadar yürü
  const uclar = (x, y, l, esik) => {
    let x1 = x;
    let x2 = x;
    while (x1 > x - l / 2 && yog(x1 - 1.5, y) > esik) x1 -= 1.5;
    while (x2 < x + l / 2 && yog(x2 + 1.5, y) > esik) x2 += 1.5;
    return [x1, x2];
  };
  const x0 = B.x - B.gen - 60 * B.s;
  const x9 = B.x + B.gen + 60 * B.s;
  // gölgeli gövde: alttan üste katlar, darbeler yatay
  const L = [];
  for (let y = top + 2; y < B.taban + 4; y += 3.6) for (let x = x0; x < x9; x += 7) L.push([x + r() * 7, y + r() * 2.5]);
  for (let i = L.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [L[i], L[j]] = [L[j], L[i]];
  }
  for (const [x, y] of L) {
    if (yog(x, y) < 0.1) continue;
    const esik = 0.04 + r() * 0.07;
    const [x1, x2] = uclar(x, y, 14 + r() * 22, esik);
    if (x2 - x1 < 4) continue;
    const g = golge(x, y) + (r() - 0.5) * 0.3;
    const k = g < 0.28 ? 0 : g < 0.52 ? 1 : g < 0.78 ? 2 : 3;
    const egim = (r() - 0.5) * 1.2;
    darbe(ctx, [[x1, y - egim], [(x1 + x2) / 2, y], [x2, y + egim]], (4.6 + r() * 2.6) * Math.min(1, 0.6 + B.s * 0.4), oyna(BULUT_BOYA[k], r, 4, 3), { alfa: 0.95, bas: 0.12, son: 0.32, basinc: 0.25, titreme: 0.35, kil: 2, kilFark: 9, kilAlfa: 0.4, r });
  }
  // ışık alan üst: konturu izleyen kısa, kalın tebeşir beyazı darbeler (güneş sağ üstte)
  const M = [];
  for (let y = top - 4; y < B.taban; y += 3.4) for (let x = x0; x < x9; x += 5) M.push([x + r() * 5, y + r() * 3]);
  for (const [x, y] of M) {
    const v = yog(x, y);
    if (v < 0.12) continue;
    const gg = golge(x, y) + (NZ.n(x * 0.05, y * 0.02) - 0.5) * 0.16;
    if (gg > 0.4 + r() * 0.1) continue;
    const gx = yog(x + 3, y) - yog(x - 3, y);
    const gy = yog(x, y + 3) - yog(x, y - 3);
    let a = Math.atan2(gy, gx) + PI / 2;
    if (Math.cos(a) < 0) a += PI;
    if (a > PI) a -= 2 * PI;
    a = clamp(a * 0.4, -0.45, 0.45); // kontur ile yatay arası; darbe hiçbir zaman aşağı sarkmaz
    const l = 8 + r() * 14;
    let p1 = [x - (Math.cos(a) * l) / 2, y - (Math.sin(a) * l) / 2];
    let p2 = [x + (Math.cos(a) * l) / 2, y + (Math.sin(a) * l) / 2];
    for (let t = 0; t < 8 && yog(p1[0], p1[1]) < 0.08; t++) p1 = [(p1[0] * 3 + x) / 4, (p1[1] * 3 + y) / 4];
    for (let t = 0; t < 8 && yog(p2[0], p2[1]) < 0.08; t++) p2 = [(p2[0] * 3 + x) / 4, (p2[1] * 3 + y) / 4];
    const c = gg < 0.2 ? hex('#FFFFFC') : gg < 0.32 ? P.beyaz : hex('#EEF2F7');

  }
}

function minareYari(y) {
  if (y >= 488) return 34;
  if (y >= 468) return lerp(52, 34, (y - 468) / 20);
  if (y >= 456) return 54;
  if (y >= 436) return 48;
  if (y >= 316) return 27;
  if (y >= 300) return lerp(43, 27, (y - 300) / 16);
  if (y >= 290) return 45;
  if (y >= 272) return 40;
  if (y >= 206) return 19;
  if (y >= 198) return 25;
  if (y >= 146) {
    const t = (200 - y) / 54;
    return Math.max(3, 30 * Math.sin(PI * Math.pow(clamp(t, 0, 1), 0.75)) * (1 - t * 0.3));
  }
  return 4;
}

function alemBoya(a) {
  const ys = [
    S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
    S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true),
  ];
  const parca = (d, cx, cy, rx, ry) => {
    const yol = titrekYol(d, 0.25, 0.15, 0.8);
    ctx.fillStyle = rgba(P.altin);
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    // sol yan koyu, sağ üst açık
    darbe(ctx, [[cx - rx * 0.55, cy + ry], [cx - rx * 0.62, cy - ry]], rx * 0.75, P.altinKoyu, { alfa: 0.75, bas: 0.2, son: 0.3 });
    darbe(ctx, [[cx + rx * 0.35, cy + ry * 0.6], [cx + rx * 0.3, cy - ry * 0.7]], rx * 0.45, P.altinAcik, { alfa: 0.9, bas: 0.25, son: 0.4 });
    ctx.restore();
  };
  parca(ys[1], (a.cubuk.x1 + a.cubuk.x2) / 2, (a.cubuk.y1 + a.cubuk.y2) / 2, (a.cubuk.x2 - a.cubuk.x1) / 2 + 0.6, (a.cubuk.y2 - a.cubuk.y1) / 2);
  parca(ys[0], a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry);
  for (const k of a.kureler) {
    parca(S.daireYolu(k.cx, k.cy, k.r), k.cx, k.cy, k.r, k.r);
    ctx.fillStyle = rgba(hex('#FFFDF0'), 0.95);
    ctx.beginPath();
    ctx.ellipse(k.cx + k.r * 0.38, k.cy - k.r * 0.4, Math.max(0.9, k.r * 0.16), Math.max(0.7, k.r * 0.12), -0.6, 0, PI * 2);
    ctx.fill();
  }
  const h = a.hilal;
  const hy = titrekYol(S.hilalYolu(h.cx, h.cy, h.R), 0.2, 0.15, 0.7);
  ctx.fillStyle = rgba(P.altin);
  ctx.fill(hy);
  ctx.save();
  ctx.clip(hy);
  darbe(ctx, [[h.cx - h.R * 0.8, h.cy + h.R * 0.2], [h.cx - h.R * 0.2, h.cy + h.R * 0.95]], h.R * 0.45, P.altinKoyu, { alfa: 0.7 });
  darbe(ctx, [[h.cx + h.R * 0.95, h.cy - h.R * 0.3], [h.cx + h.R * 0.55, h.cy + h.R * 0.75]], h.R * 0.3, P.altinAcik, { alfa: 0.95 });
  ctx.restore();
}

// yapraklar: samur fırçanın orta damardan kenara giden küçük örtücü darbeleri; ışık yanı açık, gölge yanı koyu yeşil
function yaprakBoya(yp, r) {
  const yol = titrekYol(S.yaprakYolu(yp), 0.4, 0.12, 1);
  const ca = Math.cos(yp.aci);
  const sa = Math.sin(yp.aci);
  const L = yp.uzunluk;
  const Wd = L * yp.genislik;
  const nx = -sa;
  const ny = ca;
  const isikYan = nx * 0.6 - ny * 0.8 > 0 ? 1 : -1;
  const koyu = r() < 0.42;
  const tonG = koyu ? hex('#1A5733') : P.yaprak1;
  const tonI = koyu ? P.yaprak2 : hex('#5FA45C');
  ctx.fillStyle = rgba(karis(tonG, P.yaprak2, 0.35));
  ctx.fill(yol);
  ctx.save();
  ctx.clip(yol);
  const adet = Math.max(3, Math.round(L / 6.5));
  for (const yan of [-1, 1]) {
    const isikta = yan === isikYan;
    for (let i = 0; i < adet; i++) {
      const t = 0.04 + ((i + r() * 0.7) / adet) * 0.9;
      const hw = Wd * 0.68 * Math.sin(PI * Math.pow(clamp(t, 0, 1), 0.8)) + 1;
      const mx = yp.x + ca * L * t + nx * yan * 0.6;
      const my = yp.y + sa * L * t + ny * yan * 0.6;
      const ex = mx + ca * L * 0.13 + nx * yan * hw * 1.15;
      const ey = my + sa * L * 0.13 + ny * yan * hw * 1.15;
      const ort = [(mx + ex) / 2 + ca * L * 0.025, (my + ey) / 2 + sa * L * 0.025];
      const c = isikta ? karis(tonI, P.yaprak3, r() * 0.55) : karis(tonG, P.yaprak2, r() * 0.35);
      darbe(ctx, [[mx, my], ort, [ex, ey]], Math.max(1.8, hw * 0.62), oyna(c, r, 5, 3), { alfa: 0.93, bas: 0.12, son: 0.5, basinc: 0.25, r });
    }
  }
  ctx.restore();
  const [a, b] = S.yaprakDamari(yp);
  cizgiNokta(ctx, [a, [(a[0] + b[0]) / 2 + nx * 0.8, (a[1] + b[1]) / 2 + ny * 0.8], b], { w: 0.9, renk: rgba(koyu ? hex('#5E9E5E') : hex('#174A2C'), 0.6), titreme: 0.2, sonSivri: L * 0.4 });
}
{
  const r = S.rng(71);
  for (const yp of S.bitki.yapraklar) yaprakBoya(yp, r);
}
// tomurcuklar (öndeki saplı olmayan yedisine kısa sap)
function tomurcukBoya(t, i, r) {
  if (i >= 8) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8;
    const y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    cizgiNokta(ctx, [[x0, y0], [x0 + 2, y0 + 12], [x0 + 1, y0 + 24]], { w: 2.4, renk: rgba(P.sap), titreme: 0.3, sonSivri: 10 });
  }
  const yol = titrekYol(S.tomurcukYolu(t), 0.3, 0.15, 0.8);
  ctx.fillStyle = rgba(P.beyaz);
  ctx.fill(yol);
  ctx.save();
  ctx.clip(yol);
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  darbe(ctx, [[t.x - sa * t.r * 0.5 - ca * t.r, t.y + ca * t.r * 0.5 - sa * t.r], [t.x - sa * t.r * 0.5 + ca * t.r * 1.4, t.y + ca * t.r * 0.5 + sa * t.r * 1.4]], t.r * 0.8, P.cicekGolge, { alfa: 0.9, r });
  darbe(ctx, [[t.x - ca * t.r, t.y - sa * t.r], [t.x + ca * t.r * 0.3, t.y + sa * t.r * 0.3]], t.r * 1.6, P.yaprak2, { alfa: 0.95, bas: 0.1, son: 0.5, r });
  ctx.restore();
}
{
  const r = S.rng(72);
  S.bitki.tomurcuklar.forEach((t, i) => tomurcukBoya(t, i, r));
}
// çiçekler: mavimsi gri altlık üstüne uçtan göbeğe çekilen örtücü beyaz samur darbeleri; göbek küçük sarı lekeler
const ISIK_ACI = Math.atan2(ISIK[1], ISIK[0]);
function cicekBoya(c, r) {
  const taclar = S.tacYapraklari(c);
  taclar.sort((a, b) => Math.cos(a.aci - ISIK_ACI) - Math.cos(b.aci - ISIK_ACI));
  for (const e of taclar) {
    const yol = titrekYol(S.elipsYolu(e), Math.max(0.3, c.r * 0.014), 0.12, 0.8);
    const isik = Math.cos(e.aci - ISIK_ACI); // 1: ışığa bakan taç yaprak
    const gol = (1 - isik) / 2;
    ctx.fillStyle = rgba(karis(hex('#E6ECF4'), P.cicekGolge, 0.15 + gol * 0.6));
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    const ca = Math.cos(e.aci);
    const sa = Math.sin(e.aci);
    const p = (t, l) => [c.x + ca * c.r * t - sa * l, c.y + sa * c.r * t + ca * l];
    const n = Math.max(4, Math.round(c.r / 4.2));
    for (let k = 0; k < n; k++) {
      const v = ((k + 0.5) / n - 0.5) * 2;
      const lat = v * e.ry * 0.9 + (r() - 0.5) * e.ry * 0.12;
      const t0 = 0.16 + gol * 0.36 + Math.abs(v) * 0.1 + r() * 0.12;
      const a = p(1.06, lat * 0.55);
      const m = p((t0 + 1.06) / 2, lat * 1.02);
      const b = p(t0, lat * 0.62);
      const renk = karis(hex('#FFFFFB'), hex('#E8EDF3'), clamp(gol * 0.55 + r() * 0.25, 0, 1));
      darbe(ctx, [a, m, b], e.ry * (0.36 + r() * 0.1), oyna(renk, r, 3), { alfa: 0.9, bas: 0.12, son: 0.55, basinc: 0.2, r });
    }
    // göbeğe yakın, gölge yanında ince mavi dokunuş
    darbe(ctx, [p(0.18, -e.ry * 0.25), p(0.45, -e.ry * 0.4)], e.ry * 0.28, P.cicekGolge, { alfa: 0.35 + gol * 0.35, bas: 0.2, son: 0.6, r });
    ctx.restore();
    // gölgede kalan taç yaprakların alt kenarında kırık, ince koyu vurgu
    if (gol > 0.35) {
      const pts = ornekle(S.elipsYolu(e), 1)[0].pts;
      const parca = [];
      for (const q of pts) if ((q[0] - e.cx) * -0.55 + (q[1] - e.cy) * 0.83 > e.ry * 0.55) parca.push(q);
      if (parca.length > 6) {
        const m = [e.cx, e.cy];
        parca.sort((a, b) => ((Math.atan2(a[1] - m[1], a[0] - m[0]) - 0.6 + 4 * PI) % (2 * PI)) - ((Math.atan2(b[1] - m[1], b[0] - m[0]) - 0.6 + 4 * PI) % (2 * PI)));
        const k0 = Math.floor(parca.length * (0.1 + r() * 0.2));
        const k1 = Math.floor(parca.length * (0.6 + r() * 0.3));
        cizgiNokta(ctx, parca.slice(k0, k1), { w: Math.max(0.7, c.r * 0.022), renk: rgba(hex('#8399BC'), 0.5), titreme: 0.2, sivri: 6 });
      }
    }
  }
  // göbek: üst üste küçük sarı lekeler; sol altta okra, sağ üstte açık sarı (parlak nokta yok)
  const gr = c.r * 0.2;
  const gyol = titrekYol(S.daireYolu(c.x, c.y, gr * 0.92), 0.35, 0.2, 0.7);
  ctx.fillStyle = rgba(karis(P.sari, P.sariKoyu, 0.25));
  ctx.fill(gyol);
  for (let k = 0; k < 14; k++) {
    const a = r() * PI * 2;
    const rr = Math.sqrt(r()) * gr * 0.75;
    const x = c.x + Math.cos(a) * rr;
    const y = c.y + Math.sin(a) * rr;
    const sh = ((Math.cos(a) * -0.6 + Math.sin(a) * 0.8) * rr) / gr;
    const col = sh > 0.2 ? P.sariKoyu : sh < -0.3 ? hex('#F6DD70') : P.sari;
    const ta = r() * PI;
    const l = gr * 0.32;
    darbe(ctx, [[x - Math.cos(ta) * l, y - Math.sin(ta) * l], [x + Math.cos(ta) * l, y + Math.sin(ta) * l]], gr * 0.42, oyna(col, r, 5), { alfa: 0.9, bas: 0.3, son: 0.5, r });
  }
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * PI * 2 + r();
    const x = c.x + Math.cos(a) * gr * 1.45;
    const y = c.y + Math.sin(a) * gr * 1.45;
    const l = Math.max(0.9, c.r * 0.035);
    darbe(ctx, [[x - Math.cos(a) * l, y - Math.sin(a) * l], [x + Math.cos(a) * l, y + Math.sin(a) * l]], Math.max(1.3, c.r * 0.05), P.sariKoyu, { alfa: 0.85, bas: 0.3, son: 0.4, r });
  }
}
{
  const r = S.rng(73);
  for (const c of S.bitki.cicekler) cicekBoya(c, r);
}

// ---------------------------------------------------------------- 8. çerçeve: cetvelle çekilmiş tek ince koyu çizgi
{
  const k = 13;
  const ust = [[k - 2, k], [W - k + 2, k + 0.4]];
  const alt = [[k - 1, W - k], [W - k + 2, W - k - 0.3]];
  const sol = [[k, k - 2], [k + 0.3, W - k + 2]];
  const sag = [[W - k, k - 1], [W - k - 0.4, W - k + 2]];
  for (const l of [ust, alt, sol, sag]) cizgiNokta(ctx, l, { w: 2.5, renk: rgba(P.cerceve, 0.95), titreme: 0.4, frek: 0.012, basinc: 0.2 });
}

// ---------------------------------------------------------------- 9. kâğıt: ince, mat, tebeşirimsi tane
pikselGecis(ctx, (d, i, x, y) => {
  const g = (karma(x >> 1, y >> 1, 5) - 0.5) * 7 + (karma(x, y, 9) - 0.5) * 4;
  d[i] = clamp(d[i] + g, 0, 255);
  d[i + 1] = clamp(d[i + 1] + g, 0, 255);
  d[i + 2] = clamp(d[i + 2] + g, 0, 255);
});

SAHNE.hazir();
