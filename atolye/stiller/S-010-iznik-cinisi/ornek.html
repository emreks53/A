<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-010 İznik Çinisi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #D8D2C4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-010 İznik Çinisi — beyaz astar üzerine kobalt mavisi, firuze, kabarık mercan kırmızısı ve zümrüt
  // yeşili; siyah kontur; saz yaprakları, lale, karanfil, sümbül ve rozetler. Sahne, bordür çinileriyle
  // çevrili 4 × 4 çini panoya boyanmıştır: derzler, sır parlaması, sır birikmesi ve iğne delikleri.
  const S = SAHNE;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, 2);
  const P = (d) => new Path2D(d);

  const C = {
    beyaz: '#F5F7F3',
    kobalt: '#1F3F99',
    kobaltKoyu: '#152C70',
    firuze: '#2AA3A5',
    firuzeAcik: '#62C2C0',
    kirmizi: '#C8382A',
    yesil: '#1F8B4E',
    yesilKoyu: '#15663A',
    siyah: '#1A1A22',
    derz: '#D6D0C1',
  };

  // ------------------------------------------------------------ yardımcılar
  function poligonYolu(pts, acik) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (!acik) p.closePath();
    return p;
  }
  function omurga(x0, y0, a0, n, ds, kf) {
    const pts = [];
    let x = x0;
    let y = y0;
    let a = a0;
    for (let i = 0; i <= n; i++) {
      pts.push([x, y]);
      a += kf(i * ds, i / n) * ds;
      x += Math.cos(a) * ds;
      y += Math.sin(a) * ds;
    }
    return pts;
  }
  function serit(pts, wSol, wSag) {
    const sol = [];
    const sag = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l;
      ty /= l;
      const t = i / (n - 1);
      const ws = wSol(t, i);
      const wg = wSag(t, i);
      sol.push([pts[i][0] - ty * ws, pts[i][1] + tx * ws]);
      sag.push([pts[i][0] + ty * wg, pts[i][1] - tx * wg]);
    }
    return poligonYolu(sol.concat(sag.reverse()));
  }
  const yumusak = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  function gurultu(tohum, hucre) {
    const r = S.rng(tohum);
    const G = 256;
    const g = new Float32Array(G * G);
    for (let i = 0; i < G * G; i++) g[i] = r();
    return (x, y) => {
      x /= hucre;
      y /= hucre;
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const v = (i, j) => g[((j & 255) << 8) | (i & 255)];
      const a = v(xi, yi) + (v(xi + 1, yi) - v(xi, yi)) * sx;
      const b = v(xi, yi + 1) + (v(xi + 1, yi + 1) - v(xi, yi + 1)) * sx;
      return a + (b - a) * sy;
    };
  }

  // ------------------------------------------------------------ katmanlar: renk (sır altı), kırmızı (kabarık), kontur
  function katman() {
    const c = S.yeniTuval(2048, 2048);
    const k = c.getContext('2d', { willReadFrequently: true });
    k.setTransform(2, 0, 0, 2, 0, 0);
    k.lineJoin = 'round';
    k.lineCap = 'round';
    return { c, k };
  }
  const RK = katman(); // kobalt, firuze, yeşil
  const KZ = katman(); // mercan kırmızısı (kabarık)
  const KT = katman(); // siyah / koyu kontur
  const r = RK.k;
  const kz = KZ.k;
  const kt = KT.k;

  // şekli doldur (renk katmanına ya da kırmızı katmana) ve konturla
  function boya(yol, renk, kw) {
    yol = typeof yol === 'string' ? P(yol) : yol;
    if (renk) {
      const hedef = renk === C.kirmizi ? kz : r;
      hedef.fillStyle = renk;
      hedef.fill(yol);
    }
    if (kw !== 0) {
      kt.lineWidth = kw || 1.4;
      kt.strokeStyle = C.siyah;
      kt.stroke(yol);
    }
  }
  function cizgiK(pts, w, renk, hedef) {
    const k = hedef || kt;
    k.beginPath();
    pts.forEach(([x, y], i) => (i ? k.lineTo(x, y) : k.moveTo(x, y)));
    k.lineWidth = w;
    k.strokeStyle = renk || C.siyah;
    k.stroke();
  }

  // ------------------------------------------------------------ motifler
  function rozet(x, y, R, n, renkler) {
    // dış taç (kobalt), iç taç (kırmızı), göbek
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const p = (u, v) => [x + u * ca - v * sa, y + u * sa + v * ca];
      const [ax, ay] = p(R * 0.25, 0);
      const [b1x, b1y] = p(R * 0.55, -R * 0.42);
      const [b2x, b2y] = p(R * 1.08, -R * 0.3);
      const [cx, cy] = p(R, 0);
      const [d1x, d1y] = p(R * 1.08, R * 0.3);
      const [d2x, d2y] = p(R * 0.55, R * 0.42);
      boya(`M${ax},${ay} C${b1x},${b1y} ${b2x},${b2y} ${cx},${cy} C${d1x},${d1y} ${d2x},${d2y} ${ax},${ay} Z`, renkler[0], 1.1);
    }
    const ic = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * Math.PI * 2 + Math.PI / n;
      const rr = i % 2 ? R * 0.34 : R * 0.5;
      ic.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    boya(poligonYolu(ic), renkler[1], 1);
    boya(S.daireYolu(x, y, R * 0.16), renkler[2], 0.9);
  }
  // İznik lalesi: uzun, sivri taç yapraklı
  function lale(x, y, s, aci, renk) {
    kt.save();
    r.save();
    kz.save();
    for (const k of [kt, r, kz]) {
      k.translate(x, y);
      k.rotate(aci || 0);
      k.scale(s, s);
    }
    const lw = 1.3 / s;
    const yan1 = 'M-1,6 C-12,5 -16,-8 -14,-30 C-10,-18 -6,-12 -1,-10 Z';
    const yan2 = 'M1,6 C12,5 16,-8 14,-30 C10,-18 6,-12 1,-10 Z';
    const orta = 'M0,8 C-10,6 -10,-16 0,-36 C10,-16 10,6 0,8 Z';
    boya(yan1, renk || C.kirmizi, lw);
    boya(yan2, renk || C.kirmizi, lw);
    boya(orta, renk === C.kobalt ? C.firuze : C.kirmizi, lw);
    // beyaz orta çizgi (astar)
    r.strokeStyle = C.beyaz;
    kz.globalCompositeOperation = 'destination-out';
    kz.lineWidth = 2 / s;
    kz.beginPath();
    kz.moveTo(0, 2);
    kz.lineTo(0, -26);
    kz.stroke();
    kz.globalCompositeOperation = 'source-over';
    for (const k of [kt, r, kz]) k.restore();
  }
  function karanfil(x, y, s, aci) {
    for (const k of [kt, r, kz]) {
      k.save();
      k.translate(x, y);
      k.rotate(aci || 0);
      k.scale(s, s);
    }
    const lw = 1.2 / s;
    boya('M-6,14 C-7,6 -6,2 -8,-2 L8,-2 C6,2 7,6 6,14 Z', C.yesil, lw);
    cizgiK([[-3, 12], [-3, 1]], 0.9 / s);
    cizgiK([[3, 12], [3, 1]], 0.9 / s);
    // yelpaze: tırtıklı kırmızı taç, kobalt iç dilimler
    let d = 'M-8,-1 ';
    const n = 15;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI + (Math.PI * i) / n;
      const rr = i % 2 ? 22 : 27;
      d += `L${(Math.cos(a) * rr).toFixed(2)},${(Math.sin(a) * rr - 2).toFixed(2)} `;
    }
    d += 'L8,-1 Z';
    boya(d, C.kirmizi, lw);
    for (let i = 1; i < 5; i++) {
      const a = Math.PI + (Math.PI * i) / 5;
      const yol = P(`M0,-2 L${(Math.cos(a - 0.12) * 17).toFixed(2)},${(Math.sin(a - 0.12) * 17 - 2).toFixed(2)} L${(Math.cos(a + 0.12) * 17).toFixed(2)},${(Math.sin(a + 0.12) * 17 - 2).toFixed(2)} Z`);
      // kobalt dilimler kırmızının üstünde görünsün: kırmızıyı oradan sil
      kz.save();
      kz.globalCompositeOperation = 'destination-out';
      kz.fill(yol);
      kz.restore();
      boya(yol, C.kobalt, 0.8 / s);
    }
    for (const k of [kt, r, kz]) k.restore();
  }
  function sumbul(x, y, s, aci, renk) {
    for (const k of [kt, r, kz]) {
      k.save();
      k.translate(x, y);
      k.rotate(aci || 0);
      k.scale(s, s);
    }
    cizgiK([[0, 22], [0, -34]], 3.4 / s, C.siyah);
    cizgiK([[0, 22], [0, -34]], 2.0 / s, C.yesil);
    for (let i = 0; i < 10; i++) {
      const yy = 16 - i * 5.4;
      const taraf = i % 2 ? 1 : -1;
      r.save();
      kt.save();
      for (const k of [r, kt]) {
        k.translate(taraf * (6 - i * 0.25), yy);
        k.rotate(taraf * 0.55);
      }
      boya('M0,-4.5 C-4.5,-4.5 -5.5,1 -5,4.5 L-2.4,3 L0,5.5 L2.4,3 L5,4.5 C5.5,1 4.5,-4.5 0,-4.5 Z', renk || C.kobalt, 0.8 / s);
      r.restore();
      kt.restore();
    }
    for (const k of [kt, r, kz]) k.restore();
  }
  // saz yaprağı: uzun, kıvrık, tırtıklı; iki tonlu
  function saz(x, y, L, aci, kivrim, renk, koyu) {
    const N = Math.max(40, Math.round(L / 2.2));
    const pts = omurga(x, y, aci, N, L / N, (u, t) => (kivrim * (0.25 + t * 1.5)) / L);
    const W = L * 0.09;
    const govde = (t) => Math.sin(Math.PI * Math.pow(t, 0.72)) * (1 - 0.1 * t);
    const dis = [0, 0.07, 0.15, 0.24];
    const sol = (t, i) => W * govde(t) * (1 + (t > 0.12 && t < 0.93 ? dis[i % 4] * 0.8 : 0)) + 0.3;
    const sag = (t, i) => W * 0.9 * govde(t) * (1 + (t > 0.12 && t < 0.93 ? dis[(i + 2) % 4] : 0)) + 0.3;
    const p = serit(pts, sol, sag);
    boya(p, renk || C.yesil, 1.3);
    r.fillStyle = koyu || C.yesilKoyu;
    r.fill(serit(pts, sol, () => 0));
    cizgiK(pts.slice(2, Math.round(N * 0.9)), 1.0);
  }
  function sapCiz(pts, w) {
    cizgiK(pts, (w || 2.4) + 1.8, C.siyah);
    cizgiK(pts, w || 2.4, C.yesil);
  }
  function yaprakcik(x, y, L, aci, renk) {
    const yy = { x, y, uzunluk: L, genislik: 0.38, aci };
    boya(S.yaprakYolu(yy), renk || C.yesil, 1.1);
    const [a, b] = S.yaprakDamari(yy);
    cizgiK([a, b], 0.8);
  }

  // çin bulutu: kobalt, siyah konturlu, beyaz iç çizgili
  function cinBulutu(cx, cy, s, yon, renk) {
    for (const k of [r, kt, kz]) {
      k.save();
      k.translate(cx, cy);
      k.scale(s * yon, s);
    }
    const L0 = 40;
    const Lk = 95;
    const sag = omurga(0, 0, 0, L0 + Lk, 1, (u) => (u < L0 ? -0.004 : -(0.025 + 0.0016 * (u - L0))));
    const sol = omurga(0, 0, Math.PI, L0 + Lk * 0.85, 1, (u) => (u < L0 ? -0.004 : -(0.025 + 0.00176 * (u - L0))));
    const pts = sol.slice().reverse().concat(sag.slice(1));
    const m = sol.length - 1;
    const W = 13;
    const d = (i) => (i < m ? (m - i) / (L0 + Lk * 0.85) : (i - m) / (L0 + Lk));
    const taper = (i) => 1 - 0.8 * yumusak(0.28, 1, d(i));
    const lob = (i) => 1 + 0.8 * Math.exp(-Math.pow((i - m) / (L0 + 12), 2)) * Math.pow(Math.abs(Math.cos(((i - m) * Math.PI) / (L0 * 0.78))), 0.6);
    const wUst = (t, i) => W * taper(i) * lob(i);
    const wAlt = (t, i) => W * 0.75 * taper(i);
    const dis = serit(pts, wAlt, wUst);
    const hedef = renk === C.kirmizi ? kz : r;
    hedef.fillStyle = renk;
    hedef.fill(dis);
    kt.lineWidth = 1.4 / s;
    kt.strokeStyle = C.siyah;
    kt.stroke(dis);
    const ic = serit(pts, (t, i) => Math.max(0, wAlt(t, i) - 4.5), (t, i) => Math.max(0, wUst(t, i) - 4.5));
    // beyaz iç çizgi: renk katmanından sil (astar görünür)
    hedef.globalCompositeOperation = 'destination-out';
    hedef.lineWidth = 1.6 / s;
    hedef.stroke(ic);
    hedef.globalCompositeOperation = 'source-over';
    for (const k of [r, kt, kz]) k.restore();
  }

  // ============================================================ TASARIM
  const BOR = 64; // bordür genişliği
  const ALAN = { x1: BOR, y1: BOR, x2: 1024 - BOR, y2: 1024 - BOR };

  // ---- gök: çin bulutları ve güneş rozeti
  cinBulutu(175, 236, 1.0, 1, C.kobalt);
  cinBulutu(455, 160, 0.7, -1, C.firuze);
  cinBulutu(770, 300, 0.8, 1, C.kirmizi);
  cinBulutu(902, 446, 0.55, -1, C.kobalt);
  cinBulutu(115, 425, 0.55, 1, C.firuze);
  cinBulutu(640, 196, 0.5, 1, C.kobalt);
  cinBulutu(146, 112, 0.5, -1, C.kirmizi);
  cinBulutu(716, 98, 0.44, -1, C.firuze);
  cinBulutu(404, 318, 0.4, 1, C.kobalt);
  cinBulutu(884, 366, 0.42, 1, C.firuze);
  {
    // güneş: büyük rozet, ışın taçlı
    const gx = 880;
    const gy = 140;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      const p = (u, v) => [gx + u * Math.cos(a) - v * Math.sin(a), gy + u * Math.sin(a) + v * Math.cos(a)];
      const [ax, ay] = p(40, -6);
      const [bx, by] = p(58, 0);
      const [cx, cy] = p(40, 6);
      boya(`M${ax},${ay} Q${p(50, -5).join(',')} ${bx},${by} Q${p(50, 5).join(',')} ${cx},${cy} Z`, i % 2 ? C.firuze : C.kobalt, 1.1);
    }
    boya(S.daireYolu(gx, gy, 41), C.firuze, 1.3);
    rozet(gx, gy, 36, 8, [C.kobalt, C.kirmizi, C.beyaz]);
  }

  // ---- minare
  function alemCiz(a) {
    const yollar = [
      S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
      S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true),
      ...a.kureler.map((q) => S.daireYolu(q.cx, q.cy, q.r)),
      S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R),
    ];
    for (const y of yollar) boya(y, C.kirmizi, 1);
  }
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') {
      alemCiz(p.alem);
      continue;
    }
    if (p.tip === 'bant') {
      const yol = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      boya(yol, null, 1.4);
      S.zikzakCizgileri().forEach((z, i) => {
        cizgiK(z, 4.8, C.siyah);
        cizgiK(z, 3.0, i === 1 ? C.kobalt : C.kirmizi);
      });
      continue;
    }
    if (p.tip === 'korkuluk') {
      const yol = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      boya(yol, C.firuze, 1.3);
      const adet = Math.round((p.x2 - p.x1) / 9);
      const w = (p.x2 - p.x1) / adet;
      for (let i = 0; i < adet; i++) boya(S.kemerYolu(p.x1 + w * (i + 0.5), p.y1 + 4, w * 0.55, p.y2 - p.y1 - 7), C.kobalt, 0.7);
      continue;
    }
    if (p.tip === 'topuz') {
      boya(p.yol, C.kobalt, 1.4);
      for (let i = -2; i <= 2; i++) {
        r.save();
        r.clip(P(p.yol));
        cizgiK([[300 + i * 9, 202], [300 + i * 3, 150]], 1.4, C.firuzeAcik, r);
        r.restore();
      }
      continue;
    }
    const yol = S.yol(p.noktalar, true);
    if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
      boya(yol, C.kobalt, 1.3);
      continue;
    }
    if (p.ad.startsWith('çıkma')) {
      boya(yol, C.firuze, 1.3);
      continue;
    }
    boya(yol, null, 1.6);
  }
  for (const w of S.minarePencereleri) boya(S.kemerYolu(w.x, w.y, w.w, w.h), C.kobalt, 1.1);

  // ---- kaide
  {
    const K = S.kaide;
    boya(S.yol([[K.x1, K.y1], [K.x2, K.y1], [K.x2, K.y2], [K.x1, K.y2]], true), null, 1.7);
    // firuze friz, kırmızı noktalı
    boya(S.yol([[K.x1, K.y1 + 3], [K.x2, K.y1 + 3], [K.x2, K.y1 + 15], [K.x1, K.y1 + 15]], true), C.firuze, 1.1);
    for (let x = K.x1 + 10; x < K.x2 - 4; x += 16) boya(S.daireYolu(x, K.y1 + 9, 3), C.kirmizi, 0.7);
    for (const w of K.pencereler) {
      boya(S.kemerYolu(w.x, w.y - 5, w.w + 12, w.h + 5), C.firuze, 1.3);
      boya(S.kemerYolu(w.x, w.y, w.w, w.h), C.kobalt, 1.2);
      // beyaz şebeke
      r.save();
      r.clip(P(S.kemerYolu(w.x, w.y, w.w, w.h)));
      r.globalCompositeOperation = 'destination-out';
      for (let k = -5; k <= 5; k++) {
        cizgiK([[w.x + k * 8 - 40, w.y + w.h + 5], [w.x + k * 8 + 40, w.y - 35]], 1.3, '#000', r);
        cizgiK([[w.x + k * 8 + 40, w.y + w.h + 5], [w.x + k * 8 - 40, w.y - 35]], 1.3, '#000', r);
      }
      r.globalCompositeOperation = 'source-over';
      r.restore();
    }
    // pencereler arasında küçük rozetler
    for (const x of [365, 495, 625, 755]) rozet(x, 760, 15, 6, [C.kobalt, C.kirmizi, C.beyaz]);
    boya(S.yol([[K.kornis.x1, K.kornis.y1], [K.kornis.x2, K.kornis.y1], [K.kornis.x2, K.kornis.y2], [K.kornis.x1, K.kornis.y2]], true), C.kobalt, 1.3);
  }

  // ---- kasnak
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    boya(S.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true), C.firuze, 1.6);
    for (const w of S.kasnakPencereleri(kat)) boya(S.kemerYolu(w.x, w.y, w.w, w.h), C.kobalt, 1.1);
  }

  // ---- kubbe: zümrüt yeşili, kobalt kontur ve kaburgalar
  {
    const kub = P(S.kubbeYolu);
    r.fillStyle = C.yesil;
    r.fill(kub);
    r.save();
    r.clip(kub);
    for (const kb of S.kaburgalar(16, 40)) cizgiK(kb.noktalar, 1.7, C.kobaltKoyu, r);
    // astar beyazı ince parlak çizgiler (dilim ortası)
    const kab = [{ u: -1 }, ...S.kaburgalar(16, 40), { u: 1 }];
    const pr = S.kubbeProfili(40);
    r.restore();
    kt.lineWidth = 2.2;
    kt.strokeStyle = C.kobaltKoyu;
    kt.stroke(kub);
  }
  alemCiz(S.alemParcalari(560, 300, 1));

  // ---- yer: kobalt şerit üzerinde beyaz dalga
  {
    boya(S.yol([[ALAN.x1, 800], [ALAN.x2, 800], [ALAN.x2, 812], [ALAN.x1, 812]], true), C.kobalt, 1.2);
    r.globalCompositeOperation = 'destination-out';
    const pts = [];
    for (let x = ALAN.x1; x <= ALAN.x2; x += 2) pts.push([x, 806 + 2.6 * Math.sin(x / 6)]);
    cizgiK(pts, 1.6, '#000', r);
    r.globalCompositeOperation = 'source-over';
  }

  // ---- çiçekler
  const B = S.bitki;
  // yan dallar
  B.saplar.forEach((s) => sapCiz(s.slice(0, 25)));
  B.yapraklar.slice(0, 36).forEach((y, i) => {
    if (i % 3 === 2) yaprakcik(y.x, y.y, y.uzunluk * 0.95, y.aci, C.yesil);
    else saz(y.x, y.y, y.uzunluk * 1.35, y.aci, i % 2 ? 0.6 : -0.6, i % 4 === 0 ? C.firuze : C.yesil, i % 4 === 0 ? '#1C7F80' : C.yesilKoyu);
  });
  B.tomurcuklar.slice(0, 8).forEach((t, i) => {
    if (i % 2 === 0) lale(t.x, t.y - 4, 1.05, t.aci + Math.PI / 2, C.kirmizi);
    else lale(t.x, t.y, 0.55, t.aci + Math.PI / 2, C.kobalt);
  });
  B.cicekler.slice(0, 4).forEach((c, i) => (i % 2 ? karanfil(c.x, c.y + 6, 0.95, 0) : rozet(c.x, c.y, 20, 6, [C.kobalt, C.kirmizi, C.beyaz])));

  // ön: büyük saz yaprakları ve çiçek demeti
  [
    [110, 1030, 250, -1.2, -1.1],
    [255, 1030, 230, -1.85, -0.9],
    [330, 1030, 210, -1.25, 1.0],
    [470, 1030, 200, -1.95, -0.8],
    [590, 1030, 200, -1.15, 0.9],
    [700, 1030, 220, -1.9, -1.0],
    [790, 1030, 230, -1.3, 1.0],
    [930, 1030, 250, -1.95, 1.1],
    [30, 990, 170, -0.85, 0.7],
    [1000, 990, 170, -2.3, -0.7],
  ].forEach(([x, y, L, a, k], i) => saz(x, y, L, a, k, i % 3 === 1 ? C.firuze : C.yesil, i % 3 === 1 ? '#1C7F80' : C.yesilKoyu));
  const on = B.cicekler.slice(4).map((c) => ({ x: c.x, y: 806 + (c.y - 800) * 0.6, r: c.r * 0.9 }));
  const turler = ['sumbul', 'rozet', 'karanfil', 'sumbul', 'karanfil', 'lale', 'rozet', 'karanfil', 'lale'];
  on.forEach((c, i) => {
    sapCiz([[c.x, c.y + 10], [c.x + (i % 2 ? 6 : -6), (c.y + 1024) / 2], [c.x, 1030]], 2.6);
  });
  // ara laleler ve sümbüller
  const ara = [[120, 850, 'lale'], [380, 846, 'sumbul'], [540, 838, 'lale'], [700, 846, 'sumbul'], [950, 852, 'lale'], [285, 902, 'lale'], [620, 904, 'lale'], [790, 900, 'sumbul']];
  ara.forEach(([x, y]) => sapCiz([[x, y + 10], [x + 4, (y + 1030) / 2], [x, 1030]], 2.2));
  ara.forEach(([x, y, t]) => (t === 'lale' ? lale(x, y, 0.95, 0, C.kirmizi) : sumbul(x, y, 0.9, 0, C.firuze)));
  on.forEach((c, i) => {
    const s = 0.65 + c.r / 48;
    const tur = turler[i];
    if (tur === 'lale') lale(c.x, c.y + 4, s * 1.1, 0, C.kirmizi);
    else if (tur === 'karanfil') karanfil(c.x, c.y, s * 1.05, 0);
    else if (tur === 'rozet') rozet(c.x, c.y, 16 + c.r * 0.5, 8, [C.kobalt, C.kirmizi, C.beyaz]);
    else sumbul(c.x, c.y, s * 1.05, 0, C.kobalt);
  });
  B.tomurcuklar.slice(8).forEach((t, i) => (i % 2 ? sumbul(t.x, t.y - 4, 0.6, 0, C.firuze) : lale(t.x, t.y, 0.5, 0, C.kirmizi)));

  // ---- bordür: kobalt zemin, beyaz kıvrık dal, kırmızı rozetler, firuze rumîler
  {
    const kenarlar = [
      { o: [0, 0], a: 0 },
      { o: [1024, 0], a: Math.PI / 2 },
      { o: [1024, 1024], a: Math.PI },
      { o: [0, 1024], a: -Math.PI / 2 },
    ];
    const dis = poligonYolu([[0, 0], [1024, 0], [1024, 1024], [0, 1024]]);
    const ic = poligonYolu([[BOR, BOR], [1024 - BOR, BOR], [1024 - BOR, 1024 - BOR], [BOR, 1024 - BOR]]);
    const bant = new Path2D();
    bant.addPath(dis);
    bant.addPath(ic);
    // bordürde sahnenin taşan kısımlarını sil
    for (const k of [r, kz, kt]) {
      k.save();
      k.globalCompositeOperation = 'destination-out';
      k.fill(bant, 'evenodd');
      k.restore();
    }
    r.fillStyle = C.kobalt;
    r.fill(bant, 'evenodd');
    kt.lineWidth = 1.6;
    kt.strokeStyle = C.siyah;
    kt.stroke(ic);
    const B0 = BOR / 2;
    const periyot = (1024 - 2 * BOR) / 8;
    for (const kn of kenarlar) {
      for (const k of [r, kz, kt]) {
        k.save();
        k.translate(kn.o[0], kn.o[1]);
        k.rotate(kn.a);
      }
      const pts = [];
      for (let u = BOR - 6; u <= 1024 - BOR + 6; u += 2) pts.push([u, B0 + 11 * Math.sin(((u - 512) / periyot) * Math.PI * 2)]);
      // beyaz (astar) dal: renk katmanından sil
      r.save();
      r.globalCompositeOperation = 'destination-out';
      cizgiK(pts, 5, '#000', r);
      r.restore();
      cizgiK(pts.map(([x, y]) => [x, y - 2.5]), 0.9);
      cizgiK(pts.map(([x, y]) => [x, y + 2.5]), 0.9);
      for (let j = 0; j < 8; j++) {
        const u = BOR + periyot * j;
        const v = B0 + 11 * Math.sin(((u - 512) / periyot) * Math.PI * 2);
        // dal kıvrımında rozet
        const uc = BOR + periyot * (j + 0.25);
        const ud = BOR + periyot * (j + 0.75);
        const vc = B0 + 11 * Math.sin(((uc - 512) / periyot) * Math.PI * 2);
        const vd = B0 + 11 * Math.sin(((ud - 512) / periyot) * Math.PI * 2);
        rozet(uc, vc + (vc > B0 ? -9 : 9), 10, 6, [C.beyaz, C.kirmizi, C.firuze]);
        // yaprak çifti
        lale(ud, vd + (vd > B0 ? -2 : 2), 0.42, vd > B0 ? 0 : Math.PI, C.kirmizi);
        yaprakcik(u, v, 14, -Math.PI / 2 + 0.6, C.firuze);
        yaprakcik(u, v, 14, Math.PI / 2 + 0.6, C.firuze);
      }
      for (const k of [r, kz, kt]) k.restore();
    }
    // köşe kareleri
    for (const [x, y] of [[0, 0], [1024 - BOR, 0], [0, 1024 - BOR], [1024 - BOR, 1024 - BOR]]) {
      r.fillStyle = C.kobalt;
      r.fillRect(x, y, BOR, BOR);
      kz.clearRect(x, y, BOR, BOR);
      kt.clearRect(x, y, BOR, BOR);
      rozet(x + BOR / 2, y + BOR / 2, 22, 8, [C.beyaz, C.kirmizi, C.firuze]);
      kt.lineWidth = 1.2;
      kt.strokeStyle = C.siyah;
      kt.strokeRect(x + 4, y + 4, BOR - 8, BOR - 8);
    }
  }

  // ============================================================ SIR VE ÇİNİ
  // tasarım tuvali: beyaz astar + sır altı renkler (hafif yayılmış) + kabarık kırmızı + kontur
  const TAS = S.yeniTuval(2048, 2048);
  const tk = TAS.getContext('2d', { willReadFrequently: true });
  tk.fillStyle = C.beyaz;
  tk.fillRect(0, 0, 2048, 2048);
  // sır birikmesi: renk katmanının yoğunluğu dalgalanır
  {
    const id = r.getImageData(0, 0, 2048, 2048);
    const d = id.data;
    const g = gurultu(71, 26);
    const g2 = gurultu(72, 5);
    for (let j = 0; j < 2048; j++) {
      for (let i = 0; i < 2048; i++) {
        const q = (j * 2048 + i) * 4;
        if (d[q + 3] === 0) continue;
        const v = 1 + 0.16 * (g(i, j) - 0.5) + 0.06 * (g2(i, j) - 0.5);
        d[q] = Math.min(255, d[q] * v);
        d[q + 1] = Math.min(255, d[q + 1] * v);
        d[q + 2] = Math.min(255, d[q + 2] * (0.5 + 0.5 * v));
      }
    }
    r.putImageData(id, 0, 0);
  }
  tk.filter = 'blur(0.9px)';
  tk.drawImage(RK.c, 0, 0);
  tk.filter = 'none';
  tk.drawImage(RK.c, 0, 0);
  // kabarık kırmızı: altta gölge, üstte ışık
  tk.save();
  tk.filter = 'blur(1.2px)';
  tk.globalAlpha = 0.45;
  tk.globalCompositeOperation = 'multiply';
  tk.drawImage(KZ.c, -1.5, 1.8);
  tk.restore();
  tk.drawImage(KZ.c, 0, 0);
  // kontur: hafif yumuşak siyah
  tk.filter = 'blur(0.35px)';
  tk.drawImage(KT.c, 0, 0);
  tk.filter = 'none';

  // ---- çinileri yerleştir
  ctx.fillStyle = C.derz;
  ctx.fillRect(0, 0, 1024, 1024);
  // derz dokusu
  {
    const rr = S.rng(5);
    for (let i = 0; i < 6000; i++) {
      ctx.fillStyle = rr() < 0.5 ? 'rgba(120,110,95,0.18)' : 'rgba(255,255,255,0.25)';
      ctx.fillRect(rr() * 1024, rr() * 1024, 0.8, 0.8);
    }
  }
  const DZ = 3; // derz genişliği
  const xs = [0, BOR, BOR + 224, BOR + 448, BOR + 672, 1024 - BOR, 1024];
  const rr = S.rng(1010);
  const gT = gurultu(90, 60);
  for (let a = 0; a < xs.length - 1; a++) {
    for (let b = 0; b < xs.length - 1; b++) {
      const x0 = xs[a] + (a === 0 ? 1 : DZ / 2);
      const x1 = xs[a + 1] - (a === xs.length - 2 ? 1 : DZ / 2);
      const y0 = xs[b] + (b === 0 ? 1 : DZ / 2);
      const y1 = xs[b + 1] - (b === xs.length - 2 ? 1 : DZ / 2);
      const w = x1 - x0;
      const h = y1 - y0;
      const yol = new Path2D();
      yol.roundRect(x0, y0, w, h, 2.2);
      // çininin derze düşen gölgesi (ışık sağ üstten)
      ctx.save();
      ctx.fillStyle = 'rgba(70,60,45,0.35)';
      ctx.filter = 'blur(1.2px)';
      ctx.translate(-1.4, 1.6);
      ctx.fill(yol);
      ctx.restore();
      ctx.save();
      ctx.clip(yol);
      // hafif kayık baskı (çiniler ayrı ayrı boyanır)
      const dx = (rr() - 0.5) * 1.6;
      const dy = (rr() - 0.5) * 1.6;
      ctx.drawImage(TAS, (x0 + dx) * 2, (y0 + dy) * 2, w * 2, h * 2, x0, y0, w, h);
      // her çininin pişirimden gelen ton farkı
      const ton = rr();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = ton < 0.5 ? `rgba(236,232,216,${0.35 + ton * 0.3})` : `rgba(222,232,236,${0.28 + (ton - 0.5) * 0.3})`;
      ctx.fillRect(x0, y0, w, h);
      ctx.globalCompositeOperation = 'source-over';
      // sır parlaması: sağ üstten genel ışık + pencere yansıması
      const gr = ctx.createLinearGradient(x1, y0, x0, y1);
      gr.addColorStop(0, 'rgba(255,255,255,0.20)');
      gr.addColorStop(0.45, 'rgba(255,255,255,0.03)');
      gr.addColorStop(1, 'rgba(0,0,0,0.04)');
      ctx.fillStyle = gr;
      ctx.fillRect(x0, y0, w, h);
      const yx = x0 + w * (0.62 + rr() * 0.12);
      const yy = y0 + h * (0.12 + rr() * 0.08);
      const yr = Math.min(w, h) * 0.28;
      const rg = ctx.createRadialGradient(yx, yy, 0, yx, yy, yr);
      rg.addColorStop(0, 'rgba(255,255,255,0.32)');
      rg.addColorStop(0.5, 'rgba(255,255,255,0.10)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x0, y0, w, h);
      // keskince bir pencere yansıması (sırrın camsı parlaklığı)
      ctx.save();
      ctx.translate(yx, yy);
      ctx.rotate(-0.5);
      const sw = Math.min(w, h) * 0.18;
      const lg = ctx.createLinearGradient(-sw, 0, sw, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(0.3, 'rgba(255,255,255,0.32)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.5)');
      lg.addColorStop(0.7, 'rgba(255,255,255,0.32)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lg;
      ctx.filter = 'blur(1.6px)';
      ctx.fillRect(-sw, -sw * 0.32, sw * 2, sw * 0.64);
      // ikinci, ince yansıma çizgisi
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-sw * 0.8, sw * 0.42, sw * 1.6, sw * 0.1);
      ctx.filter = 'none';
      ctx.restore();
      // sırrın kenarlarda incelmesi: kenar boyunca hafif koyu, üst-sağ kenarda ışık
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = 'rgba(90,80,60,0.16)';
      ctx.stroke(yol);
      ctx.beginPath();
      ctx.moveTo(x0 + 3, y0 + 1.2);
      ctx.lineTo(x1 - 1.2, y0 + 1.2);
      ctx.lineTo(x1 - 1.2, y1 - 3);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      // iğne delikleri
      const adet = Math.round((w * h) / 4500);
      for (let i = 0; i < adet; i++) {
        const px = x0 + 4 + rr() * (w - 8);
        const py = y0 + 4 + rr() * (h - 8);
        const pr = 0.45 + rr() * 0.6;
        ctx.beginPath();
        ctx.arc(px + 0.3, py - 0.3, pr + 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(60,55,50,0.55)';
        ctx.fill();
      }
      ctx.restore();
    }
  }

  SAHNE.hazir();
</script>
