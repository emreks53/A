<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-046 Spatula Resmi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #7a4424; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-046 Spatula Resmi — boya fırçayla değil, mala biçimli spatulayla sürülür: her vuruş düz, keskin kenarlı,
// üstü pürüzsüz kalın bir boya levhasıdır. Spatulada yarım karışmış iki renk levhanın içinde damarlar hâlinde
// akar; levhanın yan kenarlarında ve spatulanın kalktığı uçta ince boya sırtları kalır. Levhalar köşeli
// yüzler (faset) oluşturur; sağ üstten gelen ışık sırtlarda parlar. Kıl izi yoktur.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Tohumlu değer gürültüsü (256 periyotlu, yumuşak). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32Array). */
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, r), w, h, r), w, h, r);

  // ------------------------------------------------------------ bölge haritası (istenen ölçekte)
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(olcek, cicek) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    SAHNE.ciz(g, { bolge: true, cicek: cicek !== false });
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Uint8Array(w * w), onb = new Map();
    for (let i = 0; i < w * w; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      out[i] = b;
    }
    return out;
  }
  /** Bir Path2D listesini (1024 koordinatında) olcek çözünürlüğünde 0..1 maskeye çevirir. */
  function maske(olcek, ciz) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff';
    ciz(g);
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Float32Array(w * w);
    for (let i = 0; i < w * w; i++) out[i] = v[i * 4 + 3] / 255;
    return out;
  }

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeRt = new Float32Array(W), kubbeDrt = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeRt[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDrt[y] = (kubbeRt[y + 1] - kubbeRt[y - 1]) / 2;
  kubbeDrt[300] = kubbeDrt[301] * 1.3; kubbeDrt[555] = kubbeDrt[554];
  function kubbeR(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeRt[555] : kubbeRt[i] * (1 - f) + kubbeRt[i + 1] * f; }
  function kubbeDr(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeDrt[555] : kubbeDrt[i] * (1 - f) + kubbeDrt[i + 1] * f; }
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(0.5, kubbeR(y)), -1, 1);
  /** Kubbe yüzey normali [nx, ny, nz] (ekran: x sağ, y aşağı, z izleyiciye). */
  function kubbeNormal(x, y) {
    const u = kubbeU(x, y), c = Math.sqrt(Math.max(0, 1 - u * u)), dr = kubbeDr(y), l = Math.hypot(u, dr, c) || 1;
    return [u / l, -dr / l, c / l];
  }
  function kubbeIsik(x, y) { const n = kubbeNormal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  /** Kubbenin minareye düşen gölgesi (minarenin sağ alt kısmı kubbenin arkasında kalır). */
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const BULUTLAR = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];

  const S = 2, W2 = W * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(4646);
  const nA = gurultu(21), nB = gurultu(22), nC = gurultu(23), nD = gurultu(24), nE = gurultu(25);

  // ------------------------------------------------------------ bölgeler (bitkisiz) ve yerleştirme sınıfları
  const BOL = bolgeDizisi(1, false);
  const bAt = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];
  // 1 gök, 2 kubbe, 3 kasnak, 4 kaide, 5 minare, 8 yer
  const CLS = new Uint8Array(W * W);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const b = ADLAR[BOL[y * W + x]];
    let c = 1;
    if (b === 'kubbe') c = 2;
    else if (b === 'kasnak') c = 3;
    else if (b === 'kaide') c = 4;
    else if (b === 'minare') c = 5;
    else if (b === 'zemin') c = 8;
    else if (b === 'pencere') c = y >= 555 && y < 692 && x > 330 && x < 790 ? 3 : y >= 704 && x > 300 ? 4 : 5;
    else if (b === 'altin') c = 1;
    CLS[y * W + x] = c;
  }
  const sAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= W ? 0 : CLS[Math.round(y) * W + Math.round(x)] || CLS[(y | 0) * W + (x | 0)]);

  // ------------------------------------------------------------ hedef tablo (cesur, doygun renkler)
  const TR = new Float32Array(W * W), TG = new Float32Array(W * W), TB = new Float32Array(W * W);
  const RAMPA = {
    gok: [[0, [22, 46, 150]], [0.28, [34, 88, 188]], [0.55, [62, 146, 212]], [0.78, [130, 196, 214]], [0.92, [236, 214, 170]], [1, [246, 190, 120]]],
    kubbe: [[0, [6, 34, 44]], [0.2, [8, 66, 66]], [0.42, [14, 116, 74]], [0.62, [38, 158, 64]], [0.8, [128, 200, 60]], [0.93, [214, 232, 110]], [1, [250, 246, 190]]],
    kasnak: [[0, [6, 30, 38]], [0.3, [10, 60, 56]], [0.6, [22, 108, 66]], [0.85, [70, 160, 64]], [1, [150, 200, 80]]],
    tas: [[0, [92, 78, 140]], [0.28, [150, 122, 160]], [0.5, [214, 170, 150]], [0.72, [246, 214, 168]], [0.9, [254, 240, 206]], [1, [255, 252, 238]]],
    altin: [[0, [110, 56, 10]], [0.45, [214, 140, 26]], [0.78, [255, 214, 80]], [1, [255, 250, 196]]],
    yer: [[0, [150, 72, 30]], [0.5, [212, 128, 46]], [1, [242, 184, 84]]],
    yesil: [[0, [6, 26, 40]], [0.35, [14, 60, 52]], [0.62, [40, 108, 50]], [0.85, [100, 150, 50]], [1, [170, 184, 60]]],
  };
  const GLOW = [[0, [255, 252, 226]], [0.16, [255, 240, 160]], [0.34, [255, 218, 120]], [0.5, [250, 216, 168]], [0.68, [172, 214, 236]], [1, [96, 160, 222]]];
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, c = CLS[i], b = ADLAR[BOL[i]];
    let col;
    if (c === 1) {
      const t = y / 800 + (nA(x / 160, y / 110) - 0.5) * 0.16;
      col = rampa(RAMPA.gok, t);
      col = mixc(col, [18, 30, 120], 0.3 * sstep(420, 0, x) * sstep(520, 0, y));
      const dd = Math.hypot(x - 880, y - 140) * (0.9 + 0.2 * nC(x / 50, y / 50));
      col = mixc(col, rampa(GLOW, dd / 250), sstep(270, 150, dd));
    } else if (c === 2) {
      let l = kubbeIsik(x, y);
      l = l * 1.05 + 0.1 * sstep(505, 555, y) * sstep(0.1, -0.7, kubbeU(x, y));
      col = rampa(RAMPA.kubbe, clamp(l, 0, 1));
    } else if (c === 3) {
      const ust = y < 610;
      let l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.85 : 1);
      if (ust && y < 568) l *= 0.5 + 0.5 * sstep(555, 568, y);
      if (!ust && y < 620) l *= 0.55 + 0.45 * sstep(610, 620, y);
      col = rampa(RAMPA.kasnak, l);
    } else if (c === 4) {
      let l = 0.48 + 0.48 * clamp((x - 300) / 520, 0, 1);
      if (y < 704) l = 0.97; else if (y < 716) l *= 0.55 + 0.45 * sstep(704, 716, y);
      col = rampa(RAMPA.tas, l);
    } else if (c === 5) {
      let l = silindirIsik(x, 300, minareYari(y));
      if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) l *= 0.55;
      l *= 1 - 0.6 * minareGolge(x, y);
      col = rampa(RAMPA.tas, l * 0.96);
    } else {
      // yer: ufukta aşı boyası şerit, önde koyu yeşil yaprak yatağı
      const yer = 828 + (fbm(nB, x / 60, 3, 3) - 0.5) * 50;
      if (y < yer) col = rampa(RAMPA.yer, clamp(1 - (y - 800) / 40 + (nC(x / 30, y / 10) - 0.5) * 0.5, 0, 1));
      else {
        const t = fbm(nA, x / 36, y / 36, 3);
        col = rampa(RAMPA.yesil, clamp(t * 1.3 - 0.15 + 0.2 * sstep(870, 820, y), 0, 1));
        col = mixc(col, [196, 110, 40], 0.5 * sstep(0.6, 0.72, fbm(nC, x / 70, y / 50, 3)));
      }
    }
    TR[i] = col[0]; TG[i] = col[1]; TB[i] = col[2];
  }
  // bulutlar: hedefte sıcak beyaz kütleler
  for (const [bx, by, bs] of BULUTLAR) {
    const rb = SAHNE.rng(bx * 7 + by);
    for (let k = 0; k < 9; k++) {
      const cx = bx + (rb() - 0.5) * 140 * bs, cy = by + (rb() - 0.5) * 26 * bs, rr = (22 + rb() * 24) * bs;
      for (let y = Math.max(0, cy - rr) | 0; y < Math.min(W, cy + rr); y++) for (let x = Math.max(0, cx - rr * 1.6) | 0; x < Math.min(W, cx + rr * 1.6); x++) {
        const i = y * W + x; if (CLS[i] !== 1) continue;
        const d = Math.hypot((x - cx) / 1.6, y - cy) / rr; if (d > 1) continue;
        const a = 0.75 * sstep(1, 0.55, d), alt = sstep(cy - rr * 0.3, cy + rr, y);
        const cc = mixc([255, 250, 236], [196, 176, 214], alt * 0.75);
        TR[i] = lerp(TR[i], cc[0], a); TG[i] = lerp(TG[i], cc[1], a); TB[i] = lerp(TB[i], cc[2], a);
      }
    }
  }
  const hedef = (x, y) => { const i = clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1); return [TR[i], TG[i], TB[i]]; };

  // ------------------------------------------------------------ boya yüzeyi: renk + yükseklik (2048)
  const CR = new Float32Array(N2), CG = new Float32Array(N2), CB = new Float32Array(N2), H = new Float32Array(N2);
  {
    // sıcak siena astar, üstüne ince sıyrılmış hedef renk; bez dokusu
    const bR = bulanik3(TR, W, W, 3), bG = bulanik3(TG, W, W, 3), bB = bulanik3(TB, W, W, 3);
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x, j = (y >> 1) * W + (x >> 1);
      const dok = 0.5 + 0.25 * Math.sin(x * 1.3) * Math.sin(y * 1.3) + 0.25 * (nE(x * 0.6, y * 0.6) - 0.5);
      const t = 0.5 + 0.35 * nC(x / 90, y / 90);
      CR[i] = lerp(bR[j], 168, t * 0.6) * (0.92 + 0.12 * dok);
      CG[i] = lerp(bG[j], 82, t * 0.6) * (0.92 + 0.12 * dok);
      CB[i] = lerp(bB[j], 36, t * 0.6) * (0.92 + 0.12 * dok);
      H[i] = dok * 0.18;
    }
  }

  /**
   * Spatula levhası. 1024 koordinatında: x,y merkez; a sürme yönü; L boy; G genişlik; c1/c2 iki renk.
   * sekil 0: dörtgen (uçlar eğik/sivri olabilir), 1: yaprak (iki ucu sivri), 2: taç yaprağı (dipte dar, uçta yuvarlak).
   */
  function levha(s) {
    const ca = Math.cos(s.a), sa = Math.sin(s.a), hl = s.L / 2, hw = s.G / 2;
    const sk1 = s.sk1 || 0, sk2 = s.sk2 || 0, pk1 = s.pk1 || 0, pk2 = s.pk2 || 0, taper = s.taper || 0, sekil = s.sekil || 0;
    const t = s.t == null ? 1 : s.t, rg = s.rg == null ? 0.7 : s.rg, re = s.re == null ? 1.0 : s.re, keep = s.keep == null ? 0.06 : s.keep;
    const tu = s.tu || 0, tv = s.tv || 0, sf = s.sf || 0.3, th = s.th == null ? 0.5 : s.th, so = s.so || 0, kenar = s.kenar == null ? 0.5 : s.kenar;
    const c1 = s.c1, c2 = s.c2 || s.c1, c3 = s.c3, so2 = so * 1.7 + 3, bow = s.bow || 0, fac = s.fac || 0, atla = s.atla || 0, surt = s.surt || 0;
    const ext = hl * (1 + Math.max(Math.abs(sk1), Math.abs(sk2), pk1, pk2)) + hw * (1 + Math.abs(sk1) + Math.abs(sk2) + pk1 + pk2) + 3;
    const x0 = Math.max(0, Math.floor((s.x - ext) * S)), x1 = Math.min(W2 - 1, Math.ceil((s.x + ext) * S));
    const y0 = Math.max(0, Math.floor((s.y - ext) * S)), y1 = Math.min(W2 - 1, Math.ceil((s.y + ext) * S));
    const inv = 1 / S;
    for (let py = y0; py <= y1; py++) {
      const Y = (py + 0.5) * inv - s.y;
      for (let px = x0; px <= x1; px++) {
        const X = (px + 0.5) * inv - s.x;
        const u = X * ca + Y * sa, v0 = -X * sa + Y * ca;
        if (u < -ext || u > ext) continue;
        const v = v0 - bow * hw * (u / hl) * (u / hl);
        let hwu, uS, uE;
        const tt = (u / hl + 1) * 0.5;
        if (sekil === 0) { hwu = hw * (1 - taper * tt); uS = -hl + sk1 * v + pk1 * Math.abs(v); uE = hl + sk2 * v - pk2 * Math.abs(v); }
        else if (sekil === 1) { const q = u / hl; hwu = q <= -1 || q >= 1 ? 0 : hw * Math.pow(1 - q * q, 0.6); uS = -hl; uE = hl; }
        else { const q = clamp(tt, 0, 1); hwu = hw * (0.18 + 0.82 * Math.sin(Math.min(1, q * 1.25) * Math.PI / 2)) * (q > 0.78 ? Math.sqrt(Math.max(0, 1 - ((q - 0.78) / 0.22) ** 2)) : 1); uS = -hl; uE = hl; }
        const vs = v > 0; // v>0 yanı: sıkışıp taşan, sırtlı kenar; v<0 yanı: spatula ağzının keskin kenarı
        const dSide = Math.abs(v) - hwu, dS = uS - u, dE = u - uE;
        let d = Math.max(dSide, dS, dE);
        if (d > 5) continue;
        if (d > -5) {
          if (dE >= dSide && dE >= dS) d += (nD(v * 0.55 + so, so2) - 0.5) * kenar * 3 + (nC(v * 0.16 + so2, so) - 0.5) * kenar * 7;
          else if (dS >= dSide) d += (nD(v * 0.4 + so2, so) - 0.5) * kenar * 1.2;
          else d += (nD(u * 0.35 + so, v * 0.3 + so2) - 0.5) * kenar * (vs ? 2.4 : 0.5);
        }
        let cov = clamp(0.5 - d * S, 0, 1);
        if (cov <= 0) continue;
        const i = py * W2 + px;
        if (atla > 0) {
          // hafif basınçla sürülen spatula boyayı yalnız alttaki tepelere bırakır; boya sona doğru tükenir
          const q = clamp(H[i] * 0.3, 0, 0.55) + 0.6 * nE(px * 0.23 + so, py * 0.23 + so2);
          const thr = atla * sstep(0.1, 1, tt);
          cov *= sstep(thr - 0.05, thr + 0.05, q);
          if (cov <= 0.01) continue;
        }
        // iki renk damarı: sürme yönüne paralel, keskin geçişli
        const st = nA(v * sf + so, u * 0.022 + so2);
        const m = sstep(th - 0.06, th + 0.06, st);
        let r = c1[0] + (c2[0] - c1[0]) * m, g = c1[1] + (c2[1] - c1[1]) * m, b = c1[2] + (c2[2] - c1[2]) * m;
        if (c3) { const m3 = sstep(0.7, 0.76, nB(v * sf * 1.7 + so2, u * 0.03 + so)); r += (c3[0] - r) * m3; g += (c3[1] - g) * m3; b += (c3[2] - b) * m3; }

    levha({ x: 293, y: 178, a: -Math.PI / 2, L: 50, G: 26, sekil: 1, c1: [190, 160, 180], c2: [230, 210, 200], t: 1.4, rg: 0.7, re: 0.8, sf: 0.3, th: 0.5, so: R() * 99, kenar: 0.2 });
    levha({ x: 305, y: 180, a: -Math.PI / 2 - 0.12, L: 44, G: 18, sekil: 1, c1: [255, 246, 226], c2: [250, 220, 190], t: 1.6, rg: 0.8, re: 0.9, sf: 0.3, th: 0.55, so: R() * 99, kenar: 0.2 });
  }

  // ------------------------------------------------------------ alemler: altın levhacıklar, hilal spatula ucuyla
  function alemLevha(a, sc) {
    const al = (x, l) => rampa(RAMPA.altin, clamp(l, 0, 1));
    const y = a.yaka;
    levha({ x: y.cx, y: y.cy, a: 0, L: y.rx * 2, G: y.ry * 1.6, sekil: 1, c1: al(0, 0.55), c2: al(0, 0.95), t: 1.6, rg: 0.6, re: 0.6, sf: 0.6, th: 0.5, so: R() * 99, kenar: 0.15 });
    const c = a.cubuk;
    levha({ x: (c.x1 + c.x2) / 2, y: (c.y1 + c.y2) / 2, a: -Math.PI / 2, L: c.y2 - c.y1, G: Math.max(2.4, c.x2 - c.x1), c1: al(0, 0.5), c2: al(0, 0.85), t: 1.4, rg: 0.4, re: 0.4, sf: 1.2, th: 0.5, so: R() * 99, kenar: 0.1 });
    for (const k of a.kureler) {
      levha({ x: k.cx, y: k.cy, a: 0, L: k.r * 2.1, G: k.r * 2, sekil: 1, c1: al(0, 0.5), c2: al(0, 1), t: 1.7, rg: 0.6, re: 0.6, sf: 2.2 / sc, th: 0.45, so: R() * 99, kenar: 0.1 });
      levha({ x: k.cx + k.r * 0.35, y: k.cy - k.r * 0.3, a: -0.6, L: k.r * 0.9, G: k.r * 0.5, sekil: 1, c1: [255, 250, 210], t: 2.0, rg: 0.3, re: 0.3, sf: 1, so: R() * 99, kenar: 0.1 });
    }
  }
  const alemD = SAHNE.alemParcalari(560, 300, 1), alemM = SAHNE.alemParcalari(300, 146, 0.62);
  alemLevha(alemD, 1); alemLevha(alemM, 0.62);
  {
    // hilaller: maske boyası (kalın, kenarı sırtlı)
    const hm = maske(S, (g) => { for (const a of [alemD, alemM]) g.fill(new Path2D(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R))); });
    const hb = bulanik3(hm, W2, W2, 2);
    for (let y = 70 * S; y < 230 * S; y++) for (let x = 260 * S; x < 600 * S; x++) {
      const i = y * W2 + x, m = hm[i]; if (m <= 0) continue;
      const cx = x < 430 * S ? 300 : 560, l = clamp(0.5 + (x / S - cx) / 20, 0, 1);
      const c = rampa(RAMPA.altin, l);
      CR[i] += (c[0] - CR[i]) * m; CG[i] += (c[1] - CG[i]) * m; CB[i] += (c[2] - CB[i]) * m;
      H[i] += (H[i] * 0.3 + 1.6 + 1.5 * (1 - hb[i]) - H[i]) * m;
    }
  }

  // ------------------------------------------------------------ bitkiler: sap, yaprak, tomurcuk, çiçek — her biri tek spatula basışı
  const B = SAHNE.bitki;
  for (const s of B.saplar) for (let j = 0; j < s.length - 1; j += 2) {
    const [xa, ya] = s[j], [xb, yb] = s[Math.min(s.length - 1, j + 2)];
    levha({ x: (xa + xb) / 2, y: (ya + yb) / 2, a: Math.atan2(yb - ya, xb - xa), L: Math.hypot(xb - xa, yb - ya) + 3, G: 4, c1: [40, 92, 46], c2: [120, 160, 60], t: 1.3, rg: 0.4, re: 0.5, sf: 0.8, th: 0.6, so: R() * 99, kenar: 0.3 });
  }
  const YAPRAK = [[18, 70, 50], [34, 110, 56], [76, 146, 50], [12, 64, 72], [110, 170, 60]];
  for (const y of B.yapraklar) {
    const L = y.uzunluk, cx = y.x + Math.cos(y.aci) * L * 0.5, cy = y.y + Math.sin(y.aci) * L * 0.5;
    const isik = clamp(0.5 + 0.5 * Math.cos(y.aci + 0.75), 0, 1);
    const c1 = oynat(mixc(YAPRAK[(R() * 3) | 0], [150, 190, 70], isik * 0.35), 0.15, 10);
    const c2 = oynat(R() < 0.5 ? [200, 210, 80] : [10, 54, 70], 0.1, 10);
    levha({ x: cx, y: cy, a: y.aci, L, G: L * 0.44, sekil: 1, c1, c2, t: 1.5, rg: 0.8, re: 0.6, surt: 0.35, sf: 0.08 + R() * 0.08, th: 0.45 + R() * 0.25, so: R() * 99, bow: (R() - 0.5) * 0.6, tu: (R() - 0.5) * 0.4, tv: (R() - 0.5) * 0.8, kenar: 0.5 });
  }
  for (const t of B.tomurcuklar) levha({ x: t.x + Math.cos(t.aci) * t.r * 0.35, y: t.y + Math.sin(t.aci) * t.r * 0.35, a: t.aci, L: t.r * 2.4, G: t.r * 1.6, sekil: 1, c1: [236, 120, 150], c2: [252, 200, 210], t: 1.6, rg: 0.6, re: 0.6, sf: 0.6, th: 0.5, so: R() * 99, kenar: 0.3 });
  for (const c of B.cicekler) {
    for (let k = 0; k < 5; k++) {
      const a = c.aci + (k * Math.PI * 2) / 5 + (R() - 0.5) * 0.15;
      const isik = clamp(0.5 + 0.5 * Math.cos(a + 0.75), 0, 1); // sağ üste bakan taç yaprak aydınlık
      const c1 = mixc([196, 186, 226], [255, 254, 248], 0.35 + isik * 0.65);
      const c2 = R() < 0.6 ? [246, 170, 196] : [255, 236, 170];
      // iki basış: önce gölge tonu geniş levha, sonra ışık yanına kayık, daha dar beyaz levha (köşeli yüzler)
      levha({ x: c.x + Math.cos(a) * c.r * 0.52, y: c.y + Math.sin(a) * c.r * 0.52, a, L: c.r * 1.08, G: c.r * 0.86, sekil: 2, c1: mixc(c1, [180, 168, 214], 0.35), c2, t: 1.6, rg: 1.0, re: 1.6, surt: 0.1, sf: 0.16 * (30 / c.r), th: 0.66, so: R() * 99, tv: (R() - 0.5) * 0.6, kenar: 0.7 });
      const ox = -Math.sin(a) * c.r * 0.1 * (Math.sin(a + 0.75) > 0 ? -1 : 1);
      levha({ x: c.x + Math.cos(a) * c.r * 0.56 + ox, y: c.y + Math.sin(a) * c.r * 0.56 + Math.cos(a) * c.r * 0.1 * (Math.sin(a + 0.75) > 0 ? -1 : 1), a: a + (R() - 0.5) * 0.25, L: c.r * 0.92, G: c.r * 0.5, sekil: 2, c1, c2: [255, 255, 252], t: 2.0, rg: 1.1, re: 1.8, sf: 0.2 * (30 / c.r), th: 0.5, so: R() * 99, tv: (R() - 0.5) * 0.8, kenar: 0.6 });
    }
    // göbek: üç küçük spatula dokunuşu (gölgede koyu turuncu, ortada sarı, ışıkta açık limon), çevresinde düzensiz ercik noktaları
    levha({ x: c.x - c.r * 0.05, y: c.y + c.r * 0.05, a: R() * 3, L: c.r * 0.44, G: c.r * 0.36, sekil: 1, c1: [226, 128, 24], c2: [240, 150, 30], t: 2.0, rg: 0.8, re: 0.9, sf: 0.12, th: 0.5, so: R() * 99, kenar: 0.6 });
    levha({ x: c.x + c.r * 0.02, y: c.y - c.r * 0.02, a: R() * 3, L: c.r * 0.34, G: c.r * 0.26, sekil: 1, c1: [255, 196, 36], c2: [250, 176, 30], t: 2.4, rg: 0.9, re: 1.0, sf: 0.1, th: 0.5, so: R() * 99, kenar: 0.6 });
    levha({ x: c.x + c.r * 0.07, y: c.y - c.r * 0.08, a: R() * 3, L: c.r * 0.16, G: c.r * 0.12, sekil: 1, c1: [255, 238, 130], t: 2.8, rg: 0.6, re: 0.6, sf: 0.1, so: R() * 99, kenar: 0.5 });
    const ne = 5 + ((R() * 4) | 0);
    for (let k = 0; k < ne; k++) {
      const a = R() * Math.PI * 2, rr = c.r * (0.2 + R() * 0.13);
      levha({ x: c.x + Math.cos(a) * rr, y: c.y + Math.sin(a) * rr, a: R() * 3, L: Math.max(3, c.r * (0.06 + R() * 0.06)), G: Math.max(2.4, c.r * 0.06), sekil: 1, c1: R() < 0.5 ? [170, 70, 20] : [200, 104, 26], t: 2.4, rg: 0.3, re: 0.3, sf: 0.2, so: R() * 99, kenar: 0.3 });
    }
  }

  // ------------------------------------------------------------ ışık: sırtlar sağ üstten parlar, düz üstler pürüzsüz
  {
    const img = ctx.createImageData(W2, W2), d = img.data;
    const L3 = (() => { const v = [0.55, -0.62, 0.56], l = Math.hypot(...v); return v.map((c) => c / l); })();
    const Hv = (() => { const v = [L3[0], L3[1], L3[2] + 1], l = Math.hypot(...v); return v.map((c) => c / l); })();
    const k = 1.35;
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x;
      const gx = (H[y * W2 + Math.min(W2 - 1, x + 1)] - H[y * W2 + Math.max(0, x - 1)]) * k;
      const gy = (H[Math.min(W2 - 1, y + 1) * W2 + x] - H[Math.max(0, y - 1) * W2 + x]) * k;
      const nl = 1 / Math.sqrt(gx * gx + gy * gy + 1), nx = -gx * nl, ny = -gy * nl, nz = nl;
      const dif = nx * L3[0] + ny * L3[1] + nz * L3[2];
      const sh = clamp(1 + 0.95 * (dif - L3[2]), 0.35, 1.5);
      const nh = Math.max(0, nx * Hv[0] + ny * Hv[1] + nz * Hv[2]);
      let sp = Math.pow(nh, 48) * 0.6;
      sp += Math.pow(nh, 10) * 0.05;
      d[i * 4] = clamp(CR[i] * sh + sp * 255, 0, 255);
      d[i * 4 + 1] = clamp(CG[i] * sh + sp * 250, 0, 255);
      d[i * 4 + 2] = clamp(CB[i] * sh + sp * 236, 0, 255);
      d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
