<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-205 Akdeniz Öğle Işığı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ===================================================================== j1 yağlıboya motoru
// Ortak yardımcılar: sahne geometrisinin elle çizilmiş (titrek) yolları, ışık modeli (kubbe dönel yüzey,
// silindir kasnak ve minare), fırça darbesi (gövde, kıllar, kuru uç, boya yükü), boya kabartısı ve tuval /
// keten dokusu. Görünen el izi her üslubun kendi bölümünde çizilir.
const M = (function () {
  'use strict';
  const S = SAHNE;
  const N = 2048; // iç çözünürlük (1024 koordinat × 2)
  const W = 1024;
  const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const yum = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const C = (x) => (typeof x === 'string' ? hex(x) : x);
  const kar = (a, b, t) => { a = C(a); b = C(b); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
  const css = (c, a) => {
    const r = Math.max(0, Math.min(255, c[0] | 0)), g = Math.max(0, Math.min(255, c[1] | 0)), b = Math.max(0, Math.min(255, c[2] | 0));
    return a === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a < 0 ? 0 : a > 1 ? 1 : a})`;
  };
  const acik = (c, k) => [c[0] + (255 - c[0]) * k, c[1] + (255 - c[1]) * k, c[2] + (255 - c[2]) * k];
  const koyu = (c, k) => [c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k)];
  function rampa(dur) {
    const d = dur.map(([t, c]) => [t, C(c)]);
    return function (t) {
      if (t <= d[0][0]) return d[0][1].slice();
      for (let i = 1; i < d.length; i++) if (t <= d[i][0]) return kar(d[i - 1][1], d[i][1], (t - d[i - 1][0]) / (d[i][0] - d[i - 1][0]));
      return d[d.length - 1][1].slice();
    };
  }
  const norm = (v) => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
  const nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  let L = norm([0.45, 0.55, 0.7]); // ışık: sağ üst önden (x sağa, y yukarı, z bakana)
  function isikKur(v) { L = norm(v); }

  function gurultu(tohum) {
    const r = S.rng(tohum), Mm = 256, T = new Float32Array(Mm * Mm);
    for (let i = 0; i < Mm * Mm; i++) T[i] = r();
    const n = function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * Mm + x0], b = T[y0 * Mm + x1], c = T[y1 * Mm + x0], d = T[y1 * Mm + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    n.fbm = function (x, y, o) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < (o || 3); i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 31.7; y = ny + 11.3; a *= 0.5; }
      return s / t;
    };
    return n;
  }

  // ------------------------------------------------------------ tuvaller
  function anaTuval(el) {
    el.width = N; el.height = N;
    const g = el.getContext('2d', { willReadFrequently: true });
    g.setTransform(2, 0, 0, 2, 0, 0);
    return g;
  }
  function katman(w, h) {
    const c = S.yeniTuval(w || N, h || N);
    const g = c.getContext('2d', { willReadFrequently: true });
    if (!w) g.setTransform(2, 0, 0, 2, 0, 0);
    return [c, g];
  }

  // ------------------------------------------------------------ geometri: nokta dizileri
  function kub(p0, p1, p2, p3, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  }
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
  function kemer(x, y, w, h, n) {
    n = n || 10;
    const l = x - w / 2, r = x + w / 2, b = y + h, s = y + Math.min(h, w * 0.62);
    const a = kub([l, s], [l, s - w * 0.42], [x - w * 0.14, y + w * 0.1], [x, y], n);
    const c = kub([x, y], [x + w * 0.14, y + w * 0.1], [r, s - w * 0.42], [r, s], n);
    return [[l, b]].concat(a, c.slice(1), [[r, b]]);
  }
  function elips(cx, cy, rx, ry, aci, n) {
    n = n || 36; aci = aci || 0;
    const ca = Math.cos(aci), sa = Math.sin(aci), out = [];
    for (let i = 0; i < n; i++) { const t = (i / n) * Math.PI * 2, u = Math.cos(t) * rx, v = Math.sin(t) * ry; out.push([cx + u * ca - v * sa, cy + u * sa + v * ca]); }
    return out;
  }
  function hilal(cx, cy, R, n) {
    n = n || 24;
    const r2 = R * 0.85, d = R * 0.4;
    const yk = (r2 * r2 - R * R - d * d) / (2 * d), xk = Math.sqrt(Math.max(0, R * R - yk * yk));
    const out = [];
    const tL = Math.atan2(yk, -xk) + Math.PI * 2, tR = Math.atan2(yk, xk);
    for (let i = 0; i <= n; i++) { const t = tL + (tR - tL) * (i / n); out.push([cx + Math.cos(t) * R, cy + Math.sin(t) * R]); }
    const pR = Math.atan2(yk + d, xk), pL = Math.atan2(yk + d, -xk) + Math.PI * 2;
    for (let i = 1; i < n; i++) { const t = pR + (pL - pR) * (i / n); out.push([cx + Math.cos(t) * r2, cy - d + Math.sin(t) * r2]); }
    return out;
  }
  function kubbePts() { const p = S.kubbeNoktalari(90); return p; }
  function topuzPts(c) {
    c = c || 300;
    const a = kub([c - 22, 200], [c - 34, 182], [c - 12, 160], [c, 146], 16);
    const b = kub([c, 146], [c + 12, 160], [c + 34, 182], [c + 22, 200], 16);
    return a.concat(b.slice(1));
  }

  /** Kenarları elle çizilmiş gibi hafifçe dalgalandırır: kenarları `adim` aralıkla böler, düşük frekanslı gürültüyle iter. */
  function titrek(pts, kapali, genlik, tohum, adim) {
    adim = adim || 5; genlik = genlik === undefined ? 0.7 : genlik;
    const nz = gurultu(tohum || 11);
    const out = [];
    const n = pts.length, son = kapali ? n : n - 1;
    let s = 0;
    for (let i = 0; i < son; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const L0 = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const k = Math.max(1, Math.ceil(L0 / adim));
      const nx = L0 ? -(b[1] - a[1]) / L0 : 0, ny = L0 ? (b[0] - a[0]) / L0 : 0;
      for (let j = 0; j < k; j++) {
        const t = j / k;
        const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
        const d = (nz.fbm(s * 0.045, 3.1, 2) - 0.5) * 2 * genlik + (nz((s + 7) * 0.4, 9.7) - 0.5) * genlik * 0.5;
        out.push([x + nx * d, y + ny * d]);
        s += L0 / k;
      }
    }
    if (!kapali) out.push(pts[n - 1]);
    return out;
  }
  function yolYap(pts, kapali) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (kapali !== false) p.closePath();
    return p;
  }
  const elYolu = (pts, genlik, tohum, adim) => yolYap(titrek(pts, true, genlik, tohum, adim), true);

  /** Maske: 1024² Uint8Array (yolun içi 1). */
  function maske(yollar) {
    const [c, g] = katman(W, W);
    g.fillStyle = '#fff';
    for (const y of [].concat(yollar)) g.fill(typeof y === 'string' ? new Path2D(y) : y);
    const d = g.getImageData(0, 0, W, W).data, m = new Uint8Array(W * W);
    for (let i = 0; i < W * W; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    m.icinde = (x, y) => { const xi = x | 0, yi = y | 0; return xi >= 0 && yi >= 0 && xi < W && yi < W && m[yi * W + xi] === 1; };
    return m;
  }

  // ------------------------------------------------------------ sahne parçaları
  const P = (function () {
    const o = {};
    o.kubbe = kubbePts();
    o.kasnak = S.kasnak.map((k, i) => ({ ...k, pts: dikd(k.x1, k.y1, k.x2, k.y2), pen: S.kasnakPencereleri(i).map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) })) }));
    const K = S.kaide;
    o.kaide = { ...K, pts: dikd(K.x1, K.y1, K.x2, K.y2), kornisPts: dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), pen: K.pencereler.map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) })) };
    o.minare = S.minareParcalari().map((p) => {
      const q = { ...p };
      if (p.tip === 'poligon') q.pts = p.noktalar;
      else if (p.tip === 'korkuluk' || p.tip === 'bant') q.pts = dikd(p.x1, p.y1, p.x2, p.y2);
      else if (p.tip === 'topuz') q.pts = topuzPts(300);
      return q;
    });
    o.minarePen = S.minarePencereleri.map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) }));
    o.zikzak = S.zikzakCizgileri();
    o.alem = S.alemParcalari(560, 300, 1);
    o.minareAlem = S.alemParcalari(300, 146, 0.62);
    return o;
  })();

  /** Sahnenin mimari silueti (gökten ayırmak için). */
  function siluetYolu(genlik) {
    const p = new Path2D();
    genlik = genlik || 0;
    p.addPath(yolYap(P.kubbe));
    for (const k of P.kasnak) p.addPath(yolYap(k.pts));
    p.addPath(yolYap(P.kaide.pts)); p.addPath(yolYap(P.kaide.kornisPts));
    for (const m of P.minare) if (m.pts) p.addPath(yolYap(m.pts));
    return p;
  }

  // ------------------------------------------------------------ kubbe profili ve normaller
  const KP = (function () {
    const p = S.kubbeProfili(2000);
    const adim = 0.25, y0 = 299, n = Math.ceil((556 - y0) / adim) + 1;
    const R = new Float32Array(n), SL = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const y = y0 + i * adim;
      if (y <= 300) { R[i] = 0; SL[i] = -10; continue; }
      if (y >= 555) { R[i] = 200; SL[i] = 0; continue; }
      while (j < p.length - 2 && p[j + 1].y > y) j++;
      while (j > 0 && p[j].y < y) j--;
      const a = p[j], b = p[j + 1];
      const t = (a.y - y) / (a.y - b.y || 1);
      R[i] = a.r + (b.r - a.r) * t;
      SL[i] = (b.r - a.r) / (a.y - b.y || 1e-6);
    }
    return {
      r(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return R[i]; },
      s(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return SL[i]; },
    };
  })();

  /** Kubbe yüzey normali; t: dilim içindeki konum (0..1), u: -1..1 yatay konum. */
  function kubbeNormal(x, y, dilim) {
    let r = KP.r(y);
    if (r < 0.5) r = 0.5;
    let u = (x - 560) / r;
    if (u > 0.999) u = 0.999; else if (u < -0.999) u = -0.999;
    const fi = Math.asin(u);
    const s = KP.s(Math.max(301, y));
    const m = Math.hypot(1, s);
    const nr = 1 / m, nh = -s / m;
    const D = Math.PI / 16;
    let t = ((fi + Math.PI / 2) / D) % 1;
    if (t < 0) t += 1;
    const tau = (dilim || 0) * Math.cos(Math.PI * t);
    const f2 = fi + tau;
    return { n: [nr * Math.sin(f2), nh, nr * Math.cos(f2)], u, fi, t };
  }
  /** Kubbe meridyeninin ekrandaki yönü (aşağıdan yukarı). */
  function meridyen(x, y) {
    const rr = Math.max(4, KP.r(y)), u = Math.max(-1, Math.min(1, (x - 560) / rr)), s = KP.s(Math.max(301, y));
    return Math.atan2(-1, u * s);
  }
  /** Silindir normali. */
  function silindir(x, cx, R) { let u = (x - cx) / R; if (u > 0.999) u = 0.999; else if (u < -0.999) u = -0.999; return [u, 0, Math.sqrt(1 - u * u)]; }
  const dif = (n) => nokta(n, L);

  // ------------------------------------------------------------ fırça darbesi
  let YUK = null; // boya kalınlığı (kabartma) tuvali: [canvas, ctx]
  function yukKur() { YUK = katman(); YUK[1].fillStyle = '#000'; YUK[1].fillRect(0, 0, W, W); return YUK; }

  /**
   * Bir fırça darbesi. P: merkez çizgisi noktaları, w: en (1024 px), c: [r,g,b]
   * o: { a: örtücülük, govde: gövdenin payı, kil: kıl sayısı, kilK: kıl açık-koyu farkı, kilA: kıl örtücülüğü,
   *      uc: 'sivri' | 'kare' | 'yuvarlak', bas: başlangıç eni payı, yuk: boya yükü (düşük → kuru, kırık uç),
   *      kenar: kenar pürüzü, hk: kabartma (0 = yok), r: rng, ton: kıllarda karışan ikinci renk }
   */
  function darbe(g, P0, w, c, o) {
    o = o || {};
    const r = o.r || RR;
    const a = o.a === undefined ? 1 : o.a;
    // yeniden örnekleme
    const cum = [0];
    for (let i = 1; i < P0.length; i++) cum.push(cum[i - 1] + Math.hypot(P0[i][0] - P0[i - 1][0], P0[i][1] - P0[i - 1][1]));
    const Lt = Math.max(0.6, cum[cum.length - 1]);
    const adim = Math.max(0.8, Math.min(4, w * 0.3));
    const n = Math.max(3, Math.ceil(Lt / adim) + 1);
    const Q = [], T = [];
    let j = 0;
    for (let k = 0; k < n; k++) {
      const s = (k / (n - 1)) * Lt;
      while (j < cum.length - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j] || 1, f = Math.min(1, Math.max(0, (s - cum[j]) / seg));
      const A = P0[j], B = P0[Math.min(j + 1, P0.length - 1)];
      Q.push([A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f]);
    }
    for (let k = 0; k < n; k++) {
      const A = Q[Math.max(0, k - 1)], B = Q[Math.min(n - 1, k + 1)];
      const dx = B[0] - A[0], dy = B[1] - A[1], m = Math.hypot(dx, dy) || 1;
      T.push([-dy / m, dx / m]);
    }
    const uc = o.uc || 'sivri', bas = o.bas === undefined ? 0.75 : o.bas;
    const prof = (t) => {
      let s = bas + (1 - bas) * yum(0, 0.2, t);
      if (uc === 'sivri') s *= 1 - 0.8 * yum(0.55, 1, t);
      else if (uc === 'kare') s *= 1 - 0.1 * yum(0.85, 1, t);
      else if (uc === 'yuvarlak') { const e = Math.abs(t - 0.5) * 2; s *= Math.sqrt(sat(1 - Math.pow(e, 6))) * 0.85 + 0.15; }
      else if (uc === 'damla') s = (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, t * 1.25 + 0.05)));
      return s;
    };
    const kn = o.kenar === undefined ? 0.1 : o.kenar;
    // kenar pürüzü: düzleştirilmiş rastgele yürüyüş
    const sol = [], sag = [];
    let e1 = 0, e2 = 0;
    for (let k = 0; k < n; k++) {
      e1 = e1 * 0.7 + (r() - 0.5) * kn * 1.2; e2 = e2 * 0.7 + (r() - 0.5) * kn * 1.2;
      const t = k / (n - 1), hw = (w / 2) * prof(t);
      sol.push([Q[k][0] + T[k][0] * hw * (1 + e1), Q[k][1] + T[k][1] * hw * (1 + e1)]);
      sag.push([Q[k][0] - T[k][0] * hw * (1 + e2), Q[k][1] - T[k][1] * hw * (1 + e2)]);
    }
    const govde = o.govde === undefined ? 0.85 : o.govde;
    const gs = o.govdeSon === undefined ? (uc === 'sivri' ? 0.8 : 1) : o.govdeSon;
    if (govde > 0) {
      const poli = (k0, k1, al) => {
        g.fillStyle = css(c, al);
        g.beginPath();
        g.moveTo(sol[k0][0], sol[k0][1]);
        for (let k = k0 + 1; k <= k1; k++) g.lineTo(sol[k][0], sol[k][1]);
        for (let k = k1; k >= k0; k--) g.lineTo(sag[k][0], sag[k][1]);
        g.closePath();
        g.fill();
      };
      const kS = Math.max(1, Math.min(n - 1, Math.round(gs * (n - 1))));
      poli(0, kS, a * govde);
      if (kS < n - 1) poli(kS, n - 1, a * govde * 0.35);
    }
    // kıllar
    const kil = o.kil === undefined ? Math.max(2, Math.min(12, Math.round(w / 1.4))) : o.kil;
    const kilK = o.kilK === undefined ? 14 : o.kilK;
    const yk = o.yuk === undefined ? 0.8 : o.yuk;
    const kilA = o.kilA === undefined ? 0.55 : o.kilA;
    const kilUc = [];
    if (kil > 0) {
      g.lineCap = 'round'; g.lineJoin = 'round';
      const lw = Math.max(0.35, (w / kil) * (o.kilEn || 1.1));
      for (let k = 0; k < kil; k++) {
        const v = ((k + 0.5) / kil - 0.5) * 0.94 + (r() - 0.5) * 0.06;
        const d = (r() - 0.5) * 2 * kilK;
        let cc = [c[0] + d, c[1] + d, c[2] + d];
        if (o.ton && r() < (o.tonOran || 0.3)) cc = kar(cc, o.ton, 0.35 + r() * 0.4);
        const t0 = r() * 0.08, t1 = Math.min(1, 1 - (1 - yk) * (0.15 + r() * 0.8) - r() * 0.04);
        kilUc.push([v, t1]);
        g.strokeStyle = css(cc, a * kilA * (0.55 + r() * 0.6));
        g.lineWidth = lw * (0.7 + r() * 0.6);
        g.beginPath();
        const k0 = Math.floor(t0 * (n - 1)), k1 = Math.max(k0 + 1, Math.floor(t1 * (n - 1)));
        for (let q = k0; q <= k1; q++) {
          const t = q / (n - 1), hw = w * prof(t);
          const X = Q[q][0] + T[q][0] * v * hw, Y = Q[q][1] + T[q][1] * v * hw;
          if (q === k0) g.moveTo(X, Y); else g.lineTo(X, Y);
        }
        g.stroke();
      }
    }
    // kabartma
    const hk = o.hk || 0;
    if (hk > 0 && YUK) {
      const h = YUK[1];
      const base = 40 + hk * 120 * (0.85 + r() * 0.3);
      h.fillStyle = css([base, base, base], 0.9);
      h.beginPath();
      h.moveTo(sol[0][0], sol[0][1]);
      for (let k = 1; k < n; k++) h.lineTo(sol[k][0], sol[k][1]);
      for (let k = n - 1; k >= 0; k--) h.lineTo(sag[k][0], sag[k][1]);
      h.closePath();
      h.fill();
      // kenar sırtları (boya kenara itilir)
      h.lineCap = 'round';
      h.lineWidth = Math.max(0.5, w * 0.1);
      h.strokeStyle = css([base + 40 * hk, base + 40 * hk, base + 40 * hk], 0.7);
      for (const kenar of [sol, sag]) { h.beginPath(); kenar.forEach(([x, y], i) => (i ? h.lineTo(x, y) : h.moveTo(x, y))); h.stroke(); }
      // kıl olukları
      const ol = Math.max(2, Math.min(7, Math.round(w / 2.2)));
      h.lineWidth = Math.max(0.35, w / (ol * 2.6));
      for (let k = 0; k < ol; k++) {
        const v = ((k + 0.5) / ol - 0.5) * 0.85;
        const gg = base + (r() < 0.5 ? -1 : 1) * (18 + r() * 26) * hk;
        h.strokeStyle = css([gg, gg, gg], 0.8);
        h.beginPath();
        const k1 = Math.floor((0.7 + r() * 0.3) * (n - 1));
        for (let q = 0; q <= k1; q++) {
          const t = q / (n - 1), hw = w * prof(t);
          const X = Q[q][0] + T[q][0] * v * hw, Y = Q[q][1] + T[q][1] * v * hw;
          if (q === 0) h.moveTo(X, Y); else h.lineTo(X, Y);
        }
        h.stroke();
      }
      // başlangıçta boya birikintisi
      if (o.birikinti !== false) {
        const bb = base + 50 * hk;
        h.fillStyle = css([bb, bb, bb], 0.6);
        h.beginPath();
        h.ellipse(Q[1][0], Q[1][1], w * 0.42 * prof(0.05), w * 0.3, Math.atan2(T[1][0], -T[1][1]), 0, Math.PI * 2);
        h.fill();
      }
    }
    return { Q, T, sol, sag };
  }
  let RR = S.rng(5);

  /** Düz bir darbe (hafif yay ile): merkez (x,y), açı, boy, en. */
  function cizgiDarbe(x, y, aci, boy, egri, r) {
    const ca = Math.cos(aci), sa = Math.sin(aci);
    const bk = egri || 0;
    const out = [];
    for (let i = 0; i <= 6; i++) {
      const t = i / 6 - 0.5;
      const yy = bk * boy * (0.25 - t * t);
      out.push([x + ca * t * boy - sa * yy, y + sa * t * boy + ca * yy]);
    }
    return out;
  }
  /** Akış alanını izleyen darbe çizgisi. */
  function akisDarbe(x, y, yon, boy, adimS) {
    const ad = adimS || Math.max(2, boy / 8);
    const ileri = [], geri = [];
    let cx = x, cy = y, pa = yon(x, y);
    let dx = Math.cos(pa), dy = Math.sin(pa);
    for (let L0 = 0; L0 < boy / 2; L0 += ad) { const a = yon(cx, cy); let ex = Math.cos(a), ey = Math.sin(a); if (ex * dx + ey * dy < 0) { ex = -ex; ey = -ey; } cx += ex * ad; cy += ey * ad; dx = ex; dy = ey; ileri.push([cx, cy]); }
    cx = x; cy = y; dx = -Math.cos(pa); dy = -Math.sin(pa);
    for (let L0 = 0; L0 < boy / 2; L0 += ad) { const a = yon(cx, cy); let ex = Math.cos(a), ey = Math.sin(a); if (ex * dx + ey * dy < 0) { ex = -ex; ey = -ey; } cx += ex * ad; cy += ey * ad; dx = ex; dy = ey; geri.push([cx, cy]); }
    return geri.reverse().concat([[x, y]], ileri);
  }

  /**
   * Bir alanı darbelerle doldurur.
   * o: { kutu:[x1,y1,x2,y2], icinde:(x,y)=>bool, yol: Path2D kırpma, aralik, boy:[a,b], en:[a,b], yon:(x,y)=>açı,
   *      renk:(x,y,r)=>[r,g,b], egri, akis (yon alanını izle), darbe: {...darbe seçenekleri}, tohum, sira:'karisik'|'satir' }
   */
  function alan(g, o) {
    const r = S.rng(o.tohum || 1);
    const [x1, y1, x2, y2] = o.kutu || [0, 0, W, W];
    const ara = o.aralik || 8;
    const nok = [];
    for (let y = y1; y < y2; y += ara * (o.dikeyOran || 1)) for (let x = x1; x < x2; x += ara) nok.push([x + r() * ara, y + r() * ara * (o.dikeyOran || 1)]);
    if (o.sira !== 'satir') for (let i = nok.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = nok[i]; nok[i] = nok[j]; nok[j] = t; }
    g.save();
    if (o.yol) g.clip(o.yol, o.kural || 'nonzero');
    const dop = Object.assign({}, o.darbe || {});
    dop.r = r;
    const yk = !!(o.yol && YUK);
    if (yk) { YUK[1].save(); YUK[1].clip(o.yol, o.kural || 'nonzero'); }
    for (const [x, y] of nok) {
      if (o.icinde && !o.icinde(x, y)) continue;
      const boy = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
      const en = o.en[0] + r() * (o.en[1] - o.en[0]);
      const P0 = o.akis ? akisDarbe(x, y, o.yon, boy) : cizgiDarbe(x, y, o.yon(x, y, r), boy, (o.egri || 0) * (r() - 0.3), r);
      const c = o.renk(x, y, r);
      if (!c) continue;
      if (o.hkFn) dop.hk = o.hkFn(x, y, c);
      darbe(g, P0, en, c, dop);
    }
    if (yk) YUK[1].restore();
    g.restore();
  }

  // ------------------------------------------------------------ doku: tuval bezi, keten
  /**
   * Dokuma yükseklik haritası (N×N, 0..1). o: {aralik (1024 px), duzensiz (iplik kalınlık oynaması), dugum (keten düğümleri),
   *  dalga (ipliklerin kıvrımı), tohum}
   */
  function dokuma(o) {
    const nz = gurultu(o.tohum || 21), nz2 = gurultu((o.tohum || 21) + 7), nz3 = gurultu((o.tohum || 21) + 13);
    const r = S.rng((o.tohum || 21) + 3);
    const sp = (o.aralik || 3) * 2; // iç piksel
    const du = o.duzensiz || 0.2;
    // düzensiz iplik aralıkları: her ipliğin kendi eni
    function tablo() {
      const M2 = N + 64;
      const idx = new Int32Array(M2), bas = [], en = [];
      let x = -32, i = 0;
      while (x < N + 32) { let w = sp * (1 + (r() - 0.5) * 2 * du); if (r() < (o.kalin || 0)) w *= 1.45 + r() * 0.4; bas.push(x); en.push(w); x += w; i++; }
      let j = 0;
      for (let p = 0; p < M2; p++) { const X = p - 32; while (j < bas.length - 1 && bas[j] + en[j] <= X) j++; idx[p] = j; }
      return { idx, bas, en, kal: en.map(() => 1 + (r() - 0.5) * 2 * du * 0.8) };
    }
    const TX = tablo(), TY = tablo();
    const H = new Float32Array(N * N);
    const dal = (o.dalga || 0.6) * sp;
    const dug = o.dugum || 0;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const X = x + (nz(y * 0.004, x * 0.0007) - 0.5) * dal * 2;
        const Y = y + (nz2(x * 0.004, y * 0.0007) - 0.5) * dal * 2;
        const pxI = Math.max(0, Math.min(N + 63, Math.floor(X) + 32)), pyI = Math.max(0, Math.min(N + 63, Math.floor(Y) + 32));
        const ix = TX.idx[pxI], iy = TY.idx[pyI];
        const fx = (X - TX.bas[ix]) / TX.en[ix] - 0.5, fy = (Y - TY.bas[iy]) / TY.en[iy] - 0.5;
        let sx = 0, sy = 0;
        if (dug) {
          sx = Math.max(0, nz(ix * 7.3, Y * 0.01) - 0.6) * dug * 4;
          sy = Math.max(0, nz2(iy * 7.3, X * 0.01) - 0.6) * dug * 4;
        }
        const wx = 0.5 * TX.kal[ix] * (1 + sx), wy = 0.5 * TY.kal[iy] * (1 + sy);
        const hx = sat(1 - (fx * fx) / (wx * wx * 0.9));
        const hy = sat(1 - (fy * fy) / (wy * wy * 0.9));
        const ust = (ix + iy) & 1;
        const bx = Math.cos(fy * Math.PI) * 0.35 + 0.65, by = Math.cos(fx * Math.PI) * 0.35 + 0.65;
        let v = ust ? Math.max(Math.sqrt(hx) * bx, Math.sqrt(hy) * 0.55) : Math.max(Math.sqrt(hy) * by, Math.sqrt(hx) * 0.55);
        // boyanın yer yer dokuyu doldurması: düşük frekanslı görünürlük
        v *= 0.55 + 0.45 * nz3(x * 0.006, y * 0.006);
        H[y * N + x] = v;
      }
    }
    return H;
  }

  /** Yükseklik haritasını sağ üst ışıkla resme uygular. o: {guc, parilti, maske(i)->çarpan, sinir} */
  function kabartmaIsik(g, H, o) {
    o = o || {};
    const im = g.getImageData(0, 0, N, N), d = im.data;
    const lx = 0.62, ly = -0.62;
    const guc = o.guc || 1, par = o.parilti || 0, sinir = o.sinir || 0.35, golge = o.golge === undefined ? 1 : o.golge;
    const carp = o.carpan;
    for (let y = 1; y < N - 1; y++) {
      for (let x = 1; x < N - 1; x++) {
        const i = y * N + x;
        const gx = H[i + 1] - H[i - 1], gy = H[i + N] - H[i - N];
        let s = -(gx * lx + gy * ly) * guc;
        if (carp) s *= carp[i];
        if (s > sinir) s = sinir; else if (s < -sinir) s = -sinir;
        const j = i * 4;
        if (s > 0) {
          const k = s * 0.8 + (par && s > 0.1 ? (s - 0.1) * par : 0);
          d[j] += (255 - d[j]) * k; d[j + 1] += (255 - d[j + 1]) * k; d[j + 2] += (250 - d[j + 2]) * k * 0.95;
        } else {
          const k = 1 + s * golge;
          d[j] *= k; d[j + 1] *= k; d[j + 2] *= k;
        }
      }
    }
    g.putImageData(im, 0, 0);
  }
  /** Kabartma tuvalini (YUK) okuyup yumuşatılmış yükseklik dizisine çevirir. */
  function yukDizi(bul) {
    const d = YUK[1].getImageData(0, 0, N, N).data, H = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) H[i] = d[i * 4] / 255;
    if (bul) kutuBulanik(H, N, bul, 1);
    return H;
  }
  function kutuBulanik(A, Wd, r, gec) {
    const T = new Float32Array(A.length);
    for (let g = 0; g < (gec || 1); g++) {
      for (let y = 0; y < Wd; y++) {
        let s = 0; const o = y * Wd;
        for (let x = -r; x <= r; x++) s += A[o + Math.min(Wd - 1, Math.max(0, x))];
        for (let x = 0; x < Wd; x++) { T[o + x] = s / (2 * r + 1); s += A[o + Math.min(Wd - 1, x + r + 1)] - A[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < Wd; x++) {
        let s = 0;
        for (let y = -r; y <= r; y++) s += T[Math.min(Wd - 1, Math.max(0, y)) * Wd + x];
        for (let y = 0; y < Wd; y++) { A[y * Wd + x] = s / (2 * r + 1); s += T[Math.min(Wd - 1, y + r + 1) * Wd + x] - T[Math.max(0, y - r) * Wd + x]; }
      }
    }
    return A;
  }

  /** Bir yol boyunca elle çekilmiş ince çizgi (kontur fırçası): en değişken, uçları incelir. */
  function cizgi(g, pts, en, c, o) {
    o = o || {};
    const r = o.r || RR;
    const a = o.a === undefined ? 1 : o.a;
    // noktaları sık örnekle
    const Q = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const A = pts[i], B = pts[i + 1], L0 = Math.hypot(B[0] - A[0], B[1] - A[1]), k = Math.max(1, Math.ceil(L0 / 2));
      for (let j = 0; j < k; j++) Q.push([A[0] + ((B[0] - A[0]) * j) / k, A[1] + ((B[1] - A[1]) * j) / k]);
    }
    Q.push(pts[pts.length - 1]);
    const n = Q.length;
    if (n < 2) return;
    const nz = gurultu(o.tohum || ((r() * 1000) | 0));
    const tit = o.titreme === undefined ? 0.35 : o.titreme;
    g.fillStyle = css(c, a);
    const sol = [], sag = [];
    for (let k = 0; k < n; k++) {
      const A = Q[Math.max(0, k - 1)], B = Q[Math.min(n - 1, k + 1)];
      const dx = B[0] - A[0], dy = B[1] - A[1], m = Math.hypot(dx, dy) || 1;
      const tx = -dy / m, ty = dx / m;
      const t = k / (n - 1);
      const basinc = (o.uclar === false ? 1 : Math.min(1, 0.35 + t * 4, 0.35 + (1 - t) * 3.2)) * (0.75 + 0.5 * nz(k * 0.08, 1.3));
      const hw = (en / 2) * basinc;
      const off = (nz(k * 0.05, 5.1) - 0.5) * 2 * tit;
      sol.push([Q[k][0] + tx * (hw + off), Q[k][1] + ty * (hw + off)]);
      sag.push([Q[k][0] - tx * (hw - off), Q[k][1] - ty * (hw - off)]);
    }
    g.beginPath();
    g.moveTo(sol[0][0], sol[0][1]);
    for (let k = 1; k < n; k++) g.lineTo(sol[k][0], sol[k][1]);
    for (let k = n - 1; k >= 0; k--) g.lineTo(sag[k][0], sag[k][1]);
    g.closePath();
    g.fill();
  }

  /** Küçük bir boya tuşu (dab): yuvarlakça, kenarı hafif kırık, kabartmalı. */
  function tus(g, x, y, rx, ry, aci, c, o) {
    o = o || {};
    const r = o.r || RR;
    const n = Math.max(14, Math.min(48, Math.round((rx + ry) * 2))), pts = [];
    const pz = o.puruz === undefined ? 0.35 : o.puruz;
    let e = 0;
    for (let i = 0; i < n; i++) {
      e = e * (n > 20 ? 0.75 : 0.5) + (r() - 0.5) * pz * (n > 20 ? 0.5 : 1);
      const t = (i / n) * Math.PI * 2;
      const u = Math.cos(t) * rx * (1 + e), v = Math.sin(t) * ry * (1 + e);
      pts.push([x + u * Math.cos(aci) - v * Math.sin(aci), y + u * Math.sin(aci) + v * Math.cos(aci)]);
    }
    g.fillStyle = css(c, o.a === undefined ? 1 : o.a);
    g.beginPath();
    pts.forEach(([X, Y], i) => (i ? g.lineTo(X, Y) : g.moveTo(X, Y)));
    g.closePath();
    g.fill();
    if (o.hk && YUK) {
      const h = YUK[1];
      const b = 60 + o.hk * 150;
      h.fillStyle = css([b, b, b], 0.95);
      h.beginPath();
      pts.forEach(([X, Y], i) => (i ? h.lineTo(X, Y) : h.moveTo(X, Y)));
      h.closePath();
      h.fill();
      h.fillStyle = css([b + 40, b + 40, b + 40], 0.8);
      h.beginPath();
      h.ellipse(x - Math.cos(aci) * rx * 0.2, y - Math.sin(aci) * rx * 0.2, rx * 0.5, ry * 0.45, aci, 0, Math.PI * 2);
      h.fill();
    }
  }

  return {
    S, N, W, sat, yum, hex, C, kar, css, acik, koyu, rampa, norm, nokta, gurultu, isikKur, get L() { return L; },
    anaTuval, katman, kub, dikd, kemer, elips, hilal, topuzPts, titrek, yolYap, elYolu, maske, P, siluetYolu,
    KP, kubbeNormal, meridyen, silindir, dif, yukKur, get YUK() { return YUK; }, darbe, cizgiDarbe, akisDarbe, alan,
    dokuma, kabartmaIsik, yukDizi, kutuBulanik, cizgi, tus,
  };
})();

</script>
<script>
// S-205 Akdeniz Öğle Işığı — yakıcı öğle güneşinin hayalî ressamının eli: beyaz tuvalde büyük ve orta boy düz
// fırçalarla, sulu ve kalın boyayla, her biri bir düzlemi anlatan uzun tek darbeler; güneşte sıcak beyaz, gölgede
// kobalt-mor, gölge kenarlarında turkuaz yansıma; derin Akdeniz mavisi gök, kısa ve keskin öğle gölgeleri.
(function () {
  'use strict';
  const { S, P, kar, css, acik, koyu, C, rampa, sat, yum } = M;
  const N = M.N;
  const g = M.anaTuval(document.getElementById('tuval'));
  M.yukKur();
  M.isikKur([0.62, 0.55, 0.56]);
  const R = S.rng(205);
  const nz = M.gurultu(2051);

  const GUNES_AK = C('#FFFCF4');
  const SICAK_AK = C('#FBF0DA');
  const KOBALT_MOR = C('#8E8BD0');
  const TURKUAZ = C('#7FD0CF');
  // sulu, yüklü düz fırça
  const YUKLU = { a: 1, govde: 0.95, kil: 12, kilK: 18, kilA: 0.55, yuk: 0.9, uc: 'kare', bas: 0.95, kenar: 0.1, govdeSon: 0.92 };
  const yuklu = (ek) => Object.assign({}, YUKLU, ek || {});

  g.fillStyle = css(C('#FBFAF5'));
  g.fillRect(0, 0, 1024, 1024);

  // ------------------------------------------------------------ elle çizilmiş yollar
  const tY = (pts, k, a) => M.elYolu(pts, a === undefined ? 0.6 : a, 2500 + k, 6);
  const kubbeY = tY(P.kubbe, 1, 0.7);
  const kasnakY = P.kasnak.map((k, i) => tY(k.pts, 10 + i));
  const kaideY = tY(P.kaide.pts, 20);
  const kornisY = tY(P.kaide.kornisPts, 21, 0.4);
  const minY = P.minare.map((m, i) => (m.pts ? tY(m.pts, 30 + i, 0.45) : null));
  const siluet = new Path2D();
  [kubbeY, ...kasnakY, kaideY, kornisY, ...minY.filter(Boolean)].forEach((p) => siluet.addPath(p));
  const mask = (p) => M.maske(p).icinde;
  const disari = new Path2D(); disari.rect(-10, -10, 1044, 1044); disari.addPath(siluet);
  const kirp = (yol, kural, f) => { g.save(); M.YUK[1].save(); g.clip(yol, kural || 'nonzero'); M.YUK[1].clip(yol, kural || 'nonzero'); f(); g.restore(); M.YUK[1].restore(); };

  // ------------------------------------------------------------ 1. gök: derin Akdeniz mavisi, ufka doğru açık serülyen; geniş yatay darbeler
  const gokR = rampa([[0, '#2A6FC2'], [0.25, '#2F78C8'], [0.55, '#3E8FD6'], [0.82, '#4FA3E0'], [1, '#79BCE8']]);
  const gunes = S.gunes;
  const gokRenk = (x, y, r) => {
    let c = gokR(sat(y / 800 + (nz(x * 0.003, y * 0.006) - 0.5) * 0.1));
    c = kar(c, '#DDEEF6', Math.pow(sat(1 - Math.hypot(x - gunes.x, y - gunes.y) / 200), 1.6) * 0.6);
    const j = (r() - 0.5) * 16;
    return [c[0] + j, c[1] + j, c[2] + j * 0.6];
  };
  kirp(disari, 'evenodd', () => {
    M.alan(g, { kutu: [-80, -30, 1100, 815], aralik: 22, boy: [180, 340], en: [34, 46], yon: (x, y, r) => (r() - 0.5) * 0.05, renk: gokRenk, egri: 0.03, darbe: yuklu({ hk: 0.35, uc: 'sivri', bas: 0.85, govdeSon: 0.78, yuk: 0.7 }), tohum: 1 });
    M.alan(g, { kutu: [-80, -30, 1100, 815], aralik: 26, boy: [120, 260], en: [24, 34], yon: (x, y, r) => (r() - 0.5) * 0.06, renk: (x, y, r) => gokRenk(x, y, r), egri: 0.04, darbe: yuklu({ hk: 0.4, uc: 'sivri', bas: 0.85, govdeSon: 0.75, yuk: 0.65 }), tohum: 2 });
  });
  // öğle güneşi: kalın, sıcak beyaz boyayla dönen kısa darbelerden bir disk; çevresinde gök rengine karışan teğet darbeler
  kirp(disari, 'evenodd', () => {
    const gx = gunes.x, gy = gunes.y;
    M.alan(g, { kutu: [gx - 110, gy - 110, gx + 110, gy + 110], aralik: 8, boy: [24, 42], en: [11, 15], yon: (x, y) => Math.atan2(y - gy, x - gx) + Math.PI / 2, icinde: (x, y) => { const d = Math.hypot(x - gx, y - gy); return d > 32 && R() < Math.pow(sat(1 - (d - 32) / 64), 1.1); }, renk: (x, y, r) => { const d = Math.hypot(x - gx, y - gy); return kar(kar('#F4F9FA', '#E2F1F7', r()), gokRenk(x, y, r), Math.pow(sat((d - 32) / 72), 0.75)); }, darbe: yuklu({ a: 0.92, hk: 0.45, uc: 'sivri', bas: 0.8, govdeSon: 0.75, yuk: 0.7, kil: 9 }), tohum: 3 });
    M.alan(g, { kutu: [gx - 36, gy - 36, gx + 36, gy + 36], aralik: 4.5, boy: [16, 28], en: [8, 11], yon: (x, y) => Math.atan2(y - gy, x - gx) + Math.PI / 2, icinde: (x, y) => Math.hypot(x - gx, y - gy) < 29, renk: (x, y, r) => kar('#FFFBEA', '#FFF1C4', 0.25 + r() * 0.5), darbe: yuklu({ hk: 0.9, uc: 'yuvarlak', kil: 8, kilK: 8 }), tohum: 4 });
    // tek bir beyaz tül: gökte yüksekte, ince ve yatay
    for (let i = 0; i < 2; i++) {
      const y0 = 104 + i * 9 + R() * 3;
      M.darbe(g, M.cizgiDarbe(560 + i * 24, y0, -0.03, 230 - i * 50, 0.05, R), 11 - i * 3, kar('#E8F1F8', '#D2E4F2', R()), yuklu({ a: 0.55, yuk: 0.3, kil: 10, kilK: 12, uc: 'sivri', bas: 0.5, govdeSon: 0.5, r: R, hk: 0.25 }));
    }
  });

  // ------------------------------------------------------------ 2. zemin: güneşte kum, kısa kobalt-mor öğle gölgeleri

  const tasR = rampa([[0, '#8E8BD0'], [0.22, '#9C9AD8'], [0.4, '#C9C3E2'], [0.55, '#F2E9DB'], [0.75, '#FBF0DA'], [1, '#FFFCF4']]);

  alem(P.alem, 1); alem(P.minareAlem, 2);

  // minare ve kaidenin güneşli kenarında birkaç kalın, keskin beyaz vurgu (ince fırça değil, dolu boya)
  for (const [x, y1, y2, w] of [[326, 492, 692, 4], [320, 320, 434, 3.4], [314, 208, 270, 3]]) M.darbe(g, [[x, y2], [x, y1]], w, GUNES_AK, yuklu({ r: R, hk: 1, kil: 4 }));
  M.darbe(g, [[292, 693], [830, 693]], 3, GUNES_AK, yuklu({ r: R, hk: 1, kil: 4 }));

  for (const c of B.cicekler) {
    for (let i = 0; i < 5; i++) {

        const x0 = c.x + ux * c.r * 0.12, y0 = c.y + uy * c.r * 0.12;
        const x1 = c.x + ux * c.r * 0.98 - uy * off * c.r, y1 = c.y + uy * c.r * 0.98 + ux * off * c.r;
        M.darbe(g, [[x0, y0], [(x0 + x1) / 2, (y0 + y1) / 2], [x1, y1]], c.r * 0.46, ana, yuklu({ r: R, kil: 8, uc: 'yuvarlak', govdeSon: 1, hk: golgede ? 0.5 : 1 }));
      }
      if (golgede) M.darbe(g, [[c.x + ux * c.r * 0.14, c.y + uy * c.r * 0.14], [c.x + ux * c.r * 0.55, c.y + uy * c.r * 0.55]], c.r * 0.24, kar(KOBALT_MOR, '#B4B4E6', 0.45), yuklu({ r: R, kil: 5, a: 0.8, uc: 'sivri', hk: 0.4 }));
      // ışıklı yaprağın gölge kenarında ince mor
      if (!golgede && isik < 0.5) M.darbe(g, [[c.x + ux * c.r * 0.2, c.y + uy * c.r * 0.2], [c.x + ux * c.r * 0.7, c.y + uy * c.r * 0.7]], c.r * 0.18, kar(KOBALT_MOR, TURKUAZ, 0.25), yuklu({ r: R, kil: 3, a: 0.75, uc: 'sivri' }));
    }
    M.darbe(g, [[c.x - c.r * 0.13, c.y + c.r * 0.05], [c.x + c.r * 0.13, c.y - c.r * 0.05]], c.r * 0.3, C('#F0C030'), yuklu({ r: R, kil: 5, uc: 'yuvarlak', govdeSon: 1, hk: 0.9 }));
    M.tus(g, c.x - c.r * 0.07, c.y + c.r * 0.07, c.r * 0.1, c.r * 0.08, 0.5, C('#C98A20'), { r: R, a: 0.85 });
    M.tus(g, c.x + c.r * 0.07, c.y - c.r * 0.07, c.r * 0.07, c.r * 0.05, -0.5, C('#FFF2B0'), { r: R, hk: 1 });
  }

  // ------------------------------------------------------------ 5. kalın boyanın kabartısı, ince tuval
  const H = M.yukDizi(1);
  M.kabartmaIsik(g, H, { guc: 1.4, parilti: 0.5, sinir: 0.22 });
  const Dk = M.dokuma({ aralik: 2.4, duzensiz: 0.3, dugum: 0.3, tohum: 2059 });
  const carp = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) carp[i] = Math.max(0.15, 1 - H[i] * 1.8);
  M.kabartmaIsik(g, Dk, { guc: 0.15, sinir: 0.07, carpan: carp });

  SAHNE.hazir();
})();
