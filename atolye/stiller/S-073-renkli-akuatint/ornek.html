<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-073 Renkli Akuatint — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #8d8c86; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-073 Renkli Akuatint — reçine (kolofan) greniyle aşındırılmış levhadan, tek levhaya birkaç rengin
// tamponla (à la poupée) sürülmesiyle basılmış baskı. Tonlar tarama değil ince gren dokusudur; örtü
// cilasıyla (stop-out) kademe kademe aşındırılmış basamaklı ton alanları, birkaç ince asitle yedirilmiş
// çizgi, renklerin sınırda yumuşakça karışması, levha tonu, kâğıda gömülmüş levha izi ve tırtıllı kâğıt kenarı.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

'use strict';
// ------------------------------------------------------------------ ortak yardımcılar
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const P2 = (d) => new Path2D(d);

/** Tohumlu değer gürültüsü: (x, y) → [0,1]. */
function gurultuFn(tohum) {
  const r = SAHNE.rng(tohum);
  const v = new Float32Array(256);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { v[i] = r(); p[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = v[p[p[X] + Y]], b = v[p[p[X + 1] + Y]], c = v[p[p[X] + Y + 1]], d = v[p[p[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
/** Fraktal gürültü (fbm): ölçek = en kaba hücre boyu (1024 koordinatında). */
function fbmFn(tohum, oktav, olcek, kazanc) {
  kazanc = kazanc || 0.5;
  const g = [];
  for (let i = 0; i < oktav; i++) g.push(gurultuFn(tohum * 31 + i * 7 + 1));
  let top = 0, a = 1;
  for (let i = 0; i < oktav; i++) { top += a; a *= kazanc; }
  return function (x, y) {
    let s = 0, a = 1, f = 1 / olcek;
    for (let i = 0; i < oktav; i++) { s += a * g[i](x * f + i * 17.3, y * f - i * 9.1); a *= kazanc; f *= 2.03; }
    return s / top;
  };
}

/** Çalışma çözünürlüğünde ekran dışı katman (koordinatlar 1024'te). */
function yeniKatman() {
  const c = SAHNE.yeniTuval(N, N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(O, 0, 0, O, 0, 0);
  return [c, x];
}
function okuKanal(c, kanal) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
  const out = new Float32Array(N * N);
  for (let i = 0, j = kanal; i < N * N; i++, j += 4) out[i] = d[j] / 255;
  return out;
}
/** Çizim fonksiyonundan alfa maskesi (Float32Array, 0–1). */
function maske(ciz, bulaniklik) {
  const [c, x] = yeniKatman();
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  ciz(x);
  if (bulaniklik) return okuKanal(bulanikTuval(c, bulaniklik), 3);
  return okuKanal(c, 3);
}
/** Tuvali bulanıklaştırılmış kopyası (bulaniklik 1024 px cinsinden). */
function bulanikTuval(c, b) {
  const k = SAHNE.yeniTuval(N, N);
  const x = k.getContext('2d', { willReadFrequently: true });
  x.filter = `blur(${b * O}px)`;
  x.drawImage(c, 0, 0);
  return k;
}
/** Float32Array kutu bulanıklığı (3 geçiş ≈ Gauss), r çalışma pikseli. */
function bulanikDizi(a, r) {
  r = Math.max(1, Math.round(r));
  const t = new Float32Array(N * N);
  const gecis = (src, dst, yatay) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < N; j++) {
      let s = 0;
      const idx = (k) => (yatay ? j * N + k : k * N + j);
      for (let k = -r; k <= r; k++) s += src[idx(Math.min(N - 1, Math.max(0, k)))];
      for (let k = 0; k < N; k++) {
        dst[idx(k)] = s * inv;
        s += src[idx(Math.min(N - 1, k + r + 1))] - src[idx(Math.max(0, k - r))];
      }
    }
  };
  for (let p = 0; p < 3; p++) { gecis(a, t, true); gecis(t, a, false); }
  return a;
}
/** Kabartma (gömme) ışığı: yükseklik haritası → gölge/ışık çarpanı. Işık sağ üstten. */
function kabartma(H, guc) {
  const out = new Float32Array(N * N);
  const lx = 0.62, ly = -0.62;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const hx = (H[i + 1] - H[i - 1]) * 0.5, hy = (H[i + N] - H[i - N]) * 0.5;
      out[i] = (-hx * lx - hy * ly) * guc;
    }
  }
  return out;
}

/** SVG yolunu nokta dizilerine çevirir (M, L, C, Z). */
function yolNoktalari(d, adim) {
  adim = adim || 3;
  const t = d.match(/[MLCZA]|-?\d*\.?\d+(?:e-?\d+)?/g);
  const alt = []; let cur = null, i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]);
  while (i < t.length) {
    if (/[MLCZA]/.test(t[i])) cmd = t[i++];
    if (cmd === 'M') { x = num(); y = num(); sx = x; sy = y; cur = []; alt.push(cur); cur.push([x, y]); cmd = 'L'; }
    else if (cmd === 'L') { x = num(); y = num(); cur.push([x, y]); }
    else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(2, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const s = k / n, u = 1 - s;
        cur.push([u * u * u * x + 3 * u * u * s * x1 + 3 * u * s * s * x2 + s * s * s * x3, u * u * u * y + 3 * u * u * s * y1 + 3 * u * s * s * y2 + s * s * s * y3]);
      }
      x = x3; y = y3;
    } else if (cmd === 'Z') { if (Math.hypot(x - sx, y - sy) > 0.01) cur.push([sx, sy]); x = sx; y = sy; cmd = ''; }
    else if (cmd === 'A') { for (let k = 0; k < 5; k++) num(); x = num(); y = num(); cur.push([x, y]); }
    else i++;
  }
  return alt;
}
/** Kâğıt lifi dokusu: ince gürültü + uzun lifler (0–1 civarı, ortalama ~0.5). */
function kagitDokusu(tohum) {
  const g1 = fbmFn(tohum, 3, 2.2), g2 = fbmFn(tohum + 5, 3, 24);
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const X = x / O, Y = y / O;
      out[y * N + x] = 0.6 * g1(X, Y) + 0.4 * g2(X * 1.8, Y * 0.6);
    }
  }
  return out;
}
/** Worley (hücre) gürültüsü: (x, y) → [F1, F2-F1] hücre boyuna göre. */
function worleyFn(tohum, hucre) {
  const r = SAHNE.rng(tohum);
  const ox = new Float32Array(65536), oy = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) { ox[i] = r(); oy[i] = r(); }
  const out = [0, 0];
  return function (x, y) {
    x /= hucre; y /= hucre;
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy, k = ((cy & 255) << 8) | (cx & 255);
        const ex = cx + ox[k] - x, ey = cy + oy[k] - y, d = ex * ex + ey * ey;
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
    }
    out[0] = Math.sqrt(f1); out[1] = Math.sqrt(f2) - out[0];
    return out;
  };
}


// ------------------------------------------------------------------ kurulum
const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
tuval.width = N; tuval.height = N;
const ctx = tuval.getContext('2d');
const Y = SAHNE.yollar();
const BT = SAHNE.bitki;
const rnd = SAHNE.rng(7303);
const PL = { x1: 80, y1: 62, x2: 944, y2: 926 }; // levha
const S = (PL.x2 - PL.x1) / 1024;
const sahneyeGec = (x) => x.setTransform(O * S, 0, 0, O * S, O * PL.x1, O * PL.y1);

// ------------------------------------------------------------------ katmanlar: ton (aşındırma derinliği), renk (tampon), çizgi
const [tonC, tx] = yeniKatman();
const [renkC, rx] = yeniKatman();
const [cizC, cx] = yeniKatman();
tx.fillStyle = '#000'; tx.fillRect(0, 0, 1024, 1024);
rx.fillStyle = '#6A5A4C'; rx.fillRect(0, 0, 1024, 1024);
for (const x of [tx, rx, cx]) { sahneyeGec(x); x.lineCap = 'round'; x.lineJoin = 'round'; }
const gri = (v) => { const g = Math.round(clamp(v) * 255); return `rgb(${g},${g},${g})`; };
const lgT = (x0, y0, x1, y1, d) => { const g = tx.createLinearGradient(x0, y0, x1, y1); d.forEach(([t, v]) => g.addColorStop(t, gri(v))); return g; };
const rgT = (x0, y0, r0, x1, y1, r1, d) => { const g = tx.createRadialGradient(x0, y0, r0, x1, y1, r1); d.forEach(([t, v]) => g.addColorStop(t, gri(v))); return g; };
const lgR = (x0, y0, x1, y1, d) => { const g = rx.createLinearGradient(x0, y0, x1, y1); d.forEach(([t, v]) => g.addColorStop(t, v)); return g; };
/** Bölge: ton (sayı ya da geçiş) ve tampon rengi. */
function bolge(yol, ton, renk) {
  const p = typeof yol === 'string' ? P2(yol) : yol;
  tx.fillStyle = typeof ton === 'number' ? gri(ton) : ton; tx.fill(p);
  if (renk) { rx.fillStyle = renk; rx.fill(p); }
  cx.save(); cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = '#fff'; cx.fill(p); cx.restore();
}
function tonEkle(yol, stil) { tx.save(); tx.globalCompositeOperation = 'lighter'; tx.fillStyle = stil; tx.fill(typeof yol === 'string' ? P2(yol) : yol); tx.restore(); }
function tonCikar(yol, stil) { tx.save(); tx.globalCompositeOperation = 'difference'; tx.fillStyle = stil; tx.fill(typeof yol === 'string' ? P2(yol) : yol); tx.restore(); }
/** Asitle yedirilmiş ince çizgi. */
function cizgi(yol, w, a) { cx.lineWidth = w || 1.1; cx.strokeStyle = `rgba(255,255,255,${a || 0.9})`; cx.stroke(typeof yol === 'string' ? P2(yol) : yol); }
const poly = (pts, k) => P2(SAHNE.yol(pts, k));

// ------------------------------------------------------------------ gök
{
  const gok = P2('M0,0 H1024 V800 H0 Z');
  bolge(gok, lgT(0, 0, 0, 800, [[0, 0.8], [0.3, 0.66], [0.6, 0.5], [0.82, 0.36], [1, 0.26]]), lgR(0, 0, 0, 800, [[0, '#0F3A82'], [0.38, '#2465AC'], [0.66, '#4D8AC4'], [0.82, '#8E9CC0'], [0.92, '#CF8A7E'], [1, '#D6955E']]));
  // sol üst köşe koyulaşır, güneş çevresi bir iki kademe açılır (gök yine mavi kalır)
  tonEkle(gok, (() => { const g = tx.createRadialGradient(0, 0, 0, 0, 0, 560); g.addColorStop(0, gri(0.14)); g.addColorStop(1, gri(0)); return g; })());
  {
    const g = tx.createRadialGradient(880, 140, 30, 880, 140, 270);
    g.addColorStop(0, 'rgba(0,0,0,0.6)'); g.addColorStop(0.35, 'rgba(0,0,0,0.34)'); g.addColorStop(0.7, 'rgba(0,0,0,0.1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    tx.fillStyle = g; tx.fill(gok);
    const r = rx.createRadialGradient(880, 140, 40, 880, 140, 280);
    r.addColorStop(0, 'rgba(228,166,40,1)'); r.addColorStop(0.32, 'rgba(232,150,60,0.92)'); r.addColorStop(0.62, 'rgba(214,120,120,0.5)'); r.addColorStop(1, 'rgba(150,110,170,0)');
    rx.fillStyle = r; rx.fill(gok);
  }
  // güneş: en açık kademede ılık sarı disk, çevresinde ince bir halka
  bolge(SAHNE.daireYolu(880, 140, 44), 0.2, '#E3B040');
  cizgi(SAHNE.daireYolu(880, 140, 44.5), 0.9, 0.55);
  // bulutlar: hafif aşındırma, alt yanları bir kademe koyu
  const rb = SAHNE.rng(31);
  const BULUT = [[170, 250, 1.05], [505, 150, 0.85], [760, 335, 1.15], [945, 470, 0.75], [95, 470, 0.75]];
  for (const [bx, by, bs] of BULUT) {
    const p = new Path2D();
    for (let i = 0; i < 10; i++) {
      const u = (i / 9 - 0.5) * 2;
      const r = (24 + rb() * 22) * bs * (1 - 0.42 * Math.abs(u));
      const cxx = bx + u * 100 * bs + (rb() - 0.5) * 10, cy = by - r * 0.4 + (rb() - 0.5) * 10 * bs;
      p.moveTo(cxx + r, cy); p.arc(cxx, cy, r, 0, TAU);
    }
    p.ellipse(bx, by + 2 * bs, 110 * bs, 14 * bs, 0, 0, TAU);
    bolge(p, lgT(0, by - 50 * bs, 0, by + 16 * bs, [[0, 0.03], [0.55, 0.09], [1, 0.21]]));
  }
}
// zemin
bolge('M0,800 H1024 V1024 H0 Z', lgT(0, 800, 0, 1024, [[0, 0.5], [0.12, 0.4], [1, 0.7]]), lgR(0, 800, 0, 1024, [[0, '#A87A44'], [0.5, '#9A6436'], [1, '#7E4A2C']]));
tonEkle('M300,800 L110,828 L300,846 L820,846 L820,800 Z', lgT(0, 800, 0, 846, [[0, 0.24], [1, 0]]));

// ------------------------------------------------------------------ minare
{
  const TAS = '#9A7A58';
  for (const p of SAHNE.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'bant') { for (const z of SAHNE.zikzakCizgileri()) cizgi(poly(z), 1.6, 0.95); continue; }
    let d, x1, x2;
    if (p.tip === 'poligon') { d = SAHNE.yol(p.noktalar, true); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); }
    else if (p.tip === 'topuz') { d = p.yol; x1 = 266; x2 = 334; }
    else { d = SAHNE.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true); x1 = p.x1; x2 = p.x2; }
    const cik = p.ad.startsWith('çıkma');
    bolge(d, lgT(x1, 0, x2, 0, [[0, cik ? 0.76 : 0.68], [0.45, cik ? 0.6 : 0.42], [0.75, cik ? 0.46 : 0.26], [1, cik ? 0.54 : 0.34]]), lgR(x1, 0, x2, 0, [[0, '#605E88'], [0.45, TAS], [1, '#BA8A48']]));
    if (p.tip === 'korkuluk') for (let i = 0; i < 10; i++) { const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * i) / 9; bolge(SAHNE.yol([[x - 2.2, p.y1 + 4], [x + 2.2, p.y1 + 4], [x + 2.2, p.y2 - 3], [x - 2.2, p.y2 - 3]], true), 0.7); }
    if (p.ad.startsWith('şerefe')) tonEkle(SAHNE.yol([[x1, p.noktalar[2][1] - 3], [x2, p.noktalar[2][1] - 3], [x2, p.noktalar[2][1]], [x1, p.noktalar[2][1]]], true), gri(0.3));
    cizgi(d, 1.0, 0.8);
  }
  for (const p of SAHNE.minarePencereleri) { const d = SAHNE.kemerYolu(p.x, p.y, p.w, p.h); bolge(d, 0.86); cizgi(d, 0.9, 0.8); }
}
// ------------------------------------------------------------------ kaide
{
  const TAS = '#9C7C56';
  bolge(Y.kaide, lgT(300, 0, 820, 0, [[0, 0.66], [0.35, 0.44], [0.75, 0.28], [1, 0.26]]), lgR(300, 0, 820, 0, [[0, '#625E88'], [0.4, TAS], [1, '#BC8C4C']]));
  tonEkle('M300,704 H820 V718 H300 Z', lgT(0, 704, 0, 718, [[0, 0.46], [1, 0]]));
  bolge(Y.kornis, lgT(290, 0, 830, 0, [[0, 0.34], [1, 0.12]]), TAS);
  for (const p of SAHNE.kaide.pencereler) { const d = SAHNE.kemerYolu(p.x, p.y, p.w, p.h); bolge(d, 0.84, '#6E4E4A'); cizgi(d, 1, 0.85); }
  cizgi(Y.kaide, 1.1, 0.75); cizgi(Y.kornis, 1, 0.75);
}
// ------------------------------------------------------------------ kasnak
for (let k = 1; k >= 0; k--) {
  const q = SAHNE.kasnak[k];
  const d = k ? Y.kasnakAlt : Y.kasnakUst;
  bolge(d, lgT(q.x1, 0, q.x2, 0, [[0, 0.9], [0.4, 0.74], [0.72, 0.52], [1, 0.68]]), '#1B6A3E');
  tonEkle(`M${q.x1},${q.y1} H${q.x2} V${q.y1 + 8} H${q.x1} Z`, lgT(0, q.y1, 0, q.y1 + 8, [[0, 0.3], [1, 0]]));
  for (const p of SAHNE.kasnakPencereleri(k)) { const dp = SAHNE.kemerYolu(p.x, p.y, p.w, p.h); bolge(dp, 1); cizgi(dp, 0.8, 0.6); }
  cizgi(d, 1.1, 0.8);
}
// ------------------------------------------------------------------ kubbe
{
  bolge(Y.kubbe, rgT(650, 380, 10, 590, 430, 290, [[0, 0.3], [0.4, 0.54], [0.75, 0.74], [1, 0.9]]), '#1E8048');
  tx.save(); tx.clip(P2(Y.kubbe));
  tonEkle(Y.kubbe, lgT(360, 0, 640, 0, [[0, 0.3], [0.6, 0.05], [1, 0]]));
  // kaburgaların gölge yanı: dar, bir kademe koyu şeritler
  for (const kb of SAHNE.kaburgalar(16, 40)) {
    tx.save(); tx.globalCompositeOperation = 'lighter';
    tx.lineWidth = 5; tx.strokeStyle = gri(0.1 + 0.06 * Math.max(0, -kb.u));
    tx.stroke(poly(kb.noktalar.map(([x, y]) => [x - 3.2 * Math.cos(kb.boylam), y])));
    tx.restore();
  }
  tx.restore();
  cx.save(); cx.clip(P2(Y.kubbe));
  for (const kb of SAHNE.kaburgalar(16, 40)) cizgi(poly(kb.noktalar), 0.9, 0.7);
  cx.restore();
  cizgi(Y.kubbe, 1.3, 0.9);
}
// alemler
for (const [axx, taban, s] of [[560, 300, 1], [300, 146, 0.62]]) {
  const a = SAHNE.alemParcalari(axx, taban, s);
  const ys = [SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), SAHNE.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true), ...a.kureler.map((k) => SAHNE.daireYolu(k.cx, k.cy, k.r)), SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)];
  for (const d of ys) { bolge(d, lgT(axx - 20 * s, 0, axx + 20 * s, 0, [[0, 0.62], [0.55, 0.38], [0.8, 0.12], [1, 0.3]]), '#B5862C'); cizgi(d, 0.8, 0.8); }
}
// ------------------------------------------------------------------ bitkiler
{
  for (const s of BT.saplar) { const p = poly(s); tx.lineWidth = 4.2; tx.strokeStyle = gri(0.62); tx.stroke(p); rx.lineWidth = 6; rx.strokeStyle = '#4C7638'; rx.stroke(p); cizgi(p, 0.8, 0.5); }
  BT.yapraklar.forEach((yp, i) => {
    const d = SAHNE.yaprakYolu(yp);
    const koyu = yp.uzunluk > 50 || i % 3 === 0;
    const ca = Math.cos(yp.aci), sa = Math.sin(yp.aci), nx = -sa, ny = ca;
    const yon = nx * 0.6 - ny * 0.6 > 0 ? 1 : -1;
    const W = yp.uzunluk * 0.32, mx = yp.x + ca * yp.uzunluk * 0.5, my = yp.y + sa * yp.uzunluk * 0.5;
    bolge(d, lgT(mx - nx * W * yon, my - ny * W * yon, mx + nx * W * yon, my + ny * W * yon, [[0, koyu ? 0.86 : 0.64], [0.5, koyu ? 0.68 : 0.46], [1, koyu ? 0.52 : 0.32]]), koyu ? '#2F6A30' : '#4E8A2C');
    cizgi(d, 0.8, 0.42);
    const [a, b] = SAHNE.yaprakDamari(yp); cizgi(poly([a, b]), 0.7, 0.5);
  });
  for (const t of BT.tomurcuklar) { const d = SAHNE.tomurcukYolu(t); bolge(d, 0.42, '#B4566A'); cizgi(d, 0.8, 0.7); }
  for (const c of BT.cicekler) {
    for (const e of SAHNE.tacYapraklari(c)) {
      const d = SAHNE.elipsYolu(e);
      bolge(d, rgT(c.x, c.y, c.r * 0.15, c.x, c.y, c.r * 1.05, [[0, 0.36], [0.45, 0.17], [1, 0.05]]), '#C8587A');
      cizgi(d, c.r > 40 ? 0.95 : 0.8, 0.62);
    }
    bolge(SAHNE.daireYolu(c.x, c.y, c.r * 0.2), 0.5, '#C08A28');
    for (let i = 0; i < 9; i++) { const a = (i / 9) * TAU + c.aci; bolge(SAHNE.daireYolu(c.x + Math.cos(a) * c.r * 0.27, c.y + Math.sin(a) * c.r * 0.27, Math.max(1.2, c.r * 0.04)), 0.85, '#8C4A2C'); }
  }
}

// ------------------------------------------------------------------ oku
const tonD = okuKanal(tonC, 0);
const renkI = bulanikTuval(renkC, 4.5).getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
const cizD = okuKanal(bulanikTuval(cizC, 0.25), 3);

// ------------------------------------------------------------------ baskı
const kagit = kagitDokusu(7313);
const kenarA = fbmFn(901, 4, 46), kenarB = fbmFn(902, 3, 13), kenarC = fbmFn(903, 2, 3);
const kesN = fbmFn(911, 3, 26), kesI = gurultuFn(912);
const grenW = worleyFn(921, 2.0 * O), grenB = gurultuFn(922), grenC = worleyFn(923, 1.1 * O);
const silme = fbmFn(931, 3, 40), silmeI = fbmFn(932, 2, 7);
const ciz1 = gurultuFn(941);
const fon = fbmFn(951, 3, 3), fonB = fbmFn(952, 3, 60);
const KAGIT = hex('#F3EEE2'), FON = hex('#8F8B82'), LEVHATON = hex('#7A6655');
const KADEME = 6;
const YOG = [0, 0.56, 0.78, 1.0, 1.24, 1.5, 1.78];
const RP = [1, 0.62, 0.52, 0.42, 0.33, 0.24, 0.15]; // kademe → reçine tanesi yarıçapı (hücre oranı)

// kâğıt (tırtıllı kenar) maskesi ve levha izi yüksekliği
const KG = { x1: 20, y1: 14, x2: 1006, y2: 1008 };
const H = new Float32Array(N * N);
const KM = new Float32Array(N * N);
for (let y = 0; y < N; y++) {
  for (let x = 0; x < N; x++) {
    const X = x / O, Yc = y / O, i = y * N + x;
    const dx = Math.min(X - KG.x1, KG.x2 - X), dy = Math.min(Yc - KG.y1, KG.y2 - Yc);
    const yan = dx < dy ? (X < 512 ? 0 : 1) : (Yc < 512 ? 2 : 3);
    const dd = Math.min(dx, dy);
    const t = yan < 2 ? Yc : X;
    const tir = (kenarA(t, yan * 77) - 0.5) * 12 + (kenarB(t, yan * 31) - 0.5) * 6 + (kenarC(X, Yc) - 0.5) * 2.2;
    KM[i] = smooth(-2.2, 2.4, dd + tir);
    const px = Math.min(X - PL.x1, PL.x2 - X), py = Math.min(Yc - PL.y1, PL.y2 - Yc);
    const ld = Math.min(px, py); // levha içinde pozitif
    H[i] = 1.4 * smooth(2.4, -1.2, ld) * KM[i];
  }
}
const EMB = kabartma(H, 0.95 * O);

const img = ctx.createImageData(N, N);
const px = img.data;
for (let y = 0; y < N; y++) {
  const Yc = y / O;
  for (let x = 0; x < N; x++) {
    const X = x / O, i = y * N + x;
    const km = KM[i];
    // arka plan (paspartu kartonu) ve kâğıdın sola-aşağı düşen gölgesi
    let gol = 0;
    if (km < 0.999) {
      const sx = Math.min(N - 1, x + 6 * O), sy = Math.max(0, y - 6 * O);
      gol = KM[sy * N + sx] * 0.35;
    }
    const fv = 1 + (fon(X, Yc) - 0.5) * 0.08 + (fonB(X, Yc) - 0.5) * 0.06;
    let br = FON[0] * fv * (1 - gol), bg = FON[1] * fv * (1 - gol), bb = FON[2] * fv * (1 - gol);
    // kâğıt
    const lif = (kagit[i] - 0.5) * 0.06;
    let r = KAGIT[0] + lif, g = KAGIT[1] + lif, b = KAGIT[2] + lif;
    const lx = Math.min(X - PL.x1, PL.x2 - X), ly = Math.min(Yc - PL.y1, PL.y2 - Yc), ld = Math.min(lx, ly);
    if (ld > -1) {
      const ic = smooth(-1, 0.6, ld);
      const i4 = i * 4;
      const cr = renkI[i4] / 255, cg = renkI[i4 + 1] / 255, cb = renkI[i4 + 2] / 255;
      const ar = -Math.log(Math.max(0.03, cr)), ag = -Math.log(Math.max(0.03, cg)), ab = -Math.log(Math.max(0.03, cb));
      // basamaklı ton: örtü cilasının fırçalı kenarlarıyla kademelendirme
      const tv = tonD[i];
      const kn = (kesN(X * 0.42, Yc * 1.15) - 0.5) * 0.85 + (kesN(X * 1.3 + 90, Yc * 1.3) - 0.5) * 0.25 + (kesI(X / 5, Yc / 5) - 0.5) * 0.07;
      let L = Math.floor(tv * KADEME + 0.35 + kn * Math.min(1, tv * 6));
      L = Math.max(0, Math.min(KADEME, L));
      if (tv < 0.012) L = 0;
      // reçine greni: tanelerin altı korunur (beyaz), aralarındaki ağ mürekkep tutar
      let mur = 0;
      if (L > 0) {
        const w1 = grenW(x + grenB(x / 2, y / 2) * 2.2, y)[0];
        const w2 = grenC(x, y)[0];
        const tane = 0.72 * w1 + 0.28 * w2;
        const rp = RP[L];
        const ag2 = smooth(rp - 0.1, rp + 0.1, tane);
        mur = YOG[L] * (0.06 + 0.94 * ag2);
      }
      // ince çizgiler: asitle yedirilmiş, kenarları hafif tırtıklı
      const cz = cizD[i];
      if (cz > 0.01) mur += cz * (0.95 + 0.5 * (ciz1(x / 1.7, y / 1.7) - 0.5)) * 1.25;
      // levha tonu: tarlatanla silmeden kalan ince, dalgalı zar
      const lt = 0.03 + 0.06 * silme(X, Yc) + 0.025 * silmeI(X * 1.5, Yc * 0.6) + 0.2 * smooth(10, 0, ld);
      const e = Math.exp(-mur * ar * 1.0), f = Math.exp(-mur * ag), h = Math.exp(-mur * ab);
      const tr = Math.exp(-lt * -Math.log(LEVHATON[0])), tg = Math.exp(-lt * -Math.log(LEVHATON[1])), tb = Math.exp(-lt * -Math.log(LEVHATON[2]));
      r = lerp(r, r * e * tr, ic); g = lerp(g, g * f * tg, ic); b = lerp(b, b * h * tb, ic);
      // levha kenarındaki eğimde biriken mürekkep çizgisi
      const kenar = smooth(2.2, 0.6, ld) * smooth(-0.6, 0.4, ld) * 0.35;
      r *= 1 - kenar * 0.55; g *= 1 - kenar * 0.6; b *= 1 - kenar * 0.62;
    }
    const em = 1 + EMB[i];
    r *= em; g *= em; b *= em;
    // kâğıt kenarı: hafif saydam lifler
    const a = km;
    px[i * 4] = clamp(lerp(br, r, a)) * 255;
    px[i * 4 + 1] = clamp(lerp(bg, g, a)) * 255;
    px[i * 4 + 2] = clamp(lerp(bb, b, a)) * 255;
    px[i * 4 + 3] = 255;
  }
}
ctx.putImageData(img, 0, 0);
SAHNE.hazir();
</script>
