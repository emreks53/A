  katman((x) => { for (const d of [...Y.alem, ...Y.minareAlem]) for (const pts of ornekle(d, 1.5)) elCizgisi(x, pts, 1.0, 0.75, KIRMIZI, r, { parca: 200, titre: 0.15 }); elCizgisi(x, [[553, 300], [567, 300]], 1.2, 0.8, SIYAH, r); }, { opq: 0.5, gren: 0.5 });

  // ================================================================ 6) bitkiler: kırmızı ve siyah tebeşir, yeşil pastel dokunuşu, gül rengi çiçekler
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s, 1.8, 0.8, KIRMIZI, r, { parca: 80, titre: 0.6 }); for (const s of B.saplar) elCizgisi(x, s.map(([a, b]) => [a - 1.3, b]), 1.1, 0.55, SIYAH, r, { parca: 60, titre: 0.5 }); }, { opq: 0.5, sil: [MK.yaprakUstu] });
  function yaprakTara(x, renk, alfa, kal, aralik, aci, sadeceGolge) {
    B.yapraklar.forEach((yp, i) => {
      const p = yaprakYollari[i];
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(p); x.restore();
      x.save(); x.clip(p);
      const L = yp.uzunluk, ca = Math.cos(yp.aci), sa = Math.sin(yp.aci);
      for (const taraf of [-1, 1]) {
        const isikli = (-sa * taraf) * 0.74 + (ca * taraf) * -0.67 > 0;
        if (sadeceGolge && isikli) continue;
        const n = Math.round(L / aralik);
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n, sx = yp.x + ca * L * t, sy = yp.y + sa * L * t;
          const len = L * yp.genislik * 0.7 * Math.sin(Math.PI * clamp(t, 0.05, 0.95)) * (0.85 + 0.3 * r()) + 1;
          const a2 = aci === null ? egik : yp.aci + taraf * aci;
          strok(x, [[sx, sy], [sx + Math.cos(a2) * len * (aci === null ? 0.6 : 1) * (aci === null ? taraf : 1), sy + Math.sin(a2) * len * (aci === null ? 0.6 : 1) * (aci === null ? taraf : 1)]], kal, alfa * (isikli ? 0.55 : 1) * (0.75 + 0.3 * r()), renk, 0.08, 0.5);
        }
      }
      x.restore();
    });
    sil(K, MK.onBitki);
  }
  katman((x) => { B.yapraklar.forEach((yp, i) => { x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore(); x.save(); x.clip(yaprakYollari[i]); const [a, b] = SAHNE.yaprakDamari(yp); leke(x, [a, b], yp.uzunluk * yp.genislik * 0.8, yp.y > 860 ? 0.55 : 0.45, YESIL); x.restore(); }); sil(K, MK.onBitki); },
    { ezme: 4, opq: 0.6, gren: 0.45 });
  katman((x) => yaprakTara(x, YESIL, 0.85, 2.4, 4.6, 0.55, false), { opq: 0.65, gren: 0.7, guc: 1.15 });
  katman((x) => yaprakTara(x, KIRMIZI, 0.9, 1.8, 3.4, 0.7, false), { opq: 0.45, guc: 1.1 });
  katman((x) => yaprakTara(x, SIYAH, 0.75, 1.4, 4.4, 0.85, true), { opq: 0.55, maske: ton((b, l, px, py) => (py > 860 ? 0.9 : 0.5)) });
  katman((x) => { B.yapraklar.forEach((yp, i) => { x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore(); const pts = ornekle(SAHNE.yaprakYolu(yp), 2)[0]; elCizgisi(x, pts, 1.6, 0.9, yp.y > 860 ? SIYAH : KIRMIZI, r, { parca: 50, titre: 0.35 }); const [a, b] = SAHNE.yaprakDamari(yp); strok(x, [a, [lerp(a[0], b[0], 0.5) + 0.5, lerp(a[1], b[1], 0.5)], b], 1.1, 0.6, KIRMIZI, 0.05, 0.4); }); sil(K, MK.onBitki); }, { opq: 0.5, gren: 0.6 });
  // tomurcuklar: gül rengi
  katman((x) => { B.tomurcuklar.forEach((t, i) => { x.save(); x.clip(tomurcukYollari[i]); taraT(x, { bx: [t.x - 18, t.y - 18, t.x + 18, t.y + 18], aci: t.aci + 0.3, aralik: 2.2, boy: 14, kal: 2.2, alfa: 0.85, renk: GUL, obek: 14, sik: 0.5 }); x.restore(); elCizgisi(x, ornekle(SAHNE.tomurcukYolu(t), 1.5)[0], 1.1, 0.75, KIRMIZI, r, { parca: 60, titre: 0.2 }); }); }, { opq: 0.7 });
  // çiçekler: göbeğe doğru gül pastel, taçlar beyaz tebeşirle; kırmızı kontur
  function tacTara(x, renk, alfaFn, kal, boyA, boyB, aralik) {
    B.cicekler.forEach((c) => SAHNE.tacYapraklari(c).forEach((e) => {
      const p = P2(SAHNE.elipsYolu(e)), yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
      const al = alfaFn(c, e, yon); if (al <= 0.01) return;
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(p); x.restore();
      x.save(); x.clip(p);
      const n = Math.round((c.r * 1.4) / aralik), ca = Math.cos(e.aci), sa = Math.sin(e.aci);
      for (let k = 0; k < n; k++) {
        const off = (k / (n - 1) - 0.5) * c.r * 0.9, a2 = e.aci + (off / c.r) * 0.8;
        const sx = c.x + ca * c.r * 0.15 - sa * off * 0.3, sy = c.y + sa * c.r * 0.15 + ca * off * 0.3, L = c.r * (boyA + r() * boyB);
        strok(x, [[sx, sy], [sx + Math.cos(a2) * L, sy + Math.sin(a2) * L]], kal * Math.max(0.8, c.r / 45), clamp(al * (0.75 + 0.3 * r()), 0, 1), renk, 0.05, 0.7);
      }
      x.restore();
    }));
  }
  katman((x) => tacTara(x, GUL, () => 0.85, 2.4, 0.35, 0.35, 3), { opq: 0.7, gren: 0.65 });
  katman((x) => tacTara(x, KIRMIZI, (c, e, yon) => (yon < 0 ? 0.65 : 0.3), 1.5, 0.2, 0.5, 3.6), { opq: 0.45 });
  katman((x) => tacTara(x, BEYAZ, (c, e, yon) => (yon > -0.3 ? 0.85 : 0.35), 2.2, 0.55, 0.45, 2.8), { opq: 0.92 });
  katman((x) => {
    B.cicekler.forEach((c) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e, ei) => {
        const pts = ornekle(SAHNE.elipsYolu(e), 1.5)[0];
        const icE = (sn, q) => { const ca = Math.cos(sn.aci), sa = Math.sin(sn.aci), dx = q[0] - sn.cx, dy = q[1] - sn.cy; const u = (dx * ca + dy * sa) / sn.rx, v = (-dx * sa + dy * ca) / sn.ry; return u * u + v * v < 0.98; };
        const parcalar = []; let cur = [];
        for (const q of pts) { if (tl.some((sn, ej) => ej > ei && icE(sn, q))) { if (cur.length > 1) parcalar.push(cur); cur = []; } else cur.push(q); }
        if (cur.length > 1) parcalar.push(cur);
        for (const pp of parcalar) elCizgisi(x, pp, 1.2 * Math.max(0.85, c.r / 50), 0.8, KIRMIZI, r, { parca: 70, titre: 0.3 });
      });
      x.save(); x.beginPath(); x.arc(c.x, c.y, c.r * 0.22, 0, 7); x.clip();
      taraT(x, { bx: [c.x - c.r * 0.3, c.y - c.r * 0.3, c.x + c.r * 0.3, c.y + c.r * 0.3], aci: egik, aralik: 3.2, boy: 12, kal: 2.0, alfa: 0.9, renk: OKRA, obek: 10, sik: 0.5 });
      taraT(x, { bx: [c.x - c.r * 0.3, c.y, c.x + c.r * 0.3, c.y + c.r * 0.3], aci: egik + 1.3, aralik: 3.6, boy: 10, kal: 1.6, alfa: 0.7, renk: KIRMIZI, obek: 8, sik: 0.6 });
      x.restore();
    });
  }, { opq: 0.7, bx: [0, 500, W, W] });
  katman((x) => { for (const c of B.cicekler) for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + r() * 0.3, rr = c.r * (0.24 + r() * 0.06); x.fillStyle = rgba(SIYAH, 0.85); x.beginPath(); x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.035), 0, 7); x.fill(); } }, { opq: 0.6, bx: [0, 500, W, W] });

  // ================================================================ 7) beyaz tebeşir: ışıklar (yapılar, gök, bulutlar, güneş)
  katman((x) => {
    x.save(); x.clip(kubbeYolu);
    taraT(x, { bx: [560, 296, 764, 520], ic: (px, py) => isik(px, py) > 0.8, aci: egik, aralik: 5.0, boy: 22, kal: 1.8, alfa: 0.7, renk: BEYAZ, obek: 20, sik: 1.1 });
    x.restore();
    bolgede(x, GM.minare, (x) => { taraT(x, { bx: [300, 140, 358, 802], aci: egik, aralik: 3.2, boy: 16, kal: 1.8, alfa: 0.85, renk: BEYAZ, obek: 14, sik: 0.85 }); });
    bolgede(x, GM.kaide, (x) => { taraT(x, { bx: [520, 688, 834, 802], aci: egik, aralik: 3.4, boy: 28, kal: 1.9, alfa: 0.8, renk: BEYAZ, obek: 24, sik: 0.9 }); });
    bolgede(x, GM.kasnak, (x) => { taraT(x, { bx: [600, 553, 790, 694], aci: Math.PI / 2, aralik: 4, boy: 16, kal: 1.8, alfa: 0.7, renk: BEYAZ, obek: 16, sik: 0.9 }); });
    const kr = SAHNE.kaide.kornis; elCizgisi(x, [[kr.x1 + 4, kr.y1 + 3], [kr.x2 - 2, kr.y1 + 3]], 3.2, 0.8, BEYAZ, r, { parca: 140 });
  }, { opq: 0.9, sil: [MK.bitki], maske: ton((b, l, px, py) => (b === 'kubbe' ? sstep(0.62, 0.95, l) : b === 'minare' || b === 'kaide' || b === 'kasnak' ? sstep(0.55, 0.92, l) : 0.9)) });
  katman((x) => { x.save(); x.clip(kubbeYolu); for (let k = 0; k < 6; k++) leke(x, [[600 + k * 14, 330 + k * 10], [650 + k * 10, 400 + k * 12], [690 + k * 6, 480]], 16, 0.32, BEYAZ); x.restore(); },
    { ezme: 10, opq: 0.85, gren: 0.4, maske: ton((b, l) => (b === 'kubbe' ? sstep(0.7, 0.98, l) : 0)) });
  // gök: beyaz tebeşirle hafifçe ezilmiş bulutlar ve güneş halesi; kenarları kâğıda karışır
  katman((x) => {
    for (const [bx, by, s] of [[170, 250, 1.0], [505, 150, 0.8], [770, 330, 1.05], [930, 470, 0.7], [92, 470, 0.7]]) {
      for (let k = 0; k < 7; k++) { const yy = by - 14 * s + k * 5 * s, w = (130 - Math.abs(k - 3) * 22) * s; leke(x, [[bx - w / 2 + r() * 10, yy], [bx, yy - 3 * s], [bx + w / 2 - r() * 10, yy + 2]], 9 * s, 0.32, BEYAZ); }
    }
    for (let k = 0; k < 12; k++) { const rr = 46 + k * 8; x.strokeStyle = rgba(BEYAZ, 0.3 * Math.pow(1 - k / 12, 1.6)); x.lineWidth = 9; x.beginPath(); x.arc(880, 140, rr, 0, Math.PI * 2); x.stroke(); }
  }, { ezme: 8, opq: 0.85, gren: 0.45, sil: [MK.yapi, MK.bitki] });
  katman((x) => {
    // bulut üstlerinde birkaç keskin beyaz tarama, güneşte dairesel vuruşlar
    for (const [bx, by, s] of [[170, 250, 1.0], [505, 150, 0.8], [770, 330, 1.05], [930, 470, 0.7], [92, 470, 0.7]]) taraT(x, { bx: [bx - 55 * s, by - 22 * s, bx + 55 * s, by + 4 * s], ic: (px, py) => Math.hypot((px - bx) / (60 * s), (py - by + 6 * s) / (16 * s)) < 1, aci: egik, aralik: 3.6, boy: 16 * s, kal: 1.8, alfa: 0.75, renk: BEYAZ, obek: 14, sik: 0.9 });
    // güneş: beyaz tebeşirle çizilmiş kurs — eğik paralel tarama, iki kez dolanan kontur ve kısa ışınlar
    x.save(); x.beginPath(); x.arc(880, 140, 40, 0, 7); x.clip();
    taraT(x, { bx: [836, 96, 924, 184], aci: egik, aralik: 2.9, boy: 26, kal: 2.0, alfa: 0.85, renk: BEYAZ, obek: 22, sik: 0.8 });
    x.restore();
    elCizgisi(x, ornekle(SAHNE.daireYolu(880, 140, 40), 2)[0], 2.0, 0.85, BEYAZ, r, { parca: 70, titre: 0.5 });
    elCizgisi(x, ornekle(SAHNE.daireYolu(881.5, 138.5, 43.5), 2)[0].slice(10, 90), 1.2, 0.45, BEYAZ, r, { parca: 60, titre: 0.8 });
    for (let k = 0; k < 24; k++) { const a = (k / 24) * Math.PI * 2 + (r() - 0.5) * 0.06, r0 = 52 + r() * 4, r1 = r0 + (k % 2 ? 14 : 30) + r() * 6; strok(x, [[880 + Math.cos(a) * r0, 140 + Math.sin(a) * r0], [880 + Math.cos(a) * r1, 140 + Math.sin(a) * r1]], k % 2 ? 1.5 : 2.0, 0.75, BEYAZ, 0.05, 0.55); }
  }, { opq: 0.9, gren: 0.7, sil: [MK.yapi, MK.bitki] });
  // ufukta ve gökte hafif, gevşek kırmızı tarama: binayı kâğıttan ayırır (çizim gibi kenarlara doğru söner)
  katman((x) => {
    for (const [cx0, cy0, rx, ry, al] of [[835, 470, 95, 120, 0.55], [205, 470, 70, 150, 0.4]]) {
      for (let k = -26; k <= 26; k++) {
        const ux = Math.cos(egik), uy = Math.sin(egik), off = k * 4.4 + (r() - 0.5) * 1.5;
        const mx = cx0 - uy * off, my = cy0 + ux * off, L = 2 * ry * Math.sqrt(Math.max(0, 1 - (k / 27) * (k / 27))) * (0.75 + 0.3 * r());
        if (L < 8) continue;
        const sh = (r() - 0.5) * 20;
        strok(x, [[mx - ux * (L / 2 - sh), my - uy * (L / 2 - sh)], [mx + ux * (L / 2 + sh), my + uy * (L / 2 + sh)]], 2.1, Math.min(1, al * 1.6) * (0.7 + 0.3 * r()), KIRMIZI2, 0.15, 0.35);
      }
    }
    for (let k = 0; k < 7; k++) { const y0 = 803 + k * 5 + r() * 3, x0 = 40 + r() * 200; strok(x, [[x0, y0], [x0 + 300 + r() * 400, y0 + (r() - 0.5) * 4]], 1.6, 0.55, KIRMIZI, 0.1, 0.3); }
  }, { opq: 0.45, guc: 1.6, gren: 0.6, sil: [MK.yapi, MK.bitki], maske: ton((b, l, px, py) => sstep(20, 140, Math.min(px, W - px))) });

  // ---------------------------------------------------------------- sonuç
  const img = ctx.createImageData(W2, W2), d = img.data;
  for (let i = 0; i < N2; i++) {
    d[i * 4] = clamp(RR[i] * 255, 0, 255); d[i * 4 + 1] = clamp(RG[i] * 255, 0, 255); d[i * 4 + 2] = clamp(RB[i] * 255, 0, 255); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
