<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-079 Yırtık Kâğıt Kolaj — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f1eadb; }
  canvas { display: block; width: 1024px; height: 1024px; }
  svg.olcum { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<svg class="olcum" xmlns="http://www.w3.org/2000/svg"><path id="olcu" d="M0,0"/></svg>
<script src="../../sahne/sahne.js"></script>
<script>
// S-079 Yırtık Kâğıt Kolaj — elle boyanmış ve renkli kâğıtlardan yırtılarak kurulmuş biçimler:
// yırtık kenarda kâğıdın beyaz, lifli özü; üst üste binen parçalar, çok hafif gölge; boyalı, el yapımı
// ve saydam ipek kâğıt dokuları; tutkal kırışıkları. Düz kolaj: derin katman gölgesi yok (S-029'dan farkı).
// Yöntem: her biçimin dış çizgisi yoğun örneklenir, yay uzunluğu boyunca gürültüyle yırtılır; dış yırtık
// kenar kâğıt özüyle (beyaz, lifli), içeride değişken genişlikte kayan ikinci kenar renkli yüzle doldurulur.
(function () {
  const S = SAHNE;
  const K = 2;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const rnd = S.rng(7979);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(1), n2 = gurultu(2), n3 = gurultu(3), n4 = gurultu(4);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.28 * n(x * 2.1, y * 2.1) + 0.14 * n(x * 4.3, y * 4.3) + 0.08 * n(x * 8.7, y * 8.7);
  const olcu = document.getElementById('olcu');

  // Bir SVG yolunu (tek kapalı alt yol) yaklaşık 'adim' aralıkla örnekler
  function ornekle(d, adim) {
    olcu.setAttribute('d', d);
    const L = olcu.getTotalLength();
    const n = Math.max(12, Math.round(L / adim));
    const out = [];
    for (let i = 0; i < n; i++) { const p = olcu.getPointAtLength((L * i) / n); out.push([p.x, p.y]); }
    return out;
  }
  function polyOrnekle(pts, adim) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(1, Math.round(L / adim));
      for (let k = 0; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
    }
    return out;
  }
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
  const alanIsareti = (pts) => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.sign(s) || 1; };

  // ------------------------------------------------------------ kâğıt dokuları (gri, 'overlay' ile)
  function doku(tur) {
    const N = 512;
    const c = S.yeniTuval(N, N);
    const x = c.getContext('2d', { willReadFrequently: true });
    const im = x.createImageData(N, N), d = im.data;
    const r = S.rng(100 + tur.length + (['firca', 'sunger', 'lif', 'tarak'].includes(tur) ? 0 : tur.charCodeAt(0) * 7 + tur.charCodeAt(1)));
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      let v = 128;
      // döşenebilir gürültü için periyodik koordinat: sınırda harmanla
      const u = i / N, w = j / N;
      const g = (fx, fy, n) => {
        const a = n(u * fx, w * fy), b = n((u - 1) * fx, w * fy), c2 = n(u * fx, (w - 1) * fy), d2 = n((u - 1) * fx, (w - 1) * fy);
        return (a * (1 - u) + b * u) * (1 - w) + (c2 * (1 - u) + d2 * u) * w;
      };
      if (tur === 'firca') { // boyalı kâğıt: yatay fırça izleri
        v += 70 * (g(6, 90, n1) - 0.5) + 40 * (g(3, 30, n2) - 0.5) + 18 * (g(40, 160, n3) - 0.5);
      } else if (tur === 'sunger') { // sünger lekesi: taban, lekeler aşağıda
        v += 40 * (g(5, 5, n2) - 0.5);
      } else if (tur === 'lif') { // el yapımı kâğıt: benekli, lifli
        v += 30 * (g(10, 10, n1) - 0.5) + 20 * (g(60, 60, n4) - 0.5);
      } else if (tur === 'tarak') { // taraklı dalgalı çizgiler
        const yy = w * 40 + 1.0 * Math.sin(u * Math.PI * 4 + g(4, 4, n2) * 6);
        v += 30 * Math.sin(yy * Math.PI * 2) + 26 * (g(8, 8, n3) - 0.5) + 30 * (g(4, 60, n1) - 0.5);
      } else if (tur === 'kraft') { // kraft / ambalaj kâğıdı: sık lif, ince benek
        v += 22 * (g(12, 12, n2) - 0.5) + 26 * (g(90, 90, n4) - 0.5) + 16 * (g(3, 3, n1) - 0.5);
      } else if (tur === 'washi') { // dut kâğıdı: bulutlu yoğunluk farkları
        v += 34 * (g(4, 4, n3) - 0.5) + 16 * (g(14, 14, n1) - 0.5);
      } else if (tur === 'suluboya') { // suluboyayla boyanmış kâğıt: lekeler, koyu kenarlı halkalar, granülasyon
        const f = 0.6 * g(2, 2, n1) + 0.28 * g(5, 5, n2) + 0.12 * g(13, 13, n4);
        const dd = f - 0.5; // boya birikintisinin kurumuş kenarı: dışta keskin, içe doğru yumuşak sönen koyu sınır

        const ton = 0.38 + 0.34 * g(3, 3, n2);
        const per = 64, a = Math.PI / 4;
        const xr = (i * Math.cos(a) + j * Math.sin(a)) / N * per, yr = (-i * Math.sin(a) + j * Math.cos(a)) / N * per;
        const fx = xr - Math.floor(xr) - 0.5, fy = yr - Math.floor(yr) - 0.5;
        const dd = Math.sqrt(fx * fx + fy * fy);

      }
      d[(j * N + i) * 4] = d[(j * N + i) * 4 + 1] = d[(j * N + i) * 4 + 2] = clamp(v, 0, 255);
      d[(j * N + i) * 4 + 3] = 255;
    }
    x.putImageData(im, 0, 0);
    if (tur === 'lif') { // lif çizgileri
      x.lineCap = 'round';
      for (let k = 0; k < 900; k++) {
        const px = r() * N, py = r() * N, a = r() * Math.PI * 2, L = 4 + r() * 16;
        x.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.12)';
        x.lineWidth = 0.6 + r() * 0.7;
        x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 0.6) * L * 0.5, py + Math.sin(a + 0.6) * L * 0.5, px + Math.cos(a) * L, py + Math.sin(a) * L); x.stroke();
      }
      for (let k = 0; k < 140; k++) { x.fillStyle = r() < 0.6 ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.4)'; x.beginPath(); x.arc(r() * N, r() * N, 0.6 + r() * 1.4, 0, 7); x.fill(); }
    }
    if (tur === 'kraft' || tur === 'washi') { // lifler: kraftta kısa ve sık, dut kâğıdında uzun, kıvrımlı, açık
      x.lineCap = 'round';
      const adet = tur === 'kraft' ? 2600 : 520;
      for (let k = 0; k < adet; k++) {
        const px = r() * N, py = r() * N, a = r() * Math.PI * 2;
        const L = tur === 'kraft' ? 3 + r() * 11 : 24 + r() * 70;
        const kv = (r() - 0.5) * (tur === 'kraft' ? 0.8 : 2.4);
        if (tur === 'kraft') { x.strokeStyle = r() < 0.55 ? `rgba(0,0,0,${0.1 + r() * 0.16})` : `rgba(255,255,255,${0.12 + r() * 0.2})`; x.lineWidth = 0.5 + r() * 0.8; }
        else { x.strokeStyle = `rgba(255,255,255,${0.22 + r() * 0.3})`; x.lineWidth = 0.5 + r() * 1.1; }
        for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
          const X = px + ox, Y = py + oy;
          if (X < -L || Y < -L || X > N + L || Y > N + L) continue;
          x.beginPath(); x.moveTo(X, Y);
          x.bezierCurveTo(X + Math.cos(a + kv) * L * 0.35, Y + Math.sin(a + kv) * L * 0.35, X + Math.cos(a - kv) * L * 0.7, Y + Math.sin(a - kv) * L * 0.7, X + Math.cos(a) * L, Y + Math.sin(a) * L);
          x.stroke();
        }
      }
      if (tur === 'kraft') for (let k = 0; k < 420; k++) { x.fillStyle = r() < 0.75 ? `rgba(40,20,0,${0.2 + r() * 0.25})` : 'rgba(255,255,255,0.35)'; x.beginPath(); x.arc(r() * N, r() * N, 0.4 + r() * r() * 1.8, 0, 7); x.fill(); }
      else for (let k = 0; k < 90; k++) { x.fillStyle = 'rgba(255,255,255,0.3)'; x.beginPath(); x.ellipse(r() * N, r() * N, 1 + r() * 3, 0.6 + r() * 1.2, r() * 3, 0, 7); x.fill(); }
    }
    if (tur === 'burusuk') { // buruşturulup düzeltilmiş kâğıt: periyodik Voronoi yüzeyleri, kat izleri
      const M = 26, pts = [];
      for (let k = 0; k < M; k++) pts.push([r() * N, r() * N, r() * Math.PI * 2, 0.35 + r() * 0.65]);
      const im2 = x.getImageData(0, 0, N, N), d2 = im2.data;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        let b1 = 1e12, b2 = 1e12, kb = 0;
        for (let k = 0; k < M; k++) {
          let dx = Math.abs(i - pts[k][0]), dy = Math.abs(j - pts[k][1]);
          if (dx > N / 2) dx = N - dx; if (dy > N / 2) dy = N - dy;
          const dd = dx * dx + dy * dy;
          if (dd < b1) { b2 = b1; b1 = dd; kb = k; } else if (dd < b2) b2 = dd;
        }
        const [px, py, a, e] = pts[kb];
        let dx = i - px, dy = j - py;

        // yüzeyin eğimi: kendi yönünde hafif gradyan; kat çizgisinde ince parlak/koyu sırt
        let v = 128 + 34 * Math.cos(a) * e + 0.18 * e * (dx * Math.cos(a) + dy * Math.sin(a));
        const ke = Math.sqrt(b2) - Math.sqrt(b1);

        const o = (j * N + i) * 4;
        d2[o] = d2[o + 1] = d2[o + 2] = clamp(0.55 * v + 0.45 * d2[o], 0, 255);
      }
      x.putImageData(im2, 0, 0);
    }
    if (tur === 'tane') { // kâğıdın ince dişi: her yüzeyde, çok hafif
      const im3 = x.getImageData(0, 0, N, N), d3 = im3.data;
      for (let k = 0; k < N * N; k++) { const v = 128 + (r() - 0.5) * 44; d3[k * 4] = d3[k * 4 + 1] = d3[k * 4 + 2] = v; }
      x.putImageData(im3, 0, 0);
      x.filter = 'blur(0.6px)'; x.drawImage(c, 0, 0); x.filter = 'none';
    }
    if (tur === 'sunger') { // sünger izleri: kümelenmiş küçük düzensiz lekeler, kenarlardan sarılarak döşenir
      for (let k = 0; k < 5200; k++) {
        const cx = r() * N, cy = r() * N, rr = 0.8 + r() * r() * 5.5;
        x.fillStyle = r() < 0.5 ? `rgba(255,255,255,${0.08 + r() * 0.14})` : `rgba(0,0,0,${0.06 + r() * 0.12})`;
        for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
          const X = cx + ox, Y = cy + oy;
          if (X < -10 || Y < -10 || X > N + 10 || Y > N + 10) continue;
          x.beginPath(); x.ellipse(X, Y, rr, rr * (0.5 + r() * 0.5), r() * 3, 0, 7); x.fill();
        }
      }
    }
    return c;
  }
  const DOKU = {};
  for (const t of ['firca', 'sunger', 'lif', 'tarak', 'kraft', 'washi', 'suluboya', 'baski', 'burusuk', 'tane']) DOKU[t] = doku(t);
  const desenler = {};
  for (const k in DOKU) desenler[k] = ctx.createPattern(DOKU[k], 'repeat');

  // ------------------------------------------------------------ yırtma
  let tohum = 10;
  // o: renk, doku, guc (doku gücü), aci (doku yönü), puruz (yırtık genliği), beyaz (beyaz kenar genişliği), ipek (saydam)
  function yirtikParca(taban, o) {
    o = o || {};
    tohum += 1;
    const sd = tohum * 13.37;
    {
      const rj = S.rng(tohum * 31 + 7);
      const kay = o.kay !== undefined ? o.kay : 1;
      let cx = 0, cy = 0;
      for (const q of taban) { cx += q[0]; cy += q[1]; }
      cx /= taban.length; cy /= taban.length;
      const a = (rj() - 0.5) * 0.026 * kay, dx = (rj() - 0.5) * 2.2 * kay, dy = (rj() - 0.5) * 2.2 * kay;
      const ca = Math.cos(a), sa = Math.sin(a);
      taban = taban.map(([x, y]) => [cx + (x - cx) * ca - (y - cy) * sa + dx, cy + (x - cx) * sa + (y - cy) * ca + dy]);
    }
    const isaret = alanIsareti(taban);
    const n = taban.length;
    const puruz = o.puruz !== undefined ? o.puruz : 2.2;
    const beyazG = o.beyaz !== undefined ? o.beyaz : 4;
    const dis = [], ic = [];
    let s = 0;
    for (let i = 0; i < n; i++) {
      const a = taban[(i - 1 + n) % n], b = taban[(i + 1) % n], p = taban[i];
      if (i > 0) s += Math.hypot(p[0] - taban[i - 1][0], p[1] - taban[i - 1][1]);
      let nx = b[1] - a[1], ny = -(b[0] - a[0]);
      const l = Math.hypot(nx, ny) || 1;
      nx = (nx / l) * isaret; ny = (ny / l) * isaret; // dışa doğru
      const kaba = puruz * ((fbm(n1, s * 0.045, sd) - 0.5) * 2.2 + (n2(s * 0.5, sd) - 0.5) * 0.9);
      const w = beyazG * clamp((fbm(n3, s * 0.03, sd + 5) - 0.42) * 3.4, 0, 1) + (n4(s * 0.6, sd) - 0.5) * 0.5;
      dis.push([p[0] + nx * kaba, p[1] + ny * kaba, nx, ny]);

    }
    const yol = (pts) => { const p = new Path2D(); pts.forEach((q, i) => (i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]))); p.closePath(); return p; };
    const pDis = yol(dis), pIc = yol(ic);
    const r = S.rng(tohum * 7 + 1);
    // 1) kâğıdın özü: beyaz, lifli dış kenar, çok hafif gölge
    ctx.save();
    if (!o.ipek) {
      ctx.shadowColor = 'rgba(60,45,30,0.26)'; ctx.shadowBlur = 3 * K; ctx.shadowOffsetX = -1.3 * K; ctx.shadowOffsetY = 1.7 * K;
      ctx.fillStyle = o.oz || '#FCFAF4';
      ctx.fill(pDis);

      if (!o.ozYok) { ctx.globalAlpha = 0.5; ctx.fillStyle = o.oz || '#FFFFFF'; ctx.fill(pDis); }
    }

      ctx.save();
      ctx.strokeStyle = o.ipek ? 'rgba(255,255,255,0.4)' : 'rgba(252,250,244,0.85)';
      ctx.lineWidth = 0.45;
      ctx.beginPath();
      for (let i = 0; i < n; i += 2) {
        if (r() > 0.45) continue;
        const [x, y, nx, ny] = dis[i];
        const L = 0.8 + r() * r() * 3.6, a = (r() - 0.5) * 1.2;
        const ca = Math.cos(a), sa = Math.sin(a);

        ctx.moveTo(x - nx * 0.5, y - ny * 0.5);

        const x = kb[0] + r() * bw, y = kb[1] + r() * bh, rr = R0 * (0.25 + r() * 0.45);

        const ac = r() < 0.55;
        g.addColorStop(0, ac ? 'rgba(255,252,235,0.22)' : 'rgba(20,20,40,0.16)');
        g.addColorStop(1, ac ? 'rgba(255,252,235,0)' : 'rgba(20,20,40,0)');
        ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
      }
    }

      const pat = desenler[o.doku];
      const a = o.aci !== undefined ? o.aci : r() * Math.PI;
      const sc = o.olcek || 0.5;
      pat.setTransform(new DOMMatrix().translate(r() * 400, r() * 400).rotate((a * 180) / Math.PI).scale(sc));
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = Math.min(1, (o.guc !== undefined ? o.guc : 0.55) * 1.3);

    const kirisik = o.kirisik !== undefined ? o.kirisik : Math.min(2, Math.floor(alan / 30000));
    for (let k = 0; k < kirisik; k++) {
      const x0 = kb[0] + r() * (kb[2] - kb[0]), y0 = kb[1] + r() * (kb[3] - kb[1]);
      const a = r() * Math.PI, L = 50 + r() * 90;
      const p = new Path2D();
      for (let t = 0; t <= 1.0001; t += 0.1) {
        const xx = x0 + Math.cos(a) * L * (t - 0.5) + Math.sin(a) * 2 * Math.sin(t * 3 + k), yy = y0 + Math.sin(a) * L * (t - 0.5) - Math.cos(a) * 2 * Math.sin(t * 3 + k);
        t === 0 ? p.moveTo(xx, yy) : p.lineTo(xx, yy);
      }
