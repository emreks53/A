<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-177 Washi Kolaj (Chigiri-e) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f5f0e6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-177 Washi Kolaj (Chigiri-e) — hayalî bir chigiri-e ustasının eli: bokashi tekniğiyle yumuşak geçişli
// boyanmış washi kâğıtlarını makas kullanmadan, parmak uçlarıyla yırtar; yırtık kenarda kâğıdın uzun kozo
// lifleri kendi renginde, tüy gibi saçaklanır. Parçalar arkadan öne katman katman yapıştırılır: bokashi gök,
// uzun kasumi sis bantları, uzak tepeler, yapı, kubbe ve önde beyaz washi çiçekler. Yöntem: her parçanın
// dış çizgisi yırtık gürültüsüyle oynatılır; önce yarı saydam ince bir saçak, sonra bokashi degradeli dolgu,
// üstüne washi lif dokusu ve kenardan dışa taşan tek tek lifler çizilir; gölge neredeyse yoktur.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const S = SAHNE;
  const OL = 2, W2 = 1024 * OL;
  const PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const P = (d) => new Path2D(d);
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];

  /** Tohumlu değer gürültüsü: n(x, y) → 0..1 */
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const Pm = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { Pm[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = Pm[i]; Pm[i] = Pm[j]; Pm[j] = t; }
    for (let i = 0; i < 256; i++) Pm[i + 256] = Pm[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[Pm[Pm[X] + Y]], b = G[Pm[Pm[X + 1] + Y]], c = G[Pm[Pm[X] + Y + 1]], d = G[Pm[Pm[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const fbm = (n, x, y, o) => {
    o = o || 4;
    let s = 0, a = 0.5, f = 1, t = 0;
    for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); t += a; a *= 0.5; f *= 2.03; }
    return s / t;
  };

  // SVG yolu örnekleme (ölçüm için gizli svg öğesi)
  const _svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  _svg.setAttribute('style', 'position:absolute;left:0;top:0;width:0;height:0;overflow:hidden');
  const _olcu = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  _svg.appendChild(_olcu);
  document.body.appendChild(_svg);
  /** SVG yolunu alt yollarına ayırıp her birini ~adim aralıkla örnekler → [[x,y]...][] */
  function ornekle(d, adim) {
    const out = [];
    for (const parca of d.trim().split(/(?=M)/)) {
      if (!parca.trim()) continue;
      _olcu.setAttribute('d', parca);
      const L = _olcu.getTotalLength();
      const n = Math.max(10, Math.round(L / adim));
      const pts = [];
      for (let i = 0; i < n; i++) { const p = _olcu.getPointAtLength((L * i) / n); pts.push([p.x, p.y]); }
      out.push(pts);
    }
    return out;
  }
  /** Çokgeni ~adim aralıkla yoğunlaştırır (köşeler korunur). */
  function yogunlastir(pts, adim, acik) {
    const out = [];
    const N = acik ? pts.length - 1 : pts.length;
    for (let i = 0; i < N; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(1, Math.round(L / adim));
      for (let k = 0; k < n; k++) out.push([a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n]);
    }
    if (acik) out.push(pts[pts.length - 1]);
    return out;
  }
  /**
   * Kapalı nokta dizisini normali boyunca, yay uzunluğuna bağlı periyodik gürültüyle oynatır (el kesimi / yırtık).
   * o: {genlik, dalga, ince, inceDalga, tohum}
   */
  function titret(pts, o) {
    const N = pts.length;
    const n = gurultu(o.tohum || 1);
    let L = 0;
    const s = [0];
    for (let i = 1; i <= N; i++) { const a = pts[i - 1], b = pts[i % N]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); s.push(L); }
    const out = [];
    const R1 = L / (PI2 * (o.dalga || 40));
    const R2 = L / (PI2 * (o.inceDalga || 6));
    for (let i = 0; i < N; i++) {
      const p = pts[i], a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const l = Math.hypot(nx, ny) || 1;
      nx /= l; ny /= l;
      const t = (s[i] / L) * PI2;
      let off = (n(50 + R1 * Math.cos(t), 50 + R1 * Math.sin(t)) - 0.5) * 2 * (o.genlik || 0);
      if (o.ince) off += (n(150 + R2 * Math.cos(t), 150 + R2 * Math.sin(t)) - 0.5) * 2 * o.ince;
      out.push([p[0] + nx * off, p[1] + ny * off]);
    }
    return out;
  }
  /** Nokta dizilerinden Path2D. */
  function yolu(liste, acik) {
    const p = new Path2D();
    for (const pts of liste) {
      pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      if (!acik) p.closePath();
    }
    return p;
  }
  /** Nokta dizisini hep aynı dönüş yönüne çevirir (nonzero birleşimlerde örtüşen alt yollar delik açmasın). */
  function yonlu(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return a < 0 ? pts.slice().reverse() : pts;
  }
  /** SVG yolu → el titremeli Path2D */
  function elYolu(d, o) {
    o = o || {};
    let t = 0;
    return yolu(ornekle(d, o.adim || 2).map((pts) => yonlu(titret(pts, Object.assign({}, o, { tohum: (o.tohum || 1) + 31 * t++ })))));
  }
  function polyEl(pts, o) {
    o = o || {};
    return yolu([yonlu(titret(yogunlastir(pts, o.adim || 2), o))]);
  }
  const dikYol = (x1, y1, x2, y2) => S.yol(dikd(x1, y1, x2, y2), true);

  /** hex → [r,g,b] */
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; }
  function karisim(h1, h2, t) {
    const a = rgb(h1), b = rgb(h2);
    return '#' + a.map((v, i) => Math.round(mix(v, b[i], t)).toString(16).padStart(2, '0')).join('');
  }

  const ana = S.tuval(document.getElementById('tuval'), OL);
  ana.lineCap = 'round';
  ana.lineJoin = 'round';
  const R = S.rng(1770);

  // ------------------------------------------------------------ washi lif dokusu (döşenen desen)
  function washiDoku(tohum, acik, koyu) {
    const N = 512;
    const c = S.yeniTuval(N * OL, N * OL);
    const g = c.getContext('2d');
    g.setTransform(OL, 0, 0, OL, 0, 0);
    const r = S.rng(tohum);
    const n = gurultu(tohum + 5);
    // bulutlu kâğıt hamuru: iri, yumuşak açık-koyu lekeler
    const im = g.createImageData(N * OL, N * OL);
    const d = im.data;
    for (let j = 0; j < N * OL; j++) for (let i = 0; i < N * OL; i++) {
      const x = i / OL, y = j / OL;
      // dikişsiz: dört köşeden karışım
      const fx = x / N, fy = y / N;
      const v = (fbm(n, x / 26, y / 26, 3) * (1 - fx) * (1 - fy) + fbm(n, (x - N) / 26, y / 26, 3) * fx * (1 - fy) + fbm(n, x / 26, (y - N) / 26, 3) * (1 - fx) * fy + fbm(n, (x - N) / 26, (y - N) / 26, 3) * fx * fy);
      const k = (j * N * OL + i) * 4;
      const t = (v - 0.5) * 2.2;
      if (t > 0) { d[k] = 255; d[k + 1] = 255; d[k + 2] = 250; d[k + 3] = Math.min(255, t * 70); }
      else { d[k] = 120; d[k + 1] = 110; d[k + 2] = 95; d[k + 3] = Math.min(255, -t * 26); }
    }
    g.putImageData(im, 0, 0);
    g.lineCap = 'round';
    const lifCiz = (adet, Lmin, Lmax, renk, amin, amax, wmin, wmax) => {
      for (let i = 0; i < adet; i++) {
        const x = r() * N, y = r() * N, a = r() * PI2, L = Lmin + r() * (Lmax - Lmin);
        const b1 = (r() - 0.5) * 1.6, b2 = (r() - 0.5) * 1.6;
        const yol = (X, Y) => {
          g.moveTo(X, Y);
          g.bezierCurveTo(X + Math.cos(a + b1) * L * 0.35, Y + Math.sin(a + b1) * L * 0.35, X + Math.cos(a + b2) * L * 0.7, Y + Math.sin(a + b2) * L * 0.7, X + Math.cos(a) * L, Y + Math.sin(a) * L);
        };
        g.strokeStyle = rgba(renk, amin + r() * (amax - amin));
        g.lineWidth = wmin + r() * (wmax - wmin);
        g.beginPath();
        for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
          if (x + dx < -L || x + dx > N + L || y + dy < -L || y + dy > N + L) continue;
          yol(x + dx, y + dy);
        }
        g.stroke();
      }
    };
    lifCiz(520, 24, 80, acik, 0.1, 0.24, 0.3, 0.7); // uzun kozo lifleri
    lifCiz(2200, 3, 12, acik, 0.08, 0.22, 0.25, 0.5); // kısa lifler
    lifCiz(400, 6, 26, koyu, 0.04, 0.09, 0.25, 0.5); // seyrek koyu lif
    return c;
  }
  const DOKU = ana.createPattern(washiDoku(77, '#FFFFFF', '#6B5A44'), 'repeat');
  // bokashi boyamasının düzensizliği: iri, yumuşak açık-koyu bulutlanma (soft-light ile)
  const BULUT = (function () {
    const N = 256;
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d');
    const im = g.createImageData(N, N);
    const n = gurultu(919);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const v = fbm(n, i / 34, j / 34, 4);
      const k = (j * N + i) * 4;
      const t = clamp((v - 0.5) * 2.6, -1, 1);
      if (t > 0) { im.data[k] = 255; im.data[k + 1] = 255; im.data[k + 2] = 255; im.data[k + 3] = t * 255; }
      else { im.data[k] = 0; im.data[k + 1] = 0; im.data[k + 2] = 0; im.data[k + 3] = -t * 255; }
    }
    g.putImageData(im, 0, 0);
    return c;
  })();
  function bulutlan(yol, alfa) {
    ana.save();
    if (yol) ana.clip(yol);
    ana.globalCompositeOperation = 'soft-light';
    ana.globalAlpha = alfa;
    ana.imageSmoothingQuality = 'high';
    ana.drawImage(BULUT, 0, 0, 1024, 1024);
    ana.restore();
  }

  // ------------------------------------------------------------ yırtık washi parçası
  const YIRTIK = { genlik: 1.5, dalga: 17, ince: 0.65, inceDalga: 3.2, adim: 1.2 };
  let tohumSay = 500;
  /** SVG yolu ya da nokta dizisi → yırtık dış çizgi(ler) */
  function yirt(kaynak, o) {
    o = Object.assign({}, YIRTIK, o || {});
    const listeler = typeof kaynak === 'string' ? ornekle(kaynak, o.adim) : [yogunlastir(kaynak, o.adim)];
    return listeler.map((pts) => titret(pts, Object.assign({}, o, { tohum: tohumSay++ })));
  }
  function alan(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
  function kutu(liste) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const pts of liste) for (const [x, y] of pts) { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); }
    return [x1, y1, x2, y2];
  }
  /** Bokashi: iki ya da daha çok renk arasında yumuşak degrade. */
  function bokashi(x1, y1, x2, y2, duraklar) {
    const g = ana.createLinearGradient(x1, y1, x2, y2);
    duraklar.forEach(([t, c]) => g.addColorStop(t, c));
    return g;
  }
  function bokashiR(cx, cy, r1, r2, duraklar) {
    const g = ana.createRadialGradient(cx, cy, r1, cx, cy, r2);
    duraklar.forEach(([t, c]) => g.addColorStop(t, c));
    return g;
  }
  /** Yalnız gölge (desensiz, ucuz): biçim tuval dışına kaydırılır. */
  function golge(yol, a, b, gx, gy) {
    const T = 3000;
    ana.save();
    ana.translate(-T, 0);
    ana.shadowColor = `rgba(70,55,35,${a})`;
    ana.shadowBlur = b * OL;
    ana.shadowOffsetX = (T + gx) * OL;
    ana.shadowOffsetY = gy * OL;
    ana.fillStyle = '#000';
    ana.fill(yol);
    ana.restore();
  }
  /**
   * Yırtık washi parçasını yapıştırır.
   * o: {saydam, lif (lif boyu), lifSik (sıklık), doku, golge, kenar (saçak genişliği)}
   */
  function washi(liste, dolgu, o) {
    o = o || {};
    const yol = yolu(liste);
    const lifBoy = (o.lif === undefined ? 4 : o.lif) * 1.55;
    const kenar = o.kenar === undefined ? 1 : o.kenar;
    if (o.golge !== false) golge(yol, o.ga === undefined ? 0.13 : o.ga, o.gb === undefined ? 3 : o.gb, -0.8, 1.2);
    ana.save();
    ana.globalAlpha = o.saydam === undefined ? 1 : o.saydam;
    // yırtık saçak: kenarın dışında kâğıdın kendi rengi beyaza açılarak tüy gibi incelir (kozo lifleri)
    const sa0 = o.saydam === undefined ? 1 : o.saydam;
    const akS = o.lifAcik === undefined ? 1 : o.lifAcik / 0.3;
    if (kenar > 0) {
      for (const [w, a1, a2] of [[8 * kenar, 0.07, 0.2], [5 * kenar, 0.13, 0.28], [2.6 * kenar, 0.28, 0.34]]) {
        ana.lineWidth = w;
        ana.globalAlpha = sa0 * a1;
        ana.strokeStyle = dolgu;
        ana.stroke(yol);
        ana.globalAlpha = sa0 * Math.min(0.6, a2 * akS);
        ana.strokeStyle = '#FFFEF9';
        ana.stroke(yol);
      }
      ana.globalAlpha = sa0;
    }
    ana.fillStyle = dolgu;
    ana.fill(yol);
    // iç kenar: renk yırtık çizgiye doğru incelip açılır
    if (kenar > 0) {
      ana.save();
      ana.clip(yol);
      ana.strokeStyle = '#FFFEF9';
      ana.globalAlpha = sa0 * Math.min(0.5, 0.16 * akS);
      ana.lineWidth = 4.2 * kenar;
      ana.stroke(yol);
      ana.globalAlpha = sa0 * Math.min(0.6, 0.24 * akS);
      ana.lineWidth = 1.8 * kenar;
      ana.stroke(yol);
      ana.restore();
    }
    if (o.bulut) bulutlan(yol, o.bulut);
    // washi lif dokusu
    const [x1, y1, x2, y2] = kutu(liste);
    ana.save();
    ana.clip(yol);
    DOKU.setTransform(new DOMMatrix().translate(R() * 512, R() * 512).scale(1 / OL));
    ana.globalAlpha *= o.doku === undefined ? 0.8 : o.doku;
    ana.fillStyle = DOKU;
    ana.fillRect(x1 - 2, y1 - 2, x2 - x1 + 4, y2 - y1 + 4);
    ana.restore();
    // kenardan dışa taşan lifler (kendi renginde, biraz açık)
    if (lifBoy > 0) {
      const sik = o.lifSik === undefined ? 2.2 : o.lifSik;
      for (const pts of liste) {
        const yon = Math.sign(alan(pts)) || 1;
        const N = pts.length;
        const yollar = [new Path2D(), new Path2D()];
        for (let ii = 0; ii < N * sik; ii++) {
          const i = Math.min(N - 1, Math.floor(ii / sik));
          const p = pts[i], a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
          let tx = b[0] - a[0], ty = b[1] - a[1];
          const l = Math.hypot(tx, ty) || 1;
          tx /= l; ty /= l;
          const nx = ty * yon, ny = -tx * yon; // dış normal
          // lifler kenara yatık uzanır: dış normalden 35–80° sapmış, kıvrık, kısa
          const L = lifBoy * (0.35 + Math.pow(R(), 1.8) * 1.6);
          const sap = (0.6 + R() * 0.8) * (R() < 0.5 ? -1 : 1);
          const ca = Math.cos(sap), sn = Math.sin(sap);
          const ex = nx * ca + tx * sn, ey = ny * ca + ty * sn;
          const ic = -0.6 + R() * 1.4;
          const sx = p[0] + nx * ic, sy = p[1] + ny * ic;
          const kv = (R() - 0.5) * L * 0.9;
          const yp = yollar[R() < 0.5 ? 0 : 1];
          yp.moveTo(sx, sy);
          yp.quadraticCurveTo(sx + ex * L * 0.5 - ey * kv, sy + ey * L * 0.5 + ex * kv, sx + ex * L, sy + ey * L);
        }
        const sa = o.saydam === undefined ? 1 : o.saydam;
        const ak = o.lifAcik === undefined ? 0.62 : o.lifAcik;
        ana.lineWidth = 0.42;
        ana.globalAlpha = sa * 0.3;
        ana.strokeStyle = dolgu;
        ana.stroke(yollar[0]);
        ana.globalAlpha = sa * ak * 0.8;
        ana.strokeStyle = 'rgba(255,255,250,1)';
        ana.stroke(yollar[0]);
        ana.lineWidth = 0.3;
        ana.globalAlpha = sa * 0.24;
        ana.strokeStyle = dolgu;
        ana.stroke(yollar[1]);
        ana.globalAlpha = sa * ak;
        ana.strokeStyle = 'rgba(255,255,250,1)';
        ana.stroke(yollar[1]);
      }
    }
    ana.restore();
  }

  // ------------------------------------------------------------ 1. bokashi gök (tam sayfa washi)
  ana.fillStyle = bokashi(0, 0, 0, 800, [[0, '#8EC3D3'], [0.38, '#BFDCDF'], [0.68, '#EEEDE2'], [0.86, '#F8E4DA'], [1, '#FBEEE2']]);
  ana.fillRect(0, 0, 1024, 1024);
  ana.fillStyle = bokashiR(880, 140, 20, 460, [[0, 'rgba(255,240,226,0.85)'], [0.4, 'rgba(255,236,222,0.3)'], [1, 'rgba(255,236,222,0)']]);
  ana.fillRect(0, 0, 1024, 1024);
  DOKU.setTransform(new DOMMatrix().scale(1 / OL));
  bulutlan(null, 0.35);
  ana.fillStyle = DOKU;
  ana.globalAlpha = 0.85;
  ana.fillRect(0, 0, 1024, 1024);
  ana.globalAlpha = 1;

  // ------------------------------------------------------------ 2. güneş: hale ve disk
  const GX = 880, GY = 140;
  const daire = (cx, cy, r) => { const p = []; for (let i = 0; i < 160; i++) { const t = (i / 160) * PI2; p.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]); } return p; };
  washi(yirt(daire(GX, GY, 112), { genlik: 2.6, dalga: 24 }), bokashiR(GX, GY, 40, 116, [[0, '#FFF1E2'], [1, '#FBE0CF']]), { saydam: 0.7, lif: 6, golge: false, kenar: 1.6 });
  washi(yirt(daire(GX, GY, 64), { genlik: 1.6, dalga: 16 }), bokashiR(GX - 14, GY - 14, 6, 74, [[0, '#F7A08A'], [0.55, '#EC7A62'], [1, '#E0654F']]), { lif: 4.5, ga: 0.1 });

  // ------------------------------------------------------------ 3. kasumi: uzun, yuvarlak uçlu sis bantları
  // kasumi (sis bandı): alt kenarı düz, üstü yumuşak tümsekli, uçları yuvarlak uzun şerit
  function kasumi(x1, x2, y, h, tumsek) {
    const pts = [];
    const L = x2 - x1;
    const ust = [];
    for (let i = 0; i <= 120; i++) {
      const t = i / 120;
      const x = x1 + L * t;
      let e = 0;
      for (const [m, w, hh] of tumsek) e = Math.max(e, hh * Math.exp(-Math.pow((t - m) / w, 2)));
      const uc = Math.pow(Math.sin(Math.PI * t), 0.35);
      ust.push([x, y - (h * 0.5 + e) * uc]);
    }
    const alt = [];
    for (let i = 120; i >= 0; i--) { const t = i / 120; alt.push([x1 + L * t, y + h * 0.5 * Math.pow(Math.sin(Math.PI * t), 0.3)]); }
    return ust.concat(alt);
  }
  const sisler = [
    [-60, 430, 250, 24, [[0.3, 0.12, 14], [0.62, 0.1, 9]], ['#FFFFFF', '#FBF0F0', '#EED9E2']],
    [395, 650, 152, 18, [[0.45, 0.14, 10]], ['#FFFFFF', '#FDF5EC', '#F1E2D6']],
    [690, 1080, 200, 20, [[0.35, 0.12, 10], [0.7, 0.1, 8]], ['#FFFFFF', '#FDF4EE', '#F3DED8']],
    [610, 1080, 394, 24, [[0.25, 0.1, 12], [0.6, 0.12, 15]], ['#FFFFFF', '#FBF0F0', '#ECD9E3']],
    [-60, 290, 474, 20, [[0.55, 0.15, 10]], ['#FFFFFF', '#FDF5EC', '#F0DFD2']],
  ];
  for (const [x1, x2, y, h, tm, rk] of sisler) {
    const ust = y - h / 2 - 16;
    washi(yirt(kasumi(x1, x2, y, h, tm), { genlik: 2, dalga: 20 }), bokashi(0, ust, 0, y + h / 2, [[0, rk[0]], [0.6, rk[1]], [1, rk[2]]]), { lif: 6, saydam: 0.94, ga: 0.07, kenar: 1.3 });
  }

  // ------------------------------------------------------------ 4. uzak tepeler
  function tepe(y0, gen, faz, x1, x2) {
    const pts = [];
    for (let x = x1; x <= x2; x += 4) pts.push([x, y0 - gen * (0.55 * Math.sin(x / 190 + faz) + 0.3 * Math.sin(x / 83 + faz * 2) + 0.15 * Math.sin(x / 37))]);
    pts.push([x2, 860], [x1, 860]);
    return pts;
  }
  washi(yirt(tepe(640, 34, 0.4, -30, 1060), { genlik: 2, dalga: 22 }), bokashi(0, 590, 0, 760, [[0, '#C6D0E3'], [1, '#E8EAEC']]), { lif: 5, ga: 0.08, bulut: 0.35 });
  washi(yirt(tepe(704, 22, 2.3, -30, 1060), { genlik: 2, dalga: 22 }), bokashi(0, 670, 0, 800, [[0, '#BCD3BA'], [1, '#E2EAD9']]), { lif: 5, ga: 0.1, bulut: 0.35 });

  // ------------------------------------------------------------ 5. minare
  const MP = S.minareParcalari();
  const mp = (ad) => MP.find((p) => p.ad === ad);
  const c = S.minare.cx;
  const tas = (x1, x2) => bokashi(x1, 0, x2, 0, [[0, '#D9CCB4'], [0.45, '#F0E8D8'], [1, '#FBF7EE']]);
  const INCE = { genlik: 0.7, dalga: 12, ince: 0.35 };
  for (const [x1, y1, x2, y2] of [[c - 34, 486, c + 34, 802], [c - 27, 314, c + 27, 458], [c - 19, 204, c + 19, 292]]) {
    washi(yirt(dikd(x1, y1, x2, y2), INCE), tas(x1, x2), { lif: 3 });
  }
  // zikzak: üç ince yırtık şerit (soluk kiremit)
  for (const z of S.zikzakCizgileri()) {
    const ust = z.map(([x, y]) => [x, y - 1.8]);
    const alt = z.slice().reverse().map(([x, y]) => [x, y + 1.8]);
    washi(yirt(ust.concat(alt), { genlik: 0.35, dalga: 8, ince: 0.2 }), '#C98F72', { lif: 1.6, golge: false, kenar: 0.5 });
  }
  const pencereRenk = '#5D6E92';
  for (const w of S.minarePencereleri) washi(yirt(S.kemerYolu(w.x, w.y, w.w, w.h), { genlik: 0.45, dalga: 8, ince: 0.2 }), pencereRenk, { lif: 1.6, kenar: 0.5 });
  for (const ad of ['çıkma-1', 'çıkma-2']) washi(yirt(mp(ad).noktalar, INCE), tas(c - 52, c + 52), { lif: 2.5 });
  for (const ad of ['korkuluk-1', 'korkuluk-2']) {
    const k = mp(ad);
    washi(yirt(dikd(k.x1, k.y1, k.x2, k.y2), INCE), '#F7F1E4', { lif: 2.5 });
    const adet = 9;
    for (let i = 0; i < adet; i++) {
      const x = k.x1 + 6 + ((k.x2 - k.x1 - 12) * (i + 0.5)) / adet;
      washi(yirt(dikd(x - 1.6, k.y1 + 4.5, x + 1.6, k.y2 - 3.5), { genlik: 0.25, dalga: 6, ince: 0.1 }), '#BBAE96', { lif: 0, golge: false, kenar: 0.3 });
    }
  }
  for (const ad of ['şerefe-1', 'şerefe-2', 'bilezik']) washi(yirt(mp(ad).noktalar, INCE), '#FCF9F2', { lif: 2.5, ga: 0.16 });
  washi(yirt(mp('topuz').yol, INCE), bokashi(c - 30, 0, c + 30, 0, [[0, '#D9CCB4'], [0.5, '#F2EBDC'], [1, '#FCF8F0']]), { lif: 3 });
  const altin = (x1, x2) => bokashi(x1, 0, x2, 0, [[0, '#B98A2E'], [0.5, '#E2B54E'], [1, '#F6DC8C']]);
  function alem(a, s) {
    const ic = { genlik: 0.3 * s, dalga: 7, ince: 0.15 };
    washi(yirt(dikYol(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), { genlik: 0.15, dalga: 6, ince: 0.08 }), altin(a.cubuk.x1, a.cubuk.x2), { lif: 0.8, kenar: 0.3 });
    for (const k of a.kureler) washi(yirt(S.daireYolu(k.cx, k.cy, k.r), ic), altin(k.cx - k.r, k.cx + k.r), { lif: 1.2 * s, kenar: 0.4 });
    washi(yirt(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), ic), altin(a.yaka.cx - a.yaka.rx, a.yaka.cx + a.yaka.rx), { lif: 1.4 * s, kenar: 0.4 });
    washi(yirt(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), { genlik: 0.2 * s, dalga: 6, ince: 0.1 }), altin(a.hilal.cx - a.hilal.R, a.hilal.cx + a.hilal.R), { lif: 1.2 * s, kenar: 0.4 });
  }
  alem(mp('alem').alem, 0.7);

  // ------------------------------------------------------------ 6. kaide
  const K = S.kaide;
  washi(yirt(dikd(K.x1, K.y1, K.x2, K.y2 + 6), INCE), bokashi(K.x1, 0, K.x2, 0, [[0, '#E3D8C3'], [0.5, '#F3ECDD'], [1, '#FCF8EF']]), { lif: 3.5, ga: 0.16 });
  washi(yirt(dikd(K.x1 + 2, K.y1, K.x2 - 2, K.y1 + 8), { genlik: 0.5, dalga: 12, ince: 0.25 }), bokashi(0, K.y1, 0, K.y1 + 8, [[0, '#CFC2AA'], [1, '#E6DCC8']]), { lif: 2, golge: false, saydam: 0.8 });
  for (const w of K.pencereler) washi(yirt(S.kemerYolu(w.x, w.y, w.w, w.h), { genlik: 0.6, dalga: 10, ince: 0.25 }), bokashi(0, w.y, 0, w.y + w.h, [[0, '#4F5F84'], [1, '#6E7C9C']]), { lif: 2 });
  washi(yirt(dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), INCE), '#FDFAF3', { lif: 2.5, ga: 0.2 });

  // ------------------------------------------------------------ 7. kasnak
  const kasnakRenk = (q, koyu) => bokashi(q.x1, 0, q.x2, 0, koyu ? [[0, '#1F5A3A'], [0.5, '#2E7A4C'], [0.82, '#4E9C62'], [1, '#3C8754']] : [[0, '#2A6B44'], [0.5, '#3A8B56'], [0.82, '#62AE70'], [1, '#4B985F']]);
  for (const k of [1, 0]) {
    const q = S.kasnak[k];
    washi(yirt(dikd(q.x1, q.y1, q.x2, q.y2), { genlik: 0.8, dalga: 14, ince: 0.35 }), kasnakRenk(q, k === 1), { lif: 3, ga: 0.16, bulut: 0.3 });
    for (const p of S.kasnakPencereleri(k)) washi(yirt(S.kemerYolu(p.x, p.y, p.w, p.h), { genlik: 0.35, dalga: 7, ince: 0.15 }), bokashi(0, p.y, 0, p.y + p.h, [[0, '#3D4C6E'], [1, '#56658A']]), { lif: 1.2, kenar: 0.4, golge: false });
    washi(yirt(dikd(q.x1 - 2, q.y1 - 1.5, q.x2 + 2, q.y1 + 3), { genlik: 0.4, dalga: 10, ince: 0.2 }), '#8CC488', { lif: 1.5, golge: false, saydam: 0.9 });
  }

  // ------------------------------------------------------------ 8. kubbe: koyu taban washi + ayrı yırtılmış 16 dilim (dilimler arasında yumuşak lifli dikiş)
  washi(yirt(S.kubbeYolu, { genlik: 1.2, dalga: 18 }), bokashi(370, 0, 750, 0, [[0, '#123F29'], [0.6, '#1E5A39'], [1, '#2E7347']]), { lif: 3, ga: 0.18, gb: 4 });
  const prof = S.kubbeProfili(80);
  const N16 = 16;
  for (let k = 0; k < N16; k++) {
    const b0 = -Math.PI / 2 + (Math.PI * k) / N16, b1 = -Math.PI / 2 + (Math.PI * (k + 1)) / N16;
    const u0 = Math.sin(b0), u1 = Math.sin(b1);
    const sol = [], sag = [];
    for (const q of prof) {
      const ara = 0.55 * Math.pow(q.r / 200, 0.7);
      const xl = 560 + u0 * q.r + (k === 0 ? 0 : ara), xr = 560 + u1 * q.r - (k === N16 - 1 ? 0 : ara);
      if (xr - xl < 0.8) break;
      sol.push([xl, q.y]);
      sag.push([xr, q.y]);
    }
    if (sol.length < 3) continue;
    const fm = (b0 + b1) / 2;
    const l = clamp(0.5 + 0.62 * Math.sin(fm + 0.42), 0, 1);
    const alt = karisim('#1B5536', '#58A865', l), ust = karisim('#276D45', '#98CE88', l);
    washi(yirt(sol.concat(sag.reverse()), { genlik: 0.55, dalga: 14, ince: 0.25 }), bokashi(0, 555, 0, 300, [[0, alt], [1, ust]]), { lif: 2.2, kenar: 0.55, golge: true, ga: 0.12, gb: 2, lifAcik: 0.13 });
  }
  washi(yirt(S.daireYolu(560, 305, 8), { genlik: 0.4, dalga: 6 }), '#4B9A5C', { lif: 1.5, golge: false });
  alem(S.alemParcalari(560, 300, 1), 1);

  // ------------------------------------------------------------ 9. zemin: üst üste yırtılmış kincha ve taze yeşil washi parçaları
  const serit = (y0, a1, a2, a3, faz, x1, x2) => {
    const pts = [];
    for (let x = x1; x <= x2; x += 4) pts.push([x, y0 + a1 * Math.sin(x / 190 + faz) + a2 * Math.sin(x / 71 + faz * 2.1) + a3 * Math.sin(x / 29 + faz * 0.7)]);
    pts.push([x2, 1060], [x1, 1060]);
    return pts;
  };
  washi(yirt(serit(794, 3, 2, 1, 0.6, -30, 1060), { genlik: 1.8, dalga: 22 }), bokashi(0, 790, 0, 900, [[0, '#F0E2C2'], [1, '#E5CFA2']]), { lif: 5, ga: 0.1, bulut: 0.4 });
  // yamaçlar: farklı tonlarda, sağdan ve soldan bindirilmiş yırtık parçalar
  washi(yirt(serit(842, 14, 6, 2, 2.2, -30, 560), { genlik: 2, dalga: 22 }), bokashi(0, 830, 0, 1000, [[0, '#D3E2A6'], [1, '#B9D190']]), { lif: 5, ga: 0.1, bulut: 0.35 });
  washi(yirt(serit(858, 12, 5, 2, 4.1, 460, 1060), { genlik: 2, dalga: 22 }), bokashi(0, 840, 0, 1000, [[0, '#C9DD9E'], [1, '#ADC985']]), { lif: 5, ga: 0.1, bulut: 0.35 });
  washi(yirt(serit(918, 16, 7, 3, 1.3, -30, 1060), { genlik: 2.2, dalga: 22 }), bokashi(0, 890, 0, 1024, [[0, '#A9CB84'], [1, '#8DB771']]), { lif: 5.5, ga: 0.12, bulut: 0.4 });
  // küçük açık yamalar (kâğıt artıklarından): yeşilin içinde soluk kincha ve sakura pembesi
  for (const [x, y, w, h, renk] of [[150, 872, 70, 14, '#EEE0BE'], [640, 884, 90, 13, '#E9F0CF'], [880, 868, 64, 12, '#EEE0BE'], [420, 966, 80, 14, '#C2DB9E']]) {
    const pts = [];
    for (let i = 0; i < 60; i++) { const t = (i / 60) * PI2; pts.push([x + Math.cos(t) * w * 0.5, y + Math.sin(t) * h * 0.5 * (1 + 0.25 * Math.sin(t * 3))]); }
    washi(yirt(pts, { genlik: 1.4, dalga: 10 }), renk, { lif: 4, ga: 0.06, saydam: 0.92 });
  }

  // ------------------------------------------------------------ 10. bitkiler
  const B = S.bitki;
  for (const s of B.saplar) {
    const sol = s.map(([x, y], i) => [x - 2.2, y]);
    const sag = s.slice().reverse().map(([x, y]) => [x + 2.2, y]);
    washi(yirt(sol.concat(sag), { genlik: 0.4, dalga: 10, ince: 0.2 }), '#6F9A57', { lif: 1.4, kenar: 0.4 });
  }
  function yaprakNok(y) {
    const L = y.uzunluk, W = L * y.genislik;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const pts = [];
    for (let i = 0; i <= 30; i++) { const t = i / 30; pts.push(p(L * t, W * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.8)), 0.85))); }
    for (let i = 29; i >= 1; i--) { const t = i / 30; pts.push(p(L * t, -W * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.8)), 0.85))); }
    return { pts, p };
  }
  const YESIL = [['#3E7A45', '#7FB16A'], ['#2F6A43', '#5E9C5C'], ['#55894A', '#9CC27C'], ['#2E6650', '#6BA488']];
  B.yapraklar.forEach((y, i) => {
    const { pts, p } = yaprakNok(y);
    const [k1, k2] = YESIL[(i * 7) % 4];
    const a = p(0, -y.uzunluk * y.genislik * 0.5), b = p(0, y.uzunluk * y.genislik * 0.5);
    // bokashi orta damara dik: bir yarı koyu, öbür yarı açık
    washi(yirt(pts, { genlik: 0.7, dalga: 11, ince: 0.3 }), bokashi(a[0], a[1], b[0], b[1], [[0, k1], [0.45, k1], [0.62, k2], [1, k2]]), { lif: 2.4, ga: 0.14 });
  });
  for (const t of B.tomurcuklar) washi(yirt(S.tomurcukYolu(t), { genlik: 0.4, dalga: 7, ince: 0.2 }), bokashi(t.x - t.r, t.y + t.r, t.x + t.r, t.y - t.r * 1.5, [[0, '#E9A3B6'], [1, '#F8D3DC']]), { lif: 1.6, kenar: 0.5 });
  function tacNok(cc, a) {
    const L = cc.r * 1.02, W = cc.r * 0.84;
    const ca = Math.cos(a), sa = Math.sin(a);
    const pts = [];
    for (let i = 0; i < 70; i++) {
      const th = (i / 70) * PI2;
      let u = Math.cos(th), v = Math.sin(th);
      if (u < 0) v *= 1 - 0.5 * u * u;
      u = 0.5 + 0.5 * u;
      pts.push([cc.x + u * L * ca - v * W * 0.5 * sa, cc.y + u * L * sa + v * W * 0.5 * ca]);
    }
    return pts;
  }
  for (const cc of B.cicekler) {
    for (const i of [0, 2, 4, 1, 3]) {
      const a = cc.aci + (i * PI2) / 5;
      const uc = [cc.x + Math.cos(a) * cc.r, cc.y + Math.sin(a) * cc.r];
      washi(yirt(tacNok(cc, a), { genlik: Math.max(0.6, cc.r * 0.02), dalga: 10, ince: 0.3 }), bokashi(cc.x, cc.y, uc[0], uc[1], [[0, '#F4CBD6'], [0.38, '#FCF2F3'], [1, '#FFFFFF']]), { lif: Math.max(2, cc.r * 0.07), ga: 0.15, gb: 2.5 });
    }
    washi(yirt(S.daireYolu(cc.x, cc.y, cc.r * 0.2), { genlik: 0.5, dalga: 6, ince: 0.2 }), bokashiR(cc.x - cc.r * 0.05, cc.y - cc.r * 0.05, 0, cc.r * 0.22, [[0, '#F7D65E'], [1, '#E3A63A']]), { lif: 1.6, kenar: 0.5 });
    const nk = cc.r > 40 ? 12 : 8;
    for (let i = 0; i < nk; i++) {
      const a = cc.aci + 0.3 + (i / nk) * PI2;
      washi(yirt(S.daireYolu(cc.x + Math.cos(a) * cc.r * 0.28, cc.y + Math.sin(a) * cc.r * 0.28, Math.max(1.1, cc.r * 0.035)), { genlik: 0.12, dalga: 4, ince: 0.05 }), '#D89A3A', { lif: 0, golge: false, kenar: 0.3 });
    }
  }

  // ------------------------------------------------------------ 11. ışık: sağ üstten çok yumuşak aydınlık
  ana.save();
  ana.globalCompositeOperation = 'soft-light';
  ana.fillStyle = bokashiR(GX, GY, 40, 1300, [[0, 'rgba(255,250,235,0.45)'], [0.6, 'rgba(255,250,235,0.05)'], [1, 'rgba(80,60,40,0.12)']]);
  ana.fillRect(0, 0, 1024, 1024);
  ana.restore();

  S.hazir();

})();
</script>
