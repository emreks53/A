<script>
// S-071 Monotipi — boyanmış levhadan alınmış tek baskı. Göğe merdaneyle açılmış mavi (merdane geçiş izleri),
// fırçayla boyanmış kubbe, kasnak ve yapraklar; bezle silinmiş güneş, bulutlar, beyaz taş ve çiçekler;
// pamukla silinmiş ışıklar, fırça sapıyla kazınmış çizgiler; kalın mürekkepte retikülasyon (damarlanma),
// levha tonu, preste ezilmiş yumuşak kenarlar, kâğıt tanesi ve kâğıda gömülmüş levha izi.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

'use strict';
// ------------------------------------------------------------------ ortak yardımcılar
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const P2 = (d) => new Path2D(d);

/** Tohumlu değer gürültüsü: (x, y) → [0,1]. */
function gurultuFn(tohum) {
  const r = SAHNE.rng(tohum);
  const v = new Float32Array(256);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { v[i] = r(); p[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = v[p[p[X] + Y]], b = v[p[p[X + 1] + Y]], c = v[p[p[X] + Y + 1]], d = v[p[p[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
/** Fraktal gürültü (fbm): ölçek = en kaba hücre boyu (1024 koordinatında). */
function fbmFn(tohum, oktav, olcek, kazanc) {
  kazanc = kazanc || 0.5;
  const g = [];
  for (let i = 0; i < oktav; i++) g.push(gurultuFn(tohum * 31 + i * 7 + 1));
  let top = 0, a = 1;
  for (let i = 0; i < oktav; i++) { top += a; a *= kazanc; }
  return function (x, y) {
    let s = 0, a = 1, f = 1 / olcek;
    for (let i = 0; i < oktav; i++) { s += a * g[i](x * f + i * 17.3, y * f - i * 9.1); a *= kazanc; f *= 2.03; }
    return s / top;
  };
}

/** Çalışma çözünürlüğünde ekran dışı katman (koordinatlar 1024'te). */
function yeniKatman() {
  const c = SAHNE.yeniTuval(N, N);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(O, 0, 0, O, 0, 0);
  return [c, x];
}
function okuKanal(c, kanal) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, N, N).data;
  const out = new Float32Array(N * N);
  for (let i = 0, j = kanal; i < N * N; i++, j += 4) out[i] = d[j] / 255;
  return out;
}
/** Çizim fonksiyonundan alfa maskesi (Float32Array, 0–1). */
function maske(ciz, bulaniklik) {
  const [c, x] = yeniKatman();
  x.fillStyle = '#fff'; x.strokeStyle = '#fff';
  ciz(x);
  if (bulaniklik) return okuKanal(bulanikTuval(c, bulaniklik), 3);
  return okuKanal(c, 3);
}
/** Tuvali bulanıklaştırılmış kopyası (bulaniklik 1024 px cinsinden). */
function bulanikTuval(c, b) {
  const k = SAHNE.yeniTuval(N, N);
  const x = k.getContext('2d', { willReadFrequently: true });
  x.filter = `blur(${b * O}px)`;
  x.drawImage(c, 0, 0);
  return k;
}
/** Float32Array kutu bulanıklığı (3 geçiş ≈ Gauss), r çalışma pikseli. */
function bulanikDizi(a, r) {
  r = Math.max(1, Math.round(r));
  const t = new Float32Array(N * N);
  const gecis = (src, dst, yatay) => {
    const inv = 1 / (2 * r + 1);
    for (let j = 0; j < N; j++) {
      let s = 0;
      const idx = (k) => (yatay ? j * N + k : k * N + j);
      for (let k = -r; k <= r; k++) s += src[idx(Math.min(N - 1, Math.max(0, k)))];
      for (let k = 0; k < N; k++) {
        dst[idx(k)] = s * inv;
        s += src[idx(Math.min(N - 1, k + r + 1))] - src[idx(Math.max(0, k - r))];
      }
    }
  };
  for (let p = 0; p < 3; p++) { gecis(a, t, true); gecis(t, a, false); }
  return a;
}
/** Kabartma (gömme) ışığı: yükseklik haritası → gölge/ışık çarpanı. Işık sağ üstten. */
function kabartma(H, guc) {
  const out = new Float32Array(N * N);
  const lx = 0.62, ly = -0.62;
  for (let y = 1; y < N - 1; y++) {
    for (let x = 1; x < N - 1; x++) {
      const i = y * N + x;
      const hx = (H[i + 1] - H[i - 1]) * 0.5, hy = (H[i + N] - H[i - N]) * 0.5;
      out[i] = (-hx * lx - hy * ly) * guc;
    }
  }
  return out;
}

/** SVG yolunu nokta dizilerine çevirir (M, L, C, Z). */
function yolNoktalari(d, adim) {
  adim = adim || 3;
  const t = d.match(/[MLCZA]|-?\d*\.?\d+(?:e-?\d+)?/g);
  const alt = []; let cur = null, i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]);
  while (i < t.length) {
    if (/[MLCZA]/.test(t[i])) cmd = t[i++];
    if (cmd === 'M') { x = num(); y = num(); sx = x; sy = y; cur = []; alt.push(cur); cur.push([x, y]); cmd = 'L'; }
    else if (cmd === 'L') { x = num(); y = num(); cur.push([x, y]); }
    else if (cmd === 'C') {
      const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num();
      const L = Math.hypot(x1 - x, y1 - y) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x3 - x2, y3 - y2);
      const n = Math.max(2, Math.ceil(L / adim));
      for (let k = 1; k <= n; k++) {
        const s = k / n, u = 1 - s;
        cur.push([u * u * u * x + 3 * u * u * s * x1 + 3 * u * s * s * x2 + s * s * s * x3, u * u * u * y + 3 * u * u * s * y1 + 3 * u * s * s * y2 + s * s * s * y3]);
      }
      x = x3; y = y3;
    } else if (cmd === 'Z') { if (Math.hypot(x - sx, y - sy) > 0.01) cur.push([sx, sy]); x = sx; y = sy; cmd = ''; }
    else if (cmd === 'A') { for (let k = 0; k < 5; k++) num(); x = num(); y = num(); cur.push([x, y]); }
    else i++;
  }
  return alt;
}
/** Kâğıt lifi dokusu: ince gürültü + uzun lifler (0–1 civarı, ortalama ~0.5). */
function kagitDokusu(tohum) {
  const g1 = fbmFn(tohum, 3, 2.2), g2 = fbmFn(tohum + 5, 3, 24);
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const X = x / O, Y = y / O;
      out[y * N + x] = 0.6 * g1(X, Y) + 0.4 * g2(X * 1.8, Y * 0.6);
    }
  }
  return out;
}
/** Worley (hücre) gürültüsü: (x, y) → [F1, F2-F1] hücre boyuna göre. */
function worleyFn(tohum, hucre) {
  const r = SAHNE.rng(tohum);
  const ox = new Float32Array(65536), oy = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) { ox[i] = r(); oy[i] = r(); }
  const out = [0, 0];
  return function (x, y) {
    x /= hucre; y /= hucre;
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9, f2 = 9;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy, k = ((cy & 255) << 8) | (cx & 255);
        const ex = cx + ox[k] - x, ey = cy + oy[k] - y, d = ex * ex + ey * ey;
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
    }
    out[0] = Math.sqrt(f1); out[1] = Math.sqrt(f2) - out[0];
    return out;
  };
}


// ------------------------------------------------------------------ kurulum
const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
tuval.width = N; tuval.height = N;
const ctx = tuval.getContext('2d');
const Y = SAHNE.yollar();
const BT = SAHNE.bitki;
const rnd = SAHNE.rng(7101);
const PL = { x1: 58, y1: 50, x2: 966, y2: 974, r: 6 }; // levha (plaka) sınırı

// Pigmentler: birim yoğunlukta beyaz kâğıt üstündeki görünüşleri (Beer–Lambert karışımı)
const PIG = {
  ton: '#B3A590', // levha tonu (ılık gri)
  mavi: '#69A2CB', // seruleum
  lac: '#33527E', // Prusya mavisi
  yesil: '#3C9862', // viridyan
  sari: '#F1CD5C', // Napoli / kadmiyum sarısı
  gul: '#E08FA2', // gül kökü
  toprak: '#C5804C', // yanık siena
};
const DMAX = 2.6; // katman tuvalinde 255 = bu yoğunluk
const al = (d) => (d / DMAX).toFixed(4);
const K = {};
for (const k in PIG) { const [c, x] = yeniKatman(); x.globalCompositeOperation = 'lighter'; x.lineCap = 'round'; x.lineJoin = 'round'; K[k] = x; K[k].tuval = c; }
const K2 = {}; // son silmeden SONRA boyananlar (çiçek göbekleri, pembe gölgeler)
for (const k of ['lac', 'sari', 'gul', 'toprak']) { const [c, x] = yeniKatman(); x.globalCompositeOperation = 'lighter'; K2[k] = x; K2[k].tuval = c; }
const [W1c, W1] = yeniKatman(); W1.globalCompositeOperation = 'lighter'; // ilk silme (merdane mürekkebi ve levha tonu)
const [W2c, W2] = yeniKatman(); W2.globalCompositeOperation = 'lighter'; // son silme (her şey)
const [WKc, WK] = yeniKatman(); WK.globalCompositeOperation = 'lighter'; // kazıma çizgileri
const [Ec, Ex] = yeniKatman(); // yapı silueti (merdane mürekkebi silinir)

// ------------------------------------------------------------------ fırça
/** Kıllı fırça darbesi: pts boyunca gen genişliğinde, kıl kıl çizgiler (yoğunluk ekler). */
function firca(x, pts, gen, alfa, o) {
  o = o || {};
  const L = pts.length;
  if (L < 2) return;
  const nrm = [];
  for (let i = 0; i < L; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(L - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    nrm.push([-dy / l, dx / l]);
  }
  const kil = o.kil || 1.8;
  const n = Math.max(2, Math.round(gen / kil));
  const parca = o.parca || 3;
  for (let k = 0; k < n; k++) {
    const off = ((k + 0.5) / n - 0.5) * gen + (rnd() - 0.5) * kil * 0.8;
    const a0 = alfa * (0.3 + 0.7 * rnd());
    x.lineWidth = kil * (0.8 + 0.9 * rnd());
    const s0 = Math.floor(rnd() * (o.basKay || 0.08) * L);
    const s1 = L - Math.floor(rnd() * (o.sonKay || 0.15) * L);
    for (let c = 0; c < parca; c++) {
      const i0 = Math.floor(lerp(s0, s1 - 1, c / parca)), i1 = Math.floor(lerp(s0, s1 - 1, (c + 1) / parca));
      if (i1 <= i0) continue;
      if (o.kuru && rnd() < o.kuru * (c / parca) * 0.7) continue;
      const fade = 1 - (o.kuru || 0) * (c / parca) * 0.6;
      x.strokeStyle = `rgba(255,255,255,${(a0 * fade).toFixed(4)})`;
      x.beginPath();
      for (let i = i0; i <= i1; i++) {
        const t = i / (L - 1);
        let tap = o.sivri ? Math.pow(Math.sin(Math.PI * (0.05 + 0.9 * t)), 0.6) : 1;
        if (o.tap) tap *= o.tap[i];
        const px = pts[i][0] + nrm[i][0] * off * tap, py = pts[i][1] + nrm[i][1] * off * tap;
        if (i === i0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
    }
  }
}
/** p0 → p1 arası, bükümlü nokta dizisi. */
function cizgi(x0, y0, x1, y1, n, bukum, dalga) {
  const out = [];
  const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  const ph = rnd() * TAU;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const b = (bukum || 0) * Math.sin(Math.PI * t) + (dalga || 0) * Math.sin(ph + t * 7);
    out.push([x0 + dx * t + nx * b, y0 + dy * t + ny * b]);
  }
  return out;
}
const yatayFirca = (x, x0, x1, y, gen, alfa, o) => firca(x, cizgi(x0, y + (rnd() - 0.5) * 2, x1, y + (rnd() - 0.5) * 3, 16, (rnd() - 0.5) * 4, 1.2), gen, alfa, o);
const doldur = (x, d, yog) => { x.fillStyle = `rgba(255,255,255,${al(yog)})`; x.fill(typeof d === 'string' ? P2(d) : d); };

// ------------------------------------------------------------------ yapı silueti (merdane mürekkebi bezle alınır)
Ex.fillStyle = '#fff';
[Y.kubbe, Y.kasnakUst, Y.kasnakAlt, Y.kaide, Y.kornis, ...Y.minare, ...Y.alem, ...Y.minareAlem].forEach((d) => Ex.fill(P2(d)));

// ------------------------------------------------------------------ gök: boyalı vuruşlar ve silmeler
// gökteki boya yapı siluetine girmez (sanatçı yapının biçimini önceden bezle almıştır)
const GOKK = [K.lac, K.mavi, K.gul, K.sari];
// sol üst köşe derinleşir: kuru fırçayla çapraz Prusya mavisi vuruşları
for (let i = 0; i < 22; i++) {
  const y0 = 50 + rnd() * 360, x0 = 30 + rnd() * 200;
  const L = 220 + rnd() * 300, a = -0.32 + (rnd() - 0.5) * 0.3;
  firca(K.lac, cizgi(x0, y0, x0 + Math.cos(a) * L, y0 + Math.sin(a) * L, 16, (rnd() - 0.5) * 40), 30 + rnd() * 26, 0.15 * (1 - y0 / 560), { kuru: 0.75, kil: 2.6, sonKay: 0.3 });
}
for (let i = 0; i < 14; i++) {
  const y0 = 60 + rnd() * 260, x0 = 280 + rnd() * 320;
  firca(K.mavi, cizgi(x0, y0, x0 + 200 + rnd() * 160, y0 + (rnd() - 0.6) * 60, 14, (rnd() - 0.5) * 30), 26 + rnd() * 20, 0.12, { kuru: 0.7, kil: 2.6 });
}
// güneşten dışa doğru bezle silinmiş ışık yolları (ilk silme)
for (let i = 0; i < 26; i++) {
  const a = Math.PI * (0.55 + rnd() * 0.75), r0 = 40 + rnd() * 30, r1 = 230 + rnd() * 320;
  firca(W1, cizgi(880 + Math.cos(a) * r0, 140 + Math.sin(a) * r0, 880 + Math.cos(a) * r1, 140 + Math.sin(a) * r1, 14, (rnd() - 0.5) * 20), 18 + rnd() * 30, 0.1 + rnd() * 0.1, { kuru: 0.8, kil: 2.6, sonKay: 0.4 });
}
// ufka doğru ılık pembe ve sarı ışık: merdane mavisi hafifçe alınır, üstüne geniş vuruşlar
for (let i = 0; i < 16; i++) yatayFirca(W1, 40, 990, 600 + rnd() * 190, 30, 0.07, { kuru: 0.6, kil: 3 });
for (let i = 0; i < 40; i++) {
  const y = 520 + rnd() * 275, x0 = 30 + rnd() * 560, x1 = x0 + 200 + rnd() * 420;
  const k = rnd() < 0.5 ? K.gul : K.sari;
  yatayFirca(k, x0, Math.min(990, x1), y, 22 + rnd() * 22, (k === K.gul ? 0.12 : 0.14) * smooth(500, 740, y), { kuru: 0.65, kil: 2.6 });
}
// güneşin çevresinde dairesel sarı ve pembe vuruşlar (silinmiş halenin üstünde)
{
  const g = K.sari.createRadialGradient(880, 140, 40, 880, 140, 210);
  g.addColorStop(0, `rgba(255,255,255,${al(0.5)})`); g.addColorStop(0.35, `rgba(255,255,255,${al(0.22)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  K.sari.fillStyle = g; K.sari.fillRect(600, 0, 424, 400);
  const g2 = K.gul.createRadialGradient(880, 140, 90, 880, 140, 260);
  g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(0.5, `rgba(255,255,255,${al(0.1)})`); g2.addColorStop(1, 'rgba(255,255,255,0)');
  K.gul.fillStyle = g2; K.gul.fillRect(560, 0, 464, 460);
}
for (let i = 0; i < 12; i++) {
  const R = 60 + rnd() * 110, a0 = rnd() * TAU, a1 = a0 + 0.4 + rnd() * 0.9;
  const pts = [];
  for (let k = 0; k <= 20; k++) { const a = lerp(a0, a1, k / 20); pts.push([880 + Math.cos(a) * R, 140 + Math.sin(a) * R]); }
  firca(K.sari, pts, 16 + rnd() * 18, 0.17 * (1 - (R - 54) / 150), { kuru: 0.6, kil: 2.4 });
  if (rnd() < 0.4) firca(K.gul, pts, 12, 0.07, { kuru: 0.7, kil: 2.4 });
}
// bulutlar: bezle tamponlanmış yumuşak lekeler ve sürüklenme izleri; altlarında pembe, üstlerinde sarı
const BULUT = [[170, 250, 1.25], [505, 150, 1.05], [760, 335, 1.35], [945, 470, 0.85], [95, 470, 0.9], [345, 395, 0.7]];
const rb = SAHNE.rng(33);
for (const [bx, by, bs] of BULUT) {
  for (let i = 0; i < 16; i++) {
    const x = bx + (rb() - 0.5) * 190 * bs, y = by + (rb() - 0.5) * 30 * bs - Math.abs(rb() - 0.5) * 26 * bs * (1 - Math.abs(x - bx) / (110 * bs));
    W1.fillStyle = `rgba(255,255,255,${0.1 + rb() * 0.12})`;
    W1.beginPath(); W1.ellipse(x, y, (22 + rb() * 34) * bs, (12 + rb() * 14) * bs, (rb() - 0.5) * 0.3, 0, TAU); W1.fill();
  }
  for (let i = 0; i < 7; i++) {
    const y = by + (rb() - 0.2) * 30 * bs;
    const x0 = bx - (90 + rb() * 70) * bs;
    firca(W1, cizgi(x0, y, x0 + (170 + rb() * 120) * bs, y + (rb() - 0.5) * 10, 14, (rb() - 0.5) * 6), (8 + rb() * 10) * bs, 0.12, { kuru: 0.75, kil: 2.6, sonKay: 0.4 });
  }
  yatayFirca(K.gul, bx - 100 * bs, bx + 90 * bs, by + 18 * bs, 14 * bs, 0.07, { kuru: 0.7, kil: 2.4 });
  if (bx > 450) yatayFirca(K.sari, bx - 70 * bs, bx + 100 * bs, by - 14 * bs, 12 * bs, 0.08, { kuru: 0.7, kil: 2.4 });
}

for (const k of GOKK) {
  k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#fff';
  [Y.kubbe, Y.kasnakUst, Y.kasnakAlt, Y.kaide, Y.kornis, ...Y.minare].forEach((d) => k.fill(P2(d)));
  k.restore();
}

// ------------------------------------------------------------------ kubbe
const prof = SAHNE.kubbeProfili(48); // tabandan tepeye
const meridyen = (u, t0, t1) => {
  const out = [];
  for (let i = 0; i < prof.length; i++) { const t = i / (prof.length - 1); if (t >= (t0 || 0) && t <= (t1 || 1)) out.push([560 + u * prof[i].r, prof[i].y]); }
  return out;
};
const tapM = () => prof.map((q) => 0.3 + 0.7 * (q.r / 200));
for (const k of [K.yesil, K.lac, K.sari, K.toprak, W2]) { k.save(); k.clip(P2(Y.kubbe)); }
for (let i = 0; i <= 74; i++) {
  const u = -1.02 + (2.04 * i) / 74 + (rnd() - 0.5) * 0.01;
  const pts = meridyen(clamp(u, -1, 1));
  const tp = tapM();
  firca(K.yesil, pts, 15, 0.3 * (1.05 + 0.35 * Math.max(0, -u)), { tap: tp, kil: 2, sonKay: 0.1 });

    if (sd < 0.8) {
      // basılı alan: sıkıştırılmış, hafifçe kaymış koordinatlar (ezilen mürekkep kenarı)
      const sx = clamp(x + ((wA(Xc, Yc) - 0.5) * 7 + (wC(Xc, Yc) - 0.5) * 3) * O, 0, N - 2.001), sy = clamp(y + ((wB(Xc, Yc) - 0.5) * 7 + (wD(Xc, Yc) - 0.5) * 3) * O, 0, N - 2.001);
      const ix = Math.floor(sx), iy = Math.floor(sy), fx = sx - ix, fy = sy - iy, i0 = iy * N + ix;
      const X = sx / O, Yw = sy / O;
      for (let k = 0; k < KAT.length; k++) d[k] = (ornek(KAT[k], i0, fx, fy) / 255) * DMAX;
      const E = ornek(Ea, i0, fx, fy) / 255, Eb = ornek(Eg, i0, fx, fy) / 255;
      const ragT = 0.6 * rag(X, Yw) + 0.4 * ragB(X, Yw);
      // güneş: bezle dairesel silme, dışa doğru çekilmiş ışınsal izler
      const gdx = X - 880, gdy = Yw - 140, gr = Math.hypot(gdx, gdy), ga = Math.atan2(gdy, gdx);
      const gIz = 0.5 + 0.5 * gunesIz(ga * 4.2 + 40 + gr * 0.004, gr * 0.02) * (0.6 + 0.4 * ragB(X * 0.5, Yw * 0.5));
      const gunesW = Math.max(smooth(58, 40, gr), Math.pow(smooth(280, 46, gr), 0.8) * (0.55 + 0.42 * gIz));
      let w1 = Math.min(1, ornek(W1a, i0, fx, fy) / 255 * (0.65 + 0.7 * ragT) + gunesW);
      const w2 = Math.min(1, ornek(W2a, i0, fx, fy) / 255 * (0.9 + 0.18 * ragT) + ornek(WKa, i0, fx, fy) / 255 + smooth(46, 34, gr));
      // merdane: göğe yatay geçişlerle açılmış mavi, yere siena; geçiş sınırlarında mürekkep sırtı
      let gok = 0, yer = 0;
      if (Yw < 830) {
        const yy = Yw + (X - 512) * 0.018;
        const gecis = Math.floor((yy - 30) / 124), ic = (yy - 30) / 124 - gecis;
        const carp = 0.8 + 0.4 * serit(gecis * 3.7, 0.5);
        const sirt = 0.32 * Math.exp(-((ic - 0.02) * (ic - 0.02)) / 0.0005) + 0.14 * Math.exp(-((ic - 0.975) * (ic - 0.975)) / 0.0003);
        const mot = 0.88 + 0.24 * merd(X * 0.35, Yw * 2.2);
        gok = (lerp(1.18, 0.3, smooth(40, 790, Yw)) * carp + sirt) * mot;
      }
      if (Yw > 780) {
        const mot = 0.85 + 0.3 * merd(X * 0.3, Yw * 2);
        const ust = smooth(784, 830, Yw + (lekeF(X * 2, 3) - 0.5) * 40);
        yer = (0.2 + 0.08 * Math.sin(Yw * 0.05 + X * 0.004)) * mot * ust * (0.7 + 0.6 * lekeF(X * 1.5, Yw * 3));
        gok *= 1 - ust;
      }
      const sil = 1 - 0.9 * E;
      // silme kenarına itilen mürekkep sırtı (siluetin hemen dışında)
      const kenar = Math.max(0, Eb - E) * 1.1;
      d[iMavi] += gok * sil * (1 - w1) + kenar * gok * 0.8;
      d[iToprak] += yer * (1 - w1);
      d[iSari] += yer * 0.3 * (1 - w1);
      // levha tonu: silmelerden sonra bile ince bir zar kalır
      const lekeT = 0.65 + 0.7 * lekeF(X, Yw);
      d[iTon] += 0.3 * lekeT * (1 - 0.6 * Math.max(w1, w2)) + 0.12 * lekeI(X, Yw);
      // son silmeler her katmandan alır
      let top = 0;
      for (let k = 1; k < d.length; k++) { d[k] *= 1 - w2; top += d[k]; }
      top += d[iTon];
      for (let j = 0; j < KAT2.length; j++) { const v = (ornek(KAT2[j], i0, fx, fy) / 255) * DMAX; d[IX2[j]] += v; top += v; }
      // levha kenarında birikmiş mürekkep
      const kenarIz = smooth(-5, -0.5, sd);
      d[iTon] += kenarIz * 0.6 * (0.7 + 0.6 * lekeI(X * 3, Yw * 3));
      // retikülasyon: kalın mürekkep ayrılırken açılan dallı damarlar
      const ww = (retW(X, Yw) - 0.5) * 9;
      // mürekkep preste boncuklanır: koyu adacıklar, aralarında açık hale (yumuşak hücreler)
      const cA = hucA(X + ww, Yw - ww)[0], cB = hucB(X - ww * 0.5, Yw + ww * 0.5)[0];
      const q1 = ret1(X + ww * 4, Yw - ww * 3), v1 = Math.pow(1 - Math.abs(2 * q1 - 1), 5);
      const kalin = smooth(0.5, 1.8, top), cokKalin = smooth(1.2, 2.6, top);
      const retik = 1 - kalin * (0.3 * smooth(0.25, 0.85, cA) + 0.12 * smooth(0.3, 0.9, cB)) - cokKalin * 0.32 * v1 + kalin * 0.1;
      // pres: kâğıt tanesinin tepeleri ince mürekkebi tam almaz; geniş lekelenme
      const ince = 1 - smooth(0.4, 1.6, top);
      const tane = 1 - ince * 0.35 * smooth(0.45, 0.8, lif) - 0.06 * (1 - lif);
      const leke = 0.9 + 0.2 * lekeF(X * 2.3, Yw * 2.3);
      const f = retik * tane * leke;
      let ar = 0, ag = 0, ab = 0;
      for (let k = 0; k < d.length; k++) { const v = d[k] * f; ar += v * ABS[k][0]; ag += v * ABS[k][1]; ab += v * ABS[k][2]; }
      const kap = smooth(0.8, -0.6, sd);
      r = lerp(r, r * Math.exp(-ar), kap); g = lerp(g, g * Math.exp(-ag), kap); b = lerp(b, b * Math.exp(-ab), kap);
    }
    const e = 1 + EMB[i] + (lif - 0.5) * 0.05;
    px[i * 4] = clamp(r * pk * e) * 255;
    px[i * 4 + 1] = clamp(g * pk * e) * 255;
    px[i * 4 + 2] = clamp(b * pk * e) * 255;
    px[i * 4 + 3] = 255;
  }
}
ctx.putImageData(img, 0, 0);
SAHNE.hazir();
