<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-033 Telkâri Tel — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #3a0b17; }
  canvas { display: block; width: 1024px; height: 1024px; }
  svg { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<svg id="olcu"></svg>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-033 Telkâri Tel — her şey koyu kadife üstüne serilmiş ince gümüş ve altın telden: dış hatlar burgulu
  // çift tel (halat), alanlar sık sarılmış minik spiral, S ve C kıvrımlarla dolu, birleşimlerde granül boncuklar.
  (function () {
    const S = SAHNE;
    const W = 1024;
    const IC = 2048;
    const tuval = document.getElementById('tuval');
    const ctx = S.tuval(tuval, 2);
    const rnd = S.rng(33);

    const ALTIN = { koyu: '#5A3A0C', orta: '#C08E36', acik: '#F4D888', parilti: '#FFF8E0' };
    const ESKI = { koyu: '#3E260A', orta: '#A47832', acik: '#E0C077', parilti: '#F6E8C0' }; // yapraklar: eskitilmiş altın
    const GUMUS = { koyu: '#3A3F47', orta: '#A4ACB6', acik: '#EAF0F5', parilti: '#FFFFFF' };

    // ---------------------------------------------------------------- yol örnekleme (SVG)
    const svg = document.getElementById('olcu');
    const NS = 'http://www.w3.org/2000/svg';
    function ornekle(d, adim) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
      const L = p.getTotalLength();
      const n = Math.max(2, Math.ceil(L / (adim || 1.5)));
      const out = [];
      for (let i = 0; i <= n; i++) {
        const q = p.getPointAtLength((L * i) / n);
        out.push([q.x, q.y]);
      }
      svg.removeChild(p);
      return out;
    }

    // ---------------------------------------------------------------- tel katmanı (toplu çizim)
    function yeniKatman() {
      return { teller: [], halatlar: [], boncuklar: [] };
    }
    // düz tel: nokta dizisi
    function tel(K, pts, metal, gen) {
      K.teller.push({ pts, metal, gen });
    }
    // burgulu çift tel (halat): yol boyunca eğik kısa halkalar
    let halat = function (K, pts, metal, gen) {
      const adim = gen * 0.92;
      // eşit aralıklı yeniden örnekle
      let birikim = 0;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1];
        const [x1, y1] = pts[i];
        const l = Math.hypot(x1 - x0, y1 - y0);
        if (l < 1e-6) continue;
        const tx = (x1 - x0) / l;
        const ty = (y1 - y0) / l;
        let t = adim - birikim;
        while (t <= l) {
          const x = x0 + tx * t;
          const y = y0 + ty * t;
          const nx = -ty;
          const ny = tx;
          K.halatlar.push({ x1: x - tx * gen * 0.3 + nx * gen * 0.34, y1: y - ty * gen * 0.3 + ny * gen * 0.34, x2: x + tx * gen * 0.3 - nx * gen * 0.34, y2: y + ty * gen * 0.3 - ny * gen * 0.34, metal, gen });
          t += adim;
        }
        birikim = l - (t - adim);
      }
    }
    function boncuk(K, x, y, r, metal) {
      K.boncuklar.push({ x, y, r, metal });
    }

    // boncuk görüntüsü (granül): ön çizilmiş küre
    function boncukResmi(m) {
      const c = S.yeniTuval(64, 64);
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(25, 23, 1, 32, 32, 31);
      gr.addColorStop(0, m.parilti);
      gr.addColorStop(0.16, m.acik);
      gr.addColorStop(0.5, m.orta);
      gr.addColorStop(0.86, m.koyu);
      gr.addColorStop(1, 'rgba(0,0,0,0.6)');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(32, 32, 31, 0, Math.PI * 2);
      g.fill();
      // alt kenarda yansıyan ışık
      g.strokeStyle = 'rgba(255,240,200,0.18)';
      g.lineWidth = 3;
      g.beginPath();
      g.arc(32, 32, 26, 0.6, 2.4);
      g.stroke();
      return c;
    }
    const BONCUK = new Map([[ALTIN, boncukResmi(ALTIN)], [GUMUS, boncukResmi(GUMUS)], [ESKI, boncukResmi(ESKI)]]);

    function katmaniCiz(c, K) {
      c.lineCap = 'round';
      c.lineJoin = 'round';
      // telleri metal ve kalınlığa göre grupla
      const gruplar = new Map();
      for (const t of K.teller) {
        const k = (t.metal === ALTIN ? 'a' : t.metal === ESKI ? 'e' : 'g') + t.gen.toFixed(2);
        if (!gruplar.has(k)) gruplar.set(k, { metal: t.metal, gen: t.gen, yol: new Path2D() });
        const y = gruplar.get(k).yol;
        t.pts.forEach(([x, yy], i) => (i ? y.lineTo(x, yy) : y.moveTo(x, yy)));
      }
      const hgruplar = new Map();
      for (const h of K.halatlar) {
        const k = (h.metal === ALTIN ? 'a' : h.metal === ESKI ? 'e' : 'g') + h.gen.toFixed(2);
        if (!hgruplar.has(k)) hgruplar.set(k, { metal: h.metal, gen: h.gen, yol: new Path2D() });
        const y = hgruplar.get(k).yol;
        y.moveTo(h.x1, h.y1);
        y.lineTo(h.x2, h.y2);
      }
      for (const G of gruplar.values()) {
        const w = G.gen;
        c.strokeStyle = G.metal.koyu;
        c.lineWidth = w;
        c.stroke(G.yol);
        c.save();
        c.translate(w * 0.1, -w * 0.1);
        c.strokeStyle = G.metal.orta;
        c.lineWidth = w * 0.64;
        c.stroke(G.yol);
        c.restore();
        c.save();
        c.translate(w * 0.2, -w * 0.22);
        c.strokeStyle = G.metal.acik;
        c.lineWidth = w * 0.26;
        c.stroke(G.yol);
        c.restore();
      }
      for (const G of hgruplar.values()) {
        const w = G.gen;
        c.strokeStyle = G.metal.koyu;
        c.lineWidth = w * 0.56;
        c.stroke(G.yol);
        c.save();
        c.translate(w * 0.06, -w * 0.07);
        c.strokeStyle = G.metal.orta;
        c.lineWidth = w * 0.36;
        c.stroke(G.yol);
        c.restore();
        c.save();
        c.translate(w * 0.12, -w * 0.15);
        c.strokeStyle = G.metal.acik;
        c.lineWidth = w * 0.13;
        c.stroke(G.yol);
        c.restore();
      }
      for (const b of K.boncuklar) c.drawImage(BONCUK.get(b.metal), b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }

    // ---------------------------------------------------------------- motifler: spiral, S kıvrımı, C kıvrımı
    function spiralNoktalari(cx, cy, R, yon, aci, tur) {
      const pts = [];
      const r0 = 0.35;
      const adimR = 1.85; // sarım aralığı: teller arasında kadife görünsün (1024'te sarımlar seçilsin)
      const turSay = tur || Math.max(0.9, (R - r0) / adimR);
      const tmax = turSay * Math.PI * 2;
      let t = 0;
      while (t <= tmax) {
        const r = r0 + (R - r0) * (t / tmax);
        pts.push([cx + Math.cos(aci + yon * t) * r, cy + Math.sin(aci + yon * t) * r]);
        t += Math.min(0.6, 0.75 / Math.max(r, 0.5));
      }
      return pts;
    }
    function motif(K, x, y, r, metal, tur) {
      const aci = rnd() * Math.PI * 2;
      const yon = rnd() < 0.5 ? 1 : -1;
      const R = r - 0.55;
      if (tur === 'S' && r >= 4.6) {
        // iki ters spiral: ortadaki noktada birleşir
        const ux = Math.cos(aci);
        const uy = Math.sin(aci);
        const rr = R * 0.5;
        const ax = x - ux * rr;
        const ay = y - uy * rr;
        const turSay = Math.max(1, (rr - 0.35) / 1.85);
        const son = turSay * Math.PI * 2;
        // A'nın dış ucu (x,y) noktasına denk gelsin: başlangıç açısı ayarı
        const bas = aci - yon * son;
        const A = spiralNoktalari(ax, ay, rr, yon, bas, turSay);
        const B = A.map(([px, py]) => [2 * x - px, 2 * y - py]).reverse();
        tel(K, A.concat(B), metal, 0.95);
        return;
      }
      if (tur === 'C' && r >= 3.6) {
        // açık kıvrım: bir buçuk tur spiral + kuyruk
        const pts = spiralNoktalari(x - Math.cos(aci) * R * 0.22, y - Math.sin(aci) * R * 0.22, R * 0.78, yon, aci, Math.max(1.2, (R * 0.78) / 1.5));
        const [lx, ly] = pts[pts.length - 1];
        for (let k = 1; k <= 6; k++) {
          const a = aci + yon * (Math.PI * 2 * Math.max(1.2, (R * 0.78) / 1.5)) + yon * k * 0.32;
          const rr = R * 0.78 + k * R * 0.035;
          pts.push([x - Math.cos(aci) * R * 0.22 + Math.cos(a) * rr, y - Math.sin(aci) * R * 0.22 + Math.sin(a) * rr]);
        }
        tel(K, pts, metal, 0.95);
        return;
      }
      tel(K, spiralNoktalari(x, y, R, yon, aci), metal, 0.95);
    }

    // ---------------------------------------------------------------- dolgu: hücrelere sık spiral yerleştirme
    function uzaklikDonusumu(maske) {
      const D = new Float32Array(W * W);
      const BUY = 1e6;
      for (let i = 0; i < W * W; i++) D[i] = maske[i] ? BUY : 0;
      const k1 = 1;
      const k2 = 1.4142;
      for (let y = 0; y < W; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (!D[i]) continue;
          let v = D[i];
          if (x > 0) v = Math.min(v, D[i - 1] + k1);
          if (y > 0) {
            v = Math.min(v, D[i - W] + k1);
            if (x > 0) v = Math.min(v, D[i - W - 1] + k2);
            if (x < W - 1) v = Math.min(v, D[i - W + 1] + k2);
          }
          D[i] = v;
        }
      }
      for (let y = W - 1; y >= 0; y--) {
        for (let x = W - 1; x >= 0; x--) {
          const i = y * W + x;
          if (!D[i]) continue;
          let v = D[i];
          if (x < W - 1) v = Math.min(v, D[i + 1] + k1);
          if (y < W - 1) {
            v = Math.min(v, D[i + W] + k1);
            if (x < W - 1) v = Math.min(v, D[i + W + 1] + k2);
            if (x > 0) v = Math.min(v, D[i + W - 1] + k2);
          }
          D[i] = v;
        }
      }
      return D;
    }
    // malzeme: 0 yok, 1 altın, 2 gümüş; rmax: bölgeye göre en büyük spiral
    function doldur(K, malzeme, rmaxH, boncukMetal) {
      const D = uzaklikDonusumu(malzeme);
      const izgara = new Map();
      const HG = 16;
      const daireler = [];
      const komsuMu = (x, y, r) => {
        let rr = r;
        const gx = Math.floor(x / HG);
        const gy = Math.floor(y / HG);
        for (let j = gy - 1; j <= gy + 1; j++) {
          for (let i = gx - 1; i <= gx + 1; i++) {
            const l = izgara.get(j * 1000 + i);
            if (!l) continue;
            for (const c of l) {
              const d = Math.hypot(c.x - x, c.y - y) - c.r - 0.08;
              if (d < rr) rr = d;
            }
          }
        }
        return rr;
      };
      const ekle = (c) => {
        const k = Math.floor(c.y / HG) * 1000 + Math.floor(c.x / HG);
        if (!izgara.has(k)) izgara.set(k, []);
        izgara.get(k).push(c);
        daireler.push(c);
      };
      // aday noktalar (karışık sırada)
      const adaylar = [];
      for (let y = 1; y < W - 1; y += 1) {
        for (let x = 1; x < W - 1; x += 1) {
          const i = y * W + x;
          if (malzeme[i] && D[i] > 1.35) adaylar.push(i);
        }
      }
      for (let i = adaylar.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        const t = adaylar[i];
        adaylar[i] = adaylar[j];
        adaylar[j] = t;
      }
      for (const esik of [0.94, 0.8, 0.66, 0.52, 0.38, 0.0]) {
        for (const i of adaylar) {
          const x = (i % W) + rnd() - 0.5;
          const y = Math.floor(i / W) + rnd() - 0.5;
          const rmax = rmaxH(x, y, malzeme[i]);
          let r = Math.min(D[i] - 0.45, rmax);
          if (r < Math.max(1.25, rmax * esik)) continue;
          r = komsuMu(x, y, r);
          if (r < Math.max(1.25, rmax * esik)) continue;
          ekle({ x, y, r, m: malzeme[i] });
        }
      }
      for (const c of daireler) {
        const metal = c.m === 1 ? ALTIN : c.m === 3 ? ESKI : GUMUS;
        if (c.r < 2.05) {
          boncuk(K, c.x, c.y, Math.min(c.r, 1.75), boncukMetal || metal);
          continue;
        }
        const z = rnd();
        motif(K, c.x, c.y, c.r, metal, z < 0.17 ? 'S' : z < 0.27 ? 'C' : 'spiral');
      }
      return daireler;
    }

    // bölge haritası (bitkisiz: yapı arkada eksiksiz kalsın)
    const ADLAR = Object.keys(S.BOLGE);
    function haritaOku(cicekli) {
      const c = S.yeniTuval();
      const g = c.getContext('2d', { willReadFrequently: true });
      S.ciz(g, { bolge: true, cicek: cicekli });
      const v = g.getImageData(0, 0, W, W).data;
      const out = new Uint8Array(W * W);
      for (let i = 0; i < W * W; i++) out[i] = ADLAR.indexOf(S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2]));
      return out;
    }
    const NO = Object.fromEntries(ADLAR.map((a, i) => [a, i]));
    const yapiH = haritaOku(false);
    const tumH = haritaOku(true);

    // ---------------------------------------------------------------- örtme: arkada kalan tel hatları çizilmez
    // nokta dizisini görünür parçalara böler (gizli(x, y) doğruysa nokta atlanır)
    function parcala(pts, gizli) {
      const out = [];
      let cur = [];
      for (const p of pts) {
        if (gizli(p[0], p[1])) {
          if (cur.length > 1) out.push(cur);
          cur = [];
        } else cur.push(p);
      }
      if (cur.length > 1) out.push(cur);
      return out;
    }
    // katmanın tel hatlarından dolgu sınır maskesi (dolgu bunlara ve boncuklara değmez)
    function katmanMaskesi(Kt, ekle) {
      const c = S.yeniTuval();
      const g = c.getContext('2d', { willReadFrequently: true });
      g.strokeStyle = '#000';
      g.fillStyle = '#000';
      g.lineCap = 'round';
      g.lineJoin = 'round';
      for (const h of Kt.hatlar) {
        g.lineWidth = h.gen * 1.62;
        g.beginPath();
        h.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
        g.stroke();
      }
      for (const t of Kt.teller) {
        g.lineWidth = t.gen + 1.6;
        g.beginPath();
        t.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
        g.stroke();
      }
      for (const b of Kt.boncuklar) {
        g.beginPath();
        g.arc(b.x, b.y, b.r + 0.7, 0, Math.PI * 2);
        g.fill();
      }
      if (ekle) ekle(g);
      const v = g.getImageData(0, 0, W, W).data;
      const m = new Uint8Array(W * W);
      for (let i = 0; i < W * W; i++) m[i] = v[i * 4 + 3] > 20 ? 1 : 0;
      return m;
    }
    // halat çağrılarını maskeye de kaydet
    const halat0 = halat;
    halat = function (Kt, pts, metal, gen) {
      (Kt.hatlar || (Kt.hatlar = [])).push({ pts, gen });
      halat0(Kt, pts, metal, gen);
    };

    const Y = S.yollar();
    const K = S.kaide;
    const parcalar = S.minareParcalari();

    // ================================================================ YAPI
    const yapi = yeniKatman();
    // minare kubbenin, kasnağın ve kaidenin ardında: onların içine düşen minare hatları gizlenir
    const onde = new Set([NO.kubbe, NO.kasnak, NO.kaide]);
    const minareGizli = (x, y) => {
      let n = 0;
      for (const [u, v] of [[0, 0], [2, 0], [-2, 0], [0, 2], [0, -2]]) {
        const xx = Math.round(x + u);
        const yy = Math.round(y + v);
        if (xx < 0 || yy < 0 || xx >= W || yy >= W) continue;
        const b = yapiH[yy * W + xx];
        if (onde.has(b) || (b === NO.pencere && xx > 336)) n++;
      }
      return n >= 3;
    };
    const minareHalat = (pts, metal, gen) => {
      for (const r of parcala(pts, minareGizli)) halat(yapi, r, metal, gen);
    };

    // dış hatlar: burgulu çift tel
    const HAT = 3.1;
    halat(yapi, ornekle(S.kubbeYolu, 1), ALTIN, HAT);
    for (const k of S.kaburgalar(16)) halat(yapi, k.noktalar.map((p) => p.slice()), ALTIN, 2.2);
    for (const kk of [S.kasnak[0], S.kasnak[1]]) halat(yapi, ornekle(S.yol([[kk.x1, kk.y1], [kk.x2, kk.y1], [kk.x2, kk.y2], [kk.x1, kk.y2]], true), 1), ALTIN, HAT);
    for (const p of Y.kasnakPencereleri) halat(yapi, ornekle(p, 0.8), ALTIN, 2.0);
    halat(yapi, ornekle(Y.kaide, 1), GUMUS, HAT);
    halat(yapi, ornekle(Y.kornis, 1), GUMUS, HAT);
    for (const p of Y.kaidePencereleri) halat(yapi, ornekle(p, 0.8), GUMUS, 2.4);
    for (const x of [365, 495, 625, 755]) halat(yapi, [[x, 706], [x, 798]], GUMUS, 2.4);
    // minare
    for (const p of parcalar) {
      if (p.tip === 'poligon') minareHalat(ornekle(S.yol(p.noktalar, true), 1), GUMUS, 2.6);
      else if (p.tip === 'topuz') halat(yapi, ornekle(p.yol, 1), ALTIN, 2.6);
      else if (p.tip === 'korkuluk') {
        halat(yapi, [[p.x1, p.y1], [p.x2, p.y1]], GUMUS, 2.6);
        halat(yapi, [[p.x1, p.y2], [p.x2, p.y2]], GUMUS, 2.2);
        const adet = 9;
        for (let i = 0; i <= adet; i++) {
          const x = p.x1 + ((p.x2 - p.x1) * i) / adet;
          tel(yapi, [[x, p.y1 + 2], [x, p.y2 - 2]], GUMUS, 1.5);
          // küçük C kıvrımları korkuluk arasında
          if (i < adet) {
            const xm = x + (p.x2 - p.x1) / adet / 2;
            const ym = (p.y1 + p.y2) / 2;
            tel(yapi, spiralNoktalari(xm, ym, Math.min(4, (p.y2 - p.y1) / 2 - 1.5), i % 2 ? 1 : -1, Math.PI / 2, 1.3), GUMUS, 1.0);
          }
        }
        boncuk(yapi, p.x1, p.y1, 2.8, GUMUS);
        boncuk(yapi, p.x2, p.y1, 2.8, GUMUS);
      } else if (p.tip === 'bant') {
        minareHalat([[p.x1, p.y1], [p.x2, p.y1]], GUMUS, 2.2);
        minareHalat([[p.x1, p.y2], [p.x2, p.y2]], GUMUS, 2.2);
      }
    }
    for (const z of S.zikzakCizgileri()) minareHalat(ornekle(S.yol(z), 0.8), ALTIN, 2.2);
    for (const p of Y.minarePencereleri) halat(yapi, ornekle(p, 0.8), GUMUS, 2.0);

    // alemler: altın telden hilal, granül küreler
    function alem(cx, taban, s) {
      const a = S.alemParcalari(cx, taban, s);
      halat(yapi, ornekle(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), 0.8), ALTIN, 2.4 * Math.max(0.75, s));
      tel(yapi, [[cx - 1.4 * s, a.cubuk.y2], [cx - 1.4 * s, a.cubuk.y1 + 4 * s]], ALTIN, 1.6 * Math.max(0.8, s));
      tel(yapi, [[cx + 1.4 * s, a.cubuk.y2], [cx + 1.4 * s, a.cubuk.y1 + 4 * s]], ALTIN, 1.6 * Math.max(0.8, s));
      for (const k of a.kureler) {
        boncuk(yapi, k.cx, k.cy, k.r, ALTIN);
        // kürenin çevresinde minik granül halkası
        const n = Math.max(8, Math.round(k.r * 2.2));
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2;
          boncuk(yapi, k.cx + Math.cos(t) * (k.r + 1.4 * s), k.cy + Math.sin(t) * (k.r + 1.4 * s), 1.25 * Math.max(0.8, s), ALTIN);
        }
      }
      const h = a.hilal;
      halat(yapi, ornekle(S.hilalYolu(h.cx, h.cy, h.R), 0.6), ALTIN, 2.3 * Math.max(0.8, s));
      // hilal içinde sıra boncuk
      for (let i = 0; i < 7; i++) {
        const t = Math.PI * (0.18 + (0.64 * i) / 6);
        const rr = h.R * 0.86;
        boncuk(yapi, h.cx - Math.cos(t) * rr, h.cy + Math.sin(t) * rr, 1.15 * Math.max(0.75, s), ALTIN);
      }
    }
    alem(560, 300, 1);
    alem(300, 146, 0.62);
    // birleşim boncukları
    for (const k of S.kaburgalar(16)) {
      const p0 = k.noktalar[0];
      boncuk(yapi, p0[0], p0[1] - 1, 2.6, ALTIN);
    }
    for (const kk of S.kasnak) {
      for (const [x, yy] of [[kk.x1, kk.y1], [kk.x2, kk.y1], [kk.x1, kk.y2], [kk.x2, kk.y2]]) boncuk(yapi, x, yy, 3.4, ALTIN);
    }
    for (const p of S.kasnakPencereleri(0).concat(S.kasnakPencereleri(1))) boncuk(yapi, p.x, p.y - 1.5, 2.0, ALTIN);
    for (const p of K.pencereler) {
      boncuk(yapi, p.x, p.y - 2.5, 3.2, GUMUS);
      boncuk(yapi, p.x - p.w / 2, p.y + p.h, 2.4, GUMUS);
      boncuk(yapi, p.x + p.w / 2, p.y + p.h, 2.4, GUMUS);
    }
    for (const x of [K.kornis.x1, K.kornis.x2]) {
      boncuk(yapi, x, K.kornis.y1, 3.6, GUMUS);
      boncuk(yapi, x, K.kornis.y2, 3.0, GUMUS);
    }
    for (let x = K.kornis.x1 + 18; x < K.kornis.x2 - 10; x += 18) boncuk(yapi, x, (K.kornis.y1 + K.kornis.y2) / 2, 2.1, GUMUS);
    for (const x of [365, 495, 625, 755]) {
      boncuk(yapi, x, 706, 2.6, GUMUS);
      boncuk(yapi, x, 798, 2.6, GUMUS);
    }
    for (const p of parcalar) {
      if (p.ad.startsWith('şerefe')) {
        const xs = p.noktalar.map((q) => q[0]);
        boncuk(yapi, Math.min(...xs), p.noktalar[2][1], 3.0, GUMUS);
        boncuk(yapi, Math.max(...xs), p.noktalar[2][1], 3.0, GUMUS);
      }
    }
    boncuk(yapi, 300, 146, 2.6, ALTIN);

    // güneş: altın telkâri gül
    {
      const gx = S.gunes.x;
      const gy = S.gunes.y;
      halat(yapi, ornekle(S.daireYolu(gx, gy, 40), 1), ALTIN, 2.8);
      halat(yapi, ornekle(S.daireYolu(gx, gy, 19), 1), ALTIN, 2.2);
      boncuk(yapi, gx, gy, 5, ALTIN);
      for (let i = 0; i < 12; i++) {
        const t = (i / 12) * Math.PI * 2;
        boncuk(yapi, gx + Math.cos(t) * 10, gy + Math.sin(t) * 10, 1.9, ALTIN);
      }
      for (let i = 0; i < 9; i++) {
        const t = (i / 9) * Math.PI * 2 + 0.2;
        motif(yapi, gx + Math.cos(t) * 29.5, gy + Math.sin(t) * 29.5, 8.4, ALTIN, i % 2 ? 'spiral' : 'S');
      }
      for (let i = 0; i < 24; i++) {
        const t = (i / 24) * Math.PI * 2;
        const L = i % 2 ? 56 : 66;
        tel(yapi, [[gx + Math.cos(t) * 44, gy + Math.sin(t) * 44], [gx + Math.cos(t) * L, gy + Math.sin(t) * L]], ALTIN, 1.5);
        boncuk(yapi, gx + Math.cos(t) * (L + 2.5), gy + Math.sin(t) * (L + 2.5), i % 2 ? 2.2 : 3.0, ALTIN);
      }
    }
    // bulutlar: dalgalı gümüş halat çerçeve (daireler birleşimi, düz taban), içi gümüş kıvrımlarla dolu
    const bulutlar = [[170, 250, 1.0], [470, 150, 0.8], [760, 345, 1.0], [948, 470, 0.68], [84, 470, 0.68]].map(([bx, by, bs]) => {
      const taban = by + 12 * bs;
      const d = [[-36, 2, 12], [-15, -8, 17], [9, -12, 20], [32, -2, 14]].map(([u, v, r]) => [bx + u * bs, by + v * bs, r * bs]);
      return { d, taban, bs };
    });
    const bulutIci = (B, x, y, ic) => {
      if (y > B.taban - ic) return false;
      for (const [cx, cy, r] of B.d) if ((x - cx) ** 2 + (y - cy) ** 2 < (r - ic) ** 2) return true;
      return false;
    };
    for (const B of bulutlar) {
      // her dairenin öteki dairelerin dışında ve tabanın üstünde kalan yayı
      for (const [cx, cy, r] of B.d) {
        const pts = [];
        const n = Math.ceil((Math.PI * 2 * r) / 0.8);
        for (let i = 0; i <= n; i++) {
          const t = -Math.PI / 2 + (i / n) * Math.PI * 2;
          pts.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]);
        }
        const gizli = (x, y) => y > B.taban || B.d.some(([ox, oy, or]) => (ox !== cx || oy !== cy) && (x - ox) ** 2 + (y - oy) ** 2 < (or - 0.2) ** 2);
        for (const r2 of parcala(pts, gizli)) halat(yapi, r2, GUMUS, 2.0);
      }
      const [lx, ly, lr] = B.d[0];
      const [rx, ry, rr] = B.d[B.d.length - 1];
      const x1 = lx - Math.sqrt(Math.max(0, lr * lr - (B.taban - ly) ** 2));
      const x2 = rx + Math.sqrt(Math.max(0, rr * rr - (B.taban - ry) ** 2));
      halat(yapi, [[x1, B.taban], [x2, B.taban]], GUMUS, 2.0);
      boncuk(yapi, x1 - 1, B.taban, 2.6, GUMUS);
      boncuk(yapi, x2 + 1, B.taban, 2.6, GUMUS);
    }

    // yer çizgisi: iki yanda gümüş halat
    halat(yapi, [[0, 801], [264, 801]], GUMUS, 2.6);
    halat(yapi, [[822, 801], [W, 801]], GUMUS, 2.6);

    // dolgu: hatlar çizildikten sonra, görünür hatlardan çıkarılan maskeyle
    const yapiSinir = katmanMaskesi(yapi, (g) => {
      g.lineWidth = 2.4;
      for (const x of [365, 495, 625, 755]) {
        g.beginPath();
        g.moveTo(x, 704);
        g.lineTo(x, 800);
        g.stroke();
      }
    });
    const yapiMalzeme = new Uint8Array(W * W);
    const bulutMu = new Uint8Array(W * W);
    for (const B of bulutlar) {
      const xs = B.d.map(([cx, , r]) => [cx - r, cx + r]).flat();
      const ys = B.d.map(([, cy, r]) => cy - r);
      for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(B.taban); y++) {
        for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++) {
          if (x >= 0 && x < W && y >= 0 && y < W && bulutIci(B, x, y, 0)) bulutMu[y * W + x] = 1;
        }
      }
    }
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (yapiSinir[i]) continue;
        const b = yapiH[i];
        if (b === NO.kubbe) yapiMalzeme[i] = 1;
        else if (b === NO.kasnak || b === NO.kaide) yapiMalzeme[i] = 2;
        else if (b === NO.minare) {
          // topuz altın, korkuluk aralığı boş (korkuluk ayrıca çizilir)
          const korkuluk = (y > 436 && y < 456) || (y > 272 && y < 290);
          if (korkuluk) continue;
          yapiMalzeme[i] = y < 202 ? 1 : 2;
        } else if (bulutMu[i]) yapiMalzeme[i] = 2;
      }
    }
    doldur(
      yapi,
      yapiMalzeme,
      (x, y) => {
        if (bulutMu[Math.round(y) * W + Math.round(x)]) return 4.2;
        if (S.kubbedeMi(x, y)) return 5.2 + 2.6 * ((y - 300) / 255);
        if (y >= 704) return 8.0; // kaide
        if (y >= 555 && x > 330) return 4.4; // kasnak
        return 4.8; // minare
      },
      null
    );

    // ================================================================ BİTKİLER (ayrı katman: kendi gölgesiyle yapının önünde)
    // çizim sırası SAHNE'deki gibi: saplar, yapraklar, tomurcuklar, çiçekler (taç yaprakları sırayla birbirinin üstüne)
    const bitki = yeniKatman();
    const oc = S.yeniTuval(4, 4).getContext('2d');
    const ortenler = [];
    const ortenEkle = (z, d, pts) => {
      let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      for (const [x, y] of pts) {
        x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y);
      }
      ortenler.push({ z, yol: new Path2D(d), x1, y1, x2, y2 });
    };
    const ortuluMu = (z) => (x, y) => {
      for (const o of ortenler) {
        if (o.z <= z || x < o.x1 || x > o.x2 || y < o.y1 || y > o.y2) continue;
        if (oc.isPointInPath(o.yol, x, y)) return true;
      }
      return false;
    };
    const yaprakNokta = S.bitki.yapraklar.map((yp) => ornekle(S.yaprakYolu(yp), 0.8));
    yaprakNokta.forEach((pts, i) => ortenEkle(1 + i, S.yaprakYolu(S.bitki.yapraklar[i]), pts));
    const tomNokta = S.bitki.tomurcuklar.map((t) => ornekle(S.tomurcukYolu(t), 0.7));
    tomNokta.forEach((pts, i) => ortenEkle(1000 + i, S.tomurcukYolu(S.bitki.tomurcuklar[i]), pts));
    const tacNokta = S.bitki.cicekler.map((c, f) =>
      S.tacYapraklari(c).map((e, k) => {
        const pts = ornekle(S.elipsYolu(e), 0.7);
        ortenEkle(2000 + f * 10 + k, S.elipsYolu(e), pts);
        return pts;
      })
    );
    // saplar
    for (const s of S.bitki.saplar) for (const r of parcala(ornekle(S.yol(s), 0.8), ortuluMu(0))) halat(bitki, r, ESKI, 2.5);
    S.bitki.yapraklar.forEach((yp, i) => {
      const gizli = ortuluMu(1 + i);
      for (const r of parcala(yaprakNokta[i], gizli)) halat(bitki, r, ESKI, 1.9);
      const [a, b] = S.yaprakDamari(yp);
      const dm = [];
      for (let k = 0; k <= 24; k++) dm.push([a[0] + ((b[0] - a[0]) * k) / 24, a[1] + ((b[1] - a[1]) * k) / 24]);
      for (const r of parcala(dm, gizli)) tel(bitki, r, ESKI, 1.2);
      if (!gizli(a[0], a[1])) boncuk(bitki, a[0], a[1], 1.9, ALTIN);
      // balık sırtı dolgu: damardan kenara, uca doğru eğik sık yassı teller
      const yol = new Path2D(S.yaprakYolu(yp));
      const ux = (b[0] - a[0]) / Math.hypot(b[0] - a[0], b[1] - a[1]);
      const uy = (b[1] - a[1]) / Math.hypot(b[0] - a[0], b[1] - a[1]);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const ARA = yp.uzunluk > 50 ? 3.1 : 2.7;
      for (const yan of [1, -1]) {
        const ca = Math.cos(0.95 * yan);
        const sa = Math.sin(0.95 * yan);
        const dx = ux * ca - uy * sa;
        const dy = ux * sa + uy * ca;
        for (let u = ARA * 1.2; u < L - ARA * 0.6; u += ARA) {
          const x0 = a[0] + ux * u + dx * 1.6;
          const y0 = a[1] + uy * u + dy * 1.6;
          const pts = [];
          for (let t = 0; t < 60; t += 0.6) {
            const x = x0 + dx * t;
            const y = y0 + dy * t;
            if (!oc.isPointInPath(yol, x + dx * 2.1, y + dy * 2.1)) break;
            pts.push([x, y]);
          }
          if (pts.length < 2) continue;
          for (const r of parcala(pts, gizli)) tel(bitki, r, ESKI, 0.95);
        }
      }
    });
    S.bitki.tomurcuklar.forEach((t, i) => {
      const gizli = ortuluMu(1000 + i);
      for (const r of parcala(tomNokta[i], gizli)) halat(bitki, r, GUMUS, 1.8);
      const sp = spiralNoktalari(t.x + Math.cos(t.aci) * t.r * 0.3, t.y + Math.sin(t.aci) * t.r * 0.3, t.r * 0.55, 1, t.aci);
      for (const r of parcala(sp, gizli)) tel(bitki, r, GUMUS, 1.0);
      const ux = t.x + Math.cos(t.aci) * t.r * 1.6;
      const uy = t.y + Math.sin(t.aci) * t.r * 1.6;
      if (!gizli(ux, uy)) boncuk(bitki, ux, uy, 2.0, ALTIN);
    });
    S.bitki.cicekler.forEach((c, f) => {
      const kal = c.r > 40 ? 2.4 : c.r > 26 ? 2.0 : 1.7;
      tacNokta[f].forEach((pts, k) => {
        for (const r of parcala(pts, ortuluMu(2000 + f * 10 + k))) halat(bitki, r, GUMUS, kal);
      });
    });
    // çiçek ortaları ve taç yaprağı uçları: en üstte
    const ortaUst = (f) => ortuluMu(2000 + f * 10 + 9);
    S.bitki.cicekler.forEach((c, f) => {
      const rr = c.r * 0.28;
      const br = Math.max(1.3, c.r * 0.045);
      const gizli = ortaUst(f);
      if (gizli(c.x, c.y)) return;
      boncuk(bitki, c.x, c.y, br * 1.6, ALTIN);
      for (let halka = 1; halka * br * 2.05 < rr; halka++) {
        const R = halka * br * 2.05;
        const n = Math.floor((2 * Math.PI * R) / (br * 2.1));
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2 + halka * 0.4;
          boncuk(bitki, c.x + Math.cos(t) * R, c.y + Math.sin(t) * R, br, ALTIN);
        }
      }
      for (let k = 0; k < 5; k++) {
        const a = c.aci + (k * Math.PI * 2) / 5;
        const x = c.x + Math.cos(a) * c.r * 1.0;
        const y = c.y + Math.sin(a) * c.r * 1.0;
        if (!gizli(x, y)) boncuk(bitki, x, y, Math.max(1.6, c.r * 0.05), GUMUS);
      }
    });
    const bitkiSinir = katmanMaskesi(bitki, (g) => {
      for (const c of S.bitki.cicekler) {
        g.beginPath();
        g.arc(c.x, c.y, c.r * 0.3, 0, Math.PI * 2);
        g.fill();
      }
    });
    const bitkiMalzeme = new Uint8Array(W * W);
    for (let i = 0; i < W * W; i++) {
      if (bitkiSinir[i]) continue;
      const b = tumH[i];
      if (b === NO.cicek) bitkiMalzeme[i] = 2; // yapraklar balık sırtıyla dolu, spiral yalnız taç yapraklarında
    }
    doldur(bitki, bitkiMalzeme, (x, y, m) => (m === 3 ? 4.0 : 5.0), null);

    // ================================================================ KADİFE ZEMİN (piksel piksel, 2048)
    function hash(x, y, t) {
      let h = (x * 374761393 + y * 668265263 + t * 1442695041) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function gurultu(x, y, t) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const a = hash(xi, yi, t);
      const b = hash(xi + 1, yi, t);
      const c = hash(xi, yi + 1, t);
      const d = hash(xi + 1, yi + 1, t);
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    }
    {
      const img = ctx.createImageData(IC, IC);
      const o = img.data;
      for (let Y2 = 0; Y2 < IC; Y2++) {
        for (let X2 = 0; X2 < IC; X2++) {
          const x = X2 / 2;
          const y = Y2 / 2;
          // geniş parlaklık (kadifenin hav yönüne göre ışıltısı)
          const sheen = gurultu(x / 260, y / 260, 1) * 0.6 + gurultu(x / 120, y / 120, 2) * 0.4;
          const isik = 0.72 + 0.5 * Math.max(0, 1 - Math.hypot(x - 760, y - 220) / 900);
          // hav: ince lif dokusu (dikeyde uzamış)
          const lif = gurultu(X2 / 1.6, Y2 / 7, 3) * 0.6 + hash(X2, Y2, 4) * 0.4;
          const kenar = 1 - 0.35 * Math.pow(Math.hypot(x - 512, y - 512) / 724, 2.2);
          const v = (0.62 + 0.55 * sheen) * isik * kenar * (0.86 + 0.24 * lif);
          const i = (Y2 * IC + X2) * 4;
          o[i] = Math.min(255, 92 * v);
          o[i + 1] = Math.min(255, 16 * v + 3);
          o[i + 2] = Math.min(255, 34 * v + 4);
          o[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // ================================================================ katmanları gölgeleriyle bindir
    function bindir(K) {
      const mt = S.yeniTuval(IC, IC);
      const mc = mt.getContext('2d');
      mc.setTransform(2, 0, 0, 2, 0, 0);
      katmaniCiz(mc, K);
      if (K.hacim) K.hacim(mc); // metale hafif hacim ışığı
      // gölge maskesi
      const gt = S.yeniTuval(IC, IC);
      const gc = gt.getContext('2d');
      gc.drawImage(mt, 0, 0);
      gc.globalCompositeOperation = 'source-in';
      gc.fillStyle = '#12020a';
      gc.fillRect(0, 0, IC, IC);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // havda gömülme: geniş yumuşak koyuluk
      ctx.globalAlpha = 0.45;
      ctx.filter = 'blur(7px)';
      ctx.drawImage(gt, -2, 4);
      // keskin atılan gölge: ışık sağ üstten → gölge sol alta
      ctx.globalAlpha = 0.8;
      ctx.filter = 'blur(2.2px)';
      ctx.drawImage(gt, -4, 6);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
      ctx.drawImage(mt, 0, 0);
      ctx.restore();
    }
    // yapı: kubbe sağ üstten aydınlık, sol altta koyu; minare solda koyu (parçaya hacim verir)
    yapi.hacim = (c) => {
      c.save();
      c.globalCompositeOperation = 'source-atop';
      let g = c.createRadialGradient(650, 370, 20, 590, 430, 300);
      g.addColorStop(0, 'rgba(255,244,210,0.22)');
      g.addColorStop(0.55, 'rgba(255,244,210,0)');
      g.addColorStop(1, 'rgba(20,0,5,0.32)');
      c.fillStyle = g;
      c.fill(new Path2D(S.kubbeYolu));
      g = c.createLinearGradient(266, 0, 334, 0);
      g.addColorStop(0, 'rgba(20,0,5,0.3)');
      g.addColorStop(0.6, 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(255,255,255,0.12)');
      c.fillStyle = g;
      c.fillRect(240, 70, 120, 740);
      g = c.createLinearGradient(330, 0, 790, 0);
      g.addColorStop(0, 'rgba(20,0,5,0.22)');
      g.addColorStop(0.7, 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(255,250,235,0.12)');
      c.fillStyle = g;
      c.fillRect(330, 555, 460, 137);
      g = c.createLinearGradient(290, 0, 830, 0);
      g.addColorStop(0, 'rgba(20,0,5,0.18)');
      g.addColorStop(1, 'rgba(255,250,235,0.1)');
      c.fillStyle = g;
      c.fillRect(288, 690, 545, 112);
      c.restore();
    };
    bindir(yapi);
    bindir(bitki);

    // ışıltılar: birkaç parlak nokta (tel üstünde yansıyan ışık)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const parlak = yapi.boncuklar.concat(bitki.boncuklar).filter((b) => b.r > 2.4);
    for (let i = 0; i < parlak.length; i += 7) {
      const b = parlak[i];
      const x = b.x + b.r * 0.3;
      const y = b.y - b.r * 0.35;
      const g = ctx.createRadialGradient(x, y, 0, x, y, b.r * 2.2);
      g.addColorStop(0, 'rgba(255,250,230,0.55)');
      g.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - b.r * 2.2, y - b.r * 2.2, b.r * 4.4, b.r * 4.4);
    }
    ctx.restore();

    S.hazir();
  })();
</script>
