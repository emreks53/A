<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-182 Guaj Doğa Levhası — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F1E9D8; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
/*
 * S-182 Guaj Doğa Levhası — hayalî bir doğa tarihi levha ressamının eli: soluk ılık bir zemin üstünde örtücü
 guajla, kontursuz, yumuşak modelajla ve en ince samur fırçayla tek tek işlenmiş ayrıntılar (taş derzleri,
 kaburga sırtları, yaprak damarları, taç yaprak damarları, ercikler); sakin, mat ve titiz.
 * Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
 */
(function () {
  'use strict';
  // ================================================================ el araçları (h5 kiti)
  const OL = 2; // iç çözünürlük çarpanı: 2048 piksel, koordinatlar 1024
  const DW = 1024 * OL, DH = 1024 * OL;
  const PI2 = Math.PI * 2;
  let TANE = null; // kâğıt tanesi (kagitUret doldurur)
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karis(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }

  /** Ekran dışı katman (2048 piksel, 1024 koordinat). */
  function katman(okunur) {
    const c = SAHNE.yeniTuval(DW, DH);
    const x = c.getContext('2d', { willReadFrequently: !!okunur });
    x.setTransform(OL, 0, 0, OL, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x };
  }
  function temizle(x) { x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, DW, DH); x.restore(); }

  /** Değer gürültüsü (0..1). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function fbm(tohum, okt) {
    const n = gurultu(tohum);
    okt = okt || 4;
    return (x, y) => {
      let s = 0, a = 1, t = 0, f = 1;
      for (let k = 0; k < okt; k++) { s += n(x * f + k * 31.7, y * f - k * 17.3) * a; t += a; a *= 0.5; f *= 2.03; }
      return s / t;
    };
  }

  // ---------------------------------------------------------------- yol geometrisi
  /** SVG yolunu (M L C A Z, mutlak) nokta dizilerine çevirir; her dizi .kapali bilgisi taşır. */
  function duzlestir(d, adim) {
    adim = adim || 1.5;
    const tok = d.match(/[MLCAZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const ekle = (x, y) => cur.push([x, y]);
    const dogru = (x, y) => {
      const m = Math.max(1, Math.ceil(Math.hypot(x - cx, y - cy) / adim));
      for (let j = 1; j <= m; j++) ekle(cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') {
        if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) dogru(sx, sy); else cur[cur.length - 1] = [sx, sy]; cur.kapali = true; }
        cx = sx; cy = sy; cur = null;
        continue;
      }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') dogru(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          ekle(u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const dx = (cx - x) / 2, dy = (cy - y) / 2;
        const x1p = cr * dx + sr * dy, y1p = -sr * dx + cr * dy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(8, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          ekle(cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
  /** Eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1], o = out[out.length - 1];
    if (Math.hypot(s[0] - o[0], s[1] - o[1]) > adim * 0.3) out.push([s[0], s[1]]);
    else out[out.length - 1] = [s[0], s[1]];
    return out;
  }
  /** Dizinin s0..s1 yay uzunluğu aralığındaki parçası. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1], b = p[i];
      const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (s + l >= s0 && s <= s1) {
        const t0 = clamp((s0 - s) / (l || 1), 0, 1), t1 = clamp((s1 - s) / (l || 1), 0, 1);
        if (!out.length) out.push([lerp(a[0], b[0], t0), lerp(a[1], b[1], t0)]);
        out.push([lerp(a[0], b[0], t1), lerp(a[1], b[1], t1)]);
      }
      s += l;
    }
    return out;
  }
  /** Keskin köşelerden böler (kalem köşede kalkar). */
  function koseBol(p, esik) {
    esik = esik === undefined ? 0.75 : esik;
    const out = [];
    let cur = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      cur.push(p[i]);
      const a = Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0]);
      const b = Math.atan2(p[i + 1][1] - p[i][1], p[i + 1][0] - p[i][0]);
      let d = Math.abs(b - a);
      if (d > Math.PI) d = PI2 - d;
      if (d > esik) { out.push(cur); cur = [p[i]]; }
    }
    cur.push(p[p.length - 1]);
    out.push(cur);
    return out.filter((q) => q.length > 1);
  }
  /** Normal boyunca gürültüyle titretir (el titremesi). kapali → dikişsiz. */
  function titret(p, gen, dalga, nf, faz, kapali) {
    const L = uzunluk(p) || 1;
    const out = [];
    let s = 0;
    const R = L / (PI2 * dalga);
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      let v;
      if (kapali) { const th = (PI2 * s) / L; v = nf(faz + R * Math.cos(th), faz * 0.7 + R * Math.sin(th)); }
      else v = nf(s / dalga + faz, faz * 1.3);
      const d = gen * (v - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }
    return out;
  }
  function yolCiz(x, p, kapali) {
    x.beginPath();
    p.forEach((q, i) => (i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])));
    if (kapali) x.closePath();
  }
  function p2d(p, kapali) {
    const P = new Path2D();
    p.forEach((q, i) => (i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1])));
    if (kapali) P.closePath();
    return P;
  }
  /** SVG yolunu titretilmiş Path2D'ye çevirir (elle çizilmiş kenar). */
  function elYolu(d, gen, dalga, nf, faz) {
    const P = new Path2D();
    for (const p of duzlestir(d, 1.2)) {
      const q = titret(ornekle(p, 1.2), gen, dalga, nf, faz, p.kapali);
      q.forEach((v, i) => (i ? P.lineTo(v[0], v[1]) : P.moveTo(v[0], v[1])));
      if (p.kapali) P.closePath();
    }
    return P;
  }
  function kutuBul(diziler, pay) {
    pay = pay || 0;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of diziler) for (const [x, y] of p) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    return [x0 - pay, y0 - pay, x1 + pay, y1 + pay];
  }

  // ---------------------------------------------------------------- değişken kalınlıklı çizgi (kalem/fırça)
  /**
   * p: nokta dizisi; gen(t, aci, s) → o noktadaki tam kalınlık (1024 birim). Uçlar yuvarlak.
   */
  function cizgi(x, p, gen, renk, uclar) {
    const n = p.length;
    if (n < 2) return;
    const L = uzunluk(p);
    const sol = [], sag = [], wl = [];
    let s = 0;
    for (let i = 0; i < n; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      const aci = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const w = Math.max(0, gen(L ? s / L : 0, aci, s, L)) / 2;
      wl.push(w);
      const nx = -Math.sin(aci), ny = Math.cos(aci);
      sol.push([p[i][0] + nx * w, p[i][1] + ny * w]);
      sag.push([p[i][0] - nx * w, p[i][1] - ny * w]);
    }
    x.fillStyle = renk;
    x.beginPath();
    sol.forEach((q, i) => (i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])));
    for (let i = n - 1; i >= 0; i--) x.lineTo(sag[i][0], sag[i][1]);
    x.closePath();
    x.fill();
    if (uclar !== false) {
      if (wl[0] > 0.15) { x.beginPath(); x.arc(p[0][0], p[0][1], wl[0], 0, PI2); x.fill(); }
      if (wl[n - 1] > 0.15) { x.beginPath(); x.arc(p[n - 1][0], p[n - 1][1], wl[n - 1], 0, PI2); x.fill(); }
    }
  }

  // ---------------------------------------------------------------- kâğıt
  /** Kâğıt dokusu: TANE (Float32, 0..1, cihaz pikseli) ve boyanmış kâğıt tuvali. */
  function kagitUret(o) {
    o = Object.assign({ renk: '#FBF7EC', tohum: 11, dis: 0.5, iri: 0.5, lif: 0.0, guc: 9, laid: 0 }, o);
    // ince diş: rastgele piksel → hafif bulanık; iri: düşük çözünürlüklü gürültü büyütülmüş
    const r = SAHNE.rng(o.tohum);
    const a = SAHNE.yeniTuval(DW, DH);
    const ax = a.getContext('2d', { willReadFrequently: true });
    const id = ax.createImageData(DW, DH);
    for (let i = 0; i < DW * DH; i++) { const v = (r() * 255) | 0; id.data[i * 4] = v; id.data[i * 4 + 3] = 255; }
    ax.putImageData(id, 0, 0);
    const b = SAHNE.yeniTuval(DW, DH);
    const bx = b.getContext('2d', { willReadFrequently: true });
    bx.filter = 'blur(1.1px)';
    bx.drawImage(a, 0, 0);
    bx.filter = 'none';
    const ince = bx.getImageData(0, 0, DW, DH).data;
    // iri: 160² rastgele → büyüt (yumuşak)
    const k = 160;
    const s = SAHNE.yeniTuval(k, k);
    const sx = s.getContext('2d');
    const sd = sx.createImageData(k, k);
    for (let i = 0; i < k * k; i++) { sd.data[i * 4] = (r() * 255) | 0; sd.data[i * 4 + 3] = 255; }
    sx.putImageData(sd, 0, 0);
    bx.imageSmoothingEnabled = true;
    bx.imageSmoothingQuality = 'high';
    bx.filter = 'blur(6px)';
    bx.drawImage(s, -20, -20, DW + 40, DH + 40);
    bx.filter = 'none';
    const iri = bx.getImageData(0, 0, DW, DH).data;
    const T2 = new Float32Array(DW * DH);
    let mn = 1e9, mx = -1e9;
    for (let i = 0; i < DW * DH; i++) {
      const v = o.dis * (ince[i * 4] / 255) + o.iri * (iri[i * 4] / 255);
      T2[i] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    // kontrast genişlet (ortalama ~0.5)
    let ort = 0;
    for (let i = 0; i < DW * DH; i += 97) ort += T2[i];
    ort /= Math.ceil((DW * DH) / 97);
    const yay = Math.max(ort - mn, mx - ort) * 0.55;
    for (let i = 0; i < DW * DH; i++) T2[i] = clamp(0.5 + (T2[i] - ort) / (2 * yay), 0, 1);
    if (o.laid) {
      // dökme kâğıdın ince yatay çizgileri ve seyrek zincir çizgileri (kâğıdın yapısı)
      for (let y = 0; y < DH; y++) {
        const v = 0.5 + 0.5 * Math.sin((y / OL) * PI2 / 2.2);
        for (let xx = 0; xx < DW; xx++) T2[y * DW + xx] = clamp(T2[y * DW + xx] + (v - 0.5) * o.laid, 0, 1);
      }
      for (let xx = 0; xx < DW; xx++) {
        const d = Math.abs((((xx / OL) + 40) % 92) - 46) ;
        const v = Math.exp(-(46 - d) * (46 - d) / 3) ;
        if (v > 0.01) for (let y = 0; y < DH; y++) T2[y * DW + xx] = clamp(T2[y * DW + xx] + v * o.laid * 0.8, 0, 1);
      }
    }
    // boyanmış kâğıt
    const c = SAHNE.yeniTuval(DW, DH);
    const cx = c.getContext('2d', { willReadFrequently: true });
    const pd = cx.createImageData(DW, DH);
    const [R, G, B] = hex(o.renk);
    for (let i = 0; i < DW * DH; i++) {
      const v = (T2[i] - 0.5) * o.guc;
      pd.data[i * 4] = R - v;
      pd.data[i * 4 + 1] = G - v;
      pd.data[i * 4 + 2] = B - v * 1.1;
      pd.data[i * 4 + 3] = 255;
    }
    cx.putImageData(pd, 0, 0);
    if (o.lif > 0) {
      // seyrek kâğıt lifleri
      const L = cx;
      L.setTransform(OL, 0, 0, OL, 0, 0);
      for (let i = 0; i < 1400 * o.lif; i++) {
        const x0 = r() * 1024, y0 = r() * 1024, a0 = r() * PI2, l = 3 + r() * 9;
        L.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(120,100,70,0.07)';
        L.lineWidth = 0.35 + r() * 0.3;
        L.beginPath();
        L.moveTo(x0, y0);
        L.quadraticCurveTo(x0 + Math.cos(a0 + 0.6) * l * 0.5, y0 + Math.sin(a0 + 0.6) * l * 0.5, x0 + Math.cos(a0) * l, y0 + Math.sin(a0) * l);
        L.stroke();
      }
      L.setTransform(1, 0, 0, 1, 0, 0);
    }
    TANE = T2;
    return { c, TANE: T2 };
  }

  // ---------------------------------------------------------------- suluboya lavisi
  /** Kutu boyutunda geçici tuval (büyük tuvalde süzgeç pahalıdır). */
  function kucukTuval(w, h) {
    const c = SAHNE.yeniTuval(w, h);
    return { c, x: c.getContext('2d', { willReadFrequently: true }) };
  }
  /** Cihaz pikseli kutusu (pay eklenmiş, sınırlanmış). */
  function cihazKutu(kutu, pay) {
    let [x0, y0, x1, y1] = kutu ? kutu.map((v) => v * OL) : [0, 0, DW, DH];
    x0 = clamp(Math.floor(x0) - pay, 0, DW); y0 = clamp(Math.floor(y0) - pay, 0, DH);
    x1 = clamp(Math.ceil(x1) + pay, 0, DW); y1 = clamp(Math.ceil(y1) + pay, 0, DH);
    return [x0, y0, x1 - x0, y1 - y0];
  }
  /** ciz(ctx) ile beyaz maske çizer; kutu tuvali ve (isteğe bağlı) bulanık kopyası döner. */
  function maskeCiz(ciz, x0, y0, w, h, yumusak) {
    const M = kucukTuval(w, h);
    M.x.setTransform(OL, 0, 0, OL, -x0, -y0);
    M.x.fillStyle = '#fff';
    M.x.strokeStyle = '#fff';
    M.x.lineCap = 'round';
    M.x.lineJoin = 'round';
    ciz(M.x);
    if (yumusak) {
      const Y = kucukTuval(w, h);
      Y.x.filter = `blur(${yumusak * OL}px)`;
      Y.x.drawImage(M.c, 0, 0);
      return Y;
    }
    return M;
  }
  /**
   * Saydam lavi: maskeyi ciz(ctx) ile çizer (beyaz dolgu; gradyanla yoğunluk verilebilir), kenarda pigment
   * birikmesi, kâğıt tanesinde çökelme ve hafif dalgalanma ekler; hedefe 'multiply' ile bindirir.
   * o.f(x,y,a) → piksel başına yoğunluk çarpanı (1024 koordinat) verilebilir.
   */
  function lavi(hedef, ciz, renk, o) {
    o = Object.assign({ alfa: 0.5, kenar: 0.7, kenarR: 2.6, tane: 0.2, dalga: 0.1, dalgaO: 0.008, kutu: null, tohum: 1, renk2: null, karisO: 0.006, mod: 'multiply', f: null, TANE: null, yumusak: 0 }, o);
    const T = o.TANE || TANE;

  /** Bir yolun içini kâğıda geri döndürür (öndeki öğe arkadakini örter). kutu: 1024 biriminde sınır. */
  function kagidaDon(x, yol, kagitC, kutu) {
    let [x0, y0, x1, y1] = kutu ? kutu.map((v) => v * OL) : [0, 0, DW, DH];
    x0 = clamp(Math.floor(x0) - 4, 0, DW); y0 = clamp(Math.floor(y0) - 4, 0, DH);
    x1 = clamp(Math.ceil(x1) + 4, 0, DW); y1 = clamp(Math.ceil(y1) + 4, 0, DH);
    if (x1 <= x0 || y1 <= y0) return;
    x.save();
    x.clip(yol);
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = 'source-over';

  }
  /** Ana tuvali CPU tarafında (okunabilir) kurar. */
  function anaTuval() {
    const cv = document.getElementById('tuval');
    cv.getContext('2d', { willReadFrequently: true });
    const x = SAHNE.tuval(cv, OL);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return x;
  }

  // ---------------------------------------------------------------- ışık modeli (sağ üstten)
  const ISIK = (() => { const v = [0.62, -0.55, 0.56]; const l = Math.hypot(...v); return v.map((q) => q / l); })();
  const _PROF = SAHNE.kubbeProfili(240);
  /** Kubbede (x,y) için Lambert aydınlığı (0..1); kubbe dışında -1. */
  function kubbeIsik(x, y) {
    if (y > 555 || y < 300) return -1;
    let i = 0;
    while (i < _PROF.length - 2 && _PROF[i + 1].y > y) i++;
    const p = _PROF[i], q = _PROF[i + 1];
    const t = clamp((p.y - y) / (p.y - q.y || 1), 0, 1);
    const r = lerp(p.r, q.r, t);
    if (r <= 0.5 || Math.abs(x - 560) > r) return -1;
    const dh = p.y - q.y, dr = q.r - p.r;
    const l = Math.hypot(dh, dr) || 1;
    const ca = dh / l, sa = -dr / l;
    const u = clamp((x - 560) / r, -1, 1);
    const cz = Math.sqrt(1 - u * u);
    const n = [u * ca, -sa, cz * ca];
    return Math.max(0, n[0] * ISIK[0] + n[1] * ISIK[1] + n[2] * ISIK[2]);
  }
  function kubbeYaricap(y) {
    let i = 0;
    while (i < _PROF.length - 2 && _PROF[i + 1].y > y) i++;

    const t = clamp((p.y - y) / (p.y - q.y || 1), 0, 1);

  }
  /** Dikey silindir (kasnak, minare) için aydınlık. */
  function silindirIsik(x, cx, R) {
    const u = clamp((x - cx) / R, -1, 1);
    const n = [u, 0, Math.sqrt(1 - u * u)];
    return Math.max(0, n[0] * ISIK[0] + n[2] * ISIK[2]);

  // ---------------------------------------------------------------- sahne yardımcıları
  const f2 = (v) => Math.round(v * 100) / 100;
  /** Ucu hafif çentikli yabani gül taç yaprağı: merkezden a yönünde, boy L, yarı en G. */
  function tacYolu(cx, cy, a, L, G, centik) {
    centik = centik === undefined ? 0.1 : centik;
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = (u, v) => `${f2(cx + u * L * ca - v * G * sa)},${f2(cy + u * L * sa + v * G * ca)}`;
    const n = 1 - centik;
    return `M${p(0.05, 0)} C${p(0.3, -0.5)} ${p(0.6, -1.02)} ${p(0.86, -0.82)} C${p(1.0, -0.66)} ${p(1.02, -0.16)} ${p(n, 0)} ` +

  }
  /** Bulut: tabanı düz, üstü kabarık daireler. [{x,y,r}] ve taban y'si. */
  function bulutDaireleri(cx, cy, s, r, o) {
    o = Object.assign({ n: 9, en: 200, boy: 1 }, o);
    const out = [];
    const n = o.n;
    const taban = cy + 10 * s;
    for (let i = 0; i < n; i++) {
      const t = 0.07 + (0.86 * i) / (n - 1);
      const x = cx + (t - 0.5) * o.en * s + (i && i < n - 1 ? (r() - 0.5) * 8 * s : 0);

      out.push({ x, y: taban - rr * (0.55 + 0.35 * yuk), r: rr });
    }
    for (let i = 0; i < 3; i++) {
      const t = 0.3 + i * 0.2 + (r() - 0.5) * 0.08;

  /** Bulut dış çizgisi parçaları (görünen yaylar) ve dolgu yolu. */

      let cur = null;
      for (let k = 0; k <= 120; k++) {
        const a = Math.PI + (Math.PI * 2 * k) / 120;
        const x = d.x + Math.cos(a) * d.r, y = d.y + Math.sin(a) * d.r;
        let acik = y < b.taban - 0.5;
        if (acik) for (const e of b.daireler) if (e !== d && Math.hypot(x - e.x, y - e.y) < e.r - 0.4) { acik = false; break; }
        if (acik) { if (!cur) { cur = []; parcalar.push(cur); } cur.push([x, y]); } else cur = null;
      }
    }
    const dolgu = new Path2D();
    for (const d of b.daireler) { dolgu.moveTo(d.x + d.r, d.y); dolgu.arc(d.x, d.y, d.r, 0, PI2); }

  // ---------------------------------------------------------------- örtücü guaj dolgu

  // ================================================================ stilin çizimi

  const R = SAHNE.rng(182);
  const ctx = anaTuval();
  const kag = kagitUret({ renk: '#F1E9D8', tohum: 182, dis: 0.8, iri: 0.25, guc: 7, lif: 0.4 });
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(kag.c, 0, 0); ctx.restore();
  const nI = gurultu(1821);

  /** Renk durakları arasında ara değer: duraklar [[t, '#hex'], ...] → (t) → [r,g,b]. */
  function rampa(duraklar) {
    const d = duraklar.map(([t, h]) => [t, hex(h)]);
    return (t) => {
      t = clamp(t, 0, 1);
      let i = 0;
      while (i < d.length - 2 && t > d[i + 1][0]) i++;
      const [t0, a] = d[i], [t1, b] = d[i + 1];
      const u = sstep(0, 1, clamp((t - t0) / (t1 - t0 || 1), 0, 1));

  const css = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  /**
   * Örtücü guaj: önce modelajı yarı yarıya yassıltılmış mat bir zemin katı, sonra modelajı asıl kuran ince ve
   * düzenli fırça taramaları (form yönünde, eşit aralıklı): ışıkta beyaz katılmış açık, gölgede koyu ve çapraz.
   */
  const BEYAZ = [255, 252, 242];
  const lum = (c) => 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2];
  function boya(yol, kutu, renkF, yonF, o) {
    o = Object.assign({ yog: 1, uzun: 7, kalin: 0.7, alfa: 0.6, kontrast: 0.2, duz: 0.3, capraz: 1, doku: 0.03, ara: 2.3, zemin: true, sap: 0.1 }, o);
    const [x0, y0, x1, y1] = kutu;
    // ortalama ton (yassıltma ve açık/koyu tarama kararı için)
    let ort = [0, 0, 0];
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) { const c = renkF(lerp(x0, x1, (i + 0.5) / 5), lerp(y0, y1, (j + 0.5) / 5)); ort[0] += c[0] / 25; ort[1] += c[1] / 25; ort[2] += c[2] / 25; }
    const lO = lum(ort) + 1;
    if (o.zemin) {
      const fz = o.duz > 0 ? (x, y) => { const c = renkF(x, y); return [lerp(c[0], ort[0], o.duz), lerp(c[1], ort[1], o.duz), lerp(c[2], ort[2], o.duz)]; } : renkF;

    }

    const gecis = Math.ceil(o.yog), olas = o.yog / gecis;
    const ax = o.ara * 2.2, ay = o.ara;
    ctx.save();
    ctx.clip(yol);
    ctx.lineCap = 'round';
    for (let g = 0; g < gecis; g++) {
      for (let gy = y0 - ay; gy < y1 + ay; gy += ay) {
        for (let gx = x0 - ax; gx < x1 + ax; gx += ax) {
          if (R() > olas) continue;
          const x = gx + R() * ax, y = gy + R() * ay;
          const c = renkF(x, y);
          const b = (lum(c) - lO) / lO;
          const pa = clamp(0.5 + b * 2.6, 0.14, 0.86);
          const acik = R() < pa;
          const k = o.kontrast * (0.55 + R() * 0.7);
          const cc = acik ? [lerp(c[0], BEYAZ[0], k), lerp(c[1], BEYAZ[1], k), lerp(c[2], BEYAZ[2], k)] : [c[0] * (1 - k), c[1] * (1 - k * 0.92), c[2] * (1 - k * 0.8)];
          const a = (typeof yonF === 'function' ? yonF(x, y) : yonF) + (R() - 0.5) * o.sap;

          }
        }
      }

  /** İnce samur fırça çizgisi (ayrıntı). */
  function ince(pts, w, renk, o) {
    o = o || {};
    const p = titret(ornekle(pts, 1), o.gen === undefined ? 0.2 : o.gen, 30, nI, R() * 100, false);
    const L = uzunluk(p);
    const uc = Math.min(o.uc || 3, L * 0.3);

  const kutuD = (d, pay) => kutuBul(duzlestir(d, 3), pay || 2);
  /** Yumuşak düşen gölge (kutu boyutunda geçici tuvalde bulanıklaştırılır). */

    A.x.filter = `blur(${bl * OL}px)`;
    A.x.setTransform(OL, 0, 0, OL, -x0 + dx * OL, -y0 + dy * OL);
    A.x.fillStyle = renk;

  }

  // ================================================================ zemin (soluk ılık levha zemini) ve gök
  const gokR = rampa([[0, '#73A6D0'], [0.24, '#A3C6DE'], [0.5, '#DAE5E1'], [0.74, '#F5EDD8'], [1, '#F4E2BE']]);
  const gokF = (x, y) => { const c = gokR(y / 800 + (nI(x * 0.004, y * 0.004) - 0.5) * 0.06); const g = Math.exp(-Math.pow(Math.hypot(x - 880, y - 140) / 170, 2)); return [lerp(c[0], 253, g * 0.75), lerp(c[1], 247, g * 0.75), lerp(c[2], 228, g * 0.75)]; };

  const isik2 = [0.75, -0.66];
  const yapR = rampa([[0, '#21492B'], [0.4, '#3A6E3C'], [0.75, '#62984F'], [1, '#A6CC80']]);
  const yapR2 = rampa([[0, '#1B4A40'], [0.4, '#2F6E5A'], [0.75, '#589E7E'], [1, '#9FD2AE']]);
  for (const s of B.saplar) {
    const p = ornekle(s, 2);
    const sol = [], sag = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      const an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const ww = 2.3 * (1 - 0.4 * (i / (p.length - 1)));
      sol.push([p[i][0] - Math.sin(an) * ww, p[i][1] + Math.cos(an) * ww]);
      sag.push([p[i][0] + Math.sin(an) * ww, p[i][1] - Math.cos(an) * ww]);
    }
    const yol = p2d(sol.concat(sag.slice().reverse()), true);
    guaj(ctx, (x) => x.fill(yol), '#5B7A47', { kutu: kutuBul([p], 5), doku: 0.02 });
    ince(sol.map((q, i) => [lerp(q[0], p[i][0], 0.4), lerp(q[1], p[i][1], 0.4)]), 0.7, css(yapR(0.0), 0.6), { uc: 6 });
    ince(sag.map((q, i) => [lerp(q[0], p[i][0], 0.35), lerp(q[1], p[i][1], 0.35)]), 0.7, css(yapR(1), 0.7), { uc: 6 });
  }
  B.yapraklar.forEach((y, i) => {
    const d = SAHNE.yaprakYolu(y);
    const yol = new Path2D(d);
    const kutu = kutuD(d, 2);
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci), nx = -sa, ny = ca;
    const yon = nx * isik2[0] + ny * isik2[1] > 0 ? -1 : 1;
    const L = y.uzunluk, Wd = L * y.genislik * 0.5;
    const rmp = i % 3 === 1 ? yapR2 : yapR;
    const renkY = (x, yy) => {
      const u = ((x - y.x) * ca + (yy - y.y) * sa) / L;
      const v = ((x - y.x) * nx + (yy - y.y) * ny) / (Wd + 0.01);
      const golge = v * yon > 0 ? 0.32 : 0;
      // ışıklı yarıda damara yakın açık, kenara doğru koyulaşır; dipte koyu
      return rmp(0.82 - golge - 0.18 * Math.abs(v) * (1 - golge) - 0.2 * (1 - sstep(0, 0.25, u)));
    };
    boya(yol, kutu, renkY, (x, yy) => y.aci + (((x - y.x) * nx + (yy - y.y) * ny) > 0 ? 0.9 : -0.9), { yog: 1.1, uzun: 5, kalin: 0.55, alfa: 0.6, kontrast: 0.22, ara: 1.9 });
    // orta damar: açık çizgi, yanında koyu gölge; yan damarlar ince ve açık, dışa kıvrılarak
    const [a, b] = SAHNE.yaprakDamari(y);
    ince([a, b].map((q) => [q[0] + nx * yon * 0.7, q[1] + ny * yon * 0.7]), 0.7, css(rmp(0.15), 0.5), { uc: 8 });
    ince([a, b], 0.9, css(rmp(1), 0.85), { uc: 8 });
    const n = Math.max(4, Math.round(L / 9));
    for (let k = 1; k <= n; k++) {
      const t = 0.1 + (k / (n + 1)) * 0.8;
      const ox = y.x + ca * L * t, oy = y.y + sa * L * t;
      const w = Wd * 0.85 * Math.sin(Math.PI * Math.min(1, t * 1.02));
      for (const sg of [-1, 1]) {
        const pts = [];
        for (let s2 = 0; s2 <= 1.0001; s2 += 0.2) pts.push([ox + ca * w * 0.7 * s2 + nx * sg * w * s2 * (1 - 0.15 * s2), oy + sa * w * 0.7 * s2 + ny * sg * w * s2 * (1 - 0.15 * s2)]);
        ince(pts, 0.45, css(rmp(sg * yon > 0 ? 0.6 : 1), 0.6), { uc: 2, gen: 0.08 });
      }
    }
    // ışıklı kenarda ince parlaklık
    const kenar = duzlestir(d, 1)[0].filter((q) => ((q[0] - y.x) * nx + (q[1] - y.y) * ny) * yon < -0.5);
    if (kenar.length > 3) ince(kenar.map((q) => [q[0] - nx * yon * 0.5, q[1] - ny * yon * 0.5]), 0.5, css(rmp(1), 0.5), { uc: 4 });
  });
  B.tomurcuklar.forEach((t) => {
    const d = SAHNE.tomurcukYolu(t);
    const kutu = kutuD(d, 2);
    const budR = rampa([[0, '#C8909A'], [0.6, '#EBC9CB'], [1, '#FBF0EC']]);
    boya(new Path2D(d), kutu, (x, y) => budR(0.5 + ((x - t.x) * 0.75 - (y - t.y) * 0.66) / (t.r * 2)), t.aci, { yog: 0.8, uzun: 3, kalin: 0.45 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    for (const sg of [-1, 0, 1]) {
      const bx = t.x - ca * t.r * 0.9, by = t.y - sa * t.r * 0.9;
      const ex = bx + ca * t.r * 1.3 - sa * sg * t.r * 0.55, ey = by + sa * t.r * 1.3 + ca * sg * t.r * 0.55;
      const s = new Path2D();
      s.moveTo(bx - sa * sg * t.r * 0.25, by + ca * sg * t.r * 0.25);
      s.quadraticCurveTo(bx + ca * t.r * 0.6 - sa * sg * t.r * 0.8, by + sa * t.r * 0.6 + ca * sg * t.r * 0.8, ex, ey);
      s.quadraticCurveTo(bx + ca * t.r * 0.5, by + sa * t.r * 0.5, bx + sa * sg * t.r * 0.2, by - ca * sg * t.r * 0.2);
      ctx.fillStyle = css(yapR(0.45 + sg * 0.15), 0.95);
      ctx.fill(s);
    }
  });
  const tacR = rampa([[0, '#CFC8D2'], [0.45, '#E9E4E8'], [1, '#FDFBF6']]);
  B.cicekler.forEach((c, ci) => {
    const kutu = [c.x - c.r * 1.2, c.y - c.r * 1.2, c.x + c.r * 1.2, c.y + c.r * 1.2];
    const L = c.r * 1.06, G = c.r * 0.5;
    for (let i = 0; i < 5; i++) {
      const a = c.aci + (i * PI2) / 5;
      const d = tacYolu(c.x, c.y, a, L, G, 0.07);
      const yol = new Path2D(d);
      const ca = Math.cos(a), sa = Math.sin(a);
      if (i > 0) {
        // üstteki taç yaprağın alttakine düşürdüğü yumuşak soğuk gölge
        golgeDus(yol, kutu, 'rgba(150,140,165,0.42)', 1.6, -1.6, 1.8);
      }
      const renkT = (x, y) => {
        const u = ((x - c.x) * ca + (y - c.y) * sa) / L;
        const v = (-(x - c.x) * sa + (y - c.y) * ca) / G;
        // dipte soğuk gölge, uca doğru ışık; bir önceki taç yaprağın altında kalan kenar gölgeli
        let t = 0.35 + 0.65 * sstep(0.1, 0.75, u) - 0.25 * sstep(0.4, 1.0, -v) - 0.08 * sstep(0.6, 1, v);
        const ld = (x - c.x) * 0.75 - (y - c.y) * 0.66;
        t += 0.08 * clamp(ld / c.r, -1, 1);
        const col = tacR(t);
        const pembe = 0.25 * (1 - sstep(0.1, 0.42, u));
        return [lerp(col[0], 236, pembe), lerp(col[1], 196, pembe), lerp(col[2], 204, pembe)];
      };
      boya(yol, kutu, renkT, (x, y) => Math.atan2(y - c.y, x - c.x), { yog: 1.1, uzun: c.r * 0.18 + 2.5, kalin: 0.5, alfa: 0.55, kontrast: 0.14, duz: 0.2, ara: 1.8 });
      // ince ışınsal taç yaprak damarları
      const nd = c.r > 40 ? 9 : 6;
      for (let k = 0; k < nd; k++) {
        const v0 = (k / (nd - 1) - 0.5) * 1.3;
        const pts = [];
        for (let s2 = 0.18; s2 <= 0.8; s2 += 0.08) pts.push([c.x + ca * L * s2 - sa * G * v0 * s2 * 1.1, c.y + sa * L * s2 + ca * G * v0 * s2 * 1.1]);
        ince(pts, 0.4, 'rgba(184,172,190,0.5)', { uc: 3, gen: 0.06 });
      }
      // uç kenarında ince ışık
      const kenarPts = duzlestir(d, 1)[0].filter((q) => ((q[0] - c.x) * ca + (q[1] - c.y) * sa) / L > 0.72);
      if (kenarPts.length > 3) ince(kenarPts.map((q) => [q[0] - ca * 0.6, q[1] - sa * 0.6]), 0.5, 'rgba(255,255,252,0.8)', { uc: 3 });
    }
    // göbek ve ercikler: tek tek sap ve başçık
    const gR = rampa([[0, '#6E7A3A'], [1, '#B9B866']]);
    guaj(ctx, (x) => { x.beginPath(); x.arc(c.x, c.y, c.r * 0.13, 0, PI2); x.fill(); }, '#9AA34E', { kutu, f: (x, y) => gR(0.5 + ((x - c.x) * 0.75 - (y - c.y) * 0.66) / (c.r * 0.26)) });
    const n = c.r > 40 ? 26 : 16;
    const rr = SAHNE.rng(500 + ci);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * PI2 + rr() * 0.2;
      const r1 = c.r * 0.12, r2 = c.r * (0.3 + rr() * 0.1);
      const ex = c.x + Math.cos(a) * r2, ey = c.y + Math.sin(a) * r2;
      ince([[c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1], [lerp(c.x, ex, 0.6) + Math.sin(a) * 0.6, lerp(c.y, ey, 0.6) - Math.cos(a) * 0.6], [ex, ey]], c.r > 40 ? 0.6 : 0.45, 'rgba(214,190,96,0.9)', { uc: 2, gen: 0.05 });
      const ar = Math.max(1.0, c.r * 0.032);
      ctx.fillStyle = 'rgba(160,110,30,0.95)';
      ctx.beginPath(); ctx.ellipse(ex - 0.2, ey + 0.2, ar * 1.1, ar * 0.8, a, 0, PI2); ctx.fill();
      ctx.fillStyle = 'rgba(226,178,62,1)';
      ctx.beginPath(); ctx.ellipse(ex, ey, ar, ar * 0.7, a, 0, PI2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,190,0.85)';
      ctx.beginPath(); ctx.arc(ex + ar * 0.3, ey - ar * 0.3, ar * 0.32, 0, PI2); ctx.fill();
    }
  });

  // ================================================================ levha çerçevesi: ince sepya çift cetvel
  {
    // dış kenarda ince örtücü krem pervaz, içinde koyu sepya cetvel ve ince kızıl toprak cetvel
    const cer = new Path2D('M0,0 L1024,0 L1024,1024 L0,1024 Z M9,9 L9,1015 L1015,1015 L1015,9 Z');
    guaj(ctx, (x) => x.fill(cer, 'evenodd'), '#F3EAD6', { alfa: 1, doku: 0.02, tohum: 77 });
    const kare = (ins) => [[ins, ins], [1024 - ins, ins], [1024 - ins, 1024 - ins], [ins, 1024 - ins], [ins, ins]];
    for (const q of koseBol(ornekle(kare(9.5), 2), 0.7)) ince(q, 1.5, 'rgba(84,62,40,0.92)', { gen: 0.1, uc: 2 });
    for (const q of koseBol(ornekle(kare(14), 2), 0.7)) ince(q, 0.9, 'rgba(168,84,58,0.85)', { gen: 0.1, uc: 2 });
  }

  SAHNE.hazir();
})();
