<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-152 Vintage Seyahat Afişi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F6EBD6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-152 Vintage Seyahat Afişi (Vintage Travel Poster) — 1930-50'lerin taşbaskı seyahat afişi: yazısız;
  // düz renk düzlemleri, gökte pürüzsüz püskürtme geçiş, güneşli sıcak palet, mor-mavi serin gölgeler,
  // silindirlerde üç-dört düz ışık bandı, katmanlı uzak dağlar ve hurmalar, ince taşbaskı greni, krem pay.
  const S = SAHNE;
  const OL = 2;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, OL);
  const r = S.rng(52);
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dol = (d, c) => {
    ctx.fillStyle = c;
    ctx.fill(typeof d === 'string' ? P2(d) : d);
  };
  function kirpli(d, fn) {
    ctx.save();
    ctx.clip(typeof d === 'string' ? P2(d) : d);
    fn();
    ctx.restore();
  }

  const C = {
    gokUst: '#58AAD4', gokOrta: '#9FD0E3', gokAlt: '#FBE0B6', gokUfuk: '#F9CB97',
    gunes: '#FFF7DE',
    bulut: '#FFF8EA', bulutG: '#E9D2DC',
    dagUzak: '#E8CDD0', dagYakin: '#CDB5CB', dagYakinG: '#BBA2BE',
    tas: '#FFF4DF', tasOrta: '#F6DEBB', tasG: '#D3BCCB', tasY: '#E6CFC6', tasK: '#B9A0B6',
    yesilY: '#A6D98E', yesilA: '#5CB36A', yesil: '#2F8C5A', yesilG: '#226A57', yesilK: '#18503F',
    pencere: '#174A3E', pencereTas: '#86739A',
    altin: '#EDB848', altinA: '#FFE394', altinG: '#B9813A',
    zemin: '#F3D7A8', zeminAlt: '#EAC38F', zeminG: '#D9B19D',
    yaprak: '#3E8E70', yaprakA: '#71B78C', yaprakK: '#2A6C57',
    hurma: '#4E9A80', hurmaA: '#7DBB9C', hurmaG: '#3F8371', hurmaK: '#2F6B5E', govde: '#B39478', govdeA: '#D6B794',
    hurmaMeyve: '#E39A3E', hurmaMeyveG: '#C27A33',
    cicek: '#FFFDF6', cicekG: '#F1DCC6', orta: '#F3B53C', ortaG: '#D58E2B',
    pembe: '#F7B9A6', pembeG: '#E38F7F',
    pay: '#F6EBD6', cizgi: '#2F8C5A',
  };

  // ================================================================ 1. GÖK: pürüzsüz püskürtme geçiş
  {
    const g = ctx.createLinearGradient(0, 0, 0, 800);
    g.addColorStop(0, C.gokUst);
    g.addColorStop(0.42, C.gokOrta);
    g.addColorStop(0.82, C.gokAlt);
    g.addColorStop(1, C.gokUfuk);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 820);
    // güneşin sıcak ışığı
    const gl = ctx.createRadialGradient(880, 140, 40, 880, 140, 520);
    gl.addColorStop(0, 'rgba(255,240,205,0.85)');
    gl.addColorStop(0.35, 'rgba(255,236,200,0.35)');
    gl.addColorStop(1, 'rgba(255,236,200,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, 1024, 820);
    // afiş halkaları: düz, eşmerkezli açık bantlar
    for (const [rr, a] of [[180, 0.16], [124, 0.22], [86, 0.35]]) {
      ctx.fillStyle = `rgba(255,248,226,${a})`;
      ctx.beginPath();
      ctx.arc(880, 140, rr, 0, Math.PI * 2);
      ctx.fill();
    }
    dol(S.daireYolu(880, 140, 58), C.gunes);
  }

  // ---------------------------------------------------------------- püskürtme (spatter) taneleri: gök geçişinde sıcak, tepede serin
  {
    const rs = S.rng(77);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, 1024, 790);
    ctx.clip();
    for (let i = 0; i < 26000; i++) {
      const x = rs() * 1024;
      const y = rs() * 790;
      const ufuk = Math.max(0, (y - 380) / 410);
      const tepe = Math.max(0, (300 - y) / 300);
      const pg = Math.hypot(x - 880, y - 140);
      if (pg < 200 && rs() < 0.8) continue;
      const rr = 0.35 + rs() * rs() * 0.9;
      if (rs() < ufuk * 0.9) {
        ctx.fillStyle = `rgba(240,160,100,${0.18 + rs() * 0.2})`;
      } else if (rs() < tepe * 0.8) {
        ctx.fillStyle = `rgba(40,120,180,${0.14 + rs() * 0.16})`;
      } else continue;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- bulutlar: afişe özgü uzun, katmanlı şerit bulutlar
  function mercek(x, y, L, h) {
    return `M${x - L / 2},${y} C${x - L * 0.3},${y - h * 1.1} ${x + L * 0.25},${y - h * 1.15} ${x + L / 2},${y} ` +
      `C${x + L * 0.2},${y + h * 0.42} ${x - L * 0.25},${y + h * 0.38} ${x - L / 2},${y} Z`;
  }
  function serit(x, y, L, h) {
    const katlar = [[0, 0, 1, 1], [-L * 0.12, -h * 0.75, 0.62, 0.8], [L * 0.2, h * 0.55, 0.55, 0.6]];
    for (const [dx, dy, sl, sh] of katlar) {
      const d = mercek(x + dx, y + dy, L * sl, h * sh);
      dol(d, C.bulutG);
      kirpli(d, () => {
        ctx.save();
        ctx.translate(L * 0.02, -h * 0.32);
        dol(d, C.bulut);
        ctx.restore();
      });
    }
  }
  serit(196, 262, 330, 26);
  serit(500, 160, 210, 18);
  serit(842, 372, 280, 22);
  serit(950, 500, 130, 12);

  // ================================================================ 2. UZAK DAĞLAR VE ZEMİN
  function siluet(noktalar, renk) {
    const d = S.yol([[0, 820], ...noktalar, [1024, 820]], true);
    dol(d, renk);
    return d;
  }
  {
    const uzak = [];
    for (let x = 0; x <= 1024; x += 8) {
      const y = 712 - 34 * Math.exp(-(((x - 110) / 120) ** 2)) - 52 * Math.exp(-(((x - 960) / 140) ** 2)) - 18 * Math.sin(x / 47) * 0.4 - 22 * Math.exp(-(((x - 620) / 160) ** 2));
      uzak.push([x, y]);
    }
    siluet(uzak, C.dagUzak);
    const yakin = [];
    for (let x = 0; x <= 1024; x += 8) {
      const y = 756 - 30 * Math.exp(-(((x - 40) / 110) ** 2)) - 40 * Math.exp(-(((x - 900) / 110) ** 2)) - 10 * Math.sin(x / 33);
      yakin.push([x, y]);
    }
    const dy = siluet(yakin, C.dagYakin);
    // yakın dağın gölge yüzleri (sol yamaçlar)
    kirpli(dy, () => {
      ctx.fillStyle = C.dagYakinG;
      for (const [px, py, w] of [[40, 726, 110], [900, 716, 110]]) {
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - w, 800);
        ctx.lineTo(px - w * 0.15, 800);
        ctx.closePath();
        ctx.fill();
      }
    });
  }
  {
    const g = ctx.createLinearGradient(0, 790, 0, 1024);
    g.addColorStop(0, C.zemin);
    g.addColorStop(1, C.zeminAlt);
    ctx.fillStyle = g;
    ctx.fillRect(0, 790, 1024, 234);
    // uzun düz gölge bantları (alçak güneş)
    ctx.fillStyle = 'rgba(214,170,150,0.45)';
    ctx.fillRect(0, 808, 1024, 5);
    ctx.fillRect(0, 828, 1024, 3);
  }

  // ---------------------------------------------------------------- hurmalar
  /** Tüylü (pinnat) hurma yaprağı: orta damar boyunca iki yanda testere dişli yaprakçıklar; göğe bakan yan açık, alttaki yan koyu ton. */
  function hurmaYapragi(x1, y1, a, L, sark, Wm, acik, koyu, damar) {
    const N = 26;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      pts.push([x1 + Math.cos(a) * L * t, y1 + Math.sin(a) * L * t + sark * L * t * t]);
    }
    const nokta = (t) => {
      const u = Math.min(N - 1e-6, Math.max(0, t * N));
      const i = Math.floor(u);
      const f2 = u - i;
      const p0 = pts[i];
      const p1 = pts[Math.min(N, i + 1)];
      const x = p0[0] + (p1[0] - p0[0]) * f2;
      const y = p0[1] + (p1[1] - p0[1]) * f2;
      const tl = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
      return { x, y, tx: (p1[0] - p0[0]) / tl, ty: (p1[1] - p0[1]) / tl };
    };
    const M = 15;
    for (const yan of [1, -1]) {
      const q0 = nokta(0.02);
      const ny0 = q0.tx * yan; // normalin y bileşeni: (−ty, tx)·yan
      const ust = ny0 < 0; // bu yan göğe bakıyor
      const kenar = [[x1, y1]];
      for (let i = 0; i < M; i++) {
        const t0 = 0.1 + (0.88 * i) / M;
        const t1 = Math.min(1, t0 + 0.88 / M + 0.05);
        const w = Wm * Math.pow(Math.sin(Math.PI * Math.min(1, t1 * 1.08)), 0.7) * (1 - 0.35 * t1);
        const qa = nokta(t0);
        const qb = nokta(t1);
        const nx = -qb.ty * yan;
        const ny = qb.tx * yan;
        kenar.push([qa.x - qa.ty * yan * w * 0.16, qa.y + qa.tx * yan * w * 0.16]);
        kenar.push([qb.x + nx * w, qb.y + ny * w * (ust ? 0.85 : 1.15)]);
      }
      kenar.push(pts[N]);
      for (let i = N; i >= 0; i--) kenar.push(pts[i]);
      dol(S.yol(kenar, true), ust ? acik : koyu);
    }
    ctx.strokeStyle = damar;
    ctx.lineWidth = 1.3;
    ctx.stroke(P2(S.yol(pts)));
  }
  function hurma(x0, y0, x1, y1, s, tohum) {
    const rh = S.rng(tohum || 5);
    // gövde: hafif kavisli, incelen, pullu (yaprak dipleri)
    const kv = (x1 - x0) * 0.5;
    const n = 30;
    const sol = [];
    const sag = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = x0 + (x1 - x0) * t + Math.sin(Math.PI * t) * kv * 0.4;
      const y = y0 + (y1 - y0) * t;
      const w = (9 - 3.5 * t) * s;
      sol.push([x - w, y]);
      sag.push([x + w, y]);
    }
    const govde = S.yol([...sol, ...sag.reverse()], true);
    dol(govde, C.govde);
    kirpli(govde, () => {
      ctx.fillStyle = C.govdeA;
      ctx.save();
      ctx.translate(4.5 * s, 0);
      ctx.fill(P2(govde));
      ctx.restore();
      ctx.strokeStyle = 'rgba(120,88,64,0.55)';
      ctx.lineWidth = 1.4 * s;
      for (let i = 1; i < n; i += 1) {
        const t = i / n;
        const x = x0 + (x1 - x0) * t + Math.sin(Math.PI * t) * kv * 0.4;
        const y = y0 + (y1 - y0) * t;
        ctx.beginPath();
        ctx.moveTo(x - 12 * s, y + 2 * s);
        ctx.quadraticCurveTo(x, y - 2 * s, x + 12 * s, y + 2 * s);
        ctx.stroke();
      }
    });
    // taç: arkada koyu, önde açık iki kat tüylü yaprak; yana açılanlar daha çok sarkar
    const kat = [
      { renk: [C.hurmaG, C.hurmaK], acilar: [-104, -76, -128, -52, -150, -30, -172, -8, 192, 12] },
      { renk: [C.hurmaA, C.hurma], acilar: [-90, -64, -116, -40, -140, -16, -164, 4, 184, 22, 158] },
    ];
    for (const { renk, acilar } of kat) {
      for (const d of acilar) {
        const a = ((d + (rh() - 0.5) * 8) * Math.PI) / 180;
        const yatay = Math.abs(Math.cos(a));
        const L = (84 + rh() * 22 - (1 - yatay) * 10) * s;
        const sark = (0.12 + 0.62 * yatay * yatay) * (Math.sin(a) > 0.2 ? 0.6 : 1);
        hurmaYapragi(x1, y1, a, L, sark, 15 * s, renk[0], renk[1], C.yaprakK);
      }
    }
    // hurma salkımları: tacın altında iki küçük kehribar salkım
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 11; i++) {
        const u = i / 10;
        const x = x1 + sx * (8 + u * 7) * s + Math.sin(i * 2.3) * 3.2 * s;
        const y = y1 + (6 + u * 16) * s + Math.cos(i * 1.7) * 2 * s;
        dol(S.daireYolu(x, y, 3.1 * s), i % 3 ? C.hurmaMeyve : C.hurmaMeyveG);
      }
    }
    dol(S.daireYolu(x1, y1 + 2 * s, 7.5 * s), C.govde);
    dol(S.daireYolu(x1 + 2 * s, y1, 4.5 * s), C.govdeA);
  }
  hurma(206, 812, 196, 612, 0.9, 11);
  hurma(868, 812, 884, 628, 0.85, 12);
  hurma(990, 818, 974, 676, 0.7, 13);
  // afişi solda çerçeveleyen uzun hurma (önde, çiçeklerin arkasında); tacı kenardan taşar
  hurma(34, 1040, 86, 356, 1.5, 14);

  // ---------------------------------------------------------------- düz ışık bantları
  const ISIK = 0.66;
  function seviye(lon) {
    const b = Math.max(0, Math.cos(lon - ISIK));
    if (b > 0.93) return 3;
    if (b > 0.62) return 2;
    if (b > 0.25) return 1;
    return 0;
  }
  /** Silindirde düz bantlar: x1..x2, renkler [gölge, orta, ışık, parlak], solda ince yansıma bandı. */
  function bantlar(yol, x1, x2, y1, y2, renk, yansima) {
    kirpli(yol, () => {
      const cx = (x1 + x2) / 2;
      const R = (x2 - x1) / 2;
      const adim = 0.5;
      let onceki = -1;
      let bas = x1;
      for (let x = x1; x <= x2 + adim; x += adim) {
        const u = Math.max(-1, Math.min(1, (x - cx) / R));
        const lv = x > x2 ? -2 : seviye(Math.asin(u));
        if (lv !== onceki) {
          if (onceki >= 0) {
            ctx.fillStyle = renk[onceki];
            ctx.fillRect(bas, y1 - 2, x - bas + 0.6, y2 - y1 + 4);
          }
          bas = x;
          onceki = lv;
        }
      }
      if (yansima) {
        ctx.fillStyle = yansima;
        ctx.fillRect(x1, y1 - 2, R * 0.09, y2 - y1 + 4);
      }
    });
  }

  // ================================================================ 3. MİNARE
  const minare = S.minareParcalari();
  const mx = S.minare.cx;
  const tasR = [C.tasG, C.tasOrta, C.tas, '#FFFBF0'];
  // kaidenin ve minarenin zemine düşen uzun gölgesi (sola)
  // güneş sağ önden: gölgeler sola-arkaya, binanın solunda dar bir mor kama
  dol('M300,786 L300,801 L150,801 L196,786 Z', 'rgba(190,150,165,0.6)');
  dol(dik(296, 798, 824, 804), 'rgba(170,130,150,0.5)');
  for (const p of minare) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const ys = p.noktalar.map((q) => q[1]);
      const d = S.yol(p.noktalar, true);
      const cikma = p.ad.startsWith('çıkma');
      bantlar(d, Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), cikma ? [C.tasK, C.tasG, C.tasY, C.tasOrta] : tasR, cikma ? null : C.tasY);
      if (p.ad.startsWith('şerefe')) dol(dik(Math.min(...xs), Math.max(...ys) - 3, Math.max(...xs), Math.max(...ys)), C.tasK);
      if (p.ad.startsWith('gövde')) dol(dik(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.min(...ys) + 7), 'rgba(185,160,182,0.75)');
    } else if (p.tip === 'korkuluk') {
      const d = dik(p.x1, p.y1, p.x2, p.y2);
      bantlar(d, p.x1, p.x2, p.y1, p.y2, [C.tasK, C.tasG, C.tasY, C.tasY]);
      const adet = 9;
      for (let i = 0; i < adet; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / adet;
        const u = (x - mx) / ((p.x2 - p.x1) / 2);
        dol(dik(x - 2.6, p.y1 + 4, x + 2.6, p.y2), [C.tasG, C.tasOrta, C.tas, C.tas][seviye(Math.asin(Math.max(-1, Math.min(1, u))))]);
      }
      dol(dik(p.x1, p.y1, p.x2, p.y1 + 4), C.tasOrta);
    } else if (p.tip === 'bant') {
      ctx.save();
      ctx.lineJoin = 'miter';
      ctx.lineWidth = 3.6;
      ctx.strokeStyle = C.altinG;
      for (const z of S.zikzakCizgileri()) ctx.stroke(P2(S.yol(z)));
      ctx.restore();
    } else if (p.tip === 'topuz') {
      bantlar(p.yol, 266, 334, 144, 201, tasR, C.tasY);
    }
  }
  for (const w of S.minarePencereleri) dol(S.kemerYolu(w.x, w.y, w.w, w.h), C.pencereTas);

  function alem(a) {
    const s = a.yaka.rx / 20;
    const parcalar = [
      dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2),
      ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r)),
      S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }),
      S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R),
    ];
    const birlesik = new Path2D();
    for (const d of parcalar) birlesik.addPath(P2(d));
    dol(birlesik, C.altin);
    kirpli(birlesik, () => {
      dol(dik(a.yaka.cx - 40 * s, a.hilal.cy - 30 * s, a.yaka.cx - 3 * s, a.yaka.cy + 20 * s), C.altinG);
      dol(dik(a.yaka.cx + 3 * s, a.hilal.cy - 30 * s, a.yaka.cx + 7 * s, a.yaka.cy + 20 * s), C.altinA);
    });
  }
  alem(minare.find((p) => p.tip === 'alem').alem);

  // ================================================================ 4. KAİDE
  const K = S.kaide;
  {
    const d = dik(K.x1, K.y1, K.x2, K.y2);
    dol(d, C.tas);
    dol(dik(K.x1, K.y1, K.x1 + 18, K.y2), C.tasY);
    dol(dik(K.x1, K.y1, K.x2, K.y1 + 10), C.tasG);
    dol(dik(K.x1, K.y2 - 9, K.x2, K.y2), C.tasOrta);
    const KR = K.kornis;
    dol(dik(KR.x1, KR.y1, KR.x2, KR.y2), C.tas);
    dol(dik(KR.x1, KR.y1, KR.x1 + 18, KR.y2), C.tasOrta);
    dol(dik(KR.x1, KR.y2 - 3, KR.x2, KR.y2), C.tasG);
    for (const w of K.pencereler) {
      dol(S.kemerYolu(w.x, w.y, w.w, w.h), C.pencereTas);
      // pencere içinde sola düşen sıcak ışık
      kirpli(S.kemerYolu(w.x, w.y, w.w, w.h), () => dol(dik(w.x + w.w * 0.18, w.y, w.x + w.w, w.y + w.h), '#9C88AE'));
      dol(dik(w.x - w.w / 2 - 4, w.y + w.h, w.x + w.w / 2 + 4, w.y + w.h + 4), C.tasG);
    }
  }

  // ================================================================ 5. KASNAK
  const yesilR = [C.yesilG, C.yesil, C.yesilA, C.yesilY];
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const d = dik(q.x1, q.y1, q.x2, q.y2);
    bantlar(d, q.x1, q.x2, q.y1, q.y2, yesilR, '#2B7A5E');
    dol(dik(q.x1, q.y2 - 6, q.x2, q.y2), C.yesilK);
    for (const w of S.kasnakPencereleri(k)) dol(S.kemerYolu(w.x, w.y, w.w, w.h), C.pencere);
  }
  // kubbenin kasnağa düşen gölgesi
  dol(dik(352, 555, 768, 563), 'rgba(24,80,63,0.55)');

  // ================================================================ 6. KUBBE: dilimler dört düz tonda
  {
    const prof = S.kubbeProfili(90);
    const mer = (u) => prof.map((q) => [560 + u * q.r, q.y]);
    for (let k = 0; k < 16; k++) {
      const l1 = -Math.PI / 2 + (Math.PI * k) / 16;
      const l2 = -Math.PI / 2 + (Math.PI * (k + 1)) / 16;
      const d = S.yol([...mer(Math.sin(l1)), ...mer(Math.sin(l2)).reverse()], true);
      ctx.fillStyle = yesilR[seviye((l1 + l2) / 2)];
      ctx.fill(P2(d));
      ctx.strokeStyle = yesilR[seviye((l1 + l2) / 2)];
      ctx.lineWidth = 0.8;
      ctx.stroke(P2(d));
    }
    kirpli(S.kubbeYolu, () => {
      // püskürtme: tepeye doğru sıcak ışık, tabana doğru serinleşme
      const g = ctx.createLinearGradient(0, 300, 0, 555);
      g.addColorStop(0, 'rgba(255,236,190,0.28)');
      g.addColorStop(0.5, 'rgba(255,236,190,0)');
      g.addColorStop(1, 'rgba(20,70,70,0.18)');
      ctx.fillStyle = g;
      ctx.fillRect(350, 290, 420, 270);
      // sağ kenarda sıcak ışık çizgisi, solda serin yansıma
      ctx.save();
      ctx.lineWidth = 9;
      ctx.strokeStyle = 'rgba(214,240,170,0.55)';
      ctx.translate(-4, 0);
      ctx.stroke(P2(S.yol(mer(1).filter((q) => q[1] > 330))));
      ctx.restore();
      ctx.save();
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(60,140,140,0.45)';
      ctx.translate(5, 0);
      ctx.stroke(P2(S.yol(mer(-1).filter((q) => q[1] > 360))));
      ctx.restore();
      ctx.strokeStyle = 'rgba(20,74,58,0.55)';
      ctx.lineWidth = 1.6;
      for (let k = 1; k < 16; k++) {
        const l = -Math.PI / 2 + (Math.PI * k) / 16;
        ctx.stroke(P2(S.yol(mer(Math.sin(l)).filter((q) => q[1] > 304))));
      }
    });
  }
  alem(S.alemParcalari(560, 300, 1));

  // ================================================================ 7. ÇİÇEKLER
  const B = S.bitki;
  const Lx = 0.7071;
  const Ly = -0.7071;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = C.yaprakK;
  ctx.lineWidth = 3.4;
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8;
    const y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(t.x, t.y + 80, bx, t.y + 170);
    ctx.stroke();
  }
  ctx.lineWidth = 4.2;
  for (const s of B.saplar) ctx.stroke(P2(S.yol(s)));

  function yaprak(y, koyu) {
    const AC = koyu ? C.yaprak : C.yaprakA;
    const GO = koyu ? C.yaprakK : C.yaprak;
    const Lu = y.uzunluk;
    const W = Lu * y.genislik;
    const ca = Math.cos(y.aci);
    const sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const q = (pt) => `${pt[0]},${pt[1]}`;
    const a = p(0, 0);
    const b = p(Lu, 0);
    const neg = `M${q(a)} C${q(p(Lu * 0.35, -W * 0.75))} ${q(p(Lu * 0.8, -W * 0.45))} ${q(b)} Z`;
    const poz = `M${q(b)} C${q(p(Lu * 0.8, W * 0.45))} ${q(p(Lu * 0.35, W * 0.75))} ${q(a)} Z`;
    const pozAcik = -sa * Lx + ca * Ly > 0;
    dol(neg, pozAcik ? GO : AC);
    dol(poz, pozAcik ? AC : GO);
  }
  B.yapraklar.forEach((y, i) => yaprak(y, i >= 36 && i % 3 !== 0));

  for (const t of B.tomurcuklar) {
    const d = S.tomurcukYolu(t);
    dol(d, C.pembeG);
    kirpli(d, () => {
      ctx.save();
      ctx.translate(t.r * 0.3, -t.r * 0.3);
      dol(d, C.pembe);
      ctx.restore();
    });
    const ca = Math.cos(t.aci);
    const sa = Math.sin(t.aci);
    const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const q = (pt) => `${pt[0]},${pt[1]}`;
    dol(`M${q(p(-t.r * 1.0, 0))} Q${q(p(-t.r * 0.2, -t.r * 1.1))} ${q(p(t.r * 0.25, -t.r * 0.55))} Q${q(p(-t.r * 0.1, 0))} ${q(p(t.r * 0.25, t.r * 0.55))} Q${q(p(-t.r * 0.2, t.r * 1.1))} ${q(p(-t.r * 1.0, 0))} Z`, C.yaprakK);
  }

  function cicek(c) {
    const tac = S.tacYapraklari(c).map((e) => ({ ...e, cx: c.x + Math.cos(e.aci) * c.r * 0.55, cy: c.y + Math.sin(e.aci) * c.r * 0.55, rx: c.r * 0.53, ry: c.r * 0.44 }));
    tac.sort((m, n) => Math.cos(m.aci) * Lx + Math.sin(m.aci) * Ly - (Math.cos(n.aci) * Lx + Math.sin(n.aci) * Ly));
    for (const e of tac) {
      const d = S.elipsYolu(e);
      dol(d, C.cicekG);
      kirpli(d, () => {
        ctx.save();
        ctx.translate(c.r * 0.12, -c.r * 0.12);
        dol(d, C.cicek);
        ctx.restore();
      });
    }
    dol(S.daireYolu(c.x, c.y, c.r * 0.22), C.ortaG);
    kirpli(S.daireYolu(c.x, c.y, c.r * 0.22), () => dol(S.daireYolu(c.x + c.r * 0.05, c.y - c.r * 0.05, c.r * 0.2), C.orta));
  }
  for (const c of B.cicekler) cicek(c);

  // ---------------------------------------------------------------- güneşte solmuş sıcak afiş kâğıdı: bütün mürekkepler krem kâğıt üstünde
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = '#FAF0DE';
  ctx.fillRect(0, 0, 1024, 1024);
  ctx.restore();

  // ================================================================ 8. TAŞBASKI GRENİ (kâğıt ve mürekkep tanesi)
  {
    const W = tuval.width;
    const H = tuval.height;
    const im = ctx.getImageData(0, 0, W, H);
    const d = im.data;
    const rg = S.rng(152);
    // kaba tane: 2×2 hücreli değer gürültüsü + ince tane
    const gw = W >> 1;
    const gh = H >> 1;
    const kaba = new Float32Array(gw * gh);
    for (let i = 0; i < kaba.length; i++) kaba[i] = rg() - 0.5;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const k = (y * W + x) * 4;
        const n = kaba[(y >> 1) * gw + (x >> 1)] * 13 + (rg() - 0.5) * 8;
        const lum = (d[k] + d[k + 1] + d[k + 2]) / 765;
        const m = n * (0.55 + 0.45 * (1 - lum));
        d[k] = Math.max(0, Math.min(255, d[k] + m));
        d[k + 1] = Math.max(0, Math.min(255, d[k + 1] + m));
        d[k + 2] = Math.max(0, Math.min(255, d[k + 2] + m * 0.9));
      }
    }
    ctx.putImageData(im, 0, 0);
  }

  // ================================================================ 9. AFİŞ PAYI: krem kenar ve ince renk çizgisi
  {
    const m = 18;
    ctx.save();
    ctx.fillStyle = C.pay;
    ctx.beginPath();
    ctx.rect(0, 0, 1024, 1024);
    ctx.rect(m, m, 1024 - 2 * m, 1024 - 2 * m);
    ctx.fill('evenodd');
    ctx.strokeStyle = C.cizgi;
    ctx.lineWidth = 1.6;
    ctx.strokeRect(m - 0.8, m - 0.8, 1024 - 2 * m + 1.6, 1024 - 2 * m + 1.6);
    ctx.restore();
  }

  SAHNE.hazir();
</script>
