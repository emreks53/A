<!doctype html>
<html lang="tr">

<title>S-168 Tonlu Kâğıtta Suluboya ve Beyaz — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #dcd9d2; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-168 Tonlu Kâğıtta Suluboya ve Beyaz — hayalî bir ressamın eli: açık sıcak gri tonlu kâğıt orta ton olarak
// bırakılır; renk saydam suluboya yıkamalarıyla verilir; en sonda ince yuvarlak fırçayla örtücü beyaz guaj:
// bulutlar, güneş ışıltısı, ışıklı taş, kubbe kaburgalarındaki parıltılar ve çiçek yaprakları.
(function () {
  'use strict';
  // ================================================================== suluboya motoru (çarpımsal sır modeli)
  // Her yıkama piksel başına bir kapsama (0–1) alanıdır; renk = kâğıt × Π exp(−soğurma × kapsama).
  // Opak boya (guaj) üstte karışır: renk = renk × (1 − örtme) + boya × örtme. En sonda kâğıt kabartması.
  function Motor(o) {
    const W = 1024, N = W * W;
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    function gurultu(tohum) {
      const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
      for (let i = 0; i < M * M; i++) T[i] = r();
      return function (x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
        const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
        const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
        const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      };
    }
    function fbm(n, x, y, okt) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < okt; i++) {
        s += a * n(x, y); t += a;
        const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6;
        x = nx + 17.3; y = ny + 9.1; a *= 0.5;
      }
      return s / t;
    }
    function kutu(src, w, h, r) {
      const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
      for (let y = 0; y < h; y++) {
        const o = y * w; let acc = 0;
        for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
        for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
        for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
      }
      return out;
    }
    function bulanik(src, w, h, r) {
      if (r <= 0) return src;
      const rr = Math.max(1, Math.round(r * 0.6));
      return kutu(kutu(kutu(src, w, h, rr), w, h, rr), w, h, rr);
    }

    const tohum = o.tohum || 1;
    const kagit = hex(o.kagit || '#fbfaf5');
    const dk = Object.assign({ olcek: 4.6, ince: 1.7, karisim: 0.62, kabartma: 0.11, ton: 0.035 }, o.doku || {});
    const nA = gurultu(tohum + 1), nB = gurultu(tohum + 2), nC = gurultu(tohum + 3), nD = gurultu(tohum + 4), nE = gurultu(tohum + 5), nF = gurultu(tohum + 6);
    const H = new Float32Array(N), G = new Float32Array(N), DX = new Float32Array(N), DY = new Float32Array(N), AK = new Float32Array(N), KAL = new Float32Array(N);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const h = dk.karisim * fbm(nA, x / dk.olcek, y / dk.olcek, 3) + (1 - dk.karisim) * nB(x / dk.ince, y / dk.ince);
      H[i] = h;
      G[i] = 0.6 * (1 - h) + 0.4 * nC(x / 2.1 + 40, y / 2.1);
      DX[i] = (fbm(nD, x / 38, y / 38, 3) - 0.5) * 2 + (nE(x / 6, y / 6) - 0.5) * 0.35;
      DY[i] = (fbm(nD, x / 38 + 50, y / 38 + 20, 3) - 0.5) * 2 + (nE(x / 6 + 30, y / 6) - 0.5) * 0.35;
      AK[i] = 0.7 * fbm(nF, x / 70, y / 70, 4) + 0.3 * fbm(nF, x / 16 + 80, y / 16, 2);
    }
    const C0 = new Float32Array(N), C1 = new Float32Array(N), C2 = new Float32Array(N);
    C0.fill(kagit[0] / 255); C1.fill(kagit[1] / 255); C2.fill(kagit[2] / 255);

    const mc = document.createElement('canvas');
    mc.width = W; mc.height = W;
    const mx = mc.getContext('2d', { willReadFrequently: true });

    function kutuBul(a, k) {
      let x0 = W, y0 = W, x1 = -1, y1 = -1;
      const kx0 = k ? k[0] : 0, ky0 = k ? k[1] : 0, kx1 = k ? k[2] : W, ky1 = k ? k[3] : W;
      for (let y = ky0; y < ky1; y++) {
        const o = y * W;
        for (let x = kx0; x < kx1; x++) if (a[o + x] > 0.001) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; y1 = y; }
      }
      return x1 < 0 ? { x0: 0, y0: 0, x1: 0, y1: 0, bos: true } : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
    }
    const kirp = (k) => k ? [clamp(Math.floor(k[0]), 0, W), clamp(Math.floor(k[1]), 0, W), clamp(Math.ceil(k[2]), 0, W), clamp(Math.ceil(k[3]), 0, W)] : null;
    /** Maske: ciz(ctx) beyazla çizer; dönen {a, x0,y0,x1,y1}. kutu verilirse yalnız o bölge okunur. */
    function maske(ciz, kutuA) {
      const k = kirp(kutuA);
      mx.setTransform(1, 0, 0, 1, 0, 0);
      mx.globalCompositeOperation = 'source-over';
      mx.globalAlpha = 1;
      mx.filter = 'none';
      if (k) mx.clearRect(k[0], k[1], k[2] - k[0], k[3] - k[1]); else mx.clearRect(0, 0, W, W);
      mx.fillStyle = '#fff'; mx.strokeStyle = '#fff';
      mx.lineCap = 'round'; mx.lineJoin = 'round';
      mx.save();
      if (k) { mx.beginPath(); mx.rect(k[0], k[1], k[2] - k[0], k[3] - k[1]); mx.clip(); }
      ciz(mx);
      mx.restore();
      mx.setTransform(1, 0, 0, 1, 0, 0);
      mx.globalCompositeOperation = 'source-over';
      mx.globalAlpha = 1;
      const a = new Float32Array(N);
      if (k) {
        const w = k[2] - k[0], h = k[3] - k[1];
        if (w <= 0 || h <= 0) return { a, x0: 0, y0: 0, x1: 0, y1: 0, bos: true };
        const d = mx.getImageData(k[0], k[1], w, h).data;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) a[(y + k[1]) * W + x + k[0]] = d[(y * w + x) * 4 + 3] / 255;
        mx.clearRect(k[0], k[1], w, h);
        return Object.assign({ a }, kutuBul(a, k));
      }
      const d = mx.getImageData(0, 0, W, W).data;
      for (let i = 0; i < N; i++) a[i] = d[i * 4 + 3] / 255;
      return Object.assign({ a }, kutuBul(a));
    }
    function yolMaske(yollar, kalinlik, kutuA) {
      return maske((c) => {
        for (const y of [].concat(yollar)) {
          const p = typeof y === 'string' ? new Path2D(y) : y;
          if (kalinlik) { c.lineWidth = kalinlik; c.stroke(p); } else c.fill(p);
        }
      }, kutuA);
    }
    /** İşlev maskesi: f(x, y) → 0..1, kutu içinde. */
    function fMaske(kutuA, f) {
      const a = new Float32Array(N);
      const x0 = clamp(Math.floor(kutuA[0]), 0, W), y0 = clamp(Math.floor(kutuA[1]), 0, W), x1 = clamp(Math.ceil(kutuA[2]), 0, W), y1 = clamp(Math.ceil(kutuA[3]), 0, W);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) a[y * W + x] = clamp(f(x, y), 0, 1);
      return { a, x0, y0, x1, y1 };
    }
    /** İki maskeden yenisi; kutu: 'ilk' (m1 kutusu yeter), 'kesis' ya da birleşim (varsayılan). */
    function islem(m1, m2, f, tur) {
      const a = new Float32Array(N);
      let k;
      if (tur === 'ilk' || !m2) k = [m1.x0, m1.y0, m1.x1, m1.y1];
      else if (tur === 'kesis') k = [Math.max(m1.x0, m2.x0), Math.max(m1.y0, m2.y0), Math.min(m1.x1, m2.x1), Math.min(m1.y1, m2.y1)];
      else if (tur === 'hepsi') k = [0, 0, W, W];
      else k = [Math.min(m1.x0, m2.x0), Math.min(m1.y0, m2.y0), Math.max(m1.x1, m2.x1), Math.max(m1.y1, m2.y1)];
      if (m1.bos && m2 && !m2.bos && tur !== 'ilk' && tur !== 'kesis') k = [m2.x0, m2.y0, m2.x1, m2.y1];
      if (k[2] <= k[0] || k[3] <= k[1]) return { a, x0: 0, y0: 0, x1: 0, y1: 0, bos: true };
      for (let y = k[1]; y < k[3]; y++) for (let x = k[0]; x < k[2]; x++) { const i = y * W + x; a[i] = clamp(f(m1.a[i], m2 ? m2.a[i] : 0, i), 0, 1); }
      return Object.assign({ a }, kutuBul(a, k));
    }
    const cikar = (m1, m2) => islem(m1, m2, (p, q) => p * (1 - q), 'ilk');
    const kesis = (m1, m2) => islem(m1, m2, (p, q) => p * q, 'kesis');
    const birles = (m1, m2) => islem(m1, m2, (p, q) => p + q - p * q);
    function mBulanik(m, r) {
      r = Math.max(1, Math.round(r));
      if (m.bos) return m;
      const x0 = Math.max(0, m.x0 - 2 * r - 2), y0 = Math.max(0, m.y0 - 2 * r - 2), x1 = Math.min(W, m.x1 + 2 * r + 2), y1 = Math.min(W, m.y1 + 2 * r + 2);
      const w = x1 - x0, h = y1 - y0, L = new Float32Array(w * h);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) L[(y - y0) * w + x - x0] = m.a[y * W + x];
      const B = bulanik(L, w, h, r), a = new Float32Array(N);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) a[y * W + x] = B[(y - y0) * w + x - x0];
      return { a, x0, y0, x1, y1 };
    }
    function ornekle(a, x, y) {
      x = x < 0 ? 0 : x > W - 1.001 ? W - 1.001 : x;
      y = y < 0 ? 0 : y > W - 1.001 ? W - 1.001 : y;
      const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, i = yi * W + xi;
      return a[i] * (1 - fx) * (1 - fy) + a[i + 1] * fx * (1 - fy) + a[i + W] * (1 - fx) * fy + a[i + W + 1] * fx * fy;
    }

    /**
     * Yıkama / sır. o: yog (yoğunluk), kenar (kuruma kenarı koyuluğu), kenarR, gran (granülasyon), akis (akış dalgası),
     * titre (el titremesi px), yumusak (kenar yumuşatma yarıçapı), grad(x,y) çarpanı, koru (korunan maske),
     * kuru (kuru fırça eşiği 0–1: boya yalnız kâğıdın tepelerine), kuruY (eşik yumuşaklığı), kayma (titreme alanı kaydırma)
     */
    function yika(m, renk, o) {
      o = o || {};
      if (m.bos) return;
      const T = typeof renk === 'string' ? hex(renk) : renk;
      const yog = o.yog == null ? 1 : o.yog;
      const ab = T.map((c) => -Math.log(clamp(c / 255, 0.004, 1)) * yog);
      const kenar = o.kenar == null ? 0.3 : o.kenar, kr = o.kenarR || 4, gran = o.gran == null ? 0.2 : o.gran, akis = o.akis == null ? 0.14 : o.akis;
      const titre = o.titre || 0, yum = o.yumusak || 0, kuru = o.kuru || 0, kuruY = o.kuruY || 0.07, tuy = o.tuy || 0;
      const pad = Math.ceil(titre + yum * 2 + kr * 2 + 3);
      const x0 = Math.max(0, m.x0 - pad), y0 = Math.max(0, m.y0 - pad), x1 = Math.min(W, m.x1 + pad), y1 = Math.min(W, m.y1 + pad);
      const w = x1 - x0, h = y1 - y0;
      let L = new Float32Array(w * h);
      const ks = o.kayma == null ? (tohum * 37 + Math.round(m.x0 * 1.3 + m.y0 * 0.7)) % 400 : o.kayma;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        if (titre) {
          const k = ((y + ks) % W) * W + ((x + ks * 2) % W);
          L[j] = ornekle(m.a, x + DX[k] * titre, y + DY[k] * titre);
        } else L[j] = m.a[y * W + x];
      }
      if (yum) L = bulanik(L, w, h, yum);
      if (tuy) {
        // ıslak kâğıtta tüylenen kenar: bulanık maske gürültülü bir eşikle yumuşakça kesilir
        const tg = o.tuyG || 0.22;
        for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
          const j = (y - y0) * w + x - x0, v = L[j];
          if (v <= 0.001 || v >= 0.999) continue;
          const i = y * W + x;
          const t = 0.5 + (AK[(i + ks * 613) % N] - 0.5) * tuy + (G[i] - 0.5) * tuy * 0.35;
          L[j] = sstep(t - tg, t + tg, v);
        }
      }
      const Lb = kenar ? bulanik(L, w, h, kr) : null;
      const grad = o.grad, koru = o.koru ? o.koru.a : null;
      const tk = 1 - kenar * 0.45;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        let a = L[j];
        if (a <= 0.002) continue;
        const i = y * W + x;
        if (kenar) { const e = a - Lb[j]; a = a * tk + kenar * 2.2 * (e > 0 ? e : 0); }
        if (gran) a *= 1 + gran * (G[i] - 0.5) * 2;
        if (akis) a *= 1 + akis * (AK[(i + ks * 1031) % N] - 0.5) * 2;
        if (grad) a *= grad(x, y);
        if (koru) a *= 1 - koru[i];
        if (kuru) a *= sstep(kuru - kuruY, kuru + kuruY, H[i] * 0.85 + G[(i + 7919) % N] * 0.15 + (AK[i] - 0.5) * 0.25);
        if (a <= 0) continue;
        C0[i] *= Math.exp(-ab[0] * a); C1[i] *= Math.exp(-ab[1] * a); C2[i] *= Math.exp(-ab[2] * a);
      }
    }
    /** Opak boya (guaj, beyaz): o.kap örtme, o.kuru kuru fırça eşiği, o.kalin kabartma kalınlığı, o.titre. */
    function opak(m, renk, o) {
      o = o || {};
      if (m.bos) return;
      const T = (typeof renk === 'string' ? hex(renk) : renk).map((c) => c / 255);
      const kap = o.kap == null ? 0.95 : o.kap, kuru = o.kuru || 0, kuruY = o.kuruY || 0.08, kalin = o.kalin == null ? 0.5 : o.kalin;
      const titre = o.titre || 0, yum = o.yumusak || 0, grad = o.grad, koru = o.koru ? o.koru.a : null, akis = o.akis == null ? 0.1 : o.akis;
      const kirik = o.kirik || 0;
      const pad = Math.ceil(titre + yum * 2 + 3);
      const x0 = Math.max(0, m.x0 - pad), y0 = Math.max(0, m.y0 - pad), x1 = Math.min(W, m.x1 + pad), y1 = Math.min(W, m.y1 + pad);
      const w = x1 - x0, h = y1 - y0;
      let L = new Float32Array(w * h);
      const ks = (tohum * 53 + Math.round(m.x0 * 1.7 + m.y0)) % 400;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        if (titre) { const k = ((y + ks) % W) * W + ((x + ks * 2) % W); L[j] = ornekle(m.a, x + DX[k] * titre, y + DY[k] * titre); }
        else L[j] = m.a[y * W + x];
      }
      if (yum) L = bulanik(L, w, h, yum);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const j = (y - y0) * w + x - x0;
        let a = L[j];
        if (a <= 0.002) continue;
        const i = y * W + x;
        if (kirik) a = sstep(0.4, 0.6, a + (H[i] - 0.5) * kirik + (AK[(i + 4409) % N] - 0.5) * 0.3 * kirik) * (0.75 + 0.25 * a);
        a *= kap;
        if (akis) a *= 1 + akis * (AK[(i + ks * 977) % N] - 0.5) * 2;
        if (grad) a *= grad(x, y);
        if (koru) a *= 1 - koru[i];
        if (kuru) a *= sstep(kuru - kuruY, kuru + kuruY, H[i] * 0.8 + (AK[(i + 3331) % N] - 0.5) * 0.3 + G[i] * 0.2);
        a = clamp(a, 0, 1);
        C0[i] += (T[0] - C0[i]) * a; C1[i] += (T[1] - C1[i]) * a; C2[i] += (T[2] - C2[i]) * a;
        KAL[i] += a * kalin;
      }
    }
    /** Son: kâğıt kabartması (sol üstten ışık), guaj kalınlığı, tuvale yazma. */
    function bitir(ctx) {
      const K = bulanik(KAL, W, W, 1);
      const img = ctx.createImageData(W, W), d = img.data;
      for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const ia = Math.max(0, i - W - 1), ib = Math.min(N - 1, i + W + 1);
        const rel = (H[ia] - H[ib]) * dk.kabartma + (K[ia] - K[ib]) * 0.35;
        const s = 1 + rel - dk.ton * (0.5 - H[i]);
        d[i * 4] = clamp(C0[i] * s * 255, 0, 255);
        d[i * 4 + 1] = clamp(C1[i] * s * 255, 0, 255);
        d[i * 4 + 2] = clamp(C2[i] * s * 255, 0, 255);
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    return { W, N, H, G, AK, DX, DY, clamp, sstep, hex, gurultu, fbm, bulanik, maske, yolMaske, fMaske, islem, cikar, kesis, birles, mBulanik, yika, opak, bitir, C: [C0, C1, C2] };
  }

  // ================================================================== sahne geometrisi ve ışık
  function Geo() {
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const prof = SAHNE.kubbeProfili(500);
    const KR = new Float32Array(1024), KD = new Float32Array(1024);
    for (let y = 300; y <= 555; y++) {
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
      KR[y] = a.r + (b.r - a.r) * t;
    }
    KR[300] = 0.5;
    for (let y = 301; y < 555; y++) KD[y] = (KR[y + 1] - KR[y - 1]) / 2;
    KD[300] = KD[301] * 1.4; KD[555] = KD[554];
    const L = (() => { const v = [0.6, -0.55, 0.58], l = Math.hypot(...v); return v.map((c) => c / l); })();
    /** Kubbe noktası: {u, fi (boylam), dilim (0–15), t (dilim içi 0–1), isik} */
    function kubbe(x, y, yassi) {
      const yy = clamp(y, 300, 555), yi = Math.floor(yy), fy = yy - yi;
      const r = Math.max(0.5, KR[yi] + (KR[Math.min(555, yi + 1)] - KR[yi]) * fy);
      const dr = KD[yi];
      const u = clamp((x - 560) / r, -1, 1);
      const fi = Math.asin(u);

      }
    }, kt);
    M.opak(mT, BEYAZ, { kap: 0.97, kirik: 0.2, kalin: 0.14, akis: 0.06 });
    // göbek: örtücü sarı guaj, siena noktalar (suluboya), beyaz parıltı
    const gr = c.r * 0.2;
    M.opak(M.maske((cx) => { cx.beginPath(); cx.arc(c.x, c.y, gr, 0, Math.PI * 2); cx.fill(); }, kt), '#EDC24A', { kap: 0.95, kalin: 0.1, kirik: 0.08, titre: 0.6 });
    M.yika(M.kesis(M.maske((cx) => { cx.beginPath(); cx.arc(c.x, c.y, gr, 0, Math.PI * 2); cx.fill(); }, kt), M.fMaske(kt, (x, y) => sstep(-gr * 0.1, -gr * 0.45, (x - c.x) * LX + (y - c.y) * LY + (nz(x / 3.5 + c.x, y / 3.5) - 0.5) * gr * 0.4))), '#B8772A', { yog: 0.42, kenar: 0.25, titre: 0.4 });
    M.yika(M.maske((cx) => { for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + c.aci, rr = gr * 1.3; cx.beginPath(); cx.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.03), 0, Math.PI * 2); cx.fill(); } }, kt), '#7E5326', { yog: 0.85, kenar: 0.1 });
    // küçük, düzensiz beyaz dokunuş: ince fırçanın kısa bir çekişi (yuvarlak parıltı değil)
    M.opak(M.maske((cx) => { darbe(cx, [[c.x + gr * 0.12, c.y - gr * 0.62], [c.x + gr * 0.42, c.y - gr * 0.5], [c.x + gr * 0.62, c.y - gr * 0.22]], Math.max(1.4, gr * 0.22), 0.4); }, kt), BEYAZ, { kap: 0.8, kirik: 0.15, kalin: 0.08 });
  }
  // tomurcuklarda küçük beyaz ışık
  M.opak(M.maske((c) => { for (const t of B.tomurcuklar) { c.beginPath(); c.arc(t.x + Math.cos(t.aci) * t.r * 0.3 + 1.5, t.y + Math.sin(t.aci) * t.r * 0.3 - 1, Math.max(1, t.r * 0.18), 0, Math.PI * 2); c.fill(); } }), BEYAZ, { kap: 0.9, kalin: 0.5 });

  M.bitir(ctx);
  SAHNE.hazir();

})();
</script>
