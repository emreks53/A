<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-032 Nur Hüzmesi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #04050a; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-032 Nur Hüzmesi — koyu zeminde çizgi de dolgu da yok: sahne yalnızca kubbe alemindeki hilalden
  // saçılan binlerce ince ışın ile görünür. Her ışın geçtiği biçime göre parlaklık ve renk değiştirir.
  (function () {
    const S = SAHNE;
    const W = 1024;
    const IC = 2048; // iç çözünürlük
    const tuval = document.getElementById('tuval');
    tuval.width = IC;
    tuval.height = IC;
    const ctx = tuval.getContext('2d');
    const rnd = S.rng(32);

    // ---------------------------------------------------------------- bölge, ton ve ayrıntı haritaları (2048 çözünürlük: kenarlar basamaksız)
    const ADLAR = Object.keys(S.BOLGE);
    const bolge = new Uint8Array(IC * IC);
    {
      const c = S.yeniTuval(IC, IC);
      const g = c.getContext('2d', { willReadFrequently: true });
      g.setTransform(2, 0, 0, 2, 0, 0);
      S.ciz(g, { bolge: true });
      const v = g.getImageData(0, 0, IC, IC).data;
      const onbellek = new Map();
      for (let i = 0; i < IC * IC; i++) {
        const anahtar = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
        let no = onbellek.get(anahtar);
        if (no === undefined) {
          const ad = S.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2]);
          no = ADLAR.indexOf(ad === 'gunes' ? 'gok' : ad); // güneş yok: gök sayılır
          onbellek.set(anahtar, no);
        }
        bolge[i] = no;
      }
    }
    // kenar yumuşatmasından doğan yanlış bölge piksellerini komşu çoğunluğuyla düzelt; güneş diskini göğe kat
    {
      const gokNo = ADLAR.indexOf('gok');
      for (let y = 0; y < IC; y++) {
        for (let x = 0; x < IC; x++) {
          const dx = x / 2 - S.gunes.x;
          const dy = y / 2 - S.gunes.y;
          if (dx * dx + dy * dy < 54 * 54) bolge[y * IC + x] = gokNo;
        }
      }
      const kopya = bolge.slice();
      const say = new Uint8Array(ADLAR.length);
      for (let y = 1; y < IC - 1; y++) {
        for (let x = 1; x < IC - 1; x++) {
          const i = y * IC + x;
          const b = kopya[i];
          if (kopya[i - 1] === b && kopya[i + 1] === b && kopya[i - IC] === b && kopya[i + IC] === b) continue;
          say.fill(0);
          for (let v = -1; v <= 1; v++) for (let u = -1; u <= 1; u++) say[kopya[i + v * IC + u]]++;
          if (say[b] <= 2) {
            let en = b;
            for (let k = 0; k < say.length; k++) if (say[k] > say[en]) en = k;
            bolge[i] = en;
          }
        }
      }
    }
    const rh = S.renkHaritasi();
    const ton = new Float32Array(W * W);
    for (let i = 0; i < W * W; i++) {
      const v = rh.veri;
      ton[i] = (0.3 * v[i * 4] + 0.59 * v[i * 4 + 1] + 0.11 * v[i * 4 + 2]) / 255;
    }

    // ayrıntı çizgileri (ışın buradan geçerken bir an parlar): kaburgalar, zikzak, korkuluk, taç yaprağı kenarı, damar
    const ay = S.yeniTuval(IC, IC);
    const ac = ay.getContext('2d', { willReadFrequently: true });
    ac.setTransform(2, 0, 0, 2, 0, 0);
    ac.strokeStyle = '#fff';
    ac.lineCap = 'round';
    ac.lineJoin = 'round';
    const Y = S.yollar();
    ac.lineWidth = 1.6;
    for (const k of Y.kaburgalar) ac.stroke(new Path2D(k));
    ac.lineWidth = 1.4;
    for (const z of Y.zikzak) ac.stroke(new Path2D(z));
    for (const p of S.minareParcalari()) {
      if (p.tip !== 'korkuluk') continue;
      for (let i = 0; i < 9; i++) {
        const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / 9;
        ac.beginPath();
        ac.moveTo(x, p.y1 + 4);
        ac.lineTo(x, p.y2 - 3);
        ac.stroke();
      }
    }
    // kaide taş sıraları ve kasnak silmeleri
    ac.lineWidth = 1.1;
    for (const yy of [610, 704]) {
      ac.beginPath();
      ac.moveTo(300, yy);
      ac.lineTo(820, yy);
      ac.stroke();
    }
    ac.lineWidth = 1.2;
    for (const c of S.bitki.cicekler) for (const e of S.tacYapraklari(c)) ac.stroke(new Path2D(S.elipsYolu(e)));
    ac.lineWidth = 1;
    for (const y of S.bitki.yapraklar) {
      const [a, b] = S.yaprakDamari(y);
      ac.beginPath();
      ac.moveTo(a[0], a[1]);
      ac.lineTo(b[0], b[1]);
      ac.stroke();
    }
    const av = ac.getImageData(0, 0, IC, IC).data;
    const ayrinti = new Float32Array(IC * IC);
    for (let i = 0; i < IC * IC; i++) ayrinti[i] = av[i * 4 + 3] / 255;

    // bölge sınırı (ışın bir biçime girip çıkarken kısa bir parlama)
    const sinir = new Float32Array(IC * IC);
    for (let y = 1; y < IC - 1; y++) {
      for (let x = 1; x < IC - 1; x++) {
        const i = y * IC + x;
        const b = bolge[i];
        if (bolge[i - 1] !== b || bolge[i + 1] !== b || bolge[i - IC] !== b || bolge[i + IC] !== b) sinir[i] = 1;
      }
    }
    // biraz yay (ışın adımı kaçırmasın): iki piksel genişliğe
    const sinir2 = new Float32Array(IC * IC);
    for (let y = 2; y < IC - 2; y++) {
      for (let x = 2; x < IC - 2; x++) {
        const i = y * IC + x;
        const m1 = Math.max(sinir[i - 1], sinir[i + 1], sinir[i - IC], sinir[i + IC]);
        const m2 = Math.max(sinir[i - 2], sinir[i + 2], sinir[i - 2 * IC], sinir[i + 2 * IC]);
        sinir2[i] = Math.max(sinir[i], 0.8 * m1, 0.45 * m2);
      }
    }

    // ---------------------------------------------------------------- bölgeye göre ışın rengi ve gücü
    const P = {
      gok: [0.34, 0.52, 1.0, 0.17],
      gunes: [0.34, 0.52, 1.0, 0.17],
      kubbe: [0.62, 0.92, 0.30, 0.95], // yeşil-altın
      kasnak: [0.50, 0.86, 0.30, 0.80],
      pencere: [0.35, 0.45, 0.30, 0.06],
      kaide: [1.0, 0.86, 0.62, 1.0], // krem
      minare: [1.0, 0.87, 0.64, 1.1],
      altin: [1.0, 0.78, 0.36, 1.25],
      cicek: [1.0, 0.84, 0.92, 1.25], // pembe-beyaz
      cicekOrta: [1.0, 0.76, 0.28, 1.05],
      yaprak: [0.42, 0.78, 0.46, 0.68],
      sap: [0.46, 0.80, 0.46, 0.7],
      zemin: [0.86, 0.64, 0.40, 0.34], // sıcak kum: ışık yere düşüp söner
    };
    const PR = ADLAR.map((ad) => P[ad]);
    const yapisal = ADLAR.map((ad) => !['gok', 'gunes', 'zemin'].includes(ad));

    // ---------------------------------------------------------------- ışınlar
    const kaynak = { x: 560, y: 201 }; // kubbe alemindeki hilal
    const NR = 5600;
    const ADIM = 0.34;
    const R = new Float32Array(IC * IC);
    const G = new Float32Array(IC * IC);
    const B = new Float32Array(IC * IC);
    // açıya bağlı yavaş değişen demet yoğunluğu (ışınlar demet demet)
    const demet = [];
    for (let k = 0; k < 6; k++) demet.push({ f: 3 + Math.floor(rnd() * 40), faz: rnd() * 6.283, g: 0.5 / (k + 1) });
    const demetGucu = (a) => {
      let s = 0;
      for (const d of demet) s += d.g * Math.sin(a * d.f + d.faz);
      return Math.max(0.15, 0.75 + 0.75 * s);
    };
    const soluk = new Float32Array(1500);
    for (let d = 0; d < 1500; d++) soluk[d] = 0.5 + 0.6 * Math.exp(-d / 280) + 1.5 * Math.exp(-d / 60) * Math.min(1, Math.max(0, (d - 14) / 26));

    function serp(x, y, w, c) {
      // 2048 tampona çift doğrusal serpme
      const fx = x * 2 - 0.5;
      const fy = y * 2 - 0.5;
      const ix = fx | 0;
      const iy = fy | 0;
      if (ix < 0 || iy < 0 || ix >= IC - 1 || iy >= IC - 1) return;
      const tx = fx - ix;
      const ty = fy - iy;
      const i = iy * IC + ix;
      const w00 = (1 - tx) * (1 - ty) * w;
      const w10 = tx * (1 - ty) * w;
      const w01 = (1 - tx) * ty * w;
      const w11 = tx * ty * w;
      R[i] += w00 * c[0]; G[i] += w00 * c[1]; B[i] += w00 * c[2];
      R[i + 1] += w10 * c[0]; G[i + 1] += w10 * c[1]; B[i + 1] += w10 * c[2];
      R[i + IC] += w01 * c[0]; G[i + IC] += w01 * c[1]; B[i + IC] += w01 * c[2];
      R[i + IC + 1] += w11 * c[0]; G[i + IC + 1] += w11 * c[1]; B[i + IC + 1] += w11 * c[2];
    }

    const yogunluk = (2 * Math.PI) / NR;
    const renk = [0, 0, 0];
    for (let k = 0; k < NR; k++) {
      const a = ((k + rnd() * 0.9) / NR) * Math.PI * 2;
      let guc = (0.12 + 0.88 * Math.pow(rnd(), 2.2)) * demetGucu(a);
      if (rnd() < 0.035) guc *= 2.1;
      const dx = Math.cos(a);
      const dy = Math.sin(a);
      // ışın tonu: hafif sıcak / soğuk sapma
      const sap = (rnd() - 0.5) * 0.12;
      for (let d = 15; d < 1500; d += ADIM) {
        const x = kaynak.x + dx * d;
        const y = kaynak.y + dy * d;
        if (x < 0 || y < 0 || x >= W || y >= W) break;
        const i = (y | 0) * W + (x | 0);
        const i2 = ((y * 2) | 0) * IC + ((x * 2) | 0);
        const b = bolge[i2];
        const p = PR[b];
        let w = p[3] * guc * soluk[d | 0] * d * yogunluk * ADIM;
        if (yapisal[b]) w *= 0.5 + 0.75 * ton[i];
        w *= 1 + 1.6 * sinir2[i2] + 0.9 * ayrinti[i2];
        // kaynağa yakın ışın altın-beyaz, uzaklaştıkça geçtiği biçimin rengini alır
        const t = d < 230 ? 1 - d / 230 : 0;
        const tt = t * t * 0.75;
        renk[0] = (p[0] * (1 - tt) + 1.0 * tt) * (1 + sap);
        renk[1] = p[1] * (1 - tt) + 0.86 * tt;
        renk[2] = (p[2] * (1 - tt) + 0.55 * tt) * (1 - sap);
        serp(x, y, w, renk);
      }
    }

    // ---------------------------------------------------------------- ton eşleme
    const img = ctx.createImageData(IC, IC);
    const o = img.data;
    const POZ = 3.8;
    for (let y = 0; y < IC; y++) {
      for (let x = 0; x < IC; x++) {
        const i = y * IC + x;
        // derin koyu zemin: hafif kenar kararması
        const ux = x / IC - 0.55;
        const uy = y / IC - 0.3;
        const zem = 0.012 + 0.016 * Math.max(0, 1 - Math.sqrt(ux * ux + uy * uy) * 1.4);
        const r = 1 - Math.exp(-R[i] * POZ);
        const g = 1 - Math.exp(-G[i] * POZ);
        const bb = 1 - Math.exp(-B[i] * POZ);
        o[i * 4] = Math.min(255, (zem * 0.8 + r) * 255);
        o[i * 4 + 1] = Math.min(255, (zem * 0.85 + g) * 255);
        o[i * 4 + 2] = Math.min(255, (zem * 1.5 + bb) * 255);
        o[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // ---------------------------------------------------------------- ışığın kendi hâlesi: aydınlık biçimlerin çevresine yumuşak taşma
    {
      const kopya = S.yeniTuval(IC, IC);
      const kc = kopya.getContext('2d');
      kc.drawImage(tuval, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.32;
      ctx.filter = 'blur(10px)';
      ctx.drawImage(kopya, 0, 0);
      ctx.globalAlpha = 0.18;
      ctx.filter = 'blur(36px)';
      ctx.drawImage(kopya, 0, 0);
      ctx.restore();
    }

    // ---------------------------------------------------------------- kaynakta yumuşak parlama (bloom)
    ctx.save();
    ctx.scale(2, 2);
    ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(kaynak.x, kaynak.y, 0, kaynak.x, kaynak.y, 190);
    g.addColorStop(0, 'rgba(255,240,200,0.32)');
    g.addColorStop(0.12, 'rgba(255,226,150,0.18)');
    g.addColorStop(0.4, 'rgba(220,190,120,0.06)');
    g.addColorStop(1, 'rgba(200,170,110,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, W);
    g = ctx.createRadialGradient(kaynak.x, kaynak.y + 2, 0, kaynak.x, kaynak.y + 2, 42);
    g.addColorStop(0, 'rgba(255,226,160,0.5)');
    g.addColorStop(0.4, 'rgba(255,220,150,0.26)');
    g.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, W);
    // hilalin kendisi: ışık kaynağı
    const al = S.alemParcalari(560, 300, 1).hilal;
    const hil = new Path2D(S.hilalYolu(al.cx, al.cy, al.R));
    ctx.filter = 'blur(6px)';
    ctx.fillStyle = 'rgba(255,214,130,0.7)';
    ctx.fill(hil);
    ctx.filter = 'blur(2px)';
    ctx.fillStyle = 'rgba(255,236,170,0.9)';
    ctx.fill(hil);
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#FFF8E6';
    ctx.fill(hil);
    ctx.restore();

    S.hazir();
  })();
</script>
</body>
</html>
