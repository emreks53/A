<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-217 Beyaz Mürekkep Konturlu Suluboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ======================================================================= suluboya motoru (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, kâğıt dokusu, yol örnekleme, elle çekilmiş çizgi
// ve saydam lavi katları. Her lavi kâğıda bir "pigment yoğunluğu" ekler; üst üste binen katlar çarpılarak
// koyulaşır (gerçek suluboya sırlaması gibi). Rastgelelik yalnız SAHNE.rng ile: görsel her seferinde aynı çıkar.
const S = SAHNE;
const OL = 2; // çalışma ölçeği: 2048 piksel, koordinatlar 1024
const WW = 1024 * OL;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler, eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim, kapali) {
  if (kapali) pts = pts.concat([pts[0]]);
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (!kapali && Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  if (kapali && out.length > 3) {
    const a = out[0];
    const b = out[out.length - 1];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < adim * 0.5) out.pop();
  }
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

let _ofs = 0;
/** Kapalı ya da açık nokta dizisinin kenarını elle titretir (düşük frekanslı oynama). */
function titret(pts, kapali, amp, fr, adim) {
  adim = adim || 1.5;
  const p = yenidenOrnekle(pts, adim, kapali);
  const N = normaller(p, kapali);
  const ofs = (_ofs += 7.9);
  const n = p.length;
  const L = n * adim;
  const R = (L * fr) / (2 * Math.PI);
  return p.map((q, i) => {
    let v;
    if (kapali) {
      const th = (i / n) * Math.PI * 2;
      v = (NZ.n(Math.cos(th) * R + ofs, Math.sin(th) * R + ofs * 0.3) - 0.5) * 2 + (NZ.n(Math.cos(th) * R * 3 + ofs + 50, Math.sin(th) * R * 3) - 0.5) * 0.6;
    } else {
      v = (NZ.n(i * adim * fr + ofs, ofs * 0.3) - 0.5) * 2 + (NZ.n(i * adim * fr * 3 + ofs + 50, 2.2) - 0.5) * 0.6;
    }
    return [q[0] + N[i][0] * amp * v, q[1] + N[i][1] * amp * v];
  });
}

/** Şekil: Path2D + sınır kutusu. polys: [[x,y]...] dizileri (kapalı). */
function sekil(polys, kural) {
  const yol = new Path2D();
  let x0 = 1e9;
  let y0 = 1e9;
  let x1 = -1e9;
  let y1 = -1e9;
  for (const p of polys) {
    p.forEach(([x, y], i) => {
      if (i) yol.lineTo(x, y);
      else yol.moveTo(x, y);
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    });
    yol.closePath();
  }
  return { yol, x0, y0, x1, y1, polys, kural: kural || 'nonzero' };
}
/** SVG yol dizgisinden elle titretilmiş şekil. */
function sekilYol(d, amp, fr, adim) {
  const polys = ornekle(d, adim || 1.5).map((p) => (amp ? titret(p.pts, true, amp, fr || 0.04, adim || 1.5) : p.pts));
  return sekil(polys);
}
/** Nokta dizisinden elle titretilmiş kapalı şekil. */
function sekilPoli(pts, amp, fr, adim) {
  return sekil([amp ? titret(pts, true, amp, fr || 0.04, adim || 1.5) : pts]);
}
/** Şekilleri birleştirir. */
function birlesik(liste) {
  return sekil(liste.flatMap((s) => s.polys));
}

/**
 * Elle çekilmiş çizginin şeridi (Path2D'ye eklenir): w kalınlık, titreme, frek, basinc (kalınlık oynaması),
 * basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta basınç düğümü, px)
 */
function seritPoli(pts, o) {
  const n = pts.length;
  if (n < 2) return null;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1];
  const N = normaller(pts, false);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    const q1 = NZ.n(t * fr + ofs, ofs * 0.37);
    const q2 = NZ.n(t * fr * 3.1 + ofs + 40, 5.5);
    const q3 = NZ.n(t * fr * 0.7 + ofs + 90, 3.3);
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.profil) w *= o.profil(t / (L || 1));
    if (a1 > 0 && t < a1) w *= 0.25 + 0.75 * Math.sin(((Math.PI / 2) * t) / a1);
    if (a2 > 0 && L - t < a2) w *= 0.1 + 0.9 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
    if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  return sol.concat(sag.reverse());
}
/** Nokta dizisini elle çekilmiş çizgi şekline çevirir. */
function cizgiSekil(pts, o) {
  const p = seritPoli(yenidenOrnekle(pts, o.adim || 1.1), o);
  return sekil([p]);
}
/** Birden çok çizgiyi tek şekilde toplar. */
function cizgilerSekil(liste, o) {
  return sekil(liste.map((pts) => seritPoli(yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o))).filter(Boolean));
}

// ---------------------------------------------------------------- kâğıt
const KAGIT = new Float32Array(WW * WW); // kâğıt yüzeyinin yüksekliği (0 çukur … 1 tepe)
/**
 * Kâğıt dokusu. o.tane: diş boyu (px, 1024 biriminde), o.iri: iri dalga payı, o.lif: lif çizgisi payı.
 */
function kagitKur(o) {
  const nz1 = gurultu(o.tohum || 11);
  const nz2 = gurultu((o.tohum || 11) + 1);
  const f1 = 1 / ((o.tane || 3) * OL);
  const f2 = f1 / 3.2;
  const iri = o.iri != null ? o.iri : 0.35;
  const lif = o.lif || 0;
  const tepe = o.tepe != null ? o.tepe : 1;
  let mn = 1e9;
  let mx = -1e9;
  for (let y = 0; y < WW; y++) {
    for (let x = 0; x < WW; x++) {
      let v = nz1.n(x * f1, y * f1) * 0.6 + nz1.n(x * f1 * 2.1 + 7, y * f1 * 2.1 + 3) * 0.25 + nz2.n(x * f2, y * f2) * iri;
      if (lif) v += lif * (nz2.n(x * f1 * 0.25 + 40, y * f1 * 2.5) - 0.5);
      if (tepe !== 1) v = Math.pow(Math.max(0, v), tepe);
      KAGIT[y * WW + x] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
  }
  const k = 1 / (mx - mn);
  for (let i = 0; i < KAGIT.length; i++) KAGIT[i] = (KAGIT[i] - mn) * k;
}

// ---------------------------------------------------------------- pigment yoğunlukları ve lavi
const D = [new Float32Array(WW * WW), new Float32Array(WW * WW), new Float32Array(WW * WW)];
/** Geniş ölçekli düzgünsüzlük dokusu (lavinin elle sürülmüş dalgası). 512², döşenebilir değil ama büyük. */
const DALGA = (function () {
  const nz = gurultu(909);
  const a = new Float32Array(512 * 512);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) a[y * 512 + x] = nz.fbm(x / 22, y / 22, 4);
  return a;
})();

const _mc = document.createElement('canvas');
const _bc = document.createElement('canvas');
/**
 * Lavi: şeklin içine saydam bir boya katı sürer ve kurur.
 *  v: [k0,k1,k2] yoğunluk katkısı (tam ağırlıkta)
 *  rim: kuruyan kenarın koyulaşması (0..), rimR: kenar koyulaşmasının genişliği (px)
 *  boncuk: kenarda ince koyu çizgi (boya birikintisi), gran: kâğıt çukurlarına çöken pigment (granülasyon)
 *  dalga: lavinin içindeki geniş düzgünsüzlük (0..1), dalgaO: dalga ölçeği, yatay: dalganın yatay uzaması
 *  yumusak: ıslak kenar (px bulanıklık; kenar koyulaşmasını azaltır), kuru: kenarın kâğıt dişine göre pürüzü
 *  haric: [sekil] lavinin dışında bırakılan (rezerve) yerler, carp: fn(x,y) → ağırlık çarpanı (degrade)
 */
function lavi(sk, o) {
  const v = o.v;
  const rimR = o.rimR != null ? o.rimR : 3;
  const rim = o.rim != null ? o.rim : 0.6;
  const boncuk = o.boncuk != null ? o.boncuk : 0.35;
  const gran = o.gran != null ? o.gran : 0.15;
  const dalga = o.dalga != null ? o.dalga : 0.14;
  const dalgaO = o.dalgaO || 1;
  const yatay = o.yatay || 1;
  const soft = o.yumusak || 0;
  const kuru = o.kuru != null ? o.kuru : 0.3;
  const carp = o.carp || null;
  const havuz = o.havuz != null ? o.havuz : 0.6; // eğik tahtada boya alt kenarda birikir
  const pad = Math.ceil(rimR * 3 + soft * 3 + 4);
  const x0 = Math.floor(sk.x0 - pad);
  const y0 = Math.floor(sk.y0 - pad);
  const x1 = Math.ceil(sk.x1 + pad);
  const y1 = Math.ceil(sk.y1 + pad);
  const bw = (x1 - x0) * OL;
  const bh = (y1 - y0) * OL;
  if (bw <= 0 || bh <= 0) return;
  _mc.width = bw;
  _mc.height = bh;
  const mx = _mc.getContext('2d', { willReadFrequently: true });
  mx.setTransform(OL, 0, 0, OL, -x0 * OL, -y0 * OL);
  mx.filter = soft ? `blur(${soft * OL}px)` : 'none';
  mx.fillStyle = '#fff';
  mx.fill(sk.yol, sk.kural || 'nonzero');
  if (o.haric) {
    mx.globalCompositeOperation = 'destination-out';
    for (const h of o.haric) mx.fill(h.yol, h.kural || 'nonzero');
    mx.globalCompositeOperation = 'source-over';
  }
  mx.filter = 'none';
  const m = mx.getImageData(0, 0, bw, bh).data;
  _bc.width = bw;
  _bc.height = bh;
  const bx = _bc.getContext('2d', { willReadFrequently: true });
  bx.filter = `blur(${0.9 * OL}px)`;
  bx.drawImage(_mc, 0, 0);
  const b0 = bx.getImageData(0, 0, bw, bh).data;
  bx.clearRect(0, 0, bw, bh);
  bx.filter = `blur(${rimR * OL}px)`;
  bx.drawImage(_mc, 0, 0);
  const b1 = bx.getImageData(0, 0, bw, bh).data;
  bx.filter = 'none';
  // yumuşak kenarla bırakılan yerler (ıslakken kenarı nemli fırçayla açılmış): kenar koyulaşması yok
  let hy = null;
  if (o.haricYum) {
    bx.clearRect(0, 0, bw, bh);
    bx.setTransform(OL, 0, 0, OL, -x0 * OL, -y0 * OL);
    bx.filter = `blur(${(o.haricYumR || 6) * OL}px)`;
    bx.fillStyle = '#fff';
    for (const h of o.haricYum) bx.fill(h.yol, h.kural || 'nonzero');
    bx.filter = 'none';
    bx.setTransform(1, 0, 0, 1, 0, 0);
    hy = bx.getImageData(0, 0, bw, bh).data;
  }
  const ox = (o.dalgaOfs != null ? o.dalgaOfs : (_ofs += 37.1)) % 400;
  const oy = (ox * 1.7 + 91) % 400;
  const sc = 1 / (2 * OL * dalgaO);
  const D0 = D[0];
  const D1 = D[1];
  const D2 = D[2];
  const v0 = v[0];
  const v1 = v[1];
  const v2 = v[2];
  const kenarYumusak = soft > 0 ? Math.max(0, 1 - soft / 3) : 1;
  for (let py = 0; py < bh; py++) {
    const gy = y0 * OL + py;
    if (gy < 0 || gy >= WW) continue;
    const row = py * bw;
    const ty = (((gy * sc + oy) | 0) & 511) * 512;
    for (let px = 0; px < bw; px++) {
      const gx = x0 * OL + px;
      if (gx < 0 || gx >= WW) continue;
      const k = (row + px) * 4 + 3;
      const ma = m[k];
      if (ma === 0 && b0[k] === 0) continue;
      const gi = gy * WW + gx;
      const P = KAGIT[gi];
      let a;
      if (kuru > 0 && !soft) {
        const t = b0[k] / 255 + (P - 0.5) * kuru;
        a = t <= 0.38 ? 0 : t >= 0.62 ? 1 : yumusak(0.38, 0.62, t);
      } else a = ma / 255;
      if (hy) a *= 1 - hy[k] / 255;
      if (a <= 0.003) continue;
      const e1 = kenet((1 - b1[k] / 255) * 2, 0, 1) * kenarYumusak;
      const e0 = kenet((1 - b0[k] / 255) * 2, 0, 1) * kenarYumusak;
      const dv = DALGA[ty + ((((gx * sc) / yatay + ox) | 0) & 511)];
      let w = (1 + dalga * (dv - 0.5) * 2) * (1 + gran * (0.5 - P) * 2);
      if (carp) w *= carp(gx / OL, gy / OL);
      let rr = rim * e1 * e1;
      if (havuz && py > 2 && py < bh - 3) {
        const g = (b1[k - bw * 8] - b1[k + bw * 8]) / 255; // >0: şeklin alt kenarı
        if (g > 0) rr *= 1 + havuz * Math.min(1, g * 4);
        else rr *= 1 + havuz * 0.35 * Math.max(-1, g * 4);
      }
      w = a * (w + rr + boncuk * e0 * e0 * e0);
      if (w <= 0) continue;
      D0[gi] += w * v0;
      D1[gi] += w * v1;
      D2[gi] += w * v2;
    }
  }
}

/** Renkten (hex) RGB optik yoğunluk vektörü: kâğıdı o renge boyayan tam kat × k. */
function od(h, k) {
  const c = hex(h);
  k = k == null ? 1 : k;
  return c.map((v) => -Math.log(Math.max(4, v) / 252) * k);
}

/**
 * Kâğıdı ve yoğunlukları son görüntüye çevirir. renk(d0,d1,d2,P,out) → out[0..2] (0..255).
 * Kâğıt dişi sağ üstten gelen ışıkla hafifçe gölgelenir.
 */
function bitir(renk, o) {
  o = o || {};
  const c = document.createElement('canvas');
  c.width = WW;
  c.height = WW;
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(WW, WW);
  const d = im.data;
  const out = [0, 0, 0];
  const dis = o.dis != null ? o.dis : 0.07;
  const yon = OL - OL * WW; // sağ üst komşu
  for (let i = 0; i < WW * WW; i++) {
    const P = KAGIT[i];
    renk(D[0][i], D[1][i], D[2][i], P, out);
    const j = i + yon;
    const sh = j >= 0 ? 1 + dis * (P - KAGIT[j]) : 1;
    const k = i * 4;
    d[k] = out[0] * sh;
    d[k + 1] = out[1] * sh;
    d[k + 2] = out[2] * sh;
    d[k + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return { c, x };
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.width = 1024;
  cv.height = 1024;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma, 0, 0, 1024, 1024);
  return ctx;
}

// ---------------------------------------------------------------- sahne yardımcıları
const _prof = S.kubbeProfili(400);
/** Kubbe profilinden y → yarıçap. */
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}
/** Kubbede boylam aralığı [b1,b2] (radyan, -π/2..π/2) ve yükseklik aralığı [ya,yb] arasındaki dilim çokgeni. */
function kubbeDilimi(b1, b2, ya, yb, n) {
  n = n || 40;
  const sol = [];
  const sag = [];
  for (let i = 0; i <= n; i++) {
    const y = ya + ((yb - ya) * i) / n;
    const r = kubbeR(y);
    sol.push([560 + Math.sin(b1) * r, y]);
    sag.push([560 + Math.sin(b2) * r, y]);
  }
  return sol.concat(sag.reverse());
}
const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** Sivri kemer çokgeni. */
function kemerPoli(x, y, w, h) {
  return ornekle(S.kemerYolu(x, y, w, h), 0.8)[0].pts;
}
function elips(cx, cy, rx, ry, aci, n) {
  n = n || 48;
  const ca = Math.cos(aci || 0);
  const sa = Math.sin(aci || 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const u = Math.cos(t) * rx;
    const v = Math.sin(t) * ry;
    out.push([cx + u * ca - v * sa, cy + u * sa + v * ca]);
  }
  return out;
}

// ---------------------------------------------------------------- sahne biçimleri (ressamın ölçülü çizimi)
function bez3(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
}
/** Yaprak: tam biçim ve orta damarla ayrılmış iki yarısı (yerel koordinatta hesaplanıp döndürülür). */
function yaprakBicimi(y, bosluk) {
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  const n = 18;
  const ust = [];
  const alt = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    ust.push(bez3([0, 0], [L * 0.35, -W * 0.75], [L * 0.8, -W * 0.45], [L, 0], t));
    alt.push(bez3([0, 0], [L * 0.35, W * 0.75], [L * 0.8, W * 0.45], [L, 0], t));
  }
  const g = (bosluk || 0) / 2;
  const damar = [];
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    damar.push([L * t, -W * 0.06 * Math.sin(Math.PI * t)]);
  }
  const yarim1 = ust.concat(damar.map(([u, v]) => [u, v - g * Math.sin(Math.PI * Math.min(1, (u / L) * 1.3 + 0.08))]));
  const yarim2 = alt.concat(damar.map(([u, v]) => [u, v + g * Math.sin(Math.PI * Math.min(1, (u / L) * 1.3 + 0.08))]));
  const tam = ust.concat(alt.slice().reverse().slice(1));
  const T = (arr) => arr.map(([u, v]) => p(u, v));
  // ışık sağ üstten: yarının dış normali ışığa bakıyor mu?
  const nx = -(-sa);
  const ny = -ca; // üst yarı (v<0) yönü
  const isikUst = nx * 0.66 + ny * -0.75 > 0;
  return { tam: T(tam), yarim: [T(yarim1), T(yarim2)], isikli: isikUst ? 0 : 1, damar: T(damar.slice().reverse()), ucu: p(L, 0) };
}
/** Beş taç yapraklı çiçeğin taç yaprakları (uçta hafif çentik) ve gölge yarıları. */
function cicekBicimi(c) {
  const out = { taclar: [], golgeler: [], ic: [] };
  const Lx = 0.66;
  const Ly = -0.75;
  for (let i = 0; i < 5; i++) {
    const a = c.aci + (i * Math.PI * 2) / 5;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const R = c.r;
    const pts = [];
    const n = 56;
    for (let k = 0; k < n; k++) {
      const t = (k / n) * Math.PI * 2;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41;
      const tt = Math.atan2(Math.sin(t), Math.cos(t));
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2)); // uçtaki çentik
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7; // dipte daralma
      pts.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.taclar.push(pts);
    // gölge tarafı: v ekseni ışığa bakmıyorsa v>0 yarısı gölgede
    const vx = -sa;
    const vy = ca;
    const isaret = vx * Lx + vy * Ly > 0 ? -1 : 1;
    const g = [];
    for (let k = 0; k <= 28; k++) {
      const t = (k / 28) * Math.PI;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41 * isaret;
      const tt = t;
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2));
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    for (let k = 10; k >= 0; k--) {
      const u = R * 0.03 + (R * 0.97 * k) / 10;
      const v = R * 0.05 * Math.sin((Math.PI * k) / 10) * isaret;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.golgeler.push(g);
    out.ic.push(a);
  }
  return out;
}
/** Düzensiz, yatay uzanan bulut biçimi (tabanı düzce, üstü yumuşak dalgalı; pul pul değil). */
function bulutBicimi(cx, cy, rx, ry, tohum) {
  const nz = gurultu(tohum);
  const pts = [];
  const n = 120;
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const c = Math.cos(t);
    const s = Math.sin(t);
    let r = 1 + 0.22 * (nz.n(c * 1.6 + 5, s * 1.6 + 5) - 0.5) * 2 + 0.08 * (nz.n(c * 4 + 9, s * 4 + 2) - 0.5) * 2;
    let x = cx + c * rx * r;
    let y = cy + s * ry * r * (s < 0 ? 1.05 : 0.55);
    if (s > 0) y = Math.min(y, cy + ry * 0.38 + (nz.n(c * 3, 7) - 0.5) * ry * 0.15);
    pts.push([x, y]);
  }
  return pts;
}
/** Sahnedeki bütün biçimler (titreme genliği amp). */
function sahneSekilleri(amp) {
  amp = amp == null ? 0.6 : amp;
  const G = {};
  const fr = 0.05;
  G.minareParca = {};
  const minareListe = [];
  for (const p of S.minareParcalari()) {
    if (p.tip === 'poligon') G.minareParca[p.ad] = sekilPoli(p.noktalar, amp, fr);
    else if (p.tip === 'korkuluk' || p.tip === 'bant') G.minareParca[p.ad] = sekilPoli(dikd(p.x1, p.y1, p.x2, p.y2), amp, fr);
    else if (p.tip === 'topuz') G.minareParca[p.ad] = sekilYol(p.yol, amp * 0.6, fr);
    else if (p.tip === 'alem') G.minareAlemP = p.alem;
    if (G.minareParca[p.ad]) minareListe.push(G.minareParca[p.ad]);
  }
  G.minare = birlesik(minareListe);
  const alemSekilleri = (a, k) => ({
    yaka: sekilPoli(elips(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 40), amp * 0.3 * k, 0.1, 0.8),
    cubuk: sekilPoli(dikd(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), amp * 0.2 * k, 0.1, 0.8),
    kureler: a.kureler.map((q) => sekilPoli(elips(q.cx, q.cy, q.r, q.r, 0, 36), amp * 0.25 * k, 0.12, 0.7)),
    hilal: sekilYol(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), amp * 0.15 * k, 0.12, 0.6),
  });
  G.minareAlem = alemSekilleri(G.minareAlemP, 0.6);
  G.alemP = S.alemParcalari(560, 300, 1);
  G.alem = alemSekilleri(G.alemP, 1);
  const alemListe = (A) => [A.yaka, A.cubuk, ...A.kureler, A.hilal];
  const K = S.kaide;
  G.kaide = sekilPoli(dikd(K.x1, K.y1, K.x2, K.y2), amp, fr);
  G.kornis = sekilPoli(dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), amp * 0.7, fr);
  G.kaidePencere = K.pencereler.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.5, 0.08, 1));
  G.kasnak = S.kasnak.map((q) => sekilPoli(dikd(q.x1, q.y1, q.x2, q.y2), amp, fr));
  G.kasnakPencereP = [0, 1].map((k) => S.kasnakPencereleri(k));
  G.kasnakPencere = G.kasnakPencereP.map((L) => L.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8)));
  G.minarePencere = S.minarePencereleri.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8));
  G.kubbe = sekilPoli(S.kubbeNoktalari(80), amp, fr);
  G.yapi = birlesik([G.minare, ...alemListe(G.minareAlem), G.kaide, G.kornis, ...G.kasnak, G.kubbe, ...alemListe(G.alem)]);
  // bitkiler
  const B = S.bitki;
  G.yapraklar = B.yapraklar.map((y) => Object.assign({ y }, yaprakBicimi(y, 1.4)));
  G.cicekler = B.cicekler.map((c) => Object.assign({ c }, cicekBicimi(c)));
  G.cicekSekil = sekil(G.cicekler.flatMap((c) => c.taclar));
  G.tomurcuklar = B.tomurcuklar.map((t, i) => ({ t, i, pts: ornekle(S.tomurcukYolu(t), 1)[0].pts }));
  G.tomurcukSekil = sekil(G.tomurcuklar.map((t) => t.pts));
  G.saplar = B.saplar;
  return G;
}

/**
 * Kümülüs bulutu: birkaç farklı boyda tümseğin yumuşak birleşimi (pul pul değil), tabanı düzce.
 * Döner: {pts: dış çizgi, ust(x): üst kenar yüksekliği, taban, x0, x1, golge(oran, tohum): alt kısmın çokgeni}
 */
function kumulus(x0, x1, taban, h, tohum) {
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const k = 3 + Math.floor(r() * 2);
  const tum = [{ c: x0 + w * (0.36 + 0.26 * r()), s: w * (0.26 + 0.06 * r()), h }];
  for (let i = 1; i < k; i++) tum.push({ c: x0 + w * (0.14 + 0.72 * r()), s: w * (0.13 + 0.14 * r()), h: h * (0.42 + 0.4 * r()) });
  const tau = h * 0.14;
  const N = 90;
  const ust = [];
  const alt = [];
  const yuk = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = x0 + w * t;
    let s = 0;
    for (const b of tum) {
      const d = (x - b.c) / b.s;
      const v = d * d < 1 ? b.h * Math.pow(1 - d * d, 0.85) : 0;
      s += Math.exp(v / tau);
    }
    let ht = tau * Math.log(Math.max(1, s - (tum.length - 1)));
    ht *= Math.pow(Math.sin(Math.PI * t), 0.35);
    ht += h * 0.05 * (nz.n(t * 7, 1) - 0.5) * 2 * Math.sin(Math.PI * t);
    ht = Math.max(ht, h * 0.1 * Math.pow(Math.sin(Math.PI * t), 0.5));
    yuk.push(ht);
    ust.push([x, taban - ht]);
    alt.push([x, taban + h * 0.07 * Math.pow(Math.sin(Math.PI * t), 0.6) + h * 0.03 * (nz.n(t * 5, 9) - 0.5)]);
  }
  const pts = ust.concat(alt.slice().reverse());
  function golge(oran, ek) {
    const g = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const kes = taban - yuk[i] * oran + h * 0.09 * (nz.n(t * 4 + ek, 3 + ek) - 0.5) * 2;
      g.push([ust[i][0], Math.max(ust[i][1], Math.min(alt[i][1] - 0.5, kes))]);
    }
    return g.concat(alt.slice().reverse());
  }
  return { pts, golge, taban, x0, x1, h, yuk, ust, alt };
}

/**
 * Yatay bulut kümesi (stratokümülüs): uzun, alçak; üstü düzensiz dalgalı, uçları ince kuyruklu, tabanı düz.
 * Döner kumulus ile aynı biçimde nesne.
 */
function bulutBandi(x0, x1, taban, h, tohum) {
  const nz = gurultu(tohum);
  const r = S.rng(tohum);
  const w = x1 - x0;
  const N = 110;
  const ust = [];
  const alt = [];
  const yuk = [];
  const tum = [];
  const nt = 3 + Math.floor(r() * 3);
  for (let i = 0; i < nt; i++) tum.push({ c: 0.18 + (0.64 * (i + 0.2 + r() * 0.6)) / nt, s: 0.09 + r() * 0.09, a: 0.45 + r() * 0.55 });
  tum[Math.floor(r() * nt)].a = 1;
  let enb = 0;
  const ham = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    let v = 0;
    for (const b of tum) v = Math.max(v, b.a * Math.exp(-Math.pow((t - b.c) / b.s, 2)));
    let v2 = 0;
    for (const b of tum) v2 += b.a * Math.exp(-Math.pow((t - b.c) / b.s, 2));
    ham.push(0.65 * v + 0.35 * Math.min(1.2, v2));
    enb = Math.max(enb, ham[i]);
  }
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = x0 + w * t;
    const kuyruk = Math.pow(Math.sin(Math.PI * t), 0.3);
    let ht = h * kuyruk * (0.26 + 0.74 * (ham[i] / enb)) + h * 0.04 * (nz.n(t * 9, 1.3) - 0.5) * 2 * kuyruk;
    ht = Math.max(ht, h * 0.16 * kuyruk);
    yuk.push(ht);
    ust.push([x, taban - ht]);
    alt.push([x, taban + h * 0.12 * Math.pow(Math.sin(Math.PI * t), 0.5) * (0.6 + 0.8 * nz.n(t * 6 + 20, 4))]);
  }
  const pts = ust.concat(alt.slice().reverse());
  function golge(oran, ek) {
    const g = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const kes = taban - yuk[i] * oran + h * 0.12 * (nz.n(t * 6 + ek, 3 + ek) - 0.5) * 2;
      g.push([ust[i][0], Math.max(ust[i][1], Math.min(alt[i][1] - 0.5, kes))]);
    }
    return g.concat(alt.slice().reverse());
  }
  return { pts, golge, taban, x0, x1, h, yuk, ust, alt };
}

/**
 * Bulut kümesi: tabanı düz, farklı boyda birkaç tümseğin birleşimi (her tümsek elle titretilmiş yassı elips).
 * Döner: {sk: bütün bulut (birleşim), lobes, golge(oran, ek): tabandan oran·h yüksekliğe kadar alt kısım (birleşim)}
 * Gölgenin üst sınırı tümseklerin çizgisini izlemez, hafif dalgalı yatay bir çizgidir (ışık tepeleri açık bırakır).
 */
function bulutKumesi(x0, x1, taban, h, tohum, o) {
  o = o || {};
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const lob = [];
  const n = Math.max(3, Math.round(w / (o.lobBoy || 58)));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5 + (r() - 0.5) * 0.7) / n;
    const env = Math.pow(Math.sin(Math.PI * kenet(t, 0.02, 0.98)), 0.7);
    const ry = h * (0.3 + 0.7 * env * (0.55 + 0.45 * r()));
    const rx = Math.min(w * 0.3, ry * (1.05 + 0.7 * r()));
    lob.push({ cx: x0 + w * t, cy: taban - ry * (0.62 + 0.15 * r()), rx, ry });
  }
  lob.push({ cx: x0 + w * 0.5, cy: taban - h * 0.12, rx: w * 0.5, ry: h * 0.26 });
  const tabanY = (x) => taban + h * (o.tabanDalga || 0.035) * (nz.n(x / (o.tabanDalga ? 70 : 40), 3) - 0.5) * 2;
  const pz = o.puruz != null ? o.puruz : 0.07;
  const ham = lob.map((L, j) => {
    const pts = [];
    const m = 72;
    for (let k = 0; k < m; k++) {
      const a = (k / m) * Math.PI * 2;
      const q = 1 + pz * (nz.n(Math.cos(a) * 1.5 + j * 3.1, Math.sin(a) * 1.5 + j) - 0.5) * 2 + pz * 0.5 * (nz.n(Math.cos(a) * 4 + j * 1.3, Math.sin(a) * 4 + 9) - 0.5) * 2;
      pts.push([L.cx + Math.cos(a) * L.rx * q, L.cy + Math.sin(a) * L.ry * q]);
    }
    return titret(pts, true, o.amp != null ? o.amp : 0.9, 0.05, 1.5);
  });
  const kes = (dy) => ham.map((p) => p.map(([x, y]) => [x, Math.min(y, tabanY(x) + (dy || 0))]));
  const titrek = kes(0);
  /** x'teki bulut tepesinin yüksekliği (0..1, h'ye göre). */
  const tepeHam = (x) => {
    let t = 0;
    for (const L of lob) {
      const d = (x - L.cx) / L.rx;
      if (d * d < 1) t = Math.max(t, taban - (L.cy - L.ry * Math.sqrt(1 - d * d)));
    }
    return t / h;
  };
  const tepe = (x) => kenet(tepeHam(x), 0, 1.2);
  /** Alt (gölge) kısım: üst sınırı tepeyi kısmen izleyen dalgalı çizgi; uzat > 0 → tabanın altına taşar. */
  function golge(oran, ek, uzat, izle) {
    const cizgi = izle
      ? (x) => taban - h * oran * tepeHam(x) + h * 0.07 * (nz.n(x / 45 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2
      : (x) => taban - h * oran * (0.45 + 0.75 * tepe(x)) + h * 0.11 * (nz.n(x / 55 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2;
    return sekil(kes(uzat || 0).map((p) => p.map(([x, y]) => [x, Math.max(y, Math.min(cizgi(x), tabanY(x) - 0.5))])));
  }
  function ust(oran, ek) {
    const cizgi = (x) => taban - h * oran + h * 0.07 * (nz.n(x / 60 + (ek || 0) * 3.7, 17 + (ek || 0)) - 0.5) * 2;
    return sekil(titrek.map((p) => p.map(([x, y]) => [x, Math.min(y, cizgi(x))])));
  }
  const alt = (dy) => sekil([[[x0 - 60, taban + (dy || 0)], [x1 + 60, taban + (dy || 0)], [x1 + 60, taban + 260], [x0 - 60, taban + 260]]]);
  return { sk: sekil(titrek), lob, golge, ust, alt, tepe, tepeHam, taban, h, x0, x1 };
}

// bulutlar boş bırakılmaz: lavi bulutun içinde ıslakken temiz, nemli fırçayla açılır (soluk mavi kalır), altına

function genisPoli(pts, d) {
  let alan = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % pts.length];
    alan += a[0] * b[1] - b[0] * a[1];
  }
  const N = normaller(pts, true);
  const k = alan > 0 ? -1 : 1;
  return pts.map(([x, y], i) => [x + N[i][0] * d * k, y + N[i][1] * d * k]);
}

  lavi(sekilPoli(elips(c.x, c.y, R0, R0 * 0.94, c.aci, 40), 0.3, 0.12, 0.8), { v: RGB('#EBC94F', 1), rim: 0.45, rimR: 1.4, boncuk: 0.4, gran: 0.05 });
  const yarim = [];
  for (let i = 0; i <= 20; i++) {
    const t = 0.55 * Math.PI + (i / 20) * Math.PI;
    yarim.push([c.x + Math.cos(t) * R0, c.y + Math.sin(t) * R0 * 0.94]);
  }
  lavi(sekilPoli(yarim, 0.25, 0.12, 0.8), { v: RGB('#D9A93A', 0.45), rim: 0.35, rimR: 1.1, boncuk: 0.3, gran: 0.05 });
});

// ---------------------------------------------------------------- lavi kuruyunca: beyaz mürekkep (dip kalem)
const son = bitir((a, b, c, P, out) => {
  out[0] = 252 * Math.exp(-a);
  out[1] = 251 * Math.exp(-b);
  out[2] = 247 * Math.exp(-c);
}, { dis: 0.035 });
const MK = document.createElement('canvas');
MK.width = WW;
MK.height = WW;
const X = MK.getContext('2d');
X.setTransform(OL, 0, 0, OL, 0, 0);
/** Öndeki biçimin altında kalan (daha önce çizilmiş) çizgileri siler: ressam arkadaki çizgiyi öndekinin içine taşırmaz. */
function sil(sk, genis) {
  X.save();
  X.globalCompositeOperation = 'destination-out';
  X.fillStyle = '#000';
  X.fill(sk.yol, sk.kural || 'nonzero');
  if (genis) {
    X.lineWidth = genis;
    X.strokeStyle = '#000';
    X.stroke(sk.yol);
  }
  X.restore();
}
/**
 * Dip kalemle beyaz mürekkep çizgisi: kalınlık basınçla yaklaşık 0,8–3 px arasında yavaşça değişir, uçlar incelir,
 * kalemin kâğıda değdiği yerde ara sıra küçük bir mürekkep düğümü kalır; uzun çizgilerde kalem kalkar (10–34 px boşluk).
 */
const rM = S.rng(2177);
function murekkep(pts, o) {
  o = Object.assign({ w: 2, titreme: 0.3, frek: 0.014, basinc: 0.55, basSivri: 3, sonSivri: 7, civi: 2.2, adim: 0.8, kir: true }, o);
  if (!pts || pts.length < 2) return;
  const p = yenidenOrnekle(pts, o.adim);
  if (p.length < 2) return;
  const Lp = p.length * o.adim;
  if (o.kir && Lp > 70) {
    let i = 0;
    while (i < p.length - 3) {
      const parca = Math.round((40 + rM() * 110) / o.adim);
      const seg = p.slice(i, Math.min(p.length, i + parca));
      if (seg.length > 3) murekkep(seg, Object.assign({}, o, { kir: false }));
      i += parca + Math.round((10 + rM() * 24) / o.adim);
    }
    return;
  }
  const w0 = o.w * 1.25;
  const ofs = (_ofs += 17.3);
  const dis = seritPoli(p, Object.assign({}, o, { ofs, w: w0 }));
  const ic = seritPoli(p, Object.assign({}, o, { ofs, w: w0 * 0.5 }));
  X.fillStyle = `rgba(255,255,255,${o.alfa != null ? o.alfa : 0.84})`;
  X.beginPath();
  dis.forEach(([x, y], i) => (i ? X.lineTo(x, y) : X.moveTo(x, y)));
  X.closePath();
  X.fill();
  X.fillStyle = 'rgba(255,255,255,0.75)';
  X.beginPath();
  ic.forEach(([x, y], i) => (i ? X.lineTo(x, y) : X.moveTo(x, y)));
  X.closePath();
  X.fill();
  if (o.civi && rM() < 0.35) {
    X.fillStyle = 'rgba(255,255,255,0.9)';
    X.beginPath();
    X.ellipse(p[0][0], p[0][1], w0 * 0.62, w0 * 0.52, rM() * 3, 0, Math.PI * 2);
    X.fill();
  }
}
/** Açık kemer: pencerenin kemerini (üst kısmı ve bir yanın üst yarısını) tek çekişte çizer, alt kısım çizilmez. */
function kemerMurekkep(p, o, pay) {
  pay = pay || 3;
  const pts = kemerPoli(p.x, p.y, p.w + pay, p.h + pay * 0.8).map(([x, y]) => [x, y - pay * 0.4]);
  const ust = pts.filter(([x, y]) => y < p.y + p.h * (0.42 + rM() * 0.12));
  // sağdan sola, tepenin sağından başlayıp sola doğru
  ust.sort((a, b) => Math.atan2(a[1] - (p.y + p.h * 0.5), a[0] - p.x) - Math.atan2(b[1] - (p.y + p.h * 0.5), b[0] - p.x));
  if (ust.length > 3) murekkep(ust, Object.assign({ kir: false }, o));
}
const kirp = (pts, f) => pts.filter(f);

// gök: güneşin çevresine kalem iki kısa yay çizer (halka kapanmaz); bulutların yalnız ışık alan üst kenarında
// birkaç kısa beyaz parça
(function () {
  for (const [t0, uz, w] of [[-1.7, 2.3, 2.4], [1.15, 1.5, 1.8]]) {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = t0 + (i / 40) * uz;
      const rr2 = 44 + 1.2 * Math.sin(t * 2 + 1) + 0.7 * Math.sin(t * 5);
      pts.push([gunes.x + Math.cos(t) * rr2, gunes.y + Math.sin(t) * rr2 * 0.98]);
    }
    murekkep(pts, { w, basSivri: 6, sonSivri: 14, kir: false });
  }
})();
bulutlar.forEach((b, bi) => {
  // bulutun gerçek (titretilmiş) üst kenarı: 2 px'lik sütunlarda en üstteki nokta
  const kova = new Map();
  for (const poly of b.sk.polys) for (const [x, y] of poly) {
    const k = Math.round(x / 2);
    if (!kova.has(k) || kova.get(k) > y) kova.set(k, y);
  }
  const ust = [...kova.entries()].sort((p, q) => p[0] - q[0]).map(([k, y]) => [k * 2, y + 1.6]).filter(([x, y]) => y < b.taban - b.h * 0.22 && x > b.x0 + 6 && x < b.x1 - 6);
  // ışık sağ üstten: parçalar daha çok sağ yarıda
  const adet = b.h > 60 ? 3 : 2;
  for (let k = 0; k < adet; k++) {
    const m = Math.floor(ust.length * (0.35 + 0.6 * (k + rM() * 0.6) / adet));
    const L = 14 + Math.floor(rM() * 20);
    const parca = ust.slice(Math.max(0, m - L), Math.min(ust.length, m + L));
    if (parca.length > 6) murekkep(parca, { w: 1.6 + rM() * 0.7, sonSivri: 12, basSivri: 6, kir: false });
  }
});

sil(G.yapi, 1.2);
// kubbe: kaburgalar (dip kalem, gölge yanında daha ince), sağ ışık yanında dış çizginin kırık bir parçası
for (const kb of S.kaburgalar(16, 80)) {
  const pts = kb.noktalar.filter(([x, y]) => y > 303).reverse();
  const yan = Math.abs(kb.u);
  murekkep(pts, { w: 2.1 - yan * 0.7 + (kb.u > 0 ? 0.2 : -0.2), basSivri: 4, sonSivri: 34, civi: 2, titreme: 0.25 });
}
(function () {
  const k = S.kubbeNoktalari(160).filter(([x, y]) => x > 600 && y < 540);
  murekkep(k, { w: 2.2, basSivri: 6, sonSivri: 10, civi: 2.2 });
})();
murekkep([[358, 555.5], [762, 555.5]], { w: 2.0, sonSivri: 6, basSivri: 6 });
// kasnak: kat çizgileri (kırık) ve pencere kemerleri (açık)
murekkep([[352, 610], [768, 610]], { w: 1.9, basSivri: 4, sonSivri: 6 });
murekkep([[334, 691.5], [786, 691.5]], { w: 1.8, basSivri: 4, sonSivri: 6 });
G.kasnakPencereP.forEach((L) => L.forEach((p) => kemerMurekkep(p, { w: p.w > 12 ? 1.6 : 1.25, sonSivri: 4, basSivri: 2, civi: 1.5 }, 3)));
// alemler: kürelerin ve hilalin ışık yanında kısa parlak yaylar
for (const [A, k] of [[G.alemP, 1], [G.minareAlemP, 0.62]]) {
  for (const q of A.kureler) {
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const t = -1.5 + (i / 12) * 1.4;
      pts.push([q.cx + Math.cos(t) * (q.r + 0.5), q.cy + Math.sin(t) * (q.r + 0.5)]);
    }
    murekkep(pts, { w: 1.2 * k + 0.3, civi: 0, sonSivri: 2, basSivri: 1, kir: false });
  }
}
// minare: şerefe korkulukları (tırabzan ve dikmeler), zikzak, pencere kemerleri
(function () {
  for (const [y1, y2, x1, x2, adet] of [[436, 456, cx - 48, cx + 48, 11], [272, 290, cx - 40, cx + 40, 9]]) {
    murekkep([[x1 - 2, y1 + 0.5], [x2 + 2, y1 + 0.5]], { w: 1.9, kir: false });
    murekkep([[x1 - 3, y2], [x2 + 3, y2]], { w: 1.5, kir: false, alfa: 0.75 });
    for (let i = 0; i < adet; i++) {
      const x = x1 + 5 + ((x2 - x1 - 10) * (i + 0.5)) / adet;
      murekkep([[x, y1 + 3], [x + (r() - 0.5) * 0.5, y2 - 1.5]], { w: 1.5, basSivri: 1, sonSivri: 2, civi: 1.2, kir: false });
    }
  }
  murekkep([[cx - 52, 468.5], [cx - 34, 488], [cx + 34, 488], [cx + 52, 468.5]], { w: 1.6 });
  murekkep([[cx - 43, 300.5], [cx - 27, 316], [cx + 27, 316], [cx + 43, 300.5]], { w: 1.6 });
  for (const z of S.zikzakCizgileri()) murekkep(z, { w: 1.7, titreme: 0.2, frek: 0.05, basSivri: 2, sonSivri: 2, adim: 0.6, kir: false });
  for (const p of S.minarePencereleri) kemerMurekkep(p, { w: 1.5, civi: 1.4, sonSivri: 3 }, 3);
  // topuzun ışık yanında tek bir kıvrık çizgi
  murekkep(ornekle(`M${cx},146 C${cx + 12},160 ${cx + 34},182 ${cx + 22},200`, 0.8)[0].pts, { w: 1.7, sonSivri: 6, kir: false });
})();
// kaide: korniş (kırık), pencere kemerleri, seyrek taş sıraları
murekkep([[290, 692.5], [830, 692.5]], { w: 2.0 });
murekkep([[290, 704], [830, 704]], { w: 1.6, alfa: 0.75 });
S.kaide.pencereler.forEach((p) => kemerMurekkep(p, { w: 1.9, civi: 1.6, sonSivri: 4 }, 4));
for (const yy of [740, 770]) {
  let x = 308 + r() * 18;
  while (x < 805) {
    const x2 = Math.min(812, x + 60 + r() * 80);
    const pen = S.kaide.pencereler.some((p) => x2 > p.x - p.w / 2 - 8 && x < p.x + p.w / 2 + 8);
    if (!pen) murekkep([[x, yy + (r() - 0.5)], [x2, yy + (r() - 0.5)]], { w: 1.1, alfa: 0.55, basSivri: 10, sonSivri: 14, kir: false });
    x = x2 + 22 + r() * 30;
  }
}
// yapraklar: yalnız orta damar, kalemin yer yer kalktığı kırık bir çizgi
function yaprakMurekkep(Y, w, alfa) {
  const d = Y.damar;
  const n = d.length;
  const a = Math.floor(n * (0.05 + rM() * 0.1));
  const k = Math.floor(n * (0.45 + rM() * 0.2));
  const e = Math.floor(n * (0.82 + rM() * 0.12));
  murekkep(d.slice(a, k), { w: w * 1.05, basSivri: 2, sonSivri: 8, civi: 1.2, alfa, kir: false });
  if (rM() < 0.75) murekkep(d.slice(k + 2 + Math.floor(rM() * 3), e), { w: w * 0.85, basSivri: 3, sonSivri: Y.y.uzunluk * 0.2, civi: 0, alfa, kir: false });
}
arkaYapraklar.forEach((Y) => {
  sil(sekil([Y.tam]), 0.8);
  if (rM() < 0.6) yaprakMurekkep(Y, 1.1, 0.55);
});
for (const s of G.saplar) {
  sil(cizgiSekil(s, { w: 4.2, titreme: 0 }));
  const p = s.map(([x, y]) => [x + 1.2, y]);
  murekkep(p.slice(0, 18), { w: 1.0, alfa: 0.5, sonSivri: 30, basSivri: 20, kir: false });
}
G.yapraklar.forEach((Y) => {
  sil(sekil([Y.tam]), 0.8);
  yaprakMurekkep(Y, Y.y.uzunluk > 50 ? 1.6 : 1.3, 0.8);
});
// tomurcuklar: ışık yanında kısa bir çizgi
G.tomurcuklar.forEach((T) => {
  sil(sekil([T.pts]), 0.8);
  const n = T.pts.length;
  murekkep(T.pts.slice(Math.floor(n * 0.15), Math.floor(n * 0.42)), { w: 1.1, civi: 0, sonSivri: 3, basSivri: 2, kir: false });
});
// çiçekler: her taç yaprağında iki üç damar (göbekten uca); göbek çevresinde birkaç etamin çizgisi; kontur yok
G.cicekler.forEach((C) => {
  const c = C.c;
  sil(sekil(C.taclar), 1);
  const w = 1.15 + c.r * 0.012;
  C.taclar.forEach((t, i) => {
    const a = C.ic[i];
    const damar = rM() < 0.7 ? [-0.16, 0.08] : [-0.18, 0.02, 0.2];
    for (const sd of damar) {
      const a2 = a + sd;
      const r1 = c.r * (0.3 + rM() * 0.04);
      const r2 = c.r * (sd === damar[1] ? 0.82 : 0.7) * (0.92 + rM() * 0.12);
      const bk = 0.12 * (rM() - 0.5);
      murekkep([[c.x + Math.cos(a2) * r1, c.y + Math.sin(a2) * r1], [c.x + Math.cos(a2 + sd * 0.4 + bk) * (r1 + r2) * 0.5, c.y + Math.sin(a2 + sd * 0.4 + bk) * (r1 + r2) * 0.5], [c.x + Math.cos(a2 + sd * 0.6) * r2, c.y + Math.sin(a2 + sd * 0.6) * r2]], { w: w * 0.55, basSivri: 1, sonSivri: 8, civi: 1, alfa: 0.78, kir: false });
    }
  });
  const n = Math.max(4, Math.round(c.r / 8));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.5;
    murekkep([[c.x + Math.cos(a) * c.r * 0.25, c.y + Math.sin(a) * c.r * 0.25], [c.x + Math.cos(a) * c.r * 0.35, c.y + Math.sin(a) * c.r * 0.35]], { w: w * 0.55, basSivri: 1, sonSivri: 2, civi: 1.2, kir: false });
  }
});
// beyaz mürekkep lavinin üstüne tam oturmaz: bütün çizim kâğıtta bir iki piksel kaymıştır
son.x.setTransform(1, 0, 0, 1, 0, 0);
son.x.drawImage(MK, 1.4 * OL, -0.9 * OL);

ekranaAktar(son.c);
SAHNE.hazir();

</script>
