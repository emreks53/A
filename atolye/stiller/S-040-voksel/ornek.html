<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-040 Voksel — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #cfe6f0; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-040 Voksel (Voxel Render) — sahne tamamen küçük 3B küplerden kurulur; havada duran bir ada dioraması.
// Üç boyutlu voksel ızgarası (ada katmanları, kaide, iki kat kasnak, SAHNE profilinden voksellenmiş kubbe,
// minare, alemler, çiçek kümeleri, bulutlar) → dörtte üç dik izdüşümde her iç piksel için ışın yürütme (DDA)
// → yüz başına düz gölgeleme (üst en açık, ışık sağ üstten), köşe başına ortam örtmesi (yumuşak geçişli),
// titretilmiş gölge ışınlarıyla yumuşak düşen gölgeler, küp kenarlarında ince çizgi, malzeme başına sınırlı palet.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const T0 = performance.now();
  const zaman = (ad) => console.warn(ad + ' ' + Math.round(performance.now() - T0));
  const K = 2;
  const N = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(4001);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  // ------------------------------------------------------------------ voksel ızgarası
  const VX = 116, VY = 100, VZ = 96;
  const G = new Uint8Array(VX * VY * VZ);
  const id3 = (x, y, z) => (y * VZ + z) * VX + x;
  const koy = (x, y, z, m) => {
    if (x >= 0 && y >= 0 && z >= 0 && x < VX && y < VY && z < VZ) G[id3(x, y, z)] = m;
  };
  const al = (x, y, z) => (x >= 0 && y >= 0 && z >= 0 && x < VX && y < VY && z < VZ ? G[id3(x, y, z)] : 0);
  // malzemeler: [r,g,b], gölge düşürmez (bulut), ışık yayar
  const M = [null];
  const MAD = {};
  function malzeme(ad, hexs, o) {
    MAD[ad] = M.length;
    M.push(Object.assign({ c: [parseInt(hexs.slice(1, 3), 16), parseInt(hexs.slice(3, 5), 16), parseInt(hexs.slice(5, 7), 16)] }, o || {}));
    return M.length - 1;
  }
  const m = {
    cim: malzeme('cim', '#7CC35A'),
    cimK: malzeme('cimK', '#68B04E'),
    toprak: malzeme('toprak', '#9A6B43'),
    toprakK: malzeme('toprakK', '#7E5536'),
    kaya: malzeme('kaya', '#8E8A86'),
    kayaK: malzeme('kayaK', '#6F6B69'),
    tas: malzeme('tas', '#F3EBDA'),
    tasK: malzeme('tasK', '#E2D4BA'),
    karo: malzeme('karo', '#E9DDC6'),
    karoK: malzeme('karoK', '#DCCDB1'),
    pencere: malzeme('pencere', '#4A3B48'),
    yesil: malzeme('yesil', '#43B465'),
    yesilK: malzeme('yesilK', '#217A3D'),
    kasnak: malzeme('kasnak', '#2E9150'),
    kasnakA: malzeme('kasnakA', '#5CC277'),
    kPen: malzeme('kPen', '#0F2D1B'),
    altin: malzeme('altin', '#F2C445'),
    zikzak: malzeme('zikzak', '#C7A982'),
    yaprak: malzeme('yaprak', '#4E9A3F'),
    yaprakA: malzeme('yaprakA', '#63B24D'),
    sap: malzeme('sap', '#3F7F35'),
    beyaz: malzeme('beyaz', '#FFF8F2'),
    pembe: malzeme('pembe', '#F5A3BD'),
    pembeA: malzeme('pembeA', '#FBD0DC'),
    sari: malzeme('sari', '#F6C844'),
    lila: malzeme('lila', '#C8A6EE'),
    bulut: malzeme('bulut', '#FFFFFF', { bulut: true }),
  };
  const r = S.rng(4040);

  // ------------------------------------------------------------------ 1. havada duran ada
  const AX = 57, AZ = 50, RX = 57, RZ = 43, TOP = 16;
  const adaF = (x, z) => 1 - ((x + 0.5 - AX) / RX) ** 2 - ((z + 0.5 - AZ) / RZ) ** 2 + 0.12 * fbm(x / 14, z / 14, 3);
  for (let x = 0; x < VX; x++)
    for (let z = 0; z < VZ; z++) {
      const f = adaF(x, z);
      if (f <= 0) continue;
      const kal = Math.min(TOP, Math.floor(2 + 17 * Math.pow(f, 0.7) + 3 * fbm(x / 6 + 9, z / 6, 2)));
      for (let y = TOP - kal + 1; y <= TOP; y++) {
        let mm;
        const d = TOP - y;
        if (d === 0) mm = m.cim;
        else if (d === 1) mm = (x + z) % 7 === 0 ? m.cim : m.toprak;
        else if (d < 5) mm = fbm(x / 5, y / 3 + z / 5, 2) > 0.1 ? m.toprakK : m.toprak;
        else mm = fbm(x / 4 + 3, y / 3 + z / 4, 2) > 0 ? m.kaya : m.kayaK;
        koy(x, y, z, mm);
      }
    }
  // çim tonları
  for (let x = 0; x < VX; x++)
    for (let z = 0; z < VZ; z++) if (al(x, TOP, z) === m.cim && fbm(x / 5 + 20, z / 5, 2) > 0.15) koy(x, TOP, z, m.cimK);
  // taş meydan (yapının çevresi)
  const PX1 = 22, PX2 = 92, PZ1 = 12, PZ2 = 68;
  for (let x = PX1; x <= PX2; x++)
    for (let z = PZ1; z <= PZ2; z++) if (al(x, TOP, z)) koy(x, TOP, z, (Math.floor(x / 2) + Math.floor(z / 2)) % 2 ? m.karo : m.karoK);

  // ------------------------------------------------------------------ 2. kaide, korniş, kasnak, kubbe
  const CX = 58, CZ = 38; // kubbe ekseni (voksel merkezi CX+0.5)
  const KX1 = 33, KX2 = 83, KZ1 = 15, KZ2 = 61, KY1 = TOP + 1, KY2 = TOP + 11;
  for (let x = KX1; x <= KX2; x++) for (let z = KZ1; z <= KZ2; z++) for (let y = KY1; y <= KY2; y++) koy(x, y, z, y === KY1 ? m.tasK : m.tas);
  // korniş: bir voksel taşan saçak
  for (let x = KX1 - 1; x <= KX2 + 1; x++) for (let z = KZ1 - 1; z <= KZ2 + 1; z++) koy(x, KY2 + 1, z, m.tasK);
  // kaide pencereleri (ön ve sağ yüz): sivri kemerli koyu oyuklar
  function kemerPencere(yuz, merkez, gen, y0, boy) {
    for (let k = 0; k < boy; k++) {
      const y = y0 + k;
      let w = gen;
      if (k === boy - 1) w = 1;
      else if (k === boy - 2 && gen > 2) w = gen - 2;
      for (let q = -Math.floor((w - 1) / 2); q <= Math.floor(w / 2); q++) {
        if (yuz === 'on') koy(merkez + q, y, KZ2, m.pencere);
        else koy(KX2, y, merkez + q, m.pencere);
      }
    }
  }
  kemerPencere('on', 45, 4, KY1 + 2, 7);
  kemerPencere('on', CX, 4, KY1 + 2, 8);
  kemerPencere('on', 71, 4, KY1 + 2, 7);
  kemerPencere('sag', 26, 4, KY1 + 2, 7);
  kemerPencere('sag', 38, 4, KY1 + 2, 8);
  kemerPencere('sag', 50, 4, KY1 + 2, 7);
  // kasnak: iki silindir, pencereleri çevrede
  function silindir(cx, cz, R, y1, y2, mm) {
    for (let x = Math.floor(cx - R - 1); x <= cx + R + 1; x++)
      for (let z = Math.floor(cz - R - 1); z <= cz + R + 1; z++) {
        const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
        if (d <= R) for (let y = y1; y <= y2; y++) koy(x, y, z, typeof mm === 'function' ? mm(x, y, z, d) : mm);
      }
  }
  const DC = [CX + 0.5, CZ + 0.5];
  const Y_AK1 = KY2 + 2, Y_AK2 = Y_AK1 + 8, Y_UK1 = Y_AK2 + 1, Y_UK2 = Y_UK1 + 5;
  const pencereMi = (x, z, d, R, adet, y, ya, yb, gen) => {
    if (d < R - 1.3) return false;
    const a = Math.atan2(z + 0.5 - DC[1], x + 0.5 - DC[0]);
    const f = ((a / (Math.PI * 2)) * adet + 100) % 1;
    const dm = Math.abs(f - 0.5) * (Math.PI * 2 * R) / adet; // kemer merkezine çevre boyunca uzaklık
    if (y < ya || y > yb) return false;
    const ust = yb - y;
    const g = ust === 0 ? 0.5 : ust === 1 ? gen * 0.5 : gen;
    return dm < g;
  };
  silindir(DC[0], DC[1], 23.2, Y_AK1, Y_AK2, (x, y, z, d) => (pencereMi(x, z, d, 23.2, 26, y, Y_AK1 + 2, Y_AK2 - 1, 1.6) ? m.kPen : y === Y_AK2 ? m.kasnakA : m.kasnak));
  silindir(DC[0], DC[1], 21.2, Y_UK1, Y_UK2, (x, y, z, d) => (pencereMi(x, z, d, 21.2, 30, y, Y_UK1 + 1, Y_UK2 - 1, 1.0) ? m.kPen : y === Y_UK2 ? m.kasnakA : m.kasnak));
  // kubbe: SAHNE profilinden voksellenmiş yarı küre, kaburga şeritleri
  const prof = S.kubbeProfili(200);
  const Y_K1 = Y_UK2 + 1, KH = 26, KR = 20.2;
  const rAt = (t) => {
    const yy = 555 - t * 255;
    for (let k = 0; k < prof.length - 1; k++) if (yy <= prof[k].y && yy >= prof[k + 1].y) return (prof[k].r / 200) * KR;
    return 0;
  };
  for (let y = Y_K1; y <= Y_K1 + KH; y++) {
    const t = (y - Y_K1 + 0.5) / (KH + 1);
    const R = rAt(Math.min(0.999, t));
    for (let x = Math.floor(DC[0] - R - 1); x <= DC[0] + R + 1; x++)
      for (let z = Math.floor(DC[1] - R - 1); z <= DC[1] + R + 1; z++) {
        const d = Math.hypot(x + 0.5 - DC[0], z + 0.5 - DC[1]);
        if (d > R) continue;
        const a = Math.atan2(z + 0.5 - DC[1], x + 0.5 - DC[0]);
        const f = ((a / (Math.PI * 2)) * 32 + 100) % 1;
        const kab = (f < 0.16 || f > 0.9) && t < 0.9;
        koy(x, y, z, kab ? m.yesilK : m.yesil);
      }
  }
  // alem: yaka, çubuk, üç küre, hilal
  function kure(cx, cy, cz, R, mm) {
    for (let x = Math.floor(cx - R - 1); x <= cx + R + 1; x++)
      for (let y = Math.floor(cy - R - 1); y <= cy + R + 1; y++)
        for (let z = Math.floor(cz - R - 1); z <= cz + R + 1; z++) if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy, z + 0.5 - cz) <= R) koy(x, y, z, mm);
  }
  function hilal(cx, y0, cz, s) {
    // boynuzları yukarı bakan piksel hilal (x-y düzleminde, 2 voksel kalın)
    const desen = s >= 1
      ? ['X.......X', 'XX.....XX', '.XX...XX.', '.XXX.XXX.', '..XXXXX..', '...XXX...']
      : ['X...X', 'XX.XX', '.XXX.'];
    const h = desen.length;
    for (let j = 0; j < h; j++)
      for (let i = 0; i < desen[j].length; i++)
        if (desen[j][i] === 'X') {
          const x = cx + i - Math.floor(desen[j].length / 2), y = y0 + (h - 1 - j);
          koy(x, y, cz, m.altin);
          if (s >= 1) koy(x, y, cz - 1, m.altin);
        }
  }
  const AY = Y_K1 + KH + 1;
  silindir(DC[0], DC[1], 2.3, AY, AY, m.altin);
  for (let y = AY + 1; y <= AY + 11; y++) koy(CX, y, CZ, m.altin);
  kure(DC[0], AY + 3, DC[1], 1.7, m.altin);
  kure(DC[0], AY + 6.5, DC[1], 1.35, m.altin);
  kure(DC[0], AY + 9.5, DC[1], 1.05, m.altin);
  hilal(CX, AY + 11, CZ, 1);

  // ------------------------------------------------------------------ 3. minare (solda, arkada)
  const MX = 14.5, MZ = 30.5;
  const mr = (x, z) => Math.hypot(x + 0.5 - MX, z + 0.5 - MZ);
  const halka = (R1, R2, y1, y2, mm, bosluk) => {
    for (let x = Math.floor(MX - R2 - 1); x <= MX + R2 + 1; x++)
      for (let z = Math.floor(MZ - R2 - 1); z <= MZ + R2 + 1; z++) {
        const d = mr(x, z);
        if (d > R2 || d < R1) continue;
        if (bosluk && (x + z) % 2 === 0) continue;
        for (let y = y1; y <= y2; y++) koy(x, y, z, mm);
      }
  };
  const Y0 = TOP + 1;
  // alt gövde + zikzak bandı + pencere
  halka(0, 3.7, Y0, Y0 + 35, m.tas);
  for (let x = Math.floor(MX - 5); x <= MX + 5; x++)
    for (let z = Math.floor(MZ - 5); z <= MZ + 5; z++) {
      const d = mr(x, z);
      if (d > 3.7 || d < 2.7) continue;
      const a = Math.atan2(z + 0.5 - MZ, x + 0.5 - MX);
      const ai = Math.round(((a + Math.PI) / (Math.PI * 2)) * 24);
      const zig = Math.abs((ai % 4) - 2);
      for (let y = Y0 + 13; y <= Y0 + 21; y++) if ((y - Y0 - 13 + zig) % 3 === 0) koy(x, y, z, m.zikzak);
    }
  const penMinare = (ya, yb) => {
    // kameraya bakan yüzde (sağ-ön) küçük kemerli pencere
    for (let y = ya; y <= yb; y++) {
      koy(Math.floor(MX + 2.6), y, Math.floor(MZ + 2.6), m.pencere);
      if (y < yb) koy(Math.floor(MX + 1.6), y, Math.floor(MZ + 3.3), m.pencere);
    }
  };
  penMinare(Y0 + 6, Y0 + 9);
  // şerefe 1
  halka(0, 4.7, Y0 + 36, Y0 + 36, m.tasK);
  halka(0, 5.8, Y0 + 37, Y0 + 37, m.tasK);
  halka(4.9, 5.8, Y0 + 38, Y0 + 39, m.tas, true);
  // orta gövde
  halka(0, 3.0, Y0 + 38, Y0 + 53, m.tas);
  penMinare(Y0 + 43, Y0 + 47);
  // şerefe 2
  halka(0, 4.0, Y0 + 54, Y0 + 54, m.tasK);
  halka(0, 5.0, Y0 + 55, Y0 + 55, m.tasK);
  halka(4.1, 5.0, Y0 + 56, Y0 + 57, m.tas, true);
  // üst gövde, bilezik, topuz
  halka(0, 2.3, Y0 + 56, Y0 + 66, m.tas);
  for (let y = Y0 + 60; y <= Y0 + 63; y++) koy(Math.floor(MX + 1.7), y, Math.floor(MZ + 1.7), m.pencere);
  halka(0, 3.0, Y0 + 67, Y0 + 67, m.tasK);
  for (let k = 0; k <= 7; k++) {
    const t = k / 7;
    const R = 3.3 * Math.pow(Math.sin(Math.PI * (0.18 + 0.82 * t)), 0.9) * (1 - t * 0.35) + 0.4;
    halka(0, Math.max(0.6, R), Y0 + 68 + k, Y0 + 68 + k, m.tas);
  }
  // minare alemi
  for (let y = Y0 + 76; y <= Y0 + 83; y++) koy(Math.floor(MX), y, Math.floor(MZ), m.altin);
  kure(MX, Y0 + 78, MZ, 1.1, m.altin);
  kure(MX, Y0 + 80.5, MZ, 0.9, m.altin);
  hilal(Math.floor(MX), Y0 + 83, Math.floor(MZ), 0.62);

  // ------------------------------------------------------------------ 4. çiçekler ve çalılar (küçük voksel kümeleri)
  const dolu = (x, z) => al(x, TOP + 1, z) !== 0;
  function cicek(x, z, boy, renk, orta) {
    const y0 = TOP + 1;
    for (let y = y0; y < y0 + boy; y++) koy(x, y, z, m.sap);
    const yt = y0 + boy;
    koy(x, yt, z, orta);
    koy(x + 1, yt, z, renk);
    koy(x - 1, yt, z, renk);
    koy(x, yt, z + 1, renk);
    koy(x, yt, z - 1, renk);
    koy(x, yt + 1, z, renk === m.beyaz ? m.pembeA : renk);
    if (boy > 2) {
      const yy = y0 + Math.floor(boy / 2);
      koy(x + (r() < 0.5 ? 1 : -1), yy, z, m.yaprakA);
    }
  }
  function cali(cx, cz, R, y0) {
    for (let x = Math.floor(cx - R - 1); x <= cx + R + 1; x++)
      for (let y = y0; y <= y0 + R * 1.6; y++)
        for (let z = Math.floor(cz - R - 1); z <= cz + R + 1; z++) {
          const d = Math.hypot((x + 0.5 - cx) / R, (y + 0.5 - y0) / (R * 1.1), (z + 0.5 - cz) / R);
          if (d <= 1 + 0.25 * fbm(x / 2, y / 2 + z / 2, 2)) koy(x, y, z, fbm(x / 3, y / 3 + z, 2) > 0.1 ? m.yaprakA : m.yaprak);
        }
  }
  const RENK = [m.beyaz, m.pembe, m.beyaz, m.lila, m.pembeA];
  // ön tarh: çalılar ve aralarında çiçekler
  const caliler = [[16, 70, 3.2], [30, 80, 3.6], [47, 74, 2.8], [62, 82, 3.4], [78, 73, 3], [93, 80, 3.5], [104, 66, 3], [12, 55, 2.8], [102, 50, 2.6], [88, 64, 2.4], [26, 64, 2.4]];
  for (const [x, z, R] of caliler) if (adaF(x, z) > 0.05) cali(x + 0.5, z + 0.5, R, TOP + 1);
  for (let i = 0; i < 150; i++) {
    const x = 6 + Math.floor(r() * 104), z = 62 + Math.floor(r() * 32);
    if (adaF(x, z) < 0.08) continue;
    if (dolu(x, z) || dolu(x + 1, z) || dolu(x - 1, z) || dolu(x, z + 1) || dolu(x, z - 1)) continue;
    cicek(x, z, 1 + Math.floor(r() * 3), RENK[i % RENK.length], m.sari);
  }
  // yanlarda uzun dallar
  function dal(x, z, boy, yon) {
    for (let y = TOP + 1; y <= TOP + boy; y++) {
      const ox = Math.round(Math.sin((y - TOP) / 6) * 0.8 * yon);
      koy(x + ox, y, z, m.sap);
      if ((y - TOP) % 3 === 0) koy(x + ox + ((y - TOP) % 6 === 0 ? 1 : -1), y, z, m.yaprakA);
      if ((y - TOP) % 5 === 2 && y > TOP + 6) {
        const c = y % 2 ? m.pembe : m.beyaz;
        const cx = x + ox + ((y - TOP) % 10 === 2 ? 2 : -2);
        koy(cx, y, z, m.sari);
        koy(cx + 1, y, z, c);
        koy(cx - 1, y, z, c);
        koy(cx, y + 1, z, c);
        koy(cx, y - 1, z, c);
      }
    }
    koy(x, TOP + boy + 1, z, m.pembe);
  }
  dal(10, 62, 26, -1);
  dal(20, 74, 20, 1);
  dal(106, 58, 26, 1);
  dal(96, 72, 20, -1);

  // ------------------------------------------------------------------ 5. bulutlar (gölge düşürmez)
  function bulut(cx, cy, cz, L) {
    for (let x = Math.floor(cx - L); x <= cx + L; x++)
      for (let y = Math.floor(cy - 3); y <= cy + 4; y++)
        for (let z = Math.floor(cz - 3); z <= cz + 3; z++) {
          const u = (x - cx) / L, v = (y - cy) / 3.5, w = (z - cz) / 3;
          const ust = Math.max(0, 1 - u * u) * 1.2;
          if (u * u + w * w < 1 && v > -0.6 && v < ust + 0.2 * fbm(x / 3, z / 3, 2)) koy(x, y, z, m.bulut);
        }
  }
  bulut(14, 86, 4, 9);
  bulut(52, 96, 2, 7);
  bulut(100, 84, 8, 8);

  zaman('izgara');
  // ------------------------------------------------------------------ 6. kamera: dik izdüşüm, dörtte üç bakış
  const TH = (36 * Math.PI) / 180, PH = (30 * Math.PI) / 180;
  const CAM = [Math.sin(TH) * Math.cos(PH), Math.sin(PH), Math.cos(TH) * Math.cos(PH)]; // sahneden kameraya
  const D = [-CAM[0], -CAM[1], -CAM[2]];
  const RV = [Math.cos(TH), 0, -Math.sin(TH)];
  const UV = [-Math.sin(TH) * Math.sin(PH), Math.cos(PH), -Math.cos(TH) * Math.sin(PH)];
  // dolu vokselleri ekrana yansıtıp kadrajı bul (bulutlar hariç)
  let sx0 = 1e9, sx1 = -1e9, sy0 = 1e9, sy1 = -1e9;
  for (let y = 0; y < VY; y++)
    for (let z = 0; z < VZ; z++)
      for (let x = 0; x < VX; x++) {
        const v = G[id3(x, y, z)];
        if (!v || M[v].bulut) continue;
        for (const [ox, oy, oz] of [[0, 0, 0], [1, 1, 1], [1, 0, 1], [0, 1, 0]]) {
          const px = (x + ox) * RV[0] + (y + oy) * RV[1] + (z + oz) * RV[2];
          const py = -((x + ox) * UV[0] + (y + oy) * UV[1] + (z + oz) * UV[2]);
          if (px < sx0) sx0 = px;
          if (px > sx1) sx1 = px;
          if (py < sy0) sy0 = py;
          if (py > sy1) sy1 = py;
        }
      }
  const OL = Math.min(940 / (sx1 - sx0), 930 / (sy1 - sy0));
  const OX = 512 - ((sx0 + sx1) / 2) * OL + 8;
  const OY = 532 - ((sy0 + sy1) / 2) * OL;

  // ------------------------------------------------------------------ 7. ışın izleme (her iç piksel için)
  const LI = nrm([0.52, 0.8, 0.3]); // ışık: sağ üstten
  const W2 = N, H2 = N;
  const img = ana.createImageData(W2, H2);
  const P = img.data;
  const AOL = [0.5, 0.66, 0.83, 1.0];
  const occ = (x, y, z) => {
    const v = al(x, y, z);
    return v !== 0 && !M[v].bulut ? 1 : 0;
  };
  const occA = (x, y, z) => (al(x, y, z) !== 0 ? 1 : 0);
  function kutu(o, d) {
    let t0 = -1e9, t1 = 1e9;
    const lim = [VX, VY, VZ];
    for (let a = 0; a < 3; a++) {
      if (Math.abs(d[a]) < 1e-9) {
        if (o[a] < 0 || o[a] > lim[a]) return null;
        continue;
      }
      let ta = (0 - o[a]) / d[a], tb = (lim[a] - o[a]) / d[a];
      if (ta > tb) { const t = ta; ta = tb; tb = t; }
      if (ta > t0) t0 = ta;
      if (tb < t1) t1 = tb;
    }
    return t1 > Math.max(t0, 0) ? [Math.max(t0, 0), t1] : null;
  }
  // DDA: ilk dolu vokseli bulur; [x,y,z,eksen,adım,t] ya da null
  function yuru(ox, oy, oz, dx, dy, dz, t0, t1, golgeMi) {
    let px = ox + dx * (t0 + 1e-4), py = oy + dy * (t0 + 1e-4), pz = oz + dz * (t0 + 1e-4);
    let ix = Math.min(VX - 1, Math.max(0, Math.floor(px))), iy = Math.min(VY - 1, Math.max(0, Math.floor(py))), iz = Math.min(VZ - 1, Math.max(0, Math.floor(pz)));
    const stx = dx > 0 ? 1 : -1, sty = dy > 0 ? 1 : -1, stz = dz > 0 ? 1 : -1;
    const tdx = Math.abs(1 / dx), tdy = Math.abs(1 / dy), tdz = Math.abs(1 / dz);
    let tmx = t0 + (dx > 0 ? ix + 1 - px : px - ix) * tdx;
    let tmy = t0 + (dy > 0 ? iy + 1 - py : py - iy) * tdy;
    let tmz = t0 + (dz > 0 ? iz + 1 - pz : pz - iz) * tdz;
    let eks = -1, t = t0;
    for (let k = 0; k < 400; k++) {
      const v = G[(iy * VZ + iz) * VX + ix];
      if (v && !(golgeMi && M[v].bulut)) return [ix, iy, iz, eks, t, v];
      if (tmx < tmy && tmx < tmz) {
        ix += stx; t = tmx; tmx += tdx; eks = 0;
        if (ix < 0 || ix >= VX) return null;
      } else if (tmy < tmz) {
        iy += sty; t = tmy; tmy += tdy; eks = 1;
        if (iy < 0 || iy >= VY) return null;
      } else {
        iz += stz; t = tmz; tmz += tdz; eks = 2;
        if (iz < 0 || iz >= VZ) return null;
      }
      if (t > t1) return null;
    }
    return null;
  }
  const hash = (x, y, z) => {
    let h = Math.imul(x * 73856093 ^ y * 19349663 ^ z * 83492791, 2654435761);
    h ^= h >>> 13;
    return ((h >>> 0) % 1000) / 1000;
  };
  // gök: yumuşak degrade ve güneş ışıltısı
  const gokRenk = (sx, sy) => {
    const t = sy / 1024;
    const a = [150, 200, 236], b = [214, 234, 240], c = [250, 236, 214];
    let col;
    if (t < 0.6) {
      const k = t / 0.6;
      col = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
    } else {
      const k = (t - 0.6) / 0.4;
      col = [b[0] + (c[0] - b[0]) * k, b[1] + (c[1] - b[1]) * k, b[2] + (c[2] - b[2]) * k];
    }
    const dd = Math.hypot(sx - 880, sy - 140);
    const gl = Math.exp(-dd / 140) * 0.75 + Math.exp(-dd / 400) * 0.25;
    return [col[0] + (255 - col[0]) * gl, col[1] + (248 - col[1]) * gl, col[2] + (226 - col[2]) * gl];
  };
  const ust = 300; // ışın başlangıcı kameraya doğru uzaklık
  const jr = S.rng(4141);
  for (let py = 0; py < H2; py++) {
    const sy = (py + 0.5) / K;
    for (let px = 0; px < W2; px++) {
      const sx = (px + 0.5) / K;
      const a = (sx - OX) / OL, b = -(sy - OY) / OL;
      const ox = a * RV[0] + b * UV[0] + CAM[0] * ust;
      const oy = a * RV[1] + b * UV[1] + CAM[1] * ust;
      const oz = a * RV[2] + b * UV[2] + CAM[2] * ust;
      const j = (py * W2 + px) * 4;
      const kt = kutu([ox, oy, oz], D);
      let hit = null;
      if (kt) hit = yuru(ox, oy, oz, D[0], D[1], D[2], kt[0], kt[1], false);
      if (!hit) {
        const c = gokRenk(sx, sy);
        P[j] = c[0];
        P[j + 1] = c[1];
        P[j + 2] = c[2];
        P[j + 3] = 255;
        continue;
      }
      let [ix, iy, iz, eks, t, v] = hit;
      if (eks < 0) {
        // kutuya bir dolu voksel üstünden girildi: giriş yüzünü bul
        const hx = ox + D[0] * t, hy = oy + D[1] * t, hz = oz + D[2] * t;
        const e = [Math.abs(hx - Math.round(hx)), Math.abs(hy - Math.round(hy)), Math.abs(hz - Math.round(hz))];
        eks = e[0] < e[1] && e[0] < e[2] ? 0 : e[1] < e[2] ? 1 : 2;
      }
      const n = [0, 0, 0];
      n[eks] = D[eks] > 0 ? -1 : 1;
      const hx = ox + D[0] * t, hy = oy + D[1] * t, hz = oz + D[2] * t;
      // yüz üzerindeki kesirli konum (u, v eksenleri)
      const ua = eks === 0 ? 1 : 0, va = eks === 2 ? 1 : 2;
      const hp = [hx, hy, hz];
      const cell = [ix, iy, iz];
      let fu = hp[ua] - cell[ua], fv = hp[va] - cell[va];
      fu = Math.min(1, Math.max(0, fu));
      fv = Math.min(1, Math.max(0, fv));
      // köşe ortam örtmesi (yüzün önündeki boş hücrenin komşuları)
      const fx = ix + n[0], fy = iy + n[1], fz = iz + n[2];
      const ofs = (axis, s) => {
        const o = [0, 0, 0];
        o[axis] = s;
        return o;
      };
      const aoK = (su, sv) => {
        const A1 = ofs(ua, su), B1 = ofs(va, sv);
        const s1 = occA(fx + A1[0], fy + A1[1], fz + A1[2]);
        const s2 = occA(fx + B1[0], fy + B1[1], fz + B1[2]);
        const c = occA(fx + A1[0] + B1[0], fy + A1[1] + B1[1], fz + A1[2] + B1[2]);
        return AOL[s1 && s2 ? 0 : 3 - (s1 + s2 + c)];
      };
      const a00 = aoK(-1, -1), a10 = aoK(1, -1), a01 = aoK(-1, 1), a11 = aoK(1, 1);
      const ao = (a00 * (1 - fu) + a10 * fu) * (1 - fv) + (a01 * (1 - fu) + a11 * fu) * fv;
      // gölge ışınları (ışık yönü iki tabakalı titretilir → yumuşak yarı gölge)
      const sox = hx + n[0] * 0.002, soy = hy + n[1] * 0.002, soz = hz + n[2] * 0.002;
      let golge = 1;
      const ndl = n[0] * LI[0] + n[1] * LI[1] + n[2] * LI[2];
      if (ndl > 0 && !M[v].bulut) {
        let isik = 0;
        for (let q = 0; q < 2; q++) {
          const jx = (jr() - 0.5 + (q ? 0.25 : -0.25)) * 0.07, jy = (jr() - 0.5) * 0.07, jz = (jr() - 0.5 + (q ? -0.25 : 0.25)) * 0.07;
          const ld = nrm([LI[0] + jx, LI[1] + jy, LI[2] + jz]);
          const kt2 = kutu([sox, soy, soz], ld);
          if (!(kt2 && yuru(sox, soy, soz, ld[0], ld[1], ld[2], 0, kt2[1], true))) isik++;
        }
        golge = isik / 2;
      }
      const mat = M[v];
      const jit = 1 + (hash(ix, iy, iz) - 0.5) * 0.07;
      // kenar çizgisi: her küpün kenarında ince koyulaşma (küpler okunur)
      const kd = Math.min(fu, 1 - fu, fv, 1 - fv);
      const kenar = kd < 0.055 ? 0.9 : kd < 0.09 ? 0.96 : 1;
      const gok = 0.44 * ao, gun = 0.66 * Math.max(0, ndl) * golge * (0.55 + 0.45 * ao);
            for (let c = 0; c < 3; c++) {
        let val = mat.c[c] * (gok * [0.94, 0.98, 1.08][c] + gun * [1.05, 1.0, 0.9][c]) * jit * kenar;
        if (mat.bulut) val = mat.c[c] * (0.78 + 0.22 * Math.max(0, ndl)) * (0.85 + 0.15 * ao) * kenar;
        P[j + c] = Math.min(255, val);
      }
      P[j + 3] = 255;
    }
  }
  ana.putImageData(img, 0, 0);
  zaman('isin');
  // güneş: pikselli disk (kare basamaklı) ve ışıltı
  {
    const g = ana;
    g.save();
    g.setTransform(K, 0, 0, K, 0, 0);
    const s = 6;
    for (let yy = -8; yy <= 8; yy++)
      for (let xx = -8; xx <= 8; xx++) {
        const d = Math.hypot(xx + 0.5, yy + 0.5);
        if (d > 7.6) continue;
        g.fillStyle = d > 6.4 ? '#FCE7A0' : (xx + yy) % 3 === 0 ? '#FFE98A' : '#FFF1AE';
        g.fillRect(880 + xx * s, 140 + yy * s, s, s);
      }
    g.restore();
  }

  zaman('son');
  S.hazir();
}, 0);
