<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-091 Pastel Kalem — açık krem resim kâğıdında pastel kalemlerle ince, ayrıntılı çizim.
// Önce kâğıt kalemle yedirilmiş yumuşak taban tonları, üstünde tebeşirsi, tozlu ince taramalar; bazı
// yerler yeniden yedirilip üstüne keskin vuruşlar atılmış. Kubbede kaburga boyunca meridyen taraması,
// ince renkli konturlar ve keskin ayrıntılar, en sonda beyaz pastel kalemle ışıklar.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
(function () {
  'use strict';
  // ================================================================ ortak yardımcılar (çizim motoru)
  const W = 1024, N = W * W, W2 = 2048, N2 = W2 * W2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(+a, 0, 1).toFixed(3)})`;

  // değer gürültüsü (256 periyotlu, yumuşak) ve kesirli toplamı
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 31.7; y = ny + 11.3; a *= 0.5; }
    return s / t;
  }
  // ayrılabilir kutu bulanıklığı (Float32); 'kez' kez uygulanınca Gauss'a yaklaşır
  function bulanik(src, w, h, r, kez) {
    let a = src;
    for (let k = 0; k < (kez || 1); k++) {
      const tmp = new Float32Array(w * h), out = new Float32Array(w * h), q = 1 / (2 * r + 1);
      for (let y = 0; y < h; y++) {
        const o = y * w; let acc = 0;
        for (let x = -r; x <= r; x++) acc += a[o + clamp(x, 0, w - 1)];
        for (let x = 0; x < w; x++) { tmp[o + x] = acc * q; acc += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
        for (let y = 0; y < h; y++) { out[y * w + x] = acc * q; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
      }
      a = out;
    }
    return a;
  }

  // ---------------------------------------------------------------- bölge haritası (1024)
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const bolgeNo = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];
  const bolge = (x, y) => ADLAR[bolgeNo(x, y)];

  // ---------------------------------------------------------------- ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  // kesirli y için kubbe yarıçapı
  const kubbeRy = (y) => { y = clamp(y, 300, 555); const y0 = Math.floor(y), y1 = Math.min(555, y0 + 1); return lerp(kubbeR[y0], kubbeR[y1], y - y0); };
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(1, kubbeRy(y)), -1, 1);
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), u = kubbeU(x, y), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / Math.hypot(u, dr, c));
  }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  // kubbenin minareye düşen gölgesi (alt gövdede çapraz sınır)
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const ISIK = new Float32Array(N);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, b = ADLAR[BOL[i]];
    let l = 0.6;
    if (b === 'kubbe') l = kubbeIsik(x, y);
    else if (b === 'kasnak') { const ust = y < 610; l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.94 : 1); if (!ust && y < 616) l = Math.min(1, l + 0.2); }
    else if (b === 'kaide') { l = 0.45 + 0.5 * clamp((x - 300) / 520, 0, 1); if (y < 704) l = 0.96; else if (y < 714) l *= 0.6; }
    else if (b === 'minare') { l = silindirIsik(x, 300, minareYari(y)); if ((y > 468 && y < 488) || (y > 300 && y < 316)) l *= 0.6; if (y > 198 && y < 206) l *= 0.8; l *= 1 - 0.5 * minareGolge(x, y); }
    else if (b === 'altin') { const cx = x > 430 ? 560 : 300; l = clamp(0.5 + (x - cx) / 12, 0, 1); }
    else if (b === 'pencere') l = 0;
    ISIK[i] = l;
  }
  const isik = (x, y) => ISIK[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];

  // ---------------------------------------------------------------- yollar, örnekleme
  const SVGNS = 'http://www.w3.org/2000/svg';
  const gizliSvg = document.createElementNS(SVGNS, 'svg');
  gizliSvg.setAttribute('width', '0'); gizliSvg.setAttribute('height', '0');
  gizliSvg.style.position = 'absolute'; gizliSvg.style.left = '-10px'; gizliSvg.style.top = '-10px';
  const gizliYol = document.createElementNS(SVGNS, 'path');
  gizliSvg.appendChild(gizliYol); document.body.appendChild(gizliSvg);
  // SVG yolunu alt yollarına ayırıp her birini 'adim' aralıkla noktalara çevirir
  function ornekle(d, adim) {
    adim = adim || 3;
    return d.split(/(?=M)/).filter((s) => s.trim()).map((p) => {
      gizliYol.setAttribute('d', p);
      const L = gizliYol.getTotalLength(), n = Math.max(2, Math.ceil(L / adim)), out = [];
      for (let i = 0; i <= n; i++) { const q = gizliYol.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  const Y = SAHNE.yollar();
  const P2 = (d) => new Path2D(d);
  function birlesik(dizi) { const p = new Path2D(); for (const d of dizi) p.addPath(new Path2D(d)); return p; }
  const B = SAHNE.bitki;
  const YOL = {
    kubbe: P2(Y.kubbe), kasnakUst: P2(Y.kasnakUst), kasnakAlt: P2(Y.kasnakAlt), kasnak: birlesik([Y.kasnakUst, Y.kasnakAlt]),
    kaideGovde: P2(Y.kaide), kornis: P2(Y.kornis), kaide: birlesik([Y.kaide, Y.kornis]),
    minare: birlesik(Y.minare), minareAlem: birlesik(Y.minareAlem), alem: birlesik(Y.alem),
    kasnakPencere: birlesik(Y.kasnakPencereleri), kaidePencere: birlesik(Y.kaidePencereleri), minarePencere: birlesik(Y.minarePencereleri),
  };
  YOL.pencere = birlesik([...Y.kasnakPencereleri, ...Y.kaidePencereleri, ...Y.minarePencereleri]);
  const yaprakYollari = B.yapraklar.map((y) => P2(SAHNE.yaprakYolu(y)));
  const tomurcukYollari = B.tomurcuklar.map((t) => P2(SAHNE.tomurcukYolu(t)));
  const cicekYollari = B.cicekler.map((c) => { const p = new Path2D(); for (const e of SAHNE.tacYapraklari(c)) p.addPath(P2(SAHNE.elipsYolu(e))); return p; });
  const sapNoktalari = B.saplar;
  const kemerNok = (p) => ornekle(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1.5)[0];
  // dikdörtgen nokta dizisi (kapalı)
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]];

  // ---------------------------------------------------------------- 2048 katman tuvalleri ve maskeler
  function katmanTuvali() {
    const c = SAHNE.yeniTuval(W2, W2), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    x.lineCap = 'round'; x.lineJoin = 'round';
    return { c, x, temizle() { x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none'; x.clearRect(0, 0, W2, W2); x.setTransform(2, 0, 0, 2, 0, 0); } };
  }
  // ciz(x): siyah dolgularla maske tuvali (2048)
  function maske(ciz) { const k = katmanTuvali(); k.x.fillStyle = '#000'; k.x.strokeStyle = '#000'; ciz(k.x); return k.c; }
  function maskeCikar(m, onundekiler) {
    const k = katmanTuvali(); k.x.setTransform(1, 0, 0, 1, 0, 0); k.x.drawImage(m, 0, 0);
    k.x.globalCompositeOperation = 'destination-out'; for (const o of onundekiler) k.x.drawImage(o, 0, 0);
    return k.c;
  }
  function maskeBirlestir(liste) { const k = katmanTuvali(); k.x.setTransform(1, 0, 0, 1, 0, 0); for (const o of liste) k.x.drawImage(o, 0, 0); return k.c; }
  // maskeyi genişlet/yumuşat (bulanık kopyası)
  function maskeYumusat(m, px) { const k = katmanTuvali(); k.x.setTransform(1, 0, 0, 1, 0, 0); k.x.filter = `blur(${px}px)`; k.x.drawImage(m, 0, 0); k.x.filter = 'none'; return k.c; }
  // elle sınırı belirlenmiş gibi pürüzlü kenarlı maske: bulanıklaştır, gürültüyle eşikle; kayma (+) dışarı taşırır
  function maskePuruz(m, yaricap, genlik, olcek, kayma, tohum) {
    const k = katmanTuvali(); k.x.setTransform(1, 0, 0, 1, 0, 0); k.x.filter = `blur(${yaricap}px)`; k.x.drawImage(m, 0, 0); k.x.filter = 'none';
    const img = k.x.getImageData(0, 0, W2, W2), d = img.data, n = gurultu(tohum || 77);
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const j = (y * W2 + x) * 4 + 3, a = d[j];
      if (a === 0 || a === 255) continue;
      const t = a / 255 + (fbm(n, x / olcek, y / olcek, 2) - 0.5) * genlik + (kayma || 0);
      d[j] = Math.round(255 * sstep(0.42, 0.58, t));
    }
    k.x.putImageData(img, 0, 0);
    return k.c;
  }
  function kirp(K, m) { K.x.save(); K.x.setTransform(1, 0, 0, 1, 0, 0); K.x.globalCompositeOperation = 'destination-in'; K.x.drawImage(m, 0, 0); K.x.restore(); }
  function sil(K, m) { K.x.save(); K.x.setTransform(1, 0, 0, 1, 0, 0); K.x.globalCompositeOperation = 'destination-out'; K.x.drawImage(m, 0, 0); K.x.restore(); }
  // maske tuvalinin alfa kanalını 1024 Float32 olarak okur
  function maskeOku(m) {
    const c = SAHNE.yeniTuval(W, W), x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(m, 0, 0, W, W);
    const v = x.getImageData(0, 0, W, W).data, out = new Float32Array(N);
    for (let i = 0; i < N; i++) out[i] = v[i * 4 + 3] / 255;
    return out;
  }

  // sahnenin öğe maskeleri (önde kalanlar arkadakilerden çıkarılmış: "görünen" maskeler)
  const MK = {};
  MK.cicek = maske((x) => { for (const p of cicekYollari) x.fill(p); });
  MK.tomurcuk = maske((x) => { for (const p of tomurcukYollari) x.fill(p); });
  MK.yaprak = maske((x) => { for (const p of yaprakYollari) x.fill(p); });
  MK.sap = maske((x) => { x.lineWidth = 4.5; x.lineCap = 'round'; for (const s of sapNoktalari) x.stroke(P2(SAHNE.yol(s))); });
  MK.onBitki = maskeBirlestir([MK.cicek, MK.tomurcuk]);
  MK.yaprakUstu = maskeBirlestir([MK.yaprak, MK.onBitki]);
  MK.bitki = maskeBirlestir([MK.sap, MK.yaprakUstu]);
  MK.alem = maske((x) => x.fill(YOL.alem));
  MK.minareAlem = maske((x) => x.fill(YOL.minareAlem));
  MK.kubbeH = maske((x) => x.fill(YOL.kubbe));
  MK.kasnakH = maske((x) => x.fill(YOL.kasnak));
  MK.kaideH = maske((x) => x.fill(YOL.kaide));
  MK.minareH = maske((x) => x.fill(YOL.minare));
  MK.yapiOn = maskeBirlestir([MK.kubbeH, MK.kasnakH, MK.kaideH, MK.alem]);
  MK.yapi = maskeBirlestir([MK.yapiOn, MK.minareH, MK.minareAlem]);
  MK.kubbe = maskeCikar(MK.kubbeH, [MK.alem, MK.bitki]);
  MK.kasnak = maskeCikar(MK.kasnakH, [MK.bitki]);
  MK.kaide = maskeCikar(MK.kaideH, [MK.bitki]);
  MK.minare = maskeCikar(MK.minareH, [MK.yapiOn, MK.bitki, MK.minareAlem]);
  MK.zeminH = maske((x) => x.fillRect(0, 800, W, W - 800));
  MK.zemin = maskeCikar(MK.zeminH, [MK.bitki, MK.yapi]);
  MK.gok = maskeCikar(maske((x) => x.fillRect(0, 0, W, 800)), [MK.yapi, MK.bitki]);
  MK.yaprakG = maskeCikar(MK.yaprak, [MK.onBitki]);
  MK.sapG = maskeCikar(MK.sap, [MK.yaprakUstu]);
  MK.tomurcukG = maskeCikar(MK.tomurcuk, [MK.cicek]);

  // ---------------------------------------------------------------- vuruşlar
  // pts: [[x,y],...]; w: genişlik; a: basınç (0..1); c: [r,g,b]; bas/son: uçlarda incelme payı (0 → küt uç)
  function strok(cx, pts, w, a, c, bas, son, uc) {
    const n = pts.length;
    if (n < 2 || a <= 0.003) return;
    bas = bas === undefined ? 0.16 : bas; son = son === undefined ? 0.3 : son;
    uc = uc === undefined ? 0.18 : uc; // en incelmiş uçtaki genişlik oranı
    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const T = cum[n - 1] || 1;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const s = cum[i] / T;
      const k = Math.pow(Math.min(1, bas > 0 ? s / bas : 1, son > 0 ? (1 - s) / son : 1), 0.6);
      const hw = (w / 2) * (uc + (1 - uc) * k);
      L.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]);
      R.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
    }
    const p = new Path2D();
    p.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
    p.closePath();
    const ax = pts[0][0], ay = pts[0][1], bx = pts[n - 1][0], by = pts[n - 1][1];
    if ((bas > 0 || son > 0) && Math.hypot(bx - ax, by - ay) > Math.max(4, T * 0.6)) {
      const g = cx.createLinearGradient(ax, ay, bx, by);
      g.addColorStop(0, rgba(c, a * (bas > 0 ? 0.3 : 1)));
      g.addColorStop(Math.min(0.45, bas * 0.9 + 0.02), rgba(c, a));
      g.addColorStop(Math.max(0.55, 1 - son * 0.8), rgba(c, a));
      g.addColorStop(1, rgba(c, a * (son > 0 ? 0.08 : 1)));
      cx.fillStyle = g;
    } else cx.fillStyle = rgba(c, a);
    cx.fill(p);
  }
  // nokta dizisini sıklaştır
  function sik(pts, adim) {
    if (pts.length < 2) return pts;
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i - 1], p1 = pts[i], L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), k = Math.max(1, Math.ceil(L / adim));
      for (let j = 1; j <= k; j++) out.push([lerp(p0[0], p1[0], j / k), lerp(p0[1], p1[1], j / k)]);
    }
    return out;
  }
  // bir yolu el çizgisi gibi örtüşen parçalarla çiz (hafif titreme, basınç değişimi)
  function elCizgisi(cx, pts, w, a, c, r, o) {
    o = o || {};
    pts = sik(pts, 2.5);
    const titre = o.titre === undefined ? 0.35 : o.titre, parca = o.parca || 70;
    const n = pts.length;
    if (n < 2) return;
    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const T = cum[n - 1];
    let s0 = 0;
    while (s0 < T - 0.5) {
      const L = parca * (0.6 + 0.8 * r());
      const s1 = Math.min(T, s0 + L);
      const seg = [];
      const ph = r() * 10, amp = titre * (0.5 + r());
      for (let i = 0; i < n; i++) {
        if (cum[i] < s0 - 1.5 || cum[i] > s1 + 1.5) continue;
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
        let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const off = amp * Math.sin(ph + cum[i] * 0.08) + (o.kayma || 0);
        seg.push([pts[i][0] - ty * off, pts[i][1] + tx * off]);
      }
      if (seg.length >= 2) strok(cx, seg, w * (0.85 + 0.3 * r()), a * (0.8 + 0.25 * r()), c, o.bas === undefined ? 0.1 : o.bas, o.son === undefined ? 0.18 : o.son, o.uc);
      s0 = s1 - (o.ortus === undefined ? 5 : o.ortus) * r();
      if (T - s0 < 3) break;
    }

      strok(x, meridyen(u, y0, y1, 5), KAL * 1.1, 0.35 + 0.45 * sstep(0.76, 0.98, l), r() < 0.55 ? C.beyaz : C.yesilSari, 0.25, 0.35);
    }
  }, Object.assign({ kirp: mKubbe, bx: [356, 296, 764, 557] }, TARAMA, { opq: 0.82 }));
  // kaburgalar: koyu çizgi ve ışık tarafında açık eş çizgi; dış kontur
  katman((x) => {
    for (const kb of SAHNE.kaburgalar(16, 80)) {
      const pts = kb.noktalar.filter((p) => p[1] > 305);
      const l = clamp((kb.u + 1) / 2, 0, 1);
      elCizgisi(x, pts, 1.3, 0.55 + 0.3 * (1 - l), mixc(C.yesilKoyu, C.zumrut, l * 0.8), r, { parca: 60, titre: 0.25 });
    }
    cizgiYol(x, Y.kubbe, 1.35, 0.8, C.yesilKoyu, r, { parca: 60, titre: 0.25 });
  }, Object.assign({ kirp: maskeYumusat(MK.kubbeH, 1.2), sil: [MK.alem], bx: [356, 296, 764, 557] }, KONTUR));
  katman((x) => {
    for (const kb of SAHNE.kaburgalar(16, 80)) {
      if (kb.u < -0.2) continue;
      const pts = kb.noktalar.filter((p) => p[1] > 308).map(([px, py]) => [px + 1.9, py]);
      elCizgisi(x, pts, 1.2, 0.35 + 0.35 * clamp(kb.u, 0, 1), C.yesilSari, r, { parca: 50, titre: 0.25 });
    }
  }, Object.assign({ kirp: MK.kubbe, bx: [356, 296, 764, 557] }, KONTUR, { opq: 0.75 }));

  // ================================================================ ALEMLER (altın)
  katman((x) => {
    const g = x.createLinearGradient(0, 0, 0, 0);
    for (const [cx, w] of [[560, 22], [300, 15]]) {
      tara(x, { bx: [cx - w, 70, cx + w, 312], ic: (px, py) => bolge(px, py) === 'altin', aci: -1.0, aralik: 1.8, boy: 8, kal: 1.5, obek: 6, sik: 0.5, alfa: 0.85,
        renk: (px) => (px > cx + 1 ? (r() < 0.6 ? C.altinAcik : C.altin) : px < cx - 3 ? C.altinKoyu : C.altin) }, r);
    }
  }, Object.assign({ kirp: maskeYumusat(mAlem, 0.6), bx: [270, 70, 590, 312] }, TARAMA, { opq: 0.65 }));
  katman((x) => {
    for (const d of [...Y.alem, ...Y.minareAlem]) cizgiYol(x, d, 0.9, 0.7, C.altinKoyu, r, { parca: 30, titre: 0.1 });
    for (const [cx, k] of [[560, 1], [300, 0.62]]) {
      const a = SAHNE.alemParcalari(cx, cx === 560 ? 300 : 146, k);
      for (const q of a.kureler) { x.fillStyle = rgba(C.beyaz, 0.9); x.beginPath(); x.arc(q.cx + q.r * 0.35, q.cy - q.r * 0.35, q.r * 0.28, 0, 7); x.fill(); }
    }
  }, Object.assign({ bx: [270, 70, 590, 312] }, KONTUR, { opq: 0.8 }));

  // ================================================================ ÇİÇEKLER VE YAPRAKLAR
  katman((x) => { for (const s of sapNoktalari) elCizgisi(x, s, 2.5, 0.82, C.sap, r, { parca: 50, titre: 0.4 }); },
    Object.assign({ sil: [MK.yaprakUstu], bx: [0, 500, W, W] }, KONTUR, { opq: 0.55 }));
  // yapraklar: iki tonlu taban (gölge yarısı koyu), damardan dışa tarama, yedirme, kontur
  katman((x) => {
    for (const yp of B.yapraklar) {
      const c = yp.uzunluk > 56 ? C.yaprakOrta : C.yaprak;
      x.fillStyle = rgba(c, 0.6); x.fill(P2(SAHNE.yaprakYolu(yp)));
      // gölge yarısı
      x.save(); x.clip(P2(SAHNE.yaprakYolu(yp)));
      x.translate(yp.x, yp.y); x.rotate(yp.aci);
      x.fillStyle = rgba(C.yaprakKoyu, 0.45); x.fillRect(0, 0, yp.uzunluk, yp.uzunluk);
      x.restore();
    }
  }, Object.assign({ kirp: mYaprak, bx: [0, 500, W, W] }, TABAN));
  katman((x) => {
    for (const yp of B.yapraklar) {
      const ca = Math.cos(yp.aci), sa = Math.sin(yp.aci), L = yp.uzunluk, Wd = L * yp.genislik;
      const n = Math.round(L / 3.4);
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n, half = Wd * 0.55 * Math.sin(Math.PI * Math.min(1, t * 1.05));
        for (const side of [-1, 1]) {
          if (side < 0 && r() < 0.5) continue;
          const u0 = t * L, p0 = [yp.x + u0 * ca, yp.y + u0 * sa];
          const u1 = u0 + half * 0.7, v1 = side * half;
          const p1 = [yp.x + u1 * ca - v1 * sa, yp.y + u1 * sa + v1 * ca];
          strok(x, [p0, [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2], p1], KAL * 0.75, 0.55, side > 0 ? C.yaprakKoyu : r() < 0.5 ? C.yesilSari : C.yaprakOrta, 0.1, 0.4);
        }
      }
    }
  }, Object.assign({ kirp: mYaprak, bx: [0, 500, W, W] }, TARAMA));
  harmanla([0, 500, W, W], 3, (x, y) => mOku(ICYAPRAK, x, y) * 0.5);
  katman((x) => {
    for (const yp of B.yapraklar) {
      const [a, b] = SAHNE.yaprakDamari(yp);
      strok(x, [a, [lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5)], b], 1.2, 0.65, C.yesilSari, 0.05, 0.4);
      for (const p of ornekle(SAHNE.yaprakYolu(yp), 2)) elCizgisi(x, p, 1.15, 0.72, C.yaprakKoyu, r, { parca: 40, titre: 0.25 });
    }
  }, Object.assign({ kirp: maskeYumusat(MK.yaprakG, 1.2), bx: [0, 500, W, W] }, KONTUR));
  // tomurcuklar
  katman((x) => { for (const t of B.tomurcuklar) { x.fillStyle = rgba(C.tacPembe, 0.75); x.fill(P2(SAHNE.tomurcukYolu(t))); } },
    Object.assign({ kirp: mTomurcuk, bx: [0, 500, W, W] }, TABAN));
  katman((x) => {
    for (const t of B.tomurcuklar) {
      for (let i = 0; i < 6; i++) { const a = t.aci + (r() - 0.5) * 0.7, p0 = [t.x - Math.cos(a) * t.r * 0.6, t.y - Math.sin(a) * t.r * 0.6], p1 = [t.x + Math.cos(a) * t.r * 1.2, t.y + Math.sin(a) * t.r * 1.2]; strok(x, [p0, p1], 1.2, 0.5, C.pembe, 0.1, 0.4); }
      for (const p of ornekle(SAHNE.tomurcukYolu(t), 1.5)) elCizgisi(x, p, 1.1, 0.72, hex('#B0607E'), r, { parca: 30, titre: 0.2 });
    }
  }, Object.assign({ kirp: maskeYumusat(MK.tomurcukG, 1.2), bx: [0, 500, W, W] }, KONTUR));
  // çiçekler: kâğıdın beyazı, göbeğe doğru leylak-mavi gölge, pembe dip, ince mor kontur
  katman((x) => {
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const g = x.createRadialGradient(c.x - c.r * 0.08, c.y + c.r * 0.06, c.r * 0.12, c.x, c.y, c.r * 1.05);
        g.addColorStop(0, rgba(C.tacPembe, 0.8)); g.addColorStop(0.42, rgba(C.tacGolge, 0.35)); g.addColorStop(0.8, rgba(C.tacGolge, 0.06)); g.addColorStop(1, rgba(C.tacGolge, 0));
        x.fillStyle = g; x.fill(P2(SAHNE.elipsYolu(e)));
      }
    }
  }, Object.assign({ kirp: mCicek, bx: [0, 500, W, W] }, TABAN));
  katman((x) => {
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const n = Math.round(c.r * 0.5);
        for (let i = 0; i < n; i++) {
          const a = e.aci + (r() - 0.5) * 1.2, r0 = c.r * (0.22 + r() * 0.1), r1 = c.r * (0.45 + r() * 0.45);
          const p0 = [c.x + Math.cos(a) * r0, c.y + Math.sin(a) * r0], p1 = [c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1];
          const golge = Math.cos(a - 2.4) > 0 ? 1 : 0.35;
          strok(x, [p0, [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2], p1], 1.2, 0.45 * golge, r() < 0.5 ? C.tacGolge : C.leylak, 0.05, 0.6);
        }
      }
    }
  }, Object.assign({ kirp: mCicek, bx: [0, 500, W, W] }, TARAMA));
  katman((x) => {
    for (const c of B.cicekler) {
      for (const p of tacKenarlari(c)) elCizgisi(x, p, 1.15, 0.6, C.mor, r, { parca: 36, titre: 0.2 });
      x.fillStyle = rgba(C.gobek, 0.9); x.beginPath(); x.arc(c.x, c.y, c.r * 0.19, 0, 7); x.fill();
      for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + r() * 0.3; x.fillStyle = rgba(C.gobekKoyu, 0.85); x.beginPath(); x.arc(c.x + Math.cos(a) * c.r * 0.26, c.y + Math.sin(a) * c.r * 0.26, Math.max(1.1, c.r * 0.035), 0, 7); x.fill(); }
    }
  }, Object.assign({ kirp: maskeYumusat(MK.cicek, 1.2), bx: [0, 500, W, W] }, KONTUR));

  bitir({ kabartma: 0.05 });
  SAHNE.hazir();
})();
