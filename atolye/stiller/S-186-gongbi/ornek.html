<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-186 Gongbi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ---------------------------------------------------------------- el yardımcıları (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, yol örnekleme, elle çekilmiş (titrek, basınçlı) çizgi,
// katmanlar ve piksel geçişleri. Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const OLCEK = 2; // çalışma tuvali 2048 piksel; koordinatlar 1024

function yeniKatman() {
  const c = S.yeniTuval(1024 * OLCEK, 1024 * OLCEK);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(OLCEK, 0, 0, OLCEK, 0, 0);
  return { c, x };
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// SVG yolunu örnekleme (getPointAtLength)
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

/** Kırık çizgiyi normali boyunca d kadar kaydırır. */
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit (kontur) olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1 kalınlık oynaması),
 *  sivri / basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta hafif basınç düğümü, px)
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}

/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini (ör. kaburga) elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}

/** Bir tuvalin bütün pikselleri üzerinde geçiş: fn(veri, i, x, y) — x,y piksel koordinatı (tuvalin kendi ölçeğinde). */
function pikselGecis(ctx, fn) {
  const c = ctx.canvas;
  const im = ctx.getImageData(0, 0, c.width, c.height);
  const d = im.data;
  const W = c.width;
  const H = c.height;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) fn(d, (y * W + x) * 4, x, y);
  }
  ctx.putImageData(im, 0, 0);
}

/** Önceden hesaplanmış gürültü dokusu (hızlı örnekleme): dk(x,y) piksel → [0,1]. */
function gurultuDokusu(boyut, olcek, oktav, tohum) {
  const nz = gurultu(tohum);
  const a = new Float32Array(boyut * boyut);
  for (let y = 0; y < boyut; y++) for (let x = 0; x < boyut; x++) a[y * boyut + x] = nz.fbm(x * olcek, y * olcek, oktav);
  return (x, y) => a[((y | 0) % boyut) * boyut + ((x | 0) % boyut)];
}

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

/** Kubbe profilinden y → yarıçap (hızlı tablo). */
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.getContext('2d', { willReadFrequently: true });
  const ctx = S.tuval(cv, 1);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma.c, 0, 0, 1024, 1024);
  return ctx;
}

/**
 * Altın (ya da gümüş) varak dokusu: kare varak yaprakları sıra sıra, her yaprağın tonu biraz farklı,
 * bindirme yerlerinde ince koyu/açık dikiş, perdah izi ve ışık parlaması. Tam boy katman döner.
 *  o: boy (varak kenarı, 1024 biriminde), tohum, koyu/orta/acik/parlak (hex), cesit (ton farkı), isik(x,y) → ek parlaklık
 */
function varakDokusu(o) {
  const L = yeniKatman();
  const W2 = 1024 * OLCEK;
  const im = L.x.createImageData(W2, W2);
  const d = im.data;
  const tohum = o.tohum || 1;
  const r = S.rng(tohum);
  const boy = o.boy * OLCEK;
  const satirOfs = [];
  const kay = o.kaydirma != null ? o.kaydirma : 1;
  for (let j = 0; j < 400; j++) satirOfs.push(r() * boy * kay);
  const nz = gurultu(tohum + 5);
  const K = hex(o.koyu || '#A9832F');
  const M = hex(o.orta || '#D4AF55');
  const A = hex(o.acik || '#EED48A');
  const P = hex(o.parlak || '#FBF0C4');
  const cesit = o.cesit != null ? o.cesit : 0.18;
  const dikis = 1.3 * OLCEK;
  const ramp = (v) => (v < 0.45 ? karistir(K, M, v / 0.45) : v < 0.78 ? karistir(M, A, (v - 0.45) / 0.33) : karistir(A, P, Math.min(1, (v - 0.78) / 0.22)));
  const x0 = o.x0 != null ? o.x0 * OLCEK : 0;
  const x1 = o.x1 != null ? o.x1 * OLCEK : W2;
  const y0 = o.y0 != null ? o.y0 * OLCEK : 0;
  const y1 = o.y1 != null ? o.y1 * OLCEK : W2;
  for (let y = y0; y < y1; y++) {
    const j = Math.floor(y / boy);
    const fy = y - j * boy;
    const ox = satirOfs[j % 400];
    for (let x = x0; x < x1; x++) {
      const xi = x + ox;
      const i = Math.floor(xi / boy);
      const fx = xi - i * boy;
      let v = 0.55 + (karma(i + 500, j + 500, tohum) - 0.5) * cesit * 2;
      if (o.isik) v += o.isik(x / OLCEK, y / OLCEK);
      v += 0.09 * (nz.n(x * 0.0035, y * 0.0035) - 0.5) + 0.06 * (nz.n(x * 0.0018 + 30, y * 0.028) - 0.5) + 0.03 * (nz.n(x * 0.02, y * 0.2) - 0.5);
      v += 0.05 * (fx / boy - 0.5) - 0.03 * (fy / boy - 0.5);
      const dk = o.dikis != null ? o.dikis : 1;
      if (fx < dikis || fy < dikis) v -= 0.13 * dk;
      else if (fx < dikis * 1.9 || fy < dikis * 1.9) v += 0.07 * dk;
      v += 0.02 * (karma(x, y, tohum + 9) - 0.5);
      const col = ramp(kenet(v, 0, 1));
      const k = (y * W2 + x) * 4;
      d[k] = col[0];
      d[k + 1] = col[1];
      d[k + 2] = col[2];
      d[k + 3] = 255;
    }
  }
  L.x.putImageData(im, 0, 0);
  return L;
}

/**
 * Bir yolun içini piksel başına boyar (ressamın kat kat sürdüğü lavileri hesaplamak için).
 * fn(x, y, o): x,y 1024 biriminde; o = [r, g, b, a] (0..255) dizisine yazar. a başlangıçta 255'tir.
 */
function pikselBoya(ctx, yol, x0, y0, x1, y1, fn) {
  x0 = Math.floor(x0);
  y0 = Math.floor(y0);
  x1 = Math.ceil(x1);
  y1 = Math.ceil(y1);
  const W = (x1 - x0) * OLCEK;
  const H = (y1 - y0) * OLCEK;
  if (W <= 0 || H <= 0) return;
  const cv = S.yeniTuval(W, H);
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const im = cx.createImageData(W, H);
  const d = im.data;
  const o = [0, 0, 0, 255];
  for (let py = 0; py < H; py++) {
    const y = y0 + (py + 0.5) / OLCEK;
    for (let px = 0; px < W; px++) {
      const x = x0 + (px + 0.5) / OLCEK;
      o[3] = 255;
      fn(x, y, o);
      const i = (py * W + px) * 4;
      d[i] = o[0];
      d[i + 1] = o[1];
      d[i + 2] = o[2];
      d[i + 3] = o[3];
    }
  }
  cx.putImageData(im, 0, 0);
  ctx.save();
  if (yol) ctx.clip(yol);
  ctx.drawImage(cv, x0, y0, x1 - x0, y1 - y0);
  ctx.restore();
}

/**
 * Elle sürülmüş kat kat lavi: düzgün bir hedef koyuluğu (T ∈ 0..1) N ayrı fırça katına böler. Her katın sınırı
 * fırça boyunca hafifçe oynar ve su fırçasıyla yumuşatılmıştır; katın içinde fırça kıllarının bıraktığı boyuna
 * izler, sınırında ince bir ıslak kenar kalır. Dönen fonksiyon: (T, a, b, ek) → 0..1
 *  a: fırça yönüne dik koordinat (px), b: fırça boyunca koordinat (px), ek: bölgeye özgü kaydırma.
 */
function katmanlayici(o) {
  const nz = gurultu(o.tohum || 77);
  const N = o.N || 6;
  const yum = o.yum != null ? o.yum : 0.05;
  const dalga = o.dalga != null ? o.dalga : 0.05;
  const df = o.df != null ? o.df : 0.02;
  const dfa = o.dfa != null ? o.dfa : 0.004;
  const lif = o.lif != null ? o.lif : 0.15;
  const lfa = o.lfa != null ? o.lfa : 0.5;
  const lfb = o.lfb != null ? o.lfb : 0.012;
  const kenar = o.kenar || 0;
  return function (T, a, b, ek) {
    ek = ek || 0;
    let s = 0;
    for (let j = 1; j <= N; j++) {
      const e = j / (N + 1);
      const w = dalga * ((nz.n(b * df + j * 31.7 + ek, a * dfa + j * 7.3) - 0.5) * 2 + 0.35 * (nz.n(b * df * 3.3 + j * 5.1 + ek, 9.7 + j) - 0.5));
      const q = T + w - e;
      if (q < -yum) continue;
      let k = yumusak(-yum, yum, q);
      if (lif) k *= 1 + lif * (nz.n(a * lfa + j * 13.1 + ek * 0.7, b * lfb + j * 3.7) - 0.5) * 2;
      if (kenar) k += kenar * Math.max(0, 1 - Math.abs(q - yum * 0.5) / (yum * 0.9));
      s += k;
    }
    return s / N;
  };
}

/** Çok duraklı renk rampası: [[t, [r,g,b]], …] → v ∈ 0..1 için renk. */
function rampa(duraklar) {
  return function (v) {
    if (v <= duraklar[0][0]) return duraklar[0][1];
    for (let i = 1; i < duraklar.length; i++) {
      if (v <= duraklar[i][0]) {
        const [t0, c0] = duraklar[i - 1];
        const [t1, c1] = duraklar[i];
        return karistir(c0, c1, (v - t0) / (t1 - t0 || 1));
      }
    }
    return duraklar[duraklar.length - 1][1];
  };
}

/** Kubbe hücresi: (x, y) için u, boylam açısı, dilim no (0..15), dilim içi konum f (0 sol kaburga → 1 sağ), enlem. */
function kubbeHucre(x, y) {
  const R = kubbeR(y);
  const lat = kenet((555 - y) / 255, 0, 1);
  const u = R > 0.5 ? kenet((x - 560) / R, -1, 1) : 0;
  const th = Math.asin(u);
  const k = (th + Math.PI / 2) / (Math.PI / 16);
  const gi = Math.max(0, Math.min(15, Math.floor(k)));
  const f = k - gi;
  const uc = Math.sin(-Math.PI / 2 + ((gi + 0.5) * Math.PI) / 16);
  return { R, lat, u, th, gi, f, uc };
}

/** Elips kümesinin birleşim sınırı: her elipsin başka bir elipsin içinde kalmayan yay parçaları ([[x,y],…] dizileri). */
function elipsBirlesimi(elipsler, adim) {
  adim = adim || 1.5;
  const icinde = (x, y, haric) => elipsler.some((e, j) => j !== haric && Math.pow((x - e.x) / e.rx, 2) + Math.pow((y - e.y) / e.ry, 2) < 0.985);
  const parcalar = [];
  elipsler.forEach((e, i) => {
    const n = Math.max(24, Math.ceil((2 * Math.PI * Math.max(e.rx, e.ry)) / adim));
    let cur = [];
    const run = [];
    for (let k = 0; k <= n; k++) {
      const a = (k / n) * Math.PI * 2;
      const x = e.x + Math.cos(a) * e.rx;
      const y = e.y + Math.sin(a) * e.ry;
      if (!icinde(x, y, i)) cur.push([x, y]);
      else if (cur.length) {
        run.push(cur);
        cur = [];
      }
    }
    if (cur.length) run.push(cur);
    // başta ve sonda kesilen parçayı birleştir
    if (run.length > 1 && run[0][0] && run[run.length - 1].length && Math.hypot(run[0][0][0] - run[run.length - 1][run[run.length - 1].length - 1][0], run[0][0][1] - run[run.length - 1][run[run.length - 1].length - 1][1]) < adim * 2) {
      const son = run.pop();
      run[0] = son.concat(run[0]);
    }
    for (const r of run) if (r.length > 2) parcalar.push(r);
  });
  return parcalar;
}

// ---- 7) kubbe: her dilim ayrı boyanır; renk kaburga çizgisinden içe doğru kat kat sürülür (fenran)
{
  const fen = katmanlayici({ N: 6, yum: 0.075, dalga: 0.075, df: 0.028, dfa: 0.01, lif: 0.26, lfa: 0.42, lfb: 0.016, kenar: 0.16, tohum: 1866 });
  const acik = katmanlayici({ N: 3, yum: 0.09, dalga: 0.1, df: 0.03, lif: 0.2, lfa: 0.4, lfb: 0.02, kenar: 0.1, tohum: 1867 });
  const dip = katmanlayici({ N: 4, yum: 0.15, dalga: 0.14, df: 0.03, dfa: 0.01, lif: 0.1, lfa: 0.05, lfb: 0.3, kenar: 0.06, tohum: 1868 });
  const rg = S.rng(18661);
  const dilimOfs = Array.from({ length: 16 }, () => (rg() - 0.5) * 0.06);
  const nzk = gurultu(18662);
  const renk = rampa([[0, hex('#CFEACB')], [0.22, hex('#9CD0A2')], [0.45, hex('#5FAA7A')], [0.7, hex('#33795A')], [1, hex('#1D513B')]]);
  pikselBoya(c, new Path2D(Y.kubbe), 356, 296, 764, 558, (x, y, o) => {
    const h = kubbeHucre(x, y);
    const a = h.th * 200;
    // dilimin kendi zemin katı: ışıktan uzak dilimler bir-iki kat fazla alır (dilim dilim ayrı ton)
    let D = 0.1 + 0.34 * Math.pow((1 - h.uc) / 2, 1.25) + dilimOfs[h.gi] + 0.07 * (0.5 - h.lat);
    // fenran: sol kaburgadan içe doğru altı kat, her biri su fırçasıyla açılmış
    D += (0.26 + 0.1 * (1 - h.uc) / 2) * fen(kenet(1 - h.f / 0.78, 0, 1), a, y, h.gi * 37.1);
    // ışık yanında sağ kaburgaya yaslanan açık malakit katı
    D -= (0.08 + 0.1 * (h.uc + 1) / 2) * acik(kenet((h.f - 0.5) / 0.5, 0, 1), a, y, h.gi * 11.3 + 300);
    // kasnağa yakın dipte koyulaşan katlar
    D += 0.15 * dip(kenet(1 - h.lat / 0.26, 0, 1), y, a, h.gi * 5.3);
    // fırçanın kaburga çizgisinde durduğu yerde biriken boya
    D += 0.06 * Math.exp(-h.f / 0.035) + 0.035 * Math.exp(-(1 - h.f) / 0.03);
    // pigmentin ipekte hafif dalgalanması
    D += 0.035 * (nzk.n(x * 0.05, y * 0.05) - 0.5);
    const col = renk(kenet(D, 0, 1));
    o[0] = col[0];
    o[1] = col[1];
    o[2] = col[2];
    o[3] = 247;
  });
  for (const kb of S.kaburgalar(16, 80)) cizgiNokta(c, kb.noktalar.slice(0, -1), { w: 0.8, renk: 'rgba(28,58,38,0.85)', titreme: 0.15, frek: 0.01, basinc: 0.2, sonSivri: 30 });
  cizgiYol(c, Y.kubbe, Object.assign({}, MIMARI, { w: 1.15 }));
}

function yaprakCiz(y, alt) {
  const d = S.yaprakYolu(y);
  const p = new Path2D(d);
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const P = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  c.save();
  c.clip(p);
  c.fillStyle = alt ? '#C3D7B6' : '#B4CB86';
  c.fill(p);
  const [bx, by] = P(0, 0);
  const [tx, ty] = P(L, 0);
  let g = c.createLinearGradient(bx, by, tx, ty);
  if (alt) {
    g.addColorStop(0, 'rgba(96,140,124,0.55)');
    g.addColorStop(1, 'rgba(110,150,130,0.12)');
  } else {
    g.addColorStop(0, 'rgba(44,92,62,0.85)');
    g.addColorStop(0.55, 'rgba(56,106,70,0.55)');
    g.addColorStop(1, 'rgba(72,120,78,0.22)');
  }
  c.fillStyle = g;
  c.fill(p);
  const [ax, ay] = P(L * 0.5, -W * 0.5);
  const [cx2, cy2] = P(L * 0.5, W * 0.5);
  g = c.createLinearGradient(ax, ay, cx2, cy2);
  const ton = alt ? '70,110,100' : '28,66,46';
  g.addColorStop(0, `rgba(${ton},0.04)`);
  g.addColorStop(0.5, `rgba(${ton},0.36)`);

  const acik = alt ? 'rgba(232,242,226,0.8)' : 'rgba(222,236,196,0.78)';
  serit(c, yenidenOrnekle([P(L * 0.03, 0), P(L * 0.5, W * 0.02), P(L * 0.93, 0)], 1.2), { w: 1.7, renk: acik, titreme: 0.15, sonSivri: L * 0.4, basSivri: 4 });
  const nV = Math.max(3, Math.round(L / 13));
  for (let i = 1; i <= nV; i++) {
    const u0 = (L * (i - 0.3)) / (nV + 0.6);
    for (const sgn of [-1, 1]) {
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.1) pts.push(P(u0 + t * L * 0.2, sgn * t * W * 0.42 * (1 - 0.25 * t)));
      serit(c, yenidenOrnekle(pts, 1), { w: 1.05, renk: acik, titreme: 0.1, sonSivri: 8, basSivri: 2 });

  cizgiYol(c, d, { w: 0.75 + L * 0.002, renk: alt ? '#3C5446' : '#2F432C', titreme: 0.3, frek: 0.05, basinc: 0.35, civi: 2.5 });
}

function tacYolu(cx, cy, r, a) {
  const ca = Math.cos(a);
  const sa = Math.sin(a);
  const P = (u, v) => `${(cx + (u * ca - v * sa) * r).toFixed(2)},${(cy + (u * sa + v * ca) * r).toFixed(2)}`;
  return (
    `M${P(0.1, -0.08)} C${P(0.26, -0.4)} ${P(0.52, -0.56)} ${P(0.78, -0.44)} ` +
    `C${P(0.97, -0.34)} ${P(1.05, -0.15)} ${P(0.98, -0.045)} C${P(0.95, -0.01)} ${P(0.93, 0.01)} ${P(0.98, 0.045)} ` +
    `C${P(1.05, 0.15)} ${P(0.97, 0.34)} ${P(0.78, 0.44)} C${P(0.52, 0.56)} ${P(0.26, 0.4)} ${P(0.1, 0.08)} Z`
  );
}
function cicekCiz(f) {

    const p = new Path2D(d);
    c.save();
    c.clip(p);
    c.fillStyle = 'rgba(255,253,249,0.97)';
    c.fill(p);

    g.addColorStop(0, 'rgba(226,146,166,0.7)');
    g.addColorStop(0.25, 'rgba(232,162,180,0.42)');
    g.addColorStop(0.6, 'rgba(236,180,194,0.12)');
    g.addColorStop(1, 'rgba(236,180,194,0)');
    c.fillStyle = g;
    c.fill(p);
    // ışıktan uzak yarıda soğuk gölge lavisi
    const golge = 0.5 - 0.5 * Math.cos(a - (-0.8));
    const ex = f.x + Math.cos(a) * rp;
    const ey = f.y + Math.sin(a) * rp;
    g = c.createRadialGradient(ex, ey, rp * 0.05, ex, ey, rp * 0.75);
    g.addColorStop(0, `rgba(150,150,170,${0.05 + 0.2 * golge})`);
    g.addColorStop(1, 'rgba(150,150,170,0)');
    c.fillStyle = g;
    c.fill(p);
    // ince damarlar
    for (let k = -3; k <= 3; k++) {
      const v0 = k * 0.03;
      const v1 = k * 0.11;
      const pts = [];
      for (let t = 0; t <= 1.0001; t += 0.1) {
        const u = 0.16 + t * 0.66;
        const v = v0 + (v1 - v0) * Math.sin((t * Math.PI) / 2);
        pts.push([f.x + (u * Math.cos(a) - v * Math.sin(a)) * rp, f.y + (u * Math.sin(a) + v * Math.cos(a)) * rp]);
      }
      serit(c, yenidenOrnekle(pts, 0.9), { w: 0.42 + f.r * 0.002, renk: 'rgba(196,128,146,0.38)', titreme: 0.1, sonSivri: rp * 0.3, basSivri: 2 });
    }
    c.restore();
    cizgiYol(c, d, { w: lw, renk: '#77595B', titreme: 0.22, frek: 0.06, basinc: 0.3, civi: 2 });
  }
  // ercikler ve başçık
  const n = Math.round(14 + f.r * 0.25);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rr() * 0.2;
    const L = R * (0.24 + rr() * 0.12);
    const ex = f.x + Math.cos(a) * L;
    const ey = f.y + Math.sin(a) * L;
    serit(c, yenidenOrnekle([[f.x + Math.cos(a) * R * 0.06, f.y + Math.sin(a) * R * 0.06], [ex, ey]], 0.8), { w: 0.45 + f.r * 0.002, renk: 'rgba(150,128,60,0.85)', titreme: 0.15, sonSivri: 3 });
    c.fillStyle = '#E9C04C';
    c.beginPath();
    c.arc(ex, ey, 0.9 + f.r * 0.018, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(120,86,30,0.8)';
    c.lineWidth = 0.4;
    c.stroke();
  }
  c.fillStyle = '#C9CF7E';
  c.beginPath();
  c.arc(f.x, f.y, R * 0.075, 0, Math.PI * 2);
  c.fill();
  cizgiYol(c, S.daireYolu(f.x, f.y, R * 0.075), { w: 0.45, renk: '#5D6A30', titreme: 0.1 });
}

// şakayık: dört halka, kıvrık uçlu taç yaprakları (büyük öndeki çiçekler)
function sakayikTac(cx, cy, a, rr0, rr1, hw, r) {
  const P = (rad, ang) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
  const pts = [];
  const p1 = r() * 6;
  const p2 = r() * 6;
  const n1 = (r() - 0.5) * 1.2;
  const n2 = (r() - 0.5) * 1.2;
  for (let t = 0; t <= 1.0001; t += 0.1) pts.push(P(rr0 + (rr1 * 0.84 - rr0) * t, a - hw * (0.3 + 0.7 * Math.sin((t * Math.PI) / 2))));
  for (let k = -1; k <= 1.0001; k += 0.04) {
    let rho = rr1 * (0.84 + 0.16 * Math.cos((k * Math.PI) / 2));
    rho *= 1 + 0.035 * Math.sin(k * 7.5 + p1) + 0.02 * Math.sin(k * 15 + p2);
    rho -= rr1 * 0.07 * Math.exp(-Math.pow((k - n1) / 0.07, 2)) + rr1 * 0.05 * Math.exp(-Math.pow((k - n2) / 0.06, 2));
    pts.push(P(rho, a + k * hw));
  }
  for (let t = 1; t >= -0.0001; t -= 0.1) pts.push(P(rr0 + (rr1 * 0.84 - rr0) * t, a + hw * (0.3 + 0.7 * Math.sin((t * Math.PI) / 2))));
  return S.yol(pts, true);
}
function sakayikCiz(f) {
  const R = f.r * 1.14;
  const r = S.rng(Math.round(f.x * 7 + f.y));
  const halkalar = [
    { n: 7, r1: 1.0, r0: 0.16, hw: 0.5, ofs: 0, pembe: 0.42 },
    { n: 7, r1: 0.8, r0: 0.14, hw: 0.47, ofs: 0.45, pembe: 0.55 },
    { n: 6, r1: 0.6, r0: 0.12, hw: 0.52, ofs: 0.2, pembe: 0.68 },
    { n: 5, r1: 0.42, r0: 0.16, hw: 0.56, ofs: 0.75, pembe: 0.62 },
  ];
  for (const h of halkalar) {
    for (let j = 0; j < h.n; j++) {
      const a = f.aci + h.ofs + (j * Math.PI * 2) / h.n + (r() - 0.5) * 0.12;
      const r1 = R * h.r1 * (0.94 + r() * 0.1);
      const d = sakayikTac(f.x, f.y, a, R * h.r0, r1, h.hw, r);
      const p = new Path2D(d);
      c.save();
      c.clip(p);
      c.fillStyle = 'rgba(255,253,250,0.97)';
      c.fill(p);
      // her yaprak kendi dibinden (iç halkanın altından) ucuna doğru allıkla derecelenir
      let g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, r1 * 0.98);
      g.addColorStop(0, `rgba(218,124,150,${h.pembe})`);
      g.addColorStop(0.5, `rgba(226,146,168,${h.pembe * 0.75})`);
      g.addColorStop(0.72, `rgba(232,166,184,${h.pembe * 0.32})`);
      g.addColorStop(0.9, 'rgba(236,180,194,0.04)');
      g.addColorStop(1, 'rgba(236,180,194,0)');
      c.fillStyle = g;
      c.fill(p);
      // iç halkanın gölgesi dış yaprağın dibine düşer
      g = c.createRadialGradient(f.x, f.y, r1 * 0.45, f.x, f.y, r1 * 0.8);
      g.addColorStop(0, 'rgba(150,118,140,0.2)');
      g.addColorStop(1, 'rgba(150,118,140,0)');
      c.fillStyle = g;
      c.fill(p);
      const golge = 0.5 - 0.5 * Math.cos(a + 0.8);
      const ex = f.x + Math.cos(a) * r1;
      const ey = f.y + Math.sin(a) * r1;
      g = c.createRadialGradient(ex, ey, 0, ex, ey, r1 * 0.6);
      g.addColorStop(0, `rgba(150,150,172,${0.04 + 0.16 * golge})`);
      g.addColorStop(1, 'rgba(150,150,172,0)');
      c.fillStyle = g;
      c.fill(p);
      for (let k = -4; k <= 4; k++) {
        const pts = [];
        for (let t = 0; t <= 1.0001; t += 0.1) {
          const rad = R * h.r0 + (r1 * 0.86 - R * h.r0) * t;
          pts.push([f.x + Math.cos(a + k * h.hw * 0.2 * (0.3 + 0.7 * t)) * rad, f.y + Math.sin(a + k * h.hw * 0.2 * (0.3 + 0.7 * t)) * rad]);
        }
        serit(c, yenidenOrnekle(pts, 0.9), { w: 0.42 + f.r * 0.0015, renk: 'rgba(196,124,144,0.32)', titreme: 0.12, sonSivri: r1 * 0.25, basSivri: 2 });
      }
      c.restore();
      cizgiYol(c, d, { w: 0.6 + f.r * 0.004, renk: '#74575A', titreme: 0.2, frek: 0.07, basinc: 0.3, civi: 2 });
    }
  }
  // ercik kümesi
  const n = Math.round(30 + f.r * 0.4);
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2;
    const L = R * (0.08 + r() * 0.12);
    const ex = f.x + Math.cos(a) * L;
    const ey = f.y + Math.sin(a) * L;
    serit(c, yenidenOrnekle([[f.x + Math.cos(a) * R * 0.04, f.y + Math.sin(a) * R * 0.04], [ex, ey]], 0.8), { w: 0.5, renk: 'rgba(160,130,60,0.8)', titreme: 0.1, sonSivri: 2 });
    c.fillStyle = '#EBC24E';
    c.beginPath();
    c.arc(ex, ey, 1.2 + f.r * 0.012, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(122,88,30,0.75)';
    c.lineWidth = 0.4;
    c.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const a = f.aci + i * 1.57;
    c.fillStyle = '#B9C878';
    c.beginPath();
    c.ellipse(f.x + Math.cos(a) * R * 0.035, f.y + Math.sin(a) * R * 0.035, R * 0.035, R * 0.05, a, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = 'rgba(80,96,40,0.8)';
    c.lineWidth = 0.45;
    c.stroke();
  }
}
for (const f of B.cicekler) {
  if (f.r >= 44) sakayikCiz(f);

// ---- 9) lavi düzensizliği: pigment yoğunluğu ipekte hafifçe dalgalanır
{
  const IP = hex('#F4ECDA');

const ekran = ekranaAktar(ctx0);

  pikselGecis(ekran, (d, i, x, y) => {
    const ay = 0.5 + 0.5 * Math.cos((y * 2 * Math.PI) / 2.9 + nz.n(x * 0.01, y * 0.002) * 3);
    const ax = 0.5 + 0.5 * Math.cos((x * 2 * Math.PI) / 3.1 + nz.n(y * 0.01, x * 0.002) * 3);

    d[i] = kenet(d[i] * m + 2, 0, 255);
    d[i + 1] = kenet(d[i + 1] * m + 2, 0, 255);
