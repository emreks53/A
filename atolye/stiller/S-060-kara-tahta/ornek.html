<script>
// S-060 Kara Tahta Tebeşiri — açık yeşil-gri tahtada bitmiş, aydınlık bir renkli tebeşir duvar resmi. Tebeşir
// tahtanın neredeyse tamamını örter: gök tebeşirin yan yüzüyle sürülüp parmakla dağıtılmış açık mavi, zemin

(function () {
  'use strict';
  // ================================================================ ortak yardımcılar

  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);

      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;

      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];

      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }

  // ---------------------------------------------------------------- bölge haritası (1024)

  { const onb = new Map(), v = bh.veri;

      let b = onb.get(key);

      BOL[i] = b;

  // ---------------------------------------------------------------- ışık (sağ üstten)

  const prof = SAHNE.kubbeProfili(400);

  function harita(fn) {

    return m;

  // ---------------------------------------------------------------- SVG yolu → nokta dizileri

  gizliSvg.style.position = 'absolute'; gizliSvg.style.left = '-10px'; gizliSvg.style.top = '-10px';
  const gizliYol = document.createElementNS(SVGNS, 'path');
  gizliSvg.appendChild(gizliYol); document.body.appendChild(gizliSvg);

      gizliYol.setAttribute('d', p);

      for (let i = 0; i <= n; i++) { const q = gizliYol.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  const Y = SAHNE.yollar();
  const P2 = (d) => new Path2D(d);
  function birlesik(dizi) { const p = new Path2D(); for (const d of dizi) p.addPath(new Path2D(d)); return p; }

  // ---------------------------------------------------------------- vuruş (uçları incelen, basıncı değişen çizgi)
  let KALINLIK = 1; // stil, bütün vuruşları kalınlaştırmak için değiştirebilir

      const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;

      g.addColorStop(Math.min(0.45, bas * 0.9 + 0.02), rgba(c, a));
      g.addColorStop(Math.max(0.55, 1 - son * 0.8), rgba(c, a));

      const yeni = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i], L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), k = Math.ceil(L / 3);

      }

    }

    const n = pts.length;

        const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];

  // öbek taraması: kısa paralel vuruş öbekleri (renkli kalem / tebeşir taraması)
  // o: {bx:[x1,y1,x2,y2], ic(x,y), aci (sayı ya da fn), aciJ, aralik, boy, kal, alfa(sayı ya da fn), renk (dizi ya da fn), obek, sik, egri, bas, son}

    const [x1, y1, x2, y2] = o.bx;

  // ---------------------------------------------------------------- 2048 katman tuvali

  // bir noktanın (ya da çevresinin) verilen bölgelerde olup olmadığı

      if (p.tip === 'poligon') { const q = p.noktalar; for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; if (a[1] === 800 && b[1] === 800) continue; elCizgisi(x, [a, b], 1.4, 0.8, c, r, { parca: 140 }); } }
      else if (p.tip === 'korkuluk') { elCizgisi(x, [[p.x1, p.y1], [p.x2, p.y1]], 1.3, 0.8, c, r); const n = 9; for (let i = 0; i < n; i++) { const xx = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / n; strok(x, [[xx, p.y1 + 3], [xx, p.y2 - 2]], 1.6, 0.75, c, 0.1, 0.2); } elCizgisi(x, [[p.x1, p.y2], [p.x2, p.y2]], 1.2, 0.6, c, r); }
      else if (p.tip === 'topuz') elCizgisi(x, ornekle(p.yol, 2)[0], 1.4, 0.85, c, r, { parca: 200 });
    }
    for (const z of SAHNE.zikzakCizgileri()) elCizgisi(x, z, 1.6, 0.85, PEMBE, r, { parca: 30, titre: 0.2, ortus: 2 });
    for (const p of SAHNE.minarePencereleri) elCizgisi(x, kemerNok(p), 1.2, 0.8, c, r, { parca: 200 });
    for (const d of [...Y.alem, ...Y.minareAlem]) for (const pts of ornekle(d, 1.5)) elCizgisi(x, pts, 0.9, 0.6, C('#FFF4C0'), r, { parca: 200, titre: 0.1 });
  }, { opq: 0.95, gren: 0.7, sil: [MK.bitki] });

  // ================================================================ 6) bitkiler: dağıtılmış yeşil yapraklar, beyaz çiçekler
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s, 2.6, 0.9, YESIL, r, { parca: 90, titre: 0.4 }); }, { opq: 0.9, gren: 0.7, sil: [MK.yaprakUstu] });
  katman((x) => {
    B.yapraklar.forEach((yp, i) => {
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore();
      x.save(); x.clip(yaprakYollari[i]);
      const [a, b] = SAHNE.yaprakDamari(yp), Wd = yp.uzunluk * yp.genislik, nx = -Math.sin(yp.aci), ny = Math.cos(yp.aci);
      const isikli = nx * 0.74 + ny * -0.67 > 0 ? 1 : -1;
      leke(x, [a, b], Wd * 0.9, 0.85, KOYUYESIL);
      leke(x, [[a[0] + nx * Wd * 0.2 * isikli, a[1] + ny * Wd * 0.2 * isikli], [b[0] + nx * Wd * 0.1 * isikli, b[1] + ny * Wd * 0.1 * isikli]], Wd * 0.45, 0.8, yp.uzunluk > 50 ? YESIL : YESIL2);
      x.restore();
    });
    sil(K, MK.onBitki);
  }, { ezme: 3, opq: 0.88, gren: 0.6, guc: 1.3 });
  // yapraklarda tebeşir ucuyla damardan dışa kısa, kırık vuruşlar
  katman((x) => {
    B.yapraklar.forEach((yp, i) => {
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore();
      x.save(); x.clip(yaprakYollari[i]);
      const L = yp.uzunluk, ca = Math.cos(yp.aci), sa = Math.sin(yp.aci), Wd = L * yp.genislik;
      for (const taraf of [-1, 1]) {
        const isikli = (-sa * taraf) * 0.74 + (ca * taraf) * -0.67 > 0;
        const n = Math.round(L / 4.2);
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n, sx = yp.x + ca * L * t, sy = yp.y + sa * L * t, a2 = yp.aci + taraf * 0.6;
          const len = Wd * 0.75 * Math.sin(Math.PI * clamp(t, 0.06, 0.94)) * (0.8 + 0.35 * r()) + 1;
          strok(x, [[sx, sy], [sx + Math.cos(a2) * len, sy + Math.sin(a2) * len]], 1.6, (isikli ? 0.75 : 0.45) * (0.7 + 0.3 * r()), isikli ? YESIL2 : C('#3FA86A'), 0.08, 0.5);
        }
      }
      x.restore();
    });
    sil(K, MK.onBitki);
  }, { opq: 0.85, gren: 0.85, guc: 1.1 });
  katman((x) => {
    B.yapraklar.forEach((yp, i) => {
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore();
      elCizgisi(x, ornekle(SAHNE.yaprakYolu(yp), 2)[0], 1.2, 0.75, YESIL2, r, { parca: 60, titre: 0.2 });
      const [a, b] = SAHNE.yaprakDamari(yp); strok(x, [a, [lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5)], b], 1.1, 0.6, C('#D8F0B0'), 0.05, 0.4);
    });
    sil(K, MK.onBitki);
  }, { opq: 0.9, gren: 0.7 });
  katman((x) => { B.tomurcuklar.forEach((t, i) => { x.save(); x.clip(tomurcukYollari[i]); leke(x, [[t.x - Math.cos(t.aci) * t.r, t.y - Math.sin(t.aci) * t.r], [t.x + Math.cos(t.aci) * t.r * 1.4, t.y + Math.sin(t.aci) * t.r * 1.4]], t.r * 2.2, 0.9, PEMBE2); x.restore(); elCizgisi(x, ornekle(SAHNE.tomurcukYolu(t), 1.5)[0], 1.1, 0.75, PEMBE, r, { parca: 60, titre: 0.15 }); }); },
    { opq: 0.92, gren: 0.6 });
  // çiçekler: beyaz taç yaprak, göbekte açık sarı-krem, gölge yanında lila; dağıtılmış; üstüne pembe-lila kontur
  katman((x) => {
    B.cicekler.forEach((c, ci) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e) => {
        const p = P2(SAHNE.elipsYolu(e));
        x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(p); x.restore();
        x.save(); x.clip(p);
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
        leke(x, [[e.cx, e.cy], [e.cx + Math.cos(e.aci) * e.rx * 0.4, e.cy + Math.sin(e.aci) * e.rx * 0.4]], e.ry * 2.2, 0.95, ci % 3 === 1 ? C('#FFF8F2') : C('#FBFBF6'));
        leke(x, [[c.x, c.y], [c.x + Math.cos(e.aci) * c.r * 0.34, c.y + Math.sin(e.aci) * c.r * 0.34]], e.ry * 1.0, 0.8, ci % 3 === 2 ? C('#FCE4EC') : C('#FFF0C0'));
        if (yon < -0.2) leke(x, [[e.cx, e.cy], [e.cx + Math.cos(e.aci) * e.rx * 0.6, e.cy + Math.sin(e.aci) * e.rx * 0.6]], e.ry * 1.1, 0.4, C('#D6CCF0'));
        x.restore();
      });
    });
  }, { ezme: 4, opq: 0.9, gren: 0.58, guc: 1.35, bx: [0, 500, W, W] });
  katman((x) => {
    B.cicekler.forEach((c) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e, ei) => {
        const pts = ornekle(SAHNE.elipsYolu(e), 1.5)[0];
        const icE = (sn, q) => { const ca = Math.cos(sn.aci), sa = Math.sin(sn.aci), dx = q[0] - sn.cx, dy = q[1] - sn.cy; const u = (dx * ca + dy * sa) / sn.rx, v = (-dx * sa + dy * ca) / sn.ry; return u * u + v * v < 0.98; };
        const parcalar = []; let cur = [];
        for (const q of pts) { if (tl.some((sn, ej) => ej > ei && icE(sn, q))) { if (cur.length > 1) parcalar.push(cur); cur = []; } else cur.push(q); }
        if (cur.length > 1) parcalar.push(cur);
        for (const pp of parcalar) elCizgisi(x, pp, 1.3 * Math.max(0.85, c.r / 50), 0.8, C('#D9A8CC'), r, { parca: 80, titre: 0.2 });
        // taçta birkaç ince açık pembe çizgi
        const a = e.aci; strok(x, [[c.x + Math.cos(a) * c.r * 0.28, c.y + Math.sin(a) * c.r * 0.28], [c.x + Math.cos(a) * c.r * 0.62, c.y + Math.sin(a) * c.r * 0.62]], 1.1, 0.55, C('#F2A6C2'), 0.05, 0.6);
      });
      x.fillStyle = rgba(SARI, 0.95); x.beginPath(); x.arc(c.x, c.y, c.r * 0.2, 0, 7); x.fill();
      x.fillStyle = rgba(TURUNCU, 0.9); x.beginPath(); x.arc(c.x + c.r * 0.04, c.y + c.r * 0.05, c.r * 0.11, 0, 7); x.fill();
      for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2 + r() * 0.3, rr = c.r * (0.26 + r() * 0.05); x.fillStyle = rgba(SARI2, 0.95); x.beginPath(); x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.2, c.r * 0.04), 0, 7); x.fill(); }
    });
  }, { opq: 0.95, gren: 0.65, bx: [0, 500, W, W] });

  // ---------------------------------------------------------------- tahtayı tuvale bas (çerçeve yok: resim kenara kadar)
  // en dıştaki birkaç piksel (bulanıklaştırmanın tuval dışından saydamlık çektiği şerit) içerideki komşudan alınır
  { const E = 4; for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) { if (x >= E && y >= E && x < W2 - E && y < W2 - E) continue; const j = clamp(y, E, W2 - 1 - E) * W2 + clamp(x, E, W2 - 1 - E), i = y * W2 + x; RR[i] = RR[j]; RG[i] = RG[j]; RB[i] = RB[j]; } }
  const img = ctx.createImageData(W2, W2), d = img.data;
  for (let i = 0; i < N2; i++) { d[i * 4] = clamp(RR[i] * 255, 0, 255); d[i * 4 + 1] = clamp(RG[i] * 255, 0, 255); d[i * 4 + 2] = clamp(RB[i] * 255, 0, 255); d[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
</script>
