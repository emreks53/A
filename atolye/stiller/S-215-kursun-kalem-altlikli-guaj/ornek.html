<script>
// ================================================================ ressamın aletleri (ortak el yardımcıları)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: renk, gürültü, yol örnekleme, elle çekilmiş çizgi,
// tek fırça darbesi (başlangıç, basınç, kuru uç, kıllar), alanı darbelerle doldurma, maskeler ve ışık.
// Rastgelelik yalnız SAHNE.rng ile (görsel her seferinde aynı çıkar).
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';
const W = 1024;
const OL = 2; // çalışma çözünürlüğü 2048; koordinatlar 1024
const PI = Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const yumusak = (a, b, v) => {
  const t = clamp((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
function hex(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function karis(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function rgba(c, a) {
  return `rgba(${clamp(c[0] | 0, 0, 255)},${clamp(c[1] | 0, 0, 255)},${clamp(c[2] | 0, 0, 255)},${a == null ? 1 : a})`;
}
/** Renk rampası: [[t, '#hex'], ...] → fn(t) → [r,g,b] */
function rampa(duraklar) {
  const D = duraklar.map(([t, c]) => [t, typeof c === 'string' ? hex(c) : c]);
  return (t) => {
    if (t <= D[0][0]) return D[0][1].slice();
    for (let i = 1; i < D.length; i++) {
      if (t <= D[i][0]) return karis(D[i - 1][1], D[i][1], (t - D[i - 1][0]) / (D[i][0] - D[i - 1][0]));
    }
    return D[D.length - 1][1].slice();
  };
}
/** Boya karışımındaki küçük oynama: a ton (açık/koyu), k renk sapması */
function oyna(c, r, a, k) {
  const j = (r() - 0.5) * 2 * a;
  k = k || 0;
  return [c[0] + j + (r() - 0.5) * k, c[1] + j + (r() - 0.5) * k, c[2] + j + (r() - 0.5) * k];
}

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1) (piksel başına tane, lif vb. için hızlı). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}
/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}
function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu bir şerit olarak çizilir.
 *  w: kalınlık, renk, kapali, titreme (px), frek (1/px), basinc (0..1), sivri / basSivri / sonSivri (uçlarda incelme, px)
 */
function serit(c, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = NZ.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = NZ.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = NZ.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = NZ.n(t * fr + ofs, ofs * 0.37);
      q2 = NZ.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = NZ.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((PI / 2) * (L - t)) / a2);
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  c.beginPath();
  if (o.kapali) {
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) c.lineTo(sol[i][0], sol[i][1]);
    c.closePath();
    c.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
  } else {
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) c.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
  }
  if (o.renk) c.fillStyle = o.renk;
  c.fill('nonzero');
}
/** SVG yolunu (bütün alt yollarıyla) elle çekilmiş çizgi olarak çizer. */
function cizgiYol(c, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(c, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
/** Nokta dizisini elle çekilmiş çizgi olarak çizer. */
function cizgiNokta(c, pts, o) {
  serit(c, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Hafif titrek kapalı biçim (dolgu ve kırpma için): yolu örnekleyip kenarını oynatır. */
function titrekYol(d, amp, fr, adim) {
  const p2 = new Path2D();
  for (const p of ornekle(d, adim || 2)) {
    if (p.kapali) {
      let alan = 0;
      for (let i = 0; i < p.pts.length; i++) {
        const a = p.pts[i];
        const b = p.pts[(i + 1) % p.pts.length];
        alan += a[0] * b[1] - b[0] * a[1];
      }
      if (alan < 0) p.pts.reverse();
    }
    const N = normaller(p.pts, p.kapali);
    const ofs = (_ofs += 7.9);
    p.pts.forEach((q, i) => {
      const off = amp * (NZ.n(i * (adim || 2) * (fr || 0.03) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}
function yolBirlestir(dler) {
  const p = new Path2D();
  for (const d of dler) p.addPath(typeof d === 'string' ? new Path2D(d) : d);
  return p;
}

// ---------------------------------------------------------------- maskeler (1024 ızgarada)
function maskeYap(ciz) {
  const c = S.yeniTuval(W, W);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, W, W).data;
  const m = new Uint8Array(W * W);
  for (let i = 0; i < W * W; i++) m[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  return m;
}
function yolMaskesi(yol) {
  return maskeYap((x) => x.fill(typeof yol === 'string' ? new Path2D(yol) : yol));
}
function mIc(m, x, y) {
  x = Math.round(x);
  y = Math.round(y);
  return x >= 0 && y >= 0 && x < W && y < W && m[y * W + x] === 1;
}
/** Kare yapılı genişletme (r px). */
function genislet(m, r) {
  const T = new Uint8Array(W * W);
  const O = new Uint8Array(W * W);
  for (let y = 0; y < W; y++) {
    let son = -1e9;
    const o = y * W;
    for (let x = 0; x < W; x++) {
      if (m[o + x]) son = x;
      if (x - son <= r) T[o + x] = 1;
    }
    son = 1e9;
    for (let x = W - 1; x >= 0; x--) {
      if (m[o + x]) son = x;
      if (son - x <= r) T[o + x] = 1;
    }
  }
  for (let x = 0; x < W; x++) {
    let son = -1e9;
    for (let y = 0; y < W; y++) {
      if (T[y * W + x]) son = y;
      if (y - son <= r) O[y * W + x] = 1;
    }
    son = 1e9;
    for (let y = W - 1; y >= 0; y--) {
      if (T[y * W + x]) son = y;
      if (son - y <= r) O[y * W + x] = 1;
    }
  }
  return O;
}
/** Maske kenarına uzaklık (kaba, iki geçişli şehir bloğu): içeride pozitif px. */
function kenarUzak(m, enFazla) {
  const D = new Float32Array(W * W);
  const big = enFazla || 60;
  for (let i = 0; i < W * W; i++) D[i] = m[i] ? big : 0;
  for (let y = 1; y < W; y++)
    for (let x = 1; x < W; x++) {
      const i = y * W + x;
      if (D[i] > 0) D[i] = Math.min(D[i], D[i - 1] + 1, D[i - W] + 1, D[i - W - 1] + 1.414);
    }
  for (let y = W - 2; y >= 0; y--)
    for (let x = W - 2; x >= 0; x--) {
      const i = y * W + x;
      if (D[i] > 0) D[i] = Math.min(D[i], D[i + 1] + 1, D[i + W] + 1, D[i + W + 1] + 1.414);
    }
  return D;
}

// ---------------------------------------------------------------- fırça darbesi
/**
 * Tek fırça darbesi. pts: ana çizgi, w: genişlik, rgb: renk.
 * o: alfa, bas (başta incelme payı 0..0.5), son (sonda incelme), basinc (0..1 genişlik oynaması), titreme (kenar, px),
 *    kil (kıl izi sayısı), kilAlfa, kilFark (kıl ton farkı), kuru (0..1 kuru uç), r (rng), basUc (iniş düğümü 0..1)
 */
function darbe(c, pts, w, rgb, o) {
  o = o || {};
  const r = o.r || RD;
  pts = yenidenOrnekle(pts, Math.max(0.8, Math.min(w * 0.4, 3)));
  const n = pts.length;
  if (n < 2) return;
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] || 1;
  const N = normaller(pts, false);
  const ofs = (_ofs += 7.31);
  const bas = o.bas != null ? o.bas : 0.15;
  const son = o.son != null ? o.son : 0.3;
  const pr = o.basinc != null ? o.basinc : 0.25;
  const tit = o.titreme != null ? o.titreme : w * 0.07;
  const kuru = o.kuru || 0;
  const govde = 1 - kuru * (0.2 + 0.25 * r());
  const dug = o.basUc != null ? o.basUc : 0.12;
  const gen = (t, tb) => {
    // t: 0..1 darbe boyunca; tb: gövdenin bittiği yer
    let f = 1;
    if (t < bas) f *= 0.5 + 0.5 * Math.sin(((t / bas) * PI) / 2);
    if (t < bas * 1.6) f *= 1 + dug * Math.sin((t / (bas * 1.6)) * PI);
    const te = (tb - t) / tb;
    if (te < son) f *= 0.08 + 0.92 * Math.sin((Math.max(0, te / son) * PI) / 2);
    f *= 1 + pr * (NZ.n(t * 2.1 + ofs, ofs * 0.53) - 0.5) * 2;
    return Math.max(0.02, f);
  };
  // gövde
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i] / L;
    if (t > govde + 1e-6) break;
    const hw = (w * gen(t, govde)) / 2;
    const e1 = tit * (NZ.n(s[i] * 0.09 + ofs, 1.7) - 0.5) * 2;
    const e2 = tit * (NZ.n(s[i] * 0.09 + ofs, 8.3) - 0.5) * 2;
    sol.push([pts[i][0] + N[i][0] * (hw + e1), pts[i][1] + N[i][1] * (hw + e1)]);
    sag.push([pts[i][0] - N[i][0] * (hw + e2), pts[i][1] - N[i][1] * (hw + e2)]);
  }
  if (sol.length > 1) {
    c.beginPath();
    c.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < sol.length; i++) c.lineTo(sol[i][0], sol[i][1]);
    for (let i = sag.length - 1; i >= 0; i--) c.lineTo(sag[i][0], sag[i][1]);
    c.closePath();
    c.fillStyle = rgba(rgb, o.alfa == null ? 1 : o.alfa);
    c.fill();
  }
  // kıl izleri (fırçanın kılları boyayı çizgi çizgi bırakır; kuru uçta ayrılırlar)
  const kil = o.kil || 0;
  if (kil > 0) {
    c.lineCap = 'round';
    const ka = o.kilAlfa != null ? o.kilAlfa : 0.35;
    const kf = o.kilFark != null ? o.kilFark : 14;
    for (let k = 0; k < kil; k++) {
      const v = ((k + 0.5) / kil - 0.5) * 0.8 + (r() - 0.5) * 0.12;
      const j = (r() - 0.5) * 2 * kf;
      const cc = [rgb[0] + j, rgb[1] + j, rgb[2] + j];
      const t0 = r() * 0.12;
      const t1 = kuru ? govde + r() * (1 - govde) : 0.78 + r() * 0.2;
      c.strokeStyle = rgba(cc, ka * (0.6 + 0.8 * r()));
      c.lineWidth = Math.max(0.45, (w / kil) * (0.45 + 0.6 * r()));
      c.beginPath();
      let ilk = true;
      for (let i = 0; i < n; i++) {
        const t = s[i] / L;
        if (t < t0 || t > t1) continue;
        const hw = w * gen(Math.min(t, govde), kuru ? 1 : govde) * v;
        const x = pts[i][0] + N[i][0] * hw;
        const y = pts[i][1] + N[i][1] * hw;
        if (ilk) {
          c.moveTo(x, y);
          ilk = false;
        } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
}
let RD = S.rng(1);

/** (x,y) merkezli, yon alanını izleyen darbe yolu (l uzunluk). */
function darbeYolu(x, y, l, yon, egri) {
  if (!egri) {
    const a = yon(x, y);
    const ca = (Math.cos(a) * l) / 2;
    const sa = (Math.sin(a) * l) / 2;
    return [
      [x - ca, y - sa],
      [x + ca, y + sa],
    ];
  }
  const adim = l / 8;
  const ileri = [];
  const geri = [];
  let cx = x;
  let cy = y;
  for (let s = 0; s < 4; s++) {
    const a = yon(cx, cy);
    cx += Math.cos(a) * adim;
    cy += Math.sin(a) * adim;
    ileri.push([cx, cy]);
  }
  cx = x;
  cy = y;
  for (let s = 0; s < 4; s++) {
    const a = yon(cx, cy);
    cx -= Math.cos(a) * adim;
    cy -= Math.sin(a) * adim;
    geri.push([cx, cy]);
  }
  return geri.reverse().concat([[x, y]], ileri);
}

/**
 * Bir alanı fırça darbeleriyle doldurur. Darbeler sarsılmış bir ızgaraya dağıtılır, karışık sırayla çekilir.
 * o: kutu [x1,y1,x2,y2], aralik (px), klip (Path2D), icinde(x,y), boy [a,b], en [a,b], yon(x,y) → açı, egri,
 *    renk(x,y,r) → rgb, alfa [a,b], darbe (darbe() seçenekleri), tohum, atla(x,y,r) → true ise darbe yok
 */
function alanBoya(c, o) {
  const r = S.rng(o.tohum || 1);
  const [x1, y1, x2, y2] = o.kutu;
  const ar = o.aralik;
  const ar2 = o.aralikY || ar;
  const L = [];
  for (let y = y1; y < y2; y += ar2) {
    for (let x = x1; x < x2; x += ar) {
      const px = x + r() * ar;
      const py = y + r() * ar2;
      if (o.icinde && !o.icinde(px, py)) continue;
      L.push([px, py]);
    }
  }
  for (let i = L.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = L[i];
    L[i] = L[j];
    L[j] = t;
  }
  if (o.sirala) L.sort(o.sirala);
  c.save();
  if (o.klip) c.clip(o.klip);
  const dO = Object.assign({}, o.darbe || {}, { r });
  for (const [x, y] of L) {
    if (o.atla && o.atla(x, y, r)) continue;
    const l = o.boy[0] + r() * (o.boy[1] - o.boy[0]);
    const w = o.en[0] + r() * (o.en[1] - o.en[0]);
    const pts = darbeYolu(x, y, l, o.yon, o.egri);
    const col = o.renk(x, y, r);
    if (!col) continue;
    dO.alfa = o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]);
    (o.fn || darbe)(c, pts, (o.enFn ? o.enFn(x, y) : 1) * w, col, dO);
  }
  c.restore();
}

// ---------------------------------------------------------------- ışık ve biçim (sağ üstten gelen öğle ışığı)
function norm(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
const ISIK = norm([0.5, -0.62, 0.6]); // x sağ, y aşağı (ekran), z bakana doğru
const KP = S.kubbeProfili(240);
/** Kubbe yüksekliğinde yarıçap. */
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < KP.length - 1; i++) {
    if (y <= KP[i].y && y >= KP[i + 1].y) {
      const t = (KP[i].y - y) / (KP[i].y - KP[i + 1].y || 1);
      return KP[i].r + (KP[i + 1].r - KP[i].r) * t;
    }
  }
  return 0;
}
/** Kubbe üzerindeki noktanın bilgisi: u (−1 sol kenar … 1 sağ), h (0 taban … 1 tepe), dilim (0..16), f (dilim içi 0..1), lam (ışık), lamF (dilim düz yüzü) */
function kubbeBilgi(x, y) {
  const R = Math.max(1, kubbeR(y));
  const u = clamp((x - 560) / R, -0.999, 0.999);
  const h = clamp((555 - y) / 255, 0, 1);
  const boy = Math.asin(u);
  const e = Math.pow(h, 1.25) * 1.25; // yükseldikçe yüzey göğe döner
  const ln = (b) => {
    const nx = Math.sin(b) * Math.cos(e);
    const nz = Math.cos(b) * Math.cos(e);
    const ny = -Math.sin(e);
    return nx * ISIK[0] + ny * ISIK[1] + nz * ISIK[2];
  };
  const dil = (boy + PI / 2) / (PI / 16);
  const di = Math.floor(dil);
  const f = dil - di;
  const bm = -PI / 2 + (di + 0.5) * (PI / 16);
  return { u, h, R, boy, dilim: di, f, lam: ln(boy), lamF: ln(bm) };
}
/** Kubbe meridyeninin (kaburga yönü) ekrandaki açısı (aşağıdan yukarı). */
function kubbeYon(x, y) {
  const R = Math.max(1, kubbeR(y));
  const u = clamp((x - 560) / R, -1, 1);
  const dr = kubbeR(y - 1) - R; // y azaldıkça r değişimi
  return Math.atan2(-1, u * dr);
}
/** Silindir (kasnak, minare) üzerinde ışık: u −1..1 */
function silindirIsik(u) {
  u = clamp(u, -0.999, 0.999);
  const nx = u;
  const nz = Math.sqrt(1 - u * u);
  return nx * ISIK[0] + nz * ISIK[2];
}

// ---------------------------------------------------------------- bulutlar (yaz öğlesinin yassı tabanlı küçük kümeleri)
/** Bulut biçimleri: her biri {x, y, s, lobs:[{x,y,rx,ry}], taban} */
function bulutKur(tohum) {
  const r = S.rng(tohum || 31);
  const yerler = [
    [170, 250, 1.0],
    [505, 148, 0.8],
    [770, 335, 1.0],
    [945, 468, 0.62],
    [92, 470, 0.66],
  ];
  return yerler.map(([x, y, s]) => {
    const lobs = [];
    const gen = 125 * s;
    const adet = 4 + Math.floor(r() * 2);
    for (let i = 0; i < adet; i++) {
      const t = adet === 1 ? 0.5 : i / (adet - 1);
      const lx = x - gen * 0.8 + t * gen * 1.6 + (r() - 0.5) * 16 * s;
      const orta = 1 - Math.abs(t - 0.42) * 1.5;
      const ry = (13 + 22 * Math.max(0.12, orta) + r() * 7) * s;
      const rx = ry * (1.9 + r() * 0.8);
      lobs.push({ x: lx, y: y + 14 * s - ry * 0.62, rx, ry });
    }
    // iki yanda ince, yassı uzantılar
    lobs.push({ x: x - gen * 0.95, y: y + 9 * s, rx: 46 * s, ry: 8 * s });
    lobs.push({ x: x + gen * 0.98, y: y + 10 * s, rx: 52 * s, ry: 7 * s });
    return { x, y, s, lobs, taban: y + 16 * s, gen };
  });
}
/** Bulut yoğunluğu (0 dışarıda, 1 iç): kenar, tabana doğru düz kesilir. */
function bulutYog(B, x, y) {
  let en = 0;
  for (const L of B.lobs) {
    const dx = (x - L.x) / L.rx;
    const dy = (y - L.y) / L.ry;
    en = Math.max(en, 1 - (dx * dx + dy * dy));
  }
  if (en < -0.35) return 0;
  const tab = yumusak(B.taban + 2 * B.s, B.taban - 8 * B.s, y);
  const gn = (NZ.fbm(x * 0.011 + B.x, y * 0.018, 2) - 0.5) * 0.36;
  return clamp(en + gn * yumusak(-0.35, 0.05, en), 0, 1) * tab;
}

/** Bütün tuval üzerinde piksel geçişi: fn(d, i, x, y) — x,y 2048 ızgarada. */
function pikselGecis(c, fn) {
  const cv = c.canvas;
  const im = c.getImageData(0, 0, cv.width, cv.height);
  const d = im.data;
  const Wc = cv.width;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < Wc; x++) fn(d, (y * Wc + x) * 4, x, y);
  c.putImageData(im, 0, 0);
}

/** Yolu normali boyunca kaydırır: ice > 0 içe, < 0 dışa; amp ile kıl kadar oynar (alan çizgide durmaz). */
function kaymaYol(d, ice, amp, fr) {
  const p2 = new Path2D();
  for (const p of ornekle(d, 1.5)) {
    if (p.pts.length < 3) continue;
    let alan = 0;
    for (let i = 0; i < p.pts.length; i++) {
      const a = p.pts[i];
      const b = p.pts[(i + 1) % p.pts.length];
      alan += a[0] * b[1] - b[0] * a[1];
    }
    if (alan < 0) p.pts.reverse();
    const N = normaller(p.pts, true);
    const ofs = (_ofs += 6.1);
    p.pts.forEach((q, i) => {
      const off = ice + amp * (NZ.n(i * 1.5 * (fr || 0.035) + ofs, ofs) - 0.5) * 2;
      const x = q[0] + N[i][0] * off;
      const y = q[1] + N[i][1] * off;
      if (i === 0) p2.moveTo(x, y);
      else p2.lineTo(x, y);
    });
    p2.closePath();
  }
  return p2;
}
function kutuBul(d, pay) {

      y1 = Math.min(y1, y);
      x2 = Math.max(x2, x);

}
// ---------------------------------------------------------------- kalem: grafit çizgi
const KAL = katman();
/** Kalem çizgisi: ince, basınçlı, uçları incelen; köşelerde hafifçe taşar. */
function kalem(pts, o) {
  o = o || {};
  // basınç çizgi boyunca yavaşça değişir (yaklaşık 1,5–4 px genişlik); uzun çizgilerde kalem ara ara kalkar
  const L = pts.length;

    kalem(pts.slice(0, k), Object.assign({}, o, { surekli: true }));

  cizgiNokta(KAL, pts, { w: (o.w || 1.35) * 2.15, renk: rgba(o.renk || P.grafit, o.alfa == null ? 0.9 : Math.min(1, o.alfa * 1.12)), titreme: o.titreme == null ? 0.3 : o.titreme, frek: 0.018, basinc: 0.55, sivri: o.sivri == null ? 8 : o.sivri, adim: 1 });
}
/** SVG yolunu kalemle çizer; kapalı eğriler iki üç parçada, parçalar birbirine hafifçe biner. */
function kalemYol(d, o) {
  o = o || {};
  for (const p of ornekle(d, 1)) {
    let pts = p.pts;
    if (p.kapali) pts = pts.concat(pts.slice(0, Math.min(6, pts.length)));
    const n = pts.length;
    // köşeli yollarda (dikdörtgen gibi) her kenar ayrı çekilir ve köşeden biraz taşar
    const kose = [];
    for (let i = 1; i < n - 1; i++) {
      const a1 = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]);
      const a2 = Math.atan2(pts[i + 1][1] - pts[i][1], pts[i + 1][0] - pts[i][0]);
      let da = Math.abs(a2 - a1);
      if (da > PI) da = 2 * PI - da;
      if (da > 0.6) kose.push(i);
    }
    const parcalar = [];
    if (kose.length >= 2 && !o.yumusak) {
      const sinir = [0, ...kose, n - 1];
      for (let k = 0; k < sinir.length - 1; k++) parcalar.push(pts.slice(sinir[k], sinir[k + 1] + 1));
    } else {
      const adet = Math.max(1, Math.round(n / (o.parca || 180)));
      for (let k = 0; k < adet; k++) {
        const a = Math.floor((k * n) / adet);
        const b = Math.min(n - 1, Math.floor(((k + 1) * n) / adet) + 4);
        parcalar.push(pts.slice(a, b + 1));
      }
    }
    for (let seg of parcalar) {
      if (seg.length < 2) continue;
      if (o.tasma !== 0 && kose.length >= 2 && !o.yumusak) {
        const t = o.tasma || 2.5;
        const [ax, ay] = seg[0];
        const [bx, by] = seg[1];
        const l1 = Math.hypot(bx - ax, by - ay) || 1;
        const [cx, cy] = seg[seg.length - 1];
        const [dx, dy] = seg[seg.length - 2];
        const l2 = Math.hypot(cx - dx, cy - dy) || 1;
        const t1 = t * (0.4 + RD() * 0.8);
        const t2 = t * (0.4 + RD() * 0.8);
        seg = [[ax - ((bx - ax) / l1) * t1, ay - ((by - ay) / l1) * t1], ...seg, [cx + ((cx - dx) / l2) * t2, cy + ((cy - dy) / l2) * t2]];
      }
      if (o.seyrek && RD() < o.seyrek) continue;
      kalem(seg, o);
    }
  }
}

/**
 * Kalemle gölge taraması, serbest elle: aci yönünde kısa grafit çizgileri; aralık 0,7–1,7 × aralik arasında
 * oynar, her çizginin açısı biraz sapar ve hafifçe kavislenir, iki ucu incelir; renk gümüşi gri tonları arasında
 * değişir ve çizgi kâğıdın dişinde kırılır (dişe tutunma son geçişte). Yalnız icinde(x,y) olan yerlerde.
 */
function kalemTara(kutu, icinde, aci, aralik, alfa, w) {
  const [x1, y1, x2, y2] = kutu;
  const cx = (x1 + x2) / 2;
  const cy = (y1 + y2) / 2;
  const R = Math.hypot(x2 - x1, y2 - y1) / 2;
  const gri = [hex('#6E6E72'), hex('#7A7A7F'), hex('#8C8C90')];
  for (let v = -R; v <= R; v += aralik * (0.7 + RD() * 1.0)) {
    const a = aci + (RD() - 0.5) * 0.12;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const nx = -sa;
    const ny = ca;
    let run = [];
    const bitir = () => {
      if (run.length > 3) {
        for (let k = 0; k < run.length; ) {
          const n = 9 + Math.floor(RD() * 16);
          const parca = run.slice(k, k + n);
          if (parca.length > 3) {
            const bel = (RD() - 0.5) * 2.6; // kavis
            const m = parca.length - 1;
            const pts = parca.map((q, i) => {
              const t = i / m;
              const o = bel * Math.sin(PI * t);
              return [q[0] + nx * o, q[1] + ny * o];
            });
            const c = gri[Math.floor(RD() * 3)];
            cizgiNokta(KAL, pts, { w: (w || 0.85) * (0.8 + RD() * 0.5), renk: rgba(c, (alfa || 0.5) * (0.7 + RD() * 0.6)), titreme: 0.3, frek: 0.06, basinc: 0.45, sivri: 5 + RD() * 4 });
          }
          k += n + 1 + Math.floor(RD() * 3);
        }
      }
      run = [];
    };
    for (let u = -R; u <= R; u += 1.5) {
      const x = cx + ca * u + nx * v;
      const y = cy + sa * u + ny * v;
      if (x >= x1 && x <= x2 && y >= y1 && y <= y2 && icinde(x, y)) run.push([x, y]);
      else bitir();
    }
    bitir();
  }
}

// ---------------------------------------------------------------- bitkiler: biçimler (kalem örtmesi ve boya için)

/** Bulut tabanı: yaz kümesinin yassı tabanı, ama cetvel düzlüğünde değil: hafif dalgalı, iki ucu biraz kalkık. */
function bulutTaban(B, x) {
  return B.taban + (NZ.n(x * 0.016 + B.x * 0.1, 7.7) - 0.5) * 10 * B.s + (NZ.n(x * 0.06, B.y) - 0.5) * 2.5 - Math.pow(clamp(Math.abs(x - B.x) / (B.gen * 1.12), 0, 1), 2.5) * 10 * B.s;
}
function bulutYolu(B) {
  const x0 = Math.min(...B.lobs.map((l) => l.x - l.rx));
  const x1 = Math.max(...B.lobs.map((l) => l.x + l.rx));
  const ust = [];
  for (let x = x0; x <= x1; x += 3) {
    let y = Infinity;
    for (const L of B.lobs) {
      const u = (x - L.x) / L.rx;
      if (Math.abs(u) < 1) y = Math.min(y, L.y - L.ry * Math.sqrt(1 - u * u));
    }
    if (y < bulutTaban(B, x) - 2) ust.push([x, y]);
  }
  const yum = ust.map((p, i) => {
    let s = 0;
    let n = 0;
    for (let j = Math.max(0, i - 2); j <= Math.min(ust.length - 1, i + 2); j++) {
      s += ust[j][1];
      n++;
    }
    return [p[0], s / n];
  });
  const alt = [];
  for (let i = yum.length - 1; i >= 0; i -= 4) alt.push([yum[i][0], bulutTaban(B, yum[i][0])]);
  return S.yol(yum.concat(alt), true);
}

/** Bulutta ressamın gölge payı: her topağın alt-sol yanı mavi-griye döner, taban boyunca hafif bir koyuluk; aci = topağın teğeti. */
function bulutGolge(B, x, y) {
  let en = -9;
  let L0 = B.lobs[0];
  for (const L of B.lobs.slice(0, -2)) {
    const ex = (x - L.x) / L.rx;
    const ey = (y - L.y) / L.ry;
    const e = 1 - (ex * ex + ey * ey);
    if (e > en) {
      en = e;
      L0 = L;
    }
  }
  const yl = (y - L0.y) / L0.ry;
  const xl = (x - L0.x) / L0.rx;
  const top = Math.min(...B.lobs.map((l) => l.y - l.ry));
  const g = clamp((y - top) / (bulutTaban(B, x) - top), 0, 1);
  const sl = clamp(0.75 * yl - 0.4 * xl + 0.05, 0, 1) * yumusak(-0.6, 0.15, en + 0.4);
  const s = clamp(Math.max(sl * 0.8, Math.pow(g, 1.5) * 0.82 - xl * 0.08) + (NZ.n(x * 0.03 + B.x, y * 0.05) - 0.5) * 0.14, 0, 1);
  const gx = (x - L0.x) / (L0.rx * L0.rx);
  const gy = (y - L0.y) / (L0.ry * L0.ry);
  const teg = Math.atan2(gx, -gy);
  const yat = yumusak(0.55, 0.92, g) + yumusak(0.25, -0.15, Math.hypot(xl, yl) - 0.15) * 0;
  const ta = Math.atan2(Math.sin(2 * teg) * (1 - yat), Math.cos(2 * teg) * (1 - yat) + yat * 1.0001) / 2;
  return { s, aci: ta, g };
}

const gunesNokta = (R, kay) => {

const gunesYolu = S.yol(gunesNokta(34, 0), true);
/**
 * Doğal taç yaprağı: göbekten çıkan, ortasının biraz ötesinde genişleyen, ucu hafif çentikli ya da sivrice,
 * bir yana hafifçe dönük (beş yaprak birlikte hafif bir fırıldak) biçim. Elips değil; her yaprak biraz farklı.
 */
const TAC_CACHE = new Map();
function tacYolu(c, e) {
  const key = c.x + ',' + c.y + ',' + e.aci;
  if (TAC_CACHE.has(key)) return TAC_CACHE.get(key);
  const ca = Math.cos(e.aci);
  const sa = Math.sin(e.aci);
  const h = (k) => {
    const v = Math.sin(c.x * 12.9898 + c.y * 78.233 + e.aci * 37.719 + k * 11.3) * 43758.5453;
    return v - Math.floor(v);
  };
  const L = c.r * (0.98 + h(1) * 0.12);

  const centik = h(3) < 0.6 ? 0.05 + h(4) * 0.05 : -0.03; // çentikli ya da sivrice uç
  const don = 0.1 + h(5) * 0.08; // fırıldak dönüşü
  // eksen boyunca (u: 0..1) yarı genişlik profili; sağ ve sol yan biraz farklı
  const prof = [[0.12, 0.1], [0.24, 0.42], [0.42, 0.78], [0.62, 0.98], [0.8, 0.94], [0.92, 0.7], [0.985, 0.36]];

  const sol = prof.map(([u, v]) => [u, v * (1 + (h(7) - 0.5) * 0.12)]);
  const ham = [];
  for (const [u, v] of sag) ham.push([u, v]);
  ham.push([1 - centik, 0]);
  for (let i = sol.length - 1; i >= 0; i--) ham.push([sol[i][0], -sol[i][1]]);

    const vv = v * Wm + don * Wm * u * u; // uca doğru bir yana kayar
    return [c.x + ca * u * L - sa * vv, c.y + sa * u * L + ca * vv];
  });

  const out = [];
  const n = nok.length;
  for (let i = 0; i < n; i++) {
    const p0 = nok[(i - 1 + n) % n];
    const p1 = nok[i];
    const p2 = nok[(i + 1) % n];
    const p3 = nok[(i + 2) % n];
    for (let k = 0; k < 6; k++) {
      const t = k / 6;
      const t2 = t * t;
      const t3 = t2 * t;
      const f = (a, b, cc, d) => 0.5 * (2 * b + (-a + cc) * t + (2 * a - 5 * b + 4 * cc - d) * t2 + (-a + 3 * b - 3 * cc + d) * t3);

    }
  }

  TAC_CACHE.set(key, d);
  return d;
}

  const a = (NZ.n(x * 0.0028 + 3, y * 0.006) - 0.5) * 0.26 + (NZ.n(x * 0.012, y * 0.02 + 7) - 0.5) * 0.07;

    vy += Math.sin(2 * t) * wg * 0.75;

      const ex = (x - L.x) / L.rx;
      const ey = (y - L.y) / L.ry;
      const e = 1 - (ex * ex + ey * ey);
      if (e > en) {

      vx += Math.cos(2 * t) * wb * 2.2;
      vy += Math.sin(2 * t) * wb * 2.2;

  lay.globalCompositeOperation = 'destination-out';
  lay.fillStyle = '#000';
  for (const pd of pen) lay.fill(kaymaYol(pd, -0.4, 1.0, 0.06));
  lay.restore();
  BOYA.drawImage(lay.canvas, 0, 0, W, W);
  for (const pd of pen) alan(BOYA, { d: pd, ice: 0.3, amp: 0.6, aralik: 4, aralikY: 10, boy: [16, 32], en: [5, 7], yon: () => -PI / 2, renk: (x, y, r) => oyna(r() < 0.6 ? hex('#245F42') : hex('#2E6E50'), r, 6), alfa: [0.86, 0.96], darbe: { kuru: 0.15, kil: 2 }, tohum: 55 + k });
}

// ---------------------------------------------------------------- 7. kubbe: her dilim ayrı, darbeler dilim boyunca aşağıdan yukarı
{
  const KB = S.kaburgalar(16, 60);
  const prof = S.kubbeProfili(60);
  const sol = prof.map((q) => [560 - q.r, q.y]);
  const sag = prof.map((q) => [560 + q.r, q.y]);
  const cizgiler = [sol, ...KB.map((kb) => kb.noktalar), sag];
  const bo = (i) => -PI / 2 + (PI * i) / 16;
  const r = S.rng(61);
  for (let i = 0; i < cizgiler.length - 1; i++) {
    const a = cizgiler[i];
    const b = cizgiler[i + 1];
    const d = S.yol(a.slice(0, -1).concat(b.slice(0, -1).reverse()), true);
    const gen = (y) => kubbeR(y) * (Math.sin(bo(i + 1)) - Math.sin(bo(i)));
    const gmax = gen(520);
    const serit = gmax > 26 ? 3 : gmax > 11 ? 2 : 1;
    BOYA.save();
    BOYA.clip(kaymaYol(d, 1.0, 1.3, 0.03));
    // şeritler: dilimin içinde 1–3 şerit, her şeritte aşağıdan yukarı birbirine binen darbeler
    const sira = [];
    for (let j = 0; j < serit; j++) sira.push(j);
    // ilk ince kat: dilim boyunca birkaç uzun sulu darbe (kuru uçlar kâğıda değil bu kata açılır)
    for (let j = 0; j < serit; j++) {
      const f0 = (j + 0.5) / serit;
      const pts = [];
      for (let yy = 560; yy >= 302; yy -= 4) pts.push([560 + Math.sin(bo(i + f0)) * kubbeR(yy), yy]);
      const xm = 560 + Math.sin(bo(i + f0)) * kubbeR(470);
      const bb = kubbeBilgi(xm, 470);
      guaj(BOYA, pts, clamp((gmax / serit) * 1.7, 4, 24), oyna(yesilR(clamp(bb.lamF * 0.9 + 0.05, 0, 1)), r, 6), { r, alfa: 0.6, kuru: 0.15, kil: 3, kenar: 0 });
    }
    for (const j of sira) {
      const f0 = (j + 0.5) / serit + (r() - 0.5) * (0.14 / serit);
      let y = 558 + r() * 4;
      while (y > 304) {
        const uz = (y > 420 ? 60 : 44) + r() * 60;
        const yb = Math.max(301, y - uz);
        const kay = (r() - 0.5) * (0.12 / serit);
        const pts = [];
        for (let yy = y; yy >= yb; yy -= 3) {
          const f = f0 + kay * ((y - yy) / uz);
          pts.push([560 + Math.sin(bo(i + f)) * kubbeR(yy), yy]);
        }
        if (pts.length >= 2) {
          const ym = (y + yb) / 2;
          const w = clamp((gen(ym) / serit) * 1.55, 3.5, 19);
          const xm = 560 + Math.sin(bo(i + f0)) * kubbeR(ym);
          const bb = kubbeBilgi(xm, ym);
          let v = bb.lamF * 0.72 + bb.lam * 0.28;
          if (ym > 536) v -= 0.16;
          let c = yesilR(clamp(v * 1.04 + (r() - 0.5) * 0.2, 0, 1));
          if (v > 0.62 && r() < 0.35) c = karis(c, hex('#B9DE8E'), 0.25); // ışık yanında sarımsı açık karışım
          if (v < 0.4 && r() < 0.35) c = karis(c, hex('#2F6F63'), 0.25); // gölgede serin karışım
          guaj(BOYA, pts, w, oyna(c, r, 11, 6), { r, alfa: 0.82 + r() * 0.13, kuru: 0.25 + r() * 0.35, kil: Math.max(3, Math.round(w / 2.4)), kilFark: 15 });
        }
        if (yb <= 301.5) break;
        y = yb + uz * (0.14 + r() * 0.2);
      }
    }
    BOYA.restore();
  }
  // tepe: dilimlerin birleştiği yer küçük ayrı bir alan
  alan(BOYA, { d: S.daireYolu(560, 311, 11), ice: 0, amp: 1, aralik: 6, aralikY: 6, boy: [10, 18], en: [5, 7], yon: () => -PI / 2, renk: (x, y, r) => oyna(P.yesilA, r, 5), darbe: { kuru: 0.2 }, tohum: 69 });
}

// ---------------------------------------------------------------- 8. alem: sarı guaj, sol yan okr
function alemBoya(ys) {
  ys.forEach((d, i) => {
    const kt = kutuBul(d, 2);
    const cx = (kt[0] + kt[2]) / 2;
    alan(BOYA, { d, ice: 0.5, amp: 0.4, kutu: kt, aralik: 3, aralikY: 6, boy: [6, 14], en: [3, 4.5], yon: () => -PI / 2 + 0.3, renk: (x, y, r) => oyna(x < cx - (kt[2] - kt[0]) * 0.12 ? P.okr : P.sari, r, 5), alfa: [0.85, 0.95], darbe: { kuru: 0.1, kil: 2, kenar: 0.2 }, tohum: 80 + i });
  });
}
alemBoya(Y.alem);
alemBoya(Y.minareAlem);

// bitkilerin yeri boş bırakılır: ressam arka planı bitkilerin kalem konturuna bir kıl kala boyar
BOYA.save();
BOYA.globalCompositeOperation = 'destination-out';
BOYA.fillStyle = '#000';
for (const d of Y.yapraklar) BOYA.fill(kaymaYol(d, 1.1, 0.7, 0.05));
for (const d of Y.tomurcuklar) BOYA.fill(kaymaYol(d, 0.6, 0.6, 0.06));
for (const c of S.bitki.cicekler) for (const e of S.tacYapraklari(c)) BOYA.fill(kaymaYol(tacYolu(c, e), 0.9, 0.7, 0.05));
for (const sp of S.bitki.saplar) cizgiNokta(BOYA, sp, { w: 3, renk: '#000', titreme: 0.5, frek: 0.05 });
BOYA.restore();
bindir(BOYA);

// ---------------------------------------------------------------- 9. bitkiler
for (const s of S.bitki.saplar) {
  const pts = yenidenOrnekle(s, 2);
  for (let i = 0; i < pts.length - 1; i += 26) {
    const parca = pts.slice(i, Math.min(pts.length, i + 30));
    if (parca.length > 2) guaj(ctx, parca, 3.4, oyna(P.yesilK, RD, 8), { alfa: 0.88, kil: 2, kuru: 0.15, titreme: 0.3, kenar: 0.2 });
  }
}
// yapraklar: damarın iki yanında yarı örtücü yassı darbeler; ışık yanı açık, gölge yanı koyu. Boya kalem konturuna
// bir kıl kala durur: yer yer çizginin üstüne biner, yer yer çizgiyle boya arasında ince bir kâğıt aralığı kalır.
S.bitki.yapraklar.forEach((yp, i) => {
  const ca = Math.cos(yp.aci);
  const sa = Math.sin(yp.aci);
  const nx = -sa;
  const ny = ca;
  const isikYan = nx * ISIK[0] + ny * ISIK[1] > 0 ? 1 : -1;
  const koyu = yp.uzunluk > 50;
  const L = yp.uzunluk;
  const Wy = L * yp.genislik * 0.75;
  const r = S.rng(100 + i);
  ctx.save();
  ctx.clip(kaymaYol(S.yaprakYolu(yp), Math.min(0.9, Wy * 0.07), Math.min(1.9, Wy * 0.14), 0.03));
  for (const yan of [-1, 1]) {
    const acik = yan === isikYan;
    const c0 = acik ? (koyu ? karis(P.yesil, P.yesilA, 0.35) : P.yesilA) : koyu ? karis(P.yesilK, P.yesil, 0.35) : P.yesil;
    // iki darbe: biri damardan uca uzun, biri kısa ve biraz kayık; aynı karışımın iki tonu
    for (let k = 0; k < 2; k++) {
      const ofs = yan * Wy * (k ? 0.58 : 0.34) * (1 + (r() - 0.5) * 0.15);
      const u0 = k ? 0.1 + r() * 0.1 : -0.06;
      const u1 = k ? 0.7 + r() * 0.2 : 1.12;
      const pts = [];
      for (let u = u0; u <= u1; u += 0.06) {
        const bel = Math.sin(PI * clamp(u, 0, 1)) * 0.9 + 0.1;
        pts.push([yp.x + ca * u * L + nx * ofs * bel, yp.y + sa * u * L + ny * ofs * bel]);
      }
      const c = k ? karis(c0, acik ? P.yesilI : P.yesilK, 0.22) : c0;
      guaj(ctx, pts, Wy * (k ? 0.62 : 0.82), oyna(c, r, 10, 5), { r, alfa: k ? 0.66 + r() * 0.12 : 0.78 + r() * 0.1, kuru: 0.3 + r() * 0.25, kil: 4, kilFark: 16, egik: 0, kenar: 0.22 });
    }
  }
  ctx.restore();
});
S.bitki.tomurcuklar.forEach((t, i) => {
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  if (i >= 8) {
    const x0 = t.x - ca * t.r * 0.8;
    const y0 = t.y - sa * t.r * 0.8;
    guaj(ctx, [[x0 + 1, y0], [x0 + 3, y0 + 12], [x0 + 2, y0 + 24]], 2.6, P.yesil, { alfa: 0.88, kil: 0, kuru: 0.1, kenar: 0.2 });
  }
  const d = S.tomurcukYolu(t);
  ctx.save();
  ctx.clip(kaymaYol(d, 0.8, 0.5));
  guaj(ctx, [[t.x - ca * t.r, t.y - sa * t.r], [t.x + ca * t.r * 1.6, t.y + sa * t.r * 1.6]], t.r * 1.6, hex('#FFFFFF'), { alfa: 0.9, kil: 2, kilFark: 6, kuru: 0.2 });
  guaj(ctx, [[t.x - ca * t.r * 1.1, t.y - sa * t.r * 1.1], [t.x + ca * t.r * 0.15, t.y + sa * t.r * 0.15]], t.r * 1.7, P.yesilA, { alfa: 0.88, kil: 2, kuru: 0.15 });
  ctx.restore();
});
// çiçekler: kalem konturunun içinde beyaz guaj taç yapraklar, göbeğe yakın soluk mavi-gri gölge, sarı göbek
S.bitki.cicekler.forEach((c, ci) => {
  const ts = S.tacYapraklari(c);
  ts.sort((a, b) => Math.cos(a.aci - ISIK_ACI) - Math.cos(b.aci - ISIK_ACI));
  // çiçeğin yeri yaprak boyanırken boş bırakılmıştı: önce kâğıt (ve altındaki kalem çizgisi) geri gelir
  {
    const yer = new Path2D();
    for (const e of ts) yer.addPath(kaymaYol(tacYolu(c, e), -0.2, 0.6, 0.05));
    ctx.save();
    ctx.clip(yer);
    ctx.fillStyle = rgba(P.kagit);
    ctx.fillRect(c.x - c.r * 1.2, c.y - c.r * 1.2, c.r * 2.4, c.r * 2.4);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(KAL.canvas, 0, 0);
    ctx.restore();
  }
  for (const e of ts) {
    const isik = Math.cos(e.aci - ISIK_ACI);
    alan(ctx, {
      d: tacYolu(c, e),
      ice: 0.6,
      amp: 1.2,
      fr: 0.05,
      kutu: [e.cx - e.rx - 3, e.cy - e.rx - 3, e.cx + e.rx + 3, e.cy + e.rx + 3],
      aralik: Math.max(6, c.r * 0.16),
      aralikY: Math.max(6, c.r * 0.16),
      boy: [c.r * 0.4, c.r * 0.66],
      en: [Math.max(5, c.r * 0.17), Math.max(7, c.r * 0.24)],
      yon: (x, y) => Math.atan2(y - c.y, x - c.x),
      renk: (x, y, r) => {
        const rr = Math.hypot(x - c.x, y - c.y) / c.r;
        const g = clamp(0.28 - rr * 0.38 + (1 - isik) * 0.12, 0, 1);
        return oyna(karis(hex('#FFFFFF'), P.griMavi, g), r, 3);
      },
      alfa: [0.85, 0.96],
      darbe: { kil: 3, kilFark: 8, kuru: 0.3, kenar: 0.2 },
      tohum: 200 + ci * 7 + Math.round(e.aci * 5),
    });
  }
  // gölge: gölge yanındaki taç yapraklarında, göbeğin çevresinde enine yatırılmış tek bir yarı örtücü mavi-gri darbe
  for (const e of ts) {
    const isik = Math.cos(e.aci - ISIK_ACI);
    if (isik > 0.35) continue;
    const kk = (1 - isik) / 2;
    const rr0 = c.r * (0.36 + RD() * 0.08);
    const yay = 0.42 + kk * 0.2;
    const pts = [];
    for (let a = e.aci - yay; a <= e.aci + yay + 1e-6; a += 0.08) {
      const rr = rr0 + c.r * 0.06 * Math.sin((a - e.aci) * 3 + ci);
      pts.push([c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr]);
    }
    if (RD() < 0.5) pts.reverse();
    ctx.save();
    ctx.clip(kaymaYol(tacYolu(c, e), 0.8, 0.6, 0.05));
    guaj(ctx, pts, c.r * (0.24 + kk * 0.14), oyna(karis(hex('#C9D4E1'), hex('#A9B9CE'), kk), RD, 4), { alfa: 0.5 + kk * 0.22, kuru: 0.35, kil: 4, kilFark: 7, kenar: 0.12 });
    ctx.restore();
  }
  // göbek: önce düz sarı bir kat, sonra küçük yuvarlak fırça ucuyla sarı ve gölge yanında okr dokunuşlar
  alan(ctx, { d: S.daireYolu(c.x, c.y, c.r * 0.2), ice: 0.6, amp: 0.5, aralik: 5, aralikY: 5, boy: [c.r * 0.3, c.r * 0.4], en: [5, 7], yon: () => 0.15, renk: (x, y, r) => oyna(P.sari, r, 4), alfa: [0.9, 0.96], darbe: { kil: 1, kuru: 0.05, kenar: 0.15 }, tohum: 300 + ci });
  alan(ctx, { d: S.daireYolu(c.x, c.y, c.r * 0.2), ice: 0.8, amp: 0.5, aralik: 2.6, aralikY: 2.6, boy: [c.r * 0.07, c.r * 0.12], en: [2.6, 3.8], yon: () => RD() * PI, renk: (x, y, r) => (x - c.x - (y - c.y) < -c.r * (0.02 + r() * 0.12) ? oyna(P.okr, r, 6) : r() < 0.5 ? oyna(karis(P.sari, hex('#F6E08A'), r()), r, 5) : null), alfa: [0.75, 0.92], darbe: { kil: 0, kuru: 0.05, kenar: 0.2 }, tohum: 340 + ci });
});

// ---------------------------------------------------------------- 10. grafit yarı örtücü guajın altından seçilir
// açık renklerin ve kâğıdın üstünde çizgi tam görünür; koyu yeşilin altında yalnızca gümüşi bir iz kalır
// ---------------------------------------------------------------- 11. kâğıt: düzgün beyaz, ince diş (açık yerlerde seçilir)
{
  const nz = gurultu(77);
  const kd = KAL.getImageData(0, 0, W * OL, W * OL).data;
  pikselGecis(ctx, (d, i, x, y) => {
    const ka = kd[i + 3];
    if (ka) {
      const l0 = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
      const A = 0.8 * (0.26 + 0.74 * Math.pow(l0, 1.4)) * (ka / 255);
      d[i] *= 1 - A * (1 - kd[i] / 255);
      d[i + 1] *= 1 - A * (1 - kd[i + 1] / 255);
      d[i + 2] *= 1 - A * (1 - kd[i + 2] / 255);
    }
    const l = (d[i] + d[i + 1] + d[i + 2]) / 765;
    const dis = (nz.n(x * 0.13, y * 0.13) - 0.5) * 7 * (0.4 + l * 0.6);
    const g = (karma(x >> 1, y >> 1, 11) - 0.5) * 3 + dis;
    d[i] = clamp(d[i] + g, 0, 255);
    d[i + 1] = clamp(d[i + 1] + g, 0, 255);
    d[i + 2] = clamp(d[i + 2] + g, 0, 255);
  });
}

SAHNE.hazir();

</script>
