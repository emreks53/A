<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-111 Kuru Çiçek Kolajı — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f6f1e6; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-111 Kuru Çiçek Kolajı (oshibana) — sahne preslenmiş kuru çiçek, taç yaprak ve yapraklardan kurulur:
// gök mavi ortanca çiçekçikleri, bulutlar beyaz ortanca ve gül yaprakları, güneş preslenmiş sarı bir
// koreopsis; kubbe pul pul dizilmiş yeşil yapraklar, kaburgalar ince kuru saplar; kaide ve minare
// fildişi gül yapraklarından kesilmiş parçalar; pencereler koyu menekşe yaprağı; alemler sarı solucanotu
// düğmeleri. Önde preslenmiş beyaz çiçekler, eğrelti, unutmabeni ve tomurcuklar. Açık el yapımı kâğıt.
(function () {
  const S = SAHNE;
  const K = 2;
  const W2 = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  const R = S.rng(1111);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(11), n2 = gurultu(12), n3 = gurultu(13);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.27 * n(x * 2.03, y * 2.03) + 0.15 * n(x * 4.1, y * 4.1) + 0.08 * n(x * 8.3, y * 8.3);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const karis = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const rgba = (c, a) => `rgba(${Math.round(clamp(c[0], 0, 255))},${Math.round(clamp(c[1], 0, 255))},${Math.round(clamp(c[2], 0, 255))},${a == null ? 1 : a})`;
  const acik = (c, t) => karis(c, [255, 255, 255], t);
  const koyu = (c, t) => karis(c, [0, 0, 0], t);
  // doğal renk sapması: parlaklık ve hafif ton kayması
  function sap(c, l, h) {
    const k = (R() - 0.5) * 2 * l;
    const hh = (R() - 0.5) * 2 * (h || 0);
    return [c[0] + k + hh, c[1] + k, c[2] + k - hh];
  }
  function katman() {
    const c = S.yeniTuval(W2, W2);
    const g = c.getContext('2d');
    g.setTransform(K, 0, 0, K, 0, 0);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    return { c, g };
  }
  // katmanı gölgesiyle ana tuvale basar (preslenmiş parça: çok ince, yumuşak gölge, sola-aşağı)
  function bas(L, o) {
    o = o || {};
    const sh = S.yeniTuval(W2, W2);
    const sg = sh.getContext('2d');
    sg.drawImage(L.c, 0, 0);
    sg.globalCompositeOperation = 'source-in';
    sg.fillStyle = o.renk || 'rgb(92,76,52)';
    sg.fillRect(0, 0, W2, W2);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = o.alfa == null ? 0.22 : o.alfa;
    ctx.filter = `blur(${(o.bulanik || 2.2) * K}px)`;
    ctx.drawImage(sh, (o.dx == null ? -1.4 : o.dx) * K, (o.dy == null ? 1.8 : o.dy) * K);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.drawImage(L.c, 0, 0);
    ctx.restore();
  }

  // doğal renk dalgalanması: preslenmiş yaprağın içindeki açık/koyu benekler (yalnız parçaların üstüne)
  const BENEK = (function () {
    const c = S.yeniTuval(1024, 1024), x = c.getContext('2d');
    const im = x.createImageData(1024, 1024), d = im.data;
    for (let j = 0; j < 1024; j++) for (let i = 0; i < 1024; i++) {
      const v = fbm(n3, i / 11, j / 11) - 0.5 + 0.35 * (n1(i / 3.2 + 50, j / 3.2) - 0.5);
      const o = (j * 1024 + i) * 4;
      if (v > 0) { d[o] = 255; d[o + 1] = 255; d[o + 2] = 235; } else { d[o] = 40; d[o + 1] = 50; d[o + 2] = 20; }
      d[o + 3] = Math.min(255, Math.abs(v) * 520);
    }
    x.putImageData(im, 0, 0);
    return c;
  })();
  function benek(L, guc, kirp) {
    L.g.save();
    if (kirp) L.g.clip(kirp);
    L.g.setTransform(1, 0, 0, 1, 0, 0);
    L.g.globalCompositeOperation = 'source-atop';
    L.g.globalAlpha = guc;
    L.g.drawImage(BENEK, 0, 0, W2, W2);
    L.g.restore();
  }

  // ------------------------------------------------------------ preslenmiş taç yaprak (kutupsal biçim)
  // o: x,y (dip), a (yön), L (boy), phi (yarı açı), e (uç yuvarlaklığı), centik, dis (diş sayısı), disD,
  //    renk [dip, orta, uç], alfa, damar (adet), damarA (açık damar alfa), damarK (koyu damar alfa), kenar
  function tac(g, o) {
    const n = o.n || 30;
    const tohum = R() * 200;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const s = -1 + (2 * i) / n;
      let rr = Math.pow(Math.max(0, Math.cos((Math.PI / 2) * s)), o.e == null ? 0.45 : o.e);
      if (o.centik) rr *= 1 - o.centik * Math.exp(-((s / 0.16) ** 2));
      if (o.dis) rr *= 1 - (o.disD || 0.06) * (0.5 - 0.5 * Math.cos(o.dis * Math.PI * (s + 1))) * (Math.abs(s) < 0.7 ? 1 : 0.3);
      rr *= 1 + (o.dalga == null ? 0.07 : o.dalga) * (n1(tohum + s * 2.6, tohum * 0.3) - 0.5) * 2;
      rr *= 1 + (o.asim || 0) * s;
      const r = o.L * rr;
      const an = o.a + s * o.phi;
      pts.push([o.x + Math.cos(an) * r, o.y + Math.sin(an) * r, r]);
    }
    const yol = new Path2D();
    yol.moveTo(o.x, o.y);
    for (const p of pts) yol.lineTo(p[0], p[1]);
    yol.closePath();
    const c = o.renk;
    const gr = g.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.L * 1.02);
    gr.addColorStop(0, rgba(c[0], 1));
    gr.addColorStop(o.ortaT || 0.45, rgba(c[1], 1));
    gr.addColorStop(1, rgba(c[2], 1));
    g.save();
    g.globalAlpha = o.alfa == null ? 0.86 : o.alfa;
    g.fillStyle = gr;
    g.fill(yol);
    g.globalAlpha = 1;
    // damarlar: dipten yelpaze gibi açılan ince, saydam çizgiler
    const nd = o.damar == null ? 7 : o.damar;
    if (nd > 0) {
      g.save();
      g.clip(yol);
      for (let k = 0; k < nd; k++) {
        const s = nd === 1 ? 0 : -0.82 + (1.64 * k) / (nd - 1) + (R() - 0.5) * 0.08;
        const idx = Math.round(((s + 1) / 2) * n);
        const rr = pts[idx][2] * (0.86 + R() * 0.1);
        const an = o.a + s * o.phi;
        const ax = o.x + Math.cos(o.a + s * o.phi * 0.45) * rr * 0.5, ay = o.y + Math.sin(o.a + s * o.phi * 0.45) * rr * 0.5;
        const bx = o.x + Math.cos(an) * rr, by = o.y + Math.sin(an) * rr;
        g.beginPath();
        g.moveTo(o.x, o.y);
        g.quadraticCurveTo(ax, ay, bx, by);
        g.strokeStyle = `rgba(255,255,255,${o.damarA == null ? 0.32 : o.damarA})`;
        g.lineWidth = o.damarW || 0.7;
        g.stroke();
        if (o.damarK) {
          g.strokeStyle = rgba(koyu(c[1], 0.35), o.damarK);
          g.lineWidth = (o.damarW || 0.7) * 0.6;
          g.save();
          g.translate(0.5, 0.4);
          g.stroke();
          g.restore();
        }
      }
      g.restore();
    }
    if (o.kenar !== 0) {
      g.strokeStyle = rgba(koyu(c[2], 0.25), o.kenar == null ? 0.22 : o.kenar);
      g.lineWidth = 0.6;
      g.stroke(yol);
    }
    g.restore();
    return yol;
  }

  // ------------------------------------------------------------ preslenmiş yaprak (orta damarlı)
  // o: x,y (sap ucu), a, L, W, p, q (biçim), dis (tırtık sayısı), disD, renk [dip, orta, uç], alfa, damar
  function yaprak(g, o) {
    const n = o.n || 26;
    const ca = Math.cos(o.a), sa = Math.sin(o.a);
    const P = (u, v) => [o.x + u * ca - v * sa, o.y + u * sa + v * ca];
    const tohum = R() * 200;
    const f = (t, yan) => {
      let v = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(t, o.p || 0.72))), o.q || 0.85);
      if (o.dis) v *= 1 - (o.disD || 0.12) * ((t * o.dis + (yan > 0 ? 0 : 0.5)) % 1);
      v *= 1 + 0.06 * (n2(tohum + t * 3, yan * 5) - 0.5) * 2;
      return v * o.W * (yan > 0 ? 1 : 1 - (o.asim || 0));
    };
    const yol = new Path2D();
    const s0 = P(0, 0);
    yol.moveTo(s0[0], s0[1]);
    for (let i = 1; i <= n; i++) { const t = i / n; const p = P(t * o.L, f(t, 1)); yol.lineTo(p[0], p[1]); }
    for (let i = n - 1; i >= 1; i--) { const t = i / n; const p = P(t * o.L, -f(t, -1)); yol.lineTo(p[0], p[1]); }
    yol.closePath();
    const c = o.renk;
    const b = P(o.L, 0);
    const gr = g.createLinearGradient(s0[0], s0[1], b[0], b[1]);
    gr.addColorStop(0, rgba(c[0]));
    gr.addColorStop(0.5, rgba(c[1]));
    gr.addColorStop(1, rgba(c[2]));
    g.save();
    g.globalAlpha = o.alfa == null ? 0.93 : o.alfa;
    g.fillStyle = gr;
    g.fill(yol);
    g.globalAlpha = 1;
    g.save();
    g.clip(yol);
    // yaprağın iki yarısı ışığı farklı tutar
    g.fillStyle = `rgba(255,255,255,${0.05 + R() * 0.07})`;
    g.beginPath();
    const q0 = P(0, 0), q1 = P(o.L, 0), q2 = P(o.L, o.W * 1.2), q3 = P(0, o.W * 1.2);
    g.moveTo(q0[0], q0[1]); g.lineTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.lineTo(q3[0], q3[1]);
    g.fill();
    // yan damarlar
    const nd = o.damar == null ? Math.max(3, Math.round(o.L / 7)) : o.damar;
    const dA = o.damarA == null ? 0.3 : o.damarA;
    g.strokeStyle = `rgba(250,255,225,${dA})`;
    g.lineWidth = o.damarW || 0.6;
    for (let k = 1; k <= nd; k++) {
      const t = (k / (nd + 1)) * 0.92;
      for (const yan of [1, -1]) {
        const a0 = P(t * o.L, 0);
        const t2 = Math.min(0.98, t + 0.16);
        const a1 = P((t + t2) * 0.5 * o.L, yan * f(t, yan) * 0.55);
        const a2 = P(t2 * o.L, yan * f(t2, yan) * 0.9);
        g.beginPath(); g.moveTo(a0[0], a0[1]); g.quadraticCurveTo(a1[0], a1[1], a2[0], a2[1]); g.stroke();
      }
    }
    // orta damar
    const m1 = P(o.L * 0.96, 0);
    g.strokeStyle = `rgba(245,250,215,${dA + 0.18})`;
    g.lineWidth = Math.max(0.7, o.W * 0.07);
    g.beginPath(); g.moveTo(s0[0], s0[1]); g.lineTo(m1[0], m1[1]); g.stroke();
    g.restore();
    g.strokeStyle = rgba(koyu(c[1], 0.3), 0.28);
    g.lineWidth = 0.6;
    g.stroke(yol);
    g.restore();
    return yol;
  }

  // ------------------------------------------------------------ kâğıt (açık, el yapımı)
  (function kagit() {
    const im = ctx.createImageData(W2, W2);
    const d = im.data;
    for (let j = 0; j < W2; j++) {
      for (let i = 0; i < W2; i++) {
        const x = i / K, y = j / K;
        const m = fbm(n1, x / 90, y / 90) - 0.5;
        const ince = n2(x / 3.1, y / 3.1) - 0.5;
        const v = 6 * m + 5 * ince;
        const o = (j * W2 + i) * 4;
        d[o] = 247 + v; d[o + 1] = 242 + v; d[o + 2] = 231 + v * 1.1; d[o + 3] = 255;
      }
    }
    ctx.putImageData(im, 0, 0);
    // kâğıt lifleri
    ctx.save();
    for (let k = 0; k < 2600; k++) {
      const x = R() * 1024, y = R() * 1024, a = R() * Math.PI * 2, L = 3 + R() * 12;
      ctx.strokeStyle = R() < 0.6 ? `rgba(255,255,255,${0.35 + R() * 0.3})` : `rgba(150,130,100,${0.06 + R() * 0.08})`;
      ctx.lineWidth = 0.4 + R() * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + Math.cos(a + 0.7) * L * 0.5, y + Math.sin(a + 0.7) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L);
      ctx.stroke();
    }
    ctx.restore();
  })();

  // ------------------------------------------------------------ gök renk alanı
  const GOK = [
    [0, hex('#7EA6DC')],
    [0.32, hex('#97BBE6')],
    [0.62, hex('#B9D2F0')],
    [0.85, hex('#D9E3F2')],
    [1, hex('#F1E2EA')],
  ];
  function gokRenk(x, y) {
    const t = clamp(y / 800, 0, 1);
    let c = GOK[0][1];
    for (let i = 0; i < GOK.length - 1; i++) {
      if (t >= GOK[i][0] && t <= GOK[i + 1][0]) { c = karis(GOK[i][1], GOK[i + 1][1], (t - GOK[i][0]) / (GOK[i + 1][0] - GOK[i][0])); break; }
    }
    const dg = Math.hypot(x - 880, y - 140);
    const gt = clamp(1 - dg / 290, 0, 1);
    c = karis(c, hex('#F8EDC4'), gt * gt * 0.92);
    return c;
  }

  // ------------------------------------------------------------ gök: ortanca çiçekçikleri
  const BULUT = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
  const bulutta = (x, y) => {
    let m = 0;
    for (const [bx, by, bs] of BULUT) {
      const dx = (x - bx) / (100 * bs), dy = (y - by) / (34 * bs);
      m = Math.max(m, 1 - (dx * dx + dy * dy));
    }
    return m;
  };
  function ortanca(g, x, y, s, c, o) {
    o = o || {};
    const a0 = R() * Math.PI;
    const dort = R() < 0.82 ? 4 : 5;
    for (let k = 0; k < dort; k++) {
      const a = a0 + (k * Math.PI * 2) / dort + (R() - 0.5) * 0.25;
      const cc = sap(c, 10, 8);
      tac(g, {
        x, y, a, L: s * (0.85 + R() * 0.3), phi: (Math.PI / dort) * (0.9 + R() * 0.15), e: 0.38, n: 22,
        renk: [acik(cc, 0.35), cc, koyu(cc, 0.06)], alfa: o.alfa || 0.84, damar: 5, damarA: 0.3, damarK: 0.12, ortaT: 0.55,
        kenar: 0.18, dalga: 0.1,
      });
    }
    g.fillStyle = rgba(o.orta || acik(c, 0.55), 0.95);
    g.beginPath(); g.arc(x, y, s * 0.13, 0, 7); g.fill();
    g.fillStyle = rgba(koyu(c, 0.35), 0.5);
    g.beginPath(); g.arc(x, y, s * 0.05, 0, 7); g.fill();
  }
  {
    const L = katman();
    const g = L.g;
    // alt kat: iri, soluk delphinium yaprakları (göğün yumuşak zemini)
    for (let k = 0; k < 760; k++) {
      const x = -30 + R() * 1084, y = -30 + R() * 860;
      const c = sap(gokRenk(x, y), 6, 5);
      tac(g, {
        x, y, a: R() * Math.PI * 2, L: 36 + R() * 30, phi: 0.6 + R() * 0.3, e: 0.35, n: 30,
        renk: [acik(c, 0.2), acik(c, 0.06), c], alfa: 0.62, damar: 9, damarA: 0.24, damarK: 0.06, kenar: 0.1,
      });
    }
    // üst kat: dört yapraklı ortanca çiçekçikleri; aşağıda ve bulutlarda seyrekleşir
    const hucre = 33;
    for (let j = -1; j < 800 / hucre + 1; j++) {
      for (let i = -1; i < 1024 / hucre + 1; i++) {
        const x = (i + 0.5 + (R() - 0.5) * 0.9) * hucre, y = (j + 0.5 + (R() - 0.5) * 0.9) * hucre;
        const yog = 1 - clamp((y - 380) / 520, 0, 0.75) - bulutta(x, y) * 0.9 - clamp(1 - Math.hypot(x - 880, y - 140) / 120, 0, 1);
        if (R() > yog) continue;
        let c = gokRenk(x, y);
        const tur = R();
        if (tur < 0.22) c = karis(c, hex('#B7A6E0'), 0.45); // menekşemsi
        else if (tur < 0.34) c = karis(c, hex('#8FC7D9'), 0.4); // turkuaza çalan
        ortanca(g, x, y, 15 + R() * 6, karis(c, koyu(c, 0.1), 0.6));
      }
    }
    benek(L, 0.12);
    bas(L, { alfa: 0.16, bulanik: 1.6 });
  }

  // ------------------------------------------------------------ bulutlar (beyaz ortanca ve gül yaprakları) ve güneş
  {
    const L = katman();
    const g = L.g;
    for (const [bx, by, bs] of BULUT) {
      const adet = Math.round(70 * bs);
      // gül yaprakları: bulutun gövdesi
      for (let k = 0; k < adet * 0.35; k++) {
        const a = R() * Math.PI * 2, rr = Math.sqrt(R());
        const x = bx + Math.cos(a) * rr * 88 * bs, y = by + Math.sin(a) * rr * 26 * bs;
        const c = sap(hex('#FBF8F3'), 4, 3);
        tac(g, { x, y, a: R() * Math.PI * 2, L: (16 + R() * 12) * bs, phi: 0.95, e: 0.3, n: 26, renk: [hex('#F1EDE8'), c, acik(c, 0.4)], alfa: 0.9, damar: 9, damarA: 0.5, damarK: 0.08, kenar: 0.2 });
      }
      // beyaz ortanca çiçekçikleri
      for (let k = 0; k < adet; k++) {
        const a = R() * Math.PI * 2, rr = Math.sqrt(R());
        const x = bx + Math.cos(a) * rr * 96 * bs, y = by + Math.sin(a) * rr * 30 * bs - 4;
        const c = sap(karis(hex('#FFFFFF'), hex('#E7EEE0'), R() * 0.6), 5, 2);
        ortanca(g, x, y, (8 + R() * 3.5) * Math.sqrt(bs), c, { alfa: 0.92, orta: hex('#E9EFC8') });
      }
    }
    // güneş: preslenmiş koreopsis
    const gx = 880, gy = 140;
    // ışıltı: soluk sarı küçük yapraklar
    for (let k = 0; k < 120; k++) {
      const a = R() * Math.PI * 2, rr = 70 + R() * 75;
      const x = gx + Math.cos(a) * rr, y = gy + Math.sin(a) * rr;
      const c = sap(karis(hex('#FCEFB4'), hex('#FFF8DE'), R()), 5, 3);
      tac(g, { x, y, a: a + (R() - 0.5) * 0.8, L: 12 + R() * 9, phi: 0.6, e: 0.4, renk: [c, c, acik(c, 0.3)], alfa: 0.62, damar: 5, damarA: 0.35, kenar: 0.1 });
    }
    const isin = 14;
    for (let k = 0; k < isin; k++) {
      const a = (k / isin) * Math.PI * 2 + 0.1 + (R() - 0.5) * 0.08;
      const c = sap(hex('#F8C932'), 6, 4);
      tac(g, {
        x: gx + Math.cos(a) * 6, y: gy + Math.sin(a) * 6, a, L: 54 + R() * 6, phi: 0.2, e: 0.35, centik: 0.07, dis: 3, disD: 0.09, n: 36,
        renk: [hex('#E07A1F'), c, acik(c, 0.15)], ortaT: 0.3, alfa: 0.9, damar: 6, damarA: 0.3, damarK: 0.15, kenar: 0.3,
      });
    }
    const gc = g.createRadialGradient(gx - 3, gy - 3, 1, gx, gy, 18);
    gc.addColorStop(0, '#9A5A1E'); gc.addColorStop(0.7, '#B8721F'); gc.addColorStop(1, '#8E4E17');
    g.fillStyle = gc;
    g.beginPath(); g.arc(gx, gy, 17, 0, 7); g.fill();
    for (let k = 0; k < 140; k++) {
      const a = R() * Math.PI * 2, rr = Math.sqrt(R()) * 16;
      g.fillStyle = R() < 0.5 ? 'rgba(250,200,90,0.75)' : 'rgba(70,35,10,0.5)';
      g.beginPath(); g.arc(gx + Math.cos(a) * rr, gy + Math.sin(a) * rr, 0.7 + R() * 0.8, 0, 7); g.fill();
    }
    bas(L, { alfa: 0.2, bulanik: 1.8 });
  }

  // ------------------------------------------------------------ yer: preslenmiş açık saman otları
  {
    const L = katman();
    const g = L.g;
    // kum rengi zemin: yatık serilmiş, damarlı açık şeftali-bej gül yaprakları
    for (let k = 0; k < 420; k++) {
      const x = -30 + R() * 1084, y = 800 + 10 + Math.pow(R(), 0.9) * 230;
      const c = sap(karis(hex('#EBCFA0'), hex('#F2DDBB'), R()), 7, 4);
      tac(g, { x, y, a: (R() < 0.5 ? 0 : Math.PI) + (R() - 0.5) * 0.7, L: 30 + R() * 22, phi: 0.75 + R() * 0.25, e: 0.3, n: 28, renk: [koyu(c, 0.06), c, acik(c, 0.2)], alfa: 0.82, damar: 10, damarA: 0.4, damarK: 0.08, kenar: 0.16 });
    }
    // yer çizgisi boyunca ince saman sapları ve tohumlu yabani otlar
    for (let k = 0; k < 70; k++) {
      const x = R() * 1024, y = 806 + R() * 26;
      const a = -Math.PI / 2 + (R() - 0.5) * 0.7, Lb = 24 + R() * 30;
      const c = sap(hex('#C9B27A'), 10, 4);
      g.strokeStyle = rgba(c, 0.9); g.lineWidth = 1;
      const ex = x + Math.cos(a) * Lb, ey = y + Math.sin(a) * Lb;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * Lb * 0.5 + 4, y + Math.sin(a) * Lb * 0.5, ex, ey); g.stroke();
      for (let m = 0; m < 6; m++) {
        const t = 0.55 + m * 0.08;
        const px = x + (ex - x) * t, py = y + (ey - y) * t;
        for (const yan of [1, -1]) tac(g, { x: px, y: py, a: a + yan * 0.45, L: 4.5, phi: 0.35, e: 0.6, n: 10, renk: [koyu(c, 0.1), c, acik(c, 0.2)], alfa: 0.95, damar: 0, kenar: 0.3 });
      }
    }
    bas(L, { alfa: 0.12, bulanik: 1.4 });
  }

  // ------------------------------------------------------------ kesilmiş parça yardımcıları
  // bölgeyi kırparak içini yapraklarla doldurur, kesik kenarı ince ve hafif koyu bir çizgiyle belirtir
  function kesik(g, yol, ciz, kenarRenk) {
    g.save();
    g.clip(yol);
    ciz();
    g.restore();
    g.strokeStyle = kenarRenk || 'rgba(120,100,70,0.3)';
    g.lineWidth = 0.8;
    g.stroke(yol);
  }
  const dikd = (x1, y1, x2, y2) => { const p = new Path2D(); p.rect(x1, y1, x2 - x1, y2 - y1); return p; };
  // fildişi gül yaprakları: x1..x2 arasında soldan sağa açılan ton (sol gölge, sağ ışık)
  function gulYapraklari(g, x1, y1, x2, y2, boy, sik) {
    const w = x2 - x1, h = y2 - y1;
    const adet = Math.ceil((w * h) / (boy * boy) * (sik || 2.6)) + 4;
    // altta bütün bir fildişi yaprak katı: aralıklardan arkadaki gök görünmesin
    const ga = g.createLinearGradient(x1, 0, x2, 0);
    ga.addColorStop(0, '#E6D8BC'); ga.addColorStop(1, '#F8F1E2');
    g.fillStyle = ga;
    g.fillRect(x1 - 2, y1 - 2, w + 4, h + 4);
    for (let k = 0; k < adet; k++) {
      const x = x1 - boy * 0.4 + R() * (w + boy * 0.8), y = y1 - boy * 0.4 + R() * (h + boy * 0.8);
      const t = clamp((x - x1) / w, 0, 1);
      let c = karis(hex('#E3D3B4'), hex('#FBF5E9'), Math.pow(t, 0.7));
      if (R() < 0.18) c = karis(c, hex('#F6E1DC'), 0.5); // pembeye çalan
      c = sap(c, 6, 3);
      tac(g, { x, y, a: R() * Math.PI * 2, L: boy * (0.75 + R() * 0.5), phi: 0.9 + R() * 0.3, e: 0.28, n: 30, renk: [koyu(c, 0.04), c, acik(c, 0.25)], alfa: 0.9, damar: 11, damarA: 0.45, damarK: 0.07, kenar: 0.16 });
    }
  }
  // koyu menekşe (hercai) yaprağı parçası: pencereler
  function menekse(g, yol, cx, cy, boy) {
    kesik(g, yol, () => {
      for (let k = 0; k < 3; k++) {
        const c = sap(karis(hex('#5A2A4E'), hex('#7B3E62'), R()), 8, 6);
        tac(g, { x: cx + (R() - 0.5) * boy * 0.3, y: cy + boy * 1.08, a: -Math.PI / 2 + (R() - 0.5) * 0.35, L: boy * 1.3, phi: 0.62, e: 0.25, renk: [hex('#3C1A36'), c, acik(c, 0.14)], ortaT: 0.5, alfa: 0.96, damar: 7, damarA: 0.2, damarK: 0, kenar: 0 });
      }
    }, 'rgba(60,30,50,0.35)');
  }
  // solucanotu (tansy) düğmesi: sarı küre
  function dugme(g, x, y, r) {
    const gr = g.createRadialGradient(x + r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
    gr.addColorStop(0, '#FFE16A'); gr.addColorStop(0.65, '#F2BE2C'); gr.addColorStop(1, '#C98E17');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    const adet = Math.round(r * r * 1.4);
    for (let k = 0; k < adet; k++) {
      const a = R() * Math.PI * 2, rr = Math.sqrt(R()) * r * 0.92;
      g.fillStyle = R() < 0.55 ? 'rgba(255,240,150,0.7)' : 'rgba(150,95,10,0.4)';
      g.beginPath(); g.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, Math.max(0.35, r * 0.07), 0, 7); g.fill();
    }
    g.strokeStyle = 'rgba(140,90,15,0.4)'; g.lineWidth = 0.6;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  }
  function sariYaprak(g, yol, x1, x2, y1, y2) {
    kesik(g, yol, () => {
      const adet = Math.max(2, Math.round(((x2 - x1) * (y2 - y1)) / 120));
      for (let k = 0; k < adet; k++) {
        const c = sap(hex('#F5C537'), 6, 4);
        tac(g, { x: x1 + R() * (x2 - x1), y: y2 + 2, a: -Math.PI / 2 + (R() - 0.5) * 1.2, L: (y2 - y1) * 1.4 + 6, phi: 0.6, e: 0.3, renk: [hex('#E39A1E'), c, acik(c, 0.25)], alfa: 0.95, damar: 6, damarA: 0.35, kenar: 0 });
      }
    }, 'rgba(150,95,15,0.45)');
  }
  function alem(g, a) {
    // çubuk: altın sarısı ince sap
    g.fillStyle = '#C99A35';
    g.fillRect(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1, a.cubuk.y2 - a.cubuk.y1);
    g.fillStyle = 'rgba(255,230,150,0.6)';
    g.fillRect(a.cubuk.x1 + (a.cubuk.x2 - a.cubuk.x1) * 0.55, a.cubuk.y1, (a.cubuk.x2 - a.cubuk.x1) * 0.25, a.cubuk.y2 - a.cubuk.y1);
    const yk = new Path2D(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }));
    kesik(g, yk, () => {
      tac(g, { x: a.yaka.cx - a.yaka.rx * 1.1, y: a.yaka.cy + a.yaka.ry * 0.3, a: 0, L: a.yaka.rx * 2.3, phi: 0.5, e: 0.25, renk: [hex('#E39A1E'), hex('#F6C83A'), hex('#FBE07A')], ortaT: 0.6, alfa: 1, damar: 7, damarA: 0.35, kenar: 0 });
    }, 'rgba(150,95,15,0.5)');
    for (const k of a.kureler) dugme(g, k.cx, k.cy, k.r);
    const h = a.hilal;
    sariYaprak(g, new Path2D(S.hilalYolu(h.cx, h.cy, h.R)), h.cx - h.R, h.cx + h.R, h.cy - h.R, h.cy + h.R);
  }

  // ------------------------------------------------------------ minare
  {
    const L = katman();
    const g = L.g;
    const c = S.minare.cx;
    for (const p of S.minareParcalari()) {
      if (p.tip === 'alem') { alem(g, p.alem); continue; }
      if (p.tip === 'bant') continue;
      let yol, x1, x2, y1, y2;
      if (p.tip === 'poligon') {
        yol = new Path2D(S.yol(p.noktalar, true));
        x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0]));
        y1 = Math.min(...p.noktalar.map((q) => q[1])); y2 = Math.max(...p.noktalar.map((q) => q[1]));
      } else if (p.tip === 'topuz') {
        yol = new Path2D(p.yol); x1 = c - 26; x2 = c + 26; y1 = 146; y2 = 200;
      } else {
        x1 = p.x1; x2 = p.x2; y1 = p.y1; y2 = p.y2; yol = dikd(x1, y1, x2, y2);
      }
      if (p.tip === 'korkuluk') {
        // korkuluk: kuru açık kahve sap şeritleri ve minik dikey tohum kabukları
        kesik(g, yol, () => {
          g.fillStyle = '#F4EBD9'; g.fillRect(x1, y1, x2 - x1, y2 - y1);
          const adet = 9;
          for (let i = 0; i < adet; i++) {
            const x = x1 + 5 + ((x2 - x1 - 10) * (i + 0.5)) / adet;
            const cc = sap(hex('#B08A5A'), 10, 5);
            yaprak(g, { x, y: y2 - 2, a: -Math.PI / 2, L: y2 - y1 - 3, W: 2.2, p: 0.6, q: 0.5, renk: [cc, cc, acik(cc, 0.2)], alfa: 0.95, damar: 0 });
          }
          for (const yy of [y1 + 1.5, y2 - 1.5]) {
            g.strokeStyle = '#A9845A'; g.lineWidth = 2.2;
            g.beginPath(); g.moveTo(x1, yy); g.lineTo(x2, yy); g.stroke();
          }
        }, 'rgba(120,90,60,0.4)');
        continue;
      }
      const boy = p.ad.startsWith('şerefe') || p.ad === 'bilezik' ? 12 : 22;
      kesik(g, yol, () => gulYapraklari(g, x1, y1, x2, y2, boy, 3.2));
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') {
        g.strokeStyle = 'rgba(170,135,90,0.65)'; g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(x1, y2 - 0.8); g.lineTo(x2, y2 - 0.8); g.stroke();
      }
    }
    // zikzak bandı: üç sıra küçük pembe-kırmızı taç yaprak (zikzak dizilmiş)
    for (const z of S.zikzakCizgileri()) {
      for (let i = 0; i < z.length - 1; i++) {
        const [ax, ay] = z[i], [bx, by] = z[i + 1];
        const an = Math.atan2(by - ay, bx - ax);
        const d = Math.hypot(bx - ax, by - ay);
        const cc = sap(i % 2 ? hex('#D9536A') : hex('#E77A86'), 8, 4);
        yaprak(g, { x: ax, y: ay, a: an, L: d * 1.05, W: 2.6, p: 0.6, q: 0.7, renk: [koyu(cc, 0.1), cc, acik(cc, 0.15)], alfa: 0.95, damar: 0, damarA: 0.25 });
      }
    }
    for (const p of S.minarePencereleri) menekse(g, new Path2D(S.kemerYolu(p.x, p.y, p.w, p.h)), p.x, p.y, p.h);
    bas(L, { alfa: 0.25, bulanik: 2 });
  }

  // ------------------------------------------------------------ yapı: kaide, kasnak, kubbe
  {
    const L = katman();
    const g = L.g;
    const Kd = S.kaide;
    // kaide gövdesi
    kesik(g, dikd(Kd.x1, Kd.y1, Kd.x2, Kd.y2), () => gulYapraklari(g, Kd.x1, Kd.y1, Kd.x2, Kd.y2, 44, 2.4));
    // korniş: ince fildişi şerit ve altında açık kahve sap
    kesik(g, dikd(Kd.kornis.x1, Kd.kornis.y1, Kd.kornis.x2, Kd.kornis.y2), () => gulYapraklari(g, Kd.kornis.x1, Kd.kornis.y1, Kd.kornis.x2, Kd.kornis.y2, 14, 3));
    g.strokeStyle = 'rgba(176,140,92,0.8)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(Kd.x1, Kd.y1 + 1.2); g.lineTo(Kd.x2, Kd.y1 + 1.2); g.stroke();
    for (const p of Kd.pencereler) menekse(g, new Path2D(S.kemerYolu(p.x, p.y, p.w, p.h)), p.x, p.y, p.h);

    // kasnak: yatay serilmiş ince çimen yaprakları (paralel damarlı)
    for (let kat = 1; kat >= 0; kat--) {
      const q = S.kasnak[kat];
      kesik(g, dikd(q.x1, q.y1, q.x2, q.y2), () => {
        const sira = kat === 1 ? 7 : 5;
        for (let s = 0; s < sira; s++) {
          let x = q.x1 - 60 - R() * 40;
          const y = q.y1 + ((s + 0.5) / sira) * (q.y2 - q.y1) + (R() - 0.5) * 3;
          while (x < q.x2 + 40) {
            const Lb = 70 + R() * 70;
            const t = clamp((x + Lb / 2 - q.x1) / (q.x2 - q.x1), 0, 1);
            const ti = 0.5 - 0.5 * Math.cos(Math.PI * clamp((t - 0.05) / 0.85, 0, 1));
            let cc = karis(hex('#2E6A32'), hex('#7DB257'), ti * 0.9 + (kat === 0 ? 0.08 : 0));
            cc = sap(cc, 9, 6);
            const yon = R() < 0.5;
            yaprak(g, { x: yon ? x : x + Lb, y: y + (R() - 0.5) * 2, a: (yon ? 0 : Math.PI) + (R() - 0.5) * 0.04, L: Lb, W: (q.y2 - q.y1) / sira * 0.95, p: 0.45, q: 0.45, renk: [koyu(cc, 0.08), cc, acik(cc, 0.12)], alfa: 0.92, damar: 0, damarA: 0.2 });
            x += Lb * (0.55 + R() * 0.25);
          }
        }
        // paralel ince damarlar
        g.strokeStyle = 'rgba(230,250,200,0.13)'; g.lineWidth = 0.5;
        for (let yy = q.y1 + 2; yy < q.y2; yy += 2.6) { g.beginPath(); g.moveTo(q.x1, yy + (R() - 0.5)); g.lineTo(q.x2, yy + (R() - 0.5)); g.stroke(); }
      }, 'rgba(30,60,25,0.4)');
      // katlar arası açık sap
      g.strokeStyle = 'rgba(205,215,150,0.85)'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(q.x1, q.y1 + 0.8); g.lineTo(q.x2, q.y1 + 0.8); g.stroke();
      for (const p of S.kasnakPencereleri(kat)) menekse(g, new Path2D(S.kemerYolu(p.x, p.y, p.w, p.h)), p.x, p.y, p.h);
    }

    // kubbe: dilim dilim pul gibi dizilmiş yeşil yapraklar
    const prof = S.kubbeProfili(80);
    const N = 16;
    const boylam = (k) => -Math.PI / 2 + (Math.PI * k) / N;
    const rAt = (s) => { const i = clamp(s * 80, 0, 80); const a = Math.floor(i), b = Math.min(80, a + 1), t = i - a; return { y: lerp(prof[a].y, prof[b].y, t), r: lerp(prof[a].r, prof[b].r, t) }; };
    const kubbe = new Path2D(S.kubbeYolu);
    g.save();
    g.clip(kubbe);
    for (let j = 0; j < N; j++) {
      const l1 = boylam(j), l2 = boylam(j + 1), lc = (l1 + l2) / 2;
      const dilim = new Path2D();
      for (let i = 0; i <= 40; i++) { const q = rAt(i / 40); const x = 560 + Math.sin(l1) * q.r; i ? dilim.lineTo(x, q.y) : dilim.moveTo(x, q.y); }
      for (let i = 40; i >= 0; i--) { const q = rAt(i / 40); dilim.lineTo(560 + Math.sin(l2) * q.r, q.y); }
      dilim.closePath();
      g.save();
      g.clip(dilim);
      // dilimin altında büyük bir yaprak parçası: aralıklardan kâğıt görünmesin
      {
        const isik0 = (Math.sin(lc) + 1) / 2;
        const tb = karis(hex('#2C6730'), hex('#6CAE4C'), clamp(isik0 * 1.1, 0, 1));
        g.fillStyle = rgba(tb, 1);
        g.fill(dilim);
      }
      // alttan üste sıralar; her yaprak tepeye bakar; üstteki sıra alttakinin üstüne biner
      const isik = (Math.sin(lc) + 1) / 2;
      let s = 1.0;
      const sira = [];
      while (s > -0.05) {
        const q = rAt(clamp(s, 0, 1));
        const gen = Math.max(2, (Math.sin(l2) - Math.sin(l1)) * q.r);
        const yanAdet = Math.max(1, Math.round(gen / 16));
        const Lb = clamp(gen / yanAdet * 2.0, 14, 42);
        sira.push({ s, gen, yanAdet, Lb });
        s -= (Lb * 0.36) / 262;
      }
      for (const sr of sira) {
        for (let k = 0; k < sr.yanAdet; k++) {
          const lam = l1 + ((k + 0.5) / sr.yanAdet) * (l2 - l1) + (R() - 0.5) * (l2 - l1) * 0.25 / sr.yanAdet;
          const s0 = clamp(sr.s + (R() - 0.5) * 0.01, 0, 1);
          const q0 = rAt(s0), q1 = rAt(clamp(s0 + 0.03, 0, 1));
          const x0 = 560 + Math.sin(lam) * q0.r, y0 = q0.y;
          const x1 = 560 + Math.sin(lam) * q1.r, y1 = q1.y;
          const an = Math.atan2(y1 - y0, x1 - x0) + (R() - 0.5) * 0.18;
          const yuk = s0;
          let cc = karis(hex('#245C2B'), hex('#5EA544'), clamp(isik * 1.15, 0, 1));
          cc = karis(cc, hex('#A6D166'), clamp((isik - 0.55) * 1.4, 0, 0.75) * (0.6 + 0.4 * yuk));
          const tur = R();
          if (tur < 0.12) cc = karis(cc, hex('#B7C95A'), 0.35); // sarıya çalan
          else if (tur < 0.22) cc = karis(cc, hex('#2F7A5E'), 0.3); // maviye çalan
          cc = sap(cc, 15, 7);
          yaprak(g, { x: x0 - Math.cos(an) * sr.Lb * 0.1, y: y0 - Math.sin(an) * sr.Lb * 0.1, a: an, L: sr.Lb, W: Math.min(sr.Lb * 0.36, (sr.gen / sr.yanAdet) * 0.75 + 2), p: 0.7, q: 0.8, renk: [koyu(cc, 0.1), cc, acik(cc, 0.1)], alfa: 0.94, damar: Math.max(3, Math.round(sr.Lb / 6)), damarA: 0.24 });
        }
      }
      g.restore();
    }
    // kaburgalar: ince kuru saplar
    for (const kb of S.kaburgalar(N, 40)) {
      const pts = kb.noktalar;
      for (let i = 0; i < pts.length - 1; i++) {
        const t = i / (pts.length - 1);
        g.strokeStyle = rgba(karis(hex('#3D5A26'), hex('#6F7F3A'), clamp(kb.u * 0.5 + 0.5, 0, 1)), 0.95);
        g.lineWidth = lerp(2.6, 1.1, t);
        g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();
      }
      g.strokeStyle = 'rgba(220,230,170,0.45)'; g.lineWidth = 0.6;
      g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0] + 0.7, p[1]) : g.moveTo(p[0] + 0.7, p[1]))); g.stroke();
    }
    g.restore();
    g.strokeStyle = 'rgba(30,60,25,0.45)'; g.lineWidth = 0.9; g.stroke(kubbe);
    alem(g, S.alemParcalari(560, 300, 1));
    const yesil = new Path2D(S.kubbeYolu);
    yesil.rect(S.kasnak[1].x1, S.kasnak[0].y1, S.kasnak[1].x2 - S.kasnak[1].x1, S.kasnak[1].y2 - S.kasnak[0].y1);
    benek(L, 0.18, yesil);
    bas(L, { alfa: 0.26, bulanik: 2.2 });
  }

  // ------------------------------------------------------------ bitkiler: saplar, yapraklar, eğrelti, tomurcuk
  const ON = S.bitki.cicekler.slice(4);
  function egrelti(g, x, y, a, L, ton) {
    // kavisli eksen boyunca karşılıklı küçük yaprakçıklar
    const kv = (R() - 0.5) * 0.9;
    const P = (t) => {
      const an = a + kv * t;
      return [x + Math.cos(a + kv * t * 0.5) * L * t, y + Math.sin(a + kv * t * 0.5) * L * t, an];
    };
    g.strokeStyle = rgba(koyu(ton, 0.25), 0.9);
    g.lineWidth = 1.3;
    g.beginPath();
    for (let i = 0; i <= 20; i++) { const p = P(i / 20); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
    const adet = Math.round(L / 6);
    for (let i = 1; i < adet; i++) {
      const t = i / adet;
      const p = P(t);
      const boy = L * 0.2 * Math.sin(Math.PI * Math.pow(t, 0.75)) + 2.5;
      for (const yan of [1, -1]) {
        const cc = sap(ton, 6, 4);
        yaprak(g, { x: p[0], y: p[1], a: p[2] + yan * (1.05 - t * 0.3), L: boy, W: boy * 0.32, p: 0.7, q: 0.8, dis: 4, disD: 0.25, renk: [koyu(cc, 0.05), cc, acik(cc, 0.1)], alfa: 0.92, damar: 2, damarA: 0.2 });
      }
    }
  }
  {
    const L = katman();
    const g = L.g;
    // saplar
    for (const s of S.bitki.saplar) {
      for (let i = 0; i < s.length - 1; i++) {
        const t = i / (s.length - 1);
        g.strokeStyle = rgba(karis(hex('#6B7A3E'), hex('#7E9150'), t), 0.95);
        g.lineWidth = lerp(3.4, 1.6, t);
        g.beginPath(); g.moveTo(s[i][0], s[i][1]); g.lineTo(s[i + 1][0], s[i + 1][1]); g.stroke();
      }
      g.strokeStyle = 'rgba(225,235,180,0.35)'; g.lineWidth = 0.7;
      g.beginPath(); s.forEach((p, i) => (i ? g.lineTo(p[0] + 0.6, p[1]) : g.moveTo(p[0] + 0.6, p[1]))); g.stroke();
    }
    // yapraklar: farklı türler (gül yaprağı tırtıklı, söğüt, adaçayı); bazıları eğrelti
    const TON = [hex('#4F8A3E'), hex('#6FA34A'), hex('#3E7A45'), hex('#8DB563'), hex('#7FA088'), hex('#5E9A52')];
    S.bitki.yapraklar.forEach((y, i) => {
      const on = i >= 36;
      const ton = TON[Math.floor(R() * TON.length)];
      if (on && i % 5 === 0) { egrelti(g, y.x, y.y, y.aci, y.uzunluk * 1.35, sap(karis(ton, hex('#6FAE4E'), 0.4), 8, 4)); return; }
      const tur = R();
      const cc = sap(ton, 10, 6);
      if (tur < 0.4) yaprak(g, { x: y.x, y: y.y, a: y.aci, L: y.uzunluk, W: y.uzunluk * 0.3, p: 0.7, q: 0.85, dis: 9, disD: 0.1, renk: [koyu(cc, 0.12), cc, acik(cc, 0.1)] });
      else if (tur < 0.75) yaprak(g, { x: y.x, y: y.y, a: y.aci, L: y.uzunluk * 1.05, W: y.uzunluk * 0.2, p: 0.65, q: 0.75, renk: [koyu(cc, 0.12), cc, acik(cc, 0.15)] });
      else {
        const sg = sap(karis(cc, hex('#B4C6A6'), 0.55), 6, 3); // adaçayı: gümüşi yeşil
        yaprak(g, { x: y.x, y: y.y, a: y.aci, L: y.uzunluk * 0.85, W: y.uzunluk * 0.27, p: 0.8, q: 0.9, renk: [koyu(sg, 0.08), sg, acik(sg, 0.12)], damarA: 0.38 });
      }
    });
    // tomurcuklar: preslenmiş pembe gül goncaları, yeşil çanak yapraklı
    for (const t of S.bitki.tomurcuklar) {
      const cc = sap(hex('#E98EA4'), 10, 6);
      g.save();
      g.globalAlpha = 0.95;
      const yol = new Path2D(S.tomurcukYolu(t));
      const gr = g.createLinearGradient(t.x - Math.cos(t.aci) * t.r, t.y - Math.sin(t.aci) * t.r, t.x + Math.cos(t.aci) * t.r * 1.6, t.y + Math.sin(t.aci) * t.r * 1.6);
      gr.addColorStop(0, rgba(acik(cc, 0.3))); gr.addColorStop(1, rgba(koyu(cc, 0.15)));
      g.fillStyle = gr; g.fill(yol);
      g.save(); g.clip(yol);
      g.strokeStyle = 'rgba(255,240,245,0.4)'; g.lineWidth = 0.6;
      for (let k = -2; k <= 2; k++) {
        g.beginPath(); g.moveTo(t.x - Math.cos(t.aci) * t.r * 0.8, t.y - Math.sin(t.aci) * t.r * 0.8);
        g.quadraticCurveTo(t.x - Math.sin(t.aci) * k * t.r * 0.35, t.y + Math.cos(t.aci) * k * t.r * 0.35, t.x + Math.cos(t.aci + k * 0.25) * t.r * 1.5, t.y + Math.sin(t.aci + k * 0.25) * t.r * 1.5);
        g.stroke();
      }
      g.restore();
      g.strokeStyle = 'rgba(150,60,80,0.3)'; g.lineWidth = 0.6; g.stroke(yol);
      g.restore();
      for (const yan of [-0.55, 0, 0.55]) {
        const cs = sap(hex('#5F8F45'), 6, 3);
        yaprak(g, { x: t.x - Math.cos(t.aci) * t.r * 0.95, y: t.y - Math.sin(t.aci) * t.r * 0.95, a: t.aci + yan, L: t.r * 1.5, W: t.r * 0.32, p: 0.6, q: 0.8, renk: [cs, cs, acik(cs, 0.1)], damar: 0 });
      }
    }
    bas(L, { alfa: 0.26, bulanik: 2.2 });
  }

  // ------------------------------------------------------------ küçük dolgu çiçekleri: unutmabeni ve cipsofila
  function unutmabeni(g, x, y, r) {
    const a0 = R() * Math.PI;
    for (let k = 0; k < 5; k++) {
      const cc = sap(karis(hex('#7FA8E8'), hex('#9DC1F0'), R()), 8, 6);
      tac(g, { x, y, a: a0 + (k * Math.PI * 2) / 5, L: r, phi: 0.6, e: 0.3, n: 18, renk: [acik(cc, 0.5), cc, cc], ortaT: 0.4, alfa: 0.92, damar: 3, damarA: 0.3, kenar: 0.15 });
    }
    g.fillStyle = '#F7E27A'; g.beginPath(); g.arc(x, y, r * 0.24, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(x, y, r * 0.1, 0, 7); g.fill();
  }
  {
    const L = katman();
    const g = L.g;
    const kumeler = [[60, 800], [330, 800], [415, 820], [505, 806], [590, 828], [680, 812], [960, 802], [255, 1000], [800, 1006], [600, 1014], [450, 1010], [40, 960], [990, 960]];
    for (const [kx, ky] of kumeler) {
      // ince sap dalları
      const uc = [];
      for (let k = 0; k < 6; k++) {
        const a = -Math.PI / 2 + (R() - 0.5) * 1.6, Lb = 14 + R() * 26;
        const ex = kx + Math.cos(a) * Lb, ey = ky + Math.sin(a) * Lb;
        g.strokeStyle = 'rgba(105,130,70,0.9)'; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(kx, ky + 8); g.quadraticCurveTo(kx + Math.cos(a) * Lb * 0.3, ky + 8 + Math.sin(a) * Lb * 0.5, ex, ey); g.stroke();
        uc.push([ex, ey]);
      }
      const tur = R() < 0.6;
      for (const [ex, ey] of uc) {
        if (tur) unutmabeni(g, ex, ey, 5 + R() * 2.5);
        else {
          // cipsofila: minik beyaz çiçekçik demeti
          for (let m = 0; m < 4; m++) {
            const x = ex + (R() - 0.5) * 9, y = ey + (R() - 0.5) * 9;
            for (let k = 0; k < 5; k++) {
              tac(g, { x, y, a: (k * Math.PI * 2) / 5 + R(), L: 3 + R(), phi: 0.6, e: 0.3, n: 12, renk: [hex('#F3F0E6'), hex('#FFFFFF'), hex('#FFFFFF')], alfa: 0.95, damar: 0, kenar: 0.25 });
            }
            g.fillStyle = 'rgba(210,205,170,0.9)'; g.beginPath(); g.arc(x, y, 0.8, 0, 7); g.fill();
          }
        }
      }
    }
    bas(L, { alfa: 0.25, bulanik: 1.6 });
  }

  // ------------------------------------------------------------ preslenmiş beyaz çiçekler
  {
    const L = katman();
    const g = L.g;
    const cic = S.bitki.cicekler.slice().sort((a, b) => a.r - b.r);
    for (const c of cic) {
      const r = c.r * 1.05;
      for (let k = 0; k < 5; k++) {
        const a = c.aci + (k * Math.PI * 2) / 5 + (R() - 0.5) * 0.12;
        const ton = sap(karis(hex('#FFFFFF'), hex('#FBF1F2'), R() * 0.7), 3, 2);
        tac(g, {
          x: c.x, y: c.y, a, L: r * (0.98 + R() * 0.1), phi: 0.68 + R() * 0.06, e: 0.32, n: 40, centik: 0.05 + R() * 0.04, dalga: 0.06,
          renk: [hex('#EAC8DA'), ton, karis(ton, hex('#F2EEF4'), 0.5)], ortaT: 0.42, alfa: 0.9, damar: 13, damarA: 0.55, damarK: 0.1, damarW: c.r > 40 ? 0.9 : 0.7, kenar: 0.28,
        });
      }
      // göbek: yeşilimsi sarı disk, ince sapçıklı sarı başçıklar (stamen)
      const gr = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 0.2);
      gr.addColorStop(0, '#C9D06A'); gr.addColorStop(1, '#A7B24A');
      g.fillStyle = gr; g.beginPath(); g.arc(c.x, c.y, r * 0.17, 0, 7); g.fill();
      const st = Math.round(18 + r * 0.4);
      for (let k = 0; k < st; k++) {
        const a = (k / st) * Math.PI * 2 + R() * 0.2, rr = r * (0.2 + R() * 0.16);
        const ex = c.x + Math.cos(a) * rr, ey = c.y + Math.sin(a) * rr;
        g.strokeStyle = 'rgba(225,200,120,0.85)'; g.lineWidth = 0.6;
        g.beginPath(); g.moveTo(c.x + Math.cos(a) * r * 0.12, c.y + Math.sin(a) * r * 0.12); g.lineTo(ex, ey); g.stroke();
        g.fillStyle = R() < 0.7 ? '#F1B92E' : '#E39A1F';
        g.beginPath(); g.ellipse(ex, ey, Math.max(1, r * 0.035), Math.max(0.7, r * 0.022), a, 0, 7); g.fill();
      }
      // dökülmüş birkaç polen tozu: göbeğin çevresinde
      for (let k = 0; k < r * 0.6; k++) {
        const a = R() * Math.PI * 2, rr = r * (0.3 + R() * 0.25);
        g.fillStyle = 'rgba(240,190,60,0.55)';
        g.beginPath(); g.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, 0.6 + R() * 0.5, 0, 7); g.fill();
      }
    }
    bas(L, { alfa: 0.3, bulanik: 2.4, dx: -1.8, dy: 2.2 });
  }

  SAHNE.hazir();
})();
</script>
