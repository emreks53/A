<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-174 Renk İplikleri — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f4f1e8; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ===================================================================== h3 boya motoru
// Ortak yardımcılar: ışık modeli (kubbe dönel yüzey, kasnak/minare silindir), taş işçiliği, altın alem,
// çiçek/yaprak modelleme, gök ve bulut, kabartma (fırça izi) ve tuval/pano dokusu. Her üslup kendi paletini
// ve seçeneklerini verir; görünen el izi üslubun kendi bölümünde çizilir.
const H = (function () {
  'use strict';
  const S = SAHNE;
  const N = 2048; // iç çözünürlük
  const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const yum = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const kar = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const css = (c, a) => (a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);
  const C = (x) => (typeof x === 'string' ? hex(x) : x);
  function rampa(dur) {
    const d = dur.map(([t, c]) => [t, C(c)]);
    return function (t) {
      if (t <= d[0][0]) return d[0][1];
      for (let i = 1; i < d.length; i++) if (t <= d[i][0]) return kar(d[i - 1][1], d[i][1], (t - d[i - 1][0]) / (d[i][0] - d[i - 1][0]));
      return d[d.length - 1][1];
    };
  }
  const norm = (v) => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
  const nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  // ışık: sağ üst önden (x sağa, y yukarı, z bakana)
  let L = norm([0.56, 0.5, 0.66]);
  let HV = norm([L[0], L[1], L[2] + 1]);
  function isikKur(v) { L = norm(v); HV = norm([L[0], L[1], L[2] + 1]); }

  function gurultu(tohum) {
    const r = S.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    const n = function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    n.fbm = function (x, y, o) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < o; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 31.7; y = ny + 11.3; a *= 0.5; }
      return s / t;
    };
    return n;
  }

  function tuval2(cizimMi) {
    const c = S.yeniTuval(N, N);
    const g = c.getContext('2d', { willReadFrequently: true });
    if (cizimMi !== false) g.setTransform(2, 0, 0, 2, 0, 0);
    return [c, g];
  }

  // ------------------------------------------------------------ kubbe profili (y → yarıçap, eğim)
  const KP = (function () {
    const p = S.kubbeProfili(2000); // tabandan (555) tepeye (300)
    const adim = 0.25, y0 = 299, n = Math.ceil((556 - y0) / adim) + 1;
    const R = new Float32Array(n), SL = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const y = y0 + i * adim;
      if (y <= 300) { R[i] = 0; SL[i] = -10; continue; }
      if (y >= 555) { R[i] = 200; SL[i] = 0; continue; }
      // p: y azalan
      while (j < p.length - 2 && p[j + 1].y > y) j++;
      while (j > 0 && p[j].y < y) j--;
      const a = p[j], b = p[j + 1];
      const t = (a.y - y) / (a.y - b.y || 1);
      R[i] = a.r + (b.r - a.r) * t;
      // dρ/dh (h = 555 - y yukarı): (b.r - a.r)/(a.y - b.y)
      SL[i] = (b.r - a.r) / (a.y - b.y || 1e-6);
    }
    return {
      r(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return R[i]; },
      s(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return SL[i]; },
    };
  })();

  /** Kubbe yüzey normali (kaburga ve dilim kabarıklığıyla). Dönüş: {n, u, fi, t, kab} */
  function kubbeNormal(x, y, o) {
    o = o || {};
    let r = KP.r(y);
    if (r < 0.5) r = 0.5;
    let u = (x - 560) / r;
    if (u > 0.9995) u = 0.9995; else if (u < -0.9995) u = -0.9995;
    const fi = Math.asin(u);
    const s = KP.s(Math.max(301, y));
    const m = Math.hypot(1, s);
    const nr = 1 / m, nh = -s / m;
    const D = Math.PI / 16;
    let t = ((fi + Math.PI / 2) / D) % 1;
    if (t < 0) t += 1;
    const d = t < 0.5 ? t : t - 1;
    const wr = o.kaburgaEni || 0.06;
    let tau = (o.dilim === undefined ? 0.13 : o.dilim) * Math.cos(Math.PI * t);
    let kab = 0;
    if (Math.abs(d) < wr) {
      kab = 1 - Math.abs(d) / wr;
      tau = (o.kaburga === undefined ? 0.6 : o.kaburga) * Math.sin((Math.PI / 2) * (d / wr));
    }
    const f2 = fi + tau;
    return { n: [nr * Math.sin(f2), nh, nr * Math.cos(f2)], u, fi, t, d, kab };
  }

  // ------------------------------------------------------------ gök ve bulutlar
  /**
   * P: {ust, orta, ufuk, hale, gunes}; O: {haleR, haleGuc, gunesR, gurultu, ortaT}
   */
  function gokBoya(ctx, P, O) {
    O = O || {};
    const [c, g] = tuval2(false);
    const im = g.createImageData(N, N), d = im.data;
    const ra = rampa([[0, P.ust], [O.ortaT || 0.5, P.orta], [1, P.ufuk]]);
    const hale = C(P.hale), gun = C(P.gunes);
    const nz = gurultu(O.tohum || 11);
    const gx = S.gunes.x, gy = S.gunes.y, haleR = O.haleR || 300, haleG = O.haleGuc === undefined ? 0.85 : O.haleGuc;
    const gR = O.gunesR || 34, gYum = O.gunesYum || 10;
    const gr = O.gurultu === undefined ? 0.03 : O.gurultu;
    for (let py = 0; py < N; py++) {
      const y = (py + 0.5) / 2;
      const base = ra(Math.pow(sat(y / (O.ufukY || 800)), O.us || 1));
      for (let px = 0; px < N; px++) {
        const x = (px + 0.5) / 2;
        const dx = x - gx, dy = y - gy, dist = Math.sqrt(dx * dx + dy * dy);
        const h = haleG * Math.exp(-Math.pow(dist / haleR, 1.25));
        let r = base[0] + (hale[0] - base[0]) * h, gg = base[1] + (hale[1] - base[1]) * h, b = base[2] + (hale[2] - base[2]) * h;
        const k = 1 - yum(gR - gYum, gR + gYum, dist);
        r += (gun[0] - r) * k; gg += (gun[1] - gg) * k; b += (gun[2] - b) * k;
        if (gr) { const v = 1 + (nz.fbm(x / 210, y / 160, 3) - 0.5) * gr; r *= v; gg *= v; b *= v; }
        const i = (py * N + px) * 4;
        d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
      }
    }
    g.putImageData(im, 0, 0);
    ctx.drawImage(c, 0, 0, 1024, 1024);
  }

  /** Kümülüs bulut: küre kümeleri, sağ üstten ışık. bulutlar: [{x,y,w,h,adet,tohum}] */
  function bulutBoya(ctx, bulutlar, P, O) {
    O = O || {};
    const W = 1024, hb = new Float32Array(W * W).fill(-1), nxb = new Float32Array(W * W), nyb = new Float32Array(W * W), aob = new Float32Array(W * W), cov = new Float32Array(W * W);
    const tabanB = new Float32Array(W * W);
    for (const b of bulutlar) {
      const r = S.rng(b.tohum || 5);
      const kureler = [];
      for (let i = 0; i < b.adet; i++) {
        const t = r() * 2 - 1;
        const kenar = 1 - Math.abs(t);
        const rad = (b.h * 0.34) * (0.45 + 0.75 * kenar) * (0.7 + r() * 0.5);
        const x = b.x + t * b.w * 0.5;
        const y = b.y - r() * b.h * 0.55 * kenar + rad * 0.25;
        kureler.push({ x, y, r: rad, z: kenar * b.h * 0.3 + r() * 6 });
      }
      const taban = b.y + b.h * 0.18;
      for (const k of kureler) {
        const x0 = Math.max(0, Math.floor(k.x - k.r - 2)), x1 = Math.min(W - 1, Math.ceil(k.x + k.r + 2));
        const y0 = Math.max(0, Math.floor(k.y - k.r - 2)), y1 = Math.min(W - 1, Math.ceil(k.y + k.r + 2));
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          const dx = x + 0.5 - k.x, dy = y + 0.5 - k.y, dd = dx * dx + dy * dy;
          const rr = k.r * k.r;
          if (dd > (k.r + 1.5) * (k.r + 1.5)) continue;
          const i = y * W + x;
          const e = sat((k.r + 1 - Math.sqrt(dd)) / (O.kenar || 1.6));
          const ab = yum(taban + 2, taban - (O.tabanYum || 6), y + 0.5);
          const cv = e * ab;
          if (cv > cov[i]) cov[i] = cv;
          const hz = Math.sqrt(Math.max(0, rr - dd)) + k.z;
          if (hz > hb[i]) {
            hb[i] = hz;
            const nz = Math.sqrt(Math.max(0, rr - dd)) / k.r;
            nxb[i] = dx / k.r; nyb[i] = -dy / k.r; aob[i] = nz;
            tabanB[i] = sat((taban - (y + 0.5)) / (b.h * 0.6));
          }
        }
      }
    }
    const [c, g] = [S.yeniTuval(W, W), null];
    const gg = c.getContext('2d');
    const im = gg.createImageData(W, W), d = im.data;
    const ra = rampa([[0, P.golge], [0.5, P.orta], [1, P.isik]]);
    const opak = O.opaklik === undefined ? 0.95 : O.opaklik;
    for (let i = 0; i < W * W; i++) {
      if (cov[i] <= 0) continue;
      const n = norm([nxb[i], nyb[i], Math.max(0.05, aob[i])]);
      let sh = nokta(n, L) * 0.8 + 0.25;
      sh = sh * (0.75 + 0.25 * aob[i]) - 0.28 * (1 - tabanB[i]) * (1 - Math.max(0, n[1]));
      const col = ra(sat(sh));
      d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255 * cov[i] * opak;
    }
    gg.putImageData(im, 0, 0);
    ctx.save();
    if (O.bulanik) ctx.filter = `blur(${O.bulanik}px)`;
    ctx.drawImage(c, 0, 0, 1024, 1024);
    ctx.restore();
  }

  // ------------------------------------------------------------ malzeme: taş, yeşil, altın
  /** Normal → renk: rampa ile yayınık ışık, gök/yer yansıması ve parlama. */
  function golgele(n, M) {
    const dif = Math.max(0, nokta(n, L));
    let v = M.ortam + (1 - M.ortam) * dif;
    let c = M.rampa(sat(v));
    if (M.gok) { const k = M.gokGuc * sat(0.5 + 0.5 * n[1]) * (1 - dif); c = kar(c, M.gok, k); }
    if (M.yer) { const k = M.yerGuc * sat(-n[1]) ; c = kar(c, M.yer, k); }
    if (M.parlak) { const sp = Math.pow(Math.max(0, nokta(n, HV)), M.parlakUs || 40) * M.parlak; c = kar(c, M.parlakRenk || [255, 255, 255], sat(sp)); }
    return c;
  }
  function malzeme(o) {
    return { rampa: rampa(o.rampa), ortam: o.ortam === undefined ? 0.18 : o.ortam, gok: o.gok && C(o.gok), gokGuc: o.gokGuc || 0, yer: o.yer && C(o.yer), yerGuc: o.yerGuc || 0, parlak: o.parlak || 0, parlakUs: o.parlakUs, parlakRenk: o.parlakRenk && C(o.parlakRenk) };
  }
  /** Silindir (dikey eksen) yatay degrade. ny: yüzeyin yukarı eğimi (0 dik, + yukarı bakar). */
  function silindirDeg(ctx, cx, R, x1, x2, M, ny, carp) {
    const g = ctx.createLinearGradient(x1, 0, x2, 0);
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const x = x1 + ((x2 - x1) * i) / n;
      let nx = (x - cx) / R; nx = Math.max(-0.995, Math.min(0.995, nx));
      const nz = Math.sqrt(1 - nx * nx);
      const nn = norm([nx, ny || 0, nz]);
      let c = golgele(nn, M);
      if (carp) c = [c[0] * carp, c[1] * carp, c[2] * carp];
      g.addColorStop(i / n, css(c));
    }
    return g;
  }
  function dikdortgen(x1, y1, x2, y2) { return new Path2D(S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true)); }

  // ------------------------------------------------------------ kubbe
  /** Kubbeyi piksel piksel boyar. renkFn(kn, x, y) → rgb (kn: kubbeNormal sonucu). */
  function kubbeBoya(ctx, renkFn, o) {
    const [c, g] = tuval2(false);
    const x0 = 350, x1 = 770, y0 = 296, y1 = 558;
    const W = (x1 - x0) * 2, Hh = (y1 - y0) * 2;
    const im = g.createImageData(W, Hh), d = im.data;
    for (let py = 0; py < Hh; py++) {
      const y = y0 + (py + 0.5) / 2;
      for (let px = 0; px < W; px++) {
        const x = x0 + (px + 0.5) / 2;
        const kn = kubbeNormal(x, y, o);
        const col = renkFn(kn, x, y);
        const i = (py * W + px) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
      }
    }
    g.putImageData(im, x0 * 2, y0 * 2);
    // maske
    const [m, mg] = tuval2();
    mg.fillStyle = '#000';
    mg.fill(new Path2D(S.kubbeYolu));
    mg.globalCompositeOperation = 'source-in';
    mg.setTransform(1, 0, 0, 1, 0, 0);
    mg.drawImage(c, 0, 0);
    ctx.drawImage(m, 0, 0, 1024, 1024);
  }

  // ------------------------------------------------------------ minare
  /**
   * Minare. T: taş malzemesi, A: altın malzemesi; o: {derz:bool, derzRenk, pencereIc:[ust,alt], pencereKenar, golgeRenk, cizgi}
   */
  function minareBoya(ctx, T, A, o) {
    o = o || {};
    const cx = 300;
    const parcalar = S.minareParcalari();
    const golge = o.golgeRenk || 'rgba(70,60,80,0.32)';
    const G = o.kat !== 'detay', D = o.kat !== 'govde';
    const govde = (x1, x2, y1, y2) => {
      if (G) {
        ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0);
        ctx.fill(dikdortgen(x1, y1, x2, y2));
      }
      if (D && o.derz) {
        const R = (x2 - x1) / 2;
        ctx.save();
        ctx.clip(dikdortgen(x1, y1, x2, y2));
        for (let y = y2 - (o.derzAra || 14); y > y1 + 3; y -= (o.derzAra || 14)) {
          ctx.fillStyle = o.derzRenk || 'rgba(120,100,80,0.28)';
          ctx.fillRect(x1, y, x2 - x1, 0.9);
          ctx.fillStyle = o.derzIsik || 'rgba(255,250,240,0.25)';
          ctx.fillRect(x1, y + 0.9, x2 - x1, 0.6);
          // dikey derzler: silindir üzerinde kısalır
          const sira = Math.round(y / (o.derzAra || 14)) % 2;
          for (let k = -3; k <= 3; k++) {
            const th = (k + sira * 0.5) * 0.52;
            if (Math.abs(th) > 1.45) continue;
            const x = cx + R * Math.sin(th);
            ctx.fillStyle = o.derzRenk || 'rgba(120,100,80,0.28)';
            ctx.fillRect(x - 0.4, y - (o.derzAra || 14) + 1, 0.8 * Math.cos(th) + 0.2, (o.derzAra || 14) - 1);
          }
        }
        ctx.restore();
      }
    };
    const pencere = (p) => { if (D) pencereBoya(ctx, p.x, p.y, p.w, p.h, o, 0); };
    const golgeBant = (x1, x2, y, h) => {
      if (!G || h <= 0) return;
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, golge);
      g.addColorStop(0.7, golge.replace(/[\d.]+\)$/, (m) => parseFloat(m) * 0.5 + ')'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x1, y, x2 - x1, h);
    };
    for (const p of parcalar) {
      if (p.ad === 'gövde-alt') {
        govde(266, 334, 488, 800);
        pencere(S.minarePencereleri[2]);
        golgeBant(266, 334, 488, 12);
      } else if (p.ad === 'zikzak') {
        if (D) zikzakBoya(ctx, o);
      } else if (p.ad.startsWith('çıkma')) {
        mukarnasBoya(ctx, p.noktalar, T, o, G, D);
      } else if (p.ad.startsWith('şerefe')) {
        const [a, , b] = [p.noktalar[0], 0, p.noktalar[2]];
        const x1 = a[0], x2 = b[0], y1 = a[1], y2 = b[1];
        if (G) {
          ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0.15);
          ctx.fill(dikdortgen(x1, y1, x2, y2));
        }
        if (D) {
          ctx.fillStyle = silindirDeg(ctx, cx, (x2 - x1) / 2, x1, x2, T, 0.9);
          ctx.fillRect(x1, y1, x2 - x1, 1.6);
          ctx.fillStyle = 'rgba(60,50,60,0.25)';
          ctx.fillRect(x1, y2 - 1.2, x2 - x1, 1.2);
        }
      } else if (p.ad.startsWith('korkuluk')) {
        korkulukBoya(ctx, p, T, o, G, D);
      } else if (p.ad === 'gövde-orta') {
        govde(273, 327, 316, 436);
        pencere(S.minarePencereleri[1]);
        golgeBant(273, 327, 316, 9);
      } else if (p.ad === 'gövde-üst') {
        govde(281, 319, 206, 272);
        pencere(S.minarePencereleri[0]);
        golgeBant(281, 319, 206, 5);
      } else if (p.ad === 'bilezik') {
        if (G) {
          ctx.fillStyle = silindirDeg(ctx, cx, 25, 275, 325, T, 0.1);
          ctx.fill(dikdortgen(275, 198, 325, 206));
        }
        if (D) {
          ctx.fillStyle = silindirDeg(ctx, cx, 25, 275, 325, T, 0.85);
          ctx.fillRect(275, 198, 50, 1.3);
        }
      } else if (p.ad === 'topuz') {
        topuzBoya(ctx, p.yol, T, o, G, D);
      } else if (p.ad === 'alem') {
        if (D) alemBoya(ctx, p.alem, A, o);
      }
    }
    // korkuluğun gövdeye düşürdüğü gölge (şerefe gövdeyi örter: gövdenin şerefe üstü)
    golgeBant(273, 327, 436 - 1, 0); // yer tutucu (gerekirse üslup ekler)
  }

  function pencereBoya(ctx, x, y, w, h, o, aci) {
    const yol = new Path2D(S.kemerYolu(x, y, w, h));
    // taş çerçeve (kemer kaşı)
    if (o.pencereKasi) {
      ctx.save();
      ctx.lineWidth = o.pencereKasi;
      ctx.strokeStyle = o.kasRenk || 'rgba(255,250,235,0.6)';
      ctx.stroke(new Path2D(S.kemerYolu(x, y - o.pencereKasi * 0.6, w + o.pencereKasi * 1.6, h + o.pencereKasi * 0.6)));
      ctx.restore();
    }
    const ic = o.pencereIc || ['#4a4038', '#7a6c5a'];
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, ic[0]);
    g.addColorStop(1, ic[1]);
    ctx.fillStyle = g;
    ctx.fill(yol);
    ctx.save();
    ctx.clip(yol);
    // iç kenarlar: sol iç yüz aydınlık, üstte gölge
    const kalin = Math.max(1.2, w * 0.16);
    if (aci === undefined || aci === 0) {

  /** Çiçek: beş taç yaprak (yabani gül biçimi). P: {isik, orta, golge, kok, gobek, ercik, ercikKoyu, cizgi} */

  /** Ek ön yapraklar (çiçek yatağını doldurmak için, referans yapraklarının arkasında). */

      const x = alan.x1 + r() * (alan.x2 - alan.x1);

  // ------------------------------------------------------------ doku ve kabartma

    o = o || {};

    const lx = 0.62, ly = -0.55; // ekran: sağ üst
    const parlak = o.parlak || 0;
    for (let y = 1; y < N - 1; y++) {
      for (let x = 1; x < N - 1; x++) {
        const i = y * N + x;
        const gx = yuk[i + 1] - yuk[i - 1], gy = yuk[i + N] - yuk[i - N];
        let s = -(gx * lx + gy * ly) * guc; // + aydınlık

    ctx.putImageData(im, 0, 0);

  /** Tuval bezi (düz dokuma) yükseklik haritası. */
  function tuvalBezi(yuk, aralik, guc, tohum) {
    const nz = gurultu(tohum || 3);
    const p = aralik;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const fx = x / p, fy = y / p;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        const ux = fx - ix, uy = fy - iy;
        const atk = (ix + iy) % 2 === 0; // üstte atkı mı çözgü mü
        const a = Math.sin(Math.PI * uy), b = Math.sin(Math.PI * ux);

        yuk[y * N + x] += h * guc;

    const d = g.getImageData(0, 0, canvas.width, canvas.height).data;
    const w = canvas.width, sk = w / 1024;
    return function (x, y) {
      let px = Math.floor(x * sk), py = Math.floor(y * sk);
      if (px < 0) px = 0; else if (px >= w) px = w - 1;
      if (py < 0) py = 0; else if (py >= w) py = w - 1;
      const i = (py * w + px) * 4;

  // ------------------------------------------------------------ hacimli bulut (yoğunluk + kendi gölgesi)
  /**
   * bulutlar: [{x, y, w, h, adet, tohum}] (y: bulutun ortası). P: {isik, orta, golge}

  function bulutYogun(ctx, bulutlar, P, O) {

    const nz = gurultu(O.tohum || 17);

      }

        const y0 = Math.max(0, Math.floor(k.y - ext)), y1 = Math.min(W - 1, Math.ceil(k.y + ext));

          if (tb <= 0) continue;
          for (let xx = x0; xx <= x1; xx++) {
            const dx = xx + 0.5 - k.x, dy = yy + 0.5 - k.y, q = (dx * dx + dy * dy) / (k.r * k.r);

    const lx = 0.72, ly = -0.69;

    const KAP = new Float32Array(W * W);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const v = D[i];
      if (v < esik - ken) continue;
      const cov = yum(esik - ken, esik + ken, v);

      const kendi = Math.exp(-tau * sig);

  /** Uzun, yatay bulut bantları: ortak tabanlı elipsler, üstü aydınlık, altı serin gri. */

    const isik = C(P.isik), orta = C(P.orta), golge = C(P.golge);

  /**

      if (yol && o.icMi !== false && !ctx.isPointInPath(yol, x * 2, y * 2)) continue;

      const w = o.en[0] + r() * (o.en[1] - o.en[0]);
      const al = o.alfa[0] + r() * (o.alfa[1] - o.alfa[0]);

        const ileri = [], geri = [];

        const adim = Math.max(2, l / 8);
        for (let s = 0; s < 4; s++) { const a = o.yon(cx, cy); cx += Math.cos(a) * adim; cy += Math.sin(a) * adim; ileri.push([cx, cy]); }
        cx = x; cy = y;
        for (let s = 0; s < 4; s++) { const a = o.yon(cx, cy); cx -= Math.cos(a) * adim; cy -= Math.sin(a) * adim; geri.push([cx, cy]); }

  /** El titremesi: kenarları çok hafifçe dalgalandıran düşük frekanslı yer değiştirme (iç piksel cinsinden). */
  function titret(ctx, genlik, olcek, tohum) {
    const im = ctx.getImageData(0, 0, N, N);

        }

  }

})();

<script>

  const PALET = ['#FFFDF4', '#FFF0A0', '#F7E040', '#F6B82C', '#F08A2C', '#E5543A', '#F2A7BE', '#F6D2D6', '#B79AE6', '#8A6CD0', '#4A5FD6', '#3C8EE6', '#5CBDEC', '#B8E2F8', '#DDE9FA', '#16947C', '#24AE5A', '#8ED04A', '#CDE87A', '#2B6F9C', '#1F5DAA', '#EBCB8A'].map(C);

    }
  };
  const dikeyIzler = (cx, Rr, y1, y2, ara, o) => {
    const adet = Math.ceil((Math.PI * Rr) / ara);
    for (let k = 0; k <= adet; k++) {
      const th = -Math.PI / 2 + (Math.PI * k) / adet;
      const x = cx + Rr * Math.sin(th);
      const pts = [];
      for (let y = y1 - 10; y <= y2 + 10; y += 4) pts.push([x, y]);
      izBoyunca(pts, o);
    }
  };

  // ------------------------------------------------------------ 4. boyama: astar, gök, dağ, zemin, yapı, bitki
  ctx.fillStyle = '#FBF8EE';
  ctx.fillRect(0, 0, 1024, 1024);
  ctx.save(); ctx.globalAlpha = 0.65; ctx.drawImage(hc, 0, 0, 1024, 1024); ctx.restore();
  ctx.fillStyle = 'rgba(255,252,240,0.25)'; ctx.fillRect(0, 0, 1024, 1024);
  // gök: güneşten ışınsal iplikler
  bolge(null, () => {
    const gx = 880, gy = 140;
    const ara = 2.7;
    for (let r0 = 14; r0 < 1300; ) {
      const L = 22 + Math.min(26, r0 * 0.06);
      const adet = Math.max(12, Math.round((2 * Math.PI * (r0 + L / 2)) / ara));
      const faz = R() * Math.PI * 2;
      for (let k = 0; k < adet; k++) {
        const a = faz + (k / adet) * Math.PI * 2 + (R() - 0.5) * 0.4 / adet;
        const ca = Math.cos(a), sa = Math.sin(a);
        const ra = r0 + R() * 4, rb = r0 + L * (0.75 + R() * 0.35);
        const xm = gx + ca * (ra + rb) / 2, ym = gy + sa * (ra + rb) / 2;
        if (xm < -10 || xm > 1034 || ym < -10 || ym > 820) continue;
        izBoyunca([[gx + ca * ra, gy + sa * ra], [gx + ca * rb, gy + sa * rb]], { boy: [rb - ra, rb - ra], bosluk: 0, sonum: 0, bolge: ['gok', 'gunes', 'zemin', 'cicek', 'yaprak', 'sap', 'cicekOrta'], titres: 26 });
      }
      r0 += L * 0.82;
    }
  });
  // dağlar: sırt boyunca (eğimi izleyen) iplikler
  altBoya([dagYol], [0, 600, 1024, 802]);
  bolge([dagYol], () => {
    for (let d = 0; d < 200; d += 2.6) {
      const pts = [];
      const f = Math.exp(-d / 38);
      for (let x = -10; x <= 1034; x += 4) pts.push([x, dagY(x) * f + 712 * (1 - f) + d + 1.5]);
      izBoyunca(pts, { boy: [16, 34], sonum: 0.7, titres: 14 });
    }
  });
  // zemin: yatay
  const zeminYol = H.dikdortgen(0, 798, 1024, 1024);
  altBoya([zeminYol], [0, 798, 1024, 1024]);
  bolge([zeminYol], () => yatayIzler(0, 798, 1024, 1024, 2.6, { boy: [18, 40], bolge: ['zemin', 'cicek', 'yaprak', 'sap', 'cicekOrta', 'gok'] }));
  // minare: dikey (silindir aralığıyla)
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') continue;
    let yol, x1, x2, y1, y2;
    if (p.tip === 'poligon') { yol = new Path2D(S.yol(p.noktalar, true)); x1 = Math.min(...p.noktalar.map((q) => q[0])); x2 = Math.max(...p.noktalar.map((q) => q[0])); y1 = Math.min(...p.noktalar.map((q) => q[1])); y2 = Math.max(...p.noktalar.map((q) => q[1])); }
    else if (p.tip === 'topuz') { yol = new Path2D(p.yol); x1 = 270; x2 = 330; y1 = 144; y2 = 201; }
    else { yol = H.dikdortgen(p.x1, p.y1, p.x2, p.y2); x1 = p.x1; x2 = p.x2; y1 = p.y1; y2 = p.y2; }
    if (p.tip === 'bant') continue; // zikzak: gövdenin üstünde, sonra
    altBoya([yol], [x1 - 2, y1 - 2, x2 + 2, y2 + 2]);
    const yatayMi = p.ad.startsWith('şerefe') || p.ad === 'bilezik';
    bolge([yol], () => {
      if (yatayMi) yatayIzler(x1, y1, x2, y2, 2.4, { boy: [10, 22], en: 2.5, bolge: ['minare'] });
      else dikeyIzler(300, (x2 - x1) / 2 + 1, y1, y2, 2.5, { boy: p.ad.startsWith('gövde') ? [16, 30] : [6, 12], en: 2.6, bolge: ['minare'] });
    });
  }
  // minare ayrıntıları: pencereler ve zikzak (kısa iplik kümeleri)
  const pencereIplik = (x, y, w, h, kisa) => {
    const yol = new Path2D(S.kemerYolu(x, y, w, h));
    altBoya([yol], [x - w, y - 2, x + w, y + h + 2]);
    bolge([yol], () => { for (let xx = x - w / 2 + 1; xx < x + w / 2; xx += 2.2) izBoyunca([[xx, y - 2], [xx, y + h + 2]], { boy: kisa || [6, 12], en: 2.2, bosluk: 0.8 }); });
  };
  for (const p of S.minarePencereleri) pencereIplik(p.x, p.y, p.w, p.h);
  {
    ctx.save();
    ctx.clip(H.dikdortgen(266, 522, 334, 582));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const z of S.zikzakCizgileri()) {
      const pts = z.map(([x, y]) => { const u = (x - 300) / 34; return [300 + (34 * Math.sin(u * 1.35)) / Math.sin(1.35), y]; });
      for (let i = 0; i < pts.length - 1; i++) {
        ctx.strokeStyle = css(PALET[9]); ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1] - 0.6); ctx.lineTo(pts[i + 1][0], pts[i + 1][1] - 0.6); ctx.stroke();
        ctx.strokeStyle = css(PALET[3], 0.9); ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1] + 1.6); ctx.lineTo(pts[i + 1][0], pts[i + 1][1] + 1.6); ctx.stroke();
      }
    }
    ctx.restore();
  }
  // korkuluk nişleri: küçük mor iplikler
  for (const p of S.minareParcalari().filter((q) => q.tip === 'korkuluk')) {
    const Rr = (p.x2 - p.x1) / 2;
    for (let k = 0; k < 11; k++) {
      const th = -Math.PI / 2 + (Math.PI * (k + 0.5)) / 11;
      const x = 300 + Rr * 0.96 * Math.sin(th), w = ((2 * Rr) / 11) * Math.cos(th) * 0.62;
      if (w < 1) continue;
      ctx.strokeStyle = css(th < 0 ? PALET[8] : PALET[9]); ctx.lineWidth = Math.max(1, w * 0.9); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, p.y1 + 5); ctx.lineTo(x, p.y2 - 4); ctx.stroke();
    }
  }
  // kaide: yatay
  const kaideYol = [H.dikdortgen(300, 704, 820, 800), H.dikdortgen(290, 692, 830, 704)];
  altBoya(kaideYol, [288, 690, 832, 802]);
  bolge(kaideYol, () => yatayIzler(288, 692, 832, 800, 2.5, { boy: [16, 34], bolge: ['kaide'] }));
  for (const p of S.kaide.pencereler) pencereIplik(p.x, p.y, p.w, p.h, [8, 16]);
  // kasnak: yatay
  const kasnakYol = [H.dikdortgen(352, 555, 768, 610), H.dikdortgen(334, 610, 786, 692)];
  altBoya(kasnakYol, [332, 552, 788, 694]);
  bolge(kasnakYol, () => yatayIzler(332, 553, 788, 692, 2.5, { boy: [12, 26], bolge: ['kasnak'] }));
  for (const k of [0, 1]) for (const p of S.kasnakPencereleri(k)) pencereIplik(p.x, p.y, p.w, p.h, [6, 12]);
  // kubbe: meridyen iplikleri (kaburgalar iz üstüne düşer)
  const kubbeYol = new Path2D(S.kubbeYolu);
  altBoya([kubbeYol], [356, 296, 764, 557]);
  bolge([kubbeYol], () => {
    const m = 12; // her dilimde 12 iz
    const adet = 16 * m;
    const prof = S.kubbeProfili(120);
    for (let k = 0; k <= adet; k++) {
      const fi = -Math.PI / 2 + (Math.PI * k) / adet;
      const u = Math.sin(fi);
      const pts = prof.map((q) => [560 + u * q.r, q.y]);
      pts.unshift([560 + u * 200, 560]);
      izBoyunca(pts, { boy: [16, 30], sonum: 0.7, bolge: ['kubbe', 'kasnak'] });
    }
  });
  // altın alem: hedefi koru, üstüne küçük sarı-turuncu-beyaz iplikler
  {
    const ap = S.alemParcalari(560, 300, 1);
    const ma = S.minareParcalari().find((q) => q.tip === 'alem').alem;
    const Y = S.yollar();
    ctx.save();
    const ay = new Path2D(); for (const d of Y.alem.concat(Y.minareAlem)) ay.addPath(new Path2D(d));
    ctx.clip(ay);
    ctx.drawImage(hc, 520 * 2, 180 * 2, 80 * 2, 130 * 2, 520, 180, 80, 130);
    ctx.drawImage(hc, 280 * 2, 70 * 2, 40 * 2, 82 * 2, 280, 70, 40, 82);
    ctx.restore();
    ctx.lineCap = 'round';
    for (const a of [ap, ma]) {
      for (const k of a.kureler) {
        ctx.save();
        ctx.beginPath(); ctx.arc(k.cx, k.cy, k.r, 0, Math.PI * 2); ctx.clip();
        const adim = Math.max(1.1, k.r * 0.3);
        for (let x = k.cx - k.r; x <= k.cx + k.r + 0.1; x += adim) {
          const u = (x - k.cx) / k.r;
          ctx.strokeStyle = css(u > 0.35 ? PALET[0] : u > -0.1 ? PALET[1] : u > -0.55 ? PALET[3] : PALET[4]); ctx.lineWidth = adim * 1.05;
          ctx.beginPath(); ctx.moveTo(x, k.cy - k.r); ctx.lineTo(x, k.cy + k.r); ctx.stroke();
        }
        ctx.restore();
      }
    }
  }
  // bitkiler: saplar, yapraklar (damar boyunca), tomurcuklar, çiçekler (ışınsal)
  const yaprakIplik = (y) => {
    const yol = new Path2D(S.yaprakYolu(y));
    const ext = y.uzunluk * 1.05;
    altBoya([yol], [y.x - ext, y.y - ext, y.x + ext, y.y + ext]);
    bolge([yol], () => {
      const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const W = y.uzunluk * y.genislik;
      for (let v = -W * 0.8; v <= W * 0.8; v += 2.4) {
        const pts = [];
        for (let u = -4; u <= y.uzunluk + 4; u += 3) { const bk = v * (0.85 + 0.3 * Math.sin((Math.PI * u) / y.uzunluk)); pts.push([y.x + u * ca - bk * sa, y.y + u * sa + bk * ca]); }
        izBoyunca(pts, { boy: [y.uzunluk * 0.3, y.uzunluk * 0.6], en: 2.4, sonum: 0.7 });
      }
    });
  };
  ekler.forEach(yaprakIplik);
  for (const s of B.saplar) {
    ctx.lineCap = 'round';
    for (let off = -1.2; off <= 1.2; off += 1.2) izBoyunca(s.map(([x, y]) => [x + off, y]), { boy: [14, 26], en: 2 });
  }
  B.yapraklar.forEach(yaprakIplik);
  for (const t of B.tomurcuklar) {
    const yol = new Path2D(S.tomurcukYolu(t));
    altBoya([yol], [t.x - 20, t.y - 20, t.x + 20, t.y + 20]);
    bolge([yol], () => { for (let v = -t.r; v <= t.r; v += 2) izBoyunca([[t.x - Math.cos(t.aci) * t.r - Math.sin(t.aci) * v, t.y - Math.sin(t.aci) * t.r + Math.cos(t.aci) * v], [t.x + Math.cos(t.aci) * t.r * 1.6 - Math.sin(t.aci) * v, t.y + Math.sin(t.aci) * t.r * 1.6 + Math.cos(t.aci) * v]], { boy: [8, 14], en: 2.2 }); });
  }
  for (const c of B.cicekler) {
    const yollar = [];
    for (let i = 0; i < 5; i++) yollar.push(new Path2D(H.tacYolu(c.x, c.y, c.aci + (i * Math.PI * 2) / 5, c.r * 1.02, c.r * 0.5)));
    altBoya(yollar, [c.x - c.r * 1.1, c.y - c.r * 1.1, c.x + c.r * 1.1, c.y + c.r * 1.1]);
    // her taç yaprak kendi ekseni boyunca, hafif yelpazelenen ipliklerle; ışığa uzak olanlar önce
    const sira = [0, 1, 2, 3, 4].sort((i, j) => { const ai = c.aci + (i * Math.PI * 2) / 5, aj = c.aci + (j * Math.PI * 2) / 5; return (Math.cos(ai) * 0.72 - Math.sin(ai) * 0.69) - (Math.cos(aj) * 0.72 - Math.sin(aj) * 0.69); });
    for (const i of sira) {
      const a0 = c.aci + (i * Math.PI * 2) / 5;
      bolge([yollar[i]], () => {
        const ca = Math.cos(a0), sa = Math.sin(a0);
        for (let v = -c.r * 0.55; v <= c.r * 0.55; v += 2.2) {
          const f = v / (c.r * 0.55);
          const p0 = [c.x + ca * c.r * 0.08 - sa * v * 0.2, c.y + sa * c.r * 0.08 + ca * v * 0.2];
          const p1 = [c.x + ca * c.r * 1.08 - sa * v * 1.05, c.y + sa * c.r * 1.08 + ca * v * 1.05];
          izBoyunca([p0, [(p0[0] + p1[0]) / 2 - sa * f * 2, (p0[1] + p1[1]) / 2 + ca * f * 2], p1], { boy: [c.r * 0.35, c.r * 0.6], en: 2.4, bosluk: 0.6, titres: 22 });
        }
      });
      ctx.save();
      ctx.strokeStyle = css(PALET[8], 0.7); ctx.lineWidth = 1.1;
      ctx.stroke(yollar[i]);
      ctx.restore();
    }
    // taç yaprak araları: ince leylak-mavi iplikler
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const a = c.aci + ((i + 0.5) * Math.PI * 2) / 5;
      ctx.strokeStyle = css(PALET[8], 0.85); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(c.x + Math.cos(a) * c.r * 0.22, c.y + Math.sin(a) * c.r * 0.22); ctx.lineTo(c.x + Math.cos(a) * c.r * 0.62, c.y + Math.sin(a) * c.r * 0.62); ctx.stroke();
    }
    // göbek: sarı-turuncu kısa iplikler
    const rg = c.r * 0.17;
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      ctx.strokeStyle = css(PALET[k % 3 === 0 ? 4 : k % 3 === 1 ? 2 : 3]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.x + Math.cos(a) * rg * 0.15, c.y + Math.sin(a) * rg * 0.15); ctx.lineTo(c.x + Math.cos(a) * rg * 1.1, c.y + Math.sin(a) * rg * 1.1); ctx.stroke();
    }
    for (let k = 0; k < 18; k++) {
      const a = (k / 18) * Math.PI * 2;
      const l = c.r * 0.34;
      ctx.fillStyle = css(k % 2 ? PALET[4] : PALET[2]);
      ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * l, c.y + Math.sin(a) * l, Math.max(1, c.r * 0.04), 0, Math.PI * 2); ctx.fill();
    }
  }

  // ------------------------------------------------------------ 5. iplik kabartısı + tuval greni
  {
    const [bc, bg] = H.tuval2(false);
    bg.filter = 'blur(0.8px)';
    bg.drawImage(kc, 0, 0);
    const d = bg.getImageData(0, 0, H.N, H.N).data;
    const yuk = new Float32Array(H.N * H.N);
    for (let i = 0; i < yuk.length; i++) yuk[i] = (d[i * 4] / 255) * 0.6;
    H.tuvalBezi(yuk, 4.5, 0.05, 17);
    H.kabartmaUygula(ctx, yuk, 1.6, { parlak: 0.2 });
  }
  H.titret(ctx, 0.9, 50, 174);

  SAHNE.hazir();
})();

</script>
