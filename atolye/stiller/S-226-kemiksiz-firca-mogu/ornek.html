<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-226 Kemiksiz Fırça (Mogu) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ================================================================ ressamın aletleri (j6 ortak yardımcıları)
// Gürültü, yol örnekleme, elle çekilmiş çizgi (şerit), boya tamponu (saydam/örtücü), fırça darbesi
// (iki tonlu yükleme, kıl izi, ıslak kenar), maske ve lavi. Rastgelelik yalnız SAHNE.rng ile.
const S = SAHNE;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const karistir = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
const css = (c, a) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a == null ? 1 : a})`;

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);
const NZ2 = gurultu(977);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler ve eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim) {
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}
function ofsetle(pts, d, kapali) {
  const N = normaller(pts, kapali);
  return pts.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]);
}
/** Kuadratik/kübik Bezier → nokta dizisi */
function bezier(p0, p1, p2, p3, n) {
  const out = [];
  n = n || 24;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const u = 1 - t;
    if (p3) out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    else out.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]);
  }
  return out;
}

let _ofs = 0;
/**
 * Elle çekilmiş çizgi: dolu şerit. o: w, renk, kapali, titreme(px), frek, basinc, sivri/basSivri/sonSivri, civi
 */
function serit(ctx, pts, o) {
  const n = pts.length;
  if (n < 2) return;
  const nz = o.nz || NZ;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1] + (o.kapali ? Math.hypot(pts[0][0] - pts[n - 1][0], pts[0][1] - pts[n - 1][1]) : 0);
  const N = normaller(pts, o.kapali);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const R = (L * fr) / (2 * Math.PI);
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    let q1;
    let q2;
    let q3;
    if (o.kapali) {
      const th = (t / L) * Math.PI * 2;
      const cx = Math.cos(th);
      const sx = Math.sin(th);
      q1 = nz.n(cx * R + ofs, sx * R + ofs * 0.37);
      q2 = nz.n(cx * R * 3.1 + ofs + 40, sx * R * 3.1);
      q3 = nz.n(cx * R * 0.7 + ofs + 90, sx * R * 0.7 + 3.3);
    } else {
      q1 = nz.n(t * fr + ofs, ofs * 0.37);
      q2 = nz.n(t * fr * 3.1 + ofs + 40, 5.5);
      q3 = nz.n(t * fr * 0.7 + ofs + 90, 3.3);
    }
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.wf) w *= o.wf(t / L);
    if (!o.kapali) {
      if (a1 > 0 && t < a1) w *= 0.3 + 0.7 * Math.sin(((Math.PI / 2) * t) / a1);
      if (a2 > 0 && L - t < a2) w *= 0.12 + 0.88 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
      if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    }
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  ctx.beginPath();
  if (o.kapali) {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    ctx.closePath();
    ctx.moveTo(sag[n - 1][0], sag[n - 1][1]);
    for (let i = n - 2; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  } else {
    ctx.moveTo(sol[0][0], sol[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(sol[i][0], sol[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(sag[i][0], sag[i][1]);
    ctx.closePath();
  }
  if (o.renk) ctx.fillStyle = o.renk;
  ctx.fill('nonzero');
}
function cizgiYol(ctx, d, o) {
  for (const p of ornekle(d, o.adim || 1.1)) serit(ctx, p.pts, Object.assign({ kapali: p.kapali }, o, { ofs: (_ofs += 13.7) }));
}
function cizgiNokta(ctx, pts, o) {
  serit(ctx, yenidenOrnekle(pts, o.adim || 1.1), Object.assign({}, o, { ofs: (_ofs += 13.7) }));
}
/** Cetvelle çekilmiş düz çizgi (uçlarda hafif fırça vurgusu). */
function cetvel(ctx, x1, y1, x2, y2, o) {
  const L = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.max(2, Math.ceil(L / 1.5));
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
  serit(ctx, pts, Object.assign({ titreme: 0.08, frek: 0.03, basinc: 0.12, civi: Math.min(2.2, L * 0.15), sonSivri: Math.min(2.5, L * 0.2) }, o, { ofs: (_ofs += 13.7) }));
}

// ---------------------------------------------------------------- kubbe profili
const _prof = S.kubbeProfili(400);
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}

// ---------------------------------------------------------------- boya tamponu
/**
 * Boya tamponu: 1024·olcek kare, RGB 0..1. kagit: hex.
 *  B.glaze(k, c, d): saydam boya (kâğıt rengini çarparak koyulaştırır)
 *  B.opak(k, c, a): örtücü boya
 */
function Boya(olcek, kagit) {
  this.s = olcek;
  this.W = 1024 * olcek;
  const N = this.W * this.W;
  const c = hex(kagit);
  this.R = new Float32Array(N).fill(c[0]);
  this.G = new Float32Array(N).fill(c[1]);
  this.B = new Float32Array(N).fill(c[2]);
  this.dis = null; // kâğıt dişi (−1..1), boyanın tutunmasını oynatır
  this.disGuc = 0;
  this._bv = new Float32Array(N).fill(9);
  this._u = new Float32Array(N);
  this._v = new Float32Array(N);
  this._h = new Float32Array(N);
}
Boya.prototype.tuval = function () {
  const c = S.yeniTuval(this.W, this.W);
  const x = c.getContext('2d');
  const im = x.createImageData(this.W, this.W);
  const d = im.data;
  for (let k = 0, j = 0; k < this.R.length; k++, j += 4) {
    d[j] = this.R[k] * 255;
    d[j + 1] = this.G[k] * 255;
    d[j + 2] = this.B[k] * 255;
    d[j + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
};
Boya.prototype.glaze = function (k, c, d) {
  if (d <= 0) return;
  if (d > 1) d = 1;
  this.R[k] *= 1 - d * (1 - c[0]);
  this.G[k] *= 1 - d * (1 - c[1]);
  this.B[k] *= 1 - d * (1 - c[2]);
};
Boya.prototype.opak = function (k, c, a) {
  if (a <= 0) return;
  if (a > 1) a = 1;
  this.R[k] += (c[0] - this.R[k]) * a;
  this.G[k] += (c[1] - this.G[k]) * a;
  this.B[k] += (c[2] - this.B[k]) * a;
};

/** Maske: çizim fonksiyonu (sahne koordinatında) → Float32Array (0..1) */
function maske(B, ciz) {
  const c = S.yeniTuval(B.W, B.W);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(B.s, 0, 0, B.s, 0, 0);
  x.fillStyle = '#fff';
  x.strokeStyle = '#fff';
  ciz(x);
  const d = x.getImageData(0, 0, B.W, B.W).data;
  const m = new Float32Array(B.W * B.W);
  for (let k = 0; k < m.length; k++) m[k] = d[k * 4 + 3] / 255;
  return m;
}
/** Maskeyi canvas filtresiyle bulanıklaştırır (px: sahne biriminde). */
function bulanik(B, m, px) {
  const W = B.W;
  const c = S.yeniTuval(W, W);
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(W, W);
  for (let k = 0; k < m.length; k++) {
    im.data[k * 4 + 3] = m[k] * 255;
  }
  x.putImageData(im, 0, 0);
  const c2 = S.yeniTuval(W, W);
  const x2 = c2.getContext('2d', { willReadFrequently: true });
  x2.filter = `blur(${px * B.s}px)`;
  x2.drawImage(c, 0, 0);
  const d = x2.getImageData(0, 0, W, W).data;
  const out = new Float32Array(W * W);
  for (let k = 0; k < out.length; k++) out[k] = d[k * 4 + 3] / 255;
  return out;
}

/**
 * Fırça darbesi (piksel başına). o:
 *  pts: orta çizgi (sahne koordinatı), w: yarı genişlik (sayı ya da f(t,x,y)),
 *  c1, c2: iki tonlu yükleme (v=-1 kenarı c1, v=+1 kenarı c2; [r,g,b] 0..1), d1, d2: iki kenarın yoğunluğu,
 *  gecis: tonların karışma eğrisi (1 doğrusal; >1 c1 baskın),
 *  havuz: ıslak kenar koyulaşması, kil: kıl izi şiddeti, kilSik: kıl sıklığı, kenar: kenar titremesi (0..),
 *  kuru: kuru uç oranı (0..1), opak: örtücü mü, maske: Float32Array (çarpan), ucHavuz: uçta boya birikmesi
 */
function darbe(B, o) {
  const s = B.s;
  const W = B.W;
  let pts = o.pts.map((p) => [p[0] * s, p[1] * s]);
  pts = yenidenOrnekle(pts, 1.0);
  const n = pts.length;
  if (n < 2) return;
  const cs = new Float32Array(n);
  for (let i = 1; i < n; i++) cs[i] = cs[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = cs[n - 1] || 1;
  // yumuşatılmış normaller
  const N = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 3)];
    const b = pts[Math.min(n - 1, i + 3)];
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  const ofs = (_ofs += 17.13);
  const ke = o.kenar != null ? o.kenar : 0.08;
  const kf = o.kenarFrek != null ? o.kenarFrek : 0.06;
  const hwA = new Float32Array(n);
  const hwB = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = cs[i] / L;
    const w = (typeof o.w === 'function' ? o.w(t, pts[i][0] / s, pts[i][1] / s) : o.w) * s;
    const us = cs[i] / s;
    hwA[i] = Math.max(0, w * (1 + ke * ((NZ.n(us * kf + ofs, 1.3) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs, 7.7) - 0.5) * 0.6)));
    hwB[i] = Math.max(0, w * (1 + ke * ((NZ.n(us * kf + ofs + 50, 2.9) - 0.5) * 2 + (NZ.n(us * kf * 3.7 + ofs + 50, 4.1) - 0.5) * 0.6)));
  }
  let bx0 = W;
  let by0 = W;
  let bx1 = 0;
  let by1 = 0;
  const bv = B._bv;
  const BU = B._u;
  const BV = B._v;
  const BH = B._h;
  for (let i = 0; i < n - 1; i++) {
    const ax = pts[i][0];
    const ay = pts[i][1];
    const dx = pts[i + 1][0] - ax;
    const dy = pts[i + 1][1] - ay;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) continue;
    const len = Math.sqrt(len2);
    const ex = (dx / len) * 1.2;
    const ey = (dy / len) * 1.2;
    const hA0 = hwA[i] + 1;
    const hB0 = hwB[i] + 1;
    const hA1 = hwA[i + 1] + 1;
    const hB1 = hwB[i + 1] + 1;
    const kx = [ax - ex + N[i][0] * hA0, ax - ex - N[i][0] * hB0, ax + dx + ex + N[i + 1][0] * hA1, ax + dx + ex - N[i + 1][0] * hB1];
    const ky = [ay - ey + N[i][1] * hA0, ay - ey - N[i][1] * hB0, ay + dy + ey + N[i + 1][1] * hA1, ay + dy + ey - N[i + 1][1] * hB1];
    const x0 = Math.max(0, Math.floor(Math.min(kx[0], kx[1], kx[2], kx[3]) - 1));
    const x1 = Math.min(W - 1, Math.ceil(Math.max(kx[0], kx[1], kx[2], kx[3]) + 1));
    const y0 = Math.max(0, Math.floor(Math.min(ky[0], ky[1], ky[2], ky[3]) - 1));
    const y1 = Math.min(W - 1, Math.ceil(Math.max(ky[0], ky[1], ky[2], ky[3]) + 1));
    if (x0 < bx0) bx0 = x0;
    if (y0 < by0) by0 = y0;
    if (x1 > bx1) bx1 = x1;
    if (y1 > by1) by1 = y1;
    const nx0 = N[i][0];
    const ny0 = N[i][1];
    const nx1 = N[i + 1][0];
    const ny1 = N[i + 1][1];
    const ilk = i === 0;
    const son = i === n - 2;
    for (let py = y0; py <= y1; py++) {
      const qy = py + 0.5;
      for (let px = x0; px <= x1; px++) {
        const qx = px + 0.5;
        const t = ((qx - ax) * dx + (qy - ay) * dy) / len2;
        if (t < -1.2 || t > 2.2) continue;
        if ((ilk && t < 0) || (son && t > 1)) continue;
        const tc = t < 0 ? 0 : t > 1 ? 1 : t;
        if (Math.abs(t - tc) * len > 1.1) continue;
        const cx = ax + dx * tc;
        const cy = ay + dy * tc;
        const nx = nx0 + (nx1 - nx0) * tc;
        const ny = ny0 + (ny1 - ny0) * tc;
        const sd = (qx - cx) * nx + (qy - cy) * ny;
        const hw = sd >= 0 ? hwA[i] + (hwA[i + 1] - hwA[i]) * tc : hwB[i] + (hwB[i + 1] - hwB[i]) * tc;
        const hwp = hw + 0.75;
        const av = Math.abs(sd) / hwp;
        if (av > 1) continue;
        const k = py * W + px;
        if (av < bv[k]) {
          bv[k] = av;
          BU[k] = cs[i] + tc * len;
          BV[k] = sd / hwp;
          BH[k] = hwp;
        }
      }
    }
  }
  // gölgeleme ve boyama
  const c1 = o.c1;
  const c2 = o.c2 || o.c1;
  const d1 = o.d1 != null ? o.d1 : o.d != null ? o.d : 0.8;
  const d2 = o.d2 != null ? o.d2 : d1;
  const gecis = o.gecis || 1;
  const havuz = o.havuz != null ? o.havuz : 0.35;
  const kil = o.kil != null ? o.kil : 0.25;
  const kilSik = o.kilSik != null ? o.kilSik : 0.45;
  const kuru = o.kuru || 0;
  const ucHavuz = o.ucHavuz || 0;
  const basHavuz = o.basHavuz || 0;
  const dSon = o.dSon != null ? o.dSon : 1;
  const puruz = o.puruz != null ? o.puruz : 0.7;
  const opak = !!o.opak;
  const mk = o.maske;
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;
  const kilOfs = ofs * 0.31;
  const yumusakKenar = o.yumusak != null ? o.yumusak : 1.0;
  const cb = o.renkFn; // isteğe bağlı f(t, v, x, y) → [c, d] üzerine yazar
  for (let py = by0; py <= by1; py++) {
    for (let px = bx0; px <= bx1; px++) {
      const k = py * W + px;
      const av = bv[k];
      if (av > 1.5) continue;
      bv[k] = 9;
      const u = BU[k];
      const v = BV[k];
      const hwp = BH[k];
      const t = u / L;
      const fe = Math.min(0.9, (yumusakKenar * s) / hwp);
      const avr = dis && puruz ? av + ((puruz * s) / hwp) * (0.5 + 0.5 * kenet(dis[k], -1, 1)) : av;
      let cov = 1 - yumusak(1 - fe, 1, avr);
      if (cov <= 0) continue;
      // kıl izleri: darbe boyunca uzanan ince çizgiler
      const vp = (v * hwp) / s;
      const br = NZ.n(vp * kilSik + kilOfs, (u / s) * 0.018 + kilOfs);
      const br2 = NZ2.n(vp * kilSik * 2.3 + kilOfs, (u / s) * 0.03);
      let dm = 1 + kil * ((br - 0.5) * 1.6 + (br2 - 0.5) * 0.8);
      // kuru uç
      if (kuru > 0 && t > 1 - kuru) {
        const q = (t - (1 - kuru)) / kuru;
        cov *= yumusak(q - 0.25, q + 0.15, br * 0.75 + br2 * 0.35);
      }
      // ıslak kenar
      dm *= 1 + havuz * yumusak(0.5, 0.97, av);
      if (ucHavuz > 0) dm *= 1 + ucHavuz * yumusak(0.82, 0.99, t);
      if (basHavuz > 0) dm *= 1 + basHavuz * (1 - yumusak(0.0, 0.12, t));
      if (dSon !== 1) dm *= 1 + (dSon - 1) * t;
      let m = (v + 1) * 0.5;
      if (gecis !== 1) m = Math.pow(m, gecis);
      let cr = c1[0] + (c2[0] - c1[0]) * m;
      let cg = c1[1] + (c2[1] - c1[1]) * m;
      let cbb = c1[2] + (c2[2] - c1[2]) * m;
      let d = (d1 + (d2 - d1) * m) * dm * cov;
      if (cb) {
        const r = cb(t, v, px / s, py / s, d);
        if (r) {
          cr = r[0][0];
          cg = r[0][1];
          cbb = r[0][2];
          d = r[1] * cov * dm;
        }
      }
      if (dis && disG) d *= 1 + disG * dis[k];
      if (mk) d *= mk[k];
      if (d <= 0.002) continue;
      if (opak) B.opak(k, [cr, cg, cbb], d);
      else B.glaze(k, [cr, cg, cbb], d);
    }
  }
}

/** Yarım genişlik profilleri (t: 0 giriş → 1 çıkış) */
const PROFIL = {
  // fırça topuğundan ucuna: yuvarlak giriş, sivri çıkış
  firca: (t) => (t < 0.12 ? 0.55 + 0.45 * Math.sin((Math.PI / 2) * (t / 0.12)) : 1) * (t > 0.5 ? Math.pow(Math.cos(((t - 0.5) / 0.5) * (Math.PI / 2)), 0.75) : 1),
  // iki ucu sivri yaprak
  yaprak: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.62),
  // yuvarlak uçlu kısa leke
  leke: (t) => Math.pow(Math.sin(Math.PI * kenet(t, 0, 1)), 0.4),
  // düz bant: uçlarda kısa incelme
  bant: (t) => Math.min(1, 0.6 + 0.4 * Math.sin((Math.PI / 2) * Math.min(1, t / 0.04)), 0.5 + 0.5 * Math.sin((Math.PI / 2) * Math.min(1, (1 - t) / 0.05))),
};

/** Yuvarlak topuklu, ucu incelen darbe profili (L: darbe boyu, hw: yarı genişlik, uc: incelen uç oranı). */
function yuvarlakProf(L, hw, uc, bas) {
  const cap = hw * (bas != null ? bas : 0.9);
  return (t) => {
    const d = t * L;
    let f = 1;
    if (d < cap) {
      const q = 1 - d / cap;
      f = 0.12 + 0.88 * Math.sqrt(Math.max(0, 1 - q * q));
    }
    if (uc > 0 && t > 1 - uc) f *= Math.pow(Math.max(0, Math.cos(((t - (1 - uc)) / uc) * (Math.PI / 2))), 0.55);
    return f;
  };
}

/** Yatay (ya da açılı) lavi: maske üzerinde düz renk, fırça sırası izi ve kenar havuzu. */
function lavi(B, m, o) {
  const W = B.W;
  const s = B.s;
  const c = o.c;
  const d0 = o.d != null ? o.d : 0.5;
  const pool = o.havuz != null ? o.havuz : 0.4;
  const bl = o.havuzEn ? bulanik(B, m, o.havuzEn) : null;
  const aci = o.aci || 0;
  const ca = Math.cos(aci);
  const sa = Math.sin(aci);
  const sira = o.sira || 0; // fırça sırası izinin şiddeti
  const siraEn = o.siraEn || 40;
  const dalga = o.dalga != null ? o.dalga : 0.12;
  const nz = o.nz || NZ;
  const ofs = (_ofs += 23.1);
  const dis = B.dis;
  const disG = (o.dis != null ? o.dis : 1) * B.disGuc;
  const yf = o.yogFn;
  const cf = o.renkFn;
  for (let py = 0; py < W; py++) {
    for (let px = 0; px < W; px++) {
      const k = py * W + px;
      const mv = m[k];
      if (mv <= 0.003) continue;
      const x = px / s;
      const y = py / s;
      const a = x * ca + y * sa; // fırça yönü boyunca
      const b = -x * sa + y * ca; // fırça yönüne dik
      let d = d0;
      if (yf) d = yf(x, y, d);
      // dalgalı yoğunluk
      d *= 1 + dalga * ((nz.fbm(x * 0.012 + ofs, y * 0.012, 3) - 0.5) * 2);
      if (sira) {
        // her fırça sırası: kenarı titrek bant, bindirme yeri biraz koyu
        const bb = b / siraEn + (nz.n(a * 0.01 + ofs, b * 0.002) - 0.5) * 0.5;
        const fr = bb - Math.floor(bb);
        const bindir = yumusak(0.86, 0.97, fr) * (1 - yumusak(0.97, 1.0, fr));
        d *= 1 + sira * (bindir * 1.3 - 0.25 + (nz.n(a * 0.004 + Math.floor(bb) * 7.1, 3.3) - 0.5) * 0.6);
        // kıl izi
        d *= 1 + sira * 0.5 * (nz.n(b * 0.5 + ofs, a * 0.008) - 0.5);
      }
      if (bl && pool) {
        const e = Math.max(0, mv - bl[k]);
        d *= 1 + pool * Math.min(1, e * 2.6);
      }
      if (dis && disG) d *= 1 + disG * dis[k];
      d *= mv;
      const col = cf ? cf(x, y) : c;
      if (o.opak) B.opak(k, col, d);
      else B.glaze(k, col, d);
    }
  }
}

/** Kâğıt dişi: −1..1 alanı (lif + tane). */
function kagitDisi(B, o) {
  const W = B.W;
  const s = B.s;
  const a = new Float32Array(W * W);
  const nz = gurultu(o.tohum || 31);
  const lif = o.lif || 0;
  const tane = o.tane != null ? o.tane : 1;
  const olc = o.olcek || 0.35;
  for (let py = 0; py < W; py++) {
    for (let px = 0; px < W; px++) {
      const x = px / s;
      const y = py / s;
      let v = (nz.fbm(x * olc, y * olc, 3) - 0.5) * 2 * tane;
      if (lif) v += (nz.n(x * 0.05 + y * 0.9, y * 0.05 - x * 0.2) - 0.5) * 2 * lif;
      v += (karma(px, py, 3) - 0.5) * 0.3;
      a[py * W + px] = v;
    }
  }
  B.dis = a;
  return a;
}

function pikselGecis(ctx, fn) {

/** Sivri kemer biçimli pencere: aşağıdan yukarı tek darbe, ucu sivri. */
function kemerDarbe(x, yTepe, w, h, c1, c2, d1, d2, o) {
  const pts = [];
  for (let i = 0; i <= 14; i++) pts.push([x, yTepe + h - (h * i) / 14]);

          const hw = w / 2;
          if (t < 1 - kemerOran) return hw;
          const q = (t - (1 - kemerOran)) / kemerOran;
          return hw * Math.pow(1 - q * q, 0.55) * (1 - 0.15 * q);
        },
        c1,
        c2,
        d1,
        d2,
        havuz: 0.35,
        kil: 0.12,
        kenar: 0.03,
        yumusak: 0.7,

  dikDarbe(c, 488, 800, 34.5, P.tasG, tasA, 0.66, 0.22, { gecis: 0.85, havuz: 0.3, kil: 0.28, kilSik: 0.3, maske: minAlt });
  // zikzak bant: ince gri-mor vurgular
  for (const z of S.zikzakCizgileri()) {
    darbe(B, { pts: z, w: 1.3, c1: P.morK, c2: P.morK, d1: 0.7, d2: 0.7, havuz: 0.2, kil: 0.1, kenar: 0.1, yumusak: 0.6, maske: yapiAyrim });
  }
  // çıkma 1: alt yüzü gölgede
  const cikma = (yU, yA, wU, wA) => {
    const m = maske(B, (x) => {
      x.beginPath();
      x.moveTo(c - wA, yA);
      x.lineTo(c - wU, yU);
      x.lineTo(c + wU, yU);
      x.lineTo(c + wA, yA);
      x.closePath();
      x.fill();
    });
    for (let k = 0; k < m.length; k++) m[k] *= yapiAyrim[k];
    yatayDarbe(c - wU - 6, c + wU + 6, (yU + yA) / 2, (yA - yU) / 2 + 3, P.tasG, P.morK, 0.55, 0.62, { maske: m, havuz: 0.2 });
  };
  cikma(468, 488, 52, 34);
  yatayDarbe(c - 55, c + 55, 462, 6.5, tasA, P.tasG, 0.35, 0.55);
  // korkuluk 1
  yatayDarbe(c - 48, c + 48, 446, 10, P.tas, P.tas, 0.3, 0.35, { havuz: 0.15 });
  for (let i = 0; i < 9; i++) {
    const x = c - 48 + 5 + ((96 - 10) * (i + 0.5)) / 9;
    dikDarbe(x, 440, 455, 2.2, P.morK, P.mor, 0.55, 0.45, { havuz: 0.15, yumusak: 0.6 });
  }
  yatayDarbe(c - 49, c + 49, 437.5, 2.2, P.tasG, P.tasG, 0.6, 0.6, { yumusak: 0.6 });
  // orta gövde
  dikDarbe(c, 316, 436, 27.5, P.tasG, tasA, 0.66, 0.22, { gecis: 0.85, kil: 0.28, kilSik: 0.3 });
  cikma(300, 316, 43, 27);
  yatayDarbe(c - 46, c + 46, 295, 5.5, tasA, P.tasG, 0.35, 0.55);
  yatayDarbe(c - 40, c + 40, 281, 9, P.tas, P.tas, 0.3, 0.35, { havuz: 0.15 });
  for (let i = 0; i < 8; i++) {
    const x = c - 40 + 5 + ((80 - 10) * (i + 0.5)) / 8;
    dikDarbe(x, 276, 289, 2, P.morK, P.mor, 0.55, 0.45, { havuz: 0.15, yumusak: 0.6 });
  }
  yatayDarbe(c - 41, c + 41, 273.5, 2, P.tasG, P.tasG, 0.6, 0.6, { yumusak: 0.6 });
  // üst gövde
  dikDarbe(c, 206, 272, 19.5, P.tasG, tasA, 0.66, 0.22, { gecis: 0.85, kil: 0.28, kilSik: 0.3 });
  // bilezik
  yatayDarbe(c - 26, c + 26, 202, 4.5, P.tasG, P.morK, 0.45, 0.6);
  // topuz: aşağıdan yukarı tek darbe, genişliği soğan biçimi
  {
    const sol = bezier([278, 200], [266, 182], [288, 160], [300, 146], 40);
    const yw = (y) => {
      for (let i = 0; i < sol.length - 1; i++) {
        if (y <= sol[i][1] && y >= sol[i + 1][1]) {
          const q = (sol[i][1] - y) / (sol[i][1] - sol[i + 1][1] || 1);
          return c - (sol[i][0] + (sol[i + 1][0] - sol[i][0]) * q);
        }
      }
      return 0;
    };
    const pts = [];
    for (let i = 0; i <= 20; i++) pts.push([c, 201 - (55 * i) / 20]);
    darbe(B, { pts, w: (t, x, y) => Math.max(0, yw(y) - 0.6), c1: P.tasG, c2: tasA, d1: 0.7, d2: 0.3, gecis: 0.8, havuz: 0.35, kil: 0.15, kenar: 0.02, maske: yapiAyrim });
  }
  // pencereler
  for (const p of S.minarePencereleri) kemerDarbe(p.x, p.y, p.w, p.h, P.morK, P.mor, 0.75, 0.6);
}

// ------------------------------------------------------------------ kaide: soluk yatay darbeler
{
  const K = S.kaide;
  const sira = [[704, 753], [751, 801]];
  sira.forEach(([y1, y2], i) => {
    const yc = (y1 + y2) / 2;
    const hw = (y2 - y1) / 2;
    yatayDarbe(K.x1 + 0.5, K.x2 - 0.5, yc, hw, i ? P.tas : tasA, i ? P.tasG : P.tas, 0.5, 0.55, {
      havuz: 0.25,
      kil: 0.28,
      kilSik: 0.3,
      renkFn: (t, v, x) => {
        const m = (v + 1) / 2;
        const sol = 1 - yumusak(300, 520, x);
        return [karistir(karistir(i ? P.tas : tasA, i ? P.tasG : P.tas, m), P.tasG, sol * 0.6), (0.36 + 0.2 * m + 0.18 * sol) * (i ? 1.1 : 0.9)];
      },
    });
  });
  // korniş ve altındaki gölge
  yatayDarbe(K.kornis.x1, K.kornis.x2, 698, 6, tasA, P.tas, 0.25, 0.4, { havuz: 0.3 });
  yatayDarbe(K.x1 + 2, K.x2 - 2, 706.5, 2.6, P.morK, P.mor, 0.5, 0.35, { havuz: 0.15, yumusak: 0.7 });
  for (const p of K.pencereler) kemerDarbe(p.x, p.y, p.w, p.h, P.morK, P.mor, 0.72, 0.55);
}

// ------------------------------------------------------------------ kasnak: dikey darbeler (silindir), pencereler koyu tek darbe
function kasnakBoya(kat) {
  const q = S.kasnak[kat];
  const cx = (q.x1 + q.x2) / 2;
  const Rh = (q.x2 - q.x1) / 2;
  const n = q.pencere.adet;
  const merk = [];
  for (let j = 0; j < n; j++) {
    const th = -Math.PI / 2 + (Math.PI * (j + 0.5)) / n;
    merk.push(cx + Rh * 0.92 * Math.sin(th));
  }
  const yc = (q.y1 + q.y2) / 2;
  const hw = (q.y2 - q.y1) / 2;
  yatayDarbe(q.x1 + 0.3, q.x2 - 0.3, yc, hw, P.koyu, P.taze, 0.9, 0.8, {
    havuz: 0.32,
    kil: 0.32,
    kilSik: 0.32,
    kenar: 0.015,
    renkFn: (t, v, x) => {
      const s = kenet((x - cx) / Rh, -1, 1);
      const isik = kenet(0.5 + 0.5 * Math.cos(Math.asin(s) - 0.7), 0, 1);
      const m = (v + 1) / 2;
      const ust = karistir(P.derin, P.koyu, isik);
      const alt = karistir(P.koyu, karistir(P.taze, P.sari, isik), 0.3 + 0.7 * isik);
      return [karistir(ust, alt, Math.pow(m, 0.8)), 0.97 - 0.3 * isik * m];
    },
  });
  // üst kenarda ince koyu bant (silme)
  yatayDarbe(q.x1, q.x2, q.y1 + 2, 2.2, P.derin, P.koyu, 0.5, 0.3, { havuz: 0.1, yumusak: 0.6 });
  for (const p of S.kasnakPencereleri(kat)) {
    const s = (p.x - cx) / Rh;
    kemerDarbe(p.x, p.y, p.w, p.h, P.derin, P.koyu, 0.95, 0.8 - 0.2 * kenet(s, 0, 1));
  }
}
kasnakBoya(1);
kasnakBoya(0);

// ------------------------------------------------------------------ kubbe: dilim başına tek, iki tonlu darbe (yelpaze)
{
  const ub = [-1];
  for (let k = 1; k < 16; k++) ub.push(Math.sin(-Math.PI / 2 + (Math.PI * k) / 16));
  ub.push(1);
  const dilimler = [];
  for (let j = 0; j < 16; j++) dilimler.push([ub[j], ub[j + 1]]);
  // dış ikişer dilimi birleştir
  const ds = [[ub[0], ub[2]], ...dilimler.slice(2, 14), [ub[14], ub[16]]];
  ds.forEach(([u1, u2], j) => {
    const uc = (u1 + u2) / 2;
    const isik = kenet(0.55 + 0.55 * uc - 0.25 * Math.max(0, uc - 0.75) * 4, 0, 1); // sağ taraf aydınlık, en kenar biraz döner
    const bosluk = 0.55 + r() * 0.5;
    const pts = [];
    for (let i = 0; i <= 50; i++) {
      const y = 556 - (254 * i) / 50;
      pts.push([560 + uc * kubbeR(y), y]);
    }
    const c1 = karistir(P.derin, P.koyu, isik * 0.9);
    const c2 = karistir(P.koyu, karistir(P.taze, P.sari, isik), 0.35 + isik * 0.65);
    darbe(B, {
      pts,
      w: (t, x, y) => Math.max(0, ((u2 - u1) / 2) * kubbeR(y) - bosluk / 2),
      c1,
      c2,
      d1: 0.98 - isik * 0.12,
      d2: 0.86 - isik * 0.36,
      gecis: 1.15,
      dSon: 0.82,
      havuz: 0.38,
      kil: 0.28,
      kilSik: 0.35,
      kenar: 0.025,
      kenarFrek: 0.03,
      basHavuz: 0.12,
      maske: yapiAyrim,
    });
  });
}

// ------------------------------------------------------------------ alemler: altın sarısı küçük darbeler
function alemBoya(a) {
  // çubuk
  dikDarbe(a.cubuk.x1 / 2 + a.cubuk.x2 / 2, a.cubuk.y1, a.cubuk.y2, (a.cubuk.x2 - a.cubuk.x1) / 2 + 0.2, P.okr, P.sariC, 0.8, 0.7, { havuz: 0.2, yumusak: 0.6, maske: null });
  // yaka
  {
    const pts = [];
    for (let i = 0; i <= 10; i++) pts.push([a.yaka.cx - a.yaka.rx + (2 * a.yaka.rx * i) / 10, a.yaka.cy]);
    darbe(B, { pts, w: (t) => a.yaka.ry * Math.pow(Math.sin(Math.PI * t), 0.45), c1: P.sariC, c2: P.okr, d1: 0.8, d2: 0.95, havuz: 0.3, kil: 0.1, kenar: 0.02, yumusak: 0.6 });
  }
  // küreler: yuvarlak leke
  for (const k of a.kureler) {
    const pts = [];
    for (let i = 0; i <= 10; i++) pts.push([k.cx - k.r + (2 * k.r * i) / 10, k.cy]);
    darbe(B, { pts, w: (t) => k.r * Math.pow(Math.sin(Math.PI * t), 0.5), c1: P.sariC, c2: P.okr, d1: 0.85, d2: 0.95, gecis: 1.4, havuz: 0.3, kil: 0.1, kenar: 0.02, yumusak: 0.6 });
  }
  // hilal: alt yay boyunca, ortası kalın uçları sivri
  const h = a.hilal;
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const ang = Math.PI - 0.5 - ((Math.PI - 1.0) * i) / 30;
    pts.push([h.cx + Math.cos(ang) * h.R * 0.8, h.cy + Math.sin(ang) * h.R * 0.8]);
  }
  darbe(B, { pts, w: (t) => h.R * 0.27 * Math.pow(Math.sin(Math.PI * t), 0.8), c1: P.okr, c2: P.sariC, d1: 0.95, d2: 0.85, havuz: 0.25, kil: 0.1, kenar: 0.02, yumusak: 0.6 });
}
alemBoya(S.alemParcalari(560, 300, 1));
alemBoya(S.alemParcalari(300, 146, 0.62));

// ------------------------------------------------------------------ bitkiler
// saplar
for (const s of S.bitki.saplar) {
  darbe(B, { pts: s, w: (t) => 2.6 - 1.4 * t, c1: hex('#4E7F46'), c2: hex('#7FAE62'), d1: 0.85, d2: 0.7, havuz: 0.2, kil: 0.15, kenar: 0.12, yumusak: 0.6, maske: ayrim });
}
// tomurcuklara kısa sap (öndeki saplı olmayanlar)
S.bitki.tomurcuklar.forEach((t, i) => {
  if (i < 8) return;
  const pts = bezier([t.x + 2, t.y + 34], [t.x - 3, t.y + 22], [t.x - Math.cos(t.aci) * 6, t.y - Math.sin(t.aci) * 6 + 2], null, 12);
  darbe(B, { pts, w: (q) => 1.8 - 0.6 * q, c1: hex('#4E7F46'), c2: hex('#7FAE62'), d1: 0.8, d2: 0.7, havuz: 0.15, kil: 0.1, kenar: 0.1, yumusak: 0.6, maske: ayrim });
});
// yapraklar: büyükler iki yarım darbe (ortada kâğıt damar), küçükler tek darbe
const yaprakProf = (t) => Math.pow(Math.sin(Math.PI * Math.pow(kenet(t, 0, 1), 0.85)), 0.62);
S.bitki.yapraklar.forEach((y, i) => {
  const L = y.uzunluk;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const bukul = (r() - 0.5) * 0.25 * L;
  const on = i >= 36; // öndeki yelpaze
  const ton = r();
  const koyuK = karistir(P.koyu, P.derin, on ? 0.35 + ton * 0.4 : ton * 0.3);
  const acikK = karistir(P.taze, P.sari, on ? ton * 0.5 : 0.4 + ton * 0.6);
  const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  if (L > 52) {
    for (const yan of [-1, 1]) {
      const pts = [];
      for (let k = 0; k <= 20; k++) {
        const t = k / 20;
        const v = yan * (0.1 * L * yaprakProf(t) + 0.9) + bukul * Math.sin(Math.PI * t);
        pts.push(p(L * t, v));
      }
      darbe(B, {
        pts,
        w: (t) => Math.max(0, 0.1 * L * yaprakProf(t) - 0.15),
        c1: yan < 0 ? koyuK : acikK,
        c2: yan < 0 ? acikK : koyuK,
        d1: yan < 0 ? 0.95 : 0.7,
        d2: yan < 0 ? 0.7 : 0.95,
        gecis: 1,
        havuz: 0.35,
        kil: 0.22,
        kilSik: 0.6,
        kenar: 0.04,
        dSon: 0.85,
        maske: ayrim,
      });
    }
  } else {
    const pts = [];
    for (let k = 0; k <= 20; k++) {
      const t = k / 20;
      pts.push(p(L * t, bukul * Math.sin(Math.PI * t)));
    }
    const ters = r() < 0.5;
    darbe(B, {
      pts,
      w: (t) => 0.2 * L * yaprakProf(t),
      c1: ters ? acikK : koyuK,
      c2: ters ? koyuK : acikK,
      d1: ters ? 0.72 : 0.95,
      d2: ters ? 0.95 : 0.72,
      havuz: 0.35,
      kil: 0.22,
      kilSik: 0.6,
      kenar: 0.04,
      dSon: 0.85,
      maske: ayrim,
    });
  }
});
// tomurcuklar: soluk mor taç, yeşil çanak
for (const t of S.bitki.tomurcuklar) {
  const ca = Math.cos(t.aci);
  const sa = Math.sin(t.aci);
  const pts = [];
  for (let k = 0; k <= 12; k++) {
    const u = -t.r * 0.9 + (t.r * 2.5 * k) / 12;
    pts.push([t.x + u * ca, t.y + u * sa]);
  }
  darbe(B, { pts, w: (q) => t.r * 0.8 * Math.pow(Math.sin(Math.PI * Math.pow(q, 0.7)), 0.6), c1: P.morK, c2: hex('#E8D9EA'), d1: 0.75, d2: 0.35, havuz: 0.4, kil: 0.1, kenar: 0.03, yumusak: 0.7 });
  for (const yan of [-1, 1]) {
    const pts2 = [];
    for (let k = 0; k <= 8; k++) {
      const u = -t.r * 1.0 + (t.r * 1.2 * k) / 8;
      const v = yan * t.r * 0.45 * Math.sin((Math.PI * k) / 8);
      pts2.push([t.x + u * ca - v * sa, t.y + u * sa + v * ca]);
    }
    darbe(B, { pts: pts2, w: (q) => t.r * 0.28 * Math.sin(Math.PI * q), c1: P.koyu, c2: P.taze, d1: 0.85, d2: 0.7, havuz: 0.2, kil: 0.1, yumusak: 0.6 });
  }
}
// çiçekler: taç yaprakları ortadan dışa tek darbe, kâğıt beyazı; bir kenarı soluk gri-mor
const tacProf = (t) => (t < 0.62 ? 0.28 + 0.72 * Math.sin((Math.PI / 2) * (t / 0.62)) : Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.62) / 0.38, 2))));
for (const c of S.bitki.cicekler) {
  const n = 5;
  for (let i = 0; i < n; i++) {
    const a = c.aci + (i * Math.PI * 2) / n + (r() - 0.5) * 0.12;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const pts = [];
    const kv = (r() - 0.5) * 0.16 * c.r;
    for (let k = 0; k <= 16; k++) {
      const t = k / 16;
      const u = c.r * (0.1 + 0.95 * t);
      const v = kv * Math.sin(Math.PI * t);
      pts.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    darbe(B, {
      pts,
      w: (t) => c.r * 0.43 * tacProf(t),
      c1: P.morK,
      c2: P.mor,
      renkFn: (t, v) => {
        const m = (v + 1) / 2;
        const kenarM = Math.pow(1 - m, 2.4);
        const dip = 1 - yumusak(0.04, 0.4, t);
        const dm = 0.34 * kenarM + 0.03;
        const dd = 0.3 * dip;
        const tot = dm + dd;
        return [karistir(P.morK, hex('#D8DFA6'), dd / tot), Math.min(0.5, tot)];
      },
      havuz: 0.2,
      kil: 0.18,
      kilSik: 0.5,
      kenar: 0.05,
      kenarFrek: 0.08,
      basHavuz: 0.2,
      yumusak: 0.8,
      puruz: 0.9,
    });
  }
  // orta: sarı leke ve ercikler
  {
    const pts = [];
    const rr = c.r * 0.17;
    for (let i = 0; i <= 8; i++) pts.push([c.x - rr + (2 * rr * i) / 8, c.y]);
    darbe(B, { pts, w: (t) => rr * Math.pow(Math.sin(Math.PI * t), 0.5), c1: P.sariC, c2: hex('#E2B443'), d1: 0.8, d2: 0.9, havuz: 0.3, kil: 0.1, yumusak: 0.6 });
    const ne = Math.max(6, Math.round(c.r * 0.3));
    for (let i = 0; i < ne; i++) {
      const a = (i / ne) * Math.PI * 2 + r() * 0.3;
      const rad = c.r * (0.24 + r() * 0.06);
      const x = c.x + Math.cos(a) * rad;
      const y = c.y + Math.sin(a) * rad;
      const rp = Math.max(1.1, c.r * 0.035);
      darbe(B, { pts: [[x - rp, y], [x + rp, y]], w: (t) => rp * Math.pow(Math.sin(Math.PI * t), 0.5), c1: P.okr, c2: P.okr, d1: 0.85, d2: 0.85, havuz: 0.1, kil: 0, yumusak: 0.5 });
    }
  }
}

// ------------------------------------------------------------------ ekrana
const ctx = anaTuval();
ctx.drawImage(B.tuval(), 0, 0, 1024, 1024);
S.hazir();
