<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-122 Gradyan Vektör — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #A9C8EE; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-122 Gradyan Vektör (Gradient Vector) — her biçim kontursuz ve çok duraklı doğrusal / dairesel
  // degradeyle dolu: gök maviden ufuk ışıltısına, kubbe dilimleri zümrütten limon yeşiline, taş kremden
  // şeftaliye. Biçim sınırlarını çizgi değil, komşu degradelerin farkı belirler. Pürüzsüz, ışıltılı, dingin.
  const S = SAHNE;
  const OL = 2;
  const ctx = S.tuval(document.getElementById('tuval'), OL);
  const rnd = S.rng(122);

  // ---------------------------------------------------------------- yardımcılar
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  function lin(x1, y1, x2, y2, duraklar) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    for (const [t, renk] of duraklar) g.addColorStop(Math.max(0, Math.min(1, t)), renk);
    return g;
  }
  function rad(x0, y0, r0, x1, y1, r1, duraklar) {
    const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const [t, renk] of duraklar) g.addColorStop(Math.max(0, Math.min(1, t)), renk);
    return g;
  }
  function dol(d, stil) {
    ctx.fillStyle = stil;
    ctx.fill(P2(d));
  }
  function kirp(d, fn) {
    ctx.save();
    ctx.clip(P2(d));
    fn();
    ctx.restore();
  }
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = (c, a) => (a === undefined ? `rgb(${c.map(Math.round).join(',')})` : `rgba(${c.map(Math.round).join(',')},${a})`);
  const karis = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  /** Renk rampası: [[t, '#hex'], ...] → t'deki renk */
  function rampa(duraklar) {
    const d = duraklar.map(([t, h]) => [t, hex(h)]);
    return (t) => {
      if (t <= d[0][0]) return d[0][1];
      for (let i = 0; i < d.length - 1; i++) {
        if (t <= d[i + 1][0]) return karis(d[i][1], d[i + 1][1], (t - d[i][0]) / (d[i + 1][0] - d[i][0]));
      }
      return d[d.length - 1][1];
    };
  }
  const prof = S.kubbeProfili(400);
  const L = [0.7071, -0.7071]; // ışık yönü (sağ üst)

  // ================================================================ GÖK: maviden ufuk ışıltısına
  dol(dik(0, 0, 1024, 1024), lin(0, 0, 0, 800, [[0, '#4C93E8'], [0.2, '#76AAF0'], [0.38, '#A3B3F3'], [0.53, '#C6B4EE'], [0.66, '#E6B6E0'], [0.78, '#F9BDCB'], [0.89, '#FFCDB0'], [1, '#FFE09A']]));
  // güneşin geniş ışıltısı
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  dol(dik(0, 0, 1024, 1024), rad(880, 140, 0, 880, 140, 520, [[0, 'rgba(255,246,214,0.95)'], [0.18, 'rgba(255,236,200,0.55)'], [0.45, 'rgba(255,220,200,0.18)'], [1, 'rgba(255,220,200,0)']]));
  ctx.restore();
  dol(S.daireYolu(880, 140, 96), rad(880, 140, 50, 880, 140, 96, [[0, 'rgba(255,255,245,0.5)'], [1, 'rgba(255,250,235,0)']]));
  dol(S.daireYolu(880, 140, 56), rad(892, 128, 0, 880, 140, 56, [[0, '#FFFFFF'], [0.45, '#FFF6D2'], [0.85, '#FFE3A0'], [1, '#FFD685']]));

  // bulutlar: katmanlı, her katman kendi dikey degradesiyle
  function bulutYolu(x, y, s, parcalar) {
    const yol = new Path2D();
    for (const [dx, dy, rr] of parcalar) {
      yol.moveTo(x + (dx + rr) * s, y + dy * s);
      yol.arc(x + dx * s, y + dy * s, rr * s, 0, Math.PI * 2);
    }
    return yol;
  }
  function bulut(x, y, s) {
    const arka = bulutYolu(x, y, s, [[-58, -6, 22], [-22, -24, 34], [24, -30, 40], [62, -10, 26]]);
    arka.roundRect(x - 84 * s, y - 18 * s, 168 * s, 18 * s, 9 * s);
    dol(arka, lin(0, y - 70 * s, 0, y, [[0, 'rgba(255,255,255,0.96)'], [0.45, 'rgba(246,234,250,0.94)'], [0.8, 'rgba(236,208,238,0.92)'], [1, 'rgba(246,196,214,0.9)']]));
    const on = bulutYolu(x, y + 8 * s, s, [[-30, -10, 24], [6, -20, 28], [40, -8, 20]]);
    on.roundRect(x - 54 * s, y - 4 * s, 114 * s, 12 * s, 6 * s);
    dol(on, lin(x + 40 * s, y - 30 * s, x - 30 * s, y + 10 * s, [[0, 'rgba(255,253,240,1)'], [0.4, 'rgba(255,244,246,0.98)'], [0.75, 'rgba(244,214,236,0.96)'], [1, 'rgba(250,196,206,0.95)']]));
  }
  bulut(178, 262, 1.12);
  bulut(478, 156, 0.7);
  bulut(822, 380, 0.92);
  bulut(76, 478, 0.5);

  // uzakta alçak, degradeli kum tepeleri (ufuk ışıltısının önünde)
  function tepe(y0, genlik, faz, duraklar) {
    let d = 'M-10,812';
    for (let x = -10; x <= 1034; x += 6) {
      const y = y0 - genlik * (0.55 + 0.45 * Math.sin(x / 150 + faz)) * (0.6 + 0.4 * Math.sin(x / 61 + faz * 2.3));
      d += ` L${x},${y.toFixed(2)}`;
    }
    d += ' L1034,812 Z';
    dol(d, lin(0, y0 - genlik, 0, 806, duraklar));
  }
  tepe(782, 52, 0.4, [[0, '#E99AB8'], [0.45, '#F3B0BC'], [1, '#FBD2BE']]);
  tepe(800, 30, 2.2, [[0, '#F7B2A6'], [0.5, '#FAC6AE'], [1, '#FDDDB8']]);

  // ================================================================ YER
  dol(dik(0, 800, 1024, 1024), lin(0, 800, 0, 1024, [[0, '#FFE4C0'], [0.5, '#FBD0AE'], [1, '#F6BFA2']]));
  // önde gül-altın kum tepeleri: sırtı ışıkta altın, eteği gül
  function kumTepe(y0, genlik, dalga, faz, duraklar) {
    let d = `M-10,1040 L-10,${y0}`;
    for (let x = -10; x <= 1034; x += 6) {
      const y = y0 - genlik * Math.sin(x / dalga + faz) - genlik * 0.4 * Math.sin(x / (dalga * 0.43) + faz * 1.9);
      d += ` L${x},${y.toFixed(2)}`;
    }
    d += ' L1034,1040 Z';
    dol(d, lin(0, y0 - genlik * 1.4, 0, y0 + 120, duraklar));
    dol(d, lin(1024, y0 - 60, 0, y0 + 60, [[0, 'rgba(255,240,190,0.35)'], [0.5, 'rgba(255,240,190,0)'], [1, 'rgba(200,120,170,0.18)']]));
  }
  kumTepe(870, 18, 120, 1.2, [[0, '#FFE2A8'], [0.25, '#FBC4AE'], [0.7, '#F1A3B4'], [1, '#E996B4']]);
  kumTepe(948, 22, 150, 3.0, [[0, '#FFDCA0'], [0.3, '#F8B6AC'], [1, '#E78FB0']]);

  // yapının yere düşen degradeli gölgesi (sola, ışıktan uzağa)
  dol('M300,800 L820,800 L780,826 L190,840 Z', lin(820, 800, 190, 840, [[0, 'rgba(206,130,150,0.34)'], [0.6, 'rgba(214,146,160,0.2)'], [1, 'rgba(230,175,170,0)']]));

  // ================================================================ MİNARE
  const minare = S.minareParcalari();
  const mx = S.minare.cx;
  const TAS = [[0, '#DDB2BE'], [0.18, '#EDC9C6'], [0.46, '#FBE5D8'], [0.7, '#FFF7EC'], [0.86, '#FFFDF6'], [1, '#F6DAC6']];
  const TAS_ALT = [[0, '#D2A69C'], [0.5, '#E6C0B2'], [0.8, '#F0D2C2'], [1, '#DDB3A6']];
  function xAralik(p) {
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      return [Math.min(...xs), Math.max(...xs)];
    }
    if (p.tip === 'topuz') return [mx - 30, mx + 30];
    return [p.x1, p.x2];
  }
  for (const p of minare) {
    if (p.tip === 'alem' || p.tip === 'bant') continue;
    const [a, b] = xAralik(p);
    if (p.tip === 'poligon') {
      const d = S.yol(p.noktalar, true);
      const ys = p.noktalar.map((q) => q[1]);
      const y1 = Math.min(...ys), y2 = Math.max(...ys);
      if (p.ad.startsWith('çıkma')) dol(d, lin(a, 0, b, 0, TAS_ALT));
      else {
        dol(d, lin(a, 0, b, 0, TAS));
        // dikey ikinci degrade: aşağı doğru sıcak şeftali ışıltısı
        dol(d, lin(0, y1, 0, y2, [[0, 'rgba(255,255,255,0)'], [1, p.ad === 'gövde-alt' ? 'rgba(250,196,170,0.35)' : 'rgba(250,200,180,0.12)']]));
      }
    } else if (p.tip === 'korkuluk') {
      dol(dik(p.x1, p.y1, p.x2, p.y2), lin(a, 0, b, 0, [[0, '#D9A99F'], [0.6, '#EDCABB'], [1, '#DFB4A6']]));
      const adet = 9, bw = 4.6;
      for (let i = 0; i <= adet; i++) {
        const x = p.x1 + bw / 2 + ((p.x2 - p.x1 - bw) * i) / adet;
        dol(dik(x - bw / 2, p.y1 + 4, x + bw / 2, p.y2), lin(x - bw / 2, p.y1, x + bw / 2, p.y2, [[0, '#F2D3C4'], [0.6, '#FFF8F0'], [1, '#F6DDCE']]));
      }
      dol(dik(p.x1, p.y1, p.x2, p.y1 + 4.5), lin(a, 0, b, 0, TAS));
    } else if (p.tip === 'topuz') {
      dol(p.yol, rad(mx + 9, 164, 1, mx, 178, 36, [[0, '#FFFFFF'], [0.4, '#FFF2E6'], [0.8, '#F1CDBE'], [1, '#E4B7AA']]));
    }
  }
  // zikzak: degradeli şerit
  {
    const b = minare.find((p) => p.tip === 'bant');
    dol(dik(b.x1, b.y1, b.x2, b.y2), lin(b.x1, 0, b.x2, 0, [[0, '#E6BCAF'], [0.5, '#F8DCCB'], [0.75, '#FFEEDF'], [1, '#EFCDBD']]));
    ctx.lineJoin = 'miter';
    ctx.lineWidth = 3.4;
    for (const z of S.zikzakCizgileri()) {
      ctx.strokeStyle = lin(b.x1, 0, b.x2, 0, [[0, '#C98C88'], [0.6, '#E2A890'], [1, '#D4968A']]);
      ctx.stroke(P2(S.yol(z.map(([x, y]) => [x, y + 2]))));
    }
  }
  for (const p of S.minarePencereleri) pencere(p.x, p.y, p.w, p.h);
  alem(minare.find((p) => p.tip === 'alem').alem);

  // ================================================================ KAİDE: kremden şeftaliye
  const K = S.kaide;
  dol(dik(K.x1, K.y1, K.x2, K.y2), lin(0, K.y1, 0, K.y2, [[0, '#FFF6EA'], [0.55, '#FDE7D4'], [1, '#F7CDB2']]));
  dol(dik(K.x1, K.y1, K.x2, K.y2), lin(K.x1, 0, K.x2, 0, [[0, 'rgba(214,160,150,0.42)'], [0.25, 'rgba(240,200,190,0.1)'], [0.65, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,250,0.35)']]));
  for (const x of [365, 495, 625, 755]) {
    dol(dik(x - 8, K.y1, x + 8, K.y2), lin(x - 8, 0, x + 8, 0, [[0, '#EFC9B8'], [0.35, '#FBE6D6'], [1, '#FFF9F1']]));
  }
  dol(dik(K.x1, K.y1, K.x2, K.y1 + 18), lin(0, K.y1, 0, K.y1 + 18, [[0, 'rgba(200,130,120,0.32)'], [1, 'rgba(200,130,120,0)']]));
  dol(dik(K.x1, K.y2 - 12, K.x2, K.y2), lin(K.x1, 0, K.x2, 0, [[0, '#E8B9A8'], [0.5, '#F4D2BE'], [1, '#FBE3D2']]));
  for (const p of K.pencereler) {
    dol(S.kemerYolu(p.x, p.y - 6, p.w + 14, p.h + 9), lin(p.x - p.w, p.y, p.x + p.w, p.y + p.h, [[0, '#F0CDBD'], [0.6, '#FFF4EA'], [1, '#FFFBF5']]));
    pencere(p.x, p.y, p.w, p.h);
    dol(dik(p.x - p.w / 2 - 6, p.y + p.h, p.x + p.w / 2 + 6, p.y + p.h + 4), lin(p.x - p.w, 0, p.x + p.w, 0, [[0, '#EBC2B2'], [1, '#FFF6EE']]));
  }
  dol(dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), lin(K.kornis.x1, 0, K.kornis.x2, 0, [[0, '#F0CFC0'], [0.2, '#FCEDE2'], [0.7, '#FFFBF5'], [1, '#FFFFFF']]));
  dol(dik(K.kornis.x1, K.kornis.y2 - 3, K.kornis.x2, K.kornis.y2), lin(K.kornis.x1, 0, K.kornis.x2, 0, [[0, '#E2B1A2'], [1, '#F4D3C3']]));

  // ================================================================ KASNAK
  const YESIL = [[0, '#13786C'], [0.16, '#168570'], [0.42, '#1E9C6A'], [0.66, '#40B46A'], [0.8, '#8AD468'], [0.9, '#62C46A'], [1, '#2AA06A']];
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const d = dik(q.x1, q.y1, q.x2, q.y2);
    dol(d, lin(q.x1, 0, q.x2, 0, YESIL));
    dol(d, lin(0, q.y1, 0, q.y2, [[0, 'rgba(200,245,150,0.26)'], [0.4, 'rgba(190,240,150,0)'], [0.75, 'rgba(10,80,80,0)'], [1, 'rgba(10,80,80,0.22)']]));
    dol(dik(q.x1, q.y2 - 7, q.x2, q.y2), lin(q.x1, 0, q.x2, 0, [[0, '#0F6658'], [0.5, '#16845E'], [0.8, '#3AAC66'], [1, '#14805C']]));
    for (const p of S.kasnakPencereleri(k)) pencere(p.x, p.y, p.w, p.h);
  }

  // ================================================================ KUBBE: dilim dilim degrade (zümrüt → limon yeşili)
  {
    const renkU = rampa([[0, '#16806F'], [0.18, '#189172'], [0.4, '#1EA46C'], [0.6, '#3DBB68'], [0.76, '#84D664'], [0.86, '#B0E46A'], [1, '#70CE6A']]);
    const meridyen = (u) => prof.map((q) => [560 + u * q.r, q.y]);
    const N = 16;
    const rAt = (y) => {
      for (let i = 0; i < prof.length - 1; i++) {
        const A = prof[i], Bq = prof[i + 1];
        if (y <= A.y && y >= Bq.y) return A.r + (Bq.r - A.r) * ((A.y - y) / (A.y - Bq.y || 1));
      }
      return y > 555 ? 200 : 0;
    };
    for (let j = 0; j < N; j++) {
      const f1 = -Math.PI / 2 + (Math.PI * j) / N, f2 = -Math.PI / 2 + (Math.PI * (j + 1)) / N;
      const u1 = Math.sin(f1), u2 = Math.sin(f2);
      const um = Math.sin((f1 + f2) / 2);
      const d = S.yol([...meridyen(u1), ...meridyen(u2).reverse()], true);
      const c = renkU((um + 1) / 2);
      kirp(d, () => {
        // her satırda dilimin o yükseklikteki genişliğine oturan yatay degrade; renkler yüksekliğe göre
        // tabanda derin teal, ortada dilimin rengi, tepede limon ışıltısı (çok duraklı, kesintisiz)
        for (let y = 298; y <= 557; y += 1) {
          const rr = Math.max(0.5, rAt(y + 0.5));
          const t = Math.max(0, Math.min(1, (556 - y) / 256));
          let orta;
          if (t < 0.45) orta = karis(karis(c, hex('#0E6A60'), 0.45), c, t / 0.45);
          else orta = karis(c, karis(c, hex('#E0F888'), 0.55), (t - 0.45) / 0.55);
          const sol = karis(orta, hex('#0D5E58'), 0.2);
          const sag = karis(orta, hex('#E4FA9A'), 0.22);
          const xL = 560 + u1 * rr, xR = 560 + u2 * rr;
          ctx.fillStyle = lin(xL, 0, xR, 0, [[0, rgb(sol)], [0.4, rgb(orta)], [0.85, rgb(karis(orta, sag, 0.6))], [1, rgb(sag)]]);
          ctx.fillRect(xL - 2, y, xR - xL + 4, 1.25);
        }
      });
    }
    // bütün kubbeye yumuşak ışık degradesi (sağ üstten)
    kirp(S.kubbeYolu, () => {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      dol(dik(350, 290, 770, 560), rad(660, 360, 0, 640, 390, 210, [[0, 'rgba(200,255,170,0.32)'], [0.5, 'rgba(160,240,150,0.1)'], [1, 'rgba(160,240,150,0)']]));
      ctx.restore();
      dol(dik(350, 500, 770, 560), lin(0, 500, 0, 556, [[0, 'rgba(8,70,70,0)'], [1, 'rgba(8,70,70,0.2)']]));
    });
  }
  alem(S.alemParcalari(560, 300, 1));

  // ================================================================ ortak parçalar
  function pencere(x, y, w, h) {
    const d = S.kemerYolu(x, y, w, h);
    dol(d, lin(x - w / 2, y, x + w / 2, y + h, [[0, '#0A4A44'], [0.55, '#10604E'], [1, '#22875E']]));
  }
  function alem(a) {
    const s = a.yaka.rx / 20;
    const ALTIN = [[0, '#B8661A'], [0.3, '#E8992F'], [0.6, '#FFCF5E'], [0.78, '#FFF1BE'], [1, '#F0AC3C']];
    dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), lin(a.cubuk.x1, 0, a.cubuk.x2, 0, ALTIN));
    for (const k of a.kureler) {
      dol(S.daireYolu(k.cx, k.cy, k.r), rad(k.cx + k.r * 0.4, k.cy - k.r * 0.4, 0, k.cx, k.cy, k.r, [[0, '#FFFBE6'], [0.3, '#FFDB7A'], [0.7, '#F0A43A'], [1, '#C46F1E']]));
    }
    dol(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), lin(a.yaka.cx - a.yaka.rx, a.yaka.cy - a.yaka.ry, a.yaka.cx + a.yaka.rx, a.yaka.cy + a.yaka.ry, ALTIN));
    const R = a.hilal.R;
    dol(S.hilalYolu(a.hilal.cx, a.hilal.cy, R), lin(a.hilal.cx - R, a.hilal.cy + R, a.hilal.cx + R, a.hilal.cy - R, ALTIN));
  }

  // ================================================================ BİTKİLER
  const B = S.bitki;
  // saplar: dipte teal, uçta taze yeşil (degradeli çizgi)
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8, y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    ctx.lineWidth = 4;
    ctx.strokeStyle = lin(0, t.y, 0, t.y + 190, [[0, '#6CC26A'], [1, '#1A826A']]);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(t.x, t.y + 80, bx, t.y + 190);
    ctx.stroke();
  }
  for (const s of B.saplar) {
    ctx.lineWidth = 4.6;
    ctx.strokeStyle = lin(0, s[0][1], 0, s[s.length - 1][1], [[0, '#17806A'], [0.6, '#36A866'], [1, '#8ED06A']]);
    ctx.stroke(P2(S.yol(s)));
  }

  function yaprak(y, tur) {
    const Lu = y.uzunluk, W = Lu * y.genislik;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const q = (pt) => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`;
    const uc = p(Lu, 0);
    const RENK = [
      [[0, '#13806C'], [0.5, '#38AC66'], [1, '#B2E070']],
      [[0, '#107468'], [0.55, '#22946C'], [1, '#78CB78']],
      [[0, '#2C9A60'], [0.5, '#6CC266'], [1, '#D2EC82']],
    ][tur];
    const pozAcik = -sa * L[0] + ca * L[1] > 0;
    const sgn = pozAcik ? 1 : -1; // ışık alan yarının v işareti
    const acikYari = `M${q(p(0, 0))} C${q(p(Lu * 0.35, sgn * W * 0.75))} ${q(p(Lu * 0.8, sgn * W * 0.45))} ${q(p(Lu, 0))} Z`;
    const golgeYari = `M${q(p(0, 0))} C${q(p(Lu * 0.35, -sgn * W * 0.75))} ${q(p(Lu * 0.8, -sgn * W * 0.45))} ${q(p(Lu, 0))} Z`;
    dol(golgeYari, lin(y.x, y.y, uc[0], uc[1], RENK[0] ? RENK.map(([t, h]) => [t, rgb(karis(hex(h), [12, 74, 92], 0.24))]) : RENK));
    const isikP = p(Lu * 0.5, sgn * W * 0.5);
    dol(acikYari, lin(y.x, y.y, uc[0], uc[1], RENK));
    kirp(acikYari, () => dol(acikYari, lin(p(Lu * 0.5, 0)[0], p(Lu * 0.5, 0)[1], isikP[0], isikP[1], [[0, 'rgba(255,255,220,0)'], [1, 'rgba(240,255,200,0.22)']])));
  }
  const merkez = (y) => [y.x + Math.cos(y.aci) * y.uzunluk * 0.5, y.y + Math.sin(y.aci) * y.uzunluk * 0.5];
  const secili = [];
  B.yapraklar.forEach((y, i) => {
    if (i < 36) return yaprak(y, i % 3 === 1 ? 2 : 0);
    const [cx, cy] = merkez(y);
    if (secili.some(([x, yy]) => Math.hypot(x - cx, yy - cy) < 24)) return;
    secili.push([cx, cy]);
    yaprak({ ...y, uzunluk: y.uzunluk * 1.16 }, secili.length % 3);
  });

  function tomurcuk(t) {
    const d = S.tomurcukYolu(t);
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const a = p(-t.r, 0), b = p(t.r * 1.6, 0);
    dol(d, lin(a[0], a[1], b[0], b[1], [[0, '#E9677A'], [0.5, '#F7929A'], [1, '#FFD3C2']]));
    const q = (pt) => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`;
    dol(`M${q(p(-t.r * 1.0, 0))} Q${q(p(-t.r * 0.2, -t.r * 1.1))} ${q(p(t.r * 0.3, -t.r * 0.55))} Q${q(p(-t.r * 0.1, 0))} ${q(p(t.r * 0.3, t.r * 0.55))} Q${q(p(-t.r * 0.2, t.r * 1.1))} ${q(p(-t.r * 1.0, 0))} Z`,
      lin(a[0], a[1], p(t.r * 0.3, 0)[0], p(t.r * 0.3, 0)[1], [[0, '#11705A'], [1, '#6CC266']]));
  }
  for (const t of B.tomurcuklar) tomurcuk(t);

  function cicek(c) {
    const tac = S.tacYapraklari(c).map((e) => ({ ...e, cx: c.x + Math.cos(e.aci) * c.r * 0.56, cy: c.y + Math.sin(e.aci) * c.r * 0.56, rx: c.r * 0.5, ry: c.r * 0.42 }));
    tac.sort((m, n) => (Math.cos(m.aci) * L[0] + Math.sin(m.aci) * L[1]) - (Math.cos(n.aci) * L[0] + Math.sin(n.aci) * L[1]));
    for (const e of tac) {
      const d = S.elipsYolu(e);
      // ışınsal degrade: dipte pembe, uçta beyaz
      const ux = Math.cos(e.aci), uy = Math.sin(e.aci);
      dol(d, lin(c.x + ux * c.r * 0.1, c.y + uy * c.r * 0.1, c.x + ux * c.r * 1.06, c.y + uy * c.r * 1.06, [[0, '#F4929F'], [0.28, '#FAC0C9'], [0.6, '#FFEDEE'], [1, '#FFFFFF']]));
      // ışıktan uzak yanda lavanta degradesi
      const gx = e.cx - L[0] * e.rx, gy = e.cy - L[1] * e.rx;
      const ix = e.cx + L[0] * e.rx * 0.5, iy = e.cy + L[1] * e.rx * 0.5;
      dol(d, lin(gx, gy, ix, iy, [[0, 'rgba(206,190,232,0.75)'], [0.5, 'rgba(226,214,242,0.3)'], [1, 'rgba(255,255,255,0)']]));
    }
    dol(S.daireYolu(c.x, c.y, c.r * 0.23), rad(c.x + c.r * 0.08, c.y - c.r * 0.08, 0, c.x, c.y, c.r * 0.24, [[0, '#FFF6B8'], [0.4, '#FFD24A'], [0.8, '#F79B3A'], [1, '#E87A3A']]));
  }
  for (const c of B.cicekler) cicek(c);

  // ================================================================ son: hafif ışık örtüsü ve bant önleyici titreşim
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  dol(dik(0, 0, 1024, 1024), lin(1024, 0, 0, 1024, [[0, 'rgba(255,240,210,0.35)'], [0.5, 'rgba(255,255,255,0)'], [1, 'rgba(120,140,200,0.12)']]));
  ctx.restore();
  {
    const W = 1024 * OL;
    const id = ctx.getImageData(0, 0, W, W);
    const v = id.data;
    for (let i = 0; i < v.length; i += 4) {
      const n = (rnd() + rnd() - 1) * 1.6;
      v[i] += n;
      v[i + 1] += n;
      v[i + 2] += n;
    }
    ctx.putImageData(id, 0, 0);
  }
  S.hazir();
</script>
