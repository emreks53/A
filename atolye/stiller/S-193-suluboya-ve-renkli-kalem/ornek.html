<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-193 Suluboya ve Renkli Kalem — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fffefa; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-193 Suluboya ve Renkli Kalem — hayalî bir çağdaş illüstratörün eli.
// Parlak beyaz soğuk preslenmiş kâğıda önce yumuşak, saydam suluboya lavileri (açık zemin
// rengi, kuruyunca sert kenarlı ikinci-üçüncü sır, kenarda pigment birikmesi); sonra üstüne
// renkli kalemle ayrıntı: her öğenin kendi koyu renginde ince kontur, kubbe kaburgaları,
// yaprak ve taç damarları, gölgelerde tek yönlü düzenli çapraz tarama, taşta derz çizgileri.
(function () {
  'use strict';
  try {
  // ================================================================ h7 ortak çekirdek
  // Sahne modeli (öğe kimlik haritası), ışık hesabı, form koordinatları ve malzeme yardımcıları.
  // 2048 iç çözünürlük; koordinatlar 1024 sahne biriminde düşünülür (px = birim * K).
  const K = 2, WW = 1024 * K, NN = WW * WW;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { let t = (v - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

  // tamsayı karması → [0,1)
  function h2(i, j, s) {
    let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  // değer gürültüsü (256 tablolu, yumuşak ara değerli)
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  // ayrılabilir kutu bulanıklığı (Float32, w×h)
  function bulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => bulanik(bulanik(bulanik(src, w, h, r), w, h, r), w, h, r); // ≈ Gauss

  // renk rampası: [[t,'#hex'],...] → hızlı değerlendirme (sonuç cr, cg, cb'ye)
  let cr = 0, cg = 0, cb = 0;
  function rampa(dizi) { return { t: dizi.map((d) => d[0]), c: dizi.map((d) => hex(d[1])) }; }
  function rmp(R, t) {
    const T = R.t, C = R.c, n = T.length;
    if (t <= T[0]) { cr = C[0][0]; cg = C[0][1]; cb = C[0][2]; return; }
    for (let i = 1; i < n; i++) {
      if (t <= T[i]) {
        const k = (t - T[i - 1]) / (T[i] - T[i - 1]), a = C[i - 1], b = C[i];
        cr = a[0] + (b[0] - a[0]) * k; cg = a[1] + (b[1] - a[1]) * k; cb = a[2] + (b[2] - a[2]) * k; return;
      }
    }
    cr = C[n - 1][0]; cg = C[n - 1][1]; cb = C[n - 1][2];
  }

  // ışık: sağ üstten, hafif önden
  const LX = 0.55, LY = -0.55, LZ = 0.63, LN = Math.hypot(LX, LY, LZ);
  const Lx = LX / LN, Ly = LY / LN, Lz = LZ / LN;
  const Hx0 = Lx, Hy0 = Ly, Hz0 = Lz + 1, HN = Math.hypot(Hx0, Hy0, Hz0);
  const Hx = Hx0 / HN, Hy = Hy0 / HN, Hz = Hz0 / HN;

  // öğe tipleri
  const T_GOK = 1, T_ZEMIN = 2, T_MGOVDE = 3, T_MCIKMA = 4, T_MSEREFE = 5, T_MKORK = 6, T_MTOPUZ = 7, T_ALTIN = 8, T_HILAL = 9,
    T_MPENC = 10, T_ZIKZAK = 11, T_KAIDE = 12, T_KORNIS = 13, T_KPENC = 14, T_KASNAK = 15, T_KASPENC = 16, T_KUBBE = 17,
    T_SAP = 18, T_YAPRAK = 19, T_TOMURCUK = 20, T_TAC = 21, T_COBEK = 22, T_ERKEK = 23;
  const DONEL = new Set([T_MGOVDE, T_MCIKMA, T_MSEREFE, T_MKORK, T_MTOPUZ, T_ALTIN]);
  const YAPI = new Set([T_MGOVDE, T_MCIKMA, T_MSEREFE, T_MKORK, T_MTOPUZ, T_ALTIN, T_HILAL, T_MPENC, T_ZIKZAK, T_KAIDE, T_KORNIS, T_KPENC, T_KASNAK, T_KASPENC, T_KUBBE]);
  const BITKI = new Set([T_SAP, T_YAPRAK, T_TOMURCUK, T_TAC, T_COBEK, T_ERKEK]);

  // ---------------------------------------------------------------- kimlik haritası
  // Her öğe ayrı kimlik rengiyle çizilir; kenar yumuşatması karışımları sağlama ile ayıklanır.
  function kimlikHaritasi() {
    const cv = SAHNE.yeniTuval(WW, WW), c = cv.getContext('2d', { willReadFrequently: true });
    c.setTransform(K, 0, 0, K, 0, 0);
    const EL = [null];
    const yeni = (tip, veri) => { EL.push(Object.assign({ tip }, veri || {})); return EL.length - 1; };
    const sag = (id) => (Math.imul(id, 2654435761) >>> 24) & 255;
    const renk = (id) => `rgb(${(id & 63) * 4 + 2},${((id >> 6) & 63) * 4 + 2},${sag(id)})`;
    const dol = (d, id) => { c.fillStyle = renk(id); c.fill(typeof d === 'string' ? new Path2D(d) : d); };
    const dik = (x1, y1, x2, y2) => SAHNE.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
    // gök ve yer
    let id = yeni(T_GOK); c.fillStyle = renk(id); c.fillRect(0, 0, 1024, 1024);
    id = yeni(T_ZEMIN); c.fillStyle = renk(id); c.fillRect(0, 800, 1024, 224);
    // minare
    const alemCiz = (a) => {
      dol(SAHNE.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }), yeni(T_ALTIN, { parca: 'yaka' }));
      dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), yeni(T_ALTIN, { parca: 'cubuk' }));
      for (const k of a.kureler) dol(SAHNE.daireYolu(k.cx, k.cy, k.r), yeni(T_ALTIN, { parca: 'kure', k }));
      dol(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), yeni(T_HILAL, { h: a.hilal }));
    };
    for (const p of SAHNE.minareParcalari()) {
      if (p.tip === 'bant') continue;
      if (p.tip === 'alem') { alemCiz(p.alem); continue; }
      let tip = T_MGOVDE;
      if (p.ad.startsWith('çıkma')) tip = T_MCIKMA;
      else if (p.ad.startsWith('şerefe')) tip = T_MSEREFE;
      else if (p.tip === 'korkuluk') tip = T_MKORK;
      else if (p.tip === 'topuz') tip = T_MTOPUZ;
      const d = p.tip === 'poligon' ? SAHNE.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : dik(p.x1, p.y1, p.x2, p.y2);
      dol(d, yeni(tip, { ad: p.ad, p }));
    }
    { // zikzak şeritleri
      const zid = yeni(T_ZIKZAK);
      c.strokeStyle = renk(zid); c.lineWidth = 3.4; c.lineJoin = 'miter';
      for (const z of SAHNE.zikzakCizgileri()) c.stroke(new Path2D(SAHNE.yol(z)));
    }
    for (const w of SAHNE.minarePencereleri) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_MPENC, { w }));
    // kaide
    const KD = SAHNE.kaide;
    dol(dik(KD.x1, KD.y1, KD.x2, KD.y2), yeni(T_KAIDE));
    dol(dik(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2, KD.kornis.y2), yeni(T_KORNIS));
    for (const w of KD.pencereler) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_KPENC, { w }));
    // kasnak (alttan üste)
    for (let k = 1; k >= 0; k--) {
      const q = SAHNE.kasnak[k];
      dol(dik(q.x1, q.y1, q.x2, q.y2), yeni(T_KASNAK, { kat: k, q, R: (q.x2 - q.x1) / 2 }));
      for (const w of SAHNE.kasnakPencereleri(k)) dol(SAHNE.kemerYolu(w.x, w.y, w.w, w.h), yeni(T_KASPENC, { w, kat: k }));
    }
    // kubbe ve alemi
    dol(SAHNE.kubbeYolu, yeni(T_KUBBE));
    alemCiz(SAHNE.alemParcalari(560, 300, 1));
    // bitkiler
    const B = SAHNE.bitki;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4.2;
    for (const s of B.saplar) { c.strokeStyle = renk(yeni(T_SAP, { s })); c.stroke(new Path2D(SAHNE.yol(s))); }
    for (const y of B.yapraklar) dol(SAHNE.yaprakYolu(y), yeni(T_YAPRAK, { y }));
    for (const t of B.tomurcuklar) dol(SAHNE.tomurcukYolu(t), yeni(T_TOMURCUK, { t }));
    B.cicekler.forEach((cc, ci) => {
      const taclar = SAHNE.tacYapraklari(cc);
      const ids = [];
      taclar.forEach((e, i) => { const tid = yeni(T_TAC, { e, c: cc, i, ci }); ids.push(tid); dol(SAHNE.elipsYolu(e), tid); });
      taclar.forEach((e, i) => { EL[ids[i]].ust = taclar.slice(i + 1); });
      dol(SAHNE.daireYolu(cc.x, cc.y, cc.r * 0.18), yeni(T_COBEK, { c: cc }));
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2 + cc.aci;
        const sx = cc.x + Math.cos(a) * cc.r * 0.27, sy = cc.y + Math.sin(a) * cc.r * 0.27, sr = Math.max(1.3, cc.r * 0.04);
        dol(SAHNE.daireYolu(sx, sy, sr), yeni(T_ERKEK, { c: cc, sx, sy, sr }));
      }
    });
    // çözümle
    const v = c.getImageData(0, 0, WW, WW).data;
    const ID = new Uint16Array(NN), YOK = 65535, nE = EL.length;
    for (let i = 0; i < NN; i++) {
      const r = v[i * 4], g = v[i * 4 + 1], b = v[i * 4 + 2];
      if ((r & 3) !== 2 || (g & 3) !== 2) { ID[i] = YOK; continue; }
      const k = (r >> 2) | ((g >> 2) << 6);
      ID[i] = k > 0 && k < nE && sag(k) === b ? k : YOK;
    }
    // tek başına kalan (komşularının hiçbirine uymayan) pikseller de şüpheli
    for (let y = 1; y < WW - 1; y++) for (let x = 1; x < WW - 1; x++) {
      const i = y * WW + x, k = ID[i];
      if (k === YOK) continue;
      if (ID[i - 1] !== k && ID[i + 1] !== k && ID[i - WW] !== k && ID[i + WW] !== k) ID[i] = YOK;
    }
    for (let gec = 0; gec < 4; gec++) {
      let kalan = 0;
      for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
        const i = y * WW + x;
        if (ID[i] !== YOK) continue;
        let best = YOK;
        const aday = [x > 0 ? ID[i - 1] : YOK, x < WW - 1 ? ID[i + 1] : YOK, y > 0 ? ID[i - WW] : YOK, y < WW - 1 ? ID[i + WW] : YOK];
        for (const a of aday) if (a !== YOK && (best === YOK || a > best)) best = a;
        if (best !== YOK) ID[i] = best; else kalan++;
      }
      if (!kalan) break;
    }
    for (let i = 0; i < NN; i++) if (ID[i] === YOK) ID[i] = 1;
    // dönel öğeler için satır başına yatay uçlar
    const UC = new Map();
    for (let y = 0; y < WW; y++) {
      const o = y * WW;
      for (let x = 0; x < WW; x++) {
        const k = ID[o + x];
        if (!DONEL.has(EL[k].tip)) continue;
        let u = UC.get(k);
        if (!u) { u = { a: new Int16Array(WW).fill(32767), b: new Int16Array(WW).fill(-1), y0: y, y1: y }; UC.set(k, u); }
        if (x < u.a[y]) u.a[y] = x;
        if (x > u.b[y]) u.b[y] = x;
        if (y > u.y1) u.y1 = y;
      }
    }
    return { ID, EL, UC, TIP: Uint8Array.from(EL.map((e) => (e ? e.tip : 0))) };
  }

  // kimlik haritasını hafifçe titreterek okuma (el çizgisi gibi kenarlar)
  function titrekKimlik(H, genlik, olcek, tohum) {
    const n1 = gurultu(tohum), n2 = gurultu(tohum + 1), out = new Uint16Array(NN), A = genlik * K, s = 1 / (olcek * K);
    for (let y = 0; y < WW; y++) for (let x = 0; x < WW; x++) {
      const dx = (n1(x * s, y * s) - 0.5) * 2 * A + (n1(x * s * 3.1 + 40, y * s * 3.1) - 0.5) * 0.6 * A;
      const dy = (n2(x * s, y * s) - 0.5) * 2 * A + (n2(x * s * 3.1, y * s * 3.1 + 40) - 0.5) * 0.6 * A;
      const xx = clamp(Math.round(x + dx), 0, WW - 1), yy = clamp(Math.round(y + dy), 0, WW - 1);
      out[y * WW + x] = H.ID[yy * WW + xx];
    }
    return out;
  }

  // ---------------------------------------------------------------- bulut yoğunluğu (1024)
  function bulutAlani(tohum, yerler) {
    const r = SAHNE.rng(tohum), F = new Float32Array(1024 * 1024), TAB = new Float32Array(1024 * 1024).fill(-1);
    yerler = yerler || [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];
    const kabarcik = (x, y, rr, taban) => {
      const x0 = Math.max(0, Math.floor(x - rr * 1.7)), x1 = Math.min(1023, Math.ceil(x + rr * 1.7));
      const y0 = Math.max(0, Math.floor(y - rr * 1.7)), y1 = Math.min(1023, Math.ceil(y + rr * 1.7));
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
        const d = Math.hypot((xx - x) / 1.06, yy - y) / rr;
        const v = Math.exp(-d * d * 1.7);
        const j = yy * 1024 + xx;
        F[j] += v;
        if (v > 0.05 && (TAB[j] < 0 || taban < TAB[j])) TAB[j] = taban;
      }
    };
    for (const [bx, by, bs] of yerler) {
      const taban = by + 22 * bs;
      // taban sırası
      const n1 = 6 + Math.floor(r() * 3);
      for (let i = 0; i < n1; i++) {
        const t = i / (n1 - 1) - 0.5, rr = (18 + 8 * r()) * bs * (1 - Math.abs(t) * 0.3);
        kabarcik(bx + t * 175 * bs + (r() - 0.5) * 10 * bs, taban - rr * 0.65, rr, taban);
      }
      // orta kat
      const n2 = 3 + Math.floor(r() * 2);
      for (let i = 0; i < n2; i++) {
        const t = (i / (n2 - 1) - 0.5) * 0.62 + (r() - 0.5) * 0.08, rr = (25 + 9 * r()) * bs;
        kabarcik(bx + t * 200 * bs, taban - 26 * bs - rr * 0.45, rr, taban);
      }
      // tepe
      const n3 = 1 + Math.floor(r() * 2);
      for (let i = 0; i < n3; i++) {
        const rr = (21 + 8 * r()) * bs;
        kabarcik(bx + (r() - 0.45) * 60 * bs, taban - 52 * bs - rr * 0.35, rr, taban);
      }
    }
    // düz tabanlar
    for (let j = 0; j < 1024 * 1024; j++) {
      F[j] = 1 - Math.exp(-1.25 * F[j]);
      if (TAB[j] > 0) { const y = (j / 1024) | 0; F[j] *= sstep(TAB[j] + 4, TAB[j] - 9, y); }
    }
    return { F, TAB };
  }

  // ---------------------------------------------------------------- gölgelendirme (deferred)
  // P: palet (rampalar). Çıktı: R,G,B (hedef renk), LT (ışık 0..1), FU/FV (form koordinatı, px).
  function golgele(H, IDW, P, o) {
    o = o || {};
    const { EL, UC, TIP } = H;
    const R = new Float32Array(NN), G = new Float32Array(NN), Bc = new Float32Array(NN);
    const LT = new Float32Array(NN), FU = new Float32Array(NN), FV = new Float32Array(NN);
    const nz = gurultu(77), nz2 = gurultu(78);
    // kubbe profili satır tablosu
    const prof = SAHNE.kubbeProfili(800);
    const kr = new Float32Array(WW), kd = new Float32Array(WW);
    for (let row = 0; row < WW; row++) {
      const y = (row + 0.5) / K;
      if (y < 300 || y > 556) continue;
      let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
      const a = prof[j], b = prof[j + 1], t = clamp((a.y - y) / (a.y - b.y || 1), 0, 1);
      kr[row] = Math.max(0.5, a.r + (b.r - a.r) * t);
      kd[row] = (a.r - b.r) / Math.max(1e-3, a.y - b.y); // dr/dy (aşağı doğru artar)
    }
    const bulut = o.bulut || bulutAlani(31);
    const BF = bulut.F;
    const bF = (x, y) => BF[clamp(y | 0, 0, 1023) * 1024 + clamp(x | 0, 0, 1023)];
    const gx = SAHNE.gunes.x, gy = SAHNE.gunes.y;
    const PI = Math.PI;
    // bitkilerin kuma düşen gölgesi (sola-aşağı)
    let GOL = null;
    if (P.zeminGolge) {
      const m = new Float32Array(1024 * 1024);
      for (let yy = 0; yy < 1024; yy++) for (let xx = 0; xx < 1024; xx++) {
        const sx = xx + 9, sy = yy - 7;
        if (sx < 0 || sx > 1023 || sy < 0 || sy > 1023) continue;
        const t = TIP[H.ID[(sy * K) * WW + sx * K]];
        if (BITKI.has(t)) m[yy * 1024 + xx] = 1;
      }
      GOL = bulanik3(m, 1024, 1024, 3);
    }
    for (let py = 0; py < WW; py++) {
      const y = (py + 0.5) / K;
      for (let px = 0; px < WW; px++) {
        const x = (px + 0.5) / K, i = py * WW + px, id = IDW[i], el = EL[id], tip = TIP[id];
        let lt = 0.6, fu = py, fv = px;
        switch (tip) {
          case T_GOK: {
            rmp(P.gok, y / 800);
            let r0 = cr, g0 = cg, b0 = cb;
            const d = Math.hypot(x - gx, y - gy);
            const parilti = Math.exp(-(d * d) / (2 * P.gunesR * P.gunesR)) * P.gunesG;
            const [sr, sg, sb] = P.gunes;
            r0 += (sr - r0) * parilti; g0 += (sg - g0) * parilti; b0 += (sb - b0) * parilti;
            if (P.gunesIc) {
              const pi = Math.exp(-(d * d) / (2 * P.gunesIcR * P.gunesIcR)) * P.gunesIcG;
              const [ir, ig, ib] = P.gunesIc;
              r0 += (ir - r0) * pi; g0 += (ig - g0) * pi; b0 += (ib - b0) * pi;
            }
            if (P.gunesDisk) { const k = sstep(P.gunesDisk + 1.5, P.gunesDisk - 1.5, d); r0 += (sr - r0) * k; g0 += (sg - g0) * k; b0 += (sb - b0) * k; }
            // bulut
            const bw = P.bulutDalga || 1;

          }
          case T_KORNIS: {

            lt = val; fu = py; fv = px;

          }
          case T_KPENC: {
            const w = el.w, lx = (x - w.x) / (w.w / 2), ly = (y - w.y) / w.h, pxr = (lx + 1) / 2;
            if (P.cerceve && (IDW[i - 4] !== id || IDW[i + 4] !== id || IDW[i - 4 * WW] !== id)) { rmp(P.tas, 0.9); lt = 0.9; fu = py; fv = px; break; }

          case T_MGOVDE: case T_MSEREFE: case T_MKORK: case T_MTOPUZ: case T_MCIKMA: case T_ALTIN: {

  // ---------------------------------------------------------------- tarama (prosedürel kalem/pastel vuruşu)
  // u: vuruşlara dik koordinat, v: vuruş boyunca (px). aralik: şerit aralığı, boy: vuruş boyu.
  // Dönüş 0..1: o noktadaki vuruş yoğunluğu (uçlarda incelen, basıncı değişen, hafif eğik vuruşlar).

      case T_KASNAK: case T_KASPENC: {
        sir(i, KY1, 0.88);
        sir(i, KY2, (0.2 + 0.7 * sstep(0.8, 0.4, lt + (v1 - 0.5) * 0.06)) * 0.85 * gran);
        sir(i, KY3, 0.7 * sstep(0.34, 0.3, lt));
        if (tip === T_KASPENC) { sir(i, KY3, 0.85); sir(i, PEN, 0.5); }
        break;
      }
      case T_KPENC: case T_MPENC: { sir(i, TAS1, 0.5); sir(i, PEN, 0.75); sir(i, TAS2, 0.6 * (1 - lt)); break; }
      case T_ALTIN: case T_HILAL: { sir(i, ALT1, 0.9); sir(i, ALT2, 0.8 * sstep(0.6, 0.25, lt)); break; }
      case T_ZIKZAK: { sir(i, [0.84, 0.72, 0.56], 0.85); break; }
      case T_YAPRAK: case T_SAP: {
        sir(i, mixc(YP1, KYM, sstep(0.4, 0.8, v2) * 0.6), 0.9);
        sir(i, YP2, (tip === T_SAP ? 0.6 : 0.82 * sstep(0.52, 0.47, lt)) * gran + 0.12);
        break;
      }
      case T_TOMURCUK: { sir(i, PMB, 0.75); sir(i, [0.80, 0.45, 0.58], 0.5 * sstep(0.55, 0.3, lt)); break; }
      case T_TAC: {
        const e = H.EL[IDW[i]], rho = S.FV[i] / K / e.c.r;
        sir(i, PMB, 0.55 * (1 - sstep(0.12, 0.55, rho)) * (0.85 + 0.3 * v1));
        sir(i, BGRI, 0.75 * sstep(0.82, 0.68, lt + (v1 - 0.5) * 0.04));
        break;
      }
      case T_COBEK: { sir(i, SARI, 0.92); sir(i, [0.80, 0.68, 0.26], 0.5 * sstep(0.6, 0.3, lt)); break; }
      case T_ERKEK: { sir(i, TURU, 0.9); break; }
      case T_ZEMIN: {
        const lum = 0.3 * S.R[i] + 0.59 * S.G[i] + 0.11 * S.B[i];
        sir(i, ZM1, 0.62 * (0.7 + 0.5 * v1) * gran);
        sir(i, ZM2, clamp((0.885 - lum) * 4.2, 0, 0.75) * gran);
        break;
      }
      default: {
        if (TAS.has(tip)) {
          sir(i, TAS1, 0.55 * (0.85 + 0.3 * v1));
          sir(i, TAS2, 0.78 * sstep(0.55, 0.5, lt + (v1 - 0.5) * 0.06) * gran);
          sir(i, TAS2, 0.45 * sstep(0.36, 0.32, lt));
          sir(i, TAS2, 0.32 * sstep(0.74, 0.68, lt + (v1 - 0.5) * 0.05));
        }
      }
    }
  }
  // kenarda pigment birikmesi (kuruyan lavinin koyu sınırı) ve kâğıt
  const AL = new Float32Array(NN);
  for (let i = 0; i < NN; i++) AL[i] = 1 - (0.3 * TR[i] + 0.59 * TG[i] + 0.11 * TB[i]);
  const ALb = bulanik3(AL, WW, WW, 4);
  const OR = new Float32Array(NN), OG = new Float32Array(NN), OB = new Float32Array(NN);
  for (let i = 0; i < NN; i++) {
    const kenar = Math.max(0, AL[i] - ALb[i]);
    const k = 1 + kenar * 2.6;
    const kag = 0.985 + D[i] * 0.015;
    OR[i] = kag * (1 - clamp((1 - TR[i]) * k, 0, 1)); OG[i] = kag * (1 - clamp((1 - TG[i]) * k, 0, 1)); OB[i] = (kag - 0.006) * (1 - clamp((1 - TB[i]) * k, 0, 1));
  }
  // ---------------------------------------------------------------- renkli kalem: gölge taraması (piksel)
  // Gölge taraması kesin çizgiye göre (titreşimsiz kimlik) yapılır.
  {
    const Sx = golgele(H, H.ID, P, { gokAci: 0.6, bulut: BLT });
    const ca = Math.cos(-0.82), sa = Math.sin(-0.82), cb2 = Math.cos(0.62), sb2 = Math.sin(0.62);
    for (let i = 0; i < NN; i++) {
      const tip = H.TIP[H.ID[i]];
      if (!YAPI.has(tip) && tip !== T_YAPRAK && tip !== T_TOMURCUK && tip !== T_TAC) continue;
      const x = i % WW, y = (i / WW) | 0;
      const lt = Sx.LT[i];
      let sh = sstep(0.62, 0.22, lt);
      if (tip === T_TAC) sh = sstep(0.82, 0.62, lt) * 0.8;
      if (tip === T_KASPENC || tip === T_KPENC || tip === T_MPENC) sh = 0.85;
      if (sh < 0.01) continue;
      const u = -x * sa + y * ca, v = x * ca + y * sa;
      let hk = tarama(u, v, 5.4, 44, 0.3, 61) * sh;
      if (lt < 0.25 && tip !== T_TAC) hk = Math.max(hk, tarama(-x * sb2 + y * cb2, x * cb2 + y * sb2, 6.0, 40, 0.28, 62) * sstep(0.25, 0.08, lt));
      if (hk < 0.01) continue;
      const k = hk * sstep(0.2, 0.62, D[i] + hk * 0.35) * 0.62;
      // kalem rengi: yerel rengin koyu, doygun hâli
      const r = Sx.R[i], g = Sx.G[i], b = Sx.B[i];
      const m = (r + g + b) / 3;
      const pr = clamp((r - m) * 1.5 + m * 0.42, 0, 1), pg = clamp((g - m) * 1.5 + m * 0.42, 0, 1), pb = clamp((b - m) * 1.5 + m * 0.48, 0, 1);
      OR[i] *= 1 - k * (1 - pr); OG[i] *= 1 - k * (1 - pg); OB[i] *= 1 - k * (1 - pb);
    }
  }
  // ---------------------------------------------------------------- renkli kalem: kontur ve damarlar
  {
    const { cv, c } = cizgiKatmani();
    const rnd = SAHNE.rng(1933);
    const Y = SAHNE.yollar();
    const yesilK = hex('#1E4A33'), yesilA = hex('#2F6B45'), tasK = hex('#6F5A4A'), altinK = hex('#8A5A16'),
      yaprakK = hex('#2C4F28'), damarK = hex('#2F5A26'), tacK = hex('#9A6A84'), pembeK = hex('#A8455F'), gokK = hex('#5D8FBF');
    const ciz = (d, ids, w, renk, a, o) => {
      for (const pts of ornekle(d, 1.2)) for (const seg of gorunur(H, pts, ids)) parcaliCizgi(c, seg, w, renk, a, rnd, o);
    };
    const kubbeI = kimlikler(H, [T_KUBBE]), kasI = kimlikler(H, [T_KASNAK, T_KASPENC]), kasPI = kimlikler(H, [T_KASPENC]);
    const tasI = kimlikler(H, [T_KAIDE, T_KORNIS, T_KPENC]), kpI = kimlikler(H, [T_KPENC]), kaideI = kimlikler(H, [T_KAIDE]);
    const minI = kimlikler(H, [T_MGOVDE, T_MCIKMA, T_MSEREFE, T_MKORK, T_MTOPUZ, T_MPENC, T_ZIKZAK]);
    const altI = kimlikler(H, [T_ALTIN, T_HILAL]);
    // kubbe ve kaburgalar
    ciz(Y.kubbe, kubbeI, 1.6, yesilK, 0.92);
    for (const k of SAHNE.kaburgalar(16)) {
      const pts = k.noktalar.filter((p) => p[1] > 303);
      for (const seg of gorunur(H, pts, kubbeI)) parcaliCizgi(c, seg, 0.85, yesilA, 0.62, rnd, { parca: 64, titre: 0.25 });
    }
    ciz(Y.kasnakUst, kasI, 1.35, yesilK, 0.9); ciz(Y.kasnakAlt, kasI, 1.35, yesilK, 0.9);
    for (const d of Y.kasnakPencereleri) ciz(d, kasPI, 0.95, yesilK, 0.85);
    // kaide, korniş, derzler
    ciz(Y.kaide, tasI, 1.25, tasK, 0.85); ciz(Y.kornis, tasI, 1.15, tasK, 0.85);
    for (const d of Y.kaidePencereleri) ciz(d, kpI, 1.05, tasK, 0.85);
    for (let yy = 728; yy < 800; yy += 24) for (const seg of gorunur(H, sik([[302, yy], [818, yy]], 1.5), kaideI, 0.4)) parcaliCizgi(c, seg, 0.6, tasK, 0.3, rnd, { parca: 50, titre: 0.2 });
    for (let s = 0; s < 3; s++) {
      const y0 = 704 + 24 * (s + 1), y1 = y0 + 24, ofs = (s % 2) * 31 + 7;
      for (let x = 300 - ofs + 62; x < 820; x += 62) for (const seg of gorunur(H, [[x, y0 + 1], [x, Math.min(799, y1 - 1)]], kaideI, 0.4)) kalemCizgi(c, sik(seg, 1), 0.55, tasK, 0.28, rnd);
    }
    // minare ve alemler
    for (const d of Y.minare) ciz(d, minI, 1.15, tasK, 0.85);
    for (const d of Y.minarePencereleri) ciz(d, minI, 0.95, tasK, 0.85);
    for (const d of Y.alem.concat(Y.minareAlem)) ciz(d, altI, 0.8, altinK, 0.75);
    // gökte birkaç ince mavi kalem taraması (köşelerde)
    for (let i = 0; i < 70; i++) {
      const x = 20 + rnd() * 330, y = 12 + rnd() * 120;
      const L = 18 + rnd() * 26;
      const p0 = [x, y], p1 = [x + L * 0.62, y - L * 0.79];
      if (H.TIP[H.ID[Math.round(y * K) * WW + Math.round(x * K)]] === T_GOK) kalemCizgi(c, sik([p0, p1], 1), 0.7, gokK, 0.18 + rnd() * 0.12, rnd, { titre: 0.15 });
    }
    // çayırda düzenli, kısa çimen tutamları (renkli kalem)
    {
      const cimK = hex('#4F7E36'), cimA = hex('#7BA552'), zemI = kimlikler(H, [T_ZEMIN]);
      for (let i = 0; i < 520; i++) {
        const x = 8 + rnd() * 1008, y = 806 + Math.pow(rnd(), 1.4) * 214;
        if (H.TIP[H.ID[Math.round(y * K) * WW + Math.round(x * K)]] !== T_ZEMIN) continue;
        const olcek = 0.6 + (y - 800) / 224 * 0.9, n = 3 + Math.floor(rnd() * 3);
        for (let k = 0; k < n; k++) {
          const a = -Math.PI / 2 + (k - (n - 1) / 2) * 0.28 + (rnd() - 0.5) * 0.15;
          const L = (6 + rnd() * 6) * olcek, x0 = x + (k - (n - 1) / 2) * 1.6 * olcek;
          const pts = [[x0, y], [x0 + Math.cos(a) * L * 0.5 + Math.cos(a + 0.4) * 0.6, y + Math.sin(a) * L * 0.5], [x0 + Math.cos(a) * L, y + Math.sin(a) * L]];
          const seg = gorunur(H, sik(pts, 0.8), zemI, 0.3);
          for (const sg of seg) kalemCizgi(c, sg, 0.55, rnd() < 0.5 ? cimK : cimA, 0.35 + rnd() * 0.2, rnd, { titre: 0.1, bas: 0.05, son: 0.6 });
        }
      }
    }
    // bitkiler
    const B = SAHNE.bitki;
    const idBul = (tip, f) => { const s = new Set(); H.EL.forEach((e, i) => { if (e && e.tip === tip && f(e)) s.add(i); }); return s; };
    B.saplar.forEach((sp) => ciz(SAHNE.yol(sp), idBul(T_SAP, (e) => e.s === sp), 1.05, yaprakK, 0.75));
    B.yapraklar.forEach((yp) => {
      const ids = idBul(T_YAPRAK, (e) => e.y === yp);
      ciz(SAHNE.yaprakYolu(yp), ids, 1.05, yaprakK, 0.85);
      // orta damar ve yan damarlar
      const [a0, a1] = SAHNE.yaprakDamari(yp);
      for (const seg of gorunur(H, sik([a0, a1], 1), ids, 0.3)) kalemCizgi(c, seg, 0.75, damarK, 0.7, rnd, { titre: 0.15 });
      const ca = Math.cos(yp.aci), sa = Math.sin(yp.aci), L = yp.uzunluk, Wd = L * yp.genislik;
      for (let t = 0.2; t < 0.82; t += 0.15) for (const sg of [-1, 1]) {
        const bx = yp.x + ca * L * t, by = yp.y + sa * L * t;
        const yari = Wd * 0.5 * Math.sin(Math.PI * t) * 0.85;
        const ex = bx + ca * yari * 0.9 - sa * sg * yari, ey = by + sa * yari * 0.9 + ca * sg * yari;
        const mx = bx + ca * yari * 0.25 - sa * sg * yari * 0.6, my = by + sa * yari * 0.25 + ca * sg * yari * 0.6;
        const pts = [];
        for (let k = 0; k <= 6; k++) { const u = k / 6; pts.push([(1 - u) * (1 - u) * bx + 2 * u * (1 - u) * mx + u * u * ex, (1 - u) * (1 - u) * by + 2 * u * (1 - u) * my + u * u * ey]); }
        for (const seg of gorunur(H, sik(pts, 1), ids, 0.3)) kalemCizgi(c, seg, 0.55, damarK, 0.55, rnd, { titre: 0.1, bas: 0.05, son: 0.5 });
      }
    });
    B.tomurcuklar.forEach((t) => ciz(SAHNE.tomurcukYolu(t), idBul(T_TOMURCUK, (e) => e.t === t), 0.8, pembeK, 0.7));
    B.cicekler.forEach((cc) => SAHNE.tacYapraklari(cc).forEach((e, i) => {
      const ids = idBul(T_TAC, (q) => q.c === cc && q.i === i);
      ciz(SAHNE.elipsYolu(e), ids, 0.95, tacK, 0.85);
      // taç damarları: merkezden dışa ince çizgiler
      const n = cc.r > 40 ? 5 : 3;
      for (let k = 0; k < n; k++) {
        const aa = e.aci + (k - (n - 1) / 2) * (0.55 / n) * 1.6;
        const r0 = cc.r * 0.24, r1 = cc.r * (0.62 + 0.18 * Math.cos((k - (n - 1) / 2) * 0.9));
        const pts = [];
        for (let j = 0; j <= 8; j++) { const rr = r0 + (r1 - r0) * (j / 8); const bk = (j / 8) * (j / 8) * 0.08 * (k - (n - 1) / 2); pts.push([cc.x + Math.cos(aa + bk) * rr, cc.y + Math.sin(aa + bk) * rr]); }
        for (const seg of gorunur(H, pts, ids, 0.3)) kalemCizgi(c, seg, 0.45, pembeK, 0.32, rnd, { titre: 0.1, bas: 0.1, son: 0.6 });
      }
    }));
    // katmanı kâğıt dişine göre çarpma ile birleştir
    const lv = c.getImageData(0, 0, WW, WW).data;
    for (let i = 0; i < NN; i++) {
      const al = lv[i * 4 + 3] / 255;
      if (al < 0.004) continue;
      const k = al * sstep(0.12, 0.6, D[i] + al * 0.5);
      OR[i] *= 1 - k * (1 - lv[i * 4] / 255); OG[i] *= 1 - k * (1 - lv[i * 4 + 1] / 255); OB[i] *= 1 - k * (1 - lv[i * 4 + 2] / 255);
    }
  }
  bas(OR, OG, OB);
  } finally {
    SAHNE.hazir();
  }
})();
