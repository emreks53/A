<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-118 Cam Boyama — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #ffffff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-118 Cam Boyama — beyaz kartonun üstüne yatırılmış saydam cam levha. Her renk alanı kabarık altın
// kontür boyasıyla (relief outliner) çevrilmiş, içi fırçayla sürülmüş saydam cam boyası: fırça izleri,
// kontür dibinde biriken boya, beyazın içinden parlayan ışık. Kontür kabarık ve parlak, camın altındaki
// kartona hafif renkli gölge düşer; camda yumuşak yansımalar. Kurşun çerçeve ya da koyu zemin yok.
// Yöntem: 2048 iç çözünürlük; bölgeler arkadan öne bir kimlik haritasına, kontürler ayrı bir maskeye
// çizilir (öndeki bölge arkadaki kontürü siler). Piksel döngüsünde her bölgenin saydam rengi
// yoğunluk (fırça izi, geçiş, kontür dibinde birikme) ile geçirgenliğe çevrilir; kontür maskesinin
// bulanık kopyasından kabartma normali ve altın parlaması, kaydırılmış kopyalardan kartona düşen
// renkli gölge hesaplanır.
(function () {
  const S = SAHNE;
  const K = 2, N = 1024 * K;
  const tuval = document.getElementById('tuval');
  tuval.width = N; tuval.height = N;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const rnd = S.rng(118);
  const P = (d) => new Path2D(d);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const Y = S.yollar();

  function hash(ix, iy, s) {
    let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // ------------------------------------------------------------ kimlik haritası + kontür maskesi
  const tuvalYap = () => { const c = document.createElement('canvas'); c.width = N; c.height = N; return c; };
  const idC = tuvalYap(), olC = tuvalYap();
  const idX = idC.getContext('2d', { willReadFrequently: true });
  const olX = olC.getContext('2d', { willReadFrequently: true });
  idX.setTransform(K, 0, 0, K, 0, 0); olX.setTransform(K, 0, 0, K, 0, 0);
  olX.lineCap = 'round'; olX.lineJoin = 'round'; olX.strokeStyle = '#fff'; olX.fillStyle = '#fff';
  const bolgeler = [];
  const KW = 2.7; // kontür kalınlığı (1024 ölçeğinde)
  // b: {renk:[r,g,b] geçirgenlik, d: yoğunluk, aci: fırça yönü, tur, egim:[gx,gy,k], buzlu}
  function bolge(yol, b, kw) {
    const idx = bolgeler.length;
    bolgeler.push(b);
    idX.fillStyle = `rgb(${idx & 255},${(idx >> 8) * 16 + 8},0)`;
    idX.fill(yol);
    olX.save();
    olX.globalCompositeOperation = 'destination-out';
    olX.fill(yol);
    olX.restore();
    if (kw !== 0) { olX.lineWidth = kw || KW; olX.stroke(yol); }
    return idx;
  }
  function cizgi(yol, w) { olX.lineWidth = w || KW; olX.stroke(yol); }
  function nokta(x, y, r) { olX.beginPath(); olX.arc(x, y, r, 0, Math.PI * 2); olX.fill(); }
  function altinDolgu(yol) { olX.fill(yol); }
  const rgb = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

  // saydam cam boyası renkleri (tam yoğunlukta geçirgenlik)
  const CB = {
    gok: rgb('#5DB8EE'), gunes: rgb('#FFD21F'), turuncu: rgb('#FF8F1F'), hale: rgb('#FFE98A'),
    kubbe: rgb('#15A04F'), kubbeAcik: rgb('#4DC86A'), kasnak: rgb('#18994A'), mavi: rgb('#2F63E0'),
    krem: rgb('#FFE7B0'), tas: rgb('#FFF1D2'), mercan: rgb('#FF6E57'), gul: rgb('#FF8FB0'),
    amber: rgb('#FFC352'), yaprak: rgb('#3FAE2E'), yaprak2: rgb('#1E9A5A'), pembe: rgb('#FF9EC0'),
    orta: rgb('#FFB21A'), mor: rgb('#9A6BE8'), tomurcuk: rgb('#FF5E95'),
  };

  // ------------------------------------------------------------ 1. gök ve yer
  bolge(new Path2D('M-10,-10 H1034 V1034 H-10 Z'), { renk: CB.gok, d: 0.62, aci: 0.04, egim: [0, 1 / 800, -0.6], firca: 1 }, 0);
  {
    const gx = S.gunes.x, gy = S.gunes.y;
    // hale halkası
    const hale = new Path2D(); hale.arc(gx, gy, 112, 0, Math.PI * 2);
    bolge(hale, { renk: CB.hale, d: 0.45, tur: 'radyal', merkez: [gx, gy], firca: 0.8 });
    // ışınlar: dalgalı alev biçimleri
    const isin = 12;
    for (let k = 0; k < isin; k++) {
      const a = (k / isin) * Math.PI * 2 + 0.15;
      const r1 = 52, r2 = k % 2 ? 98 : 106, w = 0.2;
      const p = (r, t) => [gx + Math.cos(a + t) * r, gy + Math.sin(a + t) * r];
      const y = new Path2D();
      y.moveTo(...p(r1, -w));
      y.quadraticCurveTo(...p((r1 + r2) / 2, -w * 0.2), ...p(r2, 0));
      y.quadraticCurveTo(...p((r1 + r2) / 2, w * 0.2), ...p(r1, w));
      y.closePath();
      bolge(y, { renk: k % 2 ? CB.gunes : CB.turuncu, d: 0.68, tur: 'radyal', merkez: [gx, gy], firca: 1 });
    }
    const disk = new Path2D(); disk.arc(gx, gy, 50, 0, Math.PI * 2);
    bolge(disk, { renk: CB.gunes, d: 0.75, tur: 'radyal', merkez: [gx, gy], firca: 1, egim: [-1 / 100, 1 / 100, 0.3], ex: gx, ey: gy });
    for (let k = 0; k < 24; k++) { const a = (k / 24) * Math.PI * 2; nokta(gx + Math.cos(a) * 38, gy + Math.sin(a) * 38, 1.6); }
  }
  // bulutlar: buzlu beyaz cam boyası
  function bulut(bx, by, s) {
    // dilimli bulut: dairelerin birleşiminin dış çizgisi (merkezden kutupsal örnekleme)
    const tum = [[-58, 8, 24], [-28, -6, 30], [8, -14, 34], [42, -4, 28], [66, 8, 20]].map(([dx, dy, r]) => [bx + dx * s, by + dy * s, r * s]);
    const alt = by + 24 * s, sol = bx - 80 * s, sag = bx + 84 * s;
    const cx = bx, cy = by + 6 * s;
    const pts = [];
    for (let k = 0; k < 360; k++) {
      const th = (k / 360) * Math.PI * 2, dx = Math.cos(th), dy = Math.sin(th);
      let r = 0;
      for (const [x, y, rr] of tum) {
        const ox = cx - x, oy = cy - y;
        const bq = ox * dx + oy * dy, cq = ox * ox + oy * oy - rr * rr;
        const disc = bq * bq - cq;
        if (disc >= 0) r = Math.max(r, -bq + Math.sqrt(disc));
      }
      // alt kısım: düz taban (yuvarlatılmış köşeli dikdörtgen)
      if (dy > 0) { const t = (alt - cy) / dy; const xx = cx + dx * t; if (xx > sol && xx < sag) r = Math.max(r, Math.min(t, r > 0 ? Math.max(r, t) : t)); }
      pts.push([cx + dx * r, cy + dy * r]);
    }
    bolge(P(S.yol(pts, true)), { renk: rgb('#CFE2F4'), d: 0.45, aci: 0.02, buzlu: 1, firca: 0.6 });
    // iç kıvrım: tek ince kontür yayı
    const [x2, y2, r2] = tum[2];
    cizgi(P(`M${x2 - r2 * 0.6},${y2 + r2 * 0.5} A${r2 * 0.6},${r2 * 0.6} 0 0,1 ${x2 + r2 * 0.55},${y2 + r2 * 0.35}`), 2.0);
  }
  bulut(170, 250, 1.0); bulut(500, 150, 0.85); bulut(752, 336, 1.0); bulut(940, 474, 0.65); bulut(86, 474, 0.65);
  // yer
  bolge(new Path2D('M-10,800 H1034 V1034 H-10 Z'), { renk: rgb('#FFD873'), d: 0.42, aci: -0.03, egim: [0, 1 / 224, 0.3], ey: 800, firca: 1 });

  // ------------------------------------------------------------ 2. minare
  const alemCiz = (a) => {
    altinDolgu(P(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 })));
    altinDolgu(P(S.yol([[a.cubuk.x1, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y1], [a.cubuk.x2, a.cubuk.y2], [a.cubuk.x1, a.cubuk.y2]], true)));
    for (const k of a.kureler) altinDolgu(P(S.daireYolu(k.cx, k.cy, k.r)));
    altinDolgu(P(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)));
  };
  {
    const c = S.minare.cx;
    for (const p of S.minareParcalari()) {
      if (p.tip === 'alem') continue;
      let d;
      if (p.tip === 'poligon') d = S.yol(p.noktalar, true);
      else if (p.tip === 'topuz') d = p.yol;
      else d = S.yol([[p.x1, p.y1], [p.x2, p.y1], [p.x2, p.y2], [p.x1, p.y2]], true);
      let b = { renk: CB.tas, d: 0.7, aci: Math.PI / 2, firca: 0.8, egim: [-1 / 60, 0, 0.4], ex: c };
      if (p.ad.startsWith('şerefe') || p.ad === 'bilezik') b = { renk: CB.mercan, d: 0.75, aci: 0, firca: 1 };
      if (p.ad.startsWith('korkuluk')) b = { renk: CB.mavi, d: 0.42, aci: 0, firca: 1 };
      if (p.tip === 'bant') b = { renk: CB.gul, d: 0.5, aci: 0, firca: 1 };
      if (p.tip === 'topuz') b = { renk: CB.krem, d: 0.8, aci: Math.PI / 2, firca: 0.8, egim: [-1 / 40, 0, 0.5], ex: c };
      bolge(P(d), b);
      if (p.tip === 'korkuluk') {
        const adet = 8;
        for (let k = 0; k <= adet; k++) {
          const x = p.x1 + ((p.x2 - p.x1) * k) / adet;
          cizgi(P(`M${x},${p.y1} L${x},${p.y2}`), 2.0);
        }
      }
      if (p.tip === 'bant') for (const z of S.zikzakCizgileri()) { olX.lineJoin = 'miter'; cizgi(P(S.yol(z)), 2.4); olX.lineJoin = 'round'; }
    }
    for (const w of S.minarePencereleri) bolge(P(S.kemerYolu(w.x, w.y, w.w, w.h)), { renk: CB.mavi, d: 0.75, aci: Math.PI / 2, firca: 1 }, 2.2);
    alemCiz(S.minareParcalari().find((p) => p.tip === 'alem').alem);
  }

  // ------------------------------------------------------------ 3. kaide
  {
    const Kd = S.kaide;
    bolge(P(Y.kaide), { renk: CB.tas, d: 0.75, aci: 0, firca: 0.9, egim: [-1 / 520, 0, 0.5], ex: 560 });
    bolge(P(Y.kornis), { renk: CB.krem, d: 0.8, aci: 0, firca: 1 });
    for (const w of Kd.pencereler) {
      bolge(P(S.kemerYolu(w.x, w.y - 8, w.w + 16, w.h + 8)), { renk: CB.mercan, d: 0.55, aci: Math.PI / 2, firca: 1 });
      bolge(P(S.kemerYolu(w.x, w.y, w.w, w.h)), { renk: CB.mavi, d: 0.8, aci: Math.PI / 2, firca: 1 });
    }
    // kaide altında süs noktaları ve ince çizgi
    cizgi(P(`M${Kd.x1 + 6},786 L${Kd.x2 - 6},786`), 2.0);
    for (let x = Kd.x1 + 14; x < Kd.x2 - 8; x += 15) nokta(x, 794, 2.1);
    for (let x = Kd.x1 + 20; x < Kd.x2 - 10; x += 24) nokta(x, 712, 1.7);
  }

  // ------------------------------------------------------------ 4. kasnak
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    bolge(P(kat ? Y.kasnakAlt : Y.kasnakUst), { renk: CB.kasnak, d: 0.72, aci: Math.PI / 2, firca: 1, egim: [-1 / 450, 0, 0.5], ex: 560 });
    for (const w of S.kasnakPencereleri(kat)) bolge(P(S.kemerYolu(w.x, w.y, w.w, w.h)), { renk: CB.mavi, d: 0.8, aci: Math.PI / 2, firca: 1 }, 2.0);
    if (kat === 1) {
      const ws = S.kasnakPencereleri(1);
      for (let j = 0; j < ws.length - 1; j++) nokta((ws[j].x + ws[j + 1].x) / 2, 652, 2.0);
    }
  }

  // ------------------------------------------------------------ 5. kubbe: dilim dilim saydam yeşil
  {
    const prof = S.kubbeProfili(240);
    const satirR = (y) => {
      for (let i = 0; i < prof.length - 1; i++) {
        const a = prof[i], b = prof[i + 1];
        if (y <= a.y && y >= b.y) { const t = (a.y - y) / ((a.y - b.y) || 1); return a.r + (b.r - a.r) * t; }
      }
      return 0;
    };
    const dilim = Math.PI / 16;
    for (let k = 0; k < 16; k++) {
      const p0 = -Math.PI / 2 + k * dilim, p1 = p0 + dilim;
      const pts = [];
      for (let y = 300; y <= 555; y += 3) pts.push([560 + Math.sin(p0) * satirR(y), y]);
      pts.push([560 + Math.sin(p0) * 200, 555]);
      pts.push([560 + Math.sin(p1) * 200, 555]);
      for (let y = 555; y >= 300; y -= 3) pts.push([560 + Math.sin(p1) * satirR(y), y]);
      const orta = (p0 + p1) / 2;
      const isik = Math.sin(orta); // -1 sol, +1 sağ
      bolge(P(S.yol(pts, true)), { renk: k % 2 ? CB.kubbe : CB.kubbeAcik, d: 0.8 - 0.32 * (isik + 1) / 2, tur: 'kubbe', firca: 1, egim: [0, -1 / 255, 0.25], ey: 555 }, 2.3);
    }
    cizgi(P(S.kubbeYolu), KW);
    for (let k = 0; k < 32; k++) { const ph = -Math.PI / 2 + ((k + 0.5) / 32) * Math.PI; nokta(560 + Math.sin(ph) * 190, 545, 1.9); }
    alemCiz(S.alemParcalari(560, 300, 1));
  }

  // ------------------------------------------------------------ 6. bitkiler: altın saplar, saydam yapraklar ve çiçekler
  {
    const B = S.bitki;
    for (const s of B.saplar) cizgi(P(S.yol(s)), 3.2);
    for (const y of B.yapraklar) {
      bolge(P(S.yaprakYolu(y)), { renk: y.uzunluk > 55 ? CB.yaprak2 : CB.yaprak, d: 0.6, aci: y.aci, firca: 1, tur: 'yaprak', y });
      const [a, b] = S.yaprakDamari(y);
      cizgi(P(`M${a[0]},${a[1]} L${(a[0] * 0.25 + b[0] * 0.75)},${(a[1] * 0.25 + b[1] * 0.75)}`), 1.8);
    }
    for (const t of B.tomurcuklar) bolge(P(S.tomurcukYolu(t)), { renk: CB.tomurcuk, d: 0.7, aci: t.aci, firca: 1 }, 2.2);
    for (const c of B.cicekler) {
      for (const e of S.tacYapraklari(c)) {
        bolge(P(S.elipsYolu(e)), { renk: CB.pembe, d: 0.7, tur: 'tac', merkez: [c.x, c.y], R: c.r, firca: 0.9 }, c.r > 40 ? 3.0 : 2.4);
      }
      const orta = new Path2D(); orta.arc(c.x, c.y, c.r * 0.24, 0, Math.PI * 2);
      bolge(orta, { renk: CB.orta, d: 0.9, tur: 'radyal', merkez: [c.x, c.y], firca: 1 }, 2.2);
      const n = Math.max(6, Math.round(c.r / 5));
      for (let k = 0; k < n; k++) { const a = (k / n) * Math.PI * 2 + c.aci; nokta(c.x + Math.cos(a) * c.r * 0.36, c.y + Math.sin(a) * c.r * 0.36, Math.max(1.3, c.r * 0.04)); }
      nokta(c.x, c.y, Math.max(1.6, c.r * 0.06));
    }
  }

  // ------------------------------------------------------------ 7. kenar süsü (camın kendi çerçeve çizgisi)
  cizgi(P('M18,18 H1006 V1006 H18 Z'), 2.6);
  for (let t = 30; t < 1000; t += 22) { nokta(t, 9.5, 2.1); nokta(t, 1014.5, 2.1); nokta(9.5, t, 2.1); nokta(1014.5, t, 2.1); }

  // ------------------------------------------------------------ 8. bulanık kopyalar
  function bulanikKopya(src, blur, dx, dy) {
    const c = tuvalYap();
    const x = c.getContext('2d', { willReadFrequently: true });
    x.filter = `blur(${blur}px)`;
    x.drawImage(src, dx || 0, dy || 0);
    return x.getImageData(0, 0, N, N).data;
  }
  const idV = idX.getImageData(0, 0, N, N).data;
  const olV = olX.getImageData(0, 0, N, N).data;
  const olB = bulanikKopya(olC, 2.2 * K); // kabartma yüksekliği
  const olH = bulanikKopya(olC, 9 * K); // boya birikimi (kontür yakını)
  const olG = bulanikKopya(olC, 2.5 * K, -4 * K, 4 * K); // kontürün kartona gölgesi

  // ------------------------------------------------------------ 9. geçirgenlik haritası
  const Tc = tuvalYap();
  const Tx = Tc.getContext('2d', { willReadFrequently: true });
  const Ti = Tx.createImageData(N, N);
  const T = Ti.data;
  for (let py = 0; py < N; py++) {
    const y = py / K;
    for (let px = 0; px < N; px++) {
      const x = px / K;
      const j = (py * N + px) * 4;
      const idx = idV[j] + ((idV[j + 1] - 8) >> 4) * 256;
      const b = bolgeler[clamp(idx, 0, bolgeler.length - 1)];
      // fırça yönü
      let aci = b.aci || 0;
      if (b.tur === 'radyal' || b.tur === 'tac') aci = Math.atan2(y - b.merkez[1], x - b.merkez[0]) + Math.PI / 2 * (b.tur === 'radyal' ? 0 : 0);
      if (b.tur === 'kubbe') aci = Math.PI / 2 + (x - 560) / 400;
      const ca = Math.cos(aci), sa = Math.sin(aci);
      const u = x * ca + y * sa, v = -x * sa + y * ca;
      // fırça izi: yön boyunca uzun, enine sık değişen yoğunluk
      // geniş fırça darbeleri (üst üste binen iki kat) + ince kıl çizgileri
      const kat = vnoise(u * 0.0045, v * 0.03, 5);
      const ikiKat = clamp((kat - 0.52) * 9, 0, 1);
      const iz = 0.5 * vnoise(u * 0.01, v * 0.085, 3) + 0.3 * vnoise(u * 0.03, v * 0.3, 4) + 0.2 * vnoise(u * 0.06, v * 0.9, 6);
      let d = b.d * (1 + (b.firca || 0) * ((iz - 0.5) * 0.95 + ikiKat * 0.38 - 0.12));
      if (b.egim) {
        const [gx, gy, k] = b.egim;
        const ox = b.ex != null ? b.ex : 0, oy = b.ey != null ? b.ey : 0;
        d *= 1 + k * ((x - ox) * gx + (y - oy) * gy) * (gx || gy ? 1 : 0);
      }
      if (b.tur === 'tac') {
        const r = Math.hypot(x - b.merkez[0], y - b.merkez[1]) / b.R;
        d *= clamp(1.25 - r * 1.15, 0.12, 1.2);
      }
      // kontür dibinde biriken boya
      const birik = olH[j + 3] / 255;
      d *= 1 + 0.75 * birik * birik;
      d = Math.max(0, d);
      let tr = Math.pow(b.renk[0], d), tg = Math.pow(b.renk[1], d), tb = Math.pow(b.renk[2], d);
      if (b.buzlu) {
        // buzlu (frost) beyaz: ince taneli, sütlü
        const tane = vnoise(x * 0.9, y * 0.9, 9) * 0.6 + vnoise(x * 2.3, y * 2.3, 10) * 0.4;
        const sut = 0.06 + 0.1 * tane;
        tr = tr * (1 - sut) + sut * 0.86; tg = tg * (1 - sut) + sut * 0.9; tb = tb * (1 - sut) + sut * 0.97;
      }
      T[j] = tr * 255; T[j + 1] = tg * 255; T[j + 2] = tb * 255; T[j + 3] = 255;
    }
  }
  Tx.putImageData(Ti, 0, 0);
  // camdan geçen ışığın kartona düşen renkli gölgesi: sola-aşağı kaydırılmış, bulanık geçirgenlik
  const Tg = bulanikKopya(Tc, 3 * K, -5.5 * K, 5.5 * K);

  // ------------------------------------------------------------ 10. birleşim
  const out = ctx.createImageData(N, N);
  const o = out.data;
  const L = [0.55, -0.6, 0.58];
  { const n = Math.hypot(...L); L[0] /= n; L[1] /= n; L[2] /= n; }
  const Hh = [L[0], L[1], L[2] + 1]; { const n = Math.hypot(...Hh); Hh[0] /= n; Hh[1] /= n; Hh[2] /= n; }
  for (let py = 0; py < N; py++) {
    for (let px = 0; px < N; px++) {
      const j = (py * N + px) * 4;
      const x = px / K, y = py / K;
      // karton (beyaz, çok hafif sıcak) + gölgeler
      const yonlu = 0.36;
      const kg = 1 - 0.3 * (olG[j + 3] / 255);
      let pr = 252 * kg * (1 - yonlu + yonlu * Tg[j] / 255);
      let pg = 251 * kg * (1 - yonlu + yonlu * Tg[j + 1] / 255);
      let pb = 247 * kg * (1 - yonlu + yonlu * Tg[j + 2] / 255);
      // cam boyasından geçen ışık
      let r = pr * T[j] / 255, g = pg * T[j + 1] / 255, b = pb * T[j + 2] / 255;
      // camın yumuşak yansımaları (çapraz geniş bantlar + ince parlak çizgi)
      const bant = x * 0.7 - y * 0.72;
      const boy = x * 0.72 + y * 0.7; // bant boyunca konum
      const yans = 0.12 * Math.exp(-Math.pow((bant + 140) / 110, 2)) + 0.09 * Math.exp(-Math.pow((bant - 290) / 40, 2)) * Math.exp(-Math.pow((boy - 700) / 420, 2)) + 0.16 * Math.exp(-Math.pow((bant - 345) / 13, 2)) * Math.exp(-Math.pow((boy - 650) / 260, 2));
      // sol üst köşede camın parlak pencere yansıması
      const s2 = x + y, s3 = x - y;
      const yans2 = (0.3 * Math.exp(-Math.pow((s2 - 300) / 34, 2)) + 0.2 * Math.exp(-Math.pow((s2 - 372) / 11, 2))) * Math.exp(-Math.pow((s3 + 20) / 230, 2));
      const yt = Math.min(0.5, yans + yans2);
      r += (255 - r) * yt; g += (255 - g) * yt; b += (255 - b) * yt;
      // kabarık altın kontür
      const a = olV[j + 3] / 255;
      if (a > 0.004) {
        const xm = px > 0 ? j - 4 : j, xp = px < N - 1 ? j + 4 : j;
        const ym = py > 0 ? j - N * 4 : j, yp = py < N - 1 ? j + N * 4 : j;
        const hx = (olB[xp + 3] - olB[xm + 3]) / 255, hy = (olB[yp + 3] - olB[ym + 3]) / 255;
        let nx = -hx * 5.5, ny = -hy * 5.5, nz = 1;
        const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        const NL = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const NH = Math.max(0, nx * Hh[0] + ny * Hh[1] + nz * Hh[2]);
        const kum = 0.92 + 0.16 * vnoise(x * 1.7, y * 1.7, 31); // metal tozu
        const ton = (0.38 + 0.85 * NL) * kum;
        const sp = Math.pow(NH, 40) * 1.1 + Math.pow(NH, 8) * 0.18;
        const ar = clamp(201 * ton + 255 * sp, 0, 255);
        const ag = clamp(156 * ton + 246 * sp, 0, 255);
        const ab = clamp(60 * ton + 196 * sp, 0, 255);
        r = r * (1 - a) + ar * a; g = g * (1 - a) + ag * a; b = b * (1 - a) + ab * a;
      }
      o[j] = clamp(r, 0, 255); o[j + 1] = clamp(g, 0, 255); o[j + 2] = clamp(b, 0, 255); o[j + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
  S.hazir();
})();
