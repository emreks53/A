<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-022 Düz İllüstrasyon — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #C7DCDD; }
  canvas, svg { display: block; }
</style>
</head>
<body>
<div id="sahne"></div>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-022 Düz İllüstrasyon (Flat Illustration) — kontur yok; sınırlı, uyumlu palet; her biçimde tek
  // bir koyu ton (ışık sağ üstten, gölge sol/alt yanda); geometrik sadeleştirme, keskin kenarlar.
  const S = SAHNE;
  const f = (n) => Math.round(n * 100) / 100;

  // ---------------------------------------------------------------- palet (açık / gölge / girinti)
  const P = {
    gok: '#C7DCDD',
    hale: '#D7E5DF',
    gunes: '#F8EDD6',
    bulut: '#FCFAF4', bulutG: '#E3EBE7',
    tas: '#FFF8EE', tasG: '#EBD9C2', tasD: '#D6BC98',
    yesil: '#2E7E5C', yesilG: '#21614A', yesilD: '#164535',
    altin: '#E8AE46', altinG: '#C4892D',
    yaprak: '#7DA877', yaprakG: '#5C8A5C',
    mercan: '#EC8D73', mercanG: '#CD6E57',
    zemin: '#E6CCA6',
  };

  // ---------------------------------------------------------------- SVG yardımcıları
  const defs = [];
  const out = [];
  let sayac = 0;
  const kirp = (d) => {
    const id = 'k' + sayac++;
    defs.push(`<clipPath id="${id}"><path d="${d}"/></clipPath>`);
    return id;
  };
  const dol = (d, renk, ek) => out.push(`<path d="${d}" fill="${renk}"${ek ? ' ' + ek : ''}/>`);
  const grup = (id, icerik) => {
    out.push(`<g clip-path="url(#${id})">`);
    icerik();
    out.push('</g>');
  };
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const serit = (pts, w, renk) => out.push(`<path d="${S.yol(pts)}" fill="none" stroke="${renk}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="butt"/>`);
  /** Kaydırmalı tek ton gölge: biçim gölge renginde, üstüne sağ üste kaydırılmış kopyası açık renkte (biçime kırpılı). */
  function golgeli(d, acik, koyu, k) {
    dol(d, koyu);
    grup(kirp(d), () => dol(d, acik, `transform="translate(${f(k)},${f(-k)})"`));
  }
  const terminator = -0.383; // ışık sağ üstten: gölge sınırı (u = sin(boylam)), kubbe, kasnak ve minarede ortak

  // ---------------------------------------------------------------- gök
  dol(dik(0, 0, 1024, 1024), P.gok);
  dol(S.daireYolu(S.gunes.x, S.gunes.y, 132), P.hale);
  dol(S.daireYolu(S.gunes.x, S.gunes.y, 64), P.gunes);

  function bulut(x, y, s) {
    // düz tabanlı hap + üç tümsek; her parça ayrı yol (birleşim), tek ton gölge alt-solda
    const h = 30 * s;
    const parca = [
      S.daireYolu(x - 46 * s, y - 14 * s, 26 * s),
      S.daireYolu(x - 2 * s, y - 30 * s, 40 * s),
      S.daireYolu(x + 44 * s, y - 16 * s, 28 * s),
      `M${f(x - 70 * s)},${f(y)} A${f(h / 2)},${f(h / 2)} 0 0,1 ${f(x - 70 * s)},${f(y - h)} L${f(x + 70 * s)},${f(y - h)} A${f(h / 2)},${f(h / 2)} 0 0,1 ${f(x + 70 * s)},${f(y)} Z`,
    ];
    const id = 'k' + sayac++;
    defs.push(`<clipPath id="${id}">${parca.map((d) => `<path d="${d}"/>`).join('')}</clipPath>`);
    for (const d of parca) dol(d, P.bulutG);
    grup(id, () => {
      for (const d of parca) dol(d, P.bulut, `transform="translate(${f(5 * s)},${f(-7 * s)})"`);
    });
  }
  bulut(178, 262, 1.15);
  bulut(470, 150, 0.7);
  bulut(816, 372, 0.95);

  // ---------------------------------------------------------------- yer
  dol(dik(0, 800, 1024, 1024), P.zemin);

  // ---------------------------------------------------------------- minare
  const minare = S.minareParcalari();
  const mx = S.minare.cx;
  function minareParca(p, g) {
    // g: false → açık geçiş, true → gölge geçişi (sol yan kırpılı)
    const A = g ? P.tasG : P.tas;
    const Y = g ? P.tasD : P.tasG; // oyuk / alt yüz
    if (p.tip === 'poligon') {
      const alt = p.ad.startsWith('çıkma');
      dol(S.yol(p.noktalar, true), alt ? P.tasG : A);
      if (p.ad.startsWith('şerefe')) {
        const ys = p.noktalar.map((q) => q[1]);
        dol(dik(p.noktalar[0][0], Math.max(...ys) - 3, p.noktalar[1][0], Math.max(...ys)), Y);
      }
      if (p.ad === 'bilezik') dol(dik(p.noktalar[0][0], 203, p.noktalar[1][0], 206), Y);
    } else if (p.tip === 'korkuluk') {
      dol(dik(p.x1, p.y1, p.x2, p.y2), Y);
      dol(dik(p.x1, p.y1, p.x2, p.y1 + 5), A);
      const adet = 9;
      const bw = 4.4;
      for (let i = 0; i <= adet; i++) {
        const x = p.x1 + bw / 2 + ((p.x2 - p.x1 - bw) * i) / adet;
        dol(dik(x - bw / 2, p.y1 + 5, x + bw / 2, p.y2), A);
      }
    } else if (p.tip === 'bant') {
      for (const z of S.zikzakCizgileri()) serit(z.map(([x, y]) => [x, y + 2]), 3.6, Y);
      dol(dik(p.x1, p.y1 - 2, p.x2, p.y1 + 1), Y);
      dol(dik(p.x1, p.y2 - 1, p.x2, p.y2 + 2), Y);
    } else if (p.tip === 'topuz') {
      dol(p.yol, A);
    }
  }
  const yari = (p) => {
    if (p.tip === 'poligon') return (Math.max(...p.noktalar.map((q) => q[0])) - Math.min(...p.noktalar.map((q) => q[0]))) / 2;
    if (p.tip === 'topuz') return 34;
    return (p.x2 - p.x1) / 2;
  };
  for (const p of minare) {
    if (p.tip === 'alem') continue;
    minareParca(p, false);
    const R = yari(p);
    const tx = mx + terminator * R;
    grup(kirp(dik(mx - 80, 0, tx, 1024)), () => minareParca(p, true));
  }
  for (const p of S.minarePencereleri) dol(S.kemerYolu(p.x, p.y, p.w, p.h), P.yesilD);
  alem(minare.find((p) => p.tip === 'alem').alem);

  // ---------------------------------------------------------------- kaide
  const K = S.kaide;
  dol(dik(K.x1, K.y1, K.x2, K.y2), P.tas);
  dol(dik(K.x1, K.y1, K.x2, K.y1 + 7), P.tasG); // korniş gölgesi
  // kaidenin sol ucu: gölgede kalan dar yüz
  dol(dik(K.x1, K.y1 + 7, K.x1 + 16, K.y2), P.tasG);
  dol(dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), P.tas);
  dol(dik(K.kornis.x1, K.kornis.y2 - 3, K.kornis.x2, K.kornis.y2), P.tasG);
  dol(dik(K.kornis.x1, K.kornis.y1, K.kornis.x1 + 16, K.kornis.y2), P.tasG);
  for (const p of K.pencereler) {
    dol(S.kemerYolu(p.x, p.y, p.w, p.h), P.yesilD);
    dol(dik(p.x - p.w / 2 - 3, p.y + p.h, p.x + p.w / 2 + 3, p.y + p.h + 4), P.tasG); // denizlik
  }
  // basamak çizgisi
  dol(dik(K.x1, K.y2 - 8, K.x2, K.y2), P.tasG);

  // ---------------------------------------------------------------- kasnak
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const R = (q.x2 - q.x1) / 2;
    const tx = 560 + terminator * R;
    dol(dik(q.x1, q.y1, q.x2, q.y2), P.yesil);
    dol(dik(q.x1, q.y1, tx, q.y2), P.yesilG);
    dol(dik(q.x1, q.y2 - 6, q.x2, q.y2), P.yesilD); // alt silme
    dol(dik(q.x1, q.y2 - 6, tx, q.y2), P.yesilD);
    for (const p of S.kasnakPencereleri(k)) dol(S.kemerYolu(p.x, p.y, p.w, p.h), P.yesilD);
  }

  // ---------------------------------------------------------------- kubbe
  const prof = S.kubbeProfili(80);
  const meridyen = (u) => prof.map((q) => [560 + u * q.r, q.y]);
  dol(S.kubbeYolu, P.yesil);
  const golgeKubbe = S.yol([...meridyen(-1), ...meridyen(terminator).reverse()], true);
  dol(golgeKubbe, P.yesilG);
  grup(kirp(S.kubbeYolu), () => {
    for (const kb of S.kaburgalar(16, 80)) {
      const pts = meridyen(kb.u).filter((q) => q[1] > 306);
      const golgede = kb.u < terminator - 0.01;
      if (Math.abs(kb.u - terminator) < 0.01) continue;
      serit(pts, 2.4, golgede ? P.yesilD : P.yesilG);
    }
  });
  alem(S.alemParcalari(560, 300, 1));

  function alem(a) {
    const s = a.yaka.rx / 20;
    dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), P.altin);
    dol(dik(a.cubuk.x1, a.cubuk.y1, a.yaka.cx - 0.2 * s, a.cubuk.y2), P.altinG);
    for (const k of a.kureler) golgeli(S.daireYolu(k.cx, k.cy, k.r), P.altin, P.altinG, k.r * 0.32);
    const yaka = S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 });
    dol(yaka, P.altin);
    grup(kirp(yaka), () => dol(dik(a.yaka.cx - a.yaka.rx, a.yaka.cy - 20, a.yaka.cx - a.yaka.rx * 0.25, a.yaka.cy + 20), P.altinG));
    const h = S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R);
    dol(h, P.altin);
    grup(kirp(h), () => dol(dik(a.hilal.cx - 40, a.hilal.cy - 40, a.hilal.cx - a.hilal.R * 0.15, a.hilal.cy + 40), P.altinG));
  }

  // ---------------------------------------------------------------- bitkiler
  const B = S.bitki;
  const L = [0.7071, -0.7071]; // ışık yönü (sağ üst)
  // öndeki tomurcukların sapları (yaprakların arkasında kalır)
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8, y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    out.push(`<path d="M${f(x0)},${f(y0)} Q${f(t.x)},${f(t.y + 80)} ${f(bx)},${f(t.y + 170)}" fill="none" stroke="${P.yaprakG}" stroke-width="4" stroke-linecap="round"/>`);
  }
  for (const s of B.saplar) out.push(`<path d="${S.yol(s)}" fill="none" stroke="${P.yaprakG}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`);

  function yaprak(y, koyu) {
    const ACIK = koyu ? P.yesil : P.yaprak, GOLGE = koyu ? P.yesilG : P.yaprakG;
    const Lu = y.uzunluk, W = Lu * y.genislik;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const q = (pt) => `${f(pt[0])},${f(pt[1])}`;
    const a = p(0, 0), b = p(Lu, 0);
    const negatif = `M${q(a)} C${q(p(Lu * 0.35, -W * 0.75))} ${q(p(Lu * 0.8, -W * 0.45))} ${q(b)} Z`;
    const pozitif = `M${q(b)} C${q(p(Lu * 0.8, W * 0.45))} ${q(p(Lu * 0.35, W * 0.75))} ${q(a)} Z`;
    // v>0 yanının normali: (-sin, cos)
    const pozAcik = -sa * L[0] + ca * L[1] > 0;
    dol(negatif, pozAcik ? GOLGE : ACIK);
    dol(pozitif, pozAcik ? ACIK : GOLGE);
  }
  // öndeki yaprak yelpazesi seyreltilir: birbirine çok yakın yapraklar atlanır, kalanlar biraz büyür;
  // böylece çiçek tarhı kalabalık değil, okunaklı birkaç büyük biçimden kurulur
  const merkezi = (y) => [y.x + Math.cos(y.aci) * y.uzunluk * 0.5, y.y + Math.sin(y.aci) * y.uzunluk * 0.5];
  const secili = [];
  B.yapraklar.forEach((y, i) => {
    if (i < 36) return yaprak(y, false);
    const [cx, cy] = merkezi(y);
    if (secili.some(([x, yy]) => Math.hypot(x - cx, yy - cy) < 78)) return;
    secili.push([cx, cy]);
    // her üç yapraktan biri kubbenin yeşilinde: derinlik ve palet birliği
    yaprak({ ...y, uzunluk: y.uzunluk * 1.12 }, secili.length % 3 === 0);
  });

  function tomurcuk(t) {
    golgeli(S.tomurcukYolu(t), P.mercan, P.mercanG, t.r * 0.28);
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const q = (pt) => `${f(pt[0])},${f(pt[1])}`;
    dol(`M${q(p(-t.r * 1.0, 0))} Q${q(p(-t.r * 0.2, -t.r * 1.1))} ${q(p(t.r * 0.25, -t.r * 0.55))} Q${q(p(-t.r * 0.1, 0))} ${q(p(t.r * 0.25, t.r * 0.55))} Q${q(p(-t.r * 0.2, t.r * 1.1))} ${q(p(-t.r * 1.0, 0))} Z`, P.yaprakG);
  }
  for (const t of B.tomurcuklar) tomurcuk(t);

  function cicek(c) {
    const tac = S.tacYapraklari(c).map((e) => ({ ...e, cx: c.x + Math.cos(e.aci) * c.r * 0.56, cy: c.y + Math.sin(e.aci) * c.r * 0.56, rx: c.r * 0.5, ry: c.r * 0.42 }));
    // ışığa en uzak yaprak önce: üst üste binmede gölge kenarı görünür
    tac.sort((m, n) => (Math.cos(m.aci) * L[0] + Math.sin(m.aci) * L[1]) - (Math.cos(n.aci) * L[0] + Math.sin(n.aci) * L[1]));
    for (const e of tac) golgeli(S.elipsYolu(e), P.tas, P.tasG, c.r * 0.11);
    golgeli(S.daireYolu(c.x, c.y, c.r * 0.3), P.mercan, P.mercanG, c.r * 0.05);
    golgeli(S.daireYolu(c.x, c.y, c.r * 0.17), P.altin, P.altinG, c.r * 0.06);
  }
  for (const c of B.cicekler) cicek(c);

  // ---------------------------------------------------------------- SVG
  document.getElementById('sahne').innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">` +
    `<defs>${defs.join('')}<filter id="gren" x="0" y="0" width="100%" height="100%">` +
    `<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="22" stitchTiles="stitch"/>` +
    `<feColorMatrix type="saturate" values="0"/></filter></defs>${out.join('')}` +
    `<rect width="1024" height="1024" filter="url(#gren)" opacity="0.07" style="mix-blend-mode:multiply"/></svg>`;
  requestAnimationFrame(() => requestAnimationFrame(() => S.hazir()));
</script>
</body>
</html>
