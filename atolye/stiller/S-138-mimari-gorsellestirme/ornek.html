<script>
'use strict';
// ================================================================== MOTOR (ortak render çekirdeği)
// Doğrusal ışıkta kayan noktalı çerçeve arabelleği (FB). Her öğe ayrı bir maske katmanıdır:
// Path2D ile kenarı yumuşatılmış alfa maskesi çizilir, piksel başına yüzey normali (analitik ya da
// mesafe dönüşümünden şişirme) ve malzeme gölgelendirmesi hesaplanır, FB'ye alfa ile bileştirilir.
const S = SAHNE;
const O = 2;
const N = 1024 * O;
const tuval = document.getElementById('tuval');
tuval.width = N;
tuval.height = N;
const ctx = tuval.getContext('2d');
const FB = new Float32Array(N * N * 3);
const SOLID = new Float32Array(N * N);

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
function lin(h) {
  return [1, 3, 5].map((i) => {
    const c = parseInt(h.slice(i, i + 2), 16) / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
}
function bez(p0, p1, p2, p3, t) { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; }

// ------------------------------------------------------------------ gürültü
const PERM = new Uint8Array(512);
{
  const r = S.rng(90210);
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
const GX = new Float32Array(256), GY = new Float32Array(256);
for (let i = 0; i < 256; i++) { const a = (i / 256) * Math.PI * 2 + 0.37; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
function perlin(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const X = ix & 255, Y = iy & 255;
  const a = PERM[PERM[X] + Y], b = PERM[PERM[X + 1] + Y], c = PERM[PERM[X] + Y + 1], d = PERM[PERM[X + 1] + Y + 1];
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const na = GX[a] * fx + GY[a] * fy;
  const nb = GX[b] * (fx - 1) + GY[b] * fy;
  const nc = GX[c] * fx + GY[c] * (fy - 1);
  const nd = GX[d] * (fx - 1) + GY[d] * (fy - 1);
  return (na + (nb - na) * u + (nc - na) * v + (na - nb - nc + nd) * u * v) * 1.4;
}
function fbm(x, y, oct, kaz) {
  let s = 0, a = 0.5, f = 1, t = 0;
  kaz = kaz || 0.5;
  for (let i = 0; i < oct; i++) { s += a * perlin(x * f + i * 17.3, y * f - i * 9.1); t += a; a *= kaz; f *= 2.03; }
  return s / t;
}
function ihash(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul((c | 0) + 7, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ------------------------------------------------------------------ maske katmanı
function katman(bb, ciz, pad) {
  pad = pad === undefined ? 3 : pad;
  const x0 = Math.max(0, Math.floor(bb[0]) - pad), y0 = Math.max(0, Math.floor(bb[1]) - pad);
  const x1 = Math.min(1024, Math.ceil(bb[2]) + pad), y1 = Math.min(1024, Math.ceil(bb[3]) + pad);
  const w = Math.max(1, (x1 - x0) * O), h = Math.max(1, (y1 - y0) * O);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const m = c.getContext('2d', { willReadFrequently: true });
  m.setTransform(O, 0, 0, O, -x0 * O, -y0 * O);
  m.fillStyle = '#000'; m.strokeStyle = '#000'; m.lineCap = 'round'; m.lineJoin = 'round';
  ciz(m);
  const d = m.getImageData(0, 0, w, h).data;
  const A = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) A[i] = d[i * 4 + 3] / 255;
  return { x0, y0, w, h, A, X0: x0 * O, Y0: y0 * O };
}
// katman maskesini 1024 koordinatında örnekle (çift doğrusal)
function ornekA(L, X, Y) {
  const fx = (X - L.x0) * O - 0.5, fy = (Y - L.y0) * O - 0.5;
  const ix = Math.floor(fx), iy = Math.floor(fy);
  if (ix < 0 || iy < 0 || ix >= L.w - 1 || iy >= L.h - 1) return 0;
  const tx = fx - ix, ty = fy - iy, k = iy * L.w + ix, A = L.A;
  return (A[k] * (1 - tx) + A[k + 1] * tx) * (1 - ty) + (A[k + L.w] * (1 - tx) + A[k + L.w + 1] * tx) * ty;
}
function ornekF(L, F, X, Y) {
  const fx = (X - L.x0) * O - 0.5, fy = (Y - L.y0) * O - 0.5;
  const ix = clamp(Math.floor(fx), 0, L.w - 2), iy = clamp(Math.floor(fy), 0, L.h - 2);
  const tx = clamp(fx - ix), ty = clamp(fy - iy), k = iy * L.w + ix;
  return (F[k] * (1 - tx) + F[k + 1] * tx) * (1 - ty) + (F[k + L.w] * (1 - tx) + F[k + L.w + 1] * tx) * ty;
}

// Katmanı gölgelendirip FB'ye bas. fn(X, Y, k, out): out[0..2] doğrusal renk, out[3] alfa çarpanı.
const _out = new Float32Array(4);
function bas(L, fn, kati) {
  kati = kati === undefined ? 1 : kati;
  const { w, h, A, X0, Y0 } = L;
  for (let j = 0; j < h; j++) {
    const gy = Y0 + j;
    if (gy < 0 || gy >= N) continue;
    const Y = (gy + 0.5) / O;
    for (let i = 0; i < w; i++) {
      const k = j * w + i;
      let a = A[k];
      if (a < 0.003) continue;
      const gx = X0 + i;
      if (gx < 0 || gx >= N) continue;
      const X = (gx + 0.5) / O;
      _out[3] = 1;
      fn(X, Y, k, _out);
      a *= _out[3];
      if (a <= 0) continue;
      const g = gy * N + gx, g3 = g * 3;
      FB[g3] += (_out[0] - FB[g3]) * a;
      FB[g3 + 1] += (_out[1] - FB[g3 + 1]) * a;
      FB[g3 + 2] += (_out[2] - FB[g3 + 2]) * a;
      if (kati) SOLID[g] = Math.max(SOLID[g], a * kati);
    }
  }
}
// Tam tuval piksel döngüsü (gök, zemin gibi arka planlar). fn(X, Y, out)
function tumu(y1, y2, fn, kati) {
  const j1 = Math.max(0, Math.floor(y1 * O)), j2 = Math.min(N, Math.ceil(y2 * O));
  for (let gy = j1; gy < j2; gy++) {
    const Y = (gy + 0.5) / O;
    for (let gx = 0; gx < N; gx++) {
      const X = (gx + 0.5) / O;
      _out[3] = 1;
      fn(X, Y, _out);
      const g = gy * N + gx, g3 = g * 3, a = _out[3];
      if (a >= 1) { FB[g3] = _out[0]; FB[g3 + 1] = _out[1]; FB[g3 + 2] = _out[2]; }
      else if (a > 0) { FB[g3] += (_out[0] - FB[g3]) * a; FB[g3 + 1] += (_out[1] - FB[g3 + 1]) * a; FB[g3 + 2] += (_out[2] - FB[g3 + 2]) * a; }
      if (kati) SOLID[g] = Math.max(SOLID[g], a * kati);
    }
  }
}

// ------------------------------------------------------------------ mesafe dönüşümü ve şişirme
function edt2(G, w, h) {
  const m = Math.max(w, h);
  const f = new Float64Array(m), dd = new Float64Array(m), v = new Int32Array(m), z = new Float64Array(m + 1);
  const dt = (n) => {
    let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; dd[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  };
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = G[y * w + x]; dt(h); for (let y = 0; y < h; y++) G[y * w + x] = dd[y]; }
  for (let y = 0; y < h; y++) { const o = y * w; for (let x = 0; x < w; x++) f[x] = G[o + x]; dt(w); for (let x = 0; x < w; x++) G[o + x] = dd[x]; }
}
function kutuBulanik(A, w, h, r) {
  if (r < 1) return;
  const B = new Float32Array(w * h);
  const inv = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    let acc = 0; const o = y * w;
    for (let x = -r; x <= r; x++) acc += A[o + clamp(x, 0, w - 1)];
    for (let x = 0; x < w; x++) {
      B[o + x] = acc * inv;
      acc += A[o + Math.min(w - 1, x + r + 1)] - A[o + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += B[clamp(y, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++) {
      A[y * w + x] = acc * inv;
      acc += B[Math.min(h - 1, y + r + 1) * w + x] - B[Math.max(0, y - r) * w + x];
    }
  }
}
// İçeride pozitif mesafe (1024 birimi)
function mesafe(L) {
  if (L.D) return L.D;
  const { A, w, h } = L; const n = w * h;
  const G = new Float64Array(n);
  for (let i = 0; i < n; i++) G[i] = A[i] >= 0.5 ? 1e10 : 0;
  edt2(G, w, h);
  const D = new Float32Array(n);
  for (let i = 0; i < n; i++) D[i] = A[i] >= 0.5 ? (Math.sqrt(G[i]) - 0.5) / O : 0;
  L.D = D;
  return D;
}
// Yükseklik alanından (1024 birimi) normal: H yumuşatılır, sonra merkez farkı.
function normaller(L, H, yum) {
  const { w, h } = L; const n = w * h;
  if (yum) { kutuBulanik(H, w, h, yum); kutuBulanik(H, w, h, yum); }
  const NX = new Float32Array(n), NY = new Float32Array(n), NZ = new Float32Array(n).fill(1);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const k = y * w + x;
    const gx = (H[k + 1] - H[k - 1]) * O * 0.5, gy = (H[k + w] - H[k - w]) * O * 0.5;
    const l = Math.sqrt(gx * gx + gy * gy + 1);
    NX[k] = -gx / l; NY[k] = -gy / l; NZ[k] = 1 / l;
  }
  L.NX = NX; L.NY = NY; L.NZ = NZ; L.H = H;
}
// Standart şişirme: kenarda R yarıçaplı dairesel pah; fn(X,Y,D) ek yükseklik verebilir
function sisir(L, R, yum, ek) {
  const D = mesafe(L);
  const { w, h } = L; const n = w * h;
  const H = new Float32Array(n);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i;
    const t = clamp(D[k] / R);
    let v = R * Math.sqrt(1 - (1 - t) * (1 - t));
    if (ek && L.A[k] > 0) v += ek((L.X0 + i + 0.5) / O, (L.Y0 + j + 0.5) / O, D[k]);
    H[k] = v;
  }
  normaller(L, H, yum === undefined ? 2 : yum);
}

// ------------------------------------------------------------------ gölge: katman maskesini kaydırıp bulanıklaştırarak arkadaki katılara bas
function golge(L, dx, dy, blur, guc, tint, alici) {
  const sx = Math.round(dx * O), sy = Math.round(dy * O);
  const r = Math.max(1, Math.round((blur * O) / 1.8));
  const p = 3 * r + 2;
  const W = L.w + 2 * p + Math.abs(sx), H = L.h + 2 * p + Math.abs(sy);
  const bx0 = L.X0 + Math.min(0, sx) - p, by0 = L.Y0 + Math.min(0, sy) - p;
  const B = new Float32Array(W * H);
  const ox = sx - Math.min(0, sx) + p, oy = sy - Math.min(0, sy) + p;
  for (let j = 0; j < L.h; j++) { const s = j * L.w, d = (j + oy) * W + ox; for (let i = 0; i < L.w; i++) B[d + i] = L.A[s + i]; }
  kutuBulanik(B, W, H, r); kutuBulanik(B, W, H, r); kutuBulanik(B, W, H, r);
  const t0 = 1 - tint[0], t1 = 1 - tint[1], t2 = 1 - tint[2];
  for (let j = 0; j < H; j++) {
    const gy = by0 + j; if (gy < 0 || gy >= N) continue;
    for (let i = 0; i < W; i++) {
      const gx = bx0 + i; if (gx < 0 || gx >= N) continue;
      const g = gy * N + gx;
      let s = B[j * W + i] * guc * SOLID[g];
      if (alici) s *= alici((gx + 0.5) / O, (gy + 0.5) / O);
      if (s < 0.002) continue;
      const g3 = g * 3;
      FB[g3] *= 1 - s * t0; FB[g3 + 1] *= 1 - s * t1; FB[g3 + 2] *= 1 - s * t2;
    }
  }
}

// ------------------------------------------------------------------ profil (dönel yüzey) tablosu
function profil(fn, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(fn(i / n));
  pts.sort((a, b) => a[0] - b[0]);
  const y0 = pts[0][0], y1 = pts[pts.length - 1][0], st = 0.125;
  const m = Math.ceil((y1 - y0) / st) + 1;
  const R = new Float32Array(m);
  let k = 0;
  for (let i = 0; i < m; i++) {
    const y = y0 + i * st;
    while (k < pts.length - 2 && pts[k + 1][0] < y) k++;
    const a = pts[k], b = pts[k + 1];
    const t = b[0] - a[0] ? clamp((y - a[0]) / (b[0] - a[0])) : 0;
    R[i] = a[1] + (b[1] - a[1]) * t;
  }
  const D = new Float32Array(m);
  for (let i = 0; i < m; i++) { const a = Math.max(0, i - 2), b = Math.min(m - 1, i + 2); D[i] = (R[b] - R[a]) / ((b - a) * st); }
  // tabandan yay uzunluğu (en alt y = y1'den yukarı)
  const SL = new Float32Array(m);
  for (let i = m - 2; i >= 0; i--) SL[i] = SL[i + 1] + Math.hypot(st, R[i + 1] - R[i]);
  const idx = (y) => clamp((y - y0) / st, 0, m - 1);
  const oku = (T, y) => { const f = idx(y), i = Math.floor(f), t = f - i; return i >= m - 1 ? T[m - 1] : T[i] * (1 - t) + T[i + 1] * t; };
  return { y0, y1, r: (y) => oku(R, y), dr: (y) => oku(D, y), s: (y) => oku(SL, y), boy: SL[0] };
}
const kubbeP = profil((t) => [bez(555, 430, 318, 300, t), 560 - bez(360, 358, 440, 560, t)], 400);
const topuzP = profil((t) => [bez(200, 182, 160, 146, t), -bez(-22, -34, -12, 0, t)], 200);

// ------------------------------------------------------------------ yardımcı vektörler
const G = { nx: 0, ny: 0, nz: 1, ao: 1, sh: 1, u: 0, v: 0 };
function nset(x, y, z) { const l = Math.sqrt(x * x + y * y + z * z) || 1; G.nx = x / l; G.ny = y / l; G.nz = z / l; }
// normali teğet yönünde eğ: n += t * s
function negil(tx, ty, tz, s) { nset(G.nx + tx * s, G.ny + ty * s, G.nz + tz * s); }

// ------------------------------------------------------------------ ton eşleme ve çıkış
const SRGB = new Uint8ClampedArray(4097);
for (let i = 0; i <= 4096; i++) { const y = i / 4096; SRGB[i] = Math.round(255 * (y <= 0.0031308 ? 12.92 * y : 1.055 * Math.pow(y, 1 / 2.4) - 0.055)); }
const SRGBF = new Float32Array(4097);
for (let i = 0; i <= 4096; i++) { const y = i / 4096; SRGBF[i] = 255 * (y <= 0.0031308 ? 12.92 * y : 1.055 * Math.pow(y, 1 / 2.4) - 0.055); }
function aces(x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14)); }
function parlama(esik, guc, yaricap) {
  // düşük çözünürlükte parlak alanları bulanıklaştırıp geri ekle
  const k = 4, w = N / k, n = w * w;
  const R = new Float32Array(n), Gc = new Float32Array(n), B = new Float32Array(n);
  for (let y = 0; y < w; y++) for (let x = 0; x < w; x++) {
    let r = 0, g = 0, b = 0;
    for (let j = 0; j < k; j++) for (let i = 0; i < k; i++) { const q = ((y * k + j) * N + x * k + i) * 3; r += FB[q]; g += FB[q + 1]; b += FB[q + 2]; }
    r /= k * k; g /= k * k; b /= k * k;
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const f = Math.max(0, l - esik) / (l + 1e-4);
    R[y * w + x] = r * f; Gc[y * w + x] = g * f; B[y * w + x] = b * f;
  }
  for (const A of [R, Gc, B]) { kutuBulanik(A, w, w, yaricap); kutuBulanik(A, w, w, yaricap); kutuBulanik(A, w, w, yaricap); }
  for (let y = 0; y < N; y++) {
    const fy = (y + 0.5) / k - 0.5, iy = clamp(Math.floor(fy), 0, w - 2), ty = clamp(fy - iy);
    for (let x = 0; x < N; x++) {
      const fx = (x + 0.5) / k - 0.5, ix = clamp(Math.floor(fx), 0, w - 2), tx = clamp(fx - ix);
      const q = iy * w + ix, g3 = (y * N + x) * 3;
      const a = (1 - tx) * (1 - ty), b = tx * (1 - ty), c = (1 - tx) * ty, d = tx * ty;
      FB[g3] += guc * (R[q] * a + R[q + 1] * b + R[q + w] * c + R[q + w + 1] * d);
      FB[g3 + 1] += guc * (Gc[q] * a + Gc[q + 1] * b + Gc[q + w] * c + Gc[q + w + 1] * d);
      FB[g3 + 2] += guc * (B[q] * a + B[q + 1] * b + B[q + w] * c + B[q + w + 1] * d);
    }
  }
}
function cikis(poz, egri) {
  // egri: 'aces' ya da 'yumusak' (1-e^-x)
  const img = ctx.createImageData(N, N);
  const d = img.data;
  const rd = S.rng(4242);
  for (let g = 0; g < N * N; g++) {
    const g3 = g * 3;
    for (let c = 0; c < 3; c++) {
      let x = FB[g3 + c] * poz;
      if (x < 0) x = 0;
      const y = egri === 'yumusak' ? 1 - Math.exp(-x) : aces(x);
      d[g * 4 + c] = SRGBF[(y * 4096) | 0] + (rd() - 0.5);
    }
    d[g * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// ================================================================== SAHNE GEOMETRİSİ (yapı ve bitkiler)
// Her öğe için piksel başına yüzey normali ve yerel koordinatlar G'ye yazılır; renk, stil kancasından gelir:
// stil.kubbe / kasnak / tas / altin / pencere / cerceve / yaprak / sap / tomurcuk / tac / orta
let SOX = 1, SOY = -1;
function isikKur() { SOX = stil.isik[0] / stil.isik[2]; SOY = stil.isik[1] / stil.isik[2]; }

// normali yatay eksen etrafında eğ: s > 0 aşağı, s < 0 yukarı bakar
function egY(s) {
  const c = Math.sqrt(Math.max(0, 1 - s * s));
  const l = Math.hypot(G.nx, G.nz) || 1;
  G.nx = (G.nx / l) * c; G.nz = (G.nz / l) * c; G.ny = s;
}
function bantS(bantlar, Y) {
  for (const b of bantlar) if (Y >= b[0] && Y < b[1]) return b[2] + ((b[3] - b[2]) * (Y - b[0])) / (b[1] - b[0]);
  return 0;
}

const ZIK = S.zikzakCizgileri();

    const t = clamp(((X - ax) * vx + (Y - ay) * vy) / (vx * vx + vy * vy));
    const qx = ax + vx * t, qy = ay + vy * t;
    const d = Math.hypot(X - qx, Y - qy);

}

function cikmaCiz(yTop, yBot, rTop, rBot, parca) {

function korkulukCiz(x1, x2, y1, y2, rCekirdek, parca) {

function bbNok(pts, p) {

// varsayılan taç yaprağı: ters yumurta biçimi, hafif asimetrik (çark gibi bindirme)

    `C${f(P(Lp * 0.94, wa * 0.94))} ${f(P(Lp * 1.04, wa * 0.42))} ${f(tip1)} ` +
    `C${f(P(Lp * 1.04, -wb * 0.42))} ${f(P(Lp * 0.94, -wb * 0.94))} ${f(P(Lp * 0.68, -wb))} ` +
    `C${f(P(Lp * 0.4, -wb * 1.04))} ${f(P(Lp * 0.2, -wb * 0.5))} ${f(P(Lp * 0.04, 0))} Z`;

  sisir(L, kalin / 2, 1);

// Fotogerçekçi mimari render: gün ışığı (sağ üstten güneş), gök kubbesinden yumuşak dolgu ve sıcak

// metal altın alemler, gerçekçi kümülüs bulutlu gök, traverten meydan ve peyzaj çiçekleri (frangipani).
const LV = nrm([0.6, -0.62, 0.5]);

const GOK_A = [0.34, 0.45, 0.72];
const YER_A = [0.36, 0.3, 0.22];

function gokRenk(up) {

  out[2] = al[2] * (GUNES[2] * dif + ab + tr * GUNES[2]) * kd + fr * (eb * aoS + GUNES[2] * sp);

function metal(F, rough, out) {

  const cz = Math.max(0, nz);

  const ry = 2 * nz * ny;
  const e = gokRenk(-ry);

  const shin = 2 / (rough * rough + 0.0005) - 2;

// ------------------------------------------------------------------ malzemeler
const TAS = lin('#E9E1D0'), TAS_SICAK = lin('#E6D7BC');

}
const _al = [0, 0, 0];
stil.tas = function (X, Y, out, parca) {
  let d = tasDoku(X, Y);
  let al = TAS;
  if (parca === 'kaide') {
    // kesme taş örgüsü: 16 px sıra, şaşırtmalı derzler
    const sira = Math.floor((Y - 704) / 16), fy = (Y - 704) / 16 - sira;
    const bl = 58, off = (sira & 1) * bl * 0.5;

    const dz = Math.min(dy, dx);
    const j = smooth(0.95, 0.3, dz);

    d *= 1 + (ihash(sira, Math.floor((X - 300 + off) / bl), 9) - 0.5) * 0.05;
  }

  if (parca === 'kaideCerceve' || parca === 'kornis') al = TAS_SICAK;
  if (parca === 'korkuluk-ic' || parca === 'korkuluk-arka') d *= 0.85;
  _al[0] = al[0] * d; _al[1] = al[1] * d; _al[2] = al[2] * d;
  pbr(_al, 0.03, 0.62, out, { wrap: 0.08 });

};
function karoYuzey() {

  const th = 6.4;
  const row = Math.floor(G.yay / th), fy = G.yay / th - row;

  const yan = smooth(0.9, 0.99, Math.abs(Math.sin(ph * Math.PI))) * smooth(0.12, 0.35, Math.abs(v)) * smooth(0.9, 0.5, Math.abs(v)) * 0.22;
  const dm = Math.max(ort, yan);
  _al[0] = mix(_al[0], DAMAR[0], dm * 0.55); _al[1] = mix(_al[1], DAMAR[1], dm * 0.55); _al[2] = mix(_al[2], DAMAR[2], dm * 0.55);
  pbr(_al, 0.05, 0.26, out, { wrap: 0.2, trans: 0.05 });
};
stil.tomurcuk = function (X, Y, out, t) {
  const b = G.bt;
  const g = smooth(-0.1, -0.6, b);
  _al[0] = mix(mix(TAC[0], PEMBE[0], 0.5), YAP2[0], g); _al[1] = mix(mix(TAC[1], PEMBE[1], 0.5), YAP2[1], g); _al[2] = mix(mix(TAC[2], PEMBE[2], 0.5), YAP2[2], g);
  pbr(_al, 0.04, 0.4, out, { wrap: 0.35, trans: 0.06 });
};
stil.tacYolu = (c, i) => tacYolu(c, i, { asim: 0.24, en: 0.84, boy: 1.06 });
stil.tac = function (X, Y, out, c, p) {
  const r = G.rho;

  const pk = smooth(0.7, 1.05, r) * 0.25;
  _al[0] = mix(mix(TAC[0], PEMBE[0], pk), SARI[0], y); _al[1] = mix(mix(TAC[1], PEMBE[1], pk), SARI[1], y); _al[2] = mix(mix(TAC[2], PEMBE[2], pk), SARI[2], y);
  // taç yaprağın ince boyuna damarları
  const dm = 1 - 0.035 * smooth(0.6, 1, Math.abs(Math.sin(G.pv * 60))) * smooth(0.2, 0.6, r);
  _al[0] *= dm; _al[1] *= dm; _al[2] *= dm;
  G.ao *= 0.8 + 0.2 * smooth(0.05, 0.4, r);

};
stil.orta = function (c) {
  const r = c.r * 0.13;
  const L = katman([c.x - r, c.y - r, c.x + r, c.y + r], (m) => { m.beginPath(); m.arc(c.x, c.y, r, 0, 7); m.fill(); }, 1);
  bas(L, (X, Y, k, out) => {

// ------------------------------------------------------------------ gök ve bulutlar
const BULUTLAR = [[178, 248, 300, 110, 1], [505, 146, 240, 80, 2], [775, 330, 320, 112, 3], [950, 470, 200, 66, 4], [84, 468, 210, 70, 5]];
let BB = null;
function bulutYog(X, Y) {
  let best = -9;
  for (const b of BULUTLAR) {
    const dx = (X - b[0]) / (b[2] / 2);
    let dy = (Y - b[1]) / (b[3] / 2);
    if (dy > 0) dy *= 1.9;
    const e = 1 - dx * dx - dy * dy;
    if (e > best) { best = e; BB = b; }
  }
  if (best < -0.9) return -1;
  const n = fbm(X / 52, Y / 34, 5, 0.52);
  return best * 0.9 + n * 0.9 - 0.18;
}
function gokCiz() {
  const SUN = [1.0, 0.92, 0.78];
  tumu(0, 820, (X, Y, out) => {
    const t = clamp(Y / 795);
    const k = Math.pow(t, 1.35);
    let r = mix(ZENIT[0], UFUK[0], k), g = mix(ZENIT[1], UFUK[1], k), b = mix(ZENIT[2], UFUK[2], k);
    // ufukta sıcak pus
    const pz = smooth(0.8, 1, t) * 0.25;
    r += pz * 0.2; g += pz * 0.12;
    const dx = X - 880, dy = Y - 140, d = Math.sqrt(dx * dx + dy * dy);
    const gl = 1.5 * Math.exp(-d / 55) + 0.55 * Math.exp(-d / 200) + 0.18 * Math.exp(-d / 520);
    r += SUN[0] * gl; g += SUN[1] * gl; b += SUN[2] * gl * 0.9;
    const core = smooth(30, 22, d) * 5;
    r += core; g += core * 0.97; b += core * 0.9;
    // bulutlar
    const dn = bulutYog(X, Y);
    if (dn > -0.05) {
      const a = smooth(-0.02, 0.5, dn);
      if (a > 0) {
        const dn2 = bulutYog(X + 6 * 0.77, Y - 6 * 0.64);
        const lit = clamp(0.55 + (dn - dn2) * 4.5);
        const derin = smooth(0.2, 1.1, dn);
        const alt = smooth(-0.3, 0.7, (Y - BB[1]) / (BB[3] / 2));
        const golg = clamp(clamp(1 - lit) * (0.5 + 0.4 * derin) + alt * 0.45 - (1 - alt) * 0.1);
        const cr = mix(1.75, 0.82, golg), cg = mix(1.7, 0.9, golg), cb = mix(1.6, 1.1, golg);
        // güneşe yakın bulut kenarlarında sıcak parıltı
        const sg = Math.exp(-d / 260) * 0.35 * lit;
        r = mix(r, cr + sg, a); g = mix(g, cg + sg * 0.92, a); b = mix(b, cb + sg * 0.75, a);
      }
    }
    out[0] = r; out[1] = g; out[2] = b;
  }, 0);
}
// traverten meydan: kaçış noktası ufukta, derzli büyük levhalar
function zeminCiz() {
  const VY = 786, F = 610, T = 0.52;
  const ZT = lin('#DCCBAE'), ZT2 = lin('#CDB896'), DERZ = lin('#A08B6C');
  tumu(791, 1024, (X, Y, out) => {
    const dy = Y - VY;
    const xw = (X - 560) / dy / T;
    const zw = F / dy / T;
    const row = Math.floor(zw), fz = zw - row;
    const xs = xw + (row & 1) * 0.5;
    const col = Math.floor(xs), fx = xs - col;
    const dxp = Math.min(fx, 1 - fx) * T * dy;
    const dzp = Math.min(fz, 1 - fz) * T * dy * dy / F;
    const w = 0.35 + 0.55 * dy / 238;
    const vis = smooth(796, 840, Y);
    const j = smooth(w, w * 0.25, Math.min(dxp, dzp)) * vis;
    const h = ihash(row, col, 11);
    const m = 0.15 + 0.75 * h + 0.25 * fbm(xw * 2.5, zw * 2.5, 3);
    let ar = mix(ZT[0], ZT2[0], m), ag = mix(ZT[1], ZT2[1], m), ab = mix(ZT[2], ZT2[2], m);
    ar = mix(ar, DERZ[0], j); ag = mix(ag, DERZ[1], j); ab = mix(ab, DERZ[2], j);
    // yere bakan yüzey: güneş + gök dolgusu, yakında hafif parlak yansıma
    const ndl = -LV[1];
    let sh = 1;
    // yapının dibindeki temas gölgesi ve sola uzanan yumuşak gölge
    if (X > 258 && X < 840) {
      const dib = Math.exp(-(Y - 800) / 4.5) * smooth(258, 300, X) * smooth(840, 818, X);
      const sol = smooth(320, 286, X) * smooth(225, 268, X) * Math.exp(-(Y - 800) / 12);
      sh *= 1 - 0.6 * clamp(dib + sol);
    }
    const yk = 0.05 * (1 - j) * smooth(1024, 840, Y);
    const r = ar * (GUNES[0] * ndl * sh + GOK_A[0] * 0.95) + yk * UFUK[0], g = ag * (GUNES[1] * ndl * sh + GOK_A[1] * 0.95) + yk * UFUK[1], b = ab * (GUNES[2] * ndl * sh + GOK_A[2] * 0.95) + yk * UFUK[2] * 1.1;
    const pus = smooth(830, 791, Y) * 0.55;
    out[0] = mix(r, UFUK[0] * 1.1, pus); out[1] = mix(g, UFUK[1] * 1.08, pus); out[2] = mix(b, UFUK[2] * 1.02, pus);
    out[3] = smooth(791, 795, Y);
  }, 1);
}

gokCiz();
