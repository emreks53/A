<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-203 Ham Keten Üzerine İnce Yağlıboya — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// ===================================================================== j1 yağlıboya motoru
// Ortak yardımcılar: sahne geometrisinin elle çizilmiş (titrek) yolları, ışık modeli (kubbe dönel yüzey,
// silindir kasnak ve minare), fırça darbesi (gövde, kıllar, kuru uç, boya yükü), boya kabartısı ve tuval /
// keten dokusu. Görünen el izi her üslubun kendi bölümünde çizilir.
const M = (function () {
  'use strict';
  const S = SAHNE;
  const N = 2048; // iç çözünürlük (1024 koordinat × 2)
  const W = 1024;
  const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const yum = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const C = (x) => (typeof x === 'string' ? hex(x) : x);
  const kar = (a, b, t) => { a = C(a); b = C(b); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
  const css = (c, a) => {
    const r = Math.max(0, Math.min(255, c[0] | 0)), g = Math.max(0, Math.min(255, c[1] | 0)), b = Math.max(0, Math.min(255, c[2] | 0));
    return a === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a < 0 ? 0 : a > 1 ? 1 : a})`;
  };
  const acik = (c, k) => [c[0] + (255 - c[0]) * k, c[1] + (255 - c[1]) * k, c[2] + (255 - c[2]) * k];
  const koyu = (c, k) => [c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k)];
  function rampa(dur) {
    const d = dur.map(([t, c]) => [t, C(c)]);
    return function (t) {
      if (t <= d[0][0]) return d[0][1].slice();
      for (let i = 1; i < d.length; i++) if (t <= d[i][0]) return kar(d[i - 1][1], d[i][1], (t - d[i - 1][0]) / (d[i][0] - d[i - 1][0]));
      return d[d.length - 1][1].slice();
    };
  }
  const norm = (v) => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
  const nokta = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  let L = norm([0.45, 0.55, 0.7]); // ışık: sağ üst önden (x sağa, y yukarı, z bakana)
  function isikKur(v) { L = norm(v); }

  function gurultu(tohum) {
    const r = S.rng(tohum), Mm = 256, T = new Float32Array(Mm * Mm);
    for (let i = 0; i < Mm * Mm; i++) T[i] = r();
    const n = function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * Mm + x0], b = T[y0 * Mm + x1], c = T[y1 * Mm + x0], d = T[y1 * Mm + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    n.fbm = function (x, y, o) {
      let s = 0, a = 0.5, t = 0;
      for (let i = 0; i < (o || 3); i++) { s += a * n(x, y); t += a; const nx = x * 1.7 - y * 1.1, ny = x * 1.1 + y * 1.7; x = nx + 31.7; y = ny + 11.3; a *= 0.5; }
      return s / t;
    };
    return n;
  }

  // ------------------------------------------------------------ tuvaller
  function anaTuval(el) {
    el.width = N; el.height = N;
    const g = el.getContext('2d', { willReadFrequently: true });
    g.setTransform(2, 0, 0, 2, 0, 0);
    return g;
  }
  function katman(w, h) {
    const c = S.yeniTuval(w || N, h || N);
    const g = c.getContext('2d', { willReadFrequently: true });
    if (!w) g.setTransform(2, 0, 0, 2, 0, 0);
    return [c, g];
  }

  // ------------------------------------------------------------ geometri: nokta dizileri
  function kub(p0, p1, p2, p3, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  }
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
  function kemer(x, y, w, h, n) {
    n = n || 10;
    const l = x - w / 2, r = x + w / 2, b = y + h, s = y + Math.min(h, w * 0.62);
    const a = kub([l, s], [l, s - w * 0.42], [x - w * 0.14, y + w * 0.1], [x, y], n);
    const c = kub([x, y], [x + w * 0.14, y + w * 0.1], [r, s - w * 0.42], [r, s], n);
    return [[l, b]].concat(a, c.slice(1), [[r, b]]);
  }
  function elips(cx, cy, rx, ry, aci, n) {
    n = n || 36; aci = aci || 0;
    const ca = Math.cos(aci), sa = Math.sin(aci), out = [];
    for (let i = 0; i < n; i++) { const t = (i / n) * Math.PI * 2, u = Math.cos(t) * rx, v = Math.sin(t) * ry; out.push([cx + u * ca - v * sa, cy + u * sa + v * ca]); }
    return out;
  }
  function hilal(cx, cy, R, n) {
    n = n || 24;
    const r2 = R * 0.85, d = R * 0.4;
    const yk = (r2 * r2 - R * R - d * d) / (2 * d), xk = Math.sqrt(Math.max(0, R * R - yk * yk));
    const out = [];
    const tL = Math.atan2(yk, -xk) + Math.PI * 2, tR = Math.atan2(yk, xk);
    for (let i = 0; i <= n; i++) { const t = tL + (tR - tL) * (i / n); out.push([cx + Math.cos(t) * R, cy + Math.sin(t) * R]); }
    const pR = Math.atan2(yk + d, xk), pL = Math.atan2(yk + d, -xk) + Math.PI * 2;
    for (let i = 1; i < n; i++) { const t = pR + (pL - pR) * (i / n); out.push([cx + Math.cos(t) * r2, cy - d + Math.sin(t) * r2]); }
    return out;
  }
  function kubbePts() { const p = S.kubbeNoktalari(90); return p; }
  function topuzPts(c) {
    c = c || 300;
    const a = kub([c - 22, 200], [c - 34, 182], [c - 12, 160], [c, 146], 16);
    const b = kub([c, 146], [c + 12, 160], [c + 34, 182], [c + 22, 200], 16);
    return a.concat(b.slice(1));
  }

  /** Kenarları elle çizilmiş gibi hafifçe dalgalandırır: kenarları `adim` aralıkla böler, düşük frekanslı gürültüyle iter. */
  function titrek(pts, kapali, genlik, tohum, adim) {
    adim = adim || 5; genlik = genlik === undefined ? 0.7 : genlik;
    const nz = gurultu(tohum || 11);
    const out = [];
    const n = pts.length, son = kapali ? n : n - 1;
    let s = 0;
    for (let i = 0; i < son; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const L0 = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const k = Math.max(1, Math.ceil(L0 / adim));
      const nx = L0 ? -(b[1] - a[1]) / L0 : 0, ny = L0 ? (b[0] - a[0]) / L0 : 0;
      for (let j = 0; j < k; j++) {
        const t = j / k;
        const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
        const d = (nz.fbm(s * 0.045, 3.1, 2) - 0.5) * 2 * genlik + (nz((s + 7) * 0.4, 9.7) - 0.5) * genlik * 0.5;
        out.push([x + nx * d, y + ny * d]);
        s += L0 / k;
      }
    }
    if (!kapali) out.push(pts[n - 1]);
    return out;
  }
  function yolYap(pts, kapali) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (kapali !== false) p.closePath();
    return p;
  }
  const elYolu = (pts, genlik, tohum, adim) => yolYap(titrek(pts, true, genlik, tohum, adim), true);

  /** Maske: 1024² Uint8Array (yolun içi 1). */
  function maske(yollar) {
    const [c, g] = katman(W, W);
    g.fillStyle = '#fff';
    for (const y of [].concat(yollar)) g.fill(typeof y === 'string' ? new Path2D(y) : y);
    const d = g.getImageData(0, 0, W, W).data, m = new Uint8Array(W * W);
    for (let i = 0; i < W * W; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    m.icinde = (x, y) => { const xi = x | 0, yi = y | 0; return xi >= 0 && yi >= 0 && xi < W && yi < W && m[yi * W + xi] === 1; };
    return m;
  }

  // ------------------------------------------------------------ sahne parçaları
  const P = (function () {
    const o = {};
    o.kubbe = kubbePts();
    o.kasnak = S.kasnak.map((k, i) => ({ ...k, pts: dikd(k.x1, k.y1, k.x2, k.y2), pen: S.kasnakPencereleri(i).map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) })) }));
    const K = S.kaide;
    o.kaide = { ...K, pts: dikd(K.x1, K.y1, K.x2, K.y2), kornisPts: dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), pen: K.pencereler.map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) })) };
    o.minare = S.minareParcalari().map((p) => {
      const q = { ...p };
      if (p.tip === 'poligon') q.pts = p.noktalar;
      else if (p.tip === 'korkuluk' || p.tip === 'bant') q.pts = dikd(p.x1, p.y1, p.x2, p.y2);
      else if (p.tip === 'topuz') q.pts = topuzPts(300);
      return q;
    });
    o.minarePen = S.minarePencereleri.map((p) => ({ ...p, pts: kemer(p.x, p.y, p.w, p.h) }));
    o.zikzak = S.zikzakCizgileri();
    o.alem = S.alemParcalari(560, 300, 1);
    o.minareAlem = S.alemParcalari(300, 146, 0.62);
    return o;
  })();

  /** Sahnenin mimari silueti (gökten ayırmak için). */
  function siluetYolu(genlik) {
    const p = new Path2D();
    genlik = genlik || 0;
    p.addPath(yolYap(P.kubbe));
    for (const k of P.kasnak) p.addPath(yolYap(k.pts));
    p.addPath(yolYap(P.kaide.pts)); p.addPath(yolYap(P.kaide.kornisPts));
    for (const m of P.minare) if (m.pts) p.addPath(yolYap(m.pts));
    return p;
  }

  // ------------------------------------------------------------ kubbe profili ve normaller
  const KP = (function () {
    const p = S.kubbeProfili(2000);
    const adim = 0.25, y0 = 299, n = Math.ceil((556 - y0) / adim) + 1;
    const R = new Float32Array(n), SL = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const y = y0 + i * adim;
      if (y <= 300) { R[i] = 0; SL[i] = -10; continue; }
      if (y >= 555) { R[i] = 200; SL[i] = 0; continue; }
      while (j < p.length - 2 && p[j + 1].y > y) j++;
      while (j > 0 && p[j].y < y) j--;
      const a = p[j], b = p[j + 1];
      const t = (a.y - y) / (a.y - b.y || 1);
      R[i] = a.r + (b.r - a.r) * t;
      SL[i] = (b.r - a.r) / (a.y - b.y || 1e-6);
    }
    return {
      r(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return R[i]; },
      s(y) { const i = Math.max(0, Math.min(n - 1, Math.round((y - y0) / adim))); return SL[i]; },
    };
  })();

  /** Kubbe yüzey normali; t: dilim içindeki konum (0..1), u: -1..1 yatay konum. */
  function kubbeNormal(x, y, dilim) {
    let r = KP.r(y);
    if (r < 0.5) r = 0.5;
    let u = (x - 560) / r;
    if (u > 0.999) u = 0.999; else if (u < -0.999) u = -0.999;
    const fi = Math.asin(u);
    const s = KP.s(Math.max(301, y));
    const m = Math.hypot(1, s);
    const nr = 1 / m, nh = -s / m;
    const D = Math.PI / 16;
    let t = ((fi + Math.PI / 2) / D) % 1;
    if (t < 0) t += 1;
    const tau = (dilim || 0) * Math.cos(Math.PI * t);
    const f2 = fi + tau;
    return { n: [nr * Math.sin(f2), nh, nr * Math.cos(f2)], u, fi, t };
  }
  /** Kubbe meridyeninin ekrandaki yönü (aşağıdan yukarı). */
  function meridyen(x, y) {
    const rr = Math.max(4, KP.r(y)), u = Math.max(-1, Math.min(1, (x - 560) / rr)), s = KP.s(Math.max(301, y));
    return Math.atan2(-1, u * s);
  }
  /** Silindir normali. */
  function silindir(x, cx, R) { let u = (x - cx) / R; if (u > 0.999) u = 0.999; else if (u < -0.999) u = -0.999; return [u, 0, Math.sqrt(1 - u * u)]; }
  const dif = (n) => nokta(n, L);

  // ------------------------------------------------------------ fırça darbesi
  let YUK = null; // boya kalınlığı (kabartma) tuvali: [canvas, ctx]
  function yukKur() { YUK = katman(); YUK[1].fillStyle = '#000'; YUK[1].fillRect(0, 0, W, W); return YUK; }

  /**
   * Bir fırça darbesi. P: merkez çizgisi noktaları, w: en (1024 px), c: [r,g,b]
   * o: { a: örtücülük, govde: gövdenin payı, kil: kıl sayısı, kilK: kıl açık-koyu farkı, kilA: kıl örtücülüğü,
   *      uc: 'sivri' | 'kare' | 'yuvarlak', bas: başlangıç eni payı, yuk: boya yükü (düşük → kuru, kırık uç),
   *      kenar: kenar pürüzü, hk: kabartma (0 = yok), r: rng, ton: kıllarda karışan ikinci renk }
   */
  function darbe(g, P0, w, c, o) {
    o = o || {};
    const r = o.r || RR;
    const a = o.a === undefined ? 1 : o.a;
    // yeniden örnekleme
    const cum = [0];
    for (let i = 1; i < P0.length; i++) cum.push(cum[i - 1] + Math.hypot(P0[i][0] - P0[i - 1][0], P0[i][1] - P0[i - 1][1]));
    const Lt = Math.max(0.6, cum[cum.length - 1]);
    const adim = Math.max(0.8, Math.min(4, w * 0.3));
    const n = Math.max(3, Math.ceil(Lt / adim) + 1);
    const Q = [], T = [];
    let j = 0;
    for (let k = 0; k < n; k++) {
      const s = (k / (n - 1)) * Lt;
      while (j < cum.length - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j] || 1, f = Math.min(1, Math.max(0, (s - cum[j]) / seg));
      const A = P0[j], B = P0[Math.min(j + 1, P0.length - 1)];
      Q.push([A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f]);
    }
    for (let k = 0; k < n; k++) {
      const A = Q[Math.max(0, k - 1)], B = Q[Math.min(n - 1, k + 1)];
      const dx = B[0] - A[0], dy = B[1] - A[1], m = Math.hypot(dx, dy) || 1;
      T.push([-dy / m, dx / m]);
    }
    const uc = o.uc || 'sivri', bas = o.bas === undefined ? 0.75 : o.bas;
    const prof = (t) => {
      let s = bas + (1 - bas) * yum(0, 0.2, t);
      if (uc === 'sivri') s *= 1 - 0.8 * yum(0.55, 1, t);
      else if (uc === 'kare') s *= 1 - 0.1 * yum(0.85, 1, t);
      else if (uc === 'yuvarlak') { const e = Math.abs(t - 0.5) * 2; s *= Math.sqrt(sat(1 - Math.pow(e, 6))) * 0.85 + 0.15; }
      else if (uc === 'damla') s = (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, t * 1.25 + 0.05)));
      return s;
    };
    const kn = o.kenar === undefined ? 0.1 : o.kenar;
    // kenar pürüzü: düzleştirilmiş rastgele yürüyüş
    const sol = [], sag = [];
    let e1 = 0, e2 = 0;
    for (let k = 0; k < n; k++) {
      e1 = e1 * 0.7 + (r() - 0.5) * kn * 1.2; e2 = e2 * 0.7 + (r() - 0.5) * kn * 1.2;
      const t = k / (n - 1), hw = (w / 2) * prof(t);
      sol.push([Q[k][0] + T[k][0] * hw * (1 + e1), Q[k][1] + T[k][1] * hw * (1 + e1)]);
      sag.push([Q[k][0] - T[k][0] * hw * (1 + e2), Q[k][1] - T[k][1] * hw * (1 + e2)]);
    }
    const govde = o.govde === undefined ? 0.85 : o.govde;
    const gs = o.govdeSon === undefined ? (uc === 'sivri' ? 0.8 : 1) : o.govdeSon;
    if (govde > 0) {
      const poli = (k0, k1, al) => {
        g.fillStyle = css(c, al);
        g.beginPath();
        g.moveTo(sol[k0][0], sol[k0][1]);
        for (let k = k0 + 1; k <= k1; k++) g.lineTo(sol[k][0], sol[k][1]);
        for (let k = k1; k >= k0; k--) g.lineTo(sag[k][0], sag[k][1]);
        g.closePath();
        g.fill();
      };
      const kS = Math.max(1, Math.min(n - 1, Math.round(gs * (n - 1))));
      poli(0, kS, a * govde);
      if (kS < n - 1) poli(kS, n - 1, a * govde * 0.35);
    }
    // kıllar
    const kil = o.kil === undefined ? Math.max(2, Math.min(12, Math.round(w / 1.4))) : o.kil;
    const kilK = o.kilK === undefined ? 14 : o.kilK;
    const yk = o.yuk === undefined ? 0.8 : o.yuk;
    const kilA = o.kilA === undefined ? 0.55 : o.kilA;
    const kilUc = [];
    if (kil > 0) {
      g.lineCap = 'round'; g.lineJoin = 'round';
      const lw = Math.max(0.35, (w / kil) * (o.kilEn || 1.1));
      for (let k = 0; k < kil; k++) {
        const v = ((k + 0.5) / kil - 0.5) * 0.94 + (r() - 0.5) * 0.06;
        const d = (r() - 0.5) * 2 * kilK;
        let cc = [c[0] + d, c[1] + d, c[2] + d];
        if (o.ton && r() < (o.tonOran || 0.3)) cc = kar(cc, o.ton, 0.35 + r() * 0.4);
        const t0 = r() * 0.08, t1 = Math.min(1, 1 - (1 - yk) * (0.15 + r() * 0.8) - r() * 0.04);
        kilUc.push([v, t1]);
        g.strokeStyle = css(cc, a * kilA * (0.55 + r() * 0.6));
        g.lineWidth = lw * (0.7 + r() * 0.6);
        g.beginPath();
        const k0 = Math.floor(t0 * (n - 1)), k1 = Math.max(k0 + 1, Math.floor(t1 * (n - 1)));
        for (let q = k0; q <= k1; q++) {
          const t = q / (n - 1), hw = w * prof(t);
          const X = Q[q][0] + T[q][0] * v * hw, Y = Q[q][1] + T[q][1] * v * hw;
          if (q === k0) g.moveTo(X, Y); else g.lineTo(X, Y);
        }
        g.stroke();
      }
    }
    // kabartma
    const hk = o.hk || 0;
    if (hk > 0 && YUK) {
      const h = YUK[1];
      const base = 40 + hk * 120 * (0.85 + r() * 0.3);
      h.fillStyle = css([base, base, base], 0.9);
      h.beginPath();
      h.moveTo(sol[0][0], sol[0][1]);
      for (let k = 1; k < n; k++) h.lineTo(sol[k][0], sol[k][1]);
      for (let k = n - 1; k >= 0; k--) h.lineTo(sag[k][0], sag[k][1]);
      h.closePath();
      h.fill();
      // kenar sırtları (boya kenara itilir)
      h.lineCap = 'round';
      h.lineWidth = Math.max(0.5, w * 0.1);
      h.strokeStyle = css([base + 40 * hk, base + 40 * hk, base + 40 * hk], 0.7);
      for (const kenar of [sol, sag]) { h.beginPath(); kenar.forEach(([x, y], i) => (i ? h.lineTo(x, y) : h.moveTo(x, y))); h.stroke(); }
      // kıl olukları
      const ol = Math.max(2, Math.min(7, Math.round(w / 2.2)));

  const KETEN = S.yeniTuval(N, N);
  KETEN.getContext('2d').drawImage(g.canvas, 0, 0);
  // boya iplik aralarına da biraz iner: delikler koyu boyalı yerlerde ızgara gibi açık nokta bırakmasın
  for (let i = 0; i < N * N; i++) D[i] = 0.2 + 0.8 * D[i];

  // ------------------------------------------------------------ ovalama (scumble): boya dokunun tepelerine takılır
  const [LC, LG] = M.katman();
  /** ciz(k) ile katmana boyar; katmanı dokuya göre bindirir. o.basinc: boyanın ne kadar derine indiği (0..1.2) */
  function ovala(ciz, o) {
    o = o || {};
    LG.save(); LG.setTransform(1, 0, 0, 1, 0, 0); LG.clearRect(0, 0, N, N); LG.restore();
    ciz(LG);
    const L = LG.getImageData(0, 0, N, N).data;
    const im = g.getImageData(0, 0, N, N), d = im.data;
    const bas = o.basinc === undefined ? 0.9 : o.basinc, yum2 = o.yumusak || 0.3;
    for (let i = 0; i < N * N; i++) {
      const la = L[i * 4 + 3];
      if (la === 0) continue;
      const a0 = la / 255;
      const T = 1 - a0 * bas * (0.8 + 0.4 * ON[i]);
      const a = sat((D[i] - T) / yum2) * Math.min(1, a0 * 1.15);
      if (a <= 0) continue;
      const j = i * 4;
      d[j] += (L[j] - d[j]) * a; d[j + 1] += (L[j + 1] - d[j + 1]) * a; d[j + 2] += (L[j + 2] - d[j + 2]) * a;
    }
    g.putImageData(im, 0, 0);
  }

  // ------------------------------------------------------------ elle çizilmiş yollar
  const tY = (pts, k, a) => M.elYolu(pts, a === undefined ? 0.6 : a, 1300 + k, 6);
  const kubbeY = tY(P.kubbe, 1, 0.7);
  const kasnakY = P.kasnak.map((k, i) => tY(k.pts, 10 + i));
  const kaideY = tY(P.kaide.pts, 20);
  const kornisY = tY(P.kaide.kornisPts, 21, 0.4);
  const minY = P.minare.map((m, i) => (m.pts ? tY(m.pts, 30 + i, 0.45) : null));
  const siluet = new Path2D();
  [kubbeY, ...kasnakY, kaideY, kornisY, ...minY.filter(Boolean)].forEach((p) => siluet.addPath(p));
  const mask = (p) => M.maske(p).icinde;
  const silMsk = mask(siluet);
  const disari = new Path2D(); disari.rect(-10, -10, 1044, 1044); disari.addPath(siluet);
  const kirp = (k, yol, kural, f) => { k.save(); k.clip(yol, kural || 'nonzero'); f(); k.restore(); };

  // fırça: sert kıl, kuru, çizgili
  const KURU = { a: 0.9, govde: 0.55, kil: 12, kilK: 22, kilA: 0.75, yuk: 0.5, uc: 'kare', bas: 0.9, kenar: 0.18 };
  const kuru = (ek) => Object.assign({}, KURU, ek || {});
  const oynat = (c, r, k) => { const j = (r() - 0.5) * k; return [c[0] + j, c[1] + j, c[2] + j * 0.8]; };

  // ------------------------------------------------------------ 1. gök: yatay ovalanmış serülyen ve beyaz
  const gunes = S.gunes;
  const gokT = (x, y) => sat(y / 770 + (nz(x * 0.003, y * 0.004) - 0.5) * 0.14);
  const gokR = rampa([[0, '#80B4DE'], [0.4, '#95C3E7'], [0.75, '#B4D5EE'], [1, '#CFE3EF']]);
  const gokR2 = rampa([[0, '#6AA3D6'], [0.35, '#80B5E0'], [0.7, '#A6CCEB'], [1, '#D2E6F1']]);
  const gYak = (x, y) => Math.pow(sat(1 - Math.hypot(x - gunes.x, y - gunes.y) / 270), 1.5);
  const gokKutu = [-60, -20, 1080, 800];
  // 0) ilk ovalama: çok ince, soluk serülyen yalnız iplik tepelerine takılır; sonraki katların arasında kalan
  //    keten böylece düz bej leke değil, mavi ile keten arası bir doku olarak okunur
  ovala((k) => kirp(k, disari, 'evenodd', () => M.alan(k, { kutu: gokKutu, aralik: 40, dikeyOran: 0.55, boy: [120, 240], en: [22, 32], yon: (x, y, r) => (r() - 0.5) * 0.04, renk: (x, y, r) => oynat(acik(gokR(gokT(x, y)), 0.2), r, 6), darbe: kuru({ a: 0.85, govde: 0.6, yuk: 0.55, uc: 'kare', bas: 0.8 }), tohum: 1 })), { basinc: 0.6, yumusak: 0.3 });
  // a) alt kat: geniş, kuru yatay darbelerle bütün göğe ince serülyen (dokunun çukurlarında keten kalır)
  ovala((k) => kirp(k, disari, 'evenodd', () => M.alan(k, { kutu: gokKutu, aralik: 46, dikeyOran: 0.6, boy: [110, 230], en: [18, 28], yon: (x, y, r) => (r() - 0.5) * 0.05, renk: (x, y, r) => oynat(kar(gokR(gokT(x, y) + (r() - 0.5) * 0.12), '#EEF3EC', gYak(x, y) * 0.75), r, 8), egri: 0.05, darbe: kuru({ a: 0.92, govde: 0.55, yuk: 0.42, uc: 'sivri', bas: 0.7, govdeSon: 0.7, kenar: 0.24 }), tohum: 2 })), { basinc: 0.9, yumusak: 0.36 });
  // b) seçik darbeler: komşusundan açık ya da koyu, hafif yeşile ya da mora kayan serülyenler; kuru uçlar
  ovala((k) => kirp(k, disari, 'evenodd', () => M.alan(k, { kutu: gokKutu, aralik: 44, dikeyOran: 0.75, boy: [55, 150], en: [12, 22], yon: (x, y, r) => (r() - 0.5) * 0.12, renk: (x, y, r) => {
    let c = gokR2(gokT(x, y) + (r() - 0.5) * 0.34);
    const h = r();
    if (h < 0.18) c = kar(c, '#9CD2D8', 0.3); else if (h < 0.3) c = kar(c, '#AEB9E6', 0.28);
    return oynat(kar(c, '#F1F4EE', gYak(x, y) * 0.8), r, 6);
  }, egri: 0.14, darbe: kuru({ a: 0.92, govde: 0.62, yuk: 0.38, uc: 'sivri', bas: 0.65, govdeSon: 0.7, kenar: 0.22 }), tohum: 3 })), { basinc: 1.0, yumusak: 0.34 });
  // c) kuru beyaz ovalama: yalnız iplik tepelerine takılır (ufka doğru sıklaşır)
  ovala((k) => kirp(k, disari, 'evenodd', () => M.alan(k, { kutu: gokKutu, aralik: 34, boy: [70, 170], en: [16, 26], yon: (x, y, r) => (r() - 0.5) * 0.08, icinde: (x, y) => R() < 0.03 + 0.5 * sat((y - 280) / 480), renk: (x, y, r) => oynat(kar(C('#E4EDF0'), C('#CFE2EE'), r()), r, 6), egri: 0.1, darbe: kuru({ a: 0.75, govde: 0.4, yuk: 0.3, uc: 'sivri', bas: 0.6 }), tohum: 4 })), { basinc: 0.72, yumusak: 0.3 });
  // güneş: ovalanmış soluk sarı-beyaz disk; halka yok, kenarı ovalamanın kendi düzensizliği
  // disk: elle dairesel sürülmüş, kenarı yumuşak dalgalı (tam daire değil, topak da değil)
  const gunR = (x, y) => { const t = Math.atan2(y - gunes.y, x - gunes.x); return 29 + 1.6 * Math.sin(2 * t + 0.7) + 1.1 * Math.sin(3 * t + 2.1) + 0.6 * Math.sin(5 * t + 4.0); };
  const gunIc = (x, y) => Math.hypot(x - gunes.x, y - gunes.y) < gunR(x, y);
  // çevresinde göğü açan kuru, beyazımsı kısa ovalama (ışıltı fırçayla; bulanıklık yok)
  ovala((k) => kirp(k, disari, 'evenodd', () => M.alan(k, { kutu: [gunes.x - 110, gunes.y - 90, gunes.x + 110, gunes.y + 90], aralik: 10, boy: [30, 60], en: [10, 14], yon: (x, y, r) => (r() - 0.5) * 0.25, icinde: (x, y) => { const d = Math.hypot(x - gunes.x, (y - gunes.y) * 1.2); return d > 24 && y < gunes.y + 46 && R() < 0.85 * Math.pow(sat(1 - (d - 24) / 56), 1.4); }, renk: (x, y, r) => kar('#E9F2F3', '#F6F7EE', r()), darbe: kuru({ a: 0.8, govde: 0.5, uc: 'sivri', bas: 0.6, yuk: 0.35, kilK: 8 }), tohum: 8 })), { basinc: 0.8, yumusak: 0.3 });
  ovala((k) => {
    k.save();
    const gy = new Path2D();
    for (let i = 0; i <= 72; i++) { const t = (i / 72) * Math.PI * 2, rr = gunR(gunes.x + Math.cos(t) * 10, gunes.y + Math.sin(t) * 10); if (i) gy.lineTo(gunes.x + Math.cos(t) * rr, gunes.y + Math.sin(t) * rr); else gy.moveTo(gunes.x + rr, gunes.y); }
    gy.closePath(); k.clip(gy);
    // dairesel dönen kısa darbeler: dışta soluk sarı, içe doğru beyaz
    for (let ring = 0; ring < 3; ring++) {
      const rr = [24, 15, 6][ring], adet = [14, 9, 4][ring];
      for (let i = 0; i < adet; i++) {
        const t0 = (i / adet) * Math.PI * 2 + R() * 0.3, t1 = t0 + 1.0 + R() * 0.5, pts = [];
        for (let q = 0; q <= 8; q++) { const t = t0 + ((t1 - t0) * q) / 8; pts.push([gunes.x + Math.cos(t) * rr, gunes.y + Math.sin(t) * rr * 0.96]); }
        M.darbe(k, pts, 13 + R() * 4, kar(['#FCF5D9', '#FDF9E8', '#FFFEF8'][ring], '#FFFFFA', R() * 0.4), kuru({ a: 1, govde: 0.85, uc: 'sivri', bas: 0.7, yuk: 0.7, kilK: 6, r: R }));
      }
    }
    k.restore();
  }, { basinc: 1.2, yumusak: 0.3 });
  // ovalanmış bulutlar: biri solda kısa ve kabarık, öteki sağda uzun ve yassı; her biri birkaç üst üste binen
  // kütleden kurulur (taraklı kenar yok); tepeleri beyaz ve kalın, alt yüzleri serin gri-mavi, altı hafif dalgalı
  const bulutlar = [
    { t: 1, lob: [[94, 270, 42, 13], [136, 254, 46, 24], [178, 248, 28, 16], [200, 264, 26, 11]] },
    { t: 2, lob: [[654, 224, 52, 10], [714, 208, 60, 22], [764, 201, 34, 16], [800, 214, 50, 16], [858, 224, 48, 10], [906, 230, 26, 6]] },
  ];
  bulutlar.forEach((b) => {
    b.x1 = Math.min(...b.lob.map((l) => l[0] - l[2])); b.x2 = Math.max(...b.lob.map((l) => l[0] + l[2]));
    b.y1 = Math.min(...b.lob.map((l) => l[1] - l[3])); b.y2 = Math.max(...b.lob.map((l) => l[1] + l[3] * 0.5));
    const bn = M.gurultu(2300 + b.t);
    b.f = (x, y) => {
      let m = -9;
      for (const [cx, cy, rx, ry] of b.lob) { const u = (x - cx) / rx, v = (y - cy) / ry; const q = 1 - u * u - (v < 0 ? v * v : (v / 0.5) ** 2); if (q > m) m = q; }
      return m + (bn.fbm(x * 0.025 + b.t, y * 0.04, 3) - 0.5) * 0.55;
    };
    b.renk = (x, y, r) => { const tt = sat((y - (b.y1 + (b.y2 - b.y1) * 0.42)) / ((b.y2 - b.y1) * 0.58)); return oynat(kar('#FBFAF3', '#C3CFDD', tt), r, 10); };
  });
  const bulutKutu = (b, p) => [b.x1 - p, b.y1 - p, b.x2 + p, b.y2 + p];
  ovala((k) => kirp(k, disari, 'evenodd', () => {
    bulutlar.forEach((b) => M.alan(k, { kutu: bulutKutu(b, 26), aralik: 6, boy: b.t === 1 ? [26, 56] : [30, 70], en: [12, 18], yon: (x, y, r) => (r() - 0.5) * 0.3, egri: 0.3, icinde: (x, y) => b.f(x, y) > -0.15 + R() * 0.4, renk: b.renk, darbe: kuru({ a: 0.88, kilK: 16, uc: 'sivri', bas: 0.55, govdeSon: 0.6, yuk: 0.42 }), tohum: 40 + b.t }));
  }), { basinc: 1.0, yumusak: 0.42 });
  ovala((k) => kirp(k, disari, 'evenodd', () => {
    bulutlar.forEach((b) => M.alan(k, { kutu: bulutKutu(b, 10), aralik: 7, boy: [24, 54], en: [10, 16], yon: (x, y, r) => (r() - 0.5) * 0.4, egri: 0.4, icinde: (x, y) => b.f(x, y) > 0.3 + R() * 0.25 && y < b.y1 + (b.y2 - b.y1) * 0.6, renk: (x, y, r) => kar('#FDFCF6', '#F2F2EC', r()), darbe: kuru({ a: 0.92, kilK: 12, uc: 'sivri', bas: 0.6, govdeSon: 0.65, yuk: 0.45 }), tohum: 50 + b.t }));
  }), { basinc: 1.1, yumusak: 0.4 });
  // alt yüz: kenarı izleyen birkaç serin gri-mavi sürüş (hacim verir; koyu değil)
  ovala((k) => kirp(k, disari, 'evenodd', () => {
    bulutlar.forEach((b) => {
      const adet = Math.round((b.x2 - b.x1) / 26);
      for (let j = 0; j < adet; j++) {
        const x = b.x1 + 18 + ((b.x2 - b.x1 - 36) * (j + R() * 0.8)) / adet;
        let y = b.y2 + 8;
        while (y > b.y1 && b.f(x, y) < 0.15) y -= 1;
        if (y <= b.y1 + 4) continue;
        const L = 26 + R() * 30, pts = [];
        for (let q = 0; q <= 6; q++) { const xx = x + (q / 6 - 0.5) * L; let yy = b.y2 + 8; while (yy > b.y1 && b.f(xx, yy) < 0.15) yy -= 1; pts.push([xx, Math.max(y - 6, Math.min(y + 4, yy)) - 4]); }
        M.darbe(k, pts, 6 + R() * 3, oynat(kar('#B9C7D8', '#C8D2DE', R()), R, 8), kuru({ a: 0.8, kilK: 12, uc: 'sivri', bas: 0.6, yuk: 0.4, r: R }));
      }
    });
  }), { basinc: 0.95, yumusak: 0.35 });

  // ------------------------------------------------------------ 2. zemin: yatay ovalanmış soluk okr, krem ve adaçayı yeşili
  // alt kat: geniş, kuru yatay darbeler (uzakta ince ve kısa, önde geniş ve uzun)
  const zeminAlt = (x, y, r) => oynat(kar(['#E6DCC0', '#D9D4AE', '#E1D4B0'][Math.floor(r() * 3)], '#CDD0A2', sat((y - 800) / 220) * 0.5), r, 12);
  ovala((k) => {
    M.alan(k, { kutu: [-60, 788, 1080, 880], aralik: 34, dikeyOran: 0.45, boy: [70, 150], en: [12, 20], yon: (x, y, r) => (r() - 0.5) * 0.04, renk: zeminAlt, darbe: kuru({ yuk: 0.5 }), tohum: 5 });
    M.alan(k, { kutu: [-60, 860, 1080, 1040], aralik: 50, dikeyOran: 0.55, boy: [120, 230], en: [20, 32], yon: (x, y, r) => (r() - 0.5) * 0.05, renk: zeminAlt, darbe: kuru({ yuk: 0.5 }), tohum: 15 });
  }, { basinc: 0.9 });
  // seçik darbeler: krem, kum okru ve adaçayı yeşili; komşusundan açık ya da koyu, kuru uçlu
  const zeminTon = ['#EBE3CB', '#DCCFAA', '#CDD1A2', '#E3D5B0', '#D5C8A0', '#C4CC9A', '#EFE9D6', '#C0C996', '#DCCA9E'];
  const zeminSec = (x, y, r) => oynat(C(zeminTon[Math.floor(r() * zeminTon.length)]), r, 10);
  ovala((k) => {
    M.alan(k, { kutu: [-60, 792, 1080, 880], aralik: 26, dikeyOran: 0.6, boy: [44, 110], en: [9, 15], yon: (x, y, r) => (r() - 0.5) * 0.08, renk: zeminSec, egri: 0.12, darbe: kuru({ a: 0.92, yuk: 0.4, uc: 'sivri', bas: 0.65, govdeSon: 0.7 }), tohum: 7 });
    M.alan(k, { kutu: [-60, 860, 1080, 1040], aralik: 34, dikeyOran: 0.7, boy: [70, 170], en: [14, 24], yon: (x, y, r) => (r() - 0.5) * 0.1, renk: zeminSec, egri: 0.12, darbe: kuru({ a: 0.92, yuk: 0.4, uc: 'sivri', bas: 0.65, govdeSon: 0.7 }), tohum: 17 });
  }, { basinc: 1.0 });
  // seyrek vurgular: birkaç koyu adaçayı ve sıcak okr, birkaç açık krem darbe (yalnız iplik tepelerine takılır)
  ovala((k) => M.alan(k, { kutu: [-60, 800, 1080, 1040], aralik: 64, dikeyOran: 0.7, boy: [50, 120], en: [10, 16], yon: (x, y, r) => (r() - 0.5) * 0.08, renk: (x, y, r) => { const h = r(); return oynat(C(h < 0.4 ? '#B3BF8E' : h < 0.7 ? '#D2BD90' : '#F1EBDA'), r, 8); }, egri: 0.1, darbe: kuru({ a: 0.9, yuk: 0.35, uc: 'sivri', bas: 0.6, govdeSon: 0.7 }), tohum: 19 }), { basinc: 0.85, yumusak: 0.3 });
  // uzakta soluk, serin bir yer şeridi
  ovala((k) => M.alan(k, { kutu: [-20, 755, 1044, 805], aralik: 8, boy: [50, 120], en: [10, 14], yon: () => (R() - 0.5) * 0.05, icinde: (x, y) => y > 784 - 16 * nz(x * 0.006, 2.2) && !silMsk(x, y), renk: (x, y, r) => kar('#BCC9C6', '#CAD2C6', r()), darbe: kuru({ a: 0.85 }), tohum: 6 }), { basinc: 0.85 });

  // ------------------------------------------------------------ 3. mimari: taşta dikey, kubbede dilim dilim
  const tasR = rampa([[0, '#9AA5B6'], [0.3, '#B3BAC6'], [0.55, '#D8D5CC'], [0.8, '#EFEAE0'], [1, '#FAF7EF']]);
  const tasV = (x, cx, Rr, ek) => sat(0.08 + 0.92 * Math.max(0, M.dif(M.silindir(x, cx, Rr))) + (ek || 0));
  const tasTon = (c, r) => { const h = r(); return h < 0.22 ? kar(c, '#EADFC6', 0.4) : h < 0.4 ? kar(c, '#CBD0D8', 0.35) : c; };
  // minare
  const minareKat = (ust) => ovala((k) => {
    const MP = P.minare;
    for (let i = 0; i < MP.length; i++) {
      const p = MP[i];
      if (p.tip === 'alem') continue;
      const yol = minY[i];
      const xs = p.pts.map((q) => q[0]), ys = p.pts.map((q) => q[1]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);
      const hw = (x2 - x1) / 2;
      const yatay = p.ad.startsWith('şerefe') || p.ad === 'bilezik' || p.tip === 'korkuluk';
      const ek = p.ad.startsWith('çıkma') ? -0.3 : p.tip === 'korkuluk' ? -0.15 : yatay ? 0.08 : 0;
      kirp(k, yol, 'nonzero', () => M.alan(k, { kutu: [x1 - 4, y1 - 4, x2 + 4, y2 + 4], aralik: yatay ? (ust ? 9 : 4) : (ust ? 22 : 7), boy: yatay ? [30, 60] : [34, 80], en: yatay ? [6, 9] : [10, 14], yon: yatay ? () => (R() - 0.5) * 0.04 : () => -Math.PI / 2 + (R() - 0.5) * 0.05, renk: (x, y, r) => { const c = tasR(tasV(x, 300, hw, ek) + (r() - 0.5) * (ust ? 0.42 : 0.1)); return ust ? tasTon(c, r) : c; }, darbe: kuru({ kil: 8, yuk: ust ? 0.4 : 0.5 }), tohum: (ust ? 150 : 100) + i }));
    }
  }, { basinc: 1.0 });
  minareKat(false); minareKat(true);
  // kaide: dikey darbeler, sıcak ve serin beyazlar; komşu darbeler değerce ayrılır, uçlar kuru
  const kaideV = (x, y) => 0.6 + ((x - P.kaide.x1) / (P.kaide.x2 - P.kaide.x1)) * 0.28 - (y < 712 ? 0.24 : 0);
  ovala((k) => {
    const K = P.kaide;
    kirp(k, kaideY, 'nonzero', () => M.alan(k, { kutu: [K.x1 - 4, K.y1 - 4, K.x2 + 4, K.y2 + 4], aralik: 8, boy: [40, 90], en: [12, 18], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.06, renk: (x, y, r) => tasR(kaideV(x, y) + (r() - 0.5) * 0.2), darbe: kuru({ yuk: 0.5 }), tohum: 200 }));

  }, { basinc: 1.05 });
  // kaidenin gölgede kalan sol ucunda ve pencere aralarında serin, kuru gri-mavi; ışıkta kuru sıcak beyaz
  ovala((k) => {
    const K = P.kaide;
    kirp(k, kaideY, 'nonzero', () => {
      M.alan(k, { kutu: [K.x1, 712, K.x2, K.y2 + 4], aralik: 22, dikeyOran: 1.5, boy: [30, 70], en: [10, 16], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.07, icinde: (x) => R() < 0.6 - ((x - K.x1) / (K.x2 - K.x1)) * 0.45, renk: (x, y, r) => oynat(kar('#CCCFD3', '#C0C4CB', r()), r, 8), darbe: kuru({ a: 0.75, yuk: 0.35, uc: 'kare', bas: 0.85 }), tohum: 205 });
      M.alan(k, { kutu: [K.x1, 712, K.x2, K.y2 + 4], aralik: 22, dikeyOran: 1.5, boy: [30, 70], en: [10, 16], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.07, icinde: (x) => R() < 0.2 + ((x - K.x1) / (K.x2 - K.x1)) * 0.5, renk: (x, y, r) => oynat(kar('#FBF6EA', '#F4ECD8', r()), r, 6), darbe: kuru({ a: 0.85, yuk: 0.35, uc: 'kare', bas: 0.85 }), tohum: 206 });
    });
  }, { basinc: 0.8, yumusak: 0.24 });
  // kasnak: dikey yeşil darbeler
  const yesR = rampa([[0, '#2F6E4A'], [0.3, '#3F7F58'], [0.55, '#589A68'], [0.8, '#74B07A'], [1, '#9CCA8E']]);
  const yesTon = (c, r) => { const h = r(); return h < 0.2 ? kar(c, '#3E8F80', 0.25) : h < 0.38 ? kar(c, '#A4C878', 0.22) : c; };
  ovala((k) => {
    for (let kk = 1; kk >= 0; kk--) {
      const q = P.kasnak[kk], Rr = (q.x2 - q.x1) / 2;
      kirp(k, kasnakY[kk], 'nonzero', () => M.alan(k, { kutu: [q.x1 - 4, q.y1 - 4, q.x2 + 4, q.y2 + 4], aralik: 7, boy: [30, 66], en: [10, 14], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.05, renk: (x, y, r) => yesR(sat(0.05 + 0.8 * Math.max(0, M.dif(M.silindir(x, 560, Rr)))) + (r() - 0.5) * 0.16), darbe: kuru({ yuk: 0.5 }), tohum: 300 + kk }));
      kirp(k, kasnakY[kk], 'nonzero', () => M.alan(k, { kutu: [q.x1 - 4, q.y1 - 4, q.x2 + 4, q.y2 + 4], aralik: 14, dikeyOran: 1.4, boy: [28, 64], en: [10, 15], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.06, renk: (x, y, r) => yesTon(yesR(sat(0.05 + 0.85 * Math.max(0, M.dif(M.silindir(x, 560, Rr)))) + (r() - 0.5) * 0.46), r), darbe: kuru({ yuk: 0.4, uc: 'sivri', bas: 0.7, govdeSon: 0.75 }), tohum: 310 + kk }));
    }
  }, { basinc: 1.05 });
  // kasnağın ışık yanında kuru açık yeşil, gölge yanında ince koyu yeşil ovalama
  ovala((k) => {
    for (let kk = 0; kk < 2; kk++) {
      const q = P.kasnak[kk], Rr = (q.x2 - q.x1) / 2;
      const isk = (x) => Math.max(0, M.dif(M.silindir(x, 560, Rr)));
      kirp(k, kasnakY[kk], 'nonzero', () => {
        M.alan(k, { kutu: [q.x1, q.y1 - 4, q.x2, q.y2 + 4], aralik: 15, boy: [24, 56], en: [8, 12], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.05, icinde: (x) => R() < sat((isk(x) - 0.62) / 0.3), renk: (x, y, r) => kar('#8DC28A', '#A5D09A', r()), darbe: kuru({ a: 0.75, yuk: 0.35, uc: 'sivri', bas: 0.6 }), tohum: 320 + kk });
        M.alan(k, { kutu: [q.x1, q.y1 - 4, q.x2, q.y2 + 4], aralik: 15, boy: [24, 56], en: [8, 12], yon: () => -Math.PI / 2 + (R() - 0.5) * 0.05, icinde: (x) => R() < sat((0.4 - isk(x)) / 0.3), renk: (x, y, r) => kar('#2A5E43', '#33694B', r()), darbe: kuru({ a: 0.75, yuk: 0.35, uc: 'sivri', bas: 0.6 }), tohum: 330 + kk });
      });
    }
  }, { basinc: 0.75, yumusak: 0.22 });
  // kubbe: önce meridyen boyunca ince bir alt kat, sonra her dilim kendi iki üç darbesiyle (dilim dilim)
  const kv = (x, y) => sat(0.06 + 0.94 * Math.max(0, M.dif(M.kubbeNormal(x, y, 0.12).n)));
  const kubMsk = mask(kubbeY);
  ovala((k) => kirp(k, kubbeY, 'nonzero', () => M.alan(k, { kutu: [354, 294, 766, 560], aralik: 9, boy: [50, 100], en: [12, 18], yon: (x, y) => M.meridyen(x, y), akis: true, icinde: kubMsk, renk: (x, y, r) => yesR(kv(x, y) * 0.9 + (r() - 0.5) * 0.06), darbe: kuru(), tohum: 600 })), { basinc: 0.95 });
  const KPf = S.kubbeProfili(120);
  ovala((k) => kirp(k, kubbeY, 'nonzero', () => {
    for (let gi = 0; gi < 16; gi++) {
      const b0 = -Math.PI / 2 + (Math.PI * gi) / 16, b1 = b0 + Math.PI / 16;
      const s0 = Math.sin(b0), s1 = Math.sin(b1);
      const dTon = (R() - 0.5) * 0.1;
      let t0 = R() * 0.08;
      while (t0 < 0.96) {
        const t1 = Math.min(1, t0 + 0.24 + R() * 0.22);
        const offs = s1 - s0 > 0.08 ? [-0.27, 0.0, 0.27] : [-0.15, 0.15];
        for (const off of offs) {
          const f = 0.5 + off + (R() - 0.5) * 0.08, sb = s0 + (s1 - s0) * f;
          const i0 = Math.floor(t0 * 120), i1 = Math.ceil(t1 * 120);
          const pts = [];
          for (let i = i0; i <= i1; i++) pts.push([560 + sb * KPf[i].r, KPf[i].y]);
          if (pts.length < 3) continue;
          const mid = KPf[Math.round((i0 + i1) / 2)];
          const xm = 560 + sb * mid.r, ym = mid.y;
          const w = Math.max(2.4, mid.r * (s1 - s0) * (offs.length === 3 ? 0.46 : 0.62));
          const kg = 0.5 * kv(xm, ym) + 0.5 * kv(560 + sb * M.KP.r(440), 440);
          const c = yesTon(yesR(kg * 0.84 + 0.03 + dTon + (R() - 0.5) * 0.18), R);
          M.darbe(k, pts, w, c, kuru({ a: 0.93, govde: 0.62, yuk: 0.42, uc: 'sivri', bas: 0.35, govdeSon: 0.75, kil: Math.max(4, Math.min(12, Math.round(w / 1.6))), r: R }));
        }
        t0 = t1 - 0.03 - R() * 0.04;
      }
    }
  }), { basinc: 1.0, yumusak: 0.22 });
  // ışık yüzünde kuru, açık sarı-yeşil ovalama (yalnız iplik tepelerinde), gölge yüzünde ince koyu yeşil
  ovala((k) => kirp(k, kubbeY, 'nonzero', () => {
    M.alan(k, { kutu: [354, 294, 766, 560], aralik: 19, boy: [40, 90], en: [10, 15], yon: (x, y) => M.meridyen(x, y), akis: true, icinde: (x, y) => kubMsk(x, y) && R() < sat((kv(x, y) - 0.68) / 0.3), renk: (x, y, r) => kar('#B4D79E', '#C6E2AE', r()), darbe: kuru({ a: 0.6, yuk: 0.3, uc: 'sivri', bas: 0.6 }), tohum: 602 });
    M.alan(k, { kutu: [354, 294, 766, 560], aralik: 19, boy: [40, 90], en: [10, 15], yon: (x, y) => M.meridyen(x, y), akis: true, icinde: (x, y) => kubMsk(x, y) && R() < sat((0.36 - kv(x, y)) / 0.25), renk: (x, y, r) => kar('#2B5E44', '#356B4C', r()), darbe: kuru({ a: 0.75, yuk: 0.35, uc: 'sivri', bas: 0.6 }), tohum: 603 });
  }), { basinc: 0.7, yumusak: 0.2 });
  // kaburgalar ve kasnak pencereleri, minare ve kaide pencereleri: sert fırçayla koyu, ince
  ovala((k) => {
    kirp(k, kubbeY, 'nonzero', () => {
      // sert kıl fırçayla: kaburga iki üç parçalı, en 1,5–3,5 px arasında değişir, uçlar incelir, aralarda küçük kuru boşluk
      for (const kb of S.kaburgalar(16, 80)) {
        const u = kb.u, pts = kb.noktalar.filter((q) => q[1] > 304).map(([x, y]) => [x - 1.5, y]);
        const daral = Math.sqrt(1 - u * u * 0.85);
        let i0 = 0;
        while (i0 < pts.length - 3) {
          const uz = 18 + Math.floor(R() * 22);
          const parca = pts.slice(i0, Math.min(pts.length, i0 + uz));
          if (parca.length > 2) M.darbe(k, parca, (1.6 + R() * 1.9) * daral + 0.2, C('#2F6E4A'), kuru({ kil: 4, kilK: 14, a: 0.95, uc: 'damla', yuk: 0.55, r: R }));
          i0 += uz + 1 + Math.floor(R() * 3);
        }
        if (u > -0.4) {
          let j0 = Math.floor(R() * 6);
          const ac = pts.map(([x, y]) => [x + 3.2, y]);
          while (j0 < ac.length - 3) {
            const uz = 14 + Math.floor(R() * 20);
            const parca = ac.slice(j0, Math.min(ac.length, j0 + uz));
            if (parca.length > 2) M.darbe(k, parca, (1.2 + R() * 1.3) * daral, C('#A9D19A'), kuru({ kil: 3, kilK: 12, a: 0.85, uc: 'damla', yuk: 0.5, r: R }));
            j0 += uz + 2 + Math.floor(R() * 5);
          }
        }
      }
    });
    for (let kk = 0; kk < 2; kk++) for (const p of P.kasnak[kk].pen) kirp(k, M.elYolu(p.pts, 0.4, 1400 + Math.round(p.x), 3), 'nonzero', () => {
      M.darbe(k, [[p.x, p.y + p.h + 2], [p.x, p.y - 2]], p.w * 1.2, C('#2A5640'), kuru({ a: 1, kil: 3, kilK: 12, r: R }));
      if (p.w > 9) M.darbe(k, [[p.x - p.w * 0.36, p.y + p.h], [p.x - p.w * 0.36, p.y + p.w * 0.4]], Math.max(1.4, p.w * 0.2), C('#6FA27A'), kuru({ a: 0.85, kil: 2, kilK: 8, r: R }));
    });
    for (const p of P.minarePen.concat(P.kaide.pen)) kirp(k, M.elYolu(p.pts, 0.4, 1500 + Math.round(p.x + p.y), 3), 'nonzero', () => {
      M.darbe(k, [[p.x + p.w * 0.1, p.y + p.h + 2], [p.x + p.w * 0.1, p.y - 2]], p.w * 1.1, C('#7A736A'), kuru({ a: 1, kil: 4, kilK: 14, r: R }));
      M.darbe(k, [[p.x - p.w * 0.36, p.y + p.h], [p.x - p.w * 0.36, p.y + p.w * 0.4]], Math.max(1.6, p.w * 0.24), C('#C9C2B4'), kuru({ a: 0.9, kil: 2, kilK: 8, r: R }));
    });
    // kornişlerin altında serin gölge, korkulukların babaları
    for (const [x1, x2, y] of [[300, 820, 704], [266, 334, 488], [273, 327, 316]]) M.darbe(k, [[x1, y + 3], [x2, y + 3]], 6, C('#A3ADBA'), kuru({ a: 0.8, kil: 6, r: R }));
    for (const p of P.minare.filter((q) => q.tip === 'korkuluk')) {
      const adet = p.ad.endsWith('1') ? 12 : 10;
      for (let i = 0; i <= adet; i++) { const x = p.x1 + 2 + ((p.x2 - p.x1 - 4) * i) / adet; M.darbe(k, [[x, p.y2], [x, p.y1 + 3]], 2.2, C('#8E97A6'), kuru({ kil: 2, kilK: 10, a: 0.9, r: R })); }
    }
    for (const z of P.zikzak) M.darbe(k, z, 3, C('#9A8F7A'), kuru({ kil: 3, kilK: 12, a: 0.95, uc: 'kare', r: R }));
  }, { basinc: 1.0, yumusak: 0.15 });

  // altın alemler: ovalanmış okr-altın, sonra kalın ışık
  function alemCiz(k, a) {
    const altR = rampa([[0, '#8E6C28'], [0.5, '#C8A24E'], [1, '#EBD38A']]);
    const s = a.yaka.rx / 20;
    k.fillStyle = css(altR(0.45)); k.beginPath(); k.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, Math.PI * 2); k.fill();
    M.darbe(k, [[a.cubuk.x1 + 2.6 * s, a.cubuk.y2], [a.cubuk.x1 + 2.6 * s, a.cubuk.y1]], 5.4 * s, altR(0.5), kuru({ kil: 3, kilK: 14, uc: 'kare', r: R }));
    for (const kr of a.kureler) { k.fillStyle = css(altR(0.5)); k.beginPath(); k.arc(kr.cx, kr.cy, kr.r, 0, Math.PI * 2); k.fill(); k.fillStyle = css(altR(0.15), 0.8); k.beginPath(); k.ellipse(kr.cx - kr.r * 0.3, kr.cy + kr.r * 0.15, kr.r * 0.6, kr.r * 0.75, 0.3, 0, Math.PI * 2); k.fill(); }
    const hp = M.yolYap(M.titrek(M.hilal(a.hilal.cx, a.hilal.cy, a.hilal.R, 20), true, 0.3, 1600, 3));
    k.fillStyle = css(altR(0.55)); k.fill(hp);
  }
  ovala((k) => { alemCiz(k, P.alem); alemCiz(k, P.minareAlem); }, { basinc: 1.15, yumusak: 0.12 });

  // ------------------------------------------------------------ 4. bitkiler: ince ovalanmış yeşiller, koyu yeşil vurgular
  const B = S.bitki;
  ovala((k) => {
    for (const s of B.saplar) M.darbe(k, s, 4.2, C('#5E8F5E'), kuru({ kil: 4, kilK: 14, uc: 'sivri', yuk: 0.6, r: R }));
    B.tomurcuklar.forEach((t, i) => { if (i >= 8) M.darbe(k, [[t.x + 2, t.y + 34], [t.x + 1, t.y + 14], [t.x, t.y + 4]], 3, C('#5E8F5E'), kuru({ kil: 3, kilK: 12, uc: 'sivri', r: R })); });
    // yaprak: dipte dar, üçte birde en geniş, ucu sivri (badem değil, bakla değil); her yarısı kendi iki
    // darbesiyle: ışık yanı açık, gölge yanı koyu yeşil; ortada ince açık damar
    for (const y of B.yapraklar) {
      const L = y.uzunluk, W = L * y.genislik * 0.74, ca = Math.cos(y.aci), sa = Math.sin(y.aci);
      const bk = (R() - 0.5) * 0.2;
      const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
      const orta = (t) => bk * L * Math.sin(Math.PI * t);
      const yariEn = (t) => (W / 2) * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.66)), 1.05);
      const isikV = (-sa) * 0.7 - ca * 0.7 > 0 ? 1 : -1;
      const ton = (R() - 0.5) * 2;
      for (const yari of [1, -1]) {
        const yol = new Path2D();
        const a0 = p(0, 0); yol.moveTo(a0[0], a0[1]);
        for (let i = 1; i <= 14; i++) { const t = i / 14; const q = p(L * t, orta(t) + yari * yariEn(t)); yol.lineTo(q[0], q[1]); }
        for (let i = 14; i >= 0; i--) { const t = i / 14; const q = p(L * t, orta(t) - yari * 0.9); yol.lineTo(q[0], q[1]); }
        yol.closePath();
        const lit = yari === isikV;
        k.save(); k.clip(yol);
        for (const f of [0.3, 0.78]) {
          const pts = [];
          for (let i = 0; i <= 10; i++) { const t = -0.04 + (i / 10) * 1.08; pts.push(p(L * t, orta(Math.max(0, Math.min(1, t))) + yari * yariEn(Math.max(0, Math.min(1, t))) * f)); }
          let c = lit ? kar('#7DB27A', '#93C287', R()) : kar('#3F7A54', '#2F6E4A', R());
          if (f > 0.5) c = lit ? kar(c, '#A9CF8E', 0.25) : kar(c, '#4F8A62', 0.3);
          c = ton > 0.4 ? kar(c, '#7FA44E', 0.15) : ton < -0.4 ? kar(c, '#3E8F80', 0.15) : c;
          M.darbe(k, pts, W * 0.46, c, kuru({ a: 0.95, govde: 0.6, kil: 8, kilK: 26, kilA: 0.85, uc: 'sivri', bas: 0.6, yuk: 0.5, r: R }));
        }
        k.restore();
      }
      // orta damar: ince, açık, ucu incelir
      const dm = [];
      for (let i = 0; i <= 8; i++) { const t = 0.04 + (i / 8) * 0.78; dm.push(p(L * t, orta(t))); }
      M.cizgi(k, dm, Math.max(0.9, L * 0.022), kar('#A6CF95', '#8CBF84', R()), { r: R, titreme: 0.15, a: 0.85 });
    }
  }, { basinc: 0.94, yumusak: 0.2 });
  // tomurcuklar
  ovala((k) => {
    for (const t of B.tomurcuklar) {
      const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
      M.darbe(k, [[t.x - ca * t.r * 0.8, t.y - sa * t.r * 0.8], [t.x + ca * t.r * 1.5, t.y + sa * t.r * 1.5]], t.r * 1.5, C('#F2EAE6'), kuru({ kil: 5, uc: 'sivri', r: R }));
      M.darbe(k, [[t.x - ca * t.r, t.y - sa * t.r], [t.x + ca * t.r * 0.2, t.y + sa * t.r * 0.2]], t.r * 1.2, C('#5E8F5E'), kuru({ kil: 4, uc: 'sivri', r: R }));
    }
  }, { basinc: 1.2, yumusak: 0.16 });
  // çiçeklerin yeri önce çıplak ketene döndürülür (ressam taç yapraklarını ham keten üstüne ovalar)
  const tacYol = (c, i, k) => {
    const a = c.aci + (i * Math.PI * 2) / 5, ux = Math.cos(a), uy = Math.sin(a);
    const pts = [];
    for (let j = 0; j <= 20; j++) {
      const t = (j / 20) * Math.PI * 2;
      const u = c.r * (0.52 + 0.5 * Math.cos(t)) * k, w = c.r * 0.42 * Math.sin(t) * (0.55 + 0.45 * (0.5 + 0.5 * Math.cos(t))) * k;
      pts.push([c.x + ux * u - uy * w, c.y + uy * u + ux * w]);
    }
    return M.yolYap(M.titrek(pts, true, Math.max(0.6, c.r * 0.03), 2400 + Math.round(c.x) + i, 3));
  };
  for (const c of B.cicekler) {
    const yp = new Path2D();
    for (let i = 0; i < 5; i++) yp.addPath(tacYol(c, i, 1.04));
    g.save(); g.clip(yp); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(KETEN, 0, 0); g.restore();
  }
  // taç yaprakları: merkezden dışa iki üç kuru, ovalanmış beyaz darbe; keten aralarından seçilir
  ovala((k) => {
    for (const c of B.cicekler) {
      for (let i = 0; i < 5; i++) {
        const a = c.aci + (i * Math.PI * 2) / 5, ux = Math.cos(a), uy = Math.sin(a);
        const isik = ux * 0.72 - uy * 0.7;
        const lit = isik > -0.3;
        const tonlar = lit ? [C('#F5F1E6'), C('#FDFBF4'), C('#E8E5DD')] : [C('#D9DADC'), C('#CBCDD2'), C('#E5E4E1')];
        k.save(); k.clip(tacYol(c, i, 1.04));
        const offs = c.r > 30 ? [-0.24, 0, 0.24] : [-0.16, 0.16];
        offs.forEach((off, j) => {
          const x0 = c.x + ux * c.r * 0.1, y0 = c.y + uy * c.r * 0.1;
          const uz = 1.04 - Math.abs(off) * 0.4;
          const x1 = c.x + ux * c.r * uz + (-uy) * off * c.r * 0.95, y1 = c.y + uy * c.r * uz + ux * off * c.r * 0.95;
          const mx = (x0 * 0.45 + x1 * 0.55) + (-uy) * off * c.r * 0.18, my = (y0 * 0.45 + y1 * 0.55) + ux * off * c.r * 0.18;
          M.darbe(k, [[x0, y0], [mx, my], [x1, y1]], c.r * (offs.length === 3 ? 0.38 : 0.46), tonlar[(i + j) % 3], kuru({ a: 1, govde: 0.7, kil: 9, kilK: 18, kilA: 0.8, yuk: 0.5, uc: 'yuvarlak', r: R }));
        });
        // taç yaprağının dibinde kısa, serin gri-mor bir gölge darbesi (göbeğe doğru)
        M.darbe(k, [[c.x + ux * c.r * 0.12, c.y + uy * c.r * 0.12], [c.x + ux * c.r * 0.46, c.y + uy * c.r * 0.46]], c.r * 0.42, lit ? C('#DDDBD9') : C('#BEC1C8'), kuru({ a: 0.8, govde: 0.6, kil: 7, kilK: 12, yuk: 0.4, uc: 'sivri', r: R }));
        k.restore();
      }
    }
  }, { basinc: 0.98, yumusak: 0.16 });

  // ------------------------------------------------------------ 5. yalnız en parlak ışıklarda kalın küçük vurgular (dokuyu örter)
  const vurgu = (x, y, rx, ry, aci, c, hk) => M.tus(g, x, y, rx, ry, aci, c, { r: R, hk: hk === undefined ? 0.8 : hk });
  for (const c of B.cicekler) {
    for (let i = 0; i < 5; i++) {
      const a = c.aci + (i * Math.PI * 2) / 5, ux = Math.cos(a), uy = Math.sin(a);
      if (ux * 0.72 - uy * 0.7 < -0.1) continue;
      const yan = [-uy, ux], ys = (yan[0] * 0.72 - yan[1] * 0.7) > 0 ? 1 : -1;
      const pts = [];
      for (let j = 0; j <= 6; j++) { const th = (j / 6) * 1.4 - 0.2; pts.push([c.x + ux * c.r * (0.55 + 0.38 * Math.cos(th * 0.8)) + yan[0] * ys * c.r * 0.36 * Math.sin(th + 0.3), c.y + uy * c.r * (0.55 + 0.38 * Math.cos(th * 0.8)) + yan[1] * ys * c.r * 0.36 * Math.sin(th + 0.3)]); }
      M.darbe(g, pts, c.r * 0.16, C('#FFFDF6'), { a: 0.95, kil: 4, kilK: 5, uc: 'sivri', bas: 0.8, r: R, hk: 0.9 });
    }
    // göbek: koyu okr bir taban tuşu, üstüne birkaç küçük sarı okr ve açık sarı tuş (küre değil, tuş kümesi)
    vurgu(c.x, c.y, c.r * 0.18, c.r * 0.16, R() * 3, C('#B08A38'), 0.4);
    const adet = c.r > 40 ? 9 : 6;
    for (let s = 0; s < adet; s++) {
      const aa = R() * Math.PI * 2, dd = Math.sqrt(R()) * c.r * 0.12;
      const ust = Math.cos(aa) * 0.7 - Math.sin(aa) * 0.7 > 0;
      vurgu(c.x + Math.cos(aa) * dd, c.y + Math.sin(aa) * dd, c.r * 0.055 + 0.6, c.r * 0.045 + 0.5, R() * 3, ust ? kar('#E2C25E', '#F0D982', R()) : kar('#A9842F', '#C9A24E', R()), 0.8);
    }
  }
  // kubbe ışık yüzünde kalın açık yeşil, minare ve kaidenin ışık kenarında kalın beyaz
  g.save(); g.clip(kubbeY);
  for (let i = 0; i < 26; i++) {
    const x = 600 + R() * 130, y = 340 + R() * 150;
    if (!kubMsk(x, y) || kv(x, y) < 0.9) continue;
    M.darbe(g, M.akisDarbe(x, y, (xx, yy) => M.meridyen(xx, yy), 40 + R() * 40), 3 + R() * 1.5, kar('#A8D29A', '#BCDDAA', R()), { a: 0.8, kil: 4, kilK: 8, yuk: 0.6, uc: 'sivri', r: R, hk: 0.6 });
  }
  g.restore();
  for (const [x, y1, y2, w] of [[322, 495, 690, 3.5], [317, 322, 432, 3], [312, 210, 270, 2.6]]) {
    for (let y = y1; y < y2; y += 14 + R() * 16) M.darbe(g, [[x, y], [x + 0.3, y + 10 + R() * 12]], w, C('#FCF9F1'), { a: 0.95, kil: 3, kilK: 5, uc: 'kare', r: R, hk: 0.7 });
  }
  for (let x = 600; x < 815; x += 18 + R() * 26) M.darbe(g, [[x, 716 + R() * 50], [x + 0.4, 740 + R() * 50]], 4, C('#FCF9F1'), { a: 0.85, kil: 3, kilK: 5, uc: 'kare', r: R, hk: 0.6 });
  M.darbe(g, [[300, 693.5], [828, 693.5]], 2.6, C('#FBF7EE'), { a: 0.9, kil: 4, kilK: 6, uc: 'kare', r: R, hk: 0.5 });
  for (const a of [P.alem, P.minareAlem]) for (const kr of a.kureler) vurgu(kr.cx + kr.r * 0.35, kr.cy - kr.r * 0.35, kr.r * 0.3, kr.r * 0.22, -0.6, C('#FBF0C6'), 0.9);
  // bulut tepelerinde kalın beyaz: tepenin eğrisini izleyen uzun, dolgun sürüşler (mimarinin önüne taşmaz)
  g.save(); g.clip(disari, 'evenodd'); M.YUK[1].save(); M.YUK[1].clip(disari, 'evenodd');
  const tepeY = (b, x) => { let y = b.y1 - 12; while (y < b.y2 && b.f(x, y) < 0.32) y += 1; return y; };
  bulutlar.forEach((b) => {
    const adet = Math.round((b.x2 - b.x1) / 24);
    for (let j = 0; j < adet; j++) {
      const x = b.x1 + 14 + ((b.x2 - b.x1 - 28) * (j + R() * 0.7)) / adet;
      const y0 = tepeY(b, x);
      if (y0 > b.y1 + (b.y2 - b.y1) * 0.55) continue;
      const L = 22 + R() * 26, d = 3 + R() * 3.5, pts = [];
      for (let q = 0; q <= 8; q++) { const xx = x + (q / 8 - 0.5) * L; const yy = tepeY(b, xx); pts.push([xx, Math.min(yy, y0 + 10) + d]); }
      M.darbe(g, pts, 5 + R() * 2.6, kar('#FFFFFD', '#FBF9F0', R()), { a: 0.92, kil: 5, kilK: 6, uc: 'sivri', bas: 0.55, r: R, hk: 0.6 });
    }
  });
  M.YUK[1].restore(); g.restore();
  // güneşin ortasında kalın beyaz (en parlak ışık)
  for (const [dx, dy, l] of [[-8, -9, 26], [-4, 1, 30], [0, 10, 24]]) M.darbe(g, [[gunes.x + dx - l / 2, gunes.y + dy + 2], [gunes.x + dx + l / 2, gunes.y + dy - 2]], 7, C('#FFFEF6'), { a: 0.8, kil: 5, kilK: 4, uc: 'yuvarlak', r: R, hk: 0.4 });

  // ------------------------------------------------------------ 6. dokunun kabartısı: ince boyanın altında keten her yerde seçilir
  const H = M.yukDizi(1);
  const Dk = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) Dk[i] = D[i] * (1 - Math.min(1, H[i] * 2.2)) + H[i] * 0.9;
  // dokunun görünürlüğü yer yer değişir (fırçanın bastırdığı yerlerde boya dokuyu biraz doldurur): tek düze ızgara olmasın
  const KC = new Float32Array(N * N);
  { const kn = M.gurultu(2051); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) KC[y * N + x] = 0.5 + 1.0 * kn.fbm(x * 0.0035, y * 0.006, 3); }
  M.kabartmaIsik(g, Dk, { guc: 0.5, sinir: 0.18, parilti: 0.2, carpan: KC });

  SAHNE.hazir();
})();
