<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-012 Vitray — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #1c1916; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-012 Vitray — kurşun çubuklarla birleştirilmiş renkli cam parçaları, içinden geçen ışık,
// cam dokusu (dalga, kabarcık, yoğunluk farkı), grizay boya ayrıntıları; taş duvarda sivri kemerli pencere.
// Yöntem: her cam parçası bir "kimlik haritası"na kendi rengiyle çizilir; kurşun, kimliğin değiştiği
// kenarlardan Öklid uzaklık dönüşümüyle tek kalınlıkta üretilir; cam piksel piksel renklendirilir.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024 * K, H = 1024 * K, N = W * H;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  const rnd = S.rng(1212);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const scl = (c, k) => [c[0] * k, c[1] * k, c[2] * k];

  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(11), n2 = gurultu(23), n3 = gurultu(37);

  // ------------------------------------------------------------ sahne dönüşümü (pencereye sığsın diye %84)
  const s = 0.84, tx = 512 * (1 - s), ty = 956 - 1000 * s;
  const T = (x, y) => [s * x + tx, s * y + ty];
  const MS = new DOMMatrix([s, 0, 0, s, tx, ty]);
  const PS = (d) => { const p = new Path2D(); p.addPath(new Path2D(d), MS); return p; }; // sahne → ekran

  // ------------------------------------------------------------ pencere geometrisi (sivri kemer)
  const WX1 = 76, WX2 = 948, WTOP = 40, WBOT = 982, BAND = 24, FR = 34;
  const CX = 512, A = (WX2 - WX1) / 2, RR = A * 1.25;
  const CLx = WX1 + RR, CRx = WX2 - RR;
  const YS = WTOP + Math.sqrt(RR * RR - (CLx - CX) * (CLx - CX));
  function kemer(off, yb) {
    const r = RR - off;
    const apexY = YS - Math.sqrt(r * r - (CLx - CX) * (CLx - CX));
    const p = new Path2D();
    p.moveTo(CX - (A - off), yb);
    p.lineTo(CX - (A - off), YS);
    p.arc(CLx, YS, r, Math.PI, Math.atan2(apexY - YS, CX - CLx), false);
    p.arc(CRx, YS, r, Math.atan2(apexY - YS, CX - CRx), 0, false);
    p.lineTo(CX + (A - off), yb);
    p.closePath();
    return p;
  }
  const apexAt = (off) => { const r = RR - off; return YS - Math.sqrt(r * r - (CLx - CX) * (CLx - CX)); };

  // ------------------------------------------------------------ cam parçaları ve kimlik haritası
  const HW = 4.3; // kurşun yarı kalınlığı (2048 px) = kurşun kalınlığı (1024 birim)
  const panes = [null];
  const idc = S.yeniTuval(W, H);
  const ix = idc.getContext('2d', { willReadFrequently: true });
  ix.lineJoin = 'round';
  ix.lineCap = 'round';
  function cam(col, o) {
    o = o || {};
    panes.push({
      col, col2: o.col2 || null, g: o.g || null, rad: o.rad || null,
      ang: o.ang !== undefined ? o.ang : rnd() * Math.PI,
      st: o.st !== undefined ? o.st : 1, rp: o.rp !== undefined ? o.rp : 0.5, rf: o.rf || 0.3 + rnd() * 0.4,
      j: o.j !== undefined ? o.j : (rnd() - 0.5) * 0.1, ox: rnd() * 200, oy: rnd() * 200,
    });
    return panes.length - 1;
  }
  // kimlik rengi 16'lık basamaklarla: kenar yumuşatmasının ±1 yuvarlama hatası kimliği bozmasın
  const idRenk = (id) => `rgb(${((id & 15) << 4) + 8},${(((id >> 4) & 15) << 4) + 8},${(((id >> 8) & 15) << 4) + 8})`;
  // yer: 'e' ekran koordinatı, 's' sahne koordinatı
  function koy(id, yol, o) {
    o = o || {};
    const sahne = o.yer === 's';
    ix.save();
    if (sahne) ix.setTransform(K * s, 0, 0, K * s, K * tx, K * ty); else ix.setTransform(K, 0, 0, K, 0, 0);
    if (o.kirp) { ix.beginPath(); ix.rect(...o.kirp); ix.clip(); }
    ix.fillStyle = ix.strokeStyle = idRenk(id);
    const p = typeof yol === 'string' ? new Path2D(yol) : yol;
    if (o.cizgi) {
      ix.lineWidth = o.cizgi + HW / (sahne ? s : 1);
      ix.stroke(p);
    } else {
      ix.fill(p, o.kural || 'nonzero');
      if (o.sisir !== false) { ix.lineWidth = HW / (sahne ? s : 1); ix.stroke(p); }
    }
    ix.restore();
  }

  // ---- Voronoi (yarı düzlem kırpma)
  function kirpYari(poly, ax, ay, nx, ny) { // nx*(x-ax)+ny*(y-ay) <= 0 tarafı kalır
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const dp = nx * (p[0] - ax) + ny * (p[1] - ay), dq = nx * (q[0] - ax) + ny * (q[1] - ay);
      if (dp <= 0) out.push(p);
      if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
        const t = dp / (dp - dq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }
    }
    return out;
  }
  function voronoi(noktalar, kutu, menzil) {
    const hucre = [];
    for (let i = 0; i < noktalar.length; i++) {
      const [px, py] = noktalar[i];
      let poly = [[kutu[0], kutu[1]], [kutu[2], kutu[1]], [kutu[2], kutu[3]], [kutu[0], kutu[3]]];
      for (let j = 0; j < noktalar.length; j++) {
        if (i === j) continue;
        const [qx, qy] = noktalar[j];
        if (Math.abs(qx - px) > menzil || Math.abs(qy - py) > menzil) continue;
        poly = kirpYari(poly, (px + qx) / 2, (py + qy) / 2, qx - px, qy - py);
        if (!poly.length) break;
      }
      if (poly.length > 2) {
        let cx = 0, cy = 0;
        poly.forEach((p) => { cx += p[0]; cy += p[1]; });
        hucre.push({ poly, cx: cx / poly.length, cy: cy / poly.length });
      }
    }
    return hucre;
  }
  const polyYol = (poly) => S.yol(poly, true);

  // ============================================================ 1. GÖK
  const GUNES = { x: 748, y: 252 };
  function gokRengi(x, y) {
    const t = clamp((y - 50) / 720, 0, 1);
    let c = t < 0.5 ? mix([18, 44, 132], [30, 88, 182], t / 0.5) : mix([30, 88, 182], [104, 160, 216], (t - 0.5) / 0.5);
    const d = Math.hypot(x - GUNES.x, y - GUNES.y);
    const z = rnd();
    if (d < 150) return [[252, 226, 140], [248, 204, 104], [255, 238, 182], [244, 190, 92]][Math.floor(z * 4)];
    if (d < 240) return [[176, 210, 240], [204, 224, 244], [150, 196, 236]][Math.floor(z * 3)];
    return c;
  }
  {
    const nok = [];
    const sp = 62;
    for (let gy = 0; gy * sp * 0.9 < 1000; gy++) {
      for (let gx = -1; gx * sp < 920; gx++) {
        nok.push([WX1 + (gx + 0.5 + (gy % 2) * 0.5) * sp + (rnd() - 0.5) * sp * 0.75, 10 + gy * sp * 0.9 + (rnd() - 0.5) * sp * 0.7]);
      }
    }
    for (const h of voronoi(nok, [WX1 - 20, 0, WX2 + 20, WBOT + 10], sp * 3)) {
      let c = gokRengi(h.cx, h.cy);
      const z = rnd();
      if (Math.hypot(h.cx - GUNES.x, h.cy - GUNES.y) > 240) {
        if (z < 0.1) c = mix(c, [74, 64, 168], 0.35);
        else if (z < 0.2) c = mix(c, [36, 140, 186], 0.3);
      }
      c = scl(c, 0.9 + rnd() * 0.2);
      koy(cam(c, { rp: 0.7, st: 0.9 }), polyYol(h.poly));
    }
  }
  // bulutlar: dilimli opal cam
  const bulutlar = [
    { taban: [128, 300, 268, 322], lob: [[150, 304, 22], [184, 290, 30], [222, 296, 26], [252, 308, 18]] },
    { taban: [418, 198, 520, 214], lob: [[440, 200, 18], [468, 188, 25], [500, 198, 19]] },
    { taban: [758, 428, 900, 450], lob: [[780, 428, 22], [814, 412, 30], [852, 420, 25], [880, 432, 17]] },
    { taban: [128, 468, 232, 486], lob: [[148, 470, 17], [178, 458, 24], [210, 468, 18]] },
    { taban: [612, 136, 696, 150], lob: [[630, 138, 15], [656, 128, 21], [682, 138, 15]] },
  ];
  for (const b of bulutlar) {
    const [x1, y1, x2, y2] = b.taban;
    const tb = new Path2D();
    tb.roundRect(x1, y1, x2 - x1, y2 - y1, (y2 - y1) / 2);
    koy(cam([186, 202, 228], { col2: [214, 224, 240], g: { x0: 0, y0: y2, x1: 0, y1: y1 }, rp: 0.3 }), tb);
    b.lob.forEach(([cx, cy, r], i) => {
      const e = S.elipsYolu({ cx, cy: cy + r * 0.12, rx: r * 1.32, ry: r * 0.86, aci: (i % 2 ? 0.12 : -0.1) });
      koy(cam(mix([222, 230, 244], [244, 246, 250], (i % 2) * 0.7), { col2: [196, 210, 234], g: { x0: cx + r * 0.5, y0: cy - r * 0.7, x1: cx - r * 0.3, y1: cy + r }, rp: 0.25, st: 0.5 }), e);
    });
  }
  // güneş: ışınlar + teker
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.1;
    const L = i % 2 ? 72 : 96, r0 = 40, w = i % 2 ? 0.12 : 0.15;
    const p = [[GUNES.x + Math.cos(a - w) * r0, GUNES.y + Math.sin(a - w) * r0], [GUNES.x + Math.cos(a) * L, GUNES.y + Math.sin(a) * L], [GUNES.x + Math.cos(a + w) * r0, GUNES.y + Math.sin(a + w) * r0]];
    koy(cam(i % 2 ? [250, 204, 86] : [252, 226, 128], { j: 0, rp: 0.3 }), polyYol(p));
  }
  koy(cam([255, 244, 176], { rad: { cx: GUNES.x + 8, cy: GUNES.y - 8, r: 40, c0: [255, 252, 224], k: 0.9 }, col2: null, rp: 0.2, j: 0 }), S.daireYolu(GUNES.x, GUNES.y, 33));

  // ============================================================ 2. ZEMİN (sahnede y > 800)
  {
    const nok = [];
    for (let gy = 0; gy < 6; gy++) for (let gx = -1; gx < 12; gx++) nok.push([WX1 + (gx + (gy % 2) * 0.5) * 84 + (rnd() - 0.5) * 40, 790 + gy * 36 + (rnd() - 0.5) * 18]);
    const zy = T(0, 800)[1];
    for (const h of voronoi(nok, [WX1 - 20, zy - 30, WX2 + 20, WBOT + 10], 260)) {
      const t = clamp((h.cy - zy) / 170, 0, 1);
      let c = mix([206, 156, 78], [156, 104, 48], t);
      if (rnd() < 0.25) c = mix(c, [150, 138, 64], 0.5);
      koy(cam(scl(c, 0.9 + rnd() * 0.2), { rp: 0.4 }), polyYol(h.poly), { kirp: [0, zy, 1024, 1024] });
    }
  }

  // ============================================================ 3. MİNARE
  const MX = 297; // gölge/ışık ayrımı
  const tasSol = [176, 158, 124], tasSolA = [214, 198, 166], tasSag = [236, 226, 200], tasSagA = [252, 247, 232];
  function minareParcasi(yol, x1, x2, koyuluk) {
    const k = koyuluk || 1;
    const [ax] = T(x1, 0), [mx] = T(MX, 0), [bx] = T(x2, 0);
    koy(cam(scl(tasSol, k), { col2: scl(tasSolA, k), g: { x0: ax, y0: 0, x1: mx, y1: 0 }, rp: 0.25, st: 0.7 }), yol, { yer: 's', kirp: [0, 0, MX, 1024] });
    koy(cam(scl(tasSag, k), { col2: scl(tasSagA, k), g: { x0: mx, y0: 0, x1: bx, y1: 0 }, rp: 0.25, st: 0.7 }), yol, { yer: 's', kirp: [MX, 0, 1024, 1024] });
  }
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const parcalar = S.minareParcalari();
  for (const p of parcalar) {
    if (p.ad === 'gövde-alt') {
      for (const [a, b] of [[488, 522], [522, 582], [582, 660], [660, 800]]) minareParcasi(dik(266, a, 334, b), 266, 334);
    } else if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      minareParcasi(S.yol(p.noktalar, true), Math.min(...xs), Math.max(...xs), p.ad.startsWith('çıkma') ? 0.82 : 1);
    } else if (p.tip === 'korkuluk') {
      minareParcasi(dik(p.x1, p.y1, p.x2, p.y2), p.x1, p.x2, 0.95);
    } else if (p.tip === 'topuz') {
      minareParcasi(p.yol, 266, 334, 1);
    }
  }
  const altinCam = (cx, cy, r) => cam([226, 156, 30], { rad: { cx: cx + r * 0.35, cy: cy - r * 0.35, r: r * 1.6, c0: [255, 226, 120], k: 0.9 }, rp: 0.15, st: 0.5, j: 0 });
  function alemKoy(a) {
    const [cx, cy] = T(a.kureler[0].cx, a.kureler[0].cy);
    const id = altinCam(cx, cy - 20 * s, 30 * s);
    const ys = S.yollar;
    // alemin bütün parçaları tek altın cam (incelikleri boya ile)
    const p = new Path2D();
    p.addPath(new Path2D(S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 })));
    p.addPath(new Path2D(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2)));
    a.kureler.forEach((k) => p.addPath(new Path2D(S.daireYolu(k.cx, k.cy, k.r))));
    p.addPath(new Path2D(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R)));
    koy(id, p, { yer: 's' });
  }
  alemKoy(parcalar.find((p) => p.tip === 'alem').alem);

  // ============================================================ 4. KAİDE
  {
    const Kd = S.kaide;
    const [gx0] = T(Kd.x1, 0), [gx1] = T(Kd.x2, 0);
    const kes = [Kd.x1, 365, 495, 625, 755, Kd.x2];
    for (let i = 0; i < kes.length - 1; i++) {
      koy(cam([206, 192, 160], { col2: [250, 244, 226], g: { x0: gx0, y0: 0, x1: gx1, y1: 0 }, rp: 0.3, st: 0.6, j: (rnd() - 0.5) * 0.06 }), dik(kes[i], Kd.y1, kes[i + 1], Kd.y2), { yer: 's' });
    }
    const k = Kd.kornis;
    for (const [a, b] of [[k.x1, 470], [470, 650], [650, k.x2]]) {
      koy(cam([236, 228, 206], { col2: [255, 252, 240], g: { x0: gx0, y0: 0, x1: gx1, y1: 0 }, rp: 0.2, st: 0.5 }), dik(a, k.y1, b, k.y2), { yer: 's' });
    }
    for (const p of Kd.pencereler) {
      const [, y0] = T(0, p.y + p.h), [, y1] = T(0, p.y);
      koy(cam([44, 36, 104], { col2: [92, 70, 150], g: { x0: 0, y0, x1: 0, y1 }, rp: 0.5 }), S.kemerYolu(p.x, p.y, p.w, p.h), { yer: 's' });
    }
  }

  // ============================================================ 5. KASNAK
  function silindirIsik(u) { return clamp(0.42 + 0.5 * (0.8 * u + 0.45 * Math.sqrt(Math.max(0, 1 - u * u))) , 0.12, 1); }
  const yesilKoyu = [8, 52, 26], yesilOrta = [20, 128, 58], yesilAcik = [96, 196, 104];
  const yesil = (l) => (l < 0.6 ? mix(yesilKoyu, yesilOrta, l / 0.6) : mix(yesilOrta, yesilAcik, (l - 0.6) / 0.4));
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    const ps = S.kasnakPencereleri(kat);
    const sinir = [q.x1];
    for (let i = 0; i < ps.length - 1; i++) sinir.push((ps[i].x + ps[i + 1].x) / 2);
    sinir.push(q.x2);
    const yari = (q.x2 - q.x1) / 2, cx = (q.x1 + q.x2) / 2;
    for (let i = 0; i < sinir.length - 1; i++) {
      const u = ((sinir[i] + sinir[i + 1]) / 2 - cx) / yari;
      const l = silindirIsik(u) * (kat === 0 ? 0.92 : 0.86);
      const [, ya] = T(0, q.y2), [, yb] = T(0, q.y1);
      koy(cam(scl(yesil(l), 0.9), { col2: yesil(Math.min(1, l * 1.12)), g: { x0: 0, y0: ya, x1: 0, y1: yb }, rp: 0.35, st: 0.8 }), dik(sinir[i], q.y1, sinir[i + 1], q.y2), { yer: 's' });
    }
    if (kat === 1) {
      for (const p of ps) {
        const [, y0] = T(0, p.y + p.h), [, y1] = T(0, p.y);
        koy(cam([14, 44, 62], { col2: [34, 92, 104], g: { x0: 0, y0, x1: 0, y1 }, rp: 0.4 }), S.kemerYolu(p.x, p.y, p.w, p.h), { yer: 's' });
      }
    }
  }

  // ============================================================ 6. KUBBE
  const prof = S.kubbeProfili(120);
  function rAt(y) {
    if (y >= 555) return 200;
    if (y <= 300) return 0;
    for (let i = 0; i < prof.length - 1; i++) {
      if (y <= prof[i].y && y >= prof[i + 1].y) {
        const t = (prof[i].y - y) / (prof[i].y - prof[i + 1].y || 1);
        return prof[i].r + (prof[i + 1].r - prof[i].r) * t;
      }
    }
    return 0;
  }
  const kubbeU = (k) => Math.sin(-Math.PI / 2 + (Math.PI * k) / 16);
  const SARK = 0.07; // enlem çizgilerinin aşağı sarkması (alttan bakış)
  function enlemY(y0, u) { return y0 + SARK * Math.sqrt(Math.max(0, 1 - u * u)) * rAt(y0); }
  function kubbeNokta(u, y0) { const y = enlemY(y0, u); return [560 + u * rAt(y), y]; }
  function kubbeParcasi(ua, ub, ya, yb) { // ya alt enlem, yb üst enlem (yb < ya); yb null → tepe
    const pts = [];
    const n = 10;
    for (let i = 0; i <= n; i++) pts.push(kubbeNokta(ua + ((ub - ua) * i) / n, ya));
    if (yb === null) { pts.push([560, 300]); return pts; }
    // sağ kaburga yukarı
    const ya2 = enlemY(ya, ub), yb2 = enlemY(yb, ub);
    for (let i = 1; i < 8; i++) { const y = ya2 + ((yb2 - ya2) * i) / 8; pts.push([560 + ub * rAt(y), y]); }
    for (let i = n; i >= 0; i--) pts.push(kubbeNokta(ua + ((ub - ua) * i) / n, yb));
    const ya1 = enlemY(ya, ua), yb1 = enlemY(yb, ua);
    for (let i = 7; i >= 1; i--) { const y = ya1 + ((yb1 - ya1) * i) / 8; pts.push([560 + ua * rAt(y), y]); }
    return pts;
  }
  function kubbeIsik(u, y) {
    const el = clamp((555 - y) / 255, 0, 1) * Math.PI / 2;
    const nx = u * Math.cos(el), ny = -Math.sin(el), nz = Math.sqrt(Math.max(0, 1 - u * u)) * Math.cos(el);
    const L = [0.62, -0.5, 0.6], ln = Math.hypot(...L);

      const yol = new Path2D(S.kemerYolu(p.x, p.y, p.w, p.h));
      ctx.fillStyle = boya(0.86); ctx.fill(yol);
      ctx.strokeStyle = 'rgba(210,255,200,0.18)'; ctx.lineWidth = 1; ctx.stroke(yol);
    }
    for (const p of S.kasnakPencereleri(1)) {
      ctx.strokeStyle = boya(0.4); ctx.lineWidth = 1.2;
      ctx.stroke(new Path2D(S.kemerYolu(p.x, p.y + 4, p.w * 0.55, p.h - 6)));
    }
    for (const q of S.kasnak) {
      const g = ctx.createLinearGradient(q.x1, 0, q.x1 + 140, 0);
      g.addColorStop(0, boya(0.45)); g.addColorStop(1, boya(0));
      ctx.fillStyle = g; ctx.fillRect(q.x1, q.y1, 140, q.y2 - q.y1);
      ctx.fillStyle = boya(0.3); ctx.fillRect(q.x1, q.y2 - 5, q.x2 - q.x1, 5);
    }
  }
  // kaide: taş derzleri, pencere çerçeveleri, sol gölge
  {
    const Kd = S.kaide;
    ctx.strokeStyle = boya(0.22); ctx.lineWidth = 1;
    for (const y of [736, 768]) { ctx.beginPath(); ctx.moveTo(Kd.x1, y); ctx.lineTo(Kd.x2, y); ctx.stroke(); }
    const rs = S.rng(8);
    for (let row = 0; row < 3; row++) {
      const y1 = [704, 736, 768][row], y2 = y1 + 32;
      for (let x = Kd.x1 + 20 + row * 27 + rs() * 10; x < Kd.x2; x += 54 + rs() * 12) {
        if (Kd.pencereler.some((p) => Math.abs(x - p.x) < p.w * 0.9)) continue;
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
      }
    }
    for (const p of Kd.pencereler) {
      ctx.strokeStyle = boya(0.5); ctx.lineWidth = 1.6;
      ctx.stroke(new Path2D(S.kemerYolu(p.x, p.y - 4, p.w + 8, p.h + 4)));
    }
    const g = ctx.createLinearGradient(Kd.x1, 0, Kd.x1 + 200, 0);
    g.addColorStop(0, boya(0.35)); g.addColorStop(1, boya(0));
    ctx.fillStyle = g; ctx.fillRect(Kd.x1, Kd.y1, 200, Kd.y2 - Kd.y1);
    ctx.fillStyle = boya(0.28); ctx.fillRect(Kd.x1, Kd.y1, Kd.x2 - Kd.x1, 4);
  }
  // minare: zikzak, korkuluk babaları, pencereler, topuz dilimleri
  {
    ctx.strokeStyle = boya(0.78); ctx.lineWidth = 2.6;
    for (const z of S.zikzakCizgileri()) ctx.stroke(new Path2D(S.yol(z)));
    for (const p of parcalar) {
      if (p.tip === 'korkuluk') {
        ctx.fillStyle = boya(0.62);
        for (let i = 0; i < 8; i++) { const x = p.x1 + 7 + ((p.x2 - p.x1 - 14) * (i + 0.5)) / 8; ctx.fillRect(x - 2.2, p.y1 + 4, 4.4, p.y2 - p.y1 - 8); }
        ctx.fillStyle = boya(0.4); ctx.fillRect(p.x1, p.y1, p.x2 - p.x1, 3);
      }
      if (p.ad.startsWith('şerefe')) { ctx.fillStyle = boya(0.35); ctx.fillRect(p.noktalar[0][0], p.noktalar[2][1] - 3, p.noktalar[1][0] - p.noktalar[0][0], 3); }
    }
    for (const p of S.minarePencereleri) { ctx.fillStyle = boya(0.85); ctx.fill(new Path2D(S.kemerYolu(p.x, p.y, p.w, p.h))); }
    ctx.strokeStyle = boya(0.4); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(300, 150); ctx.quadraticCurveTo(292, 176, 290, 198); ctx.stroke();
    // minare alemi incelikleri
    const a = parcalar.find((p) => p.tip === 'alem').alem;
    ctx.strokeStyle = boya(0.6); ctx.lineWidth = 0.9;
    a.kureler.forEach((k) => ctx.stroke(new Path2D(S.daireYolu(k.cx, k.cy, k.r))));
  }
  // alem: küre gölgeleri
  {
    const a = S.alemParcalari(560, 300, 1);
    ctx.strokeStyle = boya(0.55); ctx.lineWidth = 1.1;
    for (const k of a.kureler) { ctx.beginPath(); ctx.arc(k.cx, k.cy, k.r * 0.72, Math.PI * 0.55, Math.PI * 1.25); ctx.stroke(); }
  }
  // yaprak damarları, çiçek ercikleri
  {
    for (const y of yapraklar) {
      const ca = Math.cos(y.aci), sa = Math.sin(y.aci), L = y.uzunluk, Wd = L * y.genislik;
      ctx.strokeStyle = 'rgba(20,46,12,0.42)'; ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (const t of [0.3, 0.5, 0.7]) {
        for (const sgn of [-1, 1]) {
          const bx = y.x + ca * L * t, by = y.y + sa * L * t;
          const u = L * (t + 0.14), vv = sgn * Wd * 0.42 * (1 - t * 0.6);
          ctx.moveTo(bx, by); ctx.lineTo(y.x + u * ca - vv * sa, y.y + u * sa + vv * ca);
        }
      }
      ctx.stroke();
    }
    for (const c of cicekler) {
      if (c.tek) { // tek parça çiçekte taç yaprak ayrımları boyalı
        ctx.strokeStyle = boya(0.55); ctx.lineWidth = 1.6;
        ctx.save(); ctx.clip(new Path2D(S.tacYapraklari(c).map(S.elipsYolu).join(' ')));
        for (const e of S.tacYapraklari(c)) ctx.stroke(new Path2D(S.elipsYolu(e)));
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(150,80,96,0.28)'; ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (const e of S.tacYapraklari(c)) {
        for (const d of [-0.22, 0, 0.22]) {
          const a = e.aci + d;
          ctx.moveTo(c.x + Math.cos(a) * c.r * 0.24, c.y + Math.sin(a) * c.r * 0.24);
          ctx.lineTo(c.x + Math.cos(a) * c.r * (0.62 + Math.abs(d)), c.y + Math.sin(a) * c.r * (0.62 + Math.abs(d)));
        }
      }
      ctx.stroke();
      ctx.fillStyle = boya(0.75);
      for (let i = 0; i < 11; i++) {
        const a = (i / 11) * Math.PI * 2;
        ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * c.r * 0.27, c.y + Math.sin(a) * c.r * 0.27, Math.max(1, c.r * 0.034), 0, Math.PI * 2); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.08, 0, Math.PI * 2); ctx.fillStyle = boya(0.3); ctx.fill();
    }
  }
  ctx.restore();

  // ---- grizay boya (ekran koordinatında): bulut, bordür rozetleri
  ctx.save();
  ctx.clip(camYolu);
  ctx.lineCap = 'round';
  for (const b of bulutlar) {
    ctx.strokeStyle = 'rgba(60,72,110,0.28)'; ctx.lineWidth = 1;
    for (const [cx, cy, r] of b.lob) { ctx.beginPath(); ctx.arc(cx, cy + 2, r * 0.66, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); }
  }
  for (const [x, y] of bordurAltinlari) {
    ctx.fillStyle = boya(0.7);
    for (let i = 0; i < 4; i++) { const a = (i / 4) * Math.PI * 2 + Math.PI / 4; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 3.6, y + Math.sin(a) * 3.6, 2.1, 0, Math.PI * 2); ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  // güneşin içinde ince ışın çizgileri
  ctx.strokeStyle = 'rgba(170,110,20,0.25)'; ctx.lineWidth = 0.8;
  for (let i = 0; i < 32; i++) { const a = (i / 32) * Math.PI * 2; ctx.beginPath(); ctx.moveTo(GUNES.x + Math.cos(a) * 12, GUNES.y + Math.sin(a) * 12); ctx.lineTo(GUNES.x + Math.cos(a) * 28, GUNES.y + Math.sin(a) * 28); ctx.stroke(); }
  // kabarcıklar (tohum)
  const rb = S.rng(77);
  // yalnızca "tohumlu" camlarda (parçaların kabaca üçte biri) kabarcık olur; kar tanesi gibi her yere serpilmez
  const tohumlu = (id) => ((Math.imul(id, 2654435761) >>> 0) % 100) < 34;
  for (let i = 0; i < 2600; i++) {
    const x = WX1 + rb() * (WX2 - WX1), y = WTOP + rb() * (WBOT - WTOP);
    const p = Math.round(y * K) * W + Math.round(x * K);
    if (!ids[p] || uzak[p] < HW + 2 || !tohumlu(ids[p])) continue;
    const r = 0.35 + rb() * rb() * 1.5;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  }
  ctx.restore();

  // ---- kurşun
  ctx.drawImage(kurC, 0, 0, 1024, 1024);
  // ---- ışık taşması (halation)
  ctx.save();
  ctx.clip(kemer(-2, WBOT));
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.4;
  ctx.filter = 'blur(9px)';
  ctx.drawImage(parC, 0, 0, 1024, 1024);
  ctx.globalAlpha = 0.2;
  ctx.filter = 'blur(28px)';
  ctx.drawImage(parC, 0, 0, 1024, 1024);
  ctx.restore();

  // ============================================================ 12. TAŞ ÇERÇEVE (kemer taşları, söve, denizlik)
  {
    const r0 = RR + 1.5, r1 = RR + FR;
    const aL0 = Math.PI, aL1 = Math.atan2(apexAt(0) - YS, CX - CLx) + Math.PI * 2;
    const aR0 = 0, aR1 = Math.atan2(apexAt(0) - YS, CX - CRx);
    const rs = S.rng(19);
    const tas = (v) => { const g = 58 * v; return `rgb(${g + 22 | 0},${g + 14 | 0},${g + 6 | 0})`; };
    function kemerTasi(cx, a0, a1, uzat) {
      const p = new Path2D();
      p.arc(cx, YS, r1 + uzat, a0, a1, a1 < a0);
      p.arc(cx, YS, r0, a1, a0, !(a1 < a0));
      p.closePath();
      ctx.fillStyle = tas(0.95 + rs() * 0.35); ctx.fill(p);
      ctx.strokeStyle = '#15120f'; ctx.lineWidth = 2; ctx.stroke(p);
    }
    const n = 9;
    for (let i = 0; i < n; i++) {
      kemerTasi(CLx, aL0 + ((aL1 - aL0) * i) / n, aL0 + ((aL1 - aL0) * (i + 1)) / n, i % 2 ? 6 : 0);
      kemerTasi(CRx, aR0 + ((aR1 - aR0) * i) / n, aR0 + ((aR1 - aR0) * (i + 1)) / n, i % 2 ? 6 : 0);
    }
    // kilit taşı
    {
      const ay = apexAt(0);
      const p = new Path2D();
      p.moveTo(CX - 14, ay + 2); p.lineTo(CX + 14, ay + 2); p.lineTo(CX + 24, ay - FR - 14); p.lineTo(CX - 24, ay - FR - 14); p.closePath();
      ctx.fillStyle = tas(1.3); ctx.fill(p); ctx.strokeStyle = '#15120f'; ctx.lineWidth = 2; ctx.stroke(p);
    }
    // söveler
    for (const sx of [WX1, WX2]) {
      let y = YS, i = 0;
      while (y < WBOT) {
        const h = Math.min(i % 2 ? 54 : 72, WBOT - y);
        const w = FR + (i % 2 ? 0 : 12);
        const x = sx === WX1 ? WX1 - w : WX2;
        ctx.fillStyle = tas(0.95 + rs() * 0.35);
        ctx.fillRect(x + (sx === WX1 ? 0 : -1.5), y, w + 1.5, h);
        ctx.strokeStyle = '#15120f'; ctx.lineWidth = 2; ctx.strokeRect(x + (sx === WX1 ? 0 : -1.5), y, w + 1.5, h);
        y += h; i++;
      }
    }
    // pencere kenarı pahı: camdan gelen renkli ışık
    ctx.save();
    const pah = new Path2D();
    pah.addPath(kemer(-9, WBOT));
    pah.addPath(kemer(0, WBOT));
    ctx.clip(pah, 'evenodd');
    ctx.fillStyle = 'rgba(120,110,100,0.55)'; ctx.fillRect(0, 0, 1024, 1024);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.5;
    ctx.filter = 'blur(10px)';
    ctx.drawImage(camC, 0, 0, 1024, 1024);
    ctx.restore();
    ctx.strokeStyle = 'rgba(15,12,10,0.8)'; ctx.lineWidth = 1.5; ctx.stroke(kemer(-9, WBOT));
    // denizlik
    const g = ctx.createLinearGradient(0, WBOT, 0, 1024);
    g.addColorStop(0, '#7a6e62'); g.addColorStop(0.22, '#5d544b'); g.addColorStop(0.25, '#3a332d'); g.addColorStop(1, '#25201c');
    ctx.fillStyle = g;
    ctx.fillRect(WX1 - FR - 18, WBOT, WX2 - WX1 + 2 * FR + 36, 1024 - WBOT);
    ctx.fillStyle = 'rgba(255,240,200,0.12)'; ctx.fillRect(WX1 - FR - 18, WBOT, WX2 - WX1 + 2 * FR + 36, 2);
  }
  // taş dokusu ve köşe kararması
  {
    const tc = S.yeniTuval(512, 512), tx2 = tc.getContext('2d');
    const im = tx2.createImageData(512, 512);
    for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
      const v = 0.5 * n1(x * 0.09, y * 0.09) + 0.3 * n2(x * 0.3, y * 0.3) + 0.2 * n3(x * 0.9, y * 0.9);
      const c = 150 + v * 105;
      const i = (y * 512 + x) * 4;
      im.data[i] = c; im.data[i + 1] = c * 0.97; im.data[i + 2] = c * 0.93; im.data[i + 3] = 255;
    }
    tx2.putImageData(im, 0, 0);
    ctx.save();
    const dis = new Path2D();
    dis.rect(0, 0, 1024, 1024);
    dis.addPath(kemer(0, WBOT));
    ctx.clip(dis, 'evenodd');
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(tc, 0, 0, 1024, 1024);
    ctx.globalCompositeOperation = 'source-over';
    const v = ctx.createRadialGradient(512, 560, 380, 512, 560, 760);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, 1024, 1024);
    // pencereden duvara vuran hafif ışık
    ctx.globalCompositeOperation = 'screen';
    const l = ctx.createRadialGradient(512, 500, 300, 512, 500, 620);
    l.addColorStop(0, 'rgba(120,130,160,0.22)'); l.addColorStop(1, 'rgba(120,130,160,0)');
    ctx.fillStyle = l; ctx.fillRect(0, 0, 1024, 1024);
    ctx.restore();
  }

  SAHNE.hazir();
})();
</script>
