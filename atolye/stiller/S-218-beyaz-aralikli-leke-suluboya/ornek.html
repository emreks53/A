<script>
// ======================================================================= suluboya motoru (ressamın aletleri)
// Ortak sahne: ../../sahne/SAHNE.md. Bu bölüm: gürültü, kâğıt dokusu, yol örnekleme, elle çekilmiş çizgi
// ve saydam lavi katları. Her lavi kâğıda bir "pigment yoğunluğu" ekler; üst üste binen katlar çarpılarak
// koyulaşır (gerçek suluboya sırlaması gibi). Rastgelelik yalnız SAHNE.rng ile: görsel her seferinde aynı çıkar.
const S = SAHNE;
const OL = 2; // çalışma ölçeği: 2048 piksel, koordinatlar 1024
const WW = 1024 * OL;
const NS = 'http://www.w3.org/2000/svg';

const kenet = (v, a, b) => (v < a ? a : v > b ? b : v);
const yumusak = (a, b, v) => {
  const t = kenet((v - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/** Tohumlu değer gürültüsü: n(x,y) ∈ [0,1], fbm(x,y,oktav). */
function gurultu(tohum) {
  const r = S.rng(tohum);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = perm[i];
    perm[i] = perm[j];
    perm[j] = t;
  }
  const p = new Uint16Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = r();
  const h = (i, j) => g[p[p[i & 255] + (j & 255)]];
  function n(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    let u = x - xi;
    let v = y - yi;
    u = u * u * (3 - 2 * u);
    v = v * v * (3 - 2 * v);
    const a = h(xi, yi);
    const b = h(xi + 1, yi);
    const c = h(xi, yi + 1);
    const d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4;
    let s = 0;
    let a = 1;
    let t = 0;
    for (let k = 0; k < o; k++) {
      s += a * n(x, y);
      t += a;
      a *= 0.5;
      x = x * 2 + 17.3;
      y = y * 2 + 9.1;
    }
    return s / t;
  }
  return { n, fbm };
}
const NZ = gurultu(4242);

/** Tamsayı karması → [0,1). */
function karma(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- yol örnekleme
const _svg = document.createElementNS(NS, 'svg');
_svg.setAttribute('width', '1');
_svg.setAttribute('height', '1');
_svg.style.cssText = 'position:absolute;left:-20px;top:-20px;width:1px;height:1px;overflow:hidden';
document.body.appendChild(_svg);
/** d yolunu alt yollarına böler, eşit aralıklı noktalara çevirir: [{pts, kapali}] */
function ornekle(d, adim) {
  adim = adim || 1.2;
  const parcalar = d.match(/M[^M]*/g) || [];
  return parcalar.map((pd) => {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', pd);
    _svg.appendChild(el);
    const L = el.getTotalLength();
    const n = Math.max(2, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = el.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    _svg.removeChild(el);
    const kapali = /Z\s*$/i.test(pd.trim());
    if (kapali && pts.length > 3) pts.pop();
    return { pts, kapali };
  });
}

/** Kırık çizgiyi eşit aralıklarla yeniden örnekler. */
function yenidenOrnekle(pts, adim, kapali) {
  if (kapali) pts = pts.concat([pts[0]]);
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const seg = Math.hypot(x1 - x0, y1 - y0);
    if (seg === 0) continue;
    let pos = 0;
    while (acc + (seg - pos) >= adim) {
      pos += adim - acc;
      acc = 0;
      const t = pos / seg;
      out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
    }
    acc += seg - pos;
  }
  const son = pts[pts.length - 1];
  const o = out[out.length - 1];
  if (!kapali && Math.hypot(son[0] - o[0], son[1] - o[1]) > adim * 0.25) out.push(son.slice());
  if (kapali && out.length > 3) {
    const a = out[0];
    const b = out[out.length - 1];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < adim * 0.5) out.pop();
  }
  return out;
}

function normaller(pts, kapali) {
  const n = pts.length;
  const N = [];
  for (let i = 0; i < n; i++) {
    let a = pts[Math.max(0, i - 1)];
    let b = pts[Math.min(n - 1, i + 1)];
    if (kapali) {
      a = pts[(i - 1 + n) % n];
      b = pts[(i + 1) % n];
    }
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    N.push([-dy / l, dx / l]);
  }
  return N;
}

let _ofs = 0;
/** Kapalı ya da açık nokta dizisinin kenarını elle titretir (düşük frekanslı oynama). */
function titret(pts, kapali, amp, fr, adim) {
  adim = adim || 1.5;
  const p = yenidenOrnekle(pts, adim, kapali);
  const N = normaller(p, kapali);
  const ofs = (_ofs += 7.9);
  const n = p.length;
  const L = n * adim;
  const R = (L * fr) / (2 * Math.PI);
  return p.map((q, i) => {
    let v;
    if (kapali) {
      const th = (i / n) * Math.PI * 2;
      v = (NZ.n(Math.cos(th) * R + ofs, Math.sin(th) * R + ofs * 0.3) - 0.5) * 2 + (NZ.n(Math.cos(th) * R * 3 + ofs + 50, Math.sin(th) * R * 3) - 0.5) * 0.6;
    } else {
      v = (NZ.n(i * adim * fr + ofs, ofs * 0.3) - 0.5) * 2 + (NZ.n(i * adim * fr * 3 + ofs + 50, 2.2) - 0.5) * 0.6;
    }
    return [q[0] + N[i][0] * amp * v, q[1] + N[i][1] * amp * v];
  });
}

/** Şekil: Path2D + sınır kutusu. polys: [[x,y]...] dizileri (kapalı). */
function sekil(polys, kural) {
  const yol = new Path2D();
  let x0 = 1e9;
  let y0 = 1e9;
  let x1 = -1e9;
  let y1 = -1e9;
  for (const p of polys) {
    p.forEach(([x, y], i) => {
      if (i) yol.lineTo(x, y);
      else yol.moveTo(x, y);
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    });
    yol.closePath();
  }
  return { yol, x0, y0, x1, y1, polys, kural: kural || 'nonzero' };
}
/** SVG yol dizgisinden elle titretilmiş şekil. */
function sekilYol(d, amp, fr, adim) {
  const polys = ornekle(d, adim || 1.5).map((p) => (amp ? titret(p.pts, true, amp, fr || 0.04, adim || 1.5) : p.pts));
  return sekil(polys);
}
/** Nokta dizisinden elle titretilmiş kapalı şekil. */
function sekilPoli(pts, amp, fr, adim) {
  return sekil([amp ? titret(pts, true, amp, fr || 0.04, adim || 1.5) : pts]);
}
/** Şekilleri birleştirir. */
function birlesik(liste) {
  return sekil(liste.flatMap((s) => s.polys));
}

/**
 * Elle çekilmiş çizginin şeridi (Path2D'ye eklenir): w kalınlık, titreme, frek, basinc (kalınlık oynaması),
 * basSivri / sonSivri (uçlarda incelme, px), civi (başlangıçta basınç düğümü, px)
 */
function seritPoli(pts, o) {
  const n = pts.length;
  if (n < 2) return null;
  const ofs = o.ofs != null ? o.ofs : (_ofs += 11.3);
  const s = new Float32Array(n);
  for (let i = 1; i < n; i++) s[i] = s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const L = s[n - 1];
  const N = normaller(pts, false);
  const amp = o.titreme != null ? o.titreme : 0.5;
  const fr = o.frek != null ? o.frek : 0.02;
  const bas = o.basinc != null ? o.basinc : 0.25;
  const a1 = o.basSivri != null ? o.basSivri : o.sivri || 0;
  const a2 = o.sonSivri != null ? o.sonSivri : o.sivri || 0;
  const sol = [];
  const sag = [];
  for (let i = 0; i < n; i++) {
    const t = s[i];
    const q1 = NZ.n(t * fr + ofs, ofs * 0.37);
    const q2 = NZ.n(t * fr * 3.1 + ofs + 40, 5.5);
    const q3 = NZ.n(t * fr * 0.7 + ofs + 90, 3.3);
    const off = amp * ((q1 - 0.5) * 2 + (q2 - 0.5));
    let w = o.w * (1 + bas * (q3 - 0.5) * 2);
    if (o.profil) w *= o.profil(t / (L || 1));
    if (a1 > 0 && t < a1) w *= 0.25 + 0.75 * Math.sin(((Math.PI / 2) * t) / a1);
    if (a2 > 0 && L - t < a2) w *= 0.1 + 0.9 * Math.sin(((Math.PI / 2) * (L - t)) / a2);
    if (o.civi && t < o.civi * 2.2) w *= 1 + 0.45 * Math.exp(-Math.pow((t - o.civi * 0.6) / o.civi, 2));
    const x = pts[i][0] + N[i][0] * off;
    const y = pts[i][1] + N[i][1] * off;
    sol.push([x + (N[i][0] * w) / 2, y + (N[i][1] * w) / 2]);
    sag.push([x - (N[i][0] * w) / 2, y - (N[i][1] * w) / 2]);
  }
  return sol.concat(sag.reverse());
}
/** Nokta dizisini elle çekilmiş çizgi şekline çevirir. */
function cizgiSekil(pts, o) {
  const p = seritPoli(yenidenOrnekle(pts, o.adim || 1.1), o);
  return sekil([p]);
}

// ---------------------------------------------------------------- kâğıt
const KAGIT = new Float32Array(WW * WW); // kâğıt yüzeyinin yüksekliği (0 çukur … 1 tepe)
/**
 * Kâğıt dokusu. o.tane: diş boyu (px, 1024 biriminde), o.iri: iri dalga payı, o.lif: lif çizgisi payı.
 */
function kagitKur(o) {
  const nz1 = gurultu(o.tohum || 11);
  const nz2 = gurultu((o.tohum || 11) + 1);
  const f1 = 1 / ((o.tane || 3) * OL);
  const f2 = f1 / 3.2;
  const iri = o.iri != null ? o.iri : 0.35;
  const lif = o.lif || 0;
  const tepe = o.tepe != null ? o.tepe : 1;
  let mn = 1e9;
  let mx = -1e9;
  for (let y = 0; y < WW; y++) {
    for (let x = 0; x < WW; x++) {
      let v = nz1.n(x * f1, y * f1) * 0.6 + nz1.n(x * f1 * 2.1 + 7, y * f1 * 2.1 + 3) * 0.25 + nz2.n(x * f2, y * f2) * iri;
      if (lif) v += lif * (nz2.n(x * f1 * 0.25 + 40, y * f1 * 2.5) - 0.5);
      if (tepe !== 1) v = Math.pow(Math.max(0, v), tepe);
      KAGIT[y * WW + x] = v;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
  }
  const k = 1 / (mx - mn);
  for (let i = 0; i < KAGIT.length; i++) KAGIT[i] = (KAGIT[i] - mn) * k;
}

// ---------------------------------------------------------------- pigment yoğunlukları ve lavi
const D = [new Float32Array(WW * WW), new Float32Array(WW * WW), new Float32Array(WW * WW)];
/** Geniş ölçekli düzgünsüzlük dokusu (lavinin elle sürülmüş dalgası). 512², döşenebilir değil ama büyük. */
const DALGA = (function () {
  const nz = gurultu(909);
  const a = new Float32Array(512 * 512);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) a[y * 512 + x] = nz.fbm(x / 22, y / 22, 4);
  return a;
})();

/** Renkten (hex) RGB optik yoğunluk vektörü: kâğıdı o renge boyayan tam kat × k. */
function od(h, k) {
  const c = hex(h);
  k = k == null ? 1 : k;
  return c.map((v) => -Math.log(Math.max(4, v) / 252) * k);
}

/**
 * Kâğıdı ve yoğunlukları son görüntüye çevirir. renk(d0,d1,d2,P,out) → out[0..2] (0..255).
 * Kâğıt dişi sağ üstten gelen ışıkla hafifçe gölgelenir.
 */
function bitir(renk, o) {
  o = o || {};
  const c = document.createElement('canvas');
  c.width = WW;
  c.height = WW;
  const x = c.getContext('2d', { willReadFrequently: true });
  const im = x.createImageData(WW, WW);
  const d = im.data;
  const out = [0, 0, 0];
  const dis = o.dis != null ? o.dis : 0.07;
  const yon = OL - OL * WW; // sağ üst komşu
  for (let i = 0; i < WW * WW; i++) {
    const P = KAGIT[i];
    renk(D[0][i], D[1][i], D[2][i], P, out);
    const j = i + yon;
    const sh = j >= 0 ? 1 + dis * (P - KAGIT[j]) : 1;
    const k = i * 4;
    d[k] = out[0] * sh;
    d[k + 1] = out[1] * sh;
    d[k + 2] = out[2] * sh;
    d[k + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return { c, x };
}

/** Çalışma tuvalini (2048) ekrandaki 1024 tuvale indirir. */
function ekranaAktar(calisma) {
  const cv = document.getElementById('tuval');
  cv.width = 1024;
  cv.height = 1024;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(calisma, 0, 0, 1024, 1024);
  return ctx;
}

// ---------------------------------------------------------------- sahne yardımcıları
const _prof = S.kubbeProfili(400);
/** Kubbe profilinden y → yarıçap. */
function kubbeR(y) {
  if (y >= 555) return 200;
  if (y <= 300) return 0;
  for (let i = 0; i < _prof.length - 1; i++) {
    const a = _prof[i];
    const b = _prof[i + 1];
    if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
  }
  return 0;
}
/** Kubbede boylam aralığı [b1,b2] (radyan, -π/2..π/2) ve yükseklik aralığı [ya,yb] arasındaki dilim çokgeni. */
function kubbeDilimi(b1, b2, ya, yb, n) {
  n = n || 40;
  const sol = [];
  const sag = [];
  for (let i = 0; i <= n; i++) {
    const y = ya + ((yb - ya) * i) / n;
    const r = kubbeR(y);
    sol.push([560 + Math.sin(b1) * r, y]);
    sag.push([560 + Math.sin(b2) * r, y]);
  }
  return sol.concat(sag.reverse());
}
const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
/** Sivri kemer çokgeni. */
function kemerPoli(x, y, w, h) {
  return ornekle(S.kemerYolu(x, y, w, h), 0.8)[0].pts;
}
function elips(cx, cy, rx, ry, aci, n) {
  n = n || 48;
  const ca = Math.cos(aci || 0);
  const sa = Math.sin(aci || 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const u = Math.cos(t) * rx;
    const v = Math.sin(t) * ry;
    out.push([cx + u * ca - v * sa, cy + u * sa + v * ca]);
  }
  return out;
}

// ---------------------------------------------------------------- sahne biçimleri (ressamın ölçülü çizimi)
function bez3(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
}
/** Yaprak: tam biçim ve orta damarla ayrılmış iki yarısı (yerel koordinatta hesaplanıp döndürülür). */
function yaprakBicimi(y, bosluk) {
  const L = y.uzunluk;
  const W = L * y.genislik;
  const ca = Math.cos(y.aci);
  const sa = Math.sin(y.aci);
  const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
  const n = 18;
  const ust = [];
  const alt = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    ust.push(bez3([0, 0], [L * 0.35, -W * 0.75], [L * 0.8, -W * 0.45], [L, 0], t));
    alt.push(bez3([0, 0], [L * 0.35, W * 0.75], [L * 0.8, W * 0.45], [L, 0], t));
  }
  const g = (bosluk || 0) / 2;
  const damar = [];
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    damar.push([L * t, -W * 0.06 * Math.sin(Math.PI * t)]);
  }
  const yarim1 = ust.concat(damar.map(([u, v]) => [u, v - g * Math.sin(Math.PI * Math.min(1, (u / L) * 1.3 + 0.08))]));
  const yarim2 = alt.concat(damar.map(([u, v]) => [u, v + g * Math.sin(Math.PI * Math.min(1, (u / L) * 1.3 + 0.08))]));
  const tam = ust.concat(alt.slice().reverse().slice(1));
  const T = (arr) => arr.map(([u, v]) => p(u, v));
  // ışık sağ üstten: yarının dış normali ışığa bakıyor mu?
  const nx = -(-sa);
  const ny = -ca; // üst yarı (v<0) yönü
  const isikUst = nx * 0.66 + ny * -0.75 > 0;
  return { tam: T(tam), yarim: [T(yarim1), T(yarim2)], isikli: isikUst ? 0 : 1, damar: T(damar.slice().reverse()), ucu: p(L, 0) };
}
/** Beş taç yapraklı çiçeğin taç yaprakları (uçta hafif çentik) ve gölge yarıları. */
function cicekBicimi(c) {
  const out = { taclar: [], golgeler: [], ic: [] };
  const Lx = 0.66;
  const Ly = -0.75;
  for (let i = 0; i < 5; i++) {
    const a = c.aci + (i * Math.PI * 2) / 5;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    const R = c.r;
    const pts = [];
    const n = 56;
    for (let k = 0; k < n; k++) {
      const t = (k / n) * Math.PI * 2;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41;
      const tt = Math.atan2(Math.sin(t), Math.cos(t));
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2)); // uçtaki çentik
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7; // dipte daralma
      pts.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.taclar.push(pts);
    // gölge tarafı: v ekseni ışığa bakmıyorsa v>0 yarısı gölgede
    const vx = -sa;
    const vy = ca;
    const isaret = vx * Lx + vy * Ly > 0 ? -1 : 1;
    const g = [];
    for (let k = 0; k <= 28; k++) {
      const t = (k / 28) * Math.PI;
      let u = R * 0.53 + Math.cos(t) * R * 0.5;
      let v = Math.sin(t) * R * 0.41 * isaret;
      const tt = t;
      u -= R * 0.085 * Math.exp(-Math.pow(tt / 0.22, 2));
      if (Math.cos(t) < -0.3) v *= 0.75 + 0.25 * (1 + Math.cos(t)) / 0.7;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    for (let k = 10; k >= 0; k--) {
      const u = R * 0.03 + (R * 0.97 * k) / 10;
      const v = R * 0.05 * Math.sin((Math.PI * k) / 10) * isaret;
      g.push([c.x + u * ca - v * sa, c.y + u * sa + v * ca]);
    }
    out.golgeler.push(g);
    out.ic.push(a);
  }
  return out;
}
/** Sahnedeki bütün biçimler (titreme genliği amp). */
function sahneSekilleri(amp) {
  amp = amp == null ? 0.6 : amp;
  const G = {};
  const fr = 0.05;
  G.minareParca = {};
  const minareListe = [];
  for (const p of S.minareParcalari()) {
    if (p.tip === 'poligon') G.minareParca[p.ad] = sekilPoli(p.noktalar, amp, fr);
    else if (p.tip === 'korkuluk' || p.tip === 'bant') G.minareParca[p.ad] = sekilPoli(dikd(p.x1, p.y1, p.x2, p.y2), amp, fr);
    else if (p.tip === 'topuz') G.minareParca[p.ad] = sekilYol(p.yol, amp * 0.6, fr);
    else if (p.tip === 'alem') G.minareAlemP = p.alem;
    if (G.minareParca[p.ad]) minareListe.push(G.minareParca[p.ad]);
  }
  G.minare = birlesik(minareListe);
  const alemSekilleri = (a, k) => ({
    yaka: sekilPoli(elips(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 40), amp * 0.3 * k, 0.1, 0.8),
    cubuk: sekilPoli(dikd(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), amp * 0.2 * k, 0.1, 0.8),
    kureler: a.kureler.map((q) => sekilPoli(elips(q.cx, q.cy, q.r, q.r, 0, 36), amp * 0.25 * k, 0.12, 0.7)),
    hilal: sekilYol(S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), amp * 0.15 * k, 0.12, 0.6),
  });
  G.minareAlem = alemSekilleri(G.minareAlemP, 0.6);
  G.alemP = S.alemParcalari(560, 300, 1);
  G.alem = alemSekilleri(G.alemP, 1);
  const alemListe = (A) => [A.yaka, A.cubuk, ...A.kureler, A.hilal];
  const K = S.kaide;
  G.kaide = sekilPoli(dikd(K.x1, K.y1, K.x2, K.y2), amp, fr);
  G.kornis = sekilPoli(dikd(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), amp * 0.7, fr);
  G.kaidePencere = K.pencereler.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.5, 0.08, 1));
  G.kasnak = S.kasnak.map((q) => sekilPoli(dikd(q.x1, q.y1, q.x2, q.y2), amp, fr));
  G.kasnakPencereP = [0, 1].map((k) => S.kasnakPencereleri(k));
  G.kasnakPencere = G.kasnakPencereP.map((L) => L.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8)));
  G.minarePencere = S.minarePencereleri.map((p) => sekilPoli(kemerPoli(p.x, p.y, p.w, p.h), amp * 0.4, 0.1, 0.8));
  G.kubbe = sekilPoli(S.kubbeNoktalari(80), amp, fr);
  G.yapi = birlesik([G.minare, ...alemListe(G.minareAlem), G.kaide, G.kornis, ...G.kasnak, G.kubbe, ...alemListe(G.alem)]);
  // bitkiler
  const B = S.bitki;
  G.yapraklar = B.yapraklar.map((y) => Object.assign({ y }, yaprakBicimi(y, 1.4)));
  G.cicekler = B.cicekler.map((c) => Object.assign({ c }, cicekBicimi(c)));
  G.cicekSekil = sekil(G.cicekler.flatMap((c) => c.taclar));
  G.tomurcuklar = B.tomurcuklar.map((t, i) => ({ t, i, pts: ornekle(S.tomurcukYolu(t), 1)[0].pts }));
  G.tomurcukSekil = sekil(G.tomurcuklar.map((t) => t.pts));
  G.saplar = B.saplar;
  return G;
}

/**
 * Bulut kümesi: tabanı düz, farklı boyda birkaç tümseğin birleşimi (her tümsek elle titretilmiş yassı elips).
 * Döner: {sk: bütün bulut (birleşim), lobes, golge(oran, ek): tabandan oran·h yüksekliğe kadar alt kısım (birleşim)}
 * Gölgenin üst sınırı tümseklerin çizgisini izlemez, hafif dalgalı yatay bir çizgidir (ışık tepeleri açık bırakır).
 */
function bulutKumesi(x0, x1, taban, h, tohum, o) {
  o = o || {};
  const r = S.rng(tohum);
  const nz = gurultu(tohum);
  const w = x1 - x0;
  const lob = [];
  const n = Math.max(3, Math.round(w / (o.lobBoy || 58)));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5 + (r() - 0.5) * 0.7) / n;
    const env = Math.pow(Math.sin(Math.PI * kenet(t, 0.02, 0.98)), 0.7);
    const ry = h * (0.3 + 0.7 * env * (0.55 + 0.45 * r()));
    const rx = Math.min(w * 0.3, ry * (1.05 + 0.7 * r()));
    lob.push({ cx: x0 + w * t, cy: taban - ry * (0.62 + 0.15 * r()), rx, ry });
  }
  // taban tek bir yassı levha değil: yan yana, boyları farklı birkaç alçak tümsek (taban hafifçe dalgalanır)
  const nTab = Math.max(2, Math.round(w / 105));
  for (let i = 0; i < nTab; i++) {
    const t = (i + 0.5 + (r() - 0.5) * 0.4) / nTab;
    const ry = h * (0.22 + 0.1 * r());
    lob.push({ cx: x0 + w * t, cy: taban - ry * (0.78 + 0.12 * r()), rx: Math.min((w / nTab) * (0.62 + 0.18 * r()), w * 0.4), ry, tab: true });
  }
  const tabanY = (x) => taban + h * 0.05 * (nz.n(x / 70, 3) - 0.5) * 2;
  const pz = o.puruz != null ? o.puruz : 0.07;
  const ham = lob.map((L, j) => {
    const pts = [];
    const m = 72;
    for (let k = 0; k < m; k++) {
      const a = (k / m) * Math.PI * 2;
      const q = 1 + pz * (nz.n(Math.cos(a) * 1.5 + j * 3.1, Math.sin(a) * 1.5 + j) - 0.5) * 2 + pz * 0.5 * (nz.n(Math.cos(a) * 4 + j * 1.3, Math.sin(a) * 4 + 9) - 0.5) * 2;
      pts.push([L.cx + Math.cos(a) * L.rx * q, L.cy + Math.sin(a) * L.ry * q]);
    }
    return titret(pts, true, o.amp != null ? o.amp : 0.9, 0.05, 1.5);
  });
  const kes = (dy) => ham.map((p) => p.map(([x, y]) => [x, Math.min(y, tabanY(x) + (dy || 0))]));
  const titrek = kes(0);
  /** x'teki bulut tepesinin yüksekliği (0..1, h'ye göre). */
  const tepeHam = (x) => {
    let t = 0;
    for (const L of lob) {
      const d = (x - L.cx) / L.rx;
      if (d * d < 1) t = Math.max(t, taban - (L.cy - L.ry * Math.sqrt(1 - d * d)));
    }
    return t / h;
  };
  const tepe = (x) => kenet(tepeHam(x), 0, 1.2);
  /** Alt (gölge) kısım: üst sınırı tepeyi kısmen izleyen dalgalı çizgi; uzat > 0 → tabanın altına taşar. */
  function golge(oran, ek, uzat, izle) {
    const cizgi = izle
      ? (x) => taban - h * oran * tepeHam(x) + h * 0.07 * (nz.n(x / 45 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2
      : (x) => taban - h * oran * (0.45 + 0.75 * tepe(x)) + h * 0.11 * (nz.n(x / 55 + (ek || 0) * 5.3, 7 + (ek || 0)) - 0.5) * 2;
    return sekil(kes(uzat || 0).map((p) => p.map(([x, y]) => [x, Math.max(y, Math.min(cizgi(x), tabanY(x) - 0.5))])));
  }
  function ust(oran, ek) {
    const cizgi = (x) => taban - h * oran + h * 0.07 * (nz.n(x / 60 + (ek || 0) * 3.7, 17 + (ek || 0)) - 0.5) * 2;
    return sekil(titrek.map((p) => p.map(([x, y]) => [x, Math.min(y, cizgi(x))])));
  }
  const alt = (dy) => sekil([[[x0 - 60, taban + (dy || 0)], [x1 + 60, taban + (dy || 0)], [x1 + 60, taban + 260], [x0 - 60, taban + 260]]]);
  return { sk: sekil(titrek), lob, golge, ust, alt, tepe, tepeHam, taban, tabanY, h, x0, x1 };
}

/**
 * Fırça lekeleri (gök ve toprak): ressam lekeleri yukarıdan aşağı sıra sıra, her sırada karışık bir düzenle koyar.
 * Her leke yatay uzamış, uçları yuvarlak ya da incelen, üst ve alt kenarı hafif dalgalı bir lavi lekesidir; sıralar
 * yumuşak akış eğrileri boyunca kıvrılır. Sonra sürülen leke önce sürülenin üstüne binmez, onun kenarında durur
 * (önce sürülen kazanır): her birleşme çizgisi bir lekenin kendi yumuşak, kavisli kenarıdır; düz kesik, sivri parça,
 * kırık cam ya da döşeme taşı ağı oluşmaz. Döner: f(x,y) → leke no; lekeler: her lekenin merkezi ve ölçüsü.
 */
function fircaLeke(o) {
  const r = S.rng(o.tohum);
  const nz = gurultu(o.tohum + 5);
  const akis = (x, y) => o.akis * ((nz.n(x / 270 + 3.1, y / 340 + 0.7) - 0.5) * 2 + 0.35 * (nz.n(x / 95 + 11, y / 130 + 4) - 0.5) * 2);
  const L = [];
  let y = o.y0;
  let sira = 0;
  while (y < o.y1) {
    const f = o.olcek ? o.olcek(y) : 1;
    const sp = (o.spMin + r() * (o.spMax - o.spMin)) * f;
    const dizi = [];
    let x = o.x0 - r() * o.lMax * 0.7;
    while (x < o.x1) {
      const l = (o.lMin + r() * (o.lMax - o.lMin)) * (o.uzat ? o.uzat(y) : 1);
      dizi.push({
        cx: x + l / 2,
        cy: y + sp * (0.5 + (r() - 0.5) * 0.35),
        l,
        H: sp * (o.hMin + r() * (o.hMax - o.hMin)),
        egim: (r() - 0.5) * o.egim,
        bukum: (r() - 0.5) * o.bukum,
        m1: 1.9 + r() * 2.4, // sol uç: büyük m küt ve yuvarlak, küçük m sivri
        m2: 1.7 + r() * 2.0, // sağ uç
        incel: (r() - 0.5) * 0.45, // bir uca doğru incelme: fırçanın kuruyan sonu
        t: r() * 100,
        sira,
      });
      x += l * (0.66 + r() * 0.2);
    }
    for (let i = dizi.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = dizi[i];
      dizi[i] = dizi[j];
      dizi[j] = t;
    }
    L.push(...dizi);
    y += sp;
    sira++;
  }
  const KB = 40;
  const kx0 = o.x0 - 800;
  const ky0 = o.y0 - 200;
  const KW = Math.ceil((o.x1 + 900 - kx0) / KB);
  const KH = Math.ceil((o.y1 + 300 - ky0) / KB);
  const kova = Array.from({ length: KW * KH }, () => []);
  L.forEach((s, k) => {
    const ex = s.l / 2 + 4;
    const ey = s.H * 0.8 + Math.abs(s.egim) * s.l * 0.5 + Math.abs(s.bukum) * s.l * 0.25 + 8;
    for (let j = Math.floor((s.cy - ey - ky0) / KB); j <= Math.floor((s.cy + ey - ky0) / KB); j++)
      for (let i = Math.floor((s.cx - ex - kx0) / KB); i <= Math.floor((s.cx + ex - kx0) / KB); i++)
        if (i >= 0 && j >= 0 && i < KW && j < KH) kova[j * KW + i].push(k);
  });
  /** Lekenin içinde kalma payı: > 0 içeride (0..1), < 0 dışarıda. */
  function pay(s, x, y) {
    const dx = x - s.cx;
    const u = dx / (s.l * 0.5);
    const au = Math.abs(u);
    const dyl = y - s.cy - s.egim * dx - (s.bukum * dx * dx) / s.l;
    if (au >= 1) return -(au - 1) * 3 - Math.max(0, Math.abs(dyl) / s.H - 0.5);
    const prof = Math.sqrt(1 - Math.pow(au, u < 0 ? s.m1 : s.m2)) * (1 - s.incel * u);
    const w1 = (nz.n(u * 2.3 + s.t, s.t * 0.37) - 0.5) * 2;
    if (dyl < 0) {
      const hu = s.H * 0.5 * prof * (1 + 0.16 * w1 + 0.05 * (nz.n(u * 8 + s.t, 3.3) - 0.5) * 2);
      return 1 + dyl / Math.max(0.5, hu);
    }
    const w2 = (nz.n(u * 2.3 + s.t + 40, s.t * 0.37 + 9) - 0.5) * 2;
    const ha = s.H * 0.5 * prof * (1 + 0.16 * w2 + 0.05 * (nz.n(u * 8 + s.t + 40, 7.7) - 0.5) * 2);
    return 1 - dyl / Math.max(0.5, ha);
  }
  function f(x, y) {
    const yw = y - akis(x, y);
    const i = Math.floor((x - kx0) / KB);
    const j = Math.floor((yw - ky0) / KB);
    if (i < 0 || j < 0 || i >= KW || j >= KH) return 0;
    const liste = kova[j * KW + i];
    let en = -1e9;
    let ek = 0;
    for (let q = 0; q < liste.length; q++) {
      const k = liste[q];
      const p = pay(L[k], x, yw);
      if (p > 0) return k; // önce sürülen leke kazanır
      if (p > en) {
        en = p;
        ek = k;
      }
    }
    return ek;
  }
  return { f, lekeler: L };
}
/**
 * Gök lekeleri: ressam göğü sıra sıra değil, yatay akan, boyları çok farklı lavi lekeleriyle doldurur; büyük bir
 * lekenin yanına küçük bir leke sığdırır. Her leke yatay uzamış, kenarı dalgalı bir lekedir; komşu iki lekenin sınırı
 * ikisinin "içerilik" payının eşitlendiği yerdir. Pay boya göre ölçeklendiği için sınırlar düz değil kavislidir,
 * büyük leke küçüğü kavisle sarar (kırık cam, kıymık ya da balık pulu dizisi oluşmaz). Döner: f(x,y) → leke no.
 */
function gokParca(o) {
  const r = S.rng(o.tohum);
  const nz = gurultu(o.tohum + 5);

    d = Math.min(d, UZ[i - 1] + D1, UZ[i - WW] + D1, UZ[i - WW - 1] + D2, UZ[i - WW + 1] + D2);
    UZ[i] = d;
  }
}
for (let py = WW - 2; py >= 0; py--) {
  for (let px = WW - 2; px >= 1; px--) {
    const i = py * WW + px;
    let d = UZ[i];
    if (d === 0) continue;
    d = Math.min(d, UZ[i + 1] + D1, UZ[i + WW] + D1, UZ[i + WW + 1] + D2, UZ[i + WW - 1] + D2);
    UZ[i] = d;
  }
}

// ---------------------------------------------------------------- leke köşelerinin yuvarlanması
// Her leke ayrı bir fırça dokunuşuyla sürüldüğü için köşeleri sivri değil yuvarlaktır; üç lekenin buluştuğu yerde
// küçük, kenarları içe kavisli bir beyaz üçgen kalır. Bölgeye göre köşe yarıçapı (çalışma pikseli): ince ayrıntıda küçük.
const RC = new Float32Array(32).fill(2);
for (const [k, v] of [[R.gok, 3], [R.zemin, 3], [R.kubbe, 3], [R.kaide, 3], [R.kornis, 2], [R.kasnak, 2.5], [R.bulutG, 4], [R.bulut, 4], [R.yaprak, 2], [R.arka, 2.5], [R.cicek, 3], [R.cicekG, 2], [R.minare, 1.5], [R.altin, 0], [R.minPen, 1.2], [R.kaidePen, 2], [R.kasPen, 0.8], [R.sap, 0], [R.orta, 1.2], [R.tomurcuk, 1.2], [R.gunes, 0]]) RC[k] = v;
const GW = new Float32Array(WW * WW);
const UZ2 = new Float32Array(WW * WW);
for (let py = 0; py < WW; py++) {
  for (let px = 0; px < WW; px++) {
    const i = py * WW + px;
    const x = (px + 0.5) / OL;
    const y = (py + 0.5) / OL;
    const bb = Math.round(bolgeVeri[i * 4] / 8);
    let gw = 0.9 + 1.6 * NZ2.n(x / 34, y / 34) + 0.45 * NZ2.n(x / 7, y / 7);
    if (bb === R.gok || bb === R.zemin) {
      // gökte ve toprakta aralık daha ince (0–1,9 px) ve yumuşakça açılıp kapanır: lekelerin üçte biri komşusuna değer
      const n = NZ2.n(x / 62 + 50, y / 40 + 20);
      gw = 1.9 * kenet((n - 0.26) / 0.62, 0, 1) + 0.3 * (NZ2.n(x / 9, y / 9) - 0.5);
      if (bb === R.zemin) gw *= 1.1;
    } else if (bb === R.altin || bb === R.sap) gw *= 0.55; // ince çubuk ve saplar kopmasın
    GW[i] = gw;
    const rc = RC[Math.round(bolgeVeri[i * 4] / 8)];
    UZ2[i] = UZ[i] > gw + rc ? 0 : 99;
  }
}
for (let py = 1; py < WW; py++) {
  for (let px = 1; px < WW - 1; px++) {
    const i = py * WW + px;
    if (UZ2[i] === 0) continue;
    UZ2[i] = Math.min(UZ2[i], UZ2[i - 1] + D1, UZ2[i - WW] + D1, UZ2[i - WW - 1] + D2, UZ2[i - WW + 1] + D2);
  }
}
for (let py = WW - 2; py >= 0; py--) {
  for (let px = WW - 2; px >= 1; px--) {
    const i = py * WW + px;
    if (UZ2[i] === 0) continue;
    UZ2[i] = Math.min(UZ2[i], UZ2[i + 1] + D1, UZ2[i + WW] + D1, UZ2[i + WW + 1] + D2, UZ2[i + WW - 1] + D2);
  }
}

// ---------------------------------------------------------------- lekelerin renkleri
const K = {
  ser: od('#7CB8E4'),
  kob: od('#9FB2E3'),
  tur: od('#80C3E2'),
  ult: od('#8EA2DF'),
  sol: od('#D2E7F5'),
  y1: od('#4FA36A'),
  y2: od('#79BE7A'),
  y3: od('#2F7A55'),
  y4: od('#3E8F62'),
  ySar: od('#9DCB6E'),
  yMav: od('#3A8C7A'),
  krem: od('#F2E7D1'),
  krem2: od('#EADCC0'),
  tasG: od('#D9D2C6'),
  tasM: od('#CFC9D8'),
  pen: od('#9C917F'),
  penK: od('#A9A3B9'),
  altin: od('#E6C25A'),
  altinG: od('#C99B3A'),
  sari: od('#F0CC55'),
  sariG: od('#D9A93A'),
  mor: od('#DCDDF2'),
  mor2: od('#C9CBEA'),
  gunes: od('#FBF1C2'),
  gunes2: od('#F8EBB0'),
  kum: od('#EFE3C8'),
  kum2: od('#E6D6B5'),
  cay1: od('#D7E8A9'),
  cay2: od('#C0DE9F'),
  cay3: od('#CDE5BA'),
  cay4: od('#B4D79E'),
  pembe: od('#E9CAD8'),
  pembe2: od('#E2BCD0'),
  bul1: od('#DDE2F4'),
  bul2: od('#CAD1EC'),
};
const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const olc = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const GOK_TON = [K.ser, karis(K.ser, K.kob, 0.65), K.tur, karis(K.ser, K.ult, 0.55)];
const ZEM_TON = [K.cay1, K.cay2, K.cay3, K.cay4];
const RENK = new Array(NL);
/**
 * Lekenin rengi: v ana renk, v2 leke ıslakken bir ucuna damlatılan ikinci renk (miktar, yön dx/dy), rim kurumuş
 * kenar koyuluğu, gr pigment granülasyonu, eg lekenin içindeki havuzlanma eğimi.
 */
function lekeRengi(k) {
  let c = RENK[k];
  if (c) return c;
  const id = LID[k];
  const b = id >>> 24;
  const a = (id >> 12) & 4095;
  const s = id & 4095;
  const h = karma(a * 7 + 3, s * 13 + b * 101, 218);
  const h2 = karma(a * 11 + 5, s * 3 + b * 37, 2182);
  const h3 = karma(a * 5 + 9, s * 17 + b * 13, 2188);
  const st = BASAMAK[k] < 0 ? 1.5 : BASAMAK[k];
  let v = null;
  let v2 = null;
  let miktar = 0;
  let aci = h2 * Math.PI * 2;
  let gr = 0.04;
  if (id === 0) v = null;
  else if (b === R.gok) {
    // göğün tepesi dolgun seruleum-kobalt, ufka doğru açılır; komşu lekeler arasında değer basamağı ufukta da kalır
    const L = gokF.lekeler[s];
    const t = kenet(L.cy / 800, 0, 1);
    const yak = Math.hypot(L.cx - gunes.x, (L.cy - gunes.y) * 1.2);
    const ti = h < 0.4 ? 0 : h < 0.68 ? 1 : h < 0.85 ? 2 : 3;
    const taban = (1.02 - 0.52 * Math.pow(t, 0.85)) * [0.8, 0.93, 1.07, 1.21][st];
    v = olc(GOK_TON[ti], taban);
    v2 = olc(GOK_TON[(ti + 1 + Math.floor(h3 * 3)) % 4], taban * (0.86 + 0.28 * h3));
    miktar = 0.45 + 0.45 * h3;
    aci = (h2 - 0.5) * 1.1 + (h3 < 0.5 ? Math.PI : 0);
    if (yak < 250) {
      const g = Math.pow(1 - yak / 250, 1.2) * 0.55;
      v = olc(v, 1 - g);
      v2 = olc(v2, 1 - g);
    }
    gr = 0.1;
  } else if (b === R.bulutG) {
    v = s === 2 ? (h < 0.5 ? K.bul2 : karis(K.bul2, K.mor2, 0.6)) : h < 0.5 ? K.bul1 : karis(K.bul1, K.mor, 0.6);
    v2 = s === 2 ? karis(K.bul2, K.ult, 0.25) : karis(K.bul1, K.mor2, 0.5);
    miktar = 0.5;
    aci = Math.PI * 0.75 + (h2 - 0.5) * 0.8; // gölge sol alta doğru koyulaşır
    gr = 0.08;
  } else if (b === R.gunes) {
    v = K.gunes;
    v2 = K.gunes2;
    miktar = 0.6;
    aci = Math.PI * 0.8;
  } else if (b === R.kubbe) {
    const dil = a;
    const bm = -Math.PI / 2 + (Math.PI * (dil + 0.5)) / 16;
    const bi = s & 7;
    const lit = Math.max(0, Math.cos(bm - 0.62)) + (bi === 0 ? -0.05 : 0.035 * bi);
    const t = lit + (h - 0.5) * 0.3 + (st - 1.5) * 0.07;
    v = t > 0.82 ? K.y2 : t > 0.58 ? karis(K.y2, K.y1, 0.6) : t > 0.35 ? K.y1 : t > 0.15 ? K.y4 : K.y3;
    v2 = t > 0.5 ? (h3 < 0.55 ? K.ySar : K.y1) : h3 < 0.5 ? K.yMav : t > 0.2 ? K.y3 : K.y4;
    miktar = 0.35 + 0.35 * h2;
    aci = (h3 < 0.5 ? -1 : 1) * Math.PI / 2 + (h - 0.5) * 0.6; // dilim boyunca
    gr = 0.07;
  } else if (b === R.kasnak) {
    const bay = a % 64;
    const kat = Math.min(1, a >> 6);
    const xx = kasPen[kat][Math.min(bay, kasPen[kat].length - 1)].x;
    const t = (xx - 334) / 452 + (h - 0.5) * 0.3 + (s ? 0.08 : -0.05);
    v = t > 0.72 ? K.y1 : t > 0.4 ? K.y4 : K.y3;
    v2 = t > 0.72 ? K.y2 : t > 0.4 ? K.y1 : K.yMav;
    miktar = 0.3 + 0.3 * h3;
    gr = 0.06;
  } else if (b === R.kasPen) v = olc(K.y3, 1.45);
  else if (b === R.minPen || b === R.kaidePen) v = h < 0.5 ? K.pen : K.penK;
  else if (b === R.kaide || b === R.kornis) {
    const t = (LCX[k] - 300) / 520;
    v = t < 0.18 && h < 0.7 ? K.tasG : h < 0.45 ? K.krem : h < 0.8 ? K.krem2 : karis(K.krem, K.tasM, 0.5);
    if (b === R.kornis) v = h < 0.5 ? K.krem : karis(K.krem, K.tasG, 0.5);
    if (b === R.kaide && LCY[k] < 718) v = karis(K.tasG, K.tasM, h);
    v2 = h3 < 0.5 ? K.tasM : K.krem2;
    miktar = 0.3 + 0.4 * h2;
  } else if (b === R.minare) {
    const sut = s >> 6;
    const p = minParca[a];
    if (p && p.tip === 'korkuluk') v = s & 1 ? K.tasG : (s >> 1) % 2 ? K.tasM : K.krem2;
    else if (p && p.tip === 'bant') v = (s >> 3) % 2 ? K.tasM : K.krem2;
    else if (p && p.ad.startsWith('gövde')) v = sut === 0 ? (h < 0.6 ? K.tasG : K.tasM) : sut === 1 ? (h < 0.5 ? K.krem : K.krem2) : h < 0.4 ? K.krem : null;
    else v = s === 0 ? K.tasG : s === 1 ? K.krem2 : K.krem;
    if (v) {
      v2 = h3 < 0.5 ? K.tasM : K.krem2;
      miktar = 0.3 + 0.3 * h2;
    }
  } else if (b === R.altin) {
    v = s === 0 ? K.altinG : K.altin;
    if (s === 2) {
      v2 = K.altinG;
      miktar = 0.55;
      aci = Math.PI;
    }
  } else if (b === R.yaprak || b === R.arka) {
    const Y = b === R.yaprak ? G.yapraklar[a] : null;
    if (b === R.yaprak && !Y) return (RENK[k] = { v: null });
    const isik = Y ? (s >> 1) === Y.isikli : (s >> 1) === 0;
    if (b === R.arka) v = olc(isik ? K.y2 : K.y1, 0.55 + h * 0.2);
    else {
      const yuksek = S.bitki.yapraklar[a].y < 800;
      v = isik ? (h < 0.5 ? K.y2 : K.y1) : h < 0.55 ? K.y3 : K.y4;
      if (yuksek) v = olc(v, 0.85);
      if (s & 1) v = olc(v, 1.12);
    }
    v2 = isik ? (h3 < 0.5 ? K.ySar : olc(K.y1, 0.9)) : h3 < 0.5 ? K.yMav : K.y3;
    if (b === R.arka) v2 = olc(v2, 0.6);
    miktar = 0.35 + 0.3 * h2;
    const Yb = Y ? Y.y : arka[a];
    if (Yb) aci = Yb.aci + (h3 < 0.5 ? 0 : Math.PI); // yaprak boyunca: dipten uca
    gr = 0.05;
  } else if (b === R.sap) v = h < 0.5 ? K.y1 : K.y4;
  else if (b === R.tomurcuk) {
    v = K.pembe;
    v2 = K.pembe2;
    miktar = 0.6;
    aci = Math.PI * 0.75;
  } else if (b === R.cicekG) v = h < 0.3 ? null : h < 0.7 ? olc(K.mor, 0.85) : olc(K.mor2, 0.8);
  else if (b === R.cicek) v = h < 0.5 ? olc(K.krem, 0.3) : olc(K.mor, 0.25);
  else if (b === R.orta) v = s === 1 ? karis(K.sari, K.sariG, 0.75) : K.sari;
  else if (b === R.zemin) {
    // kaide dibinde kum ve soluk sarı-yeşil, öne doğru taze, açık çayır yeşilleri (yapraklardan belirgin açık)
    const uz = kenet((zemF.lekeler[s].cy - 800) / 70, 0, 1);
    const kumP = 0.4 - 0.32 * uz;
    const f = [0.86, 0.95, 1.05, 1.15][st];
    const ti = Math.floor(h2 * 4) & 3;
    v = olc(h < kumP ? (h2 < 0.5 ? K.kum : K.kum2) : ZEM_TON[ti], f);
    v2 = olc(h3 < kumP ? K.kum2 : ZEM_TON[(ti + 1 + Math.floor(h3 * 3)) % 4], f * (0.9 + 0.2 * h));
    miktar = 0.4 + 0.4 * h3;
    aci = (h - 0.5) * 0.8 + (h3 < 0.5 ? Math.PI : 0);
    gr = 0.05;
  }
  const rim = b === R.gok ? 0.3 + h2 * 0.16 : b === R.zemin ? 0.28 + h2 * 0.14 : 0.42 + h2 * 0.25;
  const ea = h3 * Math.PI * 2;
  c = { v, v2, miktar, dx: Math.cos(aci), dy: Math.sin(aci), rim, gr, ex: Math.cos(ea) * (0.06 + 0.08 * h), ey: Math.sin(ea) * (0.06 + 0.08 * h) };
  RENK[k] = c;
  return c;
}

// ---------------------------------------------------------------- boyama: her leke kendi içinde ıslak, kenarı keskin
// Leke düz değildir: ıslakken bir ucuna ikinci bir renk damlatılır (iç geçiş yumuşak, kenar keskin), pigment bir yana
// doğru hafifçe havuzlanır, mavi ve yeşil pigmentler kâğıdın çukurlarında granüle olur; kururken kenar koyulaşır.
const DL = DALGA;
for (let py = 0; py < WW; py++) {
  const y = (py + 0.5) / OL;
  for (let px = 0; px < WW; px++) {
    const i = py * WW + px;
    const x = (px + 0.5) / OL;
    const gw = GW[i];
    const bb = Math.round(bolgeVeri[i * 4] / 8);
    const rc = RC[bb];
    // yuvarlatılmış lekenin kenarına uzaklık: çekirdeğe rc'den uzak olan yer beyaz kalır
    const d = UZ2[i] > 0 ? gw + rc - UZ2[i] : UZ[i];
    let ic; // aralığın kenarından lekenin içine doğru uzaklık
    let a;
    if (bb === R.gok || bb === R.zemin) {
      // ince aralık: sınır iki piksel arasındadır (+0,5); gw = 0 ise iki leke birbirine değer
      ic = d + 0.5 - gw;
      a = kenet(ic + 0.5, 0, 1);
      if (a <= 0) continue;
    } else {
      if (d < gw || UZ[i] < gw) continue; // beyaz aralık
      ic = d - gw;
      a = kenet(ic / 1.2, 0, 1);
    }
    const k = IX[i];
    const c = lekeRengi(k);
    if (!c.v) continue;
    let v0 = c.v[0];
    let v1 = c.v[1];
    let v2 = c.v[2];
    const rx = (x - LCX[k]) / LEX[k];
    const ry = (y - LCY[k]) / LEY[k];
    if (c.v2) {
      const dk = DL[((((py >> 3) + 201) & 511) << 9) + (((px >> 3) + 303) & 511)];
      const sx = rx * c.dx + ry * c.dy + 0.9 * (dk - 0.5) * 2;
      const m = yumusak(-0.4, 0.55, sx) * c.miktar;
      v0 += (c.v2[0] - v0) * m;
      v1 += (c.v2[1] - v1) * m;
      v2 += (c.v2[2] - v2) * m;
    }
    const P = KAGIT[i];
    const kenar = Math.exp(-Math.max(0, ic) / (bb === R.gok ? 4.2 : 3.4));
    const dv = DL[((((py >> 2) + 77) & 511) << 9) + (((px >> 2) + 19) & 511)];
    const egim = kenet(1 + rx * c.ex + ry * c.ey, 0.8, 1.25);
    const gran = 1 + c.gr * ((NZ2.n(x / 2.2, y / 2.2) - 0.5) * 2 * 0.7 + (NZ2.n(x / 6 + 31, y / 6 + 7) - 0.5) * 2 * 0.5) + c.gr * 1.2 * (0.5 - P);
    const w = a * ((1 + 0.12 * (dv - 0.5) * 2) * (1 + 0.16 * (0.5 - P) * 2) * egim * gran + c.rim * kenar);
    D[0][i] = v0 * w;
    D[1][i] = v1 * w;
    D[2][i] = v2 * w;
  }
}

// Boyalı adacıklar: aralık bir lekenin ucunu dar boğazından ayırırsa geriye küçük bir boyalı ada kalır (bulut kenarında
// mavi nokta, kubbe kenarında yeşil nokta dizisi gibi). Ressam o kırıntıyı boyamaz: gökte ve toprakta 260, bulut
// gölgesinde 900, kubbede 160 çalışma pikselinden küçük boyalı adalar kâğıt beyazı bırakılır.
(function () {
  const N = WW * WW;
  const gor = new Uint8Array(N);
  const yigin = new Int32Array(N);
  const parca = [];
  for (let i0 = 0; i0 < N; i0++) {
    if (gor[i0] || D[0][i0] + D[1][i0] + D[2][i0] <= 0) continue;
    const id = ID[i0];
    const b = id >>> 24;
    const esik = b === R.gok || b === R.zemin ? 260 : b === R.bulutG ? 900 : b === R.kubbe ? 160 : 0;
    if (!esik) continue;
    let sp = 0;
    yigin[sp++] = i0;
    gor[i0] = 1;
    parca.length = 0;
    while (sp && parca.length < 1000) {
      const i = yigin[--sp];
      parca.push(i);
      const x = i % WW;
      const js = [x > 0 ? i - 1 : -1, x < WW - 1 ? i + 1 : -1, i >= WW ? i - WW : -1, i < N - WW ? i + WW : -1];
      for (const j of js) {
        if (j < 0 || gor[j] || ID[j] !== id || D[0][j] + D[1][j] + D[2][j] <= 0) continue;
        gor[j] = 1;
        yigin[sp++] = j;
      }
    }
    if (sp || parca.length >= esik) {
      // büyük leke: kalanını da işaretle (yeniden taranmasın)
      while (sp) {
        const i = yigin[--sp];
        const x = i % WW;
        const js = [x > 0 ? i - 1 : -1, x < WW - 1 ? i + 1 : -1, i >= WW ? i - WW : -1, i < N - WW ? i + WW : -1];
        for (const j of js) {
          if (j < 0 || gor[j] || ID[j] !== id || D[0][j] + D[1][j] + D[2][j] <= 0) continue;
          gor[j] = 1;
          yigin[sp++] = j;
        }
      }
      continue;
    }
    for (const i of parca) D[0][i] = D[1][i] = D[2][i] = 0;
  }
})();

const son = bitir((a, b, c, P, out) => {
  out[0] = 253 * Math.exp(-a);
  out[1] = 253 * Math.exp(-b);
  out[2] = 251 * Math.exp(-c);
}, { dis: 0.06 });
ekranaAktar(son.c);
SAHNE.hazir();

</script>
