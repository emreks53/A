<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-025 İzometrik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-025 İzometrik — gerçek izometrik izdüşüm (30° eksenler, perspektif yok), havada duran kare
  // zemin karosunun üstünde küçük bir diorama; üç tonlu yüzey gölgelemesi (üst en açık, sağ açık,
  // sol koyu; ışık sağ üstten), temiz vektör görünüm.
  const ctx = SAHNE.tuval(document.getElementById('tuval'), 2);
  const rng = SAHNE.rng(25);

  // ------------------------------------------------------------ izdüşüm
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const T = 520;                  // karo kenarı (dünya birimi)
  const OX = 512, OY = 392;       // karonun arka köşesinin ekrandaki yeri
  const P = (x, y, z) => [OX + (x - y) * C30, OY + (x + y) * S30 - (z || 0)];
  const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const L = nrm([0.62, -0.12, 0.78]);   // ışık: sağ üstten
  const V = nrm([1, 1, 1]);             // bakış yönü (izleyiciye doğru)
  const isik = (n) => Math.max(0, dot(nrm(n), L));

  // ------------------------------------------------------------ renk yardımcıları
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = (c) => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(renkler) {
    const cs = renkler.map(hex);
    return (t) => {
      t = Math.max(0, Math.min(1, t)) * (cs.length - 1);
      const i = Math.min(cs.length - 2, Math.floor(t));
      return rgb(karis(cs[i], cs[i + 1], t - i));
    };
  }
  const YESIL = rampa(['#0E3420', '#155030', '#1F693C', '#2D8248', '#46A057', '#7FC274', '#B9E2A0']);
  const TAS = rampa(['#9C8D72', '#C3B597', '#E2D8C2', '#F4EEDF', '#FFFDF7']);
  const ALTIN = rampa(['#6E4A12', '#A87A24', '#D9AC40', '#F2D27A', '#FFF1C2']);
  const yuzTon = (n, a, b) => (a === undefined ? 0.2 : a) + (b === undefined ? 0.8 : b) * isik(n);

  // ------------------------------------------------------------ çizim yardımcıları
  function yolCiz(pts, kapali) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    if (kapali !== false) ctx.closePath();
  }
  function doldur(pts, renk) { yolCiz(pts); ctx.fillStyle = renk; ctx.fill(); }
  function cizgi(pts, renk, w, kapali) {
    yolCiz(pts, !!kapali); ctx.strokeStyle = renk; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  const W = (pts3) => pts3.map((q) => P(q[0], q[1], q[2]));

  /** Kutu: x0..x1, y0..y1, z0..z1; görünen üç yüz (üst, sağ = x1 yüzü, sol = y1 yüzü). */
  function kutu(x0, y0, z0, x1, y1, z1, ramp, o) {
    o = o || {};
    const sol = W([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]]);
    const sag = W([[x1, y1, z0], [x1, y0, z0], [x1, y0, z1], [x1, y1, z1]]);
    const ust = W([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]);
    doldur(sol, o.sol || ramp(yuzTon([0, 1, 0])));
    doldur(sag, o.sag || ramp(yuzTon([1, 0, 0])));
    if (!o.ustYok) doldur(ust, o.ust || ramp(yuzTon([0, 0, 1])));
    if (o.kenar !== false) {
      // ön üst kenarlarda ince ışık çizgisi (vektör illüstrasyon inceliği)
      cizgi(W([[x0, y1, z1], [x1, y1, z1], [x1, y0, z1]]), o.kenarRenk || 'rgba(255,255,255,0.55)', 1.1);
    }
  }

  /** n kenarlı prizma (çokgen kesitli düşey gövde). R: çevrel yarıçap. */
  function prizma(cx, cy, z0, z1, R, n, ramp, o) {
    o = o || {};
    const d = (Math.PI * 2) / n;
    const t0 = o.t0 === undefined ? -d / 2 : o.t0;
    const vx = (i) => [cx + R * Math.cos(t0 + i * d), cy + R * Math.sin(t0 + i * d)];
    for (let i = 0; i < n; i++) {
      const am = t0 + (i + 0.5) * d;
      const nn = [Math.cos(am), Math.sin(am), 0];
      if (dot(nn, V) <= 1e-6) continue;
      const a = vx(i), b = vx(i + 1);
      doldur(W([[a[0], a[1], z0], [b[0], b[1], z0], [b[0], b[1], z1], [a[0], a[1], z1]]), ramp(yuzTon(nn, o.amb, o.dif)));
      if (o.yuz) o.yuz(i, a, b, am);
    }
    if (o.ust !== false) {
      const ust = [];
      for (let i = 0; i < n; i++) { const a = vx(i); ust.push([a[0], a[1], z1]); }
      doldur(W(ust), o.ustRenk || ramp(yuzTon([0, 0, 1], o.amb, o.dif)));
    }
  }

  /** Kesik koni (çokgen): alt yarıçap R0 (z0), üst R1 (z1). */
  function koni(cx, cy, z0, z1, R0, R1, n, ramp, o) {
    o = o || {};
    const d = (Math.PI * 2) / n;
    const t0 = o.t0 === undefined ? -d / 2 : o.t0;
    const h = z1 - z0;
    for (let i = 0; i < n; i++) {
      const am = t0 + (i + 0.5) * d;
      const nn = nrm([Math.cos(am) * h, Math.sin(am) * h, (R0 - R1) * Math.cos(d / 2)]);
      if (dot(nn, V) <= 1e-6) continue;
      const a0 = t0 + i * d, a1 = a0 + d;
      doldur(W([
        [cx + R0 * Math.cos(a0), cy + R0 * Math.sin(a0), z0], [cx + R0 * Math.cos(a1), cy + R0 * Math.sin(a1), z0],
        [cx + R1 * Math.cos(a1), cy + R1 * Math.sin(a1), z1], [cx + R1 * Math.cos(a0), cy + R1 * Math.sin(a0), z1],
      ]), ramp(yuzTon(nn, o.amb, o.dif)));
    }
  }

  /**
   * Dönel yüzey (kubbe, topuz): profil [{r, z}] alttan üste; n dilim. Her dilim düz tonlu, yalnız
   * izleyiciye bakan kısmı çizilir (görünürlük sınırı dilim içinde kesilir).
   */
  function donel(cx, cy, profil, n, ramp, o) {
    o = o || {};
    const d = (Math.PI * 2) / n;
    const t0 = o.t0 || 0;
    const m = profil.length;
    const pt = (a, k) => [cx + profil[k].r * Math.cos(a), cy + profil[k].r * Math.sin(a), profil[k].z];
    const gorunur = (a, k) => {
      const k0 = Math.max(0, k - 1), k1 = Math.min(m - 1, k + 1);
      const dr = profil[k1].r - profil[k0].r, dz = profil[k1].z - profil[k0].z;
      return dot([Math.cos(a) * dz, Math.sin(a) * dz, -dr], V);
    };
    const dilimler = [];
    for (let i = 0; i < n; i++) {
      const a0 = t0 + i * d, a1 = a0 + d, am = a0 + d / 2;
      // görünürlük alttan üste artar: ilk görünen kademeyi bul
      let k0 = -1;
      for (let k = 0; k < m; k++) if (gorunur(am, k) > 0) { k0 = k; break; }
      if (k0 < 0) continue;
      const sol = [], sag = [];
      for (let k = k0; k < m; k++) { sol.push(pt(a0, k)); sag.push(pt(a1, k)); }
      if (k0 > 0) {
        // görünürlük sınırını kademeler arasında doğrusal olarak yerleştir
        const g0 = gorunur(am, k0 - 1), g1 = gorunur(am, k0);
        const t = g0 / (g0 - g1);
        const ara = (a) => { const p0 = pt(a, k0 - 1), p1 = pt(a, k0); return [p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t, p0[2] + (p1[2] - p0[2]) * t]; };
        sol.unshift(ara(a0)); sag.unshift(ara(a1));
      }
      // dilimin tonu: orta yükseklikteki normal + üstte hafif açılma
      const km = Math.min(m - 2, Math.max(1, Math.floor((k0 + m) / 2)));
      const dr = profil[km + 1].r - profil[km - 1].r, dz = profil[km + 1].z - profil[km - 1].z;
      const nn = [Math.cos(am) * dz, Math.sin(am) * dz, -dr];
      const kAlt = yuzTon(nn, o.amb, o.dif);
      const pa = W([sol[0]])[0], pu = W([sol[sol.length - 1]])[0];
      const g = ctx.createLinearGradient(pa[0], pa[1], pu[0], pu[1]);
      g.addColorStop(0, ramp(kAlt - (o.altKoyu || 0.06)));
      g.addColorStop(1, ramp(kAlt + (o.ustAcik || 0.1)));
      doldur(W(sol.concat(sag.reverse())), g);
      dilimler.push({ a0, a1, k0, am });
    }
    return dilimler;
  }

  /** Sivri kemer noktaları (yerel u yatay, v düşey): orta cu, alt v0, genişlik w, yükseklik h. */
  function kemer(cu, v0, w, h, adim) {
    adim = adim || 10;
    const e = w * 0.2, rr = w / 2 + e;
    const tepeY = Math.sqrt(rr * rr - e * e);
    const vs = v0 + h - tepeY;
    const pts = [[cu - w / 2, v0]];
    const ta = Math.acos(-e / rr);
    for (let i = 0; i <= adim; i++) { const t = Math.PI + (ta - Math.PI) * (i / adim); pts.push([cu + e + rr * Math.cos(t), vs + rr * Math.sin(t)]); }
    const tb = Math.acos(e / rr);
    for (let i = 0; i <= adim; i++) { const t = tb - tb * (i / adim); pts.push([cu - e + rr * Math.cos(t), vs + rr * Math.sin(t)]); }
    pts.push([cu + w / 2, v0]);
    return pts;
  }

  function kirp(pts) { ctx.save(); yolCiz(pts); ctx.clip(); }

  // ------------------------------------------------------------ gök
  (function gok() {
    const g = ctx.createLinearGradient(0, 0, 0, 1024);
    g.addColorStop(0, '#BFE0EE');
    g.addColorStop(0.55, '#E4F1EC');
    g.addColorStop(1, '#FBF1DD');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 1024);
    // güneş: düz halkalı vektör ışıltı
    const hal = [[150, 'rgba(255,248,222,0.22)'], [112, 'rgba(255,246,214,0.3)'], [80, 'rgba(255,243,205,0.45)'], [52, '#FFF6D8']];
    for (const [r, c] of hal) { ctx.beginPath(); ctx.arc(880, 140, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
    // düz, basamaklı bulutlar
    function bulut(x, y, s) {
      const parca = [[-58, 0, 26], [-24, -16, 32], [16, -24, 38], [52, -6, 28], [80, 6, 18]];
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - 200 * s, y - 200 * s, 400 * s, 220 * s);
      ctx.clip();
      ctx.beginPath();
      for (const [dx, dy, r] of parca) { ctx.moveTo(x + (dx + r) * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); }
      ctx.rect(x - 84 * s, y, 184 * s, 20 * s);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.beginPath();
      ctx.rect(x - 84 * s, y + 8 * s, 184 * s, 12 * s);
      ctx.fillStyle = 'rgba(205,226,236,0.9)';
      ctx.fill();
      ctx.restore();
    }
    bulut(170, 236, 0.95);
    bulut(840, 330, 0.75);
    bulut(96, 470, 0.6);
  })();

  // ------------------------------------------------------------ yüzen karo
  const KAL = 66; // karo kalınlığı
  (function karo() {
    // karonun altındaki yumuşak gölge (havada durduğunu gösterir)
    ctx.save();
    ctx.filter = 'blur(18px)';
    ctx.fillStyle = 'rgba(70,90,100,0.16)';
    yolCiz(W([[0 + 40, T + 40, -KAL - 70], [T + 40, T + 40, -KAL - 70], [T + 40, 40, -KAL - 70], [40, 40, -KAL - 70]]));
    ctx.fill();
    ctx.restore();
    // katmanlar: üstte taş döşeme şeridi, toprak, altta koyu kaya
    const katman = [
      [0, -10, ['#E8DCC2', '#D2C3A3']],
      [-10, -44, ['#A9764A', '#7E5434']],
      [-44, -KAL, ['#8A8378', '#635D55']],
    ];
    for (const [za, zb, [sag, sol]] of katman) {
      doldur(W([[0, T, za], [T, T, za], [T, T, zb], [0, T, zb]]), sol);
      doldur(W([[T, T, za], [T, 0, za], [T, 0, zb], [T, T, zb]]), sag);
    }
    // toprağın içinde çakıllar
    const r = SAHNE.rng(9);
    for (let i = 0; i < 46; i++) {
      const yan = i % 2;
      const u = 20 + r() * (T - 40);
      const z = -14 - r() * 46;
      const s = 3 + r() * 5;
      const c = z < -44 ? ['#A39C90', '#7B746A'][yan] : ['#C49A6C', '#9A6E48'][yan];
      const cc = yan ? [u, T, z] : [T, T - u, z];
      const p = P(cc[0], cc[1], cc[2]);
      ctx.beginPath();
      ctx.ellipse(p[0], p[1], s * 1.3, s * 0.8, yan ? 0.52 : -0.52, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
    }
    // kaya katmanının alt kenarı: düzensiz, sarkan kırık kenar
    for (const yan of [0, 1]) {
      const pts = [];
      const n = 18;
      for (let i = 0; i <= n; i++) {
        const u = (T * i) / n;
        const z = -KAL - (i === 0 || i === n ? 0 : 6 + r() * 16);
        pts.push(yan ? [u, T, z] : [T, T - u, z]);
      }
      const ust = yan ? [[T, T, -KAL + 2], [0, T, -KAL + 2]] : [[T, 0, -KAL + 2], [T, T, -KAL + 2]];
      doldur(W(pts.concat(ust)), yan ? '#5A544C' : '#7F786E');
    }
    // üst yüz: açık taş döşeme
    doldur(W([[0, 0, 0], [T, 0, 0], [T, T, 0], [0, T, 0]]), '#F3EBD8');
    // döşeme ızgarası
    ctx.save();
    kirp(W([[0, 0, 0], [T, 0, 0], [T, T, 0], [0, T, 0]]));
    ctx.strokeStyle = 'rgba(176,160,128,0.32)';
    ctx.lineWidth = 0.9;
    for (let u = 26; u < T; u += 26) {
      cizgi(W([[u, 0, 0], [u, T, 0]]), 'rgba(176,160,128,0.32)', 0.9);
      cizgi(W([[0, u, 0], [T, u, 0]]), 'rgba(176,160,128,0.32)', 0.9);
    }
    ctx.restore();
    ctx.restore();
    // kenar ışığı
    cizgi(W([[0, T, 0], [T, T, 0], [T, 0, 0]]), 'rgba(255,255,255,0.8)', 1.4);
  })();

  // ------------------------------------------------------------ çimen ve tarhlar (karo üstünde, z = 0)
  function cimen(pts) {
    doldur(W(pts.map((q) => [q[0], q[1], 0])), '#9FCB72');
    // çimen kenarı: hafif koyu bordür
    cizgi(W(pts.map((q) => [q[0], q[1], 0])), 'rgba(90,140,70,0.6)', 1.2, true);
  }

  // yapı ölçüleri
  const BX0 = 116, BY0 = 26, BX1 = 356, BY1 = 266;   // kaide tabanı
  const BCX = (BX0 + BX1) / 2, BCY = (BY0 + BY1) / 2;
  const KH = 70;   // kaide yüksekliği
  const MX = 78, MY = 312; // minare ekseni
  const HX = 16, HY = 334, HH = 132; // avludaki hurma ağacı (minarenin solunda, arkada)
  const SX = 172, SY = 330;          // avludaki sekizgen şadırvan

  // çimen alanları: yolun iki yanında
  cimen([[10, 372, 0], [214, 372], [214, 510], [10, 510]]);
  cimen([[380, 14], [510, 14], [510, 300], [380, 300]]);
  cimen([[262, 314], [510, 314], [510, 510], [262, 510]]);

  // ------------------------------------------------------------ gölgeler (zemine düşen, düz ve yarı saydam)
  const GOLGE = [-0.62, 0.16]; // z başına zemin kayması
  const golgeNok = [];
  function golgeEkle(x, y, z) { golgeNok.push([x + GOLGE[0] * z, y + GOLGE[1] * z]); }
  function zarf(noktalar) {
    const p = noktalar.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const alt = [], ust = [];
    for (const q of p) { while (alt.length >= 2 && cr(alt[alt.length - 2], alt[alt.length - 1], q) <= 0) alt.pop(); alt.push(q); }
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (ust.length >= 2 && cr(ust[ust.length - 2], ust[ust.length - 1], q) <= 0) ust.pop(); ust.push(q); }
    return alt.slice(0, -1).concat(ust.slice(0, -1));
  }
  function golgeCiz(gruplar) {
    const c = SAHNE.yeniTuval(2048, 2048);
    const g = c.getContext('2d');
    g.setTransform(2, 0, 0, 2, 0, 0);
    g.fillStyle = '#000';
    for (const grup of gruplar) {
      const h = zarf(grup).map((q) => P(q[0], q[1], 0));
      g.beginPath();
      h.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
      g.closePath();
      g.fill();
    }
    // yalnız karonun üst yüzüne düşsün
    g.globalCompositeOperation = 'destination-in';
    g.beginPath();
    W([[0, 0, 0], [T, 0, 0], [T, T, 0], [0, T, 0]]).forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.fill();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.2;
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(c, 0, 0);
    ctx.restore();
  }
  (function golgeler() {
    const gruplar = [];
    // kaide
    const kg = [];
    for (const [x, y] of [[BX0, BY0], [BX1, BY0], [BX1, BY1], [BX0, BY1]]) { kg.push([x, y]); kg.push([x + GOLGE[0] * KH, y + GOLGE[1] * KH]); }
    gruplar.push(kg);
    // kasnak + kubbe
    const kk = [];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2;
      for (const [r, z] of [[112, KH + 8], [112, KH + 60], [104, KH + 96], [70, KH + 96 + 110], [0, KH + 96 + 158]]) kk.push([BCX + r * Math.cos(a) + GOLGE[0] * z, BCY + r * Math.sin(a) + GOLGE[1] * z]);
    }
    gruplar.push(kk);
    // minare
    const mg = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      for (const [r, z] of [[30, 0], [30, 220], [22, 400]]) mg.push([MX + r * Math.cos(a) + GOLGE[0] * z, MY + r * Math.sin(a) + GOLGE[1] * z]);
    }
    gruplar.push(mg);
    // hurma (gövde ve taç) ve şadırvan
    const hg = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      for (const [r, z] of [[12, 0], [12, 8], [4, HH * 0.6], [4, HH]]) hg.push([HX + r * Math.cos(a) + GOLGE[0] * z, HY + r * Math.sin(a) + GOLGE[1] * z]);
    }
    gruplar.push(hg);
    const tg = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      for (const z of [HH - 14, HH + 4]) tg.push([HX - 4 + 46 * Math.cos(a) + GOLGE[0] * z, HY + 2 + 46 * Math.sin(a) + GOLGE[1] * z]);
    }
    gruplar.push(tg);
    const sg = [];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      for (const [r, z] of [[30, 0], [30, 10], [12, 29], [3, 36]]) sg.push([SX + r * Math.cos(a) + GOLGE[0] * z, SY + r * Math.sin(a) + GOLGE[1] * z]);
    }
    gruplar.push(sg);
    golgeCiz(gruplar);
  })();

  // ------------------------------------------------------------ minare (sekizgen prizma)
  function korkuluk(cx, cy, z0, z1, R, t0, on) {
    const n = 8, d = (Math.PI * 2) / n;
    for (let i = 0; i < n; i++) {

  /** Öne bakan yüzdeki (normal 45°) kemerli pencere. */
  function minarePencere(cx, cy, R, z0, w, h) {

  // ------------------------------------------------------------ yapı (kaide, kasnak, kubbe)
  function yapi() {

  /** Kasnak silindiri: 48 yüzlü, düz tonlu; üstüne silindir yüzeyine oturan sivri kemerli pencereler. */

  // ------------------------------------------------------------ bahçe: çalılar, tarhlar, çiçekler
  function cali(x, y, z, r, ton) {
    const p = P(x, y, z + r * 0.8);

    const koyu = ['#3E7A3A', '#4C8A40', '#356B35'][ton % 3];

  function cicek(x, y, z, r, renk, orta) {

  function tarh(x0, y0, x1, y1, h) {

  function tarhDoldur(x0, y0, x1, y1, h, yogun) {

    // ızgaraya yakın, hafif oynatılmış yerleşim: toprak az görünsün

  function fener(x, y) {

  // ------------------------------------------------------------ avlu: hurma ağacı ve şadırvan
  const sekizgen = (cx, cy, R, z) => { const o = []; for (let i = 0; i < 8; i++) { const a = -Math.PI / 8 + (i * Math.PI) / 4; o.push([cx + R * Math.cos(a), cy + R * Math.sin(a), z]); } return o; };
  function hurma(x, y, h) {

    prizma(x, y, 0, 9, 13, 8, TAS, { t0: -Math.PI / 8 });

    // gövde: hafif eğik, boğumlu; ışık sağdan → sağ yarı açık
    const p0 = P(x, y, 9), p1 = P(x - 5, y + 6, h);
    const n = 15;
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n;
      const at = (t) => [p0[0] + (p1[0] - p0[0]) * t + Math.sin(t * Math.PI) * 5, p0[1] + (p1[1] - p0[1]) * t];
      const a = at(t0), b = at(t1);
      const w0 = 6.2 - 2 * t0, w1 = 6.2 - 2 * t1;
      doldur([[a[0] - w0, a[1]], [a[0], a[1] + 1.5], [b[0], b[1] + 1.5], [b[0] - w1, b[1]]], i % 2 ? '#7E5F3C' : '#8D6C46');
      doldur([[a[0], a[1] + 1.5], [a[0] + w0, a[1]], [b[0] + w1, b[1]], [b[0], b[1] + 1.5]], i % 2 ? '#A88458' : '#B8936A');
      // boğum çizgisi
      cizgi([[b[0] - w1, b[1]], [b[0], b[1] + 1.5], [b[0] + w1, b[1]]], 'rgba(90,62,36,0.55)', 1);
    }
    // taç: aşağı sarkan, kenarı tırtıllı yapraklar; yukarı bakanlar önce, öne sarkanlar sonra
    const C = [p1[0], p1[1] - 2];
    const yapraklar = [
      [-160, 56, 0.62], [-122, 46, 0.6], [-90, 40, 0.62], [-58, 48, 0.6], [-22, 60, 0.58],

    ].map(([d, L, dr]) => ({ a: (d * Math.PI) / 180, L: L * 1.12, dr }));
    yapraklar.sort((p, q) => Math.sin(p.a) - Math.sin(q.a));
    const yaprak = (f) => {
      const ux = Math.cos(f.a), uy = Math.sin(f.a) * 0.62;
      const nokta = (t) => [C[0] + ux * f.L * t, C[1] + uy * f.L * t + f.dr * f.L * t * t];
      const k = 26, ust = [], alt = [], orta = [];
      for (let i = 0; i <= k; i++) {

        const q = nokta(t), q2 = nokta(Math.min(1, t + 0.02)), q1 = nokta(Math.max(0, t - 0.02));
        let tx = q2[0] - q1[0], ty = q2[1] - q1[1];
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const w = 9.5 * Math.sin(Math.PI * Math.pow(t, 0.6)) * (1 - 0.35 * t) * (i % 2 ? 1 : 0.62);
        ust.push([q[0] + ty * w, q[1] - tx * w]);
        alt.push([q[0] - ty * w, q[1] + tx * w]);
        orta.push(q);
      }
      const sag = ux > 0.25;
      doldur(ust.concat(alt.slice().reverse()), sag ? '#468A3E' : '#356C34');
      // gökyüzüne bakan (ekranda üstte kalan) yarı açık ton
      const ortY = (a) => a.reduce((t, q) => t + q[1], 0) / a.length;
      const yukari = ortY(ust) < ortY(alt) ? ust : alt;
      doldur(yukari.concat(orta.slice().reverse()), sag ? '#8CC463' : '#62A04A');
      cizgi(orta, 'rgba(36,74,34,0.6)', 0.9);
    };
    const geri = yapraklar.filter((f) => Math.sin(f.a) < -0.2), on = yapraklar.filter((f) => Math.sin(f.a) >= -0.2);
    geri.forEach(yaprak);
    // hurma salkımları
    for (const [dx, dy, r] of [[-7, 7, 3.4], [-2, 9, 3], [4, 7, 3.2], [-4, 11, 2.6], [1, 12, 2.4]]) {
      ctx.beginPath(); ctx.arc(C[0] + dx, C[1] + dy, r, 0, Math.PI * 2); ctx.fillStyle = '#B5652A'; ctx.fill();
      ctx.beginPath(); ctx.arc(C[0] + dx + r * 0.3, C[1] + dy - r * 0.3, r * 0.45, 0, Math.PI * 2); ctx.fillStyle = '#E39A4F'; ctx.fill();
    }
    on.forEach(yaprak);
  }
  function sadirvan(cx, cy) {
    // zeminde koyu taş sekizgen kuşak (avlu madalyonu) ve yıldız kakma
    doldur(W(sekizgen(cx, cy, 46, 0)), '#E2D3B3');
    cizgi(W(sekizgen(cx, cy, 46, 0)), 'rgba(160,140,104,0.7)', 1, true);
    doldur(W(sekizgen(cx, cy, 40, 0)), '#F1E8D4');
    const yildiz = [];
    for (let i = 0; i < 16; i++) { const a = (i * Math.PI) / 8 - Math.PI / 8; const r = i % 2 ? 33 : 40; yildiz.push([cx + r * Math.cos(a), cy + r * Math.sin(a), 0]); }
    cizgi(W(yildiz), 'rgba(176,150,104,0.65)', 1, true);
    // havuz duvarı (dış), kenar taşı, iç duvar ve su
    prizma(cx, cy, 0, 11, 30, 8, TAS, { t0: -Math.PI / 8, ust: false });
    doldur(W(sekizgen(cx, cy, 31.5, 11)), TAS(0.96));
    const ac = W(sekizgen(cx, cy, 26, 11));
    doldur(ac, '#A9987A');
    ctx.save();
    yolCiz(ac); ctx.clip();
    const su = W(sekizgen(cx, cy, 26, 7));
    const ys = su.map((q) => q[1]);
    const sg = ctx.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys));
    sg.addColorStop(0, '#6FB9CF'); sg.addColorStop(1, '#A9DDE8');
    doldur(su, sg);
    // halkalar
    const m = P(cx, cy, 7);
    for (const r of [9, 15, 21]) { ctx.beginPath(); ctx.ellipse(m[0], m[1], r * 1.22, r * 0.71, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(235,250,252,0.55)'; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
    cizgi(W([[cx - 31.5 * Math.cos(Math.PI / 8), cy + 31.5 * Math.sin(Math.PI / 8), 11], [cx - 31.5 * Math.sin(Math.PI / 8), cy + 31.5 * Math.cos(Math.PI / 8), 11], [cx + 31.5 * Math.sin(Math.PI / 8), cy + 31.5 * Math.cos(Math.PI / 8), 11], [cx + 31.5 * Math.cos(Math.PI / 8), cy + 31.5 * Math.sin(Math.PI / 8), 11], [cx + 31.5 * Math.cos(Math.PI / 8), cy - 31.5 * Math.sin(Math.PI / 8), 11]]), 'rgba(255,255,255,0.7)', 1.1);
    // orta ayak, kâse ve altın fıskiye
    prizma(cx, cy, 7, 24, 4.5, 8, TAS, { t0: -Math.PI / 8 });
    koni(cx, cy, 24, 30, 4.5, 12.5, 8, TAS, { t0: -Math.PI / 8, amb: 0.3, dif: 0.7 });
    doldur(W(sekizgen(cx, cy, 12.5, 30)), TAS(0.95));
    doldur(W(sekizgen(cx, cy, 10, 30)), '#86CADA');
    prizma(cx, cy, 30, 36, 1.8, 8, ALTIN, { t0: -Math.PI / 8, amb: 0.3, dif: 0.7 });
    const u = P(cx, cy, 38);
    kure(u[0], u[1], 2.6);
    // fıskiyeden kâseye düşen ince su yayları
    ctx.lineCap = 'round';
    for (const a of [0.3, 1.9, 3.5, 5.1]) {
      const e = P(cx + 10.5 * Math.cos(a), cy + 10.5 * Math.sin(a), 30.5);
      ctx.beginPath(); ctx.moveTo(u[0], u[1] - 1); ctx.quadraticCurveTo((u[0] + e[0]) / 2, u[1] - 7, e[0], e[1]);
      ctx.strokeStyle = 'rgba(225,246,250,0.9)'; ctx.lineWidth = 1.1; ctx.stroke();
    }
  }

  // --- arka bahçe (yapının arkasında kalanlar) önce
  cali(400, 40, 0, 16, 0); cali(440, 70, 0, 13, 1);
  cali(470, 120, 0, 15, 1); cali(30, 180, 0, 11, 0);
  hurma(HX, HY, HH);
  minareTam();
  yapi();
  sadirvan(SX, SY);
  // sağ çimendeki çalılar ve çiçekler
  {
    // sağ çimende çiçekli çalılar (arkadan öne)
    const sag = [[440, 130, 11, 1], [492, 160, 13, 0], [420, 190, 14, 0], [470, 205, 12, 1], [460, 240, 17, 2], [405, 260, 11, 1], [492, 280, 10, 2]];
    sag.sort((a, b) => a[0] + a[1] - (b[0] + b[1]));
    for (const [x, y, rr, ton] of sag) {
      cali(x, y, 0, rr, ton);
      cicek(x, y, rr * 1.75, 7.5, '#FFFFFF');
      if (rr > 12) cicek(x + rr * 0.5, y - rr * 0.3, rr * 1.6, 6.5, (x + y) % 3 ? '#FFFFFF' : '#F7C6D4');
    }
  }
  // sol tarh ve sağ-ön tarh, ön sıra tarh
  tarh(28, 388, 196, 494, 16);
  tarhDoldur(28, 388, 196, 494, 16, 22);
  tarh(290, 340, 490, 470, 16);
  tarhDoldur(290, 340, 490, 470, 16, 26);
  // ön köşeye yakın küçük çalılar ve yol fenerleri
  fener(256, 300);
  cali(240, 492, 0, 12, 1); cali(500, 270, 0, 12, 0);
  fener(266, 500); fener(500, 308);

  SAHNE.hazir();
