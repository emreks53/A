<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-108 Kâğıt Mozaik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fbf9f3; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-108 Kâğıt Mozaik — sahne, küçük yırtık ve kesik renkli kâğıt parçalarının mozaik taşları gibi dizilmesiyle
// kurulur. Parçalar biçimlerin dış çizgisini sıra sıra izler (opus vermiculatum), gökte nesnelerin çevresinde
// iki sıra hale, sonra dalgalı yatay sıralar (opus tessellatum), güneşin çevresinde halka sıraları vardır.
// Parçaların arasında beyaz zeminin ince aralıkları görünür; mat kâğıt yüzeyi, yumuşak yırtık kenarlar.
// Yöntem: bölge (etiket) haritası → bölge sınırlarına uzaklık (tam Öklid uzaklık dönüşümü) → sıra numarası →
// her sıranın orta çizgisine aralıklı tohumlar → aynı sırada çok kaynaklı büyütme (parça kimliği) → parça
// sınırlarına uzaklıkla gürültülü aralık, yırtık kenarda açık kâğıt özü, aralıkta hafif gölge.
(function () {
  const S = SAHNE;
  const K = 2;
  const W = 1024 * K, H = 1024 * K, N = W * H;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(11), n2 = gurultu(12), n3 = gurultu(13);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const karis = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const palet = (liste) => liste.map(hex);
  const sec = (pal, t, r, yay) => pal[clamp(Math.round(t * (pal.length - 1) + (r() - 0.5) * (yay || 1.4)), 0, pal.length - 1)];

  // ------------------------------------------------------------ etiket (bölge) haritası
  const ET = [null]; // 0: yok
  const et = (o) => { ET.push(o); return ET.length - 1; };
  const lt = S.yeniTuval(W, H);
  const lc = lt.getContext('2d', { willReadFrequently: true });
  lc.setTransform(K, 0, 0, K, 0, 0);
  const boya = (id, yol, cizgi) => {
    const renk = `rgb(${id & 255},${id >> 8},0)`;
    if (cizgi) { lc.strokeStyle = renk; lc.lineWidth = cizgi; lc.lineCap = 'round'; lc.lineJoin = 'round'; lc.stroke(typeof yol === 'string' ? new Path2D(yol) : yol); }
    else { lc.fillStyle = renk; lc.fill(typeof yol === 'string' ? new Path2D(yol) : yol); }
  };
  const dikd = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const gunes = S.gunes;

  // paletler
  const GOKP = palet(['#D6EEFB', '#BDE2F8', '#9FD2F4', '#82C1F0', '#68AFEC', '#529FE6', '#4290DF']);
  const SICAK = hex('#FFF3C8');
  const BULUTP = palet(['#DCE8F6', '#E8F0FA', '#F2F7FC', '#FAFCFE']);
  const ZEMINP = palet(['#E2C68C', '#EBD5A2', '#F3E3BC', '#F8EDD2']);
  const KREMP = palet(['#D6CDB9', '#E1D9C7', '#EAE3D3', '#F2ECDF', '#F8F3E8']);
  const ALTINP = palet(['#D19A26', '#E2B33A', '#F0C94E', '#F8DD7A']);
  const KUBBEP = palet(['#1C6A35', '#227A3D', '#2A8A45', '#35994E', '#43A85A', '#58B966', '#70C874', '#8AD584']);
  const YAPRAKP = [palet(['#3E8A3E', '#4C9A44', '#5AA84C']), palet(['#5AA84C', '#6CB654', '#7EC35C']), palet(['#2F7A3C', '#3C8A42', '#4A984A']), palet(['#79BA52', '#8CC85E', '#9ED36A'])];
  const PEMBE = palet(['#F6C2D0', '#F2AEC2', '#EE9AB4']);
  const BEYAZP = palet(['#F1E8E6', '#F7F0EC', '#FCF6F1']);

  // gök
  const GOK = et({
    mod: 'gok', h: 13, renk(x, y, r) {
      const ds = Math.hypot(x - gunes.x, y - gunes.y);
      let c = sec(GOKP, clamp(1 - y / 820, 0, 1), r, 1.8);
      if (ds < 330) c = karis(c, SICAK, Math.pow(1 - ds / 330, 1.4) * 0.85);
      return c;
    },
  });
  lc.fillStyle = `rgb(${GOK},0,0)`; lc.fillRect(0, 0, 1024, 1024);
  const GUNES = et({ mod: 'kontur', h: 10, renk: (x, y, r) => sec(palet(['#FFB52E', '#FFC23A', '#FFD04A', '#FFDC62']), 0.5, r, 3.5) });
  boya(GUNES, S.daireYolu(gunes.x, gunes.y, 58));
  function bulutYolu(cx, cy, s, tip) {
    const Wb = 100 * s;
    const kumeler = tip === 0 ? [[-0.6, 0.04, 0.36], [-0.2, -0.2, 0.5], [0.28, -0.12, 0.44], [0.66, 0.06, 0.32]] : [[-0.55, 0.02, 0.34], [-0.12, -0.16, 0.44], [0.38, -0.02, 0.38], [0.1, -0.34, 0.3]];
    const p = new Path2D();
    for (let i = 0; i < 240; i++) {
      const t = (i / 240) * Math.PI * 2, dx = Math.cos(t), dy = Math.sin(t);
      let en = 0;
      for (const [px, py, pr] of kumeler) {
        const qx = px * Wb, qy = py * Wb, rr = pr * Wb, b = dx * qx + dy * qy, disk = rr * rr - (qx * qx + qy * qy - b * b);
        if (disk > 0) en = Math.max(en, b + Math.sqrt(disk));
      }
      if (dy > 0.02) en = Math.min(en, (0.24 * Wb) / dy);
      i ? p.lineTo(cx + dx * en, cy + dy * en) : p.moveTo(cx + dx * en, cy + dy * en);
    }
    p.closePath();
    return p;
  }
  const BULUT = et({ mod: 'kontur', h: 11, renk: (x, y, r) => sec(BULUTP, 0.7, r, 3) });
  for (const [cx, cy, s, t] of [[165, 252, 1.15, 0], [470, 150, 0.9, 1], [770, 330, 0.78, 0], [96, 498, 0.58, 1], [944, 470, 0.6, 0]]) boya(BULUT, bulutYolu(cx, cy, s, t));
  const ZEMIN = et({ mod: 'zemin', h: 13, renk: (x, y, r) => sec(ZEMINP, clamp((y - 800) / 224, 0, 1) * 0.4 + 0.45, r, 2.6) });
  lc.fillStyle = `rgb(${ZEMIN},0,0)`; lc.fillRect(0, 800, 1024, 224);

  // minare
  const kremX = (x1, x2) => (x, y, r) => sec(KREMP, clamp((x - x1) / (x2 - x1), 0, 1) * 1.05, r, 1.3);
  const KAHVE = palet(['#7E6D58', '#8B7A62', '#97866C']);
  for (const p of S.minareParcalari()) {
    if (p.tip === 'alem') continue;
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      const x1 = Math.min(...xs), x2 = Math.max(...xs);
      const serefe = p.ad.startsWith('şerefe') || p.ad === 'bilezik';
      const id = et({ mod: 'kontur', h: serefe ? 5 : p.ad.startsWith('çıkma') ? 6 : 8, renk: serefe ? (x, y, r) => sec(palet(['#D9C59C', '#E6D6B2', '#F0E4C8']), 0.5, r, 3) : kremX(x1, x2) });
      boya(id, S.yol(p.noktalar, true));
    } else if (p.tip === 'korkuluk') {
      const id = et({ mod: 'kontur', h: 5, renk: kremX(p.x1, p.x2) });
      boya(id, dikd(p.x1, p.y1, p.x2, p.y2));
      const cb = et({ mod: 'serit', h: 6, renk: (x, y, r) => sec(KAHVE, 0.5, r, 3) });
      for (let i = 0; i < 9; i++) { const x = p.x1 + 6 + ((p.x2 - p.x1 - 12) * i) / 8; boya(cb, dikd(x - 2, p.y1 + 4, x + 2, p.y2 - 3)); }
    } else if (p.tip === 'bant') {
      const id = et({ mod: 'kontur', h: 6, renk: kremX(p.x1, p.x2) });
      boya(id, dikd(p.x1, p.y1, p.x2, p.y2));
      S.zikzakCizgileri().forEach((z, k) => {
        const zi = et({ mod: 'serit', h: 6, renk: k === 1 ? (x, y, r) => sec(palet(['#2F86B8', '#3A96C4', '#4AA4D0']), 0.5, r, 3) : (x, y, r) => sec(palet(['#D0603E', '#DC7048', '#E67F55']), 0.5, r, 3) });
        boya(zi, S.yol(z), 5.2);
      });
    } else if (p.tip === 'topuz') {
      const id = et({ mod: 'kontur', h: 7, renk: kremX(270, 330) });
      boya(id, p.yol);
    }
  }
  const MPEN = et({ mod: 'kontur', h: 4, renk: (x, y, r) => sec(KAHVE, 0.5, r, 3) });
  for (const p of S.minarePencereleri) boya(MPEN, S.kemerYolu(p.x, p.y, p.w + 1, p.h + 1));
  const ALTIN = et({ mod: 'kontur', h: 3.6, renk: (x, y, r) => sec(ALTINP, 0.6, r, 3) });
  const alemCiz = (a) => {
    boya(ALTIN, dikd(a.cubuk.x1 - 0.8, a.cubuk.y1, a.cubuk.x2 + 0.8, a.cubuk.y2));
    boya(ALTIN, S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 }));
    for (const k of a.kureler) boya(ALTIN, S.daireYolu(k.cx, k.cy, k.r));
    boya(ALTIN, S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R * 1.12));
  };
  alemCiz(S.alemParcalari(300, 146, 0.62));

  // kaide
  const KA = S.kaide;
  const KAIDE = et({ mod: 'kontur', h: 10, renk: (x, y, r) => sec(KREMP, clamp((x - 300) / 380, 0, 1), r, 1.4) });
  boya(KAIDE, dikd(KA.x1, KA.y1, KA.x2, KA.y2));
  const KORNIS = et({ mod: 'kontur', h: 6, renk: (x, y, r) => sec(KREMP, 0.85, r, 1.4) });
  boya(KORNIS, dikd(KA.kornis.x1, KA.kornis.y1, KA.kornis.x2, KA.kornis.y2));
  const KPEN = et({ mod: 'kontur', h: 6, renk: (x, y, r) => sec(KAHVE, 0.5, r, 3) });
  for (const p of KA.pencereler) boya(KPEN, S.kemerYolu(p.x, p.y, p.w, p.h));

  // kasnak
  const KS = S.kasnak;
  const KAS1 = et({ mod: 'kontur', h: 9, renk: (x, y, r) => sec(KUBBEP, clamp((x - 334) / 452, 0, 1) * 0.55 + 0.08, r, 1.6) });
  boya(KAS1, dikd(KS[1].x1, KS[1].y1, KS[1].x2, KS[1].y2));
  const KPEN2 = et({ mod: 'kontur', h: 5, renk: (x, y, r) => sec(palet(['#0F3A1E', '#14462A', '#1A5232']), 0.5, r, 3) });
  for (const p of S.kasnakPencereleri(1)) boya(KPEN2, S.kemerYolu(p.x, p.y, p.w, p.h));
  const KAS0 = et({ mod: 'kontur', h: 8, renk: (x, y, r) => sec(KUBBEP, clamp((x - 352) / 416, 0, 1) * 0.6 + 0.18, r, 1.6) });
  boya(KAS0, dikd(KS[0].x1, KS[0].y1, KS[0].x2, KS[0].y2));
  for (const p of S.kasnakPencereleri(0)) boya(KPEN2, S.kemerYolu(p.x, p.y, p.w, p.h));

  let KUBBE_R = null;
  // kubbe: 16 dilim, her dilim ayrı bölge (sıralar dilim kenarlarını izler); kaburgalar ince koyu şerit
  {
    const prof = S.kubbeProfili(60);
    const kubbeRenk = (x, y, r) => {
      const t = clamp((x - 380) / 360, 0, 1) * 0.8 + clamp((520 - y) / 220, 0, 1) * 0.25 - 0.05;
      return sec(KUBBEP, clamp(t, 0, 1), r, 1.2);
    };
    const kubbeR = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      const yy = y / K;
      kubbeR[y] = 0;
      for (let i = 0; i < prof.length - 1; i++) if (yy <= prof[i].y && yy >= prof[i + 1].y) { const t = (prof[i].y - yy) / (prof[i].y - prof[i + 1].y || 1); kubbeR[y] = prof[i].r + (prof[i + 1].r - prof[i].r) * t; break; }
    }
    KUBBE_R = kubbeR;
    for (let k = 0; k < 16; k++) {
      const b1 = -Math.PI / 2 + (Math.PI * k) / 16, b2 = b1 + Math.PI / 16;
      const u1 = Math.sin(b1), u2 = Math.sin(b2);
      const sol = prof.map((q) => [560 + u1 * q.r, q.y]);
      const sag = prof.map((q) => [560 + u2 * q.r, q.y]).reverse();
      const id = et({ mod: 'kubbe', h: 12, b1, b2, ncol: u2 - u1 > 0.15 ? 2 : 1, renk: kubbeRenk });
      boya(id, S.yol(sol.concat(sag), true));
    }
    const KAB = et({ mod: 'serit', h: 8, renk: (x, y, r) => sec(palet(['#155028', '#195A2F', '#1D6535']), 0.5, r, 3) });
    for (const k of S.kaburgalar(16)) boya(KAB, S.yol(k.noktalar.slice(0, -3)), 3.2 + 2.6 * Math.cos(k.boylam));
    // tepe: kaburgaların birleştiği yerde halka sıralı küçük parçalar
    const TEPE = et({ mod: 'kontur', h: 6, renk: kubbeRenk });
    lc.save(); lc.beginPath(); lc.rect(0, 0, 1024, 342); lc.clip(); boya(TEPE, S.kubbeYolu); lc.restore();
  }
  alemCiz(S.alemParcalari(560, 300, 1));

  // bitkiler
  const bit = S.bitki;
  const SAP = et({ mod: 'serit', h: 9, renk: (x, y, r) => sec(palet(['#3F7F34', '#4A8C3A', '#57984A']), 0.5, r, 3) });
  for (const s of bit.saplar) boya(SAP, S.yol(s), 5);
  const rp = S.rng(808);
  for (const y of bit.yapraklar) {
    const pal = YAPRAKP[Math.floor(rp() * YAPRAKP.length)];
    const id = et({ mod: 'kontur', h: y.uzunluk > 50 ? 6 : 5, renk: (x, yy, r) => sec(pal, 0.5, r, 2.6) });
    boya(id, S.yaprakYolu({ ...y, uzunluk: y.uzunluk * 1.05 }));
  }
  const TOM = et({ mod: 'kontur', h: 4, renk: (x, y, r) => sec(PEMBE, 0.6, r, 2.5) });
  for (const t of bit.tomurcuklar) boya(TOM, S.tomurcukYolu(t));
  for (const c of bit.cicekler) {
    for (const e of S.tacYapraklari(c)) {
      const id = et({
        mod: 'kontur', h: c.r > 40 ? 9 : 6, renk(x, y, r) {
          const d = Math.hypot(x - c.x, y - c.y) / c.r;
          return d < 0.42 ? sec(PEMBE, 0.2, r, 1.5) : sec(BEYAZP, 0.75, r, 1.8);
        },
      });
      boya(id, S.elipsYolu({ ...e, rx: e.rx * 1.04, ry: e.ry * 1.06 }));
    }
    const ort = et({ mod: 'kontur', h: c.r > 40 ? 4.5 : 3.5, renk: (x, y, r) => sec(palet(['#E39A24', '#EDB22C', '#F4C83A']), 0.6, r, 2.5) });
    boya(ort, S.daireYolu(c.x, c.y, c.r * 0.22));
  }

  // ------------------------------------------------------------ etiketleri oku
  const lv = lc.getImageData(0, 0, W, H).data;
  const L = new Int32Array(N);
  for (let i = 0; i < N; i++) { const id = lv[i * 4] + (lv[i * 4 + 1] << 8); L[i] = id < ET.length && lv[i * 4 + 2] === 0 ? id : 0; }

  // ------------------------------------------------------------ Öklid uzaklık dönüşümü (Felzenszwalb)
  function edt(f) {
    const n = Math.max(W, H);
    const d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1), g = new Float64Array(n);
    const bir = (len) => {
      let k = 0; v[0] = 0; z[0] = -1e30; z[1] = 1e30;
      for (let q = 1; q < len; q++) {
        let s = (g[q] + q * q - (g[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = (g[q] + q * q - (g[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = 1e30;
      }
      k = 0;
      for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + g[v[k]]; }
    };
    for (let x = 0; x < W; x++) { for (let y = 0; y < H; y++) g[y] = f[y * W + x]; bir(H); for (let y = 0; y < H; y++) f[y * W + x] = d[y]; }
    for (let y = 0; y < H; y++) { const o = y * W; for (let x = 0; x < W; x++) g[x] = f[o + x]; bir(W); for (let x = 0; x < W; x++) f[o + x] = Math.sqrt(d[x]); }
    return f;
  }
  const D = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = L[i];
    const sinir = x === 0 || y === 0 || x === W - 1 || y === H - 1 || L[i - 1] !== l || L[i + 1] !== l || L[i - W] !== l || L[i + W] !== l;
    D[i] = sinir ? 0 : 1e20;
  }
  edt(D);

  // ------------------------------------------------------------ sıra koordinatı ve anahtar
  const RHO = new Float32Array(N), KEY = new Int32Array(N), HH = new Float32Array(ET.length);
  for (let k = 1; k < ET.length; k++) HH[k] = ET[k].h * K;
  const RS = 205 * K; // güneş halkalarının yarıçapı
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = L[i];
    if (!l) { KEY[i] = -1; continue; }
    const e = ET[l], h = HH[l];
    let rho = D[i], band;
    if (e.mod === 'gok' || e.mod === 'zemin') {
      const ds = Math.hypot(x - gunes.x * K, y - gunes.y * K);
      if (e.mod === 'gok' && ds < RS) { rho = ds; band = 1000 + Math.floor(ds / h); }
      else if (D[i] < 2 * h) band = Math.floor(D[i] / h);
      else { rho = y + 16 * K * Math.sin(x / W * Math.PI * 2 * 1.3 + 0.7) + 7 * K * Math.sin(x / W * Math.PI * 2 * 3.1 + 2.1); band = 2000 + Math.floor(rho / h); }
    } else if (e.mod === 'kubbe') {
      const R = KUBBE_R[y] || 1;
      const u = clamp((x / K - 560) / R, -1, 1);
      const f = clamp((Math.asin(u) - e.b1) / (e.b2 - e.b1), 0, 0.9999) * e.ncol;
      band = Math.floor(f);
      const kol = (R * (Math.sin(e.b2) - Math.sin(e.b1)) * K) / e.ncol;
      rho = h / 2 + (f - band - 0.5) * kol;
    } else band = Math.floor(D[i] / h);
    RHO[i] = rho;
    KEY[i] = l * 4096 + clamp(band, 0, 4095);
  }

  // ------------------------------------------------------------ tohumlar: her sıranın orta çizgisinde aralıklı
  const rs = S.rng(1080);
  let aday = [];
  for (let i = 0; i < N; i++) {
    const l = L[i];
    if (!l || ET[l].mod === 'serit') continue;
    const h = HH[l];
    if (ET[l].mod === 'kubbe') { if (Math.abs(RHO[i] - h / 2) < 0.75) aday.push(i); continue; }
    const f = RHO[i] % h;
    if (Math.abs(f - h / 2) < 0.75) aday.push(i);
  }
  aday = Int32Array.from(aday);
  for (let i = aday.length - 1; i > 0; i--) { const j = Math.floor(rs() * (i + 1)); const t = aday[i]; aday[i] = aday[j]; aday[j] = t; }
  const GH = 48, GW = Math.ceil(W / GH), GHh = Math.ceil(H / GH);
  const hucre = new Array(GW * GHh);
  const tohumlar = [];
  for (const i of aday) {
    const x = i % W, y = (i / W) | 0, l = L[i], key = KEY[i];
    const h = HH[l];
    const ara = h * (0.95 + 0.25 * n1(x * 0.02, y * 0.02));
    const cx = (x / GH) | 0, cy = (y / GH) | 0;
    let tamam = true;
    for (let yy = cy - 1; yy <= cy + 1 && tamam; yy++) for (let xx = cx - 1; xx <= cx + 1 && tamam; xx++) {
      if (xx < 0 || yy < 0 || xx >= GW || yy >= GHh) continue;
      const liste = hucre[yy * GW + xx];
      if (!liste) continue;
      for (const s of liste) { if (KEY[s] === key) { const sx = s % W, sy = (s / W) | 0; if ((sx - x) * (sx - x) + (sy - y) * (sy - y) < ara * ara) { tamam = false; break; } } }
    }
    if (!tamam) continue;
    tohumlar.push(i);
    (hucre[cy * GW + cx] || (hucre[cy * GW + cx] = [])).push(i);
  }

  // ------------------------------------------------------------ aynı sıra içinde çok kaynaklı büyütme → parça kimliği
  const T = new Int32Array(N).fill(-1);
  let q1 = new Int32Array(N), q2 = new Int32Array(N);
  let n1q = 0;
  tohumlar.forEach((s, k) => { T[s] = k; q1[n1q++] = s; });
  const D4 = [1, -1, W, -W], D8 = [1, -1, W, -W, W + 1, W - 1, -W + 1, -W - 1];
  let katman = 0;
  while (n1q) {
    let n2q = 0;
    const kom = katman % 3 === 2 ? D8 : D4; // 4/8 komşuluk karışımı: daha yuvarlak sınırlar
    for (let a = 0; a < n1q; a++) {
      const p = q1[a], key = KEY[p], t = T[p];
      const px = p % W;
      for (const dd of kom) {
        const q = p + dd;
        if (q < 0 || q >= N) continue;
        const qx = q % W;
        if (Math.abs(qx - px) > 1) continue;
        if (T[q] !== -1 || KEY[q] !== key) continue;
        T[q] = t; q2[n2q++] = q;
      }
    }
    const tmp = q1; q1 = q2; q2 = tmp; n1q = n2q; katman++;
  }
  // kalan (tohumsuz) yerler: sınırlı derinlikte oyarak şerit parçaları
  let sonId = tohumlar.length;
  const parcaTohum = tohumlar.slice();
  for (let i = 0; i < N; i++) {
    if (T[i] !== -1 || KEY[i] < 0) continue;
    const key = KEY[i], lim = Math.round(HH[L[i]] * 1.25);
    const id = sonId++;
    parcaTohum.push(i);
    T[i] = id;
    let a1 = 0; q1[0] = i; n1q = 1; let derin = 0;
    while (n1q && derin < lim) {
      let n2q = 0;
      for (let a = 0; a < n1q; a++) {
        const p = q1[a], px = p % W;
        for (const dd of D4) {
          const q = p + dd;
          if (q < 0 || q >= N || Math.abs((q % W) - px) > 1) continue;
          if (T[q] !== -1 || KEY[q] !== key) continue;
          T[q] = id; q2[n2q++] = q;
        }
      }
      const tmp = q1; q1 = q2; q2 = tmp; n1q = n2q; derin++;
    }
  }

  // ------------------------------------------------------------ parça renkleri
  const PR = new Float32Array(sonId * 3), PO = new Float32Array(sonId);
  for (let k = 0; k < sonId; k++) {
    const s = parcaTohum[k], l = L[s];
    const r = S.rng(k * 7 + 13);
    const c = ET[l].renk((s % W) / K, ((s / W) | 0) / K, r);
    const p = 1 + (r() - 0.5) * 0.06;
    PR[k * 3] = c[0] * p; PR[k * 3 + 1] = c[1] * p; PR[k * 3 + 2] = c[2] * p;
    PO[k] = r() * 100;
  }

  // ------------------------------------------------------------ parça sınırlarına uzaklık → aralıklar
  const E = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, t = T[i];
    const sinir = t < 0 || x === 0 || y === 0 || x === W - 1 || y === H - 1 || T[i - 1] !== t || T[i + 1] !== t || T[i - W] !== t || T[i + W] !== t;
    E[i] = sinir ? 0 : 1e20;
  }
  edt(E);

  // ------------------------------------------------------------ boyama
  const im = ctx.createImageData(W, H), d = im.data;
  const ZR = 253, ZG = 252, ZB = 248; // beyaz zemin
  const golgeKay = Math.round(1.5 * K);
  const araBoy = (l) => (l ? Math.min(0.85 * K, HH[l] * 0.1) : 0.85 * K);
  const tane = S.rng(4242);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = i * 4, t = T[i];
    const l = L[i];
    const yirtik = n2(x * 0.11, y * 0.11);
    const gw = araBoy(l) * (0.55 + 0.9 * yirtik) + 0.25;
    const g = (tane() - 0.5) * 6;
    if (t < 0 || E[i] < gw) {
      // aralık: beyaz zemin; sağ üstündeki parçanın hafif gölgesi
      let k = 1;
      const j = i - golgeKay * W + golgeKay;
      if (y >= golgeKay && x < W - golgeKay && T[j] >= 0 && E[j] >= gw) k = 0.84;
      d[o] = ZR * k + g; d[o + 1] = ZG * k + g; d[o + 2] = (ZB * k + g) * (k < 1 ? 1.02 : 1); d[o + 3] = 255;
      continue;
    }
    let r = PR[t * 3], gg = PR[t * 3 + 1], b = PR[t * 3 + 2];
    // mat kâğıt: lif bulutları ve ince diş
    const lif = (n3(x * 0.045 + PO[t], y * 0.045) - 0.5) * 0.1 + (n1(x * 0.21 + PO[t], y * 0.21) - 0.5) * 0.05;
    const m = 1 + lif;
    r *= m; gg *= m; b *= m;
    // yırtık kenar: kâğıdın açık özü (her kenarda değil, gürültüyle)
    const kenar = E[i] - gw;
    if (kenar < 1.2 * K && yirtik > 0.6) {
      const a = (1 - kenar / (1.2 * K)) * clamp((yirtik - 0.6) * 4, 0, 1) * 0.42;
      r += (255 - r) * a; gg += (252 - gg) * a; b += (246 - b) * a;
    } else if (kenar < 0.9 * K) {
      // kesik kenar: çok hafif koyu çizgi (kâğıdın kalınlığı)
      const a = (1 - kenar / (0.9 * K)) * 0.07;
      r *= 1 - a; gg *= 1 - a; b *= 1 - a;
    }
    d[o] = r + g; d[o + 1] = gg + g; d[o + 2] = b + g; d[o + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
  S.hazir();
})();
</script>
