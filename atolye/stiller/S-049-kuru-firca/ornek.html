<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-049 Kuru Fırça — suyu neredeyse alınmış fırça pürüzlü kâğıdın üstünden kayar: boya yalnız kâğıt dişinin
// tepelerine tutunur, çukurlar beyaz benek olarak kalır. Her darbe tek tek kıllardan oluşan çizgili bir
// izdir; boyası tükendikçe kırılır, ucu tüy gibi dağılır. Saydam renk katları üst üste biner (taş, yaprak,
// gök ayrı yönlerde), son olarak örtücü beyaz kuru darbeler eklenir.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Tohumlu değer gürültüsü (256 periyotlu, yumuşak). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32Array). */
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, r), w, h, r), w, h, r);

  // ------------------------------------------------------------ bölge haritası (istenen ölçekte)
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(olcek, cicek) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    SAHNE.ciz(g, { bolge: true, cicek: cicek !== false });
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Uint8Array(w * w), onb = new Map();
    for (let i = 0; i < w * w; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      out[i] = b;
    }
    return out;
  }
  /** Bir Path2D listesini (1024 koordinatında) olcek çözünürlüğünde 0..1 maskeye çevirir. */
  function maske(olcek, ciz) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff';
    ciz(g);
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Float32Array(w * w);
    for (let i = 0; i < w * w; i++) out[i] = v[i * 4 + 3] / 255;
    return out;
  }

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeRt = new Float32Array(W), kubbeDrt = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeRt[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDrt[y] = (kubbeRt[y + 1] - kubbeRt[y - 1]) / 2;
  kubbeDrt[300] = kubbeDrt[301] * 1.3; kubbeDrt[555] = kubbeDrt[554];
  function kubbeR(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeRt[555] : kubbeRt[i] * (1 - f) + kubbeRt[i + 1] * f; }
  function kubbeDr(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeDrt[555] : kubbeDrt[i] * (1 - f) + kubbeDrt[i + 1] * f; }
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(0.5, kubbeR(y)), -1, 1);
  /** Kubbe yüzey normali [nx, ny, nz] (ekran: x sağ, y aşağı, z izleyiciye). */
  function kubbeNormal(x, y) {
    const u = kubbeU(x, y), c = Math.sqrt(Math.max(0, 1 - u * u)), dr = kubbeDr(y), l = Math.hypot(u, dr, c) || 1;
    return [u / l, -dr / l, c / l];
  }
  function kubbeIsik(x, y) { const n = kubbeNormal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  /** Kubbenin minareye düşen gölgesi (minarenin sağ alt kısmı kubbenin arkasında kalır). */
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const BULUTLAR = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];

  const S = 2, W2 = W * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(4949);
  const nA = gurultu(51), nB = gurultu(52), nC = gurultu(53), nD = gurultu(54), nE = gurultu(55);

  // ------------------------------------------------------------ kâğıt dişi (2048): soğuk preslenmiş kâğıt, histogramla eşitlenmiş 0..1
  const T = new Float32Array(N2);
  {
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      T[py * W2 + px] = 0.5 * fbm(nA, px / 9, py / 9, 3) + 0.3 * nB(px / 4.2, py / 4.2) + 0.2 * nC(px / 2.1, py / 2.1);
    }
    const H = new Uint32Array(2048);
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < N2; i++) { if (T[i] < mn) mn = T[i]; if (T[i] > mx) mx = T[i]; }
    const k = 2047 / (mx - mn);
    for (let i = 0; i < N2; i++) H[((T[i] - mn) * k) | 0]++;
    const cdf = new Float32Array(2048); let acc = 0;
    for (let j = 0; j < 2048; j++) { acc += H[j]; cdf[j] = acc / N2; }
    for (let i = 0; i < N2; i++) T[i] = cdf[((T[i] - mn) * k) | 0];
  }

  // ------------------------------------------------------------ bölgeler ve maskeler
  const BOL1 = bolgeDizisi(1, true), BOL2 = bolgeDizisi(S, true);
  const sinif = (b) => (b === 'gok' || b === 'gunes' ? 1 : b === 'kubbe' ? 2 : b === 'kasnak' ? 3 : b === 'kaide' ? 4 : b === 'minare' ? 5 : b === 'pencere' ? 6 : b === 'altin' ? 7 : b === 'zemin' ? 8 : b === 'cicek' || b === 'cicekOrta' ? 10 : 9);
  const SIN = new Uint8Array(16); ADLAR.forEach((a, i) => (SIN[i] = sinif(a)));
  const sAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= W ? 0 : SIN[BOL1[(y | 0) * W + (x | 0)]]);
  /** Yumuşak ve pürüzlü kenarlı bölge maskesi (2048); tasma: kenarın ne kadar dışına taşabileceği (1024 px). */
  function bolgeMaske(siniflar, tasma) {
    const set = new Set(siniflar), m = new Float32Array(N2);
    for (let i = 0; i < N2; i++) m[i] = set.has(SIN[BOL2[i]]) ? 1 : 0;
    const bm = kutuBulanik(kutuBulanik(m, W2, W2, 3), W2, W2, 3);
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px;
      const n = (nE(px / 7, py / 7) - 0.5) * 0.6 + (nA(px / 2, py / 2) - 0.5) * 0.3;
      m[i] = sstep(0.5 - tasma * 0.12, 0.62 - tasma * 0.12, bm[i] + n * 0.5);
    }
    return m;
  }

  /** Pencereler için temiz kenarlı maske (küçük kemerler bozulmasın). */
  function temizMaske(siniflar) {
    const set = new Set(siniflar), m = new Float32Array(N2);
    for (let i = 0; i < N2; i++) m[i] = set.has(SIN[BOL2[i]]) ? 1 : 0;
    return kutuBulanik(m, W2, W2, 1);
  }

  // ------------------------------------------------------------ boya yüzeyi
  const CR = new Float32Array(N2).fill(250), CG = new Float32Array(N2).fill(247), CB = new Float32Array(N2).fill(239);
  const pc = SAHNE.yeniTuval(); pc.width = W2; pc.height = W2;
  const pg = pc.getContext('2d', { willReadFrequently: true }); pg.setTransform(S, 0, 0, S, 0, 0); pg.lineCap = 'round'; pg.lineJoin = 'round';
  const cc = SAHNE.yeniTuval(); cc.width = W2; cc.height = W2;
  const cg = cc.getContext('2d', { willReadFrequently: true }); cg.setTransform(S, 0, 0, S, 0, 0); cg.lineCap = 'round'; cg.lineJoin = 'round';

  const rgbs = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  function yenidenOrnekle(p, ad) {
    const out = [p[0]];
    for (let k = 1; k < p.length; k++) {
      const [xa, ya] = p[k - 1], [xb, yb] = p[k], l = Math.hypot(xb - xa, yb - ya), n = Math.max(1, Math.ceil(l / ad));
      for (let j = 1; j <= n; j++) out.push([xa + ((xb - xa) * j) / n, ya + ((yb - ya) * j) / n]);
    }
    return out;
  }
  let fircaNo = 0;
  const GRI = []; for (let v = 0; v < 256; v++) { const h = v.toString(16).padStart(2, '0'); GRI.push('#' + h + h + h); }
  /**
   * Kuru fırça darbesi: fırça pts çizgisi boyunca sürüklenir; nb kılın her birinin kendi boya yükü, başlangıcı ve bitişi
   * vardır. Darbenin başı dolu ve koyudur; boya azaldıkça kıl yalnız darbe yönünde uzamış bir "atlama" gürültüsünün
   * tepelerinde iz bırakır: beyaz boşluklar darbe yönünde uzar, kıl çizgileri ayrışır. Sona doğru kıllar açılır, tek tek
   * kesilir ve uç tüy gibi dağılır. Basınç gri tuvale ('lighten'), renk ayrı tuvale çizilir.
   */
  function firca(pts0, w, col, o) {
    o = o || {};
    const p0 = o.p == null ? 0.85 : o.p, kuru = o.kuru == null ? 0.55 : o.kuru, kil = o.kil || 1.0, sivri = o.sivri || 0, acil = o.acil == null ? 0.28 : o.acil;
    const pts = yenidenOrnekle(pts0, 2), n = pts.length; if (n < 2) return;
    const L = [0]; for (let k = 1; k < n; k++) L.push(L[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    const top = L[n - 1]; if (top < 1) return;
    const nr = pts.map((q, k) => { const a = pts[Math.max(0, k - 2)], b = pts[Math.min(n - 1, k + 2)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
    cg.strokeStyle = rgbs(col);
    const nb = Math.max(3, Math.round(w / (kil * 2.0))), sd = R() * 200; fircaNo++;
    for (let b = 0; b < nb; b++) {
      const v = (b / (nb - 1) - 0.5) * w + (R() - 0.5) * kil * 0.8;
      const kenar = Math.min(1, Math.abs(v) / (w / 2));
      const yuk = 0.45 + R() * 0.7;
      const t0 = R() * 0.04 + sivri * kenar * kenar * 0.45;
      const t1 = 1 - Math.pow(R(), 1.3) * 0.42 - sivri * kenar * kenar * 0.45 - (1.15 - yuk) * 0.12;
      if (t1 <= t0 + 0.03) continue;
      const lw = kil * (1.2 + R() * 1.1);
      pg.lineWidth = lw; cg.lineWidth = lw + 1.2;
      let px = null, py = null, sev = 0;
      for (let k = 0; k < n; k++) {
        const t = L[k] / top;
        const vv = v * (1 + acil * sstep(0.55, 1, t)) + (nE(b * 3.7 + sd, L[k] / 40) - 0.5) * kil * 1.2;
        const x = pts[k][0] + nr[k][0] * vv, y = pts[k][1] + nr[k][1] * vv;
        let a = 0;
        if (t >= t0 && t <= t1) {
          const tt = (t - t0) / (t1 - t0), kur = kuru * Math.pow(tt, 1.4);
          // atlama gürültüsü darbe yönünde uzun, enine birkaç kıl genişliğinde: beyaz benekler darbe boyunca uzar
          const sk = 0.68 * fbm(nD, L[k] / (28 * kil) + sd, v / (9 * kil) + sd * 0.37, 2) + 0.32 * nE(L[k] / (10 * kil) + sd, v / (2.6 * kil) + sd);
          const esik = 0.14 + kur * 0.7 + kenar * kenar * 0.14;
          a = p0 * yuk * sstep(esik, esik + 0.08, sk) * sstep(0, 0.025, tt) * sstep(1, 0.93, tt) * (1 + 0.35 * (1 - tt) * (1 - tt));
        }
        const lev = a > 0.03 ? Math.min(31, Math.round(a * 31)) : 0;
        if (px !== null && lev > 0) {
          if (lev !== sev) {
            if (sev > 0) { pg.stroke(); cg.stroke(); }
            pg.strokeStyle = GRI[lev * 8 + 7]; pg.beginPath(); cg.beginPath(); pg.moveTo(px, py); cg.moveTo(px, py); sev = lev;
          }
          pg.lineTo(x, y); cg.lineTo(x, y);
        } else if (sev > 0) { pg.stroke(); cg.stroke(); sev = 0; }
        px = x; py = y;
      }
      if (sev > 0) { pg.stroke(); cg.stroke(); }
    }
  }
  /** Katmanı tuvale aktar: basınç × maske, kâğıt dişiyle hafifçe eşiklenir; 'carp' saydam (çarpımsal), 'ort' örtücü. */
  function katman(maskeDizi, kip, guc) {
    const pv = pg.getImageData(0, 0, W2, W2).data, cv = cg.getImageData(0, 0, W2, W2).data;
    guc = guc == null ? 0.9 : guc;
    for (let i = 0; i < N2; i++) {
      let P = pv[i * 4] / 255; if (P <= 0.01) continue;
      if (maskeDizi) P *= maskeDizi[i];
      const dep = Math.min(1, P * 1.15) * sstep(0.05, 0.32, T[i] + P * 0.38) * guc; if (dep <= 0.003) continue;
      const r = cv[i * 4], g = cv[i * 4 + 1], b = cv[i * 4 + 2];
      if (kip === 'ort') { CR[i] += (r - CR[i]) * dep; CG[i] += (g - CG[i]) * dep; CB[i] += (b - CB[i]) * dep; }
      else { CR[i] *= 1 - dep * (1 - r / 255); CG[i] *= 1 - dep * (1 - g / 255); CB[i] *= 1 - dep * (1 - b / 255); }
    }
    pg.save(); pg.setTransform(1, 0, 0, 1, 0, 0); pg.globalCompositeOperation = 'source-over'; pg.clearRect(0, 0, W2, W2); pg.restore();
    cg.save(); cg.setTransform(1, 0, 0, 1, 0, 0); cg.clearRect(0, 0, W2, W2); cg.restore();
  }
  pg.globalCompositeOperation = 'lighten'; pg.strokeStyle = '#fff';

  /** Yön alanını izleyen darbe çizgisi; bölge dışına çıkınca (biraz taşarak) durur. */
  function yol(x, y, yonFn, L, cls, adim) {
    adim = adim || 4;
    const pts = [[x, y]];
    let a = yonFn(x, y), disari = 0;
    for (let s = 0; s < L; s += adim) {
      a = a * 0.7 + yonFn(x, y) * 0.3;
      x += Math.cos(a) * adim; y += Math.sin(a) * adim;
      if (cls && !cls.includes(sAt(x, y))) { disari += adim; if (disari > 6) break; } else disari = 0;
      pts.push([x, y]);
    }
    return pts;
  }
  function dagit(cls, adet, kutu, kabul, yap) {
    const [x0, y0, x1, y1] = kutu;
    let k = 0, deneme = 0;
    while (k < adet && deneme < adet * 30) {
      deneme++;
      const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0);
      if (!cls.includes(sAt(clamp(x, 0, W - 1), y))) continue;
      if (kabul && R() > kabul(x, y)) continue;
      yap(x, y); k++;
    }
  }
  const oyn = (c, k) => { const f = 1 + (R() - 0.5) * k; return [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)]; };
  const RENK = {
    serulean: [118, 182, 232], kobalt: [52, 94, 198], ultramarin: [56, 70, 182], seftali: [248, 196, 134], limon: [252, 226, 96],
    sariYesil: [178, 214, 82], yaprakYesil: [76, 154, 62], viridyen: [20, 112, 86], koyuYesil: [16, 54, 54],
    okr: [226, 176, 92], siena: [200, 126, 66], morGri: [150, 134, 176], umber: [100, 60, 44], gul: [234, 124, 156], altin: [230, 170, 50],
  };

  // ------------------------------------------------------------ bulutlar: gök darbeleri bunların üstünden atlar, beyaz kâğıt kalır
  const bulutD = (x, y) => {
    let d = 0;
    for (const [bx, by, bs] of BULUTLAR) { const dx = (x - bx) / (125 * bs), dy = ((y - by) / (40 * bs)) * (y > by ? 1.8 : 1); d = Math.max(d, Math.exp(-(dx * dx + dy * dy))); }
    return d;
  };
  const bulutM = (x, y) => sstep(0.42, 0.55, bulutD(x, y) + (fbm(nC, x / 34, y / 26, 3) - 0.5) * 0.55);
  const gunesD = (x, y) => Math.hypot(x - 880, y - 140);

  // ================================================================ GÖK: az sayıda, uzun ve geniş süpürme
  {
    const m = bolgeMaske([1], 1.5);
    const mMavi = new Float32Array(N2), mGunes = new Float32Array(N2);
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px, x = px / S, y = py / S; if (!m[i]) continue;
      const gd = gunesD(x, y) + (nC(px / 30, py / 30) - 0.5) * 50;
      mMavi[i] = m[i] * sstep(80, 170, gd) * (1 - 0.94 * bulutM(x, y));
      mGunes[i] = m[i] * sstep(250, 140, gd) * sstep(50, 54, gunesD(x, y));
    }
    const gokYon = (x, y) => -0.1 + (nB(x / 320, y / 320) - 0.5) * 0.45;
    // 1) açık serulean: satır satır, birbirine binen fırça genişliğinde bantlar
    for (let y = 14; y < 792; y += 40) {
      let x = -200 + R() * 160;
      while (x < W) {
        const L = 280 + R() * 220;
        firca(yol(x, y + (R() - 0.5) * 16, gokYon, L, null, 6), 46 + R() * 18, oyn(RENK.serulean, 0.08), { p: 0.9 + R() * 0.1, kuru: 0.55 + R() * 0.3 });
        x += L * (0.7 + R() * 0.35);
      }
    }
    katman(mMavi, 'carp');
    // 2) kobalt ve ultramarin: üst gökte, daha kuru
    for (let y = 30; y < 470; y += 46) {
      let x = -220 + R() * 240;
      while (x < W) {
        const L = 200 + R() * 220;
        if (R() < 1.1 - y / 500) firca(yol(x, y + (R() - 0.5) * 16, gokYon, L, null, 6), 36 + R() * 18, oyn(R() < 0.6 ? RENK.kobalt : RENK.ultramarin, 0.08), { p: 0.85 + R() * 0.15, kuru: 0.6 + R() * 0.3 });
        x += L * (0.9 + R() * 0.6);
      }
    }
    katman(mMavi, 'carp', 0.85);
    // 3) ufka doğru sıcak şeftali
    for (let y = 600; y < 800; y += 34) {
      let x = -150 + R() * 150;
      while (x < W) { const L = 260 + R() * 200; firca(yol(x, y, gokYon, L, null, 6), 42 + R() * 16, oyn(RENK.seftali, 0.06), { p: 0.75, kuru: 0.55 }); x += L * (0.7 + R() * 0.4); }
    }
    katman(mMavi, 'carp', 0.75);
    // bulut altları: birkaç kuru mor-gri darbe
    for (const [bx, by, bs] of BULUTLAR) for (let k = 0; k < 3; k++) {
      const x = bx - 120 * bs + R() * 40 * bs, y = by + 6 * bs + k * 8 * bs;
      firca(yol(x, y, () => -0.04 + (R() - 0.5) * 0.1, (150 + R() * 70) * bs, null, 5), (12 + R() * 6) * Math.sqrt(bs), oyn(RENK.morGri, 0.08), { p: 0.7, kuru: 0.65 });
    }
    katman(m, 'carp', 0.75);
    // güneş: kâğıt beyazı disk; çevresinde teğet limon ve şeftali darbeleri
    // güneş diski boş kâğıt: kısa yatay darbeler diskin kenarından dışa doğru çekilir
    for (let y = 84; y <= 200; y += 13) {
      const dy = Math.abs(y - 140), hw = Math.sqrt(Math.max(0, 52 * 52 - dy * dy));
      for (const yonu of [-1, 1]) {
        const x = 880 + yonu * (hw + 2 + R() * 4);
        firca(yol(x, y + (R() - 0.5) * 4, () => (yonu > 0 ? 0 : Math.PI) + (R() - 0.5) * 0.06, 60 + R() * 70 + (52 - hw) * 0.8, null, 4), 14 + R() * 5, oyn(dy < 40 ? RENK.limon : RENK.seftali, 0.05), { p: 0.85, kuru: 0.7, acil: 0.4 });
      }
    }
    katman(mGunes, 'carp');
  }

  // ================================================================ KUBBE ve KASNAK
  {
    const mK = bolgeMaske([2], 0.6), mKs = bolgeMaske([3, 6], 0.4);
    const meridyen = (x, y) => Math.atan2(1, kubbeU(x, y) * kubbeDr(y)) + (nC(x / 40, y / 40) - 0.5) * 0.12;
    const yukari = (x, y) => meridyen(x, y) + Math.PI;
    const tabandan = (u, L, w, col, o) => { const y0 = 552 - R() * 6, x0 = 560 + u * kubbeR(y0) * 0.97; firca(yol(x0, y0, yukari, L, [2], 4), w, col, o); };
    // 1) sarı-yeşil: tabandan tepeye uzun meridyen darbeleri; yukarıda boya tükenir, ışık kâğıttan gelir
    for (let k = 0; k < 22; k++) tabandan(-1 + ((k + 0.5) / 22) * 2 + (R() - 0.5) * 0.04, 180 + R() * 100, 26 + R() * 8, oyn(RENK.sariYesil, 0.06), { p: 0.95, kuru: 0.5 });
    // tepeden aşağı birkaç kuru darbe: kubbe tepesi de boyanır, ışık yalnız benekler hâlinde kalır
    for (let k = 0; k < 12; k++) {
      const u = -0.85 + (k / 11) * 1.6 + (R() - 0.5) * 0.08, y0 = 306 + R() * 10, x0 = 560 + u * kubbeR(y0) * 0.9;
      firca(yol(x0, y0, meridyen, 90 + R() * 80, [2], 4), 18 + R() * 6, oyn(RENK.sariYesil, 0.06), { p: 0.85, kuru: 0.7 });
    }
    katman(mK, 'carp');
    // 2) yaprak yeşili: gölge yanı ve orta
    for (let k = 0; k < 18; k++) { const u = -1 + Math.pow(R(), 1.3) * 1.55; tabandan(u, 120 + R() * 120, 20 + R() * 8, oyn(RENK.yaprakYesil, 0.08), { p: 0.9, kuru: 0.6 }); }
    katman(mK, 'carp');
    // 3) viridyen ve koyu yeşil: sol kenarda derin gölge
    for (let k = 0; k < 12; k++) { const u = -1 + Math.pow(R(), 1.5) * 0.9; tabandan(u, 90 + R() * 110, 16 + R() * 8, oyn(R() < 0.55 ? RENK.viridyen : RENK.koyuYesil, 0.08), { p: 0.85, kuru: 0.6 }); }
    for (let k = 0; k < 9; k++) {
      const y = 532 + R() * 22, r = kubbeR(y), x0 = 560 - r + R() * r * 1.1;
      firca([[x0, y], [Math.min(560 + r - 4, x0 + 80 + R() * 100), y + (R() - 0.5) * 3]], 12 + R() * 6, oyn(x0 > 600 ? RENK.yaprakYesil : RENK.viridyen, 0.08), { p: 0.85, kuru: 0.5 });
    }
    for (const kb of SAHNE.kaburgalar(16, 40)) {
      const pts = kb.noktalar.slice().map(([x, y]) => [x + (R() - 0.5) * 0.6, y]);
      const l = kubbeIsik(560 + kb.u * 150, 460);
      firca(pts, 3.2, l > 0.55 ? RENK.viridyen : RENK.koyuYesil, { p: 0.9, kuru: 0.45, kil: 0.9, acil: 0 });
    }
    katman(mK, 'carp');
    // kasnak: yatay darbeler, ışığa göre renk
    for (let y = 559; y < 692; y += 10) {
      let x = 326 + R() * 10;
      while (x < 790) {
        const L = 130 + R() * 110, u = (x + L / 2 - 560) / 226;
        const col = u < -0.35 ? RENK.viridyen : u < 0.35 ? RENK.yaprakYesil : RENK.sariYesil;
        firca(yol(x, y + (R() - 0.5) * 3, () => (R() - 0.5) * 0.03, L, [3, 6], 5), 14 + R() * 4, oyn(col, 0.08), { p: 0.85, kuru: 0.55 });
        x += L * (0.7 + R() * 0.25);
      }
    }
    for (let k = 0; k < 6; k++) {
      const y = 558 + k * 8, x = 340 + R() * 40;
      firca(yol(x, y, () => (R() - 0.5) * 0.03, 300 + R() * 120, [3, 6], 5), 12 + R() * 4, oyn(k % 2 ? RENK.yaprakYesil : RENK.sariYesil, 0.08), { p: 0.8, kuru: 0.65 });
    }
    for (let k = 0; k < 10; k++) {
      const y = 560 + R() * 128, x = 330 + R() * 120;
      firca(yol(x, y, () => (R() - 0.5) * 0.03, 90 + R() * 90, [3, 6], 5), 12 + R() * 4, oyn(RENK.koyuYesil, 0.08), { p: 0.75, kuru: 0.6 });
    }
    for (const y of [557, 609, 613, 689]) firca([[338, y], [784, y]], 3, y === 557 || y === 613 ? RENK.sariYesil : RENK.koyuYesil, { p: 0.9, kuru: 0.35, kil: 0.9, acil: 0 });
    katman(mKs, 'carp');
    for (const k of [0, 1]) for (const p of SAHNE.kasnakPencereleri(k)) {
      firca([[p.x, p.y - 2], [p.x, p.y + p.h + 2]], p.w * 1.2 + 3, RENK.koyuYesil, { p: 1.1, kuru: 0.35, kil: 0.55, acil: 0 });
    }
    katman(temizMaske([6]), 'carp');
  }

  // ================================================================ TAŞ: kaide ve minare (ışıklı yan büyük ölçüde kâğıt beyazı)
  {
    const mT = bolgeMaske([4, 5, 6], 0.5);
    for (let y = 698; y < 800; y += 12) {
      let x = 288 + R() * 20;
      while (x < 830) {
        const L = 120 + R() * 120, ac = clamp((x - 300) / 520, 0, 1);
        if (R() < 1.05 - ac * 0.85) firca(yol(x, y + (R() - 0.5) * 3, () => (R() - 0.5) * 0.04, L, [4, 6], 5), 14 + R() * 5, oyn(R() < 0.75 ? RENK.okr : RENK.siena, 0.08), { p: 0.55 + (1 - ac) * 0.3, kuru: 0.6 });
        x += L * (0.75 + R() * 0.3);
      }
    }
    for (let k = 0; k < 18; k++) {
      const x = 268 + R() * 60, y0 = (x < 300 ? 798 : 690) - R() * 24;
      if (R() < 1.1 - silindirIsik(x, 300, 34)) firca(yol(x, y0, () => -Math.PI / 2 + (R() - 0.5) * 0.03, 160 + R() * 200, [5, 6], 5), 10 + R() * 4, oyn(RENK.okr, 0.08), { p: 0.75, kuru: 0.6 });
    }
    for (let k = 0; k < 8; k++) {
      const x = 282 + R() * 36, y0 = 436 - R() * 20;
      firca(yol(x, y0, () => -Math.PI / 2 + (R() - 0.5) * 0.03, 110 + R() * 130, [5, 6], 5), 9 + R() * 3, oyn(RENK.okr, 0.08), { p: 0.7, kuru: 0.6 });
    }
    katman(mT, 'carp');
    for (let k = 0; k < 7; k++) { const y = 712 + k * 13; firca(yol(300, y, () => (R() - 0.5) * 0.04, 120 + R() * 120, [4, 6], 5), 12 + R() * 4, oyn(RENK.morGri, 0.08), { p: 0.7, kuru: 0.65 }); }
    firca([[302, 709], [818, 709]], 6, RENK.morGri, { p: 0.85, kuru: 0.55, acil: 0 });
    for (const [x, y0, L] of [[272, 800, 330], [271, 436, 130], [283, 272, 66]]) firca(yol(x, y0, () => -Math.PI / 2, L, [5, 6], 4), 9, RENK.morGri, { p: 0.75, kuru: 0.55, acil: 0 });
    for (let k = 0; k < 5; k++) { const y0 = 560 + k * 36; firca(yol(306 + R() * 20, y0 + 40, () => -Math.PI / 2, 60, [5, 6], 4), 12, RENK.morGri, { p: 0.6 * minareGolge(320, y0) + 0.2, kuru: 0.6 }); }
    const MP = SAHNE.minareParcalari();
    for (const p of MP) {
      if (p.ad.startsWith('çıkma')) firca([[p.noktalar[1][0] + 2, p.noktalar[1][1] + 7], [p.noktalar[2][0] - 2, p.noktalar[2][1] + 7]], 12, RENK.morGri, { p: 0.9, kuru: 0.4, kil: 0.9, acil: 0 });
      if (p.ad.startsWith('şerefe')) firca([[p.noktalar[0][0], p.noktalar[2][1] - 1.5], [p.noktalar[1][0], p.noktalar[2][1] - 1.5]], 3, RENK.umber, { p: 0.9, kuru: 0.35, kil: 0.9, acil: 0 });
      if (p.tip === 'korkuluk') for (let k = 0; k < 9; k++) { const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (k + 0.5)) / 9; firca([[x, p.y2 - 3], [x, p.y1 + 3]], 2.8, RENK.umber, { p: 1.0, kuru: 0.25, kil: 0.9, acil: 0 }); }
    }
    for (const z of SAHNE.zikzakCizgileri()) firca(z, 2.8, RENK.siena, { p: 1.0, kuru: 0.3, kil: 0.9, acil: 0 });
    katman(mT, 'carp');
    for (const p of SAHNE.kaide.pencereler.concat(SAHNE.minarePencereleri)) firca([[p.x, p.y - 2], [p.x, p.y + p.h + 2]], p.w * 1.2 + 3, RENK.umber, { p: 1.1, kuru: 0.35, kil: 0.55, acil: 0 });
    katman(temizMaske([6]), 'carp');
  }

  // ================================================================ ALEMLER
  {
    for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.alemParcalari(300, 146, 0.62)]) {
      firca([[a.cubuk.x1 + 2.6, a.cubuk.y2], [a.cubuk.x1 + 2.6, a.cubuk.y1]], 5, RENK.altin, { p: 1.1, kuru: 0.2, kil: 0.9, acil: 0 });
      for (const k of a.kureler) firca([[k.cx - k.r, k.cy], [k.cx + k.r, k.cy]], k.r * 2.1, RENK.altin, { p: 1.1, kuru: 0.15, kil: 0.9, acil: 0 });
      firca([[a.yaka.cx - a.yaka.rx, a.yaka.cy], [a.yaka.cx + a.yaka.rx, a.yaka.cy]], a.yaka.ry * 2, RENK.altin, { p: 1.1, kuru: 0.15, kil: 0.9, acil: 0 });
      const h = a.hilal, pts = [];
      for (let k = 0; k <= 10; k++) { const t = Math.PI * (0.05 + 0.9 * (k / 10)); pts.push([h.cx - Math.cos(t) * h.R * 0.9, h.cy + Math.sin(t) * h.R * 0.9 - h.R * 0.15]); }
      firca(pts, h.R * 0.55, RENK.altin, { p: 1.1, kuru: 0.15, kil: 0.9, acil: 0 });
    }
    katman(bolgeMaske([7], 0.8), 'carp');
    for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.alemParcalari(300, 146, 0.62)]) for (const k of a.kureler) firca([[k.cx - k.r * 0.9, k.cy + k.r * 0.4], [k.cx + k.r * 0.2, k.cy + k.r * 0.6]], k.r * 0.7, [170, 104, 30], { p: 0.9, kuru: 0.3, kil: 0.9, acil: 0 });
    katman(bolgeMaske([7], 0.6), 'carp');
  }

  // ================================================================ YER ve öndeki yaprak kütlesi (aşağıdan yukarı fırlatılmış darbeler)
  {
    const mY = bolgeMaske([8, 9], 1.2);
    for (let y = 802; y < 1030; y += 22) {
      let x = -120 + R() * 100;
      const col = y < 870 ? (R() < 0.7 ? RENK.okr : RENK.siena) : (R() < 0.5 ? RENK.okr : RENK.sariYesil);
      while (x < W) { const L = 220 + R() * 200; firca(yol(x, y, () => (R() - 0.5) * 0.05, L, null, 6), 30 + R() * 12, oyn(col, 0.08), { p: 0.75, kuru: 0.6 }); x += L * (0.75 + R() * 0.35); }
    }
    katman(mY, 'carp');
    for (let k = 0; k < 110; k++) {
      const x = R() * W, y = 1040 - R() * 160;
      firca(yol(x, y, () => -Math.PI / 2 + (x - 512) / 1100 + (R() - 0.5) * 0.7, 70 + R() * 90, null, 4), 9 + R() * 8, oyn(R() < 0.35 ? RENK.yaprakYesil : R() < 0.7 ? RENK.viridyen : RENK.sariYesil, 0.08), { p: 0.85, kuru: 0.6, sivri: 0.5 });
    }
    katman(mY, 'carp');
    for (let k = 0; k < 60; k++) {
      const x = R() * W, y = 1040 - R() * 110;
      firca(yol(x, y, () => -Math.PI / 2 + (x - 512) / 1100 + (R() - 0.5) * 0.7, 50 + R() * 70, null, 4), 8 + R() * 6, oyn(RENK.koyuYesil, 0.08), { p: 0.85, kuru: 0.55, sivri: 0.5 });
    }
    katman(mY, 'carp');
  }

  // ================================================================ BİTKİLER: yaprak tek sivri darbe, çiçekler kâğıt beyazı
  {
    const B = SAHNE.bitki;
    const mY2 = bolgeMaske([9], 0.8);
    for (const s of B.saplar) firca(s.slice().reverse(), 3.6, RENK.yaprakYesil, { p: 1.0, kuru: 0.35, kil: 0.9, acil: 0 });
    for (const y of B.yapraklar) {
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci), gw = L * y.genislik * 0.8;
      const pts = []; for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push([y.x + ca * L * t, y.y + sa * L * t]); }
      firca(pts, gw, oyn(R() < 0.5 ? RENK.sariYesil : RENK.yaprakYesil, 0.08), { p: 0.95, kuru: 0.45, kil: 1.0, sivri: 1, acil: 0.1 });
    }
    katman(mY2, 'carp');
    for (const y of B.yapraklar) {
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci), nx = -sa, ny = ca, sd = (nx * 0.75 - ny * 0.66) > 0 ? -1 : 1, gw = L * y.genislik * 0.36;
      const pts = []; for (let k = 0; k <= 8; k++) { const t = 0.08 + 0.84 * k / 8, off = sd * gw * Math.sin(Math.PI * t) * 0.55; pts.push([y.x + ca * L * t + nx * off, y.y + sa * L * t + ny * off]); }
      firca(pts, gw * 0.9, oyn(R() < 0.5 ? RENK.viridyen : RENK.koyuYesil, 0.08), { p: 0.8, kuru: 0.6, kil: 0.9, sivri: 0.8, acil: 0.1 });
      firca([[y.x, y.y], [y.x + ca * L * 0.85, y.y + sa * L * 0.85]], 1.6, RENK.koyuYesil, { p: 0.8, kuru: 0.5, kil: 0.9, acil: 0 });
    }
    for (const t of B.tomurcuklar) firca([[t.x - Math.cos(t.aci) * t.r * 0.9, t.y - Math.sin(t.aci) * t.r * 0.9], [t.x + Math.cos(t.aci) * t.r * 1.6, t.y + Math.sin(t.aci) * t.r * 1.6]], t.r * 1.8, RENK.gul, { p: 1.0, kuru: 0.35, kil: 0.9, sivri: 0.7, acil: 0 });
    katman(bolgeMaske([9], 0.6), 'carp');
    // çiçekler: beyaz kâğıt bırakılır; gölge yanında mor-gri, ışık yanında gül renkli kuru dokunuş, ortada limon
    const mC = bolgeMaske([10], 0.2);
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const yon = Math.cos(e.aci) * 0.75 - Math.sin(e.aci) * 0.66;
        const pts = [];
        for (let k = 0; k <= 6; k++) { const t = k / 6, rr = c.r * (0.18 + 0.82 * t); pts.push([c.x + Math.cos(e.aci) * rr, c.y + Math.sin(e.aci) * rr]); }
        firca(pts, c.r * 0.6, yon < 0 ? RENK.morGri : RENK.gul, { p: yon < 0 ? 0.65 : 0.45, kuru: 0.85, kil: 0.9, sivri: 0.6, acil: 0.4 });
      }
      firca([[c.x - c.r * 0.16, c.y + c.r * 0.05], [c.x + c.r * 0.16, c.y - c.r * 0.05]], c.r * 0.4, RENK.limon, { p: 1.0, kuru: 0.15, kil: 0.9, acil: 0 });
    }
    katman(mC, 'carp', 0.85);
    for (const c of B.cicekler) for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2 + R(); firca([[c.x + Math.cos(a) * c.r * 0.18, c.y + Math.sin(a) * c.r * 0.18], [c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3]], Math.max(2.4, c.r * 0.08), [204, 112, 40], { p: 1.0, kuru: 0.1, kil: 0.9, acil: 0 }); }
    katman(null, 'carp');
  }

  // ------------------------------------------------------------ kâğıt kabartısı ve çıktı
  {
    const img = ctx.createImageData(W2, W2), d = img.data;
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px;
      const gx = T[py * W2 + Math.min(W2 - 1, px + 2)] - T[py * W2 + Math.max(0, px - 2)];
      const gy = T[Math.min(W2 - 1, py + 2) * W2 + px] - T[Math.max(0, py - 2) * W2 + px];
      const sh = 1 + (gx * 0.6 - gy * 0.55) * 0.05 - (1 - T[i]) * 0.018;
      d[i * 4] = clamp(CR[i] * sh, 0, 255); d[i * 4 + 1] = clamp(CG[i] * sh, 0, 255); d[i * 4 + 2] = clamp(CB[i] * sh, 0, 255); d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
