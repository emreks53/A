<title>S-049 Kuru Fırça — Atölye örnek görseli</title>
<style>

  canvas { display: block; width: 1024px; height: 1024px; }

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-049 Kuru Fırça — suyu neredeyse alınmış fırça pürüzlü kâğıdın üstünden kayar: boya yalnız kâğıt dişinin
// tepelerine tutunur, çukurlar beyaz benek olarak kalır. Her darbe tek tek kıllardan oluşan çizgili bir
// izdir; boyası tükendikçe kırılır, ucu tüy gibi dağılır. Saydam renk katları üst üste biner (taş, yaprak,
// gök ayrı yönlerde), son olarak örtücü beyaz kuru darbeler eklenir.
(function () {
  'use strict';
  // ------------------------------------------------------------ ortak yardımcılar
  const W = 1024;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  /** Tohumlu değer gürültüsü (256 periyotlu, yumuşak). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  /** Ayrılabilir kutu bulanıklığı (Float32Array). */
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const bulanik3 = (src, w, h, r) => kutuBulanik(kutuBulanik(kutuBulanik(src, w, h, r), w, h, r), w, h, r);

  // ------------------------------------------------------------ bölge haritası (istenen ölçekte)
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  function bolgeDizisi(olcek, cicek) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    SAHNE.ciz(g, { bolge: true, cicek: cicek !== false });
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Uint8Array(w * w), onb = new Map();
    for (let i = 0; i < w * w; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      out[i] = b;
    }
    return out;
  }
  /** Bir Path2D listesini (1024 koordinatında) olcek çözünürlüğünde 0..1 maskeye çevirir. */
  function maske(olcek, ciz) {
    const c = SAHNE.yeniTuval(), g = SAHNE.tuval(c, olcek);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff';
    ciz(g);
    const w = W * olcek, v = g.getImageData(0, 0, w, w).data, out = new Float32Array(w * w);
    for (let i = 0; i < w * w; i++) out[i] = v[i * 4 + 3] / 255;
    return out;
  }

  // ------------------------------------------------------------ ışık modeli (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeRt = new Float32Array(W), kubbeDrt = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeRt[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDrt[y] = (kubbeRt[y + 1] - kubbeRt[y - 1]) / 2;
  kubbeDrt[300] = kubbeDrt[301] * 1.3; kubbeDrt[555] = kubbeDrt[554];
  function kubbeR(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeRt[555] : kubbeRt[i] * (1 - f) + kubbeRt[i + 1] * f; }
  function kubbeDr(y) { y = clamp(y, 300, 555); const i = Math.floor(y), f = y - i; return i >= 555 ? kubbeDrt[555] : kubbeDrt[i] * (1 - f) + kubbeDrt[i + 1] * f; }
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(0.5, kubbeR(y)), -1, 1);
  /** Kubbe yüzey normali [nx, ny, nz] (ekran: x sağ, y aşağı, z izleyiciye). */
  function kubbeNormal(x, y) {
    const u = kubbeU(x, y), c = Math.sqrt(Math.max(0, 1 - u * u)), dr = kubbeDr(y), l = Math.hypot(u, dr, c) || 1;
    return [u / l, -dr / l, c / l];
  }
  function kubbeIsik(x, y) { const n = kubbeNormal(x, y); return Math.max(0, n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2]); }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  /** Kubbenin minareye düşen gölgesi (minarenin sağ alt kısmı kubbenin arkasında kalır). */
  const minareGolge = (x, y) => sstep(-6, 8, y - (478 + (x - 266) * 1.4));
  const BULUTLAR = [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]];

  const S = 2, W2 = W * S, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d');
  const R = SAHNE.rng(4949);
  const nA = gurultu(51), nB = gurultu(52), nC = gurultu(53), nD = gurultu(54), nE = gurultu(55);

  // ------------------------------------------------------------ kâğıt dişi (2048), histogramla eşitlenmiş 0..1
  const T = new Float32Array(N2);
  {
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      T[py * W2 + px] = 0.5 * fbm(nA, px / 4.2, py / 4.2, 3) + 0.3 * nB(px / 2.3, py / 2.3) + 0.2 * nC(px / 1.2, py / 1.2) + 0.12 * (nD(px / 40, py / 40) - 0.5);
    }
    const H = new Uint32Array(2048);
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < N2; i++) { if (T[i] < mn) mn = T[i]; if (T[i] > mx) mx = T[i]; }
    const k = 2047 / (mx - mn);
    for (let i = 0; i < N2; i++) H[((T[i] - mn) * k) | 0]++;
    const cdf = new Float32Array(2048); let acc = 0;
    for (let j = 0; j < 2048; j++) { acc += H[j]; cdf[j] = acc / N2; }
    for (let i = 0; i < N2; i++) T[i] = cdf[((T[i] - mn) * k) | 0];
  }

  // ------------------------------------------------------------ bölgeler ve maskeler
  const BOL1 = bolgeDizisi(1, true), BOL2 = bolgeDizisi(S, true);
  const sinif = (b) => (b === 'gok' || b === 'gunes' ? 1 : b === 'kubbe' ? 2 : b === 'kasnak' ? 3 : b === 'kaide' ? 4 : b === 'minare' ? 5 : b === 'pencere' ? 6 : b === 'altin' ? 7 : b === 'zemin' ? 8 : b === 'cicek' || b === 'cicekOrta' ? 10 : 9);
  const SIN = new Uint8Array(16); ADLAR.forEach((a, i) => (SIN[i] = sinif(a)));
  const sAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= W ? 0 : SIN[BOL1[(y | 0) * W + (x | 0)]]);
  /** Yumuşak ve pürüzlü kenarlı bölge maskesi (2048); tasma: kenarın ne kadar dışına taşabileceği (1024 px). */
  function bolgeMaske(siniflar, tasma) {
    const set = new Set(siniflar), m = new Float32Array(N2);
    for (let i = 0; i < N2; i++) m[i] = set.has(SIN[BOL2[i]]) ? 1 : 0;
    const bm = kutuBulanik(kutuBulanik(m, W2, W2, 3), W2, W2, 3);
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px;
      const n = (nE(px / 7, py / 7) - 0.5) * 0.6 + (nA(px / 2, py / 2) - 0.5) * 0.3;
      m[i] = sstep(0.5 - tasma * 0.12, 0.62 - tasma * 0.12, bm[i] + n * 0.5);
    }
    return m;
  }

  // ------------------------------------------------------------ boya yüzeyi
  const CR = new Float32Array(N2).fill(250), CG = new Float32Array(N2).fill(247), CB = new Float32Array(N2).fill(239);
  const pc = SAHNE.yeniTuval(); pc.width = W2; pc.height = W2;
  const pg = pc.getContext('2d', { willReadFrequently: true }); pg.setTransform(S, 0, 0, S, 0, 0); pg.lineCap = 'round'; pg.lineJoin = 'round';
  const cc = SAHNE.yeniTuval(); cc.width = W2; cc.height = W2;
  const cg = cc.getContext('2d', { willReadFrequently: true }); cg.setTransform(S, 0, 0, S, 0, 0); cg.lineCap = 'round'; cg.lineJoin = 'round';

  const rgbs = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  /**
   * Kuru fırça darbesi: pts çizgisi boyunca nb kıl; her kılın kendi boya yükü ve bitiş noktası vardır.
   * Basınç (açık gri, 'lighter') kâğıt dişiyle eşiklenecek; renk ayrı tuvale düz sürülür.
   */
  function yenidenOrnekle(p, ad) {
    const out = [p[0]];
    for (let k = 1; k < p.length; k++) {
      const [xa, ya] = p[k - 1], [xb, yb] = p[k], l = Math.hypot(xb - xa, yb - ya), n = Math.max(1, Math.ceil(l / ad));
      for (let j = 1; j <= n; j++) out.push([xa + ((xb - xa) * j) / n, ya + ((yb - ya) * j) / n]);
    }
    return out;
  }
  let fircaNo = 0;
  const GRI = []; for (let v = 0; v < 256; v++) { const h = v.toString(16).padStart(2, '0'); GRI.push('#' + h + h + h); }
  function firca(pts0, w, col, o) {
    o = o || {};
    const p0 = o.p == null ? 0.45 : o.p, kuru = o.kuru == null ? 0.55 : o.kuru, kil = o.kil || 1.0, sivri = o.sivri || 0;
    const pts = yenidenOrnekle(pts0, 2.5), n = pts.length; if (n < 2) return;
    const L = [0]; for (let k = 1; k < n; k++) L.push(L[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    const top = L[n - 1]; if (top < 1) return;
    const nr = pts.map((q, k) => { const a = pts[Math.max(0, k - 1)], b = pts[Math.min(n - 1, k + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
    cg.strokeStyle = rgbs(col);
    const nb = Math.max(3, Math.round(w / (kil * 1.75))), no = ++fircaNo;
    for (let b = 0; b < nb; b++) {
      const v = (b / (nb - 1) - 0.5) * w + (R() - 0.5) * kil;
      const kenar = Math.min(1, Math.abs(v) / (w / 2));
      const yuk = 0.45 + R() * 0.8;
      const t0 = R() * 0.08 + sivri * kenar * kenar * 0.45, t1 = 1 - Math.pow(R(), 1.5) * 0.4 - sivri * kenar * kenar * 0.45;
      pg.lineWidth = kil * (0.5 + R() * 0.95); cg.lineWidth = pg.lineWidth + 1.0;
      let px = null, py = null;
      for (let k = 0; k < n; k++) {
        const t = L[k] / top;
        const x = pts[k][0] + nr[k][0] * v, y = pts[k][1] + nr[k][1] * v;
        if (px !== null && t >= t0 && t <= t1) {
          const atla = 0.35 + 1.1 * nB(b * 13.7 + no * 3.1, L[k] * 0.07);
          const a = p0 * yuk * atla * sstep(t0, t0 + 0.04, t) * (1 - kuru * Math.pow(t, 0.8)) * (1 + 0.5 * (1 - t) * (1 - t)) * (1 - 0.35 * kenar * kenar) * sstep(t1, t1 - 0.1, t);
          if (a > 0.02) { const gv = GRI[Math.min(255, Math.round(a * 180))]; if (pg.strokeStyle !== gv) pg.strokeStyle = gv; pg.beginPath(); pg.moveTo(px, py); pg.lineTo(x, y); pg.stroke(); cg.beginPath(); cg.moveTo(px, py); cg.lineTo(x, y); cg.stroke(); }
        }
        px = x; py = y;
      }
    }
  }
  /** Katmanı tuvale aktar: basınç × maske kâğıt dişiyle eşiklenir; 'carp' saydam (çarpımsal), 'ort' örtücü. */
  function katman(maskeDizi, kip, guc) {
    const pv = pg.getImageData(0, 0, W2, W2).data, cv = cg.getImageData(0, 0, W2, W2).data;
    guc = guc == null ? 0.92 : guc;
    for (let i = 0; i < N2; i++) {
      let P = pv[i * 4] / 255; if (P <= 0.004) continue;
      if (maskeDizi) P *= maskeDizi[i];
      P = Math.min(1, P * 2.9);
      const dep = sstep(1 - P, 1 - P + 0.08, T[i]) * guc; if (dep <= 0.003) continue;
      const r = cv[i * 4], g = cv[i * 4 + 1], b = cv[i * 4 + 2];
      if (kip === 'ort') { CR[i] += (r - CR[i]) * dep; CG[i] += (g - CG[i]) * dep; CB[i] += (b - CB[i]) * dep; }
      else { CR[i] *= 1 - dep * (1 - r / 255); CG[i] *= 1 - dep * (1 - g / 255); CB[i] *= 1 - dep * (1 - b / 255); }
    }
    pg.save(); pg.setTransform(1, 0, 0, 1, 0, 0); pg.globalCompositeOperation = 'source-over'; pg.clearRect(0, 0, W2, W2); pg.restore();
    cg.save(); cg.setTransform(1, 0, 0, 1, 0, 0); cg.clearRect(0, 0, W2, W2); cg.restore();
  }
  pg.globalCompositeOperation = 'lighten'; pg.strokeStyle = '#fff';

  /** Yön alanını izleyen darbe çizgisi; bölge dışına çıkınca (biraz taşarak) durur. */
  function yol(x, y, yonFn, L, cls, adim) {
    adim = adim || 4;
    const pts = [[x, y]];
    let a = yonFn(x, y), disari = 0;
    for (let s = 0; s < L; s += adim) {
      a = a * 0.7 + yonFn(x, y) * 0.3;
      x += Math.cos(a) * adim; y += Math.sin(a) * adim;
      if (cls && !cls.includes(sAt(x, y))) { disari += adim; if (disari > 6) break; } else disari = 0;
      pts.push([x, y]);
    }
    return pts;
  }
  function dagit(cls, adet, kutu, kabul, yap) {
    const [x0, y0, x1, y1] = kutu;
    let k = 0, deneme = 0;
    while (k < adet && deneme < adet * 30) {
      deneme++;
      const x = x0 + R() * (x1 - x0), y = y0 + R() * (y1 - y0);
      if (!cls.includes(sAt(clamp(x, 0, W - 1), y))) continue;
      if (kabul && R() > kabul(x, y)) continue;
      yap(x, y); k++;
    }
  }
  const oyn = (c, k) => { const f = 1 + (R() - 0.5) * k; return [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)]; };
  const RENK = {
    serulean: [118, 182, 232], kobalt: [52, 94, 198], ultramarin: [46, 62, 178], mor: [146, 118, 200], seftali: [248, 196, 134], limon: [252, 226, 96],
    sariYesil: [178, 214, 82], yaprakYesil: [76, 154, 62], viridyen: [20, 112, 86], koyuYesil: [16, 54, 54],
    okr: [226, 176, 92], siena: [200, 126, 66], morGri: [150, 134, 176], umber: [100, 60, 44], gul: [234, 124, 156], altin: [230, 170, 50], beyaz: [252, 250, 244],
  };

  // ------------------------------------------------------------ bulut yoğunluğu: gök darbeleri bulutlarda hafifler
  const bulutD = (x, y) => {
    let d = 0;
    for (const [bx, by, bs] of BULUTLAR) { const dx = (x - bx) / (100 * bs), dy = (y - by) / (30 * bs); d = Math.max(d, Math.exp(-(dx * dx + dy * dy))); }
    return d;
  };
  const gunesD = (x, y) => Math.hypot(x - 880, y - 140);

  // ================================================================ GÖK
  {
    const m = bolgeMaske([1], 1.5);
    const mMavi = new Float32Array(N2);
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) { const i = py * W2 + px; mMavi[i] = m[i] * sstep(105, 200, gunesD(px / S, py / S) + (nC(px / 30, py / 30) - 0.5) * 60); }
    const gokYon = (x, y) => -0.22 + (nB(x / 260, y / 260) - 0.5) * 0.9;
    // 1) açık serulean, geniş süpürmeler
    dagit([1], 95, [-80, 0, W, 800], (x, y) => 1 - bulutD(x, y) * 0.85, (x, y) => {
      firca(yol(x, y, gokYon, 170 + R() * 170, null, 5), 34 + R() * 22, oyn(RENK.serulean, 0.1), { p: 0.4 + R() * 0.2, kuru: 0.45 + R() * 0.3, kil: 1.1 });
    });
    katman(mMavi, 'carp');
    // 2) kobalt ve ultramarin, üstte yoğun
    dagit([1], 95, [-80, 0, W, 640], (x, y) => (1 - y / 700) * (1 - bulutD(x, y)), (x, y) => {
      firca(yol(x, y, gokYon, 130 + R() * 160, null, 5), 26 + R() * 20, oyn(R() < 0.6 ? RENK.kobalt : RENK.ultramarin, 0.1), { p: 0.36 + R() * 0.2, kuru: 0.55, kil: 1.05 });
    });
    for (const [bx, by, bs] of BULUTLAR) for (let k = 0; k < 6 * bs; k++) {
      const x = bx + (R() - 0.6) * 140 * bs, y = by + 14 * bs + R() * 12 * bs;
      firca(yol(x, y, () => -0.05 + (R() - 0.5) * 0.2, 50 + R() * 60, null, 4), 8 + R() * 8, oyn(RENK.mor, 0.1), { p: 0.35, kuru: 0.6, kil: 1 });
    }
    katman(mMavi, 'carp');
    // 3) ufka doğru sıcak şeftali; güneş çevresinde dairesel limon (yalnız beyaz kâğıda)
    dagit([1], 55, [-80, 480, W, 800], (x, y) => sstep(500, 790, y), (x, y) => {
      firca(yol(x, y, gokYon, 140 + R() * 160, null, 5), 22 + R() * 20, oyn(RENK.seftali, 0.08), { p: 0.38 + R() * 0.2, kuru: 0.5, kil: 1.05 });
    });
    katman(mMavi, 'carp', 0.85);
    for (let k = 0; k < 44; k++) {
      const a = (k / 44) * Math.PI * 2 + R() * 0.3, r0 = 50 + R() * 120, x = 880 + Math.cos(a) * r0, y = 140 + Math.sin(a) * r0;
      firca(yol(x, y, (xx, yy) => Math.atan2(yy - 140, xx - 880) + Math.PI / 2, 60 + R() * 90, null, 4), 12 + R() * 12, oyn(r0 < 110 ? RENK.limon : RENK.seftali, 0.06), { p: 0.34 + R() * 0.2, kuru: 0.55, kil: 1.05 });
    }
    const mGunes = new Float32Array(N2);
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) { const i = py * W2 + px; mGunes[i] = m[i] * sstep(250, 150, gunesD(px / S, py / S)) * sstep(40, 56, gunesD(px / S, py / S)); }
    katman(mGunes, 'carp');
  }

  // ================================================================ KUBBE ve KASNAK
  {
    const mK = bolgeMaske([2], 0.6), mKs = bolgeMaske([3, 6], 0.4);
    const meridyen = (x, y) => Math.atan2(1, kubbeU(x, y) * kubbeDr(y)) + (nC(x / 30, y / 30) - 0.5) * 0.25;
    const yukari = (x, y) => meridyen(x, y) + Math.PI;
    dagit([2], 130, [360, 300, 760, 556], null, (x, y) => {
      const lat = R() < 0.3;
      firca(yol(x, y, lat ? (xx, yy) => -0.15 + (xx - 560) * 0.0006 : yukari, 50 + R() * 70, [2], 4), 12 + R() * 12, oyn(RENK.sariYesil, 0.08), { p: 0.45 + R() * 0.25, kuru: 0.45, kil: 1.05 });
    });
    katman(mK, 'carp');
    dagit([2], 170, [360, 300, 760, 556], (x, y) => 1.1 - kubbeIsik(x, y), (x, y) => {
      firca(yol(x, y, yukari, 40 + R() * 80, [2], 4), 9 + R() * 10, oyn(RENK.yaprakYesil, 0.1), { p: 0.38 + R() * 0.25, kuru: 0.55, kil: 1.0 });
    });
    katman(mK, 'carp');
    dagit([2], 150, [360, 300, 760, 556], (x, y) => Math.pow(1 - kubbeIsik(x, y), 1.8), (x, y) => {
      firca(yol(x, y, yukari, 30 + R() * 70, [2], 4), 7 + R() * 9, oyn(R() < 0.6 ? RENK.viridyen : RENK.koyuYesil, 0.1), { p: 0.36 + R() * 0.25, kuru: 0.6, kil: 1.0 });
    });
    // taban: kubbenin alt kenarı boyunca yatay kuru darbeler (alttaki beyaz boşlukları kapatır)
    for (let k = 0; k < 16; k++) {
      const y = 528 + R() * 26, r = kubbeR(y), x0 = 560 - r + R() * r * 1.2;
      firca([[x0, y], [Math.min(560 + r - 4, x0 + 60 + R() * 90), y + (R() - 0.5) * 3]], 10 + R() * 8, oyn(x0 > 600 ? RENK.yaprakYesil : RENK.viridyen, 0.1), { p: 0.55, kuru: 0.45, kil: 1.0 });
    }
    for (const kb of SAHNE.kaburgalar(16, 40)) {
      const pts = kb.noktalar.slice().reverse().map(([x, y]) => [x + (R() - 0.5) * 0.6, y]);
      const l = kubbeIsik(560 + kb.u * 150, 460);
      firca(pts, 2.4, l > 0.55 ? RENK.viridyen : RENK.koyuYesil, { p: 0.7, kuru: 0.35, kil: 0.9 });
    }
    katman(mK, 'carp');
    dagit([3, 6], 130, [334, 555, 786, 692], null, (x, y) => {
      firca(yol(x, y, () => (R() - 0.5) * 0.06, 50 + R() * 90, [3, 6], 4), 7 + R() * 7, oyn(silindirIsik(x, 560, 226) > 0.6 ? RENK.yaprakYesil : RENK.viridyen, 0.1), { p: 0.5 + R() * 0.25, kuru: 0.45, kil: 1.0 });
    });
    dagit([3, 6], 70, [334, 555, 786, 692], (x) => 1.1 - silindirIsik(x, 560, 226), (x, y) => {
      firca(yol(x, y, () => (R() - 0.5) * 0.06, 40 + R() * 60, [3, 6], 4), 6 + R() * 6, oyn(RENK.koyuYesil, 0.1), { p: 0.4, kuru: 0.55, kil: 1.0 });
    });
    for (const y of [557, 609, 612, 690]) firca([[340, y], [784, y]], 2.4, y === 557 || y === 612 ? RENK.sariYesil : RENK.koyuYesil, { p: 0.7, kuru: 0.3, kil: 0.9 });
    katman(mKs, 'carp');
    for (const k of [0, 1]) for (const p of SAHNE.kasnakPencereleri(k)) {
      firca([[p.x, p.y + p.h + 1], [p.x, p.y - 1]], p.w * 1.2 + 2, RENK.koyuYesil, { p: 1.3, kuru: 0.15, kil: 0.9 });
    }
    katman(bolgeMaske([6], 1.0), 'carp');
  }

  // ================================================================ TAŞ: kaide ve minare (ışıklı yan büyük ölçüde kâğıt beyazı)
  {
    const mT = bolgeMaske([4, 5, 6], 0.5);
    dagit([4, 6], 80, [300, 692, 820, 800], (x) => 1.05 - Math.pow(clamp((x - 300) / 520, 0, 1), 0.7) * 0.95, (x, y) => {
      firca(yol(x, y, () => (R() - 0.5) * 0.08, 50 + R() * 110, [4, 6], 4), 8 + R() * 10, oyn(R() < 0.75 ? RENK.okr : RENK.siena, 0.08), { p: 0.3 + R() * 0.2, kuru: 0.6, kil: 1.0 });
    });
    dagit([5, 6], 120, [246, 140, 354, 800], (x, y) => 1.1 - silindirIsik(x, 300, minareYari(y)), (x, y) => {
      firca(yol(x, y, () => -Math.PI / 2 + (R() - 0.5) * 0.05, 40 + R() * 80, [5, 6], 4), 6 + R() * 7, oyn(RENK.okr, 0.08), { p: 0.32 + R() * 0.2, kuru: 0.55, kil: 1.0 });
    });
    katman(mT, 'carp');
    dagit([4, 6], 50, [300, 704, 600, 800], (x) => 1 - clamp((x - 300) / 300, 0, 1), (x, y) => {
      firca(yol(x, y, () => (R() - 0.5) * 0.1, 40 + R() * 70, [4, 6], 4), 7 + R() * 8, oyn(RENK.morGri, 0.08), { p: 0.36, kuru: 0.6, kil: 1.0 });
    });
    firca([[302, 709], [818, 709]], 6, RENK.morGri, { p: 0.65, kuru: 0.5, kil: 1.0 });
    dagit([5, 6], 100, [246, 140, 354, 800], (x, y) => Math.max(0.9 - silindirIsik(x, 300, minareYari(y)) * 1.1, minareGolge(x, y)), (x, y) => {
      firca(yol(x, y, () => -Math.PI / 2 + (R() - 0.5) * 0.05, 30 + R() * 60, [5, 6], 4), 5 + R() * 5, oyn(RENK.morGri, 0.1), { p: 0.42, kuru: 0.55, kil: 1.0 });
    });
    const MP = SAHNE.minareParcalari();
    for (const p of MP) {
      if (p.ad.startsWith('çıkma')) firca([[p.noktalar[1][0] + 2, p.noktalar[1][1] + 7], [p.noktalar[2][0] - 2, p.noktalar[2][1] + 7]], 12, RENK.morGri, { p: 0.75, kuru: 0.3, kil: 0.9 });
      if (p.ad.startsWith('şerefe')) firca([[p.noktalar[0][0], p.noktalar[2][1] - 1.5], [p.noktalar[1][0], p.noktalar[2][1] - 1.5]], 3, RENK.umber, { p: 0.7, kuru: 0.3, kil: 0.9 });
      if (p.tip === 'korkuluk') for (let k = 0; k < 9; k++) { const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (k + 0.5)) / 9; firca([[x, p.y2 - 3], [x, p.y1 + 3]], 2.6, RENK.umber, { p: 0.9, kuru: 0.2, kil: 0.9 }); }
    }
    for (const z of SAHNE.zikzakCizgileri()) firca(z, 2.6, RENK.siena, { p: 0.9, kuru: 0.25, kil: 0.9 });
    katman(mT, 'carp');
    for (const p of SAHNE.kaide.pencereler.concat(SAHNE.minarePencereleri)) firca([[p.x, p.y + p.h + 1], [p.x, p.y - 1]], p.w * 1.1 + 2, RENK.umber, { p: 1.3, kuru: 0.15, kil: 0.9 });
    katman(bolgeMaske([6], 1.0), 'carp');
  }

  // ================================================================ ALEMLER
  {
    for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.alemParcalari(300, 146, 0.62)]) {
      firca([[a.cubuk.x1 + 2.6, a.cubuk.y2], [a.cubuk.x1 + 2.6, a.cubuk.y1]], 5, RENK.altin, { p: 1.2, kuru: 0.2, kil: 0.9 });
      for (const k of a.kureler) firca([[k.cx - k.r, k.cy], [k.cx + k.r, k.cy]], k.r * 2.1, RENK.altin, { p: 1.2, kuru: 0.15, kil: 0.9 });
      firca([[a.yaka.cx - a.yaka.rx, a.yaka.cy], [a.yaka.cx + a.yaka.rx, a.yaka.cy]], a.yaka.ry * 2, RENK.altin, { p: 1.2, kuru: 0.15, kil: 0.9 });
      const h = a.hilal, pts = [];
      for (let k = 0; k <= 10; k++) { const t = Math.PI * (0.05 + 0.9 * (k / 10)); pts.push([h.cx - Math.cos(t) * h.R * 0.9, h.cy + Math.sin(t) * h.R * 0.9 - h.R * 0.15]); }
      firca(pts, h.R * 0.55, RENK.altin, { p: 1.2, kuru: 0.15, kil: 0.9 });
    }
    katman(bolgeMaske([7], 0.8), 'carp');
    for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.alemParcalari(300, 146, 0.62)]) for (const k of a.kureler) firca([[k.cx - k.r * 0.9, k.cy + k.r * 0.4], [k.cx + k.r * 0.2, k.cy + k.r * 0.6]], k.r * 0.7, [170, 104, 30], { p: 0.8, kuru: 0.3, kil: 0.9 });
    katman(bolgeMaske([7], 0.6), 'carp');
  }

  // ================================================================ YER ve öndeki koyu yaprak kütlesi
  {
    const mY = bolgeMaske([8], 1.2);
    dagit([8], 45, [-60, 800, W, 860], null, (x, y) => {
      firca(yol(x, y, () => (R() - 0.5) * 0.1, 140 + R() * 180, null, 5), 14 + R() * 12, oyn(R() < 0.7 ? RENK.okr : RENK.siena, 0.1), { p: 0.4 + R() * 0.25, kuru: 0.55, kil: 1.05 });
    });
    katman(mY, 'carp');
    dagit([8], 260, [0, 820, W, W], (x, y) => sstep(820, 880, y), (x, y) => {
      firca(yol(x, y, () => -Math.PI / 2 + (x - 512) / 900 + (R() - 0.5) * 1.2, 26 + R() * 50, null, 4), 7 + R() * 9, oyn(R() < 0.35 ? RENK.yaprakYesil : R() < 0.7 ? RENK.viridyen : RENK.koyuYesil, 0.1), { p: 0.5 + R() * 0.3, kuru: 0.5, kil: 1.0, sivri: 0.6 });
    });
    katman(mY, 'carp');
    dagit([8], 160, [0, 850, W, W], (x, y) => sstep(850, 950, y), (x, y) => {
      firca(yol(x, y, () => -Math.PI / 2 + (x - 512) / 900 + (R() - 0.5) * 1.2, 20 + R() * 40, null, 4), 6 + R() * 8, oyn(RENK.koyuYesil, 0.1), { p: 0.55 + R() * 0.3, kuru: 0.45, kil: 1.0, sivri: 0.6 });
    });
    katman(mY, 'carp');
  }

  // ================================================================ BİTKİLER: yaprak tek sivri darbe, çiçekler kâğıt beyazı
  {
    const B = SAHNE.bitki;
    const mY2 = bolgeMaske([9], 0.8);
    for (const s of B.saplar) firca(s.slice().reverse(), 3.4, RENK.yaprakYesil, { p: 0.9, kuru: 0.3, kil: 0.9 });
    for (const y of B.yapraklar) {
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci), nx = -sa, ny = ca;
      const isik = nx * 0.75 - ny * 0.66 > 0 ? 1 : -1, gw = L * y.genislik * 0.78;
      const pts = []; for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push([y.x + ca * L * t, y.y + sa * L * t]); }
      firca(pts, gw, oyn(R() < 0.5 ? RENK.sariYesil : RENK.yaprakYesil, 0.1), { p: 0.75, kuru: 0.35, kil: 1.0, sivri: 1 });
    }
    katman(mY2, 'carp');
    for (const y of B.yapraklar) {
      const L = y.uzunluk, ca = Math.cos(y.aci), sa = Math.sin(y.aci), nx = -sa, ny = ca, sd = (nx * 0.75 - ny * 0.66) > 0 ? -1 : 1, gw = L * y.genislik * 0.36;
      const pts = []; for (let k = 0; k <= 8; k++) { const t = 0.08 + 0.84 * k / 8, off = sd * gw * Math.sin(Math.PI * t) * 0.55; pts.push([y.x + ca * L * t + nx * off, y.y + sa * L * t + ny * off]); }
      firca(pts, gw * 0.9, oyn(R() < 0.5 ? RENK.viridyen : RENK.koyuYesil, 0.1), { p: 0.6, kuru: 0.55, kil: 0.9, sivri: 0.8 });
      firca([[y.x, y.y], [y.x + ca * L * 0.85, y.y + sa * L * 0.85]], 1.4, RENK.koyuYesil, { p: 0.6, kuru: 0.5, kil: 0.9 });
    }
    for (const t of B.tomurcuklar) firca([[t.x - Math.cos(t.aci) * t.r * 0.9, t.y - Math.sin(t.aci) * t.r * 0.9], [t.x + Math.cos(t.aci) * t.r * 1.6, t.y + Math.sin(t.aci) * t.r * 1.6]], t.r * 1.8, RENK.gul, { p: 1.0, kuru: 0.3, kil: 0.9, sivri: 0.7 });
    katman(bolgeMaske([9], 0.6), 'carp');
    // çiçekler: beyaz kâğıt bırakılır; gölge yanında mor-gri, göbek çevresinde gül kuru dokunuş, ortada limon
    const mC = bolgeMaske([10], 0.2);
    for (const c of B.cicekler) {
      for (const e of SAHNE.tacYapraklari(c)) {
        const yon = Math.cos(e.aci) * 0.75 - Math.sin(e.aci) * 0.66;
        const pts = [];
        for (let k = 0; k <= 6; k++) { const t = k / 6, rr = c.r * (0.2 + 0.8 * t); pts.push([c.x + Math.cos(e.aci) * rr, c.y + Math.sin(e.aci) * rr]); }
        firca(pts, c.r * 0.7, yon < 0 ? RENK.morGri : RENK.gul, { p: yon < 0 ? 0.5 : 0.36, kuru: 0.85, kil: 0.9, sivri: 0.6 });
      }
      firca([[c.x - c.r * 0.16, c.y + c.r * 0.05], [c.x + c.r * 0.16, c.y - c.r * 0.05]], c.r * 0.4, RENK.limon, { p: 1.1, kuru: 0.1, kil: 0.9 });
    }
    katman(mC, 'carp', 0.85);
    for (const c of B.cicekler) for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2 + R(); firca([[c.x + Math.cos(a) * c.r * 0.18, c.y + Math.sin(a) * c.r * 0.18], [c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3]], Math.max(2.2, c.r * 0.08), [204, 112, 40], { p: 1.1, kuru: 0, kil: 0.9 }); }
    katman(null, 'carp');
  }

  // ================================================================ örtücü beyaz kuru darbeler: bulut, güneş, ışıklar
  {
    for (const [bx, by, bs] of BULUTLAR) for (let k = 0; k < 10 * bs; k++) {
      const x = bx + (R() - 0.65) * 150 * bs, y = by + (R() - 0.6) * 30 * bs;
      firca(yol(x, y, () => -0.12 + (R() - 0.5) * 0.3, 50 + R() * 70, null, 4), 9 + R() * 12, RENK.beyaz, { p: 0.4 + R() * 0.25, kuru: 0.6, kil: 1.0 });
    }
    for (let k = 0; k < 10; k++) { const y = 330 + R() * 150, u = 0.35 + R() * 0.3; const x = 560 + u * kubbeR(y); firca(yol(x, y, (xx, yy) => Math.atan2(1, kubbeU(xx, yy) * kubbeDr(yy)) + Math.PI, 30 + R() * 40, [2], 4), 4 + R() * 4, [236, 246, 200], { p: 0.4, kuru: 0.7, kil: 0.9 }); }
    katman(null, 'ort', 0.85);
  }

  // ------------------------------------------------------------ kâğıt kabartısı ve çıktı
  {
    const img = ctx.createImageData(W2, W2), d = img.data;
    for (let py = 0; py < W2; py++) for (let px = 0; px < W2; px++) {
      const i = py * W2 + px;
      const gx = T[py * W2 + Math.min(W2 - 1, px + 1)] - T[py * W2 + Math.max(0, px - 1)];
      const gy = T[Math.min(W2 - 1, py + 1) * W2 + px] - T[Math.max(0, py - 1) * W2 + px];
      const sh = 1 + (gx * 0.6 - gy * 0.55) * 0.12 - (1 - T[i]) * 0.035;
      d[i * 4] = clamp(CR[i] * sh, 0, 255); d[i * 4 + 1] = clamp(CG[i] * sh, 0, 255); d[i * 4 + 2] = clamp(CB[i] * sh, 0, 255); d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
</script>
