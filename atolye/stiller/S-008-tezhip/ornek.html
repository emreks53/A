<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-008 Tezhip — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #F1E6CC; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-008 Tezhip — ezme altın, lacivert ve aharlı krem zemin; rumî-hatayî helezonları; simetrik
  // mihrabiye (sivri kemer) çerçeve, köşebentler, cetveller, tığlar ve tepelikler; düz renkli,
  // tahrirli (ince koyu konturlu) kubbe, minare ve natüralist çiçekler. Yazı yok.
  const S = SAHNE;
  const tuval = document.getElementById('tuval');
  let ctx = S.tuval(tuval, 2);
  const P = (d) => new Path2D(d);

  const C = {
    kagit: '#F1E6CC',
    krem: '#F6EEDA',
    lacivert: '#1C3478',
    lacivertAcik: '#3A5BA8',
    altin: '#CFA64E',
    altinAcik: '#EBCD7E',
    altinKoyu: '#8C6620',
    tahrir: '#3A2412',
    kirmizi: '#BE3424',
    kirmiziKoyu: '#8A2015',
    pembe: '#E3A49B',
    yesil: '#2E7B50',
    yesilKoyu: '#1F5A39',
    yesilAcik: '#4E9A68',
    saz: '#4F8550',
    sazKoyu: '#2F5F37',
    beyaz: '#FBF6EA',
    firuze: '#3E9C9A',
  };

  // ------------------------------------------------------------ yardımcılar
  function poligonYolu(pts, acik) {
    const p = new Path2D();
    pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
    if (!acik) p.closePath();
    return p;
  }
  function omurga(x0, y0, a0, n, ds, kf) {
    const pts = [];
    let x = x0;
    let y = y0;
    let a = a0;
    for (let i = 0; i <= n; i++) {
      pts.push([x, y]);
      a += kf(i * ds, i / n) * ds;
      x += Math.cos(a) * ds;
      y += Math.sin(a) * ds;
    }
    return pts;
  }
  function serit(pts, wSol, wSag) {
    const sol = [];
    const sag = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)];
      const b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0];
      let ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l;
      ty /= l;
      const t = i / (n - 1);
      const ws = wSol(t, i);
      const wg = wSag(t, i);
      sol.push([pts[i][0] - ty * ws, pts[i][1] + tx * ws]);
      sag.push([pts[i][0] + ty * wg, pts[i][1] - tx * wg]);
    }
    return poligonYolu(sol.concat(sag.reverse()));
  }
  const yumusak = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  function gurultu(tohum, hucre) {
    const r = S.rng(tohum);
    const G = 256;
    const g = new Float32Array(G * G);
    for (let i = 0; i < G * G; i++) g[i] = r();
    return (x, y) => {
      x /= hucre;
      y /= hucre;
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const fx = x - xi;
      const fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const v = (i, j) => g[((j & 255) << 8) | (i & 255)];
      const a = v(xi, yi) + (v(xi + 1, yi) - v(xi, yi)) * sx;
      const b = v(xi, yi + 1) + (v(xi + 1, yi + 1) - v(xi, yi + 1)) * sx;
      return a + (b - a) * sy;
    };
  }

  // ezme altın: sayfaya sabit, sağ üstten hafif parıltılı, zerreli altın dolgu
  const ALTIN = (() => {
    const c = S.yeniTuval(2048, 2048);
    const k = c.getContext('2d');
    const id = k.createImageData(2048, 2048);
    const g = gurultu(81, 140);
    const g2 = gurultu(82, 9);
    const r = S.rng(83);
    for (let y = 0; y < 2048; y++) {
      for (let x = 0; x < 2048; x++) {
        const i = (y * 2048 + x) * 4;
        const parilti = 0.5 + 0.5 * Math.cos(((x - 1700) * 0.0007 + (y - 300) * 0.0011) * 3.1);
        let v = 0.55 * g(x, y) + 0.2 * g2(x, y) + 0.35 * parilti - 0.55;
        const z = r();
        if (z < 0.02) v += 0.35;
        else if (z < 0.035) v -= 0.3;
        id.data[i] = Math.max(0, Math.min(255, 207 + v * 70));
        id.data[i + 1] = Math.max(0, Math.min(255, 166 + v * 62));
        id.data[i + 2] = Math.max(0, Math.min(255, 78 + v * 40));
        id.data[i + 3] = 255;
      }
    }
    k.putImageData(id, 0, 0);
    const desen = ctx.createPattern(c, 'no-repeat');
    desen.setTransform(new DOMMatrix([0.5, 0, 0, 0.5, 0, 0]));
    return desen;
  })();
  // desen dönüşümü sahne ölçeğinden bağımsız kalsın diye: altın dolguyu ekran koordinatına sabitleyen dolgu
  function altinDoldur(yol) {
    const m = ctx.getTransform();
    const desen = ALTIN;
    const ters = m.inverse();
    desen.setTransform(ters.multiply(new DOMMatrix([1, 0, 0, 1, 0, 0])));
    ctx.fillStyle = desen;
    ctx.fill(yol);
  }
  function doldur(yol, renk) {
    if (renk === 'altin') return altinDoldur(typeof yol === 'string' ? P(yol) : yol);
    ctx.fillStyle = renk;
    ctx.fill(typeof yol === 'string' ? P(yol) : yol);
  }
  function tahrir(yol, w) {
    ctx.lineWidth = w || 0.8;
    ctx.strokeStyle = C.tahrir;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(typeof yol === 'string' ? P(yol) : yol);
  }
  // altın kontur: koyu kenarlı altın çizgi
  function altinCizgi(yol, w) {
    yol = typeof yol === 'string' ? P(yol) : yol;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = w + 1.2;
    ctx.strokeStyle = C.tahrir;
    ctx.stroke(yol);
    ctx.lineWidth = w;
    ctx.strokeStyle = C.altin;
    ctx.stroke(yol);
  }
  function cizgi(pts, w, renk) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.lineWidth = w;
    ctx.strokeStyle = renk;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function daire(x, y, r, renk, kont) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (renk === 'altin') altinDoldur(new Path2D(S.daireYolu(x, y, r)));
    else {
      ctx.fillStyle = renk;
      ctx.fill();
    }
    if (kont) tahrir(S.daireYolu(x, y, r), kont);
  }

  // ------------------------------------------------------------ motifler
  // Rumî: taban (0,0), +x yönünde boy 1; -y yönüne kabaran gövde, çatallı uç
  const RUMI = 'M0,0 C0.04,-0.34 0.36,-0.58 0.74,-0.54 C0.94,-0.52 1.04,-0.4 1.0,-0.27 C0.9,-0.34 0.8,-0.33 0.73,-0.25 C0.7,-0.33 0.6,-0.36 0.5,-0.33 C0.6,-0.25 0.63,-0.12 0.56,-0.02 C0.38,-0.07 0.17,-0.05 0,0 Z';
  const RUMI_IC = 'M0.12,-0.08 C0.24,-0.3 0.5,-0.44 0.74,-0.43';
  function rumi(x, y, s, aci, ayna, renk, ic) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(aci);
    ctx.scale(s, s * ayna);
    const p = P(RUMI);
    doldur(p, renk);
    ctx.lineWidth = 0.8 / s;
    ctx.strokeStyle = C.tahrir;
    ctx.lineJoin = 'round';
    ctx.stroke(p);
    if (ic) {
      ctx.lineWidth = 0.6 / s;
      ctx.strokeStyle = ic;
      ctx.stroke(P(RUMI_IC));
    }
    ctx.restore();
  }
  // ayrılmalı (çift) rumî: (x,y) tabanda, aci yönüne bakan simetrik çift
  function ciftRumi(x, y, s, aci, renk, ic) {
    rumi(x, y, s, aci - 0.62, 1, renk, ic);
    rumi(x, y, s, aci + 0.62, -1, renk, ic);
  }
  function yelpaze(cy, r, n, a0, a1, derin) {
    let d = `M${(Math.cos(a0) * r * 0.3).toFixed(3)},${(cy + Math.sin(a0) * r * 0.3).toFixed(3)} `;
    for (let i = 0; i < n; i++) {
      const b0 = a0 + ((a1 - a0) * i) / n;
      const b1 = a0 + ((a1 - a0) * (i + 1)) / n;
      const bm = (b0 + b1) / 2;
      const p0 = [Math.cos(b0) * r * (1 - derin), cy + Math.sin(b0) * r * (1 - derin)];
      const pm = [Math.cos(bm) * r * 1.1, cy + Math.sin(bm) * r * 1.1];
      const p1 = [Math.cos(b1) * r * (1 - derin), cy + Math.sin(b1) * r * (1 - derin)];
      if (i === 0) d += `L${p0[0].toFixed(3)},${p0[1].toFixed(3)} `;
      d += `Q${pm[0].toFixed(3)},${pm[1].toFixed(3)} ${p1[0].toFixed(3)},${p1[1].toFixed(3)} `;
    }
    d += `L${(Math.cos(a1) * r * 0.3).toFixed(3)},${(cy + Math.sin(a1) * r * 0.3).toFixed(3)} Z`;
    return d;
  }
  // Hatayî: taban (0,0), -y yönünde boy ~1. renkler: [çanak, dış taç, iç taç, göz]
  function hatayi(x, y, s, aci, renkler) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(aci);
    ctx.scale(s, s);
    const lw = 0.8 / s;
    const k = (p) => {
      ctx.lineWidth = lw;
      ctx.strokeStyle = C.tahrir;
      ctx.lineJoin = 'round';
      ctx.stroke(p);
    };
    const dis = P(yelpaze(-0.34, 0.44, 5, Math.PI * 0.92, Math.PI * 2.08, 0.18));
    doldur(dis, renkler[1]);
    k(dis);
    const ic = P(yelpaze(-0.32, 0.28, 3, Math.PI * 1.0, Math.PI * 2.0, 0.22));
    doldur(ic, renkler[2]);
    k(ic);
    const goz = P('M0,-0.2 C-0.1,-0.28 -0.09,-0.46 0,-0.6 C0.09,-0.46 0.1,-0.28 0,-0.2 Z');
    doldur(goz, renkler[3]);
    k(goz);
    for (const sx of [-1, 1]) {
      const c = P(`M0,0.02 C${sx * -0.02},-0.12 ${sx * 0.3},-0.12 ${sx * 0.5},-0.36 C${sx * 0.52},-0.2 ${sx * 0.36},-0.02 0,0.02 Z`);
      doldur(c, renkler[0]);
      k(c);
    }
    ctx.restore();
  }
  // Penç (önden görülen gül/rozet)
  function penc(x, y, r, renkler, n, kont) {
    n = n || 6;
    ctx.save();
    ctx.translate(x, y);
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate((i / n) * Math.PI * 2);
      const p = P(`M0,0 C${-r * 0.5},${-r * 0.3} ${-r * 0.42},${-r} 0,${-r} C${r * 0.42},${-r} ${r * 0.5},${-r * 0.3} 0,0 Z`);
      doldur(p, renkler[0]);
      tahrir(p, kont || 0.7);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = renkler[1] === 'altin' ? C.altin : renkler[1];
    ctx.fill();
    tahrir(S.daireYolu(0, 0, r * 0.3), kont || 0.7);
    ctx.restore();
  }

  // Helezon: (cx,cy) merkezli, R yarıçaplı; başlangıç açısı a0, yön (1 saat yönü, -1 ters), tur sayısı
  function helezonNoktalari(cx, cy, R, a0, yon, tur) {
    const pts = [];
    const N = Math.max(30, Math.round(R * tur * 3));
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const a = a0 + yon * t * tur * Math.PI * 2;
      const r = R * (1 - 0.78 * Math.pow(t, 0.9));
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }

  // Bir helezon dalını süsleriyle çiz. renk: sap rengi, motif renkleri
  function helezonDal(cx, cy, R, a0, yon, tema, r) {
    const pts = helezonNoktalari(cx, cy, R, a0, yon, 1.15);
    const sw = Math.max(1.0, R * 0.035);
    ctx.lineCap = 'round';
    if (tema.sapAltin) {
      cizgi(pts, sw + 1.2, C.tahrir);
      cizgi(pts, sw, C.altin);
    } else cizgi(pts, sw, C.tahrir);
    // sap boyunca rumî yapraklar, dışa doğru
    const n = pts.length;
    const adim = Math.max(4, Math.round(n / (R > 40 ? 9 : R > 20 ? 5 : 3)));
    let taraf = 1;
    for (let i = Math.round(adim * 0.6); i < n * 0.78; i += adim) {
      const [x, y] = pts[i];
      const [x2, y2] = pts[Math.min(n - 1, i + 2)];
      const yonA = Math.atan2(y2 - y, x2 - x);
      const kalan = 1 - i / n;
      const s = R * (0.3 + 0.26 * kalan);
      rumi(x, y, s, yonA - yon * taraf * 0.55, -yon * taraf, tema.rumi, tema.rumiIc);
      taraf = -taraf;
    }
    // merkezde hatayî ya da penç
    const [ux, uy] = pts[n - 1];
    const [px, py] = pts[n - 4];
    const ucA = Math.atan2(uy - py, ux - px);
    if (R > 30) hatayi(ux, uy, R * 0.62, ucA + Math.PI / 2, tema.hatayi);
    else if (R > 14) penc(ux, uy, R * 0.36, tema.penc, 6, 0.6);
    else ciftRumi(ux, uy, R * 0.45, ucA, tema.rumi, tema.rumiIc);
    return pts;
  }

  // ------------------------------------------------------------ sayfa
  ctx.fillStyle = C.kagit;
  ctx.fillRect(0, 0, 1024, 1024);

  const DIS = 40; // dış cetvel
  const ICS = 88; // iç cetvel
  const AL = { x1: 100, y1: 100, x2: 924, y2: 924 }; // iç alan

  // ---- tığlar (dış cetvelden kenar suyuna ışınsal ince lacivert çizgiler)
  function tiglar() {
    ctx.lineCap = 'butt';
    const kenar = (x0, y0, dx, dy, nx, ny, L) => {
      const adet = Math.round(L / 5);
      for (let i = 0; i <= adet; i++) {
        const t = i / adet;
        const x = x0 + dx * L * t;
        const y = y0 + dy * L * t;
        // ortada tepelik için boşluk
        if (Math.abs(t - 0.5) < 0.075) continue;
        const uz = 7 + 9 * Math.pow(Math.abs(Math.sin(i * 0.5236)), 1.5);
        cizgi([[x, y], [x + nx * uz, y + ny * uz]], 0.75, C.lacivertAcik);
      }
    };
    const L = 1024 - 2 * DIS;
    kenar(DIS, DIS - 2, 1, 0, 0, -1, L);
    kenar(DIS, 1024 - DIS + 2, 1, 0, 0, 1, L);
    kenar(DIS - 2, DIS, 0, 1, -1, 0, L);
    kenar(1024 - DIS + 2, DIS, 0, 1, 1, 0, L);
  }
  tiglar();

  // ---- tepelikler: her kenarın ortasında dışa taşan hatayî
  function tepelik(x, y, aci) {
    // tığ ışınları tepeliğin etrafında
    for (let i = -10; i <= 10; i++) {
      const a = aci - Math.PI / 2 + (i / 10) * 1.25;
      const r0 = 30;
      const r1 = 30 + 8 + 6 * Math.abs(Math.sin(i * 0.8));
      cizgi([[x + Math.cos(a) * r0, y + Math.sin(a) * r0], [x + Math.cos(a) * r1, y + Math.sin(a) * r1]], 0.75, C.lacivertAcik);
    }
    hatayi(x, y + 0, 36, aci, ['altin', C.lacivert, C.kirmizi, 'altin']);
  }
  tepelik(512, DIS, 0);
  tepelik(512, 1024 - DIS, Math.PI);
  tepelik(DIS, 512, -Math.PI / 2);
  tepelik(1024 - DIS, 512, Math.PI / 2);

  // ---- ana bordür: lacivert zeminde altın rumî-hatayî su yolu
  {
    const dis = poligonYolu([[DIS, DIS], [1024 - DIS, DIS], [1024 - DIS, 1024 - DIS], [DIS, 1024 - DIS]]);
    const ic = poligonYolu([[ICS, ICS], [1024 - ICS, ICS], [1024 - ICS, 1024 - ICS], [ICS, 1024 - ICS]]);
    const bant = new Path2D();
    bant.addPath(dis);
    bant.addPath(ic);
    ctx.fillStyle = C.lacivert;
    ctx.fill(bant, 'evenodd');
    ctx.save();
    ctx.clip(bant, 'evenodd');
    const B = (DIS + ICS) / 2; // bant ekseni
    // dört kenar: yerel koordinatta (u boyunca, v bant içi) çizip döndür
    const kenarlar = [
      { o: [0, 0], a: 0 },
      { o: [1024, 0], a: Math.PI / 2 },
      { o: [1024, 1024], a: Math.PI },
      { o: [0, 1024], a: -Math.PI / 2 },
    ];
    const L0 = ICS; // köşe karesinden sonra
    const L1 = 1024 - ICS;
    const periyot = (L1 - L0) / 8;
    for (const k of kenarlar) {
      ctx.save();
      ctx.translate(k.o[0], k.o[1]);
      ctx.rotate(k.a);
      // dalgalı sap
      const pts = [];
      for (let u = L0 - 4; u <= L1 + 4; u += 2) pts.push([u, B + 10 * Math.sin(((u - 512) / periyot) * Math.PI * 2 + Math.PI / 2)]);
      cizgi(pts, 2.6, C.tahrir);
      cizgi(pts, 1.6, C.altin);
      for (let j = 0; j < 8; j++) {
        const u = L0 + periyot * (j + 0.5);
        const ust = j % 2 === 0;
        const ayna = u < 512 ? 1 : -1;
        // dalganın tepe/çukur noktası
        const v = B + 10 * Math.sin(((u - 512) / periyot) * Math.PI * 2 + Math.PI / 2);
        if (ust) hatayi(u, v - 2, 22, ayna * 0.25 + Math.PI, ['altin', C.kirmizi, C.beyaz, 'altin']);
        else penc(u, v, 8.5, [C.beyaz, C.kirmizi], 6, 0.6);
        // aradaki rumîler
        const ua = u + periyot * 0.25 * ayna;
        const va = B + 10 * Math.sin(((ua - 512) / periyot) * Math.PI * 2 + Math.PI / 2);
        rumi(ua, va, 17, ayna > 0 ? -0.2 : Math.PI + 0.2, ust ? 1 : -1, 'altin', C.altinKoyu);
        const ub = u - periyot * 0.25 * ayna;
        const vb = B + 10 * Math.sin(((ub - 512) / periyot) * Math.PI * 2 + Math.PI / 2);
        rumi(ub, vb, 13, ayna > 0 ? Math.PI - 0.3 : 0.3, ust ? -1 : 1, 'altin', C.altinKoyu);
        // boşluklarda üçlü altın noktalar
        const nv = ust ? B + 14 : B - 14;
        for (const [dx, dy] of [[0, 0], [-2.6, 2.4 * (ust ? 1 : -1)], [2.6, 2.4 * (ust ? 1 : -1)]]) {
          const pn = new Path2D();
          pn.arc(u + dx, nv + dy, 1.3, 0, Math.PI * 2);
          altinDoldur(pn);
        }
      }
      ctx.restore();
    }
    ctx.restore();
    // köşe kareleri
    for (const [x, y] of [[DIS, DIS], [1024 - ICS, DIS], [DIS, 1024 - ICS], [1024 - ICS, 1024 - ICS]]) {
      const kare = poligonYolu([[x, y], [x + ICS - DIS, y], [x + ICS - DIS, y + ICS - DIS], [x, y + ICS - DIS]]);
      doldur(kare, C.lacivert);
      const cx = x + (ICS - DIS) / 2;
      const cy = y + (ICS - DIS) / 2;
      for (let i = 0; i < 4; i++) ciftRumi(cx, cy, 12, (i * Math.PI) / 2 + Math.PI / 4, 'altin', C.altinKoyu);
      penc(cx, cy, 10, ['altin', C.kirmizi], 8, 0.6);
      tahrir(kare, 0.8);
    }
  }

  // ---- cetveller
  function cetvelKare(o, w, renk) {
    const p = poligonYolu([[o, o], [1024 - o, o], [1024 - o, 1024 - o], [o, 1024 - o]]);
    ctx.lineWidth = w;
    ctx.strokeStyle = renk;
    ctx.stroke(p);
  }
  function altinCetvel(o, w) {
    // altın şerit, iki yanı tahrirli
    const dis = poligonYolu([[o - w / 2, o - w / 2], [1024 - o + w / 2, o - w / 2], [1024 - o + w / 2, 1024 - o + w / 2], [o - w / 2, 1024 - o + w / 2]]);
    const ic = poligonYolu([[o + w / 2, o + w / 2], [1024 - o - w / 2, o + w / 2], [1024 - o - w / 2, 1024 - o - w / 2], [o + w / 2, 1024 - o - w / 2]]);
    const b = new Path2D();
    b.addPath(dis);
    b.addPath(ic);
    ctx.save();
    ctx.clip(b, 'evenodd');
    altinDoldur(poligonYolu([[0, 0], [1024, 0], [1024, 1024], [0, 1024]]));
    ctx.restore();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = C.tahrir;
    ctx.stroke(dis);
    ctx.stroke(ic);
  }
  altinCetvel(DIS - 1, 5);
  altinCetvel(ICS + 1.5, 5);
  cetvelKare(ICS + 5.6, 1.1, C.kirmizi);
  cetvelKare(ICS + 8.2, 0.9, C.yesil);

  // ------------------------------------------------------------ mihrabiye kemer
  const KM = (() => {
    const x1 = AL.x1;
    const ys = 560;
    const c = 530.4;
    const R = c - x1;
    const sol = [];
    const qx = 432;
    const aBas = Math.PI; // (x1, ys)
    const aSon = Math.PI + Math.acos((c - qx) / R) * 1; // Q noktası
    const N = 80;
    for (let i = 0; i <= N; i++) {
      const a = aBas + ((aSon - aBas) * i) / N;
      sol.push([c + Math.cos(a) * R, ys + Math.sin(a) * R]);
    }
    const Q = sol[sol.length - 1];
    const tx = -Math.sin(aSon);
    const ty = Math.cos(aSon);
    // kavşara (sivri uç): Q'dan teğetle, tepeye dik çıkış
    const tepe = [512, 110];
    const c1 = [Q[0] + tx * 34, Q[1] + ty * 34];
    const c2 = [512, 132];
    for (let i = 1; i <= 24; i++) {
      const t = i / 24;
      const u = 1 - t;
      sol.push([
        u * u * u * Q[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * tepe[0],
        u * u * u * Q[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * tepe[1],
      ]);
    }
    const sag = sol.map(([x, y]) => [1024 - x, y]).reverse();
    const egri = sol.concat(sag.slice(1)); // (100,560) → tepe → (924,560)
    const ic = [[AL.x1, AL.y2], ...egri, [AL.x2, AL.y2]];
    return { egri, ic, ys };
  })();
  const kemerIc = poligonYolu(KM.ic);

  // köşebentler (kemerin dışı): sık, iç içe iki helezon sistemi. Alt katta ince koyu saplı hatayî
  // helezonları (hatayî, penç, gonca, yaprak), üst katta lacivert şeritli rumî helezonları; üst kat
  // alttakinin üstünden ince bir zemin aralığı bırakarak geçer. Kalan boşluklara penç ve üçlü noktalar.
  {
    const alan = poligonYolu([[AL.x1, AL.y1], [AL.x2, AL.y1], [AL.x2, AL.y2], [AL.x1, AL.y2]]);
    const kose = new Path2D();
    kose.addPath(alan);
    kose.addPath(kemerIc);
    const egri = KM.egri.slice(0, Math.ceil(KM.egri.length / 2) + 1);
    const kemerUzak = (x, y) => {
      let m = 1e9;
      for (let i = 0; i < egri.length; i += 1) {
        const d = Math.hypot(x - egri[i][0], y - egri[i][1]);
        if (d < m) m = d;
      }
      return m;
    };
    const kemerUstunde = (x, y) => {
      for (let i = 0; i < egri.length - 1; i++) {
        const [ax, ay] = egri[i];
        const [bx, by] = egri[i + 1];
        if ((ax <= x && x < bx) || (bx <= x && x < ax)) {
          const t = (x - ax) / (bx - ax);
          return y < ay + (by - ay) * t;
        }
      }
      return false;
    };
    // 2 px ızgara: sol köşebentin hücreleri ve kemere uzaklıkları
    const izgara = [];
    for (let y = AL.y1 + 1; y < KM.ys; y += 2) {
      for (let x = AL.x1 + 1; x < 513; x += 2) {
        if (!kemerUstunde(x, y)) continue;
        const ku = kemerUzak(x, y);
        if (ku >= 6) izgara.push({ x, y, ku });
      }
    }
    // açgözlü daire istifi: kenarlardan biraz taşabilir (çerçeve keser), kemerden taşmaz
    function istif(adet, rMin, rMax, engeller, bosluk) {
      const out = [];
      for (let k = 0; k < adet; k++) {
        let en = null;
        for (const p of izgara) {
          let d = Math.min(rMax, (p.x - AL.x1 + 3) / 0.7, (p.y - AL.y1 + 3) / 0.7, (p.ku - 6) / 0.95, 514 - p.x);
          if (en && d <= en.r) continue;
          for (const c of out) {
            d = Math.min(d, Math.hypot(p.x - c.x, p.y - c.y) - c.r - bosluk);
            if (en && d <= en.r) break;
          }
          if (en && d <= en.r) continue;
          for (const c of engeller) {
            d = Math.min(d, Math.hypot(p.x - c.x, p.y - c.y) - c.r);
            if (en && d <= en.r) break;
          }
          if (!en || d > en.r) en = { x: p.x, y: p.y, r: d };
        }
        if (!en || en.r < rMin) break;
        out.push(en);
      }
      return out;
    }
    const D1 = istif(90, 9, 50, [], 0.5);
    const D2 = istif(26, 15, 40, D1.map((c) => ({ x: c.x, y: c.y, r: c.r * 0.55 })), 3);

    // dönüşümlü yol: d dizgisini (x,y)'ye taşı, döndür, ölçekle
    const trYol = (d, x, y, aci, sx, sy) => {
      const p = new Path2D();
      p.addPath(P(d), new DOMMatrix().translate(x, y).rotate((aci * 180) / Math.PI).scale(sx, sy));
      return p;
    };
    const aralik = (p, w) => {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = w;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.stroke(p);
      ctx.fillStyle = '#000';
      ctx.fill(p);
      ctx.restore();
    };
    // iki ucu teğetli bağlantı sapı
    function baglanti(q, tq, e, te) {
      const L = Math.hypot(e[0] - q[0], e[1] - q[1]);
      const pts = [];
      const c1 = [q[0] + Math.cos(tq) * L * 0.45, q[1] + Math.sin(tq) * L * 0.45];
      const c2 = [e[0] - Math.cos(te) * L * 0.45, e[1] - Math.sin(te) * L * 0.45];
      for (let i = 0; i <= 16; i++) {
        const t = i / 16;
        const u = 1 - t;
        pts.push([
          u * u * u * q[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * e[0],
          u * u * u * q[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * e[1],
        ]);
      }
      return pts;
    }
    // ağaç: her daire, daha önce çizilmiş sapların en yakın noktasından teğetle beslenir
    function agac(daireler, tur) {
      const baglar = [];
      return daireler.map((c, i) => {
        let q = null;
        let enD = 1e9;
        for (const b of baglar) {
          const d = Math.hypot(b.x - c.x, b.y - c.y);
          if (d < enD) {
            enD = d;
            q = b;
          }
        }
        let yon;
        let a0;
        let bag = null;
        if (!q) {
          // kök: en yakın çerçeve kenarından gelir (çerçeve keser)
          const kenar = c.x - AL.x1 < c.y - AL.y1 ? [AL.x1 - 10, c.y + c.r * 0.6] : [c.x - c.r * 0.6, AL.y1 - 10];
          a0 = Math.atan2(kenar[1] - c.y, kenar[0] - c.x);
          yon = 1;
          const e = [c.x + Math.cos(a0) * c.r, c.y + Math.sin(a0) * c.r];
          bag = baglanti(kenar, Math.atan2(e[1] - kenar[1], e[0] - kenar[0]), e, a0 + yon * Math.PI / 2);
        } else {
          a0 = Math.atan2(q.y - c.y, q.x - c.x);
          // sapın akış yönüyle uyumlu dönüş: bağlantı noktasındaki teğete göre
          const cr = Math.cos(q.t) * (c.y - q.y) - Math.sin(q.t) * (c.x - q.x);
          yon = cr > 0 ? -1 : 1;
          const e = [c.x + Math.cos(a0) * c.r, c.y + Math.sin(a0) * c.r];
          bag = baglanti([q.x, q.y], q.t, e, a0 + yon * Math.PI / 2);
        }
        const pts = helezonNoktalari(c.x, c.y, c.r, a0, yon, tur);
        for (let j = 2; j < pts.length * 0.62; j += 3) {
          const a = pts[j - 1];
          const b = pts[j + 1];
          baglar.push({ x: pts[j][0], y: pts[j][1], t: Math.atan2(b[1] - a[1], b[0] - a[0]) });
        }
        return { c, yon, a0, pts, bag, i };
      });
    }

    const L = S.yeniTuval(2048, 2048);
    const lk = L.getContext('2d', { willReadFrequently: true });
    lk.setTransform(2, 0, 0, 2, 0, 0);
    const anaCtx = ctx;
    ctx = lk;
    const r = S.rng(51);

    // ---- alt kat: hatayî helezonları
    const HAT = [
      [C.yesil, C.kirmizi, C.beyaz, C.lacivert],
      [C.yesil, C.lacivert, C.beyaz, C.kirmizi],
      [C.yesilKoyu, C.pembe, C.kirmizi, C.lacivert],
      [C.yesil, C.beyaz, C.kirmizi, C.lacivert],
    ];
    const PEN = [
      [C.beyaz, C.kirmizi],
      [C.kirmizi, C.beyaz],
      [C.beyaz, C.lacivert],
      [C.pembe, C.kirmizi],
    ];
    function gonca(x, y, L0, aci, renk) {
      const p = trYol('M0,0 C-0.34,-0.18 -0.36,-0.62 0,-1 C0.36,-0.62 0.34,-0.18 0,0 Z', x, y, aci + Math.PI / 2, L0 * 0.62, L0);
      doldur(p, renk);
      tahrir(p, 0.6);
      for (const s of [-1, 1]) {
        const c = trYol(`M0,0.05 C${s * 0.05},-0.2 ${s * 0.3},-0.25 ${s * 0.42},-0.5 C${s * 0.4},-0.25 ${s * 0.2},-0.02 0,0.05 Z`, x, y, aci + Math.PI / 2, L0 * 0.7, L0 * 0.7);
        doldur(c, C.yesil);
        tahrir(c, 0.55);
      }
    }
    function yaprakK(x, y, L0, aci, renk) {
      const yy = { x, y, uzunluk: L0, genislik: 0.4, aci };
      const p = P(S.yaprakYolu(yy));
      doldur(p, renk);
      tahrir(p, 0.6);
      const [a, b] = S.yaprakDamari(yy);
      cizgi([a, [a[0] + (b[0] - a[0]) * 0.8, a[1] + (b[1] - a[1]) * 0.8]], 0.45, C.tahrir);
    }
    const H = agac(D1, 1.32);
    // önce bütün saplar, sonra motifler (motifler sapların üstünde)
    for (const h of H) {
      const sw = Math.max(0.85, Math.min(1.6, h.c.r * 0.03));
      cizgi(h.bag, sw, C.tahrir);
      cizgi(h.pts, sw, C.tahrir);
    }
    for (const h of H) {
      const { c, yon, pts } = h;
      const R = c.r;
      const n = pts.length;
      const adet = R > 36 ? 9 : R > 24 ? 7 : R > 15 ? 5 : 3;
      for (let k = 0; k < adet; k++) {
        const t = 0.05 + (k / adet) * 0.7;
        const j = Math.floor(t * n);
        const [x, y] = pts[j];
        const [x2, y2] = pts[Math.min(n - 1, j + 2)];
        const ta = Math.atan2(y2 - y, x2 - x);
        const dis = k % 2 === 0;
        const Lk = R * (0.56 - 0.26 * t) * (dis ? 1 : 0.8);
        const a = ta + (dis ? -yon : yon) * 0.85;
        if (!dis && R > 20 && k % 4 === 1) gonca(x, y, Lk * 0.9, a, k % 8 === 1 ? C.kirmizi : C.lacivert);
        else yaprakK(x, y, Lk, a, (k + h.i) % 3 === 0 ? C.yesilAcik : (k + h.i) % 3 === 1 ? C.yesil : C.firuze);
      }
      const [ux, uy] = pts[n - 1];
      const [px, py] = pts[n - 5];
      const ucA = Math.atan2(uy - py, ux - px);
      if (R > 21) hatayi(ux, uy, R * 0.8, ucA + Math.PI / 2, HAT[h.i % HAT.length]);
      else if (R > 13) penc(ux, uy, R * 0.5, PEN[h.i % PEN.length], h.i % 2 ? 5 : 6, 0.6);
      else gonca(ux, uy, R * 0.75, ucA, h.i % 2 ? C.kirmizi : C.pembe);
    }

    // ---- üst kat: rumî helezonları (lacivert şerit, rumî yapraklar, uçta ayrılmalı rumî)
    const rumiYollari = (x, y, s, aci, ayna) => [trYol(RUMI, x, y, aci, s, s * ayna), trYol(RUMI_IC, x, y, aci, s, s * ayna)];
    function rumiKoy(x, y, s, aci, ayna) {
      const [p, ic] = rumiYollari(x, y, s, aci, ayna);
      aralik(p, 2.6);
      doldur(p, C.lacivert);
      tahrir(p, 0.65);
      ctx.lineWidth = 0.55;
      ctx.strokeStyle = '#8FA7DE';
      ctx.stroke(ic);
    }
    const RU = agac(D2, 1.18);
    for (const h of RU) {
      const R = h.c.r;
      const pts = h.bag.concat(h.pts.slice(1));
      const nb = h.bag.length;
      const w = (t, i) => (i < nb ? Math.max(1.0, R * 0.05) : Math.max(0.8, R * 0.05 * (1 - 0.55 * ((i - nb) / (pts.length - nb)))));
      const rib = serit(pts, w, w);
      aralik(rib, 2.6);
      doldur(rib, C.lacivert);
      tahrir(rib, 0.6);
    }
    for (const h of RU) {
      const { c, yon, pts } = h;
      const R = c.r;
      const n = pts.length;
      const adet = R > 30 ? 5 : R > 20 ? 4 : 3;
      for (let k = 0; k < adet; k++) {
        const t = 0.1 + (k / adet) * 0.62;
        const j = Math.floor(t * n);
        const [x, y] = pts[j];
        const [x2, y2] = pts[Math.min(n - 1, j + 2)];
        const ta = Math.atan2(y2 - y, x2 - x);
        const dis = k % 2 === 0;
        const s = R * (0.6 - 0.24 * t) * (dis ? 1 : 0.82);
        // rumî: tabanı sapta, sapın akışı yönünde, dışa (ya da içe) kabaran
        rumiKoy(x, y, s, ta + (dis ? -yon : yon) * 0.35, dis ? yon : -yon);
      }
      const [ux, uy] = pts[n - 1];
      const [px, py] = pts[n - 5];
      const ucA = Math.atan2(uy - py, ux - px);
      const s = R * 0.5;
      rumiKoy(ux, uy, s, ucA - 0.6, 1);
      rumiKoy(ux, uy, s, ucA + 0.6, -1);
    }

    // ---- boşluk doldurma: kapsamayı oku, uzaklık dönüşümüyle en büyük boşluklara penç, üçlü nokta, nokta
    {
      const W0 = AL.x1;
      const H0 = AL.y1;
      const GW = 514 - W0;
      const GH = KM.ys - H0;
      const veri = lk.getImageData(W0 * 2, H0 * 2, GW * 2, GH * 2).data;
      const uz = new Float32Array(GW * GH);
      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          const px = W0 + x + 0.5;
          const py = H0 + y + 0.5;
          let dolu = !kemerUstunde(px, py) || kemerUzak(px, py) < 7.5 || px > 512;
          if (!dolu) {
            let a = 0;
            for (const [ox, oy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) a = Math.max(a, veri[((y * 2 + oy) * GW * 2 + x * 2 + ox) * 4 + 3]);
            dolu = a > 30;
          }
          uz[y * GW + x] = dolu ? 0 : 1e6;
        }
      }
      // çerçeve kenarı da sınırdır
      const k1 = 1;
      const k2 = Math.SQRT2;
      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          const i = y * GW + x;
          let v = uz[i];
          if (!v) continue;
          v = Math.min(v, x + 1, y + 1);
          if (x > 0) v = Math.min(v, uz[i - 1] + k1);
          if (y > 0) {
            v = Math.min(v, uz[i - GW] + k1);
            if (x > 0) v = Math.min(v, uz[i - GW - 1] + k2);
            if (x < GW - 1) v = Math.min(v, uz[i - GW + 1] + k2);
          }
          uz[i] = v;
        }
      }
      for (let y = GH - 1; y >= 0; y--) {
        for (let x = GW - 1; x >= 0; x--) {
          const i = y * GW + x;
          let v = uz[i];
          if (!v) continue;
          if (x < GW - 1) v = Math.min(v, uz[i + 1] + k1);
          if (y < GH - 1) {
            v = Math.min(v, uz[i + GW] + k1);
            if (x < GW - 1) v = Math.min(v, uz[i + GW + 1] + k2);
            if (x > 0) v = Math.min(v, uz[i + GW - 1] + k2);
          }
          uz[i] = v;
        }
      }
      const aday = [];
      for (let i = 0; i < GW * GH; i++) if (uz[i] >= 2.4) aday.push(i);
      aday.sort((a, b) => uz[b] - uz[a]);
      const kondu = [];
      const HG = 16;
      const kova = new Map();
      for (const i of aday) {
        const x = W0 + (i % GW) + 0.5;
        const y = H0 + Math.floor(i / GW) + 0.5;
        const rr = uz[i] - 1.1;
        const gx = Math.floor(x / HG);
        const gy = Math.floor(y / HG);
        let ok = true;
        for (let dy = -2; dy <= 2 && ok; dy++) {
          for (let dx = -2; dx <= 2 && ok; dx++) {
            const l = kova.get((gx + dx) * 1000 + gy + dy);
            if (!l) continue;
            for (const q of l) if (Math.hypot(q.x - x, q.y - y) < q.r + rr + 1.2) { ok = false; break; }
          }
        }
        if (!ok) continue;
        const q = { x, y, r: rr };
        kondu.push(q);
        const key = gx * 1000 + gy;
        if (!kova.has(key)) kova.set(key, []);
        kova.get(key).push(q);
      }
      // boşluk yönü: uzaklık alanında en hızlı azalan yön, en yakın dolu noktaya doğru
      const enYakinYon = (q) => {
        let en = 0;
        let enV = 1e9;
        for (let m = 0; m < 24; m++) {
          const a = (m / 24) * Math.PI * 2;
          const xx = Math.round(q.x + Math.cos(a) * (q.r + 1.5) - W0 - 0.5);
          const yy = Math.round(q.y + Math.sin(a) * (q.r + 1.5) - H0 - 0.5);
          const v = xx < 0 || yy < 0 || xx >= GW || yy >= GH ? 0 : uz[yy * GW + xx];
          if (v < enV) {
            enV = v;
            en = a;
          }
        }
        return en;
      };
      kondu.forEach((q, j) => {
        if (q.r >= 5) {
          // küçük kıvrım: en yakın saptan çıkan tek turluk helezon, ucunda gonca, yanında yaprak
          const a0 = enYakinYon(q);
          const yon = j % 2 ? 1 : -1;
          const R = q.r * 0.98;
          const e = [q.x + Math.cos(a0) * R, q.y + Math.sin(a0) * R];
          const bas = [q.x + Math.cos(a0) * (q.r + 2.2), q.y + Math.sin(a0) * (q.r + 2.2)];
          const pts = [bas].concat(helezonNoktalari(q.x, q.y, R, a0, yon, 1.05));
          cizgi(pts, 0.8, C.tahrir);
          const n = pts.length;
          const [x, y] = pts[Math.floor(n * 0.3)];
          const [x2, y2] = pts[Math.floor(n * 0.3) + 1];
          yaprakK(x, y, R * 0.55, Math.atan2(y2 - y, x2 - x) - yon * 0.9, j % 3 ? C.yesil : C.firuze);
          const [ux, uy] = pts[n - 1];
          const [px, py] = pts[n - 4];
          if (q.r >= 7.5) penc(ux, uy, R * 0.42, PEN[j % 2 ? 0 : 3], 5, 0.5);
          else gonca(ux, uy, R * 0.7, Math.atan2(uy - py, ux - px), j % 2 ? C.kirmizi : C.pembe);
        } else if (q.r >= 3.2) {
          const a = r() * Math.PI * 2;
          const rd = Math.min(1.0, q.r * 0.3);
          for (let m = 0; m < 3; m++) {
            const b = a + (m * Math.PI * 2) / 3;
            ctx.beginPath();
            ctx.arc(q.x + Math.cos(b) * rd * 1.35, q.y + Math.sin(b) * rd * 1.35, rd, 0, Math.PI * 2);
            ctx.fillStyle = C.lacivert;
            ctx.fill();
          }
        }
      });
    }
    ctx = anaCtx;

    // zemin + katman; sağ köşebent aynadır
    altinDoldur(alan);
    for (const ayna of [1, -1]) {
      ctx.save();
      if (ayna < 0) {
        ctx.translate(1024, 0);
        ctx.scale(-1, 1);
      }
      ctx.beginPath();
      ctx.rect(AL.x1, AL.y1, 512 - AL.x1, KM.ys - AL.y1);
      ctx.clip();
      ctx.clip(kose, 'evenodd');
      ctx.drawImage(L, 0, 0, 1024, 1024);
      ctx.restore();
    }
  }

  // kemerin içi: aharlı krem zemin + çok hafif halkâr
  doldur(kemerIc, C.krem);
  {
    ctx.save();
    ctx.clip(kemerIc);
    ctx.globalAlpha = 0.26;

    tahrir(p, 0.8);
    cizgi(pts.slice(1, 44), 0.6, C.tahrir);

  // kâğıt dokusu (çok hafif)
  {
