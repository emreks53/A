<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-089 Naif Resim — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #9fd0ee; }
  canvas { display: block; width: 1024px; height: 1024px; }
  svg.olcum { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<svg class="olcum" xmlns="http://www.w3.org/2000/svg"><path id="olcumYol" d="M0,0 L1,1"/></svg>
<script src="../../sahne/sahne.js"></script>
<script>
// S-089 Naif Resim — tuval üzerine örtücü yağlıboya, akademik eğitimsiz ressamın içten, sabırlı eli:
// cepheden bakış, her taş, her pencere, her yaprak ve çiçek tek tek boyanmış. Biçimler pergel ve cetvelle
// değil elle çizilmiş gibi hafif eğri büğrü; her alan yassı fırçayla örtücü ama biraz düzensiz sürülmüş,
// fırça izleri ve tuval dokusu görünür; konturlar ince fırçayla, kalınlığı değişen koyu çizgiyle çekilmiş.
(function () {
  'use strict';
  const W = 1024, S2 = 2, W2 = W * S2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const R = SAHNE.rng(8904);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const nA = gurultu(41), nB = gurultu(42), nC = gurultu(43), nK = gurultu(44);
  const nD1 = gurultu(51), nD2 = gurultu(52), nD3 = gurultu(53), nD4 = gurultu(54);
  const rgb = (c, a) => (a == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const durak = (dur, t) => {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  };

  const kc = SAHNE.yeniTuval(W2, W2), g = kc.getContext('2d', { willReadFrequently: true });
  g.setTransform(S2, 0, 0, S2, 0, 0);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const dikd = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y1} L${x2},${y2} L${x1},${y2} Z`;

  // ---------------------------------------------------------------- elle çizilmiş biçimler
  // Bütün biçimler yol boyunca örneklenir ve yavaş değişen bir kaydırma alanıyla eğilir: komşu biçimler
  // aynı eğriyi paylaşır (boşluk açılmaz), ama hiçbir çizgi cetvel ya da pergel düzgünlüğünde kalmaz.
  const kay = (x, y) => [
    x + (nD1(x / 118, y / 118) - 0.5) * 6.4 + (nD3(x / 24, y / 24) - 0.5) * 1.8,
    y + (nD2(x / 118, y / 118) - 0.5) * 6.4 + (nD4(x / 24, y / 24) - 0.5) * 1.8,
  ];
  const olc = document.getElementById('olcumYol');
  function el(d, adim) {
    adim = adim || 2.5;
    const parca = [];
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    for (const pc of d.match(/[Mm][^Mm]*/g) || []) {
      olc.setAttribute('d', pc);
      const L = olc.getTotalLength(), n = Math.max(4, Math.ceil(L / adim)), p = [];
      for (let i = 0; i <= n; i++) {
        const q = olc.getPointAtLength((L * i) / n), k = kay(q.x, q.y);
        p.push(k);
        if (k[0] < x1) x1 = k[0]; if (k[0] > x2) x2 = k[0]; if (k[1] < y1) y1 = k[1]; if (k[1] > y2) y2 = k[1];
      }
      parca.push({ p, kapali: /[Zz]\s*$/.test(pc) });
    }
    const yol = new Path2D();
    for (const { p, kapali } of parca) { p.forEach(([x, y], i) => (i ? yol.lineTo(x, y) : yol.moveTo(x, y))); if (kapali) yol.closePath(); }
    return { yol, parca, kutu: [x1, y1, x2, y2] };
  }
  // çizgi: noktaları sıklaştırıp eğer
  function serit(noktalar, adim) {
    adim = adim || 3;
    const out = [];
    for (let i = 0; i < noktalar.length - 1; i++) {
      const [ax, ay] = noktalar[i], [bx, by] = noktalar[i + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / adim));
      for (let k = 0; k < n; k++) out.push(kay(ax + ((bx - ax) * k) / n, ay + ((by - ay) * k) / n));
    }
    const [lx, ly] = noktalar[noktalar.length - 1];
    out.push(kay(lx, ly));
    return out;
  }

  // ---------------------------------------------------------------- yassı fırça
  // Bir fırça darbesi: birkaç kıl izinden oluşan, uçları düzensiz, hafif eğri bir şerit.
  function firca(x, y, aci, L, w, renk, alfa) {
    const ca = Math.cos(aci), sa = Math.sin(aci), nx = -sa, ny = ca;
    const egri = (R() - 0.5) * 0.28 * L;
    const k = clamp(Math.round(w / 1.5), 3, 9), lw = (w / k) * 1.75;
    const bas = L * 0.5, son = L * (0.38 + R() * 0.14);
    for (let i = 0; i < k; i++) {
      const o = (i / (k - 1) - 0.5) * w, j = (R() - 0.5) * 18;
      g.strokeStyle = rgb([renk[0] + j, renk[1] + j, renk[2] + j * 0.85], alfa * (0.55 + R() * 0.45));
      g.lineWidth = lw * (0.7 + R() * 0.6);
      const a0 = bas * (0.82 + R() * 0.18), a1 = son * (0.7 + R() * 0.3);
      g.beginPath();
      g.moveTo(x - ca * a0 + nx * o, y - sa * a0 + ny * o);
      g.quadraticCurveTo(x + nx * (o + egri), y + ny * (o + egri), x + ca * a1 + nx * o, y + sa * a1 + ny * o);
      g.stroke();
    }
  }
  // Bir alanı örtücü boyayla doldur: düz zemin + alanın kendi yönünde fırça darbeleri (biraz düzensiz kapama)
  function boya(s, o) {
    const [x1, y1, x2, y2] = s.kutu, L = o.L || 24, w = o.w || 7;
    g.save(); g.clip(s.yol);
    const t0 = o.renkF ? o.renkF((x1 + x2) / 2, (y1 + y2) / 2) : o.renk;
    g.fillStyle = o.taban ? (Array.isArray(o.taban) ? rgb(o.taban) : o.taban) : rgb(t0); g.fill(s.yol);
    const ex = L * 0.45, alan = (x2 - x1 + 2 * ex) * (y2 - y1 + 2 * ex);
    const n = Math.ceil((alan / (L * w)) * (o.yog || 1.7));
    for (let i = 0; i < n; i++) {
      const x = x1 - ex + R() * (x2 - x1 + 2 * ex), y = y1 - ex + R() * (y2 - y1 + 2 * ex);
      const c = o.renkF ? o.renkF(x, y) : o.renk, v = (R() - 0.5) * (o.oyn == null ? 14 : o.oyn);
      const aci = (o.yonF ? o.yonF(x, y) : o.aci || 0) + (R() - 0.5) * (o.sapma == null ? 0.28 : o.sapma);
      firca(x, y, aci, L * (0.7 + R() * 0.6), w * (0.75 + R() * 0.5), [c[0] + v, c[1] + v, c[2] + v * 0.9], o.alfa || 0.85);
    }
    g.restore();
  }
  // ince fırçayla kontur: kalınlığı yer yer değişen, örtücü çizgi
  function konturP(parca, renk, w, alfa) {
    g.strokeStyle = rgb(renk, alfa == null ? 1 : alfa);
    for (const { p } of parca) {
      for (let i = 0; i < p.length - 1; i += 3) {
        const [x, y] = p[i];
        g.lineWidth = w * (0.55 + 0.95 * nK(x / 13, y / 13));
        g.beginPath(); g.moveTo(x, y);
        for (let j = 1; j <= 3 && i + j < p.length; j++) g.lineTo(p[i + j][0], p[i + j][1]);
        g.stroke();
      }
    }
  }
  const kontur = (s, renk, w, alfa) => konturP(s.parca, renk, w, alfa);
  const cizgi = (noktalar, renk, w, alfa) => konturP([{ p: serit(noktalar) }], renk, w, alfa);
  const duz = (s, renk) => { g.fillStyle = rgb(renk); g.fill(s.yol); };
  const ptl = (x, y) => kay(x, y);

  // ================================================================ GÖK
  {
    const GOK = [[0, [44, 126, 212]], [260, [78, 160, 226]], [520, [138, 198, 238]], [700, [196, 228, 242]], [812, [234, 242, 228]]];
    const gok = el(dikd(-12, -12, 1036, 814), 12);
    const gokTaban = g.createLinearGradient(0, 0, 0, 812);
    for (const [y, c] of GOK) gokTaban.addColorStop(y / 812, rgb(mixc(c, [255, 255, 255], 0.08)));
    boya(gok, { taban: gokTaban, renkF: (x, y) => durak(GOK, y + (R() - 0.5) * 46), aci: 0, sapma: 0.14, L: 58, w: 13, yog: 2.4, oyn: 9 });

    // güneş: açık hale, ince sivri ışınlar, sarı disk
    const gx = 880, gy = 140;
    const hale = el(SAHNE.daireYolu(gx, gy, 88), 3);
    boya(hale, { renkF: (x, y) => mixc([255, 250, 214], [222, 238, 236], clamp((Math.hypot(x - gx, y - gy) - 54) / 34, 0, 1)), yonF: (x, y) => Math.atan2(y - gy, x - gx) + Math.PI / 2, sapma: 0.3, L: 20, w: 6, yog: 2.2, oyn: 8 });
    for (let k = 0; k < 24; k++) {
      const a = (k / 24) * Math.PI * 2 + 0.06, r1 = 48, r2 = k % 2 ? 80 : 100, da = 0.075;
      const d = `M${gx + Math.cos(a - da) * r1},${gy + Math.sin(a - da) * r1} L${gx + Math.cos(a) * r2},${gy + Math.sin(a) * r2} L${gx + Math.cos(a + da) * r1},${gy + Math.sin(a + da) * r1} Z`;
      const s = el(d, 2);
      boya(s, { renk: k % 2 ? [255, 206, 74] : [250, 176, 52], aci: a, sapma: 0.1, L: 12, w: 3.5, yog: 2.4, oyn: 12 });
      kontur(s, [214, 128, 34], 1.3);
    }
    const disk = el(SAHNE.daireYolu(gx, gy, 46), 2.5);
    boya(disk, { renkF: (x, y) => mixc([255, 236, 132], [248, 186, 46], clamp(Math.hypot(x - gx - 10, y - gy + 10) / 52, 0, 1)), yonF: (x, y) => Math.atan2(y - gy, x - gx) + Math.PI / 2, sapma: 0.25, L: 18, w: 5, yog: 2.6, oyn: 10 });
    kontur(disk, [214, 126, 30], 2);

    // bulutlar: yan yana yuvarlak tamponlar, düz taban; dış hat önce kalın çekilir, beyaz üstüne sürülür
    for (const [bx, by, s] of [[170, 256, 1], [492, 154, 0.82], [770, 334, 1.08], [948, 466, 0.68], [80, 470, 0.7]]) {
      const loblar = [[-92, 0, 26], [-56, -16, 34], [-12, -26, 42], [38, -18, 36], [80, -2, 26], [110, 6, 16]];
      let d = '';
      for (const [dx, dy, r] of loblar) d += SAHNE.daireYolu(bx + dx * s, by + dy * s, r * s) + ' ';
      // taban dikdörtgeni dairelerle aynı (saat yönünün tersi) dönüşte çizilir: birleşim delik bırakmaz
      const xa = bx - 116 * s, xb = bx + 116 * s, ya = by - 6 * s, yb = by + 14 * s;
      d += `M${xa},${ya} L${xa},${yb} L${xb},${yb} L${xb},${ya} Z`;
      const b = el(d, 2.5);
      // düz taban: tamponların alttan taşan kısmı kesilir
      g.save(); g.beginPath(); g.rect(bx - 200 * s, by - 120 * s, 400 * s, 120 * s + yb - by + 2.2); g.clip();
      konturP(b.parca, [128, 160, 204], 4.4);
      boya(b, { renkF: (x, y) => durak([[by - 70 * s, [255, 255, 255]], [by - 18 * s, [252, 253, 255]], [by + 14 * s, [196, 214, 236]]], y), aci: -0.1, sapma: 0.7, L: 22, w: 7, yog: 2.4, oyn: 8 });
      // her tamponun sağ üstüne parlak bir dokunuş
      g.save(); g.clip(b.yol);
      for (const [dx, dy, r] of loblar) for (let k = 0; k < 4; k++) {
        const a = -0.9 + (R() - 0.5) * 0.8, rr = r * s * (0.45 + R() * 0.25);
        firca(bx + dx * s + Math.cos(a) * rr, by + dy * s + Math.sin(a) * rr, a + Math.PI / 2, r * s * 0.7, 4.5 * s, [255, 255, 255], 0.9);
      }
      g.restore();
      g.restore();
    }
  }

  // ================================================================ UFUK: ağaç sırası, hurmalar, avlu, çayır
  {
    // yuvarlak ağaç: düz koyu taç, üstünde tek tek boyanmış yaprak lekeleri
    const agac = (x, y, h, ton) => {
      const gv = el(dikd(x - 1.6, y - h * 0.4, x + 1.6, y + 1), 2);
      duz(gv, [128, 92, 60]);
      const tac = el(SAHNE.elipsYolu({ cx: x, cy: y - h * 0.64, rx: h * 0.26, ry: h * 0.37, aci: 0 }), 2);
      duz(tac, ton ? [40, 110, 60] : [50, 126, 64]);
      g.save(); g.clip(tac.yol);
      for (let k = 0; k < 16; k++) {
        const a = R() * Math.PI * 2, rr = Math.sqrt(R()), lx = x + Math.cos(a) * rr * h * 0.22, ly = y - h * 0.64 + Math.sin(a) * rr * h * 0.32;
        const isik = clamp(0.5 + (lx - x) / (h * 0.5) - (ly - (y - h * 0.64)) / (h * 0.8), 0, 1);
        g.fillStyle = rgb(mixc([58, 138, 66], [150, 206, 98], isik));
        g.beginPath(); g.ellipse(lx, ly, 2.6, 1.6, R() * 3, 0, 7); g.fill();
      }
      g.restore();
      kontur(tac, [26, 74, 40], 1.2);
    };
    const hurma = (x, y, h, egik) => {
      const tx = x + egik, ty = y - h;
      cizgi([[x, y], [x + egik * 0.5, y - h * 0.5], [tx, ty]], [142, 104, 64], 4.6);
      for (let k = 1; k < 12; k++) { const t = k / 12, px = x + (tx - x) * t, py = y - h * t; cizgi([[px - 2.3, py + 1.2], [px + 2.3, py - 1]], [100, 70, 40], 1.1); }
      for (let k = 0; k < 9; k++) {
        const a = -Math.PI / 2 + (k / 8 - 0.5) * 3.4, L = h * (0.42 + (k % 2) * 0.08);
        const ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.75 + L * 0.28 * Math.abs(Math.cos(a));
        const mx = tx + Math.cos(a) * L * 0.5, my = ty + Math.sin(a) * L * 0.5 - 4;
        const pts = [];
        for (let j = 0; j <= 8; j++) { const t = j / 8; pts.push([(1 - t) * (1 - t) * tx + 2 * (1 - t) * t * mx + t * t * ex, (1 - t) * (1 - t) * ty + 2 * (1 - t) * t * my + t * t * ey]); }
        cizgi(pts, k % 2 ? [52, 128, 62] : [40, 110, 56], 2);
        for (let j = 1; j < 8; j++) {
          const [qx, qy] = pts[j], ln = 7 * (1 - (j / 8) * 0.6);
          for (const sg of [1.2, -1.2]) cizgi([[qx, qy], [qx + Math.cos(a + sg) * ln, qy + Math.sin(a + sg) * ln + 2]], j % 2 ? [92, 168, 78] : [64, 146, 66], 1.3);
        }
      }
      for (let k = 0; k < 5; k++) { g.fillStyle = k % 2 ? '#d0802c' : '#b8661e'; g.beginPath(); g.arc(tx - 4 + k * 2, ty + 4 + (k % 2) * 2, 1.9, 0, 7); g.fill(); }
    };
    const servi = (x, y, h) => {
      const s = el(`M${x},${y - h} Q${x + h * 0.17},${y - h * 0.45} ${x + h * 0.06},${y} L${x - h * 0.06},${y} Q${x - h * 0.17},${y - h * 0.45} ${x},${y - h} Z`, 2);
      boya(s, { renkF: (px) => (px > x ? [64, 140, 70] : [34, 98, 54]), aci: -Math.PI / 2, sapma: 0.4, L: 9, w: 3, yog: 2.4, oyn: 14 });
      kontur(s, [22, 66, 38], 1.2);
    };
    for (let x = 10; x < 290; x += 19) agac(x, 801, 34 + ((x * 7) % 9), (x / 19) % 2 < 1);
    for (let x = 842; x < 1024; x += 19) agac(x, 801, 34 + ((x * 5) % 9), (x / 19) % 2 < 1);
    for (const x of [44, 266, 852, 1002]) servi(x, 803, 64);
    hurma(150, 804, 96, 6); hurma(205, 804, 76, -5); hurma(912, 804, 94, -6); hurma(964, 804, 72, 5);

    // avlu: tek tek boyanmış döşeme taşları
    duz(el(dikd(-10, 799, 1034, 838), 6), [222, 196, 148]);
    for (let sira = 0; sira < 3; sira++) {
      const y1 = 801 + sira * 11.6, h = 11.6;
      for (let x = -(sira % 2) * 13; x < W + 10; x += 26) {
        const t = R(), s = el(dikd(x + 1.2, y1 + 1.1, x + 24.8, y1 + h - 1.1), 3);
        boya(s, { renk: t < 0.33 ? [246, 228, 190] : t < 0.66 ? [240, 216, 172] : [250, 236, 206], aci: 0, sapma: 0.3, L: 12, w: 3.5, yog: 2, oyn: 12 });
        kontur(s, [186, 150, 102], 1);
      }
    }
    // çayır: kısa dikey fırça darbeleriyle
    const cayir = el(dikd(-10, 836, 1034, 1034), 8);
    boya(cayir, { renkF: (x, y) => durak([[836, [160, 208, 104]], [930, [118, 186, 88]], [1024, [80, 156, 74]]], y), aci: -Math.PI / 2, sapma: 0.5, L: 14, w: 5, yog: 2.2, oyn: 18 });
    // düzenli sıralar hâlinde çimen tutamları
    for (let y = 842; y < 1024; y += 9) for (let x = (y % 18) / 2; x < W; x += 13) {
      const px = x + (R() - 0.5) * 4, py = y + (R() - 0.5) * 3, s = 2.6 + (y - 836) / 50;
      g.strokeStyle = R() < 0.5 ? 'rgba(52,118,52,0.85)' : 'rgba(186,224,112,0.85)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(px - s * 0.7, py - s); g.lineTo(px, py); g.lineTo(px + s * 0.7, py - s); g.moveTo(px, py); g.lineTo(px, py - s * 1.2); g.stroke();
    }
  }

  // ================================================================ YAPI
  const TAS_K = [132, 108, 86];
  {
    const c = 300;
    // ---------------------------------------------------------- minare
    const tasRenk = (x1, x2) => (x) => durak([[x1, [206, 196, 182]], [x1 + (x2 - x1) * 0.45, [246, 240, 228]], [x1 + (x2 - x1) * 0.8, [254, 251, 242]], [x2, [236, 228, 214]]], x);
    const govde = (x1, y1, x2, y2) => {
      const s = el(dikd(x1, y1, x2, y2), 3);
      boya(s, { renkF: tasRenk(x1, x2), aci: -Math.PI / 2, sapma: 0.12, L: 22, w: 6, yog: 2.2, oyn: 10 });
      for (let y = y1 + 12; y < y2 - 2; y += 12) cizgi([[x1 + 1.5, y], [x2 - 1.5, y]], [192, 176, 152], 1);
      for (let y = y1 + 12, k = 0; y < y2 - 2; y += 12, k++) { const xm = x1 + (x2 - x1) * (k % 2 ? 0.34 : 0.66); cizgi([[xm, y], [xm, Math.min(y + 12, y2 - 1)]], [196, 180, 156], 0.9); }
      kontur(s, TAS_K, 1.9);
    };
    govde(c - 34, 488, c + 34, 800); govde(c - 27, 316, c + 27, 436); govde(c - 19, 206, c + 19, 272);
    // zikzak bandı: sırayla kiremit ve lacivert üçgenler
    {
      const y1 = 522, y2 = 582, x1 = c - 34, x2 = c + 34;
      const bant = el(dikd(x1, y1, x2, y2), 3);
      boya(bant, { renk: [250, 244, 230], aci: 0, L: 14, w: 4, yog: 2, oyn: 8 });
      for (let k = 0; k < 3; k++) {
