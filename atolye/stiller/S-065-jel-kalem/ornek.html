<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-065 Siyah Kâğıda Jel Kalem (Gel Pen on Black Paper) — siyah kâğıt üstüne örtücü ve metalik jel
// kalemler (beyaz, altın, gümüş, pembe, turkuaz, fıstık yeşili): ince çizgiler, ışığı noktalama ve
// taramayla kurma (ışık alan yer sık, gölge seyrek), geometrik ve bitkisel süs dolguları. Parlama yok:
// keskin, net kontrast.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
(function () {
  'use strict';
  // ================================================================ ortak araçlar (kalem ailesi kiti)
  const OL = 2; // iç çözünürlük çarpanı (2048 piksel; koordinatlar 1024'te)
  const PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(PI2 * r()); }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karisim(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }

  /** Ekran dışı katman: 2048 piksel, 1024 koordinat. */
  function katman(olcek, okunur) {
    olcek = olcek || OL;
    const c = SAHNE.yeniTuval(1024 * olcek, 1024 * olcek);
    const x = c.getContext('2d', { willReadFrequently: !!okunur });
    x.setTransform(olcek, 0, 0, olcek, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x, o: olcek };
  }

  /** Değer gürültüsü (0..1), yumuşak ara değerli. */
  function gurultuUret(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function fbmUret(tohum, okt) {
    const n = gurultuUret(tohum);
    okt = okt || 4;
    return (x, y) => {
      let s = 0, a = 1, t = 0, f = 1;
      for (let k = 0; k < okt; k++) { s += n(x * f + k * 17.3, y * f - k * 9.1) * a; t += a; a *= 0.5; f *= 2.03; }
      return s / t;
    };
  }

  /** SVG yol dizgisini (M L C A Z, mutlak) nokta dizilerine çevirir. Her dizi .kapali bilgisi taşır. */
  function duzlestir(d, adim) {
    adim = adim || 2;
    const tok = d.match(/[MLCAZmlcaz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const ekle = (x, y) => cur.push([x, y]);
    const cizgi = (x, y) => {
      const L = Math.hypot(x - cx, y - cy);
      const m = Math.max(1, Math.ceil(L / adim));
      for (let j = 1; j <= m; j++) ekle(cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') {
        if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) cizgi(sx, sy); cur.kapali = true; }
        cx = sx; cy = sy; cur = null;
        continue;
      }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') cizgi(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          ekle(u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const dx = (cx - x) / 2, dy = (cy - y) / 2;
        const x1p = cr * dx + sr * dy, y1p = -sr * dx + cr * dy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(6, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          ekle(cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }

  /** Nokta dizisini eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1];
    const o = out[out.length - 1];
    if (Math.hypot(s[0] - o[0], s[1] - o[1]) > adim * 0.25) out.push([s[0], s[1]]);
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }

  /** Çizgiyi normali boyunca gürültüyle titretir (el titremesi). */
  function titret(p, gen, dalga, nf, faz) {
    const out = [];
    let s = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const d = gen * (nf(s / dalga + faz, faz * 1.7) - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }
    return out;
  }

  /** Uçları teğet yönünde uzatır (a: başta, b: sonda; eksi değer kısaltır). */
  function uzat(p, a, b) {
    if (p.length < 2) return p.slice();
    const q = p.slice();
    const t0 = yon(p, 0, 1), t1 = yon(p, p.length - 1, -1);
    if (a > 0) q.unshift([p[0][0] - t0[0] * a, p[0][1] - t0[1] * a]);
    if (b > 0) q.push([p[p.length - 1][0] + t1[0] * b, p[p.length - 1][1] + t1[1] * b]);
    let r = q;
    if (a < 0) r = kes(r, -a, 0);
    if (b < 0) r = kes(r, 0, -b);
    return r;
  }
  function yon(p, i, s) {
    // i noktasından s yönündeki birkaç noktaya bakarak birim teğet (dizinin içine doğru değil, dışına doğru)
    const j = clamp(i + s * Math.min(4, p.length - 1), 0, p.length - 1);
    let tx = p[i][0] - p[j][0], ty = p[i][1] - p[j][1];
    const l = Math.hypot(tx, ty) || 1;
    return [tx / l, ty / l];
  }
  /** Dizinin başından a, sonundan b uzunluk keser. */
  function kes(p, a, b) {
    const L = uzunluk(p);
    return parca(p, a, L - b);
  }
  /** Dizinin s0..s1 yay uzunluğu aralığındaki parçası. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const e = s + L;
      if (e >= s0 && s <= s1) {
        const ta = clamp((s0 - s) / (L || 1), 0, 1), tb = clamp((s1 - s) / (L || 1), 0, 1);
        const A = [lerp(p[i - 1][0], p[i][0], ta), lerp(p[i - 1][1], p[i][1], ta)];
        const B = [lerp(p[i - 1][0], p[i][0], tb), lerp(p[i - 1][1], p[i][1], tb)];
        if (!out.length) out.push(A);
        out.push(B);
      }
      s = e;
    }
    return out;
  }

  /** Keskin köşelerden böler (kalem köşede kalkar). */
  function koseBol(p, esik) {
    esik = esik || 0.7;
    const out = [];
    let cur = [p[0]];
    for (let i = 1; i < p.length - 1; i++) {
      cur.push(p[i]);
      const a1 = Math.atan2(p[i][1] - p[i - 1][1], p[i][0] - p[i - 1][0]);
      const a2 = Math.atan2(p[i + 1][1] - p[i][1], p[i + 1][0] - p[i][0]);
      let d = a2 - a1;
      while (d > Math.PI) d -= PI2;
      while (d < -Math.PI) d += PI2;
      if (Math.abs(d) > esik) { out.push(cur); cur = [p[i]]; }
    }
    cur.push(p[p.length - 1]);
    out.push(cur);
    return out.filter((q) => q.length > 1 && uzunluk(q) > 0.8);
  }

  /** Değişken kalınlıklı şerit: wf(i, t, aci) → kalınlık. uc: uçlara yuvarlak başlık. */
  function serit(x, p, wf, uc) {
    const n = p.length;
    if (n < 2) return;
    const L = new Array(n), R = new Array(n), W = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const w = Math.max(0, wf(i, i / (n - 1), Math.atan2(ty, tx))) / 2;
      W[i] = w;
      L[i] = [p[i][0] - ty * w, p[i][1] + tx * w];
      R[i] = [p[i][0] + ty * w, p[i][1] - tx * w];
    }
    x.beginPath();
    x.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) x.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath();
    if (uc) {
      x.moveTo(p[0][0] + W[0], p[0][1]);
      x.arc(p[0][0], p[0][1], W[0], 0, PI2);
      x.moveTo(p[n - 1][0] + W[n - 1], p[n - 1][1]);
      x.arc(p[n - 1][0], p[n - 1][1], W[n - 1], 0, PI2);
    }
    x.fill('nonzero');
  }

  /** Hobbs usulü çokgen bozma (suluboya lekeleri, kenar düzensizliği). */
  function boz(p, derinlik, varyans, r) {
    let q = p;
    let v = varyans;
    for (let d = 0; d < derinlik; d++) {
      const yeni = [];
      for (let i = 0; i < q.length; i++) {
        const a = q[i], b = q[(i + 1) % q.length];
        yeni.push(a);
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const nx = -(b[1] - a[1]) / (L || 1), ny = (b[0] - a[0]) / (L || 1);
        const g = gauss(r) * L * v, t = 0.5 + gauss(r) * 0.12;
        yeni.push([lerp(a[0], b[0], t) + nx * g + gauss(r) * L * v * 0.3, lerp(a[1], b[1], t) + ny * g + gauss(r) * L * v * 0.3]);
      }
      q = yeni;
      v *= 0.72;
    }
    return q;
  }
  function cokgenYolu(p) {
    const P = new Path2D();
    P.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]);
    P.closePath();
    return P;
  }
  const kutuNok = (p, e) => { e = e || 0; let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of p) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); d = Math.max(d, q[1]); } return [a - e, b - e, c + e, d + e]; };
  function merkez(p) { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; }
  function donustur(p, dx, dy, s, cx, cy) {
    if (cx === undefined) [cx, cy] = merkez(p);
    return p.map((q) => [cx + (q[0] - cx) * s + dx, cy + (q[1] - cy) * s + dy]);
  }

  /** Çizgiyi bir koşula göre parçalara ayırır (koşul tutan bölümler döner). */
  function kosulluParcalar(p, kosul) {
    const out = [];
    let cur = null;
    for (const q of p) {
      if (kosul(q[0], q[1])) { if (!cur) { cur = []; out.push(cur); } cur.push(q); }
      else cur = null;
    }
    return out.filter((c) => c.length > 1);
  }

  /** Sahnenin bölge haritası (OL ölçekte): bolgeNo dizisi + ad listesi. */
  function bolgeHaritasiOl() {
    const c = SAHNE.yeniTuval(1024 * OL, 1024 * OL);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(OL, 0, 0, OL, 0, 0);
    SAHNE.ciz(x, { bolge: true });
    const v = x.getImageData(0, 0, c.width, c.height).data;
    const adlar = Object.keys(SAHNE.BOLGE);
    const no = {};
    adlar.forEach((a, i) => (no[a] = i));
    const harita = new Uint8Array(c.width * c.height);
    const onbellek = new Map();
    for (let i = 0, j = 0; i < harita.length; i++, j += 4) {
      const anahtar = (v[j] << 16) | (v[j + 1] << 8) | v[j + 2];
      let b = onbellek.get(anahtar);
      if (b === undefined) { b = no[SAHNE.bolgeAdi(v[j], v[j + 1], v[j + 2])]; onbellek.set(anahtar, b); }
      harita[i] = b;
    }
    return { harita, no, adlar, w: c.width, bolge: (x1, y1) => adlar[harita[clamp(Math.round(y1 * OL), 0, c.height - 1) * c.width + clamp(Math.round(x1 * OL), 0, c.width - 1)]] };
  }

  // ---------------------------------------------------------------- sahne geometrisi (çizgi stilleri için)
  const Y = SAHNE.yollar();
  const dikd = (x1, y1, x2, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]];
  const MP = SAHNE.minareParcalari();
  const mp = (ad) => MP.find((p) => p.ad === ad);
  function parcaNoktalari(p) {
    if (p.tip === 'poligon') return p.noktalar.concat([p.noktalar[0]]);
    if (p.tip === 'korkuluk' || p.tip === 'bant') return dikd(p.x1, p.y1, p.x2, p.y2);
    if (p.tip === 'topuz') return duzlestir(p.yol, 1.5)[0];
    return null;
  }
  /** Minarenin silueti (Path2D) */
  function minareSiluet() {
    const P = new Path2D();
    for (const d of Y.minare) P.addPath(new Path2D(d));
    for (const d of Y.minareAlem) P.addPath(new Path2D(d));
    return P;
  }
  function birlesik(dizi) { const P = new Path2D(); for (const d of dizi) P.addPath(typeof d === 'string' ? new Path2D(d) : d); return P; }
  const K = SAHNE.kaide;
  const KS = SAHNE.kasnak;
  const KP = [SAHNE.kasnakPencereleri(0), SAHNE.kasnakPencereleri(1)];
  const BIT = SAHNE.bitki;
  /** Kubbe yüzeyinde ışık (0..1): dönel yüzey normali · ışık yönü (sağ üst, öne) */
  const PROF = SAHNE.kubbeProfili(120);
  function kubbeR(y) {
    for (let i = 0; i < PROF.length - 1; i++) {
      if (y <= PROF[i].y && y >= PROF[i + 1].y) {
        const t = (PROF[i].y - y) / (PROF[i].y - PROF[i + 1].y || 1);
        return { r: lerp(PROF[i].r, PROF[i + 1].r, t), egim: Math.atan2(PROF[i].r - PROF[i + 1].r, PROF[i].y - PROF[i + 1].y) };
      }
    }
    return { r: 0, egim: 0 };
  }
  const ISIK = (() => { const v = [0.62, -0.55, 0.56]; const l = Math.hypot(...v); return v.map((a) => a / l); })();
  function kubbeIsik(x, y) {
    const { r, egim } = kubbeR(y);
    if (r <= 0) return 0.7;
    const u = clamp((x - 560) / r, -1, 1);
    // yüzey normali: yatay bileşen dışa doğru, düşey bileşen profil eğiminden
    const yukari = Math.sin(egim); // eğim ~0 (dik duvar) → yukarı bileşen 0; tepe → 1
    const yatay = Math.cos(egim);
    const nx = u * yatay, nz = Math.sqrt(Math.max(0, 1 - u * u)) * yatay, ny = -yukari;
    return clamp(nx * ISIK[0] + ny * ISIK[1] + nz * ISIK[2], 0, 1);
  }
  function silindirIsik(x, cx, R) {
    const u = clamp((x - cx) / R, -1, 1);
    return clamp(u * ISIK[0] + Math.sqrt(1 - u * u) * ISIK[2] + 0.05, 0, 1);
  }

  const tuval = document.getElementById('tuval');
  const ctx = SAHNE.tuval(tuval, OL);
  const R = SAHNE.rng(6505);
  const NF = gurultuUret(651);
  const KAGIT = '#141316';
  const BEYAZ = '#f3f1ea', PEMBE = '#ff7db4', TURKUAZ = '#2fd0c4', LIME = '#b3ee48';
  const ALTIN = ['#8c6c28', '#b48e3c', '#d6ae56', '#ebcd85', '#f9e8b4'];
  const GUMUS = ['#7a7f87', '#a1a6ae', '#c4c8cf', '#dfe2e7', '#f5f6f8'];

  // ================================================================ 1. SİYAH KÂĞIT
  {
    const im = ctx.getImageData(0, 0, tuval.width, tuval.height);
    const v = im.data;
    const WW = tuval.width;
    const HF = fbmUret(652, 4), HN = gurultuUret(653);
    const b = hex(KAGIT);
    for (let y = 0, i = 0; y < WW; y++) {

    kontur(duzlestir(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1)[0], ALTIN, { w: 1.4, kose: 1.1, parlak: 0.1 });
    kontur(duzlestir(SAHNE.kemerYolu(p.x, p.y - 5, p.w + 10, p.h + 5), 1)[0], PEMBE, { w: 0.9, kose: 1.1 });
    for (let k = 0; k < 5; k++) nokta(p.x - p.w / 2 - 5 + k * ((p.w + 10) / 4), p.y + p.h + 4, 1.1, TURKUAZ);
  }
  bas();

  // ================================================================ 8. KASNAK: turkuaz hat, pencere çevresi süslü
  for (const k of [1, 0]) {
    const q = KS[k];
    const yol = new Path2D(SAHNE.yol(dikd(q.x1, q.y1, q.x2, q.y2), true));
    ort(yol);
    const cx = (q.x1 + q.x2) / 2, Rr = (q.x2 - q.x1) / 2;
    const isik = (x) => silindirIsik(x, cx, Rr);
    const renkF = (x) => (isik(x) > 0.62 ? LIME : TURKUAZ);
    const pen = KP[k].map((p) => new Path2D(SAHNE.kemerYolu(p.x, p.y, p.w + 5, p.h + 4)));
    const disinda = (x, y) => !pen.some((P) => ix.isPointInPath(P, x * OL, y * OL));
    noktala([q.x1 + 2, q.y1 + 8, q.x2 - 2, q.y2 - 8], disinda, (x) => 0.06 + Math.pow(isik(x), 1.3) * 0.95, (x) => (isik(x) > 0.8 && R() < 0.35 ? BEYAZ : renkF(x)), { alan: 4.2, r: 0.85 });
    jel([[q.x1 + 3, q.y1 + 7], [q.x2 - 3, q.y1 + 7]], GUMUS, { w: 0.85, damla: 0 });
    jel([[q.x1 + 3, q.y2 - 7], [q.x2 - 3, q.y2 - 7]], GUMUS, { w: 0.85, damla: 0 });
    // üst ve alt bantta nokta dizisi
    for (let x = q.x1 + 4; x < q.x2; x += 6) {
      if (R() < 0.25 + isik(x) * 0.8) nokta(x, q.y1 + 3.5, 1.1, renkF(x));
      if (R() < 0.25 + isik(x) * 0.8) nokta(x + 3, q.y2 - 3.5, 1.1, renkF(x));
    }
    for (const p of KP[k]) {
      if (p.w < 6) { jel([[p.x, p.y + 2], [p.x, p.y + p.h]], renkF(p.x), { w: 1.0 }); continue; }
      kontur(duzlestir(SAHNE.kemerYolu(p.x, p.y, p.w, p.h), 1)[0], isik(p.x) > 0.5 ? BEYAZ : GUMUS[2], { w: 1.1, kose: 1.1 });
      kontur(duzlestir(SAHNE.kemerYolu(p.x, p.y - 3, p.w + 5, p.h + 3), 1)[0], ALTIN, { w: 0.8, kose: 1.1 });
    }
    kontur(dikd(q.x1, q.y1, q.x2, q.y2), TURKUAZ, { w: 1.7 });
  }
  bas();

  // ================================================================ 9. KUBBE: dilim dilim süs dolgusu, ışığa göre yoğunluk
  const kubbeYol = new Path2D(Y.kubbe);
  ort(kubbeYol);
  const kab = SAHNE.kaburgalar(16, 80);
  const kenarlar = [PROF.map((q) => [560 - q.r, q.y])].concat(kab.map((kb) => kb.noktalar)).concat([PROF.map((q) => [560 + q.r, q.y])]);
  const yogK = (x, y) => clamp(0.14 + 0.95 * Math.pow(kubbeIsik(x, y), 1.2), 0, 1);
  const renkK = (x, y) => { const l = kubbeIsik(x, y); return l > 0.72 ? (R() < 0.3 ? BEYAZ : LIME) : l > 0.45 ? LIME : TURKUAZ; };
  const desenler = [
    (kt, ic) => noktala(kt, ic, yogK, renkK, { alan: 4.5, r: 0.95 }),
    (kt, ic) => pul(kt, ic, yogK, renkK, { r: 5.5, w: 1.05 }),
    (kt, ic) => sevron(kt, ic, yogK, renkK, { a: 7, w: 1.05 }),
    (kt, ic) => halka(kt, ic, yogK, renkK, { a: 9.5, w: 1.0 }),
  ];
  for (let i = 0; i < kenarlar.length - 1; i++) {
    const A = kenarlar[i], B = kenarlar[i + 1];
    const pol = A.concat(B.slice().reverse());
    const yol = cokgenYolu(pol);
    const ic = icinde(yol);
    const kt = kutuNok(pol);
    desenler[i % 4](kt, (x, y) => ic(x, y) && y > 318);
  }
  // tepe: yoğun noktalama ve ışık şeridinde beyaz
  noktala([470, 300, 650, 330], (x, y) => SAHNE.kubbedeMi(x, y), (x, y) => yogK(x, y), renkK, { alan: 4, r: 0.75 });
  noktala([560, 320, 720, 550], (x, y) => { const r = kubbeR(y).r; const u = (x - 560) / (r || 1); return SAHNE.kubbedeMi(x, y) && Math.abs(u - 0.34) < 0.07; }, () => 0.75, BEYAZ, { alan: 4, r: 0.8 });
  for (const kb of kab) {
    let pts = kb.noktalar.filter((q) => q[1] > 302);
    const bitis = pts.findIndex((q) => kubbeR(q[1]).r * (Math.PI / 16) * Math.sqrt(Math.max(0.05, 1 - kb.u * kb.u)) < 4.5);
    if (bitis > 0) pts = pts.slice(0, bitis);
    jel(pts.slice(1), kb.u > 0.1 ? LIME : TURKUAZ, { w: 1.45 });
  }
  kontur(SAHNE.kubbeNoktalari(100), LIME, { w: 2.0, kose: 3 });
  // kubbe tabanında pembe nokta dizisi
  for (let x = 362; x < 760; x += 6) nokta(x, 551, 1.2, PEMBE);
  jel([[352, 555], [768, 555]], TURKUAZ, { w: 1.4 });
  bas();
  ort(birlesik(Y.alem));
  alemCiz(SAHNE.alemParcalari(560, 300, 1), 1);
  bas();

  // ================================================================ 10. BİTKİLER: yapraklarda damar deseni, çiçeklerde pembe çizgiler
  for (const s of BIT.saplar) {
    ort(new Path2D(SAHNE.yol(s)), 4);
    jel(s, LIME, { w: 1.4 });
    jel(s.map((q) => [q[0] + 2.4, q[1]]), TURKUAZ, { w: 0.8, damla: 0 });
    bas();
  }
  BIT.yapraklar.forEach((y, i) => {
    const d = SAHNE.yaprakYolu(y);
    ort(new Path2D(d));
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const W = y.uzunluk * y.genislik;
    const isikTaraf = sa > 0 ? -1 : 1;
    const ana = i % 2 ? LIME : TURKUAZ, yan = i % 2 ? TURKUAZ : LIME;
    kontur(duzlestir(d, 1)[0], ana, { w: 1.3, kose: 0.9 });
    const [a, b] = SAHNE.yaprakDamari(y);
    jel([a, b], ana, { w: 1.0, damla: 0 });
    // balıksırtı damarlar: ışık yanında sık ve parlak, gölge yanında seyrek
    const n = Math.round(y.uzunluk / 6);
    for (let k = 1; k < n; k++) {
      const u = (y.uzunluk * k) / n * 0.92;
      const gen = W * 0.42 * Math.sin((Math.PI * u) / y.uzunluk) * 0.85;
      for (const taraf of [-1, 1]) {
        if (taraf !== isikTaraf && k % 2) continue;
        const px = y.x + ca * u, py = y.y + sa * u;
        jel([[px, py], [px + ca * gen * 0.6 - sa * taraf * gen, py + sa * gen * 0.6 + ca * taraf * gen]], taraf === isikTaraf ? yan : GUMUS[1], { w: 0.75, damla: 0, tit: 0.1 });
      }
    }
    bas();
  });
  for (const t of BIT.tomurcuklar) {
    const d = SAHNE.tomurcukYolu(t);
    ort(new Path2D(d));
    kontur(duzlestir(d, 1)[0], PEMBE, { w: 1.3, kose: 1.0 });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    for (const off of [-0.4, 0, 0.4]) jel([[t.x - ca * t.r * 0.6 - sa * off * t.r, t.y - sa * t.r * 0.6 + ca * off * t.r], [t.x + ca * t.r * 1.2 - sa * off * t.r * 0.4, t.y + sa * t.r * 1.2 + ca * off * t.r * 0.4]], PEMBE, { w: 0.75, damla: 0 });
    nokta(t.x - ca * t.r * 0.9, t.y - sa * t.r * 0.9, 1.3, LIME);
    bas();
  }
  function tacNoktalari(e) {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const f = (i / 40) * PI2;
      const centik = 1 - 0.1 * Math.exp(-((f > Math.PI ? f - PI2 : f) ** 2) / 0.03);
      const u = Math.cos(f) * e.rx * 1.02 * centik, v = Math.sin(f) * e.ry * 1.05 * (0.75 + 0.25 * Math.cos(f));
      pts.push([e.cx + u * Math.cos(e.aci) - v * Math.sin(e.aci), e.cy + u * Math.sin(e.aci) + v * Math.cos(e.aci)]);
    }
    return pts;
  }
  for (const c of BIT.cicekler) {
    for (const i of [0, 2, 4, 1, 3]) {
      const e = SAHNE.tacYapraklari(c)[i];
      const pts = tacNoktalari(e);
      ort(cokgenYolu(pts));
      const isik = Math.cos(e.aci) * 0.7 - Math.sin(e.aci) * 0.7;
      kontur(pts, isik > -0.2 ? BEYAZ : PEMBE, { w: c.r > 40 ? 1.5 : 1.2, kose: 1.4 });
      // taç yaprağı damarları: merkezden yelpaze
      const n = c.r > 40 ? 7 : 5;
      for (let k = 0; k < n; k++) {
        const a = e.aci + (k / (n - 1) - 0.5) * 0.75;
        const r0 = c.r * 0.28, r1 = c.r * (0.62 + 0.25 * Math.cos((k / (n - 1) - 0.5) * 2.4));
        jel([[c.x + Math.cos(a) * r0, c.y + Math.sin(a) * r0], [c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1]], k % 2 ? PEMBE : BEYAZ, { w: 0.8, damla: 0, tit: 0.1 });
      }
      if (isik > 0) noktala(kutuNok(pts), icinde(cokgenYolu(pts)), (x, y) => (Math.hypot(x - c.x, y - c.y) > c.r * 0.7 ? 0.45 : 0), BEYAZ, { alan: 5, r: 0.7 });
    }
    noktala([c.x - c.r * 0.22, c.y - c.r * 0.22, c.x + c.r * 0.22, c.y + c.r * 0.22], (x, y) => Math.hypot(x - c.x, y - c.y) < c.r * 0.18, () => 0.9, ALTIN, { alan: 2.2, r: 0.75 });
    const n = c.r > 40 ? 12 : 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * PI2;
      nokta(c.x + Math.cos(a) * c.r * 0.26, c.y + Math.sin(a) * c.r * 0.26, Math.max(1, c.r * 0.035), ALTIN);
    }
    bas();
  }
  bas();

  ctx.drawImage(I.c, 0, 0, 1024, 1024);
  SAHNE.hazir();
})();
