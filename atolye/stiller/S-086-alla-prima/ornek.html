<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-086 Alla Prima — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #e6ae84; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-086 Alla Prima — açık havada tek oturuşta, yaş üstüne yaş yapılmış yağlıboya eskiz.
// Sıcak tonlu (sienna astarlı) tuval, üstünde ince boyayla atılmış ön çizim; sonra geniş, düz fırça
// darbeleriyle büyük renk düzlemleri yan yana konur, karıştırılmaz. Darbelerin arasından astar görünür;
// biçimler birkaç değer düzlemine indirgenir. Boya ince-orta kalınlıktadır: hafif kabartı, bez dokusu.
(function () {
  'use strict';
  const W = 1024, N = W * W, S2 = 2, W2 = W * S2, N2 = W2 * W2;
  const tuval = document.getElementById('tuval');
  tuval.width = W2; tuval.height = W2;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  const R = SAHNE.rng(8601);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rampa(dur, t) {
    if (t <= dur[0][0]) return dur[0][1];
    for (let i = 1; i < dur.length; i++) if (t <= dur[i][0]) return mixc(dur[i - 1][1], dur[i][1], (t - dur[i - 1][0]) / (dur[i][0] - dur[i - 1][0]));
    return dur[dur.length - 1][1];
  }
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  function fbm(n, x, y, okt) {
    let s = 0, a = 0.5, t = 0;
    for (let i = 0; i < okt; i++) { s += a * n(x, y); t += a; const nx = x * 1.6 - y * 1.2, ny = x * 1.2 + y * 1.6; x = nx + 17.3; y = ny + 9.1; a *= 0.5; }
    return s / t;
  }
  function kutuBulanik(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) {
      const o = y * w; let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { out[y * w + x] = acc * k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
    return out;
  }
  const nA = gurultu(11), nB = gurultu(12), nC = gurultu(13), nE = gurultu(14);

  // ------------------------------------------------------------ bölgeler
  const bh = SAHNE.bolgeHaritasi();
  const ADLAR = Object.keys(SAHNE.BOLGE);
  const BI = {}; ADLAR.forEach((a, i) => (BI[a] = i));
  const BOL = new Uint8Array(N);
  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {
      const key = (v[i * 4] << 16) | (v[i * 4 + 1] << 8) | v[i * 4 + 2];
      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const bolge = (x, y) => ADLAR[BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)]];
  // bitkisiz bölge haritası: yapı ve gök çiçeklerin altında da boyanır
  const bh2 = (() => { const c = SAHNE.yeniTuval(), x = c.getContext('2d', { willReadFrequently: true }); SAHNE.ciz(x, { bolge: true, cicek: false }); return x.getImageData(0, 0, W, W).data; })();
  const BOL2 = new Uint8Array(N);
  { const onb = new Map(); for (let i = 0; i < N; i++) { const key = (bh2[i * 4] << 16) | (bh2[i * 4 + 1] << 8) | bh2[i * 4 + 2]; let b = onb.get(key); if (b === undefined) { b = BI[SAHNE.bolgeAdi(bh2[i * 4], bh2[i * 4 + 1], bh2[i * 4 + 2])]; onb.set(key, b); } BOL2[i] = b; } }
  // kenar yumuşatmasından doğan yanlış sınıflı tek piksel şeritleri: 3×3 çoğunluk süzgeci
  function temizle(B) {
    const out = new Uint8Array(B), say = new Uint8Array(16);
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, b = B[i];
      if (B[i - 1] === b && B[i + 1] === b && B[i - W] === b && B[i + W] === b) continue;
      say.fill(0); let en = b, es = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const q = B[i + dy * W + dx]; const n = ++say[q]; if (n > es) { es = n; en = q; } }
      if (say[b] < 3) out[i] = en;
    }
    return out;
  }
  BOL.set(temizle(temizle(BOL))); BOL2.set(temizle(temizle(BOL2)));
  const bolge2 = (x, y) => ADLAR[BOL2[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)]];

  // maske: bölge kümesi, gürültülü genişletme/daraltma; değer 0..1 (1024 çözünürlük)
  function maske(adlar, gen, harita, kutu) {
    const B = harita || BOL2, set = new Uint8Array(16); adlar.forEach((a) => (set[BI[a]] = 1));
    const f = new Float32Array(N);
    for (let i = 0; i < N; i++) f[i] = set[B[i]];
    if (kutu) for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) if (x < kutu[0] || y < kutu[1] || x > kutu[2] || y > kutu[3]) f[y * W + x] = 0;
    if (!gen) return f;
    const r = Math.max(1, Math.round(Math.abs(gen))), b = kutuBulanik(f, W, W, r), out = new Float32Array(N);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, e = (gen > 0 ? 0.28 : 0.72) + (nE(x / 9, y / 9) - 0.5) * 0.3;
      out[i] = sstep(e - 0.06, e + 0.06, b[i]);
    }
    return out;
  }

  // ------------------------------------------------------------ ışık (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);
  for (let y = 300; y <= 555; y++) {
    let j = 0; while (j < prof.length - 2 && prof[j + 1].y > y) j++;
    const a = prof[j], b = prof[j + 1], t = (a.y - y) / (a.y - b.y || 1);
    kubbeR[y] = a.r + (b.r - a.r) * t;
  }
  for (let y = 301; y < 555; y++) kubbeDr[y] = (kubbeR[y + 1] - kubbeR[y - 1]) / 2;
  kubbeDr[300] = kubbeDr[301] * 1.3; kubbeDr[555] = kubbeDr[554];
  const kubbeU = (x, y) => clamp((x - 560) / Math.max(1, kubbeR[clamp(Math.round(y), 300, 555)]), -1, 1);
  function kubbeIsik(x, y) {
    const yi = clamp(Math.round(y), 300, 555), u = kubbeU(x, y), c = Math.sqrt(1 - u * u), dr = kubbeDr[yi];
    return Math.max(0, (u * LV[0] - dr * LV[1] + c * LV[2]) / Math.hypot(u, dr, c));
  }
  function silindirIsik(x, cx, yr) { const u = clamp((x - cx) / yr, -1, 1); return Math.max(0, u * LV[0] + Math.sqrt(1 - u * u) * LV[2]); }
  function minareYari(y) {
    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;
  }
  const poster = (l, n, x, y) => clamp(Math.round((l + (nA(x / 46, y / 46) - 0.5) * 0.16) * n) / n, 0, 1);

  // ------------------------------------------------------------ bulut haritası
  const BUL = (() => {
    const c = SAHNE.yeniTuval(), x = c.getContext('2d', { willReadFrequently: true }), rb = SAHNE.rng(3);
    x.filter = 'blur(7px)';
    for (const [bx, by, bs] of [[170, 250, 1.0], [500, 150, 0.8], [760, 330, 1.1], [940, 470, 0.7], [90, 470, 0.7]]) {
      for (let i = 0; i < 9; i++) {
        const px = bx + (rb() - 0.5) * 150 * bs, py = by + (rb() - 0.6) * 26 * bs, r = (20 + rb() * 22) * bs;
        x.fillStyle = '#fff'; x.beginPath(); x.ellipse(px, py, r * 1.25, r * 0.85, 0, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = '#fff'; x.beginPath(); x.ellipse(bx, by + 8 * bs, 92 * bs, 16 * bs, 0, 0, Math.PI * 2); x.fill();
    }
    x.filter = 'none';
    // düz alt kenar
    const d = x.getImageData(0, 0, W, W).data, out = new Float32Array(N);
    for (let i = 0; i < N; i++) out[i] = d[i * 4 + 3] / 255;
    return out;
  })();
  const bul = (x, y) => BUL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];

  // ------------------------------------------------------------ ressamın gördüğü: sadeleştirilmiş renk düzlemleri
  const KUBBE = [[0, [28, 86, 98]], [0.25, [30, 112, 90]], [0.5, [44, 146, 76]], [0.72, [102, 182, 70]], [0.88, [170, 212, 88]], [1, [232, 238, 158]]];
  const KASNAK = [[0, [22, 74, 80]], [0.4, [32, 108, 80]], [0.7, [60, 146, 74]], [1, [134, 196, 92]]];
  const TAS = [[0, [148, 146, 196]], [0.35, [196, 188, 212]], [0.6, [236, 222, 204]], [0.85, [252, 240, 214]], [1, [255, 250, 234]]];
  const ALTIN = [[0, [150, 96, 32]], [0.5, [222, 166, 52]], [0.85, [252, 216, 104]], [1, [255, 246, 196]]];
  function gokRenk(x, y) {
    const t = y / 800;
    let c = rampa([[0, [74, 146, 220]], [0.3, [104, 172, 230]], [0.62, [160, 204, 236]], [0.86, [222, 232, 232]], [1, [250, 232, 196]]], t + (nA(x / 220, y / 160) - 0.5) * 0.14);
    const d = Math.hypot(x - 880, y - 140);
    c = mixc(c, [255, 236, 176], 0.8 * Math.exp(-(d * d) / (2 * 165 * 165)));
    c = mixc(c, [255, 222, 140], 0.75 * sstep(110, 50, d));
    c = mixc(c, [255, 252, 236], sstep(44, 38, d));
    const b = bul(x, y);
    if (b > 0.3) {
      const lit = clamp((bul(x - 10, y + 12) - bul(x + 10, y - 12)) * 1.6 + 0.35 - (y - 0) * 0, 0, 1);
      const alt = sstep(-4, 14, y - (bulutAlt(x, y)));
      const bc = mixc(mixc([255, 252, 242], [188, 196, 228], alt * 0.9), [255, 244, 220], lit * 0.6);
      c = mixc(c, bc, sstep(0.3, 0.5, b));
    }
    return c;
  }
  // bulutun alt kenarına yakınlık (gölge tarafı)
  function bulutAlt(x, y) { let yy = y; while (yy < y + 40 && bul(x, yy) > 0.3) yy += 2; return yy - 24; }
  function yerRenk(x, y) {
    const ufuk = 812 + (fbm(nB, x / 80, 2, 3) - 0.5) * 30;
    if (y < ufuk) return rampa([[0, [236, 206, 140]], [1, [222, 184, 118]]], (y - 790) / 30);
    const t = fbm(nA, x / 60, y / 60, 3);
    return rampa([[0, [58, 126, 78]], [0.35, [92, 156, 70]], [0.65, [140, 190, 82]], [1, [196, 214, 112]]], clamp(t * 1.3 - 0.15 + 0.2 * sstep(900, 820, y), 0, 1));
  }
  // komşu renk: yalnız aynı bölgeden (pencere ya da gök çizgisi bulaşmasın)
  function komsu(x, y, dx, dy) { const b = bolge2(x, y), b2 = bolge2(x + dx, y + dy); return b === b2 ? hedef(x + dx, y + dy) : hedef(x, y); }
  const renkKubbe = (x, y) => { y = clamp(y, 300, 553); const l = kubbeIsik(x, y) + 0.08 * sstep(500, 555, y) * sstep(0.2, -0.6, kubbeU(x, y)); return rampa(KUBBE, poster(l, 5, x, y)); };
  const renkKasnak = (x, y) => {
    y = clamp(y, 556, 691); const ust = y < 610;
    let l = silindirIsik(x, 560, ust ? 208 : 226) * (ust ? 0.9 : 1);
    if (ust && y < 570) l *= 0.6;
    if (!ust && y < 620) l *= 0.7;
    return rampa(KASNAK, poster(l, 4, x, y));
  };
  const renkKaide = (x, y) => {
    y = clamp(y, 692, 800);
    let l = 0.62 + 0.3 * clamp((x - 300) / 520, 0, 1);
    if (y < 704) l = 1; else if (y < 716) l = 0.42;
    if (x < 340) l *= 0.75;
    return rampa(TAS, poster(l, 5, x, y));
  };
  const renkMinare = (x, y) => {
    let l = silindirIsik(x, 300, minareYari(y));
    if ((y > 468 && y < 488) || (y > 300 && y < 316) || (y > 198 && y < 206)) l *= 0.45;
    if (y > 692 && x > 290) l *= 0.7;
    return rampa(TAS, poster(l * 0.98, 4, x, y));
  };
  function hedef(x, y) {
    const b = bolge2(x, y);
    if (b === 'gok' || b === 'gunes') return gokRenk(x, y);
    if (b === 'zemin' || b === 'yaprak' || b === 'sap' || b === 'cicek' || b === 'cicekOrta') return y < 790 ? gokRenk(x, y) : yerRenk(x, y);
    if (b === 'kubbe') return renkKubbe(x, y);
    if (b === 'kasnak') return renkKasnak(x, y);
    if (b === 'kaide') return renkKaide(x, y);
    if (b === 'minare') return renkMinare(x, y);
    if (b === 'altin') { const cx = x > 430 ? 560 : 300; return rampa(ALTIN, clamp(0.5 + (x - cx) / 12, 0, 1)); }
    if (b === 'pencere') { const k = y > 555 && y < 692 && x > 330 && x < 790; return k ? [30, 66, 76] : [128, 92, 112]; }
    return [200, 200, 200];
  }

  // ------------------------------------------------------------ tuval: bez dokusu (yükseklik) + sıcak astar
  const RGB = new Float32Array(N2 * 3), HT = new Float32Array(N2), DOKU = new Float32Array(N2);
  {
    const p = 6.5;
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const tx = x / p + (nE(x / 90, y / 90) - 0.5) * 0.6, ty = y / p + (nE(x / 90 + 30, y / 90) - 0.5) * 0.6;
      const cx = Math.floor(tx), cy = Math.floor(ty), fx = tx - cx, fy = ty - cy;
      const hv = Math.sin(Math.PI * fx), hh = Math.sin(Math.PI * fy);
      const ust = (cx + cy) & 1;
      DOKU[y * W2 + x] = (ust ? hv * 0.75 + hh * 0.25 : hh * 0.75 + hv * 0.25) * (0.85 + 0.3 * nC(x / 5, y / 5));
    }
  }
  {
    // astar: ince, sürtülmüş sıcak sienna; üstüne inceltilmiş boyayla ön çizim
    const c = SAHNE.yeniTuval(W2, W2), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(S2, 0, 0, S2, 0, 0);
    x.fillStyle = '#e4a87c'; x.fillRect(0, 0, W, W);
    for (let i = 0; i < 160; i++) {
      const px = R() * W, py = R() * W, a = R() * Math.PI;
      x.strokeStyle = `rgba(${236 + R() * 18},${172 + R() * 30},${120 + R() * 30},0.22)`; x.lineWidth = 40 + R() * 70;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * 220, py + Math.sin(a) * 220); x.stroke();
    }
    x.strokeStyle = 'rgba(158,78,52,0.7)'; x.lineCap = 'round'; x.lineJoin = 'round';
    const cizgi = (pts, lw) => { x.lineWidth = lw; x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a + (R() - 0.5) * 2, b + (R() - 0.5) * 2) : x.moveTo(a, b))); x.stroke(); };
    cizgi(SAHNE.kubbeNoktalari(30), 2.2);
    for (const k of SAHNE.kaburgalar(8)) cizgi(k.noktalar.filter((_, i) => i % 4 === 0), 1.4);
    for (const [x1, y1, x2, y2] of [[352, 555, 768, 610], [334, 610, 786, 692], [290, 692, 830, 704], [300, 704, 820, 800], [266, 488, 334, 800], [273, 316, 327, 436], [281, 206, 319, 272], [246, 456, 354, 468], [255, 290, 345, 300]])
      cizgi([[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]], 1.8);
    for (const c2 of SAHNE.bitki.cicekler) { x.lineWidth = 1.6; x.beginPath(); x.arc(c2.x, c2.y, c2.r * 0.95, 0, 7); x.stroke(); }
    x.lineWidth = 1.6; x.beginPath(); x.arc(880, 140, 42, 0, 7); x.stroke();
    const d = x.getImageData(0, 0, W2, W2).data;
    for (let i = 0; i < N2; i++) { RGB[i * 3] = d[i * 4]; RGB[i * 3 + 1] = d[i * 4 + 1]; RGB[i * 3 + 2] = d[i * 4 + 2]; HT[i] = DOKU[i] * 0.22; }
  }

  // ------------------------------------------------------------ fırça darbesi (2048 çözünürlükte, piksel piksel)
  // o: x, y (1024), a (açı), L (boy), w (en), k (eğrilik), c / c2 (iki renk, fırçada yarı karışmış), karis,
  //    kuru (uçta kuruyup dağılma), kalin (boya kalınlığı), m (maske), prof ('duz' | 'yaprak' | 'oval' | 'sivri')
  function darbe(o) {
    const cx = o.x * S2, cy = o.y * S2, L = Math.max(2, o.L * S2), w = Math.max(1.6, o.w * S2);
    const ca = Math.cos(o.a), sa = Math.sin(o.a), k = (o.k || 0) * w;
    const ext = L / 2 + w * 0.75 + Math.abs(k);
    const x0 = Math.max(0, Math.floor(cx - ext)), x1 = Math.min(W2 - 1, Math.ceil(cx + ext));
    const y0 = Math.max(0, Math.floor(cy - ext)), y1 = Math.min(W2 - 1, Math.ceil(cy + ext));
    const ox = R() * 240, oy = R() * 240;
    const kuru = o.kuru || 0, kalin = o.kalin == null ? 0.5 : o.kalin, opak = o.opak == null ? 1 : o.opak;
    const c = o.c, c2 = o.c2 || o.c, karis = o.c2 ? (o.karis == null ? 0.5 : o.karis) : 0;
    const bf = 0.6 + w * 0.2, pr = o.prof || 'duz', yan = R() < 0.5 ? 1 : -1, m = o.m;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        const un = (dx * ca + dy * sa) / L + 0.5;
        if (un < -0.03 || un > 1.03) continue;
        const v = -dx * sa + dy * ca - k * (4 * (un - 0.5) * (un - 0.5) - 0.333);
        let pw;
        const uc = clamp(un, 0, 1);
        if (pr === 'duz') pw = uc < 0.07 ? 0.72 + 0.28 * Math.sqrt(uc / 0.07) : 1 - 0.22 * sstep(0.6, 1, uc);
        else if (pr === 'yaprak') pw = Math.pow(Math.sin(Math.PI * uc), 0.75);
        else if (pr === 'oval') pw = Math.pow(Math.sin(Math.PI * uc), 0.4);
        else if (pr === 'kemer') pw = uc < 0.66 ? 1 : Math.pow(Math.max(0, 1 - (uc - 0.66) / 0.34), 0.55);
        else pw = uc < 0.12 ? 0.55 + 0.45 * uc / 0.12 : 1 - 0.9 * sstep(0.25, 1, uc);
        const hw = w * 0.5 * Math.max(0.04, pw);
        const vn = v / hw;
        if (vn > 1.3 || vn < -1.3) continue;
        const mi = m ? m[(y >> 1) * W + (x >> 1)] : 1;

    const isikYon = (a) => Math.cos(a) * 0.74 - Math.sin(a) * 0.67;
    for (const yp of B.yapraklar) {
      const L = yp.uzunluk, cx = yp.x + Math.cos(yp.aci) * L * 0.5, cy = yp.y + Math.sin(yp.aci) * L * 0.5;
      const buyuk = L > 50, isik = isikYon(yp.aci - Math.PI / 2);
      const koyu = buyuk ? [40, 112, 84] : [64, 136, 72], acik = buyuk ? [116, 176, 76] : [150, 198, 84];
      darbe({ x: cx, y: cy, a: yp.aci, L: L * 1.02, w: L * yp.genislik * 0.95, c: oyna(isik > 0 ? acik : koyu, 0.1, 12), c2: isik > 0 ? koyu : acik, karis: 0.5, kalin: 0.55, kuru: 0.1, prof: 'yaprak' });
      if (R() < 0.5) darbe({ x: cx + Math.cos(yp.aci + 1.4) * L * 0.08, y: cy + Math.sin(yp.aci + 1.4) * L * 0.08, a: yp.aci, L: L * 0.55, w: L * 0.12, c: oyna([186, 220, 110], 0.08, 8), kalin: 0.8, prof: 'yaprak' });
    }
    for (const t of B.tomurcuklar) {
      darbe({ x: t.x + Math.cos(t.aci) * t.r * 0.3, y: t.y + Math.sin(t.aci) * t.r * 0.3, a: t.aci, L: t.r * 2.4, w: t.r * 1.5, c: oyna([236, 140, 166], 0.06, 6), c2: [252, 196, 210], karis: 0.5, kalin: 0.7, prof: 'oval' });
    }
    for (const c of B.cicekler) {
      const tac = SAHNE.tacYapraklari(c);
      // gölgeli taç yapraklar önce, ışıklılar sonra
      const sira = tac.map((e, i) => [e, isikYon(e.aci)]).sort((p, q) => p[1] - q[1]);
      for (const [e, iy] of sira) {
        const isikli = iy > -0.1;
        const kc = isikli ? [255, 252, 240] : [212, 208, 234];
        const ic = isikli ? [244, 214, 222] : [194, 180, 216];
        const cx = c.x + Math.cos(e.aci) * c.r * 0.55, cy = c.y + Math.sin(e.aci) * c.r * 0.55;
        darbe({ x: cx, y: cy, a: e.aci + Math.PI, L: c.r * 1.0, w: c.r * 0.78, k: (R() - 0.5) * 0.3, c: oyna(kc, 0.03, 4), c2: ic, karis: 0.35, kalin: 0.9, kuru: 0.15, prof: 'oval' });
        if (isikli && c.r > 30) darbe({ x: cx + Math.cos(e.aci) * c.r * 0.1, y: cy + Math.sin(e.aci) * c.r * 0.1, a: e.aci + Math.PI + (R() - 0.5) * 0.4, L: c.r * 0.55, w: c.r * 0.28, c: [255, 255, 250], kalin: 1, prof: 'oval' });
      }
      darbe({ x: c.x, y: c.y, a: R() * 3, L: c.r * 0.44, w: c.r * 0.4, c: [240, 186, 48], c2: [214, 128, 34], karis: 0.5, kalin: 1, prof: 'oval' });
      darbe({ x: c.x - c.r * 0.07, y: c.y + c.r * 0.07, a: R() * 3, L: c.r * 0.2, w: c.r * 0.16, c: [196, 112, 30], kalin: 1, prof: 'oval' });
      darbe({ x: c.x + c.r * 0.08, y: c.y - c.r * 0.08, a: R() * 3, L: c.r * 0.16, w: c.r * 0.12, c: [255, 232, 120], kalin: 1, prof: 'oval' });
    }
  }

  // ------------------------------------------------------------ 6. boya kabartısı: sağ üstten ışık, bez dokusu ince boyada görünür
  {
    const H = kutuBulanik(HT, W2, W2, 1);
    const img = ctx.createImageData(W2, W2), d = img.data;
    const K = 4.2;
    for (let y = 0; y < W2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x;
      const hx = (H[y * W2 + Math.min(W2 - 1, x + 1)] - H[y * W2 + Math.max(0, x - 1)]) * K;
      const hy = (H[Math.min(W2 - 1, y + 1) * W2 + x] - H[Math.max(0, y - 1) * W2 + x]) * K;
      const nl = Math.hypot(hx, hy, 1);
      const dif = (-hx * LV[0] - hy * LV[1] + LV[2]) / nl;
      const g = dif - LV[2];
      const spec = Math.pow(Math.max(0, dif), 24) * 0.12 * H[i];
      const f = 1 + g * 0.55;
      const j = i * 3;
      d[i * 4] = clamp(RGB[j] * f + spec * 255, 0, 255);
      d[i * 4 + 1] = clamp(RGB[j + 1] * f + spec * 255, 0, 255);
      d[i * 4 + 2] = clamp(RGB[j + 2] * f + spec * 240, 0, 255);
      d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  SAHNE.hazir();
})();
