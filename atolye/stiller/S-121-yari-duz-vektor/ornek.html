<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-121 Yarı Düz Vektör — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #BFE0F0; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-121 Yarı Düz Vektör (Semi-Flat Vector) — düz vektör biçimler, kontur yok; her biçimin içinde
  // yumuşak degrade gölgelendirme, temas noktalarında hafif ortam kapanması (AO), ışık yanında ince
  // parlaklık. Kenarlar keskin, ton aralığı dar: düz ile üç boyut arası, çağdaş editoryal illüstrasyon.
  const S = SAHNE;
  const OL = 2; // iç çözünürlük 2048
  const ctx = S.tuval(document.getElementById('tuval'), OL);
  const rnd = S.rng(121);

  // ---------------------------------------------------------------- palet
  const P = {
    gokUst: '#7FBFE6', gokOrta: '#B5DBEF', gokAlt: '#F3F0E2',
    gunes: '#FFF3CC', gunesG: '#FBE3A6',
    bulut: '#FFFFFF', bulutG: '#D3E4EF',
    tas: '#FBF4E8', tasA: '#FFFDF8', tasG: '#E7D7C0', tasD: '#CFBB9C',
    yesil: '#22895C', yesilA: '#3DAA75', yesilG: '#17694A', yesilD: '#0E4A33',
    altin: '#E8AC3C', altinA: '#FFE18C', altinG: '#B57A20',
    yaprak: '#62B06C', yaprakG: '#3E8E58', yaprakT: '#2B7C5B', yaprakTA: '#45A076',
    sap: '#4C8F5B',
    cicek: '#FFFFFF', cicekG: '#E3DFEA', allik: '#F4C4BC',
    orta: '#F3BF45', ortaG: '#CF8A27',
    mercan: '#F09884', mercanG: '#D6735F',
    zemin: '#EFDAB6', zeminG: '#E2C79C',
    tepe1: '#B9DBA6', tepe1G: '#9FCB90', tepe2: '#93C688', tepe2G: '#78B272',
  };

  // ---------------------------------------------------------------- yardımcılar
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  function lin(x1, y1, x2, y2, duraklar, c) {
    const g = (c || ctx).createLinearGradient(x1, y1, x2, y2);
    for (const [t, renk] of duraklar) g.addColorStop(Math.max(0, Math.min(1, t)), renk);
    return g;
  }
  function rad(x0, y0, r0, x1, y1, r1, duraklar, c) {
    const g = (c || ctx).createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const [t, renk] of duraklar) g.addColorStop(t, renk);
    return g;
  }
  function dol(d, stil, c) {
    c = c || ctx;
    c.fillStyle = stil;
    c.fill(P2(d));
  }
  function kirp(d, fn, c) {
    c = c || ctx;
    c.save();
    c.clip(P2(d));
    fn();
    c.restore();
  }
  /** Yumuşak (bulanık) çizim: blur 1024 koordinatında piksel. */
  function yumusak(b, fn, c) {
    c = c || ctx;
    c.save();
    c.filter = `blur(${b * OL}px)`;
    fn();
    c.restore();
  }
  /** Gölge (drop shadow) ayarı: AO / temas gölgesi. ofset ve bulanıklık 1024 koordinatında. */
  function golgeAyar(renk, b, dx, dy, c) {
    c = c || ctx;
    c.shadowColor = renk;
    c.shadowBlur = b * OL;
    c.shadowOffsetX = dx * OL;
    c.shadowOffsetY = dy * OL;
  }
  function golgeYok(c) {
    c = c || ctx;
    c.shadowColor = 'rgba(0,0,0,0)';
    c.shadowBlur = 0;
    c.shadowOffsetX = 0;
    c.shadowOffsetY = 0;
  }
  // kubbe yarıçapı r(y)
  const prof = S.kubbeProfili(400);
  function rAt(y) {
    for (let i = 0; i < prof.length - 1; i++) {
      const a = prof[i], b = prof[i + 1];
      if (y <= a.y && y >= b.y) return a.r + (b.r - a.r) * ((a.y - y) / (a.y - b.y || 1));
    }
    return y > 555 ? 200 : 0;
  }
  /** Silindir degradesi: sol gölge, sağda ışık; t = 0..1 soldan sağa. */
  function silindir(x1, x2, renkler) {
    return lin(x1, 0, x2, 0, renkler);
  }
  const TAS_SIL = [[0, '#D3BEA3'], [0.16, '#E4D3BD'], [0.45, '#F3E9DA'], [0.7, '#FFFBF2'], [0.84, '#FFFEFA'], [1, '#EBDDC9']];
  const TAS_ALT = [[0, '#BFA787'], [0.45, '#D8C6AD'], [0.75, '#E9DCC8'], [1, '#D5C2A8']];
  const YESIL_SIL = [[0, '#155F42'], [0.18, '#1A7452'], [0.46, '#238B5E'], [0.7, '#33A06C'], [0.84, '#3EAB76'], [1, '#2A8B60']];

  // ================================================================ GÖK
  dol(dik(0, 0, 1024, 1024), lin(0, 0, 0, 800, [[0, P.gokUst], [0.55, P.gokOrta], [1, P.gokAlt]]));
  // güneş halesi ve diski
  dol(dik(0, 0, 1024, 1024), rad(880, 140, 20, 880, 140, 330, [[0, 'rgba(255,248,222,0.85)'], [0.3, 'rgba(255,246,214,0.38)'], [1, 'rgba(255,246,214,0)']]));
  dol(S.daireYolu(880, 140, 104), 'rgba(255,250,232,0.35)');
  dol(S.daireYolu(880, 140, 60), rad(898, 122, 4, 880, 140, 62, [[0, '#FFFBE6'], [0.6, P.gunes], [1, P.gunesG]]));

  function bulut(x, y, s) {
    // birleşik bulut yolu: bütün parçalar aynı yönde (saat yönü) → sıfırdan farklı dolguda boşluk yok
    const h = 30 * s;
    const birlesik = new Path2D();
    for (const [cx, cy, rr] of [[x - 48 * s, y - 13 * s, 25 * s], [x - 6 * s, y - 31 * s, 39 * s], [x + 40 * s, y - 18 * s, 29 * s]]) {
      birlesik.moveTo(cx + rr, cy);
      birlesik.arc(cx, cy, rr, 0, Math.PI * 2);
    }
    birlesik.roundRect(x - 74 * s - h / 2, y - h, 148 * s + h, h, h / 2);
    ctx.save();
    golgeAyar('rgba(110,150,185,0.16)', 12 * s, -3 * s, 5 * s);
    dol(birlesik, P.bulut);
    ctx.restore();
    kirp(birlesik, () => {
      // alt-solda yumuşak tek gölge alanı, ışık yanında ince parlaklık
      dol(dik(x - 130 * s, y - 90 * s, x + 130 * s, y + 10), lin(x + 30 * s, y - 60 * s, x - 30 * s, y + 4 * s, [[0, 'rgba(211,228,239,0)'], [0.55, 'rgba(211,228,239,0.25)'], [1, 'rgba(200,220,236,0.95)']]));
      yumusak(5 * s, () => {
        ctx.globalAlpha = 0.7;
        dol(S.daireYolu(x + 2 * s, y - 40 * s, 26 * s), '#FFFFFF');
      });
    });
  }
  bulut(176, 262, 1.12);
  bulut(474, 152, 0.72);
  bulut(818, 374, 0.95);
  bulut(70, 470, 0.5);

  // ================================================================ YER
  dol(dik(0, 800, 1024, 1024), lin(0, 800, 0, 1024, [[0, P.zemin], [1, P.zeminG]]));
  // yapının yere temas gölgesi (AO) ve sola düşen yumuşak gölge
  yumusak(9, () => {
    ctx.globalAlpha = 0.55;
    dol(`M296,798 L824,798 L812,812 L230,824 Z`, 'rgba(170,135,90,0.55)');
  });

  // ================================================================ MİNARE
  const minare = S.minareParcalari();
  const mx = S.minare.cx;
  const minareBirlesik = new Path2D();
  function parcaYolu(p) {
    if (p.tip === 'poligon') return S.yol(p.noktalar, true);
    if (p.tip === 'topuz') return p.yol;
    return dik(p.x1, p.y1, p.x2, p.y2);
  }
  function xAralik(p) {
    if (p.tip === 'poligon') {
      const xs = p.noktalar.map((q) => q[0]);
      return [Math.min(...xs), Math.max(...xs)];
    }
    if (p.tip === 'topuz') return [mx - 30, mx + 30];
    return [p.x1, p.x2];
  }
  for (const p of minare) {
    if (p.tip === 'alem' || p.tip === 'bant') continue;
    const d = parcaYolu(p);
    minareBirlesik.addPath(new Path2D(d));
    const [a, b] = xAralik(p);
    if (p.ad.startsWith('çıkma')) {
      dol(d, silindir(a, b, TAS_ALT));
    } else if (p.tip === 'korkuluk') {
      // korkuluk: arkada gölgede gövde, önde ışık alan dikmeler ve küpeşte
      dol(d, silindir(a, b, [[0, '#C9B395'], [0.5, '#DCCBB2'], [0.8, '#E6D7C2'], [1, '#D2BEA2']]));
      const adet = 9;
      const bw = 4.6;
      for (let i = 0; i <= adet; i++) {
        const x = p.x1 + bw / 2 + ((p.x2 - p.x1 - bw) * i) / adet;
        const t = (x - p.x1) / (p.x2 - p.x1);
        dol(dik(x - bw / 2, p.y1 + 4, x + bw / 2, p.y2), lin(x - bw / 2, 0, x + bw / 2, 0, [[0, t < 0.35 ? '#E2D2BC' : '#EFE4D4'], [0.7, '#FFFCF6'], [1, '#F2E8DA']]));
      }
      dol(dik(p.x1, p.y1, p.x2, p.y1 + 4.5), silindir(a, b, TAS_SIL));
      // küpeştenin altında yumuşak gölge
      kirp(d, () => dol(dik(p.x1, p.y1 + 4.5, p.x2, p.y1 + 9), lin(0, p.y1 + 4.5, 0, p.y1 + 9, [[0, 'rgba(120,90,55,0.28)'], [1, 'rgba(120,90,55,0)']])));
    } else if (p.tip === 'topuz') {
      dol(d, rad(mx + 9, 166, 2, mx + 2, 176, 34, [[0, '#FFFEFA'], [0.45, '#F6EDE0'], [0.85, '#DCC9AE'], [1, '#CDB797']]));
    } else {
      dol(d, silindir(a, b, TAS_SIL));
      if (p.ad.startsWith('şerefe')) {
        const ys = p.noktalar.map((q) => q[1]);
        const y2 = Math.max(...ys);
        dol(dik(a, y2 - 2.5, b, y2), 'rgba(150,120,85,0.35)');
        dol(dik(a, Math.min(...ys), b, Math.min(...ys) + 1.5), 'rgba(255,255,255,0.55)');
      }
      if (p.ad === 'bilezik') dol(dik(a, 204, b, 206), 'rgba(150,120,85,0.35)');
    }
  }
  // gövdelerde çıkma / bilezik altı ortam kapanması
  for (const [x1, x2, y] of [[mx - 34, mx + 34, 488], [mx - 27, mx + 27, 316], [mx - 19, mx + 19, 206], [mx - 27, mx + 27, 436], [mx - 19, mx + 19, 272]]) {
    const h = y === 436 || y === 272 ? -9 : 16; // korkuluk dibinde yukarı doğru hafif gölge
    dol(dik(x1, Math.min(y, y + h), x2, Math.max(y, y + h)), lin(0, y, 0, y + h, [[0, 'rgba(110,82,50,0.30)'], [1, 'rgba(110,82,50,0)']]));
  }
  // zikzak bant: oyma çizgi (koyu çizgi + altında ince ışık)
  {
    const b = minare.find((p) => p.tip === 'bant');
    kirp(dik(b.x1, b.y1 - 2, b.x2, b.y2 + 2), () => {
      ctx.lineJoin = 'miter';
      for (const z of S.zikzakCizgileri()) {
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.stroke(P2(S.yol(z.map(([x, y]) => [x + 0.8, y + 3.4]))));
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = lin(b.x1, 0, b.x2, 0, [[0, 'rgba(120,88,52,0.62)'], [0.7, 'rgba(150,115,75,0.42)'], [1, 'rgba(130,98,60,0.55)']]);
        ctx.stroke(P2(S.yol(z.map(([x, y]) => [x, y + 2]))));
      }
      dol(dik(b.x1, b.y1 - 2, b.x2, b.y1 + 0.5), 'rgba(140,105,65,0.35)');
      dol(dik(b.x1, b.y2 - 0.5, b.x2, b.y2 + 2), 'rgba(140,105,65,0.35)');
    });
  }
  for (const p of S.minarePencereleri) pencere(p.x, p.y, p.w, p.h, 'tas');
  // binanın minareye düşen yumuşak gölgesi
  kirp(minareBirlesik, () => {
    yumusak(10, () => {
      ctx.globalAlpha = 0.3;
      ctx.translate(-16, 12);
      dol(`M352,555 L352,610 L334,610 L334,692 L300,692 L300,800 L760,800 L760,400 Z`, '#7A6244');
    });
  });
  alem(minare.find((p) => p.tip === 'alem').alem);

  // ================================================================ KAİDE
  const K = S.kaide;
  dol(dik(K.x1, K.y1, K.x2, K.y2), lin(K.x1, 0, K.x2, 0, [[0, '#E8D9C3'], [0.12, '#F3E8D8'], [0.55, '#FBF4E9'], [1, '#FFFCF4']]));
  // dikmeler (pilastr): hafif kabarık, sol yanında yumuşak gölge
  for (const x of [365, 495, 625, 755]) {
    ctx.save();
    golgeAyar('rgba(120,95,60,0.22)', 5, -2.5, 0);
    dol(dik(x - 7, K.y1, x + 7, K.y2 - 12), lin(x - 7, 0, x + 7, 0, [[0, '#F4EADB'], [0.6, '#FFFCF5'], [1, '#FFFEFA']]));
    ctx.restore();
  }
  // kaidenin sol ucu: gölgede kalan dar yüz
  dol(dik(K.x1, K.y1, K.x1 + 14, K.y2), lin(K.x1, 0, K.x1 + 14, 0, [[0, '#D9C6AA'], [1, '#E7D8C2']]));
  // korniş altı ortam kapanması
  dol(dik(K.x1, K.y1, K.x2, K.y1 + 20), lin(0, K.y1, 0, K.y1 + 20, [[0, 'rgba(120,88,52,0.30)'], [1, 'rgba(120,88,52,0)']]));
  // süpürgelik
  dol(dik(K.x1, K.y2 - 13, K.x2, K.y2), lin(K.x1, 0, K.x2, 0, [[0, '#DCC9AE'], [0.5, '#EBDDC9'], [1, '#F3E9DA']]));
  dol(dik(K.x1, K.y2 - 13, K.x2, K.y2 - 11.5), 'rgba(255,255,255,0.6)');
  for (const p of K.pencereler) {
    // pencere çerçevesi (silme) ve denizlik
    ctx.save();
    golgeAyar('rgba(120,95,60,0.25)', 6, -2.5, 2.5);
    dol(S.kemerYolu(p.x, p.y - 6, p.w + 14, p.h + 9), lin(p.x - p.w, 0, p.x + p.w, 0, [[0, '#F1E5D3'], [0.65, '#FFFCF5'], [1, '#FFFEFB']]));
    ctx.restore();
    pencere(p.x, p.y, p.w, p.h, 'tas');
    ctx.save();
    golgeAyar('rgba(110,85,55,0.3)', 4, -1.5, 2.5);
    dol(dik(p.x - p.w / 2 - 6, p.y + p.h, p.x + p.w / 2 + 6, p.y + p.h + 4), lin(p.x - p.w, 0, p.x + p.w, 0, [[0, '#EBDDC9'], [1, '#FFFCF5']]));
    ctx.restore();
  }
  // korniş
  ctx.save();
  golgeAyar('rgba(110,80,45,0.32)', 7, -2, 4);
  dol(dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), lin(K.kornis.x1, 0, K.kornis.x2, 0, [[0, '#EADCC7'], [0.15, '#F8F0E4'], [1, '#FFFEF9']]));
  ctx.restore();
  dol(dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y1 + 2.5), 'rgba(255,255,255,0.8)');
  dol(dik(K.kornis.x1, K.kornis.y2 - 2.5, K.kornis.x2, K.kornis.y2), 'rgba(170,140,100,0.35)');

  // ================================================================ KASNAK
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const d = dik(q.x1, q.y1, q.x2, q.y2);
    ctx.save();
    if (k === 1) golgeAyar('rgba(60,50,30,0.25)', 6, -2, 3);
    dol(d, silindir(q.x1, q.x2, YESIL_SIL));
    ctx.restore();
    kirp(d, () => {
      // üstte ince ışık, altta silme ve ortam kapanması
      dol(dik(q.x1, q.y1, q.x2, q.y1 + 2.5), 'rgba(210,255,225,0.28)');
      dol(dik(q.x1, q.y1 + 2.5, q.x2, q.y1 + 14), lin(0, q.y1 + 2.5, 0, q.y1 + 14, [[0, 'rgba(5,40,25,0.28)'], [1, 'rgba(5,40,25,0)']]));
      dol(dik(q.x1, q.y2 - 7, q.x2, q.y2), silindir(q.x1, q.x2, [[0, '#0E4532'], [0.5, '#135B40'], [0.8, '#1C7050'], [1, '#125639']]));
      dol(dik(q.x1, q.y2 - 7, q.x2, q.y2 - 5.8), 'rgba(200,255,220,0.25)');
    });
    for (const p of S.kasnakPencereleri(k)) pencere(p.x, p.y, p.w, p.h, 'yesil', p.aci);
  }

  // ================================================================ KUBBE
  // satır satır silindirik degrade: her yükseklikte o satırın yarıçapına göre (u = sin boylam)
  const KUBBE_DURAK = [[0, '#14603F'], [0.22, '#1A714E'], [0.45, '#22895C'], [0.66, '#309D69'], [0.8, '#40AE78'], [0.92, '#3AA672'], [1, '#2D9565']];
  kirp(S.kubbeYolu, () => {
    for (let y = 299; y <= 556; y += 1) {
      const rr = Math.max(1, rAt(y + 0.5));
      ctx.fillStyle = lin(560 - rr, 0, 560 + rr, 0, KUBBE_DURAK);
      ctx.fillRect(560 - rr - 2, y, rr * 2 + 4, 1.2);
    }
    // tepede ışık, tabanda kasnakla birleşimde ortam kapanması
    dol(dik(340, 296, 780, 430), lin(0, 296, 0, 430, [[0, 'rgba(235,255,225,0.16)'], [1, 'rgba(235,255,225,0)']]));
    dol(dik(340, 480, 780, 556), lin(0, 480, 0, 556, [[0, 'rgba(6,40,26,0)'], [1, 'rgba(6,40,26,0.34)']]));
    // yumuşak geniş parlaklık
    yumusak(20, () => {
      ctx.translate(652, 398);
      ctx.rotate(-0.32);
      ctx.globalAlpha = 0.24;
      dol(S.elipsYolu({ cx: 0, cy: 0, rx: 46, ry: 98, aci: 0 }), '#D8FFE0');
    });
    // kaburgalar: ince koyu yiv + sağında ince ışık
    for (const kb of S.kaburgalar(16, 120)) {
      const pts = kb.noktalar.filter((q) => q[1] > 304);
      const isik = kb.u > -0.45;
      ctx.lineCap = 'round';
      ctx.lineWidth = 1.3;
      ctx.strokeStyle = isik ? 'rgba(205,255,220,0.30)' : 'rgba(170,240,190,0.14)';
      ctx.stroke(P2(S.yol(pts.map(([x, y]) => [x + 1.7, y]))));
      ctx.lineWidth = 1.9;
      ctx.strokeStyle = isik ? 'rgba(8,60,38,0.34)' : 'rgba(4,40,25,0.4)';
      ctx.stroke(P2(S.yol(pts)));
    }
  });
  alem(S.alemParcalari(560, 300, 1));

  // ================================================================ ortak parçalar
  function pencere(x, y, w, h, zemin, aci) {
    const d = S.kemerYolu(x, y, w, h);
    const ust = zemin === 'yesil' ? '#0A3524' : '#123F2D';
    const alt = zemin === 'yesil' ? '#175A40' : '#245F46';
    dol(d, lin(0, y, 0, y + h, [[0, ust], [1, alt]]));
    kirp(d, () => {
      // pencere içinde sol söve ışık alır (ışık sağdan), üstte yumuşak gölge
      const sw = Math.max(1.2, w * 0.24);
      dol(dik(x - w / 2 - 1, y, x - w / 2 + sw, y + h + 1), zemin === 'yesil' ? 'rgba(90,190,135,0.38)' : 'rgba(150,200,170,0.32)');
      dol(dik(x - w / 2, y + h - Math.min(4, h * 0.1), x + w / 2, y + h), 'rgba(160,220,185,0.22)');
    });
  }

  function alem(a) {
    const s = a.yaka.rx / 20;
    const altinYatay = (x1, x2) => lin(x1, 0, x2, 0, [[0, P.altinG], [0.45, P.altin], [0.72, P.altinA], [1, '#E3A03A']]);
    dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), altinYatay(a.cubuk.x1, a.cubuk.x2));
    for (const k of a.kureler) {
      ctx.save();
      golgeAyar('rgba(120,80,20,0.25)', 3 * s, -1 * s, 1.5 * s);
      dol(S.daireYolu(k.cx, k.cy, k.r), rad(k.cx + k.r * 0.35, k.cy - k.r * 0.35, k.r * 0.05, k.cx, k.cy, k.r * 1.05, [[0, '#FFF2C2'], [0.35, P.altinA], [0.7, P.altin], [1, P.altinG]]));
      ctx.restore();
    }
    const yaka = S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 });
    ctx.save();
    golgeAyar('rgba(60,50,20,0.25)', 4 * s, -1.5 * s, 2.5 * s);
    dol(yaka, altinYatay(a.yaka.cx - a.yaka.rx, a.yaka.cx + a.yaka.rx));
    ctx.restore();
    kirp(yaka, () => dol(dik(a.yaka.cx - a.yaka.rx, a.yaka.cy - a.yaka.ry, a.yaka.cx + a.yaka.rx, a.yaka.cy - a.yaka.ry * 0.3), 'rgba(255,240,190,0.45)'));
    const h = S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R);
    dol(h, lin(a.hilal.cx - a.hilal.R, a.hilal.cy + a.hilal.R, a.hilal.cx + a.hilal.R, a.hilal.cy - a.hilal.R, [[0, P.altinG], [0.5, P.altin], [0.8, P.altinA], [1, '#FFEFB8']]));
  }

  // ================================================================ BİTKİLER
  const B = S.bitki;
  const L = [0.7071, -0.7071]; // ışık yönü (sağ üst)

  // önde alçak, yumuşak iki çayır tümseği (çiçek tarhının zemini)
  function tumsek(y0, gen, dalga, faz, renk, renkG) {
    let d = `M-10,1030 L-10,${y0}`;
    for (let x = -10; x <= 1034; x += 8) d += ` L${x},${(y0 + dalga * Math.sin(x / gen + faz) + dalga * 0.45 * Math.sin(x / (gen * 0.47) + faz * 1.7)).toFixed(2)}`;
    d += ' L1034,1030 Z';
    ctx.save();
    golgeAyar('rgba(80,110,60,0.22)', 10, -3, -2);
    dol(d, lin(0, y0 - dalga * 1.5, 0, 1024, [[0, renk], [1, renkG]]));
    ctx.restore();
    kirp(d, () => {
      // üst kenarda ince, yumuşak ışık
      yumusak(4, () => {
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(245,255,225,0.45)';
        ctx.stroke(P2(d));
      });
    });
  }
  tumsek(892, 70, 16, 0.6, P.tepe1, P.tepe1G);
  tumsek(958, 92, 18, 2.4, P.tepe2, P.tepe2G);

  // öndeki tomurcukların sapları
  ctx.lineCap = 'round';
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8, y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    ctx.lineWidth = 4;
    ctx.strokeStyle = P.sap;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(t.x, t.y + 80, bx, t.y + 190);
    ctx.stroke();
  }
  for (const s of B.saplar) {
    ctx.save();
    golgeAyar('rgba(40,70,40,0.18)', 4, -2, 2);
    ctx.lineWidth = 4.6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = P.sap;
    ctx.stroke(P2(S.yol(s)));
    ctx.restore();
  }

  function yaprak(y, koyu) {
    const A = koyu ? P.yaprakTA : P.yaprak;
    const G = koyu ? P.yaprakT : P.yaprakG;
    const Lu = y.uzunluk, W = Lu * y.genislik;
    const ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const p = (u, v) => [y.x + u * ca - v * sa, y.y + u * sa + v * ca];
    const d = S.yaprakYolu(y);
    const uc = p(Lu, 0);
    ctx.save();
    golgeAyar('rgba(30,70,45,0.22)', 6, -2, 3);
    dol(d, lin(y.x, y.y, uc[0], uc[1], [[0, G], [0.55, A], [1, A]]));
    ctx.restore();
    // ışıktan uzak yarı: yumuşak gölge
    const pozAcik = -sa * L[0] + ca * L[1] > 0; // v>0 yanı ışığa bakıyor mu
    const sgn = pozAcik ? -1 : 1;
    const q = (pt) => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`;
    const yari = `M${q(p(0, 0))} C${q(p(Lu * 0.35, sgn * W * 0.75))} ${q(p(Lu * 0.8, sgn * W * 0.45))} ${q(p(Lu, 0))} Z`;
    kirp(d, () => {
      yumusak(Math.max(1.2, W * 0.08), () => dol(yari, koyu ? 'rgba(10,60,40,0.30)' : 'rgba(20,80,40,0.26)'));
      // ışık yanında ince parlaklık
      const isik = `M${q(p(Lu * 0.1, -sgn * W * 0.12))} C${q(p(Lu * 0.35, -sgn * W * 0.5))} ${q(p(Lu * 0.75, -sgn * W * 0.32))} ${q(p(Lu * 0.95, -sgn * W * 0.02))}`;
      yumusak(Math.max(1, W * 0.06), () => {
        ctx.lineWidth = Math.max(1.2, W * 0.12);
        ctx.strokeStyle = 'rgba(235,255,215,0.35)';
        ctx.stroke(P2(isik));
      });
      const [m0, m1] = S.yaprakDamari(y);
      ctx.lineWidth = Math.max(0.9, W * 0.045);
      ctx.strokeStyle = 'rgba(225,250,210,0.55)';
      ctx.beginPath();
      ctx.moveTo(m0[0], m0[1]);
      ctx.lineTo(m1[0], m1[1]);
      ctx.stroke();
    });
  }
  const merkez = (y) => [y.x + Math.cos(y.aci) * y.uzunluk * 0.5, y.y + Math.sin(y.aci) * y.uzunluk * 0.5];
  const secili = [];
  B.yapraklar.forEach((y, i) => {
    if (i < 36) return yaprak(y, false);
    const [cx, cy] = merkez(y);
    if (secili.some(([x, yy]) => Math.hypot(x - cx, yy - cy) < 52)) return;
    secili.push([cx, cy]);
    yaprak({ ...y, uzunluk: y.uzunluk * 1.1 }, secili.length % 3 === 0);
  });

  function tomurcuk(t) {
    const d = S.tomurcukYolu(t);
    ctx.save();
    golgeAyar('rgba(120,60,50,0.22)', 3, -1, 2);
    dol(d, P.mercanG);
    ctx.restore();
    kirp(d, () => {
      yumusak(t.r * 0.25, () => {
        ctx.save();
        ctx.translate(t.r * 0.25, -t.r * 0.3);
        dol(d, P.mercan);
        ctx.restore();
      });
      yumusak(t.r * 0.15, () => dol(S.daireYolu(t.x + t.r * 0.35, t.y - t.r * 0.45, t.r * 0.35), 'rgba(255,235,225,0.6)'));
    });
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const q = (pt) => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`;
    dol(`M${q(p(-t.r * 1.0, 0))} Q${q(p(-t.r * 0.2, -t.r * 1.1))} ${q(p(t.r * 0.3, -t.r * 0.55))} Q${q(p(-t.r * 0.1, 0))} ${q(p(t.r * 0.3, t.r * 0.55))} Q${q(p(-t.r * 0.2, t.r * 1.1))} ${q(p(-t.r * 1.0, 0))} Z`,
      lin(p(-t.r, 0)[0], p(-t.r, 0)[1], p(t.r * 0.3, 0)[0], p(t.r * 0.3, 0)[1], [[0, P.yaprakG], [1, P.yaprak]]));
  }
  for (const t of B.tomurcuklar) tomurcuk(t);

  function cicek(c) {
    const tac = S.tacYapraklari(c).map((e) => ({ ...e, cx: c.x + Math.cos(e.aci) * c.r * 0.56, cy: c.y + Math.sin(e.aci) * c.r * 0.56, rx: c.r * 0.5, ry: c.r * 0.42 }));
    tac.sort((m, n) => (Math.cos(m.aci) * L[0] + Math.sin(m.aci) * L[1]) - (Math.cos(n.aci) * L[0] + Math.sin(n.aci) * L[1]));
    const k = c.r * 0.13;
    for (const e of tac) {
      const d = S.elipsYolu(e);
      ctx.save();
      golgeAyar('rgba(90,70,90,0.20)', c.r * 0.09, -c.r * 0.04, c.r * 0.06);
      dol(d, P.cicek);
      ctx.restore();
      kirp(d, () => {
        // yarı düz gölge: ışıktan uzak yanda yumuşak degrade, ışık yanı düz beyaz
        const gx = e.cx - L[0] * e.rx, gy = e.cy - L[1] * e.rx;
        const ix = e.cx + L[0] * e.rx * 0.6, iy = e.cy + L[1] * e.rx * 0.6;
        dol(d, lin(gx, gy, ix, iy, [[0, 'rgba(196,190,214,0.95)'], [0.4, 'rgba(214,209,228,0.45)'], [1, 'rgba(255,255,255,0)']]));
        // taç yaprak dibinde allık
        dol(S.daireYolu(c.x, c.y, c.r * 1.1), rad(c.x, c.y, c.r * 0.12, c.x, c.y, c.r * 0.7, [[0, 'rgba(240,165,160,0.8)'], [0.5, 'rgba(244,196,188,0.28)'], [1, 'rgba(244,196,188,0)']]));
      });
    }
    // göbek
    const g = S.daireYolu(c.x, c.y, c.r * 0.22);
    ctx.save();
    golgeAyar('rgba(120,70,30,0.3)', c.r * 0.06, -c.r * 0.02, c.r * 0.035);
    dol(g, rad(c.x + c.r * 0.07, c.y - c.r * 0.07, c.r * 0.01, c.x, c.y, c.r * 0.24, [[0, '#FFE58E'], [0.55, P.orta], [1, P.ortaG]]));
    ctx.restore();
    ctx.fillStyle = 'rgba(190,120,35,0.75)';
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + c.aci;
      ctx.beginPath();
      ctx.arc(c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3, Math.max(0.9, c.r * 0.028), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (const c of B.cicekler) cicek(c);

  // ================================================================ titreşim (bant önleme): ±1 düzeyli görünmez gürültü
  {
    const W = 1024 * OL;
    const id = ctx.getImageData(0, 0, W, W);
    const v = id.data;
    for (let i = 0; i < v.length; i += 4) {
      const n = (rnd() - 0.5) * 2.2;
      v[i] += n;
      v[i + 1] += n;
      v[i + 2] += n;
    }
    ctx.putImageData(id, 0, 0);
  }
  S.hazir();
</script>
