<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-121 Yarı Düz Vektör — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #B8DCF4; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
  // S-121 Yarı Düz Vektör (Semi-Flat Vector) — her biçim TEK DÜZ renkle dolu, kontur yok; hacim yalnızca
  // yumuşak ortam kapanmasıyla (AO) gelir: biçimin ışıktan uzak kenarında ve başka bir biçime değdiği
  // yerde bulanık bir koyulaşma, ışık yanında ince bir kenar ışığı, nesnelerin altında yumuşak "yükselti"
  // gölgesi. Gök, yer, kubbe ve taş düz kalır; düz illüstrasyon ile üç boyut arası, çağdaş editoryal dil.
  const S = SAHNE;
  const OL = 2; // iç çözünürlük 2048
  const ctx = S.tuval(document.getElementById('tuval'), OL);
  const rnd = S.rng(121);

  // ---------------------------------------------------------------- düz palet
  const P = {
    gok: '#B8DCF4', gunes: '#FFF7CF',
    bulut: '#FFFFFF', bulutAO: '#D9E7F2',
    tas: '#FCFAF4', tasAO: '#D5D3CF', tasAlt: '#ECE8E0', tasAltAO: '#C9C6C2',
    yesil: '#2EA26C', yesilAO: '#167A4E', kasnak: '#25945F', kasnakAO: '#11683F', silme: '#1D8253',
    pencere: '#0F4A33', pencereAO: '#072C1E',
    altin: '#EDB140', altinAO: '#C3832A', altinIsik: '#FFDA7A',
    zemin: '#BEDFA2',
    yaprak: '#5DB16C', yaprak2: '#3E9663', yaprakAO: '#2A6E47', sap: '#4C9A5E',
    cicek: '#FFFFFF', cicekAO: '#C9C3D8', orta: '#F5BE3E', ortaAO: '#C98A26',
    mercan: '#F29A84', mercanAO: '#CF6E5A',
  };

  // ---------------------------------------------------------------- yardımcılar
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  function lin(x1, y1, x2, y2, duraklar) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    for (const [t, renk] of duraklar) g.addColorStop(Math.max(0, Math.min(1, t)), renk);
    return g;
  }
  function rad(x0, y0, r0, x1, y1, r1, duraklar) {
    const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const [t, renk] of duraklar) g.addColorStop(t, renk);
    return g;
  }
  function dol(d, stil) {
    ctx.fillStyle = stil;
    ctx.fill(P2(d));
  }
  function kirp(d, fn) {
    ctx.save();
    ctx.clip(P2(d));
    fn();
    ctx.restore();
  }
  function yumusak(b, fn) {
    ctx.save();
    ctx.filter = `blur(${(b * OL).toFixed(2)}px)`;
    fn();
    ctx.restore();
  }
  function golgeAyar(renk, b, dx, dy) {
    ctx.shadowColor = renk;
    ctx.shadowBlur = b * OL;
    ctx.shadowOffsetX = dx * OL;
    ctx.shadowOffsetY = dy * OL;
  }
  /** Yükselti gölgesi: biçimin altına düşen yumuşak gölge (biçim düz renkle birlikte çizilir). */
  function yukselti(d, renk, golge, b, dx, dy) {
    ctx.save();
    golgeAyar(golge, b, dx, dy);
    dol(d, renk);
    ctx.restore();
  }
  /**
   * Yarı düz hacim: biçim önce AO rengiyle, sonra aynı biçimin ışığa doğru kaydırılmış ve bulanık
   * kopyası düz renkle doldurulur → içerisi DÜZ kalır, yalnızca ışıktan uzak kenarlarda yumuşak AO.
   */
  function hacim(d, renk, ao, dx, dy, b) {
    const p = P2(d);
    ctx.save();
    ctx.clip(p);
    ctx.fillStyle = ao;
    ctx.fill(p);
    ctx.filter = `blur(${(b * OL).toFixed(2)}px)`;
    ctx.translate(dx, dy);
    ctx.fillStyle = renk;
    ctx.fill(p);
    ctx.restore();
  }
  /** Işık yanında ince, yumuşak kenar ışığı (sağ üst kenarlar). */
  function kenarIsigi(d, x1, y1, x2, y2, renk, gen, b) {
    const p = P2(d);
    ctx.save();
    ctx.clip(p);
    ctx.filter = `blur(${(b * OL).toFixed(2)}px)`;
    ctx.lineWidth = gen;
    ctx.strokeStyle = lin(x1, y1, x2, y2, [[0, 'rgba(255,255,255,0)'], [0.55, 'rgba(255,255,255,0)'], [1, renk]]);
    ctx.stroke(p);
    ctx.restore();
  }
  /** Temas AO'su: bir kenar boyunca dar, yumuşak koyulaşma bandı. */
  function temasAO(x1, x2, y, h, renk, kirpYol) {
    const ciz = () => dol(dik(x1, Math.min(y, y + h), x2, Math.max(y, y + h)), lin(0, y, 0, y + h, [[0, renk], [1, 'rgba(0,0,0,0)']]));
    if (kirpYol) kirp(kirpYol, ciz);
    else ciz();
  }

  // ================================================================ GÖK: düz renk, düz güneş
  dol(dik(0, 0, 1024, 1024), P.gok);
  // düz, soluk sarı-beyaz öğle güneşi; çevresinde yumuşak, beyaz bir ışıma (halka yok)
  yumusak(40, () => dol(S.daireYolu(880, 140, 124), 'rgba(250,253,255,0.75)'));
  yukselti(S.daireYolu(880, 140, 62), P.gunes, 'rgba(255,255,236,0.95)', 26, 0, 0);

  // bulutlar: düz beyaz birleşik biçim; altında yumuşak yükselti gölgesi, alt-solda iç AO
  function bulutYolu(x, y, s) {
    const h = 30 * s;
    const yol = new Path2D();
    for (const [cx, cy, rr] of [[x - 48 * s, y - 13 * s, 25 * s], [x - 6 * s, y - 31 * s, 39 * s], [x + 40 * s, y - 18 * s, 29 * s]]) {
      yol.moveTo(cx + rr, cy);
      yol.arc(cx, cy, rr, 0, Math.PI * 2);
    }
    yol.roundRect(x - 74 * s - h / 2, y - h, 148 * s + h, h, h / 2);
    return yol;
  }
  function bulut(x, y, s) {
    const d = bulutYolu(x, y, s);
    yukselti(d, P.bulut, 'rgba(70,118,166,0.26)', 16 * s, -4 * s, 11 * s);
    hacim(d, P.bulut, P.bulutAO, 7 * s, -9 * s, 7 * s);
  }
  bulut(176, 262, 1.12);
  bulut(474, 152, 0.72);
  bulut(818, 374, 0.95);
  bulut(70, 470, 0.5);

  // ================================================================ YER: düz çimen
  dol(dik(0, 800, 1024, 1024), P.zemin);
  // yapının yere temas AO'su ve sola düşen yumuşak gölge
  yumusak(10, () => dol('M296,798 L826,798 L806,814 L236,826 Z', 'rgba(72,116,56,0.42)'));
  yumusak(3, () => dol(dik(296, 797, 824, 805), 'rgba(60,100,50,0.4)'));

  // ================================================================ MİNARE
  const minare = S.minareParcalari();
  const mx = S.minare.cx;
  const minareBirlesik = new Path2D();
  const parcaYolu = (p) => (p.tip === 'poligon' ? S.yol(p.noktalar, true) : p.tip === 'topuz' ? p.yol : dik(p.x1, p.y1, p.x2, p.y2));
  for (const p of minare) {
    if (p.tip === 'alem' || p.tip === 'bant') continue;
    const d = parcaYolu(p);
    minareBirlesik.addPath(new Path2D(d));
    if (p.ad.startsWith('çıkma')) {
      hacim(d, P.tasAlt, P.tasAltAO, 6, -3, 4);
    } else if (p.tip === 'korkuluk') {
      // korkuluk: arkada AO'lu gövde, önde düz beyaz dikmeler ve küpeşte
      hacim(d, P.tasAlt, P.tasAltAO, 6, 4, 4);
      const adet = 9, bw = 4.6;
      for (let i = 0; i <= adet; i++) {
        const x = p.x1 + bw / 2 + ((p.x2 - p.x1 - bw) * i) / adet;
        dol(dik(x - bw / 2, p.y1 + 4, x + bw / 2, p.y2), P.tas);
      }
      dol(dik(p.x1, p.y1, p.x2, p.y1 + 4.5), P.tas);
      temasAO(p.x1, p.x2, p.y1 + 4.5, 5, 'rgba(104,110,126,0.35)', d);
    } else if (p.tip === 'topuz') {
      hacim(d, P.tas, P.tasAO, 9, -6, 6);
    } else {
      hacim(d, P.tas, P.tasAO, Math.min(14, (p.noktalar[1][0] - p.noktalar[0][0]) * 0.22), 0, 6);
    }
  }
  // gövdelerde çıkma / bilezik altı temas AO'su; korkuluk dibinde yukarı doğru hafif AO
  for (const [x1, x2, y, h] of [[mx - 34, mx + 34, 488, 18], [mx - 27, mx + 27, 316, 16], [mx - 19, mx + 19, 206, 12], [mx - 27, mx + 27, 436, -9], [mx - 19, mx + 19, 272, -8]]) {
    temasAO(x1, x2, y, h, 'rgba(104,110,126,0.34)');
  }
  // zikzak bant: düz, ince oyma çizgileri
  {
    const b = minare.find((p) => p.tip === 'bant');
    kirp(dik(b.x1, b.y1 - 2, b.x2, b.y2 + 2), () => {
      ctx.lineJoin = 'miter';
      ctx.lineWidth = 2.6;
      ctx.strokeStyle = '#BDB7AC';
      for (const z of S.zikzakCizgileri()) ctx.stroke(P2(S.yol(z.map(([x, y]) => [x, y + 2]))));
    });
  }
  for (const p of S.minarePencereleri) pencere(p.x, p.y, p.w, p.h);
  // binanın minareye düşen yumuşak AO gölgesi
  kirp(minareBirlesik, () => {
    yumusak(9, () => {
      ctx.globalAlpha = 0.32;
      ctx.translate(-14, 10);
      dol('M352,555 L352,610 L334,610 L334,692 L300,692 L300,800 L760,800 L760,400 Z', '#6F7480');
    });
  });
  alem(minare.find((p) => p.tip === 'alem').alem);

  // ================================================================ KAİDE
  const K = S.kaide;
  {
    const govde = dik(K.x1, K.y1, K.x2, K.y2);
    hacim(govde, P.tas, P.tasAO, 16, -4, 9);
    // dikmeler: düz, hafif kabarık; sol yanlarında yumuşak AO
    for (const x of [365, 495, 625, 755]) yukselti(dik(x - 7, K.y1, x + 7, K.y2 - 12), P.tas, 'rgba(104,110,126,0.32)', 6, -3, 0);
    // korniş altı temas AO'su
    temasAO(K.x1, K.x2, K.y1, 22, 'rgba(104,110,126,0.36)');
    // süpürgelik
    yukselti(dik(K.x1, K.y2 - 13, K.x2, K.y2), P.tasAlt, 'rgba(104,110,126,0.3)', 5, 0, -2);
    for (const p of K.pencereler) {
      yukselti(S.kemerYolu(p.x, p.y - 6, p.w + 14, p.h + 9), P.tas, 'rgba(104,110,126,0.34)', 7, -3, 3);
      pencere(p.x, p.y, p.w, p.h);
      yukselti(dik(p.x - p.w / 2 - 6, p.y + p.h, p.x + p.w / 2 + 6, p.y + p.h + 4), P.tas, 'rgba(104,110,126,0.38)', 4, -1.5, 2.5);
    }
    // korniş: düz, altında belirgin yumuşak AO
    yukselti(dik(K.kornis.x1, K.kornis.y1, K.kornis.x2, K.kornis.y2), P.tas, 'rgba(104,110,126,0.42)', 8, -2, 5);
  }

  // ================================================================ KASNAK
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    const d = dik(q.x1, q.y1, q.x2, q.y2);
    ctx.save();
    if (k === 1) golgeAyar('rgba(40,62,70,0.3)', 8, -3, 4);
    dol(d, P.kasnak);
    ctx.restore();
    hacim(d, P.kasnak, P.kasnakAO, 22, 6, 11);
    // altta düz silme bandı; üstte üstteki kattan / kubbeden düşen temas AO'su
    dol(dik(q.x1, q.y2 - 7, q.x2, q.y2), P.silme);
    temasAO(q.x1, q.x2, q.y1, 16, 'rgba(4,46,28,0.42)', d);
    for (const p of S.kasnakPencereleri(k)) pencere(p.x, p.y, p.w, p.h);
  }

  // ================================================================ KUBBE: tek düz yeşil + AO + kenar ışığı
  {
    const d = S.kubbeYolu;
    hacim(d, P.yesil, P.yesilAO, 40, -22, 22);
    // kaburgalar: düz, ince koyu yiv (kenarlara doğru AO ile koyulaşan zemin üstünde)
    kirp(d, () => {
      for (const kb of S.kaburgalar(16, 120)) {
        const pts = kb.noktalar.filter((q) => q[1] > 304);
        ctx.lineCap = 'round';
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(10,80,48,0.5)';
        ctx.stroke(P2(S.yol(pts)));
      }
    });
    kenarIsigi(d, 470, 470, 760, 310, 'rgba(190,250,214,0.75)', 9, 3);
    // alemin kubbe tepesine düşen küçük AO
    kirp(d, () => yumusak(5, () => dol(S.elipsYolu({ cx: 556, cy: 304, rx: 26, ry: 8, aci: 0 }), 'rgba(6,60,36,0.45)')));
  }
  alem(S.alemParcalari(560, 300, 1));

  // ================================================================ ortak parçalar
  function pencere(x, y, w, h) {
    // düz koyu oyuk; tepesinde ve sol yanında yumuşak AO
    hacim(S.kemerYolu(x, y, w, h), P.pencere, P.pencereAO, -Math.max(1, w * 0.18), Math.max(2, h * 0.12), Math.max(1, w * 0.18));
  }
  function alem(a) {
    const s = a.yaka.rx / 20;
    dol(dik(a.cubuk.x1, a.cubuk.y1, a.cubuk.x2, a.cubuk.y2), P.altin);
    for (const k of a.kureler) {
      const d = S.daireYolu(k.cx, k.cy, k.r);
      yukselti(d, P.altin, 'rgba(120,80,20,0.3)', 3 * s, -1 * s, 1.5 * s);
      hacim(d, P.altin, P.altinAO, k.r * 0.35, -k.r * 0.35, k.r * 0.3);
      dol(S.daireYolu(k.cx + k.r * 0.32, k.cy - k.r * 0.32, k.r * 0.24), P.altinIsik);
    }
    const yaka = S.elipsYolu({ cx: a.yaka.cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 });
    yukselti(yaka, P.altin, 'rgba(60,50,20,0.3)', 4 * s, -1.5 * s, 2.5 * s);
    hacim(yaka, P.altin, P.altinAO, 5 * s, -3 * s, 3 * s);
    const h = S.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R);
    hacim(h, P.altin, P.altinAO, 2.5 * s, -2.5 * s, 2 * s);
  }

  // ================================================================ BİTKİLER
  const B = S.bitki;
  const L = [0.7071, -0.7071]; // ışık yönü (sağ üst)

  // bitkiler düz çimenin üstünde, altlarında yumuşak AO gölge havuzları
  yumusak(22, () => {
    for (const [x, y, rx, ry] of [[150, 1000, 190, 60], [520, 1010, 260, 56], [880, 1000, 190, 60], [380, 905, 120, 26], [660, 905, 120, 26], [125, 830, 70, 14], [905, 830, 70, 14], [255, 812, 40, 9], [770, 812, 40, 9]]) {
      dol(S.elipsYolu({ cx: x, cy: y, rx, ry, aci: 0 }), 'rgba(64,118,58,0.34)');
    }
  });

  // saplar: düz çizgi + yumuşak gölge
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const t of B.tomurcuklar.slice(8)) {
    const x0 = t.x - Math.cos(t.aci) * t.r * 0.8, y0 = t.y - Math.sin(t.aci) * t.r * 0.8;
    const bx = t.x + (t.x < 512 ? -16 : 16);
    ctx.save();
    golgeAyar('rgba(40,80,40,0.22)', 4, -2, 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = P.sap;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(t.x, t.y + 80, bx, t.y + 190);
    ctx.stroke();
    ctx.restore();
  }
  for (const s of B.saplar) {
    ctx.save();
    golgeAyar('rgba(40,80,40,0.22)', 5, -2, 3);
    ctx.lineWidth = 4.6;
    ctx.strokeStyle = P.sap;
    ctx.stroke(P2(S.yol(s)));
    ctx.restore();
  }

  function yaprak(y, koyu) {
    const renk = koyu ? P.yaprak2 : P.yaprak;
    const d = S.yaprakYolu(y);
    const Lu = y.uzunluk, W = Lu * y.genislik;
    yukselti(d, renk, 'rgba(30,80,45,0.3)', 7, -2.5, 4);
    // ışıktan uzak kenar ve sap dibinde yumuşak AO; içerisi düz
    hacim(d, renk, P.yaprakAO, W * 0.22 * L[0], W * 0.22 * L[1], W * 0.16);
    kirp(d, () => yumusak(W * 0.2, () => dol(S.daireYolu(y.x, y.y, W * 0.9), 'rgba(20,70,40,0.35)')));
    const [m0, m1] = S.yaprakDamari(y);
    ctx.lineWidth = Math.max(0.9, W * 0.05);
    ctx.strokeStyle = 'rgba(225,250,210,0.6)';
    ctx.beginPath();
    ctx.moveTo(m0[0], m0[1]);
    ctx.lineTo(m1[0], m1[1]);
    ctx.stroke();
  }
  const merkez = (y) => [y.x + Math.cos(y.aci) * y.uzunluk * 0.5, y.y + Math.sin(y.aci) * y.uzunluk * 0.5];
  const secili = [];
  B.yapraklar.forEach((y, i) => {
    if (i < 36) return yaprak(y, i % 4 === 1);
    const [cx, cy] = merkez(y);
    if (secili.some(([x, yy]) => Math.hypot(x - cx, yy - cy) < 52)) return;
    secili.push([cx, cy]);
    yaprak({ ...y, uzunluk: y.uzunluk * 1.1 }, secili.length % 3 === 0);
  });

  function tomurcuk(t) {
    const d = S.tomurcukYolu(t);
    yukselti(d, P.mercan, 'rgba(130,60,50,0.28)', 3, -1, 2);
    hacim(d, P.mercan, P.mercanAO, t.r * 0.3, -t.r * 0.3, t.r * 0.25);
    const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    const p = (u, v) => [t.x + u * ca - v * sa, t.y + u * sa + v * ca];
    const q = (pt) => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`;
    dol(`M${q(p(-t.r * 1.0, 0))} Q${q(p(-t.r * 0.2, -t.r * 1.1))} ${q(p(t.r * 0.3, -t.r * 0.55))} Q${q(p(-t.r * 0.1, 0))} ${q(p(t.r * 0.3, t.r * 0.55))} Q${q(p(-t.r * 0.2, t.r * 1.1))} ${q(p(-t.r * 1.0, 0))} Z`, P.yaprak2);
  }
  for (const t of B.tomurcuklar) tomurcuk(t);

  function cicek(c) {
    const tac = S.tacYapraklari(c).map((e) => ({ ...e, cx: c.x + Math.cos(e.aci) * c.r * 0.56, cy: c.y + Math.sin(e.aci) * c.r * 0.56, rx: c.r * 0.5, ry: c.r * 0.42 }));
    tac.sort((m, n) => (Math.cos(m.aci) * L[0] + Math.sin(m.aci) * L[1]) - (Math.cos(n.aci) * L[0] + Math.sin(n.aci) * L[1]));
    // bütün çiçeğin yapraklara düşen yükselti gölgesi
    yumusak(c.r * 0.16, () => {
      ctx.globalAlpha = 0.3;
      dol(S.daireYolu(c.x - c.r * 0.12, c.y + c.r * 0.16, c.r * 1.02), '#2E5A40');
    });
    for (const e of tac) {
      const d = S.elipsYolu(e);
      // her taç yaprağı düz beyaz; alttakine yumuşak AO gölgesi düşürür
      yukselti(d, P.cicek, 'rgba(110,96,130,0.3)', c.r * 0.12, -c.r * 0.03, c.r * 0.05);
      // göbeğe doğru, yaprakların birleştiği yerde yumuşak AO; uçlar düz beyaz
      kirp(d, () => dol(S.daireYolu(c.x, c.y, c.r * 1.1), rad(c.x, c.y, c.r * 0.12, c.x, c.y, c.r * 0.66, [[0, 'rgba(176,166,198,0.75)'], [0.55, 'rgba(196,188,214,0.25)'], [1, 'rgba(210,204,226,0)']])));
    }
    // göbek: düz sarı, çevresinde yumuşak AO, içte hafif AO
    const g = S.daireYolu(c.x, c.y, c.r * 0.22);
    yukselti(g, P.orta, 'rgba(120,80,30,0.38)', c.r * 0.08, -c.r * 0.02, c.r * 0.04);
    hacim(g, P.orta, P.ortaAO, c.r * 0.06, -c.r * 0.06, c.r * 0.05);
  }
  for (const c of B.cicekler) cicek(c);

  // ================================================================ titreşim (bant önleme): ±1 düzeyli görünmez gürültü
  {
