<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-080 Karışık Teknik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f4efe4; }
  canvas { display: block; width: 1024px; height: 1024px; }
  svg.olcum { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<svg class="olcum" xmlns="http://www.w3.org/2000/svg"><path id="olcu" d="M0,0"/></svg>
<script src="../../sahne/sahne.js"></script>
<script>
// S-080 Karışık Teknik — gesso dokulu zemin, desenli kâğıt kolaj parçaları, saydam akrilik lavi ve akıntılar,
// şablonla basılmış desenler, altın varak, boyanın üstünde canlı mürekkep çizgileri, kurşun kalem yardımcı
// çizgileri ve boya serpintisi: sanat defteri zenginliği ama sahne açıkça okunur.
// Yöntem: katman katman (zemin → kolaj → lavi → şablon → varak → opak akrilik fırça izleri → mürekkep →
// kalem → serpinti) ayrı ekran dışı tuvallerde boyanıp gevşek maskelerle birleştirilir; en sonda gesso
// kabartması bütün yüzeye ışık-gölge olarak basılır.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024 * K, H = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ctx = S.tuval(tuval, K);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const rnd = S.rng(8080);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(81), n2 = gurultu(82), n3 = gurultu(83), n4 = gurultu(84);
  const fbm = (n, x, y) => 0.5 * n(x, y) + 0.28 * n(x * 2.1, y * 2.1) + 0.14 * n(x * 4.3, y * 4.3) + 0.08 * n(x * 8.7, y * 8.7);
  const P2 = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const olcu = document.getElementById('olcu');
  function ornekle(d, adim) {
    olcu.setAttribute('d', d);
    const L = olcu.getTotalLength();
    const n = Math.max(8, Math.round(L / adim));
    const out = [];
    for (let i = 0; i <= n; i++) { const p = olcu.getPointAtLength((L * i) / n); out.push([p.x, p.y]); }
    return out;
  }
  function katman() { const c = S.yeniTuval(W, H); const x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(K, 0, 0, K, 0, 0); x.lineJoin = 'round'; x.lineCap = 'round'; return [c, x]; }
  function bas(c, kip, alfa) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = kip || 'source-over'; ctx.globalAlpha = alfa === undefined ? 1 : alfa; ctx.drawImage(c, 0, 0); ctx.restore(); }
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  // Gevşek maske: biçim + kalın kenar, gürültülü eşikle kuru fırça gibi pürüzlü kenar
  function gevsekMaske(yollar, genislet, puruz, tohum) {
    const [c, x] = katman();
    x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.lineWidth = genislet;
    for (const y of yollar) { const p = P2(y); x.fill(p); if (genislet > 0) x.stroke(p); }
    const [c2, x2] = katman();
    x2.setTransform(1, 0, 0, 1, 0, 0);
    x2.filter = `blur(${2.2 * K}px)`;
    x2.drawImage(c, 0, 0);
    const im = x2.getImageData(0, 0, W, H), d = im.data;
    const nz = gurultu(tohum || 5);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) {
      const a = d[p + 3] / 255;
      if (a <= 0.01 || a >= 0.99) { d[p] = d[p + 1] = d[p + 2] = 255; continue; }
      const px = (i % W) / K, py = ((i / W) | 0) / K;
      const t = 0.5 + (nz(px * 0.09, py * 0.09) - 0.5) * puruz + (nz(px * 0.5, py * 0.5) - 0.5) * puruz * 0.5;
      d[p] = d[p + 1] = d[p + 2] = 255;
      d[p + 3] = 255 * sstep(t - 0.06, t + 0.06, a);
    }
    x2.putImageData(im, 0, 0);
    return c2;
  }
  function maskele(c, maske) { const x = c.getContext('2d'); x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-in'; x.drawImage(maske, 0, 0); x.restore(); }

  // Fırça darbesi: kıl izleriyle (kuru fırça) bir çoklu çizgi boyunca
  function firca(x, pts, w, renk, alfa, rr) {
    rr = rr || rnd;
    const n = Math.max(3, Math.round(w / 1.3));
    for (let b = 0; b < n; b++) {
      const o = (b / (n - 1) - 0.5) * w;
      const a0 = Math.floor(rr() * pts.length * 0.15), a1 = pts.length - Math.floor(rr() * pts.length * 0.15);
      x.globalAlpha = alfa * (0.45 + rr() * 0.55);
      x.strokeStyle = renk;
      x.lineWidth = 1.2 + rr() * 1.6;
      x.beginPath();
      for (let i = a0; i < a1; i++) {
        const p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], pp = pts[Math.max(0, i - 1)];
        let nx = -(q[1] - pp[1]), ny = q[0] - pp[0];
        const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
        const ox = p[0] + nx * o, oy = p[1] + ny * o;
        i === a0 ? x.moveTo(ox, oy) : x.lineTo(ox, oy);
      }
      x.stroke();
    }
    x.globalAlpha = 1;
  }
  const dogru = (x1, y1, x2, y2, n) => { const out = []; n = n || 8; for (let i = 0; i <= n; i++) out.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]); return out; };

  // Mürekkep çizgisi: titrek, basınçla kalınlığı değişen, bazen çift
  function murekkep(pts, w, renk, tohum, cift) {
    const nz = gurultu(tohum || 9);
    const L = pts.length;
    const kay = pts.map((p, i) => [p[0] + (nz(i * 0.08, 1) - 0.5) * 2.4, p[1] + (nz(i * 0.08, 7) - 0.5) * 2.4]);
    ctx.strokeStyle = renk || 'rgba(24,22,30,0.92)';
    for (let i = 0; i < L - 1; i++) {
      const t = i / (L - 1);
      const bas = 0.55 + 0.45 * Math.sin(Math.PI * t) + (nz(i * 0.2, 3) - 0.5) * 0.4;
      ctx.lineWidth = Math.max(0.35, w * bas);
      ctx.beginPath(); ctx.moveTo(kay[i][0], kay[i][1]); ctx.lineTo(kay[i + 1][0], kay[i + 1][1]); ctx.stroke();
    }
    if (cift) {
      ctx.lineWidth = w * 0.45;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      kay.forEach((p, i) => { const x = p[0] + 1.6 + (nz(i * 0.05, 11) - 0.5) * 3, y = p[1] - 1.2 + (nz(i * 0.05, 13) - 0.5) * 3; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  // Uzatmalı (köşelerden taşan) düz mürekkep çizgisi
  function murDogru(x1, y1, x2, y2, w, uz, tohum) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const e1 = uz * (0.4 + rnd()), e2 = uz * (0.4 + rnd());
    murekkep(dogru(x1 - (dx / L) * e1, y1 - (dy / L) * e1, x2 + (dx / L) * e2, y2 + (dy / L) * e2, Math.max(4, Math.round(L / 4))), w, null, tohum);
  }
  function murYol(d, w, tohum, cift) { murekkep(ornekle(d, 2.5), w, null, tohum, cift); }

  // ------------------------------------------------------------ 1) zemin kâğıdı ve gesso kabartması (sonda basılır)
  ctx.fillStyle = '#F5F0E5'; ctx.fillRect(0, 0, 1024, 1024);
  const [cGes, xGes] = katman();
  {
    xGes.setTransform(1, 0, 0, 1, 0, 0);
    xGes.fillStyle = '#808080'; xGes.fillRect(0, 0, W, H);
    xGes.setTransform(K, 0, 0, K, 0, 0);
    const r = S.rng(31);
    for (let k = 0; k < 2600; k++) {
      const x = r() * 1100 - 40, y = r() * 1100 - 40;
      const a = (r() < 0.6 ? -0.5 : 0.25) + (r() - 0.5) * 0.5, L = 30 + r() * 140;
      xGes.strokeStyle = r() < 0.5 ? `rgba(255,255,255,${0.04 + r() * 0.08})` : `rgba(0,0,0,${0.04 + r() * 0.07})`;
      xGes.lineWidth = 1 + r() * 7;
      xGes.beginPath(); xGes.moveTo(x, y);
      xGes.quadraticCurveTo(x + Math.cos(a) * L * 0.5 + (r() - 0.5) * 10, y + Math.sin(a) * L * 0.5 + (r() - 0.5) * 10, x + Math.cos(a) * L, y + Math.sin(a) * L);
      xGes.stroke();
    }
  }
  // gesso yüksekliğinden kabartma ışığı (sağ üstten)
  const [cKab, xKab] = katman();
  {
    const g = xGes.getImageData(0, 0, W, H).data;
    const im = xKab.createImageData(W, H), d = im.data;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = (y * W + x) * 4;
      const gx = g[i + 4] - g[i - 4], gy = g[i + W * 4] - g[i - W * 4];
      const v = 128 + (-gx * 0.7 + gy * 0.7) * 1.6 + (fbm(n4, x * 0.01, y * 0.01) - 0.5) * 30;
      d[i] = d[i + 1] = d[i + 2] = clamp(v, 0, 255); d[i + 3] = 255;
    }
    xKab.putImageData(im, 0, 0);
  }

  // ------------------------------------------------------------ 2) kolaj: desenli kâğıtlar (yazısız)
  function kagit(cx, cy, w, h, aci, ciz, yirtik) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(aci);
    const p = new Path2D();
    // bir kenarı yırtık, diğerleri düz kesik
    const r = S.rng(Math.round(cx * 3 + cy));
    p.moveTo(-w / 2, -h / 2); p.lineTo(w / 2, -h / 2);
    if (yirtik) { for (let y = -h / 2; y <= h / 2; y += 4) p.lineTo(w / 2 + (r() - 0.5) * 5 + Math.sin(y * 0.05) * 3, y); } else p.lineTo(w / 2, h / 2);
    p.lineTo(-w / 2, h / 2); p.closePath();
    ctx.shadowColor = 'rgba(60,40,20,0.22)'; ctx.shadowBlur = 3 * K; ctx.shadowOffsetX = -1.2 * K; ctx.shadowOffsetY = 1.6 * K;
    ctx.fillStyle = '#fff'; ctx.fill(p);
    ctx.shadowColor = 'transparent';
    ctx.clip(p);
    ciz(ctx, w, h);
    ctx.restore();
  }
  // kareli kâğıt (sol üst, minarenin arkası)
  kagit(170, 250, 300, 360, -0.06, (c, w, h) => {
    c.fillStyle = '#F4F1E6'; c.fillRect(-w / 2, -h / 2, w, h);
    for (let x = -w / 2; x < w / 2; x += 9) { c.strokeStyle = Math.round((x + w / 2) / 9) % 5 === 0 ? 'rgba(70,120,190,0.5)' : 'rgba(70,120,190,0.25)'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(x, -h / 2); c.lineTo(x, h / 2); c.stroke(); }
    for (let y = -h / 2; y < h / 2; y += 9) { c.strokeStyle = Math.round((y + h / 2) / 9) % 5 === 0 ? 'rgba(70,120,190,0.5)' : 'rgba(70,120,190,0.25)'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(-w / 2, y); c.lineTo(w / 2, y); c.stroke(); }
  }, true);
  // çizgili defter kâğıdı (sağda)
  kagit(850, 560, 330, 230, 0.05, (c, w, h) => {
    c.fillStyle = '#FBF8EF'; c.fillRect(-w / 2, -h / 2, w, h);
    for (let y = -h / 2 + 14; y < h / 2; y += 14) { c.strokeStyle = 'rgba(80,130,200,0.45)'; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-w / 2, y); c.lineTo(w / 2, y); c.stroke(); }
    c.strokeStyle = 'rgba(220,80,80,0.55)'; c.lineWidth = 1.1; c.beginPath(); c.moveTo(-w / 2 + 40, -h / 2); c.lineTo(-w / 2 + 40, h / 2); c.stroke();
  }, false);
  // çiçek desenli kâğıt (sol alt)
  kagit(120, 660, 250, 230, 0.04, (c, w, h) => {
    c.fillStyle = '#F6E7D8'; c.fillRect(-w / 2, -h / 2, w, h);
    for (let y = -h / 2; y < h / 2 + 20; y += 26) for (let x = -w / 2 + ((y / 26) % 2 ? 13 : 0); x < w / 2 + 20; x += 26) {
      c.fillStyle = 'rgba(42,140,140,0.55)';
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; c.beginPath(); c.ellipse(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3.6, 2.2, a, 0, 7); c.fill(); }
      c.fillStyle = 'rgba(232,102,78,0.75)'; c.beginPath(); c.arc(x, y, 1.8, 0, 7); c.fill();
    }
  }, true);
  // noktalı kâğıt (güneşin arkası)
  kagit(860, 150, 250, 210, -0.1, (c, w, h) => {
    c.fillStyle = '#F7D9C9'; c.fillRect(-w / 2, -h / 2, w, h);
    for (let y = -h / 2; y < h / 2; y += 12) for (let x = -w / 2 + ((y / 12) % 2 ? 6 : 0); x < w / 2; x += 12) { c.fillStyle = 'rgba(232,102,78,0.6)'; c.beginPath(); c.arc(x, y, 2.2, 0, 7); c.fill(); }
  }, true);
  // ince şeritli kâğıt (zemin)
  kagit(600, 930, 520, 120, -0.03, (c, w, h) => {
    c.fillStyle = '#EFE3C8'; c.fillRect(-w / 2, -h / 2, w, h);
    for (let x = -w / 2; x < w / 2; x += 10) { c.fillStyle = 'rgba(200,150,70,0.35)'; c.fillRect(x, -h / 2, 4, h); }
  }, true);

  // ------------------------------------------------------------ 3) akrilik lavi: saydam, kenarı koyulaşan, çiçeklenen
  function lavi(yollar, renk, alfa, tohum, akinti) {
    const [c, x] = katman();
    x.fillStyle = renk;
    for (const y of yollar) x.fill(P2(y));
    const mask = gevsekMaske(yollar, 0, 1.3, tohum);
    // yoğunluk farkı ve kenar koyulaşması: pikselde
    const [c2, x2] = katman();
    x2.setTransform(1, 0, 0, 1, 0, 0);
    x2.filter = `blur(${6 * K}px)`; x2.drawImage(mask, 0, 0);
    const bl = x2.getImageData(0, 0, W, H).data;
    maskele(c, mask);
    const im = x.getImageData(0, 0, W, H), d = im.data;
    const md = mask.getContext('2d').getImageData(0, 0, W, H).data;
    const nz = gurultu(tohum + 100);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) {
      const m = md[p + 3] / 255;
      if (m < 0.01) continue;
      const px = (i % W) / K, py = ((i / W) | 0) / K;
      const kenar = clamp((m - bl[p + 3] / 255) * 3.2, 0, 1);
      const yog = 0.55 + 0.6 * (fbm(nz, px * 0.012, py * 0.012) - 0.5) * 1.6 + 0.12 * (nz(px * 0.08, py * 0.08) - 0.5);
      // çiçeklenme halkaları (suyun boyayı ittiği yerler)
      d[p + 3] = 255 * clamp(m * alfa * (yog + kenar * 0.4), 0, 1);
    }
    x.putImageData(im, 0, 0);
    bas(c, 'multiply', 1);
    // akıntılar
    if (akinti) {
      const r = S.rng(tohum * 3);
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      for (const [ax, ay, L] of akinti) {
        const w = 2.2 + r() * 2.4;
        const g = ctx.createLinearGradient(0, ay, 0, ay + L);
        g.addColorStop(0, renk); g.addColorStop(1, renk);
        ctx.globalAlpha = alfa * 0.9;
        ctx.strokeStyle = g; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(ax, ay);
        ctx.bezierCurveTo(ax + (r() - 0.5) * 3, ay + L * 0.3, ax + (r() - 0.5) * 3, ay + L * 0.7, ax + (r() - 0.5) * 2, ay + L);
        ctx.stroke();
        ctx.fillStyle = renk; ctx.beginPath(); ctx.ellipse(ax, ay + L + w * 0.4, w * 0.75, w * 1.0, 0, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }
  const blob = (cx, cy, rx, ry, tohum, n) => { const nz = gurultu(tohum); const p = []; n = n || 40; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; const k = 0.75 + 0.5 * nz(Math.cos(a) * 1.5 + 5, Math.sin(a) * 1.5 + 5); p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); } return S.yol(p, true); };
  // gök: turkuaz geniş lavi ufka kadar, sol üstte koyu lacivert, güneş çevresinde şeftali; zeminde okr ve toprak
  lavi([S.yol([[-30, -30], [640, -30], [652, 110], [700, 250], [800, 320], [930, 336], [1054, 320], [1054, 790], [-30, 790]], true)], '#46AEB0', 0.7, 11,
    [[120, 780, 60], [236, 770, 50], [655, 775, 40], [975, 760, 70]]);
  lavi([S.yol([[-30, -30], [520, -30], [470, 90], [380, 240], [200, 330], [-30, 360]], true)], '#3A5BAE', 0.5, 12, [[60, 345, 90], [250, 300, 120], [420, 160, 70]]);
  lavi([blob(872, 150, 200, 190, 13)], '#F4A46A', 0.5, 13);
  lavi([S.yol([[-30, 600], [300, 640], [600, 600], [1054, 630], [1054, 800], [-30, 800]], true)], '#9FD0B8', 0.35, 14);
  lavi([S.yol([[-30, 792], [1054, 788], [1054, 1054], [-30, 1054]], true)], '#E0A24E', 0.62, 15);
  lavi([S.yol([[-30, 900], [400, 880], [1054, 910], [1054, 1054], [-30, 1054]], true)], '#B86A3A', 0.4, 16);

  // kurşun kalem ön çizimi (boyanın altında kalır, lavide görünür)
  {
    ctx.save();
    ctx.strokeStyle = 'rgba(70,70,80,0.4)'; ctx.lineWidth = 0.8;
    const cz = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 + (rnd() - 0.5) * 2, y2 + (rnd() - 0.5) * 2); ctx.stroke(); };
    cz(560, 170, 560, 820); cz(300, 60, 300, 820);
    ctx.beginPath(); ctx.arc(560, 556, 206, Math.PI * 1.0, Math.PI * 2.0); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(560, 556, 214, 30, 0, 0, Math.PI * 2); ctx.stroke();
    cz(330, 610, 790, 610); cz(330, 692, 790, 692);
    ctx.restore();
  }

  // ------------------------------------------------------------ 4) şablon desenleri (beyaz ve altın, süngerle)
  function sablon(cizim, renk, alfa, tohum) {
    const [c, x] = katman();
    x.fillStyle = renk; x.strokeStyle = renk;
    cizim(x);
    // sünger: gürültü eşiğiyle boşluklu boya
    const im = x.getImageData(0, 0, W, H), d = im.data;
    const nz = gurultu(tohum);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) {
      if (d[p + 3] < 4) continue;
      const px = (i % W) / K, py = ((i / W) | 0) / K;
      const s = nz(px * 0.35, py * 0.35) * 0.6 + nz(px * 0.08, py * 0.08) * 0.4;
      d[p + 3] *= alfa * sstep(0.3, 0.55, s);
    }
    x.putImageData(im, 0, 0);
    bas(c);
  }
  // sol üst gökte beyaz nokta ızgarası
  sablon((x) => { for (let y = 40; y < 300; y += 22) for (let xx = 30; xx < 260; xx += 22) { x.beginPath(); x.arc(xx + (y % 44 ? 11 : 0), y, 5, 0, 7); x.fill(); } }, '#FFFFFF', 0.75, 41);
  // sağda sekiz köşeli yıldız örgüsü (geometrik şablon), altın boya
  sablon((x) => {
    x.lineWidth = 3;
