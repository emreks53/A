<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-037 Hologram Folyo — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #0a1033; }
  canvas, svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-037 Hologram Folyo (Holographic Foil) — yanardöner holografik folyo kabartma görünümü.
// Her öğe kabartılmış bir folyo parçasıdır: maske → uzaklık dönüşümüyle yastık + keskin pah yüksekliği
// → normal → krom ortam haritası (parlak gök, keskin ufuk bandı, ışık kutusu) × yanardöner ton
// (bakış açısına ve konuma göre pembe-camgöbeği-lila-altın kayar) + şerit ışık çizgileri + mikro parıltı.
// Kubbe yeşil kromdur; yanardöner parıltı yalnız eğik açılarda artar. En parlak noktalara yıldız parlaması.
setTimeout(function () {
  'use strict';
  const S = SAHNE;
  const zaman = () => {};
  const K = 2;
  const N = 1024 * K;
  const tuval = document.getElementById('tuval');
  const ana = S.tuval(tuval, K);
  ana.setTransform(1, 0, 0, 1, 0, 0);
  const rnd = S.rng(37);

  // ------------------------------------------------------------------ gürültü
  const PERM = new Uint8Array(512);
  const GX = new Float32Array(256);
  const GY = new Float32Array(256);
  (function () {
    const r = S.rng(3702);
    const a = [];
    for (let i = 0; i < 256; i++) a.push(i);
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    for (let i = 0; i < 512; i++) PERM[i] = a[i & 255];
    for (let i = 0; i < 256; i++) {
      const t = r() * Math.PI * 2;
      GX[i] = Math.cos(t);
      GY[i] = Math.sin(t);
    }
  })();
  function gurultu(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
    const n00 = GX[aa] * xf + GY[aa] * yf;
    const n10 = GX[ba] * (xf - 1) + GY[ba] * yf;
    const n01 = GX[ab] * xf + GY[ab] * (yf - 1);
    const n11 = GX[bb] * (xf - 1) + GY[bb] * (yf - 1);
    const x1 = n00 + (n10 - n00) * u;
    const x2 = n01 + (n11 - n01) * u;
    return (x1 + (x2 - x1) * v) * 1.42;
  }
  function fbm(x, y, o) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < o; i++) {
      s += a * gurultu(x * f, y * f);
      f *= 2.03;
      a *= 0.5;
    }
    return s;
  }

  // ------------------------------------------------------------------ renk
  const lin = (c) => Math.pow(c / 255, 2.2);
  const hex = (h) => [lin(parseInt(h.slice(1, 3), 16)), lin(parseInt(h.slice(3, 5), 16)), lin(parseInt(h.slice(5, 7), 16))];
  const SRGB = new Uint8ClampedArray(4097);
  for (let i = 0; i <= 4096; i++) SRGB[i] = Math.round(255 * Math.pow(i / 4096, 1 / 2.2));
  const enc = (v) => SRGB[v <= 0 ? 0 : v >= 1 ? 4096 : (v * 4096) | 0];

  function nrm(v) {
    const l = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // ------------------------------------------------------------------ uzaklık dönüşümü (Felzenszwalb)
  function dt1(f, n, d, v, z) {
    let k = 0;
    v[0] = 0;
    z[0] = -1e20;
    z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++;
      v[k] = q;
      z[k] = s;
      z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
    }
  }
  function edt(ic, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n), z = new Float64Array(n + 1);
    const v = new Int32Array(n);
    const g = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) g[i] = ic[i] ? 1e10 : 0;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      dt1(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      dt1(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = Math.sqrt(d[x]);
    }
    return g;
  }

  /** Ayrılabilir kutu bulanıklığı (iki geçiş): uzaklık dönüşümünün basamaklarını yumuşatır. */
  function yumusat(H, w, h, r) {
    const T = new Float32Array(Math.max(w, h));
    for (let gec = 0; gec < 2; gec++) {
      for (let y = 0; y < h; y++) {
        const o = y * w;
        let acc = 0;
        for (let x = -r; x <= r; x++) acc += H[o + Math.max(0, Math.min(w - 1, x))];
        for (let x = 0; x < w; x++) {
          T[x] = acc / (2 * r + 1);
          acc += H[o + Math.min(w - 1, x + r + 1)] - H[o + Math.max(0, x - r)];
        }
        for (let x = 0; x < w; x++) H[o + x] = T[x];
      }
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let y = -r; y <= r; y++) acc += H[Math.max(0, Math.min(h - 1, y)) * w + x];
        for (let y = 0; y < h; y++) {
          T[y] = acc / (2 * r + 1);
          acc += H[Math.min(h - 1, y + r + 1) * w + x] - H[Math.max(0, y - r) * w + x];
        }
        for (let y = 0; y < h; y++) H[y * w + x] = T[y];
      }
    }
  }

  // ------------------------------------------------------------------ yardımcı tuvaller
  function tuvalYap(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  const sonda = tuvalYap(256, 256);
  const sg = sonda.getContext('2d', { willReadFrequently: true });
  function sinir(ciz) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(0, 0, 256, 256);
    sg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    sg.fillStyle = '#fff';
    sg.strokeStyle = '#fff';
    ciz(sg);
    const d = sg.getImageData(0, 0, 256, 256).data;
    let x0 = 256, y0 = 256, x1 = -1, y1 = -1;
    for (let y = 0; y < 256; y++)
      for (let x = 0; x < 256; x++)
        if (d[(y * 256 + x) * 4 + 3] > 0) {
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
    if (x1 < 0) return null;
    return { x0: x0 * 4 - 4, y0: y0 * 4 - 4, x1: x1 * 4 + 8, y1: y1 * 4 + 8 };
  }

  // ------------------------------------------------------------------ holografik folyo gölgelendirici
  // Ekran uzayı: x sağ, y aşağı, z izleyiciye. Yansıma vektörü r = 2(n·v)n − v, v = (0,0,1).
  const LK = nrm([0.62, -0.6, 0.5]); // anahtar ışık kutusu: sağ üst
  const IRIS = ['#FF8CCB', '#C59BFF', '#86E6FF', '#A6FFD8', '#FFE58F', '#FFB59E'].map(hex);
  function iris(t, pal) {
    pal = pal || IRIS;
    t = t - Math.floor(t);
    const f = t * pal.length;
    const i = Math.floor(f);
    const k = f - i;
    const a = pal[i % pal.length], b = pal[(i + 1) % pal.length];
    const e = k * k * (3 - 2 * k);
    return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
  }
  const ss = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  /** Krom ortam haritası: üstte parlak gök, ufukta keskin koyu bant, altta loş yer; sağ üstte ışık kutusu. */
  function ortam(rx, ry, rz) {
    const up = -ry;
    let e = up > 0 ? 0.55 + 0.75 * Math.pow(up, 0.7) : 0.3 + 0.22 * Math.min(1, -up * 1.6);
    e *= 1 - 0.78 * Math.exp(-((up + 0.06) * (up + 0.06)) / 0.0035);
    e += 0.25 * Math.max(0, rz) * (1 - Math.abs(up));
    const kd = rx * LK[0] + ry * LK[1] + rz * LK[2];
    e += 2.2 * ss(0.9, 0.975, kd);
    return e;
  }
  /** Şerit ışıklardan gelen keskin parlama çizgileri (silindir ve kürelerde dikey çizgiler). */
  function serit(rx, ry) {
    const a = Math.exp(-((rx - 0.46) * (rx - 0.46)) / 0.0012) * ss(-0.95, -0.2, -ry * 0.5 - 0.3 + 0.0) ;
    const b = 0.55 * Math.exp(-((rx + 0.62) * (rx + 0.62)) / 0.0016);
    const v = ss(0.75, 0.0, Math.abs(ry + 0.1));
    return (a * 1.0 + b) * v;
  }
  const MAT = {
    inci: { taban: hex('#EEEAF6'), irid: 0.5, iridK: 0.45, ton: 0.0, metal: 1.0 },
    yesil: { taban: hex('#0E9E56'), irid: 0.06, iridK: 0.46, ton: 0.1, metal: 1.0, pal: ['#7DF2C4', '#8FE6F0', '#C6B0FF', '#8FE6F0', '#7DF2C4', '#D9F59A'].map(hex) },
    yesilK: { taban: hex('#0B8A4C'), irid: 0.06, iridK: 0.36, ton: 0.4, metal: 1.0, pal: ['#7DF2C4', '#8FE6F0', '#C6B0FF', '#8FE6F0', '#7DF2C4', '#D9F59A'].map(hex) },
    altin: { taban: hex('#F5C65A'), irid: 0.22, iridK: 0.35, ton: 0.75, metal: 1.0 },
    gul: { taban: hex('#FFD3EA'), irid: 0.66, iridK: 0.3, ton: 0.0, metal: 1.0 },
    yaprak: { taban: hex('#4FD69C'), irid: 0.32, iridK: 0.4, ton: 0.4, metal: 0.95 },
    gunes: { taban: hex('#FFE7A8'), irid: 0.55, iridK: 0.3, ton: 0.8, metal: 1.0 },
    bulut: { taban: hex('#E8E4FA'), irid: 0.6, iridK: 0.3, ton: 0.15, metal: 0.8 },
  };
  const ton = (c) => (c * 1.32) / (1 + c * 0.32);

  // ------------------------------------------------------------------ folyo katmanı
  const parilti = []; // parlama yıldızları için adaylar
  function katman(o) {
    const b = sinir(o.ciz);
    if (!b) return;
    const pay = o.pay != null ? o.pay : 6;
    const X0 = Math.max(0, Math.floor((b.x0 - pay) * K));
    const Y0 = Math.max(0, Math.floor((b.y0 - pay) * K));
    const X1 = Math.min(N, Math.ceil((b.x1 + pay) * K));
    const Y1 = Math.min(N, Math.ceil((b.y1 + pay) * K));
    const w = X1 - X0, h = Y1 - Y0;
    if (w <= 2 || h <= 2) return;
    const mc = tuvalYap(w, h);
    const mg = mc.getContext('2d', { willReadFrequently: true });
    mg.setTransform(K, 0, 0, K, -X0, -Y0);
    mg.fillStyle = '#fff';
    mg.strokeStyle = '#fff';
    o.ciz(mg);
    const md = mg.getImageData(0, 0, w, h).data;
    const A = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) A[i] = md[i * 4 + 3] / 255;
    const ic = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) ic[i] = A[i] > 0.5 ? 1 : 0;
    const D = edt(ic, w, h);
    let AH = null, DH = null;
    if (o.oyuk) {
      const oc = tuvalYap(w, h);
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.setTransform(K, 0, 0, K, -X0, -Y0);
      og.fillStyle = '#fff';
      o.oyuk(og);
      const od = og.getImageData(0, 0, w, h).data;
      AH = new Float32Array(w * h);
      const ih = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        AH[i] = od[i * 4 + 3] / 255;
        ih[i] = AH[i] > 0.5 ? 1 : 0;
      }
      DH = edt(ih, w, h);
    }
    let RL = null, RR = null;
    if (o.tip === 'donel') {
      RL = new Float32Array(h);
      RR = new Float32Array(h);
      for (let y = 0; y < h; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < w; x++)
          if (A[y * w + x] > 0.5) {
            if (l < 0) l = x;
            r = x;
          }
        RL[y] = l;
        RR[y] = r;
      }
      const L2 = new Float32Array(h), R2 = new Float32Array(h);
      const yr = 3 * K;
      for (let y = 0; y < h; y++) {
        let sl = 0, sr = 0, n = 0;
        for (let k = -yr; k <= yr; k++) {
          const yy = y + k;
          if (yy < 0 || yy >= h || RL[yy] < 0) continue;
          sl += RL[yy];
          sr += RR[yy];
          n++;
        }
        L2[y] = n ? sl / n : RL[y];
        R2[y] = n ? sr / n : RR[y];
      }
      RL = L2;
      RR = R2;
    }
    const bevel = o.bevel || 4;
    const yuk = o.yuk != null ? o.yuk : 1;
    const yastik = o.yastik || 0;
    // yastık (şişirme): maskenin bulanık hâli; uzaklık alanının sırt çizgilerini (kırışık) vermez
    let BA = null;
    if (yastik > 0) {
      const bc = tuvalYap(w, h);
      const bx = bc.getContext('2d', { willReadFrequently: true });
      bx.filter = `blur(${(o.yastikR || 30) * K * 0.5}px)`;
      bx.drawImage(mc, 0, 0);
      const bd = bx.getImageData(0, 0, w, h).data;
      BA = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) BA[i] = Math.pow(Math.max(0, Math.min(1, (bd[i * 4 + 3] / 255 - 0.5) * 2)), 0.6);
    }
    const yastikR = o.yastikR || 30;
    const zs = o.zs != null ? o.zs : 1;
    const H = new Float32Array(w * h);
    const UU = RL ? new Float32Array(w * h) : null;
    const RW = RL ? new Float32Array(h) : null;
    const SS = new Float32Array(w * h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const d = Math.max(0, D[i] / K - 0.5 + A[i] * 0.5);
        const t = Math.min(1, d / bevel);
        const s = Math.sqrt(1 - (1 - t) * (1 - t));
        SS[i] = s;
        let hh;
        if (RL) {
          const rr = (RR[y] - RL[y] + 1) / 2;
          const c = (RL[y] + RR[y]) / 2;
          const u = rr > 0 ? (x - c) / rr : 0;
          UU[i] = u;
          RW[y] = rr / K;
          hh = (Math.sqrt(Math.max(0, 1 - u * u)) * rr / K) * zs * s;
        } else {
          hh = bevel * yuk * s + (BA ? yastik * BA[i] : 0);
        }
        if (AH && AH[i] > 0.002) {
          const th = Math.min(1, DH[i] / K / (o.oyukDuvar || 1.6));
          hh -= (o.oyukDerin || 4) * Math.sqrt(1 - (1 - th) * (1 - th)) * AH[i];
        }
        H[i] = hh;
      }
    yumusat(H, w, h, K);
    const KAV = new Float32Array(w * h);
    if (o.ek)
      for (let y = 0; y < h; y++) {
        const uy = (Y0 + y) / K;
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (A[i] <= 0.002) continue;
          const e = o.ek((X0 + x) / K, uy, UU ? UU[i] : 0, RW ? RW[y] : 0, SS[i]);
          H[i] += e[0];
          KAV[i] = e[1];
        }
      }

    const img = new ImageData(w, h);
    const P = img.data;
    const m = o.mat;
    const oyukRenk = hex(o.oyukRenk || '#0B1438');
    const tonKay = o.tonKay || 0;
    const hs = o.tohum != null ? o.tohum : rnd() * 1000;
    const pr = S.rng(Math.floor(hs * 13) + 7);
    const esik = o.parEsik != null ? o.parEsik : 2.6;
    const adaylar = [];
    for (let y = 1; y < h - 1; y++) {
      const uy = (Y0 + y) / K;
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (A[i] <= 0.002) continue;
        const ux = (X0 + x) / K;
        const gx = (H[i + 1] - H[i - 1]) * K * 0.5;
        const gy = (H[i + w] - H[i - w]) * K * 0.5;
        const nl = Math.sqrt(gx * gx + gy * gy + 1);
        const nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
        const rx = 2 * nz * nx, ry = 2 * nz * ny, rz = 2 * nz * nz - 1;
        // yanardöner ton: bakış açısına, yüzey yönüne ve folyo üzerindeki konuma göre kayar
        const t = m.ton + tonKay + 1.05 * (1 - nz) + 0.28 * (nx - 0.6 * ny) + 0.24 * Math.sin((ux * 0.8 + uy * 0.55) / 52 + 1.7 * fbm(ux / 160 + hs, uy / 160, 2));
        const ir = iris(t, m.pal);
        const a = Math.min(1, m.irid + m.iridK * (1 - nz));
        let e = ortam(rx, ry, rz);
        const sr = serit(rx, ry);
        const kd = Math.max(0, rx * LK[0] + ry * LK[1] + rz * LK[2]);
        const sp = Math.pow(kd, 260) * 3.5 + sr * 2.4;
        let kav = KAV[i];
        let tb = m.taban;
        if (AH && AH[i] > 0.002) {
          const q = Math.min(1, AH[i] * Math.min(1, DH[i] / K / 1.4 + 0.15));
          tb = [tb[0] + (oyukRenk[0] - tb[0]) * q, tb[1] + (oyukRenk[1] - tb[1]) * q, tb[2] + (oyukRenk[2] - tb[2]) * q];
          kav = Math.max(kav, q * 0.55);
        }
        // folyo pırıltısı: seyrek mikro parıltı tanecikleri (oyuk içinde yok)
        const hsh = Math.sin((X0 + x) * 12.9898 + (Y0 + y) * 78.233 + hs) * 43758.5453;
        const gr = hsh - Math.floor(hsh);
        const tane = gr > 0.985 ? (gr - 0.985) * 60 * (0.4 + e * 0.6) * (1 - kav * 1.6) : 0;
        const out = [0, 0, 0];
        for (let c = 0; c < 3; c++) {
          const tint = tb[c] + (ir[c] - tb[c]) * a;
          let v = tint * e * m.metal * (1 - kav) + tint * 0.06;
          v += sp * (0.75 + 0.25 * ir[c]) * (1 - kav * 0.8) + tane * (0.6 + 0.4 * ir[c]);
          out[c] = ton(v);
        }
        if (sp > esik && pr() < 0.004) adaylar.push([ux, uy, sp]);
        const j = i * 4;
        P[j] = enc(out[0]);
        P[j + 1] = enc(out[1]);
        P[j + 2] = enc(out[2]);
        P[j + 3] = Math.round(A[i] * 255);
      }
    }
    const kc = tuvalYap(w, h);
    kc.getContext('2d').putImageData(img, 0, 0);
    const hedef = o.hedef || ana;
    const gl = o.golge === undefined ? { dx: -2, dy: 3, blur: 3, alfa: 0.55 } : o.golge;
    if (gl) {
      const sc = tuvalYap(w, h);
      const sx = sc.getContext('2d');
      sx.drawImage(kc, 0, 0);
      sx.globalCompositeOperation = 'source-in';
      sx.fillStyle = gl.renk || '#02030c';
      sx.fillRect(0, 0, w, h);
      const pad = Math.ceil(gl.blur * K * 2.5) + 2;
      const bc = tuvalYap(w + 2 * pad, h + 2 * pad);
      const bx = bc.getContext('2d');
      bx.filter = `blur(${gl.blur * K}px)`;
      bx.drawImage(sc, pad, pad);
      hedef.save();
      hedef.globalAlpha = gl.alfa;
      hedef.drawImage(bc, X0 + gl.dx * K - pad, Y0 + gl.dy * K - pad);
      hedef.restore();
    }
    hedef.drawImage(kc, X0, Y0);
    // en parlak noktalardan birkaçı yıldız parlaması alır (seyrek)
    adaylar.sort((p, q) => q[2] - p[2]);
    const sec = [];
    for (const p of adaylar) {
      if (sec.length >= (o.parSay != null ? o.parSay : 2)) break;
      if (sec.every((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) > 40)) sec.push(p);
    }
    for (const p of sec) parilti.push([p[0], p[1], o.parBoy || 1]);
  }

  /** Dört kollu parlama yıldızı (ışık toplama ile). */
  function yildiz(g, x, y, R, alfa, renk) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.translate(x * K, y * K);
    const r = R * K;
    const c = renk || [255, 255, 255];
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const halo = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.45);
    halo.addColorStop(0, col(0.75 * alfa));
    halo.addColorStop(0.25, col(0.28 * alfa));
    halo.addColorStop(1, col(0));
    g.fillStyle = halo;
    g.beginPath();
    g.arc(0, 0, r * 0.45, 0, 7);
    g.fill();
    for (let k = 0; k < 4; k++) {
      g.save();
      g.rotate((k * Math.PI) / 2 + (k % 2 ? 0 : 0));
      const L = k % 2 ? r * 0.75 : r;
      const lg = g.createLinearGradient(0, 0, L, 0);
      lg.addColorStop(0, col(0.95 * alfa));
      lg.addColorStop(1, col(0));
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(0, -r * 0.035);
      g.lineTo(L, 0);
      g.lineTo(0, r * 0.035);
      g.closePath();
      g.fill();
      g.restore();
    }
    for (let k = 0; k < 4; k++) {
      g.save();
      g.rotate(Math.PI / 4 + (k * Math.PI) / 2);
      const L = r * 0.32;
      const lg = g.createLinearGradient(0, 0, L, 0);
      lg.addColorStop(0, col(0.5 * alfa));
      lg.addColorStop(1, col(0));
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(0, -r * 0.02);
      g.lineTo(L, 0);
      g.lineTo(0, r * 0.02);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.fillStyle = col(alfa);
    g.beginPath();
    g.arc(0, 0, r * 0.04, 0, 7);
    g.fill();
    g.restore();
  }

  // ------------------------------------------------------------------ biçim yardımcıları
  const P2 = (d) => new Path2D(d);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const dolYol = (d) => (g) => g.fill(P2(d));
  function yuvarlakDik(g, x1, y1, x2, y2, r) {
    g.beginPath();
    g.roundRect(x1, y1, x2 - x1, y2 - y1, r);
    g.fill();
  }

  // ================================================================== 1. lacivert fon
  {
    const g = ana;
    const gr = g.createLinearGradient(0, 0, 0, N);
    gr.addColorStop(0, '#050822');
    gr.addColorStop(0.45, '#0C1440');
    gr.addColorStop(0.78, '#1A1F5C');
    gr.addColorStop(1, '#0A0E2E');
    g.fillStyle = gr;
    g.fillRect(0, 0, N, N);
    // yanardöner sis lekeleri (çok düşük yoğunlukta)
    const lek = [
      [180, 330, 360, '120,70,190', 0.22],
      [880, 520, 340, '40,150,190', 0.18],
      [560, 430, 300, '70,60,170', 0.25],
      [880, 150, 260, '200,150,110', 0.22],
    ];
    for (const [x, y, r, c, a] of lek) {
      const rg = g.createRadialGradient(x * K, y * K, 0, x * K, y * K, r * K);
      rg.addColorStop(0, `rgba(${c},${a})`);
      rg.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = rg;
      g.fillRect(0, 0, N, N);
    }
    // ince yanardöner toz
    const r = S.rng(3707);
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 1400; i++) {
      const x = r() * 1024, y = r() * 800;
      const c = iris(r());
      const a = 0.15 + r() * 0.5;
      const rr = 0.4 + r() * r() * 1.4;
      g.fillStyle = `rgba(${enc(c[0])},${enc(c[1])},${enc(c[2])},${a})`;
      g.beginPath();
      g.arc(x * K, y * K, rr * K, 0, 7);
      g.fill();
    }
    g.restore();
  }
  zaman('fon');

  // güneş: eş merkezli kırınım halkalı folyo disk
  {
    const g = ana;
    const rg = g.createRadialGradient(880 * K, 140 * K, 40 * K, 880 * K, 140 * K, 230 * K);
    rg.addColorStop(0, 'rgba(255,214,170,0.35)');
    rg.addColorStop(0.4, 'rgba(200,150,255,0.12)');
    rg.addColorStop(1, 'rgba(120,120,255,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, N, N);
  }
  katman({
    ciz: (g) => { g.beginPath(); g.arc(880, 140, 50, 0, 7); g.fill(); },
    mat: MAT.gunes,
    bevel: 6,
    yastik: 10,
    yastikR: 40,
    ek: (x, y) => {
      const d = Math.hypot(x - 880, y - 140);
      return [0.55 * Math.sin(d * 0.9), 0];
    },
    golge: { dx: -3, dy: 4, blur: 8, alfa: 0.5 },
    parSay: 1,
    parBoy: 1.6,
  });
  // bulutlar: kabarık folyo etiketler
  const bulutlar = [
    [150, 250, 0.95],
    [470, 150, 0.8],
    [770, 330, 0.95],
    [70, 470, 0.7],
    [955, 470, 0.66],
  ];
  for (const [bx, by, bs] of bulutlar) {
    const r = S.rng(Math.round(bx * 7 + by));
    const daireler = [];
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      daireler.push([bx + (t - 0.5) * 150 * bs, by - Math.sin(t * Math.PI) * 18 * bs + (r() - 0.5) * 6 * bs, (16 + Math.sin(t * Math.PI) * 20 + r() * 6) * bs]);
    }
    katman({
      ciz: (g) => {
        for (const [x, y, rr] of daireler) {
          g.beginPath();
          g.arc(x, y, rr, 0, 7);
          g.fill();
        }
        yuvarlakDik(g, bx - 84 * bs, by - 6 * bs, bx + 84 * bs, by + 16 * bs, 11 * bs);
      },
      mat: MAT.bulut,
      tonKay: r(),
      bevel: 5,
      yastik: 9 * bs,
      yastikR: 22 * bs,
      golge: { dx: -3, dy: 4, blur: 6, alfa: 0.45 },
      parSay: 1,
    });
  }
  zaman('gok');

  // ================================================================== 2. parlak lacivert zemin ve yansıma
  {
    const g = ana;
    const gr = g.createLinearGradient(0, 800 * K, 0, N);
    gr.addColorStop(0, '#1C2363');
    gr.addColorStop(0.25, '#121848');
    gr.addColorStop(1, '#070A24');
    g.fillStyle = gr;
    g.fillRect(0, 798 * K, N, N);
    const ufuk = g.createLinearGradient(0, 0, N, 0);
    ufuk.addColorStop(0, 'rgba(255,140,210,0)');
    ufuk.addColorStop(0.3, 'rgba(255,150,220,0.55)');
    ufuk.addColorStop(0.55, 'rgba(140,230,255,0.6)');
    ufuk.addColorStop(0.8, 'rgba(255,230,150,0.5)');
    ufuk.addColorStop(1, 'rgba(255,230,150,0)');
    g.fillStyle = ufuk;
    g.fillRect(0, 798 * K, N, 2.2 * K);
  }

  // ================================================================== 3. yapı (ayrı tuvalde; zemine yansıması için)
  const yapi = tuvalYap(N, N);
  const yg = yapi.getContext('2d');
  // minare
  const parcalar = S.minareParcalari();
  const minPen = S.minarePencereleri;
  const penIcinde = (y1, y2) => minPen.filter((p) => p.y >= y1 && p.y + p.h <= y2);
  function alemKatmanlari(a, olcek) {
    const gl = { dx: -1.5 * olcek, dy: 2 * olcek, blur: 2, alfa: 0.5 };
    katman({ hedef: yg, ciz: (g) => g.fillRect(a.cubuk.x1 - 0.4, a.cubuk.y1, a.cubuk.x2 - a.cubuk.x1 + 0.8, a.cubuk.y2 - a.cubuk.y1), mat: MAT.altin, tip: 'donel', bevel: 1.5, golge: gl, parSay: 0 });
    katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.ellipse(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry, 0, 0, 7); g.fill(); }, mat: MAT.altin, tip: 'donel', zs: 0.5, bevel: 4 * olcek, golge: gl, parSay: 1 });
    for (const k of a.kureler) katman({ hedef: yg, ciz: (g) => { g.beginPath(); g.arc(k.cx, k.cy, k.r, 0, 7); g.fill(); }, mat: MAT.altin, bevel: k.r, golge: gl, parSay: olcek > 0.8 ? 1 : 0, parBoy: 0.8 });
    const hl = a.hilal;
    katman({ hedef: yg, ciz: dolYol(S.hilalYolu(hl.cx, hl.cy, hl.R)), mat: MAT.altin, bevel: 2.6 * olcek, yastik: 1.5, yastikR: 6, golge: gl, parSay: 1, parBoy: 0.9 });
  }
  for (const p of parcalar) {
    if (p.tip === 'alem') {
      alemKatmanlari(p.alem, 0.62);
      continue;
    }
    if (p.tip === 'bant') {
      for (const z of S.zikzakCizgileri())
        katman({
          hedef: yg,
          ciz: (g) => {
            g.lineWidth = 3.4;
            g.lineJoin = 'miter';
            g.lineCap = 'butt';
            g.stroke(P2(S.yol(z)));
          },
          mat: MAT.altin,
          tonKay: 0.3,
          bevel: 1.7,
          golge: { dx: -1, dy: 1.5, blur: 1.2, alfa: 0.55 },
          parSay: 0,
        });
      continue;
    }
    let d, y1, y2;
    if (p.tip === 'poligon') {
      d = S.yol(p.noktalar, true);
      y1 = Math.min(...p.noktalar.map((q) => q[1]));
      y2 = Math.max(...p.noktalar.map((q) => q[1]));
    } else if (p.tip === 'topuz') {
      d = p.yol;
      y1 = 146;
      y2 = 200;
    } else {
      d = dik(p.x1, p.y1, p.x2, p.y2);
      y1 = p.y1;
      y2 = p.y2;
    }
    const pen = p.ad.startsWith('gövde') ? penIcinde(y1, y2) : [];
    const korkuluk = p.tip === 'korkuluk';
    katman({
      hedef: yg,
      ciz: dolYol(d),
      tip: 'donel',
      mat: MAT.inci,
      tonKay: y1 / 900,
      bevel: korkuluk ? 2.2 : 2.6,
      oyuk: pen.length || korkuluk
        ? (g) => {
            for (const q of pen) g.fill(P2(S.kemerYolu(q.x, q.y, q.w, q.h)));
            if (korkuluk) {
              const adet = 9;
              for (let i = 0; i < adet; i++) {
                const x = p.x1 + 5 + ((p.x2 - p.x1 - 10) * (i + 0.5)) / adet;
                yuvarlakDik(g, x - 2, p.y1 + 4, x + 2, p.y2 - 3, 2);
              }
            }
          }
        : null,
      oyukDerin: 4,
      oyukDuvar: 1.2,
      golge: { dx: -1.5, dy: 2.5, blur: 2.2, alfa: 0.55 },
      parSay: p.ad.startsWith('gövde') || p.tip === 'topuz' ? 1 : 0,
    });
  }
  zaman('minare');

  // kaide ve korniş
  const KD = S.kaide;
  katman({
    hedef: yg,
    ciz: dolYol(dik(KD.x1, KD.y1, KD.x2, KD.y2)),
    mat: MAT.inci,
    tonKay: 0.15,
    bevel: 3.5,
    yuk: 0.8,
    yastik: 5,
    yastikR: 60,
    oyuk: (g) => {
      for (const p of KD.pencereler) g.fill(P2(S.kemerYolu(p.x, p.y, p.w, p.h)));
    },
    oyukDerin: 6,
    oyukDuvar: 2,
    golge: { dx: -4, dy: 3, blur: 5, alfa: 0.5 },
    parSay: 2,
  });
  katman({
    hedef: yg,
    ciz: (g) => g.fillRect(KD.kornis.x1, KD.kornis.y1, KD.kornis.x2 - KD.kornis.x1, KD.kornis.y2 - KD.kornis.y1),
    mat: MAT.inci,
    tonKay: 0.45,
    tip: 'donel',
    zs: 0.02,
    bevel: 3,
    golge: { dx: -1, dy: 3.5, blur: 3, alfa: 0.6 },
    parSay: 1,
  });
  // kasnak
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k];
    katman({
      hedef: yg,
      ciz: (g) => g.fillRect(q.x1, q.y1 - (k === 0 ? 3 : 0), q.x2 - q.x1, q.y2 - q.y1 + (k === 0 ? 3 : 1)),
      tip: 'donel',
      zs: 0.8,
      mat: MAT.yesilK,
      bevel: 3,
      oyuk: (g) => {
        for (const p of S.kasnakPencereleri(k)) g.fill(P2(S.kemerYolu(p.x, p.y, p.w + 0.5, p.h)));
      },
      oyukDerin: 5,
      oyukDuvar: 1.4,
      golge: { dx: -3, dy: 3.5, blur: 3.5, alfa: 0.6 },
      parSay: 2,
    });
  }
  // kubbe: yeşil krom üstünde yanardöner parıltı, kabartma kaburgalar
  const DILIM = 16;
  katman({
    hedef: yg,
    ciz: dolYol('M359,556 C357,430 440,318 560,300 C680,318 763,430 761,556 Z'),
    tip: 'donel',
    zs: 1,
    mat: MAT.yesil,
    bevel: 3,
    ek: (x, y, u, r, s) => {
      const fi = Math.asin(Math.max(-1, Math.min(1, u)));
      const f = ((fi + Math.PI / 2) / Math.PI) * DILIM;
      const fr = f - Math.floor(f);
      const dd = Math.min(fr, 1 - fr);
      const nz = Math.sqrt(Math.max(0, 1 - u * u));
      // kaburga genişliği ekranda sabit kalsın (kenarda daralan dilime göre)
      const gen = (0.075 / Math.max(0.25, nz)) * Math.min(1, 40 / Math.max(8, r)) * 2.2;
      const kab = Math.exp(-(dd * dd) / (gen * gen * 0.25));
      const yuk = Math.min(1, (556 - y) / 12) * Math.min(1, r / 30);
      return [(2.2 * kab + 1.2 * Math.sin(Math.PI * fr)) * nz * yuk * s, 0];
    },
    golge: { dx: -4, dy: 6, blur: 5, alfa: 0.65 },
    parSay: 3,
    parBoy: 1.3,
  });
  alemKatmanlari(S.alemParcalari(560, 300, 1), 1);
  zaman('yapi');

  // zemin yansıması + temas gölgesi, sonra yapı
  {
    const yan = tuvalYap(N, 260 * K);
    const yx = yan.getContext('2d');
    yx.save();
    yx.translate(0, 0);
    yx.scale(1, -1);
    yx.drawImage(yapi, 0, -800 * K, N, N);
    yx.restore();
    yx.globalCompositeOperation = 'destination-in';
    const fg = yx.createLinearGradient(0, 0, 0, 200 * K);
    fg.addColorStop(0, 'rgba(0,0,0,0.42)');
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    yx.fillStyle = fg;
    yx.fillRect(0, 0, N, 260 * K);
    ana.save();
    ana.filter = `blur(${1.5 * K}px)`;
    ana.drawImage(yan, 0, 800 * K);
    ana.restore();
    ana.save();
    ana.filter = `blur(${6 * K}px)`;
    ana.fillStyle = 'rgba(0,0,8,0.7)';
    ana.beginPath();
    ana.ellipse(550 * K, 801 * K, 285 * K, 6 * K, 0, 0, 7);
    ana.fill();
    ana.restore();
  }
  ana.drawImage(yapi, 0, 0);

  // ================================================================== 4. bitkiler: yanardöner folyo yaprak ve taçlar
  const B = S.bitki;
  for (const s of B.saplar)
    katman({
      ciz: (g) => {
        g.lineWidth = 5;
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.stroke(P2(S.yol(s)));
      },
      mat: MAT.yaprak,
      bevel: 2.5,
      golge: { dx: -2, dy: 2.5, blur: 2.5, alfa: 0.5 },
      parSay: 0,
    });
  B.yapraklar.forEach((y, i) => {
    const [a, b] = S.yaprakDamari(y);
    katman({
      ciz: dolYol(S.yaprakYolu(y)),
      mat: MAT.yaprak,
      tonKay: (i % 7) * 0.05,
      bevel: Math.min(4, y.uzunluk * 0.07),
      yuk: 0.7,
      yastik: y.uzunluk * 0.05,
      yastikR: y.uzunluk * 0.2,
      ek: (x, yy) => {
        // orta damar: keskin kabartma sırt
        const vx = b[0] - a[0], vy = b[1] - a[1];
        const L2 = vx * vx + vy * vy;
        const t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (yy - a[1]) * vy) / L2));
        const dx = x - (a[0] + vx * t), dy = yy - (a[1] + vy * t);
        const d = Math.sqrt(dx * dx + dy * dy);
        return [1.1 * Math.exp(-(d * d) / 1.1) * (1 - t * 0.7) - 0.25 * d * 0, 0];
      },
      golge: { dx: -2, dy: 3, blur: 3, alfa: 0.55 },
      parSay: y.uzunluk > 60 ? 1 : 0,
      parBoy: 0.8,
      parEsik: 2.2,
    });
  });
  for (const t of B.tomurcuklar)
    katman({
      ciz: dolYol(S.tomurcukYolu(t)),
      mat: MAT.gul,
      tonKay: 0.85,
      bevel: t.r * 0.9,
      golge: { dx: -1.5, dy: 2, blur: 2, alfa: 0.5 },
      parSay: 0,
    });
  function tacYolu(c, a, L, W) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const p = (u, v) => [c.x + u * ca - v * sa, c.y + u * sa + v * ca];
    const q = (u, v) => p(u, v).map((n) => n.toFixed(2)).join(',');
    return `M${q(L * 0.06, 0)} C${q(L * 0.25, -W * 0.55)} ${q(L * 0.8, -W * 0.98)} ${q(L * 0.98, -W * 0.28)} C${q(L * 1.03, -W * 0.08)} ${q(L * 0.94, 0)} ${q(L * 0.9, 0)} C${q(L * 0.94, 0)} ${q(L * 1.03, W * 0.08)} ${q(L * 0.98, W * 0.28)} C${q(L * 0.8, W * 0.98)} ${q(L * 0.25, W * 0.55)} ${q(L * 0.06, 0)} Z`;
  }
  const sirali = B.cicekler.map((c, i) => ({ c, i })).sort((a, b) => a.c.y - b.c.y);
  for (const { c, i } of sirali) {
    const L = c.r * 1.06, W = c.r * 0.74;
    for (let k = 0; k < 5; k++) {
      const a = c.aci + (k * Math.PI * 2) / 5;
      const ca = Math.cos(a), sa = Math.sin(a);
      katman({
        ciz: dolYol(tacYolu(c, a, L, W)),
        mat: MAT.gul,
        tonKay: i * 0.17 + k * 0.08,
        bevel: Math.max(1.8, c.r * 0.08),
        yuk: 0.8,
        yastik: c.r * 0.16,
        yastikR: c.r * 0.38,
        ek: (x, y) => {
          // orta kıvrım: taç yaprağın ortasında ince bir oluk
          const px = x - c.x, py = y - c.y;
          const al = px * ca + py * sa, en = -px * sa + py * ca;
          const t = al / L;
          if (t < 0.15 || t > 0.85) return [0, 0];
          const f = Math.sin(((t - 0.15) / 0.7) * Math.PI);
          return [-c.r * 0.035 * Math.exp(-(en * en) / (c.r * c.r * 0.004)) * f, 0];
        },
        golge: { dx: -1.6, dy: 2.4, blur: Math.max(1.6, c.r * 0.05), alfa: 0.55 },
        parSay: c.r > 40 ? 1 : 0,
        parBoy: c.r > 40 ? 1.1 : 0.7,
        parEsik: 2.4,
      });
    }
    const R = c.r * 0.2;
    katman({
      ciz: (g) => {
        g.beginPath();
        g.arc(c.x, c.y, R, 0, 7);
        g.fill();
      },
      mat: MAT.altin,
      bevel: R,
      ek: (x, y) => {
        // tohum noktaları
        let h = 0;
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2 + c.aci;
          const dx = x - (c.x + Math.cos(a) * R * 0.55), dy = y - (c.y + Math.sin(a) * R * 0.55);
          h += Math.exp(-(dx * dx + dy * dy) / (R * R * 0.02));
        }
        return [h * R * 0.12, 0];
      },
      golge: { dx: -1.2, dy: 1.8, blur: 1.6, alfa: 0.55 },
      parSay: c.r > 50 ? 1 : 0,
      parBoy: 0.7,
    });
  }
  zaman('bitki');

  // ================================================================== 5. parlama yıldızları ve ışıltı
  {
    const r = S.rng(3737);
    for (const [x, y, s] of parilti) yildiz(ana, x, y, 34 * s * (0.8 + r() * 0.5), 0.95, [255, 250, 255]);
    // fonda birkaç büyük pırıltı
    const fon = [
      [96, 130, 30],
