<script>
// S-057 Suluboya Kalemi — soğuk preslenmiş suluboya kâğıdında suda çözünen renkli kalem. Önce kuru
// kalemle taranır (pürüzlü kâğıtta dişin tepelerinde kalan, beyaz çukurlu vuruşlar); sonra ıslak fırça

(function () {
  'use strict';
  // ================================================================ ortak yardımcılar

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${(+a).toFixed(3)})`;

  function gurultu(tohum) {
    const r = SAHNE.rng(tohum), M = 256, T = new Float32Array(M * M);
    for (let i = 0; i < M * M; i++) T[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
      const a = T[y0 * M + x0], b = T[y0 * M + x1], c = T[y1 * M + x0], d = T[y1 * M + x1];

      for (let x = -r; x <= r; x++) acc += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc * k; acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)]; }

    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];

  }

  // ---------------------------------------------------------------- bölge haritası (1024)
  const bh = SAHNE.bolgeHaritasi();

  { const onb = new Map(), v = bh.veri;
    for (let i = 0; i < N; i++) {

      let b = onb.get(key);
      if (b === undefined) { b = BI[SAHNE.bolgeAdi(v[i * 4], v[i * 4 + 1], v[i * 4 + 2])]; onb.set(key, b); }
      BOL[i] = b;
    } }
  const bolgeNo = (x, y) => BOL[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];

  // ---------------------------------------------------------------- ışık (sağ üstten)
  const LV = (() => { const v = [0.62, -0.56, 0.55], l = Math.hypot(...v); return v.map((c) => c / l); })();
  const prof = SAHNE.kubbeProfili(400);
  const kubbeR = new Float32Array(W), kubbeDr = new Float32Array(W);

    if (y >= 488) return 34; if (y >= 468) return 34 + (488 - y) * 0.9; if (y >= 456) return 54;
    if (y >= 436) return 48; if (y >= 316) return 27; if (y >= 300) return 27 + (316 - y); if (y >= 290) return 45;
    if (y >= 272) return 40; if (y >= 206) return 19; if (y >= 198) return 25; return 22;

  // ---------------------------------------------------------------- SVG yolu → nokta dizileri

  gizliSvg.style.position = 'absolute'; gizliSvg.style.left = '-10px'; gizliSvg.style.top = '-10px';

      gizliYol.setAttribute('d', p);
      const L = gizliYol.getTotalLength(), n = Math.max(2, Math.ceil(L / adim)), out = [];
      for (let i = 0; i <= n; i++) { const q = gizliYol.getPointAtLength((L * i) / n); out.push([q.x, q.y]); }
      return out;
    });
  }
  const Y = SAHNE.yollar();
  const P2 = (d) => new Path2D(d);
  function birlesik(dizi) { const p = new Path2D(); for (const d of dizi) p.addPath(new Path2D(d)); return p; }

  // ---------------------------------------------------------------- vuruş (uçları incelen, basıncı değişen çizgi)
  let KALINLIK = 1; // stil, bütün vuruşları kalınlaştırmak için değiştirebilir
  // pts: [[x,y],...]; w: genişlik; a: basınç (0..1); c: [r,g,b]; bas/son: uçlardaki incelme payı

      const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
      let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;

      g.addColorStop(0, rgba(c, a * (bas > 0 ? 0.35 : 1)));
      g.addColorStop(Math.min(0.45, bas * 0.9 + 0.02), rgba(c, a));
      g.addColorStop(Math.max(0.55, 1 - son * 0.8), rgba(c, a));

    o = o || {};

      const yeni = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i], L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), k = Math.ceil(L / 3);

      }
      pts = yeni;
    }

    const n = pts.length;

  // öbek taraması: kısa paralel vuruş öbekleri (renkli kalem / tebeşir taraması)

  // ---------------------------------------------------------------- 2048 katman tuvali

  const kuTon = (fn) => harita((x, y, b, l) => (b === 'kubbe' ? fn(l, x, y) : 0));
  function meridyen(x, o) {
    x.save(); x.clip(kubbeYolu);
    for (let u = -1.02; u <= 1.02; u += o.du * (0.75 + 0.5 * r())) {
      let y = 556 + r() * 10;
      while (y > 302) {
        const L = o.boy * (0.7 + 0.6 * r());
        const ya = y, yb = Math.max(299, y - L), uu = u + (r() - 0.5) * 0.006;
        const pts = [];
        for (let t = 0; t <= 5; t++) { const yy = lerp(ya, yb, t / 5); pts.push([560 + uu * kubbeRy(yy), yy]); }
        if (r() < 0.5) pts.reverse();
        const al = typeof o.alfa === 'function' ? o.alfa(pts[2][0], pts[2][1]) : o.alfa;
        if (al > 0.01) strok(x, pts, o.kal * (0.8 + 0.4 * r()), clamp(al * (0.75 + 0.35 * r()), 0, 1), o.renk);
        y = yb + (r() < 0.25 ? -r() * o.boy * 0.4 : r() * 6);
      }
    }
    x.restore();
  }
  katman((x) => meridyen(x, { du: 0.017, boy: 34, kal: 1.8, alfa: 0.8, renk: hex('#C2D648') }), { sil: kuSil, alan: kubbeYolu, bx: kuBx, maske: kuTon((l) => 0.45 + 0.55 * l) });
  katman((x) => meridyen(x, { du: 0.018, boy: 30, kal: 1.75, alfa: 0.78, renk: hex('#4F9C38') }), { sil: kuSil, alan: kubbeYolu, bx: kuBx, guc: 1.15, maske: kuTon((l) => 0.3 + 0.7 * sstep(1.0, 0.5, l)) });
  katman((x) => { x.save(); x.clip(kubbeYolu); taraK(x, { bx: kuBx, aci: egik, aciJ: 0.14, aralik: 2.5, boy: 26, kal: 1.45, alfa: 0.7, renk: hex('#1E7A58'), obek: 24 }, r); x.restore(); },
    { sil: kuSil, alan: kubbeYolu, bx: kuBx, guc: 1.25, maske: kuTon((l) => sstep(0.8, 0.35, l) * 0.85) });
  katman((x) => meridyen(x, { du: 0.02, boy: 28, kal: 1.7, alfa: 0.8, renk: hex('#165A46') }), { sil: kuSil, alan: kubbeYolu, bx: kuBx, guc: 1.4, maske: kuTon((l) => sstep(0.6, 0.12, l)) });
  katman((x) => { x.save(); x.clip(kubbeYolu); taraK(x, { bx: kuBx, aci: 0.55, aciJ: 0.14, aralik: 2.7, boy: 22, kal: 1.4, alfa: 0.62, renk: hex('#2A4CA0'), obek: 20 }, r); x.restore(); },
    { sil: kuSil, alan: kubbeYolu, bx: kuBx, guc: 1.3, maske: kuTon((l) => sstep(0.45, 0.08, l) * 0.8) });
  katman((x) => { x.save(); x.clip(kubbeYolu); taraK(x, { bx: kuBx, aci: egik + 0.2, aciJ: 0.14, aralik: 2.9, boy: 18, kal: 1.35, alfa: 0.6, renk: hex('#2B2F52'), obek: 18 }, r); x.restore(); },
    { sil: kuSil, alan: kubbeYolu, bx: kuBx, guc: 1.45, maske: kuTon((l) => sstep(0.3, 0.0, l) * 0.8) });

  // ================================================================ ALEMLER
  {
    const bx = [270, 70, 590, 312], ic = icinde(['altin'], 3);
    const p = new Path2D(); p.addPath(alemYolu); p.addPath(minareAlemYolu);
    [['#F0C030', 0.85, 1.5, (l) => 0.6 + 0.4 * l], ['#D97A22', 0.75, egik, (l) => sstep(0.8, 0.3, l)], ['#7E3E16', 0.8, 0.6, (l) => sstep(0.4, 0.05, l) * 0.9]].forEach(([rk, al, aci, fn]) =>
      katman((x) => { x.save(); x.clip(p); taraK(x, { bx, ic, aci, aciJ: 0.1, aralik: 1.6, boy: 9, kal: 1.15, alfa: al, renk: hex(rk), obek: 8, sik: 0.5 }, r); x.restore(); },
        { bx, guc: 1.3, islak: 0, maske: harita((x, y, b, l) => (b === 'altin' ? fn(l) : 0)) }));
  }

  // ================================================================ BİTKİLER
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s, 3.4, 0.85, hex('#5A9438'), r, { parca: 90, titre: 0.4 }); }, { sil: [MK.yaprakUstu], bx: [0, 500, W, W], yay: 4 });
  katman((x) => { for (const s of B.saplar) elCizgisi(x, s.map(([a, b]) => [a - 0.9, b]), 1.4, 0.8, hex('#22503A'), r, { parca: 80, titre: 0.3 }); }, { sil: [MK.yaprakUstu], bx: [0, 500, W, W], islak: 0 });
  function yaprakCiz(x, renk, alfaFn, opt) {
    for (let i = 0; i < B.yapraklar.length; i++) {
      const yp = B.yapraklar[i], p = yaprakYollari[i];
      x.save(); x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fill(p); x.restore();
      const al = alfaFn(yp, i);
      if (al <= 0.01) continue;
      x.save(); x.clip(p);
      const L = yp.uzunluk, ca = Math.cos(yp.aci), sa = Math.sin(yp.aci);
      for (const taraf of [-1, 1]) {
        const isikli = (-sa * taraf) * 0.74 + (ca * taraf) * -0.67 > 0;
        const a2 = al * (opt.yari ? (isikli ? opt.yari[0] : opt.yari[1]) : 1);
        if (a2 <= 0.01) continue;
        const aci = yp.aci + taraf * (opt.aci || 0.62);
        const n = Math.round(L / opt.aralik);
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n + (r() - 0.5) * 0.4 / n;
          const sx = yp.x + ca * L * t, sy = yp.y + sa * L * t;
          const len = L * yp.genislik * 0.74 * Math.sin(Math.PI * clamp(t * 0.95 + 0.04, 0, 1)) * (0.8 + 0.35 * r()) + 2;
          const ex = sx + Math.cos(aci) * len, ey = sy + Math.sin(aci) * len;
          const mx = (sx + ex) / 2 + (r() - 0.5) * 1.2, my = (sy + ey) / 2 + (r() - 0.5) * 1.2;
          strok(x, [[sx, sy], [mx, my], [ex, ey]], opt.kal * (0.8 + 0.4 * r()), clamp(a2 * (0.7 + 0.4 * r()), 0, 1), renk, 0.05, 0.55);
        }
      }
      x.restore();
    }
  }
  const yBx = [0, 500, W, W];
  katman((x) => yaprakCiz(x, hex('#B6CC44'), () => 0.8, { aralik: 2.6, kal: 1.8, yari: [1, 0.8] }), { sil: [MK.onBitki], bx: yBx, yay: 5 });
  katman((x) => yaprakCiz(x, hex('#3E8A34'), (yp) => (yp.uzunluk > 50 ? 0.85 : 0.6), { aralik: 2.7, kal: 1.75, aci: 0.5, yari: [0.45, 1] }), { sil: [MK.onBitki], bx: yBx, yay: 5 });
  katman((x) => yaprakCiz(x, hex('#1A4E3A'), (yp) => (yp.uzunluk > 50 ? 0.75 : 0.35), { aralik: 3.2, kal: 1.7, aci: 0.75, yari: [0.1, 0.9] }), { sil: [MK.onBitki], bx: yBx, yay: 5, guc: 1.2 });
  katman((x) => yaprakCiz(x, hex('#2C3A70'), (yp) => (yp.y > 880 ? 0.6 : 0.15), { aralik: 3.8, kal: 1.6, aci: 0.9, yari: [0, 0.8] }), { sil: [MK.onBitki], bx: yBx, yay: 5 });
  // tomurcuklar
  const tomKat = (rk, al, da) => katman((x) => { B.tomurcuklar.forEach((t, i) => { x.save(); x.clip(tomurcukYollari[i]); taraK(x, { bx: [t.x - 18, t.y - 18, t.x + 18, t.y + 18], aci: t.aci + da, aciJ: 0.1, aralik: 1.7, boy: 15, kal: 1.3, alfa: al, renk: hex(rk), obek: 13, sik: 0.45 }, r); x.restore(); }); }, { bx: yBx, yay: 4 });
  tomKat('#E87A98', 0.85, 0); tomKat('#A8285A', 0.7, 0.8);
  // çiçekler: beyaz taç yaprakları; göbeğe doğru gül rengi, gölgede menekşe-mavi
  function tacCiz(x, renk, alfaFn, opt) {
    B.cicekler.forEach((c) => {
      SAHNE.tacYapraklari(c).forEach((e) => {
        const p = P2(SAHNE.elipsYolu(e));
        const yon = Math.cos(e.aci) * 0.74 + Math.sin(e.aci) * -0.67;
        const al = alfaFn(c, e, yon);
        if (al <= 0.01) return;
        x.save(); x.clip(p);
        const n = Math.round((c.r * 1.5) / opt.aralik);
        const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
        for (let k = 0; k < n; k++) {
          const off = (k / (n - 1) - 0.5) * c.r * 0.95 + (r() - 0.5) * opt.aralik * 0.5;
          const bas = c.r * (0.12 + r() * 0.1), son = c.r * (opt.boy[0] + r() * opt.boy[1]);
          const a2 = e.aci + (off / (c.r * 1.2)) * 0.9;
          const sx = c.x + ca * bas - sa * off * 0.25, sy = c.y + sa * bas + ca * off * 0.25;
          const ex = sx + Math.cos(a2) * son, ey = sy + Math.sin(a2) * son;
          strok(x, [[sx, sy], [(sx + ex) / 2 - sa * c.r * 0.03, (sy + ey) / 2 + ca * c.r * 0.03], [ex, ey]], opt.kal * (0.8 + 0.4 * r()) * Math.max(0.7, c.r / 45), clamp(al * (0.7 + 0.4 * r()), 0, 1), renk, 0.02, 0.75);
        }
        x.restore();
      });
    });
  }
  const cBx = [0, 500, W, W];
  katman((x) => tacCiz(x, hex('#EE8FAE'), () => 0.75, { aralik: 2.1, kal: 1.8, boy: [0.25, 0.3] }), { bx: cBx, yay: 6 });
  katman((x) => tacCiz(x, hex('#7E86D2'), (c, e, yon) => (yon < -0.1 ? 0.75 : yon < 0.4 ? 0.35 : 0), { aralik: 2.4, kal: 1.7, boy: [0.45, 0.5] }), { bx: cBx, yay: 6 });
  katman((x) => tacCiz(x, hex('#B23462'), () => 0.85, { aralik: 2.8, kal: 1.5, boy: [0.05, 0.12] }), { bx: cBx, yay: 5 });
  // göbekler
  const gobek = (rk, al, aci) => katman((x) => { for (const c of B.cicekler) { x.save(); x.beginPath(); x.arc(c.x, c.y, c.r * 0.22, 0, 7); x.clip(); taraK(x, { bx: [c.x - c.r * 0.3, c.y - c.r * 0.3, c.x + c.r * 0.3, c.y + c.r * 0.3], aci, aralik: 1.5, boy: 12, kal: 1.4, alfa: al, renk: hex(rk), obek: 10, sik: 0.4 }, r); x.restore(); } }, { bx: cBx, guc: 1.2, yay: 3 });
  gobek('#F2BC1E', 0.9, egik); gobek('#D8701E', 0.75, 0.6);
  katman((x) => { for (const c of B.cicekler) for (let i = 0; i < 11; i++) { const a = (i / 11) * Math.PI * 2 + r() * 0.3, rr = c.r * (0.25 + r() * 0.06); x.fillStyle = rgba(hex('#7A3418'), 0.9); x.beginPath(); x.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, Math.max(1.1, c.r * 0.035), 0, 7); x.fill(); } }, { bx: cBx, islak: 0 });

  // ================================================================ KONTUR ÇİZGİLERİ (ıslak yerlerde yumuşar)
  const kontur = (fn, bx, islak) => katman(fn, { bx: bx || [0, 0, W, W], yumus: 0.14, gren: 0.55, yay: 2.5, koyu: 1.1, islak: islak === undefined ? 0.75 : islak });
  kontur((x) => {
    elCizgisi(x, SAHNE.kubbeNoktalari(120), 1.6, 0.95, hex('#174835'), r, { parca: 120 });
    for (const kb of SAHNE.kaburgalar(16, 90)) elCizgisi(x, kb.noktalar.filter((p) => p[1] > 303), 1.15, 0.6 + 0.35 * clamp(0.4 - kb.u, 0, 1), hex('#184C3A'), r, { parca: 90, titre: 0.25 });
  });
  kontur((x) => {
    const yesil = hex('#1B4636'), sepya = hex('#6A4636');
    for (const k of SAHNE.kasnak) {
      elCizgisi(x, [[k.x1, k.y1], [k.x2, k.y1]], 1.3, 0.85, yesil, r, { parca: 140 });
      elCizgisi(x, [[k.x1, k.y2], [k.x2, k.y2]], 1.4, 0.9, yesil, r, { parca: 140 });
      elCizgisi(x, [[k.x1, k.y1], [k.x1, k.y2]], 1.3, 0.85, yesil, r);
      elCizgisi(x, [[k.x2, k.y1], [k.x2, k.y2]], 1.3, 0.85, yesil, r);
    }
    for (const p of [0, 1].flatMap((k) => SAHNE.kasnakPencereleri(k))) elCizgisi(x, kemerNok(p), 1.0, 0.85, hex('#13283A'), r, { parca: 200, titre: 0.15 });
    const K2 = SAHNE.kaide, kr = K2.kornis;
    for (const [a, b] of [[[kr.x1, kr.y1], [kr.x2, kr.y1]], [[kr.x1, kr.y2], [kr.x2, kr.y2]], [[kr.x1, kr.y1], [kr.x1, kr.y2]], [[kr.x2, kr.y1], [kr.x2, kr.y2]], [[K2.x1, K2.y1], [K2.x1, K2.y2]], [[K2.x2, K2.y1], [K2.x2, K2.y2]]]) elCizgisi(x, [a, b], 1.3, 0.88, sepya, r, { parca: 150 });
    elCizgisi(x, [[K2.x1 - 8, 800], [K2.x2 + 10, 800]], 1.1, 0.55, sepya, r, { parca: 120 });
    for (const p of K2.pencereler) elCizgisi(x, kemerNok(p), 1.1, 0.85, hex('#4A2E40'), r, { parca: 200 });
    for (const p of SAHNE.minareParcalari()) {
      if (p.tip === 'poligon') { const q = p.noktalar; for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; if (a[1] === 800 && b[1] === 800) continue; elCizgisi(x, [a, b], 1.3, 0.9, sepya, r, { parca: 120 }); } }
      else if (p.tip === 'korkuluk') {
        elCizgisi(x, [[p.x1, p.y1], [p.x2, p.y1]], 1.1, 0.85, sepya, r);
        elCizgisi(x, [[p.x1, p.y1], [p.x1, p.y2]], 1.1, 0.85, sepya, r); elCizgisi(x, [[p.x2, p.y1], [p.x2, p.y2]], 1.1, 0.85, sepya, r);
        const n = 11; for (let i = 0; i < n; i++) { const xx = p.x1 + 4 + ((p.x2 - p.x1 - 8) * (i + 0.5)) / n; strok(x, [[xx, p.y1 + 3], [xx, p.y2 - 1]], 2.0, 0.85, hex('#6A4A50'), 0.05, 0.1); }
      } else if (p.tip === 'topuz') elCizgisi(x, ornekle(p.yol, 2)[0], 1.3, 0.9, sepya, r, { parca: 200 });
    }
    for (const z of SAHNE.zikzakCizgileri()) elCizgisi(x, z, 1.6, 0.8, hex('#8A5642'), r, { parca: 30, titre: 0.2, ortus: 2 });
    for (const p of SAHNE.minarePencereleri) elCizgisi(x, kemerNok(p), 1.0, 0.85, hex('#4A2E40'), r, { parca: 200 });
  }, [240, 60, 840, 810]);
  kontur((x) => { const c = hex('#74401A'); for (const d of [...Y.alem, ...Y.minareAlem]) for (const pts of ornekle(d, 1.5)) elCizgisi(x, pts, 0.9, 0.85, c, r, { parca: 200, titre: 0.1 }); }, [260, 60, 600, 320], 0);
  kontur((x) => {
    B.yapraklar.forEach((yp, i) => { x.save(); x.globalCompositeOperation = 'destination-out'; x.fill(yaprakYollari[i]); x.restore(); elCizgisi(x, ornekle(SAHNE.yaprakYolu(yp), 2)[0], 1.1, 0.85, hex('#1C462E'), r, { parca: 60, titre: 0.15 }); });
    sil(K, MK.onBitki);
    B.tomurcuklar.forEach((t) => elCizgisi(x, ornekle(SAHNE.tomurcukYolu(t), 1.5)[0], 1.0, 0.85, hex('#922452'), r, { parca: 80, titre: 0.1 }));
    B.cicekler.forEach((c) => {
      const tl = SAHNE.tacYapraklari(c);
      tl.forEach((e, ei) => {
        const pts = ornekle(SAHNE.elipsYolu(e), 1.5)[0];
        const icE = (sn, q) => { const ca = Math.cos(sn.aci), sa = Math.sin(sn.aci), dx = q[0] - sn.cx, dy = q[1] - sn.cy; const u = (dx * ca + dy * sa) / sn.rx, v = (-dx * sa + dy * ca) / sn.ry; return u * u + v * v < 0.98; };
        const icSonraki = (q) => tl.some((sn, ej) => ej > ei && icE(sn, q));
        const parcalar = []; let cur = [];
        for (const q of pts) { if (icSonraki(q)) { if (cur.length > 1) parcalar.push(cur); cur = []; } else cur.push(q); }
        if (cur.length > 1) parcalar.push(cur);
        for (const pp of parcalar) elCizgisi(x, pp, 1.05 * Math.max(0.8, c.r / 50), 0.8, hex('#8E4A9A'), r, { parca: 90, titre: 0.12 });
      });
      for (const pts of ornekle(SAHNE.daireYolu(c.x, c.y, c.r * 0.22), 1.5)) elCizgisi(x, pts, 0.9, 0.7, hex('#9A4E1A'), r, { parca: 200, titre: 0.1 });
    });
  }, [0, 500, W, W]);

  // ---------------------------------------------------------------- sonuç: kâğıt kabartısı
  const img = ctx.createImageData(W2, W2), d = img.data;
  for (let i = 0; i < N2; i++) {
    const sh = 0.985 + 0.03 * (H[i] - 0.5);
    d[i * 4] = clamp(RR[i] * 255 * sh, 0, 255); d[i * 4 + 1] = clamp(RG[i] * 255 * sh, 0, 255); d[i * 4 + 2] = clamp(RB[i] * 255 * sh, 0, 255); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  SAHNE.hazir();
})();
