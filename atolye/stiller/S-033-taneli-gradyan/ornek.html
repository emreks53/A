<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-033 Taneli Gradyan — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #89b9da; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
'use strict';
// S-033 Taneli Gradyan — düz vektör biçimler; gölge ve ışık yumuşak degradeyle değil, yalnızca tane
// yoğunluğuyla kurulur (tane sıklaştıkça ton koyulaşır). Kontur yok, 8 renklik sınırlı modern palet,
// her yerde ince tane, ışık sağ üstten. Çağdaş editoryal illüstrasyon görünümü.
// Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md

const S = SAHNE;
const ctx = S.tuval(document.getElementById('tuval'), 1); // tane piksel ölçeğinde kalsın diye 1:1
const W = 1024;

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function bez(p0, p1, p2, p3, t) { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; }

// ------------------------------------------------------------------ palet (8 renk)
const C = {
  krem: '#F5EAD6', seftali: '#EFB489', mercan: '#DE6A52', hardal: '#E8A63A',
  zumrut: '#2F9468', petrol: '#154C49', gok: '#8BBBDB', civit: '#3A4D8C',
};
const K = {}; for (const k in C) K[k] = rgb(C[k]);

const Lv = nrm([0.66, -0.6, 0.45]);
const Hv = nrm([Lv[0], Lv[1], Lv[2] + 1]);

// ------------------------------------------------------------------ tane motoru
// Tane: piksel başına beyaz gürültü; ton t ∈ [0,1] → her katman için yoğunluk; gürültü < yoğunluk ise o renk.
let tohum = 3301;
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/**
 * yol: Path2D (kırpma), bb: [x0,y0,x1,y1], alan(X,Y) → t (0 ışık, 1 gölge) ya da nesne,
 * katmanlar: [{renk:[r,g,b], f:(t,X,Y)→yoğunluk}] (sonraki katman öncekinin üstüne)
 */
function tane(yol, bb, alan, katmanlar) {
  const x0 = Math.max(0, Math.floor(bb[0]) - 2), y0 = Math.max(0, Math.floor(bb[1]) - 2);
  const x1 = Math.min(W, Math.ceil(bb[2]) + 2), y1 = Math.min(W, Math.ceil(bb[3]) + 2);
  const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return;
  const c = S.yeniTuval(w, h), m = c.getContext('2d');
  const img = m.createImageData(w, h), d = img.data;
  const sd = [];
  for (let i = 0; i < katmanlar.length; i++) sd.push(++tohum);
  for (let j = 0; j < h; j++) {
    const Y = y0 + j + 0.5;
    for (let i = 0; i < w; i++) {
      const X = x0 + i + 0.5;
      const t = alan(X, Y);
      if (t === null) continue;
      for (let q = katmanlar.length - 1; q >= 0; q--) {
        const kq = katmanlar[q];
        const ds = kq.f(t, X, Y);
        if (ds > 0 && hash(x0 + i, y0 + j, sd[q]) < ds) {
          const k = (j * w + i) * 4; d[k] = kq.renk[0]; d[k + 1] = kq.renk[1]; d[k + 2] = kq.renk[2]; d[k + 3] = 255;
          break;
        }
      }
    }
  }
  m.putImageData(img, 0, 0);
  ctx.save();
  if (yol) ctx.clip(yol);
  ctx.drawImage(c, x0, y0);
  ctx.restore();
}
const dolgu = (yol, renk) => { ctx.fillStyle = renk; ctx.fill(yol); };
const P2 = (d) => new Path2D(d);
// yoğunluk eğrileri
const aralik = (a, b, ust) => (t) => smooth(a, b, t) * (ust === undefined ? 1 : ust);

// yardımcı normaller
function donel(X, cx, r, dr) {
  const x = X - cx; const u = clamp(x / Math.max(r, 0.001), -1, 1); const z = Math.sqrt(1 - u * u) * r;
  return nrm([x, -r * dr, z]);
}
const ndl = (n) => n[0] * Lv[0] + n[1] * Lv[1] + n[2] * Lv[2];
const ndh = (n) => n[0] * Hv[0] + n[1] * Hv[1] + n[2] * Hv[2];
function profil(fn, n) {
  const pts = []; for (let i = 0; i <= n; i++) pts.push(fn(i / n)); pts.sort((a, b) => a[0] - b[0]);
  const y0 = pts[0][0], y1 = pts[pts.length - 1][0], st = 0.25; const m = Math.ceil((y1 - y0) / st) + 1;
  const R = new Float32Array(m); let k = 0;
  for (let i = 0; i < m; i++) { const y = y0 + i * st; while (k < pts.length - 2 && pts[k + 1][0] < y) k++; const a = pts[k], b = pts[k + 1]; const t = b[0] - a[0] ? clamp((y - a[0]) / (b[0] - a[0])) : 0; R[i] = a[1] + (b[1] - a[1]) * t; }
  const D = new Float32Array(m); for (let i = 0; i < m; i++) { const a = Math.max(0, i - 2), b = Math.min(m - 1, i + 2); D[i] = (R[b] - R[a]) / ((b - a) * st); }
  const idx = (y) => clamp((y - y0) / st, 0, m - 1);
  return { r(y) { const f = idx(y), i = Math.floor(f), t = f - i; return i >= m - 1 ? R[m - 1] : R[i] * (1 - t) + R[i + 1] * t; }, dr(y) { const f = idx(y), i = Math.floor(f), t = f - i; return i >= m - 1 ? D[m - 1] : D[i] * (1 - t) + D[i + 1] * t; } };
}
// taş için iki kademeli gölge taneleri (şeftali → çivit), yeşil için petrol, altın için mercan
const TAS = [{ renk: K.seftali, f: aralik(0.08, 0.62, 0.95) }, { renk: K.civit, f: aralik(0.55, 1.1, 0.55) }];
const YESIL = [{ renk: K.krem, f: (t) => (t < -0.12 ? Math.min(0.42, (-t - 0.12) * 1.4) : 0) }, { renk: K.petrol, f: aralik(0.05, 0.95, 0.92) }];
const ALTIN = [{ renk: K.krem, f: (t) => (t < 0 ? Math.min(0.75, -t * 2.2) : 0) }, { renk: K.mercan, f: aralik(0.15, 0.95, 0.9) }];

// ================================================================== gök, güneş, bulutlar
function gok() {
  ctx.fillStyle = C.gok; ctx.fillRect(0, 0, W, 800);
  tane(null, [0, 0, W, 800], (X, Y) => {
    const ds = Math.hypot(X - 880, Y - 140);
    return { y: Y, ds };
  }, [
    { renk: K.civit, f: (t) => 0.78 * Math.pow(clamp(1 - t.y / 560), 1.5) * smooth(60, 330, t.ds) },
    { renk: K.seftali, f: (t) => 0.8 * smooth(440, 690, t.y) * (1 - smooth(720, 800, t.y) * 0.7) + 0.5 * Math.exp(-(t.ds - 50) / 150) * (t.ds > 50 ? 1 : 0) },
    { renk: K.krem, f: (t) => 0.92 * Math.pow(smooth(620, 800, t.y), 1.5) + 0.7 * Math.exp(-(t.ds - 52) / 70) * (t.ds > 52 ? 1 : 0) },
  ]);
  // güneş
  const g = P2(S.daireYolu(880, 140, 54));
  dolgu(g, C.hardal);
  tane(g, [820, 80, 940, 200], (X, Y) => ((X - 880) * -0.6 + (Y - 140) * 0.7) / 54, [
    { renk: K.krem, f: (t) => clamp(-t * 1.1 - 0.05) * 0.9 },
    { renk: K.mercan, f: (t) => smooth(0.2, 1, t) * 0.7 },
  ]);
}
function bulut(cx, cy, sc) {
  // editoryal bulut: üst üste binen yuvarlak hap biçimleri, düz taban
  const p = new Path2D();
  const parca = [[-70, 0, 60, 24], [-30, -18, 64, 30], [20, -6, 76, 26], [-10, 6, 120, 20]];
  for (const [x, y, w, h] of parca) {
    const X = cx + x * sc, Y = cy + y * sc, ww = w * sc, hh = h * sc;
    p.roundRect(X - ww / 2, Y - hh / 2, ww, hh, hh / 2);
  }
  dolgu(p, C.krem);
  tane(p, [cx - 120 * sc, cy - 40 * sc, cx + 70 * sc, cy + 20 * sc], (X, Y) => (Y - (cy - 30 * sc)) / (46 * sc) - (X - cx) / (260 * sc), [
    { renk: K.gok, f: aralik(0.35, 1.25, 0.85) },
  ]);
}

// ================================================================== zemin
function zemin() {
  ctx.fillStyle = C.seftali; ctx.fillRect(0, 800, W, 224);
  // yapının sola düşen gölgesi
  const golge = (X, Y) => {
    const v = (Y - 800) / 224;
    let sh = 0;
    // kaide dibi ve sola uzanan gölge yamuğu
    const sol = 300 - (Y - 800) * 2.6, sag = 822 - (Y - 800) * 0.9;
    if (Y < 842 && X > sol && X < sag) sh = 0.85 * smooth(842, 800, Y) * smooth(sol, sol + 40, X);
    return { v, sh };
  };
  tane(null, [0, 800, W, 1024], golge, [
    { renk: K.hardal, f: (t) => 0.3 * Math.pow(1 - t.v, 6) * (1 - t.sh) },
    { renk: K.mercan, f: (t) => 0.32 * Math.pow(t.v, 1.8) + t.sh * 0.7 },
  ]);
}

// ================================================================== minare
function minare() {
  const c = S.minare.cx;
  const pr = S.minareParcalari();
  const Pp = (ad) => pr.find((p) => p.ad === ad);
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);
  const silindir = (x1, x2, y1, y2, ek) => {
    const yol = P2(dik(x1, y1, x2, y2)); const R = (x2 - x1) / 2;
    dolgu(yol, C.krem);
    tane(yol, [x1, y1, x2, y2], (X, Y) => {
      let t = 0.62 - ndl(donel(X, c, R, 0)) * 1.05;
      if (ek) t = ek(t, X, Y);
      return t;
    }, TAS);
  };
  const koni = (p) => {
    const q = p.noktalar, yol = P2(S.yol(q, true));
    dolgu(yol, C.krem);
    tane(yol, [c - 54, Math.min(q[0][1], q[1][1]), c + 54, Math.max(q[0][1], q[1][1])], (X) => 0.78 - 0.6 * (X - c + 54) / 108, TAS);
  };
  const korkuluk = (p) => {
    const yol = P2(dik(p.x1, p.y1, p.x2, p.y2)); const R = (p.x2 - p.x1) / 2;
    dolgu(yol, C.krem);
    tane(yol, [p.x1, p.y1, p.x2, p.y2], (X, Y) => {
      let t = 0.55 - ndl(donel(X, c, R, 0)) * 0.9;
      if (Y > p.y1 + 4 && Y < p.y2 - 3) {
        const th = Math.asin(clamp((X - c) / R, -1, 1)); const f = (th + Math.PI / 2) / (Math.PI / 9); const q = f - Math.floor(f) - 0.5;
        if (Math.abs(q) > 0.22) t += 0.55;
      }
      return t;
    }, TAS);
  };
  silindir(c - 34, c + 34, 488, 800, (t, X, Y) => {
    // zikzak bandı: tane yoğunluğuyla oyulmuş şeritler
    if (Y > 520 && Y < 584) {
      let dm = 1e9;
      for (const z of zik) for (let i = 0; i < z.length - 1; i++) {
        const ax = z[i][0], ay = z[i][1], ex = z[i + 1][0] - ax, ey = z[i + 1][1] - ay;
        const u = clamp(((X - ax) * ex + (Y - ay) * ey) / (ex * ex + ey * ey)); const dx = X - ax - ex * u, dy = Y - ay - ey * u;
        dm = Math.min(dm, dx * dx + dy * dy);
      }
      t += 0.75 * Math.exp(-dm / 3.2);
    }
    return t + 0.35 * smooth(488, 470, Y - 10) * 0 + 0.5 * smooth(500, 488, Y);
  });
  koni(Pp('çıkma-1'));
  silindir(c - 54, c + 54, 456, 468, (t, X, Y) => t + 0.4 * smooth(462, 468, Y) - 0.2 * smooth(460, 456, Y));
  korkuluk(Pp('korkuluk-1'));
  silindir(c - 27, c + 27, 316, 436, (t, X, Y) => t + 0.5 * smooth(424, 436, Y) + 0.5 * smooth(328, 316, Y));
  koni(Pp('çıkma-2'));
  silindir(c - 45, c + 45, 290, 300, (t, X, Y) => t + 0.4 * smooth(295, 300, Y));
  korkuluk(Pp('korkuluk-2'));
  silindir(c - 19, c + 19, 206, 272, (t, X, Y) => t + 0.5 * smooth(262, 272, Y) + 0.4 * smooth(214, 206, Y));
  silindir(c - 25, c + 25, 198, 206);
  const tp = profil((t) => [bez(200, 182, 160, 146, t), c - bez(c - 22, c - 34, c - 12, c, t)], 1500);
  const ty = P2(Pp('topuz').yol);
  dolgu(ty, C.krem);
  tane(ty, [c - 27, 144, c + 27, 201], (X, Y) => 0.62 - ndl(donel(X, c, tp.r(Y), tp.dr(Y))) * 1.05, TAS);
  alem(S.alemParcalari(c, 146, 0.62));
  for (const p of S.minarePencereleri) pencere(p);
}
const zik = S.zikzakCizgileri();

function pencere(p) {
  const yol = P2(S.kemerYolu(p.x, p.y, p.w, p.h));
  dolgu(yol, C.petrol);
  // içte: üst kemerden düşen gölge (çivit tane), sol pervazda ışık (zümrüt tane)
  tane(yol, [p.x - p.w / 2, p.y, p.x + p.w / 2, p.y + p.h], (X, Y) => ({ u: (X - (p.x - p.w / 2)) / p.w, v: (Y - p.y) / p.h }), [
    { renk: K.zumrut, f: (t) => 0.75 * smooth(0.22, 0.0, t.u) },
    { renk: K.civit, f: (t) => 0.5 * smooth(0.55, 0.1, t.v) * smooth(0.25, 0.6, t.u) },
  ]);
}

// ================================================================== alem
function alem(a) {
  const el = (cx, cy, r) => (X, Y) => { const x = (X - cx) / r, y = (Y - cy) / r; const q = 1 - x * x - y * y; if (q < 0) return 0.6; const n = nrm([x, y, Math.sqrt(q)]); return 0.55 - ndl(n) * 1.1 - Math.pow(Math.max(0, ndh(n)), 30) * 0.8; };
  const cb = a.cubuk;
  const yc = P2(S.yol([[cb.x1, cb.y1], [cb.x2, cb.y1], [cb.x2, cb.y2], [cb.x1, cb.y2]], true));
  dolgu(yc, C.hardal);
  tane(yc, [cb.x1, cb.y1, cb.x2, cb.y2], (X) => 0.7 - (X - cb.x1) / (cb.x2 - cb.x1), ALTIN);
  for (const k of a.kureler) { const y = P2(S.daireYolu(k.cx, k.cy, k.r)); dolgu(y, C.hardal); tane(y, [k.cx - k.r, k.cy - k.r, k.cx + k.r, k.cy + k.r], el(k.cx, k.cy, k.r), ALTIN); }
  const y = a.yaka; const yy = P2(S.elipsYolu({ cx: y.cx, cy: y.cy, rx: y.rx, ry: y.ry, aci: 0 }));
  dolgu(yy, C.hardal);
  tane(yy, [y.cx - y.rx, y.cy - y.ry, y.cx + y.rx, y.cy + y.ry], (X, Y) => 0.45 - (X - y.cx) / y.rx * 0.5 + (Y - y.cy) / y.ry * 0.4, ALTIN);
  const h = a.hilal; const yh = P2(S.hilalYolu(h.cx, h.cy, h.R));
  dolgu(yh, C.hardal);
  tane(yh, [h.cx - h.R, h.cy - h.R, h.cx + h.R, h.cy + h.R], (X, Y) => 0.35 - (X - h.cx) / h.R * 0.55 + (Y - h.cy) / h.R * 0.3, ALTIN);
}

// ================================================================== kaide
function kaide() {
  const Kd = S.kaide, kr = Kd.kornis;
  const yol = P2(S.yollar().kaide);
  dolgu(yol, C.krem);
  tane(yol, [Kd.x1, Kd.y1, Kd.x2, Kd.y2], (X, Y) => {
    let t = 0.3 - (X - Kd.x1) / (Kd.x2 - Kd.x1) * 0.3;      // sola doğru hafif koyulaşma
    t += 0.85 * smooth(722, 704, Y);                         // kornişin altındaki gölge
    t += 0.35 * smooth(770, 800, Y);                         // zemine yakın
    t += 0.6 * smooth(Kd.x1 + 10, Kd.x1, X);                 // sol köşe
    for (const px of [365, 495, 625, 755]) t += 0.42 * Math.exp(-((X - px - 3) ** 2) / 6) * (X > px ? 1 : 0.3); // pilastr gölgesi
    return t;
  }, TAS);
  for (const p of Kd.pencereler) pencere(p);
  const yk = P2(S.yollar().kornis);
  dolgu(yk, C.krem);
  tane(yk, [kr.x1, kr.y1, kr.x2, kr.y2], (X, Y) => (Y - kr.y1) / (kr.y2 - kr.y1) * 0.8 - 0.05 + 0.4 * smooth(kr.x1 + 30, kr.x1, X), TAS);
}

// ================================================================== kasnak ve kubbe
function kasnakKubbe() {
  for (let k = 1; k >= 0; k--) {
    const q = S.kasnak[k], cx = (q.x1 + q.x2) / 2, R = (q.x2 - q.x1) / 2;
    const yol = P2(S.yol([[q.x1, q.y1], [q.x2, q.y1], [q.x2, q.y2], [q.x1, q.y2]], true));
    dolgu(yol, C.zumrut);
    tane(yol, [q.x1, q.y1, q.x2, q.y2], (X, Y) => {
      const n = donel(X, cx, R, 0);
      let t = 0.5 - ndl(n) * 1.0 - Math.pow(Math.max(0, ndh(n)), 60) * 0.7;
      t += 0.8 * smooth(q.y1 + 12, q.y1, Y);                 // üstteki kattan düşen gölge
      t += 0.35 * smooth(q.y2 - 8, q.y2, Y);
      return t - 0.04;
    }, YESIL);
    for (const p of S.kasnakPencereleri(k)) pencere(p);
  }
  const kp = profil((t) => [bez(555, 430, 318, 300, t), 560 - bez(360, 358, 440, 560, t)], 4000);
  const DIL = Math.PI / 16;
  const yol = P2(S.kubbeYolu);
  dolgu(yol, C.zumrut);
  tane(yol, [358, 298, 762, 556], (X, Y) => {
    const r = kp.r(Y), dr = kp.dr(Y);
    const n = donel(X, 560, r, dr);
    const phi = Math.asin(clamp((X - 560) / Math.max(r, 0.01), -1, 1));
    const f = (phi + Math.PI / 2) / DIL; const g = f - Math.floor(f);   // dilim içi konum: 0 sol kenar → 1 sağ kenar
    let t = 0.42 - ndl(n) * 1.05;
    t += (0.42 * Math.pow(1 - g, 2.2) - 0.08) * smooth(6, 50, r);         // her dilim solundaki kaburgaya doğru koyulaşır
    t -= Math.pow(Math.max(0, ndh(n)), 40) * 0.75;                        // parlak bölge: krem tane
    t += 0.7 * smooth(536, 556, Y);                                       // kasnakla birleşim
    return t;
  }, YESIL);
  alem(S.alemParcalari(560, 300, 1));
}

// ================================================================== bitkiler
function bitkiler() {
  const B = S.bitki;
  for (const sp of B.saplar) {
    const yolS = S.yol(sp);
    ctx.save(); ctx.strokeStyle = C.zumrut; ctx.lineWidth = 4.4; ctx.lineCap = 'round'; ctx.stroke(P2(yolS)); ctx.restore();
  }
  for (const y of B.yapraklar) {
    const L = y.uzunluk, Wd = L * y.genislik, ca = Math.cos(y.aci), sa = Math.sin(y.aci);
    const yol = P2(S.yaprakYolu(y));
    dolgu(yol, C.zumrut);
    // orta damarın ışığa göre karşı yarısı gölgede
    const yan = Math.sign(-sa * Lv[0] + ca * Lv[1]) || 1;
    tane(yol, [Math.min(y.x, y.x + ca * L) - Wd, Math.min(y.y, y.y + sa * L) - Wd, Math.max(y.x, y.x + ca * L) + Wd, Math.max(y.y, y.y + sa * L) + Wd], (X, Y) => {
      const dx = X - y.x, dy = Y - y.y; const u = (dx * ca + dy * sa) / L, v = -dx * sa + dy * ca;
      let t = v * yan > 0 ? 0.62 + 0.1 * Math.min(1, Math.abs(v) / (Wd * 0.3)) : 0.12 - 0.25 * Math.min(1, Math.abs(v) / (Wd * 0.3));
      t += 0.35 * smooth(0.25, 0, u) - 0.2 * smooth(0.6, 1, u);
      return t;
    }, [{ renk: K.hardal, f: (t) => (t < 0.05 ? clamp((0.05 - t) * 2.2) * 0.85 : 0) }, { renk: K.petrol, f: aralik(0.2, 1.0, 0.9) }]);
  }
  for (const t of B.tomurcuklar) {
    const yol = P2(S.tomurcukYolu(t)); const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
    dolgu(yol, C.mercan);
    tane(yol, [t.x - 2 * t.r, t.y - 2 * t.r, t.x + 2 * t.r, t.y + 2 * t.r], (X, Y) => {
      const u = ((X - t.x) * ca + (Y - t.y) * sa) / t.r; const v = (-(X - t.x) * sa + (Y - t.y) * ca) / t.r;
      return { u, s: 0.5 - (X - t.x) / t.r * 0.5 };
    }, [{ renk: K.seftali, f: (q) => smooth(0.2, -0.6, q.s) * 0.8 }, { renk: K.zumrut, f: (q) => smooth(-0.15, -0.6, q.u) * 0.95 }]);
  }
  for (const c of B.cicekler) {
    for (const e of S.tacYapraklari(c)) {
      const yol = P2(S.elipsYolu(e));
      dolgu(yol, C.krem);
      tane(yol, [e.cx - e.rx, e.cy - e.rx, e.cx + e.rx, e.cy + e.rx], (X, Y) => {
        const rx = X - c.x, ry = Y - c.y, rr = Math.hypot(rx, ry) / c.r;
        // taç yaprak hafif çanak: merkeze yakın ve ışığa sırtı dönük taraf gölgede
        const yon = (rx * Lv[0] + ry * Lv[1]) / (Math.hypot(rx, ry) || 1);
        const dxe = X - e.cx, dye = Y - e.cy; const kenar = ((dxe * Math.cos(e.aci) + dye * Math.sin(e.aci)) / e.rx) ** 2 + ((-dxe * Math.sin(e.aci) + dye * Math.cos(e.aci)) / e.ry) ** 2;
        return { rr, s: 0.32 + 0.38 * yon + 0.3 * smooth(0.55, 1, kenar) * (yon > -0.2 ? 1 : 0.4) };
      }, [
        { renk: K.seftali, f: (q) => smooth(0.25, 0.85, q.s) * 0.75 },
        { renk: K.mercan, f: (q) => smooth(0.45, 0.1, q.rr) * 0.85 },
      ]);
    }
    const rc = c.r * 0.22; const yo = P2(S.daireYolu(c.x, c.y, rc));
    dolgu(yo, C.hardal);
    tane(yo, [c.x - rc, c.y - rc, c.x + rc, c.y + rc], (X, Y) => 0.45 - (X - c.x) / rc * 0.4 + (Y - c.y) / rc * 0.4, ALTIN);
    ctx.fillStyle = C.mercan;
    for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2 + c.aci; ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * c.r * 0.3, c.y + Math.sin(a) * c.r * 0.3, Math.max(1.2, c.r * 0.04), 0, 7); ctx.fill(); }
  }
}

// ================================================================== her yerde ince tane (tek renkli ışıklılık gürültüsü)
function genelTane() {
  const img = ctx.getImageData(0, 0, W, W), d = img.data;
  for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) {
    const k = (j * W + i) * 4;
    const n = (hash(i, j, 99) - 0.5) * 18;
    d[k] += n; d[k + 1] += n; d[k + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}
