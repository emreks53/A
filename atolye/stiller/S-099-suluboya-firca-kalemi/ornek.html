<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-099 Suluboya Fırça Kalemi — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fffefb; }
  canvas { display: block; width: 1024px; height: 1024px; }
  svg.olcum { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<svg class="olcum" xmlns="http://www.w3.org/2000/svg"><path id="olcu" d="M0,0"/></svg>
<script src="../../sahne/sahne.js"></script>
<script>
// S-099 Suluboya Fırça Kalemi — su bazlı fırça uçlu kalemlerle canlı, damarlı darbeler; su fırçasıyla
// çekilen yerlerde darbeler erir, renkler birbirine geçen sulu geçişlere döner. Ayrıntılar fırça ucunun keskin
// ince darbeleriyle; siyah mürekkep çizgisi yok (S-064'ten farkı). Beyaz kâğıt üstünde parlak, ferah.
(function () {
  const S = SAHNE;
  const K = 2;
  const PX = 1024 * K;
  const ctx = S.tuval(document.getElementById('tuval'), K);
  const olcu = document.getElementById('olcu');

  // ------------------------------------------------------------ yardımcılar
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const G = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) G[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255, X1 = (X + 1) & 255, Y1 = (Y + 1) & 255;
      const a = G[(Y << 8) | X], b = G[(Y << 8) | X1], c = G[(Y1 << 8) | X], d = G[(Y1 << 8) | X1];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(31), n2 = gurultu(32), n3 = gurultu(33);
  const P = (d) => new Path2D(d);
  const kutu = (x1, y1, x2, y2) => `M${x1},${y1} L${x2},${y1} L${x2},${y2} L${x1},${y2} Z`;
  const yeni = () => {
    const c = S.yeniTuval(PX, PX);
    const h = c.getContext('2d');
    h.setTransform(K, 0, 0, K, 0, 0);
    h.lineJoin = 'round';
    h.lineCap = 'round';
    return { c, h };
  };
  const temizle = (h) => {
    h.save();
    h.setTransform(1, 0, 0, 1, 0, 0);
    h.globalCompositeOperation = 'source-over';
    h.globalAlpha = 1;
    h.filter = 'none';
    h.clearRect(0, 0, PX, PX);
    h.restore();
  };
  function noktala(d, adim) {
    olcu.setAttribute('d', d);
    const L = olcu.getTotalLength();
    const n = Math.max(4, Math.ceil(L / adim));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = olcu.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    return pts;
  }
  /** Bezier/eğri yerine düzgün nokta dizisi: kontrol noktalarından Catmull-Rom. */
  function egri(kontrol, adim) {
    const out = [];
    const n = kontrol.length;
    for (let i = 0; i < n - 1; i++) {
      const p0 = kontrol[Math.max(0, i - 1)], p1 = kontrol[i], p2 = kontrol[i + 1], p3 = kontrol[Math.min(n - 1, i + 2)];
      const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const m = Math.max(2, Math.ceil(L / (adim || 3)));
      for (let k = 0; k < m; k++) {
        const t = k / m, t2 = t * t, t3 = t2 * t;
        out.push([
          0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ]);
      }
    }
    out.push(kontrol[n - 1]);
    return out;
  }

  // ------------------------------------------------------------ fırça kalemi darbesi
  const A = yeni(); // keskin darbeler
  const Bk = yeni(); // eritilmiş (su fırçası) kopya
  const Mk = yeni(); // birleştirme
  let dTohum = 1;
  /**
   * Bir fırça kalemi darbesi: basınçla kalınlaşan, sonunda incelen şerit; içinde fırça lifi damarları
   * (ince açık çizgiler) ve kenarda hafif koyu birikim. o.profil: 'yaprak' (iki ucu sivri), 'darbe' (başta bas, sonda kaldır).
   */
  function darbe(h, pts, w, renk, alfa, o) {
    o = o || {};
    if (pts.length < 2) return;
    // seyrek noktaları sık örnekle (genişlik profili düzgün çıksın)
    {
      const yeniPts = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
        const m = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 2));
        for (let k = 1; k <= m; k++) yeniPts.push([ax + ((bx - ax) * k) / m, ay + ((by - ay) * k) / m]);
      }
      pts = yeniPts;
    }
    const n = pts.length;
    const faz = dTohum++ * 1.37;
    const L = [0];
    for (let i = 1; i < n; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const top = L[n - 1] || 1;
    const sol = [], sag = [], nor = [];
    for (let i = 0; i < n; i++) {
      const t = L[i] / top;
      let p;
      if (o.profil === 'yaprak') p = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, t))), 0.75);
      else if (o.profil === 'duz') p = 1;
      else if (o.profil === 'kemer') p = t < 0.6 ? 1 : Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.6) / 0.4, 1.6)));
      else p = (0.55 + 0.45 * Math.min(1, t / 0.1)) * (t > 0.6 ? Math.max(0.12, 1 - (t - 0.6) / 0.4 * 0.88) : 1);
      p = Math.max(o.profil === 'yaprak' || o.profil === 'kemer' ? 0.04 : 0.12, p) * (1 + (n1(faz + L[i] * 0.02, faz) - 0.5) * 0.25);
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
      const nx = -dy / m, ny = dx / m;
      nor.push([nx, ny, (w * p) / 2]);
      sol.push([pts[i][0] + nx * (w * p) / 2, pts[i][1] + ny * (w * p) / 2]);
      sag.push([pts[i][0] - nx * (w * p) / 2, pts[i][1] - ny * (w * p) / 2]);
    }
    const yol = new Path2D();
    sol.forEach(([x, y], i) => (i ? yol.lineTo(x, y) : yol.moveTo(x, y)));
    // uçta yuvarlak (fırça ucunun kalkışı)
    {
      const [nx, ny, r] = nor[n - 1];
      const a0 = Math.atan2(ny, nx);
      yol.arc(pts[n - 1][0], pts[n - 1][1], Math.max(0.01, r), a0, a0 - Math.PI, true);
    }
    for (let i = n - 1; i >= 0; i--) yol.lineTo(sag[i][0], sag[i][1]);
    // başta yuvarlak (basılan fırça ucu); kemerli pencerede taban düz kalır
    if (o.profil !== 'kemer') {
      const [nx, ny, r] = nor[0];
      const a0 = Math.atan2(-ny, -nx);
      yol.arc(pts[0][0], pts[0][1], Math.max(0.01, r), a0, a0 - Math.PI, true);
    }
    yol.closePath();
    h.save();
    h.globalCompositeOperation = 'multiply';
    h.globalAlpha = alfa;
    h.fillStyle = renk;
    h.fill(yol);
    // kenarda mürekkep birikimi
    h.globalAlpha = alfa * 0.35;
    h.strokeStyle = renk;
    h.lineWidth = Math.max(0.6, w * 0.06);
    h.stroke(yol);
    h.restore();
    // lif damarları: şerit içinde ince açık çizgiler (kâğıt beyazı sızar)
    if (w > 4 && o.damar !== false) {
      h.save();
      h.clip(yol);
      h.globalCompositeOperation = 'destination-out';
      const adet = Math.min(7, Math.max(2, Math.round(w / 5)));
      for (let k = 0; k < adet; k++) {
        const v = (k + 0.5) / adet - 0.5 + (n2(faz * 3 + k, 1) - 0.5) * 0.12;
        h.globalAlpha = 0.12 + n2(faz + k * 3.1, 5) * 0.22;
        h.lineWidth = Math.max(0.5, w * (0.04 + n3(faz + k, 2) * 0.05));
        h.beginPath();
        for (let i = 0; i < n; i++) {
          const x = pts[i][0] + nor[i][0] * nor[i][2] * 2 * v, y = pts[i][1] + nor[i][1] * nor[i][2] * 2 * v;
          i ? h.lineTo(x, y) : h.moveTo(x, y);
        }
        h.stroke();
      }
      h.restore();
    }
  }

  /**
   * Bir bölgenin darbelerini çiz, su fırçasıyla erit, ana resme bas.
   * ciz(h): darbeleri A'ya çizer. keskin(h): A'da keskin kalacak yerin maskesini çizer (alfa = keskinlik).
   * o.bulanik: erime yarıçapı, o.su: erimiş kısmın gücü, o.kirp: bölge kırpması (Path2D).
   */
  function bolge(ciz, keskin, o) {
    o = o || {};
    temizle(A.h);
    temizle(Bk.h);
    temizle(Mk.h);
    A.h.save();
    ciz(A.h);
    A.h.restore();
    // eritilmiş kopya: bulanık, biraz açılmış
    Bk.h.save();
    Bk.h.setTransform(1, 0, 0, 1, 0, 0);
    Bk.h.filter = `blur(${(o.bulanik || 10) * K}px)`;
    Bk.h.globalAlpha = o.su === undefined ? 0.85 : o.su;
    Bk.h.drawImage(A.c, 0, 0);
    if (o.bulanik2) {
      Bk.h.filter = `blur(${o.bulanik2 * K}px)`;
      Bk.h.globalAlpha = 0.5;
      Bk.h.drawImage(A.c, 0, 0);
    }
    Bk.h.restore();
    // keskin kısım: maske ile
    if (keskin) {
      Mk.h.save();
      keskin(Mk.h);
      Mk.h.restore();
      A.h.save();
      A.h.setTransform(1, 0, 0, 1, 0, 0);
      A.h.globalCompositeOperation = 'destination-in';
      A.h.drawImage(Mk.c, 0, 0);
      A.h.restore();
      // erimiş kısım keskin yerde zayıflar
      Bk.h.save();
      Bk.h.setTransform(1, 0, 0, 1, 0, 0);
      Bk.h.globalCompositeOperation = 'destination-out';
      Bk.h.globalAlpha = 0.85;
      Bk.h.drawImage(Mk.c, 0, 0);
      Bk.h.restore();
    }
    Bk.h.save();
    Bk.h.setTransform(1, 0, 0, 1, 0, 0);
    Bk.h.drawImage(A.c, 0, 0);
    Bk.h.restore();
    if (o.kirp) {
      Bk.h.save();
      Bk.h.globalCompositeOperation = 'destination-in';
      Bk.h.filter = `blur(${(o.kirpYumusak || 1.5) * K}px)`;
      Bk.h.fill(o.kirp);
      Bk.h.restore();
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(Bk.c, 0, 0);
    ctx.restore();
  }
  /** Beyaz bırakma: önceki boyayı yumuşakça kaldırır (çiçek, bulut, ışık) — boyanmamış kâğıt. */
  function beyazBirak(yol, yumusak) {
    ctx.save();
    ctx.filter = `blur(${(yumusak || 1) * K}px)`;
    ctx.fillStyle = '#FFFEFB';
    ctx.fill(yol);
    ctx.restore();
  }

  // ------------------------------------------------------------ palet (fırça kalemi renkleri)
  const C = {
    kagit: '#FFFEFB',
    turkuaz: '#18B4D8',
    mavi: '#3B6FE0',
    mor: '#8B62D9',
    pembe: '#F0629E',
    eflatun: '#C55BC8',
    sari: '#FFD23A',
    turuncu: '#FF9A2E',
    zumrut: '#0E9C6A',
    yesil: '#2FB24E',
    cimen: '#7ACB3A',
    limon: '#C8E64A',
    camgobegi: '#3FC6C2',
    lacivert: '#2C4FA8',
    seftali: '#FFB98A',
    kum: '#F6C25E',
    lila: '#B9A6EE',
    gul: '#F48FB8',
    kahve: '#B0703E',
  };

  // ------------------------------------------------------------ gök
  {
    const rr = S.rng(101);
    bolge(
      (h) => {
        // üstte yoğun, çapraz fırça kalemi darbeleri: mavi → turkuaz, köşede mor ve pembe
        for (let i = 0; i < 58; i++) {
          const x0 = -80 + rr() * 1100, y0 = -40 + rr() * 330;
          const ang = -0.5 + (rr() - 0.5) * 0.25;
          const Ld = 120 + rr() * 220;
          const k1 = [x0, y0], k2 = [x0 + Math.cos(ang) * Ld * 0.5, y0 + Math.sin(ang) * Ld * 0.5 + (rr() - 0.5) * 18], k3 = [x0 + Math.cos(ang) * Ld, y0 + Math.sin(ang) * Ld];
          const dG = Math.hypot(x0 + Math.cos(ang) * Ld * 0.5 - S.gunes.x, y0 - S.gunes.y);
          if (dG < 230) continue;
          const xr = x0 / 1024;
          const renk = xr < 0.22 && y0 < 150 && rr() < 0.4 ? C.lila : xr > 0.55 && rr() < 0.3 ? C.camgobegi : rr() < 0.38 ? C.mavi : C.turkuaz;
          darbe(h, egri([k1, k2, k3], 3), 18 + rr() * 12, renk, 0.42 + rr() * 0.22);
        }
        // aşağıda seyrek, açık darbeler (ufka doğru)
        for (let i = 0; i < 30; i++) {
          const x0 = -60 + rr() * 1100, y0 = 300 + rr() * 380;
          const ang = -0.45 + (rr() - 0.5) * 0.3, Ld = 90 + rr() * 150;
          if (Math.hypot(x0 - S.gunes.x, y0 - S.gunes.y) < 260) continue;
          darbe(h, egri([[x0, y0], [x0 + Math.cos(ang) * Ld, y0 + Math.sin(ang) * Ld]], 3), 14 + rr() * 10, rr() < 0.25 ? C.lila : C.turkuaz, 0.28 + rr() * 0.15);
        }
      },
      (m) => {
        // keskin kalan yer: üst kenar boyunca yer yer (darbe uçları), aşağısı su ile erimiş
        const g = m.createLinearGradient(0, 0, 0, 520);
        g.addColorStop(0, 'rgba(0,0,0,0.95)');
        g.addColorStop(0.3, 'rgba(0,0,0,0.6)');
        g.addColorStop(0.55, 'rgba(0,0,0,0.12)');
        g.addColorStop(1, 'rgba(0,0,0,0.05)');
        m.fillStyle = g;
        m.fillRect(0, 0, 1024, 1024);
        // gürültülü lekelerle bazı yerleri eritilmiş bırak
        m.globalCompositeOperation = 'destination-out';
        for (let i = 0; i < 26; i++) {
          const x = rr() * 1024, y = rr() * 360, r = 50 + rr() * 90;
          const gg = m.createRadialGradient(x, y, 0, x, y, r);
          gg.addColorStop(0, 'rgba(0,0,0,0.85)');
          gg.addColorStop(1, 'rgba(0,0,0,0)');
          m.fillStyle = gg;
          m.fillRect(x - r, y - r, 2 * r, 2 * r);
        }
      },
      { bulanik: 14, bulanik2: 40, su: 0.8 }
    );
  }
  // su fırçasıyla aşağı çekilmiş gök: darbelerin rengi yumuşak, yer yer çizgili bir geçişe döner
  {
    const rr = S.rng(111);
    bolge(
      (h) => {
        for (let i = 0; i < 56; i++) {
          const y0 = 20 + rr() * 600, x0 = -100 + rr() * 900, Ld = 260 + rr() * 380;
          const ang = -0.38 + (rr() - 0.5) * 0.2;
          const x1 = x0 + Math.cos(ang) * Ld, y1 = y0 + Math.sin(ang) * Ld;
          const dG = Math.min(Math.hypot((x0 + x1) / 2 - S.gunes.x, (y0 + y1) / 2 - S.gunes.y), Math.hypot(x1 - S.gunes.x, y1 - S.gunes.y));
          if (dG < 250) continue;
          const kuv = Math.max(0.3, 1 - y0 / 700);
          const renk = x0 < 250 && rr() < 0.4 ? C.lila : rr() < 0.55 ? C.turkuaz : C.mavi;
          darbe(h, egri([[x0, y0], [(x0 + x1) / 2, (y0 + y1) / 2 + (rr() - 0.5) * 20], [x1, y1]], 4), 40 + rr() * 40, renk, 0.12 + 0.3 * kuv, { profil: 'yaprak' });
        }
      },
      null,
      { bulanik: 13, bulanik2: 5, su: 0.9 }
    );
  }
  // gökün ortası: açık renk kalemle çekilmiş, çoğu keskin kalmış seyrek darbeler (ufka doğru açılan gök
  // boş bir pus gibi değil, yine fırça kalemi darbeleriyle okunur)
  {
    const rr = S.rng(121);
    bolge(
      (h) => {
        for (let i = 0; i < 34; i++) {
          const x0 = -80 + rr() * 1100, y0 = 250 + rr() * 380;
          const ang = -0.42 + (rr() - 0.5) * 0.22, Ld = 110 + rr() * 170;
          const xm = x0 + Math.cos(ang) * Ld * 0.5, ym = y0 + Math.sin(ang) * Ld * 0.5;
          if (Math.hypot(xm - S.gunes.x, ym - S.gunes.y) < 280) continue;
          const renk = x0 < 300 && rr() < 0.35 ? C.lila : rr() < 0.3 ? C.camgobegi : C.turkuaz;
          const k1 = [x0, y0], k3 = [x0 + Math.cos(ang) * Ld, y0 + Math.sin(ang) * Ld];
          const k2 = [xm, ym + (rr() - 0.5) * 14];
          darbe(h, egri([k1, k2, k3], 3), 15 + rr() * 10, renk, (0.26 + rr() * 0.14) * Math.max(0.55, 1 - (y0 - 250) / 500));
        }
      },
      (m) => {
        m.fillStyle = 'rgba(0,0,0,0.8)';
        m.fillRect(0, 0, 1024, 1024);
        m.globalCompositeOperation = 'destination-out';
        for (let i = 0; i < 14; i++) {
          const x = rr() * 1024, y = 260 + rr() * 360, r = 50 + rr() * 70;
          const gg = m.createRadialGradient(x, y, 0, x, y, r);
          gg.addColorStop(0, 'rgba(0,0,0,0.8)');
          gg.addColorStop(1, 'rgba(0,0,0,0)');
          m.fillStyle = gg;
          m.fillRect(x - r, y - r, 2 * r, 2 * r);
        }
      },
      { bulanik: 9, su: 0.85 }
    );
  }
  // güneş: sarı ve turuncu dairesel darbeler, ortası suyla açılmış
  {
    const GX = S.gunes.x, GY = S.gunes.y;
    const rr = S.rng(77);
    bolge(
      (h) => {
        for (let i = 0; i < 14; i++) {
          const a0 = rr() * Math.PI * 2, span = 1.6 + rr() * 1.6, r = 22 + rr() * 30;
          const pts = [];
          for (let a = a0; a <= a0 + span; a += 0.08) pts.push([GX + Math.cos(a) * r, GY + Math.sin(a) * r]);
          darbe(h, pts, 16 + rr() * 8, i < 10 ? C.sari : C.turuncu, 0.75);
        }
        for (let i = 0; i < 12; i++) {
          const a0 = rr() * Math.PI * 2, span = 0.9 + rr() * 1.2, r = 62 + rr() * 40;
          const pts = [];
          for (let a = a0; a <= a0 + span; a += 0.06) pts.push([GX + Math.cos(a) * r, GY + Math.sin(a) * r]);
          darbe(h, pts, 12 + rr() * 8, i % 3 ? C.sari : C.seftali, 0.35);
        }
      },
      (m) => {
        const g = m.createRadialGradient(GX, GY, 30, GX, GY, 64);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.7, 'rgba(0,0,0,0.9)');
        g.addColorStop(1, 'rgba(0,0,0,0.9)');
        m.fillStyle = g;
        m.fillRect(GX - 140, GY - 140, 280, 280);
      },
      { bulanik: 12, bulanik2: 36, su: 0.9 }
    );
  }
  // bulutlar: boyanmamış kâğıt; altlarında lila-mavi, suyla yumuşamış tek darbe
  {
    const rb = S.rng(3);
    const bulutlar = [
      [170, 250, 1.0],
      [500, 150, 0.8],
      [760, 330, 1.1],
      [940, 470, 0.7],
      [90, 470, 0.7],
    ];
    const yollar = [];
    for (const [bx, by, bs] of bulutlar) {
      const yol = new Path2D();
      for (let i = 0; i < 7; i++) {
        const x = bx + (rb() - 0.5) * 140 * bs, y = by + (rb() - 0.5) * 20 * bs - 6 * bs, r = (22 + rb() * 18) * bs;
        yol.moveTo(x + r, y);
        yol.arc(x, y, r, 0, Math.PI * 2);
      }

  // tomurcuklar
  bolge(
    (h) => {
      for (const t of B.tomurcuklar) {
        const ca = Math.cos(t.aci), sa = Math.sin(t.aci);
        darbe(h, [[t.x - ca * t.r * 0.8, t.y - sa * t.r * 0.8], [t.x + ca * t.r * 1.6, t.y + sa * t.r * 1.6]], t.r * 1.6, C.pembe, 0.8, { profil: 'yaprak' });
        darbe(h, [[t.x - ca * t.r * 0.8, t.y - sa * t.r * 0.8], [t.x + ca * t.r * 0.3, t.y + sa * t.r * 0.3]], t.r * 1.0, C.yesil, 0.7, { profil: 'yaprak', damar: false });
      }
    },
    null,
    { bulanik: 1, su: 0 }
  );
  // çiçekler: beyaz kâğıt taç yaprak; dipte pembe-eflatun darbe, suyla kenara doğru çekilmiş
  {
    const tacYol = new Path2D();
    for (const c of B.cicekler) for (const e of S.tacYapraklari(c)) tacYol.addPath(P(S.elipsYolu(e)));
    beyazBirak(tacYol, 0.9);
    bolge(
      (h) => {
        for (const c of B.cicekler) {
          for (const e of S.tacYapraklari(c)) {
            const ca = Math.cos(e.aci), sa = Math.sin(e.aci);
            const u0 = c.r * 0.12, u1 = c.r * 0.52;
            darbe(h, [[c.x + ca * u0, c.y + sa * u0], [c.x + ca * u1, c.y + sa * u1]], c.r * 0.42, C.gul, 0.55, { profil: 'darbe' });
            darbe(h, [[c.x + ca * u0, c.y + sa * u0], [c.x + ca * c.r * 0.3, c.y + sa * c.r * 0.3]], c.r * 0.24, C.pembe, 0.32, { profil: 'darbe' });
          }
        }
      },
      (m) => {
        for (const c of B.cicekler) {
          const g = m.createRadialGradient(c.x, c.y, c.r * 0.12, c.x, c.y, c.r * 0.5);
          g.addColorStop(0, 'rgba(0,0,0,0.9)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          m.fillStyle = g;
          m.fillRect(c.x - c.r, c.y - c.r, 2 * c.r, 2 * c.r);
        }
      },
      { bulanik: 6, bulanik2: 12, su: 0.95, kirp: tacYol, kirpYumusak: 0.6 }
    );
    // taç yaprak kenarları: fırça ucuyla ince gül pembesi, yer yer kesik
    bolge(
      (h) => {
        const rr = S.rng(808);
        for (const c of B.cicekler) {
          for (const e of S.tacYapraklari(c)) {
            const pts = noktala(S.elipsYolu(e), 2);
            const n = pts.length;
            // dış yayın bir bölümü (yaprak ucu çevresi)
            const bas = Math.floor(n * (0.82 + rr() * 0.1)), uz = Math.floor(n * (0.3 + rr() * 0.15));
            const yay = [];
            for (let k = 0; k < uz; k++) yay.push(pts[(bas + k) % n]);
            darbe(h, yay, Math.max(1.6, c.r * 0.05), C.gul, 0.65, { profil: 'yaprak', damar: false });
          }
          // göbek: sarı daire darbesi, turuncu nokta dokunuşları
          const pts = [];
          for (let t = 0; t <= Math.PI * 2.2; t += 0.25) pts.push([c.x + Math.cos(t) * c.r * 0.1, c.y + Math.sin(t) * c.r * 0.1]);
          darbe(h, pts, c.r * 0.26, C.sari, 0.95, { profil: 'duz', damar: false });
          for (let k = 0; k < 9; k++) {
            const a = (k / 9) * Math.PI * 2 + c.aci;
            const px = c.x + Math.cos(a) * c.r * 0.27, py = c.y + Math.sin(a) * c.r * 0.27;
            darbe(h, [[px - Math.cos(a) * 1.5, py - Math.sin(a) * 1.5], [px + Math.cos(a) * 2.5, py + Math.sin(a) * 2.5]], Math.max(2.4, c.r * 0.07), C.turuncu, 0.85, { profil: 'yaprak', damar: false });
          }
        }
      },
      null,
      { bulanik: 1, su: 0 }
    );
  }

  // ------------------------------------------------------------ kâğıt dokusu (sıcak beyaz, hafif tane; sulu yerlerde belirginleşir)
  {
    const im = ctx.getImageData(0, 0, PX, PX);
    const d = im.data;
    const r = S.rng(99);
    for (let y = 0; y < PX; y++) {
      for (let x = 0; x < PX; x++) {
        const i = (y * PX + x) * 4;
        const lum = (d[i] + d[i + 1] + d[i + 2]) / 765;
        const tane = (n3(x * 0.12, y * 0.12) - 0.5) * 10 + (r() - 0.5) * 4;
        const k = 0.4 + (1 - lum) * 1.2;
        d[i] += tane * k;
        d[i + 1] += tane * k;
        d[i + 2] += tane * k;
      }
    }
    ctx.putImageData(im, 0, 0);
  }

  S.hazir();
})();
</script>
