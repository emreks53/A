<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-240 Yeşil Altboya (Verdaccio) — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #fff; }
  #tuval { display: block; width: 1024px; height: 1024px; }

<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-240 Yeşil Altboya (Verdaccio) — hayalî bir ressamın eli. Ortak sahne ve yardımcılar: ../../sahne/SAHNE.md
// Kâğıt, lavi, maske ve yol yardımcıları atölyenin S-161 kitinden uyarlanmıştır; çizim bu dosyanın sonundadır.
(function () {
  'use strict';
  // ================================================================ ortak kit: kâğıt, lavi, yol, ışık
  const N = 1024, NN = N * N, N2 = 2048, NN2 = N2 * N2, PI2 = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function karis(h1, h2, t) { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }
  function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(PI2 * r()); }

  /** Değer gürültüsü (0..1). */
  function gurultu(tohum) {
    const r = SAHNE.rng(tohum);
    const g = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) g[i] = r();
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
      const a = g[x0 + y0], b = g[x1 + y0], c = g[x0 + y1], d = g[x1 + y1];
      const ab = a + (b - a) * sx;
      return ab + (c + (d - c) * sx - ab) * sy;
    };
  }
  function hashF(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /** Kâğıt yükseklik alanı (2048 × 2048, 0..1). o: {tohum, ince:[ölçek,genlik], orta, iri, kum, dokuma(X,Y)} */
  function kagitYap(o) {
    const n1 = gurultu(o.tohum), n2 = gurultu(o.tohum + 1), n3 = gurultu(o.tohum + 2);
    const H = new Float32Array(NN2);
    const [s1, a1] = o.ince, [s2, a2] = o.orta, [s3, a3] = o.iri;
    const kum = o.kum || 0;
    let mn = 1e9, mx = -1e9;
    for (let Y = 0; Y < N2; Y++) {
      for (let X = 0; X < N2; X++) {
        let v = a1 * (0.62 * n1(X / s1, Y / s1) + 0.38 * n1(X / (s1 * 0.47) + 91.3, Y / (s1 * 0.47) + 13.7)) + a2 * n2(X / s2, Y / s2) + a3 * n3(X / s3, Y / s3);
        if (o.dokuma) v += o.dokuma(X, Y);
        if (kum) v += (hashF(X, Y, o.tohum) - 0.5) * kum;
        H[Y * N2 + X] = v;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
    }
    const k = 1 / (mx - mn || 1);
    for (let i = 0; i < NN2; i++) H[i] = (H[i] - mn) * k;
    return H;
  }
  /** 2048 alanı 1024'e indirir (2×2 ortalama). */
  function kucult(H) {
    const h = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = 2 * y * N2 + 2 * x;
      h[y * N + x] = (H[i] + H[i + 1] + H[i + N2] + H[i + N2 + 1]) * 0.25;
    }
    return h;
  }

  /** Kutu bulanıklığı (ayrık, gecis kez), yalnız bb içinde. */
  const _kb1 = new Float32Array(NN), _kb2 = new Float32Array(NN);
  function kutuBulanik(src, r, gecis, bb, hedef) {
    r = Math.max(1, Math.round(r));
    const x0 = bb ? bb.x0 : 0, x1 = bb ? bb.x1 : N - 1, y0 = bb ? bb.y0 : 0, y1 = bb ? bb.y1 : N - 1;
    const a = hedef || new Float32Array(NN);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) a[y * N + x] = src[y * N + x];
    const t = _kb1;
    const inv = 1 / (2 * r + 1);
    for (let g = 0; g < gecis; g++) {
      for (let y = y0; y <= y1; y++) {
        const row = y * N;
        let s = 0;
        for (let k = -r; k <= r; k++) s += a[row + clamp(x0 + k, x0, x1)];
        for (let x = x0; x <= x1; x++) {
          t[row + x] = s * inv;
          s += a[row + Math.min(x1, x + r + 1)] - a[row + Math.max(x0, x - r)];
        }
      }
      for (let x = x0; x <= x1; x++) {
        let s = 0;
        for (let k = -r; k <= r; k++) s += t[clamp(y0 + k, y0, y1) * N + x];
        for (let y = y0; y <= y1; y++) {
          a[y * N + x] = s * inv;
          s += t[Math.min(y1, y + r + 1) * N + x] - t[Math.max(y0, y - r) * N + x];
        }
      }
    }
    return a;
  }

  // ---------------------------------------------------------------- maskeler (1024)
  function sinirla(M) {
    let x0 = N, x1 = -1, y0 = N, y1 = -1;
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) if (M[row + x] > 0.002) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    M.bb = x1 < 0 ? null : { x0, x1, y0, y1 };
    return M;
  }
  const _mc = SAHNE.yeniTuval(N, N);
  const _mx = _mc.getContext('2d', { willReadFrequently: true });
  /** Yol çizen bir işlevden maske (beyaz dolgu/çizgi → 1). */
  function yolMaske(ciz) {
    _mx.setTransform(1, 0, 0, 1, 0, 0);
    _mx.globalCompositeOperation = 'source-over';
    _mx.clearRect(0, 0, N, N);
    _mx.fillStyle = '#fff';
    _mx.strokeStyle = '#fff';
    _mx.lineCap = 'round';
    _mx.lineJoin = 'round';
    ciz(_mx);
    const d = _mx.getImageData(0, 0, N, N).data;
    const M = new Float32Array(NN);
    for (let i = 0; i < NN; i++) M[i] = d[4 * i + 3] / 255;
    return sinirla(M);
  }
  function mIslem(A, B, f) { const M = new Float32Array(NN); for (let i = 0; i < NN; i++) M[i] = f(A[i], B ? B[i] : 0); return sinirla(M); }
  const mEksi = (A, B) => mIslem(A, B, (a, b) => a * (1 - b));
  const mCarp = (A, B) => mIslem(A, B, (a, b) => a * b);
  const mBirles = (A, B) => mIslem(A, B, (a, b) => Math.max(a, b));
  function mFonk(A, f) { const M = new Float32Array(NN); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; if (A[i] > 0) M[i] = A[i] * f(x, y); } return sinirla(M); }

  const BOLGE_AD = Object.keys(SAHNE.BOLGE);
  /** Bitkisiz bölge kimlikleri (yapı, gök, zemin). */
  function bolgeKimlik() {
    const c = SAHNE.yeniTuval(N, N);
    const x = c.getContext('2d', { willReadFrequently: true });
    SAHNE.ciz(x, { bolge: true, cicek: false });
    const d = x.getImageData(0, 0, N, N).data;
    const ids = new Uint8Array(NN);
    const bel = new Map();
    for (let i = 0; i < NN; i++) {
      const key = (d[4 * i] << 16) | (d[4 * i + 1] << 8) | d[4 * i + 2];
      let v = bel.get(key);
      if (v === undefined) { v = BOLGE_AD.indexOf(SAHNE.bolgeAdi(d[4 * i], d[4 * i + 1], d[4 * i + 2])); bel.set(key, v); }
      ids[i] = v;
    }
    return ids;
  }
  function bolgeMaske(ids, adlar, kosul) {
    const set = adlar.map((a) => BOLGE_AD.indexOf(a));
    const M = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (set.includes(ids[i]) && (!kosul || kosul(x, y))) M[i] = 1;
    }
    sinirla(M);
    if (!M.bb) return M;
    const bb = { x0: Math.max(0, M.bb.x0 - 2), x1: Math.min(N - 1, M.bb.x1 + 2), y0: Math.max(0, M.bb.y0 - 2), y1: Math.min(N - 1, M.bb.y1 + 2) };
    const R = kutuBulanik(M, 1, 1, bb);
    return sinirla(R);
  }

  // ---------------------------------------------------------------- lavi (saydam suluboya katmanı, 1024)
  function laviKur(H1, tohum) {
    const a = gurultu(tohum + 21), b = gurultu(tohum + 22), c = gurultu(tohum + 23);
    const dx = new Float32Array(NN), dy = new Float32Array(NN), ak = new Float32Array(NN);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      dx[i] = (a(x / 26, y / 26) - 0.5) * 1.3 + (a(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      dy[i] = (b(x / 26, y / 26) - 0.5) * 1.3 + (b(x / 7 + 40, y / 7 + 40) - 0.5) * 0.7;
      ak[i] = 0.6 * c(x / 70, y / 70) + 0.4 * c(x / 19 + 7, y / 19 + 3);
    }
    return { dx, dy, ak, H: H1, buf: new Float32Array(3 * NN).fill(1), say: 0 };
  }
  /** Aynalı sarma: gürültü haritası kaydırılınca dikiş çıkmasın. */
  const ayna = (v) => { v &= 2047; return v > 1023 ? 2047 - v : v; };
  const _md = new Float32Array(NN), _mb = new Float32Array(NN);
  /** Bir lavi katı: M maskesi, renk; o: guc, kenar (kenarda pigment birikmesi), tane, akis, oyna (kenar titremesi),
   *  kx/ky (kayma), yay (kenar bulanıklık yarıçapı), yumusak (0..1 ıslak kenar), f(x,y) yoğunluk çarpanı. */
  function lavi(L, M, renk, o) {
    o = Object.assign({ guc: 0.5, kenar: 0.5, tane: 0.25, akis: 0.25, oyna: 1.5, kx: 0, ky: 0, yay: 3, yumusak: 0, f: null }, o || {});
    if (!M.bb) return;
    L.say++;
    const ox = (L.say * 197) & 1023, oy = (L.say * 331) & 1023;
    const C = hex(renk).map((v) => 1 - v / 255);
    const pad = Math.ceil(o.oyna + Math.abs(o.kx) + Math.abs(o.ky) + o.yay * 3 + 3);
    const bb = { x0: Math.max(0, M.bb.x0 - pad), x1: Math.min(N - 1, M.bb.x1 + pad), y0: Math.max(0, M.bb.y0 - pad), y1: Math.min(N - 1, M.bb.y1 + pad) };
    const Md = _md;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const j = ayna(y + oy) * N + ayna(x + ox);
      const sx = clamp(x + L.dx[j] * o.oyna - o.kx, 0, N - 1.001), sy = clamp(y + L.dy[j] * o.oyna - o.ky, 0, N - 1.001);
      const ix = Math.floor(sx), iy = Math.floor(sy);
      let v = 0;
      {
        const fx = sx - ix, fy = sy - iy, k = iy * N + ix;
        const a = M[k] + (M[k + 1] - M[k]) * fx, b = M[k + N] + (M[k + N + 1] - M[k + N]) * fx;
        v = a + (b - a) * fy;
      }
      Md[y * N + x] = v;
    }
    const B = o.yay > 0 ? kutuBulanik(Md, o.yay, 2, bb, _mb) : Md;
    const buf = L.buf;
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) {
      const i = y * N + x;
      const m = Md[i], bl = B[i];
      if (m < 0.002 && bl < 0.002) continue;
      const j = ayna(y + oy) * N + ayna(x + ox);
      const base = o.yumusak ? m + (bl - m) * o.yumusak : m;
      let e = m - bl;
      if (e < 0) e = 0;
      let d = base * o.guc * (1 + o.kenar * e * 2.5) * (1 + o.akis * (L.ak[j] - 0.5) * 2) * (1 + o.tane * (0.5 - L.H[i]) * 2);
      if (o.f) d *= o.f(x, y);
      if (d <= 0) continue;
      if (d > 1) d = 1;
      buf[3 * i] *= 1 - d * C[0];
      buf[3 * i + 1] *= 1 - d * C[1];
      buf[3 * i + 2] *= 1 - d * C[2];
    }
    for (let y = bb.y0; y <= bb.y1; y++) for (let x = bb.x0; x <= bb.x1; x++) Md[y * N + x] = 0;
  }

  // ---------------------------------------------------------------- katmanlar ve birleştirme (2048)
  function katman() {
    const c = SAHNE.yeniTuval(N2, N2);
    const x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(2, 0, 0, 2, 0, 0);
    x.lineCap = 'round';
    x.lineJoin = 'round';
    return { c, x };
  }
  /** Son birleştirme: kâğıt rengi × lavi × mürekkep katmanları, kâğıt dokusu kabartması.
   *  o: {ctx, kagit(X,Y,h)→[r,g,b] 0..1, H (2048), L (lavi), katmanlar:[{c, mod:'carp'|'ust', dis(X,Y,h,a)→a}], kabartma, cukur} */
  function birlestir(o) {
    const out = o.ctx.createImageData(N2, N2);
    const od = out.data;
    const H = o.H, buf = o.L ? o.L.buf : null;
    const kat = o.katmanlar.map((k) => ({ d: k.c.getContext('2d').getImageData(0, 0, N2, N2).data, mod: k.mod, dis: k.dis, renk: k.renk }));
    const kab = o.kabartma || 0, cuk = o.cukur || 0;
    for (let Y = 0; Y < N2; Y++) {
      const sy = Math.min(N - 1.001, Math.max(0, (Y + 0.5) / 2 - 0.5));
      const iy = Math.floor(sy), fy = sy - iy;
      for (let X = 0; X < N2; X++) {
        const I = Y * N2 + X;
        const h = H[I];
        let [r, g, b] = o.kagit(X, Y, h);
        if (buf) {
          const sx = Math.min(N - 1.001, Math.max(0, (X + 0.5) / 2 - 0.5));
          const ix = Math.floor(sx), fx = sx - ix;
          const k = iy * N + ix;
          const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
          r *= buf[3 * k] * w00 + buf[3 * k + 3] * w10 + buf[3 * (k + N)] * w01 + buf[3 * (k + N) + 3] * w11;
          g *= buf[3 * k + 1] * w00 + buf[3 * k + 4] * w10 + buf[3 * (k + N) + 1] * w01 + buf[3 * (k + N) + 4] * w11;
          b *= buf[3 * k + 2] * w00 + buf[3 * k + 5] * w10 + buf[3 * (k + N) + 2] * w01 + buf[3 * (k + N) + 5] * w11;
        }
        for (const K of kat) {
          let a = K.d[4 * I + 3] / 255;
          if (a <= 0) continue;
          if (K.dis) a = K.dis(X, Y, h, a, K.d[4 * I], K.d[4 * I + 1], K.d[4 * I + 2]);
          if (a <= 0) continue;
          let cr = K.d[4 * I] / 255, cg = K.d[4 * I + 1] / 255, cb = K.d[4 * I + 2] / 255;
          if (K.renk) { const c = K.renk(X, Y, h, cr, cg, cb); cr = c[0]; cg = c[1]; cb = c[2]; }
          if (K.mod === 'carp') { r *= 1 - a * (1 - cr); g *= 1 - a * (1 - cg); b *= 1 - a * (1 - cb); }
          else { r += (cr - r) * a; g += (cg - g) * a; b += (cb - b) * a; }
        }
        if (kab || cuk) {
          const X1 = X > 1 ? X - 2 : X, Y1 = Y > 1 ? Y - 2 : Y, X2 = X < N2 - 2 ? X + 2 : X, Y2 = Y < N2 - 2 ? Y + 2 : Y;
          const s = 1 + kab * (H[Y1 * N2 + X1] - H[Y2 * N2 + X2]) - cuk * (0.5 - h);
          r *= s; g *= s; b *= s;
        }
        od[4 * I] = r * 255;
        od[4 * I + 1] = g * 255;
        od[4 * I + 2] = b * 255;
        od[4 * I + 3] = 255;
      }
    }
    o.ctx.setTransform(1, 0, 0, 1, 0, 0);
    o.ctx.putImageData(out, 0, 0);
  }

  // ---------------------------------------------------------------- yollar
  /** SVG yolunu (M L C A Z, mutlak) nokta dizilerine çevirir; dizi.kapali bilgisi. */
  function duzlestir(d, adim) {
    adim = adim || 1.5;
    const tok = d.match(/[MLCAZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const out = [];
    let i = 0, k = 'M', cx = 0, cy = 0, sx = 0, sy = 0, cur = null;
    const n = () => parseFloat(tok[i++]);
    const cizgi = (x, y) => {
      const m = Math.max(1, Math.ceil(Math.hypot(x - cx, y - cy) / adim));
      for (let j = 1; j <= m; j++) cur.push([cx + ((x - cx) * j) / m, cy + ((y - cy) * j) / m]);
      cx = x; cy = y;
    };
    while (i < tok.length) {
      if (/^[MLCAZ]$/i.test(tok[i])) k = tok[i++].toUpperCase();
      if (k === 'Z') { if (cur) { if (Math.hypot(cx - sx, cy - sy) > 0.01) cizgi(sx, sy); cur.kapali = true; } cx = sx; cy = sy; cur = null; continue; }
      if (k === 'M') { cx = n(); cy = n(); sx = cx; sy = cy; cur = [[cx, cy]]; cur.kapali = false; out.push(cur); k = 'L'; continue; }
      if (!cur) { cur = [[cx, cy]]; cur.kapali = false; out.push(cur); }
      if (k === 'L') cizgi(n(), n());
      else if (k === 'C') {
        const x1 = n(), y1 = n(), x2 = n(), y2 = n(), x = n(), y = n();
        const L = Math.hypot(x1 - cx, y1 - cy) + Math.hypot(x2 - x1, y2 - y1) + Math.hypot(x - x2, y - y2);
        const m = Math.max(2, Math.ceil(L / adim));
        for (let j = 1; j <= m; j++) {
          const t = j / m, u = 1 - t;
          cur.push([u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);
        }
        cx = x; cy = y;
      } else if (k === 'A') {
        let rx = Math.abs(n()), ry = Math.abs(n());
        const rot = (n() * Math.PI) / 180, fa = n(), fs = n(), x = n(), y = n();
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const ddx = (cx - x) / 2, ddy = (cy - y) / 2;
        const x1p = cr * ddx + sr * ddy, y1p = -sr * ddx + cr * ddy;
        const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
        if (lam > 1) { rx *= Math.sqrt(lam); ry *= Math.sqrt(lam); }
        const num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
        const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
        let co = Math.sqrt(Math.max(0, num / den));
        if (fa === fs) co = -co;
        const cxp = (co * rx * y1p) / ry, cyp = (-co * ry * x1p) / rx;
        const ccx = cr * cxp - sr * cyp + (cx + x) / 2, ccy = sr * cxp + cr * cyp + (cy + y) / 2;
        const ang = (ux, uy, vx, vy) => Math.atan2(ux * vy - uy * vx, ux * vx + uy * vy);
        const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
        let dth = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
        if (!fs && dth > 0) dth -= PI2;
        else if (fs && dth < 0) dth += PI2;
        const m = Math.max(6, Math.ceil((Math.abs(dth) * Math.max(rx, ry)) / adim));
        for (let j = 1; j <= m; j++) {
          const t = th1 + (dth * j) / m;
          cur.push([cr * rx * Math.cos(t) - sr * ry * Math.sin(t) + ccx, sr * rx * Math.cos(t) + cr * ry * Math.sin(t) + ccy]);
        }
        cx = x; cy = y;
      }
    }
    return out;
  }
  function uzunluk(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
  /** Eşit aralıkla yeniden örnekler. */
  function ornekle(p, adim) {
    if (p.length < 2) return p.slice();
    const out = [[p[0][0], p[0][1]]];
    let kalan = adim;
    for (let i = 1; i < p.length; i++) {
      let ax = p[i - 1][0], ay = p[i - 1][1];
      const bx = p[i][0], by = p[i][1];
      let L = Math.hypot(bx - ax, by - ay);
      while (L >= kalan) {
        const t = kalan / L;
        ax += (bx - ax) * t; ay += (by - ay) * t;
        out.push([ax, ay]);
        L -= kalan;
        kalan = adim;
      }
      kalan -= L;
    }
    const s = p[p.length - 1], q = out[out.length - 1];
    if (Math.hypot(s[0] - q[0], s[1] - q[1]) > adim * 0.3) out.push([s[0], s[1]]);
    return out;
  }
  /** Yay uzunluğu s0..s1 aralığındaki parça. */
  function parca(p, s0, s1) {
    const out = [];
    let s = 0;
    for (let i = 1; i < p.length; i++) {
      const L = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = s, b = s + L;
      if (b >= s0 && a <= s1) {
        if (!out.length) { const t = L ? clamp((s0 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); }
        if (b <= s1) out.push([p[i][0], p[i][1]]);
        else { const t = L ? clamp((s1 - a) / L, 0, 1) : 0; out.push([lerp(p[i - 1][0], p[i][0], t), lerp(p[i - 1][1], p[i][1], t)]); break; }
      }
      s = b;
    }
    return out;
  }
  /** Normal boyunca gürültüyle titretir (elin doğal titremesi). */
  function titret(p, gen, dalga, nf, faz) {
    const out = [];
    let s = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const d = gen * (nf(s / dalga + faz, faz * 1.7) - 0.5) * 2;
      out.push([p[i][0] - ty * d, p[i][1] + tx * d]);
    }

  }
  /** Çizgiyi bir koşulun doğru olduğu parçalara böler. */
  function kirp(p, ic) {
    const out = [];
    let cur = null;
    for (const q of p) {
      if (ic(q[0], q[1])) { if (!cur) { cur = []; out.push(cur); } cur.push(q); }
      else cur = null;
    }
    return out.filter((c) => c.length > 1);
  }
  /** Değişken kalınlıklı şerit (normal yönünde), uçları yuvarlak. wf(t) → kalınlık. */
  function serit(x, p, wf) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      const w = wf(i / (n - 1)) / 2;
      L.push([p[i][0] - ty * w, p[i][1] + tx * w]);
      R.push([p[i][0] + ty * w, p[i][1] - tx * w]);
    }
    x.beginPath();
    x.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) x.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath();
    x.fill();
    const w0 = wf(0) / 2, w1 = wf(1) / 2;
    x.beginPath(); x.arc(p[0][0], p[0][1], w0, 0, PI2); x.fill();
    x.beginPath(); x.arc(p[n - 1][0], p[n - 1][1], w1, 0, PI2); x.fill();

  function cizDizi(x, p) { x.beginPath(); x.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) x.lineTo(p[i][0], p[i][1]); }

  // ---------------------------------------------------------------- ışık (sağ üstten)
  const ISIK = (() => { const v = [0.62, 0.5, 0.6]; const l = Math.hypot(...v); return v.map((a) => a / l); })();
  const _kr = (() => {
    const p = SAHNE.kubbeProfili(600);
    const r = new Float32Array(256), dr = new Float32Array(256);
    for (let h = 0; h <= 255; h++) {
      const y = 555 - h;
      let rr = 0;
      for (let i = 0; i < p.length - 1; i++) if (y <= p[i].y && y >= p[i + 1].y) { const t = (p[i].y - y) / (p[i].y - p[i + 1].y || 1); rr = lerp(p[i].r, p[i + 1].r, t); break; }

    }
    for (let h = 0; h <= 255; h++) dr[h] = (r[Math.min(255, h + 1)] - r[Math.max(0, h - 1)]) / (h === 0 || h === 255 ? 1 : 2);

  })();
  function kubbeR(y) { const h = clamp(555 - y, 0, 255); const i = Math.floor(h), f = h - i; return lerp(_kr.r[i], _kr.r[Math.min(255, i + 1)], f); }
  /** Kubbe yüzey normali ve aydınlanma (0..1). */
  function kubbeIsik(x, y) {
    const h = clamp(555 - y, 0, 254.9), i = Math.floor(h);
    const r = Math.max(1, kubbeR(y));
    const u = clamp((x - 560) / r, -1, 1);
    const dr = _kr.dr[i];
    let nr = 1, nh = -dr;
    const l = Math.hypot(nr, nh);
    nr /= l; nh /= l;
    const c = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = nr * u, ny = nh, nz = nr * c;

  // ---------------------------------------------------------------- sahne biçimleri
  /** Taç yaprağı (ters yumurta, ucunda hafif çentik) nokta dizisi. c: çiçek, i: sıra. */
  function tacNoktalari(c, i, o) {
    o = o || {};
    const a = c.aci + (i * PI2) / 5 + (o.don || 0);
    const L = c.r * (o.boy || 1.0), W = c.r * (o.en || 1.1);
    const ca = Math.cos(a), sa = Math.sin(a);
    const n = o.n || 26, sol = [], sag = [];
    for (let k = 0; k <= n; k++) {
      const u = k / n;
      const w = (W / 2) * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.45)), 0.55) * (0.3 + 0.7 * Math.sqrt(u));
      sol.push([u, w]);

    return pts.map(([u, v]) => {
      const cen = (o.centik || 0) * Math.exp(-Math.pow(v / (W * 0.16), 2)) * sstep(0.8, 1, u);
      const uu = (u - cen) * L + c.r * (o.ic || 0.08);

  function noktaYolu(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); P.closePath(); return P; }
  function yapiCizgileri() {

  /** Alem parçalarının çizgileri: {p, tur:'yaka'|'cubuk'|'kure'|'hilal'} */
  function alemCizgileri(a) {
    const out = [];
    const el = (cx, cy, rx, ry) => { const p = []; for (let i = 0; i <= 64; i++) { const t = (i / 64) * PI2; p.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); } return p; };
    out.push({ p: el(a.yaka.cx, a.yaka.cy, a.yaka.rx, a.yaka.ry), tur: 'yaka' });

    out.push({ p: [[a.cubuk.x2, a.cubuk.y2], [a.cubuk.x2, a.cubuk.y1]], tur: 'cubuk' });
    for (const k of a.kureler) out.push({ p: el(k.cx, k.cy, k.r, k.r), tur: 'kure', k });
    for (const q of duzlestir(SAHNE.hilalYolu(a.hilal.cx, a.hilal.cy, a.hilal.R), 0.7)) out.push({ p: q, tur: 'hilal' });

  }

  /** Bitkiler çizim sırasıyla: sap → yaprak → tomurcuk → çiçek. */
  function bitkiListesi(tacO) {
    const B = SAHNE.bitki;
    const out = [];
    B.saplar.forEach((s, i) => out.push({ tur: 'sap', p: ornekle(s, 2), i }));
    B.yapraklar.forEach((y, i) => out.push({ tur: 'yaprak', y, i, p: duzlestir(SAHNE.yaprakYolu(y), 1)[0], damar: SAHNE.yaprakDamari(y) }));
    B.tomurcuklar.forEach((t, i) => out.push({ tur: 'tomurcuk', t, i, p: duzlestir(SAHNE.tomurcukYolu(t), 0.8)[0] }));
    B.cicekler.forEach((c, i) => out.push({ tur: 'cicek', c, i, taclar: [0, 1, 2, 3, 4].map((k) => tacNoktalari(c, k, tacO)) }));

  /** Bitki maskeleri (1024): cicek, tomurcuk, yaprak, sap, hepsi; sapKalin: sap genişliği. */
  function bitkiMaskeleri(liste, sapKalin) {
    const cizTur = (tur) => yolMaske((x) => {
      for (const e of liste) {
        if (e.tur !== tur) continue;
        if (tur === 'sap') { x.lineWidth = sapKalin || 4; x.stroke(noktaYoluAcik(e.p)); }
        else if (tur === 'cicek') { for (const t of e.taclar) x.fill(noktaYolu(t)); x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.3, 0, PI2); x.fill(); }
        else x.fill(noktaYolu(e.p));
      }
    });
    const cicek = cizTur('cicek');
    const tom0 = cizTur('tomurcuk');
    const tomurcuk = mEksi(tom0, cicek);
    const ust = mBirles(cicek, tom0);
    const yap0 = cizTur('yaprak');
    const yaprak = mEksi(yap0, ust);
    const ust2 = mBirles(ust, yap0);
    const sap0 = cizTur('sap');
    const sap = mEksi(sap0, ust2);

  function noktaYoluAcik(p) { const P = new Path2D(); P.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) P.lineTo(p[i][0], p[i][1]); return P; }
  /** Çiçek merkezine uzaklık / yarıçap haritası (çiçek maskesinde). */
  function cicekUzaklik(liste) {
    const D = new Float32Array(NN).fill(9);
    for (const e of liste) {
      if (e.tur !== 'cicek') continue;
      const c = e.c, R = c.r * 1.2;
      for (let y = Math.max(0, Math.floor(c.y - R)); y <= Math.min(N - 1, Math.ceil(c.y + R)); y++)
        for (let x = Math.max(0, Math.floor(c.x - R)); x <= Math.min(N - 1, Math.ceil(c.x + R)); x++) {
          const d = Math.hypot(x - c.x, y - c.y) / c.r;
          if (d < D[y * N + x]) D[y * N + x] = d;
        }
    }
    return D;
  }


  // ================================================================ j8 ekleri: bulut biçimi, kalem konturu, fırça vuruşu
  const ISIK2 = (() => { const v = [0.78, -0.63]; const l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; })();

  /** Bulut: hafif dalgalı taban, üstte farklı boyda birkaç geniş tepe (daire yayı değil, toplanmış yumuşak eğri).
   *  b: {x, y (taban), w, h, tohum, n}. Döner: {pts (kapalı), ust (soldan sağa üst kenar), alt, x0, x1, taban, P} */
  function bulutSekli(b) {
    const r = SAHNE.rng(b.tohum || 1);
    const n = b.n || 4;
    const tepeler = [];
    const dd = 0.84 / n;
    for (let i = 0; i < n; i++) tepeler.push({ t: 0.08 + dd * (i + 0.5) + (r() - 0.5) * dd * 0.3, s: dd * (0.42 + r() * 0.14), h: (0.5 + r() * 0.5) * (0.75 + 0.5 * Math.sin(Math.PI * (i + 0.5) / n)) });
    const M = 120, ust = [], alt = [];
    const tepe = b.tepe == null ? 0.3 : b.tepe;
    for (let k = 0; k <= M; k++) {
      const t = k / M, th = Math.PI * (1 - t);
      let v = 0;
      for (const q of tepeler) v += q.h * Math.exp(-Math.pow((t - q.t) / q.s, 2));
      const rr = 1 - tepe + tepe * Math.min(1.25, v);
      ust.push([b.x + (b.w / 2) * Math.cos(th), b.y - b.h * Math.pow(Math.sin(th), 0.9) * rr]);
      alt.push([b.x + (b.w / 2) * Math.cos(th), b.y + b.h * 0.1 * Math.pow(Math.sin(th), 0.6) + b.h * 0.03 * Math.sin(t * 11 + (b.tohum || 0)) * Math.sin(th)]);
    }
    const pts = ust.concat(alt.slice(1, -1).reverse());
    return { pts, ust, alt, x0: b.x - b.w / 2, x1: b.x + b.w / 2, taban: b.y, P: noktaYolu(pts) };
  }

  /** Kapalı nokta dizisinin işaretli alanı (> 0: ekranda saat yönü). */
  function isaretliAlan(p) { let A = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; A += a[0] * b[1] - b[0] * a[1]; } return A / 2; }

  /** Dışa bakan normaller: kapalı dizide alan işaretinden, açık dizide o.yan ([nx,ny] yaklaşık dış yön) ile. */
  function disNormaller(p, kapali, yan) {
    const n = p.length, out = [];
    const sg = kapali ? (isaretliAlan(p) > 0 ? 1 : -1) : 1;
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      let nx = ty * sg, ny = -tx * sg;
      if (!kapali && yan && nx * yan[0] + ny * yan[1] < 0) { nx = -nx; ny = -ny; }
      out.push([nx, ny]);
    }
    return out;
  }

  /** Değişken kalınlıklı kapalı ya da açık şerit; w dizisi nokta başına kalınlık. Uçlar yuvarlak. */
  function seritW(x, p, w, kapali) {
    const n = p.length;
    if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = kapali ? p[(i - 1 + n) % n] : p[Math.max(0, i - 1)];
      const b = kapali ? p[(i + 1) % n] : p[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;

  /**

  function kontur(x, p, o) {

      const g = clamp(-dot * 1.25, 0, 1);

  }

  /** El titremesi: yeniden örnekle + düşük frekanslı sapma. */

  /**

  function vurus(x, p, o) {
    const n = p.length;
    if (n < 2) return;
    const s = [0];
    for (let i = 1; i < n; i++) s.push(s[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));

    const son = o.son == null ? Math.min(Lt * 0.2, o.w * 0.5) : o.son;

  /** Bir pikselin bölge adı (bitkisiz bölge kimliğinden). */

  /**

  function fircaKalem(x, p, o) {
    const n = p.length;
    if (n < 2) return;
    const kapali = !!o.kapali;
    const r = o.rng, nf = o.nf;
    const Nn = disNormaller(p, kapali, o.yan);
    if (!kapali && o.sg && o.sg < 0) for (const v of Nn) { v[0] = -v[0]; v[1] = -v[1]; }

      for (let k = 1; k <= n; k++) {

    for (const idx of parcalar) {

      while (i0 < tot - 1) {
        let i1 = Math.min(tot - 1, i0 + Math.round(maxL * (0.7 + 0.6 * (r ? r() : 0.5))));
        if (tot - 1 - i1 < maxL * 0.3) i1 = tot - 1;

          w[k] = Math.max(0.3, w[k] * t);

  // ================================================================ doğal bulut alanı ve eşik konturu
  /**
   * Doğal bulut yoğunluğu (1024 alan, 0..~1.5): her bulut farklı boyda, iç içe geçmiş yumuşak kümelerden oluşur;
   * kütlenin en yüksek yeri bir yana kaymıştır (bakışımsız), uzun bir kuyruğa iner; taban hafif eğik ve dalgalı,
   * neredeyse düzdür; kenar düşük frekanslı gürültüyle bozulur, böylece sıra sıra yarım daire (ikon bulut) çıkmaz.
   * tanim: [{x, y (taban), w, h, tohum, tepe (0..1 kütlenin yeri), n, ek, egim}]; o: {tohum, gurultu}
   */
  function bulutAlani(tanim, o) {
    o = o || {};
    const F = new Float32Array(NN);
    const nb = gurultu(o.tohum || 777), nc = gurultu((o.tohum || 777) + 1);
    const gg = o.gurultu == null ? 0.2 : o.gurultu;
    const out = [];
    for (const b of tanim) {
      const r = SAHNE.rng(b.tohum);
      const n = b.n || Math.max(4, Math.round(b.w / 40));
      const tepe = b.tepe != null ? b.tepe : 0.3 + r() * 0.3;
      const blobs = [];
      // gövde: yatayda uzamış, alçak kümeler
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n + ((r() - 0.5) * 0.5) / n;
        const d = t - tepe;
        const prof = Math.exp(-Math.pow(d / (d < 0 ? 0.3 : 0.45), 2));
        const rad = b.h * (0.26 + 0.24 * prof) * (0.85 + 0.3 * r());
        blobs.push({ x: b.x - b.w / 2 + t * b.w, y: b.y - rad * 0.55, r: rad, sx: 0.62 });
      }

      const ek = b.ek == null ? 3 : b.ek;

      }

      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        let v = 0;
        for (const q of blobs) { const dx = (x - q.x) * q.sx, dy = y - q.y; const d2 = (dx * dx + dy * dy) / (q.r * q.r); if (d2 < 9) v += Math.exp(-d2); }
        if (v < 0.02) continue;

        const taban = b.y + eg * (x - b.x) + b.h * 0.07 * (nc(x / 55, b.tohum * 3.1) - 0.5) * 2;

  /** Alandan yumuşak eşikli maske. */

  /** Eşik konturu (kare yürütme): F alanında `esik` düzey çizgisi, bb içinde; düzeltilmiş nokta dizileri (kapalı olanlarda .kapali). */
  function esikKonturu(F, esik, bb, duz) {
    const x0 = Math.max(0, bb.x0), x1 = Math.min(N - 2, bb.x1), y0 = Math.max(0, bb.y0), y1 = Math.min(N - 2, bb.y1);
    const kom = new Map();
    const bag = (a, b) => { (kom.get(a) || kom.set(a, []).get(a)).push(b); (kom.get(b) || kom.set(b, []).get(b)).push(a); };
    const hE = (x, y) => (y * N + x) * 2, vE = (x, y) => (y * N + x) * 2 + 1;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {

        case 4: case 11: bag(T, R); break;
        case 6: case 9: bag(T, B); break;
        case 7: case 8: bag(T, L); break;
        case 5: bag(T, R); bag(L, B); break;
        case 10: bag(T, L); bag(B, R); break;

    for (const [id, ks] of kom) if (!gor.has(id) && ks.length === 1) zincirler.push(yuru(id));
    for (const [id] of kom) if (!gor.has(id)) zincirler.push(yuru(id));

  }
  /** Maskeyi r piksel kadar genişletir (yumuşak kenarlı). */

  const VERD = [146, 166, 134], VERD_K = [112, 136, 106], VERD_A = [201, 210, 192], BEYAZ = [252, 249, 241];

  // ---------------------------------------------------------------- alçı astar: sıcak beyaz, çok hafif yatay mala izleri
  const H = kagitYap({ tohum: 2404, ince: [2.2, 0.25], orta: [9, 0.2], iri: [200, 0.3], kum: 0.04, dokuma: (X, Y) => 0.12 * (nf4(X / 900, Y / 26) - 0.5) });
  const ALCI = hex('#F8F5EC').map((v) => v / 255);
  const kagit = (X, Y, h) => { const k = 0.985 + 0.022 * h; return [ALCI[0] * k, ALCI[1] * k, ALCI[2] * k]; };
  const H1 = kucult(H);
  const L = laviKur(H1, 240);
  const bolge = (adlar, kosul) => mEksi(bolgeMaske(ids, adlar, kosul), BM.hepsi);
  const bolgeA = (x, y) => bolgeAd(ids, x, y);
  const bitkiM = (x, y) => BM.hepsi[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)] || 0;

  // katmanlar: altboya taramaları (çarpımsal), sır taramaları (çarpımsal), opak beyaz ışıklar (üstte)
  function pigment() { const k = katman(); k.x.fillStyle = '#fff'; k.x.fillRect(0, 0, N, N); k.x.globalCompositeOperation = 'multiply'; return k; }
  const ALT = pigment(), SIRT = pigment();
  const ISK = katman();
  const rgbS = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;

  /**
   * Tarama: düzensiz bir ızgaradan aday noktalar; her noktada yerel koyuluk (0..1) eşiği geçerse, biçimin yönünde kısa,
   * uçları incelen bir fırça çizgisi. o: {ic(x,y), yon(x,y), koyu(x,y), aralik, boy, w, renk, aMax, esik, x0,x1,y0,y1, k}
   */
  function tara(o) {
    const r = SAHNE.rng(o.tohum || 7);
    const ar = o.aralik, by = o.boy;
    for (let y = o.y0; y < o.y1; y += ar * (0.85 + 0.3 * r())) {
      for (let x = o.x0 + r() * by * 0.6; x < o.x1; x += by * (0.42 + 0.3 * r())) {
        const cx = x + (r() - 0.5) * by * 0.3, cy = y + (r() - 0.5) * ar * 0.7;
        if (!o.ic(cx, cy)) continue;
        const d = o.koyu(cx, cy);
        if (d < (o.esik || 0.08) + r() * 0.14) continue;
        const a = o.yon(cx, cy) + (r() - 0.5) * (o.sapma || 0.12);
        const l = by * (0.7 + 0.5 * r());
        const ca = Math.cos(a), sa = Math.sin(a);
        const kv = (r() - 0.5) * 0.06 * l;
        const pts = [];
        for (let s = -l / 2; s <= l / 2; s += 1.2) { const t = (s + l / 2) / l; pts.push([cx + ca * s - sa * kv * Math.sin(Math.PI * t), cy + sa * s + ca * kv * Math.sin(Math.PI * t)]); }
        const parc = kirp(pts, o.ic);
        const alfa = clamp(o.aMax * Math.min(1, d * (o.kazanc || 1.15)) * (0.75 + 0.5 * r()), 0, 1);
        o.k.x.fillStyle = rgbS(o.renk, alfa);
        for (const q of parc) {
          if (q.length < 3) continue;
          const m = q.length;
          const w = q.map((_, i) => { const t = i / (m - 1); return Math.max(0.3, o.w * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, t * 1.15)))); });
          seritW(o.k.x, q, w, false);
        }
      }
    }
  }

  // ---------------------------------------------------------------- bulut ve güneş biçimleri
  const BA = bulutAlani([
    { x: 174, y: 282, w: 256, h: 76, tohum: 41, tepe: 0.4 },
    { x: 510, y: 176, w: 186, h: 54, tohum: 42, tepe: 0.58 },
    { x: 784, y: 358, w: 246, h: 74, tohum: 43, tepe: 0.38 },
    { x: 952, y: 482, w: 140, h: 38, tohum: 44, tepe: 0.5, ek: 2 },
    { x: 84, y: 488, w: 150, h: 38, tohum: 45, tepe: 0.44, ek: 2 },
  ], { tohum: 2405, gurultu: 0.24 });
  const BF = BA.F;
  const bfAt = (x, y) => BF[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)];
  // yumuşak ama belirli kenar: altboyada modellenmiş bulut
  const bulutA = (x, y) => sstep(0.47, 0.53, bfAt(x, y));
  /** Bulutun gölge koyuluğu: alt ve sol yanı (biçimin içinde, kütlenin altına doğru artar). */
  const bulutGolge = (x, y) => {
    for (const c of BA.bulutlar) {
      const b = c.b;
      if (x < c.bb.x0 || x > c.bb.x1 || y < c.bb.y0 || y > c.bb.y1) continue;
      const alt = sstep(b.y - b.h * 0.85, b.y - b.h * 0.05, y);
      const sol = sstep(b.x + b.w * 0.05, b.x - b.w * 0.5, x);
      const ic = 1 - sstep(0.7, 1.3, bfAt(x, y));
      return clamp((alt * 0.8 + sol * 0.35) * (0.55 + 0.45 * ic), 0, 1) * clamp((b.w - 90) / 120, 0.45, 1);
    }
    return 0;
  };
  /** Bulut biçimini izleyen yön (eş-yoğunluk çizgisine teğet). */
  const bulutYon = (x, y) => { const gx = bfAt(x + 2, y) - bfAt(x - 2, y), gy = bfAt(x, y + 2) - bfAt(x, y - 2); return Math.atan2(gx, -gy); };
  const gokMu = (x, y) => { const a = bolgeA(x, y); return (a === 'gok' || a === 'gunes' || Math.hypot(x - GX, y - GY) < 96) && bitkiM(x, y) < 0.3; };
  const gunesUz = (x, y) => Math.hypot(x - GX, y - GY);
  const gunesR = (x, y) => { const a = Math.atan2(y - GY, x - GX); return 34 + 1.8 * (nf4(Math.cos(a) * 0.9 + 6, Math.sin(a) * 0.9 + 6) - 0.5) * 2; };

  // ---------------------------------------------------------------- 1) verdaccio altboya
  // açık, gümüşî yeşil temel kat bütün resme (ışık bölgelerinde çok ince)
  const gokB = mBirles(bolge(['gok', 'gunes']), yolMaske((x) => { x.beginPath(); x.arc(GX, GY, 96, 0, PI2); x.fill(); }));
  const hepsi = mBirles(mFonk(bolge(['zemin', 'minare', 'kaide', 'kasnak', 'kubbe', 'pencere', 'altin']), () => 1), gokB);
  lavi(L, hepsi, '#C9D2C0', { guc: 0.45, kenar: 0.1, tane: 0.15, akis: 0.25, oyna: 1.5, yay: 3, f: (x, y) => { if (gokMu(x, y)) return 0.12 + 0.75 * bulutA(x, y) * sstep(0.3, 0.7, bulutGolge(x, y)); const a = bolgeA(x, y); if (a === 'zemin') return 0.25; if (a === 'minare' || a === 'kaide') return 0.05; return 0.3; } });
  lavi(L, mFonk(BM.hepsi, () => 1), '#C9D2C0', { guc: 0.3, kenar: 0.1, oyna: 1, yay: 2 });

  // biçime göre koyuluk alanları
  const kubbeKoyu = (x, y) => clamp((0.88 - kubbeIsik(x, y)) * 1.35, 0, 1);
  const kubbeYon = (x, y) => { const R = Math.max(1, kubbeR(y)); const u = clamp((x - 560) / R, -0.999, 0.999); const dr = (kubbeR(y - 2) - kubbeR(y + 2)) / 4; return Math.atan2(1, -u * dr); };
  const cylU = (x, y) => (x - 560) / (y < 610 ? 208 : 226);
  const mU = (x, y) => (x - 300) / mYari(y);
  const tasKoyu = (x, y) => {
    const a = bolgeA(x, y);
    if (a === 'minare') {
      let d = clamp((0.9 - silindirIsik(mU(x, y))) * 1.2, 0, 1);
      if ((y > 468 && y < 494) || (y > 300 && y < 322) || (y > 206 && y < 213) || (y > 436 && y < 443) || (y > 272 && y < 278)) d = Math.max(d, 0.75);
      return d;
    }
    if (a === 'kaide') { let d = 0.62 * sstep(380, 300, x); if (y > 704 && y < 724) d = Math.max(d, 0.85 - (y - 704) * 0.03); return d; }
    return 0;
  };
  const r1 = (a, b) => (x, y) => a(x, y) && bitkiM(x, y) < 0.3;
  // gök: yalnız bulut gölgelerinde, biçimi saran kısa, kıvrık taramalar
  tara({ k: ALT, ic: (x, y) => gokMu(x, y) && bfAt(x, y) > 0.62 && bulutGolge(x, y) > 0.42, yon: () => 0.62, koyu: (x, y) => sstep(0.62, 0.85, bfAt(x, y)) * sstep(0.42, 0.75, bulutGolge(x, y)) * 1.2, aralik: 5.5, boy: 18, w: 2.4, renk: VERD_K, aMax: 0.55, x0: 0, x1: 1024, y0: 90, y1: 540, tohum: 1, esik: 0.1, sapma: 0.06 });
  // kubbe: meridyen boyunca
  /** Düzenli tarama: biçimi izleyen koşut çizgiler (ör. meridyenler), koyuluğa göre kesik kesik çizilir.
   *  Her çizginin kendi eşiği vardır: koyu yerde bütün çizgiler, açık yerde yalnız birkaçı görünür. */
  function cizgiTara(cizgiler, o) {
    const r = SAHNE.rng(o.tohum || 9);
    o.k.x.fillStyle = rgbS(o.renk, 1);
    cizgiler.forEach((cz, ci) => {
      const esik = (o.esik || 0.12) + (o.yay || 0.5) * r();
      let i = Math.floor(r() * 8);
      while (i < cz.length - 3) {
        const boy = Math.round(o.boy * (0.6 + 0.8 * r()));
        const j = Math.min(cz.length - 1, i + boy);
        const seg = cz.slice(i, j + 1).filter((q) => o.ic(q[0], q[1]));
        const mid = cz[Math.floor((i + j) / 2)];
        const d = o.koyu(mid[0], mid[1]);
        if (seg.length > 3 && d > esik) {
          const a = clamp(o.aMax * Math.min(1, (d - esik * 0.5) * 1.3) * (0.8 + 0.4 * r()), 0, 1);
          o.k.x.fillStyle = rgbS(o.renk, a);
          const m = seg.length;
          seritW(o.k.x, seg, seg.map((_, k) => Math.max(0.3, o.w * (0.4 + 0.6 * Math.sin(Math.PI * Math.min(1, ((k + 0.5) / m) * 1.1))))), false);
        }
        i = j + 2 + Math.floor(r() * (o.bosluk || 4));
      }
    });
  }
  const kaydir = (p, amp, f) => titret(p, amp, 60, nf3, f);
  // kubbe: meridyenler boyunca (taban genişliğinde ~3 px aralık)
  {
    const cz = [];
    const n = 66;
    for (let i = 0; i < n; i++) {
      const u = -0.995 + (1.99 * (i + 0.5)) / n;
      const p = [];
      for (let y = 553; y > 312 + 30 * (1 - Math.abs(u)) * 0; y -= 1) { const R = kubbeR(y); p.push([560 + u * R, y]); }
      if (p.length > 6) cz.push(kaydir(ornekle(p, 1), 0.35, i * 7.7));
    }
    cizgiTara(cz, { k: ALT, ic: (x, y) => bolgeA(x, y) === 'kubbe' && bitkiM(x, y) < 0.3, koyu: (x, y) => kubbeKoyu(x, y), boy: 34, w: 3.0, renk: VERD_K, aMax: 0.8, esik: 0.12, yay: 0.55, tohum: 2, bosluk: 8 });
  }

  // kasnak: dikey
  const kasnakKoyu = (x, y) => clamp((0.9 - silindirIsik(cylU(x, y))) * 1.25, 0, 1) * 0.85 + ((y >= 555 && y < 566) || (y >= 610 && y < 619) ? 0.45 : 0);
  {
    const cz = [];
    for (let x = 335; x < 786; x += 6.2) { const y1 = x > 352 && x < 768 ? 556 : 611; cz.push(kaydir(ornekle([[x, y1], [x, 691]], 1), 0.3, x)); }
    cizgiTara(cz, { k: ALT, ic: (x, y) => bolgeA(x, y) === 'kasnak' && bitkiM(x, y) < 0.3, koyu: kasnakKoyu, boy: 22, w: 2.9, renk: VERD_K, aMax: 0.78, esik: 0.14, yay: 0.5, tohum: 4, bosluk: 6 });
  }
  // taş: minare ve kaide
  {
    const cz = [];
    // dikey taramalar yalnız gölge yanında; şerefe korkuluğu, döşemesi ve bilezik (ışıklı üst yüzler) temiz kalır
    const ustYuz = (y) => (y >= 434 && y < 468) || (y >= 270 && y < 300) || (y >= 196 && y < 206);
    for (let x = 267; x < 352; x += 5.6) cz.push(kaydir(ornekle([[x, 150], [x, 798]], 1), 0.3, x * 1.3));
    for (let x = 302; x < 400; x += 5.6) cz.push(kaydir(ornekle([[x, 726], [x, 798]], 1), 0.3, x * 1.7));
    cizgiTara(cz, { k: ALT, ic: (x, y) => { const a = bolgeA(x, y); return ((a === 'minare' && !ustYuz(y) && !((y > 466 && y < 492) || (y > 298 && y < 318))) || (a === 'kaide' && y > 724)) && bitkiM(x, y) < 0.3; }, koyu: tasKoyu, boy: 26, w: 2.8, renk: VERD_K, aMax: 0.78, esik: 0.18, yay: 0.5, tohum: 5, bosluk: 6 });
    // şerefe ve korniş altları: yalnız gölgedeki alt yüzlerde yatay taramalar
    const cy = [];
    for (let y = 706; y < 726; y += 4.6) cy.push(kaydir(ornekle([[300, y], [820, y]], 1), 0.3, y * 2.1));
    for (const [y1, y2, xa, xb] of [[468, 490, 248, 352], [300, 318, 256, 344], [206, 212, 280, 320]]) for (let y = y1 + 2; y < y2; y += 4.4) cy.push(kaydir(ornekle([[xa, y], [xb, y]], 1), 0.3, y * 3.3));
    cizgiTara(cy, { k: ALT, ic: (x, y) => { const a = bolgeA(x, y); return (a === 'kaide' || a === 'minare') && bitkiM(x, y) < 0.3; }, koyu: tasKoyu, boy: 26, w: 2.3, renk: VERD_K, aMax: 0.55, esik: 0.14, yay: 0.5, tohum: 15, bosluk: 5 });
  }
  // yumuşak altboya modellemesi (taramanın altında): gölge yanları yeşilimsi gri
  lavi(L, bolge(['kubbe']), '#A2B797', { guc: 0.8, kenar: 0.15, tane: 0.12, oyna: 1.2, yay: 3, f: (x, y) => clamp(kubbeKoyu(x, y) * 0.95, 0, 1) });
  lavi(L, bolge(['kasnak']), '#A2B797', { guc: 0.8, kenar: 0.15, tane: 0.12, oyna: 1.2, yay: 3, f: (x, y) => clamp(kasnakKoyu(x, y), 0, 1) });
  lavi(L, bolge(['minare', 'kaide']), '#A2B797', { guc: 0.75, kenar: 0.15, tane: 0.12, oyna: 1.2, yay: 3, f: (x, y) => clamp(tasKoyu(x, y), 0, 1) });
  lavi(L, mFonk(gokB, (x, y) => bulutA(x, y)), '#A2B797', { guc: 0.66, kenar: 0.12, tane: 0.14, akis: 0.3, oyna: 1.5, yay: 3, f: (x, y) => clamp(bulutGolge(x, y), 0, 1) });
  // pencereler: koyu altboya (düz)
  lavi(L, bolge(['pencere']), '#7F8C74', { guc: 0.8, kenar: 0.3, oyna: 0.5, yay: 1 });
  // yer: yatay, seyrek
  tara({ k: ALT, ic: r1((x, y) => bolgeA(x, y) === 'zemin'), yon: () => 0.03, koyu: (x, y) => 0.1 + 0.4 * sstep(800, 812, y) * (1 - sstep(812, 860, y)) + 0.35 * sstep(0.5, 0.8, nf3(x / 80, y / 30)), aralik: 7, boy: 28, w: 2.3, renk: VERD_K, aMax: 0.4, x0: 0, x1: 1024, y0: 800, y1: 1024, tohum: 6, sapma: 0.06, esik: 0.14 });

  // ---------------------------------------------------------------- 2) saydam sırlar (yerel renkler)
  // gök: soluk altboyanın üstüne açık mavi sır; önce ince bir kat, sonra yumuşak, geniş fırçayla gidip gelen yarı saydam
  // vuruşlar (kılların izi ve binen yerler seçilir); bulutların ışıklı yanından ve güneş kursundan dolaşılır
  const gunesDisi = (x, y) => sstep(gunesR(x, y) - 1, gunesR(x, y) + 2, gunesUz(x, y));
  lavi(L, gokB, '#93C1E4', {
    guc: 0.7, kenar: 0.3, tane: 0.14, akis: 0.2, oyna: 1.2, yay: 1.5,
    f: (x, y) => lerp(1, 0.5, sstep(120, 790, y)) * (1 - sstep(0.47, 0.52, bfAt(x, y)) * (1 - 0.5 * sstep(0.35, 0.8, bulutGolge(x, y)))) * gunesDisi(x, y),
  });
  {
    const r = SAHNE.rng(24011);
    const gokte = (x, y) => gokMu(x, y) && bulutA(x, y) < 0.35;
    for (let y = 6; y < 800; ) {
      const t = y / 800;
      const w = lerp(64, 44, t) * (0.85 + 0.3 * r());
      let x = -60 - r() * 120;
      while (x < 1080) {
        const len = 300 + r() * 360, eg = -0.05 + (r() - 0.5) * 0.06, kv = (r() - 0.5) * 14, dy = (r() - 0.5) * w * 0.4;
        const pts = [];
        for (let s = 0; s <= len; s += 2) pts.push([x + s, y + dy + eg * s + kv * Math.sin((Math.PI * s) / len)]);
        for (const q of kirp(pts, (a, b) => gokte(a, b) && gokte(a, b - w * 0.3) && gokte(a, b + w * 0.3))) {
          if (q.length < 8) continue;
          const yuk = lerp(0.11, 0.045, t) * (0.8 + 0.4 * r());
          vurus(SIRT.x, ornekle(q, 1), { w, renk: [112, 166, 220], a0: yuk, a1: yuk * 0.8, havuz: 0.02, bas: w * 1.2, son: w * 0.9, kil: 14, kilA: yuk * 0.8, kilW: 0.035, rng: r });
        }
        x += len - 40 + r() * 60;
      }
      y += w * (0.5 + 0.25 * r());
    }
  }
  // güneş kursu sır vuruşlarından temizlenir (alçı beyazı bırakılmış gibi)
  { const k = SIRT.x; k.save(); k.globalCompositeOperation = 'source-over'; k.fillStyle = '#fff'; k.beginPath(); for (let a = 0; a < PI2; a += 0.02) { const rr = gunesR(GX + Math.cos(a) * 30, GY + Math.sin(a) * 30) + 0.5; k.lineTo(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr); } k.closePath(); k.fill(); k.restore(); }
  // güneş: alçı beyazı bırakılmış kursa soluk, sarımsı-beyaz bir sır
  lavi(L, mFonk(gokB, (x, y) => 1 - gunesDisi(x, y)), '#F3E8AE', { guc: 0.38, kenar: 0.3, tane: 0.12, oyna: 1.2, yay: 1.5 });
  // kubbe ve kasnak: zümrüt sır
  const kubbe = bolge(['kubbe']);
  lavi(L, kubbe, '#3A9E68', { guc: 0.8, kenar: 0.35, tane: 0.15, akis: 0.2, oyna: 1.2, yay: 2, f: (x, y) => 0.38 + 0.72 * kubbeIsik(x, y) });
  lavi(L, bolge(['kasnak']), '#3E9C6B', { guc: 0.76, kenar: 0.35, tane: 0.15, oyna: 1.2, yay: 2, f: (x, y) => 0.45 + 0.6 * silindirIsik(cylU(x, y)) });
  lavi(L, bolge(['pencere'], (x, y) => y >= 555 && y < 692 && x > 334), '#2E5E46', { guc: 0.6, kenar: 0.3, oyna: 0.5, yay: 1 });
  // taş: ışıkta sıcak beyaz (çok ince), pencereler sıcak koyu
  lavi(L, bolge(['minare', 'kaide']), '#F1E7CF', { guc: 0.36, kenar: 0.2, oyna: 1.2, yay: 2, f: (x, y) => 1 - 0.7 * clamp(tasKoyu(x, y), 0, 1) });
  lavi(L, bolge(['pencere'], (x, y) => y >= 692 || x < 345), '#8A7A60', { guc: 0.45, kenar: 0.3, oyna: 0.5, yay: 1 });
  // altın
  const altin = bolge(['altin'], (x, y) => x < 700); // güneş çevresindeki kenar pikselleri altın sayılmasın
  lavi(L, altin, '#CDAF5C', { guc: 0.9, kenar: 0.4, oyna: 0.3, yay: 1 });
  lavi(L, mFonk(altin, (x, y) => (x < (x < 430 ? 299.5 : 559.5) ? 1 : 0)), '#8E7A3E', { guc: 0.4, kenar: 0.4, oyna: 0.3, yay: 1 });
  // yer: açık toprak-krem
  // çayır: altboyanın üstüne taze sarı-yeşil sır, önde serin yeşile döner; yeşil-gri yalnız tarama gölgelerinde kalır
  lavi(L, bolge(['zemin']), '#9CC77A', { guc: 0.72, kenar: 0.25, tane: 0.15, akis: 0.25, oyna: 1.5, yay: 2, f: (x, y) => lerp(0.75, 1, sstep(800, 1000, y)) * (0.9 + 0.2 * nf2(x / 160, y / 40)) });
  lavi(L, bolge(['zemin'], (x, y) => y > 880 + 30 * (nf2(x / 200, 4) - 0.5) * 2), '#6BAC81', { guc: 0.42, kenar: 0.2, tane: 0.12, oyna: 2, yay: 4, yumusak: 0.6, f: (x, y) => sstep(870, 1010, y) });
  lavi(L, bolge(['zemin'], (x, y) => y < 818 + 6 * nf3(x / 40, 2)), '#D9DDA6', { guc: 0.4, kenar: 0.25, oyna: 1.2, yay: 2 });

  // ---------------------------------------------------------------- bitkiler: altboya gölge yarısı, taze yeşil sır, beyaz taç yaprakları
  const golgeYan = (e) => { const a = e.y.aci; return Math.sin(a) * 0.78 + Math.cos(a) * 0.62 < 0 ? 1 : 0; };
  const yarim = yolMaske((x) => {
    for (const e of liste) {
      if (e.tur !== 'yaprak') continue;
      const m = Math.floor(e.p.length / 2);
      const q = golgeYan(e) ? e.p.slice(0, m + 1) : e.p.slice(m).concat([e.p[0]]);
      x.fill(noktaYolu(q));
    }
  });
  const yaprakG = mGenislet(BM.yaprak, 1.6);
  lavi(L, mCarp(yarim, yaprakG), '#A2B797', { guc: 0.75, kenar: 0.3, oyna: 0.8, yay: 1.5 });
  const yaprakRenk = ['#7DB46A', '#8DBA5E', '#6FAE78'];
  for (let g = 0; g < 3; g++) {
    const m = yolMaske((x) => { for (const e of liste) if (e.tur === 'yaprak' && e.i % 3 === g) x.fill(noktaYolu(e.p)); });
    lavi(L, mCarp(mGenislet(m, 1.6), yaprakG), yaprakRenk[g], { guc: 0.72, kenar: 0.35, tane: 0.15, oyna: 0.8, yay: 1.5 });
  }
  lavi(L, mGenislet(BM.sap, 1.2), '#7A9C5E', { guc: 0.85, kenar: 0.3, oyna: 0.5, yay: 1 });
  lavi(L, mGenislet(BM.tomurcuk, 1.2), '#B8C7A4', { guc: 0.7, kenar: 0.3, oyna: 0.5, yay: 1 });
  const CD = cicekUzaklik(liste);
  // taç yaprağı gölgesi: göbeğe yakın ve gölge yanındaki yapraklarda gümüşî yeşil-gri
  lavi(L, BM.cicek, '#A2B797', { guc: 0.7, kenar: 0.2, oyna: 0.8, yay: 2, f: (x, y) => { const d = CD[y * N + x]; return clamp(0.85 - d * 1.1, 0, 1); } });
  lavi(L, yolMaske((x) => { for (const e of liste) if (e.tur === 'cicek') { x.beginPath(); x.arc(e.c.x, e.c.y, e.c.r * 0.19, 0, PI2); x.fill(); } }), '#E2BE4E', { guc: 0.88, kenar: 0.4, oyna: 0.5, yay: 1 });

  // ---------------------------------------------------------------- 3) opak ışıklar: kurşun beyazı tarama (ışık yanında)
  const ISIKC = BEYAZ;
  // bulut tepeleri
  // bulutlar: ışıklı yanda yumuşak, opak beyaz bir sürme (altboya yer yer seçilir), üstünde tek yönlü kısa ışık taramaları
  {
    const c = SAHNE.yeniTuval(N, N);
    const x = c.getContext('2d', { willReadFrequently: true });
    const im = x.createImageData(N, N);
    for (let y = 80; y < 560; y++) for (let xx = 0; xx < N; xx++) {
      if (!gokMu(xx, y)) continue;
      // ışıklı yanda keskin, fırçayla sürülmüş kurşun beyazı kenar; gölge yanında beyaz incelir, altboya seçilir
      const a = sstep(0.485, 0.515, bfAt(xx, y) + 0.025 * (nf4(xx / 5, y / 4) - 0.5) * 2);
      if (a <= 0.01) continue;
      const g = bulutGolge(xx, y);
      const v = a * clamp(1.2 - 1.5 * g, 0, 1) * (0.8 + 0.2 * nf3(xx / 16, y / 3.5));
      const i = 4 * (y * N + xx);
      im.data[i] = ISIKC[0]; im.data[i + 1] = ISIKC[1]; im.data[i + 2] = ISIKC[2]; im.data[i + 3] = Math.round(255 * clamp(v * 0.8, 0, 1));
    }
    x.putImageData(im, 0, 0);
    ISK.x.drawImage(c, 0, 0);
  }
  // bulut tepelerinde ışık yanına birkaç uzun, yatık kurşun beyazı fırça vuruşu (yün gibi her yeri taramadan)
  tara({ k: ISK, ic: (x, y) => gokMu(x, y) && bfAt(x, y) > 0.7, yon: () => -0.12, koyu: (x, y) => clamp((1 - 2.2 * bulutGolge(x, y)) * bulutA(x, y), 0, 1), aralik: 7, boy: 26, w: 3.2, renk: ISIKC, aMax: 0.7, x0: 0, x1: 1024, y0: 90, y1: 540, tohum: 21, esik: 0.35, sapma: 0.08 });
  // güneş
  // minare ve kaide ışık yanı
  const bantMi = (y) => (y > 464 && y < 494) || (y > 296 && y < 322) || (y > 196 && y < 213) || (y > 432 && y < 458) || (y > 268 && y < 292);
  tara({ k: ISK, ic: r1((x, y) => { const a = bolgeA(x, y); if (a === 'minare') return !bantMi(y) && mU(x, y) > 0.15; return a === 'kaide' && y > 692; }), yon: (x, y) => (bolgeA(x, y) === 'kaide' ? 0.04 : Math.PI / 2), koyu: (x, y) => { const a = bolgeA(x, y); if (a === 'minare') return sstep(0.2, 0.6, mU(x, y)) * 0.8; return sstep(560, 820, x) * 0.5 * (y > 730 ? 1 : 0) + (y > 692 && y < 703 ? 0.75 : 0); }, aralik: 3.4, boy: 11, w: 1.5, renk: ISIKC, aMax: 0.42, x0: 240, x1: 835, y0: 140, y1: 800, tohum: 23, esik: 0.2, sapma: 0.04 });
  // kubbe ışığı: birkaç açık yeşil-beyaz vuruş, meridyen boyunca
  {
    const cz = [];
    for (let i = 0; i < 128; i++) { const u = -0.995 + (1.99 * (i + 0.5)) / 128; if (u < 0.05) continue; const p = []; for (let y = 552; y > 316; y -= 1) p.push([560 + u * kubbeR(y), y]); cz.push(titret(ornekle(p, 1), 0.35, 60, nf3, i * 5.3)); }
    cizgiTara(cz, { k: ISK, ic: (x, y) => bolgeA(x, y) === 'kubbe' && bitkiM(x, y) < 0.3, koyu: (x, y) => sstep(0.82, 0.96, kubbeIsik(x, y)), boy: 16, w: 1.3, renk: [206, 230, 206], aMax: 0.42, esik: 0.15, yay: 0.5, tohum: 24, bosluk: 6 });
  }
  // taç yaprakları: ışık yanı opak beyaz kısa vuruşlar
  for (const e of liste) {
    if (e.tur !== 'cicek') continue;
    const c = e.c;
    for (let i = 0; i < 5; i++) {
      const a = c.aci + (i * PI2) / 5;
      const isik = Math.cos(a) * 0.78 - Math.sin(a) * 0.62; // sağ üste bakan yaprak
      const n = Math.round(3 + 4 * clamp(isik + 0.4, 0, 1)) * (c.r > 40 ? 2 : 1);
      for (let j = 0; j < n; j++) {
        const t = 0.45 + 0.45 * rng();
        const aa = a + (rng() - 0.5) * 0.9;
        const px = c.x + Math.cos(aa) * c.r * t, py = c.y + Math.sin(aa) * c.r * t;
        const l = c.r * (0.16 + 0.1 * rng());
        ISK.x.fillStyle = rgbS(ISIKC, 0.55 + 0.35 * clamp(isik + 0.3, 0, 1));
        const q = ornekle([[px - Math.cos(aa) * l * 0.5, py - Math.sin(aa) * l * 0.5], [px + Math.cos(aa) * l * 0.5, py + Math.sin(aa) * l * 0.5]], 1);
        seritW(ISK.x, q, q.map((_, k) => Math.max(0.3, 2.2 * Math.sin((Math.PI * (k + 0.5)) / q.length))), false);
      }
    }
  }
  // yaprak ışık yarısında orta damar boyunca açık yeşil
  for (const e of liste) {
    if (e.tur !== 'yaprak') continue;
    const [a, b] = e.damar;
    ISK.x.fillStyle = rgbS([212, 232, 190], 0.45);
    const q = ornekle([a, [lerp(a[0], b[0], 0.8), lerp(a[1], b[1], 0.8)]], 1);
    seritW(ISK.x, q, q.map((_, k) => Math.max(0.3, 1.4 * Math.sin((Math.PI * (k + 0.5)) / q.length))), false);
  }
  // bitki siluetleri altboya/sır taramalarını örter (öndeki biçim sonradan boyanmış)
  for (const k of [ALT, SIRT]) { k.x.save(); k.x.globalCompositeOperation = 'source-over'; k.x.fillStyle = '#fff'; for (const e of liste) { if (e.tur === 'sap') { k.x.strokeStyle = '#fff'; k.x.lineWidth = 3; k.x.stroke(noktaYoluAcik(e.p)); } else if (e.tur === 'cicek') { for (const t of e.taclar) k.x.fill(noktaYolu(t)); } else k.x.fill(noktaYolu(e.p)); } k.x.restore(); }
  // çiçek gölgeleri: altboyayla taramalı (ışığa göre), yalnız taç yaprağında
  for (const e of liste) {
    if (e.tur !== 'cicek') continue;
    const c = e.c;
    const icinde = (x, y) => { const d = Math.hypot(x - c.x, y - c.y); if (d > c.r * 1.05 || d < c.r * 0.23) return false; const m = BM.cicek[clamp(Math.round(y), 0, N - 1) * N + clamp(Math.round(x), 0, N - 1)]; return m > 0.5; };
    tara({ k: ALT, ic: icinde, yon: (x, y) => Math.atan2(y - c.y, x - c.x), koyu: (x, y) => { const dx = (x - c.x) / c.r, dy = (y - c.y) / c.r; return clamp(0.55 - Math.hypot(dx, dy) * 0.5 + (-dx * 0.78 + dy * 0.62) * 0.35, 0, 1); }, aralik: 3.2, boy: Math.max(8, c.r * 0.35), w: 1.5, renk: VERD, aMax: 0.5, x0: c.x - c.r, x1: c.x + c.r, y0: c.y - c.r, y1: c.y + c.r, tohum: 30 + e.i, esik: 0.06 });
  }

  // ---------------------------------------------------------------- 4) altboyanın ince yeşil-gri çizimi (biçim sınırlarında)
  const CIZ = katman();
  CIZ.x.fillStyle = 'rgba(112,128,100,0.5)';
  const elA = (pts, gen) => titret(ornekle(pts, 1), gen == null ? 0.35 : gen, 40, nf3, rng() * 80);
  const cz = (p, o) => kontur(CIZ.x, p, Object.assign({ w: 1.3, golge: 0.8, isikIncel: 0.4, basinc: 0.25, nf, faz: rng() * 90 }, o));
  for (const e of yapiCizgileri()) {
    if (e.tur === 'kaburga') { const p = e.p.filter((q) => q[1] > 314 + 16 * (1 - Math.abs(e.u)) && q[1] < 553); if (p.length > 4) { CIZ.x.fillStyle = e.u < 0.2 ? 'rgba(80,110,86,0.55)' : 'rgba(80,110,86,0.32)'; cz(elA(p, 0.25), { w: e.u < 0 ? 1.4 : 1.1, golge: 0, isikIncel: 0, bas: 10, son: 3 }); CIZ.x.fillStyle = 'rgba(112,128,100,0.5)'; } continue; }
    cz(elA(e.p, 0.3), { yan: e.yan ? [e.yan, 0] : [0, 1], w: e.tur === 'kubbe' ? 1.6 : 1.25 });
  }
  for (const a of [SAHNE.alemParcalari(560, 300, 1), SAHNE.minareParcalari().find((q) => q.ad === 'alem').alem]) for (const e of alemCizgileri(a)) cz(elA(e.p, 0.1), { w: 1.0, golge: 0 });
  const silC = (fn) => { const k = CIZ.x; k.save(); k.globalCompositeOperation = 'destination-out'; k.fillStyle = '#000'; k.strokeStyle = '#000'; fn(k); k.restore(); };
  for (const e of liste) {
    if (e.tur === 'sap') { silC((k) => { k.lineWidth = 4; k.stroke(noktaYoluAcik(e.p)); }); }
    else if (e.tur === 'yaprak') { silC((k) => k.fill(noktaYolu(e.p))); cz(elA(e.p, 0.25), { w: 1.1, golge: 0.6, yan: null }); }
    else if (e.tur === 'tomurcuk') { silC((k) => k.fill(noktaYolu(e.p))); cz(elA(e.p, 0.15), { w: 1.0, golge: 0.5 }); }
    else if (e.tur === 'cicek') { for (const t of e.taclar) { silC((k) => k.fill(noktaYolu(t))); cz(elA(t.concat([t[0]]), 0.2), { w: 1.15, golge: 0.7 }); } silC((k) => { k.beginPath(); k.arc(e.c.x, e.c.y, e.c.r * 0.24, 0, PI2); k.fill(); }); }
  }
  // öndeki saplı olmayan tomurcuklara kısa sap
  for (const e of liste) {
    if (e.tur !== 'tomurcuk' || e.i < 8) continue;
    const t = e.t;
    CIZ.x.fillStyle = 'rgba(100,130,84,0.75)';
    cz(elA([[t.x - Math.cos(t.aci) * t.r * 0.8, t.y - Math.sin(t.aci) * t.r * 0.8], [t.x - Math.cos(t.aci) * t.r * 2.6 + 1.5, t.y + t.r * 1.9]], 0.2), { w: 1.8, golge: 0, isikIncel: 0, bas: 1, son: 3 });
  }

  // ---------------------------------------------------------------- birleştir
  birlestir({
    ctx, H, L, kagit, kabartma: 0.04, cukur: 0.01,
    katmanlar: [
      { c: ALT.c, mod: 'carp' },
      { c: SIRT.c, mod: 'carp' },
      { c: CIZ.c, mod: 'carp' },
      { c: ISK.c, mod: 'ust' },
    ],
  });
  SAHNE.hazir();

})();
