<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>S-013 Mozaik — Atölye örnek görseli</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #8a7d68; }
  canvas { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<script src="../../sahne/sahne.js"></script>
<script>
// S-013 Mozaik — küçük kare taşlar (tessera), biçimlerin çevresinden dolanan sıralar (opus vermiculatum),
// arka planda düz sıralar (opus tessellatum), görünür derz, altın smalti gök.
// Yöntem: bölge haritası → Öklid uzaklık dönüşümü → eş uzaklık çizgileri boyunca yürüyerek taş dizme;
// boşluklar ara taşlarla doldurulur; her piksel kendi bölgesindeki en yakın döndürülmüş kareye atanır.
(function () {
  const S = SAHNE;
  const K = 2, W = 1024, W2 = 2048;
  const ctx = S.tuval(document.getElementById('tuval'), K);
  const rnd = S.rng(1313);

  // ------------------------------------------------------------ yardımcılar
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function gurultu(tohum) {
    const r = S.rng(tohum);
    const P = new Uint16Array(512), G = new Float32Array(256);
    for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
    for (let i = 0; i < 256; i++) P[i + 256] = P[i];
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
      const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }
  const n1 = gurultu(5), n2 = gurultu(17);

  // ------------------------------------------------------------ malzemeler (taş ve cam rampaları)
  const rampa = (a) => a.map(hex);
  const MAL = {
    yesil: { r: rampa(['#0d3820', '#165530', '#20703e', '#2f894d', '#4ea461', '#7fc27f']), lo: 0.2, hi: 0.56, cizgi: hex('#0a2616') },
    kasnak: { r: rampa(['#0b301b', '#134a29', '#1c6237', '#2a7d47', '#46985a']), lo: 0.18, hi: 0.5, cizgi: hex('#08200f') },
    mermer: { r: rampa(['#8d806a', '#ad9f84', '#c9bda2', '#dfd5bf', '#efe8d9', '#fbf6eb']), lo: 0.58, hi: 0.97, cizgi: hex('#675b48') },
    koyu: { r: rampa(['#17131a', '#221c26', '#30283a']), lo: 0.2, hi: 0.6 },
    koyuYesil: { r: rampa(['#081a10', '#0f2818', '#173622']), lo: 0.05, hi: 0.3 },
    yaprak: { r: rampa(['#253f20', '#33562a', '#456e35', '#5c8744', '#7aa257']), lo: 0.26, hi: 0.56, cizgi: hex('#1a2e16') },
    sap: { r: rampa(['#33502a', '#456b36', '#577f42']), lo: 0.3, hi: 0.5 },
    tac: { r: rampa(['#fdfaf4', '#f7eeec', '#efdade', '#e8c2c8', '#dca6b0']), cizgi: hex('#b38a8c') },
    orta: { r: rampa(['#9c5f18', '#c98a24', '#e4b03c', '#f4d168']), lo: 0.5, hi: 0.85 },
    tomurcuk: { r: rampa(['#c97890', '#de9cae', '#efc0cb']), lo: 0.75, hi: 0.95 },
    zemin: { r: rampa(['#7a4f30', '#97683f', '#b0804e', '#c59a64', '#d6b17b']), lo: 0.6, hi: 0.85 },
    cimen: { r: rampa(['#4f5f2c', '#62763a', '#78904a', '#90a65c']) },
    gunes: { r: rampa(['#f0d38a', '#f8e6b2', '#fff3d6', '#fffbef']) },
    altinAlem: { r: rampa(['#d39a32', '#eab94c', '#f7d469', '#ffe796', '#fff4cc']) },
    alemCizgi: { r: rampa(['#4a2410', '#5e3016']) },
    altin: { r: rampa(['#86601f', '#a3782a', '#bd9035', '#d3a646', '#e3bb5a', '#f0d077', '#fbe7a8']) },
    cerceveKoyu: { r: rampa(['#5a1a16', '#6e231c', '#7c2c22']) },
    cerceveAcik: { r: rampa(['#efe6d2', '#f7f0e0']) },
    lacivert: { r: rampa(['#1d2f63', '#24397a', '#2c4690']) },
  };
  const ref = S.renkHaritasi();
  const lumAt = (x, y) => { const c = ref.renk(x, y); return (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255; };
  function rampaRenk(m, pos) {
    const r = m.r;
    const i = clamp(Math.round(pos * (r.length - 1) + (rnd() - 0.5) * 1.1), 0, r.length - 1);
    return r[i].slice();
  }
  const lumRenk = (m) => (x, y) => rampaRenk(m, clamp((lumAt(x, y) - m.lo) / (m.hi - m.lo), 0, 1));

  // ------------------------------------------------------------ bölgeler (etiket haritası)
  const etiket = [null];
  function bolge(o) { etiket.push(Object.assign({ t: 8, mod: 'kontur', nC: 99, grup: 'x', cizgi: null }, o)); return etiket.length - 1; }
  const islem = [];
  const yolu = (d) => (typeof d === 'string' ? new Path2D(d) : d);
  const doldur = (id, d) => islem.push({ id, yol: yolu(d), tur: 'f' });
  const cizgiIslem = (id, d, w) => islem.push({ id, yol: yolu(d), tur: 's', w });
  const zincir = []; // çizgi boyunca dizilen taşlar
  function cizgiTas(id, pts, t) { zincir.push({ id, pts, t }); cizgiIslem(id, S.yol(pts), t); }
  const dik = (x1, y1, x2, y2) => S.yol([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], true);

  // gök (altın)
  const GUNES = S.gunes;
  const GOK = bolge({
    t: 11, mod: 'satir', nC: 2, grup: 'gok',
    renk: (x, y) => {
      const d = Math.hypot(x - GUNES.x, y - GUNES.y);
      const isik = clamp(0.66 - d / 1800 + (x - y) / 4000, 0, 1) + (d < 150 ? 0.25 * (1 - d / 150) : 0);
      let pos = isik + (rnd() - 0.5) * 0.34;
      if (rnd() < 0.035) pos = 1.05; // ışığı yakalayan taş
      if (rnd() < 0.03) pos = 0.08;
      return rampaRenk(MAL.altin, clamp(pos, 0, 1));
    },
    altin: true,
  });
  doldur(GOK, dik(-10, -10, 1034, 1034));
  const GUN = bolge({ t: 7, grup: 'gunes', renk: (x, y) => rampaRenk(MAL.gunes, clamp(1 - Math.hypot(x - GUNES.x, y - GUNES.y) / 50, 0, 1)), altin: true });
  doldur(GUN, S.daireYolu(GUNES.x, GUNES.y, 46));
  const ZEM = bolge({
    t: 10, mod: 'satir', nC: 1, grup: 'zemin',
    renk: (x, y) => {
      if (y < 822) return rampaRenk(MAL.cimen, clamp(0.6 + (rnd() - 0.5) * 0.6, 0, 1)); // çimen şeridi
      const bant = Math.floor((y - 822) / 30) % 3;
      return rampaRenk(MAL.zemin, clamp(0.82 - (y - 800) / 300 - (bant === 1 ? 0.18 : 0) + (rnd() - 0.5) * 0.3, 0, 1));
    },
  });
  doldur(ZEM, dik(-10, 800, 1034, 1034));

  // minare
  const MAL_MERMER = lumRenk(MAL.mermer);
  const minareParca = (d, t) => { const id = bolge({ t: t || 6.5, grup: 'minare', cizgi: MAL.mermer.cizgi, renk: MAL_MERMER }); doldur(id, d); return id; };
  const parcalar = S.minareParcalari();
  for (const p of parcalar) {
    if (p.ad === 'gövde-alt') {
      for (const [a, b] of [[488, 522], [522, 582], [582, 800]]) minareParca(dik(266, a, 334, b));
    } else if (p.tip === 'poligon') minareParca(S.yol(p.noktalar, true));
    else if (p.tip === 'korkuluk') minareParca(dik(p.x1, p.y1, p.x2, p.y2), 5.5);
    else if (p.tip === 'topuz') minareParca(p.yol);
  }
  for (const p of parcalar) {
    if (p.tip === 'korkuluk') {
      const id = bolge({ t: 3.6, mod: 'zincir', grup: 'minare', renk: (x, y) => rampaRenk(MAL.mermer, 0.05) });
      for (let i = 0; i < 8; i++) { const x = p.x1 + 7 + ((p.x2 - p.x1 - 14) * (i + 0.5)) / 8; cizgiTas(id, [[x, p.y1 + 4], [x, p.y2 - 3]], 3.6); }
    }
  }
  const ZZ = bolge({ t: 4.4, mod: 'zincir', grup: 'minare', renk: () => rampaRenk(MAL.mermer, 0.08) });
  for (const z of S.zikzakCizgileri()) cizgiTas(ZZ, z, 4.4);
  for (const p of S.minarePencereleri) doldur(bolge({ t: 4, grup: 'pencere', renk: lumRenk(MAL.koyu) }), S.kemerYolu(p.x, p.y, p.w, p.h));
  // alemler (koyu kontur halkası + altın)
  function alemBolge(a, tt) {
    const o = tt;
    const cx = a.yaka.cx;
    const yaka = S.elipsYolu({ cx, cy: a.yaka.cy, rx: a.yaka.rx, ry: a.yaka.ry, aci: 0 });
    const hl = a.hilal, R = hl.R;
    const hilal = S.hilalYolu(hl.cx, hl.cy, R);
    const orta = []; // hilalin orta çizgisi (sağ boynuzdan alttan dolanıp sol boynuza)
    for (let i = 0; i <= 24; i++) {
      const th = -0.42 + ((Math.PI + 0.84) * i) / 24, sn = Math.sin(th);
      const rho = (-0.8 * R * sn + Math.sqrt(0.64 * R * R * sn * sn + 2.25 * R * R)) / 2;
      orta.push([hl.cx + Math.cos(th) * (R + rho) / 2, hl.cy + Math.sin(th) * (R + rho) / 2]);
    }
    const cubuk = [[cx, a.cubuk.y2], [cx, a.cubuk.y1 + 2]];
    const rodW = a.cubuk.x2 - a.cubuk.x1;
    // koyu kontur halkası
    const halka = bolge({ t: tt, grup: 'alemCizgi', renk: () => rampaRenk(MAL.alemCizgi, rnd()) });
    const sekiller = [yaka, hilal, ...a.kureler.map((k) => S.daireYolu(k.cx, k.cy, k.r))];
    for (const d of sekiller) { doldur(halka, d); cizgiIslem(halka, d, 2 * o); }
    cizgiIslem(halka, S.yol(cubuk), rodW + 2 * o);
    cizgiIslem(halka, S.yol(orta), R - 0.45 * R + 2 * o);
    const altinR = (x, y) => rampaRenk(MAL.altinAlem, clamp(0.6 + (x - cx) / (a.yaka.rx * 1.4) + (rnd() - 0.5) * 0.35, 0, 1));
    const cub = bolge({ t: tt, mod: 'zincir', grup: 'alem', renk: altinR, altin: true });
    cizgiTas(cub, cubuk, tt);
    doldur(bolge({ t: tt, grup: 'alem', renk: altinR, altin: true }), yaka);
    for (const k of a.kureler) doldur(bolge({ t: Math.min(tt, k.r * 0.9), grup: 'alem', renk: altinR, altin: true }), S.daireYolu(k.cx, k.cy, k.r));
    const hil = bolge({ t: tt, mod: 'zincir', grup: 'alem', renk: altinR, altin: true });
    doldur(hil, hilal);
    cizgiTas(hil, orta, tt);
  }
  alemBolge(parcalar.find((p) => p.tip === 'alem').alem, 4);

  // kaide
  {
    const Kd = S.kaide;
    doldur(bolge({ t: 8, mod: 'satir', nC: 1, grup: 'kaide', cizgi: MAL.mermer.cizgi, renk: MAL_MERMER }), dik(Kd.x1, Kd.y1, Kd.x2, Kd.y2));
    doldur(bolge({ t: 6, grup: 'kaide', renk: (x, y) => rampaRenk(MAL.mermer, 0.95) }), dik(Kd.kornis.x1, Kd.kornis.y1, Kd.kornis.x2, Kd.kornis.y2));
    for (const p of Kd.pencereler) {
      const halka = bolge({ t: 4.5, grup: 'kaideCerceve', renk: () => rampaRenk(MAL.mermer, 0.1) });
      cizgiIslem(halka, S.kemerYolu(p.x, p.y, p.w, p.h), 9);
      doldur(bolge({ t: 4.5, grup: 'pencere', renk: lumRenk(MAL.koyu) }), S.kemerYolu(p.x, p.y, p.w, p.h));
    }
  }
  // kasnak
  for (let kat = 1; kat >= 0; kat--) {
    const q = S.kasnak[kat];
    doldur(bolge({ t: kat ? 7 : 6, grup: 'kasnak', cizgi: MAL.kasnak.cizgi, renk: lumRenk(MAL.kasnak) }), dik(q.x1, q.y1, q.x2, q.y2));
    for (const p of S.kasnakPencereleri(kat)) doldur(bolge({ t: kat ? 4.2 : 3.4, grup: 'pencere', renk: lumRenk(MAL.koyuYesil) }), S.kemerYolu(p.x, p.y, p.w, p.h));
  }
  // kubbe: kaburgalar arası dilimler
  {
    const prof = S.kubbeProfili(80);
    const kenar = (u) => prof.map((q) => [560 + u * q.r, q.y]);
    const uler = [-1];
    for (let k = 1; k < 16; k++) uler.push(Math.sin(-Math.PI / 2 + (Math.PI * k) / 16));
    uler.push(1);
    const yesilR = lumRenk(MAL.yesil);
    for (let i = 0; i < 16; i++) {
      const a = kenar(uler[i]), b = kenar(uler[i + 1]).reverse();
      doldur(bolge({ t: 7.5, grup: 'kubbe', cizgi: MAL.yesil.cizgi, renk: yesilR }), S.yol(a.concat(b), true));
    }
    const KB = bolge({ t: 4.2, mod: 'zincir', grup: 'kubbe', renk: (x, y) => rampaRenk(MAL.yesil, clamp((lumAt(x, y) - 0.2) / 0.36 - 0.45, 0, 1)) });
    for (let k = 1; k < 16; k++) {
      const pts = kenar(uler[k]).filter((p) => p[1] > 318);
      cizgiTas(KB, pts, 4.2);
    }
    // kubbe tabanı silmesi
    const silme = bolge({ t: 5, mod: 'zincir', grup: 'kubbe', renk: () => rampaRenk(MAL.yesil, 0.05) });
    cizgiTas(silme, [[362, 551], [758, 551]], 5);
  }
  alemBolge(S.alemParcalari(560, 300, 1), 5);

  // bitkiler
  const B = S.bitki;
  const SAP = bolge({ t: 4.6, mod: 'zincir', grup: 'sap', renk: lumRenk(MAL.sap) });
  for (const sp of B.saplar) cizgiTas(SAP, sp, 4.6);
  const yaprakR = lumRenk(MAL.yaprak);
  for (const y of B.yapraklar) {
    const yy = y.uzunluk < 48 ? { ...y, genislik: 0.55, uzunluk: y.uzunluk * 1.12 } : { ...y, genislik: 0.5 };
    doldur(bolge({ t: yy.uzunluk > 60 ? 5.2 : 4.4, grup: 'yaprak', cizgi: MAL.yaprak.cizgi, renk: yaprakR }), S.yaprakYolu(yy));
    const [a, b] = S.yaprakDamari(yy);
    const dm = bolge({ t: 3, mod: 'zincir', grup: 'yaprak', renk: () => rampaRenk(MAL.yaprak, 0.9) });
    cizgiTas(dm, [a, [a[0] + (b[0] - a[0]) * 0.85, a[1] + (b[1] - a[1]) * 0.85]], 3);
  }
  for (const t of B.tomurcuklar) doldur(bolge({ t: 3.8, grup: 'tomurcuk', renk: lumRenk(MAL.tomurcuk) }), S.tomurcukYolu(t));
  for (const c of B.cicekler) {
    const tacR = (x, y) => rampaRenk(MAL.tac, clamp(1.15 - Math.hypot(x - c.x, y - c.y) / (c.r * 0.85), 0, 1));
    for (const e of S.tacYapraklari(c)) doldur(bolge({ t: c.r > 40 ? 6 : 4.4, grup: 'cicek', cizgi: MAL.tac.cizgi, renk: tacR }), S.elipsYolu(e));
    doldur(bolge({ t: c.r > 40 ? 4.2 : 3.4, grup: 'orta', renk: (x, y) => rampaRenk(MAL.orta, clamp(0.55 + (x - c.x - (y - c.y)) / (c.r * 0.4), 0, 1)) }), S.daireYolu(c.x, c.y, c.r * 0.2));
  }
  // çerçeve şeridi (üç sıra)
  {
    const p = new Path2D();
    p.rect(0, 0, 1024, 1024);
    p.rect(22, 22, 980, 980);
    islem.push({ id: bolge({ t: 7.33, grup: 'cerceve', cerceve: true, renk: () => [0, 0, 0] }), yol: p, tur: 'f', kural: 'evenodd' });
  }

  // ------------------------------------------------------------ etiket haritaları (1024: yerleştirme, 2048: çizim)
  const idRenk = (id) => `rgb(${((id & 15) << 4) + 8},${(((id >> 4) & 15) << 4) + 8},${(((id >> 8) & 15) << 4) + 8})`;
  const NE = etiket.length;
  function harita(olcek) {
    const n = 1024 * olcek;
    const c = S.yeniTuval(n, n), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(olcek, 0, 0, olcek, 0, 0);
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (const o of islem) {
      x.fillStyle = x.strokeStyle = idRenk(o.id);
      if (o.tur === 'f') x.fill(o.yol, o.kural || 'nonzero');
      else { x.lineWidth = o.w; x.stroke(o.yol); }
    }
    const d = x.getImageData(0, 0, n, n).data;
    const L = new Uint16Array(n * n);
    for (let p = 0, i = 0; p < n * n; p++, i += 4) {
      const id = (d[i] >> 4) | ((d[i + 1] >> 4) << 4) | ((d[i + 2] >> 4) << 8);
      L[p] = id < NE ? id : 0;
    }
    return L;
  }
  const L1 = harita(1), L2 = harita(2);

  // Öklid uzaklık dönüşümü (Felzenszwalb)
  const D = new Float32Array(W * W);
  {
    const INF = 1e20, f = new Float64Array(W), d = new Float64Array(W), z = new Float64Array(W + 1), v = new Int32Array(W);
    const dt = (n) => {
      let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < n; q++) {
        let sx = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (sx <= z[k]) { k--; sx = (f[q] + q * q - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = sx; z[k + 1] = INF;
      }
      k = 0;
      for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    };
    const sinir = new Uint8Array(W * W);
    for (let y = 0; y < W - 1; y++) for (let x = 0; x < W - 1; x++) { const p = y * W + x; if (L1[p] !== L1[p + 1] || L1[p] !== L1[p + W]) sinir[p] = 1; }
    for (let x = 0; x < W; x++) { for (let y = 0; y < W; y++) f[y] = sinir[y * W + x] ? 0 : INF; dt(W); for (let y = 0; y < W; y++) D[y * W + x] = d[y]; }
    for (let y = 0; y < W; y++) { const o = y * W; for (let x = 0; x < W; x++) f[x] = D[o + x]; dt(W); for (let x = 0; x < W; x++) D[o + x] = Math.sqrt(d[x]) + 0.5; }
  }
  const Ds = (x, y) => {
    x = clamp(x, 0, W - 1.001); y = clamp(y, 0, W - 1.001);
    const xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi, p = yi * W + xi;
    const a = D[p], b = D[p + 1], c = D[p + W], d = D[p + W + 1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  const Lab = (x, y) => L1[clamp(Math.round(y), 0, W - 1) * W + clamp(Math.round(x), 0, W - 1)];
  const grad = (x, y) => [(Ds(x + 1, y) - Ds(x - 1, y)) / 2, (Ds(x, y + 1) - Ds(x, y - 1)) / 2];

  // ------------------------------------------------------------ taşlar
  const G = 12, GW = Math.ceil(1024 / G) + 2;
  const izgara = Array.from({ length: GW * GW }, () => []);
  const tas = [];
  function tasKoy(x, y, ang, reg, t, k, o) {
    const e = etiket[reg];
    const kucuk = t < 6 ? 0.04 : 0;
    const tt = { x, y, ang: ang + (rnd() - 0.5) * 0.14, reg, t, k, hu: t * (0.42 + kucuk + rnd() * 0.05), hv: t * (0.41 + kucuk + rnd() * 0.05), ...(o || {}) };
    tas.push(tt);
    izgara[clamp(Math.floor(y / G) + 1, 0, GW - 1) * GW + clamp(Math.floor(x / G) + 1, 0, GW - 1)].push(tas.length - 1);
    return tt;
  }
  function yakinVar(reg, x, y, r) {
    const gx = Math.floor(x / G) + 1, gy = Math.floor(y / G) + 1, c = Math.ceil(r / G);
    for (let j = gy - c; j <= gy + c; j++) {
      if (j < 0 || j >= GW) continue;
      for (let i = gx - c; i <= gx + c; i++) {
        if (i < 0 || i >= GW) continue;
        for (const idx of izgara[j * GW + i]) {
          const q = tas[idx];
          if (q.reg === reg && (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y) < r * r) return true;
        }
      }
    }
    return false;
  }

  // 1) çizgi boyunca taşlar
  for (const z of zincir) {
    const pts = z.pts;
    let kalan = 0;
    let ilk = true;
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const L = Math.hypot(bx - ax, by - ay);
      const ang = Math.atan2(by - ay, bx - ax);
      let s = ilk ? z.t * 0.5 : kalan;
      ilk = false;
      while (s <= L) {
        const x = ax + ((bx - ax) * s) / L, y = ay + ((by - ay) * s) / L;
        if (Lab(x, y) === z.id && !yakinVar(z.id, x, y, z.t * 0.7)) tasKoy(x, y, ang, z.id, z.t, 0);
        s += z.t;
      }
      kalan = s - L;
    }
  }

  // 2) eş uzaklık çizgileri boyunca yürüyerek (andamento)
  function izdus(x, y, L) {
    for (let i = 0; i < 3; i++) {
      const d = Ds(x, y) - L;
      const [gx, gy] = grad(x, y);
      const g2 = gx * gx + gy * gy;
      if (g2 < 0.05) break;
      x -= (d * gx) / g2; y -= (d * gy) / g2;
    }
    return [x, y];
  }
  function siraYuru(reg, sx, sy, L, t, k) {
    let [x, y] = izdus(sx, sy, L);
    if (Lab(x, y) !== reg || Math.abs(Ds(x, y) - L) > 0.3 * t || yakinVar(reg, x, y, 0.85 * t)) return;
    let [gx, gy] = grad(x, y);
    if (gx * gx + gy * gy < 0.2) return;
    tasKoy(x, y, Math.atan2(gx, -gy), reg, t, k);
    const x0 = x, y0 = y;
    for (const yon of [1, -1]) {
      x = x0; y = y0;
      for (let adim = 0; adim < 3000; adim++) {
        [gx, gy] = grad(x, y);
        const gl = Math.hypot(gx, gy);
        if (gl < 0.45) break;
        const tx = (-gy / gl) * yon, ty = (gx / gl) * yon;
        let [nx, ny] = izdus(x + tx * t, y + ty * t, L);
        if (Lab(nx, ny) !== reg || Math.abs(Ds(nx, ny) - L) > 0.25 * t) break;
        const adimL = Math.hypot(nx - x, ny - y);
        if (adimL < t * 0.6 || adimL > t * 1.5) break;
        if (yakinVar(reg, nx, ny, 0.8 * t)) break;
        tasKoy(nx, ny, Math.atan2(ny - y, nx - x), reg, t, k);
        x = nx; y = ny;
      }
    }
  }
  {
    const aday = [];
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        const p = y * W + x, reg = L1[p];
        if (!reg) continue;
        const e = etiket[reg];
        if (e.mod === 'zincir') continue;
        const t = e.t, d = D[p];
        const k = Math.floor(d / t);
        if (k >= e.nC) continue;
        if (Math.abs(d - (k + 0.5) * t) < 0.5) aday.push(k * 4194304 + p);
      }
    }
    aday.sort((a, b) => a - b);
    for (const a of aday) {
      const k = Math.floor(a / 4194304), p = a - k * 4194304, x = p % W, y = (p / W) | 0;
      const reg = L1[p], e = etiket[reg];
      if (!yakinVar(reg, x, y, 0.9 * e.t)) siraYuru(reg, x, y, (k + 0.5) * e.t, e.t, k);
    }
  }

  // 3) arka planda düz sıralar (opus tessellatum)
  for (let reg = 1; reg < NE; reg++) {
    const e = etiket[reg];
    if (e.mod !== 'satir') continue;
    const t = e.t;
    const ofs = rnd() * t;
    for (let j = 0; j * t < 1040; j++) {
      const yb = ofs + j * t;
      let x = -rnd() * t;
      const faz = rnd() * 6;
      while (x < 1030) {
        const y = yb + 1.4 * Math.sin(x * 0.012 + faz);
        if (x >= 0 && x < W && y >= 0 && y < W && Lab(x, y) === reg && Ds(x, y) > e.nC * t + 0.15 * t && !yakinVar(reg, x, y, 0.82 * t)) {
          tasKoy(x, y, Math.atan(1.4 * 0.012 * Math.cos(x * 0.012 + faz)), reg, t, 99);
        }
        x += t * (0.97 + rnd() * 0.08);
      }
    }
  }

  // 4) ara taşlar: kalan boşluklar
  {
    const ort = new Uint8Array(W * W);
    const isaretle = (q) => {
      const R = Math.ceil(q.t * 0.75);
      const c = Math.cos(q.ang), s = Math.sin(q.ang), h = q.t * 0.52;
      for (let y = Math.max(0, Math.floor(q.y - R)); y <= Math.min(W - 1, Math.ceil(q.y + R)); y++) {
        for (let x = Math.max(0, Math.floor(q.x - R)); x <= Math.min(W - 1, Math.ceil(q.x + R)); x++) {
          const p = y * W + x;
          if (L1[p] !== q.reg) continue;
          const dx = x - q.x, dy = y - q.y;
          if (Math.abs(dx * c + dy * s) < h && Math.abs(-dx * s + dy * c) < h) ort[p] = 1;
        }
      }
    };
    tas.forEach(isaretle);
    for (let gecis = 0; gecis < 2; gecis++) {
      for (let y = 0; y < W; y++) {
        for (let x = 0; x < W; x++) {
          const p = y * W + x;
          if (ort[p]) continue;
          const reg = L1[p];
          if (!reg) continue;
          const e = etiket[reg], t = e.t * (gecis ? 0.8 : 1);
          // yerel boşluğun ağırlık merkezi
          let sx = 0, sy = 0, n = 0;
          const R = Math.ceil(t * 0.6);
          for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
            const xx = x + i, yy = y + j;
            if (xx < 0 || yy < 0 || xx >= W || yy >= W) continue;
            const q = yy * W + xx;
            if (!ort[q] && L1[q] === reg) { sx += xx; sy += yy; n++; }
          }
          if (n < (gecis ? 3 : 6)) { ort[p] = 1; continue; }
          const cx = sx / n, cy = sy / n;
          const [gx, gy] = grad(cx, cy);
          const ang = gx * gx + gy * gy > 0.2 ? Math.atan2(gx, -gy) : (e.mod === 'satir' ? 0 : rnd() * Math.PI);
          const q = tasKoy(cx, cy, ang, reg, t, Math.floor(Ds(cx, cy) / e.t), { ara: true });
          isaretle(q);
          ort[p] = 1;
        }
      }
    }
  }

  // ------------------------------------------------------------ taş renkleri
  const NT = tas.length;
  const TX = new Float32Array(NT), TY = new Float32Array(NT), TC = new Float32Array(NT), TS = new Float32Array(NT);
  const IHU = new Float32Array(NT), IHV = new Float32Array(NT), HU = new Float32Array(NT), TR = new Uint16Array(NT);
  const CR = new Float32Array(NT), CG = new Float32Array(NT), CB = new Float32Array(NT), EG = new Float32Array(NT), EX = new Float32Array(NT), EY = new Float32Array(NT), PAR = new Float32Array(NT);
  for (let i = 0; i < NT; i++) {
    const q = tas[i], e = etiket[q.reg];
    let c;
    if (e.cerceve) {
      const k = Math.floor(Ds(q.x, q.y) / e.t);
      if (k === 1) c = (Math.round((q.x + q.y) / 7.33) % 3 === 0) ? rampaRenk(MAL.lacivert, rnd()) : rampaRenk(MAL.cerceveAcik, rnd());
      else c = rampaRenk(MAL.cerceveKoyu, rnd());
    } else {
      c = e.renk(q.x, q.y, q);
      // dış sıra: komşu grup farklıysa kontur rengi
      if (e.cizgi && Ds(q.x, q.y) < e.t * 0.95) {
        const [gx, gy] = grad(q.x, q.y), gl = Math.hypot(gx, gy) || 1;
        const kom = Lab(q.x - (gx / gl) * e.t * 0.9, q.y - (gy / gl) * e.t * 0.9);
        if (kom && etiket[kom].grup !== e.grup && etiket[kom].grup !== 'alemCizgi') c = e.cizgi.map((v) => v * (0.85 + rnd() * 0.3));
      }
    }
    const jit = 0.93 + rnd() * 0.14;
    TX[i] = q.x; TY[i] = q.y; TC[i] = Math.cos(q.ang); TS[i] = Math.sin(q.ang);
    HU[i] = q.hu; IHU[i] = 1 / q.hu; IHV[i] = 1 / q.hv; TR[i] = q.reg;
    CR[i] = c[0] * jit; CG[i] = c[1] * jit; CB[i] = c[2] * jit;
    EG[i] = e.altin ? 0.75 + rnd() * 0.55 : 1;            // altın taşın ışığı yakalaması
    PAR[i] = e.altin ? 1 : 0;
    EX[i] = (rnd() - 0.5) * (e.altin ? 0.32 : 0.12); EY[i] = (rnd() - 0.5) * (e.altin ? 0.32 : 0.12); // taşın eğimi
  }
  const izg2 = Array.from({ length: GW * GW }, () => []);
  for (let i = 0; i < NT; i++) izg2[clamp(Math.floor(TY[i] / G) + 1, 0, GW - 1) * GW + clamp(Math.floor(TX[i] / G) + 1, 0, GW - 1)].push(i);
  const hucre = izg2.map((a) => Int32Array.from(a));

  // ------------------------------------------------------------ piksel piksel çizim
  const im = ctx.createImageData(W2, W2);
  const od = im.data;
  const LX = 0.6, LY = -0.8; // ışık: sağ üst
  const DERZ = [128, 116, 96];
  for (let y2 = 0; y2 < W2; y2++) {
    const Y = (y2 + 0.5) / K;
    const gy = Math.floor(Y / G) + 1;
    for (let x2 = 0; x2 < W2; x2++) {
      const X = (x2 + 0.5) / K;
      const p2 = y2 * W2 + x2, i4 = p2 * 4;
      const reg = L2[p2];
      const gx = Math.floor(X / G) + 1;
      let d1 = 9, d2 = 9, b1 = -1, ua = 0, va = 0;
      for (let j = gy - 1; j <= gy + 1; j++) {
        for (let i = gx - 1; i <= gx + 1; i++) {
          const h = hucre[j * GW + i];
          for (let m = 0; m < h.length; m++) {
            const q = h[m];
            if (TR[q] !== reg) continue;
            const dx = X - TX[q], dy = Y - TY[q];
            const u = (dx * TC[q] + dy * TS[q]) * IHU[q], v = (-dx * TS[q] + dy * TC[q]) * IHV[q];
            const au = u < 0 ? -u : u, av = v < 0 ? -v : v;
            const d = (au > av ? au : av) + 0.13 * au * au * av * av;
            if (d < d1) { d2 = d1; d1 = d; b1 = q; ua = u; va = v; } else if (d < d2) d2 = d;
          }
        }
      }
      const nz = n1(X * 0.7, Y * 0.7);
      // derz
      let r = DERZ[0] * (0.85 + nz * 0.3), g = DERZ[1] * (0.85 + nz * 0.3), b = DERZ[2] * (0.85 + nz * 0.3);
      if (b1 >= 0) {
        const dd = d1 + (nz - 0.5) * 0.09;
        const kenar = (1 - dd) * HU[b1] * K;          // taş kenarına piksel uzaklığı
        const ara = (d2 - d1) * HU[b1] * K - (HU[b1] < 3 ? 0.55 : 0.9);      // iki taş arasındaki derz
        let a = clamp(kenar, 0, 1) * clamp(ara, 0, 1);
        if (a > 0) {
          let sh = EG[b1] + EX[b1] * ua + EY[b1] * va;
          const au = ua < 0 ? -ua : ua, av = va < 0 ? -va : va;
          const m = au > av ? au : av;
          if (m > 0.7) { // pah: ışığa bakan kenar açık, öteki koyu
            let nx, ny;
            if (au > av) { const sg = ua > 0 ? 1 : -1; nx = TC[b1] * sg; ny = TS[b1] * sg; } else { const sg = va > 0 ? 1 : -1; nx = -TS[b1] * sg; ny = TC[b1] * sg; }
            sh += ((m - 0.7) / 0.3) * 0.34 * (nx * LX + ny * LY);
          }
          sh += (n2(X * 2.3, Y * 2.3) - 0.5) * 0.08;
          let tr = CR[b1] * sh, tg = CG[b1] * sh, tb = CB[b1] * sh;
          if (PAR[b1] && sh > 1.12) { const w = (sh - 1.12) * 1.2; tr += (255 - tr) * w; tg += (250 - tg) * w; tb += (220 - tb) * w; }
          r += (tr - r) * a; g += (tg - g) * a; b += (tb - b) * a;
        }
      }
      od[i4] = r; od[i4 + 1] = g; od[i4 + 2] = b; od[i4 + 3] = 255;
    }
  }
  ctx.putImageData(im, 0, 0);
  // duvara vuran ışık: sağ üstten hafif aydınlık, sol alt hafif gölge
  const isik = ctx.createLinearGradient(1024, 0, 0, 1024);
  isik.addColorStop(0, 'rgba(255,240,200,0.10)');
  isik.addColorStop(0.5, 'rgba(255,240,200,0)');
  isik.addColorStop(1, 'rgba(40,25,10,0.16)');
  ctx.fillStyle = isik;
  ctx.fillRect(0, 0, 1024, 1024);

  SAHNE.hazir();
})();
</script>
