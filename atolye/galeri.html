<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atölye Stil Kataloğu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
  /* Yerleşim: numune defteri. Künye, aile süzgeci, kare numune ızgarası; numuneye dokununca ayrıntı sayfası açılır. */
  :root {
    --zemin: #F2F3EE;
    --kagit: #FAFBF7;
    --murekkep: #17211C;
    --soluk: #5B665F;
    --cizgi: #D6DBD2;
    --kubbe: #2C6A3B;
    --altin: #94701F;
    --perde: rgba(16, 22, 19, 0.62);
    --font-baslik: 'Bricolage Grotesque', 'DejaVu Sans', system-ui, sans-serif;
    --font-metin: 'Literata', 'DejaVu Serif', Georgia, serif;
    --font-kod: 'IBM Plex Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --zemin: #0F1512; --kagit: #161E1A; --murekkep: #E5EAE4; --soluk: #9AA69E; --cizgi: #2A352F;
      --kubbe: #7DC490; --altin: #D8B660; --perde: rgba(0, 0, 0, 0.72); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --zemin: #0F1512; --kagit: #161E1A; --murekkep: #E5EAE4; --soluk: #9AA69E; --cizgi: #2A352F;
    --kubbe: #7DC490; --altin: #D8B660; --perde: rgba(0, 0, 0, 0.72); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--zemin);
    color: var(--murekkep);
    font-family: var(--font-metin);
    font-size: 16px;
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px 72px;
  }
  .sayfa { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }

  /* künye */
  .kunye { display: grid; gap: 14px; max-width: 760px; }
  .ust-etiket, .kod, .olcu, .say { font-family: var(--font-kod); }
  .ust-etiket { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soluk); margin: 0; }
  h1 {
    font-family: var(--font-baslik); font-weight: 700; font-size: clamp(38px, 6vw, 64px);
    line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
  }
  h1 .yesil { color: var(--kubbe); }
  .giris { margin: 0; font-size: 17px; max-width: 64ch; color: var(--murekkep); }
  .olcu { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--soluk); margin: 0; padding: 0; list-style: none; }
  .olcu b { color: var(--murekkep); font-weight: 500; }

  /* süzgeç */
  .suzgec { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--cizgi); padding-top: 18px; }
  .sekme {
    font: 500 14px/1 var(--font-baslik); color: var(--murekkep); background: transparent;
    border: 1px solid var(--cizgi); border-radius: 999px; padding: 9px 14px; cursor: pointer;
    display: inline-flex; gap: 8px; align-items: center;
  }
  .sekme .say { font-size: 12px; color: var(--soluk); }
  .sekme[aria-pressed="true"] { background: var(--murekkep); color: var(--zemin); border-color: var(--murekkep); }
  .sekme[aria-pressed="true"] .say { color: var(--zemin); opacity: 0.75; }
  .ara { margin-left: auto; min-width: 0; flex: 0 1 240px; }
  .ara input {
    width: 100%; font: 15px var(--font-metin); color: var(--murekkep); background: var(--kagit);
    border: 1px solid var(--cizgi); border-radius: 8px; padding: 9px 12px;
  }
  :focus-visible { outline: 2px solid var(--kubbe); outline-offset: 2px; }

  /* ızgara */
  .izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 28px 20px; }
  .numune { display: grid; gap: 10px; align-content: start; text-decoration: none; color: inherit; min-width: 0; }
  .numune .kare { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; border-radius: 4px; background: var(--kagit); outline: 1px solid var(--cizgi); outline-offset: -1px; }
  .numune img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
  .numune:hover img, .numune:focus-visible img { transform: scale(1.03); }
  .satir { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .kod { font-size: 13px; font-weight: 500; color: var(--kubbe); font-variant-numeric: tabular-nums; }
  .ozgun .kod { color: var(--altin); }
  .aile-adi { font-family: var(--font-kod); font-size: 11px; letter-spacing: 0.04em; color: var(--soluk); text-align: right; }
  .numune h3 { font: 700 19px/1.15 var(--font-baslik); margin: 0; letter-spacing: -0.01em; }
  .numune .en { font-style: italic; color: var(--soluk); font-size: 14px; margin-top: -6px; }
  .numune p { margin: 0; font-size: 14px; color: var(--soluk); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bos { color: var(--soluk); padding: 40px 0; }
  .aile-baslik { grid-column: 1 / -1; font: 700 14px var(--font-baslik); letter-spacing: 0.08em; text-transform: uppercase; color: var(--soluk); border-bottom: 1px solid var(--cizgi); padding-bottom: 8px; margin-top: 8px; display: flex; justify-content: space-between; }

  /* ayrıntı */
  dialog {
    border: 0; padding: 0; background: var(--kagit); color: var(--murekkep);
    width: min(1160px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); border-radius: 8px; overflow: auto;
  }
  dialog::backdrop { background: var(--perde); }
  .ayrinti { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .ayrinti .gorsel { background: var(--zemin); }
  .ayrinti .gorsel img { position: sticky; top: 0; }
  .bilgi h2:focus { outline: none; }
  .ayrinti .gorsel img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .bilgi { padding: 28px 30px 30px; display: grid; gap: 18px; align-content: start; min-width: 0; }
  .bilgi .ust { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bilgi h2 { font: 700 clamp(28px, 3.4vw, 40px)/1.05 var(--font-baslik); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
  .bilgi .en { font-style: italic; color: var(--soluk); margin-top: -10px; }
  .bilgi p { margin: 0; }
  .bilgi h4 { margin: 0 0 6px; font: 500 12px var(--font-kod); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soluk); }
  .bilgi ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .rozet { font: 500 12px var(--font-kod); color: var(--altin); border: 1px solid currentColor; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .palet { display: flex; flex-wrap: wrap; gap: 8px; }
  .renk { display: grid; gap: 4px; justify-items: start; background: none; border: 0; padding: 0; cursor: pointer; color: var(--soluk); font: 12px var(--font-kod); }
  .renk span:first-child { width: 44px; height: 44px; border-radius: 4px; outline: 1px solid var(--cizgi); outline-offset: -1px; }
  .etiketler { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiketler span { font: 12px var(--font-kod); color: var(--soluk); background: var(--zemin); border-radius: 4px; padding: 3px 8px; }
  .gezinti { display: flex; gap: 8px; align-items: center; }
  .dugme {
    font: 500 14px/1 var(--font-baslik); color: var(--murekkep); background: transparent; border: 1px solid var(--cizgi);
    border-radius: 6px; padding: 9px 12px; cursor: pointer; text-decoration: none;
  }
  .dugme:hover { border-color: var(--murekkep); }
  .kapat { margin-left: auto; }
  .kaynak { font: 13px var(--font-kod); color: var(--soluk); overflow-wrap: anywhere; }
  .bildirim { font: 12px var(--font-kod); color: var(--kubbe); min-height: 1em; }

  @media (max-width: 820px) {
    .ayrinti { grid-template-columns: minmax(0, 1fr); }
    .ayrinti .gorsel img { position: static; }
    .bilgi { padding: 22px 18px 24px; }
    .ara { margin-left: 0; flex-basis: 100%; }
  }
  @media (max-width: 520px) {
    .izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
    .numune h3 { font-size: 16px; }
    .numune p, .aile-adi { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .numune img { transition: none; } }
</style>

</head>
<body>
<div class="sayfa">
  <header class="kunye">
    <p class="ust-etiket">Atölye · Grafik, tasarım ve sanat</p>
    <h1>Stil <span class="yesil">Kataloğu</span></h1>
    <p class="giris">Her render stili bir numara ve adla kataloğa girer. Bütün örnekler aynı sahneyi çizer: Yeşil Kubbe, minare ve çiçekler. Görseller arasındaki fark yalnızca stilden gelir. Hepsi kodla çizildi.</p>
    <ul class="olcu" id="olcu"></ul>
  </header>

  <nav class="suzgec" aria-label="Aileye göre süz" id="suzgec"></nav>

  <main class="izgara" id="izgara" aria-live="polite"></main>
</div>

<dialog id="ayrinti" aria-labelledby="ayrinti-ad"></dialog>

<script>
  const KATALOG = {"aileler":["Boya ve Kuru Teknikler","Türk-İslam Sanatları","Uzak Doğu","Sanat Akımları","Grafik ve Dijital","Atölye Özgün"],"stiller":[{"kod":"S-001","no":1,"ad":"Suluboya","ad_en":"Watercolor","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Saydam, üst üste binen boya katmanları, ıslakta açılmalar ve kâğıdın beyazı.","tanim":"Suluboya, suyla inceltilmiş saydam pigmentlerin kâğıda katman katman sürülmesiyle yapılır; renkler üst üste bindikçe koyulaşır, beyaz boya yerine kâğıdın kendisi ışık olarak bırakılır. Islak kâğıtta renkler yumuşakça birbirine akar, kuruyan yıkamalar ise kenarlarında koyu, keskin bir iz bırakır. Manzara, mimari eskiz, seyahat defteri ve botanik resimde çok kullanılır.","koken":"Kökleri Doğu Asya mürekkep resmine ve Orta Çağ el yazması süslemesine uzanır; Avrupa'da Albrecht Dürer'in doğa çalışmalarıyla belirginleşir. 18. ve 19. yüzyıl İngiliz okulu (Thomas Girtin, J. M. W. Turner, John Sell Cotman) tekniği bağımsız bir sanat dalına dönüştürdü; John Singer Sargent ve Winslow Homer gevşek, ışıklı suluboyanın ustaları oldu.","ayirt_edici":["Üst üste binen saydam yıkamalar: kubbenin gölgeli yanında ikinci kat sır koyulaşıp keskin, koyu bir kenarla kurumuş","Gökte, kubbede ve yaprak kütlesinde ıslak üstüne ıslak açılmalar; karnabahar gibi saçaklı, koyu kenarlı lekeler","Kaybolan ve bulunan kenarlar: boya kalem çizgisinin kimi yerde dışına taşıyor, kimi yerde geride kalıp beyaz bir pay bırakıyor; yapının ışıklı sağ ucu kâğıda eriyor","Yapraklar tek fırça darbesi ya da ortasında beyaz damar kalan iki yarım darbe; kimi ucunda ıslakta dağılmış, kimi kuru fırçayla kırılmış","Kâğıdın beyazı ışık olarak bırakılmış: güneş, kubbedeki parlak şerit, minarenin ışıklı yanı ve yalnız gölge yanına soluk bir darbe vurulmuş beyaz çiçekler","Pigment çökelmesi (granülasyon), soğuk preslenmiş kâğıt dokusu, yer yer görünen kurşun kalem altlığı ve kenarlara doğru bitmemiş bırakılmış düzensiz sınır"],"palet":["#5C7CB7","#9FB571","#35694C","#A99E9C","#C2862F","#AD657A","#F7F4EC"],"kodla_cizim":"Her yıkama piksel başına bir kapsama alanıdır: bölge haritasından alınan maske bulanıklaştırılıp gürültüyle değişen bir eşik ve yumuşaklıkla kesilir (boya kalem çizgisinin dışına taşar ya da geride kalır; kenar yer yer sert, yer yer kâğıda erir) ya da Tyler Hobbs usulü yinelemeli bozulmuş çokgenler düşük saydamlıkta onlarca kat doldurulur. Alanın bulanık kopyasından farkıyla kuruyan kenardaki pigment birikimi, kâğıt yüksekliği ve ince gürültüden granülasyon, Hobbs damlalarıyla karnabahar açılmaları hesaplanır. Yapraklar baskısı değişen fırça darbesi çokgenleridir (tek ya da arada beyaz damar kalan iki yarım), ucu ya da bir yanı bulanık kopyayla karıştırılarak eritilir, kimi kâğıt dokusuyla eşiklenip kuru fırça gibi kırılır; taç yapraklar bozulmuş serbest biçimlerdir ve yalnız ışıktan uzak yanlarına soluk gölge darbesi vurulur. Pencereler tek darbelik bozuk kemer lekeleridir. Yoğunluk yedi pigmentin (yaprak yeşili, viridyen, ultramarin, seruleum, ham siena, kinakridon gül, gamboj) soğurma vektörüyle çarpılarak biriktirilir ve renk = kâğıt × exp(−Σ yoğunluk) ile çarpımsal karışır. Kaburgaların ışıklı yanı nemli fırçayla boya kaldırır gibi açılır; kurşun kalem ayrı bir tuvalde titrek, kesik çizgilerle çizilir; kâğıt dokusu en sonda kabartma ışığıyla eklenir.","etiketler":["suluboya","saydam","ıslak teknik","kâğıt dokusu","boya","geleneksel"],"klasor":"S-001-suluboya","gorsel":"stiller/S-001-suluboya/ornek.webp","kucuk":"stiller/S-001-suluboya/kucuk.webp"},{"kod":"S-002","no":2,"ad":"Yağlıboya (Empasto)","ad_en":"Oil Painting (Impasto)","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Kalın, kıl izli fırça darbeleri, ışık yakalayan boya sırtları ve zengin ışık-gölge.","tanim":"Empasto, yağlıboyanın tüpten çıktığı kıvamda ya da daha kalın sürülerek fırça ve spatula izlerinin yüzeyde kabartı olarak kaldığı tekniktir. Darbeler biçimi izler, boya sırtları ışığı yakalar; renk doygun, ışık-gölge (chiaroscuro) güçlüdür. Boyanın ince sürüldüğü yerlerde tuval bezinin dokusu ve alttaki astar seçilir.","koken":"Yağlıboya 15. yüzyılda Flaman ressamlarınca (Jan van Eyck) olgunlaştırıldı; kalın boya sürme Tiziano'nun geç dönemi ve Rembrandt'ın ışıklı empastolarıyla öne çıktı. 19. yüzyılda Van Gogh hareketli, kalın darbeleri bir anlatım aracına dönüştürdü; 20. yüzyılda Frank Auerbach ve Leon Kossoff boyanın maddesini resmin konusu hâline getirdi.","ayirt_edici":["Biçimi izleyen darbeler: kubbede kaburgalar boyunca, kasnakta yatay, minarede silindir boyunca dikey, gökte geniş ve eğik süpürmeler","Her darbede kıl izleri: rengi hafifçe değişen paralel çizgiler ve fırçada tam karışmamış ikinci renk","Sağ üstten ışık alan kabartmalı boya sırtları, darbe sonlarında yığılan boya","Kubbenin koyu yeşil gölgesinden sarı-yeşil ışığına uzanan güçlü ışık-gölge","Çiçeklerde, minarenin ışıklı yanında ve güneşte çapraz atılmış kalın beyaz empasto vuruşları","Kenarlara doğru ince sürülmüş boyanın arasından görünen sıcak astar ve tuval bezi dokusu"],"palet":["#154394","#518CCB","#C0D683","#2B6B30","#07251F","#E8D6B1","#F5EFD4","#3F622B"],"kodla_cizim":"Işık modeliyle (kubbe için dönel yüzey normali, kasnak ve minare için silindir) doygun renkli bir hedef tablo kurulur. Hertzmann usulü beş katta (fırça yarıçapı 18 → 1,4) boyanır: her katta tuval ile hedef arasındaki fark pencere ortalamasıyla ölçülür; fark büyük yerden başlayan darbe bölgeye özgü bir yön alanında (kaburga meridyeni, yatay, eğik süpürme, yaprak ekseni) ilerler ve renk sapınca durur. Darbe 3–26 kıllık bir demettir; aynı Path2D'ler ayrı bir yükseklik tuvaline toplamalı çizilir. Minare gövdesi silindir ışığına göre renklenen uzun dikey kıl demetleriyle, kaburgalar, şerefeler, zikzak bant ve alemler küçük fırçayla ayrıca işlenir. Yükseklik yumuşatılıp yüksek geçiren süzgeçten geçirilir, ince boyalı yerlere düz dokuma bez dokusu eklenir ve normal haritasıyla sağ üstten yayınık ve parlak ışık verilir.","etiketler":["yağlıboya","empasto","fırça darbesi","kabartı","tuval","geleneksel"],"klasor":"S-002-yagliboya","gorsel":"stiller/S-002-yagliboya/ornek.webp","kucuk":"stiller/S-002-yagliboya/kucuk.webp"},{"kod":"S-003","no":3,"ad":"Yumuşak Pastel","ad_en":"Soft Pastel","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Tonlu kâğıtta tebeşirimsi, kırık vuruşlar; kâğıt dişinden görünen zemin ve parmakla dağıtılmış geçişler.","tanim":"Yumuşak pastel, az bağlayıcıyla sıkıştırılmış saf pigment çubuklarıdır; pürüzlü kâğıda sürtülünce pigment yalnız dişin tepelerine tutunur ve vuruşlar tozlu, kırık görünür. Çubuğun yan yüzüyle geniş alanlar, ucuyla tarama çizgileri yapılır; parmakla dağıtılan yerler yumuşak geçişler verir, üstüne gelen keskin vuruşlar onlarla karşıtlık kurar. Tonlu kâğıdın rengi vuruşların arasından görünerek resmin bir parçası olur.","koken":"18. yüzyılda Rosalba Carriera ve Maurice Quentin de La Tour'un portreleriyle saygınlık kazandı; Jean-Siméon Chardin de ustalarındandır. 19. yüzyılda Edgar Degas katmanlı, taramalı pastelleriyle tekniği yeniden tanımladı; Mary Cassatt ve Odilon Redon onu izledi.","ayirt_edici":["Sıcak gri, petek dokulu tonlu kâğıt her yerde işin parçası: renk yalnız dişin tepelerinde kalıyor, vuruşların arasından ve boş bırakılmış kenarlardan kâğıt görünüyor","Çubuğun yan yüzüyle geniş, düz uçlu vuruşlar (gök, kasnak, zemin) ve uçla atılmış paralel tarama öbekleri (gökte, kubbede ve kaidede çapraz)","Gökte ve güneş halesinde parmakla dağıtılmış yumuşak, puslu geçişler; hemen yanlarında dağıtılmamış keskin vuruşlar","Yapraklar boyunca uzanan, araları açık paralel çizgiler; taç yapraklar göbekten dışa basınçlı beyaz vuruşlar, gölge yanında lavanta tarama","Pastel kalemle atılmış birkaç keskin çizgi: kubbenin gölgeli silueti, pencereler, yaprak ve taç yaprak kenarları","Tozlu, açık değerli, tebeşirimsi renkler; yağlıboyanın parlaklığı ve kabartması yok"],"palet":["#9D9487","#88ADCF","#D0DCA0","#4C7671","#F2EAD9","#AD9FC8","#E1B13C","#498956"],"kodla_cizim":"Kâğıt dişi, titreşimli altıgen petek ile çok ölçekli gürültüden kurulan 2048 piksellik bir yükseklik haritasıdır. Her katta vuruşlar ayrı bir tuvale basınç (saydamlık) olarak çizilir; pigment yalnız 'diş yüksekliği > 1 − basınç' olan piksellere yumuşak bir eşikle bırakılır, basınç düşük tutulduğu için kâğıt vuruşların içinden ve arasından görünür. Renkler ışık modelli, açık değerli bir hedeften okunur, tebeşir beyazıyla biraz açılır ve kırk kadar çubuktan oluşan sınırlı bir kutuya yuvarlanır (bazen ikinci en yakın çubuk: kırık renk). Sırayla yan yüzle seyrek alt kat, gökte gürültü maskeli parmakla dağıtma (bulanıklaştırma), orta vuruşlar, güneş halesi, uçla tarama öbekleri, pastel kalem ayrıntıları, zeminde yatay yan vuruşlar, paralel çizgilerle yapraklar ve basınçlı vuruşlarla çiçekler, en üstte yapılarda çapraz tarama öbekleri gelir; en sonda kâğıt dişinin kabartma ışığı eklenir (vuruş kabartması yoktur).","etiketler":["pastel","kuru teknik","tonlu kâğıt","doku","tarama","geleneksel"],"klasor":"S-003-pastel","gorsel":"stiller/S-003-pastel/ornek.webp","kucuk":"stiller/S-003-pastel/kucuk.webp"},{"kod":"S-004","no":4,"ad":"Karakalem","ad_en":"Graphite Pencil Drawing","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Kâğıdın dişine tutunan grafitle, biçimi izleyen tarama ve tekrar eden eskiz çizgileri.","tanim":"Karakalem, grafit kurşun kalemle yalnız gri tonlarla yapılan çizimdir. Ton, kalemin baskısıyla ve biçimin üzerinde dolaşan paralel ya da çapraz taramayla kurulur; yer yer parmakla ya da kâğıt kalemle (estompe) yayılarak yumuşatılır. Kurgu çizgileri, tekrar eden konturlar ve kenarlara doğru yarım bırakılan alanlar çizime canlılık verir. Eskiz defterlerinde, mimari ve akademik çizimde, resim hazırlıklarında kullanılır.","koken":"Grafit, 16. yüzyılda İngiltere'de Borrowdale'de bulunan saf yataklarla çizime girdi; 1795'te Nicolas-Jacques Conté'nin grafiti kille karıştırıp pişirerek yaptığı kalem, bugünkü sertlik derecelerini (H–B) mümkün kıldı. Jean-Auguste-Dominique Ingres'in kurşun kalem portreleri ve Adolph Menzel'in eskizleri tekniğin ustalık örnekleridir; akademik resim eğitiminde bugün de temel derstir.","ayirt_edici":["Kubbede kaburgalar boyunca uzanan tarama; gölge yanında enlem yaylarını izleyen çapraz tarama","İki üç kez, hafifçe kayarak ve baskısı değişerek çizilmiş konturlar; gölge yanında daha kalın çizgi","Kubbe ve minare eksenlerini, kat hizalarını ve kubbenin oranını gösteren açık kurgu çizgileri","Parmakla yayılmış yumuşak gri lekeler; ışıklı kenarlara yaslanıp dışa doğru düzgünce sönen derli toplu hale taraması","Grafitin kâğıt dişinde kırılan tanesi; koyu pencerelerde ve gölgelerde hafif metalik parlaklık","Kenarlara doğru gölgesi silinip yalnız çizgisi kalan, yarım bırakılmış çiçek ve yapraklar"],"palet":["#F1EFE9","#E4E2DD","#D1D0CC","#8F8F8F","#5D5E62","#49494D","#2A2B31"],"kodla_cizim":"Canvas 2048 px iç çözünürlükte; çizim önce ayrı bir grafit yoğunluğu katmanına yapılır. Bölge haritası ve kubbe profilinden bir ton haritası çıkarılır (kubbede hafif dışbükey dilimlerle Lambert ışığı, kasnak ve minarede silindir gölgesi). Her öğenin kılavuz çizgileri (kubbede meridyenler ve ∩ biçimli enlem yayları, kasnakta dikey, kaidede eğik, yapraklarda damar yönünde) 14–64 px'lik, uçları degradeyle incelen kalem vuruşlarına bölünür; vuruşun çizilip çizilmeyeceği ve koyuluğu tona göre, eşikleri farklı üç dört katmanla belirlenir. Gökte ve öndeki zeminde tarama, her kılavuz çizgisinde tonun eşiği aştığı kesimi tek (uzunsa birkaç ardışık) vuruşla çizer; baskı tona göre degradeyle azaldığından siluete yaslanan, dışa doğru sönen derli toplu bir hale oluşur. Konturlar düşük frekanslı titreşimle kaydırılan iki üç geçişte, parça parça değişen baskıyla çizilir. Öndeki öğe arkadakinin izini 'destination-out' ile siler, ton haritasından bulanıklaştırılmış lekeler yayma gölgesini verir, gürültülü elips bir maske çizimi kenarlarda söndürür. Son adımda piksel piksel iki ölçekli kâğıt dişiyle birleşir: grafit önce dişin tepelerine tutunur, baskı arttıkça çukurlar dolar; en koyu yerlere soğuk bir parlaklık eklenir.","etiketler":["kurşun kalem","grafit","eskiz","tarama","monokrom","çizim","akademik","kâğıt dokusu"],"klasor":"S-004-karakalem","gorsel":"stiller/S-004-karakalem/ornek.webp","kucuk":"stiller/S-004-karakalem/kucuk.webp"},{"kod":"S-005","no":5,"ad":"Gravür (Kalem Tarama)","ad_en":"Engraving (Pen & Ink Hatching)","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Kalınlığı şişip incelen paralel çizgilerle, krem kâğıda yalnız siyah mürekkeple kurulan ton.","tanim":"Gravür (kalem tarama), bakır ya da çelik levhaya kalemle (burin) kazınan çizgilerin mürekkeplenip basılmasıyla oluşan resim dilidir. Gri ton yoktur: ton, biçimi izleyen paralel çizgilerin kalınlığı ve aralığıyla, koyu yerlerde çapraz taramayla, geçişlerde noktalamayla kurulur. Çizgiler kontrollü ve keskindir, uçları iğne gibi incelerek biter. Eski kitap resimlerinde, haritalarda, banknot ve pullarda, senet ve sertifikalarda kullanılır.","koken":"15. yüzyılda kuyumcu atölyelerinden doğan bakır gravür, Martin Schongauer ve Albrecht Dürer ile olgunlaştı; 17. yüzyılda Claude Mellan tonu tek bir şişip incelen çizgiyle kurmayı ustalığa vardırdı. 19. yüzyılda çelik gravür kitap resminin, 20. yüzyılda Czesław Słania gibi ustaların elinde pul ve banknot gravürünün dili oldu.","ayirt_edici":["Kalınlığı tona göre şişip incelen, uçları iğne gibi biten paralel çizgiler","Kubbede dilimler arasında kabaran ∩ biçimli enlem çizgileri; gölge yanında meridyenlerle çapraz tarama","Gökte güneşe yaklaştıkça incelip kaybolan yatay çizgiler, ince ışınlı güneş ve çizgilerin seyrelmesiyle beliren bulutlar","Kasnakta, kaidede ve minarede silindiri izleyen yatay çizgiler; pencerelerde sık çapraz tarama","Kubbenin parıltısında çizgilerin kısa vuruşlara, sonra küçülen noktalara dönüşmesi; zeminde ve çiçek ortalarında noktalama","Krem kâğıt üzerinde ince çift çizgili çerçeve"],"palet":["#F1E7CF","#E7DDC6","#C3BAA7","#5E584E","#17130F"],"kodla_cizim":"Canvas 2048 px. Her öğe için biçimi izleyen kılavuz çizgi aileleri kurulur: gökte yatay, kubbede kaburga dilimleri arasında hafifçe kabaran ∩ biçimli enlem yayları ve meridyenler, kasnak, kaide ve minarede yatay silindir çizgileri, yapraklarda damar yönünde eğik çizgiler, taç yapraklarda merkezden yayılan çizgiler. Ton kubbe profilinden Lambert ışığıyla, silindirlerde yüzey açısına göre, gökte güneşe uzaklık ve bulut maskesiyle hesaplanır. Her çizgi 1,4 px aralıklarla örneklenir; genişliği tona göre 0,5 px'den aralığın yaklaşık %85'ine kadar şişer, eşiğin altında kesilir, uçları iğne gibi incelir. Şeritler tek bir Path2D'de dolgu olarak çizilir; rasterleştiricinin kalınlık basamakları kontur gibi görünmesin diye her çizgi piksel altı kaydırılır. Çapraz tarama ikinci ve üçüncü ailelerle yalnız koyu yerlerde yapılır. Kubbenin parıltısına yaklaşan enlem çizgileri önce incelir, sonra kesik kısa vuruşlara bölünür, en sonunda aynı yolun üzerinde dizilen, küçülüp seyrelerek kaybolan noktalara döner; zemin ve çiçek ortaları serbest noktalamayla kurulur; öndeki öğe arkadakini kâğıt rengiyle örter. Sonda piksel piksel kâğıt dokusu, levha izi ve mürekkebin hafif dağılması eklenir.","etiketler":["gravür","kalem tarama","bakır levha","banknot","siyah beyaz","çizgi","baskı resim","eski kitap"],"klasor":"S-005-gravur","gorsel":"stiller/S-005-gravur/ornek.webp","kucuk":"stiller/S-005-gravur/kucuk.webp"},{"kod":"S-006","no":6,"ad":"Linol Baskı","ad_en":"Linocut Print","aile":"Boya ve Kuru Teknikler","ozgun":false,"ozet":"Oyulmuş kalıplardan elle basılmış düz renkler ve siyah ana kalıp; oyma izleri, benekli mürekkep.","tanim":"Linol baskı, linolyum levhaya V ve U oyma kalemleriyle oyulan resmin mürekkeplenip kâğıda bastırılmasıyla yapılan bir yüksek baskı tekniğidir. Oyulan yerler kâğıt rengi kalır, kalan yüzey düz ve opak bir renk basar. Renkli baskıda her renk ayrı kalıpla ya da aynı kalıbın her renkten sonra biraz daha oyulduğu eksiltme yöntemiyle basılır. Kalın, sadeleşmiş biçimler, oyma izlerinin ritmi, benekli mürekkep ve renkler arasındaki hafif kayma tekniğin imzasıdır; afiş, kitap kapağı ve sanat baskılarında kullanılır.","koken":"Linolyum 1860'larda döşeme malzemesi olarak icat edildi; 20. yüzyıl başında Alman dışavurumcuları ve Rus avangardı onu baskı kalıbı olarak benimsedi. 1920–30'larda Londra'da Claude Flight ve Grosvenor okulu renkli linolü yaygınlaştırdı, Meksika'da Taller de Gráfica Popular onu afiş ve toplumsal baskının aracı yaptı; Pablo Picasso 1950'lerin sonunda tek kalıpla eksiltme yöntemini ünlü kıldı.","ayirt_edici":["Mavi, okra ve yeşil düz renk kalıplarının üzerine basılmış kalın siyah ana kalıp","Güneşten yayılan oyulmuş ışınlar ve ufka doğru sıklaşan yatay U oyukları","Kubbenin gölge yanındaki siyah kütleye enlem boyunca açılmış, incelerek biten kavisli V oyukları; sınırda ışığa doğru sivrilen, oyulmadan kalmış siyah dişler; ışıklı yanda yeşilden oyulmuş parıltı izleri","Yapraklarda oyulmuş damarlar; çiçek, tomurcuk ve minarede kalın siyah konturlar","Lekeli, benekli mürekkep ve yer yer görünen kâğıt; renk katmanları ile siyah arasında hafif kayma","El oyması titrek kenarlar, düzensiz bulutlar ve baskı alanını çevreleyen kalıp kenarı"],"palet":["#F0E7D4","#70A8CC","#DAA03A","#2E844E","#353D33","#1E1C1B"],"kodla_cizim":"Her renk (mavi, okra, yeşil, siyah) 2048 px'lik ayrı bir kalıp tuvalidir. Biçimler Path2D ile doldurulur; oyma izleri V ya da U profilli, titreyen şeritler olarak 'destination-out' ile kalıptan oyulur: gökte güneşten çıkan ışınlar ve ufka doğru sıklaşan oyuklar, kubbenin gölge kütlesinde enlem yayları (sınırda oyulmadan bırakılan dişlerle), gölgede yeşil, ışıkta siyah kaburgalar, ışıklı yanda parıltı izleri, yapraklarda damarlar. Öndeki biçim arkadakileri bütün kalıplarda boşaltır. Baskı adımında her kalıp 2–3 px kaydırılarak ve gürültüyle titretilmiş koordinatlardan okunur (el oyması kenar); kaplama geniş lekelenme ve yatay merdane iziyle değişir; kâğıt gözeneklerinde mürekkebin tutmadığı benekler, merdanenin az mürekkep bıraktığı geniş bölgelerde ve kalıp kenarına doğru yoğunlaşır, oralarda kümelenen küçük boşluklar da açılır. Renkler sırayla yarı saydam (çarpma ve örtme karışımı) basılır; siyah en son ve en örtücü katmandır. Kâğıt lif ve gözenek gürültüsüyle dokulanır.","etiketler":["linol","oyma baskı","eksiltme baskı","el baskısı","afiş","doku","kalın biçim","geleneksel"],"klasor":"S-006-linol","gorsel":"stiller/S-006-linol/ornek.webp","kucuk":"stiller/S-006-linol/kucuk.webp"},{"kod":"S-007","no":7,"ad":"Osmanlı Minyatürü","ad_en":"Ottoman Miniature","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Altın gök, çin bulutları ve gölgesiz, düz maden boyalarıyla nakkaşhane üslubunda bir kitap sayfası.","tanim":"Osmanlı minyatürü, el yazması kitapları ve murakkaları süsleyen küçük ölçekli resim sanatıdır. Örtücü maden boyaları ve altınla, gölge ve doğrusal perspektif kullanılmadan, ince mürekkep konturlarla çalışılır; zemin yukarıdan görülür gibi yükseltilmiş düz bir düzlemdir. Mimari, bahçe ve gök süslemeci bir düzenle, cetvellerle çevrili bir çerçeve içinde verilir.","koken":"Saray nakkaşhanesinde 15.–18. yüzyıllarda gelişti; Matrakçı Nasuh'un menzil (şehir) resimleri, Nakkaş Osman'ın Hünername ve Surname-i Hümayun minyatürleri, 18. yüzyılda Levni bu geleneğin önde gelen örnekleridir. Altın gök ve çin bulutu İran-Timurlu mirasıdır; servi ve çiçek açmış ağaçlar bahar ve cennet bahçesini simgeler.","ayirt_edici":["Zerreli ezme altın gök ve lacivert konturlu, uçları helezonla kıvrılan çin bulutları","Gölgesiz, düz malakit yeşili kubbe; ince koyu mürekkep konturlar ve dilim çizgileri","Yükseltilmiş düz yeşil zemin düzlemi; ufukta sırtın ardından yükselen pastel renkli, loblu süngerimsi kaya yığınları, servi ve çiçek açmış meyve ağaçları","Kaide ve minarede yıldızlı çini panolar, lacivert friz, zikzak bant ve altın şebekeli pencereler","Önde lale, karanfil, gül, sümbül ve papatyadan düz boyalı bahçe; çimene serpiştirilmiş küçük çiçekler","Altın ve renkli cetvellerle çevrili resim, zerefşanlı kenar suyu; minarenin alemi çerçeveyi taşar"],"palet":["#CFA445","#1E3C8E","#D4432B","#2F8650","#F5EFE0","#B9C689","#29563A","#21170E"],"kodla_cizim":"Canvas 2D, 2048 iç çözünürlük. Bütün biçimler SAHNE geometrisinden (kubbe profili, kaburgalar, kasnak pencereleri, minare parçaları, alemler) düz dolgu ve ince mürekkep konturla çizilir; gölge ve degrade yoktur. Çin bulutları hafif S çizen, uçlarında eğriliği artan (klotoid) bir omurga boyunca iki kenarı loblu şerit poligonlarıyla; süngerimsi kayalar tepeye daralan bir zarf içinde sıra sıra dizilen loblu kapalı eğrilerle (öndeki sıra arkadakini örter); çiçekli ağaçlar tohumlu özyinelemeli dallanmayla, servi yaprakları sıra sıra küçük kavislerle, çini panolar sekiz köşeli yıldız-haç örgüsüyle üretilir. Altın gök ve boya yüzeyi için piksel düzeyinde değer gürültüsü, kenar suyunda tohumlu zerefşan pulları kullanılır. Ön bahçedeki çiçeklerin taçları çerçeveye kesilmeyecek bir kuşağa toplanır, sapları çerçeveye iner. Minarenin üst kısmı cetvellerden sonra yeniden çizilerek çerçeveyi taşar.","etiketler":["minyatür","nakkaşhane","altın","çin bulutu","gölgesiz","düz boya","el yazması","Osmanlı","geleneksel"],"klasor":"S-007-minyatur","gorsel":"stiller/S-007-minyatur/ornek.webp","kucuk":"stiller/S-007-minyatur/kucuk.webp"},{"kod":"S-008","no":8,"ad":"Tezhip","ad_en":"Ottoman Illumination","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Ezme altın, lacivert ve aharlı krem zeminde rumî-hatayî helezonlarıyla süslenmiş mihrabiye çerçeve.","tanim":"Tezhip, el yazması kitapların sayfalarını altın ve boyalarla süsleme sanatıdır. Ezme altın, lacivert ve aharlı kâğıt zemin üzerinde rumî ve hatayî motifleri helezon dallar halinde, katı bir simetriyle düzenlenir; her biçim ince koyu bir tahrirle çevrilir. Serlevha ve zahriye sayfalarında cetveller, köşebentler, tığlar ve tepeliklerle zengin çerçeveler kurulur.","koken":"Selçuklu ve Timurlu mirası üzerine 15.–16. yüzyıl Osmanlı saray nakkaşhanesinde olgunlaştı; Baba Nakkaş, Şahkulu ve natüralist çiçek üslubunu getiren Kara Memi başlıca ustalardır. Lale, karanfil, sümbül ve gülden oluşan yarı natüralist çiçekler Kara Memi ekolünün imzasıdır.","ayirt_edici":["Lacivert zemin üzerinde altın rumî ve hatayî su yoluyla bezeli bordür; köşe kareleri ve altın cetveller","Kenar suyunda ince lacivert tığlar ve her kenarın ortasında dışa taşan hatayî tepelikler","Altın zeminli köşebentlerde iç içe geçen iki helezon sistemi: ince koyu saplı hatayî, penç, gonca ve yaprak dalları ile onların üstünden ince bir aralık bırakarak geçen lacivert rumî kolları; boşluklarda küçük kıvrımlar ve üçlü noktalar","Dilimli sivri kemerli (mihrabiye) çerçevenin içinde aharlı krem zemin ve soluk altın halkâr","Düz yeşil kubbe, altın kaburgalar ve tabanda altın-kırmızı dilim frizi; altın konturlu, tahrirli minare ve kaide","Kara Memi üslubunda iki tonlu tırtıklı saz yaprakları, mızrak biçimli lale yaprakları; lale, karanfil, gül ve sümbül"],"palet":["#CFA64E","#1C3478","#F6EEDA","#2E7B50","#BE3424","#3A2412","#E3A49B","#4F8550"],"kodla_cizim":"Canvas 2D, 2048 iç çözünürlük. Ezme altın, sağ üstten hafif parıltılı ve zerreli bir gürültü dokusu olarak bir kez üretilip sayfaya sabit desen dolgusu olarak kullanılır. Rumî, hatayî ve penç motifleri Bezier yollarıyla tanımlanıp döndürülerek yerleştirilir; helezonlar spiral nokta dizileriyle kurulur. Köşebentte iki ayrı açgözlü daire istifi yapılır; her daireye bir helezon oturur ve helezonlar önceki sapların en yakın noktasından iki ucu teğetli Bezier saplarla beslenerek ağaç biçimli bir su yolu oluşturur. Alt katta hatayî sistemi, üst katta lacivert şeritli rumî sistemi çizilir; üst kat ayrı bir katmanda alttakini destination-out ile silerek iç içe geçme aralığı bırakır. Kalan boşluklar kapsama haritasının uzaklık dönüşümüyle bulunur ve büyükten küçüğe küçük kıvrımlar, penç ve üçlü noktalarla doldurulur; öbür köşebent aynalanarak simetri sağlanır. Bordür dört kenarda döndürülmüş sinüs su yolu, kemer iki yay ve kavşara eğrisinden oluşur. Sahne kemere sığması için 0,8 ölçekle aynı yerleşimde çizilir: düz dolgu, altın kontur, koyu tahrir; saz yaprakları omurga ve tırtıklı şerit poligonuyla üretilir.","etiketler":["tezhip","altın","rumî","hatayî","helezon","simetri","el yazması","Kara Memi","geleneksel"],"klasor":"S-008-tezhip","gorsel":"stiller/S-008-tezhip/ornek.webp","kucuk":"stiller/S-008-tezhip/kucuk.webp"},{"kod":"S-009","no":9,"ad":"Ebru","ad_en":"Turkish Paper Marbling","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Gerçek ebru matematiğiyle hesaplanmış battal, gelgit ve taraklı desenler; akkâse bina ve iğneyle çekilmiş çiçekler.","tanim":"Ebru, kitreyle koyulaştırılmış su yüzeyine öd katılmış toprak boyaların serpilip biz ve tarakla biçimlendirildiği, sonra desenin kâğıda alındığı kâğıt süsleme sanatıdır. Serpilen damlalar birbirini iterek taşlar oluşturur (battal); biz bir ileri bir geri çekilince gelgit, tarakla taranınca taraklı desenler ortaya çıkar. Damla ve iğne hareketleriyle lale, karanfil, sümbül gibi çiçekler yapılır; akkâse tekniğinde bir şablon, siluetin içini başka bir ebruya ayırır.","koken":"15. yüzyıldan beri Türk kitap sanatlarında cilt kapağı, yan kâğıdı ve hat kenarı süslemesinde kullanılır. Çiçekli ebruyu 18. yüzyılda Hatip Mehmed Efendi başlattı; 20. yüzyılda Necmeddin Okyay çiçekli ebruyu geliştirip akkâse ve yazılı ebru gibi teknikleri canlandırdı, Mustafa Düzgünman geleneği sürdürdü.","ayirt_edici":["Lacivert ve çivit taşlardan battal gök; taşların arasında ince açık damarlar ve gelgitle dalgalanan kenarlar","Aynı noktaya iç içe serpilmiş okra ve sarı damlalardan halkalı güneş; sarı toprak boyalı alemler","Yeşil battalın kubbe meridyenleri boyunca taranmasıyla sivri dilimli, tepeye toplanan kubbe deseni; 16 dilimi ayıran ince akkâse kâğıt çizgileri","Akkâse şablonuyla ayrılmış, beyaz mermer desenli kaide ve minare; şablonun bıraktığı ince kâğıt çizgisi ve koyu pencereler","Taraklı (tek yönde taranmış) toprak renkli zemin","İğneyle çekilmiş iç içe renkli laleler, tırtıklı karanfiller, papatyalar, sümbüller, damla yapraklar ve boncuk dizisi gibi saplar"],"palet":["#22305E","#567BB4","#D9A441","#3E8350","#E2D6BC","#C29A5E","#B3352A","#F2EBDA"],"kodla_cizim":"Aubrey Jaffer'in ebru dönüşümleri uygulanır: damla p' = c + (p−c)·√(1 + r²/|p−c|²), tarak dişi p' = p + α·λ/(d+λ)·M (gelgitte komşu dişler ters yönde, eşit aralıklı dişlerde her noktaya en yakın iki diş), iğne adımı p' = p + v·e^(−|p−s|²/σ²). Her bölge (gök, zemin, kubbe, kasnak, bina, pencere, alem) için ayrı bir işlem dizisi kaydedilir. Damla çokgenlerini ileri taşımak yerine her piksel bu dönüşümlerin tersinden geçirilir (damlada tam ters formül, iğnede sabit nokta yinelemesi) ve hangi damlaya düştüğü bulunur; böylece en sert taramada bile sınırlar keskin ve hatasız kalır. Uyarlamalı örnekleme, damla kenarına doğru koyulaşan boya, akışla gerilen doku ve damla kimliği değişen piksellerde ince damar eklenir. Kubbe deseni boylam-yükseklik uzayında hesaplanıp meridyen eşlemesiyle kubbeye sarılır; 16 dilim, ayrı şablon parçaları gibi aralarında ince kâğıt çizgisi bırakılarak ayrılır; bölgeler SAHNE bölge haritasıyla akkâse şablonu gibi ayrılır. Alemler sarı toprak zeminli bir battalla boyanır. Çiçekler kendi kutularında damla ve iğne çekişleriyle üretilir; arka sıradaki goncalar kendi saplarıyla ön çiçeklerin arkasında kalır.","etiketler":["ebru","battal","gelgit","taraklı","akkâse","çiçekli ebru","kâğıt süsleme","simülasyon","geleneksel"],"klasor":"S-009-ebru","gorsel":"stiller/S-009-ebru/ornek.webp","kucuk":"stiller/S-009-ebru/kucuk.webp"},{"kod":"S-010","no":10,"ad":"İznik Çinisi","ad_en":"Iznik Tile","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Beyaz astar üzerine kobalt, firuze, kabarık mercan kırmızısı ve zümrüt yeşiliyle boyanmış sırlı çini pano.","tanim":"İznik çinisi, kuvars ağırlıklı bir gövde üzerine beyaz astar sürülüp sır altı tekniğiyle boyanan ve parlak, şeffaf sırla pişirilen Osmanlı seramiğidir. Siyah ya da koyu kontur içinde kobalt mavisi, firuze, zümrüt yeşili ve kabarık mercan kırmızısı kullanılır; saz yaprakları, lale, karanfil, sümbül ve rozetler başlıca motiflerdir. Kare çiniler bordürlerle birlikte duvar panoları halinde dizilir.","koken":"İznik atölyeleri 15. yüzyılın sonundan 17. yüzyıla kadar saray için üretim yaptı; Süleymaniye, Rüstem Paşa ve Sultanahmet camilerinde görülen, 1550'lerden sonraki kabarık kırmızılı dönem zirvedir. Desenler saray nakkaşhanesinde, Kara Memi'nin saz ve natüralist çiçek üslubuyla hazırlanırdı.","ayirt_edici":["Bordür çinileriyle çevrili 4 × 4 kare çini pano; aralarda girintili, açık renk derzler","Hafif mavimsi beyaz astar üzerinde kobalt, firuze ve zümrüt yeşili; ince siyah kontur","Kabarık mercan kırmızısı laleler, karanfiller, rozetler ve alemler","Kobalt konturlu ve kaburgalı zümrüt yeşili kubbe; firuze kasnakta kobalt pencereler","Uzun, kıvrık, tırtıklı, iki tonlu saz yaprakları ve sümbüller; gökte kobalt, firuze ve kırmızı çin bulutları ile rozet güneş","Her çinide sır parlaması ve pencere yansıması, sır birikmesiyle dalgalanan renk, iğne delikleri, çiniden çiniye ton ve baskı kayması"],"palet":["#F5F7F3","#1F3F99","#2AA3A5","#C8382A","#1F8B4E","#1A1A22","#D6D0C1"],"kodla_cizim":"Tasarım üç ayrı 2048 px katmana çizilir: sır altı renkler (kobalt, firuze, yeşil), kabarık kırmızı ve siyah kontur. Renk katmanı piksel düzeyinde düşük frekanslı gürültüyle koyulaştırılıp açılarak sır birikmesi verilir ve hafifçe bulanıklaştırılarak akıtılır; kırmızı katman alt-sola kayık bir gölgeyle kabarık gösterilir; beyaz çizgiler (astar) renk katmanından silinerek açılır. Ardından tasarım çini çini kesilip derz zeminine yerleştirilir: her çiniye küçük baskı kayması, pişirim ton farkı, sağ üstten parlama, yumuşak pencere yansıması, sır kenarı ışığı ve tohumlu iğne delikleri eklenir. Lale, karanfil, sümbül, rozet, saz ve çin bulutu motifleri Bezier yolları ve omurga-şerit poligonlarıyla üretilir.","etiketler":["çini","İznik","sır altı","kobalt","mercan kırmızısı","saz yaprağı","seramik","pano","geleneksel"],"klasor":"S-010-iznik-cinisi","gorsel":"stiller/S-010-iznik-cinisi/ornek.webp","kucuk":"stiller/S-010-iznik-cinisi/kucuk.webp"},{"kod":"S-011","no":11,"ad":"Kat'ı (Kâğıt Oyma)","ad_en":"Kat'ı Paper Cutting","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Tek parça krem kâğıttan bıçakla oyulmuş, koyu yeşil zemine konmuş dantel gibi bir kâğıt kesimi.","tanim":"Kat'ı, kâğıdın ince bir bıçakla oyularak motiflerin çıkarıldığı ve oyulan kâğıdın zıt renkli bir zemin kâğıdına yapıştırıldığı süsleme sanatıdır. Müsbet (pozitif) ya da menfi (negatif) olarak çalışılır; rumî, hatayî, bulut ve çiçek motifleri dantel inceliğinde köprülerle birbirine bağlanır. Murakka sayfalarında, cilt kapaklarında ve kitap kenarlarında kullanılır.","koken":"15. yüzyılda Timurlu Herat'ta yaygınlaştı ve Osmanlı kitap sanatlarına geçti. 17. yüzyılda Bursalı Fahrî (Fahrî-i Bursevî) kat'ı çiçek ve kompozisyonlarıyla tanınan en ünlü Osmanlı ustasıdır; sanat bugün murakka ve cilt sanatıyla birlikte yaşatılmaktadır.","ayirt_edici":["Tek parça krem kâğıt ve koyu yeşil zemin: yalnız iki renk; kâğıdın zemine düşen sola-aşağı gölgesi ve keskin bıçak kenarları","Kubbede kaburgalar kâğıt kalacak biçimde oyulmuş sivri dilimler; yeşil zemin dilimlerden görünür","Oyulmuş pencereler, korniş dişleri, baklava kafesli panolar, zikzak yarıklar ve korkuluk kemerleri","Gökte köprülerle çerçeveye bağlanan çin bulutları, ışın taçlı güneş, üstte salbekli yarım şemse ve helezon danteli","Dilimli iç kenar ve mercek dizili, rozetli çerçeve bandı; köprü bırakılarak kesilmiş cetvel yarıkları","Önde ve yanlarda orta damarları oyulmuş lale, karanfil, gül, sümbül ve saz yaprakları"],"palet":["#E8D9B2","#1D4632","#173828","#B4AC8A"],"kodla_cizim":"Kâğıt, 2048 px bir maske tuvalinde kesip-ekleme işlemleriyle kurulur: dolu sayfadan iç alan oyulur (destination-out), bina silueti, bulutlar, güneş, dantel ve çiçekler eklenir, ardından kubbe dilimleri, pencereler, damarlar ve kesik (köprülü) yarıklar oyulur. Saplar ve köprüler çoğunlukla 3,6 px ve üzeri genişliktedir; yalnız yaprak diplerinde, birkaç kıvrım ucunda ve kubbe tepesinde kaburgaların birleştiği yerde 2–3 px'e iner. Kapalı yarıklar setLineDash ile aralıklı kesildiği için ada oluşmaz. Maske üzerinde bağlı bileşen sayımı (BFS) yapıldı: 2048 px çözünürlükte kâğıt tek parçadır, geriye yalnız kenar yumuşatmasından kalan tek piksellik kırıntılar kalır (denetim kodu sayfada kapalı durur). Görüntü; lifli zemin dokusu, maskeden üretilen bulanık ve kayık gölge, dokulu kâğıt ve maskenin kaydırılmış farkından elde edilen ince kenar ışığı ile kenar gölgesinin bileşimidir.","etiketler":["kat'ı","kâğıt oyma","kesik kâğıt","dantel","iki renk","rumî","murakka","geleneksel"],"klasor":"S-011-kati","gorsel":"stiller/S-011-kati/ornek.webp","kucuk":"stiller/S-011-kati/kucuk.webp"},{"kod":"S-012","no":12,"ad":"Vitray","ad_en":"Stained Glass","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Kurşun çubuklarla birleştirilmiş, içinden ışık geçen renkli cam parçaları.","tanim":"Vitray, renkli cam parçalarının H kesitli kurşun çubuklarla birleştirilip bir pencereye takılmasıyla yapılan ışık resmidir. Resim, arkadan gelen ışıkla parlar; biçimleri kalın ve eşit kalınlıktaki koyu kurşun çizgileri çevreler, yüz ve süs gibi ince ayrıntılar cama grizay boyayla yazılır. Cami, kilise ve saray pencerelerinde, kubbe kasnaklarında ve tavan fenerlerinde kullanılır.","koken":"Renkli camı alçı ya da kurşun kafes içine yerleştirme geleneği Bizans ve erken İslam yapılarına uzanır; Orta Çağ Avrupa katedrallerinde (Chartres, Sainte-Chapelle) kurşunlu vitray doruğuna ulaştı. Osmanlı mimarisinde alçı kafesli renkli cam pencereler (revzen, şemse) Süleymaniye ve Sultanahmet camilerinde ünlüdür; 19. yüzyılda Tiffany ve Arts and Crafts ustaları opal camla akımı yeniledi.","ayirt_edici":["Her renk alanını ayıran, her yerde aynı kalınlıkta koyu kurşun çizgileri","Göğün düzensiz cam parçalarına bölünmesi; güneş çevresinde sarı ve amber camlar, ışın biçimli parçalar","Arkadan gelen ışıkla parlayan doygun renkler ve parlak camların kurşun üstüne taşan hafif ışıltısı","Camın kendi dokusu: çekme izleri, dalgalı katedral camı, kabarcıklar ve kenarlara doğru koyulaşan yoğunluk","Grizay boyayla yazılmış ayrıntılar: kubbedeki ara kaburgalar, kasnak nişleri, minare zikzağı, yaprak damarları","Kırmızı, mavi ve altın sarısı küçük camlardan bordür; koyu taş duvardaki sivri kemerli pencere çerçevesi"],"palet":["#1A389C","#1E58B6","#3B8445","#B0142C","#E8AC2E","#CE9C4E","#F6F4F0","#18171B"],"kodla_cizim":"Canvas 2048 px iç çözünürlükte çizilir; sahne sivri kemere sığsın diye %84 ölçeklenir. Her cam parçası (Voronoi ile bölünmüş gök, kaburgalara ve enlemlere göre kesilmiş kubbe, kasnak şeritleri, minare ve kaide parçaları, ikiye bölünmüş yapraklar, taç yapraklar; kemer boyunca simetrik dizilen, tepede ve alt ortada altın kilit camıyla biten bordür camları) gizli bir kimlik haritasına kendi rengiyle, kurşunun yarısı kadar şişirilerek çizilir. Kimliğin değiştiği kenarlardan Öklid uzaklık dönüşümü (Felzenszwalb) ile tek kalınlıkta, ortası hafif parlak kurşun üretilir. Cam piksel piksel renklendirilir: parça rengi ve degrade, yönlü değer gürültüsüyle çekme izleri, geniş gürültüyle yoğunluk farkı, sinüs ve gürültüyle katedral dalgası. Üstüne grizay boya, yalnız bazı camlara serpilen kabarcıklar, bulanık kurşunla kenar koyulaşması ve parlak camlardan 'screen' ışıltı eklenir; dışta taş duvar, kemer taşları, kilit taşı ve denizlik vektörle çizilip gürültü dokusuyla çarpılır.","etiketler":["cam","ışık","kurşun","pencere","geleneksel","zanaat","mimari","parlak renk"],"klasor":"S-012-vitray","gorsel":"stiller/S-012-vitray/ornek.webp","kucuk":"stiller/S-012-vitray/kucuk.webp"},{"kod":"S-013","no":13,"ad":"Mozaik","ad_en":"Mosaic (Tesserae)","aile":"Türk-İslam Sanatları","ozgun":false,"ozet":"Biçimlerin çevresinden dolanan sıralarla dizilmiş küçük taş ve cam kareler, altın smalti zemin.","tanim":"Mozaik, küçük taş, mermer ve renkli cam (smalti) parçalarının harç yatağına tek tek gömülmesiyle yapılan kalıcı duvar ve döşeme resmidir. Taşların diziliş yönü (andamento) resmin bir parçasıdır: biçimlerin çevresinde konturu izleyen kıvrık sıralar, arka planda düz sıralar görülür. Altın varaklı cam taşlar ışığı her açıda farklı yakalayarak zemini titreştirir; cami, kilise ve saray duvarlarında, kubbe ve mihraplarda kullanılır.","koken":"Helenistik ve Roma döşeme mozaiklerinden (opus tessellatum, opus vermiculatum) doğdu; Bizans'ta altın smalti zeminli duvar mozaiklerine dönüştü (Ravenna, Ayasofya). Emevî döneminde Kubbetü's-Sahra (691) ve Şam Emevî Camii'nin (715) altın zeminli ağaç, köşk ve nehir manzaraları İslam sanatının en erken başyapıtları arasındadır; Kurtuba Camii mihrabı da aynı geleneği sürdürür.","ayirt_edici":["Her biri hafif düzensiz ve eğik oturmuş küçük kare taşlar, aralarında görünür açık renkli derz","Kubbe dilimlerinde, pencere kemerlerinde, çiçek taç yapraklarında konturu izleyen kıvrık sıralar (opus vermiculatum); alemlerin hilal ve kürelerinde ince ayrıntı için çok daha küçük taşlar","Gökte düz yatay sıralar (opus tessellatum) ve figürlerin çevresini iki sıra dolanan altın taşlar","Parlaklığı taştan taşa değişen, yer yer ışığı yakalayıp parlayan altın smalti zemin; eş merkezli sıralarla dizilmiş güneş","Figürleri çevreleyen koyu kontur sırası; kubbe kaburgaları, minare zikzağı ve saplar tek sıra taşla çizilmiş","Sınırlı taş ve cam paleti: yeşil cam, beyaz ve krem mermer, toprak sarısı, pembe; üç sıralı bordür"],"palet":["#D3A646","#F0D077","#20703E","#0D3820","#EFE8D9","#E8C2C8","#B0804E","#807460"],"kodla_cizim":"Sahne, her öğe ve alt bölge (kubbe dilimleri, pencereler, taç yaprakları, alem parçaları) ayrı kimlik rengiyle bir etiket haritasına çizilir. Etiket kenarlarından Öklid uzaklık dönüşümü (Felzenszwalb) alınır; her bölgede taş boyunun yarım katlarındaki eş uzaklık çizgileri gradyana dik yürünerek taşlar sıra sıra dizilir (andamento). Alemler küçük taşlarla (kubbede 3,7, minarede 2,5 birim; zeminde 11) ve tek sıra koyu kontur halkasıyla dizilir, hilal biraz kalın kesilir. Gök, zemin ve kaidede ilk bir iki sıradan sonra hafif dalgalı yatay sıralar, kaburga, zikzak, sap ve damarlarda çizgi boyunca tek sıra taş kullanılır; kalan boşluklar yerel ağırlık merkezine konan ara taşlarla doldurulur. Renk, başvuru çiziminin parlaklığına göre malzeme rampasından titreşimli seçilir; altın taşlara rastgele ışık yakalama verilir. Son çizim 2048 px'de piksel piksel yapılır: her piksel kendi bölgesindeki en yakın döndürülmüş kareye (köşesi hafif kırık, kenarı gürültüyle dalgalı) atanır, kareler dışı derz olur, taş kenarlarında ışığa göre pah gölgesi verilir.","etiketler":["mozaik","tessera","altın","andamento","geleneksel","zanaat","doku","Bizans","Emevî"],"klasor":"S-013-mozaik","gorsel":"stiller/S-013-mozaik/ornek.webp","kucuk":"stiller/S-013-mozaik/kucuk.webp"},{"kod":"S-014","no":14,"ad":"Ukiyo-e","ad_en":"Ukiyo-e Woodblock Print","aile":"Uzak Doğu","ozgun":false,"ozet":"Japon ağaç baskısı: düz renk kalıpları, kalın siyah çizgiler, bokashi geçişli gök ve pembe sis kuşakları.","tanim":"Ukiyo-e, her rengin ayrı bir kiraz tahtası kalıba oyulup elle, sırayla washi kâğıdına basıldığı Japon ağaç baskı resmidir. Biçimleri ana kalıbın (sumi) kalın siyah çizgileri belirler; renk alanları düzdür, gökte ve kenarlarda kalıbın ıslak silinmesiyle elde edilen bokashi geçişleri görülür. Manzaralarda yatay sis kuşakları (kasumi) derinlik verir; tahtanın damarı ve hafif kayık baskı her nüshada sezilir.","koken":"17. yüzyıl Edo'sunda kitap resimleriyle başladı, 18. yüzyılda çok renkli baskı (nishiki-e) Suzuki Harunobu ile yerleşti. 1820'lerden sonra Avrupa'dan gelen Prusya mavisi gökleri değiştirdi; Katsushika Hokusai'nin 'Fuji'nin Otuz Altı Görünümü' ve Utagawa Hiroshige'nin 'Tōkaidō'nun Elli Üç Durağı' ile 'Edo'nun Yüz Ünlü Manzarası' manzara baskısının doruğudur. 19. yüzyıl sonunda Japonizm akımıyla Van Gogh ve Monet'yi derinden etkiledi.","ayirt_edici":["Kubbe, kasnak, minare ve çiçekleri çevreleyen kalın siyah ana kalıp çizgileri: kalınlığı yer yer değişir, kenarları oymanın izini taşıyan hafif tırtıklıdır; pencereler düz siyah","Üstte düz koyu Prusya mavisi şeritten (ichimonji bokashi) aşağı doğru açılan gök, ufukta şeftali bokashi; kubbede yukarıdan aşağı yeşil bokashi","Basamak basamak üst üste binen, alt ve üst kenarı düz, uçları üslupça yuvarlatılmış kasumi sis kuşakları; her katın üst kenarı koyu pembe, aşağısı silik; minareyi ortasından örter","Gök, güneş, zemin ve kubbede açıkça görülen kiraz tahtası damarı (dalgalı ince halkalar, düğüm çevresinde kıvrılan çizgiler) ve baren basıncının eşitsizliğinden kalan lekeler","Düz kırmızı güneş teker, çizgisiz mavi-gri uzak tepeler, sakura biçimli çentikli beyaz çiçekler ve kiraz dalları; renklerin çizgiden hafifçe kaydığı kayık baskı","Lifli sıcak bej washi kâğıdı, siyah çerçeve çizgisi ve yazısız kırmızı ve sarı kartuşlar"],"palet":["#1D2F4E","#B63F29","#476742","#CA8A71","#E4D6B9","#221D1A","#B08A5E","#C99633"],"kodla_cizim":"Canvas 2048 px'de baskı sırası taklit edilir: önce lifli washi kâğıdı, sonra her renk kalıbı ayrı ekran dışı tuvale çizilip 'multiply' ile ve birkaç piksel kaydırılarak (kayık baskı) basılır. Kiraz tahtasının damarı iki dokudan gelir: bükülmüş değer gürültüsüyle dalgalandırılmış, düğüm çevresinde kıvrılan sinüs halkalarının açık tepeleri boyayı siler ('destination-out', baren basıncının geniş lekeleriyle birlikte), koyu tepeleri katmanın bir kopyasını yalnız oralarda bir kez daha basar; her kalıp farklı açıyla damarlanır. Ana kalıp çizgileri önce vektörle, bir de 1,5 kat kalın olarak çizilir; kalın kopya ikili bir leke maskesinde kalır, sonra katman 1,25 px bulanıklaştırılıp gürültüyle değişen bir eşikten geçirilir: kalınlık yer yer değişir, kenarlar hafif tırtıklanır, mürekkep yoğunluğu eşitsizleşir. Nesneler gruplar hâlinde ressam sırasıyla işlenir; önde duranın silueti kâğıt rengine döndürülür, böylece öndeki biçim arkadaki çizgileri örter. Gök (ichimonji), kubbe ve kasumi bokashi'leri doğrusal degradelerle; kasumi kuşakları basamaklı katlar hâlinde, alttaki kat üsttekinin silik ucunu örterek; sakura taç yaprakları çentikli Bézier biçimleriyle, kiraz dalları incelen şeritlerle çizilir; en sonda kâğıt dokusu çarpılır, kenar boşluğu ve kartuşlar eklenir.","etiketler":["ağaç baskı","Japon","Hiroshige","bokashi","kasumi","düz renk","kalın çizgi","washi","Uzak Doğu"],"klasor":"S-014-ukiyo-e","gorsel":"stiller/S-014-ukiyo-e/ornek.webp","kucuk":"stiller/S-014-ukiyo-e/kucuk.webp"},{"kod":"S-015","no":15,"ad":"Sumi-e (Mürekkep Lavi)","ad_en":"Sumi-e Ink Wash","aile":"Uzak Doğu","ozgun":false,"ozet":"Pirinç kâğıdına tek mürekkebin sulandırılmış tonlarıyla, az, kendinden emin fırça vuruşu ve bol boşluk.","tanim":"Sumi-e (Çincede shuimo hua), çubuk mürekkebin suyla farklı yoğunluklarda açılıp yumuşak fırçayla emici pirinç kâğıdına uygulandığı resim geleneğidir. Her vuruş tek seferde ve düzeltilmeden yapılır: fırça bastırılıp kaldırılarak yaprak biçimlenir, kuruyan fırça 'kasure' denen beyaz çizgili izler bırakır, ıslak mürekkep kâğıdın liflerine yayılır. Boşluk (ma) resmin parçasıdır; sis, uzaklık ve ışık boş bırakılan kâğıtla anlatılır. Renk çok az kullanılır, resim çoğunlukla kırmızı bir mühürle tamamlanır.","koken":"Tang ve Song Çin'inde gelişti; geleneği Wang Wei'ye bağlanır, Mu Qi ve Liang Kai gibi Chan (Zen) ressamlarıyla olgunlaştı. 13–14. yüzyıllarda Zen keşişleriyle Japonya'ya geçti ve Muromachi döneminde Sesshū Tōyō ile doruğa ulaştı. Bambu, erik çiçeği, orkide ve krizantem, yani 'dört soylu bitki', fırça eğitiminin temelidir.","ayirt_edici":["Kubbenin gölge yanı tek bir yan fırça vuruşudur: fırçanın ucunda koyu, topuğunda soluk mürekkep; aşağıda kuruyup kıl kıl açılır","Tepeden inip kuruyarak sönen birkaç hızlı kaburga çizgisi; ışık yanında kubbenin sağ kenarı neredeyse kaybolur","Kasnak, yoğunluğu soldan sağa azalan fırça noktalarından bir bant; gölge yanında ıslak noktalar lavın içine akar","Kuru fırçanın 'kasure' izi erik gövdesinde, korniş ve kasnak çizgilerinde; ıslak vuruşların kenarında mürekkep liflere yayılır","Bol boşluk (ma): kaide ve minarenin alt yanı sise karışır, güneş boş bırakılmış soluk bir dairedir; sol alt köşeden giren erik dalında kümeler hâlinde çiçek, tomurcuk ve yosun noktaları","Çok az renk: kubbe ve kasnakta soluk yeşil, alem kürelerinde okra; sağ altta yazısız, geometrik desenli küçük kırmızı mühür"],"palet":["#F3EDE0","#C9CBB6","#A09F90","#5F6154","#141415","#D2AA69","#BE4439"],"kodla_cizim":"Canvas 2048 px; mürekkep bir yoğunluk alanında birikir ve kâğıt rengine Beer-Lambert benzeri üstel bir azalmayla uygulanır. Fırça vuruşu, omurga boyunca 0,5 px adımlarla enine taranır: fırça 5–76 kıldan oluşur, her kılın kendi mürekkep yükü ve kuruma hızı vardır (kenardaki kıllar önce kurur); kuruyan kıl kâğıdın ince tanesinin yalnız tepelerine değer, böylece kasure çizgileri ve tanecikli kuru fırça kendiliğinden oluşur. Kıllar arasında enine ton farkı yan fırçanın ucu koyu, topuğu soluk yüklemesini verir; bastırılan baş yuvarlanır, uç sivrilir. Vuruşun ıslak payı ayrı bir alana yazılır ve sonda iki kutu bulanıklığından uzamış lif gürültüsüyle seçilen bir saçak olarak kâğıda yayılır. Lavlar bulanık maskelerden hesaplanır: eşikleri gürültüyle tırtıklanır, kuruyan kenarda mürekkep birikir, içte tanelenir; birkaç geri akma (çiçeklenme) lekesi eklenir. Kaide ve minarenin alt yanı gürültülü bir sis maskesiyle söner. Erik çiçekleri iki kısa kavisli taç yaprağı çizgisi ve noktalı erciklerle, kendi düzleminde basıklaştırılarak çizilir; arkalarındaki dal silinir. Yeşil ve okra ayrı renk katmanlarıdır; mühür oyulmuş geometrik çizgiler ve damga dokusuyla çizilir.","etiketler":["sumi-e","mürekkep","lav","fırça","Uzak Doğu","zen","boşluk","monokrom"],"klasor":"S-015-sumi-e","gorsel":"stiller/S-015-sumi-e/ornek.webp","kucuk":"stiller/S-015-sumi-e/kucuk.webp"},{"kod":"S-016","no":16,"ad":"Empresyonizm","ad_en":"Impressionism","aile":"Sanat Akımları","ozgun":false,"ozet":"Kısa, kırık, saf renk lekeleriyle ışığın ve havanın anlık izlenimi.","tanim":"Empresyonizm, konunun ayrıntısından çok ışığın ve havanın o anki etkisini yakalamaya çalışır. Renkler palette karıştırılmadan kısa fırça lekeleriyle yan yana konur ve gözde karışır; gölgeler siyah değil mavi-mor, ışıklar sıcak sarı-turuncudur. Fırça izi canlı ve görünür, kenarlar yumuşak ve kayıptır; çoğunlukla açık havada, çabuk çalışılır.","koken":"1860'ların sonunda Paris'te doğdu; adını Claude Monet'nin 1874 sergisindeki 'İzlenim, Gün Doğumu' tablosundan aldı. Camille Pissarro, Alfred Sisley, Pierre-Auguste Renoir ve Berthe Morisot akımın öncülerindendir; Monet'nin saman yığınları ve Rouen Katedrali dizileri aynı konunun farklı ışıklardaki izlenimlerini işler.","ayirt_edici":["Yan yana konmuş kısa, kırık, karıştırılmamış saf renk lekeleri; renkler gözde karışıyor","Kubbenin ışığında sarı-yeşil ve açık zümrüt, gölgesinde viridyen, ultramarin ve mor kıvılcımlar; yer yer sıcak turuncu-sarı ışık lekeleri","Renkli gölgeler: taş yapıların gölgesi leylak-mavi ve serin gri, ışıklı yanı krem ve açık sarı","Güneşin çevresinde titreşen sıcak ışık ve havadaki parıltı","Yönü ve boyu değişen canlı fırça izleri: gökte daha iri, çiçek tarlasında küçük ve sık; dallarda saplar boyunca koyu yeşil, kesik lekeler","Yumuşak, kayıp kenarlar"],"palet":["#6AA8DE","#289E60","#AACE4C","#1C7668","#F0963E","#805CB0","#BEAADE","#FCEEC6"],"kodla_cizim":"Işık modeli her piksel için bir bölge ve 0–1 arası bir aydınlık değeri verir. Her leke, bölgesinin ışık, orta ya da gölge kümesinden (değerleri birbirine yakın, tonları farklı saf renkler) ağırlıklı rastgele seçilir. Lekeler 2048 piksellik tuvalde birkaç kıllık kısa fırça vuruşlarıdır; yönü bölgeye göre (kubbede meridyen, kasnakta yatay, gökte eğik, yapraklarda eksen) belirlenip gürültüyle saptırılır, rengi biraz kaydırılmış bir noktadan okunduğu için kenarlar kaybolur. Seyreltik bir ön boyanın üstüne üç boyda leke katı gelir (gökte ince katlar seyrek tutulur), ardından tamamlayıcı kıvılcımlar, yapı ayrıntıları, saplar boyunca ve yan dallardaki yapraklarda koyu lekeler, güneş ve çiçekler; hafif boya kabartısı ve bez dokusu son ışıkta eklenir.","etiketler":["empresyonizm","sanat akımı","ışık","fırça izi","renkli gölge","19. yüzyıl"],"klasor":"S-016-empresyonizm","gorsel":"stiller/S-016-empresyonizm/ornek.webp","kucuk":"stiller/S-016-empresyonizm/kucuk.webp"},{"kod":"S-017","no":17,"ad":"Puantilizm","ad_en":"Pointillism","aile":"Sanat Akımları","ozgun":false,"ozet":"Saf renk noktalarından kurulan, renkleri gözde karışan ışıklı resim.","tanim":"Puantilizm (noktacılık), resmi küçük, ayrı ve karıştırılmamış renk noktalarıyla kurar; renkler tuvalde değil izleyicinin gözünde karışır. Sınırlı bir saf renk paleti kullanılır, tamamlayıcı renkler yan yana konarak titreşim yaratılır. Renk kuramına dayanan bu yöntem düzenli, sakin ve ışıklı bir yüzey verir.","koken":"Georges Seurat 1880'lerde Michel Eugène Chevreul ve Ogden Rood'un renk kuramlarından yola çıkarak geliştirdi; 'La Grande Jatte Adası'nda Bir Pazar Öğleden Sonrası' (1884–1886) akımın simgesidir. Paul Signac, Henri-Edmond Cross ve Théo van Rysselberghe yöntemi Yeni Empresyonizm adıyla sürdürdü; Seurat bazı tablolarına noktalarla boyanmış çerçeveler ekledi.","ayirt_edici":["Resmin tamamı küçük, ayrı ve hemen hemen eş boyda saf renk noktalarından oluşuyor; alemler gibi ince ayrıntılarda noktalar küçülüyor","Yeşil kubbe yeşil, sarı ve mavi noktalarla kurulmuş; ışıkta ve gölgede turuncu ve mor tamamlayıcı noktalar","Kontur boyunca ışınım halesi: kubbe ve minarenin kenarında gök daha açık, yapının kenarı daha koyu","Beyaz çiçeklerde ışık yanı krem-sarı, gölge yanı mavi-leylak noktalar; taç yapraklar serin bir nokta sırasıyla ayrılıyor","Noktaların arasından görünen astarlı bez","Komşu rengin tamamlayıcısıyla noktalanmış, elle atılmış ince koyu bir nokta sırasıyla resimden ayrılan boyalı çerçeve"],"palet":["#FAE240","#F49628","#E03A2C","#7E4AB0","#303CAC","#68B6E2","#22965C","#96C63A"],"kodla_cizim":"Işık modelli, renkli gölgeli bir hedef tabloya (taç yapraklarda ışık geçişi ve serin kenar çizgisi dahil) bulanık kopyasından farkı eklenerek kontur halesi (ışınım) verilir; güneş çevresindeki yumuşak geçiş bunun dışında tutulur. Bridson Poisson diski üç ölçekte nokta üretir: seyrek bir alt kat, ana kat ve kontur ile küçük öğelerde daha ince noktalar. Her noktanın hedef rengi, on iki saf renk ve üç açık tondan oluşan paletin en iyi üçlü karışımına ayrıştırılır (doğrusal ışıkta optik karışım; değeri hedeften uzak boyalar ve tek renge yığılma cezalandırılır) ve ağırlıklara göre tek bir renk seçilir; yüzde beş olasılıkla tamamlayıcı renk konur. Alemlerin çevresi silinip gök ve altın çok küçük noktalarla yeniden kurulur (hilal okunsun diye). Çerçeve noktaları iç kenarın ortalama renginin tamamlayıcısından ayrıştırılır; iç sınır aralığı ve hizası oynak noktalarla elle atılmış gibi çizilir. Noktalar hafif bir kabartma ve bez dokusuyla ışıklandırılır.","etiketler":["puantilizm","yeni empresyonizm","nokta","optik karışım","sanat akımı","19. yüzyıl"],"klasor":"S-017-puantilizm","gorsel":"stiller/S-017-puantilizm/ornek.webp","kucuk":"stiller/S-017-puantilizm/kucuk.webp"},{"kod":"S-018","no":18,"ad":"Art Nouveau","ad_en":"Art Nouveau","aile":"Sanat Akımları","ozgun":false,"ozet":"Kamçı kıvrımları, süslü kemerli çerçeve ve büyük hale; solgun zarif renkler ve kalın-ince konturlu düz biçimler.","tanim":"Art Nouveau, doğadaki bitki biçimlerinden türetilmiş akışkan, organik çizgileri (kamçı kıvrımı) ve süslemeyi resmin taşıyıcısı yapan bir akımdır. Afişlerde düz renk alanları ince ama kalınlığı değişen konturlarla çevrilir; konu çoğu zaman büyük bir dairesel hale ve mozaik benzeri bantlarla örülü süslü bir çerçeve içinde durur. Renkler solgun ve zariftir: adaçayı yeşili, zeytin, aşı boyası, toz gülü, krem ve altın; zambak, süsen, gelincik gibi uzun saplı çiçekler kıvrılarak yüzeyi doldurur.","koken":"1890'larda Avrupa'da Arts and Crafts hareketi ve Japon baskılarının etkisiyle doğdu; Fransa'da Art Nouveau, Almanya'da Jugendstil, Avusturya'da Sezession, İtalya'da Stile Liberty adını aldı. Alfons Mucha'nın Paris afişleri (Gismonda, Mevsimler, Zodyak), Hector Guimard'ın metro girişleri, Victor Horta'nın Brüksel yapıları ve Gustav Klimt'in altınlı panoları akımın simgeleridir. İstanbul'da Raimondo D'Aronco'nun Karaköy ve Yıldız'daki yapıları Osmanlı'daki örneklerdendir.","ayirt_edici":["Kubbenin ardında Mucha usulü büyük hale: mozaik taşlı iki sıra bant, inci dizisi, dantel kemercikleri ve ince ışın çizgileri","Basık kemerli süslü çerçeve: iki sıra renkli kare taştan bant, altın çizgiler, köşe gülleri, madalyonlar ve kıvrık köşe süsleri","Uçları sarmal kıvrılan kamçı filizleri ve S biçimli zambak sapları; çerçevenin içinden akıp ucu dalga gibi kıvrılan, kat kat şerit bulutlar","Kalınlığı değişen koyu kahve konturlarla çevrilmiş düz renk alanları; kubbede ve yapılarda afiş usulü iki tonlu gölge","Önde çerçeveyi taşan iri gelincikler, uzun kıvrık bıçak yapraklar; yanlarda altı yapraklı zambaklar","Solgun zarif palet ve gök zemininde soluk dört yapraklı çiçeklerden şablon deseni"],"palet":["#A9B48F","#6E6F3E","#C99E4F","#D3A49B","#F3EAD3","#C6A14B","#79A06F","#3B3122"],"kodla_cizim":"Canvas 2048 px'de vektör olarak çizilir. Kalın-ince kontur, biçimin dışına kırpılmış ve sağ alta kaydırılmış kalın bir çizgiyle ince ana çizginin üst üste konmasıyla elde edilir. Kamçı kıvrımları, sinüslü bir S eğrisine teğeti kırılmadan eklenen logaritmik sarmalın, ortası şişen ve uca doğru incelen şeritlere çevrilmesidir; bulutlar da çerçeve kenarından başlayan, alt kenarı düz gölgeli üç kat böyle şerittir. Çerçeve büyük yarıçaplı bir yaydan kurulan basık kemerdir; bantta yay ve kenarlar boyunca döndürülmüş renkli kareler mozaik dokusu verir. Hale eş merkezli halka dilimleri, inci daireleri ve kemerciklerle; kubbe, kaburga eğrilerinden kurulan parlak şerit ve elips dışı gölgeyle iki tonlu boyanır. Zambak ve gelincikler Bézier taç yapraklarla, yapraklar kıvrık eksen boyunca iki tonlu bıçak biçimleriyle çizilir; sonunda taş baskı kâğıdı dokusu çarpılır.","etiketler":["afiş","Mucha","kamçı kıvrımı","süsleme","çiçek","çerçeve","hale","1900","sanat akımı"],"klasor":"S-018-art-nouveau","gorsel":"stiller/S-018-art-nouveau/ornek.webp","kucuk":"stiller/S-018-art-nouveau/kucuk.webp"},{"kod":"S-019","no":19,"ad":"Art Deco","ad_en":"Art Deco","aile":"Sanat Akımları","ozgun":false,"ozet":"Geometrik bakışım, güneş patlaması, basamaklı biçimler ve metalik altın çizgiler; siyah, zümrüt, altın ve krem.","tanim":"Art Deco, makine çağının hızını ve lüksünü geometriye dönüştüren bir tasarım akımıdır: güneş patlaması ışınları, basamaklı zigurat biçimleri, şevronlar, yelpaze ve pul motifleri, akış çizgili (streamline) sadeleştirilmiş biçimler. Renkler güçlü ve zıttır; siyah ve koyu zümrüt zemin üstünde metalik altın çizgiler, krem ve mercan vurgular. Seyahat ve demiryolu afişlerinde, gökdelen cephelerinde, sinema salonlarında, mücevher ve iç mimaride kullanılır.","koken":"Adını 1925 Paris Uluslararası Modern Süsleme ve Endüstri Sanatları Sergisi'nden alır; kübizm, Viyana Atölyeleri, Mısır ve Maya süslemesi ile makine estetiğinden beslendi. Cassandre'ın demiryolu ve vapur afişleri, Chrysler ve Empire State binaları, Tamara de Lempicka'nın resimleri ve Erté'nin tasarımları akımın simgeleridir. Türkiye'de 1930'ların Ankara ve İstanbul apartmanlarında, Ankara Palas çevresindeki yapılarda yaygın izleri vardır.","ayirt_edici":["Kubbenin ardından açılan, altın çizgili ve dönüşümlü tonlu güneş patlaması ışınları; boncuk dizili çift yay","Basamaklı (zigurat) tepe çerçevesi, kademeli minare konsolları ve basamaklı pencere çerçeveleri","Seyahat afişi gibi şeritli gök: koyu zümrütten yeşime, kreme ve mercana; çizgilerle kesilmiş güneş diski","Her yerde metalik altın çizgi: kubbe kaburgaları, konturlar, korkuluk çubukları, şevron frizler","Geometrik yelpaze çiçekler ve şevron yaprak çiftleri; zeminde altın kenarlı pul (yelpaze) deseni","Akış çizgili kapsül bulutlar ve ince paralel hız çizgileri"],"palet":["#0D0E0D","#08382C","#0F6A4C","#64A584","#E9CB72","#B98C2C","#F0E3C4","#E07A5F"],"kodla_cizim":"Canvas 2048 px'de vektör olarak çizilir. Tuval boyunca açık ve koyu duraklar arasında dolaşan tek bir çapraz degrade, bütün altın çizgi ve dolgulara metalik parıltı verir. Gök on iki dikey degrade şeritten kurulur; güneş patlaması, kubbe tabanı merkezli dönüşümlü saydam kamalar ve altın ışın çizgileridir. Kubbe kaburga dilimleri, ışık yönüne göre altı basamaklı zümrüt tonundan biriyle boyanır (akış gölgesi). Minare konsolları basamaklara, pencere çerçeveleri ziguratlara, kaide ve kasnak frizleri şevron çizgilerine çevrilir. Çiçekler yay dilimlerinden ve kenar pullarından oluşan yelpazeler, zemin yarım daire pullardan bir desendir; çerçeve basamaklı bir çokgen, köşelerde yarım güneş yelpazeleri vardır. Sonunda hafif baskı dokusu çarpılır.","etiketler":["afiş","geometrik","güneş patlaması","zigurat","altın","seyahat afişi","1930'lar","sanat akımı","bakışım"],"klasor":"S-019-art-deco","gorsel":"stiller/S-019-art-deco/ornek.webp","kucuk":"stiller/S-019-art-deco/kucuk.webp"},{"kod":"S-020","no":20,"ad":"Kübizm","ad_en":"Cubism","aile":"Sanat Akımları","ozgun":false,"ozet":"Biçimler geometrik düzlemlere bölünür; aynı anda birden çok bakış açısı ve sınırlı toprak paleti.","tanim":"Kübizm, nesneyi tek bir bakış noktasından değil, parçalanıp yeniden kurulmuş düzlemler hâlinde gösterir. Biçimler köşeli yüzeylere ayrılır, düzlemler birbirine geçer ve kenarlar komşu yüzeye akar (passage); palet okr, gri ve kahverengilerle sınırlıdır. Sentetik evrede gazete kâğıdı ve ahşap damarı gibi kolaj dokuları da resme girer. Natürmort, portre ve kent görünümlerinde kullanılmış, modern resmin ve tasarımın temel dillerinden biri olmuştur.","koken":"1907–1914 yılları arasında Paris'te Pablo Picasso ile Georges Braque tarafından geliştirildi; Cézanne'ın doğayı silindir, küre ve koni üzerinden ele alışından beslendi. Analitik kübizm (1909–1912) neredeyse tek renkli, ince düzlemlere ayrılmış yüzeyleriyle; sentetik kübizm (1912–1914) kolaj, papier collé ve daha yalın, düz renkli düzlemleriyle bilinir. Juan Gris, Fernand Léger ve Albert Gleizes akımın öteki önemli adlarıdır.","ayirt_edici":["Kubbe, kasnak, kaide ve minare kesim çizgileriyle parçalara ayrılmış; parçalar birbirine göre kaymış ve hafifçe dönmüş","Aynı anda iki bakış: kubbe önden ve tepeden (ışınsal dilimli elips), şerefeler yandan ve üstten (halkalar), kaidenin sağa kaçan yan yüzü","Her düzlem bir kenarından koyulaşıp öbür yana açılan geçişle gölgelenmiş; kenarlar komşu düzleme akıyor (passage) ve yarı saydam düzlemler üst üste biniyor","Okr, gri, kahverengi ve kirli yeşille sınırlı analitik palet; açık minare koyu bir düzlem sütununun, koyu yeşil kubbe açık ve orta tonlu düzlemlerin önünde okunur","Sentetik kübizmden kolaj dokuları: ahşap damarı (faux bois), yazısız gazete rasteri ve nokta deseni","Yer yer koyu, fırçayla çekilmiş düzlem çizgileri ve her yüzeyde kısa, eğik fırça vuruşları"],"palet":["#BE9452","#D9BA7C","#684C32","#34281E","#C9C3B2","#969286","#4F7247","#CCA03E"],"kodla_cizim":"Canvas (2048 iç çözünürlük). Arka plan, birkaç yapı çizgisinden sonra hücreleri tek tek bölen BSP kesimleriyle yaklaşık 118 dışbükey düzleme ayrılır; her düzlem okr/gri/kahve tonlarından birini alır (minarenin arkası koyu, kubbenin gölgeli yanı açık tutulur) ve bir kenarından içeri doğrusal geçişle gölgelenir; üç hücre prosedürel ahşap damarı, yazısız gazete yarım tonu ve nokta deseniyle doldurulur. Minare, kaide, kasnak ve kubbe önce ekran dışı bir katmana düz kübist tonlarla (prizma yüzleri, 16 dilim, kaburgalar) çizilir; sonra kesim doğrularının oluşturduğu her hücre kaydırılıp döndürülerek taşınır, kendi ton/ışık geçişini ve yalnız nesnenin içinde kalan koyu kenar çizgilerini alır; parçaların arasındaki aralıklara nesnenin koyulaşmış, kaymamış hâli dolar. Kubbenin tepeden görünüşü, şerefe halkaları ve kaidenin yan yüzü ikinci bakış olarak eklenir. Çiçeklerin taç yaprakları altı köşeli çokgenlerdir ve ekseninden aydınlık/gölgeli iki düzleme bölünür. Ardından yarı saydam düzlemler, piksel renginden örneklenen 38 bin kısa fırça vuruşu, koyu düzlem çizgileri ve hafif bir kontrast artışıyla birlikte tuval dokusu gelir. Geometri SAHNE'den (kubbe profili, kaburgalar, kasnak pencereleri, minare parçaları, bitki yerleri) alınır.","etiketler":["modern sanat","avangart","geometrik","parçalı","kolaj","analitik","sentetik","çok bakışlı"],"klasor":"S-020-kubizm","gorsel":"stiller/S-020-kubizm/ornek.webp","kucuk":"stiller/S-020-kubizm/kucuk.webp"},{"kod":"S-021","no":21,"ad":"Bauhaus","ad_en":"Bauhaus","aile":"Sanat Akımları","ozgun":false,"ozet":"Ana renkler, kalın siyah çubuklar ve saf geometrik biçimlerle kurulmuş modernist afiş dili.","tanim":"Bauhaus üslubu biçimi işlevine ve en yalın geometrik öğelerine indirger: daire, kare, üçgen, yarım ve çeyrek daire. Kırmızı, sarı ve mavi; siyah, beyaz ve krem zeminle birlikte düz, gölgesiz alanlar hâlinde kullanılır; kompozisyon ızgaraya oturan asimetrik bir dengeyle kurulur. Afiş, tipografi, mimari ve ürün tasarımında modernizmin ortak dili olmuştur.","koken":"1919'da Walter Gropius'un Weimar'da kurduğu Bauhaus okulundan doğdu; Dessau (1925) ve Berlin (1932) dönemleriyle 1933'e kadar sürdü. Wassily Kandinsky'nin renk ve biçim kuramı, Johannes Itten'in renk dersleri, Josef Albers, László Moholy-Nagy, Herbert Bayer ve Joost Schmidt'in afiş ve tipografi çalışmaları üslubu biçimlendirdi; De Stijl ve Rus konstrüktivizmiyle akrabadır.","ayirt_edici":["Yalnız kırmızı, sarı, mavi, siyah, beyaz ve krem; tek istisna Yeşil Kubbe'yi temsil eden yeşil yarım daire","Kubbe meridyen yaylarıyla bölünmüş bir yarım daire, minare üst üste dikdörtgenler, topuz yarım daire ile üçgen, hilaller daire kesimi","Kalın siyah çubuklar: yer çizgisi, pencereli kasnak bloğu, şerefeler ve beyaz kaideyi iki uçtan çerçeveleyen dikmeler; kırmızı korniş bandı","16 px ızgaraya oturan asimetrik denge: solda mavi dikey alan, sağ üstte büyük sarı güneş dairesi ve ince siyah çerçeve çizgisi","Çiçekler daire ve çeyrek dairelerden: dört çeyrek daireli fırıldak çiçekler, iki renkli yarım daireler, yarım daire yapraklı dallar ve ince saplarda çeyrek daire yapraklar","Düz, gölgesiz renk alanları üzerinde çok hafif baskı greni"],"palet":["#E5D9BE","#FBF8F1","#1B1A19","#D7322B","#F2B81C","#1F4FA0","#1D7A4A"],"kodla_cizim":"JavaScript ile üretilen satır içi SVG: yalnız rect, circle ve yay komutlu path öğeleri (yarım daire, çeyrek daire, yarım daire tepeli kemer, üçgen). Ölçüler 16 px ızgaraya oturtulur; kubbe meridyenleri çeyrek elips yaylarıyla, hilaller SAHNE.hilalYolu ile çizilir; çiçek ve dal yerleri SAHNE.bitki'den alınıp ızgaraya yuvarlanır. Baskı greni, feTurbulence gürültüsünün %8 saydamlıkla çarpma (multiply) karışımıdır.","etiketler":["modernizm","afiş","geometrik","ana renkler","düz renk","ızgara","asimetrik denge","minimal"],"klasor":"S-021-bauhaus","gorsel":"stiller/S-021-bauhaus/ornek.webp","kucuk":"stiller/S-021-bauhaus/kucuk.webp"},{"kod":"S-022","no":22,"ad":"Düz İllüstrasyon","ad_en":"Flat Illustration","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Konturu olmayan düz renk biçimler, sınırlı ve uyumlu palet, tek tonluk gölge.","tanim":"Düz illüstrasyon biçimleri geometrik olarak sadeleştirir ve kontursuz, düz renk alanlarıyla anlatır; derinlik yalnızca her biçimin gölgede kalan yanındaki tek bir koyu tonla verilir. Beş-sekiz renklik uyumlu bir palet, keskin kenarlar ve isteğe bağlı çok hafif bir gren çağdaş editoryal görünümü kurar. Dergi ve gazete illüstrasyonlarında, kurumsal anlatımlarda, uygulama ve web arayüzlerinde yaygındır.","koken":"Kökleri 20. yüzyıl ortasının modernist afiş ve çocuk kitabı illüstrasyonuna (Charley Harper, Mary Blair, Paul Rand) uzanır; 2010'larda dijital arayüzlerdeki düz tasarım (flat design) akımıyla birlikte vektör araçlarında olgunlaştı. Bugün editoryal illüstrasyonda Malika Favre ve Tom Haugomat gibi sanatçıların sade, sınırlı paletli işleri bu dilin örnekleridir.","ayirt_edici":["Hiçbir biçimde kontur yok; her öğe keskin kenarlı düz renk alanı","Tek tonluk gölge: ışık sağ üstten, kubbe, kasnak ve minarede gölge sınırı aynı boylamda; şerefe çıkmaları ve korniş altı gölge tonunda","Kaburgalar ve zikzak bant bir ton koyu ince şeritler; pencereler en koyu yeşil","Taç yapraklarında, bulutlarda ve alem kürelerinde kaydırmalı gölge: her biçimin sol alt kenarında ince koyu hilal","Yapraklar orta damar boyunca açık ve gölge iki yarıya bölünmüş; adaçayı yeşili ve kubbe yeşili iki yaprak tonu","Soluk mavi gök, büyük açık renkli güneş dairesi ve halesi; önde yuvarlak hatlı düz bir çalı kütlesinin üstünde mercan göbekli beyaz çiçekler; çok hafif gren"],"palet":["#C7DCDD","#FFF8EE","#EBD9C2","#2E7E5C","#21614A","#E8AE46","#7DA877","#EC8D73"],"kodla_cizim":"JavaScript ile üretilen satır içi SVG; biçimler kontursuz dolgulu yollardır, yalnız kaburgalar, zikzak bant ve saplar düz renkli ince şerit (stroke) olarak çizilir. Her biçim açık ve gölge tonda iki katmandır: kubbe ve kasnakta gölge bölgesi u = −0,38 meridyeninin solu (SAHNE.kubbeProfili'nden kurulan yol); minarede her parça kendi yarıçapına göre kırpılmış ikinci bir gölge geçişiyle yeniden çizilir; taç yaprakları, bulutlar ve alem kürelerinde biçim gölge renginde, üstüne sağ üste kaydırılmış açık kopyası clipPath ile kırpılarak konur. Öndeki yaprak yelpazesi seyreltilir (birbirine 56 px'ten yakın yapraklar atlanır), tarhın altına üst üste binen dairelerden tek ton gölgeli bir çalı kütlesi konur. Gren, feTurbulence gürültüsünün %7 çarpma karışımıdır. Geometri SAHNE.minareParcalari, kasnakPencereleri, kaide, hilalYolu ve bitki'den gelir.","etiketler":["vektör","editoryal","düz renk","kontursuz","minimal","dijital","çağdaş"],"klasor":"S-022-duz-illustrasyon","gorsel":"stiller/S-022-duz-illustrasyon/ornek.webp","kucuk":"stiller/S-022-duz-illustrasyon/kucuk.webp"},{"kod":"S-023","no":23,"ad":"Çizgi Sanatı","ad_en":"Line Art","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Tek renk, eşit kalınlıkta çizgilerle; dolgusuz, bol boşluklu, zarif bir çizim.","tanim":"Çizgi sanatı (line art) konuyu yalnızca çizgiyle anlatır: ton, gölge ve dolgu yerine eşit kalınlıkta (monoline), tek renkli konturlar ve iç ayrıntı çizgileri kullanılır. Yuvarlak uçlu, temiz vektör çizgiler ve geniş beyaz alan sakin, zarif bir etki verir. Logo ve ikon tasarımında, ambalajda, davetiyelerde, boyama kitaplarında ve minimal duvar baskılarında yaygındır.","koken":"Kökü gravür, kalem çizimi ve teknik illüstrasyon geleneğine; modern biçimiyle Matisse ve Picasso'nun tek çizgi desenlerine ve 20. yüzyıl ortasının reklam çizimlerine dayanır. Bugünkü monoline biçim vektör araçları ve ikon tasarımıyla (eşit kalınlık, yuvarlak uç ve birleşim) yaygınlaştı.","ayirt_edici":["Bütün çizgiler aynı kalınlıkta (2,3 px) ve tek renk (koyu yeşil mürekkep); uçlar ve birleşimler yuvarlak","Dolgu yok; tek vurgu altın: iki hilalin dolgusu ve güneşin çizgisi","Ayrıntılar yalnız çizgiyle: kubbe kaburgaları, kemerli pencereler, şerefe korkuluk babaları, zikzak bant, topuz dilimleri, yaprak damarları, çiçek ercikleri","Kaburgalar tepede komşusuna fazla yaklaştığı yerde bitiyor; çizgiler üst üste yığılmıyor","Örtüşmeler gizli çizgi yöntemiyle temiz: arkadaki çizgi öndeki biçimin içinde görünmüyor","Geniş boş gök, ışınlı güneş ve iki sade bulut çizgisi; seyreltilmiş yapraklarla sakin ön plan"],"palet":["#FAF6EE","#1F3B34","#C9A23A","#B08A2C"],"kodla_cizim":"JavaScript ile üretilen satır içi SVG; bütün yollar stroke-width 2,3, stroke-linecap ve stroke-linejoin round. Gizli çizgiler ressam sırasıyla çözülür: arkadan öne çizilen her kapalı biçim kâğıt rengiyle doldurulur (görünürde dolgu yoktur). Kaburgalar SAHNE.kaburgalar'dan alınıp komşu kaburgaya 6 px'ten fazla yaklaştıkları yükseklikte kesilir; çiçekler taç uçlarında çentikli kutupsal bir eğriyle tek dış çizgi olarak (taç ayrımları, damarlar ve ucu halkalı ercikler, boyu SAHNE.rng ile değişen hafif kıvrık ikinci derece Bézier çizgileri), yapraklar orta ve uca doğru kıvrılan yan damarlarıyla, bulutlar dairelerin üst zarfı olarak hesaplanır. Öndeki yapraklardan yalnız çiçeklerin arkasından çıkanlar seçilerek boşluk korunur.","etiketler":["çizgi","monoline","minimal","vektör","tek renk","zarif","ikon"],"klasor":"S-023-cizgi-sanati","gorsel":"stiller/S-023-cizgi-sanati/ornek.webp","kucuk":"stiller/S-023-cizgi-sanati/kucuk.webp"},{"kod":"S-024","no":24,"ad":"Low Poly","ad_en":"Low Poly","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Görsel tümüyle düz gölgeli üçgenlerden: mücevher kesimi gibi yüzlü bir ağ.","tanim":"Low poly, sahneyi az sayıda düz gölgelenmiş üçgenden oluşan bir ağ olarak gösterir; her üçgen tek renktir ve hacim, ışığa göre farklı ton alan yüzlerle (faset) okunur. Üçgen kenarları çizgiyle değil, komşu yüzler arasındaki renk basamaklarıyla görünür. Oyun grafiğinde, hareketli grafik tasarımında, duvar kâğıtlarında ve poster illüstrasyonunda yaygındır.","koken":"Adını 1990'ların gerçek zamanlı 3B grafiğindeki düşük poligon sayılı modellerden alır; 2010'larda bağımsız oyunlar ve dijital illüstrasyonda bilinçli bir estetiğe dönüştü. Fotoğraf ve resimleri Delaunay üçgenlemesiyle üçgen ağına çeviren üretken tasarım araçları bu görünümü yaygınlaştırdı.","ayirt_edici":["Bütün yüzey yaklaşık 3 800 düz renkli üçgenden oluşan tek bir ağ; çizgi yok, kenarlar renk basamaklarıyla görünüyor","Gökte büyük üçgenler; kubbede, pencerelerde, minarede ve çiçeklerde küçülen üçgenler","Kubbe kaburgalar boyunca hizalanmış hücrelerden; her kaburga tabandan üst üçte bire dek uzanan ince, bir ton koyu üçgen şeridi","Kemerli pencereler beşgen, şerefe korkulukları zikzak üçgen dizisi, minaredeki zikzak bant diş sıraları hâlinde","Sağ üstten gelen ışıkla mücevher kesimi gölgelendirme; güneş, yüzleri dışa eğik on köşeli bir disk ve onu saran düzgün çokgen hale halkaları","Alemler, hilaller, küçük pencereler ve ince saplar elle üçgenlenmiş; yapraklar orta damarda, saplar ortadan kırılan iki tonlu yüzeyler"],"palet":["#9
