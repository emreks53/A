0BCE4","#E3E5DE","#6BC972","#479A51","#17371C","#E5DECD","#F8C847","#527643"],"kodla_cizim":"Canvas (2048 iç çözünürlük). SAHNE geometrisiyle her nesne (kubbe dilimleri, pencereler, minare parçaları, yapraklar, çiçekler…) ayrı bir renk kimliğiyle kimlik haritasına çizilir. Noktalar: kubbede kaburga × enlem kafesi (alt seviyelerde kaburganın iki yanına konan noktalar ince bir kaburga şeridi kurar), pencerelerde kemer beşgeni köşeleri, yapı kenarlarında sık noktalar, yaprak ve çiçek kenarlarında (ışın boyunca yürüyerek bulunan) noktalar, güneşte on köşeli disk ve aynı açılara dizilmiş hale halkaları; gök ve zemin değişken yarıçaplı Poisson diskiyle doldurulur. Komşuluk bilgili, yürüyerek yer bulan Bowyer–Watson Delaunay yaklaşık 1 900 noktadan 3 800 üçgen üretir. Her üçgenin rengi SAHNE.renkHaritasi'nın üçgen içindeki ortalamasıdır (yalnız çoğunluk nesnesinin örnekleri); üstüne nesne türüne göre çözümsel yüzey normaliyle sağ üstten Lambert ışığı ve küçük rastgele yüz farkı eklenir. Kaburga şeridindeki ince üçgenler bir ton koyulaştırılır, güneş diski sıcak açık sarıya boyanır. Alemler, zikzak bant, minare ve kaide pencereleri (kemer beşgeni üç üçgen) ve saplar (yalnız görünen parçaları, iki tonlu şerit) ağın üstüne elle üçgenlenir.","etiketler":["üçgen","ağ","Delaunay","faset","geometrik","dijital","3B estetiği"],"klasor":"S-024-low-poly","gorsel":"stiller/S-024-low-poly/ornek.webp","kucuk":"stiller/S-024-low-poly/kucuk.webp"},{"kod":"S-025","no":25,"ad":"İzometrik","ad_en":"Isometric Illustration","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Perspektifsiz 30° eksenlerle çizilmiş, havada duran bir zemin karosunun üstünde küçük bir maket dünya.","tanim":"İzometrik illüstrasyon, nesneleri birbirine 120° açılı üç eksen üzerinde, uzaklaştıkça küçülmeden çizen teknik bir izdüşümdür; paralel çizgiler hep paralel kalır. Bugün bilgi grafiklerinde, oyun ve uygulama arayüzlerinde, kurumsal sunumlarda sık görülen 'masa üstü diorama' görünümünü verir. Yüzeyler düz renklerle, ışığa göre üç tonla boyanır; temiz vektör kenarlar ve küçük, sevimli ayrıntılar (fener, çalı, tarh) sahneyi oyuncak bir maket gibi okutur.","koken":"Kökü mühendislik ve mimarlık çizimindeki aksonometrik izdüşümlere (19. yüzyılda William Farish'in izometrik perspektifi) uzanır. 1980'lerin bilgisayar oyunları (Marble Madness, Populous, sonra SimCity 2000) bu bakışı ekranlara taşıdı; 2010'larda düz tasarım akımıyla birlikte vektör izometrik illüstrasyon web ve marka dünyasının gözde dili oldu.","ayirt_edici":["Perspektifsiz gerçek izometrik bakış: bütün yatay kenarlar 30° eğik, düşeyler dik ve paralel","Kalınlığı görünen, havada duran kare zemin karosu: taş döşeme şeridi, çakıllı toprak ve kırık kaya katmanı","Üç tonlu yüzey gölgelemesi: üst yüzler en açık, sağ (güneşe bakan) yüzler açık, sol yüzler koyu","Kubbe izometrik elipslerden kurulmuş dönel yüzey; 32 dilim düz tonlarla ve ince kaburga çizgileriyle","Sekizgen prizma minare, korkuluklu iki şerefe ve soğan topuz; zemine sola düşen düz yarı saydam gölgeler","Karonun üstünde yükseltilmiş çiçek tarhları, yuvarlak çalılar, küçük yol fenerleri; minarenin dibindeki avluda yıldız kakmalı taş madalyon üstünde sekizgen şadırvan ve saksıda bir hurma ağacı"],"palet":["#1F693C","#46A057","#F4EEDF","#C3B597","#D9AC40","#9FCB72","#A9764A","#BFE0EE"],"kodla_cizim":"Tek canvas (2× iç çözünürlük). Kendi izdüşüm fonksiyonu P(x,y,z) = (512 + (x−y)·cos30°, OY + (x+y)·sin30° − z) ile bütün öğeler dünya koordinatında kuruldu. Kutular, n kenarlı prizmalar ve kesik koniler yüzey normali ile ışık vektörünün (sağ üst) iç çarpımına göre rampadan düz ton alır; arkaya bakan yüzler çizilmez. Kubbe SAHNE.kubbeProfili()'nden alınan profille dönel yüzey olarak 32 dilime bölündü, her dilimin yalnız izleyiciye bakan kısmı görünürlük sınırında kesilip hafif dikey geçişle dolduruldu; kasnak pencereleri silindir yüzeyine sarılmış sivri kemerler, kaide pencereleri yüz düzlemine eğilmiş kemerlerdir. Gölgeler ışık yönünde zemine izdüşürülen noktaların dışbükey zarfıyla ekran dışı tuvalde birleştirilip karo üstüne kırpıldı. Avludaki şadırvan sekizgen prizma ve kesik konilerden kuruldu; su, havuz ağzına kırpılmış daha alçak bir sekizgen olarak çizildiği için arka iç duvar görünür. Hurmanın gövdesi iki tonlu boğumlarla, tacı ekran düzleminde sarkan, kenarı tırtıllı ve üst yarısı açık tonlu on iki yaprakla çizildi. Tarh, çalı, çiçek, fener ve avlu öğeleri derinliğe (x+y) göre sıralanıp ressam algoritmasıyla çizildi.","etiketler":["izometrik","vektör","diorama","düz renk","üç ton","maket","dijital illüstrasyon"],"klasor":"S-025-izometrik","gorsel":"stiller/S-025-izometrik/ornek.webp","kucuk":"stiller/S-025-izometrik/kucuk.webp"},{"kod":"S-026","no":26,"ad":"Piksel Sanatı","ad_en":"Pixel Art","aile":"Grafik ve Dijital","ozgun":false,"ozet":"128 × 128 piksellik ızgarada, 22 renkle, her noktası elle konmuş gibi keskin kare piksellerle çizim.","tanim":"Piksel sanatı, görüntünün çok düşük çözünürlükte, pikseller tek tek bilinçli olarak yerleştirilerek kurulduğu dijital bir resim dilidir. Sınırlı palet, kenar yumuşatmasının olmayışı, düz renk kümeleri ve gökte ya da geçişlerde damalı titreklik (dithering) başlıca araçlarıdır. Bağımsız oyunların arka planlarında, simgelerde ve retro esintili illüstrasyonlarda kullanılır; büyütüldüğünde her piksel net bir kare olarak görünür.","koken":"1970'lerin ve 80'lerin oyun makineleri ile ev bilgisayarlarının (Atari, Commodore 64, NES, Amiga) donanım sınırlarından doğdu; az renk ve düşük çözünürlük sanatçıları her pikseli düşünerek koymaya zorladı. Mark Ferrari'nin palet döngülü manzaraları, LucasArts macera oyunları ve 16 bit dönemi bu dilin klasikleridir; 2000'lerden sonra Fez, Celeste, Eastward gibi bağımsız oyunlarla bilinçli bir estetik olarak yeniden doğdu.","ayirt_edici":["128 × 128 ızgara, 8× en yakın komşu büyütme: her piksel keskin bir kare, hiçbir yerde kenar yumuşatması yok","22 renklik sınırlı palet; gölgeler maviye-mora, ışıklar sarıya kaydırılmış tonlar","Gök degradesi düz bantlar ve aralarında damalı (ordered) titreklik geçişleriyle; güneşin halesi de damalı halkalar","Kubbede bantlı ışık kümeleri ve bir ton koyu piksel çizgilerle kaburgalar; gölge tarafında en koyu, ışık tarafında açık seçici dış çizgi","Elle yerleştirilmiş ayrıntılar: uçları içe kıvrık, altı kalın kâse biçimli hilaller, küre boğumlu alemler, minaredeki V zikzak bant ve korkuluk dikmeleri","Pembe kenarlı beyaz çiçekler (küçükleri elle çizilmiş beş yapraklı sprite'lar), sarı göbekler ve koyu kenarlı iki tonlu yapraklar; ufukta uzak tepe katmanı"],"palet":["#3B6CB4","#8DB9E4","#2A7A42","#8DCB6B","#F6D86E","#E9DEC6","#C4668A","#FFFDF4"],"kodla_cizim":"Çizim 128 × 128'lik bir dizin tamponunda (her hücre 22 renklik paletten bir numara) yapıldı; tarayıcının çizim fonksiyonları kullanılmadı. Kendi rutinleri: piksel merkezine göre tarama çizgisiyle çokgen doldurma, Bresenham çizgisi, harf haritalı elle çizilmiş sprite'lar (hilaller, alemler, soğan topuz, pencereler, küçük çiçekler) ve %25/%50/%75 damalı desenler. Kubbe SAHNE.kubbeProfili()'nden piksel piksel maskelenip yüzey normaline göre dört düz banda ayrıldı, kaburgalar meridyen boyunca bir ton koyu piksellerle işlendi; dış çizgi rengi kenarın yönüne göre seçildi. Yaprak, tomurcuk ve büyük çiçekler SAHNE.bitki konumlarından 128 uzayına rasterleştirilip iki tonla ve seçici kenarla boyandı. Sonunda tampon ImageData'ya çevrilip imageSmoothingEnabled=false ile 8× büyütüldü.","etiketler":["piksel","8 bit","16 bit","retro","oyun","dithering","sınırlı palet","dijital"],"klasor":"S-026-piksel-sanati","gorsel":"stiller/S-026-piksel-sanati/ornek.webp","kucuk":"stiller/S-026-piksel-sanati/kucuk.webp"},{"kod":"S-027","no":27,"ad":"Risograf Baskı","ad_en":"Risograph Print","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Üst üste basılan dört nokta renk, yarım ton ve tane dokusu, katmanlar arası kayma.","tanim":"Risograf, ana kalıbı ısıyla delinen ince bir zarın içinden mürekkebi kâğıda iten, fotokopi makinesine benzeyen bir şablon baskı makinesidir. Her renk ayrı bir tamburla ve ayrı geçişte basılır; yarı saydam soya bazlı mürekkepler üst üste binince karışarak yeni renkler verir. Tonlar yarım ton noktaları ya da stokastik taneyle oluşur; kayma, düzensiz mürekkep ve tambur izleri baskının doğal parçasıdır. Fanzin, afiş, sanatçı kitabı ve küçük yayıncılıkta sevilen, canlı ve floresan renkli bir estetiktir.","koken":"Japon Riso Kagaku şirketi 1980'lerde Risograph makinesini okul ve ofisler için ucuz, hızlı bir çoğaltma aracı olarak geliştirdi; şirketin 1977 tarihli Print Gocco el baskı aleti de aynı şablon ilkesine dayanır. 2000'lerden itibaren bağımsız baskı atölyeleri, tasarımcılar ve fanzin kültürü onu kendine özgü renkleri olan bir sanat ortamına dönüştürdü.","ayirt_edici":["Yeşil, sarı, floresan pembe ve orta mavi; üst üste binince koyu yeşil, mor ve turuncu tonlar","Gökte, minarede ve kubbe gölgesinde döndürülmüş yarım ton ızgaraları; yeşilde stokastik tane","Katmanlar arasında gözle görülen kayma: alemlerde sarı ile pembe ayrışır, kenarlarda ince kâğıt boşlukları açılır","Düzensiz mürekkep yoğunluğu, ince benekler ve yatay merdane bantları","Kaplamasız kırık beyaz kâğıt ve çevrede basılmamış kenar payı","Sade, kalın grafik biçimler: pembe çiçekler, kâğıt beyazı bulutlar, kalın ışınlı güneş"],"palet":["#F5F0E5","#00A95C","#FFE800","#FF48B0","#3255A4","#053338","#3C216E"],"kodla_cizim":"Her mürekkep (sarı, pembe, yeşil, mavi) için 2048 px'lik ayrı bir yoğunluk katmanı çizilir (alfa = mürekkep miktarı): gökte mavi ve pembe degradeler, güneşte sarı ve pembe, kubbede yeşil zemin, enlem boyunca mavi gölge ve sarı parıltı, çiçeklerde pembe, binada mavi çizgiler. Öndeki biçim arkadakini bütün katmanlarda boşaltır (knockout). Baskı adımında her katman kendi kaymasıyla okunur ve taranır: sarı, pembe ve mavi farklı açılarda (7°, 75°, 15°) 5,4 px hücreli yarım ton noktalarıyla, yeşil stokastik taneyle. Yoğunluk geniş lekelenme gürültüsü ve renge göre farklı yerde duran yatay merdane bantlarıyla (her renkte bir de mürekkebi azalmış dar şerit) oynatılır; bantlar hem nokta boyunu hem mürekkep miktarını etkiler; ince benekler mürekkebi keser. Renkler kırık beyaz kâğıtla çarpılarak (multiply) üst üste biner, çevrede basılmamış kenar payı kalır.","etiketler":["risograf","nokta renk","yarım ton","fanzin","afiş","floresan","baskı","grafik"],"klasor":"S-027-risograf","gorsel":"stiller/S-027-risograf/ornek.webp","kucuk":"stiller/S-027-risograf/kucuk.webp"},{"kod":"S-028","no":28,"ad":"Teknik Çizim (Mavi Kopya)","ad_en":"Blueprint","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Prusya mavisi kâğıt üzerinde beyaz, kusursuz çizgilerle ölçülü bir mimari ön görünüş.","tanim":"Mavi kopya, mimari ve mühendislik çizimlerinin ışığa duyarlı kâğıda çoğaltılmasıyla ortaya çıkan, koyu mavi zemin üzerinde beyaz çizgili baskıdır. Ortografik görünüşler, oklu ölçü çizgileri, kesik-noktalı eksenler, kesitlerde tarama ve sağ alttaki antet bu dilin vazgeçilmezleridir. Kullanılmış paftalarda katlama izleri, kenar aşınması ve kimyasal lekeler de görünür; bugün teknik ve 'mühendislik' estetiğini çağrıştırmak için grafik tasarımda sıkça kullanılır.","koken":"Siyanotipi 1842'de Sir John Herschel buldu; demir tuzlarıyla kaplı kâğıt ışıkta Prusya mavisine döner, çizgilerin gölgede kalan yerleri beyaz kalır. 1870'lerden 1940'lara kadar tersane, demiryolu ve mimarlık bürolarında çizimleri çoğaltmanın standart yolu oldu; sonra yerini amonyakla banyo edilen diazo kopyalara ve bilgisayar çıktılarına bıraktı, ama 'blueprint' sözcüğü plan anlamında dilde kaldı.","ayirt_edici":["Prusya mavisi, lekeli ve dokulu kâğıt üzerinde hafif dağılmış beyaz/açık camgöbeği çizgiler","Ortografik güney cephesi: kubbe kaburgaları, kasnak pencereleri, kaide taş dizileri, kaidenin arkasında kalan minare kenarı kesik (gizli) çizgiyle","Oklu ölçü çizgileri ve sayılar (16,00 · 28,72 · zincir ölçüler), kot işaretleri, kesik-noktalı eksenler ve kubbenin yapım daireleri","Soluk yapı ızgarası, bölge harfli pafta çerçevesi ve temel kesitinde 45° tarama","Sağ üstte büyütülmüş alem detayı (DETAY A · 1:50), sağ altta antet ve çizgisel ölçek","Katlama izleri, aşınmış kenarlar, kuruma halkalı su lekeleri; ön planda damarlı ve taramalı ince botanik çiçek etütleri"],"palet":["#0F3063","#1B488C","#3A66A7","#335587","#537099","#819EC5","#EAF6FF"],"kodla_cizim":"Kâğıt 1024 × 1024 ImageData olarak piksel piksel hesaplandı: merkezden kenara Prusya mavisi geçişi, üç ölçekli değer gürültüsüyle beneklenme, gürültüyle bozulmuş dairesel maskelerle açık içli, koyu kuruma halkalı su lekeleri ve aşınmış kenarlar. Bütün çizim 2× çözünürlükte ayrı, saydam bir 'çizgi katmanına' beyazla yapıldı; SAHNE.yollar() ve SAHNE.minareParcalari() geometrisi Path2D ile çizildi, öndeki öğe çizilmeden önce kendi biçimi destination-out ile silinerek arkadaki çizgiler örtüldü. Ölçü okları, kot işaretleri, eksen simgesi, tarama, pafta çerçevesi, antet ve ölçek çubuğu kendi yardımcılarımızla; yazılar DejaVu Sans ve Liberation Mono. Botanik etütler SAHNE.bitki konumlarından kontur, orta ve yan damar, gölge yarısında ince tarama ve ercik çizgileriyle kuruldu. Katman gürültü maskesiyle hafifçe düzensizleştirilip önce bulanık (dağılma), sonra keskin olarak kâğıda basıldı; en son katlama sırtları ve köşe aşınması eklendi.","etiketler":["teknik çizim","mavi kopya","siyanotipi","mimari","ölçülü","çizgi","pafta","mühendislik"],"klasor":"S-028-teknik-cizim","gorsel":"stiller/S-028-teknik-cizim/ornek.webp","kucuk":"stiller/S-028-teknik-cizim/kucuk.webp"},{"kod":"S-029","no":29,"ad":"Katmanlı Kâğıt","ad_en":"Layered Papercut","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Arkadan öne üst üste dizilmiş, her biri alttakine gölge düşüren kesilmiş renkli kâğıtlarla kurulan derinlikli sahne.","tanim":"Katmanlı kâğıt kesimi, düz renkli kâğıtların biçimlere kesilip aralarında küçük boşluklarla üst üste yapıştırılmasıyla yapılan kabartma bir resim tekniğidir. Her katmanın kenarı ışıkta ince parlar, altındaki katmana yumuşak bir gölge düşürür; böylece düz renkler gerçek bir derinlik kazanır. Kitap kapaklarında, vitrinlerde ve 'paper art' esintili dijital illüstrasyonlarda sevilen, sıcak ve el yapımı hissi veren bir dildir.","koken":"Kâğıt kesme sanatının kökü Çin'in jianzhi geleneğine, Osmanlı'daki kat'ı (kâğıt oyma) sanatına ve Avrupa'nın silüet kesimlerine uzanır. Katmanlarla derinlik veren bugünkü 'shadow box' ve 'layered papercut' çalışmaları 2010'larda Hari & Deepti, Owen Gildersleeve gibi sanatçılarla yaygınlaştı; aynı görünüm dijital illüstrasyonda yumuşak gölgeli kâğıt katmanlarıyla taklit edilir.","ayirt_edici":["Otuz dört ayrı kâğıt katmanı: gök halkaları, güneş, bulutlar, iki sıra uzak tepe, minare ve kabarık şerefeleri, kaide gövdesi, pilastrlar ve kör kemer frizi, pencere çerçeveleri, kasnak, kubbe, alem, zemin, çayır, yapraklar ve çiçekler","Her katmanın sol alta düşen yumuşak gölgesi; pencere deliklerinin ve frizdeki küçük kemer oyuklarının içinde arkadaki kâğıda düşen gölge","Ayrı ayrı kesilmiş, sağa doğru açılan yeşil tonlarda 16 kubbe dilimi ve aralarındaki koyu boşluklar (kaburgalar)","Güneşin çevresinde dalgalı halkalar ve ışınlı yıldız kesimi; üstte kabarık altın güneş diski","Her kâğıtta lifli doku, sağ üste bakan kesim kenarında ince ışık, karşı kenarda kâğıt kalınlığı gölgesi","Derinliğe göre palet: arkada soluk gök ve kum tonları, önde daha doygun yeşiller ve beyaz çiçekler"],"palet":["#BEDCE6","#F5D77C","#F1E8D6","#2B7243","#55A861","#D8A93F","#EBDCBC","#FFFDF7"],"kodla_cizim":"Her kâğıt katmanı 2048 × 2048'lik ekran dışı bir tuvale kendi biçimleriyle (SAHNE.yollar(), minare parçaları, kubbe profili, SAHNE.bitki) boyanır, delikler destination-out ile kesilir. Sonra bir kez üretilen lif dokusu (ince benek + 9000 kıvrık iplik) her katmana farklı kaydırmayla source-atop olarak işlenir; katmanın kendi alfa kanalı sol alta kaydırılıp çıkarılarak sağ üst kenarda ince ışık, ters yönde kâğıt kalınlığı gölgesi elde edilir. Katman ana tuvale shadowBlur ve shadowOffset ile (ışık sağ üstten, gölge sol alta) basılır; böylece her katman ancak altındakilere gölge düşürür. Kubbe 16 dilime ayrı ayrı kesilip boylamına göre yeşil tonlandırıldı. Beyaz kaide düz kalmasın diye gövdenin üstüne ayrı katmanlar olarak pilastrlar, taban silmesi, SAHNE.kemerYolu() ile oyulmuş kör kemer frizi ve evenodd dolguyla kesilmiş sivri kemer pencere çerçeveleri eklendi; minarenin çıkmaları ve bileziği de gövdeden ayrı, kabarık kâğıttır. En sonda soft-light karışımlı radyal ışıkla fotoğraf aydınlatması verildi.","etiketler":["kâğıt","kesme","katmanlı","gölge","derinlik","el yapımı","doku","paper art"],"klasor":"S-029-katmanli-kagit","gorsel":"stiller/S-029-katmanli-kagit/ornek.webp","kucuk":"stiller/S-029-katmanli-kagit/kucuk.webp"},{"kod":"S-030","no":30,"ad":"Neon Gece","ad_en":"Neon Sign","aile":"Grafik ve Dijital","ozgun":false,"ozet":"Karanlık gecede, sabit kalınlıkta bükülmüş ışıklı cam tüplerden kurulan, çevresine renkli hale yayan bir neon tabela.","tanim":"Neon tabela, içinde soy gaz bulunan ince cam tüplerin ısıtılıp elle bükülmesi ve elektrotlarla yakılmasıyla yapılan ışıklı yazı ve resimlerdir. Tüpler her yerde aynı kalınlıktadır, uçları yuvarlaktır; ayrı tüplerin birleştiği ya da arkadan dolaştığı yerlerde küçük boşluklar ve siyaha boyanmış sönük kısımlar görülür. Işık tüpün ortasında neredeyse beyaz, kenarında doygun renkli, çevresinde ise geniş yumuşak bir hale olarak algılanır; bu yüzden neon hem vitrinlerde hem de gece temalı dijital illüstrasyonlarda güçlü bir atmosfer kurar.","koken":"Georges Claude neon lambasını 1910'da Paris'te tanıttı; 1923'te Los Angeles'a gelen ilk neon reklamlarla birlikte tabela dili 1930–60 arası Amerikan şehirlerinin, Las Vegas'ın ve Tokyo'nun gece yüzü oldu. Cam bükme ustalığı bir zanaat olarak sürerken, 1980'lerden sonra neon görünümü synthwave ve gece temalı grafik tasarımda dijital olarak da yeniden üretilir.","ayirt_edici":["Sabit kalınlıkta, uçları yuvarlak cam tüpler; her tüpte beyaz-sıcak çekirdek, renkli gövde ve dört katlı yumuşak hale","Yeşil tüplerle kubbe dış çizgisi, beş kaburga, iki kat kasnak; alt katta kemerli pencereler, üst katta küçük kemerli nişler; tepede alemin oturduğu boşluk","Sıcak beyaz minare ve kaide, altın alemler, hilaller ve pencereler; şerefe korkulukları ve gövde bandı zikzak tüplerle","Ölçülü, ağırbaşlı palet: yumuşak gül pembesi ve inci beyazı beş loblu çiçekler, altın göbekler, yeşim yeşili saplar ve yapraklar","Gerçek neon yapımı ayrıntıları: bükülme yerlerinde boşluklar, uçlarda sönük koyu elektrot kısımları, karartılmış bağlantı tüpü ve küçük tüp tutucular","Soluk yıldızlı gece göğü; parlak koyu zeminde bulanık yansıma ve ışık havuzu"],"palet":["#070B18","#34F08A","#FFF2DC","#FFC247","#F7A9BE","#FFEFEA","#6FD8A4"],"kodla_cizim":"Motif, SAHNE geometrisinden (kubbe profili ve kaburgalar, kasnak pencereleri, kaide, minare parçaları, alem, SAHNE.bitki) üretilen çoklu çizgilerden oluşan bir 'tüp listesi' olarak kuruldu; her tüpün rengi, kalınlığı, elektrot ucu ve tutucu aralığı var. Çiçekler beş loblu kutupsal eğriyle tek tüp, hilal dış ve iç yayın birleşimiyle, kasnak nişleri ve pencereleri SAHNE.kemerYolu() örneklenerek alt ucu açık tek tüp olarak çizildi. Hale renkleri yarı saydam tutuldu ki pembe ve sıcak beyaz tüpler yeşil kubbeyi bastırmasın. Tüpler 2× çözünürlükte ayrı tuvallere ışık, gövde ve çekirdek olarak çizildi; ışık tuvali 'lighter' karışımla dört farklı bulanıklıkta (70, 30, 12, 4 px) üst üste toplandı, üstüne doygun renkli gövde ve hafif bulanık beyaz çekirdek basıldı. Tüplerin uçları yay uzunluğuna göre kesilip koyu camla, tutucular tüp yönüne dik küçük kıskaçlarla eklendi. Yapı tüpleri ters çevrilip bulanıklaştırılarak zemine sönümlenen yansıma olarak işlendi; gök degrade ve tohumlu yıldızlarla kuruldu.","etiketler":["neon","gece","ışık","tabela","parıltı","cam tüp","retro","dijital"],"klasor":"S-030-neon-gece","gorsel":"stiller/S-030-neon-gece/ornek.webp","kucuk":"stiller/S-030-neon-gece/kucuk.webp"},{"kod":"S-031","no":31,"ad":"Beş Vakit","ad_en":"Five Prayer Times","aile":"Atölye Özgün","ozgun":true,"ozet":"Aynı sahne, beş dikey bantta beş namaz vaktinin ışığıyla: İmsak, Öğle, İkindi, Akşam, Yatsı.","tanim":"Tuval soldan sağa beş dikey banda bölünür ve her bant aynı, kesintisiz sahneyi başka bir vaktin ışığında gösterir: İmsak'ta şafak öncesi serin mor-mavi gök, son yıldızlar ve sabah yıldızı; Öğle'de tepeden beyaz ışık, kısa gölgeler ve doygun renk; İkindi'de altın sarısı sıcak ışık ve uzayan gölgeler; Akşam'da turuncu-eflatun gök, ufka alçalmış güneş ve kızıl kenar ışıklı yarı siluet yapı; Yatsı'da koyu çivit gece, ay ve yıldızlar. Geometri bant sınırlarında hiç kaymaz; değişen yalnız ışığın yönü ve rengi, gök, gölgeler ve palettir; gece ve alacakaranlık bantlarında yapının ışıkları (pencereler, alem) yanar. Bantlar aşağı yukarı eşit genişliktedir (burada 236, 192, 192, 192 ve 212 piksel; gece kanatları biraz geniş), böylece beş vakit eşit bir ritimle okunur ve sınırlar konunun içinden geçer: minare Öğle'ye, alem İkindi'ye, kubbenin sağ omzu Akşam'a düşer. Bantlar ince altın kıl çizgilerle ayrılır; üstte ortak bir yay (güneşin yolu) üzerinde her bandın ortasında o vaktin güneş ya da hilal işareti durur.","koken":"Fikir, namaz vakitlerinin günü beş ışığa bölmesinden doğdu. Aynı yapının gün boyunca değişen ışıkta defalarca resmedildiği seri resim geleneği (Monet'nin Rouen Katedrali dizisi gibi) tek bir tuvalde, yan yana dikey şeritler hâlinde toplanır; Medine'de günün ritmini ezan vakitleri belirlediği için ışık saat yerine vakitlerle okunur ve üstteki güneş yolu bir vakit cetveli gibi çalışır.","ayirt_edici":["Soldan sağa İmsak, Öğle, İkindi, Akşam ve Yatsı ışığında, aşağı yukarı eşit genişlikte beş dikey bant","Minare, kubbe, kasnak, kaide ve çiçekler bant sınırlarında kaymadan sürer; yalnız ışık, gök ve renk değişir","Bantları ayıran ince altın kıl çizgiler ve üstte ortak güneş yolu yayında hilal, güneş ve ufuktaki yarım güneş işaretleri","İmsak'ta mor-pembe şafak, son yıldızlar ve sabah yıldızı; Yatsı'da çivit gece, hilal ay ve yıldızlar","Öğle'de mavi gök ve parlak beyaz minare, İkindi'de altın sarısı gök ve sıcak ışıkta parlayan kubbe ile alem","Akşam'da kubbenin sağ omzunda ufka alçalmış güneş, kızıl kenar ışıklı yarı siluet kubbe ve yanmaya başlayan pencereler"],"palet":["#272C66","#5C9EF0","#2CAF4A","#F2C27E","#C5467A","#FE8D67","#0B133C","#C9A043"],"kodla_cizim":"Canvas, 2048 iç çözünürlük; bant sınırları x = 236, 428, 620 ve 812. Sahne önce ışıksız düz renklerle (albedo) ve SAHNE bölge haritasıyla ayrı tuvallere çizilir; her piksel için bulunduğu bandın vakit ayarlarıyla (güneş yönü, rengi ve gücü, gök ve yer ortam ışığı, gece projektörü, pozlama, ton ve doygunluk) Lambert ve Blinn-Phong ışığı hesaplanır. Normaller geometriden çıkarılır: kubbe profili ve 16 dilimli kaburgalar, silindir kasnak ve minare, düz kaide, küre alemler, hafif kubbemsi çiçekler. Gölgeler: bina siluetinin vakte göre eğik izdüşümüyle yer gölgesi, korniş ve şerefe altı gölgeleri, minarede ışığa doğru yürüyerek bulunan kubbe gölgesi. Gökler bant bant degrade, yıldız, şafak ve gün batımı bulutları, sabah yıldızı, alçak güneş ve hilal ayla çizilir; pencere ve alem ışımaları bulanık 'lighter' katmanla, altın kıl çizgiler ve Catmull-Rom eğrisiyle güneş yolu en üstte çizilir.","etiketler":["özgün","ışık","zaman","çoklu pano","yarı gerçekçi","gökyüzü","namaz vakitleri"],"klasor":"S-031-bes-vakit","gorsel":"stiller/S-031-bes-vakit/ornek.webp","kucuk":"stiller/S-031-bes-vakit/kucuk.webp"},{"kod":"S-032","no":32,"ad":"Nur Hüzmesi","ad_en":"Beam of Light","aile":"Atölye Özgün","ozgun":true,"ozet":"Koyu zeminde çizgi de dolgu da yok; sahne yalnızca alemdeki hilalden saçılan binlerce ince ışınla görünür.","tanim":"Zemin derin koyudur ve hiçbir dış çizgi ya da renk dolgusu kullanılmaz; sahnenin en anlamlı noktasına konan tek bir ışık kaynağından (burada kubbe alemindeki hilal) her yöne binlerce ince, düz ışın çıkar. Her ışın geçtiği biçime göre parlaklık ve renk değiştirir: kubbe üstünde yeşil-altın, minare ve kaidede krem, çiçeklerde pembe-beyaz, yapraklarda yeşil, gökte soluk mavi, yerde sönük sıcak kum rengi; pencere gibi boşluklarda söner. Işınlar kaynağa yakın yoğun ve parlaktır, kaynağın kendisi parlayan bir biçim (hilal) ve yumuşak hâle olarak görünür; ışın bir biçime girip çıkarken ya da kaburga, korkuluk, taç yaprağı kenarı gibi bir ayrıntıyı keserken kısa bir parlama yapar. Biçimler yalnızca bu ışın değişimiyle okunur; kural her konuya, anlamlı bir noktaya kaynak konarak uygulanabilir.","koken":"İlham, karanlık bir mekâna aralıktan sızan ışık hüzmelerinden, tozlu havada görünen ışık sütunlarından ve 'nur' kavramının kendisinden geldi: görmek, ışığın bir şeye çarpmasıdır. Fikrin özü resmi boyayla değil ışıkla yazmak ve her şeyi aydınlatan kaynağı sahnenin en anlamlı noktasına, kubbe alemindeki hilale koymaktır.","ayirt_edici":["Kubbe alemindeki parlayan hilalden her yöne yayılan binlerce ince ışın ve kaynakta yumuşak hâle","Dış çizgi ve dolgu yok: biçimler yalnızca ışınların renk ve parlaklık değişiminden okunuyor","Kubbede yeşil-altın, minare ve kaidede krem, çiçeklerde pembe-beyaz, yapraklarda yeşil, gökte soluk mavi, yerde sönük sıcak ışınlar","Kasnak ve kaide pencereleri ışığın söndüğü koyu kemerli boşluklar olarak kalıyor","Kaynaktan uzaklaştıkça seyrelen, tek tek seçilen ışın demetleri","Siluetlerde, kaburgalarda ve taç yaprağı kenarlarında ışınların kısa parlamalarıyla beliren çizgiler"],"palet":["#05070F","#1C2033","#83A951","#9F9076","#E8CF9C","#CBBDC4","#FFF8E6"],"kodla_cizim":"Canvas, 2048 iç çözünürlük ve kendi Float32 ışık birikim tamponu. Bölge haritası SAHNE.ciz({bolge:true}) ile 2048 çözünürlükte çizilip bölge dizisine çevrilir (kenar yumuşatma hataları komşu çoğunluğuyla düzeltilir, güneş diski göğe katılır), renkHaritasi() ton haritası olur; ayrıca kaburga, zikzak, korkuluk, silme, taç yaprağı ve damar çizgilerinden bir ayrıntı haritası ve bölge sınırı haritası çıkarılır. Hilalden 5600 ışın, hilalin kenarından başlayarak 0,34 piksel adımla dışa doğru yürütülür; her adımda bölgeye göre renk ve güç, uzaklık sönümü, ton, sınır ve ayrıntı parlaması hesaplanıp tampona çift doğrusal serpmeyle toplanır (toplamalı karışım). Işın güçleri rastgele ve açıya bağlı demetlerle değişir, kaynağa yakın ışınlar altın-beyaza çalar. Tampon 1 − e^(−kx) ile ton eşlenir; üstüne bulanık 'lighter' hâle, kaynakta radyal parıltı ve keskin kenarlı parlak hilal eklenir.","etiketler":["özgün","ışık","ışın","karanlık zemin","toplamalı karışım","üretken","nur"],"klasor":"S-032-nur-huzmesi","gorsel":"stiller/S-032-nur-huzmesi/ornek.webp","kucuk":"stiller/S-032-nur-huzmesi/kucuk.webp"},{"kod":"S-033","no":33,"ad":"Telkâri Tel","ad_en":"Filigree Wire","aile":"Atölye Özgün","ozgun":true,"ozet":"Koyu kadife üstünde gümüş ve altın telkâri: burgulu tel hatlar, sık spiral dolgular, granül boncuklar.","tanim":"Her şey koyu, hafif havlı kadifenin (lacivert ya da bordo) üstüne serilmiş ince gümüş ve altın telden yapılmış gibi çizilir. Dış hatlar ve bölme çizgileri burgulu çift teldir (halat deseni); alanlar sıkıca yerleştirilmiş minik tel spiraller, S ve C kıvrımlarıyla, ince uzun alanlar (yapraklar) damardan kenara uzanan eğik yassı tellerle (balık sırtı) doldurulur; birleşim yerlerine ve küçük boşluklara granül boncuklar konur. Her tel metal gibi gölgelenir (koyu kenar, orta ton, ışığa bakan yanda parlak çizgi) ve kadifeye küçük gölgeler düşürür; önde duran parça arkadakinin tellerini örter. Malzeme biçime göre seçilir: burada kubbe altın spirallerle, minare, kasnak ve kaide gümüşle dolu, çiçekler gümüş taç yapraklı ve altın granül göbekli, yapraklar eskitilmiş altın, bulutlar gümüş çerçeveli.","koken":"İlham, Mardin ve Midyat telkârisi ile Osmanlı kuyumculuğundaki filigran işçiliğinden geldi: ince gümüş tel bükülüp burularak çerçeve yapılır, içi yassı tel kıvrımlarıyla doldurulur, lehimlenip granülle süslenir. Fikrin özü bir mimari manzarayı bir mücevher plaketi gibi düşünmek: her çizgi bir tel, her alan sabırla doldurulmuş bir hücredir.","ayirt_edici":["Burgulu çift telden (halat desenli) dış hatlar, kubbe kaburgaları ve pencere kemerleri","Hücreleri dolduran sık tel spiraller, S ve C kıvrımları ve aralardaki granül boncuklar","Altın spirallerle dolu kubbe; gümüş telden minare, kasnak, kaide ve dalgalı çerçeveli bulutlar","Eskitilmiş altından, balık sırtı yassı tellerle dolu yapraklar","Gümüş, üst üste binen taç yaprakları ve altın granül kümesi göbekli çiçekler","Koyu bordo, havlı kadife zemin ve tellerin kadifeye düşen küçük gölgeleri; altın telkâri güneş"],"palet":["#4A0F1E","#2E0912","#C08E36","#F4D888","#A4ACB6","#EAF0F5","#A47832"],"kodla_cizim":"Canvas, 2048 iç çözünürlük. Kadife zemin piksel piksel değer gürültüsüyle üretilir (geniş parıltı, dikey hav lifleri, kenar kararması). Teller metal türü ve kalınlığa göre toplanmış Path2D vuruşlarıyla üç katmanda çizilir: koyu kenar, ışığa kaydırılmış orta ton ve ince parlak çizgi; burgulu tel, yol boyunca eşit aralıklı eğik kısa halkalardan oluşur, SAHNE yolları SVG getPointAtLength ile örneklenir. Örtme: minarenin kaide ve kasnak ardına düşen hatları bölge haritasıyla, bitkilerde sap, yaprak, tomurcuk ve taç yaprağı hatları çizim sırasına göre üstteki biçimlerle (isPointInPath) kesilir. Dolgu için görünür tel hatlarından bir sınır maskesi çıkarılır; uzaklık dönüşümü (chamfer) ve ızgarayla hızlandırılmış dart atışıyla daireler sıkı yerleştirilir, her daire Arşimet spirali, iki ters spiralden S kıvrımı ya da açık C kıvrımı olur, en küçükleri granül boncuk; yapraklarda damar boyunca eğik teller kenara kadar yürütülür. Boncuklar önceden çizilmiş küre görüntüleridir. Yapı ve bitki katmanları ayrı ayrı, bulanık ve kaydırılmış gölgeleriyle kadifeye bindirilir; metale hafif hacim degradesi ve birkaç ışıltı eklenir.","etiketler":["özgün","telkâri","filigran","kuyumculuk","metal","kadife","geleneksel zanaat"],"klasor":"S-033-telkari-tel","gorsel":"stiller/S-033-telkari-tel/ornek.webp","kucuk":"stiller/S-033-telkari-tel/kucuk.webp"},{"kod":"S-034","no":34,"ad":"Mukarnas Hücre","ad_en":"Muqarnas Cells","aile":"Atölye Özgün","ozgun":true,"ozet":"Bütün yüzey sivri kemerli küçük niş hücrelerine bölünür; sahne boyalı, oyma alçı bir kabartma gibi okunur.","tanim":"Resim yüzeyinin tamamı, yarım hücre kaydırılmış kademeler (sıralar) hâlinde dizilen küçük sivri kemerli niş hücrelerine bölünür. Her hücre bir mukarnas nişidir: üstte sivri kemer başlık, dikey yan duvarlar ve düz bir taban; tabanın altında, alttaki iki nişin kemerleri arasına sarkan, ortadan sırtlı üçgen bir pandantif yüzü bulunur, böylece hücreler boşluksuz kenetlenir ve her kademe yatay bir çizgiyle okunur. Niş içbükeydir: sağ üstten gelen ışıkla kemer sırtının sağ üstü parlar, başlığın altındaki kovuk ve sağ iç duvar gölgede kalır, sol iç duvar ve taban aydınlanır. Hücrenin rengi sahnenin o noktasından alınır ve alçı kremine biraz karıştırılır. Ayrıntı gereken yerlerde (siluet kenarları, alem, hilal, çiçekler, saplar) hücre kendi içinde daha küçük hücrelere bölünür; pencere gibi kemerli açıklıklar kendi biçiminde tek ve derin bir niş olur. Kubbe gibi değerli yüzeylerde hücre kenarları ince altın yaldızla çizilir; bütün yüzey oyulmuş, boyanmış alçı kabartma gibi görünür.","koken":"İlham, Selçuklu ve Osmanlı mimarisindeki mukarnaslardan (taç kapılarda, kubbe geçişlerinde ve mihrap kavsaralarında kademe kademe dizilen küçük niş hücreleri) ve boyalı alçı mukarnas tavanlarından geldi. Fikrin özü, mukarnasın üç boyutlu hücre dilini bir resmin piksel ızgarası gibi kullanmak: her hücre hem bir mimari niş hem de resmin bir renk noktasıdır.","ayirt_edici":["Bütün yüzeyi kaplayan, yarım hücre kaydırılmış kademeler hâlinde kenetlenmiş sivri kemerli niş hücreleri","Her nişte gölgeli başlık kovuğu, aydınlık sol iç duvar ve ışık alan sağ üst kemer sırtı","Nişlerin arasında, alttaki kemerlerin arasına sarkan sırtlı üçgen pandantif yüzleri ve kademe çizgileri","Gökte büyük, siluet kenarlarında, alemde, çiçeklerde ve saplarda iç içe küçülen hücreler","Kendi kemer biçiminde derin nişler olarak okunan kasnak, kaide ve minare pencereleri","Yukarıda koyu, ufukta açık mavi boyalı gök, altın yaldız kenarlı yeşil kubbe ve krem alçı minare ile kaide"],"palet":["#4680C4","#A4BCD0","#4E8F51","#E9DFC8","#D6AC52","#2A3527","#AF9B77"],"kodla_cizim":"Canvas, 2048 iç çözünürlük, tamamen piksel işleme. Hücre ızgarası analitiktir: dört seviye (42, 21, 10,5 ve 5,25 piksel genişlik), sıra yüksekliği genişliğin 1,14 katı, kemer yüksekliği 0,58 katı; her sıra yarım hücre kaydırılır, hücre üstü tepesi sivriltilmiş eşkenar kemer eğrisinden, altı alttaki iki hücrenin kemerlerinden hesaplanır. Bir hücrenin bölünüp bölünmeyeceği içine düşen SAHNE bölgelerinin çeşitliliği, pencere, alem ya da çiçek ortası bulunması ve ton varyansıyla belirlenir. Pencereler kendi kemer biçimlerinden çizilen bir maskeyle ayrı, derin niş hücreleri olur. Her piksel için hücre zinciri bulunur; niş kısmında yatay ve dikey konumdan (kemer tepesinde yumuşatılmış) düzgün bir kase derinliği, taban altında öne çıkan sırtlı pandantif yüzü hesaplanır, iç içe hücrelerde derinlikler toplanır. Derinlik alanından normaller çıkarılır; sağ üstten Lambert ışığı, yükseklik alanında ışığa doğru yürüyerek atılan gölge, derinliğe bağlı ortam kapanması ve alçı tanesi eklenir. Hücre rengi, parçanın baskın bölgesindeki (ince öğeler ağırlıklı sayılır) başvuru renklerinin ortalamasıdır (alçı kremiyle karıştırılmış, gök yukarıda koyu, ufukta açık maviye çekilmiş); altın hücrelere metal parlaklık, kubbe, alem, güneş ve çiçek ortası hücrelerinin kenarına altın yaldız çizgisi verilir.","etiketler":["özgün","mukarnas","kabartma","alçı","geometrik","mimari süsleme","hücre"],"klasor":"S-034-mukarnas-hucre","gorsel":"stiller/S-034-mukarnas-hucre/ornek.webp","kucuk":"stiller/S-034-mukarnas-hucre/kucuk.webp"},{"kod":"S-035","no":35,"ad":"Takımyıldız","ad_en":"Constellation Chart","aile":"Atölye Özgün","ozgun":true,"ozet":"Sahne gece mavisi bir gök haritasında takımyıldız olarak: yapısal köşelerde yıldızlar, aralarında ince soluk çizgiler.","tanim":"Sahne lacivert bir gök haritasının üstüne takımyıldız olarak çizilir: biçimlerin yapısal köşelerine (kubbe dış çizgisi, kasnak ve kaide köşeleri, pencere kemerleri, minare çıkıntıları, alem) yıldızlar konur ve ince soluk çizgilerle bağlanır. Yıldızın büyüklüğü önemini gösterir: hilal uçları, kubbe tepesi, minare tepesi ve şerefe uçları en parlaklarıdır ve dört kollu kırınım ışınları taşır. Arkada soluk, eğri gök koordinat ızgarası, Samanyolu tozu ve yalnızca 0°, 30°, 60° gibi küçük derece işaretleri taşıyan dairesel harita çerçevesi bulunur; kubbe hafif yeşil bir bulutsuyla dolar, çiçekler küçük takımyıldızlardır. Mürekkepler altın ve soluk camgöbeğidir.","koken":"İlham, eski gök atlasları, usturlap levhaları ve gece yolculuğunda yön bulmak için yıldızlara bakma geleneğinden geldi. Fikrin özü mimariyi göğe yazmaktır: takımyıldızlar dağınık yıldızları hayalî çizgilerle birleştirip biçim kurduğu gibi, kubbe ve minare de birkaç parlak nokta ve aralarındaki çizgilerle tanınır hâle gelir.","ayirt_edici":["Kubbe, minare, kasnak ve kaidenin köşelerinde ince camgöbeği çizgilerle bağlanmış yıldızlar","Hilal uçlarında, kubbe tepesinde ve şerefe uçlarında dört kollu kırınım ışınlı parlak yıldızlar","Soluk altın, eğri gök koordinat ızgarası ve kesikli tutulum çizgisi","Derece çentikli, çift halkalı dairesel harita çerçevesi ve küçük derece işaretleri","Kubbeyi dolduran hafif yeşil bulutsu ve sağ üstten geçen Samanyolu tozu","Beş yapraklı küçük altın takımyıldızlar olarak çiçekler"],"palet":["#0B1C44","#081535","#040918","#B0E8F4","#D8B45A","#2E8A7A","#F4FBFF"],"kodla_cizim":"Canvas, 2048 iç çözünürlük. Eğik stereografik izdüşümle gerçek bir gök ızgarası (dik açıklık çemberleri, sağ açıklık meridyenleri, tutulum) çizilir; Samanyolu, her pikselin ters izdüşümle galaktik enlemi bulunup değer gürültüsüyle yoğunluk ve toz şeritleri verilerek üretilir, arka plan yıldızları bu yoğunluğa göre dağıtılır. Kubbe bulutsusu kubbedeMi maskesi içinde fbm gürültüsünden yapılıp bulanıklaştırılarak 'lighter' ile eklenir. Takımyıldızlar SAHNE geometrisinden (kubbeNoktalari, kaburgalar, kasnak ve kasnakPencereleri, kaide, minare parçaları, alemParcalari, bitki) çıkarılan köşe ve çizgi listeleridir; yıldızlar önem derecesine göre büyüklük, radyal degrade hâle ve büyüklerde dört kollu ışınla çizilir. Öndeki büyük çiçekler harita çemberine sığacak biçimde biraz içeri alınmış; çemberin dışına taşan sap, yaprak, tomurcuk ve çiçek noktaları kenara doğru üstel olarak sıkıştırılır (kenarda balıkgözü izdüşümü gibi), böylece hiçbir takımyıldız kesilmez. Izgara ve yıldızlar harita çemberine kırpılır, yalnız çembere yakın en parlak yıldızların ışınları çerçevenin üstünden geçer; çerçeve, derece çentikleri ve DejaVu Sans ile küçük derece etiketleri en üstte çizilir.","etiketler":["özgün","gök haritası","takımyıldız","gece","çizgi","astronomi","altın ve camgöbeği"],"klasor":"S-035-takimyildiz","gorsel":"stiller/S-035-takimyildiz/ornek.webp","kucuk":"stiller/S-035-takimyildiz/kucuk.webp"},{"kod":"S-036","no":36,"ad":"Gül Yaprağı","ad_en":"Rose Petal","aile":"Atölye Özgün","ozgun":true,"ozet":"Bütün resim, biçimin akışına göre pul gibi dizilmiş tek tek gül yapraklarından kurulur.","tanim":"Kural: her iz tek bir gül yaprağıdır; dibi dar, ucu geniş ve hafif çentikli bir damla biçimi; dibi koyu, içi yumuşak geçişli, ortasında silik bir damar, kenarında uca doğru güçlenen ince açık bir parıltı vardır, bazılarının bir kenarı geriye kıvrılmıştır. Yapraklar balık pulu gibi üst üste bindirilir: her yaprağın yuvarlak ucu görünür, dibi bir öncekinin altında kalır. Yönleri biçimin akışından gelir: kubbede kaburgalar boyunca yukarı, kasnak ve kaidede yatay, minarede sütun sütun dikey, gökte dalgalı akıntılar halinde. Renkler sahneden alınır ama parlaklık korunarak güle doğru kaydırılır (yeşil kubbe gül tenli bir yeşile, mavi gök leylak-pembeye döner); çiçekler halka halka dizilmiş yapraklardan güllere, yapraklar yeşil gül yapraklarına dönüşür. Yapraklar krem bir kâğıda serilmiştir; kâğıdın kenarı düzensiz kalır ve gökte birkaç serbest yaprak gölgesini düşürerek süzülür.","koken":"Fikir, Osmanlı'dan bu yana süren gül sevgisinden ve gül yaprağı reçeli, gül suyu, kurutulmuş yaprakla doldurulan keseler gibi gündelik gül kültüründen doğdu; Osmanlı geleneğinde gül Hz. Peygamber'i de simgelediği için Yeşil Kubbe'yi gül yapraklarıyla örmek konuya ayrıca yakışır. Bir sepet gül yaprağını kâğıda tek tek dizerek resim yapmak, mozaik ve pul (sedef, balık pulu, kiremit) düzenleriyle birleştirildi: tessera yerine yaprak, ızgara yerine biçimin akışı. Yaprakların yön alanı yapının geometrisinden çıkarıldığı için aynı kural her konuya uygulanabilir.","ayirt_edici":["Kubbe, kaburgalar boyunca yukarı bakan, tepeye doğru daralan yeşil gül yaprağı pullarından oluşur; dilim sınırları koyu yaprak sütunlarıyla seçilir","Gök, dalgalı akıntılar halinde iri ufak karışık, bir kısmının kenarı geriye kıvrık, yarı saydam leylak-pembe yapraklarla dolar; arada gül tenli akıntı şeritleri seçilir","Minare sütun sütun yukarı bakan yapraklarla, kasnak ve kaide yatay yaprak sıralarıyla örülür; pencereler ucu aşağı bakan koyu yapraklardır","Öndeki çiçekler halka halka yapraklardan kurulmuş güllere, yapraklar yeşil gül yapraklarına dönüşür","Güneş krem-altın yapraklı iri bir gül; gökte gölgesi uzağa düşen birkaç serbest yaprak süzülür","Kâğıt kenarında yapraklar düzensiz biter: yer yer kenara taşar, yer yer kâğıt koyları açılır, kenarda dağınık yapraklar kalır"],"palet":["#F6EDE2","#B2BADE","#F9E5DC","#348440","#164622","#E488A0","#B03A5C","#C2A350"],"kodla_cizim":"Canvas 2B, 2048 iç çözünürlük. Tek bir birim yaprak yolu (Path2D) ile üç gölgelendirme kalıbı hazırlanır (dipte koyu gül gölgesi, iç ışık, lif çizgileri, damar, uca doğru güçlenen kenar parıltısı; ikisinde sola ya da sağa kıvrık kenar şeridi ve altında bulanık gölge) ve bir bulanık gölge kalıbı; her yaprak setTransform ile konumlanıp düz renkle doldurulur, üstüne kalıp çizilir. Yön alanı geometriden hesaplanır: kubbe profilinin yay uzunluğuyla enlem sıraları ve boylam sütunları (sütun sayısı tepeye doğru azalır), yön meridyen türevinden, ışık küre normalinden; kasnak ve minare silindir izdüşümüyle daraltılır; gök sıraları üç sinüslü akış çizgileri üzerindedir, boy, en, açı ve saydamlık rastgele oynatılır. Kâğıt kenar payı düşük frekanslı gürültüyle 0–90 px arasında değişir. Renkler kendi gök işlevinden ve sahne tonlarından alınıp parlaklığı korunarak gül kromasına kaydırılır; bölge haritası göğü yapıdan ayırır. Pul görünümü için her grup uç yönünden dibe doğru sıralanarak çizilir. Yaklaşık 5 bin yaprak, sonda yumuşak ışık kipinde ince kâğıt dokusu.","etiketler":["özgün","gül","yaprak","pul düzeni","akış alanı","kolaj","pastel"],"klasor":"S-036-gul-yapragi","gorsel":"stiller/S-036-gul-yapragi/ornek.webp","kucuk":"stiller/S-036-gul-yapragi/kucuk.webp"},{"kod":"S-037","no":37,"ad":"Delikli Fener","ad_en":"Pierced Lantern","aile":"Atölye Özgün","ozgun":true,"ozet":"Sahne, arkadan aydınlatılmış dövme pirinç bir levhadaki süslü deliklerin büyüklüğüyle yazılır.","tanim":"Kural: resim, arkasında sıcak bir ışık yanan delikli bir metal levhadır ve sahne yalnızca deliklerle anlatılır. Delikler sekiz köşeli yıldız, damla, hilal ve daire gibi süs biçimleridir; düzenli ya da ışınsal bir ızgaraya dizilir ve her deliğin büyüklüğü sahnenin o noktadaki aydınlığıyla büyür (karanlık yerde delik yoktur, aydınlık yerde delikler birbirine değer). Bölgeler arasında deliksiz düz metal şeritler bırakılır, böylece biçimlerin sınırı ve pencereler karanlık çizgi ve kemer olarak okunur; ızgaranın yönü biçimi izler (kubbede kaburga boyunca, gökte güneşin çevresinde halka halka, kasnakta silindir sıraları). Yapraklar ortasında damar gibi metal köprü kalan yarıklar, saplar zımba noktası dizileridir. Kubbenin ardında yeşil, yaprakların ardında sarımsı yeşil cam, başka her yerde altın sarısı ışık vardır; levha dövme izli, patinalı, hafif parlak koyu pirinçtir ve iri delikli bir süs bordürüyle çevrilir.","koken":"İlham, Osmanlı cami ve saray fenerleri, kandil kafesleri ile Mağrip'in delikli pirinç lambalarından geldi: bu fenerlerde desen, karanlık odaya düşen ışık noktalarıyla görünür. Fikrin özü, matbaadaki yarım ton (raster) noktasını fener zanaatinin süs delikleriyle değiştirmek: aydınlık değeri nokta büyüklüğüne değil, kesilmiş bir yıldızın ya da hilalin büyüklüğüne çevrilir. Böylece her konu, bir fener paneli gibi ışıkla okunan bir delik dokusuna dönüşür.","ayirt_edici":["Koyu, dövme izli, yer yer yeşilimsi patinalı pirinç levha; deliklerden sızan sıcak ışık ve çevresine yayılan parlama","Gök, güneşin çevresinde halka halka dizilmiş yıldız, daire ve güneşe bakan hilal deliklerinden oluşur; delikler güneşe yaklaştıkça büyür","Kubbe, kaburgalar boyunca yukarı bakan damla deliklerden oluşur ve ardındaki yeşil camla yeşil yanar; kasnağın sık delik ızgarasında pencereler deliksiz koyu kemerler olarak seçilir","Kaide ve minare iri, sık deliklerle parlar; kaide pencereleri karanlık kemerler, korkuluklar dikey yarıklardır; alemler doğrudan levhaya kesilmiş biçimlerdir","Yapraklar ortasında metal damar köprüsü kalan, sarımsı yeşil camlı yarıklar; saplar küçük zımba deliklerinden noktalı çizgiler","Çiçekler düz metal halkayla çevrili beş damlalı madalyonlar; çevrede iri yıldız ve damla delikli bordür ve perçinler"],"palet":["#1A1108","#5A3E1C","#A87A36","#FFECAC","#AAFFAA","#1A964A","#D6F08C","#FFFCE8"],"kodla_cizim":"Canvas 2B, 2048 iç çözünürlük. Levha piksel piksel üretilir: titreşimli bir ızgaradaki dövme çukurları paraboloid kâselerin en küçüğü olarak bir yükseklik alanı verir; çerçeve pervazı ve olukları bu alana eklenir; normallerden yaygın ve Blinn parlaklık ışığı, gürültüyle patina ve kir hesaplanır. Sahnenin aydınlığı bölge haritası ve kendi ışık modelimden (küre normali, silindir, güneş uzaklığı, bulutlar) okunur; delik çapı alan aydınlıkla orantılı olacak biçimde karekökle hesaplanır; her delik 10 noktalı bir ayak izi sınamasıyla bölge sınırından uzak tutulur (düz metal şeritler). Gökte güneş merkezli ışınsal ızgara, kubbede yay uzunluğuna göre enlem sıraları ve meridyen yönlü damlalar, kasnak ve minarede silindir izdüşümü kullanılır (kasnakta ince adım; izdüşüm yalnız aralığı daraltır, delikler yuvarlak kalır); hilal SAHNE.hilalYolu'ndan döndürülerek kesilir; yaprak yarığının ortasındaki damar köprüsü maskeden destination-out ile silinir, saplar 6,4 px aralıklı küçük deliklerdir; sahne delikleri çerçevenin iç kenarında kırpılır. Yaklaşık 4.300 delik bir maske tuvaline çizilir; arka ışık (sıcak altın, kubbe ardında gürültülü yeşil, yaprak ardında sarımsı yeşil cam) maskeyle ve levha kalınlığını taklit eden kaydırılmış maskeyle kesilir, koyu delik duvarı, dört farklı bulanıklıkla eklemeli parlama, kesik ağzında ince parıltı, perçinler ve kenar karartması eklenir.","etiketler":["özgün","fener","pirinç","delik işi","arkadan ışık","yarım ton","Osmanlı zanaati","gece"],"klasor":"S-037-delikli-fener","gorsel":"stiller/S-037-delikli-fener/ornek.webp","kucuk":"stiller/S-037-delikli-fener/kucuk.webp"},{"kod":"S-038","no":38,"ad":"Tesbih Dizisi","ad_en":"Bead Strings","aile":"Atölye Özgün","ozgun":true,"ozet":"Resim, biçimin yönünü izleyen ince iplere dizilmiş, gölgeli küçük kürelerden (tesbih tanelerinden) oluşur.","tanim":"Kural: her iz, görünür bir ipe dizilmiş bir tanedir ve ipler biçimi izler: kubbede meridyenler (kaburgalar) boyunca, kasnak ve kaidede yatay sıralar, minarede gövdeyi saran halkalar, gökte hafif dalgalı yataylar, çiçeklerde merkezin çevresinde dönen sarmallar, yapraklarda uca doğru birleşen damar ipleri. Her tane, ışığı sağ üstten alan küçük bir küredir: sağ üstte parlak nokta, sol altta gölge ve zemine düşen minik temas gölgesi; rengi sahnenin o noktasından alınır, boyu ip boyunca değişebilir. İpin bittiği her yerde (yapının kenarı, kubbede seyrelen meridyenler, yaprak ucu, çiçek sarmalının sonu) uzun bir imame tanesi durur; kapalı halkalarda (minare, güneş) imame yoktur. Zemin açık keten bezidir ve taneler arasında görünür.","koken":"Fikir, tesbihin kendisinden doğdu: elde çekilen, ipe dizili tanelerin ritmi ve dizinin sonunu bildiren imame. Boncuk işi, oya ve çeyiz işlemelerindeki tane dizme geleneğiyle birleşince, bir resmi noktalarla değil iplere dizili tanelerle örme kuralı ortaya çıktı. Noktacılıktan farkı, tanelerin hacimli olması ve hepsinin biçimin akışına yerleştirilmiş görünür iplere bağlı durmasıdır; ipin yönü resmin çizgisini, tanenin rengi tonunu taşır.","ayirt_edici":["Kubbe, tepeye doğru seyrelen yeşil meridyen ipleriyle örülü; biten iplerin ucunda imame taneleri, kubbe eteğinde imame saçağı","Gök, ucunda imame bulunan hafif dalgalı yatay mavi tane dizileri; ufka doğru açılır ama mavi kalır, ipler yapıya değdiği yerde imameyle biter","Minare, göz hizasının üstünde hafifçe kıvrılan halka halka taş rengi taneler; korkuluklar dik duran uzun taneler, zikzak bandı zikzağı izleyen iplerdir","Güneş iç içe tesbih halkalarından; alemler dikey ipe dizili altın küreler, hilal kalın yerinde iki üç ipe dizilmiş minik altın tanelerden dolgun bir hilaldir; alemlerin çevresi boş keten kalır","Çiçekler beş loblu sarmal ipler (altın göbek, pembe iç, beyaz dış; küçüklerde daha iri tane ve belirgin lob), yapraklar uca doğru birleşen yeşil ipler, tomurcuklar sap ucundaki pembe imameler","Her tane parlak noktalı, gölgeli ve temas gölgeli küçük bir küre; aralarından ince ip ve keten dokusu görünür"],"palet":["#ECE4D4","#6098D8","#BEDAEA","#2E803C","#164822","#EEE6D3","#ECC454","#ECB0C0"],"kodla_cizim":"Canvas 2B, 2048 iç çözünürlük. Keten zemin piksel piksel dama örgüsü, gürültülü iplik boğumları ve geniş lekelerle üretilir. Bir kez çizilen küre gölgelendirme kalıbı (parlak nokta, sol alt gölge, yansıyan ışık) ve yumuşak temas gölgesi kalıbı her taneye uygulanır; tane önce sahnenin renginde doldurulur, sonra kalıp çizilir. İpler geometriden kurulur: kubbe profili Bezier'inden meridyenler (ipin seviyesi ikinin kuvvetleriyle seçilir, komşu ipe 3B uzaklık tane boyunun altına düşünce ip biter), silindir izdüşümüyle kasnak sıraları ve göz hizasına göre eğilen minare halkaları, bölge haritasıyla göğün yapıdan ayrılan parçaları, Arşimet sarmalının beş loblu zarfla biçimlendirilmesiyle çiçekler; hilal, gövde kalınlığına göre bir, iki ya da üç eş merkezli ipe dizilen minik tanelerle doldurulur ve çevresindeki gök taneleri silinir. Taneler her ip boyunca yay uzunluğuna göre aralıklanır; her grupta önce bütün gölgeler, sonra ipler, sonra taneler çizilir; uçlarda dipte boğumlu, uca doğru incelen imameler eklenir. Yaklaşık 15.400 tane.","etiketler":["özgün","tesbih","boncuk","ip","akış alanı","hacimli","keten","el işi"],"klasor":"S-038-tesbih-dizisi","gorsel":"stiller/S-038-tesbih-dizisi/ornek.webp","kucuk":"stiller/S-038-tesbih-dizisi/kucuk.webp"},{"kod":"S-039","no":39,"ad":"Havuz Aksi","ad_en":"Pool Reflection","aile":"Atölye Özgün","ozgun":true,"ozet":"Yapının kendisi görünmez; sahne yalnızca avludaki havuzun suyunda, kenardan eğik bakılınca görünen ters ve dalgayla kırılmış aksiyle anlatılır.","tanim":"Kural: konu hiçbir zaman doğrudan çizilmez; yalnızca havuz kenarından eğik bakılan suyun yüzündeki aksi gösterilir. Aks yalnız dikeyde ters döner (kubbe sağda, minare solda kalır) ve yumuşak, boyalı bir görüntüdür; dalga yüzünün eğimi onu dikeyde kaydırıp sıvazlar, böylece kenarlar yatay şeritlere kırılır. Perspektif korunur: dalgalar uzak kıyıda incelir, yüzen şeylerin çevresindeki dalgacık halkaları elips olur. Uzakta su ayna gibidir; yakına geldikçe aks zayıflar, su koyulaşır ve havuzun çini dibi ile ışık ağı silikçe seçilir; güneşin aksi dalga eğimine göre dağılan pırıltılara bölünür. Su yüzünde eğik bakışla kısalmış gül yaprakları ve nilüfer yaprakları yüzer; resmi üstte ve altta ince kakma bantlı, dilimli ağızlı oyma mermer havuz kenarı çerçeveler.","koken":"İlham, Osmanlı ve Endülüs avlularının durgun havuzları ile şadırvanlardır: Elhamra'nın Mersin Avlusu'ndaki havuzda yapının aksi, Türk bahçelerindeki havuzlarda gökle kubbe aynı yüzeyde buluşur. Fikrin özü, bakışı yapıdan suya çevirmek: konu suyun aynasında, yaprakların ve dalgacıkların arasından, bir anlığına titreyen bir görüntü olarak okunur. Kural her konuya uygulanabilir: neyi çizerseniz çizin, yalnızca onun sudaki aksi ve suyun yüzü görünür.","ayirt_edici":["Kubbe, kasnak, kaide ve minare yalnızca ters dönmüş, yumuşak bir aks olarak görünür; kubbe sağda, minare solda kalır, uzak kıyıdaki çiçekli dallar aksın üstünden sarkar","Dalga eğimi aksi dikeyde kaydırıp sıvazlar: kubbe, kasnak ve minare kenarları ince yatay şeritlere kırılır; dalgalar uzakta incelir","Yakında aks zayıflar, su koyu deniz mavisine döner; havuzun çini dibi ve ışık ağı suyun içinden silikçe görünür","Yüzen gül ve beyaz yapraklar ile çentikli nilüfer yaprakları eğik bakışla kısalmış; çevrelerinde elips biçimli halka halka dalgacıklar","Güneşin aksi, dalga eğimine göre dağılan pırıltılara bölünür ve çevresine ışık taşar","Üstte ve altta damarlı, oyma basamaklı, dilimli ağızlı mermer havuz kenarı; içinde yeşil sekiz köşeli yıldız ve gül renkli baklavalardan ince kakma bant"],"palet":["#497D93","#90ADB0","#265840","#337276","#F1EEE7","#2F6B52","#B4566A","#D65C76"],"kodla_cizim":"Canvas 2B, 2048 iç çözünürlük. Yansıyacak sahne ekran dışında kendi çizimimizle boyanır: doygun gök, parlak güneş çekirdeği ve ışıltısı, gölgeli bulut öbekleri; minare, kasnak ve kaide SAHNE yollarından silindir gölgeli yatay geçişlerle, kubbe sağ üstten ışık alan ışınsal geçiş, yumuşak kaburgalar ve parlak alınla, bitkiler kendi renkleriyle doldurulur; sonra 4,6 px bulanıklık ve yumuşak ışık kipinde yatay fırça dokusuyla boyalı bir yumuşaklık verilir. Su piksel piksel hesaplanır: perspektif ölçeği p(Y) (uzak 0,5, yakın 1) ve 0,6 dikey kısalmayla yer düzlemi koordinatları (U, V = ln p / (p' · 0,6)) bulunur; bu düzlemde yedi yönlü sinüs dalgası (kaba ızgaradan okunan sakin/dalgalı yamalar ve evre bükümüyle) ve yüzen her şeyin çevresinde ışınsal halka dalgaları toplanıp eğim çözümsel olarak hesaplanır. Ters koordinat (Y = 960 − y) eğimle dikeyde çok, yatayda az kaydırılır ve yedi dikey örnekle sıvazlanarak çift doğrusal okunur; dalga yüzü eğime göre açılıp koyulaşır, renk deniz yeşiline çekilir. Fresnel benzeri bir oranla yakında aks zayıflayıp kırılmayla titreyen çini ızgaralı havuz dibine karışır. Güneş pırıltısı, eğimin güneşi o noktaya yansıttığı yerlerde Gauss eşleşmesiyle doğar; parlak maske üç bulanıklıkla eklemeli olarak taşar. Üstüne havuz dibindeki ışık ağı (gürültü farkı), yüzeye yatırılmış (döndür, sonra dikeyde kısalt) gölgeli gül yaprakları ve damarlı nilüfer yaprakları çizilir. Mermer piksel piksel damar gürültüsüyle üretilir; profil, pervaz çizgileri, oluk, yuvarlatılmış ağız, dilimli kenar ve yıldız-baklava kakma bandı vektörle eklenir.","etiketler":["özgün","yansıma","su","havuz","mermer","kakma","perspektif","dalga"],"klasor":"S-039-havuz-aksi","gorsel":"stiller/S-039-havuz-aksi/ornek.webp","kucuk":"stiller/S-039-havuz-aksi/kucuk.webp"},{"kod":"S-040","no":40,"ad":"Ters Zemin","ad_en":"Negative Ground","aile":"Atölye Özgün","ozgun":true,"ozet":"Mimari hiç çizilmez; yapı, onu çevreleyen yoğun süs bahçesinden oyulmuş boş fildişi siluetler olarak okunur.","tanim":"Kural: asıl konu hiçbir zaman figür olarak çizilmez, yalnızca boşluk olarak kalır. Kubbe, kasnak, kaide, minare ve alemler boş fildişi kâğıt siluetlerdir; geri kalan her yeri lacivert zemin üzerinde klasik Osmanlı tezhip dağarcığıyla kurulmuş yoğun ama ölçülü bir süs bahçesi doldurur: ince altın helezon dallar, ortalarında önden dilimli hatayiler ve yandan görülen palmet hatayiler, dallar boyunca çatallı rumiler, uzun dişli saz yaprakları, lale, karanfil, gonca ve penç; gökte çin bulutu şeritleri. Renkler koyu yeşil, gül, altın, lacivert ve firuzedir; her motifin koyu ince bir kontur (tahrir) çizgisi ve içinde açık bir ışık çizgisi vardır. Süsler boşluğa değmez, aralarında ince bir zemin şeridi kalır, böylece siluetin kenarı keskin okunur. Boşlukların içinde yalnızca çok ince soluk altın kıl çizgiler bulunur (kaburgalar, pencere kemerleri, şerefe ve korkuluk çizgileri); öndeki çiçekler süs alanına karışır.","koken":"İlham, tezhip ve kalem işinin zemin anlayışından, ciltlerdeki şemse oymalarından, ebru ve kâğıt oymacılığındaki (katı) boşluk okumasından ve Rubin vazosu gibi figür-zemin oyunlarından geldi. Fikrin özü, kutsal yapıyı süslemeden çok onun çevresini süslemek: kubbe ve minare bahçenin içinde bırakılmış sessiz, aydınlık bir boşluk olarak kalır. Kural her konuya uygulanabilir: konu yalnızca, onu dolduran süsün yokluğuyla görünür.","ayirt_edici":["Kubbe, kasnak, kaide, minare ve hilalli alemler yalnızca boş fildişi siluet olarak görünür; siluetin çevresinde ince bir lacivert zemin şeridi","Lacivert zemini dolduran ince altın helezon dallar; ortalarında önden dilimli hatayiler ya da yandan görülen, tohum benekli altın tepelikli palmet hatayiler","Dallar boyunca altın ve firuze çatallı rumiler, sarmal uçlarında rumi kanatları, uzun dişli yeşil saz yaprakları, kısa saplı lale, karanfil ve goncalar","Gökte ince altın ve firuze çin bulutu şeritleri; güneş altın ışınlı çok katlı bir hatayi-şemse","Öndeki çiçekler büyük dilimli hatayiler, palmet hatayiler, laleler ve karanfiller; kaidenin altında küçük rumi ve goncalarla süslü yatay bir kıvrık dal","Boşlukların içinde yalnızca soluk altın kıl çizgiler: kaburgalar, pencere kemerleri, şerefe, korkuluk ve zikzak çizgileri"],"palet":["#1A2B57","#F3EAD6","#C99A3C","#C24C66","#EBA2AE","#1F6248","#3AA7A3","#4E70BC"],"kodla_cizim":"Canvas 2B, 2048 iç çözünürlük. Bütün yapı parçalarının SAHNE.yollar() yollarından bir boşluk maskesi çizilir ve iki geçişli pah (chamfer) algoritmasıyla her pikselin boşluğa uzaklığı hesaplanır. Süsler ayrı bir tuvalde üretilir: sabit çapalar (güneş şemsesi, SAHNE.bitki çiçekleri ve sapları), gökte çin bulutu şeritleri (iki ucu sarmal kıvrımlı, ortası halkalı dalgalı merkez çizgisi), kaidenin altında yatay kıvrık dal, boşluktan uzak noktalara Poisson diskiyle yerleştirilen sarmal dallar (ortalarında önden ya da yandan hatayi, dış uçlarında rumi kanadı, engelde kesilen helezon), dallar boyunca dönüşümlü saz, rumi, küçük yaprak, kısa saplı lale/karanfil/gonca ve sarmal filizler, en sonda seyrek dolgu. Motifler yerel koordinatta Path2D ile çizilir: hatayi yaprakları uca yakın iki çentikli, sivri uçlu 'dilimli' bir profilden, palmet hatayi çanak, yedi ve dört yapraklı iki yelpaze ve benekli tepelikten, saz yaprağı uca yatık dişlerden kurulur; her biri koyu kontur ve içte küçültülmüş açık tahrir çizgisi alır. Çakışmalar 4 piksellik bir doluluk ızgarası ve uzaklık alanıyla önlenir. Süs katmanından boşluklar kalın bir kontur ile silinir (zemin şeridi), çok hafif gölgeyle guaj dokulu lacivert zeminin üstüne konur; boşluklar dokulu fildişi kâğıtla doldurulur ve içine 0,6 piksellik soluk altın kıl çizgiler çekilir.","etiketler":["özgün","negatif alan","figür-zemin","tezhip","hatayi","rumi","saz üslubu","Osmanlı süslemesi","lacivert"],"klasor":"S-040-ters-zemin","gorsel":"stiller/S-040-ters-zemin/ornek.webp","kucuk":"stiller/S-040-ters-zemin/kucuk.webp"}]};

  const $ = (s, el = document) => el.querySelector(s);
  const kacis = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const izgara = $('#izgara');
  const kutu = $('#ayrinti');

  if (!KATALOG) {
    izgara.innerHTML = '<p class="bos">Katalog verisi yok. <code>node atolye/araclar/katalog.mjs</code> ile galeri.html üretin.</p>';
  } else {
    const stiller = KATALOG.stiller;
    const durum = { aile: 'Hepsi', arama: '' };

    const ozgunSayisi = stiller.filter((s) => s.ozgun).length;
    $('#olcu').innerHTML = [
      `<li><b>${stiller.length}</b> stil</li>`,
      `<li><b>${KATALOG.aileler.length}</b> aile</li>`,
      `<li><b>${ozgunSayisi}</b> atölye özgün ✦</li>`,
      `<li>örnekler <b>1024 × 1024</b> px</li>`,
      `<li>kodlar <b>${stiller[0].kod}</b>–<b>${stiller[stiller.length - 1].kod}</b></li>`,
    ].join('');

    const sekmeler = [['Hepsi', stiller.length], ...KATALOG.aileler.map((a) => [a, stiller.filter((s) => s.aile === a).length])];
    $('#suzgec').innerHTML =
      sekmeler.map(([ad, n]) => `<button class="sekme" type="button" data-aile="${kacis(ad)}" aria-pressed="${ad === 'Hepsi'}">${kacis(ad)} <span class="say">${n}</span></button>`).join('') +
      `<label class="ara"><span hidden>Stil ara</span><input id="ara" type="search" placeholder="Stil ara: suluboya, çini, neon…" autocomplete="off"></label>`;

    $('#suzgec').addEventListener('click', (e) => {
      const b = e.target.closest('.sekme');
      if (!b) return;
      durum.aile = b.dataset.aile;
      document.querySelectorAll('.sekme').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      ciz();
    });
    $('#ara').addEventListener('input', (e) => {
      durum.arama = e.target.value.trim().toLocaleLowerCase('tr');
      ciz();
    });

    const eslesir = (s) => {
      if (durum.aile !== 'Hepsi' && s.aile !== durum.aile) return false;
      if (!durum.arama) return true;
      const metin = [s.kod, s.ad, s.ad_en, s.aile, s.ozet, ...(s.etiketler || [])].join(' ').toLocaleLowerCase('tr');
      return metin.includes(durum.arama);
    };

    const kart = (s) => `
      <a class="numune${s.ozgun ? ' ozgun' : ''}" href="#${s.kod.toLowerCase()}" data-kod="${s.kod}">
        <div class="kare"><img src="${s.kucuk}" alt="${kacis(s.ad)} stilinde Yeşil Kubbe" loading="lazy" width="480" height="480"></div>
        <div class="satir"><span class="kod">${s.kod}${s.ozgun ? ' ✦' : ''}</span><span class="aile-adi">${kacis(s.aile)}</span></div>
        <h3>${kacis(s.ad)}</h3>
        <div class="en">${kacis(s.ad_en)}</div>
        <p>${kacis(s.ozet)}</p>
      </a>`;

    function ciz() {
      const liste = stiller.filter(eslesir);
      if (!liste.length) {
        izgara.innerHTML = '<p class="bos">Bu aramaya uyan stil yok.</p>';
        return;
      }
      if (durum.aile === 'Hepsi' && !durum.arama) {
        izgara.innerHTML = KATALOG.aileler
          .map((a) => {
            const grup = liste.filter((s) => s.aile === a);
            return `<h2 class="aile-baslik"><span>${kacis(a)}</span><span class="say">${grup[0].kod}–${grup[grup.length - 1].kod}</span></h2>` + grup.map(kart).join('');
          })
          .join('');
      } else {
        izgara.innerHTML = liste.map(kart).join('');
      }
    }

    function ac(kod) {
      const i = stiller.findIndex((s) => s.kod.toLowerCase() === kod);
      if (i < 0) return;
      const s = stiller[i];
      const onceki = stiller[(i - 1 + stiller.length) % stiller.length];
      const sonraki = stiller[(i + 1) % stiller.length];
      kutu.innerHTML = `
        <div class="ayrinti">
          <div class="gorsel"><img src="${s.gorsel}" alt="${kacis(s.ad)} stilinde Yeşil Kubbe, minare ve çiçekler" width="1024" height="1024"></div>
          <div class="bilgi">
            <div class="ust">
              <span class="kod">${s.kod} · ${kacis(s.aile)}</span>
              ${s.ozgun ? '<span class="rozet">✦ atölye özgün</span>' : ''}
            </div>
            <h2 id="ayrinti-ad" tabindex="-1" autofocus>${kacis(s.ad)}</h2>
            <div class="en">${kacis(s.ad_en)}</div>
            <p>${kacis(s.tanim)}</p>
            <div><h4>Ayırt edici özellikler</h4><ul>${s.ayirt_edici.map((a) => `<li>${kacis(a)}</li>`).join('')}</ul></div>
            <div><h4>${s.ozgun ? 'Fikir ve ilham' : 'Köken'}</h4><p>${kacis(s.koken)}</p></div>
            <div><h4>Palet</h4><div class="palet">${s.palet.map((r) => `<button class="renk" type="button" data-renk="${r}" title="${r} kopyala"><span style="background:${r}"></span><span>${r}</span></button>`).join('')}</div><div class="bildirim" id="bildirim"></div></div>
            <div><h4>Kodla nasıl çizildi</h4><p>${kacis(s.kodla_cizim)}</p></div>
            <div class="etiketler">${(s.etiketler || []).map((e) => `<span>${kacis(e)}</span>`).join('')}</div>
            <div class="kaynak">kaynak: atolye/stiller/${kacis(s.klasor)}/ornek.html</div>
            <div class="gezinti">
              <a class="dugme" href="#${onceki.kod.toLowerCase()}" aria-label="Önceki stil: ${kacis(onceki.ad)}">← ${onceki.kod}</a>
              <a class="dugme" href="#${sonraki.kod.toLowerCase()}" aria-label="Sonraki stil: ${kacis(sonraki.ad)}">${sonraki.kod} →</a>
              <button class="dugme kapat" type="button" data-kapat>Kapat</button>
            </div>
          </div>
        </div>`;
      if (!kutu.open) kutu.showModal();
      kutu.scrollTop = 0;
    }

    function kapat() {
      if (kutu.open) kutu.close();
    }
    kutu.addEventListener('close', () => {
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    });
    kutu.addEventListener('click', (e) => {
      if (e.target === kutu || e.target.closest('[data-kapat]')) kapat();
      const r = e.target.closest('.renk');
      if (r) {
        const yaz = (t) => { const b = $('#bildirim'); if (b) b.textContent = t; };
        try {
          navigator.clipboard.writeText(r.dataset.renk).then(() => yaz(`${r.dataset.renk} kopyalandı`), () => yaz(r.dataset.renk));
        } catch { yaz(r.dataset.renk); }
      }
    });
    document.addEventListener('keydown', (e) => {
      if (!kutu.open) return;
      const kod = location.hash.slice(1);
      const i = stiller.findIndex((s) => s.kod.toLowerCase() === kod);
      if (i < 0) return;
      if (e.key === 'ArrowRight') location.hash = stiller[(i + 1) % stiller.length].kod.toLowerCase();
      if (e.key === 'ArrowLeft') location.hash = stiller[(i - 1 + stiller.length) % stiller.length].kod.toLowerCase();
    });

    function yonlendir() {
      const kod = location.hash.slice(1).toLowerCase();
      if (/^s-\d{3}$/.test(kod)) ac(kod);
      else kapat();
    }
    window.addEventListener('hashchange', yonlendir);
    ciz();
    yonlendir();
  }
</script>

</body>
</html>
