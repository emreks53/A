name: lugat_risale
description: "Lügat-ı Risale-i Nur — Risale-i Nur okurken karşılaşılan Osmanlıca kelimelerin manasına hızlıca bakın."
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lugat.jsonl
    - assets/lugat_ek.jsonl
    - assets/images/logo_isaret.png
    - assets/fonts/OFL.txt
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
